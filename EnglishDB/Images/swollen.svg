<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swollen</text>
  <text x="50" y="120" class="subtitle">[ˈswoʊlən] adj. 肿胀的，膨胀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swel (膨胀) + -en (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球被吹得"膨胀(swel)"得太大，
    <tspan x="50" dy="25">以至于快要爆炸了，这就是"肿胀的(swollen)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His ankle was swollen after the accident.
  </text>
  <text x="50" y="310" class="content">
    事故后他的脚踝肿了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" stroke-width="5" stroke="#E74C3C" fill="#F1C40F" />
    <!-- Inflated balloon -->
    <circle cx="100" cy="100" r="80" class="image" stroke-width="5" stroke="#E74C3C" fill="#F1C40F" opacity="0.5" />
    <!-- String -->
    <line x1="100" y1="180" x2="100" y2="250" class="image" stroke="#2C3E50" stroke-width="3" />
  </g>
</svg>