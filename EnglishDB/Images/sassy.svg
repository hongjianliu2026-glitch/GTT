<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sassy</text>
  <text x="50" y="120" class="subtitle">[ˈsæsi] adj. 无礼的，时髦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sass (无礼) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着时髦的女孩，"无礼地(sass)"
    <tspan x="50" dy="25">对别人说：'你不懂时尚！'，这就是sassy。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a sassy attitude and always speaks her mind.
  </text>
  <text x="50" y="310" class="content">
    她态度无礼，总是直言不讳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fashionable girl -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Fashionable clothes -->
    <rect x="30" y="130" width="40" height="20" class="image" /> <!-- Top -->
    <rect x="40" y="150" width="20" height="30" class="image" /> <!-- Skirt -->
    <!-- Sassy expression -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" /> <!-- Mouth -->
    <circle cx="45" cy="80" r="3" class="image" /> <!-- Left eye -->
    <circle cx="55" cy="80" r="3" class="image" /> <!-- Right eye -->
  </g>
</svg>