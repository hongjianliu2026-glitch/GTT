<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">miscarriage</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsˈkærɪdʒ] n. 流产，失败</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + carriage (运送)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孕妇在运送(carriage)过程中，
    <tspan x="50" dy="25">由于错误(mis-)导致流产(miscarriage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor said the miscarriage was due to stress.
  </text>
  <text x="50" y="310" class="content">
    医生说流产是由于压力造成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pregnant woman -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Broken heart -->
    <path d="M150,100 C140,80 160,80 150,100 C160,120 140,120 150,100 Z" class="image" />
    <line x1="150" y1="100" x2="150" y2="120" class="image" />
  </g>
</svg>