<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lair</text>
  <text x="50" y="120" class="subtitle">[ler] n. 巢穴，藏身处</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lair (来自古法语 "lier"，意为"躺下")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的龙，"躺下(lair)"
    <tspan x="50" dy="25">在一个阴暗的山洞里，这个山洞就是它的巢穴(lair)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thief's lair was hidden deep in the forest.
  </text>
  <text x="50" y="310" class="content">
    小偷的藏身处隐藏在森林深处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cave entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Dragon -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="170" y2="140" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <!-- Fire -->
    <line x1="200" y1="130" x2="180" y2="110" class="image" />
    <line x1="200" y1="130" x2="220" y2="110" class="image" />
    <line x1="200" y1="130" x2="190" y2="120" class="image" />
    <line x1="200" y1="130" x2="210" y2="120" class="image" />
  </g>
</svg>