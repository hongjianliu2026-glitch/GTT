<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ignite</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈnaɪt] v. 点燃，引发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ign (火) + -ite (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个火柴划过火柴盒，"火(ign)"
    <tspan x="50" dy="25">瞬间点燃(ignite)，火焰熊熊燃烧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spark ignited the dry grass.
  </text>
  <text x="50" y="310" class="content">
    火花点燃了干草。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Matchstick -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="100" y2="20" class="image" />
    <!-- Flame -->
    <polygon points="100,0 90,-10 110,-10" class="flame" />
    <polygon points="100,0 85,-20 115,-20" class="flame" />
    <polygon points="100,0 80,-30 120,-30" class="flame" />
  </g>
</svg>