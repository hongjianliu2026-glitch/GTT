<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #4A90E2; }
      .subtitle { font: italic 24px serif; fill: #333333; }
      .content { font: 18px sans-serif; fill: #555555; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sparkle { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sparkling</text>
  <text x="50" y="120" class="subtitle">[ˈspɑːrk.lɪŋ] adj. 闪闪发光的，闪耀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spark (火花) + -ling (表示小或相关)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚的派对，"小火花(spark-ling)"
    <tspan x="50" dy="25">在空中飞舞，照亮了整个房间，就像闪闪发光的星星。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The champagne was sparkling and refreshing.
  </text>
  <text x="50" y="310" class="content">
    香槟闪闪发光，令人神清气爽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Party scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sparkles -->
    <circle cx="50" cy="50" r="10" class="sparkle" />
    <circle cx="100" cy="70" r="10" class="sparkle" />
    <circle cx="150" cy="50" r="10" class="sparkle" />
    <circle cx="200" cy="70" r="10" class="sparkle" />
    <circle cx="250" cy="50" r="10" class="sparkle" />
    <circle cx="300" cy="70" r="10" class="sparkle" />
    <!-- Party lights -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <!-- Party goers -->
    <circle cx="70" cy="150" r="15" class="image" />
    <circle cx="120" cy="150" r="15" class="image" />
    <circle cx="170" cy="150" r="15" class="image" />
    <circle cx="220" cy="150" r="15" class="image" />
    <circle cx="270" cy="150" r="15" class="image" />
  </g>
</svg>