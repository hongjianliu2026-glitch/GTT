<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drooping</text>
  <text x="50" y="120" class="subtitle">[ˈdruːpɪŋ] adj. 下垂的，萎靡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drop (滴落) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵花因为缺水而"滴落(drop)"，
    <tspan x="50" dy="25">它的花瓣下垂，显得萎靡不振(drooping)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The drooping flowers needed water urgently.
  </text>
  <text x="50" y="310" class="content">
    这些下垂的花朵急需水分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flower stem -->
    <line x1="175" y1="20" x2="175" y2="150" class="image" />
    <!-- Drooping petals -->
    <ellipse cx="175" cy="100" rx="50" ry="20" class="image" />
    <ellipse cx="150" cy="120" rx="30" ry="15" class="image" />
    <ellipse cx="200" cy="120" rx="30" ry="15" class="image" />
    <!-- Drooping leaves -->
    <line x1="150" y1="80" x2="120" y2="100" class="image" />
    <line x1="200" y1="80" x2="230" y2="100" class="image" />
  </g>
</svg>