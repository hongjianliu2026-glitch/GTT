<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ache</text>
  <text x="50" y="120" class="subtitle">[eɪk] v. 疼痛；n. 疼痛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (强调) + che (拉丁语中的“疼痛”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为强烈的疼痛而"强调(a-)"地"呻吟(che)"，
    <tspan x="50" dy="25">这种强烈的感受就是"疼痛(ache)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My head is aching badly.
  </text>
  <text x="50" y="310" class="content">
    我的头很痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head with pain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Pain expression -->
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="70" y1="80" x2="60" y2="70" class="image" />
    <line x1="130" y1="80" x2="140" y2="70" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="80" y1="120" x2="70" y2="110" class="image" />
    <line x1="120" y1="120" x2="130" y2="110" class="image" />
    <!-- Pain symbol -->
    <text x="100" y="160" class="image" text-anchor="middle" font-size="30" fill="#C0392B">!</text>
  </g>
</svg>