<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rejoin</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈdʒɔɪn] v. 重新加入，再结合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + join (加入)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人原本分开，然后"再次加入(re-join)"
    <tspan x="50" dy="25">彼此，重新走到一起，形成一个整体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the argument, they decided to rejoin forces.
  </text>
  <text x="50" y="310" class="content">
    争论过后，他们决定重新合作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Arms -->
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="250" y1="120" x2="150" y2="120" class="image" />
    <!-- Joining line -->
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="180" class="image" />
    <line x1="150" y1="150" x2="200" y2="180" class="image" />
    <!-- Heart -->
    <path d="M100,180 Q150,160 200,180" class="image" />
  </g>
</svg>