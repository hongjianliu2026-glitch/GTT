<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">six-day</text>
  <text x="50" y="120" class="subtitle">[ˈsɪks deɪ] adj. 六天的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> six (六) + day (天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个日历上，"六天(six-day)"
    <tspan x="50" dy="25">被高亮显示，表示一个为期六天的活动或事件。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The marathon is a six-day event.
  </text>
  <text x="50" y="310" class="content">
    马拉松是一个为期六天的活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Days -->
    <rect x="50" y="20" width="40" height="40" class="image" />
    <rect x="100" y="20" width="40" height="40" class="image" />
    <rect x="150" y="20" width="40" height="40" class="image" />
    <rect x="200" y="20" width="40" height="40" class="image" />
    <rect x="250" y="20" width="40" height="40" class="image" />
    <rect x="300" y="20" width="40" height="40" class="image" />
    <!-- Highlight -->
    <rect x="50" y="20" width="240" height="40" class="image" style="fill: #F39C12; opacity: 0.5;" />
    <!-- Text -->
    <text x="70" y="50" class="content" style="fill: #FFFFFF;">1</text>
    <text x="120" y="50" class="content" style="fill: #FFFFFF;">2</text>
    <text x="170" y="50" class="content" style="fill: #FFFFFF;">3</text>
    <text x="220" y="50" class="content" style="fill: #FFFFFF;">4</text>
    <text x="270" y="50" class="content" style="fill: #FFFFFF;">5</text>
    <text x="320" y="50" class="content" style="fill: #FFFFFF;">6</text>
  </g>
</svg>