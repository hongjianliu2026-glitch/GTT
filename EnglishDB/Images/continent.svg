<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">continent</text>
  <text x="50" y="120" class="subtitle">[ˈkɒntɪnənt] n. 大陆，洲；adj. 自制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + tin (保持) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的陆地，"共同保持(con-tin-ent)"
    <tspan x="50" dy="25">在一起，形成了一个完整的大陆(continent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The continent of Africa is home to many diverse cultures.
  </text>
  <text x="50" y="310" class="content">
    非洲大陆是许多不同文化的家园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Continent shape -->
    <path d="M50 50 L150 50 L200 100 L250 50 L350 50 L350 150 L250 200 L200 150 L150 200 L50 150 Z" class="image" />
    <!-- Landmarks -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
    <circle cx="300" cy="80" r="10" class="image" />
    <!-- Ocean -->
    <path d="M50 250 Q100 300 150 250 T250 250 T350 250" class="image" />
  </g>
</svg>