<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Mexican</text>
  <text x="50" y="120" class="subtitle">[ˈmeksɪkən] adj. 墨西哥的；n. 墨西哥人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Mexi- (源自墨西哥) + -can (表示人或物的后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着宽边帽的墨西哥人，站在仙人掌丛中，
    <tspan x="50" dy="25">手里拿着墨西哥玉米卷，这就是典型的"墨西哥人(Mexican)"形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Mexican cuisine is famous for its spicy flavors.
  </text>
  <text x="50" y="310" class="content">
    墨西哥菜以其辛辣的口味而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sombrero -->
    <circle cx="100" cy="50" r="30" class="image" />
    <rect x="70" y="50" width="60" height="20" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="200" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Cactus -->
    <rect x="150" y="80" width="20" height="100" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <circle cx="160" cy="130" r="10" class="image" />
    <circle cx="160" cy="160" r="10" class="image" />
    <!-- Taco -->
    <polygon points="200,100 230,100 240,130 190,130" class="image" />
  </g>
</svg>