<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">one</text>
  <text x="50" y="120" class="subtitle">[wʌn] num. 一，一个</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *ainaz，表示“一个”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“1”从天而降，
    <tspan x="50" dy="25">它像一根巨大的柱子，支撑着整个世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has only one goal in life.
  </text>
  <text x="50" y="310" class="content">
    她一生只有一个目标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Giant number "1" -->
    <line x1="100" y1="0" x2="100" y2="300" class="image" />
    <line x1="100" y1="0" x2="50" y2="50" class="image" />
    <line x1="100" y1="0" x2="150" y2="50" class="image" />
    <line x1="100" y1="300" x2="50" y2="250" class="image" />
    <line x1="100" y1="300" x2="150" y2="250" class="image" />
  </g>
</svg>