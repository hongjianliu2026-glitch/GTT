<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unrecognized</text>
  <text x="50" y="120" class="subtitle">[ˌʌnrɪˈkɒɡˌnaɪzd] adj. 未被认出的，未被承认的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + recognize (认出)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在人群中，"未被认出(un-recognized)"，
    <tspan x="50" dy="25">他的存在就像空气一样被忽视。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His talent remained unrecognized for years.
  </text>
  <text x="50" y="310" class="content">
    他的才华多年来一直未被承认。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in crowd -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Crowd -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="350" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="350" y1="120" x2="350" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="350" y1="160" x2="330" y2="200" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <line x1="350" y1="140" x2="380" y2="130" class="image" />
  </g>
</svg>