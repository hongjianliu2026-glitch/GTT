<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spirit</text>
  <text x="50" y="120" class="subtitle">[ˈspɪrɪt] n. 精神，灵魂；v. 鼓舞，激励</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spir (呼吸) + -it (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个灵魂(spirit)在空中自由飞翔，"呼吸(spir)"
    <tspan x="50" dy="25">着新鲜的空气，象征着精神的自由与活力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team played with great spirit.
  </text>
  <text x="50" y="310" class="content">
    这支队伍表现得非常有精神。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Spirit -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Breath -->
    <line x1="175" y1="100" x2="125" y2="80" class="image" />
    <line x1="175" y1="100" x2="225" y2="80" class="image" />
  </g>
</svg>