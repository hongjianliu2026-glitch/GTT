<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">facility</text>
  <text x="50" y="120" class="subtitle">[fəˈsɪlɪti] n. 设施，设备；便利，容易</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fac (做) + -ility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工厂，"做(fac)"出各种设施和设备，
    <tspan x="50" dy="25">这些设施让生活变得"容易(ility)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new sports facility has been well received by the community.
  </text>
  <text x="50" y="310" class="content">
    新的体育设施受到了社区的热烈欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="20" width="20" height="80" class="image" />
    <!-- Smoke -->
    <ellipse cx="160" cy="10" rx="20" ry="10" class="image" />
    <!-- Machinery -->
    <rect x="50" y="100" width="250" height="80" class="image" />
    <!-- Conveyor belt -->
    <line x1="70" y1="140" x2="280" y2="140" class="image" />
    <line x1="70" y1="160" x2="280" y2="160" class="image" />
    <line x1="70" y1="180" x2="280" y2="180" class="image" />
    <!-- Products -->
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
  </g>
</svg>