<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pursue</text>
  <text x="50" y="120" class="subtitle">[pərˈsuː] v. 追求，追逐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pur- (向前) + sue (跟随)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在森林中，"向前跟随(pur-sue)"
    <tspan x="50" dy="25">一只奔跑的鹿，他正在追逐(pursue)它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to pursue a career in medicine.
  </text>
  <text x="50" y="310" class="content">
    她决定追求医学事业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Running deer -->
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <!-- Chasing person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>