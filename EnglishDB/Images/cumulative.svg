<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cumulative</text>
  <text x="50" y="120" class="subtitle">[ˈkjuːmjələtɪv] adj. 累积的，渐增的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cumul (堆积) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆书不断"堆积(cumul)"起来，
    <tspan x="50" dy="25">每一本都增加了高度，这就是累积(cumulative)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cumulative effect of these small changes is significant.
  </text>
  <text x="50" y="310" class="content">
    这些小变化的累积效果是显著的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Stack of books -->
    <rect x="0" y="0" width="100" height="20" class="image" />
    <rect x="10" y="25" width="80" height="20" class="image" />
    <rect x="20" y="50" width="60" height="20" class="image" />
    <rect x="30" y="75" width="40" height="20" class="image" />
    <rect x="40" y="100" width="20" height="20" class="image" />
    <!-- Growing height -->
    <line x1="50" y1="0" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="40" y2="120" class="image" />
    <line x1="50" y1="120" x2="60" y2="120" class="image" />
  </g>
</svg>