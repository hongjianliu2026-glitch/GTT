<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recommended</text>
  <text x="50" y="120" class="subtitle">[ˌrekəˈmendɪd] adj. 推荐的，建议的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + commend (赞扬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在会议上，"再次赞扬(re-commend)"
    <tspan x="50" dy="25">某个产品或方案，这个产品或方案就被推荐(recommended)了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The book was highly recommended by the professor.
  </text>
  <text x="50" y="310" class="content">
    这本书被教授强烈推荐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 80 80 Q 150 80 150 120 Q 150 160 80 160 Q 50 160 50 130 Z" class="image" />
    <text x="90" y="110" class="content" fill="#34495E">推荐</text>
  </g>
</svg>