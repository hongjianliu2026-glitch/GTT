<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">claustrophobic</text>
  <text x="50" y="120" class="subtitle">[ˌklɔːstrəˈfoʊbɪk] adj. 幽闭恐惧症的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> claustro- (关闭) + phob (恐惧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被困在一个狭小的房间里，"关闭(claustro)"
    <tspan x="50" dy="25">的空间让他感到极度"恐惧(phob)"，这就是幽闭恐惧症(claustrophobic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt claustrophobic in the crowded elevator.
  </text>
  <text x="50" y="310" class="content">
    她在拥挤的电梯里感到幽闭恐惧症发作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="150" width="50" height="50" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Fear expression -->
    <line x1="90" y1="90" x2="110" y2="90" class="image" />
    <line x1="90" y1="90" x2="90" y2="80" class="image" />
    <line x1="110" y1="90" x2="110" y2="80" class="image" />
    <line x1="95" y1="75" x2="105" y2="75" class="image" />
  </g>
</svg>