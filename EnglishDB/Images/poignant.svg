<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">poignant</text>
  <text x="50" y="120" class="subtitle">[ˈpɔɪnjənt] adj. 尖锐的，辛辣的，令人痛苦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poign (刺) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀子"刺入(poign)"心脏，
    <tspan x="50" dy="25">那种"尖锐的(poignant)"痛苦让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie's poignant ending left the audience in tears.
  </text>
  <text x="50" y="310" class="content">
    电影令人心痛的结局让观众泪流满面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 Q100,20 150,50 Q100,80 50,50" class="image" />
    <!-- Knife -->
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="130" class="image" />
    <line x1="100" y1="150" x2="120" y2="130" class="image" />
    <!-- Blood drop -->
    <circle cx="100" cy="160" r="10" fill="#E74C3C" />
  </g>
</svg>