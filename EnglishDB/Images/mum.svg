<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mum</text>
  <text x="50" y="120" class="subtitle">[mʌm] n. 妈妈，沉默</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mum (来自拉丁语 "mūta"，意为沉默)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个妈妈(mum)在哄孩子睡觉，她轻轻地"沉默(mum)"着，
    <tspan x="50" dy="25">不发出任何声音，以免打扰到孩子的安宁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby fell asleep quickly with mum's gentle silence.
  </text>
  <text x="50" y="310" class="content">
    在妈妈的温柔沉默中，宝宝很快就睡着了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <!-- Baby -->
    <circle cx="150" cy="120" r="20" class="image" />
    <line x1="150" y1="140" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <!-- Silence symbol -->
    <line x1="250" y1="100" x2="280" y2="130" class="image" />
    <line x1="250" y1="130" x2="280" y2="100" class="image" />
  </g>
</svg>