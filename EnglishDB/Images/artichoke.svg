<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">artichoke</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrtɪtʃəʊk] n. 洋蓟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arti- (艺术) + choke (窒息)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家(arti-)在吃洋蓟时，因为洋蓟的叶子层层叠叠，
    <tspan x="50" dy="25">像是在"窒息(choke)"，这种奇特的植物就是洋蓟(artichoke)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prepared a delicious artichoke salad for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐准备了一道美味的洋蓟沙拉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artichoke -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="120" cy="70" r="30" class="image" />
    <circle cx="80" cy="70" r="30" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="130" cy="40" r="15" class="image" />
    <circle cx="70" cy="40" r="15" class="image" />
    <circle cx="110" cy="30" r="10" class="image" />
    <circle cx="90" cy="30" r="10" class="image" />
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Choking -->
    <line x1="20" y1="100" x2="100" y2="100" class="image" />
    <line x1="20" y1="100" x2="20" y2="120" class="image" />
    <line x1="100" y1="100" x2="100" y2="120" class="image" />
  </g>
</svg>