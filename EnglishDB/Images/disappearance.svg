<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disappearance</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈpɪərəns] n. 消失，失踪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不，消失) + appear (出现) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体突然"消失(dis-)"在空气中，就像魔术一样，
    <tspan x="50" dy="25">它不再"出现(appear)"，这就是"disappearance"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sudden disappearance of the keys puzzled everyone.
  </text>
  <text x="50" y="310" class="content">
    钥匙的突然消失让每个人都感到困惑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vanishing object -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="210" class="image" />
    <line x1="100" y1="180" x2="130" y2="210" class="image" />
    <line x1="100" y1="150" x2="160" y2="140" class="image" />
    <!-- Smoke effect -->
    <path d="M100,100 Q120,80 140,100 T180,100" class="image" />
    <path d="M100,100 Q80,80 60,100 T20,100" class="image" />
    <path d="M100,100 Q120,120 140,100 T180,100" class="image" />
    <path d="M100,100 Q80,120 60,100 T20,100" class="image" />
  </g>
</svg>