<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F39C12; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .donut { fill: #D35400; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">donut</text>
  <text x="50" y="120" class="subtitle">[ˈdoʊnət] n. 甜甜圈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自荷兰语 "doughnut"，意为“面团”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的甜甜圈，"面团(dough)"
    <tspan x="50" dy="25">被油炸后变成了金黄色的甜甜圈(donut)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a box of donuts for the office.
  </text>
  <text x="50" y="310" class="content">
    她为办公室买了一盒甜甜圈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Donut -->
    <circle cx="100" cy="100" r="50" class="donut" />
    <circle cx="100" cy="100" r="20" class="background" />
  </g>
</svg>