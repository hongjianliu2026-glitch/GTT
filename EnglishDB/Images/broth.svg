<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .broth { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">broth</text>
  <text x="50" y="120" class="subtitle">[brɒθ] n. 肉汤，清汤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brot (煮) + -h (表示液体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一锅热气腾腾的肉汤，"煮(brot)"
    <tspan x="50" dy="25">出来的液体(h)，就是美味的肉汤(broth)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She simmered the bones to make a rich broth.
  </text>
  <text x="50" y="310" class="content">
    她用骨头炖出了浓郁的肉汤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Broth -->
    <rect x="50" y="20" width="250" height="160" class="broth" />
    <!-- Steam -->
    <line x1="150" y1="20" x2="150" y2="0" class="image" />
    <line x1="170" y1="20" x2="170" y2="0" class="image" />
    <line x1="190" y1="20" x2="190" y2="0" class="image" />
    <line x1="210" y1="20" x2="210" y2="0" class="image" />
    <line x1="230" y1="20" x2="230" y2="0" class="image" />
  </g>
</svg>