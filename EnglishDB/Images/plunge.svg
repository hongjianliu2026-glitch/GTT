<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plunge</text>
  <text x="50" y="120" class="subtitle">[plʌndʒ] v. 投入，跳入，急剧下降</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plumb (深) + -age (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从悬崖上"深(plumb)入(age)"水中，
    <tspan x="50" dy="25">这种急剧的动作就是"plunge"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He took a deep breath and plunged into the icy water.
  </text>
  <text x="50" y="310" class="content">
    他深吸一口气，跳入了冰冷的水中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#1ABC9C" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Splash -->
    <circle cx="100" cy="150" r="10" class="image" fill="#1ABC9C" />
    <circle cx="110" cy="140" r="10" class="image" fill="#1ABC9C" />
    <circle cx="120" cy="150" r="10" class="image" fill="#1ABC9C" />
  </g>
</svg>