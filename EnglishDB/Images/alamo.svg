<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Alamo</text>
  <text x="50" y="120" class="subtitle">[ˈæləmoʊ] n. 阿拉莫（美国德克萨斯州圣安东尼奥的一座历史建筑）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自西班牙语“álamo”，意为“杨树”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座古老的堡垒，周围种满了杨树(álamo)，
    <tspan x="50" dy="25">这座堡垒就是阿拉莫(Alamo)，见证了历史的沧桑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Battle of the Alamo is a significant event in Texas history.
  </text>
  <text x="50" y="310" class="content">
    阿拉莫战役是德克萨斯历史上的一个重要事件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fortress -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Fortress walls -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="50" class="image" />
  </g>
</svg>