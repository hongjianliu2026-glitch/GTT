<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commemoration</text>
  <text x="50" y="120" class="subtitle">[kəˌmeməˈreɪʃn] n. 纪念，庆祝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + memor (记忆) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人聚集在一起，"共同回忆(com-memor)"
    <tspan x="50" dy="25">某个重要事件，这就是纪念(commemoration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city held a commemoration for the fallen soldiers.
  </text>
  <text x="50" y="310" class="content">
    城市为阵亡士兵举行了纪念活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Candle -->
    <rect x="75" y="80" width="50" height="100" class="image" />
    <line x1="100" y1="80" x2="100" y2="60" class="image" />
    <circle cx="100" cy="55" r="5" class="image" />
    <!-- Memory bubble -->
    <ellipse cx="125" cy="150" rx="50" ry="30" class="image" />
    <text x="105" y="155" class="content">记忆</text>
  </g>
</svg>