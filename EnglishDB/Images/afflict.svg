<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">afflict</text>
  <text x="50" y="120" class="subtitle">[əˈflɪkt] v. 使痛苦，折磨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> af- (加强) + flict (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"加强打击(af-flict)"，
    <tspan x="50" dy="25">痛苦不堪，仿佛被巨大的锤子反复敲打。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The disease had afflicted him for years.
  </text>
  <text x="50" y="310" class="content">
    这种疾病已经折磨他多年了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />

    <!-- Hammer -->
    <rect x="150" y="80" width="100" height="20" class="image" />
    <line x1="200" y1="80" x2="200" y2="150" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />

    <!-- Pain expression -->
    <line x1="50" y1="80" x2="40" y2="70" class="image" />
    <line x1="50" y1="80" x2="60" y2="70" class="image" />
    <line x1="50" y1="120" x2="40" y2="130" class="image" />
    <line x1="50" y1="120" x2="60" y2="130" class="image" />
  </g>
</svg>