<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gubernatorial</text>
  <text x="50" y="120" class="subtitle">[ˌɡuːbərnəˈtɔːriəl] adj. 州长的，总督的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gubernare (统治) + -torial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的州长(gubernatorial)站在州议会大厦前，
    <tspan x="50" dy="25">手中握着象征统治(gubernare)的权杖，</tspan>
    <tspan x="50" dy="25">他的身影笼罩整个城市，彰显其权威。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gubernatorial election was held last month.
  </text>
  <text x="50" y="310" class="content">
    州长选举在上个月举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Governor -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Scepter -->
    <line x1="50" y1="130" x2="50" y2="50" class="image" />
    <circle cx="50" cy="40" r="10" class="image" />
    <!-- Capitol building -->
    <rect x="0" y="250" width="100" height="100" class="image" />
    <line x1="25" y1="250" x2="25" y2="200" class="image" />
    <line x1="75" y1="250" x2="75" y2="200" class="image" />
  </g>
</svg>