<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ostracize</text>
  <text x="50" y="120" class="subtitle">[ˈɒstrəsaɪz] v. 排斥，放逐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ostrako (贝壳) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人用贝壳(ostrako)投票，决定将某人放逐(ostracize)，
    <tspan x="50" dy="25">这个画面就像古代雅典的贝壳放逐法。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The community ostracized the newcomer for not following local customs.
  </text>
  <text x="50" y="310" class="content">
    社区因新来者不遵守当地习俗而排斥他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Shells -->
    <path d="M50 80 Q70 100 50 120" class="image" />
    <path d="M100 80 Q120 100 100 120" class="image" />
    <path d="M150 80 Q170 100 150 120" class="image" />
    <!-- Exiled person -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="80" x2="230" y2="70" class="image" />
  </g>
</svg>