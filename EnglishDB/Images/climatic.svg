<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">climatic</text>
  <text x="50" y="120" class="subtitle">[klaɪˈmætɪk] adj. 气候的，气候上的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clima (倾斜) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象地球倾斜(clima)，导致气候变化，
    <tspan x="50" dy="25">这种变化就是气候的(climatic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The climatic conditions in the region are extreme.
  </text>
  <text x="50" y="310" class="content">
    该地区的气候条件非常极端。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Tilt -->
    <line x1="20" y1="20" x2="180" y2="180" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" />
    <!-- Clouds -->
    <ellipse cx="150" cy="50" rx="60" ry="30" class="image" />
    <ellipse cx="200" cy="70" rx="50" ry="25" class="image" />
    <!-- Rain -->
    <line x1="120" y1="120" x2="120" y2="150" class="image" />
    <line x1="140" y1="120" x2="140" y2="150" class="image" />
    <line x1="160" y1="120" x2="160" y2="150" class="image" />
  </g>
</svg>