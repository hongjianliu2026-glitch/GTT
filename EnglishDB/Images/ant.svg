<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ant</text>
  <text x="50" y="120" class="subtitle">[ænt] n. 蚂蚁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ant (源自中古英语，意为“蚂蚁”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小蚂蚁(ant)在草地上忙碌地搬运食物，
    <tspan x="50" dy="25">它的勤劳和团结让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ant is known for its hard work and teamwork.
  </text>
  <text x="50" y="310" class="content">
    蚂蚁以其勤劳和团队合作而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ant body -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Ant head -->
    <circle cx="50" cy="30" r="10" class="image" />
    <!-- Ant antennae -->
    <line x1="40" y1="20" x2="30" y2="10" class="image" />
    <line x1="60" y1="20" x2="70" y2="10" class="image" />
    <!-- Ant legs -->
    <line x1="40" y1="60" x2="30" y2="70" class="image" />
    <line x1="60" y1="60" x2="70" y2="70" class="image" />
    <line x1="45" y1="70" x2="35" y2="80" class="image" />
    <line x1="55" y1="70" x2="65" y2="80" class="image" />
  </g>
</svg>