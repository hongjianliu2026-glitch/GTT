<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recommend</text>
  <text x="50" y="120" class="subtitle">[ˌrekəˈmend] v. 推荐，建议</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + com- (共同) + mend (委托)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在会议上，"再次共同委托(re-com-mend)"
    <tspan x="50" dy="25">某人去做某事，这就是推荐(recommend)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I recommend this book to everyone.
  </text>
  <text x="50" y="310" class="content">
    我向每个人推荐这本书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="90" y2="120" class="image" />
    <!-- Hand pointing -->
    <line x1="90" y1="120" x2="120" y2="120" class="image" />
    <!-- Book -->
    <rect x="130" y="90" width="50" height="60" class="image" />
    <line x1="130" y1="90" x2="180" y2="90" class="image" />
    <line x1="130" y1="120" x2="180" y2="120" class="image" />
    <line x1="130" y1="150" x2="180" y2="150" class="image" />
  </g>
</svg>