<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Peruvian</text>
  <text x="50" y="120" class="subtitle">[pəˈruːviən] adj. 秘鲁的；n. 秘鲁人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Peru (秘鲁) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个秘鲁人(Peruvian)站在安第斯山脉前，
    <tspan x="50" dy="25">身穿传统服饰，手持羊驼毛编织的帽子，</tspan>
    <tspan x="50" dy="25">背景是壮丽的马丘比丘(Machu Picchu)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Peruvian cuisine is famous for its unique flavors.
  </text>
  <text x="50" y="310" class="content">
    秘鲁菜以其独特的风味而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Andes Mountains -->
    <path d="M0,100 L100,0 L200,100 L300,0 L400,100 L500,0 L600,100 L700,0 L800,100" class="image" />
    <!-- Peruvian person -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="140" y2="180" class="image" />
    <!-- Traditional hat -->
    <path d="M80,130 Q100,110 120,130" class="image" />
    <!-- Alpaca -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="240" y2="180" class="image" />
    <!-- Machu Picchu -->
    <rect x="300" y="100" width="150" height="100" class="image" />
    <line x1="320" y1="120" x2="430" y2="120" class="image" />
    <line x1="320" y1="140" x2="430" y2="140" class="image" />
    <line x1="320" y1="160" x2="430" y2="160" class="image" />
    <line x1="320" y1="180" x2="430" y2="180" class="image" />
  </g>
</svg>