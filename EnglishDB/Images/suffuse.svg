<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suffuse</text>
  <text x="50" y="120" class="subtitle">[səˈfjuːz] v. 弥漫，充满</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> suf- (在下面) + fuse (流)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一束光从下方"流(fuse)"上来，
    <tspan x="50" dy="25">逐渐"弥漫(suffuse)"整个房间，让房间充满光明。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was suffused with a warm, golden light.
  </text>
  <text x="50" y="310" class="content">
    房间里弥漫着温暖的金色光芒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Light source -->
    <circle cx="175" cy="180" r="20" class="image" fill="#FFD700" />
    <!-- Light rays -->
    <line x1="175" y1="160" x2="100" y2="50" class="image" stroke="#FFD700" stroke-width="3" />
    <line x1="175" y1="160" x2="250" y2="50" class="image" stroke="#FFD700" stroke-width="3" />
    <line x1="175" y1="160" x2="50" y2="100" class="image" stroke="#FFD700" stroke-width="3" />
    <line x1="175" y1="160" x2="300" y2="100" class="image" stroke="#FFD700" stroke-width="3" />
    <line x1="175" y1="160" x2="175" y2="0" class="image" stroke="#FFD700" stroke-width="3" />
  </g>
</svg>