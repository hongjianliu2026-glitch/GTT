<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chi-square</text>
  <text x="50" y="120" class="subtitle">[kaɪ skwɛər] n. 卡方分布</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chi (希腊字母χ) + square (平方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个统计学家在研究数据时，发现了一个"χ平方(chi-square)"
    <tspan x="50" dy="25">分布，这个分布帮助他分析数据的差异性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chi-square test was used to determine the significance of the results.
  </text>
  <text x="50" y="310" class="content">
    卡方检验被用来确定结果的显著性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chi symbol -->
    <text x="0" y="0" font-size="100" class="image">χ</text>
    <!-- Square symbol -->
    <rect x="120" y="-50" width="100" height="100" class="image" />
    <!-- Statistician -->
    <circle cx="300" cy="50" r="15" class="image" />
    <line x1="300" y1="65" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="280" y2="130" class="image" />
    <line x1="300" y1="100" x2="320" y2="130" class="image" />
    <line x1="300" y1="80" x2="350" y2="70" class="image" />
  </g>
</svg>