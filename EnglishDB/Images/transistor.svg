<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transistor</text>
  <text x="50" y="120" class="subtitle">[trænˈzɪstər] n. 晶体管</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + ist (站立) + or (物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个晶体管，它像一个"跨越(trans-)"电流的"站立(ist)"物，
    <tspan x="50" dy="25">控制着电流的流动，就像一个微小的开关。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The transistor is a fundamental component in electronics.
  </text>
  <text x="50" y="310" class="content">
    晶体管是电子学中的基本元件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Transistor shape -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="0" y1="75" x2="100" y2="75" class="image" />
    <!-- Current flow -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="50" y1="0" x2="100" y2="75" class="image" />
    <line x1="50" y1="150" x2="0" y2="75" class="image" />
  </g>
</svg>