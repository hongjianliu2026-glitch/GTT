<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obscure</text>
  <text x="50" y="120" class="subtitle">[əbˈskjʊr] adj. 模糊的，晦涩的；v. 使模糊，使难理解</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (在前面) + scure (隐藏)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的卷轴，被"隐藏在前面(ob-scure)"
    <tspan x="50" dy="25">的阴影中，文字变得模糊不清，难以理解。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meaning of the ancient text remains obscure.
  </text>
  <text x="50" y="310" class="content">
    这篇古文的含义仍然模糊不清。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shadow -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#D7DBDD" />
    <!-- Scroll -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#F4D03F" />
    <!-- Text lines -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Shadow effect -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="rgba(0,0,0,0.3)" />
  </g>
</svg>