<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fascism</text>
  <text x="50" y="120" class="subtitle">[ˈfæʃɪzəm] n. 法西斯主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fasc (束棒) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人被"束棒(fasc)"紧紧捆绑在一起，
    <tspan x="50" dy="25">形成了一个强大的集体，这就是法西斯主义(fascism)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rise of fascism in the 1930s led to World War II.
  </text>
  <text x="50" y="310" class="content">
    20世纪30年代法西斯主义的兴起导致了第二次世界大战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bundle of sticks -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- People tied together -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="115" y1="100" x2="185" y2="100" class="image" />
    <line x1="115" y1="115" x2="185" y2="115" class="image" />
    <line x1="115" y1="85" x2="185" y2="85" class="image" />
  </g>
</svg>