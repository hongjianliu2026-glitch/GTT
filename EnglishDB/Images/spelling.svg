<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spelling</text>
  <text x="50" y="120" class="subtitle">[ˈspelɪŋ] n. 拼写，拼法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spell (拼写) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在黑板上，"拼写(spell)"
    <tspan x="50" dy="25">每个字母，这些字母就构成了一个单词(spelling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always makes mistakes in spelling.
  </text>
  <text x="50" y="310" class="content">
    她在拼写上总是出错。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blackboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Letters -->
    <text x="50" y="50" class="image" font-size="48">S</text>
    <text x="100" y="50" class="image" font-size="48">P</text>
    <text x="150" y="50" class="image" font-size="48">E</text>
    <text x="200" y="50" class="image" font-size="48">L</text>
    <text x="250" y="50" class="image" font-size="48">L</text>
    <text x="300" y="50" class="image" font-size="48">I</text>
    <text x="350" y="50" class="image" font-size="48">N</text>
    <text x="400" y="50" class="image" font-size="48">G</text>
    <!-- Student -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>