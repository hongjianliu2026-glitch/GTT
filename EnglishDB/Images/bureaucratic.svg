<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bureaucratic</text>
  <text x="50" y="120" class="subtitle">[ˌbjʊərəˈkrætɪk] adj. 官僚的，官僚主义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bureau (办公室) + -cratic (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的办公室，里面堆满了文件，
    <tspan x="50" dy="25">一群穿着西装的人在"办公室统治(bureau-cratic)"下忙碌。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bureaucratic process took months to complete.
  </text>
  <text x="50" y="310" class="content">
    官僚程序花了好几个月才完成。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Files -->
    <rect x="50" y="20" width="50" height="70" class="image" />
    <rect x="120" y="20" width="50" height="70" class="image" />
    <rect x="190" y="20" width="50" height="70" class="image" />
    <rect x="260" y="20" width="50" height="70" class="image" />
    <!-- Suited people -->
    <circle cx="70" cy="120" r="15" class="image" />
    <line x1="70" y1="135" x2="70" y2="170" class="image" />
    <line x1="70" y1="170" x2="50" y2="200" class="image" />
    <line x1="70" y1="170" x2="90" y2="200" class="image" />
    <line x1="70" y1="150" x2="100" y2="140" class="image" />
    <circle cx="140" cy="120" r="15" class="image" />
    <line x1="140" y1="135" x2="140" y2="170" class="image" />
    <line x1="140" y1="170" x2="120" y2="200" class="image" />
    <line x1="140" y1="170" x2="160" y2="200" class="image" />
    <line x1="140" y1="150" x2="170" y2="140" class="image" />
    <circle cx="210" cy="120" r="15" class="image" />
    <line x1="210" y1="135" x2="210" y2="170" class="image" />
    <line x1="210" y1="170" x2="190" y2="200" class="image" />
    <line x1="210" y1="170" x2="230" y2="200" class="image" />
    <line x1="210" y1="150" x2="240" y2="140" class="image" />
  </g>
</svg>