<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">backside</text>
  <text x="50" y="120" class="subtitle">[ˈbækˌsaɪd] n. 背面，后面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> back (后面) + side (边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在你面前，你只能看到他的"后面(back)"和"边(side)"，
    <tspan x="50" dy="25">这就是他的背面(backside)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She turned around to check the backside of the painting.
  </text>
  <text x="50" y="310" class="content">
    她转过身去检查画的背面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="220" class="image" />
    <line x1="100" y1="180" x2="150" y2="220" class="image" />
    <!-- Backside -->
    <line x1="100" y1="150" x2="50" y2="100" class="image" />
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
    <line x1="100" y1="150" x2="0" y2="150" class="image" />
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <text x="50" y="350" class="content">Backside</text>
  </g>
</svg>