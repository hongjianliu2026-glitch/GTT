<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .strike { stroke: #E74C3C; stroke-width: 5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">strikeout</text>
  <text x="50" y="120" class="subtitle">[ˈstraɪkaʊt] n. 三振出局，划掉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strike (打击) + out (出去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棒球运动员被"打击出去(strike out)"，
    <tspan x="50" dy="25">就像在纸上被划掉(strikeout)一样，彻底出局。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The batter had two strikeouts in the game.
  </text>
  <text x="50" y="310" class="content">
    这名击球手在比赛中被三振出局了两次。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baseball field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Home plate -->
    <rect x="150" y="150" width="50" height="10" class="image" />
    <!-- Pitcher -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="90" y2="120" class="image" />
    <!-- Batter -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="290" y2="120" class="image" />
    <!-- Strikeout line -->
    <line x1="100" y1="50" x2="300" y2="50" class="strike" />
  </g>
</svg>