<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intention</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɛnʃən] n. 意图，目的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (向内) + tent (伸展)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在心中"向内伸展(in-tent)"
    <tspan x="50" dy="25">他的想法，这个想法就是他的意图(intention)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her intention was to finish the project by Friday.
  </text>
  <text x="50" y="310" class="content">
    她的意图是在周五前完成这个项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 40 C10 10, 40 10, 40 40 S70 70, 40 90 S10 70, 10 40" class="image" />
    <!-- Arrow pointing in -->
    <line x1="40" y1="40" x2="40" y2="100" class="image" />
    <polygon points="35,95 40,100 45,95" class="image" />
    <!-- Thought bubble -->
    <circle cx="40" cy="20" r="15" class="image" />
    <circle cx="30" cy="10" r="5" class="image" />
    <circle cx="50" cy="10" r="5" class="image" />
  </g>
</svg>