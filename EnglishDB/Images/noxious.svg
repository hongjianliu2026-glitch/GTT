<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">noxious</text>
  <text x="50" y="120" class="subtitle">[ˈnɒkʃəs] adj. 有害的，有毒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nox (伤害) + ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个有毒的气体云团，"伤害(nox)"
    <tspan x="50" dy="25">周围的一切，这就是有害的(noxious)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory emitted noxious fumes into the air.
  </text>
  <text x="50" y="310" class="content">
    工厂向空气中排放了有害的烟雾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toxic cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <ellipse cx="175" cy="100" rx="130" ry="65" class="image" />
    <ellipse cx="175" cy="100" rx="110" ry="55" class="image" />
    <!-- Factory -->
    <rect x="100" y="150" width="150" height="100" class="image" />
    <line x1="125" y1="150" x2="125" y2="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="50" class="image" />
    <line x1="225" y1="150" x2="225" y2="50" class="image" />
  </g>
</svg>