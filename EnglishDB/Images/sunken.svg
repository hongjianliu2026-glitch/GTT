<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunken</text>
  <text x="50" y="120" class="subtitle">[ˈsʌŋkən] adj. 沉没的，凹陷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun- (在下面) + ken (知道)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船"沉入(sun-)"海底，"知道(ken)"它已经无法再浮上来，
    <tspan x="50" dy="25">这就是"沉没的(sunken)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sunken ship was discovered by divers.
  </text>
  <text x="50" y="310" class="content">
    潜水员发现了那艘沉没的船。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#85C1E9" />
    <!-- Sunken ship -->
    <rect x="100" y="100" width="150" height="50" class="image" fill="#D7DBDD" />
    <!-- Waves -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <!-- Sunken ship details -->
    <line x1="120" y1="120" x2="120" y2="150" class="image" />
    <line x1="140" y1="120" x2="140" y2="150" class="image" />
    <line x1="160" y1="120" x2="160" y2="150" class="image" />
    <line x1="180" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="200" y2="150" class="image" />
    <line x1="220" y1="120" x2="220" y2="150" class="image" />
  </g>
</svg>