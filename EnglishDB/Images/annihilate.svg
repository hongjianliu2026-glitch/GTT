<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">annihilate</text>
  <text x="50" y="120" class="subtitle">[əˈnaɪəˌleɪt] v. 消灭，歼灭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (无) + nihi (无) + late (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的黑洞，"使(late)"
    <tspan x="50" dy="25">一切"无(an-nihi)"，完全消失，这就是annihilate。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The army annihilated the enemy forces.
  </text>
  <text x="50" y="310" class="content">
    军队歼灭了敌军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Black hole -->
    <circle cx="175" cy="100" r="70" class="image" />
    <!-- Explosion -->
    <line x1="100" y1="30" x2="250" y2="30" class="image" />
    <line x1="100" y1="60" x2="250" y2="60" class="image" />
    <line x1="100" y1="90" x2="250" y2="90" class="image" />
    <line x1="100" y1="120" x2="250" y2="120" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <!-- Vanishing objects -->
    <line x1="150" y1="180" x2="150" y2="220" class="image" />
    <line x1="200" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="180" x2="175" y2="220" class="image" />
  </g>
</svg>