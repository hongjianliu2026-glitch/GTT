<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sect</text>
  <text x="50" y="120" class="subtitle">[sekt] n. 宗派，教派</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sec (切) + -t (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宗教团体，像一块大蛋糕被"切(sec)"成
    <tspan x="50" dy="25">多个小部分，每个部分就是一个宗派(sect)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The church split into several sects after the disagreement.
  </text>
  <text x="50" y="310" class="content">
    教会因分歧分裂成几个宗派。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Slices -->
    <line x1="100" y1="100" x2="20" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="20" class="image" />
    <line x1="100" y1="100" x2="20" y2="180" class="image" />
    <line x1="100" y1="100" x2="180" y2="180" class="image" />
    <!-- Sect labels -->
    <text x="20" y="15" class="content">Sect 1</text>
    <text x="150" y="15" class="content">Sect 2</text>
    <text x="20" y="185" class="content">Sect 3</text>
    <text x="150" y="185" class="content">Sect 4</text>
  </g>
</svg>