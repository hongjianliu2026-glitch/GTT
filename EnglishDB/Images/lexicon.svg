<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lexicon</text>
  <text x="50" y="120" class="subtitle">[ˈlɛksɪkɑn] n. 词典，词汇表</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lex (词) + icon (表)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的词典，"词(lex)"
    <tspan x="50" dy="25">汇聚成一个"表(icon)"，这就是lexicon。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lexicon of this language is vast.
  </text>
  <text x="50" y="310" class="content">
    这种语言的词汇量非常丰富。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pages -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="60" x2="350" y2="60" class="image" />
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <line x1="50" y1="140" x2="350" y2="140" class="image" />
    <!-- Words -->
    <text x="70" y="40" class="content">word</text>
    <text x="70" y="80" class="content">lexicon</text>
    <text x="70" y="120" class="content">dictionary</text>
    <text x="70" y="160" class="content">vocabulary</text>
  </g>
</svg>