<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pact</text>
  <text x="50" y="120" class="subtitle">[pækt] n. 协定，条约</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pact (固定，连接)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个国家领导人握手，"固定(pact)"
    <tspan x="50" dy="25">在一起，象征着他们之间的协定(pact)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two countries signed a peace pact.
  </text>
  <text x="50" y="310" class="content">
    这两个国家签署了一项和平协定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Handshake -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Leaders -->
    <circle cx="50" cy="120" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <!-- Text labels -->
    <text x="40" y="150" class="content">Leader 1</text>
    <text x="140" y="150" class="content">Leader 2</text>
  </g>
</svg>