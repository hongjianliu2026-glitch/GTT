<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">metastasis</text>
  <text x="50" y="120" class="subtitle">[məˈtæstəsɪs] n. 转移，转移瘤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meta- (变化) + stasis (停止)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个癌细胞在体内"变化(meta-)"并"停止(stasis)"
    <tspan x="50" dy="25">在新的位置，形成转移瘤(metastasis)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor found a metastasis in the patient's lung.
  </text>
  <text x="50" y="310" class="content">
    医生在患者的肺部发现了转移瘤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Original tumor -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Metastasis -->
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Arrows -->
    <line x1="70" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,90 180,110 200,100" class="image" />
    <!-- Cells -->
    <circle cx="60" cy="90" r="5" class="image" />
    <circle cx="70" cy="110" r="5" class="image" />
    <circle cx="190" cy="90" r="5" class="image" />
    <circle cx="210" cy="110" r="5" class="image" />
  </g>
</svg>