<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fiery</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪəri] adj. 火的，燃烧的；激烈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fire (火) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一团熊熊燃烧的火焰，"火(fire)"
    <tspan x="50" dy="25">在燃烧，炽热而激烈，这就是fiery(燃烧的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fiery debate heated up the room.
  </text>
  <text x="50" y="310" class="content">
    激烈的辩论让房间升温。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="50" r="30" class="fire" />
    <circle cx="80" cy="70" r="25" class="fire" />
    <circle cx="110" cy="50" r="30" class="fire" />
    <circle cx="70" cy="30" r="20" class="fire" />
    <circle cx="90" cy="30" r="20" class="fire" />
    <circle cx="60" cy="60" r="20" class="fire" />
    <circle cx="100" cy="60" r="20" class="fire" />
  </g>
</svg>