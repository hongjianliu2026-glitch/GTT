<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">civil</text>
  <text x="50" y="120" class="subtitle">[ˈsɪvl] adj. 公民的，民事的，文明的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> civ (城市) + -il (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市(civ)里的人们，他们遵守规则，
    <tspan x="50" dy="25">互相尊重，这就是文明(civil)的体现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge handled the case as a civil matter.
  </text>
  <text x="50" y="310" class="content">
    法官将此案作为民事案件处理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="10" width="50" height="120" class="image" />
    <rect x="190" y="30" width="50" height="90" class="image" />
    <rect x="260" y="50" width="50" height="70" class="image" />
    <!-- People -->
    <circle cx="70" cy="150" r="10" class="image" />
    <circle cx="140" cy="140" r="10" class="image" />
    <circle cx="210" cy="160" r="10" class="image" />
    <circle cx="280" cy="130" r="10" class="image" />
    <!-- Rules -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="190" x2="300" y2="190" class="image" />
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
  </g>
</svg>