<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retribution</text>
  <text x="50" y="120" class="subtitle">[ˌrɛtrɪˈbjuːʃən] n. 报应，惩罚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + tribut (给予) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶人做了坏事，"回报(re-tribut)"
    <tspan x="50" dy="25">给他的是惩罚(retribution)，就像天平两端</tspan>
    <tspan x="50" dy="25">的正义与邪恶，最终正义会压倒邪恶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thief received his just retribution.
  </text>
  <text x="50" y="310" class="content">
    小偷得到了应有的惩罚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Scales -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <line x1="350" y1="50" x2="350" y2="200" class="image" />
    <!-- Justice side -->
    <rect x="70" y="100" width="100" height="100" class="image" />
    <text x="120" y="160" class="content" text-anchor="middle">正义</text>
    <!-- Evil side -->
    <rect x="230" y="150" width="100" height="50" class="image" />
    <text x="280" y="190" class="content" text-anchor="middle">邪恶</text>
    <!-- Arrow -->
    <line x1="200" y1="220" x2="200" y2="250" class="image" />
    <polygon points="190,250 210,250 200,260" class="image" />
  </g>
</svg>