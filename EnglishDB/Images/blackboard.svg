<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blackboard</text>
  <text x="50" y="120" class="subtitle">[ˈblækˌbɔrd] n. 黑板</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> black (黑色) + board (板)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个教室里，老师站在一块"黑色(black)"的"板(board)"前，
    <tspan x="50" dy="25">用粉笔在上面写字，这就是黑板(blackboard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher wrote the lesson plan on the blackboard.
  </text>
  <text x="50" y="310" class="content">
    老师把课程计划写在黑板上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Blackboard -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#000000" />
    <!-- Chalk lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" stroke="#FFFFFF" />
    <line x1="50" y1="80" x2="250" y2="80" class="image" stroke="#FFFFFF" />
    <line x1="50" y1="110" x2="270" y2="110" class="image" stroke="#FFFFFF" />
    <line x1="50" y1="140" x2="240" y2="140" class="image" stroke="#FFFFFF" />
    <!-- Teacher -->
    <circle cx="20" cy="250" r="15" class="image" fill="#FFD700" />
    <line x1="20" y1="265" x2="20" y2="300" class="image" />
    <line x1="20" y1="300" x2="0" y2="330" class="image" />
    <line x1="20" y1="300" x2="40" y2="330" class="image" />
    <line x1="20" y1="280" x2="50" y2="270" class="image" />
  </g>
</svg>