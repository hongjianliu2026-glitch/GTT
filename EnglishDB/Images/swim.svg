<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swim</text>
  <text x="50" y="120" class="subtitle">[swɪm] v. 游泳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swim (源自中古英语 swimmen，意为“游泳”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在水中自由地"游泳(swim)"，
    <tspan x="50" dy="25">水花四溅，仿佛在水中翩翩起舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to swim in the ocean.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在海里游泳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Swimmer -->
    <circle cx="100" cy="100" r="15" class="image" fill="#FFD700" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Water splashes -->
    <circle cx="150" cy="120" r="10" class="image" fill="#87CEEB" />
    <circle cx="160" cy="140" r="10" class="image" fill="#87CEEB" />
    <circle cx="140" cy="160" r="10" class="image" fill="#87CEEB" />
  </g>
</svg>