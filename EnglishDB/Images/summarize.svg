<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">summarize</text>
  <text x="50" y="120" class="subtitle">[ˈsʌməraɪz] v. 总结，概述</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sum- (总和) + mar (边界) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学者站在一堆书前，"总结(summarize)"
    <tspan x="50" dy="25">这些书的内容，将所有信息压缩到一个边界(mar)内。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She summarized the main points of the lecture in her notebook.
  </text>
  <text x="50" y="310" class="content">
    她把讲座的主要内容总结在了笔记本上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Books -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="110" y="0" width="100" height="150" class="image" />
    <rect x="220" y="0" width="100" height="150" class="image" />
    <!-- Scholar -->
    <circle cx="160" cy="200" r="20" class="image" />
    <line x1="160" y1="220" x2="160" y2="260" class="image" />
    <line x1="160" y1="260" x2="140" y2="300" class="image" />
    <line x1="160" y1="260" x2="180" y2="300" class="image" />
    <line x1="160" y1="240" x2="200" y2="230" class="image" />
    <!-- Summary -->
    <rect x="330" y="0" width="100" height="150" class="image" />
    <line x1="340" y1="20" x2="420" y2="20" class="image" />
    <line x1="340" y1="50" x2="420" y2="50" class="image" />
    <line x1="340" y1="80" x2="420" y2="80" class="image" />
    <line x1="340" y1="110" x2="420" y2="110" class="image" />
  </g>
</svg>