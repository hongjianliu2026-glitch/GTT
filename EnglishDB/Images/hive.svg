<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bee { fill: #F4D03F; }
      .honeycomb { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hive</text>
  <text x="50" y="120" class="subtitle">[haɪv] n. 蜂巢，蜂箱；v. 群居</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hiv (蜂巢)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群蜜蜂在蜂巢(hive)中忙碌，
    <tspan x="50" dy="25">它们共同建造了一个充满蜂蜜的家园。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bees built a hive in the garden.
  </text>
  <text x="50" y="310" class="content">
    蜜蜂在花园里建了一个蜂巢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hive -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Honeycomb -->
    <polygon points="50,20 150,20 200,100 100,100" class="honeycomb" />
    <polygon points="50,60 150,60 200,140 100,140" class="honeycomb" />
    <polygon points="50,100 150,100 200,180 100,180" class="honeycomb" />
    <!-- Bees -->
    <circle cx="70" cy="40" r="10" class="bee" />
    <circle cx="170" cy="40" r="10" class="bee" />
    <circle cx="120" cy="120" r="10" class="bee" />
    <circle cx="70" cy="160" r="10" class="bee" />
    <circle cx="170" cy="160" r="10" class="bee" />
  </g>
</svg>