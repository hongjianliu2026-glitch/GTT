<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">asbestos</text>
  <text x="50" y="120" class="subtitle">[æsˈbɛstəs] n. 石棉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (不) + sbestos (燃烧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块"不会燃烧(a-sbestos)"的神奇石头，
    <tspan x="50" dy="25">它能在火中保持完整，这就是石棉(asbestos)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old building used asbestos in its insulation.
  </text>
  <text x="50" y="310" class="content">
    这座老建筑在隔热材料中使用了石棉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <path d="M50 50 C100 20, 150 20, 200 50 S300 100, 350 50" class="image" />
    <path d="M50 100 C100 70, 150 70, 200 100 S300 150, 350 100" class="image" />
    <path d="M50 150 C100 120, 150 120, 200 150 S300 200, 350 150" class="image" />
    <!-- Asbestos rock -->
    <rect x="150" y="100" width="100" height="50" class="image" />
    <line x1="160" y1="110" x2="240" y2="110" class="image" />
    <line x1="160" y1="130" x2="240" y2="130" class="image" />
    <line x1="160" y1="150" x2="240" y2="150" class="image" />
  </g>
</svg>