<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">demolition</text>
  <text x="50" y="120" class="subtitle">[ˌdɛməˈlɪʃən] n. 拆除，破坏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + mol (建造) + -ition (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的挖掘机，"向下拆除(de-molition)"
    <tspan x="50" dy="25">一座高楼，瞬间变成废墟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The demolition of the old bridge was completed yesterday.
  </text>
  <text x="50" y="310" class="content">
    旧桥的拆除工作昨天完成了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <rect x="40" y="40" width="70" height="120" class="image" />
    <!-- Demolition -->
    <line x1="160" y1="100" x2="100" y2="200" class="image" />
    <line x1="160" y1="100" x2="220" y2="200" class="image" />
    <circle cx="160" cy="100" r="20" class="image" />
    <!-- Dust -->
    <line x1="50" y1="220" x2="100" y2="250" class="image" />
    <line x1="70" y1="220" x2="120" y2="250" class="image" />
    <line x1="90" y1="220" x2="140" y2="250" class="image" />
  </g>
</svg>