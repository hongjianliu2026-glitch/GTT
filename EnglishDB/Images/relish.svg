<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relish</text>
  <text x="50" y="120" class="subtitle">[ˈrɛlɪʃ] n. 调味品，享受；v. 享受，喜爱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再) + lish (来自古法语 "liser"，意为"享受")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在品尝美食时，"再次享受(re-lish)"
    <tspan x="50" dy="25">每一口的美味，脸上露出满足的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She relished every bite of the delicious cake.
  </text>
  <text x="50" y="310" class="content">
    她享受每一口美味蛋糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#FFD700" />
    <!-- Fork -->
    <line x1="30" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Smiling face -->
    <circle cx="20" cy="90" r="5" class="image" fill="#FF6347" />
    <circle cx="30" cy="90" r="5" class="image" fill="#FF6347" />
    <path d="M15 110 Q20 120 25 110" stroke="#FF6347" stroke-width="2" fill="none" />
  </g>
</svg>