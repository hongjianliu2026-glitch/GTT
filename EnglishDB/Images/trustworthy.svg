<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .shield { fill: #2ECC71; }
      .heart { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trustworthy</text>
  <text x="50" y="120" class="subtitle">[ˈtrʌstˌwɜrði] adj. 值得信赖的，可靠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trust (信任) + worth (价值) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的盾牌(shield)后面，
    <tspan x="50" dy="25">盾牌上有一个心形(heart)，象征着信任和价值。</tspan>
    <tspan x="50" dy="25">这个人因为值得信赖，所以被大家信任。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a trustworthy friend who always keeps her promises.
  </text>
  <text x="50" y="310" class="content">
    她是一个值得信赖的朋友，总是信守承诺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="0,0 150,0 175,50 150,100 0,100" class="shield image" />
    <!-- Heart -->
    <path d="M 75,50 A 25,25 0 0,1 125,50 A 25,25 0 0,1 75,100 A 25,25 0 0,1 25,50 A 25,25 0 0,1 75,50" class="heart image" />
    <!-- Person -->
    <circle cx="200" cy="75" r="15" class="image" />
    <line x1="200" y1="90" x2="200" y2="125" class="image" />
    <line x1="200" y1="125" x2="180" y2="155" class="image" />
    <line x1="200" y1="125" x2="220" y2="155" class="image" />
    <line x1="200" y1="105" x2="230" y2="95" class="image" />
  </g>
</svg>