<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parliamentary</text>
  <text x="50" y="120" class="subtitle">[ˌpɑːrləˈmentəri] adj. 议会的，国会的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> parlia (说话) + ment (名词后缀) + ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一个大厅里，"说话(parlia)"
    <tspan x="50" dy="25">讨论国家大事，这就是议会(parliamentary)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The parliamentary debate lasted for hours.
  </text>
  <text x="50" y="310" class="content">
    议会辩论持续了几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parliament building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hall -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People -->
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <circle cx="160" cy="60" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <circle cx="240" cy="60" r="10" class="image" />
    <!-- Speech bubbles -->
    <ellipse cx="80" cy="40" rx="20" ry="10" class="image" />
    <ellipse cx="120" cy="40" rx="20" ry="10" class="image" />
    <ellipse cx="160" cy="40" rx="20" ry="10" class="image" />
    <ellipse cx="200" cy="40" rx="20" ry="10" class="image" />
    <ellipse cx="240" cy="40" rx="20" ry="10" class="image" />
  </g>
</svg>