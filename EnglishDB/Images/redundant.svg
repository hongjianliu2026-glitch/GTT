<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">redundant</text>
  <text x="50" y="120" class="subtitle">[rɪˈdʌndənt] adj. 多余的，累赘的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + -dund- (流动) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，水流"再次流动(-dund-)"，
    <tspan x="50" dy="25">但这次的水流是多余的，形成了"累赘(redundant)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The report contained a lot of redundant information.
  </text>
  <text x="50" y="310" class="content">
    这份报告包含了很多多余的信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 0 Q100 50 200 0 T400 0" class="image" />
    <path d="M0 20 Q100 70 200 20 T400 20" class="image" />
    <path d="M0 40 Q100 90 200 40 T400 40" class="image" />
    <!-- Extra water -->
    <path d="M200 0 Q250 50 300 0" class="image" />
    <path d="M200 20 Q250 70 300 20" class="image" />
    <path d="M200 40 Q250 90 300 40" class="image" />
    <!-- Label -->
    <text x="250" y="100" class="content" text-anchor="middle">多余的</text>
  </g>
</svg>