<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-year</text>
  <text x="50" y="120" class="subtitle">[θriː jɪr] adj. 三年的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + year (年)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个三岁的孩子，"三年(three-year)"
    <tspan x="50" dy="25">的成长历程，从蹒跚学步到奔跑自如。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The three-year project finally came to an end.
  </text>
  <text x="50" y="310" class="content">
    这个为期三年的项目终于结束了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Three circles representing three years -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Child -->
    <circle cx="150" cy="200" r="20" class="image" />
    <line x1="150" y1="220" x2="150" y2="260" class="image" />
    <line x1="150" y1="260" x2="130" y2="300" class="image" />
    <line x1="150" y1="260" x2="170" y2="300" class="image" />
    <line x1="150" y1="240" x2="120" y2="230" class="image" />
    <line x1="150" y1="240" x2="180" y2="230" class="image" />
  </g>
</svg>