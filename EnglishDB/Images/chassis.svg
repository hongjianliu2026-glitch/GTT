<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chassis</text>
  <text x="50" y="120" class="subtitle">[ˈʃæsi] n. 底盘，底架</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自法语 "chassis"，意为框架或支架
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车的底盘(chassis)，它就像一个坚固的框架，
    <tspan x="50" dy="25">支撑着整个车身，让汽车能够稳定行驶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mechanic inspected the car's chassis for any damage.
  </text>
  <text x="50" y="310" class="content">
    技工检查了汽车的底盘是否有损坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chassis frame -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="150" r="30" class="image" />
    <circle cx="300" cy="150" r="30" class="image" />
    <!-- Axles -->
    <line x1="80" y1="150" x2="270" y2="150" class="image" />
    <!-- Body outline -->
    <rect x="50" y="20" width="250" height="120" class="image" />
  </g>
</svg>