<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">needless</text>
  <text x="50" y="120" class="subtitle">[ˈniːdlɪs] adj. 不必要的，多余的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> need (需要) + -less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一把剪刀，剪掉了一根多余的线，"不需要(need-less)"
    <tspan x="50" dy="25">的线被剪掉了，这就是needless的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The extra features were deemed needless and removed.
  </text>
  <text x="50" y="310" class="content">
    这些多余的功能被认为是不必要的，并被移除了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scissors -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Thread -->
    <line x1="100" y1="120" x2="100" y2="200" class="image" />
    <!-- Cut line -->
    <line x1="100" y1="160" x2="100" y2="180" class="image" stroke-dasharray="5,5" />
  </g>
</svg>