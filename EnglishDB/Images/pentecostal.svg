<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Pentecostal</text>
  <text x="50" y="120" class="subtitle">[ˌpɛntɪˈkɒstl] adj. 五旬节的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pentecost (五旬节) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群信徒在五旬节(Pentecost)那天，
    <tspan x="50" dy="25">被圣灵充满，语言能力被赋予，</tspan>
    <tspan x="50" dy="25">他们开始用不同的语言赞美上帝，</tspan>
    <tspan x="50" dy="25">这就是五旬节派(Pentecostal)的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="320" class="content">
    <tspan class="highlight">例句:</tspan> The Pentecostal church is known for its lively worship services.
  </text>
  <text x="50" y="350" class="content">
    五旬节派教会以其充满活力的礼拜仪式而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cross -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <!-- People -->
    <circle cx="70" cy="130" r="15" class="image" />
    <circle cx="120" cy="130" r="15" class="image" />
    <circle cx="170" cy="130" r="15" class="image" />
    <circle cx="220" cy="130" r="15" class="image" />
    <circle cx="270" cy="130" r="15" class="image" />
    <!-- Speech bubbles -->
    <ellipse cx="70" cy="100" rx="20" ry="10" class="image" />
    <ellipse cx="120" cy="100" rx="20" ry="10" class="image" />
    <ellipse cx="170" cy="100" rx="20" ry="10" class="image" />
    <ellipse cx="220" cy="100" rx="20" ry="10" class="image" />
    <ellipse cx="270" cy="100" rx="20" ry="10" class="image" />
  </g>
</svg>