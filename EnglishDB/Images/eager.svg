<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eager</text>
  <text x="50" y="120" class="subtitle">[ˈiːɡər] adj. 渴望的，热切的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + ager (行动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在起跑线上，"急于行动(e-ager)"，
    <tspan x="50" dy="25">他的眼睛闪烁着对胜利的渴望。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The students were eager to start the new project.
  </text>
  <text x="50" y="310" class="content">
    学生们渴望开始新项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Starting line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Runner -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="40" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
    <!-- Sparkles -->
    <circle cx="35" cy="35" r="2" class="image" fill="#F1C40F" />
    <circle cx="65" cy="35" r="2" class="image" fill="#F1C40F" />
  </g>
</svg>