<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">campaigning</text>
  <text x="50" y="120" class="subtitle">[kæmˈpeɪnɪŋ] n. 竞选活动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> camp (田野) + -aign (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个政治家在田野(camp)上，"大声呼喊(aign)"
    <tspan x="50" dy="25">争取选民的支持，这就是竞选活动(campaigning)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spent months campaigning for the election.
  </text>
  <text x="50" y="310" class="content">
    他为选举竞选了几个月。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Politician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Microphone -->
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <rect x="150" y="100" width="20" height="40" class="image" />
    <!-- Crowd -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
  </g>
</svg>