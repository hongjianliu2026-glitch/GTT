<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hang</text>
  <text x="50" y="120" class="subtitle">[hæŋ] v. 悬挂，吊；逗留，徘徊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hang (悬挂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟摆，"悬挂(hang)"在空中，
    <tspan x="50" dy="25">不停地摆动，仿佛时间也在随之流逝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hung the painting on the wall.
  </text>
  <text x="50" y="310" class="content">
    她把画挂在墙上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ceiling -->
    <line x1="0" y1="0" x2="400" y2="0" class="image" />
    <!-- Rope -->
    <line x1="200" y1="0" x2="200" y2="150" class="image" />
    <!-- Pendulum -->
    <circle cx="200" cy="150" r="20" class="image" />
    <!-- Swing -->
    <line x1="180" y1="150" x2="220" y2="150" class="image" />
    <line x1="180" y1="150" x2="180" y2="170" class="image" />
    <line x1="220" y1="150" x2="220" y2="170" class="image" />
  </g>
</svg>