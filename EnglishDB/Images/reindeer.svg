<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reindeer</text>
  <text x="50" y="120" class="subtitle">[ˈraɪndɪr] n. 驯鹿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再) + ind (印第安) + -eer (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只驯鹿在雪地里奔跑，"再次(re-)"
    <tspan x="50" dy="25">穿越印第安(ind)的雪原，它就是驯鹿(reindeer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Santa Claus uses reindeer to pull his sleigh.
  </text>
  <text x="50" y="310" class="content">
    圣诞老人用驯鹿来拉他的雪橇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Reindeer body -->
    <ellipse cx="100" cy="100" rx="60" ry="40" class="image" />
    <!-- Reindeer head -->
    <circle cx="160" cy="80" r="20" class="image" />
    <!-- Reindeer legs -->
    <line x1="60" y1="140" x2="60" y2="180" class="image" />
    <line x1="140" y1="140" x2="140" y2="180" class="image" />
    <!-- Reindeer antlers -->
    <line x1="160" y1="60" x2="180" y2="40" class="image" />
    <line x1="160" y1="60" x2="140" y2="40" class="image" />
    <!-- Snow -->
    <circle cx="50" cy="200" r="10" class="image" />
    <circle cx="80" cy="210" r="10" class="image" />
    <circle cx="120" cy="200" r="10" class="image" />
    <circle cx="150" cy="210" r="10" class="image" />
  </g>
</svg>