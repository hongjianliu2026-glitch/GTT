<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">typical</text>
  <text x="50" y="120" class="subtitle">[ˈtɪpɪkl] adj. 典型的，有代表性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> typ- (类型) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"类型(typ-)"的标志，它代表了一个群体的"典型(typical)"特征。
    <tspan x="50" dy="25">这个标志就像一个标签，贴在每个符合该类型的人或物上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was a typical day at the office, filled with meetings and paperwork.
  </text>
  <text x="50" y="310" class="content">
    这是办公室里典型的一天，充满了会议和文书工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Type symbol -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <text x="20" y="60" class="content" fill="#7F8C8D">typ</text>
    <!-- Tag -->
    <line x1="120" y1="50" x2="220" y2="50" class="image" />
    <line x1="120" y1="50" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="220" y2="150" class="image" />
    <line x1="220" y1="50" x2="220" y2="150" class="image" />
    <text x="140" y="110" class="content" fill="#7F8C8D">typical</text>
  </g>
</svg>