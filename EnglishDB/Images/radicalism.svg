<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">radicalism</text>
  <text x="50" y="120" class="subtitle">[ˈrædɪkəlɪzəm] n. 激进主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> radical (根本的) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个激进分子站在高台上，手持扩音器，"从根本上(radical)"
    <tspan x="50" dy="25">改变现状，这种强烈的信念就是激进主义(radicalism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His radicalism led to significant social changes.
  </text>
  <text x="50" y="310" class="content">
    他的激进主义导致了重大的社会变革。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Radical figure -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="100" x2="220" y2="90" class="image" />
    <!-- Megaphone -->
    <polygon points="220,90 250,90 235,60" class="image" />
    <!-- Speech bubble -->
    <path d="M250,60 Q280,50 300,60 Q280,70 250,60" class="image" />
    <text x="260" y="65" class="content" text-anchor="middle">Change!</text>
  </g>
</svg>