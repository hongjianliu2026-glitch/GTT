<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">harvest</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrvɪst] n. 收获，收成；v. 收割</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> har- (军队) + vest (衣服)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象古代军队在战场上"收获(harvest)"战利品，
    <tspan x="50" dy="25">他们穿着战袍(vest)，满载而归。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmers are busy with the harvest season.
  </text>
  <text x="50" y="310" class="content">
    农民们正忙于收获季节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Crops -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <line x1="200" y1="20" x2="200" y2="100" class="image" />
    <line x1="250" y1="20" x2="250" y2="100" class="image" />
    <!-- Farmer -->
    <circle cx="30" cy="150" r="15" class="image" />
    <line x1="30" y1="165" x2="30" y2="190" class="image" />
    <line x1="30" y1="190" x2="10" y2="220" class="image" />
    <line x1="30" y1="190" x2="50" y2="220" class="image" />
    <line x1="30" y1="175" x2="60" y2="165" class="image" />
    <!-- Scythe -->
    <line x1="30" y1="165" x2="80" y2="100" class="image" />
  </g>
</svg>