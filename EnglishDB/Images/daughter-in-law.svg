<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">daughter-in-law</text>
  <text x="50" y="120" class="subtitle">[ˈdɔːtər ɪn lɔː] n. 儿媳妇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> daughter (女儿) + in-law (法律上的亲属)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭聚会，一个年轻女子站在儿子旁边，"法律上(in-law)"
    <tspan x="50" dy="25">成为这个家庭的一员，她就是儿媳妇(daughter-in-law)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My daughter-in-law is a wonderful cook.
  </text>
  <text x="50" y="310" class="content">
    我的儿媳妇是个很棒的厨师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family gathering -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Son -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Daughter-in-law -->
    <circle cx="120" cy="100" r="20" class="image" />
    <line x1="120" y1="120" x2="120" y2="160" class="image" />
    <line x1="120" y1="160" x2="100" y2="190" class="image" />
    <line x1="120" y1="160" x2="140" y2="190" class="image" />
    <line x1="120" y1="140" x2="150" y2="130" class="image" />
    <!-- Family connection -->
    <line x1="70" y1="120" x2="100" y2="120" class="image" />
  </g>
</svg>