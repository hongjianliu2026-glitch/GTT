<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wobbly</text>
  <text x="50" y="120" class="subtitle">[ˈwɒbli] adj. 摇晃的，不稳定的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wobble (摇晃) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摇摇晃晃的桌子，"摇晃(wobble)"
    <tspan x="50" dy="25">得让人担心它会倒下，这就是wobbly(摇晃的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wobbly chair made it hard to concentrate.
  </text>
  <text x="50" y="310" class="content">
    摇晃的椅子让人难以集中注意力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Legs -->
    <line x1="50" y1="200" x2="50" y2="300" class="image" />
    <line x1="150" y1="200" x2="150" y2="300" class="image" />
    <line x1="250" y1="200" x2="250" y2="300" class="image" />
    <line x1="350" y1="200" x2="350" y2="300" class="image" />
    <!-- Wobble effect -->
    <line x1="50" y1="300" x2="150" y2="300" class="image" />
    <line x1="150" y1="300" x2="250" y2="300" class="image" />
    <line x1="250" y1="300" x2="350" y2="300" class="image" />
    <!-- Wobble lines -->
    <line x1="50" y1="250" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="250" y2="250" class="image" />
    <line x1="250" y1="250" x2="350" y2="250" class="image" />
  </g>
</svg>