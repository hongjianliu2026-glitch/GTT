<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">burrow</text>
  <text x="50" y="120" class="subtitle">[ˈbʌroʊ] n. 地洞，洞穴；v. 挖洞，掘穴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> burr (根) + -ow (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小兔子在草地上，"掘地三尺(burr-ow)"
    <tspan x="50" dy="25">挖出一个温暖舒适的地洞(burrow)，准备过冬。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rabbit quickly burrowed into the ground to escape the predator.
  </text>
  <text x="50" y="310" class="content">
    兔子迅速挖洞钻入地下以躲避捕食者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Burrow entrance -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Rabbit -->
    <circle cx="175" cy="90" r="15" class="image" />
    <line x1="175" y1="105" x2="175" y2="140" class="image" />
    <line x1="175" y1="140" x2="160" y2="170" class="image" />
    <line x1="175" y1="140" x2="190" y2="170" class="image" />
    <line x1="175" y1="120" x2="200" y2="110" class="image" />
  </g>
</svg>