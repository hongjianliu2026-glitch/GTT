<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perennial</text>
  <text x="50" y="120" class="subtitle">[pəˈreniəl] adj. 常年的，长期的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (贯穿) + enn (年) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树，"贯穿(per-)"了无数个"年(enn)"，
    <tspan x="50" dy="25">它依然常青，这就是"常年的(perennial)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The perennial river flows through the valley.
  </text>
  <text x="50" y="310" class="content">
    这条常年河流穿过山谷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="30" y2="80" class="image" />
    <line x1="50" y1="50" x2="70" y2="80" class="image" />
    <line x1="50" y1="50" x2="20" y2="100" class="image" />
    <line x1="50" y1="50" x2="80" y2="100" class="image" />
    <!-- Leaves -->
    <circle cx="50" cy="50" r="20" fill="#27AE60" />
    <circle cx="30" cy="80" r="15" fill="#27AE60" />
    <circle cx="70" cy="80" r="15" fill="#27AE60" />
    <circle cx="20" cy="100" r="10" fill="#27AE60" />
    <circle cx="80" cy="100" r="10" fill="#27AE60" />
  </g>
</svg>