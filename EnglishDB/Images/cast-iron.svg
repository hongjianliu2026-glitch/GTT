<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .iron { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cast-iron</text>
  <text x="50" y="120" class="subtitle">[ˈkæst ˈaɪərn] n. 铸铁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cast (铸造) + iron (铁)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的铁匠铺，铁匠正在用"铸造(cast)"
    <tspan x="50" dy="25">的方式制作一个"铁(iron)"制的锅，这个锅就是铸铁锅(cast-iron)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cooked a delicious stew in her cast-iron pot.
  </text>
  <text x="50" y="310" class="content">
    她在她的铸铁锅里煮了一锅美味的炖菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Anvil -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cast-iron pot -->
    <rect x="50" y="20" width="250" height="160" class="iron" />
    <!-- Handle -->
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Fire -->
    <circle cx="20" cy="100" r="15" class="image" />
    <circle cx="30" cy="90" r="15" class="image" />
    <circle cx="40" cy="80" r="15" class="image" />
    <!-- Blacksmith -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>