<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fog { fill: #BDC3C7; opacity: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foggy</text>
  <text x="50" y="120" class="subtitle">[ˈfɒɡi] adj. 有雾的，模糊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fog (雾) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个清晨，大雾弥漫，"雾(fog)"
    <tspan x="50" dy="25">笼罩着整个城市，一切都变得模糊不清(foggy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mountain road was foggy and hard to navigate.
  </text>
  <text x="50" y="310" class="content">
    山间道路雾气弥漫，难以通行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Foggy city -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fog -->
    <rect x="50" y="20" width="250" height="160" class="fog" />
    <!-- Buildings -->
    <rect x="70" y="100" width="30" height="80" class="image" />
    <rect x="120" y="80" width="30" height="100" class="image" />
    <rect x="170" y="120" width="30" height="60" class="image" />
    <rect x="220" y="90" width="30" height="90" class="image" />
    <!-- Sun trying to shine through -->
    <circle cx="300" cy="50" r="20" class="image" />
    <line x1="300" y1="70" x2="300" y2="150" class="image" />
    <line x1="280" y1="110" x2="320" y2="110" class="image" />
  </g>
</svg>