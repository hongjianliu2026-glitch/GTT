<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deserving</text>
  <text x="50" y="120" class="subtitle">[dɪˈzɜːrvɪŋ] adj. 值得的，应得的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + serv (服务) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在辛勤工作，"强调服务(de-serv)"
    <tspan x="50" dy="25">后，终于得到了应得的奖励，这就是deserving。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After years of hard work, he felt deserving of the promotion.
  </text>
  <text x="50" y="310" class="content">
    经过多年的辛勤工作，他觉得自己应该得到晋升。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person working -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Reward -->
    <rect x="120" y="80" width="60" height="60" class="image" />
    <text x="130" y="115" class="content" fill="#27AE60">奖</text>
  </g>
</svg>