<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3F51B5; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #4CAF50; }
      .earth { fill: #8D6E63; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">organic</text>
  <text x="50" y="120" class="subtitle">[ɔːrˈɡænɪk] adj. 有机的，器官的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> organ (器官) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的有机农场，"器官(organ)"
    <tspan x="50" dy="25">般的植物在土壤中生长，这些植物就是有机的(organic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers to eat organic vegetables.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢食用有机蔬菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="80" class="earth" />
    <!-- Leaves -->
    <path d="M 50 100 Q 75 50 100 100 T 150 100" class="leaf" />
    <path d="M 50 120 Q 75 170 100 120 T 150 120" class="leaf" />
    <path d="M 50 140 Q 75 190 100 140 T 150 140" class="leaf" />
    <!-- Plant stem -->
    <line x1="100" y1="180" x2="100" y2="280" class="image" />
  </g>
</svg>