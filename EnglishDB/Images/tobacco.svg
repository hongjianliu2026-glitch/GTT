<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tobacco</text>
  <text x="50" y="120" class="subtitle">[təˈbækoʊ] n. 烟草</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tabac (烟草)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的印第安人，手持一片巨大的"烟草叶(tabac)"，
    <tspan x="50" dy="25">这片叶子大到可以遮住整个天空，象征着烟草的广泛使用和重要性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He rolled a cigarette with some tobacco he had bought.
  </text>
  <text x="50" y="310" class="content">
    他用买来的烟草卷了一支烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tobacco leaf -->
    <path d="M50,50 C100,0 150,0 200,50 S300,100 350,50" class="image" />
    <!-- Indian figure -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="140" y2="180" class="image" />
    <!-- Tobacco leaf in hand -->
    <path d="M100,220 C150,200 200,200 250,220 S350,240 400,220" class="image" />
  </g>
</svg>