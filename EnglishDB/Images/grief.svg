<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #7E5109; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #1B4F72; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grief</text>
  <text x="50" y="120" class="subtitle">[ɡriːf] n. 悲痛，悲伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gri- (抓住) + -ef (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"抓住(gri-)"了心，
    <tspan x="50" dy="25">无法摆脱的悲伤(grief)紧紧缠绕着他。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loss of her pet caused her great grief.
  </text>
  <text x="50" y="310" class="content">
    她失去了宠物，感到非常悲痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 C50,25 90,25 90,50 S130,75 130,50 C130,25 170,25 170,50 S210,75 210,50 C210,25 250,25 250,50 S290,75 290,50" class="image" />
    <!-- Hand grabbing the heart -->
    <line x1="50" y1="50" x2="30" y2="30" class="image" />
    <line x1="90" y1="50" x2="70" y2="30" class="image" />
    <line x1="130" y1="50" x2="110" y2="30" class="image" />
    <line x1="170" y1="50" x2="150" y2="30" class="image" />
    <line x1="210" y1="50" x2="190" y2="30" class="image" />
    <line x1="250" y1="50" x2="230" y2="30" class="image" />
    <line x1="290" y1="50" x2="270" y2="30" class="image" />
  </g>
</svg>