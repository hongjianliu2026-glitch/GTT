<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">picnic</text>
  <text x="50" y="120" class="subtitle">[ˈpɪknɪk] n. 野餐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pic (画) + nic (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一个美丽的"画(pic)"中"地方(nic)"，
    <tspan x="50" dy="25">享受着阳光和美食，这就是野餐(picnic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had a delightful picnic by the lake.
  </text>
  <text x="50" y="310" class="content">
    我们在湖边进行了一次愉快的野餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tree -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="30" y1="60" x2="70" y2="60" class="image" />
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="45" y1="80" x2="55" y2="80" class="image" />
    <!-- Picnic blanket -->
    <rect x="100" y="120" width="150" height="50" class="image" />
    <!-- Food -->
    <circle cx="120" cy="140" r="10" class="image" />
    <circle cx="140" cy="140" r="10" class="image" />
    <circle cx="160" cy="140" r="10" class="image" />
    <!-- People -->
    <circle cx="200" cy="140" r="15" class="image" />
    <line x1="200" y1="155" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="165" x2="230" y2="155" class="image" />
  </g>
</svg>