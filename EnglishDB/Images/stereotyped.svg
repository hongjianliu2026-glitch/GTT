<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stereotyped</text>
  <text x="50" y="120" class="subtitle">[ˈsteriətaɪpt] adj. 刻板的，老套的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stereo- (固定的) + type (类型)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被"固定类型(stereo-type)"的人，
    <tspan x="50" dy="25">他的形象和行为都被严格定义，无法改变。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The character in the movie was stereotyped as a villain.
  </text>
  <text x="50" y="310" class="content">
    电影中的角色被刻板地定义为反派。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fixed type -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Fixed label -->
    <rect x="120" y="80" width="100" height="40" class="image" />
    <text x="130" y="105" class="content">Fixed</text>
  </g>
</svg>