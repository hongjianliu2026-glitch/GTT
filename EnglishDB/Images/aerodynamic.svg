<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aerodynamic</text>
  <text x="50" y="120" class="subtitle">[ˌɛəroʊdaɪˈnæmɪk] adj. 空气动力学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aero- (空气) + dynamic (动力)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机在空中翱翔，"空气(aero)"
    <tspan x="50" dy="25">和"动力(dynamic)"完美结合，</tspan>
    <tspan x="50" dy="25">使得飞机能够高效飞行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car's design was optimized for aerodynamic efficiency.
  </text>
  <text x="50" y="310" class="content">
    这辆车的设计是为了优化空气动力学效率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane -->
    <polygon points="0,0 100,50 100,150 0,200" class="image" />
    <line x1="100" y1="50" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="200" y2="100" class="image" />
    <!-- Air flow -->
    <path d="M200,100 Q250,50 300,100 T400,100" class="image" />
    <path d="M200,100 Q250,150 300,100 T400,100" class="image" />
  </g>
</svg>