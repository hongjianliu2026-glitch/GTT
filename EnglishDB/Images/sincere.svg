<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sincere</text>
  <text x="50" y="120" class="subtitle">[sɪnˈsɪər] adj. 真诚的，诚挚的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sine (拉丁语，无) + cera (蜡)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人说话时，"没有蜡(sine-cera)"
    <tspan x="50" dy="25">在嘴里，表示他说的都是真心的，没有掩饰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave a sincere apology for her mistake.
  </text>
  <text x="50" y="310" class="content">
    她为她的错误真诚地道歉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person speaking -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M 100 100 Q 150 80 200 100 Q 250 120 200 140 Q 150 160 100 140 Z" class="image" />
    <text x="120" y="120" class="content" fill="#34495E">真心的</text>
  </g>
</svg>