<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ovarian</text>
  <text x="50" y="120" class="subtitle">[əʊˈveəriən] adj. 卵巢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ovari (卵巢) + -an (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的卵巢(ovari)悬浮在空中，
    <tspan x="50" dy="25">周围环绕着无数的小卵子，这就是"卵巢的(ovarian)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was diagnosed with ovarian cancer last year.
  </text>
  <text x="50" y="310" class="content">
    她去年被诊断出患有卵巢癌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ovary -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eggs -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="70" cy="120" r="10" class="image" />
    <circle cx="130" cy="120" r="10" class="image" />
  </g>
</svg>