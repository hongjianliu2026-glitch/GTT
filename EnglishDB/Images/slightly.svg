<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slightly</text>
  <text x="50" y="120" class="subtitle">[ˈslaɪtli] adv. 稍微，轻微地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slight (轻微的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人轻轻地抬起一根羽毛，"轻微地(slight-ly)"
    <tspan x="50" dy="25">移动，仿佛生怕惊动了什么。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She smiled slightly when she heard the news.
  </text>
  <text x="50" y="310" class="content">
    她听到消息时微微一笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Feather -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="140" y2="40" class="image" />
    <line x1="150" y1="50" x2="140" y2="60" class="image" />
    <line x1="150" y1="50" x2="130" y2="30" class="image" />
    <line x1="150" y1="50" x2="130" y2="70" class="image" />
    <line x1="150" y1="50" x2="120" y2="20" class="image" />
    <line x1="150" y1="50" x2="120" y2="80" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Hand lifting feather -->
    <line x1="20" y1="150" x2="50" y2="50" class="image" />
  </g>
</svg>