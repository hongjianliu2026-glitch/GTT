<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">awfully</text>
  <text x="50" y="120" class="subtitle">[ˈɔːfəli] adv. 非常，极其</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (强调) + wful (可怕的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"非常可怕(awful)"的事情吓到，
    <tspan x="50" dy="25">表情扭曲，这就是"非常(awfully)"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was awfully tired after the long journey.
  </text>
  <text x="50" y="310" class="content">
    长途旅行后，她非常疲惫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
    <!-- Exclamation mark -->
    <text x="160" y="120" class="image" font-size="60">!</text>
  </g>
</svg>