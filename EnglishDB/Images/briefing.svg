<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">briefing</text>
  <text x="50" y="120" class="subtitle">[ˈbriːfɪŋ] n. 简报，简要介绍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brief (简短的) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位领导站在讲台上，"简短地(brief)"
    <tspan x="50" dy="25">向员工们介绍重要信息，这就是简报(briefing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager gave a briefing on the new project.
  </text>
  <text x="50" y="310" class="content">
    经理对新项目进行了简报。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Podium -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="155" y2="150" class="image" />
    <line x1="175" y1="120" x2="195" y2="150" class="image" />
    <line x1="175" y1="90" x2="205" y2="80" class="image" />
    <!-- Microphone -->
    <line x1="175" y1="70" x2="175" y2="100" class="image" />
    <line x1="170" y1="100" x2="180" y2="100" class="image" />
    <!-- Audience -->
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
    <circle cx="200" cy="180" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
    <circle cx="300" cy="180" r="10" class="image" />
  </g>
</svg>