<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">learner</text>
  <text x="50" y="120" class="subtitle">[ˈlɜːrnər] n. 学习者，初学者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> learn (学习) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个初学者(learner)坐在书桌前，"学习(learn)"
    <tspan x="50" dy="25">新知识，他的眼睛闪烁着好奇的光芒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a quick learner and grasps new concepts easily.
  </text>
  <text x="50" y="310" class="content">
    她是一个学习速度很快的人，能轻松掌握新概念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Book -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Light bulb -->
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Lines inside light bulb -->
    <line x1="235" y1="90" x2="265" y2="90" class="image" />
    <line x1="235" y1="110" x2="265" y2="110" class="image" />
    <!-- Learner -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
  </g>
</svg>