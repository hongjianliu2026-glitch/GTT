<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lace</text>
  <text x="50" y="120" class="subtitle">[leɪs] n. 花边，鞋带；v. 用花边装饰，系鞋带</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lac (网)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个精致的网(lac)，上面装饰着美丽的花边(lace)，
    <tspan x="50" dy="25">就像一个优雅的舞者系着她的鞋带(lace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a dress with intricate lace patterns.
  </text>
  <text x="50" y="310" class="content">
    她穿了一件带有复杂花边图案的裙子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lace pattern -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image" />
    <path d="M50,100 Q100,70 150,100 T250,100" class="image" />
    <path d="M50,150 Q100,120 150,150 T250,150" class="image" />
    <!-- Shoe with laces -->
    <rect x="100" y="200" width="100" height="50" class="image" />
    <line x1="120" y1="200" x2="120" y2="180" class="image" />
    <line x1="140" y1="200" x2="140" y2="180" class="image" />
    <line x1="160" y1="200" x2="160" y2="180" class="image" />
    <line x1="180" y1="200" x2="180" y2="180" class="image" />
    <line x1="120" y1="180" x2="180" y2="180" class="image" />
  </g>
</svg>