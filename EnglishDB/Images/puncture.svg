<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">puncture</text>
  <text x="50" y="120" class="subtitle">[ˈpʌŋktʃər] n. 刺穿，穿孔；v. 刺穿，穿孔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> punct (点) + ure (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，突然被一根针"刺穿(puncture)"，
    <tspan x="50" dy="25">气球瞬间瘪了下去，留下一个小小的洞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nail punctured the tire of the bicycle.
  </text>
  <text x="50" y="310" class="content">
    钉子刺穿了自行车的轮胎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Needle -->
    <line x1="50" y1="100" x2="200" y2="100" class="image" />
    <!-- Hole -->
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Deflated balloon -->
    <ellipse cx="175" cy="150" rx="100" ry="50" class="image" />
  </g>
</svg>