<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compulsion</text>
  <text x="50" y="120" class="subtitle">[kəmˈpʌlʃn] n. 强迫，强制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + puls (推) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被无形的力量"一起推着(com-puls)"，
    <tspan x="50" dy="25">无法抗拒地去做某事，这就是强迫(compulsion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He felt a compulsion to check his phone every few minutes.
  </text>
  <text x="50" y="310" class="content">
    他感到一种强迫，每隔几分钟就要检查手机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Invisible force pushing -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="250" y1="50" x2="150" y2="150" class="image" />
    <!-- Person being pushed -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="250" class="image" />
    <line x1="150" y1="220" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="120" y2="180" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />
  </g>
</svg>