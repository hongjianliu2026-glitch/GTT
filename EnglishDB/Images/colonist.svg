<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">colonist</text>
  <text x="50" y="120" class="subtitle">[ˈkɒlənɪst] n. 殖民者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> colon (殖民) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的"殖民者(colonist)"，
    <tspan x="50" dy="25">他带着一袋种子，在一片荒芜的土地上</tspan>
    <tspan x="50" dy="25">开始种植，逐渐建立起一个新的家园。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The colonists established a new settlement on the island.
  </text>
  <text x="50" y="310" class="content">
    殖民者们在岛上建立了一个新的定居点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Colonist -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="100" class="image" />
    <line x1="50" y1="90" x2="80" y2="100" class="image" />
    <!-- Bag of seeds -->
    <rect x="30" y="130" width="40" height="20" class="image" />
    <!-- Land -->
    <rect x="0" y="160" width="100" height="50" class="image" />
    <!-- Planted seeds -->
    <circle cx="20" cy="180" r="5" class="image" />
    <circle cx="40" cy="180" r="5" class="image" />
    <circle cx="60" cy="180" r="5" class="image" />
    <circle cx="80" cy="180" r="5" class="image" />
  </g>
</svg>