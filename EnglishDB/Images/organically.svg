<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">organically</text>
  <text x="50" y="120" class="subtitle">[ɔːrˈɡænɪkli] adv. 有机地，自然地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> organ (器官) + -ic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂盛的农田，"器官(organ)"般的植物
    <tspan x="50" dy="25">自然生长，没有化学物质的干扰，这就是有机(organically)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They grow their vegetables organically.
  </text>
  <text x="50" y="310" class="content">
    他们有机地种植蔬菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Plants -->
    <line x1="50" y1="180" x2="50" y2="100" class="image" />
    <line x1="70" y1="180" x2="70" y2="120" class="image" />
    <line x1="90" y1="180" x2="90" y2="140" class="image" />
    <line x1="110" y1="180" x2="110" y2="160" class="image" />
    <line x1="130" y1="180" x2="130" y2="180" class="image" />
    <!-- Sun -->
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Clouds -->
    <ellipse cx="250" cy="70" rx="40" ry="20" class="image" />
    <ellipse cx="300" cy="50" rx="30" ry="15" class="image" />
  </g>
</svg>