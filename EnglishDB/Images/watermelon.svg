<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .watermelon { fill: #FF5733; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">watermelon</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːtərmelən] n. 西瓜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> water (水) + melon (瓜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的西瓜，里面充满了水分(water)，
    <tspan x="50" dy="25">就像一个装满水的瓜(melon)，这就是西瓜(watermelon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cut the watermelon into slices and shared with everyone.
  </text>
  <text x="50" y="310" class="content">
    她把西瓜切成片，和大家分享。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Watermelon -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="watermelon" />
    <!-- Seeds -->
    <circle cx="100" cy="80" r="5" class="image" />
    <circle cx="150" cy="90" r="5" class="image" />
    <circle cx="200" cy="70" r="5" class="image" />
    <circle cx="250" cy="85" r="5" class="image" />
    <circle cx="300" cy="95" r="5" class="image" />
  </g>
</svg>