<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">latent</text>
  <text x="50" y="120" class="subtitle">[ˈleɪtnt] adj. 潜在的，隐伏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lat (隐藏) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个隐藏在冰山下的巨大冰块，"隐藏(lat)"
    <tspan x="50" dy="25">在表面之下，这就是潜在的(latent)力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The latent talent of the young artist was finally discovered.
  </text>
  <text x="50" y="310" class="content">
    这位年轻艺术家的潜在才能终于被发现了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Iceberg -->
    <polygon points="0,200 150,200 100,100 50,100" class="image" />
    <!-- Hidden part -->
    <polygon points="50,100 100,100 75,50" class="image" />
    <!-- Water -->
    <line x1="0" y1="200" x2="300" y2="200" class="image" />
    <line x1="0" y1="210" x2="300" y2="210" class="image" />
    <line x1="0" y1="220" x2="300" y2="220" class="image" />
    <line x1="0" y1="230" x2="300" y2="230" class="image" />
    <line x1="0" y1="240" x2="300" y2="240" class="image" />
  </g>
</svg>