<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">equalize</text>
  <text x="50" y="120" class="subtitle">[ˈiːkwəlaɪz] v. 使相等，使平等</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> equ (平等) + -al (形容词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，两边的重量"平等(equ)"，
    <tspan x="50" dy="25">通过调整使两边完全平衡，这就是"使相等(equalize)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government aims to equalize educational opportunities for all children.
  </text>
  <text x="50" y="310" class="content">
    政府旨在为所有儿童提供平等的教育机会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
    <!-- Weights -->
    <rect x="20" y="120" width="20" height="40" class="image" />
    <rect x="60" y="120" width="20" height="40" class="image" />
    <!-- Equal sign -->
    <line x1="120" y1="100" x2="160" y2="100" class="image" />
    <line x1="120" y1="120" x2="160" y2="120" class="image" />
  </g>
</svg>