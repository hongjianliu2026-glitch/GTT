<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insane</text>
  <text x="50" y="120" class="subtitle">[ɪnˈseɪn] adj. 疯狂的，精神错乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + sane (健全的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"不健全(in-sane)"的思维所困扰，
    <tspan x="50" dy="25">他的大脑像被扭曲的线团缠绕，完全失去了理智。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The idea of jumping off the cliff seemed insane to him.
  </text>
  <text x="50" y="310" class="content">
    对他来说，跳下悬崖的想法简直是疯了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Twisted lines -->
    <path d="M 20 100 Q 50 50 100 100 T 180 100" class="image" />
    <path d="M 20 100 Q 50 150 100 100 T 180 100" class="image" />
    <path d="M 20 100 Q 50 75 100 100 T 180 100" class="image" />
    <path d="M 20 100 Q 50 125 100 100 T 180 100" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>