<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
      .flower { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blooming</text>
  <text x="50" y="120" class="subtitle">[ˈbluːmɪŋ] adj. 盛开的，繁荣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bloom (花) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵花在阳光下"盛开(blooming)"，
    <tspan x="50" dy="25">花瓣绽放，色彩鲜艳，象征着生命的繁荣与美丽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden is blooming with colorful flowers.
  </text>
  <text x="50" y="310" class="content">
    花园里开满了五颜六色的花。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="image" fill="#F39C12" />
    <!-- Flower -->
    <circle cx="200" cy="100" r="20" class="flower" />
    <circle cx="230" cy="100" r="20" class="flower" />
    <circle cx="215" cy="70" r="20" class="flower" />
    <circle cx="215" cy="130" r="20" class="flower" />
    <circle cx="185" cy="100" r="20" class="flower" />
    <!-- Stem -->
    <line x1="215" y1="150" x2="215" y2="250" class="image" />
    <!-- Leaves -->
    <path d="M215,250 Q200,230 185,250" class="image" />
    <path d="M215,250 Q230,230 245,250" class="image" />
  </g>
</svg>