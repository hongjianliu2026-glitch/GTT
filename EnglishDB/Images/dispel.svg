<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dispel</text>
  <text x="50" y="120" class="subtitle">[dɪˈspel] v. 驱散，消除</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (离开) + pel (推)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔法师挥动魔杖，"推开(pel)"
    <tspan x="50" dy="25">乌云，让阳光重新照耀大地，驱散(dispel)了阴霾。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's spell dispelled the darkness.
  </text>
  <text x="50" y="310" class="content">
    魔法师的咒语驱散了黑暗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="100" r="50" class="image" />
    <!-- Wand -->
    <line x1="100" y1="150" x2="250" y2="50" class="image" />
    <!-- Magic effect -->
    <line x1="150" y1="100" x2="300" y2="100" class="image" />
    <line x1="150" y1="100" x2="225" y2="50" class="image" />
    <line x1="150" y1="100" x2="225" y2="150" class="image" />
  </g>
</svg>