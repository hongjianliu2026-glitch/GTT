<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clothesline</text>
  <text x="50" y="120" class="subtitle">[ˈkloʊðzlaɪn] n. 晾衣绳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cloth (布) + line (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条长长的线(line)上挂满了各种衣物(cloth)，
    <tspan x="50" dy="25">就像一条五彩斑斓的晾衣绳(clothesline)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hung her laundry on the clothesline.
  </text>
  <text x="50" y="310" class="content">
    她把洗好的衣服挂在了晾衣绳上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Clothesline -->
    <line x1="50" y1="50" x2="500" y2="50" class="image" />
    <!-- Clothes -->
    <rect x="100" y="20" width="50" height="60" class="image" />
    <rect x="200" y="20" width="50" height="60" class="image" />
    <rect x="300" y="20" width="50" height="60" class="image" />
    <rect x="400" y="20" width="50" height="60" class="image" />
    <!-- Pegs -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <circle cx="300" cy="50" r="5" class="image" />
    <circle cx="400" cy="50" r="5" class="image" />
  </g>
</svg>