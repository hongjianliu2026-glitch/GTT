<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">worthy</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrði] adj. 值得的，有价值的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> worth (价值) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的奖杯，上面刻着"worth(价值)"，
    <tspan x="50" dy="25">旁边站着一个人，自豪地说："我是worthy(值得的)！"</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His efforts were worthy of praise.
  </text>
  <text x="50" y="310" class="content">
    他的努力值得称赞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Trophy -->
    <path d="M50 100 L100 50 L150 100 Z" class="image" />
    <rect x="75" y="100" width="50" height="100" class="image" />
    <!-- Person -->
    <circle cx="125" cy="250" r="20" class="image" />
    <line x1="125" y1="270" x2="125" y2="320" class="image" />
    <line x1="125" y1="320" x2="105" y2="350" class="image" />
    <line x1="125" y1="320" x2="145" y2="350" class="image" />
    <line x1="125" y1="290" x2="155" y2="280" class="image" />
    <text x="115" y="240" class="content">"worthy"</text>
  </g>
</svg>