<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resident</text>
  <text x="50" y="120" class="subtitle">[ˈrɛzɪdənt] n. 居民，住户</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sid (坐) + -ent (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个居民，他"再次坐(re-sid)"在家中，享受着宁静的生活，
    <tspan x="50" dy="25">这就是居民(resident)的日常。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The local residents were concerned about the new development.
  </text>
  <text x="50" y="310" class="content">
    当地居民对新开发项目感到担忧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <!-- Door -->
    <rect x="80" y="100" width="40" height="50" class="image" />
    <!-- Resident -->
    <circle cx="100" cy="80" r="15" class="image" />
    <line x1="100" y1="95" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="140" class="image" />
    <line x1="100" y1="120" x2="120" y2="140" class="image" />
    <line x1="100" y1="105" x2="130" y2="95" class="image" />
  </g>
</svg>