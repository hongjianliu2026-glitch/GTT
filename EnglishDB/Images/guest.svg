<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">guest</text>
  <text x="50" y="120" class="subtitle">[ɡɛst] n. 客人，宾客</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gue- (来) + st (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个客人站在门口，"来(gue-)"
    <tspan x="50" dy="25">到你家，准备进入(st)，这就是客人(guest)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We welcomed our guests with open arms.
  </text>
  <text x="50" y="310" class="content">
    我们张开双臂欢迎我们的客人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Guest -->
    <circle cx="75" cy="100" r="20" class="image" />
    <line x1="75" y1="120" x2="75" y2="180" class="image" />
    <line x1="75" y1="180" x2="55" y2="220" class="image" />
    <line x1="75" y1="180" x2="95" y2="220" class="image" />
    <line x1="75" y1="140" x2="110" y2="120" class="image" />
  </g>
</svg>