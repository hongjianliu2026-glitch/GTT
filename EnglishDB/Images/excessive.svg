<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">excessive</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsesɪv] adj. 过多的，过度的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + cess (走) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走出了(ex-)正常的界限(cess)，
    <tspan x="50" dy="25">结果变得"过多(excessive)"，就像一个巨大的气球，</tspan>
    <tspan x="50" dy="25">因为充气太多而快要爆炸了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The party was ruined by excessive noise.
  </text>
  <text x="50" y="310" class="content">
    派对被过度的噪音毁了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="180" x2="100" y2="300" class="image" />
    <!-- Exclamation marks -->
    <text x="70" y="80" class="highlight">!</text>
    <text x="130" y="80" class="highlight">!</text>
    <text x="100" y="110" class="highlight">!</text>
  </g>
</svg>