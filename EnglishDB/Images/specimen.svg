<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">specimen</text>
  <text x="50" y="120" class="subtitle">[ˈspesɪmən] n. 样本，标本</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> speci (看) + men (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"仔细观察(speci-men)"
    <tspan x="50" dy="25">一个生物样本，这个样本就是标本(specimen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The biologist collected several specimens for study.
  </text>
  <text x="50" y="310" class="content">
    生物学家收集了几个标本用于研究。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Microscope -->
    <rect x="70" y="80" width="100" height="50" class="image" />
    <line x1="120" y1="80" x2="120" y2="30" class="image" />
    <line x1="120" y1="30" x2="100" y2="10" class="image" />
    <line x1="120" y1="30" x2="140" y2="10" class="image" />
    <!-- Specimen -->
    <rect x="100" y="140" width="50" height="30" class="image" />
    <line x1="125" y1="140" x2="125" y2="170" class="image" />
    <line x1="125" y1="170" x2="100" y2="190" class="image" />
    <line x1="125" y1="170" x2="150" y2="190" class="image" />
  </g>
</svg>