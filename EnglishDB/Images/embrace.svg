<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">embrace</text>
  <text x="50" y="120" class="subtitle">[ɪmˈbreɪs] v. 拥抱，接受</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (进入) + brace (手臂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人张开双臂，"进入(em-)"
    <tspan x="50" dy="25">对方的"手臂(brace)"，这就是拥抱(embrace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She eagerly embraced the new idea.
  </text>
  <text x="50" y="310" class="content">
    她热情地接受了新想法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Arms -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <!-- Body -->
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Hugging -->
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />
  </g>
</svg>