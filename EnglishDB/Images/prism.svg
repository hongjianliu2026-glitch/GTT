<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prism</text>
  <text x="50" y="120" class="subtitle">[ˈprɪzəm] n. 棱镜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pris- (抓住) + -m (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的棱镜"抓住(pris-)"了阳光，
    <tspan x="50" dy="25">将它分解成七彩的光谱，形成了一道彩虹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The prism split the sunlight into a spectrum of colors.
  </text>
  <text x="50" y="310" class="content">
    棱镜将阳光分解成了一道彩虹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Prism -->
    <polygon points="0,0 150,0 150,100 0,100" class="image" />
    <polygon points="0,0 150,0 100,50" class="image" />
    <polygon points="0,100 150,100 100,50" class="image" />
    <!-- Rainbow -->
    <polyline points="160,50 200,50 240,50 280,50 320,50 360,50 400,50" class="image" stroke-dasharray="10,5" />
    <polyline points="160,55 200,55 240,55 280,55 320,55 360,55 400,55" class="image" stroke-dasharray="10,5" />
    <polyline points="160,60 200,60 240,60 280,60 320,60 360,60 400,60" class="image" stroke-dasharray="10,5" />
    <polyline points="160,65 200,65 240,65 280,65 320,65 360,65 400,65" class="image" stroke-dasharray="10,5" />
    <polyline points="160,70 200,70 240,70 280,70 320,70 360,70 400,70" class="image" stroke-dasharray="10,5" />
    <polyline points="160,75 200,75 240,75 280,75 320,75 360,75 400,75" class="image" stroke-dasharray="10,5" />
    <polyline points="160,80 200,80 240,80 280,80 320,80 360,80 400,80" class="image" stroke-dasharray="10,5" />
  </g>
</svg>