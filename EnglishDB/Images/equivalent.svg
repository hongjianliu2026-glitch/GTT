<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">equivalent</text>
  <text x="50" y="120" class="subtitle">[ɪˈkwɪvələnt] adj. 相等的，等价的；n. 等价物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> equi- (相等) + val (价值) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个天平秤，"相等的价值(equi-val)"
    <tspan x="50" dy="25">在两边，它们完全平衡，这就是等价物(equivalent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two proposals are equivalent in terms of cost.
  </text>
  <text x="50" y="310" class="content">
    这两个提案在成本上是等价的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Balance scale -->
    <line x1="100" y1="50" x2="300" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <!-- Weights on both sides -->
    <circle cx="150" cy="150" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <!-- Equal sign -->
    <line x1="200" y1="200" x2="250" y2="200" class="image" />
    <line x1="200" y1="220" x2="250" y2="220" class="image" />
  </g>
</svg>