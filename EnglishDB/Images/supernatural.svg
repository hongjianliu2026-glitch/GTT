<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supernatural</text>
  <text x="50" y="120" class="subtitle">[ˌsuːpərˈnætʃrəl] adj. 超自然的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (超过) + nature (自然)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幽灵从天而降，"超过(super-)"
    <tspan x="50" dy="25">自然界的存在，这就是超自然(supernatural)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many people believe in supernatural phenomena.
  </text>
  <text x="50" y="310" class="content">
    许多人相信超自然现象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ghost -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="80" ry="30" class="image" />
    <ellipse cx="250" cy="70" rx="90" ry="40" class="image" />
  </g>
</svg>