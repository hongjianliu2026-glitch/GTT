<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psychoanalysis</text>
  <text x="50" y="120" class="subtitle">[ˌsaɪkoʊəˈnæləsɪs] n. 精神分析</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psycho- (精神) + analysis (分析)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心理学家在用"精神(psycho-)"
    <tspan x="50" dy="25">的放大镜"分析(analysis)"病人的内心世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She underwent psychoanalysis to understand her anxiety.
  </text>
  <text x="50" y="310" class="content">
    她接受了精神分析以理解她的焦虑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Psychoanalyst -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Magnifying glass -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="150" y2="130" class="image" />
    <!-- Brain -->
    <path d="M180,80 C180,120 220,120 220,80" class="image" />
    <line x1="180" y1="80" x2="220" y2="80" class="image" />
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
    <line x1="180" y1="120" x2="220" y2="120" class="image" />
  </g>
</svg>