<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">counterculture</text>
  <text x="50" y="120" class="subtitle">[ˈkaʊntərˌkʌltʃər] n. 反主流文化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> counter- (反对) + culture (文化)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群年轻人穿着奇装异服，"反对(counter-)"
    <tspan x="50" dy="25">主流文化(culture)，他们形成了独特的反主流文化(counterculture)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hippie movement was a significant counterculture in the 1960s.
  </text>
  <text x="50" y="310" class="content">
    嬉皮士运动是20世纪60年代的一个重要反主流文化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mainstream culture -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Counterculture -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Mainstream people -->
    <circle cx="70" cy="50" r="15" class="image" />
    <circle cx="120" cy="50" r="15" class="image" />
    <circle cx="170" cy="50" r="15" class="image" />
    <!-- Counterculture people -->
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="130" cy="100" r="15" class="image" />
    <circle cx="180" cy="100" r="15" class="image" />
    <!-- Mainstream clothes -->
    <line x1="70" y1="65" x2="70" y2="80" class="image" />
    <line x1="120" y1="65" x2="120" y2="80" class="image" />
    <line x1="170" y1="65" x2="170" y2="80" class="image" />
    <!-- Counterculture clothes -->
    <line x1="80" y1="115" x2="80" y2="130" class="image" />
    <line x1="130" y1="115" x2="130" y2="130" class="image" />
    <line x1="180" y1="115" x2="180" y2="130" class="image" />
    <!-- Mainstream vs Counterculture -->
    <line x1="70" y1="80" x2="80" y2="115" class="image" />
    <line x1="120" y1="80" x2="130" y2="115" class="image" />
    <line x1="170" y1="80" x2="180" y2="115" class="image" />
  </g>
</svg>