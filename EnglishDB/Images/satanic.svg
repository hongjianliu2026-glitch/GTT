<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">satanic</text>
  <text x="50" y="120" class="subtitle">[səˈtænɪk] adj. 撒旦的，魔鬼的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> satan (撒旦) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑暗的房间里，"撒旦(satan)"
    <tspan x="50" dy="25">的影子在墙上舞动，散发出邪恶的气息(satanic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The satanic rituals were performed in the abandoned church.
  </text>
  <text x="50" y="310" class="content">
    撒旦仪式在废弃的教堂里举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Shadow of Satan -->
    <path d="M50 20 C100 100, 250 100, 300 20" class="image" />
    <path d="M50 20 L100 100 L250 100 L300 20" class="image" />
    <!-- Evil eyes -->
    <circle cx="120" cy="60" r="10" class="image" />
    <circle cx="230" cy="60" r="10" class="image" />
  </g>
</svg>