<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dumbfound</text>
  <text x="50" y="120" class="subtitle">[dʌmˈfaʊnd] v. 使惊呆，使哑口无言</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dumb (哑的) + found (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被突如其来的消息惊呆了，"哑口无言(dumb)"，
    <tspan x="50" dy="25">完全无法说话，就像被"使(found)"成了哑巴一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's trick dumbfounded the audience.
  </text>
  <text x="50" y="310" class="content">
    魔术师的把戏让观众惊呆了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with open mouth -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Open mouth -->
    <path d="M 40 120 Q 50 140 60 120" class="image" />
    <!-- Speech bubble -->
    <path d="M 100 80 Q 150 50 200 80 Q 150 110 100 80" class="image" />
    <text x="120" y="85" class="content" fill="#34495E">??</text>
  </g>
</svg>