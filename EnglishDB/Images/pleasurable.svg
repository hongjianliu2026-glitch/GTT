<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pleasurable</text>
  <text x="50" y="120" class="subtitle">[ˈplɛʒərəbl] adj. 令人愉快的，舒适的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pleas(e) (愉快) + -ure (名词后缀) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阳光明媚的下午，你躺在舒适的躺椅上，
    <tspan x="50" dy="25">享受着温暖的阳光和轻柔的海风，这种感觉就是"令人愉快的(pleasurable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beach vacation was highly pleasurable.
  </text>
  <text x="50" y="310" class="content">
    海滩度假非常令人愉快。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" class="image" fill="#F1C40F" />
    <!-- Beach chair -->
    <rect x="100" y="50" width="150" height="50" class="image" fill="#D35400" />
    <rect x="120" y="100" width="110" height="50" class="image" fill="#D35400" />
    <!-- Person -->
    <circle cx="175" cy="130" r="20" class="image" fill="#2ECC71" />
    <line x1="175" y1="150" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="210" class="image" />
    <line x1="175" y1="180" x2="195" y2="210" class="image" />
    <line x1="175" y1="160" x2="205" y2="150" class="image" />
  </g>
</svg>