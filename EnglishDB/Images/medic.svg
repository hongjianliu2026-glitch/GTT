<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">medic</text>
  <text x="50" y="120" class="subtitle">[ˈmedɪk] n. 医生，医疗兵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> med (治疗) + -ic (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战场上的医疗兵，手持医疗包，"治疗(med)"
    <tspan x="50" dy="25">受伤的士兵，他就是那个"医疗人(medic)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The medic quickly bandaged the soldier's wound.
  </text>
  <text x="50" y="310" class="content">
    医疗兵迅速包扎了士兵的伤口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Medical bag -->
    <rect x="0" y="0" width="100" height="80" class="image" />
    <line x1="20" y1="20" x2="80" y2="20" class="image" />
    <line x1="20" y1="40" x2="80" y2="40" class="image" />
    <line x1="20" y1="60" x2="80" y2="60" class="image" />
    <!-- Medic -->
    <circle cx="150" cy="40" r="20" class="image" />
    <line x1="150" y1="60" x2="150" y2="100" class="image" />
    <line x1="150" y1="80" x2="130" y2="100" class="image" />
    <line x1="150" y1="80" x2="170" y2="100" class="image" />
    <line x1="150" y1="100" x2="120" y2="130" class="image" />
    <line x1="150" y1="100" x2="180" y2="130" class="image" />
    <!-- Soldier -->
    <circle cx="250" cy="40" r="20" class="image" />
    <line x1="250" y1="60" x2="250" y2="100" class="image" />
    <line x1="250" y1="80" x2="230" y2="100" class="image" />
    <line x1="250" y1="80" x2="270" y2="100" class="image" />
    <line x1="250" y1="100" x2="220" y2="130" class="image" />
    <line x1="250" y1="100" x2="280" y2="130" class="image" />
    <!-- Wound -->
    <line x1="250" y1="120" x2="250" y2="140" class="image" />
    <line x1="240" y1="130" x2="260" y2="130" class="image" />
  </g>
</svg>