<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">principled</text>
  <text x="50" y="120" class="subtitle">[ˈprɪnsəpld] adj. 有原则的，原则性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prin- (第一，首要) + cip (拿) + -led (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高处，手持一本厚重的书，书上写着"原则"。
    <tspan x="50" dy="25">这个人"首要拿(prin-cip)"着原则，坚定不移，这就是有原则的(principled)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a principled man who always stands by his beliefs.
  </text>
  <text x="50" y="310" class="content">
    他是一个有原则的人，总是坚持自己的信念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing on a pedestal -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="150" y="20" width="50" height="160" class="image" />
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="100" x2="120" y2="90" class="image" />
    <line x1="175" y1="100" x2="230" y2="90" class="image" />
    <!-- Book -->
    <rect x="250" y="50" width="80" height="100" class="image" />
    <text x="260" y="100" class="content" style="font-size: 24px; fill: #000;">原则</text>
  </g>
</svg>