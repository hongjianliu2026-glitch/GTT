<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confide</text>
  <text x="50" y="120" class="subtitle">[kənˈfaɪd] v. 吐露秘密，信任</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + fide (信任)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在月光下，"一起信任(con-fide)"
    <tspan x="50" dy="25">对方，悄悄地吐露心中的秘密。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to confide in her best friend.
  </text>
  <text x="50" y="310" class="content">
    她决定向她最好的朋友吐露心声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Two people -->
    <circle cx="50" cy="150" r="20" class="image" />
    <circle cx="150" cy="150" r="20" class="image" />
    <!-- Speech bubbles -->
    <path d="M 50 130 Q 20 130 20 100 Q 20 70 50 70" class="image" />
    <path d="M 150 130 Q 180 130 180 100 Q 180 70 150 70" class="image" />
  </g>
</svg>