<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">integrative</text>
  <text x="50" y="120" class="subtitle">[ˈɪntɪɡreɪtɪv] adj. 综合的，一体化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> integr (整体) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图，所有的碎片都被"整合(integr)"在一起，
    <tspan x="50" dy="25">形成了一个完整的画面，这就是"综合的(integrative)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The integrative approach combines various disciplines.
  </text>
  <text x="50" y="310" class="content">
    综合方法结合了多种学科。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="110" y="0" width="100" height="100" class="image" />
    <rect x="220" y="0" width="100" height="100" class="image" />
    <rect x="0" y="110" width="100" height="100" class="image" />
    <rect x="110" y="110" width="100" height="100" class="image" />
    <rect x="220" y="110" width="100" height="100" class="image" />
    <!-- Completed puzzle -->
    <rect x="0" y="220" width="320" height="100" class="image" />
    <!-- Text on completed puzzle -->
    <text x="160" y="270" class="content" text-anchor="middle">Integrated</text>
  </g>
</svg>