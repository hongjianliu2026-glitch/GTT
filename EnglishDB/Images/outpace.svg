<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outpace</text>
  <text x="50" y="120" class="subtitle">[aʊtˈpeɪs] v. 超过，胜过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (超过) + pace (步伐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在跑步比赛中，"超过(out-)"
    <tspan x="50" dy="25">对手的"步伐(pace)"，迅速领先。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new model outpaced its competitors in sales.
  </text>
  <text x="50" y="310" class="content">
    这款新型号在销售上超过了竞争对手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Runner 1 -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />

    <!-- Runner 2 -->
    <line x1="200" y1="70" x2="250" y2="70" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <circle cx="200" cy="70" r="10" class="image" />

    <!-- Arrow showing outpacing -->
    <line x1="120" y1="80" x2="180" y2="80" class="image" />
    <polygon points="180,80 170,70 170,90" class="image" />
  </g>
</svg>