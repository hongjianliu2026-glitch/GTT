<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">girth</text>
  <text x="50" y="120" class="subtitle">[ɡɜːrθ] n. 腰围，周长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> girth (来自古英语 gyrt，意为“环绕”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的橡皮筋"环绕(girth)"在一个胖胖的肚子上，
    <tspan x="50" dy="25">这个橡皮筋的周长就是腰围(girth)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The girth of the tree was measured at 10 feet.
  </text>
  <text x="50" y="310" class="content">
    这棵树的周长被测量为10英尺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large rubber band -->
    <circle cx="150" cy="100" r="80" class="image" />
    <!-- Fat belly -->
    <circle cx="150" cy="100" r="60" class="image" fill="#F1C40F" />
    <!-- Text annotation -->
    <text x="150" y="220" class="content" text-anchor="middle">Girth</text>
  </g>
</svg>