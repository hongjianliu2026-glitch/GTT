<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aromatic</text>
  <text x="50" y="120" class="subtitle">[ˌærəˈmætɪk] adj. 芳香的，有香味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aroma (香味) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个花园里，"香味(aroma)"
    <tspan x="50" dy="25">弥漫在空气中，让人感到愉悦和放松。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aromatic herbs filled the kitchen with a delightful scent.
  </text>
  <text x="50" y="310" class="content">
    芳香的香草让厨房充满了宜人的香气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flowers -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="120" r="25" class="image" />
    <circle cx="150" cy="80" r="30" class="image" />
    <circle cx="200" cy="110" r="25" class="image" />
    <circle cx="250" cy="90" r="20" class="image" />
    <!-- Scent -->
    <path d="M50,150 Q100,100 150,150 T250,150" class="image" />
    <path d="M50,160 Q100,110 150,160 T250,160" class="image" />
    <path d="M50,170 Q100,120 150,170 T250,170" class="image" />
  </g>
</svg>