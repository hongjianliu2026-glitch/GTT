<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .success { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">successful</text>
  <text x="50" y="120" class="subtitle">[səkˈsesfəl] adj. 成功的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> suc- (下面) + cess (走) + -ful (充满的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在成功的阶梯上"一步步走下去(suc-cess)"，
    <tspan x="50" dy="25">最终充满(ful)了成功的喜悦。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was very successful in her career.
  </text>
  <text x="50" y="310" class="content">
    她在事业上非常成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ladder -->
    <line x1="50" y1="20" x2="50" y2="200" class="image" />
    <line x1="100" y1="20" x2="100" y2="200" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="60" x2="100" y2="60" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <line x1="50" y1="180" x2="100" y2="180" class="image" />

    <!-- Person on the ladder -->
    <circle cx="75" cy="160" r="15" class="image" />
    <line x1="75" y1="175" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="60" y2="230" class="image" />
    <line x1="75" y1="200" x2="90" y2="230" class="image" />
    <line x1="75" y1="190" x2="100" y2="180" class="image" />

    <!-- Success symbol -->
    <circle cx="150" cy="100" r="30" class="success" />
    <text x="140" y="110" class="content" fill="#FFFFFF">✓</text>
  </g>
</svg>