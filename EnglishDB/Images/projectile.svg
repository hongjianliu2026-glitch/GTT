<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">projectile</text>
  <text x="50" y="120" class="subtitle">[prəˈdʒɛktɪl] n. 抛射物，射弹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + ject (投掷) + -ile (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头被"向前投掷(pro-ject)"，
    <tspan x="50" dy="25">它飞快地穿过空气，成为一个抛射物(projectile)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldier launched a projectile towards the enemy.
  </text>
  <text x="50" y="310" class="content">
    士兵向敌人发射了一个抛射物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Projectile -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <!-- Stone -->
    <circle cx="50" cy="150" r="30" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="150" x2="300" y2="150" class="image" />
    <polygon points="300,140 320,150 300,160" class="image" />
  </g>
</svg>