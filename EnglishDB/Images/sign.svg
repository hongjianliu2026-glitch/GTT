<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sign</text>
  <text x="50" y="120" class="subtitle">[saɪn] n. 符号，标志；v. 签名，示意</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sign (标记，符号)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"标记(sign)"，它像一个
    <tspan x="50" dy="25">超级英雄的标志，高高挂在天空中，</tspan>
    <tspan x="50" dy="25">每个人都能看到并理解它的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a sign to the waiter to bring the bill.
  </text>
  <text x="50" y="310" class="content">
    她向服务员示意结账。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Superhero sign -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <line x1="125" y1="100" x2="225" y2="100" class="image" />
    <line x1="150" y1="75" x2="200" y2="125" class="image" />
    <line x1="200" y1="75" x2="150" y2="125" class="image" />
    <!-- People looking up -->
    <circle cx="50" cy="180" r="10" class="image" />
    <line x1="50" y1="190" x2="50" y2="210" class="image" />
    <line x1="50" y1="210" x2="40" y2="230" class="image" />
    <line x1="50" y1="210" x2="60" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="190" class="image" />
    <circle cx="300" cy="180" r="10" class="image" />
    <line x1="300" y1="190" x2="300" y2="210" class="image" />
    <line x1="300" y1="210" x2="290" y2="230" class="image" />
    <line x1="300" y1="210" x2="310" y2="230" class="image" />
    <line x1="300" y1="200" x2="320" y2="190" class="image" />
  </g>
</svg>