<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supposed</text>
  <text x="50" y="120" class="subtitle">[səˈpoʊzd] adj. 假定的，推测的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sup- (在下面) + pose (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在桌子下面偷偷"放置(pose)"了一个假定的计划，
    <tspan x="50" dy="25">这个计划是"假定的(supposed)"，因为还没有被证实。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was supposed to be at the meeting, but he didn't show up.
  </text>
  <text x="50" y="310" class="content">
    他本应该出席会议，但他没有出现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person under the table -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="35" y2="210" class="image" />
    <line x1="50" y1="190" x2="65" y2="210" class="image" />
    <line x1="50" y1="175" x2="70" y2="165" class="image" />
    <!-- Plan document -->
    <rect x="70" y="130" width="100" height="50" class="image" />
    <line x1="80" y1="140" x2="160" y2="140" class="image" />
    <line x1="80" y1="160" x2="160" y2="160" class="image" />
  </g>
</svg>