<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outnumber</text>
  <text x="50" y="120" class="subtitle">[ˌaʊtˈnʌmbər] v. 数量上超过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (超过) + number (数量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人站在两边，一边的人数"超过(out-)"另一边，
    <tspan x="50" dy="25">这就是"数量上超过(outnumber)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The home team was outnumbered by the visitors.
  </text>
  <text x="50" y="310" class="content">
    主队的人数被客队超过了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Left group -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="50" cy="200" r="15" class="image" />
    <!-- Right group -->
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <circle cx="250" cy="200" r="15" class="image" />
    <circle cx="250" cy="250" r="15" class="image" />
    <circle cx="250" cy="300" r="15" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <polygon points="200,140 210,150 200,160" class="image" />
  </g>
</svg>