<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monstrous</text>
  <text x="50" y="120" class="subtitle">[ˈmɒnstrəs] adj. 巨大的，可怕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> monstr (显示) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的怪物(monster)突然"显示(monstr)"在城市中，
    <tspan x="50" dy="25">它的存在让人感到无比的恐惧和不安，这就是"monstrous"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The monstrous creature terrified the villagers.
  </text>
  <text x="50" y="310" class="content">
    那个巨大的怪物吓坏了村民们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="200" x2="50" y2="150" class="image" /> <!-- Left arm -->
    <line x1="100" y1="200" x2="150" y2="150" class="image" /> <!-- Right arm -->
    <line x1="100" y1="250" x2="50" y2="300" class="image" /> <!-- Left leg -->
    <line x1="100" y1="250" x2="150" y2="300" class="image" /> <!-- Right leg -->
    <!-- City skyline -->
    <rect x="0" y="300" width="200" height="50" class="image" />
    <rect x="20" y="280" width="30" height="70" class="image" />
    <rect x="70" y="260" width="30" height="90" class="image" />
    <rect x="120" y="290" width="30" height="60" class="image" />
    <rect x="170" y="270" width="30" height="80" class="image" />
  </g>
</svg>