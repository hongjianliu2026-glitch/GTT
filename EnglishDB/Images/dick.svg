<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dick</text>
  <text x="50" y="120" class="subtitle">[dɪk] n. 迪克（人名）；俚语中指阴茎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自中古英语“dicke”，原意为“厚实的”或“强壮的”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的“迪克(dick)”站在那里，
    <tspan x="50" dy="25">他的形象让人联想到“厚实”和“强壮”，</tspan>
    <tspan x="50" dy="25">这种联想在俚语中逐渐演变为指代阴茎。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was known as Dick in his circle of friends.
  </text>
  <text x="50" y="310" class="content">
    他在朋友圈里被称为迪克。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Strong figure -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="120" x2="20" y2="100" class="image" />
    <line x1="50" y1="120" x2="80" y2="100" class="image" />
  </g>
</svg>