<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coolly</text>
  <text x="50" y="120" class="subtitle">[ˈkuːli] adv. 冷静地，冷淡地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cool (冷) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在炎热的夏天，"冷静地(coolly)"
    <tspan x="50" dy="25">面对挑战，就像冰块一样保持冷静。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She handled the situation coolly and professionally.
  </text>
  <text x="50" y="310" class="content">
    她冷静且专业地处理了情况。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice cube -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <!-- Person -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="90" x2="120" y2="80" class="image" />
    <line x1="150" y1="90" x2="180" y2="80" class="image" />
  </g>
</svg>