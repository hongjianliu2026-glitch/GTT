<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">strange</text>
  <text x="50" y="120" class="subtitle">[streɪndʒ] adj. 奇怪的，陌生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + range (排列)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个站在(st-)队伍中的人，他的排列(range)方式与众不同，
    <tspan x="50" dy="25">显得非常奇怪(strange)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found the whole situation quite strange.
  </text>
  <text x="50" y="310" class="content">
    她觉得整个情况非常奇怪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Queue -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="30" x2="350" y2="30" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="90" x2="350" y2="90" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- People in queue -->
    <circle cx="50" cy="15" r="10" class="image" />
    <circle cx="100" cy="15" r="10" class="image" />
    <circle cx="150" cy="15" r="10" class="image" />
    <circle cx="200" cy="15" r="10" class="image" />
    <circle cx="250" cy="15" r="10" class="image" />
    <circle cx="300" cy="15" r="10" class="image" />
    <!-- Strange person -->
    <circle cx="200" cy="75" r="10" class="image" />
    <line x1="200" y1="85" x2="200" y2="110" class="image" />
    <line x1="200" y1="110" x2="180" y2="130" class="image" />
    <line x1="200" y1="110" x2="220" y2="130" class="image" />
    <line x1="200" y1="95" x2="230" y2="85" class="image" />
  </g>
</svg>