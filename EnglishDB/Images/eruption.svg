<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .volcano { fill: #F39C12; }
      .lava { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eruption</text>
  <text x="50" y="120" class="subtitle">[ɪˈrʌpʃən] n. 喷发，爆发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + rupt (破裂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座火山突然"破裂(rupt)"，
    <tspan x="50" dy="25">"喷发出(e-rupt)"滚烫的岩浆，这就是火山喷发(eruption)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The eruption of the volcano caused widespread destruction.
  </text>
  <text x="50" y="310" class="content">
    火山的喷发造成了广泛的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Volcano -->
    <polygon points="0,200 150,0 300,200" class="volcano" />
    <!-- Lava -->
    <polygon points="100,200 150,100 200,200" class="lava" />
    <polygon points="120,200 150,120 180,200" class="lava" />
    <polygon points="140,200 150,140 160,200" class="lava" />
    <!-- Smoke -->
    <circle cx="150" cy="50" r="30" class="image" />
    <circle cx="150" cy="30" r="20" class="image" />
    <circle cx="150" cy="10" r="10" class="image" />
  </g>
</svg>