<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">halibut</text>
  <text x="50" y="120" class="subtitle">[ˈhælɪbʌt] n. 大比目鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hal- (全) + but (鳍)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的比目鱼，"全身(hal-)"覆盖着"鳍(but)"，
    <tspan x="50" dy="25">在海洋中悠然自得地游动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef prepared a delicious halibut for dinner.
  </text>
  <text x="50" y="310" class="content">
    厨师为晚餐准备了一道美味的大比目鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish body -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Fish tail -->
    <polygon points="325,100 375,70 375,130" class="image" />
    <!-- Fish eye -->
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Fish fin -->
    <line x1="175" y1="30" x2="275" y2="30" class="image" />
    <line x1="175" y1="170" x2="275" y2="170" class="image" />
  </g>
</svg>