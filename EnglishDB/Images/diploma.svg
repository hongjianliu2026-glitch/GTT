<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diploma</text>
  <text x="50" y="120" class="subtitle">[dɪˈploʊmə] n. 毕业证书，文凭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> diplo- (双) + -ma (结果)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生拿着两张纸，"双重的结果(diplo-ma)"
    <tspan x="50" dy="25">象征着他的学业成就，这就是他的毕业证书(diploma)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received her diploma in computer science.
  </text>
  <text x="50" y="310" class="content">
    她获得了计算机科学的毕业证书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Diploma -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <rect x="20" y="20" width="260" height="160" class="image" />
    <!-- Student -->
    <circle cx="20" cy="250" r="15" class="image" />
    <line x1="20" y1="265" x2="20" y2="300" class="image" />
    <line x1="20" y1="300" x2="0" y2="330" class="image" />
    <line x1="20" y1="300" x2="40" y2="330" class="image" />
    <line x1="20" y1="280" x2="50" y2="270" class="image" />
    <!-- Holding diploma -->
    <line x1="20" y1="250" x2="170" y2="100" class="image" />
  </g>
</svg>