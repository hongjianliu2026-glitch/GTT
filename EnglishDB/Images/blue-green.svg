<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blue-green</text>
  <text x="50" y="120" class="subtitle">[bluː ɡriːn] adj. 蓝绿色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blue (蓝色) + green (绿色)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片海洋，"蓝色(blue)"的海水与"绿色(green)"的
    <tspan x="50" dy="25">海藻交织在一起，形成了蓝绿色的(blue-green)美丽景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ocean appeared blue-green from the airplane.
  </text>
  <text x="50" y="310" class="content">
    从飞机上看，海洋呈现出蓝绿色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" fill="#4CAF50" />
    <!-- Waves -->
    <path d="M50 50 Q100 20 150 50 T250 50 T300 20 T350 50" stroke="#2196F3" stroke-width="10" fill="none" />
    <path d="M50 100 Q100 70 150 100 T250 100 T300 70 T350 100" stroke="#2196F3" stroke-width="10" fill="none" />
    <path d="M50 150 Q100 120 150 150 T250 150 T300 120 T350 150" stroke="#2196F3" stroke-width="10" fill="none" />
    <!-- Algae -->
    <circle cx="100" cy="100" r="20" fill="#4CAF50" />
    <circle cx="200" cy="150" r="20" fill="#4CAF50" />
    <circle cx="300" cy="100" r="20" fill="#4CAF50" />
  </g>
</svg>