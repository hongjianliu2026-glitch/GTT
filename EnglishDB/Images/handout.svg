<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handout</text>
  <text x="50" y="120" class="subtitle">[ˈhændaʊt] n. 分发的印刷品，传单</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + out (出去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老师在课堂上，"用手(hand)"
    <tspan x="50" dy="25">分发(out)一些印刷品(handout)给学生。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The professor gave us a handout with the key points.
  </text>
  <text x="50" y="310" class="content">
    教授给了我们一份印有重点内容的传单。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <path d="M20,100 C20,50 100,50 100,100 L100,150 C100,200 20,200 20,150 Z" class="image" />
    <!-- Paper -->
    <rect x="120" y="100" width="150" height="100" class="image" />
    <!-- Lines on paper -->
    <line x1="130" y1="120" x2="260" y2="120" class="image" />
    <line x1="130" y1="140" x2="260" y2="140" class="image" />
    <line x1="130" y1="160" x2="260" y2="160" class="image" />
    <line x1="130" y1="180" x2="260" y2="180" class="image" />
  </g>
</svg>