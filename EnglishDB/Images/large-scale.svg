<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">large-scale</text>
  <text x="50" y="120" class="subtitle">[ˈlɑːrdʒ skeɪl] adj. 大规模的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> large (大的) + scale (规模)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地图，"大(large)"到覆盖整个房间，
    <tspan x="50" dy="25">而"规模(scale)"则代表了它的广阔范围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is planning a large-scale expansion next year.
  </text>
  <text x="50" y="310" class="content">
    公司计划明年进行大规模扩张。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Map details -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Scale bar -->
    <rect x="250" y="160" width="80" height="20" class="image" />
    <text x="260" y="180" class="content">Scale</text>
  </g>
</svg>