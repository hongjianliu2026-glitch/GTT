<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #333333; }
      .content { font: 18px sans-serif; fill: #555555; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #1976D2; }
      .image { stroke: #795548; stroke-width: 2; fill: none; }
      .flower { fill: #FF4081; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flowery</text>
  <text x="50" y="120" class="subtitle">[ˈflaʊəri] adj. 花的，多花的；华丽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flower (花) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个花园里，"花(flower)"开得如此茂盛，以至于整个花园都"多花的(flowery)"。
    <tspan x="50" dy="25">每一朵花都争奇斗艳，仿佛在比拼谁更华丽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was filled with flowery scents.
  </text>
  <text x="50" y="310" class="content">
    花园里充满了花香。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flowers -->
    <circle cx="50" cy="100" r="20" class="flower" />
    <circle cx="100" cy="80" r="25" class="flower" />
    <circle cx="150" cy="120" r="30" class="flower" />
    <circle cx="200" cy="90" r="25" class="flower" />
    <circle cx="250" cy="110" r="20" class="flower" />
    <!-- Ground -->
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
  </g>
</svg>