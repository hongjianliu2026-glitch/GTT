<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">everywhere</text>
  <text x="50" y="120" class="subtitle">[ˈɛvriˌwɛr] adv. 到处，处处</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> every (每个) + where (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师，他挥动魔杖，"每个地方(every-where)"
    <tspan x="50" dy="25">都出现了他的身影，仿佛无处不在(everywhere)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news spread everywhere within a day.
  </text>
  <text x="50" y="310" class="content">
    消息在一天之内传遍了各地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Wand -->
    <line x1="20" y1="115" x2="70" y2="80" class="image" />
    <!-- Locations -->
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="220" cy="120" r="10" class="image" />
    <circle cx="320" cy="100" r="10" class="image" />
    <circle cx="420" cy="140" r="10" class="image" />
    <circle cx="520" cy="110" r="10" class="image" />
    <!-- Connecting lines -->
    <line x1="30" y1="100" x2="120" y2="80" class="image" />
    <line x1="30" y1="100" x2="220" y2="120" class="image" />
    <line x1="30" y1="100" x2="320" y2="100" class="image" />
    <line x1="30" y1="100" x2="420" y2="140" class="image" />
    <line x1="30" y1="100" x2="520" y2="110" class="image" />
  </g>
</svg>