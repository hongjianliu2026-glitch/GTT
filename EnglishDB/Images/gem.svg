<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gem</text>
  <text x="50" y="120" class="subtitle">[dʒem] n. 宝石，珍宝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gem (宝石)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗闪闪发光的宝石(gem)，它被镶嵌在皇冠上，
    <tspan x="50" dy="25">象征着无与伦比的价值和美丽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a diamond necklace that sparkled like a gem.
  </text>
  <text x="50" y="310" class="content">
    她戴着一条像宝石一样闪闪发光的钻石项链。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gemstone -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Crown -->
    <path d="M50 50 L150 50 L100 0 Z" class="image" fill="#C0392B" />
    <line x1="75" y1="50" x2="75" y2="100" class="image" />
    <line x1="125" y1="50" x2="125" y2="100" class="image" />
  </g>
</svg>