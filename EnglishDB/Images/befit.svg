<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">befit</text>
  <text x="50" y="120" class="subtitle">[bɪˈfɪt] v. 适合，相称</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + fit (适合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件衣服"使(be-)"你"适合(fit)"，
    <tspan x="50" dy="25">这件衣服就"适合(befit)"你。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dress befits her perfectly.
  </text>
  <text x="50" y="310" class="content">
    这件衣服非常适合她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dress -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Person -->
    <circle cx="75" cy="220" r="20" class="image" />
    <line x1="75" y1="240" x2="75" y2="280" class="image" />
    <line x1="75" y1="280" x2="55" y2="320" class="image" />
    <line x1="75" y1="280" x2="95" y2="320" class="image" />
    <line x1="75" y1="260" x2="35" y2="250" class="image" />
    <line x1="75" y1="260" x2="115" y2="250" class="image" />
    <!-- Fit -->
    <text x="160" y="100" class="content" style="font-size: 36px; fill: #2980B9;">✓</text>
  </g>
</svg>