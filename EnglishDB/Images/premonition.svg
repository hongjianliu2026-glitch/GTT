<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">premonition</text>
  <text x="50" y="120" class="subtitle">[ˌpriːməˈnɪʃn] n. 预感，预兆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + monit (警告) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在事情发生前，"提前警告(pre-monit)"
    <tspan x="50" dy="25">自己即将发生的事情，这种感觉就是预感(premonition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a premonition that something bad was going to happen.
  </text>
  <text x="50" y="310" class="content">
    她有一种不好的预感，觉得会有坏事发生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Lightning bolt -->
    <line x1="100" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="100" y2="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="250" r="20" class="image" />
    <line x1="175" y1="270" x2="175" y2="320" class="image" />
    <line x1="175" y1="320" x2="150" y2="360" class="image" />
    <line x1="175" y1="320" x2="200" y2="360" class="image" />
    <line x1="175" y1="290" x2="125" y2="280" class="image" />
    <line x1="175" y1="290" x2="225" y2="280" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="175" cy="200" rx="50" ry="30" class="image" />
    <line x1="175" y1="230" x2="175" y2="250" class="image" />
  </g>
</svg>