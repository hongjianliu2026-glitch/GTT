<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hopelessly</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊpləsli] adv. 无望地，绝望地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hope (希望) + less (没有) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"没有希望(hope-less)"，
    <tspan x="50" dy="25">眼神空洞，仿佛世界末日来临，这就是"无望地(hopelessly)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked hopelessly at the broken phone.
  </text>
  <text x="50" y="310" class="content">
    她绝望地看着坏掉的手机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="220" class="image" />
    <line x1="175" y1="180" x2="195" y2="220" class="image" />
    <line x1="175" y1="140" x2="145" y2="130" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Broken phone -->
    <rect x="250" y="50" width="50" height="80" class="image" />
    <line x1="260" y1="60" x2="290" y2="90" class="image" />
    <line x1="260" y1="90" x2="290" y2="60" class="image" />
  </g>
</svg>