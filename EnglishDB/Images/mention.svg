<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mention</text>
  <text x="50" y="120" class="subtitle">[ˈmɛnʃən] v. 提及，说起；n. 提及</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> men- (手) + -tion (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在会议上，用手势"提及(men-tion)"
    <tspan x="50" dy="25">某个重要话题，引起大家的注意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She mentioned her trip to Paris during the meeting.
  </text>
  <text x="50" y="310" class="content">
    她在会议上提到了她的巴黎之行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand pointing -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
    <line x1="100" y1="100" x2="100" y2="140" class="image" />
    <line x1="100" y1="140" x2="80" y2="160" class="image" />
    <line x1="100" y1="140" x2="120" y2="160" class="image" />
    <!-- Speech bubble -->
    <path d="M150,50 Q200,70 250,50 Q200,100 150,50" class="image" />
    <text x="170" y="60" class="content">Paris</text>
  </g>
</svg>