<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">differentiate</text>
  <text x="50" y="120" class="subtitle">[ˌdɪfəˈrɛnʃieɪt] v. 区分，区别</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> differ (不同) + -ent (形容词后缀) + -iate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在舞台上，"变出(differ-ent)"
    <tspan x="50" dy="25">两个完全不同的物体，然后他"区分(differentiate)"它们。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's important to differentiate between fact and opinion.
  </text>
  <text x="50" y="310" class="content">
    区分事实和观点很重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Magician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Different objects -->
    <rect x="150" y="50" width="50" height="50" class="image" />
    <circle cx="250" cy="75" r="25" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="100" x2="150" y2="75" class="image">
      <animate attributeName="x2" values="150;175;150" dur="2s" repeatCount="indefinite" />
      <animate attributeName="y2" values="75;100;75" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="100" y1="100" x2="250" y2="100" class="image">
      <animate attributeName="x2" values="250;275;250" dur="2s" repeatCount="indefinite" />
      <animate attributeName="y2" values="100;125;100" dur="2s" repeatCount="indefinite" />
    </line>
  </g>
</svg>