<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fin</text>
  <text x="50" y="120" class="subtitle">[fɪn] n. 鳍，鱼鳍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fin (源自拉丁语 "finis"，意为“结束”或“界限”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条鱼在水中游动，它的"界限(fin)"
    <tspan x="50" dy="25">帮助它保持平衡和方向，就像鱼的生命线一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dolphin used its fin to navigate through the waves.
  </text>
  <text x="50" y="310" class="content">
    海豚用它的鳍在波浪中导航。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Fish fin -->
    <polygon points="50,100 100,50 100,150" class="image" />
    <!-- Water -->
    <line x1="0" y1="150" x2="300" y2="150" class="image" />
    <line x1="0" y1="160" x2="300" y2="160" class="image" />
    <line x1="0" y1="170" x2="300" y2="170" class="image" />
  </g>
</svg>