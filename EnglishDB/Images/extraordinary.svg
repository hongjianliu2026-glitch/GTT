<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extraordinary</text>
  <text x="50" y="120" class="subtitle">[ɪkˈstrɔːrdəneri] adj. 非凡的，特别的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> extra- (超出) + ordinary (普通的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通人突然"超出(extra-)"了
    <tspan x="50" dy="25">普通(ordinary)的能力，变成了非凡(extraordinary)的存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her performance was extraordinary; she received a standing ovation.
  </text>
  <text x="50" y="310" class="content">
    她的表演非常出色，赢得了全场起立鼓掌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ordinary person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <!-- Extraordinary person -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="290" y2="130" class="image" />
    <line x1="250" y1="100" x2="250" y2="80" class="image" />
    <line x1="250" y1="80" x2="230" y2="60" class="image" />
    <line x1="250" y1="80" x2="270" y2="60" class="image" />
    <line x1="250" y1="60" x2="250" y2="40" class="image" />
    <line x1="250" y1="40" x2="230" y2="20" class="image" />
    <line x1="250" y1="40" x2="270" y2="20" class="image" />

    <!-- Arrow -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />

    <!-- Text -->
    <text x="120" y="130" class="content">Extraordinary</text>
  </g>
</svg>