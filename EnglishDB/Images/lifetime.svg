<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lifetime</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪftaɪm] n. 一生，寿命</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> life (生命) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从出生到死亡的整个过程，"生命的时间(life-time)"
    <tspan x="50" dy="25">就是他的一生(lifetime)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has dedicated her lifetime to helping others.
  </text>
  <text x="50" y="310" class="content">
    她一生致力于帮助他人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lifeline -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Birth -->
    <circle cx="20" cy="100" r="15" class="image" />
    <!-- Death -->
    <circle cx="330" cy="100" r="15" class="image" />
    <!-- Life events -->
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <line x1="280" y1="80" x2="280" y2="120" class="image" />
    <!-- Labels -->
    <text x="10" y="80" class="content">Birth</text>
    <text x="320" y="80" class="content">Death</text>
    <text x="90" y="140" class="content">Childhood</text>
    <text x="190" y="140" class="content">Adulthood</text>
    <text x="270" y="140" class="content">Elderly</text>
  </g>
</svg>