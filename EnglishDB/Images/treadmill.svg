<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">treadmill</text>
  <text x="50" y="120" class="subtitle">[ˈtredˌmɪl] n. 跑步机，单调乏味的工作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tread (踩) + mill (磨坊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在跑步机上不停地"踩(tread)"，就像在"磨坊(mill)"里重复单调的工作，
    <tspan x="50" dy="25">这种感觉就像被困在跑步机上，无法前进。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Working in the office felt like a treadmill.
  </text>
  <text x="50" y="310" class="content">
    在办公室工作感觉就像在跑步机上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treadmill -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Person on treadmill -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="90" class="image" />
    <line x1="50" y1="90" x2="30" y2="120" class="image" />
    <line x1="50" y1="90" x2="70" y2="120" class="image" />
    <line x1="50" y1="75" x2="80" y2="65" class="image" />
    <!-- Treadmill belt -->
    <line x1="100" y1="50" x2="300" y2="50" class="image" />
    <line x1="100" y1="70" x2="300" y2="70" class="image" />
    <line x1="100" y1="90" x2="300" y2="90" class="image" />
  </g>
</svg>