<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grudge</text>
  <text x="50" y="120" class="subtitle">[ɡrʌdʒ] n. 怨恨，不满；v. 怀恨在心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grudg (怨恨) + -e (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人心中藏着一把"怨恨的刀(grudg-e)"，
    <tspan x="50" dy="25">这把刀不断刺痛他的心，让他无法释怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She held a grudge against her ex-boss for years.
  </text>
  <text x="50" y="310" class="content">
    她对前老板怀恨在心多年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Knife -->
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="150" y1="50" x2="130" y2="70" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
    <!-- Blood drop -->
    <circle cx="150" cy="150" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>