<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #154360; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drought</text>
  <text x="50" y="120" class="subtitle">[draʊt] n. 干旱，旱灾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drou- (干) + -th (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片干涸的土地，"干(drou-)"得裂开，
    <tspan x="50" dy="25">没有一滴水，这就是干旱(drought)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The drought caused severe water shortages in the region.
  </text>
  <text x="50" y="310" class="content">
    干旱导致该地区严重缺水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dry land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Cracks in the land -->
    <line x1="100" y1="20" x2="100" y2="140" class="image" />
    <line x1="200" y1="20" x2="200" y2="140" class="image" />
    <line x1="150" y1="20" x2="150" y2="140" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
  </g>
</svg>