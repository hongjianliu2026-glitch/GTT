<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conventional</text>
  <text x="50" y="120" class="subtitle">[kənˈvɛnʃənl] adj. 传统的，常规的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + vent (来) + -ional (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"共同来到(con-vent)"一个传统的聚会，
    <tspan x="50" dy="25">穿着传统的服装，遵循常规的礼仪，这就是传统的(conventional)场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers conventional methods over modern ones.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢传统的方法而不是现代的方法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional attire -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Traditional dress -->
    <rect x="30" y="130" width="40" height="50" class="image" />
    <rect x="60" y="130" width="40" height="50" class="image" />
    <!-- Traditional hat -->
    <rect x="40" y="70" width="20" height="30" class="image" />
  </g>
</svg>