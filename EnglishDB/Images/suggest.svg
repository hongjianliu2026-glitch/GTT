<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suggest</text>
  <text x="50" y="120" class="subtitle">[səɡˈdʒest] v. 建议，暗示</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sug- (在下面) + gest (带来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在桌子下面偷偷地"带来(gest)"一个想法，
    <tspan x="50" dy="25">然后轻轻地"建议(suggest)"给其他人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She suggested a new approach to solve the problem.
  </text>
  <text x="50" y="310" class="content">
    她建议了一个解决问题的新方法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person suggesting -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Idea bubble -->
    <path d="M 80 80 Q 120 60 140 80 Q 120 100 80 80" class="image" />
    <text x="90" y="90" class="content">Idea</text>
  </g>
</svg>