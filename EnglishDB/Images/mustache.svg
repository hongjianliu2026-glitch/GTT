<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mustache</text>
  <text x="50" y="120" class="subtitle">[məˈstæʃ] n. 胡子，髭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> must (必须) + ache (疼痛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代骑士，"必须(must)"
    <tspan x="50" dy="25">忍受着"疼痛(ache)"，</tspan>
    <tspan x="50" dy="25">因为他留着浓密的"胡子(mustache)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a mustache that made him look like a cowboy.
  </text>
  <text x="50" y="310" class="content">
    他留着胡子，看起来像个牛仔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Nose -->
    <path d="M100,100 Q120,120 100,140" class="image" />
    <!-- Mustache -->
    <path d="M50,150 Q100,180 150,150" class="image" />
    <path d="M50,160 Q100,190 150,160" class="image" />
  </g>
</svg>