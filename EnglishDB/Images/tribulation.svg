<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tribulation</text>
  <text x="50" y="120" class="subtitle">[ˌtrɪbjʊˈleɪʃən] n. 苦难，磨难</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tribul (拉丁语，压迫) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"压迫(tribul)"在地，
    <tspan x="50" dy="25">脸上露出痛苦的表情，这就是"苦难(tribulation)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tribulation of war left many families devastated.
  </text>
  <text x="50" y="310" class="content">
    战争的苦难使许多家庭支离破碎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being oppressed -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="160" x2="100" y2="150" class="image" />
    <!-- Oppression symbol -->
    <rect x="20" y="50" width="60" height="30" class="image" />
    <line x1="20" y1="50" x2="80" y2="80" class="image" />
    <line x1="80" y1="50" x2="20" y2="80" class="image" />
  </g>
</svg>