<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">descendant</text>
  <text x="50" y="120" class="subtitle">[dɪˈsɛndənt] n. 后代，子孙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + scend (爬) + ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家族树，祖先在顶端，后代"向下爬(de-scend)"
    <tspan x="50" dy="25">到树的底部，这些后代就是descendant。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a direct descendant of the royal family.
  </text>
  <text x="50" y="310" class="content">
    她是皇室家族的直系后代。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Family tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <!-- Ancestor -->
    <circle cx="100" cy="25" r="20" class="image" />
    <!-- Descendants -->
    <circle cx="50" cy="75" r="15" class="image" />
    <circle cx="150" cy="75" r="15" class="image" />
    <circle cx="50" cy="125" r="15" class="image" />
    <circle cx="150" cy="125" r="15" class="image" />
    <circle cx="50" cy="175" r="15" class="image" />
    <circle cx="150" cy="175" r="15" class="image" />
  </g>
</svg>