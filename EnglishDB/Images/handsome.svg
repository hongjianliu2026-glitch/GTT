<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handsome</text>
  <text x="50" y="120" class="subtitle">[ˈhænsəm] adj. 英俊的，大方的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + some (一些)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个英俊的人，他的"手(hand)"
    <tspan x="50" dy="25">上拿着一束花，送给别人，显得非常大方(some)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a handsome man with a charming smile.
  </text>
  <text x="50" y="310" class="content">
    他是一个英俊的男人，笑容迷人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Handsome man -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="170" x2="50" y2="200" class="image" />
    <line x1="100" y1="170" x2="150" y2="200" class="image" />
    <!-- Flower -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="150" x2="180" y2="170" class="image" />
    <line x1="200" y1="150" x2="220" y2="170" class="image" />
    <!-- Hand holding flower -->
    <line x1="150" y1="250" x2="200" y2="120" class="image" />
  </g>
</svg>