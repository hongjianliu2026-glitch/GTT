<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drastically</text>
  <text x="50" y="120" class="subtitle">[ˈdræstɪkli] adv. 激烈地，彻底地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drast- (激烈的) + -ical (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"激烈地(drast-)"砸向地面，
    <tspan x="50" dy="25">地面瞬间裂开，这种强烈的动作就是"drastically"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's profits decreased drastically last year.
  </text>
  <text x="50" y="310" class="content">
    去年公司的利润急剧下降。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="20" x2="100" y2="50" class="image" />
    <line x1="50" y1="20" x2="0" y2="50" class="image" />
    <!-- Ground -->
    <line x1="0" y1="150" x2="200" y2="150" class="image" />
    <!-- Crack in the ground -->
    <line x1="50" y1="150" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="150" y2="150" class="image" />
  </g>
</svg>