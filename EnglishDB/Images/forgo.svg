<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forgo</text>
  <text x="50" y="120" class="subtitle">[fɔːrˈɡoʊ] v. 放弃，抛弃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (离开) + go (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个路口，"离开(for-)"
    <tspan x="50" dy="25">一条路，选择"走(go)"另一条路，</tspan>
    <tspan x="50" dy="25">这就是放弃(forgo)的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to forgo her vacation to focus on her studies.
  </text>
  <text x="50" y="310" class="content">
    她决定放弃假期，专注于学习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Arrow -->
    <line x1="250" y1="100" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="290" y2="90" class="image" />
    <line x1="300" y1="100" x2="290" y2="110" class="image" />
  </g>
</svg>