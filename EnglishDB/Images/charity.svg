<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">charity</text>
  <text x="50" y="120" class="subtitle">[ˈtʃærəti] n. 慈善，施舍，慈善团体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> char- (爱) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱心(char-)的人，
    <tspan x="50" dy="25">他无私地帮助他人，这种行为就是慈善(charity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She donates to charity every month.
  </text>
  <text x="50" y="310" class="content">
    她每个月都向慈善机构捐款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Hand giving -->
    <line x1="20" y1="40" x2="20" y2="80" class="image" />
    <line x1="20" y1="80" x2="0" y2="100" class="image" />
    <line x1="20" y1="80" x2="40" y2="100" class="image" />
    <line x1="20" y1="60" x2="50" y2="50" class="image" />
    <!-- Money -->
    <rect x="50" y="40" width="30" height="20" class="image" />
    <line x1="55" y1="45" x2="75" y2="45" class="image" />
    <line x1="55" y1="55" x2="75" y2="55" class="image" />
  </g>
</svg>