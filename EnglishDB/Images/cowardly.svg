<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cowardly</text>
  <text x="50" y="120" class="subtitle">[ˈkaʊərdli] adj. 胆小的，懦弱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cow (害怕) + ard (形容词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小牛(cow)在面对危险时，吓得瑟瑟发抖，
    <tspan x="50" dy="25">完全不敢动弹，这就是"懦弱(cowardly)"的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He acted cowardly when the bully approached.
  </text>
  <text x="50" y="310" class="content">
    当恶霸靠近时，他表现得非常懦弱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cow -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Fear -->
    <circle cx="50" cy="80" r="10" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <line x1="50" y1="100" x2="70" y2="100" class="image" />
    <!-- Shaking -->
    <line x1="50" y1="200" x2="40" y2="220" class="image" />
    <line x1="50" y1="200" x2="60" y2="220" class="image" />
  </g>
</svg>