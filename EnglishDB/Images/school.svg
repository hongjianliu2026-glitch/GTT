<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">school</text>
  <text x="50" y="120" class="subtitle">[skuːl] n. 学校，学派</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> schola (闲暇)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群学生在"闲暇(schola)"时间里，
    <tspan x="50" dy="25">聚集在一起学习，这个地方就成了学校(school)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She goes to school every day.
  </text>
  <text x="50" y="310" class="content">
    她每天都去上学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- School building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="40" height="40" class="image" />
    <rect x="130" y="40" width="40" height="40" class="image" />
    <rect x="190" y="40" width="40" height="40" class="image" />
    <rect x="250" y="40" width="40" height="40" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="60" class="image" />
    <!-- Students -->
    <circle cx="100" cy="250" r="15" class="image" />
    <circle cx="150" cy="250" r="15" class="image" />
    <circle cx="200" cy="250" r="15" class="image" />
    <circle cx="250" cy="250" r="15" class="image" />
    <!-- Teacher -->
    <circle cx="300" cy="250" r="20" class="image" />
    <line x1="300" y1="270" x2="300" y2="300" class="image" />
    <line x1="300" y1="300" x2="280" y2="330" class="image" />
    <line x1="300" y1="300" x2="320" y2="330" class="image" />
    <line x1="300" y1="280" x2="330" y2="270" class="image" />
  </g>
</svg>