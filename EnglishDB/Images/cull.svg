<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cull</text>
  <text x="50" y="120" class="subtitle">[kʌl] v. 挑选，剔除；n. 挑选出的部分</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cull (挑选)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在果园里，"挑选(cull)"
    <tspan x="50" dy="25">出最好的苹果，把不好的剔除掉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer culled the best apples for the market.
  </text>
  <text x="50" y="310" class="content">
    农夫挑选出最好的苹果去市场卖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="0" class="image" />
    <!-- Apples -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="100" cy="20" r="15" class="image" />
    <!-- Farmer -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Basket -->
    <rect x="300" y="80" width="50" height="50" class="image" />
    <!-- Selected Apple -->
    <circle cx="325" cy="105" r="10" class="image" />
  </g>
</svg>