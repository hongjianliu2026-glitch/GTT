<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bandwagon</text>
  <text x="50" y="120" class="subtitle">[ˈbændwæɡən] n. 潮流，跟风</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> band (乐队) + wagon (马车)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆马车(wagon)上载着一支乐队(band)，
    <tspan x="50" dy="25">人们纷纷跳上马车，跟风(bandwagon)加入热闹的队伍。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Everyone jumped on the bandwagon when the new trend started.
  </text>
  <text x="50" y="310" class="content">
    当新潮流开始时，每个人都跟风加入了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wagon -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Band members -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <!-- Instruments -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="100" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="200" y1="70" x2="200" y2="100" class="image" />
    <!-- People jumping on -->
    <circle cx="250" cy="50" r="15" class="image" />
    <line x1="250" y1="65" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
  </g>
</svg>