<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dreaded</text>
  <text x="50" y="120" class="subtitle">[ˈdrɛdɪd] adj. 令人畏惧的，可怕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dree (恐惧) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被"恐惧(dree)"笼罩的人，脸上写满了"畏惧(dreaded)"的表情。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dreaded monster appeared in the dark forest.
  </text>
  <text x="50" y="310" class="content">
    那个可怕的怪物出现在黑暗的森林里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="150" class="image" />
    <line x1="100" y1="180" x2="150" y2="150" class="image" />
    <!-- Fearful face -->
    <circle cx="300" cy="100" r="50" class="image" />
    <line x1="280" y1="120" x2="320" y2="120" class="image" />
    <line x1="290" y1="140" x2="310" y2="140" class="image" />
    <line x1="300" y1="150" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="250" y2="250" class="image" />
    <line x1="300" y1="200" x2="350" y2="250" class="image" />
  </g>
</svg>