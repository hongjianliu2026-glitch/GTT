<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ephemeral</text>
  <text x="50" y="120" class="subtitle">[ɪˈfemərəl] adj. 短暂的，朝生暮死的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eph- (出来) + emer (出现) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶从蛹中"出现(eph-emer)"，
    <tspan x="50" dy="25">但它的生命却如朝露般短暂(ephemeral)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beauty of the cherry blossoms is ephemeral.
  </text>
  <text x="50" y="310" class="content">
    樱花的美丽是短暂的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly -->
    <path d="M50 50 C 70 20, 130 20, 150 50 S 230 80, 250 50" class="image" />
    <path d="M50 50 C 70 80, 130 80, 150 50 S 230 20, 250 50" class="image" />
    <!-- Cocoon -->
    <ellipse cx="150" cy="100" rx="50" ry="30" class="image" />
    <!-- Sun -->
    <circle cx="350" cy="50" r="40" class="image" />
    <!-- Dewdrop -->
    <circle cx="350" cy="150" r="10" class="image" />
  </g>
</svg>