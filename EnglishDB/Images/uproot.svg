<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uproot</text>
  <text x="50" y="120" class="subtitle">[ʌpˈruːt] v. 连根拔起，根除</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + root (根)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树被"向上拔起(up-root)"，
    <tspan x="50" dy="25">树根完全暴露在空气中，象征着彻底根除。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm uprooted several trees in the park.
  </text>
  <text x="50" y="310" class="content">
    风暴把公园里的几棵树连根拔起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="150" y1="0" x2="150" y2="150" class="image" />
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="170" x2="150" y2="200" class="image" />
    <!-- Roots -->
    <line x1="130" y1="200" x2="110" y2="230" class="image" />
    <line x1="170" y1="200" x2="190" y2="230" class="image" />
    <line x1="150" y1="200" x2="150" y2="230" class="image" />
    <!-- Uprooted -->
    <line x1="150" y1="0" x2="150" y2="300" class="image" />
    <line x1="150" y1="300" x2="130" y2="330" class="image" />
    <line x1="150" y1="300" x2="170" y2="330" class="image" />
    <line x1="150" y1="300" x2="150" y2="330" class="image" />
  </g>
</svg>