<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lavishly</text>
  <text x="50" y="120" class="subtitle">[ˈlævɪʃli] adv. 慷慨地，丰富地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lavish (丰富的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个富有的商人，"慷慨地(lavishly)"
    <tspan x="50" dy="25">撒下金币，金币像雨一样落下，</tspan>
    <tspan x="50" dy="25">人们欢呼雀跃，场面极其壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He lavishly decorated his mansion for the party.
  </text>
  <text x="50" y="310" class="content">
    他为派对慷慨地装饰了他的豪宅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rich man -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Coins -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="70" r="10" class="image" />
    <circle cx="200" cy="90" r="10" class="image" />
    <circle cx="250" cy="110" r="10" class="image" />
    <circle cx="300" cy="130" r="10" class="image" />
    <!-- People cheering -->
    <circle cx="100" cy="200" r="10" class="image" />
    <circle cx="150" cy="220" r="10" class="image" />
    <circle cx="200" cy="240" r="10" class="image" />
    <circle cx="250" cy="260" r="10" class="image" />
    <circle cx="300" cy="280" r="10" class="image" />
  </g>
</svg>