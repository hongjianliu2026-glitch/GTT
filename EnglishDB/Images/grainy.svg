<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grainy</text>
  <text x="50" y="120" class="subtitle">[ˈɡreɪni] adj. 颗粒状的，有颗粒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grain (谷物) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张照片，上面布满了"谷物(grain)"，
    <tspan x="50" dy="25">这些谷物就像颗粒一样，使得照片看起来"颗粒状(grainy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old film had a grainy texture.
  </text>
  <text x="50" y="310" class="content">
    那部老电影的画面有颗粒感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grainy photo -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Grain particles -->
    <circle cx="80" cy="50" r="5" class="image" />
    <circle cx="120" cy="70" r="5" class="image" />
    <circle cx="160" cy="90" r="5" class="image" />
    <circle cx="200" cy="110" r="5" class="image" />
    <circle cx="240" cy="130" r="5" class="image" />
    <circle cx="280" cy="150" r="5" class="image" />
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="140" cy="120" r="5" class="image" />
    <circle cx="180" cy="140" r="5" class="image" />
    <circle cx="220" cy="160" r="5" class="image" />
  </g>
</svg>