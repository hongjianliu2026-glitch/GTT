<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">planetarium</text>
  <text x="50" y="120" class="subtitle">[ˌplænɪˈtɛəriəm] n. 天文馆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> planeta (行星) + -arium (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆顶建筑，里面布满了闪烁的星星和行星，
    <tspan x="50" dy="25">这就是一个"行星的场所(planetarium)"，让人们可以沉浸在宇宙的奇妙中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We visited the planetarium to learn about the stars.
  </text>
  <text x="50" y="310" class="content">
    我们去天文馆学习了关于星星的知识。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dome -->
    <circle cx="175" cy="100" r="100" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="250" cy="70" r="5" class="image" />
    <circle cx="150" cy="150" r="5" class="image" />
    <circle cx="200" cy="120" r="5" class="image" />
    <!-- Planets -->
    <circle cx="75" cy="100" r="15" class="image" />
    <circle cx="225" cy="100" r="20" class="image" />
    <circle cx="175" cy="50" r="25" class="image" />
  </g>
</svg>