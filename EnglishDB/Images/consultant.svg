<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consultant</text>
  <text x="50" y="120" class="subtitle">[kənˈsʌltənt] n. 顾问，咨询者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sult (坐) + -ant (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个顾问坐在桌子前，"共同坐下(con-sult)"
    <tspan x="50" dy="25">与客户讨论问题，提供专业建议。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hired a consultant to help with her business strategy.
  </text>
  <text x="50" y="310" class="content">
    她聘请了一位顾问来帮助制定商业策略。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Consultant -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Client -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <line x1="250" y1="140" x2="290" y2="130" class="image" />
    <!-- Discussion -->
    <line x1="50" y1="120" x2="250" y2="120" class="image" />
    <line x1="50" y1="140" x2="250" y2="140" class="image" />
    <line x1="50" y1="160" x2="250" y2="160" class="image" />
  </g>
</svg>