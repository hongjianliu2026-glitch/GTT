<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aft</text>
  <text x="50" y="120" class="subtitle">[æft] adv. 在船尾，在飞机尾部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "aft"，意为"在后面"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船，船尾(aft)高高翘起，
    <tspan x="50" dy="25">仿佛在向天空展示它的骄傲。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The captain stood aft, overseeing the crew.
  </text>
  <text x="50" y="310" class="content">
    船长站在船尾，监督船员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Boat -->
    <rect x="0" y="0" width="300" height="100" class="image" />
    <!-- Boat's aft -->
    <polygon points="300,0 350,50 300,100" class="image" />
    <!-- Captain -->
    <circle cx="325" cy="50" r="15" class="image" />
    <line x1="325" y1="65" x2="325" y2="100" class="image" />
    <line x1="325" y1="80" x2="300" y2="90" class="image" />
    <line x1="325" y1="80" x2="350" y2="90" class="image" />
  </g>
</svg>