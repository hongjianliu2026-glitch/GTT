<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bewildered</text>
  <text x="50" y="120" class="subtitle">[bɪˈwɪldəd] adj. 困惑的，不知所措的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + wild (野生的) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"使(be-)"得像"野生的(wild)"动物一样，
    <tspan x="50" dy="25">完全迷失了方向，不知所措(bewildered)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was bewildered by the complex instructions.
  </text>
  <text x="50" y="310" class="content">
    她被复杂的指令弄得不知所措。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Question marks -->
    <text x="50" y="100" class="image" font-size="48">?</text>
    <text x="80" y="100" class="image" font-size="48">?</text>
    <text x="110" y="100" class="image" font-size="48">?</text>
    <!-- Wild animal -->
    <path d="M150,100 C160,80 180,80 190,100 S220,120 210,140" class="image" />
    <circle cx="170" cy="120" r="10" class="image" />
    <line x1="170" y1="130" x2="170" y2="160" class="image" />
    <line x1="170" y1="160" x2="160" y2="180" class="image" />
    <line x1="170" y1="160" x2="180" y2="180" class="image" />
    <line x1="170" y1="140" x2="200" y2="130" class="image" />
  </g>
</svg>