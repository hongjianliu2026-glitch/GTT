<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liberated</text>
  <text x="50" y="120" class="subtitle">[ˈlɪbəˌreɪtɪd] adj. 解放的，自由的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liber (自由) + -ate (使动) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被束缚的人，突然挣脱了枷锁，"自由(liber)"
    <tspan x="50" dy="25">地飞翔，这就是被解放(liberated)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After years of struggle, she finally felt liberated.
  </text>
  <text x="50" y="310" class="content">
    经过多年的挣扎，她终于感到自由了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chains -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="70" y1="20" x2="70" y2="180" class="image" />
    <line x1="90" y1="20" x2="90" y2="180" class="image" />
    <!-- Broken chains -->
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <line x1="70" y1="180" x2="90" y2="200" class="image" />
    <!-- Flying person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <line x1="150" y1="140" x2="190" y2="120" class="image" />
    <!-- Wings -->
    <polyline points="150,80 100,40 150,80 200,40" class="image" />
  </g>
</svg>