<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .snowflake { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snow</text>
  <text x="50" y="120" class="subtitle">[snoʊ] n. 雪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sn- (与雪有关) + ow (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的冬天，"雪(sn-ow)"
    <tspan x="50" dy="25">从天而降，覆盖了整个大地，形成一片银白的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snow covered the mountains and made them look magical.
  </text>
  <text x="50" y="310" class="content">
    雪覆盖了山脉，使它们看起来像魔法一样。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowflakes -->
    <circle cx="50" cy="50" r="10" class="snowflake" />
    <circle cx="100" cy="70" r="12" class="snowflake" />
    <circle cx="150" cy="50" r="10" class="snowflake" />
    <circle cx="200" cy="70" r="12" class="snowflake" />
    <circle cx="250" cy="50" r="10" class="snowflake" />
    <circle cx="300" cy="70" r="12" class="snowflake" />
    <circle cx="350" cy="50" r="10" class="snowflake" />
    <circle cx="400" cy="70" r="12" class="snowflake" />
    <circle cx="450" cy="50" r="10" class="snowflake" />
    <circle cx="500" cy="70" r="12" class="snowflake" />
    <circle cx="550" cy="50" r="10" class="snowflake" />
    <circle cx="600" cy="70" r="12" class="snowflake" />
  </g>
</svg>