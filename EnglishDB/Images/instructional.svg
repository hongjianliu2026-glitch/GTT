<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">instructional</text>
  <text x="50" y="120" class="subtitle">[ɪnˈstrʌkʃənl] adj. 教学的，指导性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + struct (建造) + -ion (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位老师在教室里，"建造(struct)"
    <tspan x="50" dy="25">知识的大厦，让学生"进入(in)"学习的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructional video helped me understand the process.
  </text>
  <text x="50" y="310" class="content">
    教学视频帮助我理解了这个过程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Teacher -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Blackboard -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <!-- Knowledge building -->
    <line x1="120" y1="50" x2="280" y2="50" class="image" />
    <line x1="120" y1="80" x2="250" y2="80" class="image" />
    <line x1="120" y1="110" x2="270" y2="110" class="image" />
    <line x1="120" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>