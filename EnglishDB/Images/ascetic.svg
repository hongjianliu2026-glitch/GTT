<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ascetic</text>
  <text x="50" y="120" class="subtitle">[əˈsetɪk] adj. 苦行的，禁欲的；n. 苦行者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (无) + -sect (切割)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苦行者，"无欲无求(a-sect)"，
    <tspan x="50" dy="25">过着简朴的生活，远离世俗的诱惑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The monk led an ascetic life in the mountains.
  </text>
  <text x="50" y="310" class="content">
    这位僧人在山中过着苦行生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monk -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Simple robe -->
    <rect x="30" y="120" width="40" height="60" class="image" />
    <!-- Mountain -->
    <path d="M100,200 L150,100 L200,200 Z" class="image" />
    <!-- Simple hut -->
    <rect x="120" y="150" width="60" height="40" class="image" />
  </g>
</svg>