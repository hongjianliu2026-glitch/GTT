<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commemorative</text>
  <text x="50" y="120" class="subtitle">[kəˈmemərətɪv] adj. 纪念的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + memor (记忆) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围在一起，"共同记忆(com-memor)"
    <tspan x="50" dy="25">一个重要的事件，这个事件被纪念(commemorative)下来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They unveiled a commemorative plaque for the fallen soldiers.
  </text>
  <text x="50" y="310" class="content">
    他们为阵亡士兵揭幕了一块纪念牌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Plaque -->
    <rect x="70" y="80" width="100" height="50" class="image" />
    <text x="80" y="110" class="content" fill="#2C3E50">纪念</text>
  </g>
</svg>