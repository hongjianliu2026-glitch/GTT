<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">damaged</text>
  <text x="50" y="120" class="subtitle">[ˈdæmɪdʒd] adj. 受损的，损坏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dam (伤害) + age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车被"伤害(dam)"后，车身布满了"痕迹(age)"，
    <tspan x="50" dy="25">这就是一辆受损的汽车(damaged car)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car was badly damaged in the accident.
  </text>
  <text x="50" y="310" class="content">
    这辆车在事故中严重受损。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Damaged parts -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Car windows -->
    <rect x="70" y="20" width="50" height="50" class="image" />
    <rect x="230" y="20" width="50" height="50" class="image" />
    <!-- Car wheels -->
    <circle cx="100" cy="180" r="20" class="image" />
    <circle cx="250" cy="180" r="20" class="image" />
  </g>
</svg>