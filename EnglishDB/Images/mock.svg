<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mock</text>
  <text x="50" y="120" class="subtitle">[mɒk] v. 嘲笑，愚弄；n. 模仿，模拟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mock (模仿，嘲笑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调皮的小丑，"模仿(mock)"
    <tspan x="50" dy="25">别人的动作，逗得大家哈哈大笑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comedian mocked the politician's speech.
  </text>
  <text x="50" y="310" class="content">
    喜剧演员模仿了那位政治家的演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clown face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <!-- Nose -->
    <circle cx="100" cy="110" r="15" class="image" />
    <!-- Mouth -->
    <path d="M 60 130 Q 100 150 140 130" class="image" />
    <!-- Hands -->
    <line x1="50" y1="160" x2="20" y2="200" class="image" />
    <line x1="150" y1="160" x2="180" y2="200" class="image" />
  </g>
</svg>