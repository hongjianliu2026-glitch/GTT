<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mixture</text>
  <text x="50" y="120" class="subtitle">[ˈmɪkstʃər] n. 混合物，混合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mix (混合) + -ture (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疯狂的科学家在实验室里，"混合(mix)"
    <tspan x="50" dy="25">各种奇怪的液体，最终形成了一个奇异的混合物(mixture)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake was made from a mixture of flour, sugar, and eggs.
  </text>
  <text x="50" y="310" class="content">
    蛋糕是由面粉、糖和鸡蛋混合制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beaker -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Liquid 1 -->
    <rect x="10" y="20" width="130" height="50" class="image" fill="#3498DB" />
    <!-- Liquid 2 -->
    <rect x="10" y="80" width="130" height="50" class="image" fill="#E74C3C" />
    <!-- Liquid 3 -->
    <rect x="10" y="140" width="130" height="50" class="image" fill="#F1C40F" />
    <!-- Scientist -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Stirring stick -->
    <line x1="200" y1="100" x2="100" y2="100" class="image" />
  </g>
</svg>