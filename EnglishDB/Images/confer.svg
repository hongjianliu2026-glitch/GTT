<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confer</text>
  <text x="50" y="120" class="subtitle">[kənˈfɜːr] v. 授予，协商</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + fer (带来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人坐在一起，"一起带来(con-fer)"
    <tspan x="50" dy="25">他们的意见和想法，进行协商或授予某物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The committee will confer the award next week.
  </text>
  <text x="50" y="310" class="content">
    委员会将在下周授予奖项。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two people -->
    <circle cx="70" cy="100" r="20" class="image" />
    <circle cx="280" cy="100" r="20" class="image" />
    <!-- Arms and hands -->
    <line x1="70" y1="120" x2="120" y2="120" class="image" />
    <line x1="280" y1="120" x2="230" y2="120" class="image" />
    <line x1="120" y1="120" x2="120" y2="140" class="image" />
    <line x1="230" y1="120" x2="230" y2="140" class="image" />
    <!-- Document -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <line x1="160" y1="60" x2="240" y2="60" class="image" />
    <line x1="160" y1="80" x2="240" y2="80" class="image" />
    <line x1="160" y1="100" x2="240" y2="100" class="image" />
  </g>
</svg>