<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">breathtaking</text>
  <text x="50" y="120" class="subtitle">[ˈbreθˌteɪkɪŋ] adj. 惊人的，令人惊叹的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> breath (呼吸) + take (拿) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在壮丽的山峰前，"呼吸(breath)"
    <tspan x="50" dy="25">都被眼前的景象"拿走(take)"了，</tspan>
    <tspan x="50" dy="25">这种景象就是"惊人的(breathtaking)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The view from the top of the mountain was breathtaking.
  </text>
  <text x="50" y="310" class="content">
    从山顶看到的景色令人惊叹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Person -->
    <circle cx="150" cy="250" r="20" class="image" />
    <line x1="150" y1="270" x2="150" y2="320" class="image" />
    <line x1="150" y1="320" x2="130" y2="350" class="image" />
    <line x1="150" y1="320" x2="170" y2="350" class="image" />
    <line x1="150" y1="290" x2="120" y2="280" class="image" />
    <line x1="150" y1="290" x2="180" y2="280" class="image" />
    <!-- Breath -->
    <path d="M150,250 Q150,200 200,200" class="image" />
    <path d="M150,250 Q150,200 100,200" class="image" />
  </g>
</svg>