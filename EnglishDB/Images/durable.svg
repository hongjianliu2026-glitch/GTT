<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">durable</text>
  <text x="50" y="120" class="subtitle">[ˈdjʊərəbl] adj. 耐用的，持久的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dur (持续) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的时钟，"持续(dur)"
    <tspan x="50" dy="25">运转了几个世纪，它的耐用性(durable)令人惊叹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This material is known for its durable quality.
  </text>
  <text x="50" y="310" class="content">
    这种材料以其耐用性而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Old texture -->
    <rect x="20" y="20" width="160" height="160" fill="#D3D3D3" opacity="0.5" />
    <!-- Rust effect -->
    <circle cx="60" cy="60" r="10" fill="#A52A2A" />
    <circle cx="140" cy="60" r="10" fill="#A52A2A" />
    <circle cx="100" cy="140" r="10" fill="#A52A2A" />
  </g>
</svg>