<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ambivalent</text>
  <text x="50" y="120" class="subtitle">[æmˈbɪvələnt] adj. 矛盾的，矛盾情绪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ambi- (两边) + val (力量) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两个方向之间，"两边都有力量(ambi-val)"，
    <tspan x="50" dy="25">无法决定该往哪边走，这种矛盾的情绪就是ambivalent。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt ambivalent about her new job.
  </text>
  <text x="50" y="310" class="content">
    她对新工作感到矛盾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in the middle -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="220" class="image" />
    <line x1="175" y1="180" x2="195" y2="220" class="image" />
    <line x1="175" y1="140" x2="140" y2="160" class="image" />
    <line x1="175" y1="140" x2="210" y2="160" class="image" />

    <!-- Two directions -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="200" class="image" />
    <line x1="300" y1="100" x2="300" y2="200" class="image" />

    <!-- Arrows -->
    <polygon points="50,200 30,210 40,210" class="image" />
    <polygon points="300,200 310,210 300,210" class="image" />

    <!-- Labels -->
    <text x="30" y="230" class="content">Left</text>
    <text x="280" y="230" class="content">Right</text>
  </g>
</svg>