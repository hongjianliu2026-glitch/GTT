<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">open-air</text>
  <text x="50" y="120" class="subtitle">[ˈoʊpən ɛr] adj. 露天的，户外的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> open (开放的) + air (空气)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的露天剧场，"开放的(open)"
    <tspan x="50" dy="25">空间充满了新鲜的"空气(air)"，这就是open-air的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They enjoyed an open-air concert last weekend.
  </text>
  <text x="50" y="310" class="content">
    他们上周末享受了一场露天音乐会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#FFD700" />
    <!-- Stage -->
    <rect x="50" y="120" width="250" height="60" class="image" fill="#D3D3D3" />
    <!-- Audience -->
    <circle cx="100" cy="180" r="10" class="image" fill="#000000" />
    <circle cx="150" cy="180" r="10" class="image" fill="#000000" />
    <circle cx="200" cy="180" r="10" class="image" fill="#000000" />
    <circle cx="250" cy="180" r="10" class="image" fill="#000000" />
  </g>
</svg>