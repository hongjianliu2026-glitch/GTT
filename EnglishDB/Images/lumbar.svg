<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lumbar</text>
  <text x="50" y="120" class="subtitle">[ˈlʌmbər] adj. 腰部的，腰的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lumb (腰部) + -ar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人弯腰捡东西，"腰部(lumb)"
    <tspan x="50" dy="25">承受了巨大的压力，这就是'腰部的(lumbar)'感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffered from lumbar pain after lifting heavy boxes.
  </text>
  <text x="50" y="310" class="content">
    他在搬重箱子后感到腰部疼痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Human figure -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" /> <!-- Body -->
    <line x1="50" y1="40" x2="30" y2="70" class="image" /> <!-- Left arm -->
    <line x1="50" y1="40" x2="70" y2="70" class="image" /> <!-- Right arm -->
    <line x1="50" y1="100" x2="30" y2="130" class="image" /> <!-- Left leg -->
    <line x1="50" y1="100" x2="70" y2="130" class="image" /> <!-- Right leg -->
    <circle cx="50" cy="20" r="10" class="image" /> <!-- Head -->
    <!-- Lumbar area -->
    <rect x="40" y="60" width="20" height="20" class="image" />
    <text x="45" y="75" class="highlight" font-size="12">LUMBAR</text>
  </g>
</svg>