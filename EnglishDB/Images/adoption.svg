<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adoption</text>
  <text x="50" y="120" class="subtitle">[əˈdɒpʃn] n. 收养，采用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + opt (选择) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭"朝向(ad-)"一个孩子，"选择(opt)"
    <tspan x="50" dy="25">并接纳他/她，这个过程就是收养(adoption)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The couple decided to proceed with the adoption.
  </text>
  <text x="50" y="310" class="content">
    这对夫妇决定继续进行收养程序。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Father -->
    <circle cx="100" cy="100" r="20" class="image" /> <!-- Mother -->
    <circle cx="75" cy="150" r="15" class="image" /> <!-- Child -->
    <!-- Hearts -->
    <path d="M 50 80 Q 75 50 100 80" class="image" />
    <path d="M 75 130 Q 75 100 75 130" class="image" />
  </g>
</svg>