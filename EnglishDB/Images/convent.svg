<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">convent</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnvənt] n. 女修道院</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + vent (来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群修女"一起来到(con-vent)"一个安静的地方，
    <tspan x="50" dy="25">这个地方就是女修道院(convent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The convent was located in a peaceful countryside.
  </text>
  <text x="50" y="310" class="content">
    女修道院位于宁静的乡村。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Convent building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="30" height="30" class="image" />
    <rect x="120" y="40" width="30" height="30" class="image" />
    <rect x="170" y="40" width="30" height="30" class="image" />
    <rect x="220" y="40" width="30" height="30" class="image" />
    <!-- Nuns -->
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <circle cx="200" cy="120" r="15" class="image" />
    <circle cx="250" cy="120" r="15" class="image" />
    <!-- Cross on the roof -->
    <line x1="175" y1="10" x2="175" y2="30" class="image" />
    <line x1="165" y1="20" x2="185" y2="20" class="image" />
  </g>
</svg>