<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hapless</text>
  <text x="50" y="120" class="subtitle">[ˈhæpləs] adj. 不幸的，倒霉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hap (运气) + less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个倒霉的人，"没有运气(hap-less)"，
    <tspan x="50" dy="25">总是遇到各种不幸的事情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hapless traveler lost his luggage at the airport.
  </text>
  <text x="50" y="310" class="content">
    那个不幸的旅行者在机场丢了行李。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Unlucky person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Rain cloud -->
    <ellipse cx="150" cy="50" rx="60" ry="30" class="image" />
    <line x1="120" y1="50" x2="180" y2="50" class="image" />
    <line x1="130" y1="70" x2="170" y2="70" class="image" />
    <line x1="140" y1="90" x2="160" y2="90" class="image" />
    <!-- Rain drops -->
    <line x1="130" y1="100" x2="130" y2="120" class="image" />
    <line x1="150" y1="100" x2="150" y2="120" class="image" />
    <line x1="170" y1="100" x2="170" y2="120" class="image" />
  </g>
</svg>