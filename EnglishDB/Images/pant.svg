<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pant</text>
  <text x="50" y="120" class="subtitle">[pænt] v. 喘气，气喘吁吁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pant (源自拉丁语 "panto"，意为“喘气”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在剧烈运动后，"喘气(pant)"
    <tspan x="50" dy="25">如牛，胸口剧烈起伏，仿佛要吐出心脏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After running a marathon, he was panting heavily.
  </text>
  <text x="50" y="310" class="content">
    跑完马拉松后，他气喘吁吁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person panting -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <!-- Panting effect -->
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <line x1="40" y1="120" x2="60" y2="120" class="image" />
    <line x1="40" y1="130" x2="60" y2="130" class="image" />
  </g>
</svg>