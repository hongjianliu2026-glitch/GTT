<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exhilaration</text>
  <text x="50" y="120" class="subtitle">[ɪɡˌzɪləˈreɪʃən] n. 兴奋，高兴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + hilar (高兴) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从内心深处"发出(ex-)"
    <tspan x="50" dy="25">无比的"高兴(hilar)"，这种感觉就是兴奋(exhilaration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children's laughter filled the room with exhilaration.
  </text>
  <text x="50" y="310" class="content">
    孩子们的笑声充满了房间，带来了兴奋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Happy face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <circle cx="80" cy="80" r="10" class="image" fill="#2C3E50" />
    <circle cx="120" cy="80" r="10" class="image" fill="#2C3E50" />
    <path d="M80 120 Q100 140 120 120" class="image" fill="#2C3E50" />

    <!-- Exclamation marks -->
    <text x="160" y="100" class="image" font-size="48" fill="#E74C3C">!</text>
    <text x="180" y="100" class="image" font-size="48" fill="#E74C3C">!</text>
    <text x="200" y="100" class="image" font-size="48" fill="#E74C3C">!</text>
  </g>
</svg>