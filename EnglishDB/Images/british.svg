<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">British</text>
  <text x="50" y="120" class="subtitle">[ˈbrɪtɪʃ] adj. 英国的，英国人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Brit- (英国) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着高顶礼帽的英国绅士，手持一把雨伞，
    <tspan x="50" dy="25">站在伦敦的街头，这就是典型的"英国的(British)"形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The British are known for their love of tea.
  </text>
  <text x="50" y="310" class="content">
    英国人以爱喝茶而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Top hat -->
    <rect x="150" y="20" width="100" height="20" class="image" />
    <rect x="170" y="0" width="60" height="40" class="image" />
    <!-- Umbrella -->
    <line x1="200" y1="60" x2="200" y2="150" class="image" />
    <path d="M200,60 C220,40 240,40 260,60" class="image" />
    <!-- Gentleman -->
    <circle cx="200" cy="180" r="20" class="image" />
    <line x1="200" y1="200" x2="200" y2="250" class="image" />
    <line x1="200" y1="220" x2="170" y2="230" class="image" />
    <line x1="200" y1="220" x2="230" y2="230" class="image" />
    <line x1="200" y1="250" x2="180" y2="280" class="image" />
    <line x1="200" y1="250" x2="220" y2="280" class="image" />
  </g>
</svg>