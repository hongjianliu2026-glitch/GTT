<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">streamlined</text>
  <text x="50" y="120" class="subtitle">[ˈstriːmlaɪnd] adj. 流线型的，高效的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stream (流) + line (线) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车在高速公路上飞驰，车身设计得像一条流畅的"流线(stream-line)"，
    <tspan x="50" dy="25">减少了空气阻力，使其行驶更加高效(streamlined)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new model is more streamlined, reducing fuel consumption.
  </text>
  <text x="50" y="310" class="content">
    新车型更加流线型，减少了燃油消耗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="100" y="50" width="150" height="50" class="image" />
    <!-- Streamline shape -->
    <path d="M100,50 Q175,25 250,50" class="image" />
    <path d="M100,100 Q175,125 250,100" class="image" />
    <!-- Wheels -->
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="230" cy="100" r="10" class="image" />
  </g>
</svg>