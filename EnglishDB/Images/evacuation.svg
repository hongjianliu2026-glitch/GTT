<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evacuation</text>
  <text x="50" y="120" class="subtitle">[ɪˌvækjuˈeɪʃn] n. 撤离，疏散</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + vac (空) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个紧急情况，人们"走出(e-vac)"一个拥挤的场所，
    <tspan x="50" dy="25">留下"空(vac)"无一人的场景，这就是撤离(evacuation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evacuation of the city was completed within two hours.
  </text>
  <text x="50" y="310" class="content">
    城市的撤离在两小时内完成。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People leaving -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <!-- Empty space -->
    <rect x="200" y="20" width="150" height="150" class="image" />
    <text x="220" y="100" class="content" fill="#7F8C8D">Empty</text>
  </g>
</svg>