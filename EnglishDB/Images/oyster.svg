<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oyster</text>
  <text x="50" y="120" class="subtitle">[ˈɔɪstər] n. 牡蛎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oy- (海洋) + ster (生物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海洋(oy-)中，一只神秘的生物(ster)
    <tspan x="50" dy="25">缓缓张开它的壳，露出里面珍贵的珍珠。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a pearl inside the oyster.
  </text>
  <text x="50" y="310" class="content">
    她在牡蛎里发现了一颗珍珠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#85C1E9" />
    <!-- Oyster -->
    <ellipse cx="175" cy="100" rx="50" ry="30" class="image" fill="#D7DBDD" />
    <!-- Pearl -->
    <circle cx="175" cy="100" r="10" class="image" fill="#F1C40F" />
  </g>
</svg>