<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flaw</text>
  <text x="50" y="120" class="subtitle">[flɔː] n. 瑕疵，缺陷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flaw (裂缝)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块完美的玻璃上突然出现了一条裂缝，
    <tspan x="50" dy="25">这条裂缝就是瑕疵(flaw)，破坏了原本的完美。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flaw in the diamond was barely noticeable.
  </text>
  <text x="50" y="310" class="content">
    钻石上的瑕疵几乎看不见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass pane -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flaw -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Crack -->
    <line x1="100" y1="80" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="200" y2="80" class="image" />
    <line x1="200" y1="80" x2="250" y2="120" class="image" />
  </g>
</svg>