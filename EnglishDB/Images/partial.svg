<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">partial</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːrʃl] adj. 部分的，不完全的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> part (部分) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕，"部分(part)"被切下来，
    <tspan x="50" dy="25">剩下的部分就是"不完全的(partial)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was only a partial success.
  </text>
  <text x="50" y="310" class="content">
    这个项目只取得了部分成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Slice of cake -->
    <path d="M 100 100 L 180 20 A 80 80 0 0 0 100 100" class="image" />
    <!-- Remaining part -->
    <path d="M 100 100 L 20 20 A 80 80 0 0 1 100 100" class="image" />
    <!-- Arrow -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,90 260,100 250,110" class="image" />
    <!-- Text -->
    <text x="270" y="105" class="content">partial</text>
  </g>
</svg>