<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">central</text>
  <text x="50" y="120" class="subtitle">[ˈsɛntrəl] adj. 中心的，中央的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> centr (中心) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的城市，所有的道路都汇聚到"中心(centr)"，
    <tspan x="50" dy="25">这个中心就是城市的"中央(central)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The central train station is the busiest place in the city.
  </text>
  <text x="50" y="310" class="content">
    中央火车站是城市里最繁忙的地方。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Central point -->
    <circle cx="175" cy="100" r="20" fill="#E74C3C" />
    <!-- Roads -->
    <line x1="175" y1="120" x2="175" y2="200" class="image" />
    <line x1="175" y1="80" x2="175" y2="0" class="image" />
    <line x1="155" y1="100" x2="0" y2="100" class="image" />
    <line x1="195" y1="100" x2="350" y2="100" class="image" />
    <!-- Label -->
    <text x="165" y="220" class="content" text-anchor="middle">Central</text>
  </g>
</svg>