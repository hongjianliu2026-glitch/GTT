<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pointless</text>
  <text x="50" y="120" class="subtitle">[ˈpɔɪntlɪs] adj. 无意义的，无目的的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> point (点) + less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有目标的箭头，"无点(point-less)"
    <tspan x="50" dy="25">指向任何地方，完全失去了方向和意义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting was completely pointless; we achieved nothing.
  </text>
  <text x="50" y="310" class="content">
    那次会议完全没有意义；我们什么也没达成。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow without a point -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="230" y2="30" class="image" />
    <line x1="250" y1="50" x2="230" y2="70" class="image" />
    <!-- Missing point -->
    <circle cx="50" cy="50" r="10" class="image" />
    <text x="40" y="65" class="content" fill="#C0392B">?</text>
  </g>
</svg>