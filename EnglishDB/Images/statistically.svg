<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">statistically</text>
  <text x="50" y="120" class="subtitle">[stəˈtɪstɪkli] adv. 统计上地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stat (站立) + -ist (人) + -ical (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个统计学家站在一堆数据前，"站立(stat)"
    <tspan x="50" dy="25">在数据中，用统计的方法分析数据，这就是统计上地(statistically)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Statistically, the number of accidents has decreased this year.
  </text>
  <text x="50" y="310" class="content">
    统计上来说，今年的事故数量减少了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Data points -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="100" cy="120" r="10" class="image" />
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="200" cy="140" r="10" class="image" />
    <circle cx="250" cy="90" r="10" class="image" />
    <!-- Statistician -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="350" y2="120" class="image" />
    <!-- Data lines -->
    <line x1="50" y1="100" x2="250" y2="90" class="image" />
    <line x1="100" y1="120" x2="200" y2="140" class="image" />
    <line x1="150" y1="80" x2="150" y2="140" class="image" />
  </g>
</svg>