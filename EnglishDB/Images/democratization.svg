<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">democratization</text>
  <text x="50" y="120" class="subtitle">[ˌdɛməˌkrætəˈzeɪʃən] n. 民主化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> demo- (人民) + -cracy (统治) + -ize (使成为) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的广场上，"人民(demo)"
    <tspan x="50" dy="25">聚集在一起，共同参与"统治(cracy)"</tspan>
    <tspan x="50" dy="25">的过程，这就是"民主化(democratization)"的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The democratization of the internet has empowered many people.
  </text>
  <text x="50" y="310" class="content">
    互联网的民主化赋予了许多人权力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Square representing the public square -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="300" cy="50" r="10" class="image" />
    <!-- Voting box -->
    <rect x="150" y="100" width="50" height="50" class="image" />
    <!-- Hands -->
    <line x1="160" y1="110" x2="160" y2="150" class="image" />
    <line x1="170" y1="110" x2="170" y2="150" class="image" />
    <line x1="180" y1="110" x2="180" y2="150" class="image" />
    <line x1="190" y1="110" x2="190" y2="150" class="image" />
  </g>
</svg>