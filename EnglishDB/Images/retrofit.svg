<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retrofit</text>
  <text x="50" y="120" class="subtitle">[ˈretrəʊfɪt] v. 改造，翻新</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> retro- (向后) + fit (适合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆旧车被"向后适合(retro-fit)"
    <tspan x="50" dy="25">成了一辆新车，这就是改造(retrofit)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old factory was retrofitted to meet modern standards.
  </text>
  <text x="50" y="310" class="content">
    旧工厂被改造以符合现代标准。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old car -->
    <rect x="0" y="0" width="150" height="70" class="image" />
    <rect x="10" y="10" width="130" height="50" class="image" />
    <circle cx="30" cy="40" r="10" class="image" />
    <circle cx="120" cy="40" r="10" class="image" />
    <!-- New car -->
    <rect x="200" y="0" width="150" height="70" class="image" />
    <rect x="210" y="10" width="130" height="50" class="image" />
    <circle cx="230" cy="40" r="10" class="image" />
    <circle cx="320" cy="40" r="10" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="35" x2="200" y2="35" class="image" />
    <polygon points="190,30 200,35 190,40" class="image" />
  </g>
</svg>