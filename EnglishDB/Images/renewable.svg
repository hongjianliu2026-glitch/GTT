<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">renewable</text>
  <text x="50" y="120" class="subtitle">[rɪˈnuːəbl] adj. 可再生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + new (新的) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林，"再次变成(re-new)"
    <tspan x="50" dy="25">新的树木，这些树木是可再生的(renewable)资源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Solar energy is a renewable source of power.
  </text>
  <text x="50" y="310" class="content">
    太阳能是一种可再生的能源。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
    <line x1="200" y1="150" x2="200" y2="50" class="image" />
    <line x1="250" y1="150" x2="250" y2="50" class="image" />
    <!-- Renewing symbol -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="80" x2="300" y2="120" class="image" />
    <line x1="280" y1="100" x2="320" y2="100" class="image" />
  </g>
</svg>