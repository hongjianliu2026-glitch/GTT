<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frill</text>
  <text x="50" y="120" class="subtitle">[frɪl] n. 褶边，饰边</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frill (源自中古英语，意为“褶边”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件华丽的礼服，上面装饰着"褶边(frill)"，
    <tspan x="50" dy="25">这些褶边像波浪一样起伏，增添了优雅和华丽感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a dress with intricate frills.
  </text>
  <text x="50" y="310" class="content">
    她穿了一件饰有复杂褶边的礼服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dress -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Frills -->
    <path d="M50,20 Q70,50 100,20 T150,20 T200,20 T250,20 T300,20" class="image" />
    <path d="M50,50 Q70,80 100,50 T150,50 T200,50 T250,50 T300,50" class="image" />
    <path d="M50,80 Q70,110 100,80 T150,80 T200,80 T250,80 T300,80" class="image" />
    <path d="M50,110 Q70,140 100,110 T150,110 T200,110 T250,110 T300,110" class="image" />
    <!-- Dress body -->
    <rect x="100" y="140" width="150" height="60" class="image" />
  </g>
</svg>