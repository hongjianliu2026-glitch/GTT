<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Cajun</text>
  <text x="50" y="120" class="subtitle">[ˈkeɪdʒən] n. 卡津人，卡津菜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自法语“Acadien”，指从阿卡迪亚（现加拿大东部）被驱逐到路易斯安那州的法国后裔。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群法国后裔在路易斯安那州的沼泽地中，烹饪着独特的卡津菜，他们的文化与美食融合，形成了独特的卡津文化。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Cajun restaurant served delicious gumbo and jambalaya.
  </text>
  <text x="50" y="310" class="content">
    这家卡津餐厅提供了美味的秋葵汤和什锦饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Swamp -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cajun house -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Cooking pot -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <!-- Gumbo -->
    <line x1="180" y1="140" x2="220" y2="140" class="image" />
    <line x1="180" y1="160" x2="220" y2="160" class="image" />
    <line x1="180" y1="180" x2="220" y2="180" class="image" />
    <!-- Cajun person -->
    <circle cx="250" cy="60" r="15" class="image" />
    <line x1="250" y1="75" x2="250" y2="110" class="image" />
    <line x1="250" y1="110" x2="230" y2="140" class="image" />
    <line x1="250" y1="110" x2="270" y2="140" class="image" />
    <line x1="250" y1="90" x2="280" y2="80" class="image" />
  </g>
</svg>