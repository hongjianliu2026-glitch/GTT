<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">likable</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪkəbl] adj. 可爱的，讨人喜欢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> like (喜欢) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微笑的小狗，"能够被喜欢(like-able)"
    <tspan x="50" dy="25">因为它总是那么可爱和友好。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a likable person, always making friends easily.
  </text>
  <text x="50" y="310" class="content">
    她是一个讨人喜欢的人，总是很容易交到朋友。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Smile -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
    <!-- Heart -->
    <path d="M 150 80 C 150 35, 200 35, 200 80 S 250 125, 200 160" class="image" />
  </g>
</svg>