<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cherry { fill: #D35400; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cherry</text>
  <text x="50" y="120" class="subtitle">[ˈtʃeri] n. 樱桃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "cherise"，来自古法语 "cerise"，
    <tspan x="50" dy="25">最终源自拉丁语 "cerasum"，意为“樱桃树”。</tspan>
  </text>

  <!-- Story -->
  <text x="50" y="240" class="story">
    想象一个巨大的樱桃树，树上挂满了鲜红的樱桃，
    <tspan x="50" dy="25">每一颗樱桃都像是一个小小的红色宝石，闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="310" class="content">
    <tspan class="highlight">例句:</tspan> She picked a handful of cherries from the tree.
  </text>
  <text x="50" y="340" class="content">
    她从树上摘了一把樱桃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cherry tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <!-- Cherries -->
    <circle cx="80" cy="50" r="20" class="cherry" />
    <circle cx="120" cy="70" r="20" class="cherry" />
    <circle cx="100" cy="100" r="20" class="cherry" />
    <circle cx="140" cy="120" r="20" class="cherry" />
    <circle cx="80" cy="150" r="20" class="cherry" />
    <circle cx="120" cy="170" r="20" class="cherry" />
  </g>
</svg>