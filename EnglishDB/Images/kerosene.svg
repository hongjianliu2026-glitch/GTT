<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kerosene</text>
  <text x="50" y="120" class="subtitle">[ˈkɛrəˌsin] n. 煤油</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kero- (蜡) + -sene (油)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的蜡烛工厂，工人们正在从蜡中提取出一种特殊的油，这种油就是煤油(kerosene)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He filled the lantern with kerosene before setting out on his journey.
  </text>
  <text x="50" y="310" class="content">
    他在出发前给灯笼加满了煤油。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candle factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Candle -->
    <rect x="50" y="20" width="20" height="100" class="image" />
    <circle cx="60" cy="130" r="10" class="image" />
    <!-- Oil extraction -->
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <line x1="100" y1="80" x2="200" y2="80" class="image" />
    <line x1="100" y1="110" x2="200" y2="110" class="image" />
    <line x1="100" y1="140" x2="200" y2="140" class="image" />
    <!-- Oil container -->
    <rect x="250" y="20" width="50" height="160" class="image" />
    <line x1="275" y1="20" x2="275" y2="180" class="image" />
  </g>
</svg>