<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">erupt</text>
  <text x="50" y="120" class="subtitle">[ɪˈrʌpt] v. 爆发，喷发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + rupt (破裂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座火山，"破裂(rupt)"后"喷出(e-)"
    <tspan x="50" dy="25">熔岩和烟雾，这就是火山爆发(erupt)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The volcano erupted violently, spewing lava and ash.
  </text>
  <text x="50" y="310" class="content">
    火山猛烈喷发，喷出熔岩和灰烬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Volcano -->
    <polygon points="0,200 100,0 200,200" class="image" />
    <!-- Lava -->
    <circle cx="100" cy="200" r="50" fill="#E74C3C" />
    <!-- Smoke -->
    <ellipse cx="100" cy="100" rx="70" ry="30" fill="#8E44AD" />
    <ellipse cx="100" cy="50" rx="50" ry="20" fill="#8E44AD" />
    <ellipse cx="100" cy="20" rx="30" ry="10" fill="#8E44AD" />
  </g>
</svg>