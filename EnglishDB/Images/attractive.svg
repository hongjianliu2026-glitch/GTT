<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">attractive</text>
  <text x="50" y="120" class="subtitle">[əˈtræktɪv] adj. 吸引人的，有魅力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> attract (吸引) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个闪闪发光的宝石，"吸引(attract)"
    <tspan x="50" dy="25">所有人的目光，它就是如此有魅力(attractive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has an attractive personality.
  </text>
  <text x="50" y="310" class="content">
    她有一种吸引人的个性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gemstone -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Sparkles -->
    <circle cx="70" cy="70" r="5" class="image" fill="#FFFFFF" />
    <circle cx="130" cy="70" r="5" class="image" fill="#FFFFFF" />
    <circle cx="100" cy="130" r="5" class="image" fill="#FFFFFF" />
    <!-- Eyes -->
    <circle cx="200" cy="100" r="20" class="image" fill="#000000" />
    <circle cx="250" cy="100" r="20" class="image" fill="#000000" />
    <!-- Smile -->
    <path d="M200,130 Q225,150 250,130" class="image" fill="none" stroke="#000000" stroke-width="3" />
  </g>
</svg>