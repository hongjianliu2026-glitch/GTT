<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">toy</text>
  <text x="50" y="120" class="subtitle">[tɔɪ] n. 玩具</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "toye"，意为“小玩意”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在玩一个"小玩意(toye)"，
    <tspan x="50" dy="25">这个玩意让他开心得不得了，这就是玩具(toy)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child was playing with his new toy.
  </text>
  <text x="50" y="310" class="content">
    孩子在玩他的新玩具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toy -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Child -->
    <circle cx="200" cy="50" r="30" class="image" />
    <line x1="200" y1="80" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="170" y2="200" class="image" />
    <line x1="200" y1="150" x2="230" y2="200" class="image" />
    <line x1="200" y1="120" x2="250" y2="110" class="image" />
    <!-- Smile -->
    <path d="M210,60 Q220,50 230,60" class="image" />
    <!-- Toy in hand -->
    <line x1="200" y1="120" x2="150" y2="50" class="image" />
  </g>
</svg>