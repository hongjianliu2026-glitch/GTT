<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nick</text>
  <text x="50" y="120" class="subtitle">[nɪk] v. 刻痕，刻划；n. 刻痕，缺口</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nik (刻痕)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀在木头上"刻下(nik)"
    <tspan x="50" dy="25">一道深深的痕迹，这就是一个刻痕(nick)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He accidentally nicked the table with his knife.
  </text>
  <text x="50" y="310" class="content">
    他不小心用刀在桌子上刻了一道痕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wooden surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Knife -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="140" y2="160" class="image" />
    <line x1="150" y1="150" x2="160" y2="160" class="image" />
    <!-- Nick -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="90" y2="160" class="image" />
    <line x1="100" y1="150" x2="110" y2="160" class="image" />
  </g>
</svg>