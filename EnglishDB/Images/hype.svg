<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hype</text>
  <text x="50" y="120" class="subtitle">[haɪp] n. 炒作，大肆宣传；v. 大肆宣传</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hyp- (下面) + e (强调)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的喇叭在"下面(hyp-)"，
    <tspan x="50" dy="25">发出震耳欲聋的声音，这就是"大肆宣传(hype)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was surrounded by a lot of hype before its release.
  </text>
  <text x="50" y="310" class="content">
    这部电影在发布前被大肆宣传。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large speaker -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Sound waves -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Exclamation marks -->
    <text x="100" y="100" class="image" font-size="48" fill="#E74C3C">!!!</text>
  </g>
</svg>