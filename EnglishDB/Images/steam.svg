<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .steam { fill: #B2D8FF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">steam</text>
  <text x="50" y="120" class="subtitle">[stiːm] n. 蒸汽，水汽；v. 蒸发，冒蒸汽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + eam (流)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一锅热水，"站立着流动(st-eam)"
    <tspan x="50" dy="25">的水汽，这些水汽就形成了蒸汽(steam)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kettle began to steam as it boiled.
  </text>
  <text x="50" y="310" class="content">
    水壶开始冒蒸汽，因为它沸腾了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kettle -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Steam -->
    <ellipse cx="100" cy="0" rx="50" ry="20" class="steam" />
    <ellipse cx="100" cy="20" rx="40" ry="15" class="steam" />
    <ellipse cx="100" cy="40" rx="30" ry="10" class="steam" />
    <!-- Handle -->
    <line x1="200" y1="50" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
  </g>
</svg>