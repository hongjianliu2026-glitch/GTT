<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bowl</text>
  <text x="50" y="120" class="subtitle">[boʊl] n. 碗，木球；v. 投球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> b(e) + oll (球)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的碗(bowl)，里面装满了各种球，
    <tspan x="50" dy="25">这些球在碗里滚动，发出清脆的声音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She served soup in a large bowl.
  </text>
  <text x="50" y="310" class="content">
    她用一个大碗盛汤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Balls -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
  </g>
</svg>