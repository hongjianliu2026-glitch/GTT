<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">purported</text>
  <text x="50" y="120" class="subtitle">[pərˈpɔːrtɪd] adj. 声称的，所谓的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pur- (向前) + port (携带) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一个巨大的喇叭，"向前携带(pur-port)"
    <tspan x="50" dy="25">信息，但这些信息可能是未经证实的，所以是"声称的(purported)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The purported expert turned out to be a fraud.
  </text>
  <text x="50" y="310" class="content">
    那个所谓的专家原来是个骗子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a megaphone -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="210" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="210" class="image" /> <!-- Right leg -->
    <rect x="30" y="80" width="40" height="20" class="image" /> <!-- Megaphone -->
    <line x1="50" y1="80" x2="50" y2="100" class="image" /> <!-- Megaphone handle -->
  </g>
</svg>