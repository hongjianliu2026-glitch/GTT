<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #D35400; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wheat</text>
  <text x="50" y="120" class="subtitle">[wiːt] n. 小麦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "whete"，古英语 "hwæte"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片金黄的麦田，风吹过时，
    <tspan x="50" dy="25">"小麦(wheat)" 随风摇曳，仿佛在向你招手。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer harvested a field of wheat.
  </text>
  <text x="50" y="310" class="content">
    农民收获了一片小麦田。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wheat field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wheat stalks -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Wheat heads -->
    <circle cx="50" cy="20" r="10" class="image" />
    <circle cx="100" cy="20" r="10" class="image" />
    <circle cx="150" cy="20" r="10" class="image" />
    <circle cx="200" cy="20" r="10" class="image" />
    <circle cx="250" cy="20" r="10" class="image" />
    <circle cx="300" cy="20" r="10" class="image" />
  </g>
</svg>