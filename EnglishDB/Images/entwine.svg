<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entwine</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtwaɪn] v. 缠绕，交织</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + twine (缠绕)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根藤蔓"进入(en-)"另一根藤蔓，
    <tspan x="50" dy="25">它们紧紧"缠绕(twine)"在一起，形成了一个复杂的交织结构。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vines entwined around the tree trunk.
  </text>
  <text x="50" y="310" class="content">
    藤蔓缠绕在树干上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vines -->
    <path d="M50,50 C100,0 150,100 200,50" class="image" />
    <path d="M50,50 C100,100 150,0 200,50" class="image" />
    <path d="M100,100 C150,50 200,150 250,100" class="image" />
    <path d="M100,100 C150,150 200,50 250,100" class="image" />
    <!-- Tree trunk -->
    <rect x="150" y="0" width="20" height="200" class="image" />
  </g>
</svg>