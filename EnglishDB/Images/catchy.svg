<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">catchy</text>
  <text x="50" y="120" class="subtitle">[ˈkætʃi] adj. 易记住的，引人注目的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> catch (抓住) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一首旋律，"抓住(catch)"你的耳朵，
    <tspan x="50" dy="25">让你无法忘怀，这就是catchy(易记住的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jingle had a catchy tune that everyone remembered.
  </text>
  <text x="50" y="310" class="content">
    那段广告曲调非常易记，大家都记住了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Music note -->
    <path d="M10 100 Q50 50 100 100 T190 100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Ear -->
    <path d="M220 100 C250 50 280 50 310 100" class="image" />
    <circle cx="265" cy="100" r="15" class="image" />
    <!-- Captured heart -->
    <path d="M350 100 C380 50 410 50 440 100" class="image" />
    <circle cx="400" cy="100" r="15" class="image" />
    <path d="M390 100 L410 120 L400 140 Z" class="image" />
  </g>
</svg>