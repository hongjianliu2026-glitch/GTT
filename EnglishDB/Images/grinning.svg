<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grinning</text>
  <text x="50" y="120" class="subtitle">[ˈɡrɪnɪŋ] adj. 露齿笑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grin (露齿笑) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在镜子前，"露齿笑(grin)"
    <tspan x="50" dy="25">得合不拢嘴，脸上洋溢着灿烂的笑容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was grinning from ear to ear after winning the prize.
  </text>
  <text x="50" y="310" class="content">
    他赢得奖品后，笑得合不拢嘴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Face -->
    <circle cx="175" cy="100" r="70" class="image" />
    <!-- Eyes -->
    <circle cx="140" cy="80" r="10" class="image" />
    <circle cx="210" cy="80" r="10" class="image" />
    <!-- Grin -->
    <path d="M120,140 Q175,180 230,140" class="image" />
  </g>
</svg>