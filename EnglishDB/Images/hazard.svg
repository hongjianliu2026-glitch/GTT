<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hazard</text>
  <text x="50" y="120" class="subtitle">[ˈhæzərd] n. 危险，风险；v. 冒险</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> haza (来自阿拉伯语，意为“障碍”) + -ard (表示状态或性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冒险家在一片充满"障碍(haza)"的荒野中，
    <tspan x="50" dy="25">每一步都可能遇到危险(hazard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Driving in heavy fog is a hazard.
  </text>
  <text x="50" y="310" class="content">
    在浓雾中开车很危险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wilderness -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Obstacles -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Adventurer -->
    <circle cx="30" cy="100" r="15" class="image" />
    <line x1="30" y1="115" x2="30" y2="150" class="image" />
    <line x1="30" y1="150" x2="10" y2="180" class="image" />
    <line x1="30" y1="150" x2="50" y2="180" class="image" />
    <line x1="30" y1="130" x2="70" y2="120" class="image" />
  </g>
</svg>