<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pueblo</text>
  <text x="50" y="120" class="subtitle">[ˈpwebl̩oʊ] n. 普韦布洛（美国西南部印第安人村落）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pueblo (源自西班牙语，意为“村庄”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的印第安村落，"普韦布洛(pueblo)"
    <tspan x="50" dy="25">是由多层建筑组成的，人们在这里生活、工作，</tspan>
    <tspan x="50" dy="25">形成了一个紧密的社区。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pueblo architecture is unique to the Southwest.
  </text>
  <text x="50" y="310" class="content">
    普韦布洛建筑风格是西南地区的独特标志。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pueblo structure -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="70" y="40" width="210" height="120" class="image" />
    <rect x="90" y="60" width="170" height="80" class="image" />
    <!-- Windows -->
    <rect x="100" y="70" width="20" height="20" class="image" />
    <rect x="140" y="70" width="20" height="20" class="image" />
    <rect x="180" y="70" width="20" height="20" class="image" />
    <!-- Door -->
    <rect x="130" y="120" width="40" height="40" class="image" />
    <!-- People -->
    <circle cx="110" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="190" cy="100" r="10" class="image" />
  </g>
</svg>