<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #641E16; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #922B21; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fume</text>
  <text x="50" y="120" class="subtitle">[fjuːm] n. 烟，气；v. 冒烟，发怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fum (烟)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个生气的老板，"冒烟(fume)"
    <tspan x="50" dy="25">从他的头顶升起，就像火山爆发一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory chimney fumed all day long.
  </text>
  <text x="50" y="310" class="content">
    工厂的烟囱整天冒烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Smoke -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="70" cy="70" r="25" class="image" />
    <circle cx="90" cy="90" r="20" class="image" />
    <circle cx="110" cy="110" r="15" class="image" />
    <circle cx="130" cy="130" r="10" class="image" />
    <!-- Angry face -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="180" y1="90" x2="190" y2="100" class="image" />
    <line x1="210" y1="90" x2="200" y2="100" class="image" />
    <line x1="180" y1="110" x2="220" y2="110" class="image" />
  </g>
</svg>