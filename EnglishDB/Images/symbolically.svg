<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">symbolically</text>
  <text x="50" y="120" class="subtitle">[sɪmˈbɒlɪkli] adv. 象征性地，符号化地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sym- (一起) + bol (投掷) + -ic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"共同投掷(sym-bol)"
    <tspan x="50" dy="25">象征性的物品，这些物品代表了他们的信仰和价值观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ceremony was performed symbolically to honor the ancestors.
  </text>
  <text x="50" y="310" class="content">
    这个仪式象征性地举行，以纪念祖先。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle of people -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Symbols -->
    <line x1="120" y1="100" x2="280" y2="100" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- People -->
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="280" cy="100" r="15" class="image" />
    <circle cx="200" cy="20" r="15" class="image" />
    <circle cx="200" cy="180" r="15" class="image" />
  </g>
</svg>