<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">narcissistic</text>
  <text x="50" y="120" class="subtitle">[ˌnɑːrsɪˈsɪstɪk] adj. 自恋的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> narciss (自恋) + -istic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"自恋地(narciss)"
    <tspan x="50" dy="25">欣赏自己的倒影，完全沉浸在自己的世界里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was so narcissistic that he only cared about his own appearance.
  </text>
  <text x="50" y="310" class="content">
    他非常自恋，只关心自己的外表。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="170" y2="220" class="image" />
    <line x1="200" y1="180" x2="230" y2="220" class="image" />
    <line x1="200" y1="150" x2="150" y2="140" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
    <!-- Reflection -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="170" y2="220" class="image" />
    <line x1="200" y1="180" x2="230" y2="220" class="image" />
    <line x1="200" y1="150" x2="150" y2="140" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
  </g>
</svg>