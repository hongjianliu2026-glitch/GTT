<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .otter { fill: #A0C5E8; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">otter</text>
  <text x="50" y="120" class="subtitle">[ˈɒtə(r)] n. 水獭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> otter (源自中古英语，意为“水獭”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只水獭在水中灵活地游动，它的身体像一条光滑的鱼，
    <tspan x="50" dy="25">尾巴轻轻摆动，帮助它在水中保持平衡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The otter gracefully swam in the river.
  </text>
  <text x="50" y="310" class="content">
    水獭在河中优雅地游泳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Otter -->
    <ellipse cx="175" cy="100" rx="50" ry="30" class="otter" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
    <!-- Tail -->
    <path d="M 225 140 Q 250 120 275 140" class="otter" />
  </g>
</svg>