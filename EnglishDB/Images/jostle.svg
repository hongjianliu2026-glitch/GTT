<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jostle</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɒsl] v. 推挤，挤开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jost (推) + -le (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在拥挤的地铁里，人们不停地"推(jost)"来"推(jost)"去，
    <tspan x="50" dy="25">试图找到一个站立的空间，这就是"推挤(jostle)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He had to jostle his way through the crowd to reach the exit.
  </text>
  <text x="50" y="310" class="content">
    他不得不推挤着穿过人群，才能到达出口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Person jostling -->
    <circle cx="125" cy="100" r="20" class="image" />
    <line x1="125" y1="120" x2="125" y2="150" class="image" />
    <line x1="125" y1="150" x2="105" y2="180" class="image" />
    <line x1="125" y1="150" x2="145" y2="180" class="image" />
    <line x1="125" y1="130" x2="175" y2="120" class="image" />
  </g>
</svg>