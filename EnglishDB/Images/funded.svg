<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">funded</text>
  <text x="50" y="120" class="subtitle">[ˈfʌndɪd] adj. 有资金的，已拨款的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fund (资金) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金库，里面堆满了金币，
    <tspan x="50" dy="25">这些金币象征着"资金(fund)"，而金库被"已拨款(funded)"的标签封印。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was funded by a private investor.
  </text>
  <text x="50" y="310" class="content">
    这个项目由一位私人投资者资助。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vault -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Coins -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="80" cy="50" r="15" class="image" />
    <circle cx="110" cy="50" r="15" class="image" />
    <circle cx="140" cy="50" r="15" class="image" />
    <circle cx="170" cy="50" r="15" class="image" />
    <!-- Label -->
    <rect x="200" y="20" width="100" height="30" class="image" />
    <text x="210" y="40" class="content">funded</text>
  </g>
</svg>