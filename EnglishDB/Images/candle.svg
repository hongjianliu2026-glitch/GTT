<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FFA500; }
      .wax { fill: #F4D03F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">candle</text>
  <text x="50" y="120" class="subtitle">[ˈkændl] n. 蜡烛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cand (发光) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小蜡烛(candle)，它发出微弱的光芒，
    <tspan x="50" dy="25">就像一个小小的发光体(cand)，照亮了黑暗的房间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She lit a candle to create a cozy atmosphere.
  </text>
  <text x="50" y="310" class="content">
    她点燃了一支蜡烛，营造出温馨的氛围。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candle wax -->
    <rect x="0" y="0" width="100" height="200" class="wax" />
    <!-- Flame -->
    <polygon points="40,0 60,0 50,20" class="flame" />
    <!-- Wick -->
    <line x1="50" y1="20" x2="50" y2="50" class="image" />
  </g>
</svg>