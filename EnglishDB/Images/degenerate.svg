<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">degenerate</text>
  <text x="50" y="120" class="subtitle">[dɪˈdʒenəreɪt] v. 退化，堕落；n. 堕落者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + gener (产生) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个曾经辉煌的文明，"向下产生(de-gener-ate)"
    <tspan x="50" dy="25">出腐败和堕落，最终沦为一个堕落者(degenerate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The once great empire degenerated into chaos.
  </text>
  <text x="50" y="310" class="content">
    这个曾经伟大的帝国堕落成了混乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken crown -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Broken pillars -->
    <rect x="20" y="160" width="30" height="100" class="image" />
    <rect x="150" y="160" width="30" height="100" class="image" />
    <line x1="35" y1="160" x2="165" y2="160" class="image" />
    <line x1="35" y1="260" x2="165" y2="260" class="image" />
    <!-- Chaos symbol -->
    <circle cx="250" cy="210" r="40" class="image" />
    <line x1="210" y1="210" x2="290" y2="210" class="image" />
    <line x1="250" y1="170" x2="250" y2="250" class="image" />
    <line x1="230" y1="190" x2="270" y2="230" class="image" />
    <line x1="230" y1="230" x2="270" y2="190" class="image" />
  </g>
</svg>