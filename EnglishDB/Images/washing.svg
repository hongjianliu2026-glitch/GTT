<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">washing</text>
  <text x="50" y="120" class="subtitle">[ˈwɒʃɪŋ] n. 洗涤，清洗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wash (洗) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的洗衣机，里面装满了衣服，水流不断冲刷，"洗(wash)"
    <tspan x="50" dy="25">衣服的过程就是洗涤(washing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hung the washing out to dry.
  </text>
  <text x="50" y="310" class="content">
    她把洗好的衣服挂出去晾干。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Washing machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Drum -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Water flow -->
    <line x1="175" y1="20" x2="175" y2="80" class="image" />
    <line x1="175" y1="20" x2="155" y2="40" class="image" />
    <line x1="175" y1="20" x2="195" y2="40" class="image" />
    <!-- Clothes -->
    <rect x="100" y="40" width="50" height="30" class="image" />
    <rect x="200" y="40" width="50" height="30" class="image" />
    <rect x="150" y="70" width="50" height="30" class="image" />
  </g>
</svg>