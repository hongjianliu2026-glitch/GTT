<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #6D4C41; }
      .content { font: 18px sans-serif; fill: #3E2723; }
      .highlight { font-weight: bold; fill: #B71C1C; }
      .story { font: 16px serif; fill: #4E342E; }
      .image { stroke: #4E342E; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coffin</text>
  <text x="50" y="120" class="subtitle">[ˈkɒfɪn] n. 棺材</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cof- (箱子) + -fin (结束)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的木箱子，"箱子(cof-)"里装着
    <tspan x="50" dy="25">一个人的生命"结束(fin)"，这就是棺材(coffin)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The funeral procession carried the coffin to the cemetery.
  </text>
  <text x="50" y="310" class="content">
    送葬队伍将棺材抬到了墓地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffin -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <rect x="20" y="20" width="310" height="110" class="image" />
    <line x1="20" y1="20" x2="330" y2="20" class="image" />
    <line x1="20" y1="130" x2="330" y2="130" class="image" />
    <line x1="20" y1="20" x2="20" y2="130" class="image" />
    <line x1="330" y1="20" x2="330" y2="130" class="image" />
    <!-- Handles -->
    <circle cx="50" cy="75" r="10" class="image" />
    <circle cx="300" cy="75" r="10" class="image" />
  </g>
</svg>