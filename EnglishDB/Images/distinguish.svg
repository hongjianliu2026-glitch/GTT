<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">distinguish</text>
  <text x="50" y="120" class="subtitle">[dɪˈstɪŋɡwɪʃ] v. 区分，辨别</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + tingu (刺) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用刺(tingu)将两个相似的事物分开(dis-)，
    <tspan x="50" dy="25">这样就能清楚地区分(distinguish)它们。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's important to distinguish between fact and fiction.
  </text>
  <text x="50" y="310" class="content">
    区分事实和虚构是很重要的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two similar objects -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="150" y="0" width="100" height="100" class="image" />
    <!-- Person with a spear -->
    <circle cx="250" cy="50" r="15" class="image" />
    <line x1="250" y1="65" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="220" y2="130" class="image" />
    <line x1="250" y1="100" x2="280" y2="130" class="image" />
    <line x1="250" y1="80" x2="300" y2="70" class="image" />
    <!-- Spear separating the objects -->
    <line x1="250" y1="65" x2="100" y2="50" class="image" />
  </g>
</svg>