<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">malevolent</text>
  <text x="50" y="120" class="subtitle">[məˈlɛvələnt] adj. 恶意的，恶毒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mal- (坏) + volent (意愿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个坏人(mal-)，他内心充满了恶毒的意愿(volent)，
    <tspan x="50" dy="25">总是想着如何伤害别人，这就是malevolent。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The malevolent look in his eyes made everyone uneasy.
  </text>
  <text x="50" y="310" class="content">
    他眼中恶毒的神情让每个人都感到不安。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Evil face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <path d="M80 120 Q100 140 120 120" class="image" />
    <!-- Evil aura -->
    <circle cx="100" cy="100" r="70" class="image" stroke-dasharray="10,10" />
    <circle cx="100" cy="100" r="80" class="image" stroke-dasharray="10,10" />
    <circle cx="100" cy="100" r="90" class="image" stroke-dasharray="10,10" />
  </g>
</svg>