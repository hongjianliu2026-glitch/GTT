<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">distrust</text>
  <text x="50" y="120" class="subtitle">[dɪsˈtrʌst] n. 不信任，怀疑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + trust (信任)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对一个"不信任(dis-trust)"的场景，
    <tspan x="50" dy="25">他的眉头紧锁，双手交叉在胸前，表现出明显的怀疑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His colleagues viewed him with distrust.
  </text>
  <text x="50" y="310" class="content">
    他的同事们对他持怀疑态度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with distrust -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Crossed arms -->
    <line x1="20" y1="140" x2="80" y2="140" class="image" />
    <!-- Frown -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="40" y1="90" x2="45" y2="95" class="image" />
    <line x1="60" y1="90" x2="55" y2="95" class="image" />
  </g>
</svg>