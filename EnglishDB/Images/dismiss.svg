<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dismiss</text>
  <text x="50" y="120" class="subtitle">[dɪsˈmɪs] v. 解散，解雇，不予考虑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (离开) + miss (送)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老板对员工说："你被送走(dis-miss)了，"
    <tspan x="50" dy="25">意味着他被解雇了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager dismissed the employee for poor performance.
  </text>
  <text x="50" y="310" class="content">
    经理因表现不佳解雇了员工。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boss -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <text x="10" y="200" class="content" text-anchor="middle">Boss</text>

    <!-- Employee -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="200" y2="120" class="image" />
    <text x="140" y="200" class="content" text-anchor="middle">Employee</text>

    <!-- Arrow -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <polygon points="120,120 115,115 115,125" class="image" />
    <text x="100" y="110" class="content" text-anchor="middle">dismiss</text>
  </g>
</svg>