<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">socialism</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊʃəlɪzəm] n. 社会主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soci (社会) + -al (形容词后缀) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的社会网络，"社会(soci)"中的每个人都在
    <tspan x="50" dy="25">共享资源和财富，这种共享的理念就是社会主义(socialism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many countries practice socialism in their economic policies.
  </text>
  <text x="50" y="310" class="content">
    许多国家在其经济政策中实践社会主义。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Social network -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
    <circle cx="150" cy="180" r="50" class="image" />
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <line x1="150" y1="100" x2="150" y2="180" class="image" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="180" x2="100" y2="100" class="image" />
    <line x1="150" y1="180" x2="200" y2="100" class="image" />
    <!-- Shared resources -->
    <rect x="250" y="50" width="100" height="100" class="image" />
    <rect x="250" y="170" width="100" height="100" class="image" />
    <line x1="300" y1="50" x2="300" y2="270" class="image" />
    <line x1="250" y1="100" x2="350" y2="100" class="image" />
    <line x1="250" y1="220" x2="350" y2="220" class="image" />
  </g>
</svg>