<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">motley</text>
  <text x="50" y="120" class="subtitle">[ˈmɒtli] adj. 混杂的，杂色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mot (移动) + ley (草地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个草地(ley)上，各种颜色(mot)的动物在移动，
    <tspan x="50" dy="25">形成了一幅混杂的(motley)画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clown's costume was a motley of bright colors.
  </text>
  <text x="50" y="310" class="content">
    小丑的服装是各种鲜艳颜色的混杂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grassland -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Animals -->
    <circle cx="50" cy="100" r="20" fill="#FF5733" />
    <circle cx="120" cy="120" r="25" fill="#33FF57" />
    <circle cx="200" cy="80" r="30" fill="#3357FF" />
    <circle cx="280" cy="140" r="25" fill="#FF33A6" />
    <!-- Movement lines -->
    <line x1="50" y1="120" x2="100" y2="150" class="image" />
    <line x1="120" y1="145" x2="170" y2="170" class="image" />
    <line x1="200" y1="110" x2="250" y2="130" class="image" />
    <line x1="280" y1="165" x2="330" y2="180" class="image" />
  </g>
</svg>