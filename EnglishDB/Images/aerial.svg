<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aerial</text>
  <text x="50" y="120" class="subtitle">[ˈɛəriəl] adj. 空中的，航空的；n. 天线</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aero- (空气，空中) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机在空中翱翔，"空气中的(aero-al)"
    <tspan x="50" dy="25">飞行器，这就是aerial的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aerial view of the city was breathtaking.
  </text>
  <text x="50" y="310" class="content">
    这座城市的鸟瞰图令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Plane -->
    <polygon points="50,50 150,50 170,20 200,20 220,50 320,50 320,80 50,80" class="image" fill="#FFFFFF" />
    <!-- Wings -->
    <line x1="70" y1="50" x2="30" y2="20" class="image" />
    <line x1="280" y1="50" x2="300" y2="20" class="image" />
    <!-- Tail -->
    <line x1="320" y1="60" x2="350" y2="60" class="image" />
    <line x1="350" y1="60" x2="335" y2="40" class="image" />
  </g>
</svg>