<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sustenance</text>
  <text x="50" y="120" class="subtitle">[ˈsʌstənəns] n. 食物，生计，支持</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sus- (在下面) + ten (保持) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在地下室里，"在下面保持(sus-ten)"
    <tspan x="50" dy="25">着食物和生计，这些就是他的支持(sustenance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer provided sustenance for the entire village.
  </text>
  <text x="50" y="310" class="content">
    这位农民为整个村庄提供了食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basement -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food items -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Apple -->
    <rect x="100" y="30" width="40" height="40" class="image" /> <!-- Bread -->
    <circle cx="170" cy="50" r="20" class="image" /> <!-- Orange -->
    <!-- Person -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>