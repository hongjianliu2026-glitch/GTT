<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reserved</text>
  <text x="50" y="120" class="subtitle">[rɪˈzɜːrvd] adj. 保留的，内向的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + serv (保持) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把心事"保持(serv)"在内心深处，"回(re-)"到自己的世界，
    <tspan x="50" dy="25">这样的人就是内向的(reserved)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very reserved and doesn't talk much in group settings.
  </text>
  <text x="50" y="310" class="content">
    她非常内向，在群体环境中不怎么说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a closed book -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Closed book -->
    <rect x="100" y="30" width="100" height="80" class="image" />
    <line x1="100" y1="30" x2="200" y2="30" class="image" />
    <line x1="100" y1="70" x2="200" y2="70" class="image" />
    <line x1="100" y1="110" x2="200" y2="110" class="image" />
  </g>
</svg>