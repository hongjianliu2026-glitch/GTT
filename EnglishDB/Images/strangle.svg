<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">strangle</text>
  <text x="50" y="120" class="subtitle">[ˈstræŋɡl] v. 勒死，扼杀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strang (紧) + -le (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手紧紧地"勒住(strang-le)"一只小鸟的脖子，
    <tspan x="50" dy="25">小鸟无法呼吸，这就是"strangle"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snake tried to strangle the small animal.
  </text>
  <text x="50" y="310" class="content">
    蛇试图勒死那只小动物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hand -->
    <path d="M50,100 C50,50 150,50 150,100" class="image" />
    <path d="M150,100 C150,150 50,150 50,100" class="image" />
    <!-- Bird -->
    <circle cx="100" cy="120" r="20" class="image" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <!-- Strangle action -->
    <line x1="50" y1="100" x2="100" y2="120" class="image" />
    <line x1="150" y1="100" x2="100" y2="120" class="image" />
  </g>
</svg>