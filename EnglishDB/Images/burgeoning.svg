<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">burgeoning</text>
  <text x="50" y="120" class="subtitle">[ˈbɜːrdʒənɪŋ] adj. 迅速发展的，蓬勃发展的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> burgeon (发芽) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵小树苗迅速"发芽(burgeon)"，
    <tspan x="50" dy="25">枝叶茂盛，象征着蓬勃发展的状态(burgeoning)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The burgeoning tech industry is attracting many young talents.
  </text>
  <text x="50" y="310" class="content">
    迅速发展的科技行业吸引了许多年轻人才。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <circle cx="175" cy="20" r="10" class="image" />
    <line x1="175" y1="30" x2="150" y2="60" class="image" />
    <line x1="175" y1="30" x2="200" y2="60" class="image" />
    <line x1="175" y1="60" x2="140" y2="90" class="image" />
    <line x1="175" y1="60" x2="210" y2="90" class="image" />
    <line x1="175" y1="90" x2="130" y2="120" class="image" />
    <line x1="175" y1="90" x2="220" y2="120" class="image" />
    <line x1="175" y1="120" x2="120" y2="150" class="image" />
    <line x1="175" y1="120" x2="230" y2="150" class="image" />
    <line x1="175" y1="150" x2="110" y2="180" class="image" />
    <line x1="175" y1="150" x2="240" y2="180" class="image" />
  </g>
</svg>