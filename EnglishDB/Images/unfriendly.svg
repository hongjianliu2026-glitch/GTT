<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfriendly</text>
  <text x="50" y="120" class="subtitle">[ʌnˈfrendli] adj. 不友好的，不友善的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + friendly (友好的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个面带怒容的人，"不(un-)"愿意"友好(friendly)"对待他人，
    <tspan x="50" dy="25">他的表情和态度都显得非常不友好(unfriendly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shopkeeper was unfriendly and refused to help.
  </text>
  <text x="50" y="310" class="content">
    店主态度不友好，拒绝提供帮助。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <line x1="100" y1="140" x2="100" y2="140" class="image" />
    <!-- Crossed arms -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="180" class="image" />
    <line x1="150" y1="150" x2="150" y2="180" class="image" />
  </g>
</svg>