<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consume</text>
  <text x="50" y="120" class="subtitle">[kənˈsuːm] v. 消耗，消费；吞噬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (完全) + sume (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的黑洞，"完全拿走(con-sume)"
    <tspan x="50" dy="25">周围的一切，吞噬了所有的资源和能量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fire consumed the entire building.
  </text>
  <text x="50" y="310" class="content">
    大火吞噬了整栋建筑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Black hole -->
    <circle cx="175" cy="100" r="70" class="image" />
    <!-- Consuming elements -->
    <line x1="175" y1="30" x2="175" y2="100" class="image" />
    <line x1="130" y1="50" x2="175" y2="100" class="image" />
    <line x1="220" y1="50" x2="175" y2="100" class="image" />
    <line x1="100" y1="100" x2="175" y2="100" class="image" />
    <line x1="250" y1="100" x2="175" y2="100" class="image" />
    <line x1="130" y1="150" x2="175" y2="100" class="image" />
    <line x1="220" y1="150" x2="175" y2="100" class="image" />
  </g>
</svg>