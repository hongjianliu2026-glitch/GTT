<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nook</text>
  <text x="50" y="120" class="subtitle">[nʊk] n. 角落，隐蔽处</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> no- (角落) + ok (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的角落(nook)，里面藏着一只
    <tspan x="50" dy="25">躲猫猫的小猫，这个角落就是它的秘密基地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a quiet nook in the library to study.
  </text>
  <text x="50" y="310" class="content">
    她在图书馆找到了一个安静的角落学习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Nook -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <!-- Cat -->
    <circle cx="100" cy="70" r="15" class="image" />
    <line x1="100" y1="85" x2="100" y2="110" class="image" />
    <line x1="100" y1="110" x2="85" y2="130" class="image" />
    <line x1="100" y1="110" x2="115" y2="130" class="image" />
    <line x1="100" y1="95" x2="120" y2="85" class="image" />
  </g>
</svg>