<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leading</text>
  <text x="50" y="120" class="subtitle">[ˈliːdɪŋ] adj. 领先的，主要的；n. 引导，领导</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lead (引导) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在赛道上，"引导(lead)"
    <tspan x="50" dy="25">着其他人，他就是领先的(leading)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is the leading candidate for the job.
  </text>
  <text x="50" y="310" class="content">
    她是这份工作的主要候选人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Runner -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Other runners -->
    <circle cx="100" cy="110" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <circle cx="200" cy="130" r="15" class="image" />
    <!-- Finish line -->
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="310" y1="20" x2="310" y2="180" class="image" />
  </g>
</svg>