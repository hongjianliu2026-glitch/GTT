<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #4A4A4A; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #FF6F61; }
      .story { font: 16px serif; fill: #6A1B9A; }
      .image { stroke: #FF6F61; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loving</text>
  <text x="50" y="120" class="subtitle">[ˈlʌvɪŋ] adj. 亲爱的，充满爱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> love (爱) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱心的场景，"爱(love)"
    <tspan x="50" dy="25">在空气中弥漫，形成了一个"充满爱的(loving)"氛围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a loving mother who always cares for her children.
  </text>
  <text x="50" y="310" class="content">
    她是一位充满爱心的母亲，总是关心她的孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 31.7C10 15.1 22.7 2.4 39.3 2.4S68.6 15.1 68.6 31.7C68.6 48.3 39.3 61 39.3 61S10 48.3 10 31.7Z" class="image" />
    <!-- Arrows -->
    <line x1="39.3" y1="61" x2="39.3" y2="100" class="image" />
    <line x1="39.3" y1="100" x2="20" y2="120" class="image" />
    <line x1="39.3" y1="100" x2="58.6" y2="120" class="image" />
    <!-- Text inside heart -->
    <text x="25" y="45" class="content" fill="#FF6F61">Love</text>
  </g>
</svg>