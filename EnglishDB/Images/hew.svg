<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hew</text>
  <text x="50" y="120" class="subtitle">[hjuː] v. 砍，劈；砍成</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hew (来自古英语 hēawan，意为“砍”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的伐木工，挥舞着斧头，"砍(hew)"
    <tspan x="50" dy="25">倒一棵大树，木屑四溅，场面壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lumberjack hewed the tree down with a single swing.
  </text>
  <text x="50" y="310" class="content">
    伐木工人一斧头就把树砍倒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Axe -->
    <line x1="120" y1="100" x2="200" y2="100" class="image" />
    <line x1="120" y1="100" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <!-- Lumberjack -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>