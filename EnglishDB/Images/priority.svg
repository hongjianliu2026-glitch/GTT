<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">priority</text>
  <text x="50" y="120" class="subtitle">[praɪˈɔːrəti] n. 优先权，优先顺序</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prior (在前的) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个繁忙的办公室，所有任务都被贴上标签，"在前的(prior)"
    <tspan x="50" dy="25">任务被放在最上面，这些任务就具有优先权(priority)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project has top priority on our list.
  </text>
  <text x="50" y="310" class="content">
    这个项目在我们列表中具有最高优先级。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tasks -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <rect x="170" y="20" width="100" height="50" class="image" />
    <rect x="290" y="20" width="100" height="50" class="image" />
    <!-- Priority label -->
    <rect x="50" y="80" width="100" height="50" class="image" />
    <text x="60" y="110" class="highlight">Priority</text>
    <!-- Tasks on desk -->
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <line x1="170" y1="140" x2="270" y2="140" class="image" />
    <line x1="290" y1="140" x2="390" y2="140" class="image" />
    <!-- Priority task on top -->
    <rect x="50" y="160" width="100" height="50" class="image" />
    <text x="60" y="190" class="highlight">Top</text>
  </g>
</svg>