<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">printout</text>
  <text x="50" y="120" class="subtitle">[ˈprɪntaʊt] n. 打印输出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> print (打印) + out (出来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台打印机在疯狂地"打印(print)"，
    <tspan x="50" dy="25">纸张像瀑布一样"涌出(out)"，这就是打印输出(printout)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please check the printout for any errors.
  </text>
  <text x="50" y="310" class="content">
    请检查打印输出是否有任何错误。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Printer -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Paper coming out -->
    <rect x="210" y="50" width="100" height="100" class="image" />
    <rect x="320" y="70" width="100" height="80" class="image" />
    <rect x="430" y="90" width="100" height="60" class="image" />
    <!-- Paper lines -->
    <line x1="220" y1="60" x2="310" y2="60" class="image" />
    <line x1="220" y1="80" x2="310" y2="80" class="image" />
    <line x1="220" y1="100" x2="310" y2="100" class="image" />
    <line x1="330" y1="80" x2="420" y2="80" class="image" />
    <line x1="330" y1="100" x2="420" y2="100" class="image" />
    <line x1="440" y1="100" x2="530" y2="100" class="image" />
  </g>
</svg>