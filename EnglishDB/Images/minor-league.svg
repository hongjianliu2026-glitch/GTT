<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">minor-league</text>
  <text x="50" y="120" class="subtitle">[ˈmaɪnər liːɡ] adj. 次要的，小联盟的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> minor (较小的) + league (联盟)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棒球场上，"小联盟(minor-league)"
    <tspan x="50" dy="25">的球员们在努力训练，他们还没有进入大联盟，</tspan>
    <tspan x="50" dy="25">但他们依然充满激情和希望。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He started his career in the minor-league baseball.
  </text>
  <text x="50" y="310" class="content">
    他的职业生涯始于小联盟棒球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baseball field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Baseball diamond -->
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="50" y2="150" class="image" />
    <!-- Players -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <!-- Ball -->
    <circle cx="150" cy="100" r="5" class="image" fill="#E74C3C" />
  </g>
</svg>