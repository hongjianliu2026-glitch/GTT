<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tailor</text>
  <text x="50" y="120" class="subtitle">[ˈteɪlər] n. 裁缝；v. 裁剪，定制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tail (剪裁) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个裁缝(tailor)拿着剪刀，"剪裁(tail)"
    <tspan x="50" dy="25">布料，为顾客定制衣服。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had her wedding dress tailored to fit perfectly.
  </text>
  <text x="50" y="310" class="content">
    她让人把她的婚纱定制得非常合身。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tailor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Scissors -->
    <line x1="70" y1="100" x2="100" y2="100" class="image" />
    <line x1="70" y1="100" x2="70" y2="130" class="image" />
    <line x1="100" y1="100" x2="100" y2="130" class="image" />
    <line x1="70" y1="130" x2="100" y2="130" class="image" />
    <!-- Fabric -->
    <rect x="120" y="90" width="150" height="60" class="image" />
    <line x1="130" y1="100" x2="260" y2="100" class="image" />
    <line x1="130" y1="120" x2="260" y2="120" class="image" />
    <line x1="130" y1="140" x2="260" y2="140" class="image" />
  </g>
</svg>