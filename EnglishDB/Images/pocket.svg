<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pocket</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːkɪt] n. 口袋，钱袋；v. 装入袋中</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poc (袋子) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小袋子(poc-et)，里面装满了硬币，
    <tspan x="50" dy="25">这些硬币就像是被"装入袋中(pocket)"了一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He put the keys in his pocket.
  </text>
  <text x="50" y="310" class="content">
    他把钥匙放进了口袋里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pocket -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Coins -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />
    <circle cx="140" cy="50" r="10" class="image" />
    <circle cx="170" cy="50" r="10" class="image" />
    <!-- Person -->
    <circle cx="100" cy="200" r="30" class="image" />
    <line x1="100" y1="230" x2="100" y2="300" class="image" />
    <line x1="100" y1="250" x2="50" y2="280" class="image" />
    <line x1="100" y1="250" x2="150" y2="280" class="image" />
    <line x1="100" y1="300" x2="50" y2="350" class="image" />
    <line x1="100" y1="300" x2="150" y2="350" class="image" />
  </g>
</svg>