<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">geranium</text>
  <text x="50" y="120" class="subtitle">[dʒəˈreɪniəm] n. 天竺葵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> geran(i)- (鹤) + -um (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鹤(geran)在花园里，它的影子投射在地上，
    <tspan x="50" dy="25">形成了一个美丽的图案，就像天竺葵(geranium)的花瓣一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was filled with colorful geraniums.
  </text>
  <text x="50" y="310" class="content">
    花园里开满了五颜六色的天竺葵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="100" r="50" class="image" />
    <circle cx="125" cy="50" r="50" class="image" />
    <circle cx="100" cy="150" r="50" class="image" />
    <circle cx="150" cy="150" r="50" class="image" />
    <!-- Stem -->
    <line x1="125" y1="200" x2="125" y2="100" class="image" />
    <!-- Leaves -->
    <path d="M125,200 Q100,175 125,150 Q150,175 125,200" class="image" />
    <!-- Crane -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="210" class="image" />
    <line x1="250" y1="180" x2="270" y2="210" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />
  </g>
</svg>