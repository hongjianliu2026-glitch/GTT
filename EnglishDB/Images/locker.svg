<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">locker</text>
  <text x="50" y="120" class="subtitle">[ˈlɒkə(r)] n. 储物柜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lock (锁) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的储物柜，"锁住(lock)"
    <tspan x="50" dy="25">你的所有物品，这个储物柜就是locker。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stored her bag in the locker before the gym class.
  </text>
  <text x="50" y="310" class="content">
    她在上健身课前把包存放在储物柜里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Locker -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Lock -->
    <circle cx="100" cy="250" r="20" class="image" />
    <!-- Handle -->
    <line x1="90" y1="250" x2="70" y2="230" class="image" />
    <line x1="110" y1="250" x2="130" y2="230" class="image" />
  </g>
</svg>