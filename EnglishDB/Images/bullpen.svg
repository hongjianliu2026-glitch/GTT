<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bullpen</text>
  <text x="50" y="120" class="subtitle">[ˈbʊlpɛn] n. 牛棚，棒球替补投手区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bull (公牛) + pen (围栏)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棒球场，"公牛(bull)"被关在"围栏(pen)"里，
    <tspan x="50" dy="25">这个围栏就是棒球替补投手区(bullpen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager called the pitcher from the bullpen.
  </text>
  <text x="50" y="310" class="content">
    经理从替补投手区叫来了投手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bullpen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bull -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Fence -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="100" y1="20" x2="250" y2="20" class="image" />
    <line x1="100" y1="180" x2="250" y2="180" class="image" />
  </g>
</svg>