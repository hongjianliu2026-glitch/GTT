<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delayed</text>
  <text x="50" y="120" class="subtitle">[dɪˈleɪd] adj. 延迟的，推迟的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + lay (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟的指针被"向下放置(de-lay)"，
    <tspan x="50" dy="25">时间被推迟，一切都变得延迟(delayed)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flight was delayed due to bad weather.
  </text>
  <text x="50" y="310" class="content">
    由于恶劣天气，航班被延迟了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="30" class="image" />
    <line x1="175" y1="100" x2="235" y2="100" class="image" />
    <!-- Arrow pointing down -->
    <polygon points="175,200 160,180 190,180" class="image" />
    <!-- Text for arrow -->
    <text x="160" y="220" class="content">de-lay</text>
  </g>
</svg>