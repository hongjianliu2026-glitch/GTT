<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alas</text>
  <text x="50" y="120" class="subtitle">[əˈlæs] int. 哎呀，唉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "alæs"，意为"唉"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在看到不幸的事情发生时，
    <tspan x="50" dy="25">发出一声"哎呀(alas)"，表达出深深的遗憾和悲伤。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Alas, the cake fell when I took it out of the oven.
  </text>
  <text x="50" y="310" class="content">
    哎呀，蛋糕从烤箱里拿出来时塌了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with sad face -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <line x1="50" y1="70" x2="50" y2="90" class="image" />
    <line x1="40" y1="80" x2="60" y2="80" class="image" />
    <line x1="30" y1="100" x2="70" y2="100" class="image" />
    <line x1="30" y1="100" x2="40" y2="110" class="image" />
    <line x1="70" y1="100" x2="60" y2="110" class="image" />
  </g>
</svg>