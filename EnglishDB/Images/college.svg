<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">college</text>
  <text x="50" y="120" class="subtitle">[ˈkɒlɪdʒ] n. 学院，大学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (共同) + leg (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群学生"共同选择(col-leg)"进入一个地方，
    <tspan x="50" dy="25">这个地方就是学院(college)，他们在这里共同学习。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She plans to attend college next year.
  </text>
  <text x="50" y="310" class="content">
    她计划明年上大学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- College building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="30" height="30" class="image" />
    <rect x="120" y="40" width="30" height="30" class="image" />
    <rect x="170" y="40" width="30" height="30" class="image" />
    <rect x="220" y="40" width="30" height="30" class="image" />
    <!-- Door -->
    <rect x="145" y="120" width="60" height="60" class="image" />
    <!-- Students -->
    <circle cx="90" cy="180" r="15" class="image" />
    <circle cx="180" cy="180" r="15" class="image" />
    <circle cx="270" cy="180" r="15" class="image" />
  </g>
</svg>