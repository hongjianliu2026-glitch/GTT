<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mama</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːmə] n. 妈妈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自婴儿对母亲的称呼，简单直接。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个婴儿在摇篮里，对着妈妈喊"mama"，
    <tspan x="50" dy="25">这个声音充满了温暖和依赖，象征着母爱的伟大。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby called out "mama" when she saw her mother.
  </text>
  <text x="50" y="310" class="content">
    宝宝看到妈妈时喊了声"mama"。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baby in a crib -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Baby -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="140" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
    <line x1="175" y1="180" x2="145" y2="200" class="image" />
    <line x1="175" y1="180" x2="205" y2="200" class="image" />
    <!-- Mother -->
    <circle cx="100" cy="50" r="20" class="image" />
    <line x1="100" y1="70" x2="100" y2="120" class="image" />
    <line x1="100" y1="90" x2="70" y2="80" class="image" />
    <line x1="100" y1="90" x2="130" y2="80" class="image" />
    <line x1="100" y1="120" x2="70" y2="140" class="image" />
    <line x1="100" y1="120" x2="130" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M175,70 Q225,70 225,120 Q225,170 175,170 Q125,170 125,120 Q125,70 175,70" class="image" />
    <text x="160" y="110" class="content" style="font-size: 24px;">mama</text>
  </g>
</svg>