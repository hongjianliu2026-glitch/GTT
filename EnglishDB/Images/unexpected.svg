<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unexpected</text>
  <text x="50" y="120" class="subtitle">[ˌʌnɪkˈspektɪd] adj. 意外的，想不到的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + expect (期望) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你正在期待一个礼物，突然一只大象从天而降，"不期望(un-expect)"
    <tspan x="50" dy="25">的事情发生了，这就是意外(unexpected)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unexpected guest arrived at the party.
  </text>
  <text x="50" y="310" class="content">
    意想不到的客人来到了派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#2E8B57" />
    <!-- Elephant -->
    <ellipse cx="175" cy="100" rx="50" ry="30" class="image" fill="#D3D3D3" />
    <rect x="150" y="130" width="50" height="20" class="image" fill="#D3D3D3" />
    <line x1="175" y1="150" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <line x1="175" y1="160" x2="200" y2="150" class="image" />
    <!-- Gift box -->
    <rect x="50" y="50" width="30" height="20" class="image" fill="#FFD700" />
    <line x1="65" y1="50" x2="65" y2="70" class="image" />
  </g>
</svg>