<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forestall</text>
  <text x="50" y="120" class="subtitle">[fɔːrˈstɔːl] v. 预先阻止，预防</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (在前面) + stall (阻止)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一座桥的前面，"提前阻止(fore-stall)"
    <tspan x="50" dy="25">一辆失控的马车，防止它冲进森林(forest)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He tried to forestall the accident by stopping the car.
  </text>
  <text x="50" y="310" class="content">
    他试图通过停车来预防事故。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bridge -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="0" x2="0" y2="20" class="image" />
    <line x1="350" y1="0" x2="350" y2="20" class="image" />
    <!-- Person -->
    <circle cx="175" cy="10" r="15" class="image" />
    <line x1="175" y1="25" x2="175" y2="50" class="image" />
    <line x1="175" y1="50" x2="155" y2="80" class="image" />
    <line x1="175" y1="50" x2="195" y2="80" class="image" />
    <line x1="175" y1="35" x2="205" y2="25" class="image" />
    <!-- Car -->
    <rect x="250" y="-20" width="50" height="30" class="image" />
    <line x1="250" y1="10" x2="300" y2="10" class="image" />
    <line x1="250" y1="10" x2="250" y2="30" class="image" />
    <line x1="300" y1="10" x2="300" y2="30" class="image" />
    <line x1="250" y1="30" x2="300" y2="30" class="image" />
    <!-- Forest -->
    <line x1="350" y1="20" x2="400" y2="100" class="image" />
    <line x1="370" y1="20" x2="420" y2="100" class="image" />
    <line x1="390" y1="20" x2="440" y2="100" class="image" />
  </g>
</svg>