<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bubble { fill: #F1C40F; stroke: #7F8C8D; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boiling</text>
  <text x="50" y="120" class="subtitle">[ˈbɔɪlɪŋ] adj. 沸腾的，激动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boil (煮沸) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一锅水在炉子上"煮沸(boil)"，
    <tspan x="50" dy="25">水泡不断冒出，整个锅都在沸腾(boiling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The water in the pot is boiling.
  </text>
  <text x="50" y="310" class="content">
    锅里的水正在沸腾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Bubbles -->
    <circle cx="100" cy="50" r="15" class="bubble" />
    <circle cx="150" cy="70" r="15" class="bubble" />
    <circle cx="200" cy="60" r="15" class="bubble" />
    <circle cx="250" cy="80" r="15" class="bubble" />
    <circle cx="300" cy="50" r="15" class="bubble" />
  </g>
</svg>