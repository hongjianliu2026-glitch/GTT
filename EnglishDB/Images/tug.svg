<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tug</text>
  <text x="50" y="120" class="subtitle">[tʌɡ] v. 拉，拖；n. 拖船</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tug (拉，拖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小船在水中，被一只强壮的手"拉(tug)"着前进，
    <tspan x="50" dy="25">这个动作就像拖船(tug)在水中拖动大船一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tugboat gently tugged the large ship into the harbor.
  </text>
  <text x="50" y="310" class="content">
    拖船轻轻地将大船拖进港口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#AED6F1" />
    <!-- Boat -->
    <rect x="150" y="50" width="100" height="50" class="image" fill="#F4D03F" />
    <!-- Hand pulling the boat -->
    <line x1="100" y1="100" x2="150" y2="75" class="image" />
    <line x1="100" y1="100" x2="90" y2="90" class="image" />
    <line x1="100" y1="100" x2="110" y2="90" class="image" />
    <line x1="100" y1="100" x2="100" y2="110" class="image" />
  </g>
</svg>