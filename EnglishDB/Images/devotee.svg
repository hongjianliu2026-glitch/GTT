<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">devotee</text>
  <text x="50" y="120" class="subtitle">[ˌdiːvəˈtiː] n. 信徒，爱好者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + vot (发誓) + -ee (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狂热的信徒，"强调发誓(de-vot)"
    <tspan x="50" dy="25">忠诚于某事或某人，这个人就是devotee。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a devoted fan of the band.
  </text>
  <text x="50" y="310" class="content">
    她是这个乐队的忠实粉丝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50 50 Q100 0 150 50 T250 50" class="image" />
    <!-- Person -->
    <circle cx="150" cy="150" r="30" class="image" />
    <line x1="150" y1="180" x2="150" y2="250" class="image" />
    <line x1="150" y1="210" x2="120" y2="180" class="image" />
    <line x1="150" y1="210" x2="180" y2="180" class="image" />
    <line x1="150" y1="250" x2="120" y2="300" class="image" />
    <line x1="150" y1="250" x2="180" y2="300" class="image" />
    <!-- Vow -->
    <text x="100" y="350" class="content" style="font-size: 36px;">誓</text>
  </g>
</svg>