<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nasty</text>
  <text x="50" y="120" class="subtitle">[ˈnæsti] adj. 肮脏的，令人不快的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nast (污秽) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"污秽(nast)"的房间，到处都是垃圾和臭味，
    <tspan x="50" dy="25">这种环境让人感到非常"不快(y)"，这就是nasty的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kitchen was in a nasty state after the party.
  </text>
  <text x="50" y="310" class="content">
    派对过后，厨房一片狼藉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dirty room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trash -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="80" r="25" class="image" />
    <circle cx="150" cy="50" r="30" class="image" />
    <!-- Stink lines -->
    <line x1="200" y1="50" x2="250" y2="50" class="image" />
    <line x1="200" y1="70" x2="250" y2="70" class="image" />
    <line x1="200" y1="90" x2="250" y2="90" class="image" />
    <!-- Person reacting -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="330" y2="120" class="image" />
  </g>
</svg>