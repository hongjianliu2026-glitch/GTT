<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snail</text>
  <text x="50" y="120" class="subtitle">[sneɪl] n. 蜗牛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sn- (与“蛇”相关) + ail (与“爬行”相关)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蜗牛在草地上缓慢爬行，它的壳像一个小房子，
    <tspan x="50" dy="25">保护着它不受外界伤害。蜗牛的爬行速度虽然慢，</tspan>
    <tspan x="50" dy="25">但它总是坚定地向前移动，就像生活中的我们一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The snail moved slowly across the garden path.
  </text>
  <text x="50" y="330" class="content">
    蜗牛缓慢地穿过花园小径。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snail body -->
    <circle cx="100" cy="100" r="50" class="image" fill="#D5DBDB" />
    <!-- Snail shell -->
    <path d="M 100 100 A 50 50 0 1 1 100 0 L 100 100 Z" class="image" fill="#85C1E9" />
    <!-- Snail head -->
    <circle cx="150" cy="100" r="10" class="image" fill="#D5DBDB" />
    <!-- Grass -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" stroke-width="10" stroke="#27AE60" />
    <line x1="0" y1="190" x2="200" y2="190" class="image" stroke-width="10" stroke="#27AE60" />
    <line x1="0" y1="180" x2="200" y2="180" class="image" stroke-width="10" stroke="#27AE60" />
  </g>
</svg>