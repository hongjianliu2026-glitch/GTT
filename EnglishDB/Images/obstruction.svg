<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obstruction</text>
  <text x="50" y="120" class="subtitle">[əbˈstrʌkʃən] n. 障碍，阻碍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (反对) + struct (建造) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条道路上，"反对建造(ob-struct)"
    <tspan x="50" dy="25">的东西，比如一块巨大的石头，挡住了去路，这就是阻碍(obstruction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road was blocked by an obstruction.
  </text>
  <text x="50" y="310" class="content">
    道路被一个障碍物挡住了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Obstruction -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <!-- Car -->
    <rect x="50" y="110" width="30" height="20" class="image" />
    <circle cx="65" cy="130" r="10" class="image" />
    <circle cx="85" cy="130" r="10" class="image" />
  </g>
</svg>