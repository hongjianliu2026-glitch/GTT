<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .nectar { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nectar</text>
  <text x="50" y="120" class="subtitle">[ˈnɛktər] n. 花蜜，甘露</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nect (连接) + ar (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蜜蜂在花丛中，"连接(nect)"
    <tspan x="50" dy="25">花朵与花朵之间，采集甘甜的花蜜(nectar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hummingbird sipped the nectar from the flower.
  </text>
  <text x="50" y="310" class="content">
    蜂鸟从花中吸食花蜜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="100" r="50" class="image" />
    <circle cx="125" cy="50" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="nectar" />
    <circle cx="150" cy="100" r="20" class="nectar" />
    <circle cx="125" cy="50" r="20" class="nectar" />
    <!-- Bee -->
    <circle cx="70" cy="100" r="10" class="image" />
    <line x1="70" y1="110" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="70" y1="130" x2="100" y2="120" class="image" />
  </g>
</svg>