<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">squid</text>
  <text x="50" y="120" class="subtitle">[skwɪd] n. 鱿鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> squid (源自中古英语，意为“鱿鱼”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的鱿鱼在海中游动，它的触手像"闪电"一样快速伸展，
    <tspan x="50" dy="25">捕捉猎物。这种快速的动作让人联想到"squid"这个词。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The diver saw a giant squid in the deep sea.
  </text>
  <text x="50" y="310" class="content">
    潜水员在深海中看到了一只巨大的鱿鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Squid body -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <!-- Tentacles -->
    <line x1="175" y1="150" x2="100" y2="250" class="image" />
    <line x1="175" y1="150" x2="250" y2="250" class="image" />
    <line x1="175" y1="150" x2="75" y2="200" class="image" />
    <line x1="175" y1="150" x2="275" y2="200" class="image" />
    <line x1="175" y1="150" x2="50" y2="150" class="image" />
    <line x1="175" y1="150" x2="300" y2="150" class="image" />
    <!-- Eyes -->
    <circle cx="130" cy="80" r="10" class="image" />
    <circle cx="220" cy="80" r="10" class="image" />
  </g>
</svg>