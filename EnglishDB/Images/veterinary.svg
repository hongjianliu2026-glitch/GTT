<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">veterinary</text>
  <text x="50" y="120" class="subtitle">[ˈvɛtərɪˌnɛri] n. 兽医</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> veteri (老) + -ary (与...有关的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个经验丰富的老兽医(veterinary)，
    <tspan x="50" dy="25">他照顾着各种动物，就像照顾自己的孩子一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The veterinary clinic is open 24 hours.
  </text>
  <text x="50" y="310" class="content">
    兽医诊所全天24小时开放。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Veterinarian -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="20" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="80" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->

    <!-- Animal -->
    <circle cx="200" cy="100" r="30" class="image" /> <!-- Animal head -->
    <line x1="200" y1="130" x2="200" y2="180" class="image" /> <!-- Animal body -->
    <line x1="200" y1="150" x2="170" y2="140" class="image" /> <!-- Animal left leg -->
    <line x1="200" y1="150" x2="230" y2="140" class="image" /> <!-- Animal right leg -->
    <line x1="200" y1="130" x2="180" y2="110" class="image" /> <!-- Animal left ear -->
    <line x1="200" y1="130" x2="220" y2="110" class="image" /> <!-- Animal right ear -->

    <!-- Interaction -->
    <line x1="80" y1="130" x2="180" y2="130" class="image" /> <!-- Veterinarian touching animal -->
  </g>
</svg>