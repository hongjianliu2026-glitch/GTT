<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">near</text>
  <text x="50" y="120" class="subtitle">[nɪər] adj. 近的，接近的；adv. 接近，靠近</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> near (接近)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟飞向一棵大树，"接近(near)"
    <tspan x="50" dy="25">大树的树冠，仿佛在寻找一个安全的栖息地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bus stop is near the park.
  </text>
  <text x="50" y="310" class="content">
    公交车站就在公园附近。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree -->
    <rect x="150" y="0" width="50" height="200" class="image" />
    <circle cx="175" cy="20" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="175" cy="80" r="20" class="image" />

    <!-- Bird -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <line x1="50" y1="130" x2="20" y2="120" class="image" />
  </g>
</svg>