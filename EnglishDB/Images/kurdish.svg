<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Kurdish</text>
  <text x="50" y="120" class="subtitle">[ˈkɜːrdɪʃ] n. 库尔德语；adj. 库尔德人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Kurd (库尔德人) + -ish (表示“属于...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个库尔德人站在山丘上，用库尔德语(Kurdish)
    <tspan x="50" dy="25">向远方呼喊，声音在山谷中回荡，象征着库尔德文化的传承。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent Kurdish and Arabic.
  </text>
  <text x="50" y="310" class="content">
    她能流利地说库尔德语和阿拉伯语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 150 L100 50 L200 150 Z" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Sound waves -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="170" cy="100" r="15" class="image" />
    <circle cx="190" cy="100" r="20" class="image" />
  </g>
</svg>