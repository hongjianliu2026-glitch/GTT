<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">raucous</text>
  <text x="50" y="120" class="subtitle">[ˈrɔːkəs] adj. 喧闹的，刺耳的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rauc (粗糙) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个喧闹的派对，"粗糙的声音(rauc-ous)"
    <tspan x="50" dy="25">充斥着整个房间，让人难以忍受。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The raucous laughter of the crowd echoed through the stadium.
  </text>
  <text x="50" y="310" class="content">
    人群喧闹的笑声在体育场中回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Party scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <!-- Loud sound waves -->
    <path d="M50 100 Q75 75, 100 100 T150 100" class="image" />
    <path d="M50 120 Q75 95, 100 120 T150 120" class="image" />
    <path d="M50 140 Q75 115, 100 140 T150 140" class="image" />
    <!-- Party decorations -->
    <line x1="50" y1="160" x2="200" y2="160" class="image" />
    <line x1="50" y1="180" x2="200" y2="180" class="image" />
    <line x1="50" y1="200" x2="200" y2="200" class="image" />
  </g>
</svg>