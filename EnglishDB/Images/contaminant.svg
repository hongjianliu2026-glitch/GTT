<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contaminant</text>
  <text x="50" y="120" class="subtitle">[kənˈtæmɪnənt] n. 污染物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tamin (接触) + -ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个实验室里，"一起接触(con-tamin)"
    <tspan x="50" dy="25">到有害物质，这些物质就成了污染物(contaminant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The water was tested for contaminants before it was safe to drink.
  </text>
  <text x="50" y="310" class="content">
    在安全饮用之前，水被检测了污染物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Beaker -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Contaminant -->
    <circle cx="100" cy="100" r="20" class="image" fill="#E74C3C" />
    <!-- Lab coat -->
    <rect x="200" y="20" width="100" height="160" class="image" />
    <!-- Scientist -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>