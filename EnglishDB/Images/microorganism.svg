<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">microorganism</text>
  <text x="50" y="120" class="subtitle">[ˌmaɪkrəʊˈɔːrɡənɪzəm] n. 微生物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> micro- (小) + organism (生物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微小的生物(micro-organism)，
    <tspan x="50" dy="25">它小到肉眼看不见，但却在我们的世界中无处不在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientist discovered a new microorganism in the soil.
  </text>
  <text x="50" y="310" class="content">
    这位科学家在土壤中发现了一种新的微生物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microscope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="220" class="image" />
    <line x1="175" y1="200" x2="200" y2="220" class="image" />
    <!-- Microorganism -->
    <circle cx="175" cy="100" r="10" class="image" fill="#E74C3C" />
    <circle cx="160" cy="90" r="5" class="image" fill="#E74C3C" />
    <circle cx="190" cy="90" r="5" class="image" fill="#E74C3C" />
    <circle cx="175" cy="110" r="5" class="image" fill="#E74C3C" />
  </g>
</svg>