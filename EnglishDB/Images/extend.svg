<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extend</text>
  <text x="50" y="120" class="subtitle">[ɪkˈstend] v. 延伸，扩展</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + tend (伸展)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手从一个小点开始，"向外伸展(ex-tend)"，
    <tspan x="50" dy="25">逐渐变长，就像一条延伸的道路。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road extends for miles.
  </text>
  <text x="50" y="310" class="content">
    这条路延伸了数英里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Hand extending -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="35" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="350" y2="100" class="image" />
  </g>
</svg>