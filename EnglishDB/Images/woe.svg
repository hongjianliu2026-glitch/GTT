<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">woe</text>
  <text x="50" y="120" class="subtitle">[woʊ] n. 悲哀，悲痛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "wo"，意为痛苦或悲伤
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在哭泣，脸上满是泪水，
    <tspan x="50" dy="25">周围环绕着乌云和雷电，象征着深深的悲哀(woe)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The family's woe was evident in their tearful faces.
  </text>
  <text x="50" y="310" class="content">
    家人脸上的泪水显露出他们的悲痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud and lightning -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <!-- Person crying -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="180" x2="150" y2="170" class="image" />
    <line x1="175" y1="180" x2="200" y2="170" class="image" />
    <!-- Tears -->
    <circle cx="165" cy="140" r="5" class="image" />
    <circle cx="185" cy="140" r="5" class="image" />
  </g>
</svg>