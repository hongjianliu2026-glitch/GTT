<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">language</text>
  <text x="50" y="120" class="subtitle">[ˈlæŋɡwɪdʒ] n. 语言</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lang (说) + uage (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的嘴巴，"说出(lang)"
    <tspan x="50" dy="25">各种声音，这些声音就构成了语言(language)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks three languages fluently.
  </text>
  <text x="50" y="310" class="content">
    她能流利地说三种语言。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="100" cy="100" r="50" class="image" />
    <path d="M50,100 Q75,50 100,100 Q125,150 150,100" class="image" />
    <!-- Sound waves -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="120" y2="30" class="image" />
    <line x1="120" y1="30" x2="140" y2="20" class="image" />
    <line x1="140" y1="20" x2="160" y2="30" class="image" />
    <line x1="160" y1="30" x2="180" y2="20" class="image" />
    <line x1="180" y1="20" x2="200" y2="30" class="image" />
  </g>
</svg>