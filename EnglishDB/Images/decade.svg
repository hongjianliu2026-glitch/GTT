<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decade</text>
  <text x="50" y="120" class="subtitle">[ˈdekeɪd] n. 十年</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dec- (十) + -ade (表示时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"十(dec-)"个指针同时指向不同的年份，
    <tspan x="50" dy="25">这些指针跨越了十年(decade)的时间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It has been a decade since we last met.
  </text>
  <text x="50" y="310" class="content">
    自从我们上次见面已经过去十年了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <line x1="175" y1="100" x2="100" y2="150" class="image" />
    <line x1="175" y1="100" x2="250" y2="150" class="image" />
    <line x1="175" y1="100" x2="100" y2="50" class="image" />
    <line x1="175" y1="100" x2="250" y2="50" class="image" />
    <line x1="175" y1="100" x2="150" y2="180" class="image" />
    <line x1="175" y1="100" x2="200" y2="180" class="image" />
    <line x1="175" y1="100" x2="50" y2="100" class="image" />
    <line x1="175" y1="100" x2="300" y2="100" class="image" />
  </g>
</svg>