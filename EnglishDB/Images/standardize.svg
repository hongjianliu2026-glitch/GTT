<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">standardize</text>
  <text x="50" y="120" class="subtitle">[ˈstændərdaɪz] v. 使标准化，使符合标准</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stand (站立) + ard (名词后缀) + ize (使...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂里，所有产品都被"站立(stand)"在同一个标准(ard)上，
    <tspan x="50" dy="25">这样就能"使(ize)"它们符合统一的标准(standardize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to standardize its production process.
  </text>
  <text x="50" y="310" class="content">
    公司决定将其生产过程标准化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Products -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="20" width="50" height="100" class="image" />
    <rect x="190" y="20" width="50" height="100" class="image" />
    <rect x="260" y="20" width="50" height="100" class="image" />
    <!-- Standard line -->
    <line x1="50" y1="120" x2="310" y2="120" class="image" />
    <!-- Text on standard line -->
    <text x="150" y="140" class="content">Standard</text>
  </g>
</svg>