<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frighten</text>
  <text x="50" y="120" class="subtitle">[ˈfraɪtn] v. 使惊吓，使害怕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frigh (恐惧) + -en (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的怪兽突然出现在你面前，"使你感到恐惧(frigh-en)"，
    <tspan x="50" dy="25">你的心跳加速，脸色苍白，这就是frighten的效果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loud noise frightened the children.
  </text>
  <text x="50" y="310" class="content">
    巨大的噪音吓坏了孩子们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="170" y2="130" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Heartbeat -->
    <line x1="200" y1="220" x2="200" y2="240" class="image" />
    <line x1="200" y1="240" x2="180" y2="260" class="image" />
    <line x1="200" y1="240" x2="220" y2="260" class="image" />
  </g>
</svg>