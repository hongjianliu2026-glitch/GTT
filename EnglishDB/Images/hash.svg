<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hash</text>
  <text x="50" y="120" class="subtitle">[hæʃ] n. 散列，哈希；v. 切碎，杂凑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> has- (切碎) + h (强化)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"切碎(has-h)"
    <tspan x="50" dy="25">各种食材，这些食材被混合在一起，形成了一道美味的菜肴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The data was hashed to ensure security.
  </text>
  <text x="50" y="310" class="content">
    数据被哈希处理以确保安全。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cutting board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Knife -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="30" y2="50" class="image" />
    <line x1="50" y1="20" x2="70" y2="50" class="image" />
    <!-- Vegetables -->
    <circle cx="100" cy="100" r="20" class="image" /> <!-- Tomato -->
    <rect x="150" y="80" width="40" height="40" class="image" /> <!-- Carrot -->
    <line x1="200" y1="80" x2="240" y2="120" class="image" />
    <line x1="200" y1="120" x2="240" y2="80" class="image" /> <!-- Onion -->
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>