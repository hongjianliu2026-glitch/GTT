<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">personalize</text>
  <text x="50" y="120" class="subtitle">[ˈpɜːrsənəlaɪz] v. 使个性化，使个人化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> person (人) + -al (形容词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在为每个人"定制(personalize)"
    <tspan x="50" dy="25">独一无二的艺术品，每件作品都反映了他们的个性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company personalized each customer's experience.
  </text>
  <text x="50" y="310" class="content">
    公司为每位顾客定制了独特的体验。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Artwork -->
    <rect x="70" y="20" width="250" height="160" class="image" />
    <line x1="80" y1="50" x2="280" y2="50" class="image" />
    <line x1="80" y1="80" x2="250" y2="80" class="image" />
    <line x1="80" y1="110" x2="270" y2="110" class="image" />
    <line x1="80" y1="140" x2="240" y2="140" class="image" />
    <!-- Personalized elements -->
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="90" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
  </g>
</svg>