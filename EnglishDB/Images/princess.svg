<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">princess</text>
  <text x="50" y="120" class="subtitle">[ˈprɪnsɪs] n. 公主</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prin- (prince, 王子) + cess (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个王子(prince)在城堡中行走(cess)，
    <tspan x="50" dy="25">突然遇到一位美丽的公主(princess)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The princess wore a sparkling tiara at the ball.
  </text>
  <text x="50" y="310" class="content">
    公主在舞会上戴着闪闪发光的发冠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Princess -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Tiara -->
    <line x1="180" y1="80" x2="220" y2="80" class="image" />
    <line x1="190" y1="70" x2="210" y2="70" class="image" />
    <line x1="200" y1="60" x2="200" y2="70" class="image" />
  </g>
</svg>