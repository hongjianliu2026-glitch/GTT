<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slit</text>
  <text x="50" y="120" class="subtitle">[slɪt] n. 裂缝，狭长的切口；v. 切开，撕裂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sl- (切，割) + -it (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀子"切开(sl-)"一张纸，留下一个狭长的"裂缝(it)"，这就是slit。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a small slit in the envelope to open it.
  </text>
  <text x="50" y="310" class="content">
    她在信封上切了一个小口子以便打开它。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Paper -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Slit -->
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <!-- Knife -->
    <line x1="250" y1="20" x2="280" y2="50" class="image" />
    <line x1="280" y1="50" x2="250" y2="80" class="image" />
  </g>
</svg>