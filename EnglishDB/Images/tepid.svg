<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tepid</text>
  <text x="50" y="120" class="subtitle">[ˈtɛpɪd] adj. 微温的，不冷不热的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tepidus (拉丁语，微温的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯咖啡，既不热也不冷，"微温的(tepid)"
    <tspan x="50" dy="25">状态让人感到舒适，但缺乏激情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The audience's response was tepid at best.
  </text>
  <text x="50" y="310" class="content">
    观众反应充其量只是不冷不热。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee cup -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Coffee -->
    <rect x="20" y="20" width="160" height="110" class="image" fill="#D2B48C" />
    <!-- Steam -->
    <line x1="100" y1="20" x2="100" y2="0" class="image" />
    <line x1="110" y1="20" x2="110" y2="0" class="image" />
    <line x1="120" y1="20" x2="120" y2="0" class="image" />
  </g>
</svg>