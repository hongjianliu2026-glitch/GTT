<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">empathy</text>
  <text x="50" y="120" class="subtitle">[ˈɛmpəθi] n. 同理心，共鸣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (进入) + path (感情) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走进(em-)另一个人的内心，感受(path)
    <tspan x="50" dy="25">他们的情感，这种深刻的理解就是同理心(empathy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She showed great empathy towards her friend's loss.
  </text>
  <text x="50" y="310" class="content">
    她对朋友的损失表现出极大的同理心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 50 C10 0, 90 0, 90 50 S170 100, 90 150 S10 100, 10 50" class="image" />
    <!-- Person 1 -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="35" y2="180" class="image" />
    <line x1="50" y1="150" x2="65" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Person 2 -->
    <circle cx="130" cy="100" r="15" class="image" />
    <line x1="130" y1="115" x2="130" y2="150" class="image" />
    <line x1="130" y1="150" x2="115" y2="180" class="image" />
    <line x1="130" y1="150" x2="145" y2="180" class="image" />
    <line x1="130" y1="130" x2="160" y2="120" class="image" />
    <!-- Connection line -->
    <line x1="65" y1="115" x2="115" y2="115" class="image" />
  </g>
</svg>