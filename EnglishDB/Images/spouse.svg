<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spouse</text>
  <text x="50" y="120" class="subtitle">[spaʊs] n. 配偶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spous (结合) + -e (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人手牵手，"结合(spous)"在一起，
    <tspan x="50" dy="25">象征着他们是一对配偶(spouse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She introduced her spouse at the party.
  </text>
  <text x="50" y="310" class="content">
    她在派对上介绍了她的配偶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Couple holding hands -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <!-- Hearts -->
    <path d="M 50 120 Q 70 140 90 120 Q 110 140 130 120" class="image" />
    <path d="M 150 120 Q 170 140 190 120 Q 210 140 230 120" class="image" />
  </g>
</svg>