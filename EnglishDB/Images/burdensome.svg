<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">burdensome</text>
  <text x="50" y="120" class="subtitle">[ˈbɜːrdnˌsəm] adj. 繁重的，难以承担的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> burden (负担) + -some (形容词后缀，表示“充满...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背着一个巨大的石头，"负担(burden)"
    <tspan x="50" dy="25">沉重到几乎无法移动，这就是"繁重的(burdensome)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The workload was burdensome, making it hard to focus.
  </text>
  <text x="50" y="310" class="content">
    工作量繁重，难以集中注意力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person carrying a heavy stone -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <rect x="40" y="160" width="20" height="40" class="image" /> <!-- Stone -->
  </g>
</svg>