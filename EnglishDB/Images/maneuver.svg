<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maneuver</text>
  <text x="50" y="120" class="subtitle">[məˈnuːvər] n. 策略，操纵；v. 操纵，移动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (手) + euv (移动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棋手在棋盘上"用手移动(man-euv)"
    <tspan x="50" dy="25">棋子，巧妙地布局，这就是策略(maneuver)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The general used a clever maneuver to outflank the enemy.
  </text>
  <text x="50" y="310" class="content">
    将军用了一个巧妙的策略来包抄敌人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chessboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Chess pieces -->
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <!-- Hand moving piece -->
    <line x1="250" y1="50" x2="200" y2="100" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="200" y2="150" class="image" />
  </g>
</svg>