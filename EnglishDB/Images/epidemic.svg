<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">epidemic</text>
  <text x="50" y="120" class="subtitle">[ˌɛpɪˈdɛmɪk] n. 流行病，传染病</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> epi- (在...之间) + dem (人民) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一种病毒在人群中"之间(epi-)"迅速传播，
    <tspan x="50" dy="25">导致"人民(dem)"大量感染，这就是"流行病(epidemic)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flu epidemic spread rapidly across the country.
  </text>
  <text x="50" y="310" class="content">
    流感流行病迅速在全国蔓延。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Virus -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- People -->
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="100" cy="200" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="200" cy="200" r="15" class="image" />
    <!-- Connections -->
    <line x1="70" y1="60" x2="120" y2="110" class="image" />
    <line x1="170" y1="60" x2="120" y2="110" class="image" />
    <line x1="70" y1="160" x2="120" y2="210" class="image" />
    <line x1="170" y1="160" x2="120" y2="210" class="image" />
  </g>
</svg>