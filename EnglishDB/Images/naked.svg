<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">naked</text>
  <text x="50" y="120" class="subtitle">[ˈneɪkɪd] adj. 裸体的，无遮蔽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nake (裸露) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在阳光下，"裸露(nake)"
    <tspan x="50" dy="25">全身，没有任何遮蔽物，这就是裸体的(naked)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby was naked when he was born.
  </text>
  <text x="50" y="310" class="content">
    婴儿出生时是裸体的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="100" cy="200" r="30" class="image" fill="#ECF0F1" />
    <line x1="100" y1="230" x2="100" y2="300" class="image" />
    <line x1="100" y1="250" x2="70" y2="280" class="image" />
    <line x1="100" y1="250" x2="130" y2="280" class="image" />
    <line x1="100" y1="300" x2="70" y2="330" class="image" />
    <line x1="100" y1="300" x2="130" y2="330" class="image" />
  </g>
</svg>