<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mirrored</text>
  <text x="50" y="120" class="subtitle">[ˈmɪrərd] adj. 镜像的，反射的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mir (看) + ror (摇摆) + ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"看着(mir)"
    <tspan x="50" dy="25">自己的影像在镜子中"摇摆(ror)"，</tspan>
    <tspan x="50" dy="25">这就是镜像(mirrored)的效果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The design of the building was mirrored on the other side.
  </text>
  <text x="50" y="310" class="content">
    建筑的设计在另一侧是镜像的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mirror -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="200" x2="70" y2="220" class="image" />
    <line x1="100" y1="200" x2="130" y2="220" class="image" />
    <!-- Mirrored Person -->
    <circle cx="100" cy="150" r="30" class="image" transform="translate(200,0) scale(-1,1)" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" transform="translate(200,0) scale(-1,1)" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" transform="translate(200,0) scale(-1,1)" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" transform="translate(200,0) scale(-1,1)" />
    <line x1="100" y1="200" x2="70" y2="220" class="image" transform="translate(200,0) scale(-1,1)" />
    <line x1="100" y1="200" x2="130" y2="220" class="image" transform="translate(200,0) scale(-1,1)" />
  </g>
</svg>