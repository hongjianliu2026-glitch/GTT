<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fat</text>
  <text x="50" y="120" class="subtitle">[fæt] adj. 肥胖的，脂肪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fat (源自中古英语，意为“脂肪”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只胖乎乎的小猪，全身都是"脂肪(fat)"，
    <tspan x="50" dy="25">走起路来摇摇晃晃，让人忍不住想笑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat became fat after eating too much.
  </text>
  <text x="50" y="310" class="content">
    这只猫吃太多后变胖了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fat pig -->
    <circle cx="100" cy="100" r="60" class="image" fill="#F1C40F" />
    <circle cx="100" cy="100" r="50" class="image" fill="#F39C12" />
    <circle cx="70" cy="80" r="10" class="image" fill="#000" />
    <circle cx="130" cy="80" r="10" class="image" fill="#000" />
    <ellipse cx="100" cy="120" rx="30" ry="15" class="image" fill="#F39C12" />
    <line x1="80" y1="140" x2="60" y2="160" class="image" />
    <line x1="120" y1="140" x2="140" y2="160" class="image" />
    <line x1="100" y1="160" x2="100" y2="180" class="image" />
  </g>
</svg>