<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ordered</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrdəd] adj. 有序的，整齐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> order (顺序) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个图书馆里，所有的书都"按顺序排列(order-ed)"，
    <tspan x="50" dy="25">每本书都整齐地放在自己的位置上，整个图书馆看起来井然有序。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The books in the library were ordered by subject.
  </text>
  <text x="50" y="310" class="content">
    图书馆里的书是按主题分类的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bookshelf -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- Labels -->
    <text x="55" y="190" class="content">1</text>
    <text x="125" y="190" class="content">2</text>
    <text x="195" y="190" class="content">3</text>
    <text x="265" y="190" class="content">4</text>
  </g>
</svg>