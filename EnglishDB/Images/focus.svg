<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">focus</text>
  <text x="50" y="120" class="subtitle">[ˈfoʊkəs] n. 焦点，中心；v. 集中</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> foc (火) + us (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的炼金术士，他需要将所有的注意力"集中(focus)"
    <tspan x="50" dy="25">在火堆的中心，以确保火焰不会熄灭，这就是"焦点(focus)"的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She needs to focus on her studies to pass the exam.
  </text>
  <text x="50" y="310" class="content">
    她需要集中精力学习以通过考试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF6F61" />
    <!-- Focus point -->
    <circle cx="100" cy="100" r="10" class="image" fill="#FFD700" />
    <!-- Alchemist -->
    <circle cx="50" cy="150" r="20" class="image" fill="#34495E" />
    <line x1="50" y1="170" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="250" class="image" />
    <line x1="50" y1="220" x2="70" y2="250" class="image" />
    <line x1="50" y1="190" x2="80" y2="180" class="image" />
  </g>
</svg>