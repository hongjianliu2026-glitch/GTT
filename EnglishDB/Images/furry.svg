<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">furry</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːri] adj. 毛皮的，毛茸茸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fur (毛皮) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只毛茸茸的小熊，全身覆盖着厚厚的"毛皮(fur)"，
    <tspan x="50" dy="25">看起来非常温暖和舒适，这就是"毛茸茸的(furry)"感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The furry cat was sleeping on the couch.
  </text>
  <text x="50" y="310" class="content">
    那只毛茸茸的猫正在沙发上睡觉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Furry bear -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Fur texture -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="60" x2="150" y2="60" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <line x1="50" y1="90" x2="150" y2="90" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
  </g>
</svg>