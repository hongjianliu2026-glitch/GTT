<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whore</text>
  <text x="50" y="120" class="subtitle">[hɔːr] n. 妓女</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whor- (旋转) + -e (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的旋转木马，"旋转(whor-)"
    <tspan x="50" dy="25">的木马上坐着一位妓女(whore)，</tspan>
    <tspan x="50" dy="25">她的生活就像这个旋转木马一样，</tspan>
    <tspan x="50" dy="25">不断循环，无法停止。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The old man used to frequent the whorehouse.
  </text>
  <text x="50" y="330" class="content">
    这位老人过去常去妓院。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Carousel -->
    <circle cx="150" cy="100" r="80" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="180" class="image" />
    <!-- Horse -->
    <rect x="120" y="40" width="60" height="80" class="image" />
    <line x1="150" y1="40" x2="150" y2="120" class="image" />
    <line x1="120" y1="80" x2="180" y2="80" class="image" />
    <!-- Woman -->
    <circle cx="150" cy="140" r="15" class="image" />
    <line x1="150" y1="155" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="200" class="image" />
    <line x1="150" y1="180" x2="170" y2="200" class="image" />
    <line x1="150" y1="165" x2="180" y2="155" class="image" />
  </g>
</svg>