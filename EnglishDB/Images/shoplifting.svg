<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shoplifting</text>
  <text x="50" y="120" class="subtitle">[ˈʃɑːplɪftɪŋ] n. 商店行窃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shop (商店) + lift (举起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小偷在商店里，偷偷"举起(lift)"商品，
    <tspan x="50" dy="25">然后迅速离开，这就是商店行窃(shoplifting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store installed cameras to prevent shoplifting.
  </text>
  <text x="50" y="310" class="content">
    商店安装了摄像头以防止商店行窃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Store -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Shelves -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Products -->
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="130" cy="50" r="10" class="image" />
    <circle cx="160" cy="50" r="10" class="image" />
    <circle cx="190" cy="50" r="10" class="image" />
    <circle cx="220" cy="50" r="10" class="image" />
    <!-- Thief -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Stolen product -->
    <circle cx="20" cy="80" r="10" class="image" />
  </g>
</svg>