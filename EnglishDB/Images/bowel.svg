<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bowel</text>
  <text x="50" y="120" class="subtitle">[ˈbaʊəl] n. 肠，内部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bow (弯曲) + el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个弯曲的小肠(bowel)，它像一条蜿蜒的小河，
    <tspan x="50" dy="25">在人体内部默默地工作，消化食物，吸收营养。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor examined his bowel for any abnormalities.
  </text>
  <text x="50" y="310" class="content">
    医生检查了他的肠子是否有异常。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowel -->
    <path d="M50,50 C100,20 150,80 200,50" class="image" />
    <path d="M200,50 C250,20 300,80 350,50" class="image" />
    <path d="M350,50 C400,20 450,80 500,50" class="image" />
    <!-- Food -->
    <circle cx="100" cy="40" r="10" class="image" />
    <circle cx="250" cy="40" r="10" class="image" />
    <circle cx="400" cy="40" r="10" class="image" />
  </g>
</svg>