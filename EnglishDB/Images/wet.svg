<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wet</text>
  <text x="50" y="120" class="subtitle">[wet] adj. 湿的，潮湿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "wet"，意为“潮湿的”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在雨中行走，全身被雨水浸湿，
    <tspan x="50" dy="25">衣服和头发都变得湿漉漉的，这就是“wet”的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the rain, the ground was wet.
  </text>
  <text x="50" y="310" class="content">
    雨后，地面变得湿漉漉的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Raindrops -->
    <circle cx="50" cy="50" r="10" class="water" />
    <circle cx="80" cy="70" r="10" class="water" />
    <circle cx="110" cy="60" r="10" class="water" />
    <circle cx="140" cy="80" r="10" class="water" />
    <circle cx="170" cy="50" r="10" class="water" />
    <circle cx="200" cy="70" r="10" class="water" />
    <circle cx="230" cy="60" r="10" class="water" />
    <circle cx="260" cy="80" r="10" class="water" />

    <!-- Person getting wet -->
    <circle cx="150" cy="150" r="30" class="image" />
    <line x1="150" y1="180" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="120" y2="300" class="image" />
    <line x1="150" y1="250" x2="180" y2="300" class="image" />
    <line x1="150" y1="200" x2="100" y2="220" class="image" />
    <line x1="150" y1="200" x2="200" y2="220" class="image" />

    <!-- Wet clothes -->
    <rect x="120" y="180" width="60" height="70" class="image" />
    <line x1="120" y1="180" x2="180" y2="180" class="image" />
    <line x1="120" y1="210" x2="180" y2="210" class="image" />
    <line x1="120" y1="240" x2="180" y2="240" class="image" />
  </g>
</svg>