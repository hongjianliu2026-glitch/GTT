<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">budget</text>
  <text x="50" y="120" class="subtitle">[ˈbʌdʒɪt] n. 预算；v. 做预算</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> budg (钱包) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小钱包(budg-et)，里面装满了各种硬币和纸币，
    <tspan x="50" dy="25">每一张都代表着你的预算(budget)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully budgeted her monthly expenses.
  </text>
  <text x="50" y="310" class="content">
    她仔细地做了每月的预算。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wallet -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Coins -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="80" cy="50" r="15" class="image" />
    <circle cx="110" cy="50" r="15" class="image" />
    <!-- Paper money -->
    <rect x="50" y="80" width="100" height="30" class="image" />
    <rect x="50" y="120" width="100" height="30" class="image" />
  </g>
</svg>