<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B7D7D; }
      .content { font: 18px sans-serif; fill: #566573; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boring</text>
  <text x="50" y="120" class="subtitle">[ˈbɔːrɪŋ] adj. 无聊的，令人厌烦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bor (钻孔) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在钻孔，"钻孔(bor)"
    <tspan x="50" dy="25">的动作单调重复，让人感到无聊(boring)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lecture was so boring that I fell asleep.
  </text>
  <text x="50" y="310" class="content">
    讲座太无聊了，我睡着了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Drill -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <circle cx="50" cy="20" r="10" class="image" />
    <!-- Hole -->
    <rect x="30" y="180" width="40" height="20" class="image" />
    <!-- Person yawning -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
  </g>
</svg>