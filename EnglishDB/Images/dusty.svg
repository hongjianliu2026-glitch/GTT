<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dusty</text>
  <text x="50" y="120" class="subtitle">[ˈdʌsti] adj. 满是灰尘的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dust (灰尘) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的图书馆，书架上堆满了"灰尘(dust)"，
    <tspan x="50" dy="25">整个房间都"满是灰尘(dusty)"，仿佛时间在这里静止了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The attic was so dusty that we could barely breathe.
  </text>
  <text x="50" y="310" class="content">
    阁楼里满是灰尘，我们几乎无法呼吸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bookshelf -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Dust particles -->
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="150" cy="120" r="5" class="image" />
    <circle cx="200" cy="80" r="5" class="image" />
    <circle cx="250" cy="140" r="5" class="image" />
    <circle cx="300" cy="100" r="5" class="image" />
    <!-- Library -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>