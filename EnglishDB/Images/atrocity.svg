<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">atrocity</text>
  <text x="50" y="120" class="subtitle">[əˈtrɑːsəti] n. 残暴，暴行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> atro- (可怕的) + -city (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个可怕的场景，"可怕的(atro-)"
    <tspan x="50" dy="25">行为造成了极大的伤害，这就是残暴(atrocity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The atrocity of the war left many families devastated.
  </text>
  <text x="50" y="310" class="content">
    战争的暴行使许多家庭陷入绝望。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skull and crossbones -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="125" y1="100" x2="225" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="125" y1="150" x2="225" y2="150" class="image" />
    <line x1="125" y1="150" x2="125" y2="200" class="image" />
    <line x1="225" y1="150" x2="225" y2="200" class="image" />
  </g>
</svg>