<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">farm</text>
  <text x="50" y="120" class="subtitle">[fɑːrm] n. 农场，农田；v. 耕作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> far (田地) + m (表示地点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的田地(far)，上面有农民在耕作，
    <tspan x="50" dy="25">这片田地就是他们的农场(farm)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They own a small farm in the countryside.
  </text>
  <text x="50" y="310" class="content">
    他们在乡下拥有一个小农场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Farmer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Crops -->
    <line x1="100" y1="180" x2="120" y2="180" class="image" />
    <line x1="110" y1="180" x2="110" y2="160" class="image" />
    <line x1="150" y1="180" x2="170" y2="180" class="image" />
    <line x1="160" y1="180" x2="160" y2="160" class="image" />
    <line x1="200" y1="180" x2="220" y2="180" class="image" />
    <line x1="210" y1="180" x2="210" y2="160" class="image" />
  </g>
</svg>