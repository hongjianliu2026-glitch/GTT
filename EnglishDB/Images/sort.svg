<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sort</text>
  <text x="50" y="120" class="subtitle">[sɔːrt] n. 种类，类别；v. 分类，整理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sort (种类)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的仓库里，各种物品被"分类(sort)"
    <tspan x="50" dy="25">成不同的堆，每堆代表一种"种类(sort)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sorted the books by genre.
  </text>
  <text x="50" y="310" class="content">
    她按类型整理了书籍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warehouse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Piles of items -->
    <rect x="50" y="20" width="50" height="80" class="image" />
    <rect x="120" y="20" width="50" height="80" class="image" />
    <rect x="190" y="20" width="50" height="80" class="image" />
    <rect x="260" y="20" width="50" height="80" class="image" />
    <!-- Labels -->
    <text x="50" y="110" class="content">Books</text>
    <text x="120" y="110" class="content">Toys</text>
    <text x="190" y="110" class="content">Clothes</text>
    <text x="260" y="110" class="content">Tools</text>
  </g>
</svg>