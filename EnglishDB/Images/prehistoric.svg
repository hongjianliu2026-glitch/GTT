<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prehistoric</text>
  <text x="50" y="120" class="subtitle">[ˌpriːhɪˈstɒrɪk] adj. 史前的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在...之前) + historic (历史的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的恐龙骨架，"在历史之前(pre-historic)"
    <tspan x="50" dy="25">就存在的生物，这就是史前(prehistoric)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The museum has a collection of prehistoric fossils.
  </text>
  <text x="50" y="310" class="content">
    博物馆收藏了一些史前的化石。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dinosaur skeleton -->
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="120" class="image" />
    <line x1="150" y1="20" x2="150" y2="120" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="100" y1="120" x2="100" y2="220" class="image" />
    <line x1="100" y1="170" x2="50" y2="220" class="image" />
    <line x1="100" y1="170" x2="150" y2="220" class="image" />
    <line x1="100" y1="220" x2="50" y2="270" class="image" />
    <line x1="100" y1="220" x2="150" y2="270" class="image" />
    <line x1="50" y1="270" x2="150" y2="270" class="image" />
  </g>
</svg>