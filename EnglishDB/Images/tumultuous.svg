<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tumultuous</text>
  <text x="50" y="120" class="subtitle">[tjuːˈmʌltʃuəs] adj. 喧闹的，骚动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tumult (骚动) + -uous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个市场里，人们"骚动(tumult)"得像一群蜜蜂，
    <tspan x="50" dy="25">每个人都大声喊叫，场面混乱不堪，这就是tumultuous的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tumultuous crowd made it impossible to hear the speaker.
  </text>
  <text x="50" y="310" class="content">
    喧闹的人群使得演讲者的话无法被听到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="30" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <circle cx="250" cy="40" r="10" class="image" />
    <!-- Speech bubbles -->
    <ellipse cx="50" cy="30" rx="20" ry="10" class="image" />
    <ellipse cx="100" cy="50" rx="20" ry="10" class="image" />
    <ellipse cx="150" cy="10" rx="20" ry="10" class="image" />
    <ellipse cx="200" cy="40" rx="20" ry="10" class="image" />
    <ellipse cx="250" cy="20" rx="20" ry="10" class="image" />
    <!-- Market stalls -->
    <rect x="20" y="100" width="50" height="50" class="image" />
    <rect x="100" y="100" width="50" height="50" class="image" />
    <rect x="180" y="100" width="50" height="50" class="image" />
    <rect x="260" y="100" width="50" height="50" class="image" />
  </g>
</svg>