<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">absolutely</text>
  <text x="50" y="120" class="subtitle">[ˈæbsəluːtli] adv. 绝对地，完全地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + solut (解开) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的锁链前，"解开(solut)"
    <tspan x="50" dy="25">所有的束缚，完全自由(ab-solut-ly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was absolutely certain of her decision.
  </text>
  <text x="50" y="310" class="content">
    她对自己的决定绝对有把握。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chains -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <!-- Person breaking free -->
    <circle cx="100" cy="200" r="15" class="image" />
    <line x1="100" y1="215" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
    <line x1="100" y1="230" x2="130" y2="220" class="image" />
    <!-- Broken chains -->
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <line x1="150" y1="180" x2="130" y2="200" class="image" />
  </g>
</svg>