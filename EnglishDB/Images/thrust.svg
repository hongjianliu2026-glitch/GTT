<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thrust</text>
  <text x="50" y="120" class="subtitle">[θrʌst] v. 推，刺；n. 推力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thra- (推) + -ust (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用力"推(thra-)"一个巨大的石头，
    <tspan x="50" dy="25">石头被推得飞快前进，这就是"推力(thrust)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He thrust the door open with all his might.
  </text>
  <text x="50" y="310" class="content">
    他用尽全力把门推开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person pushing a large stone -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="30" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="70" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="210" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="210" class="image" /> <!-- Right leg -->
    <rect x="100" y="80" width="150" height="100" class="image" /> <!-- Stone -->
    <line x1="175" y1="180" x2="175" y2="250" class="image" /> <!-- Stone shadow -->
  </g>
</svg>