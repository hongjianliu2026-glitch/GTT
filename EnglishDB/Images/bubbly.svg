<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bubble { fill: #F1C40F; stroke: #F39C12; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bubbly</text>
  <text x="50" y="120" class="subtitle">[ˈbʌbli] adj. 起泡的，活泼的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bubbl (起泡) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一瓶汽水打开时，"起泡(bubbl)"
    <tspan x="50" dy="25">的液体和活泼(bubbly)的气泡一起涌出。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is as bubbly as a freshly opened soda.
  </text>
  <text x="50" y="310" class="content">
    她就像刚打开的汽水一样活泼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Bubbles -->
    <circle cx="50" cy="50" r="10" class="bubble" />
    <circle cx="30" cy="70" r="8" class="bubble" />
    <circle cx="70" cy="90" r="12" class="bubble" />
    <circle cx="40" cy="110" r="9" class="bubble" />
    <circle cx="60" cy="130" r="11" class="bubble" />
    <circle cx="50" cy="150" r="10" class="bubble" />
    <circle cx="30" cy="170" r="8" class="bubble" />
    <circle cx="70" cy="190" r="12" class="bubble" />
  </g>
</svg>