<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preconceived</text>
  <text x="50" y="120" class="subtitle">[ˌpriːkənˈsiːvd] adj. 预先形成的，先入为主的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + con- (一起) + ceive (抓住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在事情发生之前，"提前抓住(pre-ceive)"
    <tspan x="50" dy="25">所有的想法，这些想法就形成了先入为主的观念(preconceived)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a preconceived notion about the new colleague.
  </text>
  <text x="50" y="310" class="content">
    她对新同事有一种先入为主的观念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="200" cy="100" rx="70" ry="40" class="image" />
    <!-- Thought lines -->
    <line x1="150" y1="100" x2="180" y2="100" class="image" />
    <line x1="150" y1="100" x2="165" y2="80" class="image" />
    <line x1="150" y1="100" x2="165" y2="120" class="image" />
    <!-- Preconceived notion -->
    <text x="210" y="105" class="content" fill="#E74C3C">先入为主</text>
  </g>
</svg>