<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">geneticist</text>
  <text x="50" y="120" class="subtitle">[dʒəˈnetɪsɪst] n. 遗传学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gene (基因) + -ist (从事...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个遗传学家在实验室里，"研究基因(gene)"
    <tspan x="50" dy="25">的奥秘，揭示生命的起源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The geneticist discovered a new gene mutation.
  </text>
  <text x="50" y="310" class="content">
    这位遗传学家发现了一种新的基因突变。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab coat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- DNA double helix -->
    <path d="M70,50 C70,70 150,70 150,50" class="image" />
    <path d="M70,50 C70,30 150,30 150,50" class="image" />
    <path d="M150,50 C150,70 230,70 230,50" class="image" />
    <path d="M150,50 C150,30 230,30 230,50" class="image" />
    <!-- Microscope -->
    <rect x="250" y="20" width="80" height="100" class="image" />
    <line x1="290" y1="20" x2="290" y2="0" class="image" />
    <line x1="290" y1="0" x2="310" y2="20" class="image" />
  </g>
</svg>