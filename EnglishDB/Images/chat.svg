<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chat</text>
  <text x="50" y="120" class="subtitle">[tʃæt] n. 聊天，闲谈；v. 聊天，闲谈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chat (源自中古英语 chateren，意为“喋喋不休”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在咖啡馆里，"喋喋不休(chat)"
    <tspan x="50" dy="25">地聊天，分享彼此的故事和想法。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They spent hours chatting about their childhood memories.
  </text>
  <text x="50" y="310" class="content">
    他们花了几个小时聊童年的回忆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee shop -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Two people -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />

    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />

    <!-- Speech bubbles -->
    <path d="M100,80 Q150,70 200,80" class="image" />
    <path d="M200,80 Q250,70 300,80" class="image" />
  </g>
</svg>