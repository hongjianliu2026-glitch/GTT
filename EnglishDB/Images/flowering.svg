<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flowering</text>
  <text x="50" y="120" class="subtitle">[ˈflaʊərɪŋ] n. 开花，兴旺；adj. 开花的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flower (花) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片花园，"花儿(flower)"
    <tspan x="50" dy="25">正在盛开(ing)，整个花园充满了生机和美丽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cherry trees are flowering beautifully this spring.
  </text>
  <text x="50" y="310" class="content">
    今年春天，樱花树开得非常美丽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flower 1 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="80" x2="50" y2="40" class="image" />
    <!-- Flower 2 -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="80" x2="100" y2="40" class="image" />
    <!-- Flower 3 -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="80" x2="150" y2="40" class="image" />
    <!-- Flower 4 -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="80" x2="200" y2="40" class="image" />
    <!-- Flower 5 -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="80" x2="250" y2="40" class="image" />
  </g>
</svg>