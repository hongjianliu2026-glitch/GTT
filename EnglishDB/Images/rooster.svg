<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rooster</text>
  <text x="50" y="120" class="subtitle">[ˈruːstər] n. 公鸡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roost (栖息) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只公鸡站在栖木上，"栖息(roost)"
    <tspan x="50" dy="25">在高处，昂首挺胸，它就是那只骄傲的公鸡(rooster)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rooster crowed at dawn.
  </text>
  <text x="50" y="310" class="content">
    公鸡在黎明时分啼叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rooster body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Rooster head -->
    <circle cx="100" cy="50" r="20" class="image" />
    <!-- Rooster beak -->
    <polygon points="90,50 110,50 100,60" class="image" />
    <!-- Rooster comb -->
    <polygon points="85,40 115,40 100,30" class="image" />
    <!-- Rooster legs -->
    <line x1="80" y1="150" x2="80" y2="200" class="image" />
    <line x1="120" y1="150" x2="120" y2="200" class="image" />
    <!-- Rooster wings -->
    <line x1="50" y1="100" x2="30" y2="80" class="image" />
    <line x1="150" y1="100" x2="170" y2="80" class="image" />
    <!-- Rooster tail -->
    <line x1="70" y1="50" x2="50" y2="30" class="image" />
    <line x1="130" y1="50" x2="150" y2="30" class="image" />
  </g>
</svg>