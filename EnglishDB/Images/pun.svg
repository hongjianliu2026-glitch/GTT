<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pun</text>
  <text x="50" y="120" class="subtitle">[pʌn] n. 双关语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pun (源自拉丁语 "puniceus"，意为 "用双关语")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在讲笑话，"双关(pun)"
    <tspan x="50" dy="25">语让听众笑得前仰后合，这就是双关语的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made a clever pun during the conversation.
  </text>
  <text x="50" y="310" class="content">
    他在对话中巧妙地使用了一个双关语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Tongue -->
    <rect x="40" y="50" width="20" height="30" class="image" />
    <!-- Teeth -->
    <line x1="35" y1="50" x2="65" y2="50" class="image" />
    <line x1="35" y1="60" x2="65" y2="60" class="image" />
    <!-- Speech bubble -->
    <path d="M 80 30 Q 150 30 150 80 Q 150 130 80 130 Q 50 130 50 100 Q 50 70 80 70 Z" class="image" />
    <!-- Pun text -->
    <text x="90" y="90" class="content">Pun</text>
  </g>
</svg>