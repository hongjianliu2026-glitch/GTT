<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">locally</text>
  <text x="50" y="120" class="subtitle">[ˈloʊkəli] adv. 在本地，局部地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loc (地方) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小村庄里，"地方(loc)"
    <tspan x="50" dy="25">的居民们正在"局部地(locally)"</tspan>
    <tspan x="50" dy="25">庆祝丰收节。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event was advertised locally.
  </text>
  <text x="50" y="310" class="content">
    这个活动是在本地宣传的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
    <circle cx="210" cy="100" r="10" class="image" />
    <!-- Celebration -->
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <line x1="50" y1="160" x2="250" y2="160" class="image" />
    <line x1="50" y1="170" x2="250" y2="170" class="image" />
  </g>
</svg>