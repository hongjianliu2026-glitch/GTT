<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inconsistency</text>
  <text x="50" y="120" class="subtitle">[ˌɪnkənˈsɪstənsi] n. 不一致，矛盾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + con- (一起) + sist (站立) + -ency (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，两个人试图"站在一起(con-sist)"，
    <tspan x="50" dy="25">但他们的观点完全"不一致(in-)"，导致矛盾(inconsistency)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The inconsistency in their statements raised suspicions.
  </text>
  <text x="50" y="310" class="content">
    他们陈述中的不一致引起了怀疑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people standing apart -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />

    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />

    <!-- Dashed line indicating separation -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" stroke-dasharray="5,5" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" stroke-dasharray="5,5" />
    <line x1="100" y1="140" x2="150" y2="140" class="image" stroke-dasharray="5,5" />
  </g>
</svg>