<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">multimedia</text>
  <text x="50" y="120" class="subtitle">[ˌmʌltiˈmiːdiə] n. 多媒体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> multi- (多) + media (媒介)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的屏幕上，"多种(multi)"
    <tspan x="50" dy="25">媒介(media)同时播放，</tspan>
    <tspan x="50" dy="25">有视频、音频、图片，</tspan>
    <tspan x="50" dy="25">这就是多媒体(multimedia)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The presentation used multimedia to engage the audience.
  </text>
  <text x="50" y="330" class="content">
    这个演示使用了多媒体来吸引观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Video -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Audio -->
    <rect x="170" y="20" width="100" height="160" class="image" />
    <!-- Image -->
    <rect x="290" y="20" width="100" height="160" class="image" />
    <!-- Labels -->
    <text x="50" y="200" class="content">Video</text>
    <text x="170" y="200" class="content">Audio</text>
    <text x="290" y="200" class="content">Image</text>
  </g>
</svg>