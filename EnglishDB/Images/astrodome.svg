<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Astrodome</text>
  <text x="50" y="120" class="subtitle">[ˈæstrədoʊm] n. 太空穹顶，巨型圆顶体育馆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> astro- (星，太空) + dome (圆顶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆顶建筑，"像太空(astro)"
    <tspan x="50" dy="25">中的星星一样闪耀，这就是Astrodome(太空穹顶)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Astrodome was once the largest domed stadium in the world.
  </text>
  <text x="50" y="310" class="content">
    太空穹顶曾经是世界上最大的圆顶体育馆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Dome -->
    <circle cx="200" cy="150" r="100" class="image" />
    <!-- Stars -->
    <circle cx="150" cy="100" r="5" class="image" />
    <circle cx="250" cy="120" r="5" class="image" />
    <circle cx="180" cy="200" r="5" class="image" />
    <circle cx="220" cy="220" r="5" class="image" />
    <!-- Ground -->
    <rect x="100" y="250" width="200" height="50" class="image" />
  </g>
</svg>