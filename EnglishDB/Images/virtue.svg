<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">virtue</text>
  <text x="50" y="120" class="subtitle">[ˈvɜːrtʃuː] n. 美德，优点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vir (男人) + -tue (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的勇士，他拥有"男人的美德(vir-tue)"，
    <tspan x="50" dy="25">他的勇气和正直成为了他的标志。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Honesty is a virtue that everyone should strive for.
  </text>
  <text x="50" y="310" class="content">
    诚实是一种每个人都应该追求的美德。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Warrior -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="100" y2="90" class="image" />
    <line x1="50" y1="100" x2="0" y2="90" class="image" />
    <!-- Shield -->
    <rect x="20" y="160" width="60" height="40" class="image" />
    <!-- Sword -->
    <line x1="50" y1="80" x2="50" y2="160" class="image" />
    <line x1="50" y1="80" x2="70" y2="60" class="image" />
    <line x1="50" y1="80" x2="30" y2="60" class="image" />
  </g>
</svg>