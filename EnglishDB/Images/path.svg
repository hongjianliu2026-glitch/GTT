<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">path</text>
  <text x="50" y="120" class="subtitle">[pæθ] n. 路径，道路；小路</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> path (感觉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蜿蜒的小路，"感觉(path)"
    <tspan x="50" dy="25">引导你走向目的地，这条路就是你的路径(path)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a hidden path through the forest.
  </text>
  <text x="50" y="310" class="content">
    她在森林中发现了一条隐藏的小路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path -->
    <path d="M50 100 Q100 50 150 100 T250 100" class="image" />
    <!-- Trees -->
    <rect x="30" y="120" width="20" height="60" class="image" />
    <rect x="260" y="120" width="20" height="60" class="image" />
    <!-- Person -->
    <circle cx="70" cy="90" r="10" class="image" />
    <line x1="70" y1="100" x2="70" y2="120" class="image" />
    <line x1="70" y1="120" x2="60" y2="140" class="image" />
    <line x1="70" y1="120" x2="80" y2="140" class="image" />
    <line x1="70" y1="110" x2="90" y2="100" class="image" />
  </g>
</svg>