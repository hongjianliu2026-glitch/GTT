<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">expansive</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspænsɪv] adj. 广阔的，扩张的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + pans (展开) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"向外展开(ex-pans)"
    <tspan x="50" dy="25">成一个广阔的空间，这就是expansive的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The expansive landscape stretched as far as the eye could see.
  </text>
  <text x="50" y="310" class="content">
    广阔的风景一望无际。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Lines representing expansion -->
    <line x1="100" y1="150" x2="200" y2="250" class="image" />
    <line x1="100" y1="150" x2="0" y2="250" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Text annotation -->
    <text x="210" y="260" class="content">广阔的空间</text>
  </g>
</svg>