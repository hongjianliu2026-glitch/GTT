<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">procedural</text>
  <text x="50" y="120" class="subtitle">[prəˈsiːdʒərəl] adj. 程序上的，过程的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + ced (走) + -ural (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，"按照程序(procedural)"
    <tspan x="50" dy="25">一步步推进案件审理，确保每一步都合规。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The court followed a procedural approach to resolve the dispute.
  </text>
  <text x="50" y="310" class="content">
    法院按照程序方法解决了争议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Gavel -->
    <rect x="10" y="80" width="20" height="30" class="image" />
    <!-- Steps -->
    <line x1="70" y1="50" x2="70" y2="150" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="130" y1="50" x2="130" y2="150" class="image" />
    <line x1="160" y1="50" x2="160" y2="150" class="image" />
    <line x1="70" y1="50" x2="160" y2="50" class="image" />
    <line x1="70" y1="150" x2="160" y2="150" class="image" />
    <!-- Steps labels -->
    <text x="75" y="40" class="content">1</text>
    <text x="105" y="40" class="content">2</text>
    <text x="135" y="40" class="content">3</text>
    <text x="165" y="40" class="content">4</text>
  </g>
</svg>