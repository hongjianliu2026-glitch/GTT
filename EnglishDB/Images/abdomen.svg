<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abdomen</text>
  <text x="50" y="120" class="subtitle">[ˈæbdəmən] n. 腹部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + do (做) + men (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的腹部，"离开(ab-)"了身体的其他部分，独自"做(do)"起了主角，
    <tspan x="50" dy="25">这个夸张的画面让人印象深刻，记住了abdomen就是腹部。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He felt a sharp pain in his abdomen after eating.
  </text>
  <text x="50" y="310" class="content">
    他吃完东西后感到腹部剧痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large abdomen -->
    <ellipse cx="200" cy="150" rx="150" ry="100" class="image" />
    <!-- Body outline -->
    <line x1="50" y1="150" x2="350" y2="150" class="image" />
    <line x1="200" y1="50" x2="200" y2="250" class="image" />
    <!-- Head -->
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Arms -->
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="300" y1="100" x2="350" y2="150" class="image" />
    <!-- Legs -->
    <line x1="150" y1="250" x2="100" y2="300" class="image" />
    <line x1="250" y1="250" x2="300" y2="300" class="image" />
  </g>
</svg>