<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hassle</text>
  <text x="50" y="120" class="subtitle">[ˈhæsəl] n. 麻烦，困难；v. 烦扰，打扰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> has (来自古英语，意为“抓住”) + -le (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被无数只手"抓住(has)"，反复"拉扯(-le)"，
    <tspan x="50" dy="25">这种不断的烦扰就构成了"麻烦(hassle)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I don't want to deal with the hassle of traveling during the holidays.
  </text>
  <text x="50" y="310" class="content">
    我不想在假期期间处理旅行的麻烦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <line x1="50" y1="140" x2="20" y2="130" class="image" />

    <!-- Hands grabbing -->
    <line x1="10" y1="80" x2="50" y2="100" class="image" />
    <line x1="90" y1="80" x2="50" y2="100" class="image" />
    <line x1="30" y1="60" x2="50" y2="100" class="image" />
    <line x1="70" y1="60" x2="50" y2="100" class="image" />
    <line x1="50" y1="80" x2="50" y2="100" class="image" />
  </g>
</svg>