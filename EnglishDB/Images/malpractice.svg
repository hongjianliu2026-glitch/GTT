<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">malpractice</text>
  <text x="50" y="120" class="subtitle">[ˌmælˈpræktɪs] n. 玩忽职守，渎职</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mal- (坏) + practice (实践)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在手术室里，"坏的实践(mal-practice)"
    <tspan x="50" dy="25">导致病人病情恶化，这就是玩忽职守(malpractice)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor was sued for malpractice.
  </text>
  <text x="50" y="310" class="content">
    这位医生因玩忽职守被起诉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Operating room -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Doctor -->
    <circle cx="70" cy="100" r="15" class="image" />
    <line x1="70" y1="115" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="70" y1="130" x2="100" y2="120" class="image" />
    <!-- Patient -->
    <rect x="150" y="80" width="100" height="40" class="image" />
    <!-- Warning sign -->
    <text x="200" y="150" class="highlight">!</text>
  </g>
</svg>