<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pledge</text>
  <text x="50" y="120" class="subtitle">[pledʒ] n. 誓言，保证；v. 保证，许诺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pled (承诺) + ge (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人举起手，"承诺(pled)"
    <tspan x="50" dy="25">并做出誓言(ge)，这就是一个誓言(pledge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made a pledge to support her no matter what.
  </text>
  <text x="50" y="310" class="content">
    他发誓无论如何都会支持她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand raised -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="70" class="image" />
    <line x1="50" y1="100" x2="80" y2="70" class="image" />
    <line x1="50" y1="100" x2="50" y2="130" class="image" />
    <!-- Oath -->
    <rect x="100" y="50" width="200" height="100" class="image" />
    <text x="150" y="100" class="content" fill="#2C3E50">Oath</text>
  </g>
</svg>