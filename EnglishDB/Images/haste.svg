<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">haste</text>
  <text x="50" y="120" class="subtitle">[heɪst] n. 急速，急忙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hast (快速)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在追赶时间，"快速(hast)"
    <tspan x="50" dy="25">奔跑，急忙(haste)地完成任务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> In his haste, he forgot his keys.
  </text>
  <text x="50" y="310" class="content">
    他在匆忙中忘了带钥匙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person running -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <!-- Clock -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="100" x2="200" y2="70" class="image" />
    <line x1="200" y1="100" x2="220" y2="100" class="image" />
  </g>
</svg>