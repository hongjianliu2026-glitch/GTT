<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wasp</text>
  <text x="50" y="120" class="subtitle">[wɑːsp] n. 黄蜂，胡蜂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wasp (源自中古英语，意为“黄蜂”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只黄蜂(wasp)在空中飞舞，它的刺针闪闪发光，
    <tspan x="50" dy="25">仿佛在警告所有靠近的生物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wasp stung him on the arm.
  </text>
  <text x="50" y="310" class="content">
    黄蜂蜇了他的手臂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wasp body -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <!-- Wasp wings -->
    <line x1="50" y1="80" x2="0" y2="60" class="image" />
    <line x1="50" y1="120" x2="0" y2="140" class="image" />
    <line x1="150" y1="80" x2="200" y2="60" class="image" />
    <line x1="150" y1="120" x2="200" y2="140" class="image" />
    <!-- Wasp stinger -->
    <line x1="100" y1="130" x2="100" y2="160" class="image" />
    <!-- Wasp antennae -->
    <line x1="70" y1="70" x2="50" y2="50" class="image" />
    <line x1="130" y1="70" x2="150" y2="50" class="image" />
  </g>
</svg>