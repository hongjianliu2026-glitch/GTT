<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chewy</text>
  <text x="50" y="120" class="subtitle">[ˈtʃuːi] adj. 耐嚼的，有嚼劲的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chew (咀嚼) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的橡皮糖，"咀嚼(chew)"
    <tspan x="50" dy="25">它时，它不断拉伸，像一条巨龙在空中飞舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The candy was so chewy that it took me five minutes to finish it.
  </text>
  <text x="50" y="310" class="content">
    这糖果太耐嚼了，我花了五分钟才吃完。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chewy candy -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <line x1="25" y1="100" x2="325" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <!-- Chewing action -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="250" y2="120" class="image" />
    <line x1="100" y1="140" x2="250" y2="140" class="image" />
  </g>
</svg>