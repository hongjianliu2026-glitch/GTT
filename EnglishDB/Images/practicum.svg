<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">practicum</text>
  <text x="50" y="120" class="subtitle">[ˈpræktɪkəm] n. 实习，实践课程</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prakt (实践) + -icum (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在实验室里，"实践(prakt)"
    <tspan x="50" dy="25">操作各种仪器，这就是他的实习课程(practicum)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The practicum helped her apply theory to real-world situations.
  </text>
  <text x="50" y="310" class="content">
    实习课程帮助她将理论应用于实际情境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Student -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Instruments -->
    <rect x="100" y="20" width="50" height="100" class="image" />
    <rect x="180" y="20" width="50" height="100" class="image" />
    <rect x="260" y="20" width="50" height="100" class="image" />
    <!-- Beakers -->
    <circle cx="125" cy="150" r="20" class="image" />
    <circle cx="205" cy="150" r="20" class="image" />
    <circle cx="285" cy="150" r="20" class="image" />
  </g>
</svg>