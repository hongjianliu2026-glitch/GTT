<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">increasingly</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkriːsɪŋli] adv. 越来越多地，逐渐增加地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + creas (增长) + -ing (进行时) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球不断"进入(in)"膨胀的状态，"增长(creas)"
    <tspan x="50" dy="25">得越来越大，这就是"越来越多地(increasingly)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The situation is becoming increasingly complex.
  </text>
  <text x="50" y="310" class="content">
    情况变得越来越复杂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="40" class="image" />
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- String -->
    <line x1="100" y1="160" x2="100" y2="200" class="image" />
  </g>
</svg>