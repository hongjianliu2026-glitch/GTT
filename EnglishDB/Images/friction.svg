<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">friction</text>
  <text x="50" y="120" class="subtitle">[ˈfrɪkʃn] n. 摩擦，冲突</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fric (摩擦) + -tion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两块木板在互相"摩擦(fric)"，
    <tspan x="50" dy="25">它们之间的阻力就是摩擦(friction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The friction between the two surfaces caused the object to slow down.
  </text>
  <text x="50" y="310" class="content">
    两个表面之间的摩擦使物体减速。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Two wooden boards -->
    <rect x="50" y="50" width="200" height="50" class="image" />
    <rect x="100" y="120" width="200" height="50" class="image" />
    <!-- Friction lines -->
    <line x1="70" y1="70" x2="270" y2="70" class="image" />
    <line x1="70" y1="100" x2="270" y2="100" class="image" />
    <line x1="120" y1="140" x2="320" y2="140" class="image" />
    <line x1="120" y1="170" x2="320" y2="170" class="image" />
    <!-- Arrows indicating friction -->
    <line x1="150" y1="60" x2="150" y2="110" class="image" />
    <line x1="155" y1="60" x2="155" y2="110" class="image" />
    <line x1="160" y1="60" x2="160" y2="110" class="image" />
    <line x1="165" y1="60" x2="165" y2="110" class="image" />
    <line x1="170" y1="60" x2="170" y2="110" class="image" />
  </g>
</svg>