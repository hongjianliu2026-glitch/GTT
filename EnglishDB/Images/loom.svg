<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loom</text>
  <text x="50" y="120" class="subtitle">[luːm] n. 织布机；v. 隐约出现</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> l- (线) + oom (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的织布机(loom)，"线(l-)"
    <tspan x="50" dy="25">在工具(oom)上穿梭，织出布料。</tspan>
    <tspan x="50" dy="25">突然，一个巨大的影子(loom)隐约出现，</tspan>
    <tspan x="50" dy="25">仿佛要吞噬整个织布机。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The dark figure loomed over the city.
  </text>
  <text x="50" y="330" class="content">
    那个黑影笼罩在城市上空。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Loom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="350" y1="20" x2="350" y2="180" class="image" />
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="180" x2="350" y2="180" class="image" />

    <!-- Shadow -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="rgba(0,0,0,0.3)" />
  </g>
</svg>