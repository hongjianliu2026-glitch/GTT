<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incoming</text>
  <text x="50" y="120" class="subtitle">[ˈɪnkʌmɪŋ] adj. 进来的，即将到来的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + come (来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头从远处"进入(in-come)"你的视野，
    <tspan x="50" dy="25">这个箭头代表着即将到来的事物(incoming)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The incoming train will arrive in five minutes.
  </text>
  <text x="50" y="310" class="content">
    即将到来的火车将在五分钟后到达。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow -->
    <line x1="0" y1="100" x2="300" y2="100" class="image" />
    <polygon points="300,100 280,90 280,110" class="image" />
    <!-- Horizon -->
    <line x1="0" y1="200" x2="400" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="50" cy="150" r="30" class="image" />
  </g>
</svg>