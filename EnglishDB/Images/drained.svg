<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drained</text>
  <text x="50" y="120" class="subtitle">[dreɪnd] adj. 耗尽的，排水的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drain (排水) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个水池，水被"排空(drain)"后，池底露出，
    <tspan x="50" dy="25">整个池子变得"耗尽(drained)"，没有一滴水。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the marathon, she felt completely drained.
  </text>
  <text x="50" y="310" class="content">
    马拉松结束后，她感到完全耗尽了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pool -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Drained water -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Drained pool bottom -->
    <rect x="50" y="160" width="250" height="20" class="image" />
  </g>
</svg>