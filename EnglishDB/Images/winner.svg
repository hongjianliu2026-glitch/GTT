<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">winner</text>
  <text x="50" y="120" class="subtitle">[ˈwɪnər] n. 获胜者，赢家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> win (赢) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在终点线前，"赢得(win)"
    <tspan x="50" dy="25">比赛，成为胜利者(winner)，举起奖杯庆祝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was the winner of the marathon race.
  </text>
  <text x="50" y="310" class="content">
    他是马拉松比赛的获胜者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Finish line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="10" x2="350" y2="10" class="image" />
    <!-- Runner -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Trophy -->
    <polygon points="250,50 270,100 230,100" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="240" y1="150" x2="260" y2="150" class="image" />
  </g>
</svg>