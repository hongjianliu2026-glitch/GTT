<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">schizophrenia</text>
  <text x="50" y="120" class="subtitle">[ˌskɪtsəˈfriːniə] n. 精神分裂症</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> schizo- (分裂) + phren (心灵) + -ia (病症)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人的心灵被"分裂(schizo-)"成多个部分，
    <tspan x="50" dy="25">每个部分都有自己的想法和感受，这就是精神分裂症(schizophrenia)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was diagnosed with schizophrenia last year.
  </text>
  <text x="50" y="310" class="content">
    他去年被诊断出患有精神分裂症。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Split mind -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="0" class="image" />
    <!-- Multiple faces -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <circle cx="175" cy="175" r="30" class="image" />
    <!-- Emotions -->
    <line x1="80" y1="80" x2="120" y2="80" class="image" />
    <line x1="90" y1="70" x2="110" y2="70" class="image" />
    <line x1="230" y1="80" x2="270" y2="80" class="image" />
    <line x1="240" y1="70" x2="260" y2="70" class="image" />
    <line x1="155" y1="155" x2="195" y2="155" class="image" />
    <line x1="165" y1="145" x2="185" y2="145" class="image" />
  </g>
</svg>