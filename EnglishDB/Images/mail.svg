<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mail</text>
  <text x="50" y="120" class="subtitle">[meɪl] n. 邮件，邮政；v. 邮寄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "macula" (斑点)，
    <tspan x="50" dy="25">象征着邮戳的印记。</tspan>
  </text>

  <!-- Story -->
  <text x="50" y="230" class="story">
    想象一个邮递员骑着自行车，"邮戳(macula)"
    <tspan x="50" dy="25">在信封上留下痕迹，这些信件就变成了邮件(mail)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> I received a lot of mail today.
  </text>
  <text x="50" y="330" class="content">
    我今天收到了很多邮件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mailbox -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Letter -->
    <rect x="60" y="60" width="30" height="40" class="image" />
    <!-- Stamp -->
    <circle cx="75" cy="80" r="10" class="image" />
    <!-- Postman -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Bicycle -->
    <rect x="250" y="100" width="50" height="20" class="image" />
    <rect x="260" y="120" width="30" height="10" class="image" />
    <circle cx="265" cy="130" r="10" class="image" />
    <circle cx="295" cy="130" r="10" class="image" />
  </g>
</svg>