<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">refinance</text>
  <text x="50" y="120" class="subtitle">[ˌriːfaɪˈnæns] v. 再融资，重新筹措资金</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + finance (金融)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个金融家在银行里，"再次筹措(re-finance)"
    <tspan x="50" dy="25">资金，以优化贷款条件，这就是再融资(refinance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to refinance their mortgage to get a lower interest rate.
  </text>
  <text x="50" y="310" class="content">
    他们决定重新贷款以获得更低的利率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bank building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Banker -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Money bag -->
    <rect x="100" y="80" width="50" height="50" class="image" />
    <line x1="125" y1="80" x2="125" y2="30" class="image" />
    <!-- Money -->
    <line x1="110" y1="90" x2="140" y2="90" class="image" />
    <line x1="110" y1="110" x2="140" y2="110" class="image" />
    <line x1="110" y1="130" x2="140" y2="130" class="image" />
  </g>
</svg>