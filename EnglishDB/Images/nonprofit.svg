<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nonprofit</text>
  <text x="50" y="120" class="subtitle">[ˈnɒnˈprɒfɪt] adj. 非营利的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> non- (不) + profit (利润)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个组织，它不追求利润(non-profit)，
    <tspan x="50" dy="25">而是专注于服务社会，这就是非营利组织(nonprofit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nonprofit organization focuses on environmental protection.
  </text>
  <text x="50" y="310" class="content">
    这个非营利组织专注于环境保护。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Heart symbol -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="125" y1="100" x2="225" y2="100" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <!-- Dollar sign crossed out -->
    <line x1="50" y1="50" x2="300" y2="150" class="image" />
    <line x1="50" y1="150" x2="300" y2="50" class="image" />
    <text x="100" y="120" class="image" font-size="50">$</text>
  </g>
</svg>