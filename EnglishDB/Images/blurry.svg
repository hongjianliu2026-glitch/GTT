<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .blur { filter: url(#blur); }
    </style>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blurry</text>
  <text x="50" y="120" class="subtitle">[ˈblɜːri] adj. 模糊的，不清楚的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blur (模糊) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摄影师在拍摄时，镜头上突然出现了雾气，
    <tspan x="50" dy="25">导致照片变得"模糊(blurry)"不清。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The photo came out blurry because the lens was dirty.
  </text>
  <text x="50" y="310" class="content">
    照片因为镜头脏了而变得模糊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Blurry effect -->
    <rect x="70" y="40" width="210" height="120" class="blur" />
    <!-- Lens -->
    <circle cx="175" cy="100" r="30" class="image" />
  </g>
</svg>