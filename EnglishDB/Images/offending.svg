<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">offending</text>
  <text x="50" y="120" class="subtitle">[əˈfendɪŋ] adj. 冒犯的，令人不快的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> off- (离开) + end (边界) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在边界上"离开(off-)"，
    <tspan x="50" dy="25">不小心越过了界限，触犯了他人，</tspan>
    <tspan x="50" dy="25">这种行为就是"冒犯的(offending)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His offending remarks made everyone uncomfortable.
  </text>
  <text x="50" y="310" class="content">
    他冒犯的言论让每个人都感到不舒服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boundary line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person crossing the boundary -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />
    <!-- Offending arrow -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <polygon points="150,50 140,40 140,60" class="image" />
  </g>
</svg>