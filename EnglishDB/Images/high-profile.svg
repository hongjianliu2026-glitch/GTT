<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">high-profile</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪˈproʊfaɪl] adj. 高调的，引人注目的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + profile (轮廓)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个明星站在高台上，"高高在上(high)"，
    <tspan x="50" dy="25">他的轮廓(profile)在聚光灯下格外引人注目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's new product launch was a high-profile event.
  </text>
  <text x="50" y="310" class="content">
    公司的新产品发布会是一个高调的活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Spotlight -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Star -->
    <circle cx="175" cy="100" r="15" class="image" fill="#FFD700" />
    <!-- Star's outline -->
    <line x1="175" y1="85" x2="175" y2="115" class="image" />
    <line x1="165" y1="95" x2="185" y2="105" class="image" />
    <line x1="165" y1="105" x2="185" y2="95" class="image" />
  </g>
</svg>