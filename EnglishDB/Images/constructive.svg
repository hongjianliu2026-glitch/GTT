<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">constructive</text>
  <text x="50" y="120" class="subtitle">[kənˈstrʌktɪv] adj. 建设性的，积极的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + struct (建造)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群工人"一起建造(con-struct)"
    <tspan x="50" dy="25">一座高楼，他们的工作是建设性的(constructive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His constructive criticism helped us improve the project.
  </text>
  <text x="50" y="310" class="content">
    他的建设性批评帮助我们改进了项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Construction site -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Building -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="160" y="40" width="100" height="140" class="image" />
    <rect x="270" y="60" width="100" height="120" class="image" />
    <!-- Workers -->
    <circle cx="70" cy="180" r="15" class="image" />
    <line x1="70" y1="195" x2="70" y2="230" class="image" />
    <line x1="70" y1="230" x2="50" y2="260" class="image" />
    <line x1="70" y1="230" x2="90" y2="260" class="image" />
    <line x1="70" y1="210" x2="100" y2="200" class="image" />
    <circle cx="180" cy="200" r="15" class="image" />
    <line x1="180" y1="215" x2="180" y2="250" class="image" />
    <line x1="180" y1="250" x2="160" y2="280" class="image" />
    <line x1="180" y1="250" x2="200" y2="280" class="image" />
    <line x1="180" y1="230" x2="210" y2="220" class="image" />
    <circle cx="290" cy="220" r="15" class="image" />
    <line x1="290" y1="235" x2="290" y2="270" class="image" />
    <line x1="290" y1="270" x2="270" y2="300" class="image" />
    <line x1="290" y1="270" x2="310" y2="300" class="image" />
    <line x1="290" y1="250" x2="320" y2="240" class="image" />
  </g>
</svg>