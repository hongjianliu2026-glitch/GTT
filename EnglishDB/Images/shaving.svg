<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shaving</text>
  <text x="50" y="120" class="subtitle">[ˈʃeɪvɪŋ] n. 剃须，刮胡子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shave (剃) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个男士在镜子前，"剃(shave)"
    <tspan x="50" dy="25">他的胡子，剃下的毛发就是剃须(shaving)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He carefully collected his shavings after the shave.
  </text>
  <text x="50" y="310" class="content">
    他剃须后仔细收集了剃下的毛发。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Face -->
    <circle cx="175" cy="100" r="60" class="image" />
    <!-- Razor -->
    <line x1="100" y1="120" x2="250" y2="120" class="image" />
    <line x1="100" y1="120" x2="100" y2="140" class="image" />
    <line x1="250" y1="120" x2="250" y2="140" class="image" />
    <!-- Shaving foam -->
    <ellipse cx="175" cy="80" rx="50" ry="20" class="image" />
    <!-- Shaving hair -->
    <line x1="150" y1="120" x2="150" y2="140" class="image" />
    <line x1="160" y1="120" x2="160" y2="140" class="image" />
    <line x1="170" y1="120" x2="170" y2="140" class="image" />
    <line x1="180" y1="120" x2="180" y2="140" class="image" />
    <line x1="190" y1="120" x2="190" y2="140" class="image" />
  </g>
</svg>