<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gel</text>
  <text x="50" y="120" class="subtitle">[dʒel] n. 凝胶，胶状物；v. 形成胶状</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gel- (凝固)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯水突然"凝固(gel)"成了一块透明的果冻，
    <tspan x="50" dy="25">这就是凝胶(gel)的神奇变化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hair gel made his hair stay in place.
  </text>
  <text x="50" y="310" class="content">
    发胶让他的头发保持不动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass of water -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="50" x2="130" y2="50" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <line x1="20" y1="110" x2="130" y2="110" class="image" />
    <line x1="20" y1="140" x2="130" y2="140" class="image" />
    <line x1="20" y1="170" x2="130" y2="170" class="image" />
    <!-- Gel -->
    <rect x="20" y="180" width="110" height="20" class="image" />
    <line x1="25" y1="190" x2="125" y2="190" class="image" />
    <line x1="25" y1="200" x2="125" y2="200" class="image" />
  </g>
</svg>