<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">din</text>
  <text x="50" y="120" class="subtitle">[dɪn] n. 喧闹声，嘈杂声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> din (喧闹声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个市场里，各种声音"喧闹(din)"在一起，
    <tspan x="50" dy="25">形成了一片嘈杂的海洋，这就是din的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The din of the crowd was deafening.
  </text>
  <text x="50" y="310" class="content">
    人群的喧闹声震耳欲聋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="70" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="70" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Sound waves -->
    <path d="M50 100 Q75 80, 100 100 T150 100" class="image" />
    <path d="M100 120 Q125 100, 150 120 T200 120" class="image" />
    <path d="M150 140 Q175 120, 200 140 T250 140" class="image" />
  </g>
</svg>