<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polo</text>
  <text x="50" y="120" class="subtitle">[ˈpoʊloʊ] n. 马球，马球运动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自藏语 "pulu"，意为“球”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群骑士在草原上骑马，挥舞着球杆，追逐着一个巨大的球，
    <tspan x="50" dy="25">这个球就是“pulu”，象征着马球运动(polo)的激情与速度。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He plays polo every weekend at the club.
  </text>
  <text x="50" y="310" class="content">
    他每个周末都在俱乐部打马球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Polo player -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Polo stick -->
    <line x1="100" y1="115" x2="150" y2="70" class="image" />
    <!-- Polo ball -->
    <circle cx="150" cy="70" r="10" class="image" />
  </g>
</svg>