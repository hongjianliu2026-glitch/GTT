<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">segregate</text>
  <text x="50" y="120" class="subtitle">[ˈseɡrɪɡeɪt] v. 隔离，分开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + greg (群) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群羊被"分开(se-greg)"成两组，
    <tspan x="50" dy="25">一组在左边，一组在右边，这就是隔离(segregate)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher segregated the students into two groups.
  </text>
  <text x="50" y="310" class="content">
    老师把学生分成了两组。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Left group of sheep -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Right group of sheep -->
    <circle cx="300" cy="100" r="20" class="image" />
    <circle cx="350" cy="100" r="20" class="image" />
    <circle cx="400" cy="100" r="20" class="image" />
    <!-- Fence separating the groups -->
    <line x1="220" y1="80" x2="220" y2="120" class="image" />
    <line x1="230" y1="80" x2="230" y2="120" class="image" />
    <line x1="240" y1="80" x2="240" y2="120" class="image" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
  </g>
</svg>