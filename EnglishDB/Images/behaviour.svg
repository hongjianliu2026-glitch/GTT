<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">behaviour</text>
  <text x="50" y="120" class="subtitle">[bɪˈheɪvjər] n. 行为，举止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + hav (拥有) + -iour (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公共场合，"使自己拥有(be-hav)"
    <tspan x="50" dy="25">良好的行为举止，这就是他的行为(behaviour)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His behaviour at the party was impeccable.
  </text>
  <text x="50" y="310" class="content">
    他在派对上的行为无可挑剔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="130" class="image" />
    <line x1="50" y1="150" x2="0" y2="130" class="image" />

    <!-- Good behaviour -->
    <line x1="50" y1="250" x2="50" y2="300" class="image" />
    <line x1="50" y1="275" x2="25" y2="275" class="image" />
    <line x1="50" y1="275" x2="75" y2="275" class="image" />
    <line x1="50" y1="300" x2="25" y2="325" class="image" />
    <line x1="50" y1="300" x2="75" y2="325" class="image" />
  </g>
</svg>