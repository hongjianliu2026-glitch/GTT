<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meek</text>
  <text x="50" y="120" class="subtitle">[miːk] adj. 温顺的，谦和的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meek (源自中古英语 mek, 意为温和的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小羊羔，它总是低着头，"温顺地(meek)"
    <tspan x="50" dy="25">跟在牧羊人身后，从不争抢食物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meek lamb followed the shepherd quietly.
  </text>
  <text x="50" y="310" class="content">
    温顺的小羊羔安静地跟在牧羊人身后。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sheep -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="120" x2="20" y2="100" class="image" />
    <line x1="50" y1="120" x2="80" y2="100" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Shepherd -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="90" x2="180" y2="80" class="image" />
    <line x1="200" y1="90" x2="220" y2="80" class="image" />
    <line x1="200" y1="120" x2="180" y2="140" class="image" />
    <line x1="200" y1="120" x2="220" y2="140" class="image" />
    <!-- Path -->
    <line x1="50" y1="180" x2="200" y2="180" class="image" />
  </g>
</svg>