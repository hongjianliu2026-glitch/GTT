<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">page</text>
  <text x="50" y="120" class="subtitle">[peɪdʒ] n. 页，页面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pag (固定) + e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本书被"固定(pag)"在桌子上，
    <tspan x="50" dy="25">每一页(page)都像是一个故事的片段，等待被翻阅。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please turn to page 45 for the next chapter.
  </text>
  <text x="50" y="310" class="content">
    请翻到第45页阅读下一章。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Book -->
    <rect x="0" y="0" width="300" height="400" class="image" />
    <!-- Pages -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <line x1="50" y1="200" x2="250" y2="200" class="image" />
    <line x1="50" y1="250" x2="250" y2="250" class="image" />
    <line x1="50" y1="300" x2="250" y2="300" class="image" />
    <line x1="50" y1="350" x2="250" y2="350" class="image" />
    <!-- Page number -->
    <text x="150" y="380" class="content">45</text>
  </g>
</svg>