<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rare</text>
  <text x="50" y="120" class="subtitle">[rer] adj. 稀有的，罕见的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rari- (稀少)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的草原上，只有几棵树，"稀少(rari-)"
    <tspan x="50" dy="25">的树木显得格外珍贵，这就是"稀有的(rare)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The panda is a rare animal in the wild.
  </text>
  <text x="50" y="310" class="content">
    熊猫在野外是一种稀有动物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grassland -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="100" x2="230" y2="120" class="image" />
    <line x1="250" y1="100" x2="270" y2="120" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
  </g>
</svg>