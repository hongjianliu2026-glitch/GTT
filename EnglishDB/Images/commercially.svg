<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commercially</text>
  <text x="50" y="120" class="subtitle">[kəˈmɜːrʃəli] adv. 商业上，以商业方式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + merc (贸易) + -ial (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的市场，人们"共同(com-)"进行"贸易(merc)"，
    <tspan x="50" dy="25">这种"商业(commercially)"的场景让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The product is sold commercially in many countries.
  </text>
  <text x="50" y="310" class="content">
    该产品在许多国家以商业方式销售。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Market stalls -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="20" width="50" height="100" class="image" />
    <rect x="190" y="20" width="50" height="100" class="image" />
    <rect x="260" y="20" width="50" height="100" class="image" />
    <!-- People -->
    <circle cx="70" cy="140" r="10" class="image" />
    <circle cx="140" cy="140" r="10" class="image" />
    <circle cx="210" cy="140" r="10" class="image" />
    <circle cx="280" cy="140" r="10" class="image" />
    <!-- Money -->
    <line x1="70" y1="160" x2="70" y2="180" class="image" />
    <line x1="140" y1="160" x2="140" y2="180" class="image" />
    <line x1="210" y1="160" x2="210" y2="180" class="image" />
    <line x1="280" y1="160" x2="280" y2="180" class="image" />
  </g>
</svg>