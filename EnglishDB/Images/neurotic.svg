<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neurotic</text>
  <text x="50" y="120" class="subtitle">[nʊəˈrɒtɪk] adj. 神经质的，神经过敏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neuro- (神经) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神经紧张的人，"神经(neuro-)"
    <tspan x="50" dy="25">像电线一样纠结在一起，表现出神经过敏(neurotic)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She became neurotic after the accident.
  </text>
  <text x="50" y="310" class="content">
    事故后她变得神经过敏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Nerves -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <line x1="100" y1="200" x2="0" y2="300" class="image" />
    <line x1="100" y1="200" x2="200" y2="300" class="image" />
    <!-- Person -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="200" class="image" />
    <line x1="300" y1="160" x2="250" y2="180" class="image" />
    <line x1="300" y1="160" x2="350" y2="180" class="image" />
    <line x1="300" y1="200" x2="250" y2="250" class="image" />
    <line x1="300" y1="200" x2="350" y2="250" class="image" />
    <!-- Nervous expression -->
    <circle cx="290" cy="80" r="5" class="image" />
    <circle cx="310" cy="80" r="5" class="image" />
    <line x1="280" y1="100" x2="320" y2="100" class="image" />
  </g>
</svg>