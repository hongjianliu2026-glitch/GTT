<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">effectiveness</text>
  <text x="50" y="120" class="subtitle">[ɪˈfektɪvnəs] n. 有效性，效力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ef- (出) + fect (做) + -ive (形容词后缀) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔法师挥动魔杖，"做出(fect)"
    <tspan x="50" dy="25">的效果立即显现，这种立即显现的效果就是有效性(effectiveness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The effectiveness of the new drug was remarkable.
  </text>
  <text x="50" y="310" class="content">
    这种新药的效力非常显著。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic wand -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="200" y2="100" class="image" />
    <!-- Starburst effect -->
    <line x1="200" y1="100" x2="150" y2="150" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <line x1="200" y1="100" x2="175" y2="125" class="image" />
    <line x1="200" y1="100" x2="225" y2="125" class="image" />
    <!-- Magician -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />
  </g>
</svg>