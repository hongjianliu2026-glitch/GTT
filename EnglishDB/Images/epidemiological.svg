<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">epidemiological</text>
  <text x="50" y="120" class="subtitle">[ˌɛpɪˌdimiˈɑlədʒɪkəl] adj. 流行病学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> epi- (在...之间) + demos (人民) + logy (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人中间(epi-)，一个科学家正在研究(logy)
    <tspan x="50" dy="25">人民的(demos)健康问题，这就是流行病学(epidemiological)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The epidemiological study revealed a high incidence of the disease.
  </text>
  <text x="50" y="310" class="content">
    流行病学研究揭示了该疾病的高发病率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Scientist -->
    <circle cx="125" cy="50" r="20" class="image" />
    <line x1="125" y1="70" x2="125" y2="100" class="image" />
    <line x1="125" y1="70" x2="105" y2="90" class="image" />
    <line x1="125" y1="70" x2="145" y2="90" class="image" />
    <line x1="125" y1="100" x2="105" y2="120" class="image" />
    <line x1="125" y1="100" x2="145" y2="120" class="image" />
    <!-- Research -->
    <rect x="75" y="130" width="100" height="50" class="image" />
    <line x1="80" y1="140" x2="170" y2="140" class="image" />
    <line x1="80" y1="160" x2="170" y2="160" class="image" />
    <line x1="80" y1="180" x2="170" y2="180" class="image" />
  </g>
</svg>