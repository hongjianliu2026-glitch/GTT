<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .glass { fill: #F1C40F; }
      .lime { fill: #2ECC71; }
      .salt { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">margarita</text>
  <text x="50" y="120" class="subtitle">[ˌmɑːrɡəˈriːtə] n. 玛格丽塔鸡尾酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> margarita (源自西班牙语，意为“珍珠”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯玛格丽塔鸡尾酒，杯口沾满了盐，
    <tspan x="50" dy="25">就像珍珠(margarita)一样闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ordered a margarita at the bar.
  </text>
  <text x="50" y="310" class="content">
    她在酒吧点了一杯玛格丽塔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass -->
    <path d="M 0 0 L 100 0 Q 150 50 100 100 L 0 100 Z" class="glass" />
    <!-- Lime slice -->
    <circle cx="120" cy="50" r="20" class="lime" />
    <!-- Salt rim -->
    <path d="M 0 0 L 100 0 Q 150 10 100 20 L 0 20 Z" class="salt" />
  </g>
</svg>