<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cunning</text>
  <text x="50" y="120" class="subtitle">[ˈkʌnɪŋ] adj. 狡猾的，巧妙的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cun (知道) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狐狸，它"知道(cun)"
    <tspan x="50" dy="25">如何巧妙地避开陷阱，这就是狡猾(cunning)的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cunning fox outsmarted the hunters.
  </text>
  <text x="50" y="310" class="content">
    那只狡猾的狐狸智胜了猎人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fox -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Tail -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Tail -->
    <line x1="30" y1="140" x2="10" y2="140" class="image" /> <!-- Front leg -->
    <line x1="70" y1="140" x2="90" y2="140" class="image" /> <!-- Front leg -->
    <line x1="30" y1="160" x2="10" y2="160" class="image" /> <!-- Back leg -->
    <line x1="70" y1="160" x2="90" y2="160" class="image" /> <!-- Back leg -->
    <!-- Trap -->
    <rect x="150" y="100" width="100" height="50" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <!-- Fox avoiding trap -->
    <line x1="50" y1="180" x2="140" y2="180" class="image" />
    <line x1="140" y1="180" x2="140" y2="130" class="image" />
    <line x1="140" y1="130" x2="100" y2="130" class="image" />
  </g>
</svg>