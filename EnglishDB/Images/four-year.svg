<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">four-year</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːr jɪr] adj. 四年的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> four (四) + year (年)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在学校里度过了"四年(four-year)"，
    <tspan x="50" dy="25">经历了四个春夏秋冬，完成了四年的学业。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He graduated from a four-year university.
  </text>
  <text x="50" y="310" class="content">
    他毕业于一所四年制大学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Four circles representing four years -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="150" cy="50" r="30" class="image" />
    <circle cx="250" cy="50" r="30" class="image" />
    <circle cx="350" cy="50" r="30" class="image" />
    <!-- Student -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="170" y2="180" class="image" />
    <line x1="200" y1="190" x2="230" y2="180" class="image" />
  </g>
</svg>