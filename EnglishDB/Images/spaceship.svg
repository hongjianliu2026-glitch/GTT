<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spaceship</text>
  <text x="50" y="120" class="subtitle">[ˈspeɪsʃɪp] n. 宇宙飞船</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> space (空间) + ship (船)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘巨大的"船(ship)"在"空间(space)"中航行，
    <tspan x="50" dy="25">穿越星际，探索未知的宇宙。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The astronauts boarded the spaceship for their mission to Mars.
  </text>
  <text x="50" y="310" class="content">
    宇航员们登上了宇宙飞船，准备前往火星的任务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spaceship -->
    <polygon points="100,10 150,100 50,100" class="image" />
    <line x1="100" y1="10" x2="100" y2="100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="150" cy="50" r="5" class="image" />
    <circle cx="200" cy="100" r="5" class="image" />
    <circle cx="250" cy="150" r="5" class="image" />
  </g>
</svg>