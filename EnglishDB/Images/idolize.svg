<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">idolize</text>
  <text x="50" y="120" class="subtitle">[ˈaɪdəlaɪz] v. 偶像化，崇拜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> idol (偶像) + -ize (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狂热的粉丝，"使成为(idol-ize)"
    <tspan x="50" dy="25">心中的偶像，眼中只有他/她，无比崇拜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She idolizes her favorite singer.
  </text>
  <text x="50" y="310" class="content">
    她崇拜她最喜欢的歌手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Idol -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Fan -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="100" y2="150" class="image" />
    <line x1="250" y1="120" x2="100" y2="50" class="image" />
    <!-- Heart -->
    <path d="M200,150 C180,180 220,180 200,150 Z" class="image" />
    <path d="M200,150 C220,120 180,120 200,150 Z" class="image" />
  </g>
</svg>