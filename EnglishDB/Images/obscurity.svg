<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obscurity</text>
  <text x="50" y="120" class="subtitle">[əbˈskjʊrɪti] n. 晦涩，模糊，无名</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (在前面) + scure (隐藏)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个作家在黑暗的房间里，"隐藏(scure)"
    <tspan x="50" dy="25">自己的作品，这些作品变得晦涩难懂(obscurity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The poem's obscurity made it difficult to understand.
  </text>
  <text x="50" y="310" class="content">
    这首诗的晦涩使得它难以理解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Writer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Hidden book -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <line x1="120" y1="70" x2="230" y2="70" class="image" />
    <line x1="120" y1="90" x2="230" y2="90" class="image" />
    <line x1="120" y1="110" x2="230" y2="110" class="image" />
    <!-- Darkness -->
    <rect x="0" y="0" width="350" height="200" fill="#000000" opacity="0.5" />
  </g>
</svg>