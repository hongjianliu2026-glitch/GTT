<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bombardment</text>
  <text x="50" y="120" class="subtitle">[bɒmˈbɑːdmənt] n. 轰炸，炮击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bomb (炸弹) + ard (动作) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市被无数炸弹"轰炸(bomb-ard-ment)"，
    <tspan x="50" dy="25">天空布满了爆炸的火光和烟雾，这就是轰炸(bombardment)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city suffered a heavy bombardment during the war.
  </text>
  <text x="50" y="310" class="content">
    这座城市在战争期间遭受了猛烈的轰炸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Explosion -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="150" r="40" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <!-- Smoke -->
    <ellipse cx="100" cy="50" rx="30" ry="10" class="image" />
    <ellipse cx="150" cy="70" rx="25" ry="8" class="image" />
    <ellipse cx="200" cy="50" rx="20" ry="6" class="image" />
    <ellipse cx="250" cy="70" rx="15" ry="4" class="image" />
    <!-- City skyline -->
    <rect x="50" y="180" width="300" height="50" class="image" />
    <rect x="70" y="160" width="40" height="70" class="image" />
    <rect x="130" y="150" width="40" height="80" class="image" />
    <rect x="190" y="170" width="40" height="60" class="image" />
    <rect x="250" y="160" width="40" height="70" class="image" />
  </g>
</svg>