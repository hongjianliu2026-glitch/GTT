<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lunatic</text>
  <text x="50" y="120" class="subtitle">[ˈluːnətɪk] n. 疯子，精神错乱者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> luna (月亮) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疯子(lunatic)在月光下跳舞，因为古人认为
    <tspan x="50" dy="25">月亮(luna)会影响人的精神状态，所以"月亮引起的(lunatic)"</tspan>
    <tspan x="50" dy="25">人就是疯子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The full moon makes him act like a lunatic.
  </text>
  <text x="50" y="310" class="content">
    满月时他表现得像个疯子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Crazy person -->
    <circle cx="200" cy="100" r="20" class="image" fill="#E74C3C" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="180" y2="130" class="image" />
    <line x1="200" y1="150" x2="220" y2="130" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <!-- Dancing motion -->
    <line x1="200" y1="120" x2="150" y2="100" class="image" />
    <line x1="200" y1="120" x2="250" y2="100" class="image" />
  </g>
</svg>