<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">four-day</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːr deɪ] adj. 四天的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> four (四) + day (天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个日历上，"四天(four-day)"
    <tspan x="50" dy="25">被高亮显示，表示一个为期四天的假期。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They planned a four-day trip to the beach.
  </text>
  <text x="50" y="310" class="content">
    他们计划了一个为期四天的海滩旅行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Days -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Highlighted days -->
    <rect x="50" y="20" width="50" height="50" fill="#E74C3C" opacity="0.5" />
    <rect x="120" y="20" width="50" height="50" fill="#E74C3C" opacity="0.5" />
    <rect x="190" y="20" width="50" height="50" fill="#E74C3C" opacity="0.5" />
    <rect x="260" y="20" width="50" height="50" fill="#E74C3C" opacity="0.5" />
    <!-- Text -->
    <text x="60" y="55" class="content" fill="#FFFFFF">1</text>
    <text x="130" y="55" class="content" fill="#FFFFFF">2</text>
    <text x="200" y="55" class="content" fill="#FFFFFF">3</text>
    <text x="270" y="55" class="content" fill="#FFFFFF">4</text>
  </g>
</svg>