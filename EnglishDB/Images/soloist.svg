<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soloist</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊloʊɪst] n. 独奏者，独唱者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> solo (单独) + -ist (从事...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在舞台上，"独自一人(solo)"
    <tspan x="50" dy="25">演奏乐器，他就是独奏者(soloist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soloist played a beautiful violin piece.
  </text>
  <text x="50" y="310" class="content">
    独奏者演奏了一首美妙的提琴曲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Musician -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Violin -->
    <rect x="160" y="120" width="30" height="60" class="image" />
    <line x1="175" y1="120" x2="175" y2="60" class="image" />
    <line x1="175" y1="60" x2="160" y2="70" class="image" />
    <line x1="175" y1="60" x2="190" y2="70" class="image" />
  </g>
</svg>