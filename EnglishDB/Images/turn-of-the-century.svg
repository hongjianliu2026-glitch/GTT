<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turn-of-the-century</text>
  <text x="50" y="120" class="subtitle">[tɜːrn əv ðə ˈsɛntʃəri] n. 世纪之交</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turn (转变) + of (的) + the (这) + century (世纪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，指针在"转变(turn)"
    <tspan x="50" dy="25">到"这(the)"新"世纪(century)"的瞬间，</tspan>
    <tspan x="50" dy="25">烟花四起，庆祝世纪之交(turn-of-the-century)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The turn-of-the-century architecture is unique.
  </text>
  <text x="50" y="310" class="content">
    世纪之交的建筑风格非常独特。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Fireworks -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
  </g>
</svg>