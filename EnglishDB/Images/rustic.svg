<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rustic</text>
  <text x="50" y="120" class="subtitle">[ˈrʌstɪk] adj. 乡村的，质朴的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rus (乡村) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"乡村(rus)"的场景，那里有质朴的(rustic)
    <tspan x="50" dy="25">小木屋和田野，一切都显得那么自然和简单。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rustic charm of the countryside attracted many tourists.
  </text>
  <text x="50" y="310" class="content">
    乡村的质朴魅力吸引了许多游客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wooden cabin -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <line x1="40" y1="40" x2="160" y2="40" class="image" />
    <line x1="40" y1="70" x2="140" y2="70" class="image" />
    <line x1="40" y1="100" x2="160" y2="100" class="image" />
    <!-- Field -->
    <rect x="220" y="0" width="150" height="150" class="image" />
    <line x1="230" y1="10" x2="360" y2="10" class="image" />
    <line x1="230" y1="40" x2="340" y2="40" class="image" />
    <line x1="230" y1="70" x2="360" y2="70" class="image" />
    <line x1="230" y1="100" x2="340" y2="100" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="200" r="30" class="image" />
  </g>
</svg>