<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">behavior</text>
  <text x="50" y="120" class="subtitle">[bɪˈheɪvjər] n. 行为，举止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + hav (拥有) + -ior (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在镜子前，"使自己拥有(be-hav)"
    <tspan x="50" dy="25">良好的行为(behavior)，就像在表演一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His behavior at the party was quite inappropriate.
  </text>
  <text x="50" y="310" class="content">
    他在派对上的行为非常不合适。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="130" y2="140" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Reflection -->
    <circle cx="175" cy="250" r="30" class="image" />
    <line x1="175" y1="280" x2="175" y2="330" class="image" />
    <line x1="175" y1="330" x2="150" y2="370" class="image" />
    <line x1="175" y1="330" x2="200" y2="370" class="image" />
    <line x1="175" y1="300" x2="130" y2="290" class="image" />
    <line x1="175" y1="300" x2="220" y2="290" class="image" />
  </g>
</svg>