<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hushed</text>
  <text x="50" y="120" class="subtitle">[hʌʃt] adj. 安静的，轻声的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hush (安静) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个图书馆里，所有人都"安静(hush)"下来，
    <tspan x="50" dy="25">整个空间变得"安静的(hushed)"，只有翻书的声音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room fell into a hushed silence as the speaker began.
  </text>
  <text x="50" y="310" class="content">
    演讲者开始时，房间陷入了安静的沉默。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Library -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bookshelves -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Books -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Person reading -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Silence symbol -->
    <circle cx="180" cy="100" r="10" class="image" />
    <line x1="175" y1="95" x2="185" y2="105" class="image" />
    <line x1="175" y1="105" x2="185" y2="95" class="image" />
  </g>
</svg>