<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oppress</text>
  <text x="50" y="120" class="subtitle">[əˈpres] v. 压迫，压制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> op- (加强) + press (压)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头"加强压在(op-press)"
    <tspan x="50" dy="25">一个小人身上，小人被压迫得无法动弹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The people were oppressed by the dictator.
  </text>
  <text x="50" y="310" class="content">
    人民被独裁者压迫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large stone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Small person -->
    <circle cx="175" cy="150" r="15" class="image" />
    <line x1="175" y1="165" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="180" x2="205" y2="170" class="image" />
    <!-- Pressure effect -->
    <line x1="175" y1="150" x2="175" y2="100" class="image" />
    <line x1="165" y1="150" x2="165" y2="100" class="image" />
    <line x1="185" y1="150" x2="185" y2="100" class="image" />
  </g>
</svg>