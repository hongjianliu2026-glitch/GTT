<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inflame</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfleɪm] v. 使燃烧，激怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flamm (火焰)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一团火焰"进入(in-)"你的心中，
    <tspan x="50" dy="25">瞬间点燃了你的怒火，使你"燃烧(flame)"起来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His words inflamed her anger.
  </text>
  <text x="50" y="310" class="content">
    他的话激怒了她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flame -->
    <polygon points="50,50 70,20 90,50 70,80" class="flame" />
    <polygon points="70,50 90,20 110,50 90,80" class="flame" />
    <polygon points="90,50 110,20 130,50 110,80" class="flame" />
    <!-- Heart -->
    <path d="M100,150 C100,50 200,50 200,150 S300,250 200,350 S100,250 100,150" class="image" />
    <!-- Flame entering heart -->
    <line x1="70" y1="50" x2="150" y2="150" class="image" />
    <line x1="90" y1="50" x2="170" y2="150" class="image" />
    <line x1="110" y1="50" x2="190" y2="150" class="image" />
  </g>
</svg>