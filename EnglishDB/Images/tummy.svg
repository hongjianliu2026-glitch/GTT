<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tummy</text>
  <text x="50" y="120" class="subtitle">[ˈtʌmi] n. 肚子，腹部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "tummy"，与 "tum" (肿胀) 相关
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小宝宝吃饱后，肚子("tummy")鼓鼓的，像个小气球一样，
    <tspan x="50" dy="25">让人忍不住想摸一摸。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby has a full tummy after eating.
  </text>
  <text x="50" y="310" class="content">
    宝宝吃饱后肚子鼓鼓的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baby -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Tummy -->
    <ellipse cx="100" cy="120" rx="40" ry="20" class="image" />
    <!-- Arms -->
    <line x1="60" y1="100" x2="20" y2="80" class="image" />
    <line x1="140" y1="100" x2="180" y2="80" class="image" />
    <!-- Legs -->
    <line x1="80" y1="150" x2="60" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <!-- Face -->
    <circle cx="80" cy="80" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <path d="M85 100 Q100 110 115 100" class="image" />
  </g>
</svg>