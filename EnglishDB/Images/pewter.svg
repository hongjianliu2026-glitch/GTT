<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pewter</text>
  <text x="50" y="120" class="subtitle">[ˈpjuːtər] n. 锡铅合金，白蜡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pewter (源自中古英语 peuter, 可能来自古法语 peautre, 意为“锡”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的酒馆，墙上挂着一排排用“白蜡(pewter)”制成的酒杯，
    <tspan x="50" dy="25">每个杯子都闪烁着银灰色的光芒，仿佛在诉说着古老的故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tavern served ale in pewter mugs.
  </text>
  <text x="50" y="310" class="content">
    酒馆用白蜡杯盛装麦芽酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pewter mug -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <circle cx="75" cy="120" r="30" class="image" />
    <line x1="75" y1="120" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="50" y2="230" class="image" />
    <line x1="75" y1="200" x2="100" y2="230" class="image" />
    <!-- Handle -->
    <path d="M 100 120 Q 150 100 150 150" class="image" />
    <path d="M 150 150 Q 150 200 100 200" class="image" />
  </g>
</svg>