<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">starboard</text>
  <text x="50" y="120" class="subtitle">[ˈstɑːrˌbɔːrd] n. 右舷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> star (星) + board (板)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船的右舷(starboard)上，有一颗闪亮的星星(star)，
    <tspan x="50" dy="25">指引着船只前进的方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The captain ordered the crew to steer to starboard.
  </text>
  <text x="50" y="310" class="content">
    船长命令船员向右舷转向。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Right side of the ship -->
    <rect x="150" y="20" width="150" height="160" class="image" />
    <!-- Star -->
    <circle cx="225" cy="100" r="15" class="image" fill="#FFD700" />
    <!-- Arrow pointing to the right -->
    <line x1="225" y1="120" x2="275" y2="120" class="image" />
    <polygon points="275,115 285,120 275,125" class="image" fill="#7F8C8D" />
  </g>
</svg>