<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misunderstanding</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsˌʌndərˈstændɪŋ] n. 误解，误会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + understand (理解) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在对话，一个人"错误地理解(mis-understand)"
    <tspan x="50" dy="25">了对方的意思，结果产生了误会(misunderstanding)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The misunderstanding between them led to a big argument.
  </text>
  <text x="50" y="310" class="content">
    他们之间的误解导致了激烈的争吵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Speech bubbles -->
    <path d="M 50 80 Q 30 70 20 50 Q 30 30 50 20 Q 70 30 80 50 Q 70 70 50 80" class="image" />
    <path d="M 200 80 Q 180 70 170 50 Q 180 30 200 20 Q 220 30 230 50 Q 220 70 200 80" class="image" />
    <!-- Crossed out arrow -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" transform="rotate(45, 125, 100)" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" transform="rotate(-45, 125, 100)" />
  </g>
</svg>