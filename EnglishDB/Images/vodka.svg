<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bottle { fill: #E6E6E6; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vodka</text>
  <text x="50" y="120" class="subtitle">[ˈvɒdkə] n. 伏特加酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自俄语 "водка" (voda)，意为“水”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个俄罗斯人拿着一瓶伏特加，"水(voda)"
    <tspan x="50" dy="25">变成了烈酒，这就是伏特加(vodka)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He ordered a shot of vodka at the bar.
  </text>
  <text x="50" y="310" class="content">
    他在酒吧点了一杯伏特加。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="250" class="bottle" />
    <rect x="20" y="20" width="60" height="210" class="bottle" />
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <line x1="40" y1="0" x2="60" y2="0" class="image" />
    <line x1="45" y1="-10" x2="55" y2="-10" class="image" />
    <line x1="47" y1="-20" x2="53" y2="-20" class="image" />
    <!-- Liquid -->
    <rect x="25" y="25" width="50" height="200" fill="#FF6347" />
  </g>
</svg>