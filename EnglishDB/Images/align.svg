<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">align</text>
  <text x="50" y="120" class="subtitle">[əˈlaɪn] v. 对齐，排整齐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (使) + -ign (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强迫症患者，"使(al-)"
    <tspan x="50" dy="25">所有的物品都沿着一条"线(-ign)"排整齐(align)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please align the photos on the wall.
  </text>
  <text x="50" y="310" class="content">
    请把墙上的照片对齐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Line -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <!-- Objects aligned along the line -->
    <rect x="70" y="30" width="30" height="40" class="image" />
    <rect x="120" y="30" width="30" height="40" class="image" />
    <rect x="170" y="30" width="30" height="40" class="image" />
    <rect x="220" y="30" width="30" height="40" class="image" />
    <rect x="270" y="30" width="30" height="40" class="image" />
    <rect x="320" y="30" width="30" height="40" class="image" />
  </g>
</svg>