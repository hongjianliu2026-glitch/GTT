<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrestling</text>
  <text x="50" y="120" class="subtitle">[ˈrɛslɪŋ] n. 摔跤，搏斗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wrest (扭) + -ling (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个壮汉在擂台上，"扭(wrest)"在一起，
    <tspan x="50" dy="25">互相搏斗，这就是摔跤(wrestling)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He won the wrestling match by pinning his opponent.
  </text>
  <text x="50" y="310" class="content">
    他通过将对手按倒在地赢得了摔跤比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wrestling ring -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wrestlers -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Arms and legs -->
    <line x1="100" y1="120" x2="150" y2="150" class="image" />
    <line x1="100" y1="120" x2="50" y2="150" class="image" />
    <line x1="250" y1="120" x2="300" y2="150" class="image" />
    <line x1="250" y1="120" x2="200" y2="150" class="image" />
    <!-- Body contact -->
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
  </g>
</svg>