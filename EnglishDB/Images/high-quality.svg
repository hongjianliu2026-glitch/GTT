<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">high-quality</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪ ˈkwɒləti] adj. 高质量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + quality (质量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钻石，"高高在上(high)"，
    <tspan x="50" dy="25">闪耀着无与伦比的"质量(quality)"，</tspan>
    <tspan x="50" dy="25">这就是高质量(high-quality)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This product is made of high-quality materials.
  </text>
  <text x="50" y="310" class="content">
    这个产品是用高质量的材料制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diamond -->
    <polygon points="175,10 225,10 250,75 225,140 175,140 150,75" style="fill:none;stroke:#7F8C8D;stroke-width:2" />
    <!-- Shine -->
    <line x1="175" y1="10" x2="200" y2="75" class="image" />
    <line x1="225" y1="10" x2="200" y2="75" class="image" />
    <line x1="225" y1="140" x2="200" y2="75" class="image" />
    <line x1="175" y1="140" x2="200" y2="75" class="image" />
  </g>
</svg>