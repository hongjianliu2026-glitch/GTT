<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">approaching</text>
  <text x="50" y="120" class="subtitle">[əˈproʊtʃɪŋ] v. 接近，靠近</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (向) + proach (接近)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人慢慢地"向(ap-)"前"接近(proach)"，
    <tspan x="50" dy="25">就像一只猫悄悄地靠近猎物，这就是approaching的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> As the deadline approaches, the team works harder.
  </text>
  <text x="50" y="310" class="content">
    随着截止日期的临近，团队工作得更努力了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person approaching -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="140" class="image" /> <!-- Right arm -->
    <!-- Target -->
    <rect x="150" y="80" width="50" height="50" class="image" />
    <!-- Arrow -->
    <line x1="70" y1="120" x2="140" y2="100" class="image" />
    <polygon points="140,100 135,90 145,90" class="image" />
  </g>
</svg>