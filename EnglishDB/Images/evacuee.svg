<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evacuee</text>
  <text x="50" y="120" class="subtitle">[ɪˌvækjuˈiː] n. 被疏散者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + vacu (空) + -ee (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人被紧急疏散，"走出(e-vacu)"
    <tspan x="50" dy="25">危险区域，他们就成了被疏散者(evacuee)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evacuees were taken to a safe shelter.
  </text>
  <text x="50" y="310" class="content">
    被疏散者被带到一个安全的避难所。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Danger zone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People leaving -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <circle cx="190" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="280" cy="100" r="10" class="image" />
    <!-- Safe shelter -->
    <rect x="300" y="50" width="50" height="100" class="image" />
  </g>
</svg>