<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">edge</text>
  <text x="50" y="120" class="subtitle">[edʒ] n. 边缘，刀刃；v. 使锋利，使有优势</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> edg (边缘)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀刃(edge)，它就像一个"边缘(edg)"，
    <tspan x="50" dy="25">能够切割一切，给你带来优势。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stood on the edge of the cliff, feeling the wind.
  </text>
  <text x="50" y="310" class="content">
    她站在悬崖的边缘，感受着风。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knife -->
    <line x1="0" y1="0" x2="150" y2="0" class="image" />
    <line x1="150" y1="0" x2="140" y2="10" class="image" />
    <line x1="140" y1="10" x2="160" y2="30" class="image" />
    <line x1="160" y1="30" x2="150" y2="40" class="image" />
    <line x1="150" y1="40" x2="0" y2="40" class="image" />
    <line x1="0" y1="40" x2="10" y2="30" class="image" />
    <line x1="10" y1="30" x2="0" y2="10" class="image" />
    <line x1="0" y1="10" x2="0" y2="0" class="image" />
    <!-- Edge -->
    <line x1="0" y1="0" x2="150" y2="0" class="image" stroke-width="4" stroke="#E74C3C" />
  </g>
</svg>