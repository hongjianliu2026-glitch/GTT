<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fluttering</text>
  <text x="50" y="120" class="subtitle">[ˈflʌtərɪŋ] v. 飘动，颤动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flutter (颤动) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶在花丛中"颤动(flutter)"翅膀，
    <tspan x="50" dy="25">它的翅膀轻轻地飘动，仿佛在跳舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flag was fluttering in the breeze.
  </text>
  <text x="50" y="310" class="content">
    旗帜在微风中飘动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <line x1="50" y1="140" x2="70" y2="130" class="image" />
    <line x1="50" y1="140" x2="30" y2="150" class="image" />
    <line x1="50" y1="140" x2="70" y2="150" class="image" />
    <!-- Flower -->
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="170" cy="100" r="15" class="image" />
    <circle cx="160" cy="85" r="15" class="image" />
    <circle cx="160" cy="115" r="15" class="image" />
    <line x1="160" y1="130" x2="160" y2="160" class="image" />
  </g>
</svg>