<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tarp</text>
  <text x="50" y="120" class="subtitle">[tɑːrp] n. 防水布</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tar (沥青) + p (表示物品)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的防水布(tarp)，
    <tspan x="50" dy="25">它是由沥青(tar)制成的，</tspan>
    <tspan x="50" dy="25">覆盖在一辆卡车上，防止雨水侵蚀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They covered the truck with a tarp to protect it from the rain.
  </text>
  <text x="50" y="310" class="content">
    他们用防水布盖住卡车，以防止雨水侵蚀。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Truck -->
    <rect x="0" y="0" width="300" height="150" class="image" />
    <!-- Tarp -->
    <rect x="20" y="20" width="260" height="110" class="image" />
    <!-- Rain drops -->
    <circle cx="50" cy="10" r="5" class="image" />
    <circle cx="100" cy="15" r="5" class="image" />
    <circle cx="150" cy="20" r="5" class="image" />
    <circle cx="200" cy="25" r="5" class="image" />
    <circle cx="250" cy="30" r="5" class="image" />
  </g>
</svg>