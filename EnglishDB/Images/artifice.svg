<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">artifice</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrtɪfɪs] n. 诡计，技巧，巧妙的手段</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arti- (技巧) + fice (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在舞台上，"巧妙地做(arti-fice)"
    <tspan x="50" dy="25">出各种令人惊叹的魔术，这些魔术就是他的诡计(artifice)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's artifice amazed the audience.
  </text>
  <text x="50" y="310" class="content">
    魔术师的巧妙手段让观众惊叹不已。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Magician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Hat -->
    <rect x="30" y="80" width="40" height="20" class="image" />
    <!-- Rabbit -->
    <circle cx="200" cy="120" r="15" class="image" />
    <line x1="200" y1="135" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
  </g>
</svg>