<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">societal</text>
  <text x="50" y="120" class="subtitle">[səˈsaɪətl] adj. 社会的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soci (社会) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的社会网络，每个人都是节点，
    <tspan x="50" dy="25">连接在一起形成一个"社会(soci)"的整体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The societal impact of technology is profound.
  </text>
  <text x="50" y="310" class="content">
    技术对社会的影响是深远的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Social network -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="150" class="image" />
    <line x1="150" y1="50" x2="100" y2="150" class="image" />
    <!-- Nodes -->
    <circle cx="250" cy="50" r="20" class="image" />
    <circle cx="350" cy="50" r="20" class="image" />
    <circle cx="300" cy="150" r="20" class="image" />
    <line x1="250" y1="50" x2="350" y2="50" class="image" />
    <line x1="250" y1="50" x2="300" y2="150" class="image" />
    <line x1="350" y1="50" x2="300" y2="150" class="image" />
  </g>
</svg>