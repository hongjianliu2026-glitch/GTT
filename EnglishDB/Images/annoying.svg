<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">annoying</text>
  <text x="50" y="120" class="subtitle">[əˈnɔɪɪŋ] adj. 恼人的，讨厌的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (加强) + noy (烦恼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只苍蝇在你耳边"不断(an-)"嗡嗡作响，
    <tspan x="50" dy="25">让你感到"烦恼(noy)"，这就是annoying的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The constant noise from the construction site was really annoying.
  </text>
  <text x="50" y="310" class="content">
    建筑工地的持续噪音真的很烦人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fly -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="35" y2="95" class="image" />
    <line x1="50" y1="80" x2="65" y2="95" class="image" />
    <line x1="50" y1="70" x2="30" y2="60" class="image" />
    <line x1="50" y1="70" x2="70" y2="60" class="image" />
    <!-- Annoyed face -->
    <circle cx="200" cy="50" r="30" class="image" />
    <line x1="185" y1="45" x2="195" y2="45" class="image" />
    <line x1="205" y1="45" x2="215" y2="45" class="image" />
    <path d="M185 65 Q200 80 215 65" class="image" />
  </g>
</svg>