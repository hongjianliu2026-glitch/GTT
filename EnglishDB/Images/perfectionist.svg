<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perfectionist</text>
  <text x="50" y="120" class="subtitle">[pərˈfekʃənɪst] n. 完美主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + fect (做) + -ion (名词后缀) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完美主义者，"完全地做(per-fect)"
    <tspan x="50" dy="25">每件事都力求完美，甚至到了吹毛求疵的地步。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a perfectionist and always double-checks her work.
  </text>
  <text x="50" y="310" class="content">
    她是个完美主义者，总是反复检查她的工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="80" y1="50" x2="150" y2="50" class="image" />
    <!-- Eye -->
    <circle cx="200" cy="50" r="20" class="image" />
    <!-- Hand -->
    <line x1="220" y1="70" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="280" y2="70" class="image" />
    <!-- Paper -->
    <rect x="300" y="20" width="150" height="100" class="image" />
    <!-- Checkmarks -->
    <line x1="320" y1="50" x2="340" y2="70" class="image" />
    <line x1="340" y1="70" x2="360" y2="30" class="image" />
    <line x1="380" y1="50" x2="400" y2="70" class="image" />
    <line x1="400" y1="70" x2="420" y2="30" class="image" />
  </g>
</svg>