<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slosh</text>
  <text x="50" y="120" class="subtitle">[slɒʃ] v. 溅泼，摇晃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sl- (滑) + -osh (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装满水的杯子，"滑(sl-)"动时水"溅泼(osh)"出来，
    <tspan x="50" dy="25">这就是slosh的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The water sloshed out of the bucket when he moved it.
  </text>
  <text x="50" y="310" class="content">
    当他移动水桶时，水溅了出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bucket -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Water splashing -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="40" x2="100" y2="40" class="image" />
    <line x1="50" y1="60" x2="100" y2="60" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <line x1="50" y1="160" x2="100" y2="160" class="image" />
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <line x1="50" y1="200" x2="100" y2="200" class="image" />
  </g>
</svg>