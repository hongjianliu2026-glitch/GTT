<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anti-depressant</text>
  <text x="50" y="120" class="subtitle">[ˌænti dɪˈprɛsənt] n. 抗抑郁药</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (对抗) + depress (压抑) + -ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的药丸，"对抗(anti-)"
    <tspan x="50" dy="25">一个巨大的"压抑(depress)"云，</tspan>
    <tspan x="50" dy="25">将它驱散，带来阳光和快乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She takes anti-depressants to manage her anxiety.
  </text>
  <text x="50" y="310" class="content">
    她服用抗抑郁药来控制她的焦虑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pill -->
    <rect x="0" y="0" width="100" height="50" rx="20" ry="20" class="image" />
    <!-- Depress cloud -->
    <ellipse cx="200" cy="25" rx="50" ry="25" class="image" />
    <line x1="150" y1="25" x2="250" y2="25" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <!-- Sun -->
    <circle cx="350" cy="25" r="25" class="image" />
    <line x1="350" y1="0" x2="350" y2="50" class="image" />
    <line x1="325" y1="12.5" x2="375" y2="37.5" class="image" />
    <line x1="325" y1="37.5" x2="375" y2="12.5" class="image" />
  </g>
</svg>