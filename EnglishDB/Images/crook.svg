<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crook</text>
  <text x="50" y="120" class="subtitle">[kruk] n. 弯曲，钩子；v. 使弯曲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> croc (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的魔法师，他用一根弯曲的魔杖(crook)
    <tspan x="50" dy="25">在空中画出神秘的符号，这些符号就像钩子一样，</tspan>
    <tspan x="50" dy="25">牢牢地抓住了魔法的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shepherd's crook helped him guide the sheep.
  </text>
  <text x="50" y="310" class="content">
    牧羊人的钩子帮助他引导羊群。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crook -->
    <path d="M 0 0 Q 50 100 100 0" class="image" />
    <!-- Magician -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="210" class="image" />
    <line x1="150" y1="180" x2="170" y2="210" class="image" />
    <line x1="150" y1="150" x2="200" y2="140" class="image" />
    <!-- Magic symbols -->
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="270" cy="120" r="10" class="image" />
    <circle cx="290" cy="100" r="10" class="image" />
  </g>
</svg>