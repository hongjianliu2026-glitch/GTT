<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antithesis</text>
  <text x="50" y="120" class="subtitle">[ænˈtɪθəsɪs] n. 对立面，对照</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对) + thesis (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，一个人站在一个巨大的天平上，天平的一端是"光明(light)"，
    <tspan x="50" dy="25">另一端是"黑暗(dark)"，这就是对立面(antithesis)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The antithesis of love is hate.
  </text>
  <text x="50" y="310" class="content">
    爱的对立面是恨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="200" class="image" />
    <!-- Light side -->
    <circle cx="100" cy="100" r="30" class="image" />
    <text x="80" y="110" class="content">Light</text>
    <!-- Dark side -->
    <rect x="300" y="70" width="60" height="60" class="image" />
    <text x="285" y="110" class="content">Dark</text>
    <!-- Person on the scale -->
    <circle cx="200" cy="250" r="20" class="image" />
    <line x1="200" y1="270" x2="200" y2="300" class="image" />
    <line x1="200" y1="300" x2="180" y2="330" class="image" />
    <line x1="200" y1="300" x2="220" y2="330" class="image" />
    <line x1="200" y1="280" x2="240" y2="270" class="image" />
  </g>
</svg>