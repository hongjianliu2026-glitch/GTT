<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rename</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈneɪm] v. 重新命名</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + name (名字)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个文件夹，上面写着"旧名字"，然后有人用魔法棒一挥，
    <tspan x="50" dy="25">"再次命名(re-name)"成了"新名字"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to rename its product to attract more customers.
  </text>
  <text x="50" y="310" class="content">
    公司决定重新命名其产品以吸引更多客户。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old name -->
    <rect x="0" y="0" width="150" height="50" class="image" />
    <text x="20" y="30" class="content">旧名字</text>
    <!-- Magic wand -->
    <line x1="170" y1="25" x2="220" y2="25" class="image" />
    <line x1="220" y1="25" x2="210" y2="15" class="image" />
    <line x1="220" y1="25" x2="210" y2="35" class="image" />
    <!-- New name -->
    <rect x="250" y="0" width="150" height="50" class="image" />
    <text x="270" y="30" class="content">新名字</text>
  </g>
</svg>