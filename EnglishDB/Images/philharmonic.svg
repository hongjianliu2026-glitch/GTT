<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Philharmonic</text>
  <text x="50" y="120" class="subtitle">[ˌfɪləˈhɑːrmənɪk] adj. 爱乐的，交响乐团的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> phil- (爱) + harmon (和谐) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热爱音乐的人，"爱(phil-)"
    <tspan x="50" dy="25">和谐(harmon)的声音，他成为了交响乐团的一员。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Philharmonic Orchestra performed a stunning concert last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚爱乐乐团表演了一场精彩的音乐会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Music note -->
    <path d="M10 100 Q50 50 100 100 T200 100" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Violin -->
    <rect x="50" y="120" width="150" height="50" class="image" />
    <line x1="50" y1="145" x2="200" y2="145" class="image" />
    <!-- Music stand -->
    <rect x="100" y="170" width="100" height="30" class="image" />
    <!-- Conductor -->
    <circle cx="150" cy="220" r="20" class="image" />
    <line x1="150" y1="240" x2="150" y2="280" class="image" />
    <line x1="150" y1="260" x2="120" y2="250" class="image" />
    <line x1="150" y1="260" x2="180" y2="250" class="image" />
  </g>
</svg>