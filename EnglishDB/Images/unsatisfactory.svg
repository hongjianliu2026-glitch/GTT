<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unsatisfactory</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˌsætɪsˈfæktəri] adj. 不满意的，不满足的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + satisfy (满足) + -ory (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一个空碗，"不满足(un-satisfy)"
    <tspan x="50" dy="25">地看着，脸上露出失望的表情，这就是不满意(unsatisfactory)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The service was unsatisfactory; we left without paying.
  </text>
  <text x="50" y="310" class="content">
    服务很不满意，我们没付钱就离开了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Empty bowl -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Disappointed face -->
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="185" cy="90" r="5" class="image" />
    <circle cx="215" cy="90" r="5" class="image" />
    <line x1="190" y1="110" x2="210" y2="110" class="image" />
    <line x1="200" y1="110" x2="200" y2="120" class="image" />
  </g>
</svg>