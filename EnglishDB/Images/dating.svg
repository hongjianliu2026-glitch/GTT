<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dating</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪtɪŋ] n. 约会，定日期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dat (给予) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在咖啡馆里，"给予(dat)"
    <tspan x="50" dy="25">彼此时间，享受美好的约会(dating)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They have been dating for six months.
  </text>
  <text x="50" y="310" class="content">
    他们已经约会六个月了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee cup -->
    <circle cx="50" cy="50" r="30" class="image" />
    <rect x="40" y="80" width="20" height="40" class="image" />
    <!-- Two people -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="150" y1="90" x2="130" y2="110" class="image" />
    <line x1="150" y1="90" x2="170" y2="110" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="90" x2="230" y2="110" class="image" />
    <line x1="250" y1="90" x2="270" y2="110" class="image" />
    <!-- Table -->
    <rect x="100" y="120" width="150" height="20" class="image" />
  </g>
</svg>