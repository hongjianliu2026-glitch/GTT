<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cry</text>
  <text x="50" y="120" class="subtitle">[kraɪ] v. 哭，喊叫；n. 哭声，叫喊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cry (源自原始日耳曼语 *krujanan，意为“呼喊”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在夜晚，因为害怕而大声"呼喊(cry)"，
    <tspan x="50" dy="25">眼泪像瀑布一样流下来，整个房间都回荡着他的哭声。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby started to cry when she saw the stranger.
  </text>
  <text x="50" y="310" class="content">
    当婴儿看到陌生人时，她开始哭了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Tears -->
    <line x1="40" y1="90" x2="20" y2="60" class="image" />
    <line x1="60" y1="90" x2="80" y2="60" class="image" />
    <line x1="40" y1="110" x2="20" y2="140" class="image" />
    <line x1="60" y1="110" x2="80" y2="140" class="image" />
    <!-- Mouth -->
    <path d="M30,120 Q50,150 70,120" class="image" />
  </g>
</svg>