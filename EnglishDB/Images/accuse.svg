<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accuse</text>
  <text x="50" y="120" class="subtitle">[əˈkjuːz] v. 指控，指责</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + -cuse (诉讼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"朝向(ad-)"另一个人，"提起诉讼(cuse)"，
    <tspan x="50" dy="25">指控对方做了坏事，这就是"指控(accuse)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police accused him of theft.
  </text>
  <text x="50" y="310" class="content">
    警察指控他盗窃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person pointing -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <circle cx="10" cy="10" r="15" class="image" />
    <line x1="10" y1="25" x2="10" y2="60" class="image" />
    <line x1="10" y1="60" x2="0" y2="90" class="image" />
    <line x1="10" y1="60" x2="20" y2="90" class="image" />
    <line x1="10" y1="40" x2="40" y2="30" class="image" />
    <!-- Target person -->
    <circle cx="110" cy="110" r="15" class="image" />
    <line x1="110" y1="125" x2="110" y2="160" class="image" />
    <line x1="110" y1="160" x2="100" y2="190" class="image" />
    <line x1="110" y1="160" x2="120" y2="190" class="image" />
    <line x1="110" y1="140" x2="150" y2="130" class="image" />
  </g>
</svg>