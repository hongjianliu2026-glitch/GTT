<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irreverent</text>
  <text x="50" y="120" class="subtitle">[ɪˈrɛvərənt] adj. 不敬的，不恭的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (不) + re- (向后) + vere (敬畏)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在教堂里，"不向后(ir-re-vere)"
    <tspan x="50" dy="25">敬畏地站着，反而做出滑稽的动作，这就是不敬(irreverent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His irreverent behavior during the ceremony shocked everyone.
  </text>
  <text x="50" y="310" class="content">
    他在仪式上的不敬行为震惊了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person making a funny face -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="165" y1="105" x2="175" y2="115" class="image" />
    <line x1="185" y1="105" x2="175" y2="115" class="image" />
    <line x1="165" y1="125" x2="185" y2="125" class="image" />
    <line x1="175" y1="130" x2="175" y2="140" class="image" />
    <line x1="175" y1="140" x2="165" y2="150" class="image" />
    <line x1="175" y1="140" x2="185" y2="150" class="image" />
  </g>
</svg>