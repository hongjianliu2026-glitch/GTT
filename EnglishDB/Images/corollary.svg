<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">corollary</text>
  <text x="50" y="120" class="subtitle">[kəˈrɒləri] n. 推论，必然结果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cor- (共同) + ollari (升起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个逻辑推理的过程，"共同升起(cor-ollari)"
    <tspan x="50" dy="25">的结果，就像从一个主要命题中必然得出的推论(corollary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The corollary of the theorem was easily deduced.
  </text>
  <text x="50" y="310" class="content">
    这个定理的推论很容易推导出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main proposition -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <text x="20" y="30" class="content">Main Proposition</text>
    <!-- Arrow -->
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <polygon points="170,145 175,150 180,145" class="image" />
    <!-- Corollary -->
    <rect x="0" y="150" width="350" height="100" class="image" />
    <text x="20" y="180" class="content">Corollary</text>
  </g>
</svg>