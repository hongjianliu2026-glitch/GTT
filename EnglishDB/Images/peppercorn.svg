<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peppercorn</text>
  <text x="50" y="120" class="subtitle">[ˈpepərkɔːrn] n. 胡椒粒，小额款项</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pepper (胡椒) + corn (粒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"撒下(pepper)"
    <tspan x="50" dy="25">无数的胡椒粒(corn)，这些胡椒粒就像小额款项一样微不足道。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He paid a peppercorn rent for the old house.
  </text>
  <text x="50" y="310" class="content">
    他为那栋老房子支付了微不足道的租金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pepper shaker -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="20" r="15" class="image" />
    <line x1="35" y1="40" x2="65" y2="40" class="image" />
    <line x1="35" y1="60" x2="65" y2="60" class="image" />
    <line x1="35" y1="80" x2="65" y2="80" class="image" />
    <line x1="35" y1="100" x2="65" y2="100" class="image" />
    <line x1="35" y1="120" x2="65" y2="120" class="image" />
    <!-- Peppercorns -->
    <circle cx="150" cy="50" r="5" class="image" />
    <circle cx="160" cy="60" r="5" class="image" />
    <circle cx="170" cy="70" r="5" class="image" />
    <circle cx="180" cy="80" r="5" class="image" />
    <circle cx="190" cy="90" r="5" class="image" />
  </g>
</svg>