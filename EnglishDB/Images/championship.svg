<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">championship</text>
  <text x="50" y="120" class="subtitle">[ˈtʃæmpiənʃɪp] n. 冠军赛，锦标赛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> champion (冠军) + -ship (状态或地位)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的奖杯，上面刻着"冠军(champion)"的名字，
    <tspan x="50" dy="25">象征着他们在锦标赛(championship)中的卓越地位。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team won the championship after a thrilling final match.
  </text>
  <text x="50" y="310" class="content">
    这支队伍在一场激动人心的决赛后赢得了冠军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Trophy -->
    <rect x="0" y="0" width="150" height="250" class="image" />
    <rect x="50" y="250" width="50" height="50" class="image" />
    <line x1="75" y1="300" x2="75" y2="350" class="image" />
    <line x1="50" y1="325" x2="100" y2="325" class="image" />
    <line x1="75" y1="350" x2="50" y2="375" class="image" />
    <line x1="75" y1="350" x2="100" y2="375" class="image" />
    <!-- Champion -->
    <circle cx="75" cy="125" r="20" class="image" />
    <line x1="75" y1="145" x2="75" y2="180" class="image" />
    <line x1="75" y1="180" x2="55" y2="210" class="image" />
    <line x1="75" y1="180" x2="95" y2="210" class="image" />
    <line x1="75" y1="160" x2="105" y2="150" class="image" />
  </g>
</svg>