<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flora</text>
  <text x="50" y="120" class="subtitle">[ˈflɔːrə] n. 植物群，植物区系</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flor (花) + -a (表示集合名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片繁花似锦的花园，"花(flor)"
    <tspan x="50" dy="25">朵朵盛开，构成了一个植物群(flora)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flora of the Amazon rainforest is incredibly diverse.
  </text>
  <text x="50" y="310" class="content">
    亚马逊雨林的植物群非常多样化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower 1 -->
    <circle cx="50" cy="50" r="20" class="image" fill="#FF6F61" />
    <circle cx="50" cy="50" r="15" class="image" fill="#FFCC5C" />
    <circle cx="50" cy="50" r="10" class="image" fill="#FF6F61" />
    <circle cx="50" cy="50" r="5" class="image" fill="#FFCC5C" />
    <!-- Flower 2 -->
    <circle cx="150" cy="50" r="20" class="image" fill="#96CEB4" />
    <circle cx="150" cy="50" r="15" class="image" fill="#FFEEAD" />
    <circle cx="150" cy="50" r="10" class="image" fill="#96CEB4" />
    <circle cx="150" cy="50" r="5" class="image" fill="#FFEEAD" />
    <!-- Flower 3 -->
    <circle cx="250" cy="50" r="20" class="image" fill="#A3E4D7" />
    <circle cx="250" cy="50" r="15" class="image" fill="#F5CBA7" />
    <circle cx="250" cy="50" r="10" class="image" fill="#A3E4D7" />
    <circle cx="250" cy="50" r="5" class="image" fill="#F5CBA7" />
    <!-- Ground -->
    <rect x="0" y="100" width="350" height="20" class="image" fill="#7DCEA0" />
  </g>
</svg>