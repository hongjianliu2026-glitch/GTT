<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abrupt</text>
  <text x="50" y="120" class="subtitle">[əˈbrʌpt] adj. 突然的，唐突的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + rupt (断裂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人正在平稳地走路，突然地面"断裂(rupt)"，
    <tspan x="50" dy="25">他"离开(ab-)"了原来的路径，这种突如其来的变化就是abrupt。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting ended with an abrupt departure.
  </text>
  <text x="50" y="310" class="content">
    会议以突然的离开结束。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Broken path -->
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="250" y2="100" class="image" />
    <!-- Person -->
    <circle cx="100" cy="80" r="15" class="image" />
    <line x1="100" y1="95" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="80" y2="160" class="image" />
    <line x1="100" y1="130" x2="120" y2="160" class="image" />
    <line x1="100" y1="110" x2="130" y2="100" class="image" />
  </g>
</svg>