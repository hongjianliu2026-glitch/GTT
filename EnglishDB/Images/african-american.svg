<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">African-American</text>
  <text x="50" y="120" class="subtitle">[ˌæfrɪkən əˈmɛrɪkən] n. 非裔美国人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> African (非洲的) + American (美国的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个非洲人跨越海洋，来到美国，成为了一个非裔美国人。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is an African-American who has made significant contributions to the civil rights movement.
  </text>
  <text x="50" y="310" class="content">
    他是一位对民权运动做出重大贡献的非裔美国人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Africa -->
    <circle cx="50" cy="100" r="50" class="image" />
    <text x="30" y="110" class="content" fill="#2980B9">Africa</text>
    <!-- Ocean -->
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <line x1="100" y1="110" x2="300" y2="110" class="image" />
    <line x1="100" y1="120" x2="300" y2="120" class="image" />
    <!-- America -->
    <rect x="350" y="50" width="100" height="100" class="image" />
    <text x="360" y="110" class="content" fill="#2980B9">America</text>
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>