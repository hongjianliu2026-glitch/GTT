<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .led { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">LED</text>
  <text x="50" y="120" class="subtitle">[ˌɛl iː ˈdiː] n. 发光二极管</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Light Emitting Diode
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个发光的二极管(LED)，它像一颗闪亮的星星，
    <tspan x="50" dy="25">在黑暗中发出明亮的光芒，照亮了整个房间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The LED screen displays vibrant colors.
  </text>
  <text x="50" y="310" class="content">
    LED屏幕显示出生动的色彩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- LED symbol -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <circle cx="50" cy="50" r="40" class="led" />
    <!-- Light rays -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="25" y2="150" class="image" />
    <line x1="50" y1="100" x2="75" y2="150" class="image" />
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="50" y1="100" x2="100" y2="150" class="image" />
  </g>
</svg>