<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shameless</text>
  <text x="50" y="120" class="subtitle">[ˈʃeɪmlɪs] adj. 无耻的，不知羞耻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shame (羞耻) + -less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公共场合大声唱歌，完全不顾周围人的目光，"没有羞耻(shame-less)"
    <tspan x="50" dy="25">的感觉，这就是无耻(shameless)的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His shameless behavior shocked everyone.
  </text>
  <text x="50" y="310" class="content">
    他无耻的行为震惊了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person singing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <!-- Mouth -->
    <path d="M40,110 Q50,100 60,110" class="image" />
    <!-- Surrounding people -->
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Shocked expressions -->
    <path d="M140,90 Q150,80 160,90" class="image" />
    <path d="M190,90 Q200,80 210,90" class="image" />
    <path d="M240,90 Q250,80 260,90" class="image" />
    <path d="M290,90 Q300,80 310,90" class="image" />
  </g>
</svg>