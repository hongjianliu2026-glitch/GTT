<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adjudicate</text>
  <text x="50" y="120" class="subtitle">[əˈdʒuːdɪkeɪt] v. 判决，裁定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (向) + judic (判断) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官坐在高高的椅子上，"向(ad-)"
    <tspan x="50" dy="25">众人宣布他的"判断(judic)"，这就是"裁定(adjudicate)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The court will adjudicate the case next week.
  </text>
  <text x="50" y="310" class="content">
    法庭将在下周审理此案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge's chair -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Judge -->
    <circle cx="75" cy="50" r="20" class="image" />
    <line x1="75" y1="70" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="50" y2="180" class="image" />
    <line x1="75" y1="150" x2="100" y2="180" class="image" />
    <line x1="75" y1="100" x2="120" y2="90" class="image" />
    <!-- Gavel -->
    <rect x="100" y="30" width="30" height="10" class="image" />
    <line x1="115" y1="40" x2="115" y2="60" class="image" />
  </g>
</svg>