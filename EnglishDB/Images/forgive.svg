<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forgive</text>
  <text x="50" y="120" class="subtitle">[fərˈɡɪv] v. 原谅，宽恕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (离开) + give (给予)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把"给予(give)"的愤怒"离开(for-)"，
    <tspan x="50" dy="25">这样他就"原谅(forgive)"了对方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She forgave him for his mistake.
  </text>
  <text x="50" y="310" class="content">
    她原谅了他的错误。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart with an arrow -->
    <path d="M50,50 L100,100 L50,150 Z" class="image" />
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <!-- Arrow leaving the heart -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
  </g>
</svg>