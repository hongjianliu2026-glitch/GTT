<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plain</text>
  <text x="50" y="120" class="subtitle">[pleɪn] adj. 简单的，朴素的；n. 平原</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plan (平)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的平原(plain)，没有任何复杂的装饰，
    <tspan x="50" dy="25">只有平坦的地形和简单的风景，这就是"平(plan)"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a plain white dress to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件朴素的白色连衣裙去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plain landscape -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Horizon line -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="20" class="image" />
    <!-- Grass -->
    <line x1="50" y1="100" x2="50" y2="120" class="image" />
    <line x1="70" y1="100" x2="70" y2="120" class="image" />
    <line x1="90" y1="100" x2="90" y2="120" class="image" />
    <line x1="110" y1="100" x2="110" y2="120" class="image" />
    <line x1="130" y1="100" x2="130" y2="120" class="image" />
    <line x1="150" y1="100" x2="150" y2="120" class="image" />
    <line x1="170" y1="100" x2="170" y2="120" class="image" />
    <line x1="190" y1="100" x2="190" y2="120" class="image" />
    <line x1="210" y1="100" x2="210" y2="120" class="image" />
    <line x1="230" y1="100" x2="230" y2="120" class="image" />
    <line x1="250" y1="100" x2="250" y2="120" class="image" />
    <line x1="270" y1="100" x2="270" y2="120" class="image" />
    <line x1="290" y1="100" x2="290" y2="120" class="image" />
  </g>
</svg>