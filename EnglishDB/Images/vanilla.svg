<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .vanilla { fill: #F3E5AB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vanilla</text>
  <text x="50" y="120" class="subtitle">[vəˈnɪlə] n. 香草，香草味；adj. 普通的，平凡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vanill (香草)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通的冰淇淋店，"香草(vanilla)"
    <tspan x="50" dy="25">是最常见的口味，代表着平凡和经典。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ordered a vanilla ice cream.
  </text>
  <text x="50" y="310" class="content">
    她点了一份香草冰淇淋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice cream cone -->
    <polygon points="50,200 100,100 150,200" class="image" />
    <!-- Vanilla ice cream -->
    <ellipse cx="100" cy="150" rx="50" ry="30" class="vanilla" />
    <!-- Scoop lines -->
    <line x1="70" y1="150" x2="130" y2="150" class="image" />
    <line x1="80" y1="130" x2="120" y2="130" class="image" />
    <line x1="90" y1="110" x2="110" y2="110" class="image" />
  </g>
</svg>