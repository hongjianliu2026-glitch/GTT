<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beard</text>
  <text x="50" y="120" class="subtitle">[bɪərd] n. 胡须</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (在...上) + ard (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的骑士，"在脸上生长(be-ard)"
    <tspan x="50" dy="25">出浓密的胡须，象征着他的勇气和力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He grew a beard during his long journey.
  </text>
  <text x="50" y="310" class="content">
    他在漫长的旅途中留起了胡须。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Beard -->
    <path d="M20,180 Q40,140 60,180 T100,180 T140,180 T180,180 T220,180 T260,180 T300,180" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <path d="M80,120 Q100,140 120,120" class="image" />
  </g>
</svg>