<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">voracious</text>
  <text x="50" y="120" class="subtitle">[vəˈreɪʃəs] adj. 贪吃的，贪婪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vor (吃) + -acious (形容词后缀，表示“有...性质的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的怪兽，"贪婪地吃(vor-acious)"
    <tspan x="50" dy="25">下一切它看到的东西，它的胃口无穷无尽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The voracious reader finished the book in one day.
  </text>
  <text x="50" y="310" class="content">
    这位贪婪的读者一天内读完了这本书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Food -->
    <rect x="20" y="20" width="30" height="30" class="image" />
    <rect x="60" y="20" width="30" height="30" class="image" />
    <rect x="100" y="20" width="30" height="30" class="image" />
    <rect x="140" y="20" width="30" height="30" class="image" />
    <rect x="180" y="20" width="30" height="30" class="image" />
  </g>
</svg>