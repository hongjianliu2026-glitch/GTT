<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concert</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnsət] n. 音乐会，一致；v. 协调，协力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + cert (确定)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群音乐家在舞台上，"一起确定(con-cert)"
    <tspan x="50" dy="25">演奏的节奏和旋律，共同创造出美妙的音乐会(concert)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We attended a concert last night.
  </text>
  <text x="50" y="310" class="content">
    我们昨晚参加了一场音乐会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Musicians -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Instruments -->
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="200" y1="120" x2="200" y2="150" class="image" />
    <line x1="250" y1="120" x2="250" y2="150" class="image" />
    <!-- Audience -->
    <circle cx="50" cy="180" r="10" class="image" />
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
    <circle cx="200" cy="180" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
  </g>
</svg>