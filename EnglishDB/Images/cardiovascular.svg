<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cardiovascular</text>
  <text x="50" y="120" class="subtitle">[ˌkɑːrdioʊˈvæskjələr] adj. 心血管的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cardio (心脏) + vascular (血管)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗巨大的心脏，"心脏(cardio)"
    <tspan x="50" dy="25">和无数的血管(vascular)交织在一起，</tspan>
    <tspan x="50" dy="25">形成了一个庞大的"心血管系统(cardiovascular)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Regular exercise is good for your cardiovascular health.
  </text>
  <text x="50" y="310" class="content">
    定期锻炼对你的心血管健康有好处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart -->
    <path d="M50,50 C50,25 90,25 90,50 C90,75 50,75 50,50 Z" class="image" fill="#E74C3C" />
    <!-- Blood vessels -->
    <line x1="50" y1="100" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="100" y2="150" class="image" />
    <line x1="50" y1="150" x2="0" y2="150" class="image" />
    <line x1="50" y1="150" x2="25" y2="200" class="image" />
    <line x1="50" y1="150" x2="75" y2="200" class="image" />
  </g>
</svg>