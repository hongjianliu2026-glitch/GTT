<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">avert</text>
  <text x="50" y="120" class="subtitle">[əˈvɜːrt] v. 避免，转移</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (离开) + vert (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在危险面前，"转身离开(a-vert)"
    <tspan x="50" dy="25">以避免危险，这就是避免(avert)的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She managed to avert the disaster by acting quickly.
  </text>
  <text x="50" y="310" class="content">
    她通过迅速行动成功避免了灾难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Danger sign -->
    <circle cx="100" cy="100" r="50" class="image" />
    <text x="85" y="115" class="image" style="fill: #E74C3C; font: bold 48px sans-serif;">!</text>
    <!-- Person turning away -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="210" class="image" />
    <line x1="250" y1="180" x2="270" y2="210" class="image" />
    <line x1="250" y1="140" x2="200" y2="130" class="image" />
    <line x1="250" y1="140" x2="300" y2="130" class="image" />
  </g>
</svg>