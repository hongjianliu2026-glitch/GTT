<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #F06292; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feminine</text>
  <text x="50" y="120" class="subtitle">[ˈfɛməˌnɪn] adj. 女性的，阴性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fem (女人) + ine (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个优雅的女士，穿着粉色的裙子，
    <tspan x="50" dy="25">手里拿着一束鲜花，展现出女性的柔美和魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a very feminine way of dressing.
  </text>
  <text x="50" y="310" class="content">
    她的穿衣风格非常女性化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Woman -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="130" y2="180" class="image" />
    <line x1="100" y1="200" x2="70" y2="250" class="image" />
    <line x1="100" y1="200" x2="130" y2="250" class="image" />
    <!-- Dress -->
    <path d="M70,250 Q100,300 130,250" class="image" />
    <!-- Flowers -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="160" cy="90" r="10" class="image" />
    <circle cx="170" cy="100" r="10" class="image" />
    <circle cx="160" cy="110" r="10" class="image" />
  </g>
</svg>