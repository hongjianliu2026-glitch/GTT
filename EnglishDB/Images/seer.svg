<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seer</text>
  <text x="50" y="120" class="subtitle">[sɪər] n. 先知，预言者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (看) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个先知(seer)，他拥有"看(se-)"
    <tspan x="50" dy="25">透未来的能力，能够预见即将发生的事情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The seer predicted a great change in the future.
  </text>
  <text x="50" y="310" class="content">
    先知预言了未来的巨大变化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="image" fill="#2C3E50" />
    <!-- Forehead -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <!-- Hair -->
    <line x1="50" y1="40" x2="150" y2="40" class="image" />
    <line x1="50" y1="30" x2="150" y2="30" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <!-- Beard -->
    <line x1="75" y1="150" x2="125" y2="150" class="image" />
    <line x1="75" y1="160" x2="125" y2="160" class="image" />
    <line x1="75" y1="170" x2="125" y2="170" class="image" />
  </g>
</svg>