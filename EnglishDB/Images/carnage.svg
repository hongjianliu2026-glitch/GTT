<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carnage</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrnɪdʒ] n. 大屠杀，残杀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carn (肉) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片战场上，"肉(carn)"横遍野，
    <tspan x="50" dy="25">血肉模糊的场景，这就是大屠杀(carnage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The battle left a scene of carnage behind.
  </text>
  <text x="50" y="310" class="content">
    战斗过后，留下了一片屠杀的惨状。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Blood splatters -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="80" r="25" class="image" />
    <circle cx="150" cy="120" r="30" class="image" />
    <circle cx="200" cy="160" r="35" class="image" />
    <!-- Dead bodies -->
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="250" y1="20" x2="230" y2="50" class="image" />
    <line x1="250" y1="20" x2="270" y2="50" class="image" />
    <line x1="250" y1="180" x2="230" y2="150" class="image" />
    <line x1="250" y1="180" x2="270" y2="150" class="image" />
  </g>
</svg>