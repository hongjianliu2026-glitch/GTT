<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">limo</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪmoʊ] n. 豪华轿车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> limo (源自limousine, 豪华轿车)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆豪华轿车(limo)停在红毯前，
    <tspan x="50" dy="25">明星们优雅地走下车，享受着闪光灯的聚焦。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The celebrity arrived in a sleek limo.
  </text>
  <text x="50" y="310" class="content">
    那位名人乘坐一辆时尚的豪华轿车抵达。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Limo -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <rect x="20" y="20" width="310" height="60" class="image" />
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="300" cy="50" r="15" class="image" />
    <!-- Red carpet -->
    <rect x="0" y="100" width="350" height="20" class="image" fill="#800000" />
    <!-- Stars -->
    <circle cx="70" cy="120" r="10" class="image" fill="#FFD700" />
    <circle cx="120" cy="120" r="10" class="image" fill="#FFD700" />
    <circle cx="170" cy="120" r="10" class="image" fill="#FFD700" />
    <circle cx="220" cy="120" r="10" class="image" fill="#FFD700" />
    <circle cx="270" cy="120" r="10" class="image" fill="#FFD700" />
  </g>
</svg>