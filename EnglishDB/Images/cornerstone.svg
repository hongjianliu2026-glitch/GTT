<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cornerstone</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrnərstoʊn] n. 基石，基础</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> corner (角落) + stone (石头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座宏伟的建筑，"角落的石头(corner-stone)"
    <tspan x="50" dy="25">是整个建筑的基础，支撑着整个结构。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy is considered the cornerstone of our strategy.
  </text>
  <text x="50" y="310" class="content">
    新政策被认为是我们的战略基石。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cornerstone -->
    <rect x="50" y="20" width="50" height="50" class="image" fill="#D35400" />
    <!-- Building outline -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <!-- Roof -->
    <polygon points="100,20 300,20 250,0" class="image" />
    <!-- Text label -->
    <text x="60" y="55" class="content" fill="#FFFFFF">Cornerstone</text>
  </g>
</svg>