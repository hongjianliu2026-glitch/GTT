<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">basis</text>
  <text x="50" y="120" class="subtitle">[ˈbeɪsɪs] n. 基础，根据</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bas (基础) + -is (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高耸入云的建筑，它的"基础(bas)"
    <tspan x="50" dy="25">是整个建筑的支撑，没有它，建筑就会倒塌。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The basis of her argument was well-founded.
  </text>
  <text x="50" y="310" class="content">
    她的论点有坚实的基础。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building base -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Building -->
    <rect x="100" y="50" width="150" height="200" class="image" />
    <!-- Windows -->
    <rect x="120" y="70" width="30" height="30" class="image" />
    <rect x="170" y="70" width="30" height="30" class="image" />
    <rect x="220" y="70" width="30" height="30" class="image" />
    <rect x="120" y="120" width="30" height="30" class="image" />
    <rect x="170" y="120" width="30" height="30" class="image" />
    <rect x="220" y="120" width="30" height="30" class="image" />
    <rect x="120" y="170" width="30" height="30" class="image" />
    <rect x="170" y="170" width="30" height="30" class="image" />
    <rect x="220" y="170" width="30" height="30" class="image" />
  </g>
</svg>