<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">motionless</text>
  <text x="50" y="120" class="subtitle">[ˈmoʊʃənləs] adj. 静止的，不动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mot (移动) + -ion (名词后缀) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫在阳光下，"一动不动(motionless)"，
    <tspan x="50" dy="25">仿佛时间都停止了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat lay motionless in the sun.
  </text>
  <text x="50" y="310" class="content">
    那只猫在阳光下静静地躺着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Cat -->
    <circle cx="200" cy="150" r="30" fill="#34495E" />
    <line x1="200" y1="180" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="170" y2="300" class="image" />
    <line x1="200" y1="250" x2="230" y2="300" class="image" />
    <line x1="200" y1="200" x2="150" y2="220" class="image" />
    <line x1="200" y1="200" x2="250" y2="220" class="image" />
  </g>
</svg>