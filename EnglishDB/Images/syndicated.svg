<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">syndicated</text>
  <text x="50" y="120" class="subtitle">[ˈsɪndɪkeɪtɪd] adj. 联合的，辛迪加化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syn- (共同) + dic (说) + -ate (动词后缀) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"共同说(syn-dic)"
    <tspan x="50" dy="25">着同一个话题，这就是联合(syndicated)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The article was syndicated across multiple newspapers.
  </text>
  <text x="50" y="310" class="content">
    这篇文章被多家报纸联合刊登。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People sitting around a table -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <rect x="30" y="70" width="220" height="100" class="image" />
    <!-- Speech bubbles -->
    <rect x="40" y="80" width="40" height="30" class="image" />
    <rect x="90" y="80" width="40" height="30" class="image" />
    <rect x="140" y="80" width="40" height="30" class="image" />
    <rect x="190" y="80" width="40" height="30" class="image" />
    <rect x="240" y="80" width="40" height="30" class="image" />
  </g>
</svg>