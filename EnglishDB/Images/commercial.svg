<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commercial</text>
  <text x="50" y="120" class="subtitle">[kəˈmɜːrʃl] adj. 商业的，贸易的；n. 商业广告</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + merc (贸易) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的广告牌，上面写着"共同贸易(com-merc)"，
    <tspan x="50" dy="25">这个广告牌就是商业(commercial)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The commercial success of the product surprised everyone.
  </text>
  <text x="50" y="310" class="content">
    该产品的商业成功让所有人都感到惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Billboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ad text -->
    <text x="50" y="100" class="content" style="font-size: 36px; fill: #F39C12;">"共同贸易(com-merc)"</text>
    <!-- Coins -->
    <circle cx="280" cy="150" r="20" class="image" fill="#D35400" />
    <circle cx="320" cy="150" r="20" class="image" fill="#D35400" />
    <circle cx="280" cy="190" r="20" class="image" fill="#D35400" />
    <circle cx="320" cy="190" r="20" class="image" fill="#D35400" />
  </g>
</svg>