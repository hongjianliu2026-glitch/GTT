<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">granulate</text>
  <text x="50" y="120" class="subtitle">[ˈɡrænjəˌleɪt] v. 使成颗粒，使表面粗糙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gran (颗粒) + -ulate (使成...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的搅拌机，"使成颗粒(gran-ulate)"
    <tspan x="50" dy="25">将大块的物质碾碎成小颗粒，就像糖被磨成糖粉一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The machine granulates the sugar into fine powder.
  </text>
  <text x="50" y="310" class="content">
    这台机器将糖磨成细粉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blender -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sugar cubes -->
    <rect x="50" y="20" width="30" height="30" class="image" />
    <rect x="90" y="20" width="30" height="30" class="image" />
    <rect x="130" y="20" width="30" height="30" class="image" />
    <!-- Sugar powder -->
    <line x1="50" y1="70" x2="80" y2="70" class="image" />
    <line x1="50" y1="80" x2="80" y2="80" class="image" />
    <line x1="50" y1="90" x2="80" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="100" class="image" />
    <!-- Blender blades -->
    <line x1="50" y1="120" x2="80" y2="120" class="image" />
    <line x1="50" y1="130" x2="80" y2="130" class="image" />
    <line x1="50" y1="140" x2="80" y2="140" class="image" />
  </g>
</svg>