<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comfy</text>
  <text x="50" y="120" class="subtitle">[ˈkʌmfi] adj. 舒适的，安逸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + -fy (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温暖的房间里，"共同使(com-fy)"
    <tspan x="50" dy="25">人感到舒适，就像躺在柔软的沙发上一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made the room comfy for her guests.
  </text>
  <text x="50" y="310" class="content">
    她为客人布置了一个舒适的房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sofa -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Cushion -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Person -->
    <circle cx="175" cy="150" r="15" class="image" />
    <line x1="175" y1="165" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="155" y2="210" class="image" />
    <line x1="175" y1="190" x2="195" y2="210" class="image" />
    <line x1="175" y1="175" x2="205" y2="165" class="image" />
  </g>
</svg>