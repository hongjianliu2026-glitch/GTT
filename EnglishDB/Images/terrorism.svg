<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">terrorism</text>
  <text x="50" y="120" class="subtitle">[ˈterəˌrɪzəm] n. 恐怖主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> terro- (恐怖) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"恐怖(terro)"怪物，它用"主义(ism)"
    <tspan x="50" dy="25">的力量控制着人们，制造恐慌和混乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government is taking measures to combat terrorism.
  </text>
  <text x="50" y="310" class="content">
    政府正在采取措施打击恐怖主义。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Terror monster -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="180" class="image" />
    <line x1="100" y1="200" x2="150" y2="180" class="image" />
    <!-- Terror symbol -->
    <polygon points="200,50 250,150 150,150" class="image" />
    <text x="190" y="130" class="content" fill="#B03A2E">恐怖</text>
  </g>
</svg>