<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eleventh</text>
  <text x="50" y="120" class="subtitle">[ɪˈlevənθ] adj. 第十一的；n. 第十一</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ele- (十一) + -th (序数词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“11”，它被放在一个
    <tspan x="50" dy="25">巨大的蛋糕上，蛋糕上有11根蜡烛，每根蜡烛</tspan>
    <tspan x="50" dy="25">都代表着“第十一(eleventh)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was the eleventh person to arrive.
  </text>
  <text x="50" y="310" class="content">
    她是第十一个到达的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Number 11 -->
    <text x="0" y="0" font-size="150" fill="#E74C3C">11</text>
    <!-- Cake -->
    <rect x="50" y="150" width="200" height="50" class="image" />
    <rect x="75" y="100" width="150" height="50" class="image" />
    <!-- Candles -->
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="150" y1="100" x2="150" y2="20" class="image" />
    <line x1="200" y1="100" x2="200" y2="20" class="image" />
    <line x1="125" y1="100" x2="125" y2="20" class="image" />
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="225" y1="100" x2="225" y2="20" class="image" />
    <line x1="75" y1="100" x2="75" y2="20" class="image" />
    <line x1="250" y1="100" x2="250" y2="20" class="image" />
    <line x1="50" y1="100" x2="50" y2="20" class="image" />
    <line x1="275" y1="100" x2="275" y2="20" class="image" />
  </g>
</svg>