<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">raven</text>
  <text x="50" y="120" class="subtitle">[ˈreɪvn] n. 渡鸦，乌鸦；v. 狼吞虎咽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> raven (源自古英语hræfn，意为“乌鸦”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的乌鸦(raven)，它张开翅膀，
    <tspan x="50" dy="25">狼吞虎咽地吃掉了一整只羊，画面夸张而令人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The raven perched on the ancient oak tree.
  </text>
  <text x="50" y="310" class="content">
    那只乌鸦栖息在古老的橡树上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Raven -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />
    <!-- Sheep -->
    <ellipse cx="200" cy="150" rx="50" ry="30" class="image" />
    <line x1="200" y1="180" x2="200" y2="230" class="image" />
    <line x1="200" y1="205" x2="150" y2="185" class="image" />
    <line x1="200" y1="205" x2="250" y2="185" class="image" />
    <line x1="200" y1="230" x2="150" y2="250" class="image" />
    <line x1="200" y1="230" x2="250" y2="250" class="image" />
  </g>
</svg>