<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tempting</text>
  <text x="50" y="120" class="subtitle">[ˈtɛmptɪŋ] adj. 诱人的，吸引人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tempt (尝试) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的巧克力蛋糕，"尝试(tempt)"
    <tspan x="50" dy="25">一口就让人无法抗拒，这就是诱人的(tempting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The offer of a free vacation is very tempting.
  </text>
  <text x="50" y="310" class="content">
    免费度假的提议非常诱人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chocolate cake -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="100" cy="100" r="70" class="image" />
    <circle cx="100" cy="100" r="60" class="image" />
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="40" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Fork -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="80" class="image" />
    <line x1="250" y1="100" x2="230" y2="120" class="image" />
  </g>
</svg>