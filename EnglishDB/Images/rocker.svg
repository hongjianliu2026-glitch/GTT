<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rocker</text>
  <text x="50" y="120" class="subtitle">[ˈrɒkə(r)] n. 摇滚乐手，摇椅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rock (摇动) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摇滚乐手在舞台上疯狂地"摇动(rock)"吉他，
    <tspan x="50" dy="25">或者一个老人坐在摇椅上轻轻"摇动(rock)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rocker performed an electrifying set last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚那位摇滚乐手表演了一场震撼人心的演出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Guitar -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <!-- Rocker -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Chair -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <line x1="300" y1="100" x2="250" y2="150" class="image" />
  </g>
</svg>