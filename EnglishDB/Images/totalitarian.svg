<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">totalitarian</text>
  <text x="50" y="120" class="subtitle">[ˌtoʊtəlɪˈteriən] adj. 极权主义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> total (全部) + -itarian (与...有关的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个极权主义的统治者，"掌控(total)"
    <tspan x="50" dy="25">着每一个人的生活，从思想到行动，无一例外。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The regime was known for its totalitarian policies.
  </text>
  <text x="50" y="310" class="content">
    这个政权以其极权主义政策而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Totalitarian ruler -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />
    <!-- Control lines -->
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
    <line x1="50" y1="160" x2="150" y2="160" class="image" />
    <line x1="50" y1="190" x2="150" y2="190" class="image" />
    <!-- Citizens -->
    <circle cx="180" cy="130" r="10" class="image" />
    <circle cx="180" cy="160" r="10" class="image" />
    <circle cx="180" cy="190" r="10" class="image" />
  </g>
</svg>