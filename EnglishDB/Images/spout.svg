<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spout</text>
  <text x="50" y="120" class="subtitle">[spaʊt] n. 喷口，喷嘴；v. 喷出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spout (源自中古英语 spout，意为“喷出”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水壶，水从它的“喷口(spout)”中
    <tspan x="50" dy="25">喷涌而出，形成一道壮观的水柱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teapot's spout was clogged with tea leaves.
  </text>
  <text x="50" y="310" class="content">
    茶壶的喷嘴被茶叶堵住了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teapot -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Spout -->
    <path d="M 150 50 Q 200 50 200 100" class="image" />
    <!-- Water stream -->
    <path d="M 200 100 Q 250 150 300 100" class="image" />
    <!-- Water drops -->
    <circle cx="300" cy="100" r="5" class="image" />
    <circle cx="310" cy="90" r="5" class="image" />
    <circle cx="320" cy="80" r="5" class="image" />
  </g>
</svg>