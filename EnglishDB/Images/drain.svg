<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drain</text>
  <text x="50" y="120" class="subtitle">[dreɪn] v. 排水，消耗；n. 排水管</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dr- (向下) + ain (流)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水池，水从顶部"向下流动(dr-ain)"，
    <tspan x="50" dy="25">最终通过排水管排出，这就是排水(drain)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plumber fixed the drain in the kitchen sink.
  </text>
  <text x="50" y="310" class="content">
    水管工修好了厨房水槽的排水管。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water tank -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water flow -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <!-- Drain pipe -->
    <rect x="300" y="100" width="50" height="100" class="image" />
    <!-- Water drop -->
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
  </g>
</svg>