<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sequential</text>
  <text x="50" y="120" class="subtitle">[sɪˈkwenʃl] adj. 连续的，顺序的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sequ (跟随) + ential (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人排成一列，一个接一个地"跟随(sequ)"
    <tspan x="50" dy="25">前进，这就是顺序(sequential)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The events happened in a sequential manner.
  </text>
  <text x="50" y="310" class="content">
    这些事件是按顺序发生的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People in a line -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="300" cy="50" r="15" class="image" />
    <!-- Lines connecting people -->
    <line x1="65" y1="50" x2="95" y2="50" class="image" />
    <line x1="115" y1="50" x2="145" y2="50" class="image" />
    <line x1="165" y1="50" x2="195" y2="50" class="image" />
    <line x1="215" y1="50" x2="245" y2="50" class="image" />
    <line x1="265" y1="50" x2="295" y2="50" class="image" />
  </g>
</svg>