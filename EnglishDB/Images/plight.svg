<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plight</text>
  <text x="50" y="120" class="subtitle">[plaɪt] n. 困境，苦境</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plic (折叠) + -ight (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"折叠(plic)"在困境中，无法挣脱，
    <tspan x="50" dy="25">这种苦境(plight)让人感到无比沉重。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plight of the refugees was heart-wrenching.
  </text>
  <text x="50" y="310" class="content">
    难民的困境令人心碎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Folded person -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="100" y2="80" class="image" />
    <line x1="50" y1="20" x2="0" y2="80" class="image" />
    <line x1="50" y1="180" x2="100" y2="120" class="image" />
    <line x1="50" y1="180" x2="0" y2="120" class="image" />
    <!-- Chain -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="100" y2="80" class="image" />
    <line x1="50" y1="20" x2="0" y2="80" class="image" />
    <line x1="50" y1="180" x2="100" y2="120" class="image" />
    <line x1="50" y1="180" x2="0" y2="120" class="image" />
    <!-- Chain -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="100" y2="80" class="image" />
    <line x1="50" y1="20" x2="0" y2="80" class="image" />
    <line x1="50" y1="180" x2="100" y2="120" class="image" />
    <line x1="50" y1="180" x2="0" y2="120" class="image" />
  </g>
</svg>