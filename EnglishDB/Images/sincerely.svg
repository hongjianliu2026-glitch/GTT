<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sincerely</text>
  <text x="50" y="120" class="subtitle">[sɪnˈsɪərli] adv. 真诚地，诚挚地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sin- (自己) + -cere (心)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在写信时，"用心(cere)"
    <tspan x="50" dy="25">表达自己的真实感受(sin-cerely)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She signed the letter "Sincerely, Emily."
  </text>
  <text x="50" y="310" class="content">
    她在信的结尾签上了“真诚的，艾米丽”。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Envelope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Heart -->
    <path d="M 50 100 C 50 50, 100 50, 100 100 C 100 150, 50 150, 50 100 Z" class="image" />
    <!-- Letter -->
    <rect x="150" y="20" width="150" height="160" class="image" />
    <!-- Handwriting -->
    <line x1="170" y1="50" x2="280" y2="50" class="image" />
    <line x1="170" y1="80" x2="250" y2="80" class="image" />
    <line x1="170" y1="110" x2="270" y2="110" class="image" />
    <line x1="170" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>