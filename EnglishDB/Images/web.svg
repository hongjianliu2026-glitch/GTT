<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">web</text>
  <text x="50" y="120" class="subtitle">[web] n. 网络，网状物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> web (网)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张巨大的网，"网(web)"住了整个世界，
    <tspan x="50" dy="25">连接了无数的节点，这就是互联网(web)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spider carefully weaves its web.
  </text>
  <text x="50" y="310" class="content">
    蜘蛛小心翼翼地织网。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Web -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <!-- Nodes -->
    <circle cx="100" cy="20" r="5" class="image" fill="#34495E" />
    <circle cx="20" cy="100" r="5" class="image" fill="#34495E" />
    <circle cx="180" cy="100" r="5" class="image" fill="#34495E" />
    <circle cx="100" cy="180" r="5" class="image" fill="#34495E" />
    <circle cx="50" cy="50" r="5" class="image" fill="#34495E" />
    <circle cx="150" cy="150" r="5" class="image" fill="#34495E" />
    <circle cx="50" cy="150" r="5" class="image" fill="#34495E" />
    <circle cx="150" cy="50" r="5" class="image" fill="#34495E" />
  </g>
</svg>