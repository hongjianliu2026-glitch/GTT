<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">courthouse</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrthaʊs] n. 法院，法庭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> court (法庭) + house (房子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个庄严的"法庭房子(court-house)"，
    <tspan x="50" dy="25">里面充满了正义的气息，法官坐在高高的椅子上，</tspan>
    <tspan x="50" dy="25">律师们在激烈辩论，这就是法院(courthouse)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The trial will be held at the local courthouse.
  </text>
  <text x="50" y="310" class="content">
    审判将在当地法院进行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courthouse building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Roof -->
    <polygon points="0,0 175,100 350,0" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="80" class="image" />
    <!-- Windows -->
    <rect x="50" y="50" width="50" height="50" class="image" />
    <rect x="250" y="50" width="50" height="50" class="image" />
    <!-- Judge's chair -->
    <rect x="160" y="20" width="30" height="30" class="image" />
    <!-- Lawyer's table -->
    <rect x="70" y="150" width="200" height="30" class="image" />
    <!-- Gavel -->
    <line x1="175" y1="30" x2="175" y2="50" class="image" />
    <line x1="170" y1="40" x2="180" y2="40" class="image" />
  </g>
</svg>