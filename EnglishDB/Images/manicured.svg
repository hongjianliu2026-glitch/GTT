<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manicured</text>
  <text x="50" y="120" class="subtitle">[ˈmænɪkjərd] adj. 修剪整齐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mani- (手) + cure (照顾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个园丁用"手(mani-)"精心"照顾(cure)"
    <tspan x="50" dy="25">每一棵植物，使它们变得修剪整齐(manicured)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lawn was perfectly manicured.
  </text>
  <text x="50" y="310" class="content">
    草坪修剪得非常整齐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lawn -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Grass lines -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Gardener -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Scissors -->
    <line x1="30" y1="120" x2="70" y2="120" class="image" />
    <line x1="30" y1="120" x2="30" y2="140" class="image" />
    <line x1="70" y1="120" x2="70" y2="140" class="image" />
  </g>
</svg>