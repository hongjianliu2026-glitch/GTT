<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overdo</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈduː] v. 做得过头，过度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (超过) + do (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在健身房里，"做得超过(over-do)"
    <tspan x="50" dy="25">了极限，结果累得趴在地上，这就是过度(overdo)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He overdid it at the gym and ended up with a muscle strain.
  </text>
  <text x="50" y="310" class="content">
    他在健身房做得过头了，结果肌肉拉伤了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gym -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <line x1="50" y1="140" x2="70" y2="130" class="image" />
    <!-- Dumbbell -->
    <rect x="100" y="150" width="50" height="20" class="image" />
    <rect x="125" y="130" width="20" height="40" class="image" />
    <!-- Exhausted -->
    <line x1="50" y1="220" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="30" y2="280" class="image" />
    <line x1="50" y1="250" x2="70" y2="280" class="image" />
  </g>
</svg>