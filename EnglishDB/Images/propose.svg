<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">propose</text>
  <text x="50" y="120" class="subtitle">[prəˈpoʊz] v. 提议，求婚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + pose (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"向前放置(pro-pose)"一枚戒指，
    <tspan x="50" dy="25">单膝跪地，向心爱的人求婚。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He proposed to her under the Eiffel Tower.
  </text>
  <text x="50" y="310" class="content">
    他在埃菲尔铁塔下向她求婚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person kneeling -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="80" x2="100" y2="70" class="image" />
    <!-- Ring -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <!-- Heart -->
    <path d="M200,100 C200,50 250,50 250,100 C250,150 200,150 200,100" class="image" />
  </g>
</svg>