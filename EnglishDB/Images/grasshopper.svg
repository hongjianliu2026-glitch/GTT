<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grasshopper</text>
  <text x="50" y="120" class="subtitle">[ˈɡræsˌhɑpər] n. 蚱蜢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grass (草) + hopper (跳跃者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蚱蜢在草地上跳跃，"草地上的跳跃者(grass-hopper)"
    <tspan x="50" dy="25">，这就是蚱蜢(grasshopper)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The grasshopper jumped from one blade of grass to another.
  </text>
  <text x="50" y="310" class="content">
    蚱蜢从一个草叶跳到另一个草叶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Grasshopper -->
    <circle cx="100" cy="120" r="20" class="image" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="160" x2="140" y2="150" class="image" />
    <line x1="100" y1="160" x2="60" y2="150" class="image" />
  </g>
</svg>