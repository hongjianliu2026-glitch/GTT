<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bed { fill: #F1C40F; }
      .pillow { fill: #F39C12; }
      .blanket { fill: #D35400; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bedding</text>
  <text x="50" y="120" class="subtitle">[ˈbɛdɪŋ] n. 床上用品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bed (床) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张床上铺满了各种"床上用品(bedding)"，
    <tspan x="50" dy="25">有柔软的床垫、舒适的枕头和温暖的毯子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought new bedding for her bedroom.
  </text>
  <text x="50" y="310" class="content">
    她为她的卧室买了新的床上用品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="bed" />
    <!-- Pillow -->
    <rect x="50" y="20" width="100" height="60" class="pillow" />
    <!-- Blanket -->
    <rect x="160" y="20" width="180" height="60" class="blanket" />
    <!-- Mattress -->
    <rect x="50" y="90" width="290" height="100" class="bed" />
  </g>
</svg>