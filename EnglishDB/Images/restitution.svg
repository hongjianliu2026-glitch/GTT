<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">restitution</text>
  <text x="50" y="120" class="subtitle">[ˌrɛstɪˈtjuːʃən] n. 归还，赔偿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + stitut (建立) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把丢失的物品"归还(re-)"到原来的"位置(stitut)"，
    <tspan x="50" dy="25">这就是"归还(restitution)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The court ordered restitution of the stolen goods.
  </text>
  <text x="50" y="310" class="content">
    法院命令归还被盗物品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box representing the lost item -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Arrow pointing back to the original position -->
    <line x1="160" y1="50" x2="300" y2="50" class="image" />
    <polygon points="300,50 280,40 280,60" class="image" />
    <!-- Original position -->
    <rect x="320" y="0" width="150" height="100" class="image" />
  </g>
</svg>