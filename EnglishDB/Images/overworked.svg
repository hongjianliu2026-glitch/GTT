<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overworked</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈwɜːrkt] adj. 工作过度的，劳累过度的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (过度) + work (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"过度工作(over-work)"压得喘不过气，
    <tspan x="50" dy="25">他的脸上写满了疲惫，眼睛都快睁不开了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was overworked and needed a vacation.
  </text>
  <text x="50" y="310" class="content">
    他工作过度，需要休假。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Overworked person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Exhausted face -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <!-- Work table -->
    <rect x="0" y="250" width="100" height="50" class="image" />
    <!-- Work documents -->
    <line x1="10" y1="260" x2="90" y2="260" class="image" />
    <line x1="10" y1="270" x2="90" y2="270" class="image" />
    <line x1="10" y1="280" x2="90" y2="280" class="image" />
    <line x1="10" y1="290" x2="90" y2="290" class="image" />
  </g>
</svg>