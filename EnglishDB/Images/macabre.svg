<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">macabre</text>
  <text x="50" y="120" class="subtitle">[məˈkɑːbrə] adj. 恐怖的，令人毛骨悚然的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> macabrum (拉丁语，意为“恐怖的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，"恐怖的(macabrum)"
    <tspan x="50" dy="25">墓地里，骷髅头和蜘蛛网交织，</tspan>
    <tspan x="50" dy="25">营造出一种令人毛骨悚然的氛围(macabre)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The macabre scene at the crime scene made everyone shiver.
  </text>
  <text x="50" y="310" class="content">
    犯罪现场的恐怖场景让每个人都感到毛骨悚然。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="50" r="30" fill="#F1C40F" />
    <!-- Tombstone -->
    <rect x="50" y="100" width="100" height="150" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="150" y1="100" x2="100" y2="50" class="image" />
    <!-- Skull -->
    <circle cx="100" cy="200" r="20" fill="#FFFFFF" />
    <circle cx="90" cy="190" r="5" fill="#000000" />
    <circle cx="110" cy="190" r="5" fill="#000000" />
    <line x1="90" y1="210" x2="110" y2="210" class="image" />
    <!-- Spider web -->
    <line x1="50" y1="100" x2="150" y2="250" class="image" />
    <line x1="50" y1="250" x2="150" y2="100" class="image" />
    <circle cx="100" cy="175" r="10" fill="#FFFFFF" />
    <circle cx="100" cy="175" r="5" fill="#000000" />
  </g>
</svg>