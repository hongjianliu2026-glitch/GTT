<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jaunt</text>
  <text x="50" y="120" class="subtitle">[dʒɔːnt] n. 短途旅行，远足</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jaunt (源自中古英语 jaunt, 意为“快速移动”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背着背包，"快速移动(jaunt)"
    <tspan x="50" dy="25">在山间小路上，享受着轻松的短途旅行(jaunt)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We decided to take a jaunt to the countryside this weekend.
  </text>
  <text x="50" y="310" class="content">
    我们决定这个周末去乡间远足。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with backpack -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <rect x="40" y="120" width="20" height="40" class="image" /> <!-- Backpack -->

    <!-- Path -->
    <line x1="0" y1="240" x2="200" y2="240" class="image" />
    <line x1="0" y1="240" x2="20" y2="230" class="image" />
    <line x1="20" y1="230" x2="40" y2="240" class="image" />
    <line x1="40" y1="240" x2="60" y2="230" class="image" />
    <line x1="60" y1="230" x2="80" y2="240" class="image" />
    <line x1="80" y1="240" x2="100" y2="230" class="image" />
    <line x1="100" y1="230" x2="120" y2="240" class="image" />
    <line x1="120" y1="240" x2="140" y2="230" class="image" />
    <line x1="140" y1="230" x2="160" y2="240" class="image" />
    <line x1="160" y1="240" x2="180" y2="230" class="image" />
    <line x1="180" y1="230" x2="200" y2="240" class="image" />
  </g>
</svg>