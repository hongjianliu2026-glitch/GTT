<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">one-of-a-kind</text>
  <text x="50" y="120" class="subtitle">[ˌwʌn əv ə ˈkaɪnd] adj. 独一无二的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> one (一) + of (的) + a (一个) + kind (种类)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世界上只有一只的独角兽，它是"独一无二(one-of-a-kind)"的，
    <tspan x="50" dy="25">没有任何其他生物能与之相比。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This painting is one-of-a-kind; there's no other like it.
  </text>
  <text x="50" y="310" class="content">
    这幅画是独一无二的，没有其他类似的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Unicorn -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <line x1="100" y1="100" x2="50" y2="120" class="image" />
    <line x1="100" y1="100" x2="150" y2="120" class="image" />
    <!-- Unique horn -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
  </g>
</svg>