<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abdicate</text>
  <text x="50" y="120" class="subtitle">[ˈæbdɪkeɪt] v. 退位，放弃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + dic (说) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位国王站在王座前，"说(dic)"
    <tspan x="50" dy="25">他要"离开(ab-)"王位，放弃了权力(abdicate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The king decided to abdicate after years of unrest.
  </text>
  <text x="50" y="310" class="content">
    经过多年的动荡，国王决定退位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="150" y="50" width="50" height="100" class="image" />
    <rect x="100" y="150" width="150" height="50" class="image" />
    <!-- King -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M250,80 Q300,80 300,120 Q250,120 250,80 Z" class="image" />
    <text x="260" y="110" class="content">"I abdicate!"</text>
  </g>
</svg>