<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Cherokee</text>
  <text x="50" y="120" class="subtitle">[tʃəˈroʊki] n. 切罗基人，切罗基语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自北美原住民切罗基族的名称
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个切罗基族的勇士，手持弓箭，
    <tspan x="50" dy="25">站在山巅，守护着他们的土地和文化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Cherokee language is rich in history and tradition.
  </text>
  <text x="50" y="310" class="content">
    切罗基语充满了历史和传统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,200 L100,0 L200,200 Z" class="image" />
    <!-- Warrior -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
    <!-- Bow and Arrow -->
    <path d="M100,150 Q120,140 100,130" class="image" />
    <line x1="100" y1="130" x2="150" y2="100" class="image" />
  </g>
</svg>