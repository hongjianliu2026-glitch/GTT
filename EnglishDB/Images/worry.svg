<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">worry</text>
  <text x="50" y="120" class="subtitle">[ˈwʌri] v. 担心，烦恼；n. 烦恼，忧虑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> worr (烦恼) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"烦恼(worr)"缠绕，
    <tspan x="50" dy="25">脸上布满皱纹，双手紧握，这就是"worry"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She worries about her exams every night.
  </text>
  <text x="50" y="310" class="content">
    她每晚都为考试而烦恼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Wrinkles -->
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <!-- Hands -->
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <!-- Clenched fists -->
    <circle cx="50" cy="200" r="10" class="image" />
    <circle cx="150" cy="200" r="10" class="image" />
  </g>
</svg>