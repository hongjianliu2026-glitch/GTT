<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hugely</text>
  <text x="50" y="120" class="subtitle">[ˈhjuːdʒli] adv. 巨大地，非常</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hug (拥抱) + -ely (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用"巨大的拥抱(hug)"来表达他的感情，
    <tspan x="50" dy="25">这种感情是"非常(hugely)"强烈的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was hugely impressed by his performance.
  </text>
  <text x="50" y="310" class="content">
    她对他的表演印象非常深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hugging arms -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <!-- Big heart -->
    <circle cx="100" cy="200" r="50" class="image" />
    <line x1="70" y1="180" x2="130" y2="220" class="image" />
    <line x1="70" y1="220" x2="130" y2="180" class="image" />
  </g>
</svg>