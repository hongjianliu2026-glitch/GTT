<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">propaganda</text>
  <text x="50" y="120" class="subtitle">[ˌprɒpəˈɡændə] n. 宣传</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + pag (固定) + -anda (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人拿着大喇叭，"向前固定(pro-pag)"
    <tspan x="50" dy="25">传播信息，这些信息就构成了宣传(propaganda)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government used propaganda to boost morale during the war.
  </text>
  <text x="50" y="310" class="content">
    政府在战争期间使用宣传来提高士气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Loudspeakers -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="150" y="20" width="50" height="100" class="image" />
    <rect x="250" y="20" width="50" height="100" class="image" />
    <!-- Sound waves -->
    <line x1="75" y1="130" x2="75" y2="180" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="275" y1="130" x2="275" y2="180" class="image" />
    <line x1="300" y1="130" x2="300" y2="180" class="image" />
    <!-- People -->
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <circle cx="300" cy="150" r="15" class="image" />
  </g>
</svg>