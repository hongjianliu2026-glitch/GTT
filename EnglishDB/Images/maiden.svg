<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maiden</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪdn] n. 少女，处女；adj. 首次的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> maid (少女) + -en (表示小或年轻)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个年轻的少女(maid-en)，她穿着洁白的裙子，
    <tspan x="50" dy="25">手里拿着一朵花，脸上带着纯真的微笑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The maiden voyage of the ship was a success.
  </text>
  <text x="50" y="310" class="content">
    这艘船的处女航很成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Maiden -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Dress -->
    <path d="M50,200 Q80,230 50,260 Q20,230 50,200" class="image" />
    <!-- Flower -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="130" x2="100" y2="120" class="image" />
    <line x1="120" y1="130" x2="140" y2="120" class="image" />
  </g>
</svg>