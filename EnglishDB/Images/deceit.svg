<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deceit</text>
  <text x="50" y="120" class="subtitle">[dɪˈsiːt] n. 欺骗，欺诈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + ceit (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人偷偷地"拿走(ceit)"你的信任，然后"离开(de-)"，
    <tspan x="50" dy="25">这就是欺骗(deceit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His deceit led to the company's downfall.
  </text>
  <text x="50" y="310" class="content">
    他的欺骗导致了公司的垮台。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a mask -->
    <circle cx="50" cy="100" r="30" class="image" />
    <rect x="40" y="100" width="20" height="50" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M 100 80 Q 150 80 150 120 Q 150 160 100 160 Q 50 160 50 120 Q 50 80 100 80 Z" class="image" />
    <text x="110" y="110" class="content" fill="#34495E">Trust me!</text>
  </g>
</svg>