<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">complicated</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmplɪkeɪtɪd] adj. 复杂的，难懂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + plic (折叠) + -ate (使) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆线团被"折叠在一起(com-plic)"，
    <tspan x="50" dy="25">形成了一个"复杂的(complicated)"局面，让人难以理清。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tax laws are so complicated that only experts can understand them.
  </text>
  <text x="50" y="310" class="content">
    税法非常复杂，只有专家才能理解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Winding lines -->
    <path d="M50,50 C100,0 150,100 200,50 C250,0 300,100 350,50" class="image" />
    <path d="M50,100 C100,50 150,150 200,100 C250,50 300,150 350,100" class="image" />
    <path d="M50,150 C100,100 150,200 200,150 C250,100 300,200 350,150" class="image" />
    <!-- Knots -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
  </g>
</svg>