<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">secession</text>
  <text x="50" y="120" class="subtitle">[sɪˈseʃən] n. 脱离，分离</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + cess (走) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人从一个大团体中"分开走(se-cess)"，
    <tspan x="50" dy="25">他们决定脱离(secession)，形成自己的小团体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The secession of the southern states led to the Civil War.
  </text>
  <text x="50" y="310" class="content">
    南方各州的脱离导致了内战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large group -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Small group -->
    <circle cx="350" cy="100" r="30" class="image" />
    <circle cx="400" cy="100" r="30" class="image" />
    <circle cx="450" cy="100" r="30" class="image" />
    <!-- Arrows -->
    <line x1="80" y1="100" x2="320" y2="100" class="image" />
    <polygon points="320,80 340,100 320,120" class="image" />
  </g>
</svg>