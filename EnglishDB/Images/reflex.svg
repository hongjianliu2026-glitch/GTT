<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reflex</text>
  <text x="50" y="120" class="subtitle">[ˈriːfleks] n. 反射，反应</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + flex (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个手指被针刺了一下，"迅速弯曲回(re-flex)"
    <tspan x="50" dy="25">来保护自己，这就是反射(reflex)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor tested his reflexes by tapping his knee.
  </text>
  <text x="50" y="310" class="content">
    医生通过敲击他的膝盖来测试他的反射。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="180" x2="50" y2="220" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Needle -->
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <!-- Reflex action -->
    <line x1="50" y1="180" x2="50" y2="130" class="image" />
  </g>
</svg>