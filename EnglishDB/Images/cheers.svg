<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheers</text>
  <text x="50" y="120" class="subtitle">[tʃɪəz] int. 干杯；n. 欢呼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cheer (高兴) + s (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在庆祝时举杯，"高兴地(cheer)"
    <tspan x="50" dy="25">喊出'干杯(cheers)'，气氛热烈。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Let's raise our glasses and give a big cheers!
  </text>
  <text x="50" y="310" class="content">
    让我们举杯，大声欢呼！
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glasses -->
    <path d="M50 50 L70 50 L80 100 L60 100 Z" class="image" />
    <path d="M100 50 L120 50 L130 100 L110 100 Z" class="image" />
    <!-- Cheers text -->
    <text x="150" y="80" class="content" style="font-size: 36px; fill: #C0392B;">Cheers!</text>
    <!-- People -->
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <!-- Arms -->
    <line x1="50" y1="165" x2="30" y2="185" class="image" />
    <line x1="100" y1="165" x2="80" y2="185" class="image" />
    <line x1="150" y1="165" x2="170" y2="185" class="image" />
  </g>
</svg>