<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">palm</text>
  <text x="50" y="120" class="subtitle">[pɑːm] n. 手掌，棕榈树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> palma (拉丁语，意为“手掌”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵棕榈树的叶子形状像人的手掌，
    <tspan x="50" dy="25">因此得名“palm”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed the coin in her palm.
  </text>
  <text x="50" y="310" class="content">
    她把硬币放在手掌中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Palm tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="80" y1="20" x2="120" y2="20" class="image" />
    <line x1="70" y1="40" x2="130" y2="40" class="image" />
    <line x1="60" y1="60" x2="140" y2="60" class="image" />
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <line x1="40" y1="100" x2="160" y2="100" class="image" />
    <line x1="30" y1="120" x2="170" y2="120" class="image" />
    <line x1="20" y1="140" x2="180" y2="140" class="image" />
    <line x1="10" y1="160" x2="190" y2="160" class="image" />
    <line x1="0" y1="180" x2="200" y2="180" class="image" />
    <!-- Hand -->
    <circle cx="300" cy="100" r="50" class="image" />
    <line x1="300" y1="150" x2="300" y2="250" class="image" />
    <line x1="300" y1="250" x2="250" y2="300" class="image" />
    <line x1="300" y1="250" x2="350" y2="300" class="image" />
    <line x1="300" y1="250" x2="300" y2="300" class="image" />
    <line x1="300" y1="250" x2="250" y2="200" class="image" />
    <line x1="300" y1="250" x2="350" y2="200" class="image" />
  </g>
</svg>