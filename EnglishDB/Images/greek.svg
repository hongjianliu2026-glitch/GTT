<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Greek</text>
  <text x="50" y="120" class="subtitle">[ɡriːk] n. 希腊人，希腊语；adj. 希腊的，希腊人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自希腊语 "Hellēn"，意为希腊人
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的希腊城市，"Hellēn"
    <tspan x="50" dy="25">（希腊人）在雅典卫城上讨论哲学，</tspan>
    <tspan x="50" dy="25">他们的语言和文化影响了整个西方世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She studied Greek mythology in college.
  </text>
  <text x="50" y="310" class="content">
    她在大学里学习了希腊神话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancient Greek city -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Acropolis -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Philosophers -->
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="160" cy="100" r="15" class="image" />
    <!-- Discussion -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="120" y1="120" x2="160" y2="120" class="image" />
    <line x1="160" y1="120" x2="80" y2="120" class="image" />
  </g>
</svg>