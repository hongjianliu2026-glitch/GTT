<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">melanoma</text>
  <text x="50" y="120" class="subtitle">[ˌmɛləˈnoʊmə] n. 黑色素瘤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> melano- (黑色) + -oma (肿瘤)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑色的太阳(melano-)，它发出的光芒变成了一个巨大的肿瘤(-oma)，
    <tspan x="50" dy="25">这个肿瘤就是黑色素瘤(melanoma)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Early detection of melanoma is crucial for effective treatment.
  </text>
  <text x="50" y="310" class="content">
    黑色素瘤的早期检测对于有效治疗至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Black sun -->
    <circle cx="100" cy="100" r="50" fill="#000" />
    <!-- Rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="50" x2="200" y2="0" class="image" />
    <line x1="150" y1="150" x2="200" y2="200" class="image" />
    <line x1="50" y1="150" x2="0" y2="200" class="image" />
    <!-- Tumor -->
    <circle cx="300" cy="100" r="30" fill="#000" />
    <text x="280" y="110" class="highlight" font-size="20">肿瘤</text>
  </g>
</svg>