<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ordained</text>
  <text x="50" y="120" class="subtitle">[ɔːrˈdeɪnd] v. 任命，规定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> or- (神) + dain (命令)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位神明在天上，"神圣地命令(or-dain)"
    <tspan x="50" dy="25">某人成为牧师，这个过程就是任命(ordained)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was ordained as a priest last year.
  </text>
  <text x="50" y="310" class="content">
    他去年被任命为牧师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- God -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="140" x2="150" y2="130" class="image" />
    <line x1="175" y1="140" x2="200" y2="130" class="image" />
    <line x1="175" y1="160" x2="150" y2="180" class="image" />
    <line x1="175" y1="160" x2="200" y2="180" class="image" />
    <!-- Priest -->
    <circle cx="175" cy="250" r="20" class="image" />
    <line x1="175" y1="270" x2="175" y2="310" class="image" />
    <line x1="175" y1="290" x2="150" y2="280" class="image" />
    <line x1="175" y1="290" x2="200" y2="280" class="image" />
    <line x1="175" y1="310" x2="150" y2="330" class="image" />
    <line x1="175" y1="310" x2="200" y2="330" class="image" />
    <!-- Command -->
    <line x1="175" y1="160" x2="175" y2="250" class="image" />
    <polygon points="175,160 165,170 185,170" class="image" />
  </g>
</svg>