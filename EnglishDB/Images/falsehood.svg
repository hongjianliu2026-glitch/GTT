<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">falsehood</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːlshʊd] n. 谎言，虚假</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> false (假的) + -hood (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在说谎，他的舌头变成了一个巨大的"假舌头(false-hood)"，
    <tspan x="50" dy="25">这个夸张的画面让人印象深刻，记住了谎言的本质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She couldn't stand his falsehood anymore.
  </text>
  <text x="50" y="310" class="content">
    她再也无法忍受他的谎言了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <rect x="70" y="120" width="60" height="10" class="image" />
    <!-- False tongue -->
    <rect x="60" y="130" width="80" height="50" class="image" />
    <text x="90" y="160" class="content" fill="#C0392B">假</text>
  </g>
</svg>