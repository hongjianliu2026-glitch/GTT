<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diner</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪnər] n. 小餐馆，用餐者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> din (吃饭) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温馨的小餐馆，"用餐者(diner)"
    <tspan x="50" dy="25">在这里享受美食，放松心情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We stopped at a diner for lunch.
  </text>
  <text x="50" y="310" class="content">
    我们在一家小餐馆停下来吃午饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diner building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Window -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <rect x="200" y="20" width="100" height="80" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="80" class="image" />
    <!-- Table -->
    <rect x="70" y="120" width="200" height="50" class="image" />
    <!-- Chairs -->
    <line x1="80" y1="110" x2="80" y2="120" class="image" />
    <line x1="270" y1="110" x2="270" y2="120" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
  </g>
</svg>