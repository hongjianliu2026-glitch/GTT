<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ceramics</text>
  <text x="50" y="120" class="subtitle">[sɪˈræmɪks] n. 陶瓷，制陶艺术</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ceram (陶器) + -ics (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个陶艺家在工作室里，"制作陶器(ceram)"
    <tspan x="50" dy="25">并将其发展成一门艺术(ceramics)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She studied ceramics in art school.
  </text>
  <text x="50" y="310" class="content">
    她在艺术学校学习了制陶艺术。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pottery wheel -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Clay -->
    <rect x="50" y="250" width="100" height="50" class="image" />
    <!-- Artist -->
    <circle cx="100" cy="320" r="15" class="image" />
    <line x1="100" y1="335" x2="100" y2="370" class="image" />
    <line x1="100" y1="370" x2="80" y2="400" class="image" />
    <line x1="100" y1="370" x2="120" y2="400" class="image" />
    <line x1="100" y1="350" x2="150" y2="340" class="image" />
  </g>
</svg>