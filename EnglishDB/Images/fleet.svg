<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fleet</text>
  <text x="50" y="120" class="subtitle">[fliːt] n. 舰队，车队；adj. 快速的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fleet (弯曲，转向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在海上"快速转向(fleet)"，
    <tspan x="50" dy="25">带领着整个舰队(fleet)迅速行动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fleet sailed into the harbor.
  </text>
  <text x="50" y="310" class="content">
    舰队驶入了港口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="150" height="50" class="image" />
    <line x1="20" y1="0" x2="20" y2="50" class="image" />
    <line x1="130" y1="0" x2="130" y2="50" class="image" />
    <line x1="20" y1="50" x2="130" y2="50" class="image" />
    <!-- Waves -->
    <path d="M0 70 Q30 50, 60 70 T120 70" class="image" />
    <path d="M0 90 Q30 70, 60 90 T120 90" class="image" />
    <path d="M0 110 Q30 90, 60 110 T120 110" class="image" />
  </g>
</svg>