<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overpriced</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈpraɪst] adj. 定价过高的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (过度) + price (价格)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商品被标上了"过度(over)"高的价格，
    <tspan x="50" dy="25">以至于顾客看到价格标签时，眼睛都瞪大了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hotel room was overpriced for its quality.
  </text>
  <text x="50" y="310" class="content">
    这家酒店的房间质量与其价格不相符。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Price tag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <text x="20" y="50" class="content" fill="#C0392B">$999</text>
    <!-- Eye -->
    <circle cx="200" cy="50" r="30" class="image" />
    <circle cx="200" cy="50" r="15" class="image" fill="#2C3E50" />
    <!-- Eyebrow -->
    <line x1="170" y1="30" x2="230" y2="30" class="image" />
  </g>
</svg>