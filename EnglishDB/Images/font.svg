<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">font</text>
  <text x="50" y="120" class="subtitle">[fɒnt] n. 字体，字形</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> font (源自拉丁语 "fons"，意为"源泉"，引申为"字体")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"源泉(font)"喷涌而出，
    <tspan x="50" dy="25">从中涌出各种形状的字母，这些字母构成了不同的字体(font)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She chose a modern font for her presentation.
  </text>
  <text x="50" y="310" class="content">
    她为她的演示文稿选择了一种现代字体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fountain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Letters -->
    <text x="50" y="100" class="content" font-size="36" fill="#34495E">A</text>
    <text x="70" y="130" class="content" font-size="36" fill="#34495E">B</text>
    <text x="90" y="160" class="content" font-size="36" fill="#34495E">C</text>
    <text x="110" y="190" class="content" font-size="36" fill="#34495E">D</text>
  </g>
</svg>