<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shuttered</text>
  <text x="50" y="120" class="subtitle">[ˈʃʌtəd] adj. 关闭的，百叶窗的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shut (关闭) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一栋房子，所有的窗户都被"关闭(shut)"上了百叶窗，
    <tspan x="50" dy="25">整个房子看起来就像是被"关闭(shuttered)"了一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house looked eerie with all the windows shuttered.
  </text>
  <text x="50" y="310" class="content">
    那栋老房子所有的窗户都关着百叶窗，看起来很诡异。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Windows -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- Shutters -->
    <line x1="50" y1="20" x2="100" y2="70" class="image" />
    <line x1="120" y1="20" x2="170" y2="70" class="image" />
    <line x1="190" y1="20" x2="240" y2="70" class="image" />
    <line x1="50" y1="70" x2="100" y2="20" class="image" />
    <line x1="120" y1="70" x2="170" y2="20" class="image" />
    <line x1="190" y1="70" x2="240" y2="20" class="image" />
  </g>
</svg>