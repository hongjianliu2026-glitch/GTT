<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">careless</text>
  <text x="50" y="120" class="subtitle">[ˈkerləs] adj. 粗心的，不小心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> care (关心) + -less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路时，"没有关心(care-less)"
    <tspan x="50" dy="25">脚下的小石头，结果被绊倒了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was careless and forgot his keys at home.
  </text>
  <text x="50" y="310" class="content">
    他太粗心了，把钥匙忘在家里了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="130" class="image" />
    <line x1="50" y1="150" x2="80" y2="130" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />

    <!-- Stone -->
    <rect x="100" y="170" width="30" height="10" class="image" />

    <!-- Tripping -->
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
  </g>
</svg>