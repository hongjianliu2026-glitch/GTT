<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #641E16; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #922B21; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maturation</text>
  <text x="50" y="120" class="subtitle">[ˌmætʃəˈreɪʃn] n. 成熟，成熟过程</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> matur (成熟) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苹果从青涩到成熟的过程，"成熟(matur)"
    <tspan x="50" dy="25">的过程就是maturation。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The maturation of the wine took several years.
  </text>
  <text x="50" y="310" class="content">
    这瓶酒的成熟过程花了好几年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apple tree -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <line x1="100" y1="0" x2="100" y2="150" class="image" />
    <!-- Green apple -->
    <circle cx="70" cy="100" r="20" class="image" fill="#27AE60" />
    <!-- Red apple -->
    <circle cx="130" cy="100" r="20" class="image" fill="#C0392B" />
    <!-- Leaf -->
    <path d="M100,150 Q120,130 100,110 Q80,130 100,150" class="image" fill="#27AE60" />
  </g>
</svg>