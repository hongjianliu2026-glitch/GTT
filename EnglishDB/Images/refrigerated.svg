<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ice { fill: #AED6F1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">refrigerated</text>
  <text x="50" y="120" class="subtitle">[rɪˈfrɪdʒəreɪtɪd] adj. 冷藏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + friger (冷) + -ate (动词后缀) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的冰箱，里面装满了冰块(friger)，
    <tspan x="50" dy="25">食物被"再次冷却(re-friger-ate)"，保持新鲜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store sells refrigerated goods.
  </text>
  <text x="50" y="310" class="content">
    这家商店出售冷藏商品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Refrigerator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ice cubes -->
    <rect x="50" y="20" width="50" height="50" class="ice" />
    <rect x="120" y="20" width="50" height="50" class="ice" />
    <rect x="190" y="20" width="50" height="50" class="ice" />
    <!-- Food items -->
    <circle cx="85" cy="100" r="20" class="image" />
    <rect x="150" y="80" width="40" height="40" class="image" />
    <rect x="220" y="80" width="40" height="40" class="image" />
  </g>
</svg>