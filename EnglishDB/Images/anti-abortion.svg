<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anti-abortion</text>
  <text x="50" y="120" class="subtitle">[ˌænti əˈbɔːrʃn] adj. 反对堕胎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对) + abortion (堕胎)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色"禁止"标志，上面画着一个婴儿的轮廓，
    <tspan x="50" dy="25">象征着反对堕胎(anti-abortion)的立场。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The anti-abortion group held a protest outside the clinic.
  </text>
  <text x="50" y="310" class="content">
    反对堕胎的团体在诊所外举行了抗议活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red "NO" sign -->
    <rect x="0" y="0" width="200" height="200" class="image" fill="#E74C3C" />
    <text x="100" y="120" class="image" font-size="120" text-anchor="middle" fill="#FFFFFF">NO</text>
    <!-- Baby outline -->
    <circle cx="100" cy="250" r="50" class="image" fill="#F1C40F" />
    <line x1="100" y1="300" x2="100" y2="400" class="image" />
    <line x1="100" y1="350" x2="50" y2="320" class="image" />
    <line x1="100" y1="350" x2="150" y2="320" class="image" />
    <line x1="100" y1="400" x2="50" y2="450" class="image" />
    <line x1="100" y1="400" x2="150" y2="450" class="image" />
  </g>
</svg>