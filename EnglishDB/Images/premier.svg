<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">premier</text>
  <text x="50" y="120" class="subtitle">[prɪˈmɪər] adj. 首要的，首位的；n. 总理，首相</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prem (第一) + ier (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"第一人(prem-ier)"站在高高的讲台上，
    <tspan x="50" dy="25">他是国家的总理(premier)，所有人的目光都聚焦在他身上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The premier delivered a speech at the conference.
  </text>
  <text x="50" y="310" class="content">
    总理在会议上发表了演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Premier -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="140" x2="130" y2="130" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
    <!-- Spotlight -->
    <circle cx="175" cy="50" r="30" class="image" stroke="#F39C12" stroke-width="4" fill="none" />
  </g>
</svg>