<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .quilt { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quilt</text>
  <text x="50" y="120" class="subtitle">[kwɪlt] n. 被子，被褥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quil (来自拉丁语culcita，意为“垫子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温暖的房间里，"垫子(quil)"
    <tspan x="50" dy="25">被精心缝制成了一床被子(quilt)，</tspan>
    <tspan x="50" dy="25">上面有各种图案，像是艺术品一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a beautiful quilt for her new baby.
  </text>
  <text x="50" y="310" class="content">
    她为她的新生儿做了一床漂亮的被子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Quilt -->
    <rect x="0" y="0" width="350" height="200" class="quilt" />
    <!-- Patterns -->
    <rect x="20" y="20" width="80" height="80" class="quilt" />
    <rect x="120" y="20" width="80" height="80" class="quilt" />
    <rect x="220" y="20" width="80" height="80" class="quilt" />
    <rect x="20" y="120" width="80" height="80" class="quilt" />
    <rect x="120" y="120" width="80" height="80" class="quilt" />
    <rect x="220" y="120" width="80" height="80" class="quilt" />
    <!-- Stitching -->
    <line x1="20" y1="20" x2="300" y2="20" class="image" />
    <line x1="20" y1="100" x2="300" y2="100" class="image" />
    <line x1="20" y1="180" x2="300" y2="180" class="image" />
    <line x1="20" y1="20" x2="20" y2="200" class="image" />
    <line x1="120" y1="20" x2="120" y2="200" class="image" />
    <line x1="220" y1="20" x2="220" y2="200" class="image" />
    <line x1="320" y1="20" x2="320" y2="200" class="image" />
  </g>
</svg>