<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pen</text>
  <text x="50" y="120" class="subtitle">[pen] n. 笔，围栏；v. 关入栏中</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pen- (来自拉丁语 "penna"，意为羽毛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只羽毛笔(pen)在纸上飞舞，
    <tspan x="50" dy="25">写下美丽的文字，就像一只鸟儿在空中翱翔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wrote a letter with her favorite pen.
  </text>
  <text x="50" y="310" class="content">
    她用她最喜欢的笔写了一封信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pen -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="20" x2="80" y2="50" class="image" />
    <line x1="50" y1="20" x2="20" y2="50" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <!-- Paper -->
    <rect x="100" y="50" width="200" height="150" class="image" />
    <!-- Feather -->
    <polyline points="350,100 320,150 380,150" class="image" />
    <line x1="350" y1="100" x2="350" y2="150" class="image" />
  </g>
</svg>