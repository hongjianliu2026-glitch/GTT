<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fifty-five</text>
  <text x="50" y="120" class="subtitle">[ˈfɪfti faɪv] n. 五十五</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fifty (五十) + five (五)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字55，像两座山峰一样叠在一起，
    <tspan x="50" dy="25">象征着五十和五的结合，形成了五十五(fifty-five)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He turned fifty-five last month.
  </text>
  <text x="50" y="310" class="content">
    他上个月满五十五岁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Number 55 -->
    <text x="0" y="0" font-size="200" font-weight="bold" fill="#E74C3C">55</text>
    <!-- Mountains -->
    <path d="M-50,100 L0,0 L50,100 Z" class="image" />
    <path d="M-50,200 L0,100 L50,200 Z" class="image" />
  </g>
</svg>