<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hourly</text>
  <text x="50" y="120" class="subtitle">[ˈaʊərli] adj. 每小时的，每小时一次的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hour (小时) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟，每小时都会发出"叮"的一声，提醒你"每小时(hourly)"都要检查一次。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weather report is updated hourly.
  </text>
  <text x="50" y="310" class="content">
    天气报告每小时更新一次。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Clock face -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Clock hands -->
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <!-- Hour markers -->
    <line x1="150" y1="50" x2="150" y2="60" class="image" />
    <line x1="200" y1="150" x2="190" y2="150" class="image" />
    <line x1="150" y1="250" x2="150" y2="240" class="image" />
    <line x1="100" y1="150" x2="110" y2="150" class="image" />
    <!-- Bell -->
    <circle cx="150" cy="300" r="30" class="image" />
    <line x1="150" y1="300" x2="150" y2="350" class="image" />
  </g>
</svg>