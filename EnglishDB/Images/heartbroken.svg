<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .heart { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heartbroken</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrtˌbroʊkən] adj. 心碎的，极度悲伤的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heart (心) + broken (破碎的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗心被"打碎(broken)"，
    <tspan x="50" dy="25">碎片散落一地，象征着极度悲伤(heartbroken)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was heartbroken after the breakup.
  </text>
  <text x="50" y="310" class="content">
    分手后她心碎了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken heart -->
    <path d="M50,50 C50,100 150,100 150,50" class="heart" />
    <path d="M50,50 C50,0 150,0 150,50" class="heart" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <line x1="75" y1="75" x2="125" y2="75" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Broken pieces -->
    <circle cx="60" cy="60" r="5" class="image" />
    <circle cx="140" cy="60" r="5" class="image" />
    <circle cx="100" cy="90" r="5" class="image" />
  </g>
</svg>