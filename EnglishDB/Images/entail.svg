<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entail</text>
  <text x="50" y="120" class="subtitle">[ɪnˈteɪl] v. 使必要，牵涉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + tail (剪裁)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个裁缝在剪裁衣服时，"使(en-)"
    <tspan x="50" dy="25">衣服的形状"剪裁(tail)"，这个过程"牵涉(entail)"到</tspan>
    <tspan x="50" dy="25">许多必要的步骤。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project will entail a lot of extra work.
  </text>
  <text x="50" y="310" class="content">
    这个项目将牵涉到很多额外的工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tailor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Scissors -->
    <line x1="70" y1="100" x2="100" y2="100" class="image" />
    <line x1="70" y1="100" x2="70" y2="130" class="image" />
    <line x1="100" y1="100" x2="100" y2="130" class="image" />
    <line x1="70" y1="130" x2="100" y2="130" class="image" />
    <!-- Cloth -->
    <rect x="120" y="90" width="150" height="60" class="image" />
    <!-- Steps -->
    <line x1="300" y1="100" x2="300" y2="160" class="image" />
    <line x1="300" y1="100" x2="290" y2="110" class="image" />
    <line x1="300" y1="100" x2="310" y2="110" class="image" />
    <line x1="300" y1="160" x2="290" y2="150" class="image" />
    <line x1="300" y1="160" x2="310" y2="150" class="image" />
  </g>
</svg>