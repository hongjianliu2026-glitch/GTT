<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lifting</text>
  <text x="50" y="120" class="subtitle">[ˈlɪftɪŋ] n. 举起，提升；v. 举起，抬起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lift (举起) + -ing (动作进行)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大力士在健身房里，"举起(lift)"
    <tspan x="50" dy="25">一个巨大的杠铃，这个动作就是lifting。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He started lifting weights to build muscle.
  </text>
  <text x="50" y="310" class="content">
    他开始举重以增强肌肉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gym -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Weightlifting bar -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="280" cy="100" r="10" class="image" />
    <!-- Lifter -->
    <circle cx="175" cy="70" r="20" class="image" />
    <line x1="175" y1="90" x2="175" y2="130" class="image" />
    <line x1="175" y1="130" x2="150" y2="160" class="image" />
    <line x1="175" y1="130" x2="200" y2="160" class="image" />
    <line x1="175" y1="110" x2="140" y2="100" class="image" />
    <line x1="175" y1="110" x2="210" y2="100" class="image" />
  </g>
</svg>