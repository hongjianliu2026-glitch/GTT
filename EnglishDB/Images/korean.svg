<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Korean</text>
  <text x="50" y="120" class="subtitle">[kəˈriən] adj. 韩国的，韩国人的；n. 韩国人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Kore (韩国) + -an (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个韩国人(Korean)穿着传统的韩服，
    <tspan x="50" dy="25">站在首尔的景福宫前，背景是壮丽的韩国传统建筑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a Korean who loves kimchi.
  </text>
  <text x="50" y="310" class="content">
    她是一个热爱泡菜的韩国人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional Korean clothing -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Korean traditional hat -->
    <circle cx="75" cy="10" r="15" class="image" />
    <!-- Korean traditional building -->
    <rect x="180" y="0" width="200" height="200" class="image" />
    <rect x="200" y="20" width="160" height="160" class="image" />
    <rect x="220" y="40" width="120" height="120" class="image" />
    <!-- Korean person -->
    <circle cx="75" cy="150" r="15" class="image" />
    <line x1="75" y1="165" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="60" y2="230" class="image" />
    <line x1="75" y1="200" x2="90" y2="230" class="image" />
    <line x1="75" y1="180" x2="100" y2="170" class="image" />
  </g>
</svg>