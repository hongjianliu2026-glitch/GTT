<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">curiosity</text>
  <text x="50" y="120" class="subtitle">[ˌkjʊriˈɒsəti] n. 好奇心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> curi (关心) + -osity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在博物馆里，"关心(curi)"
    <tspan x="50" dy="25">每一个展品，不停地问问题，这就是好奇心(curiosity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her curiosity about ancient cultures led her to study archaeology.
  </text>
  <text x="50" y="310" class="content">
    她对古代文化的好奇心促使她学习考古学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Museum -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Exhibit -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Child -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Question marks -->
    <text x="70" y="50" class="image" font-size="40">?</text>
    <text x="120" y="80" class="image" font-size="40">?</text>
    <text x="170" y="110" class="image" font-size="40">?</text>
  </g>
</svg>