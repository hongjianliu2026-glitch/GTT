<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liquidation</text>
  <text x="50" y="120" class="subtitle">[ˌlɪkwɪˈdeɪʃn] n. 清算，清偿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liquid (液体) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一家公司因为债务问题，所有资产都被"液化(liquid)"成现金，
    <tspan x="50" dy="25">用来偿还债务，这就是清算(liquidation)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company went into liquidation after failing to pay its debts.
  </text>
  <text x="50" y="310" class="content">
    公司因无力偿还债务而进入清算。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Liquidation process -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Money bags -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- Liquid pouring -->
    <line x1="75" y1="70" x2="75" y2="150" class="image" />
    <line x1="145" y1="70" x2="145" y2="150" class="image" />
    <line x1="215" y1="70" x2="215" y2="150" class="image" />
    <!-- Liquid pool -->
    <ellipse cx="175" cy="180" rx="100" ry="20" class="image" />
  </g>
</svg>