<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enough</text>
  <text x="50" y="120" class="subtitle">[ɪˈnʌf] adj. 足够的，充足的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + ough (足够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装满食物的盘子，"使(en-)"
    <tspan x="50" dy="25">食物"足够(ough)"，让人感到满足。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There is enough food for everyone.
  </text>
  <text x="50" y="310" class="content">
    有足够的食物给每个人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Smiley face -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="285" y1="90" x2="315" y2="90" class="image" />
    <line x1="285" y1="110" x2="315" y2="110" class="image" />
    <path d="M285,120 Q300,130 315,120" class="image" />
  </g>
</svg>