<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bedroom</text>
  <text x="50" y="120" class="subtitle">[ˈbɛdˌrum] n. 卧室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bed (床) + room (房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里有一张床，这就是一个"床房间(bed-room)"，
    <tspan x="50" dy="25">专门用来睡觉的地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decorated her bedroom with soft colors.
  </text>
  <text x="50" y="310" class="content">
    她用柔和的颜色装饰了她的卧室。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="250" class="image" />
    <!-- Bed -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Pillows -->
    <rect x="60" y="60" width="40" height="30" class="image" />
    <rect x="110" y="60" width="40" height="30" class="image" />
    <!-- Blanket -->
    <rect x="50" y="150" width="250" height="10" class="image" />
  </g>
</svg>