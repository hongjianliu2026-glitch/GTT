<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spark</text>
  <text x="50" y="120" class="subtitle">[spɑːrk] n. 火花，火星；v. 触发，激发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sp- (飞溅) + -ark (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个火花(spark)从火柴上飞溅(sp-)出来，
    <tspan x="50" dy="25">瞬间点亮了整个房间，激发(spark)了人们的灵感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The match sparked a fire that lit up the room.
  </text>
  <text x="50" y="310" class="content">
    火柴点燃了火，照亮了整个房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Matchstick -->
    <rect x="0" y="0" width="50" height="150" class="image" />
    <!-- Flame -->
    <polygon points="25,0 10,30 40,30" class="image" />
    <!-- Spark -->
    <circle cx="25" cy="30" r="5" class="image" />
    <circle cx="20" cy="25" r="3" class="image" />
    <circle cx="30" cy="25" r="3" class="image" />
    <circle cx="15" cy="20" r="2" class="image" />
    <circle cx="35" cy="20" r="2" class="image" />
  </g>
</svg>