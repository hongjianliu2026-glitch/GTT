<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resumption</text>
  <text x="50" y="120" class="subtitle">[rɪˈzʌmpʃən] n. 恢复，重新开始</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sumpt (拿) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在休息后，"再次拿起(re-sumpt)"
    <tspan x="50" dy="25">工作，重新开始(resumption)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The resumption of the meeting after lunch was smooth.
  </text>
  <text x="50" y="310" class="content">
    午饭后会议的重新开始很顺利。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person resting -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Work table -->
    <rect x="100" y="80" width="200" height="100" class="image" />
    <!-- Work items -->
    <rect x="120" y="100" width="30" height="30" class="image" />
    <rect x="160" y="100" width="30" height="30" class="image" />
    <rect x="200" y="100" width="30" height="30" class="image" />
    <!-- Person resuming work -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="210" class="image" />
    <line x1="150" y1="210" x2="130" y2="250" class="image" />
    <line x1="150" y1="210" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />
  </g>
</svg>