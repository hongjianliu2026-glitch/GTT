<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fireman</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪərmən] n. 消防员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fire (火) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的消防员，"面对火(fire)"
    <tspan x="50" dy="25">海，他毫不畏惧，勇敢地冲进去救人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fireman bravely rescued the trapped children from the burning building.
  </text>
  <text x="50" y="310" class="content">
    消防员勇敢地从燃烧的建筑物中救出了被困的孩子们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fireman -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Fire -->
    <path d="M70 50 C80 30, 100 30, 110 50 S130 70, 140 50" class="image" />
    <path d="M70 70 C80 50, 100 50, 110 70 S130 90, 140 70" class="image" />
    <path d="M70 90 C80 70, 100 70, 110 90 S130 110, 140 90" class="image" />
    <!-- Building -->
    <rect x="160" y="50" width="100" height="100" class="image" />
    <line x1="170" y1="60" x2="250" y2="60" class="image" />
    <line x1="170" y1="80" x2="250" y2="80" class="image" />
    <line x1="170" y1="100" x2="250" y2="100" class="image" />
    <line x1="170" y1="120" x2="250" y2="120" class="image" />
  </g>
</svg>