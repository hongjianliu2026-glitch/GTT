<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">die-hard</text>
  <text x="50" y="120" class="subtitle">[daɪˈhɑrd] adj. 顽固的，不屈不挠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> die (死) + hard (硬的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个顽固的人，即使面对死亡(die)，
    <tspan x="50" dy="25">他的意志也像石头一样坚硬(hard)，绝不屈服。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a die-hard fan of the team and never misses a game.
  </text>
  <text x="50" y="310" class="content">
    他是那个队伍的铁杆粉丝，从不缺席任何一场比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone -->
    <rect x="0" y="0" width="150" height="150" class="image" />
    <!-- Skull -->
    <circle cx="75" cy="75" r="50" class="image" />
    <line x1="50" y1="75" x2="100" y2="75" class="image" />
    <line x1="75" y1="50" x2="75" y2="100" class="image" />
    <!-- Crossbones -->
    <line x1="25" y1="25" x2="125" y2="125" class="image" />
    <line x1="25" y1="125" x2="125" y2="25" class="image" />
  </g>
</svg>