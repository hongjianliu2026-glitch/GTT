<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pavilion</text>
  <text x="50" y="120" class="subtitle">[pəˈvɪliən] n. 亭子，大帐篷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pav (保护) + ilion (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的帐篷(pavilion)，它像一个"保护(pav)"
    <tspan x="50" dy="25">小(ilion)"世界，为人们提供遮蔽和休息的地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wedding ceremony was held in a beautiful pavilion by the lake.
  </text>
  <text x="50" y="310" class="content">
    婚礼仪式在湖边的一个美丽的亭子里举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pavilion -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,20 300,20 320,180 30,180" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="30" y1="180" x2="320" y2="180" class="image" />
    <!-- People inside -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="100" y1="130" x2="120" y2="120" class="image" />
    <line x1="200" y1="130" x2="180" y2="120" class="image" />
  </g>
</svg>