<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brim</text>
  <text x="50" y="120" class="subtitle">[brɪm] n. 边缘，帽檐；v. 充满</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brim (边缘)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一顶帽子，帽檐(brim)宽大到可以遮住整个天空，
    <tspan x="50" dy="25">仿佛整个世界都被这顶帽子的边缘所包围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cup was brimming with coffee.
  </text>
  <text x="50" y="310" class="content">
    杯子里盛满了咖啡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hat brim -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Hat body -->
    <circle cx="175" cy="50" r="50" class="image" />
    <!-- Sky -->
    <rect x="0" y="50" width="350" height="200" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="100" rx="50" ry="25" class="image" />
    <ellipse cx="250" cy="120" rx="60" ry="30" class="image" />
  </g>
</svg>