<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unequivocal</text>
  <text x="50" y="120" class="subtitle">[ˌʌnɪˈkwɪvəkəl] adj. 明确的，毫不含糊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + equi- (平等) + voc (声音) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在舞台上，用"毫不含糊(unequivocal)"的声音
    <tspan x="50" dy="25">宣布一个决定，声音清晰且没有歧义，就像一个响亮的喇叭。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His response was unequivocal: "Yes, I will do it."
  </text>
  <text x="50" y="310" class="content">
    他的回答是明确的：“是的，我会去做。”
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="80" r="20" class="image" />
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="120" x2="220" y2="110" class="image" />
    <!-- Loudspeaker -->
    <rect x="250" y="50" width="50" height="100" class="image" />
    <line x1="275" y1="50" x2="275" y2="30" class="image" />
    <line x1="275" y1="30" x2="250" y2="20" class="image" />
    <line x1="275" y1="30" x2="300" y2="20" class="image" />
  </g>
</svg>