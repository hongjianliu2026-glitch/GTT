<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ill</text>
  <text x="50" y="120" class="subtitle">[ɪl] adj. 生病的，坏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "in" (不) + "salus" (健康)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在床上，脸色苍白，"不健康(ill)"
    <tspan x="50" dy="25">的状态让他无法动弹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He felt ill after eating the spoiled food.
  </text>
  <text x="50" y="310" class="content">
    他吃了变质的食物后感到不适。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on bed -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Face -->
    <circle cx="175" cy="90" r="5" class="image" />
    <circle cx="190" cy="90" r="5" class="image" />
    <line x1="175" y1="110" x2="190" y2="110" class="image" />
  </g>
</svg>