<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perfectionism</text>
  <text x="50" y="120" class="subtitle">[pərˈfekʃəˌnɪzəm] n. 完美主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + fection (做) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完美主义者，"完全地做(per-fection)"
    <tspan x="50" dy="25">每件事都力求完美，这种追求极致的态度就是完美主义(perfectionism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His perfectionism often leads to excessive stress.
  </text>
  <text x="50" y="310" class="content">
    他的完美主义常常导致过度的压力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="80" y1="100" x2="150" y2="100" class="image" />
    <!-- Perfect circle -->
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Person -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="260" class="image" />
    <line x1="100" y1="260" x2="80" y2="300" class="image" />
    <line x1="100" y1="260" x2="120" y2="300" class="image" />
    <line x1="100" y1="240" x2="140" y2="230" class="image" />
    <line x1="100" y1="240" x2="60" y2="230" class="image" />
  </g>
</svg>