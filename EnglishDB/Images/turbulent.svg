<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turbulent</text>
  <text x="50" y="120" class="subtitle">[ˈtɜːrbyələnt] adj. 动荡的，混乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turb (搅动) + -ulent (充满的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在"搅动(turb)"的海面上航行，
    <tspan x="50" dy="25">海浪汹涌，船身摇摆不定，这就是"动荡的(turbulent)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The turbulent waters made the journey dangerous.
  </text>
  <text x="50" y="310" class="content">
    动荡的水域使旅程变得危险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean waves -->
    <path d="M0 100 Q100 200 200 100 T400 100" class="image" />
    <path d="M0 150 Q100 250 200 150 T400 150" class="image" />
    <path d="M0 200 Q100 300 200 200 T400 200" class="image" />
    <!-- Boat -->
    <rect x="150" y="70" width="100" height="30" class="image" />
    <line x1="150" y1="70" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="250" y2="70" class="image" />
    <!-- Sail -->
    <polygon points="200,50 180,70 220,70" class="image" />
  </g>
</svg>