<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contract</text>
  <text x="50" y="120" class="subtitle">[ˈkɒntrækt] n. 合同，契约；v. 收缩，缩小</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tract (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在签署合同，"一起拉(con-tract)"
    <tspan x="50" dy="25">紧了彼此的利益，合同(contract)就形成了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They signed a contract to build the new bridge.
  </text>
  <text x="50" y="310" class="content">
    他们签署了一份建造新桥的合同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Contract paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two people shaking hands -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <!-- Contract lines -->
    <line x1="20" y1="20" x2="330" y2="20" class="image" />
    <line x1="20" y1="50" x2="330" y2="50" class="image" />
    <line x1="20" y1="80" x2="330" y2="80" class="image" />
    <line x1="20" y1="110" x2="330" y2="110" class="image" />
    <line x1="20" y1="140" x2="330" y2="140" class="image" />
  </g>
</svg>