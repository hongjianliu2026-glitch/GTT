<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recline</text>
  <text x="50" y="120" class="subtitle">[rɪˈklaɪn] v. 向后靠，斜倚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + clin (倾斜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在沙发上，"向后倾斜(re-clin)"
    <tspan x="50" dy="25">身体，享受片刻的放松。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She reclined on the couch after a long day at work.
  </text>
  <text x="50" y="310" class="content">
    她在工作了一整天后斜靠在沙发上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Couch -->
    <rect x="0" y="100" width="350" height="100" class="image" />
    <!-- Person reclining -->
    <circle cx="100" cy="80" r="20" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="120" x2="140" y2="110" class="image" />
    <!-- Head leaning back -->
    <line x1="100" y1="80" x2="120" y2="60" class="image" />
  </g>
</svg>