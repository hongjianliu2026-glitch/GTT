<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alarmingly</text>
  <text x="50" y="120" class="subtitle">[əˈlɑːrmɪŋli] adv. 令人担忧地，令人惊恐地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alar(m) (警报) + -ing (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警报器在疯狂地响，"令人担忧地(alarmingly)"
    <tspan x="50" dy="25">提醒人们有危险的事情正在发生。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The situation is developing alarmingly fast.
  </text>
  <text x="50" y="310" class="content">
    情况正在以令人担忧的速度发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Alarm bell -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <!-- Sound waves -->
    <ellipse cx="50" cy="20" rx="40" ry="10" class="image" />
    <ellipse cx="50" cy="10" rx="50" ry="15" class="image" />
    <ellipse cx="50" cy="0" rx="60" ry="20" class="image" />
  </g>
</svg>