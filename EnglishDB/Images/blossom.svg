<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
      .flower { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blossom</text>
  <text x="50" y="120" class="subtitle">[ˈblɒsəm] n. 花，开花；v. 开花，繁荣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "blosme"，意为“开花”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵花在春天里“绽放(blossom)”，
    <tspan x="50" dy="25">它的美丽和生机让人感到无比的喜悦。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cherry trees blossomed beautifully this year.
  </text>
  <text x="50" y="310" class="content">
    今年樱花树开得非常美丽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower -->
    <circle cx="50" cy="50" r="30" class="flower" />
    <circle cx="80" cy="50" r="30" class="flower" />
    <circle cx="65" cy="80" r="30" class="flower" />
    <circle cx="50" cy="110" r="30" class="flower" />
    <circle cx="80" cy="110" r="30" class="flower" />
    <!-- Stem -->
    <line x1="65" y1="140" x2="65" y2="200" class="image" />
    <!-- Leaves -->
    <path d="M65,140 Q80,130 65,120 Q50,130 65,140" class="image" />
    <path d="M65,160 Q80,170 65,180 Q50,170 65,160" class="image" />
  </g>
</svg>