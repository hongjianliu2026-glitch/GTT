<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pumping</text>
  <text x="50" y="120" class="subtitle">[ˈpʌmpɪŋ] n. 泵送，抽吸；v. 泵送，抽吸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pump (泵) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的泵在不停地"泵送(pump-ing)"
    <tspan x="50" dy="25">液体，液体像瀑布一样喷涌而出，场面壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oil rig was pumping non-stop.
  </text>
  <text x="50" y="310" class="content">
    油井一直在不停地泵送。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pump -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="75" y1="100" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="50" y2="250" class="image" />
    <line x1="75" y1="200" x2="100" y2="250" class="image" />
    <!-- Liquid -->
    <path d="M50,250 Q75,220 100,250" class="image" />
    <path d="M50,260 Q75,230 100,260" class="image" />
    <path d="M50,270 Q75,240 100,270" class="image" />
  </g>
</svg>