<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pickle</text>
  <text x="50" y="120" class="subtitle">[ˈpɪkl] n. 腌菜，困境；v. 腌制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pick (挑选) + -le (表示小或反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在挑选(pick)最好的黄瓜，然后反复(le)
    <tspan x="50" dy="25">腌制它们，最终变成了美味的腌菜(pickle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She put the cucumbers in a jar to pickle them.
  </text>
  <text x="50" y="310" class="content">
    她把黄瓜放进罐子里腌制。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jar -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Cucumber -->
    <ellipse cx="100" cy="150" rx="50" ry="100" class="image" />
    <!-- Brine -->
    <line x1="20" y1="200" x2="180" y2="200" class="image" />
    <line x1="20" y1="230" x2="180" y2="230" class="image" />
    <line x1="20" y1="260" x2="180" y2="260" class="image" />
    <line x1="20" y1="290" x2="180" y2="290" class="image" />
    <!-- Farmer -->
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="250" y1="170" x2="250" y2="220" class="image" />
    <line x1="250" y1="220" x2="230" y2="250" class="image" />
    <line x1="250" y1="220" x2="270" y2="250" class="image" />
    <line x1="250" y1="190" x2="290" y2="180" class="image" />
  </g>
</svg>