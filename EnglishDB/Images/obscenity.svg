<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obscenity</text>
  <text x="50" y="120" class="subtitle">[əbˈsɛnɪti] n. 淫秽，下流</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (反对) + scen (场景) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，"反对(ob-)"展示"场景(scen)"中的"下流(obscenity)"内容，
    <tspan x="50" dy="25">这些内容让人感到不适和反感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was criticized for its obscenity.
  </text>
  <text x="50" y="310" class="content">
    这部电影因淫秽内容而受到批评。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red cross -->
    <line x1="50" y1="50" x2="250" y2="250" class="image" />
    <line x1="50" y1="250" x2="250" y2="50" class="image" />
    <!-- Scene -->
    <rect x="100" y="100" width="150" height="100" class="image" />
    <!-- Exclamation marks -->
    <text x="120" y="150" class="highlight">!!!</text>
  </g>
</svg>