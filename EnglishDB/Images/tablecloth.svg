<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tablecloth</text>
  <text x="50" y="120" class="subtitle">[ˈteɪblklɒθ] n. 桌布</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> table (桌子) + cloth (布)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张桌子(table)上铺着一块布(cloth)，
    <tspan x="50" dy="25">这块布就是桌布(tablecloth)，保护桌子不被弄脏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spread a beautiful tablecloth on the dining table.
  </text>
  <text x="50" y="310" class="content">
    她在餐桌上铺了一块漂亮的桌布。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Table -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Tablecloth -->
    <rect x="20" y="20" width="260" height="160" class="image" fill="#F1C40F" />
    <!-- Table legs -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="250" y1="200" x2="250" y2="250" class="image" />
  </g>
</svg>