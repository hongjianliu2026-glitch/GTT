<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jolt</text>
  <text x="50" y="120" class="subtitle">[dʒoʊlt] v. 使震动，使颠簸；n. 震动，颠簸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jol (震动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆老旧的汽车在崎岖的道路上行驶，"震动(jol)"
    <tspan x="50" dy="25">得让人几乎无法坐稳，这就是jolt的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sudden jolt of the car woke him up.
  </text>
  <text x="50" y="310" class="content">
    汽车的突然颠簸把他惊醒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="100" y="50" width="150" height="70" class="image" />
    <!-- Wheels -->
    <circle cx="120" cy="120" r="20" class="image" />
    <circle cx="230" cy="120" r="20" class="image" />
    <!-- Bump -->
    <rect x="170" y="100" width="10" height="20" class="image" />
    <!-- Shock -->
    <line x1="175" y1="100" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="165" y2="130" class="image" />
    <line x1="175" y1="120" x2="185" y2="130" class="image" />
  </g>
</svg>