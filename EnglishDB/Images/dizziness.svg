<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dizziness</text>
  <text x="50" y="120" class="subtitle">[ˈdɪzinəs] n. 头晕，眩晕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dizz (头晕) + -iness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在旋转木马上，"头晕目眩(dizziness)"，
    <tspan x="50" dy="25">感觉整个世界都在旋转。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sudden change in altitude caused dizziness.
  </text>
  <text x="50" y="310" class="content">
    突然的海拔变化导致了头晕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rotating carousel -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <line x1="175" y1="100" x2="95" y2="100" class="image" />
    <line x1="175" y1="100" x2="235" y2="180" class="image" />
    <line x1="175" y1="100" x2="115" y2="180" class="image" />
    <!-- Person feeling dizzy -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>