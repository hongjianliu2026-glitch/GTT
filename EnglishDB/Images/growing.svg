<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">growing</text>
  <text x="50" y="120" class="subtitle">[ˈɡroʊɪŋ] adj. 成长的，增长的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grow (生长) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗小种子在土壤中"生长(grow)"，
    <tspan x="50" dy="25">逐渐变成一棵高大的树，这就是"成长的(growing)"过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is experiencing a growing demand for its products.
  </text>
  <text x="50" y="310" class="content">
    公司正在经历对其产品日益增长的需求。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soil -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#8B4513" />
    <!-- Seed -->
    <circle cx="175" cy="140" r="10" class="image" fill="#008000" />
    <!-- Growing plant -->
    <line x1="175" y1="140" x2="175" y2="50" class="image" />
    <line x1="175" y1="50" x2="160" y2="70" class="image" />
    <line x1="175" y1="50" x2="190" y2="70" class="image" />
    <line x1="175" y1="50" x2="150" y2="90" class="image" />
    <line x1="175" y1="50" x2="200" y2="90" class="image" />
    <!-- Leaves -->
    <path d="M175,50 Q160,30 175,10 Q190,30 175,50" class="image" fill="#2ECC71" />
    <path d="M175,50 Q160,70 175,90 Q190,70 175,50" class="image" fill="#2ECC71" />
  </g>
</svg>