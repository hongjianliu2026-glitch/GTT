<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">permissive</text>
  <text x="50" y="120" class="subtitle">[pərˈmɪsɪv] adj. 宽容的，放任的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + miss (送出) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完全放任(per-missive)的父母，允许孩子随意送出(miss)
    <tspan x="50" dy="25">他们的玩具，这种宽容的态度就是permissive。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The permissive parenting style allows children to make their own decisions.
  </text>
  <text x="50" y="310" class="content">
    这种宽容的育儿方式允许孩子们自己做决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parent -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />

    <!-- Child -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="140" x2="180" y2="120" class="image" />
    <line x1="200" y1="140" x2="220" y2="120" class="image" />
    <line x1="200" y1="160" x2="180" y2="180" class="image" />
    <line x1="200" y1="160" x2="220" y2="180" class="image" />

    <!-- Toy -->
    <rect x="250" y="80" width="40" height="40" class="image" />
    <line x1="270" y1="80" x2="270" y2="40" class="image" />
    <line x1="270" y1="40" x2="250" y2="20" class="image" />
    <line x1="270" y1="40" x2="290" y2="20" class="image" />

    <!-- Arrow -->
    <line x1="220" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,100 245,95 245,105" class="image" />
  </g>
</svg>