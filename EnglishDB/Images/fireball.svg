<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fireball</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪərbɔːl] n. 火球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fire (火) + ball (球)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的火球从天而降，"火(fire)"
    <tspan x="50" dy="25">和"球(ball)"的结合，形成了一个炽热的火球(fireball)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meteorite exploded into a fireball in the sky.
  </text>
  <text x="50" y="310" class="content">
    陨石在天空中爆炸成一个火球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fireball -->
    <circle cx="100" cy="100" r="50" class="fire" />
    <!-- Flames -->
    <path d="M 100 50 Q 150 20 100 0 Q 50 20 100 50" class="fire" />
    <path d="M 100 100 Q 150 70 100 50 Q 50 70 100 100" class="fire" />
    <path d="M 100 150 Q 150 120 100 100 Q 50 120 100 150" class="fire" />
  </g>
</svg>