<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sportsmanship</text>
  <text x="50" y="120" class="subtitle">[ˈspɔːrtsmənʃɪp] n. 体育精神，运动家风度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sport (运动) + -man (人) + -ship (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在比赛中，即使落后也保持微笑，"展现(sport-man-ship)"
    <tspan x="50" dy="25">出高尚的体育精神(sportsmanship)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His sportsmanship was evident when he congratulated the winner.
  </text>
  <text x="50" y="310" class="content">
    他在祝贺获胜者时展现出了他的体育精神。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Athlete -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Smile -->
    <path d="M40,90 Q50,80 60,90" class="image" />
    <!-- Medal -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <!-- Handshake -->
    <line x1="200" y1="150" x2="250" y2="150" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
  </g>
</svg>