<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">medley</text>
  <text x="50" y="120" class="subtitle">[ˈmɛdli] n. 混合物，杂烩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medl (混合) + -ey (表示状态或性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的碗，里面装满了各种不同的食物，"混合(medl)"在一起，
    <tspan x="50" dy="25">形成了一道美味的杂烩(medley)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concert featured a medley of popular songs.
  </text>
  <text x="50" y="310" class="content">
    音乐会上演奏了一组流行歌曲的混合曲目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Mixed foods -->
    <circle cx="100" cy="80" r="20" class="image" /> <!-- Apple -->
    <rect x="130" y="60" width="40" height="40" class="image" /> <!-- Carrot -->
    <circle cx="200" cy="90" r="25" class="image" /> <!-- Orange -->
    <rect x="240" y="70" width="30" height="30" class="image" /> <!-- Potato -->
    <circle cx="280" cy="85" r="15" class="image" /> <!-- Cherry -->
  </g>
</svg>