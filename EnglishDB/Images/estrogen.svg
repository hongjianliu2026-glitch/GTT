<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">estrogen</text>
  <text x="50" y="120" class="subtitle">[ˈɛstrədʒən] n. 雌激素</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> estro- (雌性) + gen (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个雌性生物体内，"雌性产生(estro-gen)"
    <tspan x="50" dy="25">的激素，这种激素就是雌激素(estrogen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Estrogen levels can fluctuate during a woman's menstrual cycle.
  </text>
  <text x="50" y="310" class="content">
    雌激素水平会在女性的月经周期中波动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Female symbol -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="50" y1="90" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <!-- Hormone molecule -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="240" cy="100" r="10" class="image" />
    <line x1="210" y1="110" x2="230" y2="110" class="image" />
    <line x1="210" y1="90" x2="230" y2="90" class="image" />
  </g>
</svg>