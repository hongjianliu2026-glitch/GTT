<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">replace</text>
  <text x="50" y="120" class="subtitle">[rɪˈpleɪs] v. 替换，取代</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + place (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人正在"再次放置(re-place)"
    <tspan x="50" dy="25">一个新的零件，替换掉旧的，这就是替换(replace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old machine was replaced with a new one.
  </text>
  <text x="50" y="310" class="content">
    旧机器被新机器替换了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old machine -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <text x="20" y="50" class="content">Old</text>
    <!-- New machine -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <text x="220" y="50" class="content">New</text>
    <!-- Arrow -->
    <line x1="160" y1="50" x2="190" y2="50" class="image" />
    <polygon points="190,45 200,50 190,55" class="image" />
  </g>
</svg>