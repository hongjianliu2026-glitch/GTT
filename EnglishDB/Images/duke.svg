<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">duke</text>
  <text x="50" y="120" class="subtitle">[djuːk] n. 公爵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> du- (来自拉丁语 dux, 意为“领导者”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个公爵(duke)，他身穿华丽的斗篷，
    <tspan x="50" dy="25">手持权杖，站在城堡的高塔上，俯视着他的领地。</tspan>
    <tspan x="50" dy="25">他是一个领导者(dux)，统治着他的王国。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The duke held a grand banquet in his castle.
  </text>
  <text x="50" y="310" class="content">
    公爵在他的城堡里举办了一场盛大的宴会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle tower -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Duke -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Cloak -->
    <path d="M180,120 Q190,80 220,120" class="image" />
    <!-- Scepter -->
    <line x1="200" y1="120" x2="250" y2="70" class="image" />
    <circle cx="250" cy="70" r="10" class="image" />
  </g>
</svg>