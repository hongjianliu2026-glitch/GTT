<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">child</text>
  <text x="50" y="120" class="subtitle">[tʃaɪld] n. 孩子，儿童</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chil- (来自古英语 cild，意为“孩子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在草地上奔跑，"chil-"
    <tspan x="50" dy="25">这个词根让我们联想到天真无邪的童年时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child was playing joyfully in the park.
  </text>
  <text x="50" y="310" class="content">
    孩子在公园里快乐地玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#27AE60" />
    <!-- Child -->
    <circle cx="100" cy="120" r="20" class="image" fill="#F1C40F" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="160" x2="70" y2="150" class="image" />
    <line x1="100" y1="160" x2="130" y2="150" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F39C12" />
    <line x1="300" y1="80" x2="300" y2="120" class="image" />
    <line x1="280" y1="90" x2="240" y2="80" class="image" />
    <line x1="320" y1="90" x2="360" y2="80" class="image" />
    <line x1="280" y1="110" x2="240" y2="120" class="image" />
    <line x1="320" y1="110" x2="360" y2="120" class="image" />
  </g>
</svg>