<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shady</text>
  <text x="50" y="120" class="subtitle">[ˈʃeɪdi] adj. 阴暗的，可疑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shad (阴影) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的人站在树荫下，"阴影(shad)"
    <tspan x="50" dy="25">笼罩着他，给人一种阴暗、可疑的感觉(shady)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shady character was lurking in the alley.
  </text>
  <text x="50" y="310" class="content">
    那个可疑的人物在巷子里潜伏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <ellipse cx="50" cy="20" rx="40" ry="20" class="image" />
    <!-- Shadow -->
    <rect x="100" y="100" width="200" height="100" class="image" />
    <!-- Person -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="190" class="image" />
    <line x1="150" y1="190" x2="130" y2="220" class="image" />
    <line x1="150" y1="190" x2="170" y2="220" class="image" />
    <line x1="150" y1="180" x2="190" y2="170" class="image" />
  </g>
</svg>