<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alluring</text>
  <text x="50" y="120" class="subtitle">[əˈlʊrɪŋ] adj. 迷人的，吸引人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (朝向) + lure (引诱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个美丽的花园，"朝向(al-)"
    <tspan x="50" dy="25">引诱(lure)"人们走进去，这就是迷人的(alluring)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The alluring scent of roses filled the garden.
  </text>
  <text x="50" y="310" class="content">
    迷人的玫瑰香气充满了花园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flowers -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="120" r="25" class="image" />
    <circle cx="150" cy="80" r="30" class="image" />
    <circle cx="200" cy="110" r="25" class="image" />
    <circle cx="250" cy="90" r="20" class="image" />
    <!-- Person -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="330" y2="120" class="image" />
  </g>
</svg>