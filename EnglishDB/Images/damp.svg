<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">damp</text>
  <text x="50" y="120" class="subtitle">[dæmp] adj. 潮湿的；v. 使潮湿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> damp (潮湿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，"潮湿(damp)"的空气让墙壁都滴下水珠，
    <tspan x="50" dy="25">整个房间都变得湿漉漉的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The towel was damp after being used.
  </text>
  <text x="50" y="310" class="content">
    毛巾用过后变得潮湿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dripping water -->
    <circle cx="50" cy="50" r="10" class="water" />
    <circle cx="80" cy="70" r="10" class="water" />
    <circle cx="110" cy="90" r="10" class="water" />
    <circle cx="140" cy="110" r="10" class="water" />
    <circle cx="170" cy="130" r="10" class="water" />
    <circle cx="200" cy="150" r="10" class="water" />
    <!-- Wet wall -->
    <rect x="250" y="20" width="80" height="160" class="image" />
    <line x1="260" y1="30" x2="260" y2="170" class="image" />
    <line x1="280" y1="30" x2="280" y2="170" class="image" />
    <line x1="300" y1="30" x2="300" y2="170" class="image" />
    <line x1="320" y1="30" x2="320" y2="170" class="image" />
  </g>
</svg>