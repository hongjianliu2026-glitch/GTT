<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">china</text>
  <text x="50" y="120" class="subtitle">[ˈtʃaɪnə] n. 瓷器，中国</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中文“中国”的音译
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的瓷器工坊，工匠们正在精心制作瓷器，
    <tspan x="50" dy="25">这些精美的瓷器代表着中国的文化和工艺。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She collects antique china from various countries.
  </text>
  <text x="50" y="310" class="content">
    她收集来自不同国家的古董瓷器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pottery wheel -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Pottery -->
    <rect x="75" y="150" width="50" height="100" class="image" />
    <!-- Craftsman -->
    <circle cx="100" cy="300" r="15" class="image" />
    <line x1="100" y1="315" x2="100" y2="350" class="image" />
    <line x1="100" y1="350" x2="80" y2="380" class="image" />
    <line x1="100" y1="350" x2="120" y2="380" class="image" />
    <line x1="100" y1="330" x2="130" y2="320" class="image" />
  </g>
</svg>