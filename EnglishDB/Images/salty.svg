<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">salty</text>
  <text x="50" y="120" class="subtitle">[ˈsɔːlti] adj. 咸的，含盐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sal (盐) + -ty (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，不小心把一大勺盐"撒(sal)"进了汤里，
    <tspan x="50" dy="25">结果汤变得非常咸(salty)，让人难以入口。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soup was too salty for my taste.
  </text>
  <text x="50" y="310" class="content">
    这汤对我来说太咸了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Spoon with salt -->
    <rect x="70" y="80" width="30" height="10" class="image" />
    <line x1="85" y1="80" x2="85" y2="50" class="image" />
    <circle cx="85" cy="45" r="5" class="image" />
    <!-- Pot with salty soup -->
    <rect x="120" y="90" width="100" height="80" class="image" />
    <line x1="120" y1="130" x2="220" y2="130" class="image" />
    <line x1="120" y1="130" x2="120" y2="170" class="image" />
    <line x1="220" y1="130" x2="220" y2="170" class="image" />
    <line x1="120" y1="170" x2="220" y2="170" class="image" />
  </g>
</svg>