<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">audiotape</text>
  <text x="50" y="120" class="subtitle">[ˈɔːdiəʊteɪp] n. 录音带</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> audio- (声音) + tape (带子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个录音带(tape)在播放，发出"声音(audio)"，
    <tspan x="50" dy="25">这个录音带就是audiotape。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He recorded the interview on an audiotape.
  </text>
  <text x="50" y="310" class="content">
    他把采访录在了录音带上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tape reel -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="300" cy="100" r="50" class="image" />
    <!-- Tape -->
    <rect x="150" y="50" width="150" height="100" class="image" />
    <!-- Sound waves -->
    <path d="M150 100 Q175 50, 200 100 T250 100" class="image" />
    <path d="M150 120 Q175 170, 200 120 T250 120" class="image" />
    <path d="M150 140 Q175 90, 200 140 T250 140" class="image" />
  </g>
</svg>