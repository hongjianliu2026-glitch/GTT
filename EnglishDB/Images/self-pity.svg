<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-pity</text>
  <text x="50" y="120" class="subtitle">[ˈsɛlf ˈpɪti] n. 自怜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + pity (怜悯)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人独自坐在角落，"自己怜悯自己(self-pity)"，
    <tspan x="50" dy="25">眼中含泪，沉浸在自己的悲伤中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wallowed in self-pity after the breakup.
  </text>
  <text x="50" y="310" class="content">
    分手后，她沉浸在自怜中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person sitting -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Tears -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <!-- Shadow -->
    <ellipse cx="50" cy="230" rx="30" ry="10" class="image" />
  </g>
</svg>