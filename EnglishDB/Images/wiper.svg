<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wiper</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪpər] n. 雨刷，擦拭器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wip (擦) + -er (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车在雨中行驶，"擦拭器(wiper)"
    <tspan x="50" dy="25">不停地来回擦拭挡风玻璃，保持视野清晰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wiper on the car was not working properly.
  </text>
  <text x="50" y="310" class="content">
    汽车的雨刷工作不正常。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Windshield -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Wiper -->
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <line x1="100" y1="80" x2="200" y2="80" class="image" />
    <line x1="100" y1="110" x2="200" y2="110" class="image" />
    <line x1="100" y1="140" x2="200" y2="140" class="image" />
    <!-- Rain drops -->
    <circle cx="70" cy="30" r="5" class="image" />
    <circle cx="120" cy="40" r="5" class="image" />
    <circle cx="170" cy="50" r="5" class="image" />
    <circle cx="220" cy="60" r="5" class="image" />
    <circle cx="270" cy="70" r="5" class="image" />
  </g>
</svg>