<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">afraid</text>
  <text x="50" y="120" class="subtitle">[əˈfreɪd] adj. 害怕的，担心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + frēd (和平)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一只巨大的怪兽追赶，"加强(a-)"
    <tspan x="50" dy="25">了内心的恐惧，失去了"和平(frēd)"，变得害怕(afraid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was afraid of the dark.
  </text>
  <text x="50" y="310" class="content">
    她害怕黑暗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="150" class="image" />
    <line x1="100" y1="180" x2="150" y2="150" class="image" />
    <!-- Person -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="280" y2="220" class="image" />
    <line x1="300" y1="180" x2="320" y2="220" class="image" />
    <line x1="300" y1="140" x2="280" y2="160" class="image" />
    <line x1="300" y1="140" x2="320" y2="160" class="image" />
    <!-- Fear expression -->
    <circle cx="290" cy="90" r="5" class="image" />
    <circle cx="310" cy="90" r="5" class="image" />
    <path d="M290 110 Q300 120 310 110" class="image" />
  </g>
</svg>