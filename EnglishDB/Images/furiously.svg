<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">furiously</text>
  <text x="50" y="120" class="subtitle">[ˈfjʊriəsli] adv. 狂怒地，猛烈地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fur (愤怒) + -ious (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为极度愤怒而"狂怒地(furiously)"
    <tspan x="50" dy="25">挥舞着拳头，周围的空气都因为他的怒火而颤抖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He drove furiously through the storm.
  </text>
  <text x="50" y="310" class="content">
    他在暴风雨中狂怒地驾驶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="30" y1="40" x2="40" y2="50" class="image" />
    <line x1="60" y1="40" x2="70" y2="50" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <line x1="50" y1="70" x2="50" y2="80" class="image" />
    <!-- Fist -->
    <rect x="100" y="20" width="50" height="50" class="image" />
    <line x1="125" y1="70" x2="125" y2="100" class="image" />
    <line x1="125" y1="100" x2="100" y2="120" class="image" />
    <line x1="125" y1="100" x2="150" y2="120" class="image" />
    <!-- Air trembling -->
    <line x1="200" y1="50" x2="250" y2="50" class="image" />
    <line x1="200" y1="60" x2="250" y2="60" class="image" />
    <line x1="200" y1="70" x2="250" y2="70" class="image" />
    <line x1="200" y1="80" x2="250" y2="80" class="image" />
  </g>
</svg>