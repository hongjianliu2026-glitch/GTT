<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yes</text>
  <text x="50" y="120" class="subtitle">[jes] adv. 是，是的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "yis"，意为肯定。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在回答问题时，脸上露出肯定的表情，
    <tspan x="50" dy="25">点头并说 "yes"，表示他同意或确认。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> "Do you want to go out tonight?" "Yes, I do."
  </text>
  <text x="50" y="310" class="content">
    "你今晚想出去吗？" "是的，我想。"
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Smile -->
    <path d="M 30 60 Q 50 80 70 60" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="40" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
    <!-- Body -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <!-- Arms -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Legs -->
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <!-- Speech bubble -->
    <path d="M 90 30 Q 150 30 150 70 Q 150 110 90 110 Q 50 110 50 70 Q 50 30 90 30" class="image" />
    <text x="100" y="60" class="content">yes</text>
  </g>
</svg>