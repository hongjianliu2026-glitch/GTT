<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rat</text>
  <text x="50" y="120" class="subtitle">[ræt] n. 老鼠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rat (源自中古英语 ratte)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只老鼠(rat)在厨房里偷偷摸摸地寻找食物，
    <tspan x="50" dy="25">它的尾巴在地板上拖动，发出轻微的沙沙声。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat caught a rat in the kitchen.
  </text>
  <text x="50" y="310" class="content">
    猫在厨房里抓到了一只老鼠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rat body -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Rat head -->
    <circle cx="50" cy="30" r="20" class="image" />
    <!-- Rat ears -->
    <polygon points="40,10 50,20 60,10" class="image" />
    <polygon points="40,15 50,25 60,15" class="image" />
    <!-- Rat eyes -->
    <circle cx="45" cy="25" r="3" class="image" />
    <circle cx="55" cy="25" r="3" class="image" />
    <!-- Rat nose -->
    <circle cx="50" cy="35" r="2" class="image" />
    <!-- Rat tail -->
    <path d="M 50,80 Q 70,100 50,120" class="image" />
  </g>
</svg>