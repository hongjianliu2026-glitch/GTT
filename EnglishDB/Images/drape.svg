<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drape</text>
  <text x="50" y="120" class="subtitle">[dreɪp] v. 覆盖，披上；n. 窗帘，帷幔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drap (布)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的布料从天而降，"覆盖(drape)"
    <tspan x="50" dy="25">整个房间，就像窗帘一样，柔软而优雅。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She draped a scarf over her shoulders.
  </text>
  <text x="50" y="310" class="content">
    她把围巾披在肩上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Draped cloth -->
    <path d="M50 50 Q100 0 150 50 T250 50" class="image" />
    <path d="M50 100 Q100 50 150 100 T250 100" class="image" />
    <path d="M50 150 Q100 100 150 150 T250 150" class="image" />
    <path d="M50 200 Q100 150 150 200 T250 200" class="image" />
    <!-- Room -->
    <rect x="0" y="200" width="350" height="100" class="image" />
    <!-- Window -->
    <rect x="100" y="220" width="150" height="60" class="image" />
  </g>
</svg>