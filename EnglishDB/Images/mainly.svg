<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mainly</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪnli] adv. 主要地，大部分</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> main (主要的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头指向一个中心点，表示"主要地(mainly)"
    <tspan x="50" dy="25">，所有的事物都围绕这个中心点展开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event was mainly attended by students.
  </text>
  <text x="50" y="310" class="content">
    这个活动主要是由学生参加的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Center point -->
    <circle cx="175" cy="100" r="20" class="image" />
    <!-- Arrows -->
    <line x1="175" y1="120" x2="175" y2="200" class="image" />
    <line x1="175" y1="120" x2="150" y2="150" class="image" />
    <line x1="175" y1="120" x2="200" y2="150" class="image" />
    <line x1="175" y1="120" x2="125" y2="180" class="image" />
    <line x1="175" y1="120" x2="225" y2="180" class="image" />
    <!-- Arrowheads -->
    <polygon points="175,200 170,190 180,190" class="image" />
    <polygon points="150,150 145,145 155,145" class="image" />
    <polygon points="200,150 195,145 205,145" class="image" />
    <polygon points="125,180 120,175 130,175" class="image" />
    <polygon points="225,180 220,175 230,175" class="image" />
  </g>
</svg>