<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">threaten</text>
  <text x="50" y="120" class="subtitle">[ˈθrɛtn] v. 威胁，恐吓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thres- (恐惧) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶霸站在你面前，"使你感到恐惧(thres-en)"，
    <tspan x="50" dy="25">他正在威胁(threaten)你。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He threatened to hurt her if she didn't obey.
  </text>
  <text x="50" y="310" class="content">
    他威胁说，如果她不服从，就会伤害她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bully -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Threat -->
    <line x1="120" y1="100" x2="200" y2="100" class="image" />
    <line x1="160" y1="100" x2="160" y2="150" class="image" />
    <line x1="160" y1="150" x2="140" y2="200" class="image" />
    <line x1="160" y1="150" x2="180" y2="200" class="image" />
    <!-- Victim -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="290" y2="130" class="image" />
  </g>
</svg>