<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bandwidth</text>
  <text x="50" y="120" class="subtitle">[ˈbændwɪdθ] n. 带宽，频宽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> band (带) + width (宽度)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条宽阔的"带子(band)"，它的"宽度(width)"决定了
    <tspan x="50" dy="25">信息传输的速度，这就是带宽(bandwidth)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new router has a higher bandwidth, allowing faster internet speeds.
  </text>
  <text x="50" y="310" class="content">
    新路由器有更高的带宽，允许更快的网速。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Band -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Width indicator -->
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <text x="175" y="80" class="content" text-anchor="middle">Width</text>
    <!-- Speed indicator -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <text x="175" y="120" class="content" text-anchor="middle">Speed</text>
  </g>
</svg>