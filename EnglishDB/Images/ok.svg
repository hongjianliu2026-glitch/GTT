<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ok</text>
  <text x="50" y="120" class="subtitle">[ˈoʊˈkeɪ] interj. 好的，可以</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无明显词根，源自19世纪美国英语，表示同意或确认。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在听到一个提议后，微笑着点头，并说"ok"，表示同意。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> "Can we meet at 3pm?" "Ok, that works for me."
  </text>
  <text x="50" y="310" class="content">
    "我们下午3点见面可以吗？" "好的，我这边没问题。"
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Smiling face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <circle cx="35" cy="40" r="5" class="image" />
    <circle cx="65" cy="40" r="5" class="image" />
    <path d="M35 60 Q50 80 65 60" class="image" />
    <!-- Thumbs up -->
    <line x1="100" y1="50" x2="120" y2="70" class="image" />
    <line x1="120" y1="70" x2="140" y2="50" class="image" />
    <line x1="120" y1="70" x2="120" y2="100" class="image" />
    <line x1="120" y1="100" x2="110" y2="90" class="image" />
    <line x1="120" y1="100" x2="130" y2="90" class="image" />
  </g>
</svg>