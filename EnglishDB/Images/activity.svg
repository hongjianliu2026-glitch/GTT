<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">activity</text>
  <text x="50" y="120" class="subtitle">[ækˈtɪvɪti] n. 活动，活跃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> act (行动) + -ivity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在公园里，"行动(act)"
    <tspan x="50" dy="25">起来，有的跑步，有的打球，</tspan>
    <tspan x="50" dy="25">这些行动构成了各种"活动(activity)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The school organized various activities for the students.
  </text>
  <text x="50" y="310" class="content">
    学校为学生们组织了各种活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People running -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="75" y1="50" x2="75" y2="80" class="image" />
    <line x1="75" y1="80" x2="50" y2="110" class="image" />
    <line x1="75" y1="80" x2="100" y2="110" class="image" />
    <!-- People playing ball -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
  </g>
</svg>