<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dexterity</text>
  <text x="50" y="120" class="subtitle">[dɛkˈstɛrɪti] n. 灵巧，敏捷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dextr- (右) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个杂技演员用右手(dextr-)
    <tspan x="50" dy="25">表演各种高难度动作，展现出非凡的灵巧(dexterity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her dexterity with the violin amazed the audience.
  </text>
  <text x="50" y="310" class="content">
    她拉小提琴的灵巧让观众惊叹不已。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Acrobat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="30" y2="140" class="image" />
    <line x1="50" y1="150" x2="70" y2="140" class="image" />
    <!-- Right hand -->
    <line x1="50" y1="120" x2="80" y2="100" class="image" />
    <line x1="80" y1="100" x2="100" y2="80" class="image" />
    <line x1="80" y1="100" x2="100" y2="120" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
  </g>
</svg>