<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carnivore</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrnɪvɔːr] n. 食肉动物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carn (肉) + i + vore (吃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狮子，它"吃肉(carn-vore)"，
    <tspan x="50" dy="25">这就是为什么它被称为食肉动物(carnivore)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Lions are apex carnivores in the African savannah.
  </text>
  <text x="50" y="310" class="content">
    狮子是非洲大草原上的顶级食肉动物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Back leg -->
    <line x1="50" y1="130" x2="20" y2="120" class="image" /> <!-- Tail -->
    <line x1="50" y1="130" x2="80" y2="120" class="image" /> <!-- Tail -->
    <!-- Meat -->
    <rect x="150" y="100" width="50" height="30" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="130" x2="200" y2="130" class="image" />
    <line x1="150" y1="100" x2="150" y2="130" class="image" />
    <line x1="200" y1="100" x2="200" y2="130" class="image" />
  </g>
</svg>