<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unresponsive</text>
  <text x="50" y="120" class="subtitle">[ˌʌnrɪˈspɒnsɪv] adj. 无反应的，不响应的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + response (反应) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个电脑屏幕上显示着"无响应(unresponsive)"，
    <tspan x="50" dy="25">而你无论怎么点击鼠标，它都毫无反应，就像一个僵尸一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unresponsive application froze my computer.
  </text>
  <text x="50" y="310" class="content">
    那个无响应的应用程序让我的电脑死机了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Computer screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Frozen screen -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Mouse cursor -->
    <circle cx="300" cy="100" r="10" class="image" />
    <!-- Click lines -->
    <line x1="300" y1="110" x2="300" y2="150" class="image" />
    <line x1="290" y1="120" x2="310" y2="120" class="image" />
    <!-- Zombie hand -->
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <line x1="75" y1="180" x2="75" y2="220" class="image" />
    <line x1="75" y1="220" x2="60" y2="240" class="image" />
    <line x1="75" y1="220" x2="90" y2="240" class="image" />
  </g>
</svg>