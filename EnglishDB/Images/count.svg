<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">count</text>
  <text x="50" y="120" class="subtitle">[kaʊnt] v. 数数，计算；n. 计数，总数</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + -t (拉丁语“to touch”，接触)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个数学家在黑板上，"一起接触(con-t)"
    <tspan x="50" dy="25">每一个数字，从1数到10，这就是计数(count)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She counted the number of apples in the basket.
  </text>
  <text x="50" y="310" class="content">
    她数了数篮子里的苹果数量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blackboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Numbers -->
    <text x="50" y="50" class="content">1</text>
    <text x="100" y="50" class="content">2</text>
    <text x="150" y="50" class="content">3</text>
    <text x="200" y="50" class="content">4</text>
    <text x="250" y="50" class="content">5</text>
    <text x="50" y="100" class="content">6</text>
    <text x="100" y="100" class="content">7</text>
    <text x="150" y="100" class="content">8</text>
    <text x="200" y="100" class="content">9</text>
    <text x="250" y="100" class="content">10</text>
    <!-- Mathematician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>