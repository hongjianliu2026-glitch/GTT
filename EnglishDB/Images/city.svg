<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">city</text>
  <text x="50" y="120" class="subtitle">[ˈsɪti] n. 城市</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cit (居住) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人聚集在一起，"居住(cit)"
    <tspan x="50" dy="25">在一个地方，这个地方就变成了一个城市(city)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She moved to the city to pursue her career.
  </text>
  <text x="50" y="310" class="content">
    她搬到了城市以追求她的职业生涯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="30" height="100" class="image" />
    <rect x="100" y="40" width="30" height="80" class="image" />
    <rect x="150" y="10" width="30" height="120" class="image" />
    <rect x="200" y="30" width="30" height="90" class="image" />
    <rect x="250" y="50" width="30" height="70" class="image" />
    <!-- People -->
    <circle cx="70" cy="130" r="5" class="image" />
    <circle cx="120" cy="110" r="5" class="image" />
    <circle cx="170" cy="130" r="5" class="image" />
    <circle cx="220" cy="120" r="5" class="image" />
    <circle cx="270" cy="140" r="5" class="image" />
  </g>
</svg>