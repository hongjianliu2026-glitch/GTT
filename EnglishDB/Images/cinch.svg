<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cinch</text>
  <text x="50" y="120" class="subtitle">[sɪntʃ] n. 容易做的事，有把握的事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cinch (来自西班牙语 "cincha"，意为“马肚带”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一匹马，马肚带(cinch)紧紧地绑在马肚子上，
    <tspan x="50" dy="25">这匹马轻松地奔跑，就像做一件容易的事(cinch)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Winning the race was a cinch for the experienced jockey.
  </text>
  <text x="50" y="310" class="content">
    对于经验丰富的骑师来说，赢得比赛是轻而易举的事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <line x1="100" y1="170" x2="50" y2="160" class="image" />
    <line x1="100" y1="170" x2="150" y2="160" class="image" />
    <!-- Cinch -->
    <line x1="20" y1="120" x2="180" y2="120" class="image" />
    <line x1="20" y1="120" x2="20" y2="140" class="image" />
    <line x1="180" y1="120" x2="180" y2="140" class="image" />
    <line x1="20" y1="140" x2="180" y2="140" class="image" />
  </g>
</svg>