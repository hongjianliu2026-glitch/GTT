<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">agrarian</text>
  <text x="50" y="120" class="subtitle">[əˈɡreəriən] adj. 土地的，农业的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> agri- (田地) + -arian (与...有关的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的田地(agri-)，农民们正在辛勤耕作，
    <tspan x="50" dy="25">他们的生活与土地紧密相连，这就是"土地的(agrarian)"生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government introduced new agrarian policies to support farmers.
  </text>
  <text x="50" y="310" class="content">
    政府推出了新的农业政策来支持农民。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Farmer -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Crops -->
    <line x1="100" y1="180" x2="120" y2="180" class="image" />
    <line x1="110" y1="160" x2="130" y2="160" class="image" />
    <line x1="120" y1="140" x2="140" y2="140" class="image" />
    <line x1="130" y1="120" x2="150" y2="120" class="image" />
    <line x1="140" y1="100" x2="160" y2="100" class="image" />
    <line x1="150" y1="80" x2="170" y2="80" class="image" />
    <line x1="160" y1="60" x2="180" y2="60" class="image" />
    <line x1="170" y1="40" x2="190" y2="40" class="image" />
    <line x1="180" y1="20" x2="200" y2="20" class="image" />
    <line x1="190" y1="0" x2="210" y2="0" class="image" />
  </g>
</svg>