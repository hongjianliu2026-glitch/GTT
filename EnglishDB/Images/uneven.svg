<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uneven</text>
  <text x="50" y="120" class="subtitle">[ʌnˈiːvn] adj. 不平坦的，不均匀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + even (平坦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条路，"不平坦(un-even)"，
    <tspan x="50" dy="25">有高有低，就像一条蜿蜒的山路。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The terrain was uneven, making it difficult to walk.
  </text>
  <text x="50" y="310" class="content">
    地形不平坦，走路很困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Uneven path -->
    <path d="M0,0 Q50,100 100,0 T200,100 T300,0 T400,100" class="image" />
    <!-- Person walking -->
    <circle cx="20" cy="10" r="15" class="image" />
    <line x1="20" y1="25" x2="20" y2="50" class="image" />
    <line x1="20" y1="50" x2="0" y2="80" class="image" />
    <line x1="20" y1="50" x2="40" y2="80" class="image" />
    <line x1="20" y1="40" x2="50" y2="30" class="image" />
  </g>
</svg>