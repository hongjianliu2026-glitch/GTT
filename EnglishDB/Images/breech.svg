<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">breech</text>
  <text x="50" y="120" class="subtitle">[briːtʃ] n. 炮尾，臀部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bre- (来自古英语 "brecan"，意为"打破")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一门大炮的尾部(breech)，它像是一个巨大的"破口"，
    <tspan x="50" dy="25">连接着炮管和炮弹的发射装置。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cannon's breech was heavily damaged in the battle.
  </text>
  <text x="50" y="310" class="content">
    这门大炮的炮尾在战斗中严重受损。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cannon -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cannon barrel -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Breech -->
    <rect x="50" y="180" width="250" height="20" class="image" />
    <!-- Explosion -->
    <circle cx="200" cy="190" r="30" class="image" />
    <line x1="170" y1="190" x2="230" y2="190" class="image" />
    <line x1="200" y1="160" x2="200" y2="220" class="image" />
    <line x1="185" y1="175" x2="215" y2="205" class="image" />
    <line x1="215" y1="175" x2="185" y2="205" class="image" />
  </g>
</svg>