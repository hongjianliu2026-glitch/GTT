<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mouse</text>
  <text x="50" y="120" class="subtitle">[maʊs] n. 老鼠，鼠标</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mou (移动) + se (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小老鼠(mouse)在电脑前，"移动(mou)"
    <tspan x="50" dy="25">它的尾巴，就像我们用鼠标(mouse)在屏幕上移动光标。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She clicked the mouse to open the file.
  </text>
  <text x="50" y="310" class="content">
    她点击鼠标打开了文件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Computer screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mouse -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <line x1="100" y1="45" x2="120" y2="65" class="image" />
    <!-- Mouse pointer -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="225" y1="75" x2="225" y2="125" class="image" />
    <!-- Mouse -->
    <circle cx="75" cy="45" r="10" class="image" />
    <line x1="75" y1="55" x2="75" y2="80" class="image" />
    <line x1="75" y1="80" x2="60" y2="100" class="image" />
    <line x1="75" y1="80" x2="90" y2="100" class="image" />
  </g>
</svg>