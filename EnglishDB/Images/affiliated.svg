<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">affiliated</text>
  <text x="50" y="120" class="subtitle">[əˈfɪliˌeɪtɪd] adj. 附属的，有关联的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> af- (向) + fili (儿子) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个公司"向(af-)"另一个大公司"认作儿子(fili)"，
    <tspan x="50" dy="25">于是它就成了附属公司(affiliated)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is affiliated with a major corporation.
  </text>
  <text x="50" y="310" class="content">
    这家公司与一家大公司有关联。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large company -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <text x="20" y="30" class="content">大公司</text>
    <!-- Small company -->
    <rect x="220" y="50" width="150" height="100" class="image" />
    <text x="240" y="70" class="content">附属公司</text>
    <!-- Arrow -->
    <line x1="200" y1="75" x2="220" y2="75" class="image" />
    <polygon points="200,75 190,65 190,85" class="image" />
  </g>
</svg>