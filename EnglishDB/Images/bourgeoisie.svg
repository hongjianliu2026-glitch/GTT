<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bourgeoisie</text>
  <text x="50" y="120" class="subtitle">[ˌbʊərʒwɑːˈziː] n. 资产阶级，中产阶级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bourg (城镇) + -ois (属于) + -ie (集合名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群穿着西装的"城镇居民(bourg-ois-ie)"，
    <tspan x="50" dy="25">他们坐在豪华的咖啡馆里，讨论着投资和生意，</tspan>
    <tspan x="50" dy="25">这就是资产阶级(bourgeoisie)的典型画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bourgeoisie often prioritize financial security over artistic pursuits.
  </text>
  <text x="50" y="310" class="content">
    资产阶级通常优先考虑财务安全而非艺术追求。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Coffee shop -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Coffee cups -->
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="160" cy="100" r="15" class="image" />
    <!-- Businessmen -->
    <circle cx="70" cy="70" r="15" class="image" />
    <circle cx="110" cy="70" r="15" class="image" />
    <circle cx="150" cy="70" r="15" class="image" />
    <!-- Suits -->
    <line x1="60" y1="70" x2="80" y2="70" class="image" />
    <line x1="100" y1="70" x2="120" y2="70" class="image" />
    <line x1="140" y1="70" x2="160" y2="70" class="image" />
  </g>
</svg>