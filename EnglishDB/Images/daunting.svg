<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">daunting</text>
  <text x="50" y="120" class="subtitle">[dɔːntɪŋ] adj. 使人畏缩的，令人胆怯的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dau- (害怕) + -nt (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面对一座巨大的山峰，"害怕(dau-)"
    <tspan x="50" dy="25">到不敢前进，这座山峰就变得"令人胆怯(daunting)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The task ahead seemed daunting, but she took it step by step.
  </text>
  <text x="50" y="310" class="content">
    前方的任务看似令人胆怯，但她一步一步地完成了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Person -->
    <circle cx="150" cy="250" r="15" class="image" />
    <line x1="150" y1="265" x2="150" y2="300" class="image" />
    <line x1="150" y1="300" x2="130" y2="330" class="image" />
    <line x1="150" y1="300" x2="170" y2="330" class="image" />
    <line x1="150" y1="280" x2="120" y2="270" class="image" />
    <line x1="150" y1="280" x2="180" y2="270" class="image" />
    <!-- Fear symbol -->
    <text x="130" y="350" class="highlight">😨</text>
  </g>
</svg>