<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vulnerable</text>
  <text x="50" y="120" class="subtitle">[ˈvʌlnərəbl] adj. 易受伤害的，脆弱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vuln (伤口) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个脆弱的人，身上布满了"伤口(vuln)"，
    <tspan x="50" dy="25">随时可能受到更多的伤害，这就是"易受伤害的(vulnerable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man was vulnerable to the cold weather.
  </text>
  <text x="50" y="310" class="content">
    这位老人对寒冷天气很脆弱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Wounds -->
    <circle cx="40" cy="90" r="5" class="image" fill="#E74C3C" />
    <circle cx="60" cy="90" r="5" class="image" fill="#E74C3C" />
    <circle cx="50" cy="110" r="5" class="image" fill="#E74C3C" />
    <circle cx="45" cy="120" r="5" class="image" fill="#E74C3C" />
    <circle cx="55" cy="120" r="5" class="image" fill="#E74C3C" />
  </g>
</svg>