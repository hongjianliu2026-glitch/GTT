<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">everyday</text>
  <text x="50" y="120" class="subtitle">[ˈɛvriˌdeɪ] adj. 每天的，日常的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> every (每一个) + day (天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的日历，"每一天(every day)"
    <tspan x="50" dy="25">都被标记上日常活动的符号，这就是日常(everyday)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wears her everyday clothes to work.
  </text>
  <text x="50" y="310" class="content">
    她穿着日常的衣服去上班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Days -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Activities -->
    <circle cx="75" cy="45" r="10" class="image" /> <!-- Morning routine -->
    <line x1="145" y1="45" x2="165" y2="45" class="image" /> <!-- Work -->
    <line x1="215" y1="45" x2="235" y2="45" class="image" /> <!-- Lunch -->
    <line x1="285" y1="45" x2="305" y2="45" class="image" /> <!-- Evening routine -->
  </g>
</svg>