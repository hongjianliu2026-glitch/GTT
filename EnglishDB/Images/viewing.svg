<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">viewing</text>
  <text x="50" y="120" class="subtitle">[ˈvjuːɪŋ] n. 观看，视野</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> view (看) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在山顶，"观看(view)"
    <tspan x="50" dy="25">整个城市的壮丽景色，这就是他的视野(viewing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The viewing platform offers a panoramic view of the city.
  </text>
  <text x="50" y="310" class="content">
    观景平台提供了城市的全景视野。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L150 0 L300 200 Z" class="image" />
    <!-- Person -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="120" y2="170" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
    <!-- City skyline -->
    <rect x="0" y="200" width="300" height="100" class="image" />
    <rect x="50" y="220" width="20" height="60" class="image" />
    <rect x="100" y="210" width="20" height="70" class="image" />
    <rect x="150" y="230" width="20" height="50" class="image" />
    <rect x="200" y="200" width="20" height="80" class="image" />
    <rect x="250" y="220" width="20" height="60" class="image" />
  </g>
</svg>