<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">protest</text>
  <text x="50" y="120" class="subtitle">[ˈproʊtɛst] n. 抗议，反对；v. 抗议，反对</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + test (证据)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在街头，"在前面展示(pro-test)"
    <tspan x="50" dy="25">他们的不满和证据，这就是抗议(protest)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The students organized a protest against the new policy.
  </text>
  <text x="50" y="310" class="content">
    学生们组织了一场反对新政策的抗议活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Signs -->
    <rect x="50" y="50" width="30" height="50" class="image" />
    <rect x="100" y="50" width="30" height="50" class="image" />
    <rect x="150" y="50" width="30" height="50" class="image" />
    <!-- Text on signs -->
    <text x="55" y="80" class="content">NO</text>
    <text x="105" y="80" class="content">NO</text>
    <text x="155" y="80" class="content">NO</text>
  </g>
</svg>