<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">modern-day</text>
  <text x="50" y="120" class="subtitle">[ˈmɒdən deɪ] adj. 现代的，当代的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> modern (现代的) + day (日子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个现代的城市，高楼大厦林立，"现代的日子(modern-day)"
    <tspan x="50" dy="25">充满了科技和便利，这就是现代-日(modern-day)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The modern-day lifestyle is heavily influenced by technology.
  </text>
  <text x="50" y="310" class="content">
    现代生活方式深受科技影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skyscraper -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="120" y="0" width="100" height="250" class="image" />
    <rect x="240" y="0" width="100" height="180" class="image" />
    <!-- Sun -->
    <circle cx="350" cy="50" r="30" class="image" />
    <!-- Road -->
    <rect x="0" y="220" width="350" height="20" class="image" />
    <!-- Car -->
    <rect x="50" y="200" width="40" height="20" class="image" />
    <rect x="170" y="200" width="40" height="20" class="image" />
    <rect x="290" y="200" width="40" height="20" class="image" />
  </g>
</svg>