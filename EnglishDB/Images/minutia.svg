<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">minutia</text>
  <text x="50" y="120" class="subtitle">[maɪˈnjuːʃiə] n. 细节，琐事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> minut (小) + -ia (表示状态或性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探在放大镜下，"仔细观察(minut)"
    <tspan x="50" dy="25">那些微小的细节(minutia)，这些细节往往能揭示真相。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was obsessed with the minutia of the case.
  </text>
  <text x="50" y="310" class="content">
    他对案件的细节非常着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <!-- Small details -->
    <circle cx="180" cy="100" r="5" class="image" />
    <circle cx="190" cy="100" r="3" class="image" />
    <circle cx="200" cy="100" r="2" class="image" />
    <circle cx="210" cy="100" r="4" class="image" />
    <circle cx="220" cy="100" r="3" class="image" />
    <circle cx="230" cy="100" r="5" class="image" />
    <!-- Detective -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>