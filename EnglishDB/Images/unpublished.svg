<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unpublished</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˈpʌblɪʃt] adj. 未出版的，未发表的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + publish (出版)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本书被锁在保险箱里，"未被出版(un-published)"，
    <tspan x="50" dy="25">等待着被发现和分享的那一天。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The author has several unpublished manuscripts.
  </text>
  <text x="50" y="310" class="content">
    这位作家有几部未发表的手稿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Safe -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Book -->
    <rect x="50" y="50" width="100" height="150" class="image" />
    <!-- Lock -->
    <circle cx="100" cy="20" r="10" class="image" />
    <line x1="95" y1="20" x2="105" y2="20" class="image" />
    <line x1="100" y1="15" x2="100" y2="25" class="image" />
    <!-- Keyhole -->
    <circle cx="100" cy="20" r="5" class="image" />
  </g>
</svg>