<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">condescending</text>
  <text x="50" y="120" class="subtitle">[ˌkɒndɪˈsendɪŋ] adj. 屈尊俯就的，居高临下的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + de- (向下) + scend (爬) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个高高在上的人，"共同向下爬(con-de-scend)"
    <tspan x="50" dy="25">来与你交流，这种态度就是屈尊俯就的(condescending)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His condescending tone made her feel uncomfortable.
  </text>
  <text x="50" y="310" class="content">
    他居高临下的语气让她感到不舒服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person on a pedestal -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="150" y="20" width="50" height="160" class="image" />
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="150" class="image" />
    <line x1="175" y1="100" x2="150" y2="130" class="image" />
    <line x1="175" y1="100" x2="200" y2="130" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <!-- Arrow pointing down -->
    <line x1="175" y1="20" x2="175" y2="10" class="image" />
    <line x1="175" y1="10" x2="165" y2="20" class="image" />
    <line x1="175" y1="10" x2="185" y2="20" class="image" />
  </g>
</svg>