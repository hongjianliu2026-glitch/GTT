<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">landfall</text>
  <text x="50" y="120" class="subtitle">[ˈlændfɔːl] n. 登陆，着陆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> land (陆地) + fall (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在海上航行，"陆地落下(land-fall)"
    <tspan x="50" dy="25">在船的前方，船员们欢呼着登陆(landfall)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship made its landfall at dawn.
  </text>
  <text x="50" y="310" class="content">
    船在黎明时分登陆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 150,180 125,150 75,150" class="image" />
    <!-- Land -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Waves -->
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <line x1="0" y1="170" x2="350" y2="170" class="image" />
    <line x1="0" y1="190" x2="350" y2="190" class="image" />
  </g>
</svg>