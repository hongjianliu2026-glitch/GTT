<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cul-de-sac</text>
  <text x="50" y="120" class="subtitle">[ˌkʌl də ˈsæk] n. 死胡同</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cul (尾巴) + de (的) + sac (袋子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条街道像尾巴一样延伸，最后进入一个袋子(sac)，
    <tspan x="50" dy="25">这个袋子就是死胡同(cul-de-sac)，进去就出不来了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car was stuck in a cul-de-sac and couldn't turn around.
  </text>
  <text x="50" y="310" class="content">
    汽车被困在死胡同里，无法掉头。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="0" y2="150" class="image" />
    <!-- Car -->
    <rect x="250" y="80" width="40" height="20" class="image" />
    <circle cx="260" cy="100" r="5" class="image" />
    <circle cx="280" cy="100" r="5" class="image" />
  </g>
</svg>