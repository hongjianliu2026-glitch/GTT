<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">calmly</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːmli] adv. 平静地，镇定地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> calm (平静) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在暴风雨中，"平静地(calmly)"
    <tspan x="50" dy="25">坐在椅子上，面带微笑，仿佛一切都在掌控之中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke calmly to the angry customer.
  </text>
  <text x="50" y="310" class="content">
    她平静地对愤怒的顾客说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Storm clouds -->
    <ellipse cx="175" cy="50" rx="150" ry="30" class="image" />
    <ellipse cx="100" cy="30" rx="100" ry="20" class="image" />
    <ellipse cx="250" cy="30" rx="100" ry="20" class="image" />
    <!-- Person sitting calmly -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="150" y2="260" class="image" />
    <line x1="175" y1="220" x2="200" y2="260" class="image" />
    <line x1="175" y1="190" x2="130" y2="180" class="image" />
    <line x1="175" y1="190" x2="220" y2="180" class="image" />
    <!-- Chair -->
    <rect x="150" y="260" width="50" height="20" class="image" />
    <rect x="160" y="280" width="30" height="20" class="image" />
  </g>
</svg>