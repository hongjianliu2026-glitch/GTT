<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .liquid { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soluble</text>
  <text x="50" y="120" class="subtitle">[ˈsɒljəbl] adj. 可溶的，可解决的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> solu- (松开) + -ble (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一粒盐在水中，"松开(solu-)"
    <tspan x="50" dy="25">并溶解，变成可溶的(soluble)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Sugar is soluble in water.
  </text>
  <text x="50" y="310" class="content">
    糖在水中是可溶的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass of water -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <!-- Water -->
    <rect x="10" y="10" width="180" height="180" class="liquid" />
    <!-- Salt -->
    <circle cx="100" cy="100" r="15" class="image" />
    <!-- Dissolving effect -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
  </g>
</svg>