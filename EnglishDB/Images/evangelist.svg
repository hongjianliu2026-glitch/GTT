<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evangelist</text>
  <text x="50" y="120" class="subtitle">[ɪˈvændʒəlɪst] n. 福音传道者，狂热者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eu- (好) + angel (天使) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"好天使(eu-angel)"在人群中传播好消息，
    <tspan x="50" dy="25">他就是一位福音传道者(evangelist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He became an evangelist for the new technology.
  </text>
  <text x="50" y="310" class="content">
    他成为了这项新技术的狂热传播者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angel -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Halo -->
    <circle cx="50" cy="70" r="15" class="image" />
    <!-- Speech bubble -->
    <path d="M 100 80 Q 150 80 150 120 Q 150 160 100 160 Q 50 160 50 120 Q 50 80 100 80 Z" class="image" />
    <text x="110" y="110" class="content" fill="#34495E">好消息</text>
  </g>
</svg>