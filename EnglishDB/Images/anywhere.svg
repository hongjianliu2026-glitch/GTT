<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anywhere</text>
  <text x="50" y="120" class="subtitle">[ˈenɪˌhwer] adv. 任何地方</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> any (任何) + where (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅行者，他可以"去任何地方(any-where)"，
    <tspan x="50" dy="25">无论是在城市、森林还是海边，他都能找到自己的目的地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You can find this book anywhere in the library.
  </text>
  <text x="50" y="310" class="content">
    你可以在图书馆的任何地方找到这本书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traveler -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Paths -->
    <line x1="20" y1="150" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <!-- Destination symbols -->
    <rect x="100" y="100" width="20" height="20" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <rect x="200" y="100" width="20" height="20" class="image" />
  </g>
</svg>