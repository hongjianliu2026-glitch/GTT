<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lightly</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪtli] adv. 轻轻地，轻微地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> light (轻) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶轻轻地(lightly)落在花瓣上，
    <tspan x="50" dy="25">它的翅膀几乎没有触碰到花瓣，仿佛在空中漂浮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She touched his arm lightly.
  </text>
  <text x="50" y="310" class="content">
    她轻轻地碰了一下他的手臂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly -->
    <path d="M50,50 C60,20 100,20 110,50 Z" class="image" />
    <path d="M50,50 C60,80 100,80 110,50 Z" class="image" />
    <!-- Flower -->
    <circle cx="80" cy="100" r="20" class="image" />
    <line x1="80" y1="120" x2="80" y2="150" class="image" />
    <line x1="80" y1="135" x2="60" y2="140" class="image" />
    <line x1="80" y1="135" x2="100" y2="140" class="image" />
  </g>
</svg>