<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sensibly</text>
  <text x="50" y="120" class="subtitle">[ˈsɛnsəbli] adv. 明智地，合理地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sens (感觉) + -ible (能够) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在做出决定时，"感觉(sens)"到自己能够"明智地(sensibly)"
    <tspan x="50" dy="25">处理问题，这种感觉让他做出了合理的决策。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She handled the situation sensibly, avoiding any conflict.
  </text>
  <text x="50" y="310" class="content">
    她明智地处理了情况，避免了任何冲突。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Light bulb -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="230" y1="150" x2="270" y2="150" class="image" />
    <line x1="240" y1="160" x2="260" y2="160" class="image" />
    <!-- Decision arrow -->
    <line x1="150" y1="100" x2="220" y2="100" class="image" />
    <polygon points="220,100 210,90 210,110" class="image" />
  </g>
</svg>