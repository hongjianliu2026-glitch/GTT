<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nowadays</text>
  <text x="50" y="120" class="subtitle">[ˈnaʊədeɪz] adv. 现今，现在</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> now (现在) + a + day (天) + s (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟指针指向"现在(now)"，
    <tspan x="50" dy="25">周围环绕着无数个"天(day)的复数(s)"，</tspan>
    <tspan x="50" dy="25">象征着现今(nowadays)的每一天。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Nowadays, people rely heavily on smartphones.
  </text>
  <text x="50" y="310" class="content">
    现今，人们非常依赖智能手机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Days -->
    <text x="50" y="200" class="content">Day</text>
    <text x="100" y="200" class="content">Day</text>
    <text x="150" y="200" class="content">Day</text>
    <text x="200" y="200" class="content">Day</text>
  </g>
</svg>