<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">repetitive</text>
  <text x="50" y="120" class="subtitle">[rɪˈpɛtətɪv] adj. 重复的，反复的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + pet (寻求) + -itive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机器人不停地"再次寻求(re-pet)"
    <tspan x="50" dy="25">同一个目标，这种行为就是重复的(repetitive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The job became repetitive after a while.
  </text>
  <text x="50" y="310" class="content">
    这份工作过了一段时间就变得重复乏味了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Target -->
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Arrows -->
    <line x1="80" y1="50" x2="180" y2="90" class="image" />
    <line x1="80" y1="50" x2="180" y2="90" class="image" />
    <line x1="80" y1="50" x2="180" y2="90" class="image" />
    <line x1="80" y1="50" x2="180" y2="90" class="image" />
    <line x1="80" y1="50" x2="180" y2="90" class="image" />
  </g>
</svg>