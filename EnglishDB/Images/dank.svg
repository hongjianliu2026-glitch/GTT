<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dank</text>
  <text x="50" y="120" class="subtitle">[dæŋk] adj. 潮湿的，阴冷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dank (潮湿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阴暗的洞穴，"潮湿(dank)"的空气让人感到
    <tspan x="50" dy="25">阴冷，墙壁上滴着水珠，整个环境都充满了湿气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old basement was dank and musty.
  </text>
  <text x="50" y="310" class="content">
    那个旧地下室又潮湿又发霉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cave entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dripping water -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Water droplets -->
    <circle cx="50" cy="180" r="5" class="image" />
    <circle cx="100" cy="180" r="5" class="image" />
    <circle cx="150" cy="180" r="5" class="image" />
    <circle cx="200" cy="180" r="5" class="image" />
    <circle cx="250" cy="180" r="5" class="image" />
  </g>
</svg>