<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extracurricular</text>
  <text x="50" y="120" class="subtitle">[ˌekstrəkəˈrɪkjələr] adj. 课外的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> extra- (在...之外) + curricular (课程的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在教室外，"在课程之外(extra-curricular)"
    <tspan x="50" dy="25">参加各种活动，这些活动就是课外的(extracurricular)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She participates in many extracurricular activities.
  </text>
  <text x="50" y="310" class="content">
    她参加了很多课外活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Student outside the classroom -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Activities -->
    <line x1="250" y1="120" x2="300" y2="120" class="image" />
    <line x1="300" y1="120" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="250" y2="120" class="image" />
  </g>
</svg>