<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">embargo</text>
  <text x="50" y="120" class="subtitle">[ɪmˈbɑːrɡoʊ] n. 禁运，封锁；v. 禁止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (进入) + bar (阻挡) + go (去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船试图"进入(em-)"港口，但被"阻挡(bar)"，
    <tspan x="50" dy="25">无法"去(go)"，这就是"禁运(embargo)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government imposed an embargo on oil exports.
  </text>
  <text x="50" y="310" class="content">
    政府对石油出口实施了禁运。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 150,180 100,100" class="image" />
    <line x1="100" y1="100" x2="100" y2="180" class="image" />
    <!-- Barrier -->
    <line x1="200" y1="180" x2="200" y2="100" class="image" />
    <line x1="250" y1="180" x2="250" y2="100" class="image" />
    <line x1="300" y1="180" x2="300" y2="100" class="image" />
    <!-- Port -->
    <rect x="200" y="100" width="100" height="80" class="image" />
  </g>
</svg>