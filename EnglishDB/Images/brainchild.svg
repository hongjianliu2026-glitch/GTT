<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brainchild</text>
  <text x="50" y="120" class="subtitle">[ˈbreɪntʃaɪld] n. 脑力劳动的产物，创意</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brain (大脑) + child (孩子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天才科学家，他的大脑(brain)孕育(child)出了一个
    <tspan x="50" dy="25">惊人的发明，这个发明就是他的"脑力劳动的产物(brainchild)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new app is the brainchild of our development team.
  </text>
  <text x="50" y="310" class="content">
    这个新应用是我们开发团队的创意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Child -->
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Connection -->
    <line x1="150" y1="100" x2="220" y2="100" class="image" />
    <!-- Lightning bolt -->
    <polyline points="150,100 170,70 190,130 210,100" class="image" />
  </g>
</svg>