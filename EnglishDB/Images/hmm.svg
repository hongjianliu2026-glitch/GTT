<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hmm</text>
  <text x="50" y="120" class="subtitle">[hmm] int. 嗯，表示犹豫或思考</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，拟声词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考时，发出"嗯(hmm)"的声音，
    <tspan x="50" dy="25">这个声音表达了他们在犹豫或深思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Hmm, I'm not sure which option to choose.
  </text>
  <text x="50" y="310" class="content">
    嗯，我不确定该选哪个选项。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thinking bubble -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="170" x2="50" y2="150" class="image" />
    <line x1="100" y1="170" x2="150" y2="150" class="image" />
    <!-- Hmm text -->
    <text x="80" y="110" class="content" style="font-size: 36px;">Hmm</text>
  </g>
</svg>