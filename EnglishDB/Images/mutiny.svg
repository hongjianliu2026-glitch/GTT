<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mutiny</text>
  <text x="50" y="120" class="subtitle">[ˈmjuːtɪni] n. 兵变，叛变</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mut (改变) + -iny (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群士兵突然"改变(mut)"了他们的忠诚，
    <tspan x="50" dy="25">集体反抗上级，这就是兵变(mutiny)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crew staged a mutiny against the captain.
  </text>
  <text x="50" y="310" class="content">
    船员们对船长发动了兵变。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldiers -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Captain -->
    <circle cx="200" cy="50" r="25" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="70" x2="200" y2="70" class="image" />
    <line x1="100" y1="70" x2="200" y2="70" class="image" />
    <line x1="150" y1="70" x2="200" y2="70" class="image" />
    <!-- Speech bubble -->
    <path d="M220,30 Q250,30 250,50 Q250,70 220,70 Q200,60 220,30" class="image" />
    <text x="225" y="55" class="content" text-anchor="middle">Mutiny!</text>
  </g>
</svg>