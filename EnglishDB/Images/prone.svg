<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prone</text>
  <text x="50" y="120" class="subtitle">[proʊn] adj. 易于…的，有…倾向的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + -ne (倾斜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人向前倾斜，"向前倾斜(pro-ne)"，
    <tspan x="50" dy="25">就像他总是容易摔倒一样，这就是prone(易于…的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is prone to accidents because of his carelessness.
  </text>
  <text x="50" y="310" class="content">
    他因为粗心大意而容易发生事故。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person leaning forward -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <line x1="50" y1="120" x2="30" y2="100" class="image" /> <!-- Leaning forward -->
  </g>
</svg>