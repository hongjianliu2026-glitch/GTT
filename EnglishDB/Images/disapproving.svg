<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disapproving</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈpruːvɪŋ] adj. 不赞成的，反对的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + approve (赞成)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人皱着眉头，"不(dis-)"
    <tspan x="50" dy="25">赞成(approve)"某件事，脸上写满了不赞同。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher gave a disapproving look when the student didn't finish the homework.
  </text>
  <text x="50" y="310" class="content">
    当学生没有完成作业时，老师给了他一个不赞成的眼神。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyebrows -->
    <line x1="70" y1="80" x2="90" y2="70" class="image" />
    <line x1="110" y1="70" x2="130" y2="80" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="100" r="5" class="image" />
    <circle cx="120" cy="100" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 70 130 Q 100 140 130 130" class="image" />
  </g>
</svg>