<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hysterical</text>
  <text x="50" y="120" class="subtitle">[hɪˈsterɪkl] adj. 歇斯底里的，异常激动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hystero- (子宫) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代医生认为"子宫(hystero-)"是情绪的根源，
    <tspan x="50" dy="25">当情绪失控时，人们会变得"歇斯底里(hysterical)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She became hysterical when she heard the news.
  </text>
  <text x="50" y="310" class="content">
    她听到这个消息后变得歇斯底里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Woman with exaggerated emotions -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="160" x2="100" y2="140" class="image" />
    <line x1="50" y1="160" x2="0" y2="140" class="image" />
    <!-- Exaggerated facial expressions -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="70" cy="90" r="5" class="image" />
    <path d="M40 110 Q50 120 60 110" class="image" />
    <path d="M40 115 Q50 130 60 115" class="image" />
  </g>
</svg>