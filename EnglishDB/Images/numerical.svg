<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .number { font: bold 36px sans-serif; fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">numerical</text>
  <text x="50" y="120" class="subtitle">[njuːˈmɛrɪkl] adj. 数字的，数值的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> numer (数字) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字"1234567890"在空中飘浮，
    <tspan x="50" dy="25">这些数字就像魔法一样，构成了所有数值的基础。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The data was presented in numerical form.
  </text>
  <text x="50" y="310" class="content">
    数据以数字形式呈现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Floating numbers -->
    <text x="0" y="0" class="number">1</text>
    <text x="50" y="50" class="number">2</text>
    <text x="100" y="100" class="number">3</text>
    <text x="150" y="150" class="number">4</text>
    <text x="200" y="200" class="number">5</text>
    <text x="250" y="250" class="number">6</text>
    <text x="300" y="300" class="number">7</text>
    <text x="350" y="350" class="number">8</text>
    <text x="400" y="400" class="number">9</text>
    <text x="450" y="450" class="number">0</text>
  </g>
</svg>