<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">castle</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːsl] n. 城堡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cast (坚固) + le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个坚固的石头堡垒，"小而坚固(cast-le)"
    <tspan x="50" dy="25">就像中世纪的城堡(castle)一样，守护着王国。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They visited the ancient castle last weekend.
  </text>
  <text x="50" y="310" class="content">
    他们上周末参观了那座古老的城堡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Castle base -->
    <rect x="0" y="100" width="300" height="150" class="image" />
    <!-- Castle towers -->
    <rect x="50" y="0" width="50" height="100" class="image" />
    <rect x="200" y="0" width="50" height="100" class="image" />
    <!-- Castle walls -->
    <line x1="0" y1="100" x2="300" y2="100" class="image" />
    <line x1="0" y1="250" x2="300" y2="250" class="image" />
    <line x1="0" y1="100" x2="0" y2="250" class="image" />
    <line x1="300" y1="100" x2="300" y2="250" class="image" />
    <!-- Castle entrance -->
    <rect x="125" y="200" width="50" height="50" class="image" />
  </g>
</svg>