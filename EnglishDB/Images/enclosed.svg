<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enclosed</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkloʊzd] adj. 被包围的，封闭的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + close (关闭)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被"关进(en-close)"盒子里的玩具，
    <tspan x="50" dy="25">它完全被包围，无法逃脱，这就是被封闭(enclosed)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was enclosed by a high wall.
  </text>
  <text x="50" y="310" class="content">
    花园被高墙包围着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Toy inside the box -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Arms of the toy -->
    <line x1="150" y1="100" x2="100" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <!-- Legs of the toy -->
    <line x1="165" y1="130" x2="165" y2="180" class="image" />
    <line x1="185" y1="130" x2="185" y2="180" class="image" />
  </g>
</svg>