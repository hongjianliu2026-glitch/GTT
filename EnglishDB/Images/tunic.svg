<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tunic</text>
  <text x="50" y="120" class="subtitle">[ˈtjuːnɪk] n. 束腰外衣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tun (拉丁语，意为“束腰外衣”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代战士穿着一件束腰外衣(tunic)，
    <tspan x="50" dy="25">这件外衣紧紧地束在腰间，显得非常威武。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Roman soldier wore a tunic under his armor.
  </text>
  <text x="50" y="310" class="content">
    罗马士兵在盔甲下穿着一件束腰外衣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tunic -->
    <rect x="50" y="50" width="200" height="300" class="image" />
    <!-- Belt -->
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <!-- Shoulders -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <!-- Sleeves -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <!-- Head -->
    <circle cx="150" cy="30" r="20" class="image" />
  </g>
</svg>