<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ruffle</text>
  <text x="50" y="120" class="subtitle">[ˈrʌf(ə)l] v. 弄皱，扰乱；n. 褶边</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ruff (皱褶) + -le (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只调皮的小猫用爪子反复"弄皱(ruff-le)"
    <tspan x="50" dy="25">主人的裙子，裙子上出现了许多褶边(ruffle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wind ruffled her hair as she walked.
  </text>
  <text x="50" y="310" class="content">
    她走路时，风吹乱了她的头发。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Dress -->
    <rect x="100" y="80" width="200" height="100" class="image" />
    <line x1="120" y1="100" x2="280" y2="100" class="image" />
    <line x1="120" y1="120" x2="250" y2="120" class="image" />
    <line x1="120" y1="140" x2="270" y2="140" class="image" />
    <line x1="120" y1="160" x2="240" y2="160" class="image" />
  </g>
</svg>