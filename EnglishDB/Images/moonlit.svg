<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .moon { fill: #FFD700; }
      .ground { fill: #8B4513; }
      .tree { fill: #228B22; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moonlit</text>
  <text x="50" y="120" class="subtitle">[ˈmuːnlɪt] adj. 月光照耀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> moon (月亮) + lit (light的过去分词，照亮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，月亮(moon)高高挂在天上，
    <tspan x="50" dy="25">它的光芒(lit)照亮了整个大地，</tspan>
    <tspan x="50" dy="25">一切都沐浴在月光(moonlit)中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The path was bathed in the soft glow of the moonlit night.
  </text>
  <text x="50" y="310" class="content">
    小路沐浴在月光照耀的夜晚的柔和光辉中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="moon" />
    <!-- Ground -->
    <rect x="0" y="200" width="350" height="100" class="ground" />
    <!-- Tree -->
    <polygon points="150,200 200,100 250,200" class="tree" />
    <!-- Moonlight -->
    <line x1="100" y1="150" x2="100" y2="300" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <line x1="75" y1="250" x2="125" y2="250" class="image" />
  </g>
</svg>