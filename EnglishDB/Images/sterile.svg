<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sterile</text>
  <text x="50" y="120" class="subtitle">[ˈstɛrəl] adj. 无菌的，贫瘠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ster- (固定) + -ile (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个实验室里，所有东西都被"固定(ster-)"在无菌状态，
    <tspan x="50" dy="25">没有任何微生物可以生存，这就是无菌的(sterile)环境。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hospital operating room must be kept sterile.
  </text>
  <text x="50" y="310" class="content">
    医院的手术室必须保持无菌状态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sterile environment -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lab table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Sterile gloves -->
    <line x1="70" y1="50" x2="100" y2="50" class="image" />
    <line x1="70" y1="80" x2="100" y2="80" class="image" />
    <line x1="70" y1="110" x2="100" y2="110" class="image" />
    <!-- Sterile mask -->
    <line x1="120" y1="50" x2="150" y2="50" class="image" />
    <line x1="120" y1="80" x2="150" y2="80" class="image" />
    <line x1="120" y1="110" x2="150" y2="110" class="image" />
    <!-- Sterile instruments -->
    <line x1="170" y1="50" x2="200" y2="50" class="image" />
    <line x1="170" y1="80" x2="200" y2="80" class="image" />
    <line x1="170" y1="110" x2="200" y2="110" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>