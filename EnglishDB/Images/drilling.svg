<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drilling</text>
  <text x="50" y="120" class="subtitle">[ˈdrɪlɪŋ] n. 钻孔，训练；v. 钻孔，训练</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drill (钻孔) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人在不停地"钻孔(drill)"，
    <tspan x="50" dy="25">他的动作就像是在进行一场永不停歇的训练(drilling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers underwent rigorous drilling every morning.
  </text>
  <text x="50" y="310" class="content">
    士兵们每天早上都进行严格的训练。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Drill -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="50" x2="70" y2="70" class="image" />
    <line x1="50" y1="50" x2="30" y2="70" class="image" />
    <!-- Worker -->
    <circle cx="50" cy="160" r="15" class="image" />
    <line x1="50" y1="175" x2="50" y2="210" class="image" />
    <line x1="50" y1="210" x2="30" y2="240" class="image" />
    <line x1="50" y1="210" x2="70" y2="240" class="image" />
    <line x1="50" y1="190" x2="80" y2="180" class="image" />
  </g>
</svg>