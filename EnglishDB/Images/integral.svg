<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">integral</text>
  <text x="50" y="120" class="subtitle">[ˈɪntɪɡrəl] adj. 完整的，不可或缺的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> integr (整体) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图，每一块都是"整体(integr)"的一部分，
    <tspan x="50" dy="25">缺少任何一块都无法完成整个拼图，这就是不可或缺的(integral)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The engine is an integral part of the car.
  </text>
  <text x="50" y="310" class="content">
    发动机是汽车不可或缺的部分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="150" height="150" class="image" />
    <rect x="160" y="0" width="150" height="150" class="image" />
    <rect x="0" y="160" width="150" height="150" class="image" />
    <rect x="160" y="160" width="150" height="150" class="image" />
    <!-- Missing piece -->
    <rect x="80" y="80" width="80" height="80" class="image" fill="#E74C3C" />
    <!-- Text annotation -->
    <text x="120" y="260" class="content" text-anchor="middle">Missing Piece</text>
  </g>
</svg>