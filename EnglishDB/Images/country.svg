<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">country</text>
  <text x="50" y="120" class="subtitle">[ˈkʌntri] n. 国家，乡村</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> count (伯爵) + -ry (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的伯爵(count)统治着一个地方(-ry)，
    <tspan x="50" dy="25">这个地方就是他的国家(country)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to travel to different countries.
  </text>
  <text x="50" y="310" class="content">
    她喜欢去不同的国家旅行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Castle -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="70" y="40" width="60" height="60" class="image" />
    <!-- Flag -->
    <line x1="100" y1="20" x2="100" y2="0" class="image" />
    <rect x="90" y="0" width="20" height="20" class="image" />
    <!-- Trees -->
    <line x1="200" y1="100" x2="200" y2="80" class="image" />
    <line x1="210" y1="100" x2="210" y2="80" class="image" />
    <line x1="205" y1="80" x2="205" y2="60" class="image" />
    <line x1="220" y1="100" x2="220" y2="80" class="image" />
    <line x1="230" y1="100" x2="230" y2="80" class="image" />
    <line x1="225" y1="80" x2="225" y2="60" class="image" />
  </g>
</svg>