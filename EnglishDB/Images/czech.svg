<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Czech</text>
  <text x="50" y="120" class="subtitle">[tʃɛk] n. 捷克人，捷克语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自捷克语 Čech (捷克人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个捷克人站在布拉格的查理大桥上，
    <tspan x="50" dy="25">桥下是流淌的伏尔塔瓦河，桥上人来人往，</tspan>
    <tspan x="50" dy="25">这就是捷克(Czech)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He speaks fluent Czech and English.
  </text>
  <text x="50" y="310" class="content">
    他能流利地说捷克语和英语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Charles Bridge -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- River Vltava -->
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <line x1="50" y1="220" x2="300" y2="220" class="image" />
    <line x1="50" y1="240" x2="300" y2="240" class="image" />
    <line x1="50" y1="260" x2="300" y2="260" class="image" />
    <line x1="50" y1="280" x2="300" y2="280" class="image" />
    <line x1="50" y1="300" x2="300" y2="300" class="image" />
    <!-- Czech person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>