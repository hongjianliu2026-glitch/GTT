<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crucify</text>
  <text x="50" y="120" class="subtitle">[ˈkruːsɪfaɪ] v. 钉在十字架上处死，折磨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cruci- (十字架) + -fy (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"钉在十字架(cruci-fy)"上，
    <tspan x="50" dy="25">这种残酷的刑罚让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Romans used to crucify criminals.
  </text>
  <text x="50" y="310" class="content">
    罗马人过去常常将罪犯钉在十字架上处死。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cross -->
    <line x1="100" y1="50" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Person on the cross -->
    <line x1="100" y1="70" x2="100" y2="130" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="100" y1="130" x2="80" y2="160" class="image" />
    <line x1="100" y1="130" x2="120" y2="160" class="image" />
  </g>
</svg>