<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reformer</text>
  <text x="50" y="120" class="subtitle">[rɪˈfɔrmər] n. 改革者，革新者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + form (形成) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的改革者，他手持锤子，"再次塑造(re-form)"
    <tspan x="50" dy="25">旧的制度，使其焕然一新，成为一个革新者(reformer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Martin Luther King Jr. was a great reformer in civil rights.
  </text>
  <text x="50" y="310" class="content">
    马丁·路德·金是民权运动中的伟大改革者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="50" y1="20" x2="30" y2="40" class="image" />
    <line x1="50" y1="20" x2="70" y2="40" class="image" />
    <!-- Person -->
    <circle cx="50" cy="120" r="15" class="image" />
    <line x1="50" y1="135" x2="50" y2="170" class="image" />
    <line x1="50" y1="170" x2="30" y2="200" class="image" />
    <line x1="50" y1="170" x2="70" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Broken system -->
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <line x1="100" y1="20" x2="80" y2="40" class="image" />
    <line x1="100" y1="20" x2="120" y2="40" class="image" />
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
  </g>
</svg>