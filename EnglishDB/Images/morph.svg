<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">morph</text>
  <text x="50" y="120" class="subtitle">[mɔːrf] v. 变形，变体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> morph (形状)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体突然"变形(morph)"，从一个形状
    <tspan x="50" dy="25">变成另一个形状，就像魔术一样神奇。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The caterpillar morphed into a butterfly.
  </text>
  <text x="50" y="310" class="content">
    毛毛虫变成了蝴蝶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Caterpillar -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="70" y1="50" x2="90" y2="50" class="image" />
    <line x1="120" y1="50" x2="140" y2="50" class="image" />
    <line x1="170" y1="50" x2="190" y2="50" class="image" />

    <!-- Butterfly -->
    <path d="M250,50 C260,20 300,20 310,50 Z" class="image" />
    <path d="M250,50 C260,80 300,80 310,50 Z" class="image" />
    <circle cx="280" cy="50" r="10" class="image" />

    <!-- Transformation arrow -->
    <line x1="220" y1="50" x2="240" y2="50" class="image" />
    <polygon points="240,45 240,55 250,50" class="image" />
  </g>
</svg>