<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cabaret</text>
  <text x="50" y="120" class="subtitle">[ˈkæbəreɪ] n. 卡巴莱，歌舞表演</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cab (小屋) + a + ret (娱乐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小屋(cab)里，人们聚集在一起，享受着
    <tspan x="50" dy="25">歌舞表演(a + ret)，这就是卡巴莱(cabaret)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They enjoyed a lively cabaret show last night.
  </text>
  <text x="50" y="310" class="content">
    他们昨晚享受了一场生动的卡巴莱表演。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small house -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Door -->
    <rect x="60" y="50" width="30" height="50" class="image" />
    <!-- Window -->
    <rect x="20" y="20" width="30" height="30" class="image" />
    <rect x="100" y="20" width="30" height="30" class="image" />
    <!-- Stage -->
    <rect x="160" y="20" width="200" height="80" class="image" />
    <!-- Dancer -->
    <circle cx="200" cy="60" r="15" class="image" />
    <line x1="200" y1="75" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="120" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
    <line x1="200" y1="85" x2="230" y2="75" class="image" />
  </g>
</svg>