<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">life</text>
  <text x="50" y="120" class="subtitle">[laɪf] n. 生命，生活</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lif (生命)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满活力的生命(life)，
    <tspan x="50" dy="25">像一棵茁壮成长的树，象征着生命的力量和延续。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She leads a happy life with her family.
  </text>
  <text x="50" y="310" class="content">
    她和家人过着幸福的生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree -->
    <line x1="150" y1="200" x2="150" y2="50" class="image" />
    <line x1="150" y1="100" x2="100" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="200" class="image" />
    <line x1="150" y1="150" x2="200" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="300" y2="200" class="image" />
  </g>
</svg>