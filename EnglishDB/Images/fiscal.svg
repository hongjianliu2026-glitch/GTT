<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fiscal</text>
  <text x="50" y="120" class="subtitle">[ˈfɪskl] adj. 财政的，国库的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fisc (钱袋) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钱袋(fisc)，里面装满了国家的财政(fiscal)资金，
    <tspan x="50" dy="25">这些资金被用来支持各种公共项目和政府运作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government announced its fiscal policy for the next year.
  </text>
  <text x="50" y="310" class="content">
    政府宣布了下一年的财政政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Money bag -->
    <path d="M50 50 Q100 20 150 50 L150 150 Q100 180 50 150 Z" class="image" fill="#FFD700" />
    <!-- Coins -->
    <circle cx="80" cy="100" r="10" class="image" fill="#DAA520" />
    <circle cx="120" cy="120" r="10" class="image" fill="#DAA520" />
    <circle cx="100" cy="80" r="10" class="image" fill="#DAA520" />
    <!-- Government building -->
    <rect x="200" y="50" width="150" height="100" class="image" fill="#808080" />
    <line x1="220" y1="70" x2="330" y2="70" class="image" />
    <line x1="220" y1="90" x2="330" y2="90" class="image" />
    <line x1="220" y1="110" x2="330" y2="110" class="image" />
  </g>
</svg>