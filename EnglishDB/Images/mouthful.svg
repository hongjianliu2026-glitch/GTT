<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mouthful</text>
  <text x="50" y="120" class="subtitle">[ˈmaʊθfʊl] n. 一口，满口</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mouth (嘴) + ful (充满)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人张大嘴巴，"满嘴(mouth-ful)"
    <tspan x="50" dy="25">塞满了食物，这就是一口(mouthful)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The burger was so big, it was a real mouthful.
  </text>
  <text x="50" y="310" class="content">
    这个汉堡太大了，真是一口都吃不完。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <path d="M50 50 Q100 100 150 50" class="image" />
    <path d="M50 50 Q0 100 50 150" class="image" />
    <path d="M150 50 Q200 100 150 150" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="80" cy="120" r="15" class="image" />
    <circle cx="120" cy="120" r="15" class="image" />
  </g>
</svg>