<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insomnia</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsɒmniə] n. 失眠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + somn (睡眠) + -ia (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个失眠的人，"无法入睡(in-somn-ia)"，
    <tspan x="50" dy="25">整夜辗转反侧，眼睛瞪得大大的，床头灯还亮着。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She suffered from insomnia and couldn't fall asleep.
  </text>
  <text x="50" y="310" class="content">
    她饱受失眠之苦，无法入睡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <!-- Eyes -->
    <circle cx="90" cy="90" r="5" class="image" />
    <circle cx="110" cy="90" r="5" class="image" />
    <!-- Nightstand -->
    <rect x="250" y="100" width="50" height="50" class="image" />
    <!-- Lamp -->
    <line x1="275" y1="100" x2="275" y2="50" class="image" />
    <circle cx="275" cy="40" r="10" class="image" />
    <line x1="275" y1="40" x2="275" y2="30" class="image" />
  </g>
</svg>