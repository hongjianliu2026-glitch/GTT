<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">above</text>
  <text x="50" y="120" class="subtitle">[əˈbʌv] adv. 在上面；adj. 上面的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + ove (在上)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鸟从地面"离开(ab-)"，飞到"上面(ove)"的天空中，
    <tspan x="50" dy="25">这就是"在上面(above)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plane flew above the clouds.
  </text>
  <text x="50" y="310" class="content">
    飞机在云层上方飞行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Bird -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="130" x2="30" y2="120" class="image" />
    <line x1="50" y1="130" x2="70" y2="120" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="180" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="50" ry="20" class="image" />
    <ellipse cx="200" cy="70" rx="60" ry="25" class="image" />
    <ellipse cx="300" cy="60" rx="40" ry="15" class="image" />
  </g>
</svg>