<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meat</text>
  <text x="50" y="120" class="subtitle">[mit] n. 肉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 mete (食物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的牛排，"肉(meat)"
    <tspan x="50" dy="25">在餐桌上散发着诱人的香气，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers to eat lean meat.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢吃瘦肉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Steak -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Knife -->
    <line x1="300" y1="50" x2="350" y2="150" class="image" />
    <line x1="300" y1="150" x2="350" y2="50" class="image" />
    <!-- Fork -->
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <line x1="250" y1="50" x2="230" y2="70" class="image" />
    <line x1="250" y1="50" x2="270" y2="70" class="image" />
  </g>
</svg>