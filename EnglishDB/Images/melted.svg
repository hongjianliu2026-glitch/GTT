<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">melted</text>
  <text x="50" y="120" class="subtitle">[meltɪd] adj. 融化的，熔化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> melt (融化) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冰淇淋在阳光下，"融化(melt)"
    <tspan x="50" dy="25">成了一滩甜蜜的液体，这就是"融化的(melted)"冰淇淋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ice cream had melted by the time we got home.
  </text>
  <text x="50" y="310" class="content">
    我们到家时，冰淇淋已经融化了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" fill="#F1C40F" />
    <!-- Ice cream -->
    <circle cx="150" cy="100" r="30" fill="#E74C3C" />
    <circle cx="150" cy="70" r="20" fill="#F39C12" />
    <circle cx="150" cy="40" r="10" fill="#F1C40F" />
    <!-- Melted part -->
    <rect x="120" y="100" width="60" height="30" fill="#E74C3C" />
    <rect x="130" y="130" width="40" height="20" fill="#E74C3C" />
    <rect x="140" y="150" width="20" height="10" fill="#E74C3C" />
  </g>
</svg>