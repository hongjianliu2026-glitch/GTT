<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">doings</text>
  <text x="50" y="120" class="subtitle">[ˈduːɪŋz] n. 行为，活动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> do (做) + -ing (正在进行) + -s (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在忙碌地"做(do)"各种事情，
    <tspan x="50" dy="25">这些正在进行的活动(doings)构成了他们的日常生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doings of the committee were closely watched by the public.
  </text>
  <text x="50" y="310" class="content">
    委员会的行为受到公众的密切关注。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People doing activities -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="90" x2="30" y2="100" class="image" />
    <line x1="50" y1="90" x2="70" y2="100" class="image" />
    <line x1="50" y1="120" x2="30" y2="140" class="image" />
    <line x1="50" y1="120" x2="70" y2="140" class="image" />

    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="150" y1="90" x2="130" y2="100" class="image" />
    <line x1="150" y1="90" x2="170" y2="100" class="image" />
    <line x1="150" y1="120" x2="130" y2="140" class="image" />
    <line x1="150" y1="120" x2="170" y2="140" class="image" />

    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="90" x2="230" y2="100" class="image" />
    <line x1="250" y1="90" x2="270" y2="100" class="image" />
    <line x1="250" y1="120" x2="230" y2="140" class="image" />
    <line x1="250" y1="120" x2="270" y2="140" class="image" />

    <!-- Activities -->
    <rect x="30" y="150" width="40" height="20" class="image" />
    <rect x="130" y="150" width="40" height="20" class="image" />
    <rect x="230" y="150" width="40" height="20" class="image" />
  </g>
</svg>