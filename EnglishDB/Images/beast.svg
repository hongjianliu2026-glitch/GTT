<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beast</text>
  <text x="50" y="120" class="subtitle">[biːst] n. 野兽，凶残的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bheu- (存在) + -ast (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"存在的(bheu-)"生物，它强大而凶猛，
    <tspan x="50" dy="25">就像一头野兽(beast)，在森林中咆哮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion is known as the king of beasts.
  </text>
  <text x="50" y="310" class="content">
    狮子被称为百兽之王。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beast -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Right leg -->
    <!-- Roar -->
    <text x="100" y="100" class="image" font-size="30">ROAR!</text>
  </g>
</svg>