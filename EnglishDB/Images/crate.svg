<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crate</text>
  <text x="50" y="120" class="subtitle">[kreɪt] n. 板条箱，箱子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crat (源自希腊语 kratos，意为“力量”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的板条箱，"力量(crat)"
    <tspan x="50" dy="25">支撑着里面的物品，就像一个坚固的箱子(crate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crate was too heavy for one person to lift.
  </text>
  <text x="50" y="310" class="content">
    这个板条箱太重了，一个人抬不起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wooden planks -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
  </g>
</svg>