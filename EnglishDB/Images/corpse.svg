<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #7E5109; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #1A5276; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">corpse</text>
  <text x="50" y="120" class="subtitle">[kɔːrpəs] n. 尸体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> corp (身体) + -se (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的身体(corp)躺在地上，
    <tspan x="50" dy="25">周围是荒凉的景象，这就是一具尸体(corpse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective examined the corpse for clues.
  </text>
  <text x="50" y="310" class="content">
    侦探检查尸体以寻找线索。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Corpse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="175" x2="125" y2="225" class="image" />
    <line x1="175" y1="175" x2="225" y2="225" class="image" />
    <line x1="175" y1="200" x2="125" y2="250" class="image" />
    <line x1="175" y1="200" x2="225" y2="250" class="image" />
  </g>
</svg>