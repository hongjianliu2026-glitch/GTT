<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ambitious</text>
  <text x="50" y="120" class="subtitle">[æmˈbɪʃəs] adj. 有雄心的，野心勃勃的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ambi- (周围) + it (走) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个野心勃勃的人，"四处走动(ambi-it)"，
    <tspan x="50" dy="25">试图抓住每一个机会，实现自己的目标。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is an ambitious entrepreneur who aims to conquer the global market.
  </text>
  <text x="50" y="310" class="content">
    他是一个有野心的企业家，目标是要征服全球市场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with arms wide open -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="20" y2="180" class="image" />
    <line x1="50" y1="120" x2="80" y2="180" class="image" />
    <line x1="50" y1="90" x2="100" y2="70" class="image" />
    <line x1="50" y1="90" x2="0" y2="70" class="image" />
    <!-- Globe -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="50" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="50" y2="150" class="image" />
    <line x1="200" y1="100" x2="100" y2="150" class="image" />
  </g>
</svg>