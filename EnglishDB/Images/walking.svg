<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">walking</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːkɪŋ] n. 步行，散步；adj. 步行的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> walk (走) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公园里悠闲地"走(walk)"，
    <tspan x="50" dy="25">享受着步行的乐趣，这就是walking的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enjoys a morning walking in the park.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在公园里晨走。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Path for walking -->
    <path d="M50 150 Q100 50 150 150 T250 150" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="150" r="10" class="image" />
    <line x1="50" y1="160" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="30" y2="170" class="image" />
    <line x1="50" y1="180" x2="70" y2="170" class="image" />
  </g>
</svg>