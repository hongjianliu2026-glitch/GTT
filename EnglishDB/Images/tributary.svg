<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tributary</text>
  <text x="50" y="120" class="subtitle">[ˈtrɪbjəteri] n. 支流，进贡者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tribut (给予) + -ary (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，它"给予(tribut)"水流到更大的河流中，
    <tspan x="50" dy="25">这条小河就是大河的支流(tributary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The river has many tributaries that flow into it.
  </text>
  <text x="50" y="310" class="content">
    这条河有许多支流汇入其中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main river -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Tributary -->
    <line x1="50" y1="50" x2="150" y2="100" class="image" />
    <!-- Arrow indicating flow -->
    <polygon points="150,100 140,90 140,110" class="image" />
    <!-- River bank -->
    <line x1="0" y1="110" x2="350" y2="110" class="image" />
    <line x1="0" y1="90" x2="350" y2="90" class="image" />
  </g>
</svg>