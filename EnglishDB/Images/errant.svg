<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">errant</text>
  <text x="50" y="120" class="subtitle">[ˈerənt] adj. 错误的，偏离正道的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> err (错误) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骑士在迷雾中迷失方向，"错误地(err-ant)"
    <tspan x="50" dy="25">偏离了正道，最终走入了错误的道路。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The errant knight was lost in the forest.
  </text>
  <text x="50" y="310" class="content">
    那个偏离正道的骑士在森林中迷失了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knight -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Mist -->
    <path d="M100,80 Q150,100 200,80 Q250,100 300,80" class="image" />
    <path d="M100,120 Q150,140 200,120 Q250,140 300,120" class="image" />
    <path d="M100,160 Q150,180 200,160 Q250,180 300,160" class="image" />
    <!-- Path -->
    <line x1="50" y1="250" x2="350" y2="250" class="image" />
    <line x1="50" y1="250" x2="50" y2="270" class="image" />
    <line x1="350" y1="250" x2="350" y2="270" class="image" />
    <!-- Wrong path -->
    <line x1="150" y1="250" x2="150" y2="300" class="image" />
    <line x1="250" y1="250" x2="250" y2="300" class="image" />
  </g>
</svg>