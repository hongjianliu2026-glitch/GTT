<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">musical</text>
  <text x="50" y="120" class="subtitle">[ˈmjuːzɪkl] adj. 音乐的，悦耳的；n. 音乐剧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mus (音乐) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满音乐(mus)的舞台，演员们随着悦耳的旋律(ical)
    <tspan x="50" dy="25">翩翩起舞，这就是音乐剧(musical)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She starred in a musical on Broadway.
  </text>
  <text x="50" y="310" class="content">
    她在百老汇的一部音乐剧中担任主角。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Musical notes -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="70" r="10" class="image" />
    <circle cx="110" cy="90" r="10" class="image" />
    <circle cx="140" cy="110" r="10" class="image" />
    <!-- Dancer -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>