<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">charging</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɑːrdʒɪŋ] v. 充电，收费</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> charge (装载，充电) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的电池正在"装载(charge)"能量，
    <tspan x="50" dy="25">就像一个超级英雄在充电，准备释放强大的能量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The phone is charging on the table.
  </text>
  <text x="50" y="310" class="content">
    手机正在桌子上充电。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battery -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <rect x="10" y="10" width="180" height="80" class="image" />
    <!-- Lightning bolt -->
    <line x1="20" y1="20" x2="180" y2="80" class="image" />
    <line x1="20" y1="80" x2="180" y2="20" class="image" />
    <!-- Charging symbol -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="130" class="image" />
    <line x1="100" y1="150" x2="120" y2="130" class="image" />
  </g>
</svg>