<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ready</text>
  <text x="50" y="120" class="subtitle">[ˈrɛdi] adj. 准备好的，乐意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + ad- (朝向) + -y (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在起跑线上，"再次朝向(re-ad-y)"
    <tspan x="50" dy="25">终点，随时准备出发，这就是准备好的状态(ready)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team was ready to start the race.
  </text>
  <text x="50" y="310" class="content">
    团队已经准备好开始比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Start line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Runner -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Finish line -->
    <line x1="300" y1="0" x2="300" y2="150" class="image" />
    <line x1="320" y1="0" x2="320" y2="150" class="image" />
  </g>
</svg>