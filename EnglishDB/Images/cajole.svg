<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cajole</text>
  <text x="50" y="120" class="subtitle">[kəˈdʒoʊl] v. 哄骗，诱骗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ca- (接近) + jole (欢乐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用甜言蜜语"接近(ca-)"你，
    <tspan x="50" dy="25">让你感到"欢乐(jole)"，但实际上是在哄骗你。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cajoled him into buying her a new phone.
  </text>
  <text x="50" y="310" class="content">
    她哄骗他给她买了一部新手机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person speaking -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M 100 80 Q 150 50 200 80 Q 250 110 200 140 Q 150 170 100 140 Z" class="image" />
    <text x="120" y="110" class="content" fill="#A93226">甜言蜜语</text>
    <!-- Target person -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="200" class="image" />
    <line x1="300" y1="160" x2="320" y2="200" class="image" />
    <line x1="300" y1="140" x2="340" y2="130" class="image" />
  </g>
</svg>