<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">opposed</text>
  <text x="50" y="120" class="subtitle">[əˈpoʊzd] adj. 反对的，对立的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> op- (相反) + pos (放置) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站立，"相反地放置(op-pos-ed)"
    <tspan x="50" dy="25">他们的立场，形成对立的局面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The council members were strongly opposed to the new plan.
  </text>
  <text x="50" y="310" class="content">
    议会成员强烈反对新计划。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Arms crossed in opposition -->
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <!-- Ground line -->
    <line x1="0" y1="180" x2="300" y2="180" class="image" />
  </g>
</svg>