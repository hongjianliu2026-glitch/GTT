<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">displace</text>
  <text x="50" y="120" class="subtitle">[dɪsˈpleɪs] v. 取代，移位</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (离开) + place (位置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磁铁，"离开(dis-)"
    <tspan x="50" dy="25">原来的位置(place)，把其他物体都推开了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new technology has displaced many traditional jobs.
  </text>
  <text x="50" y="310" class="content">
    新技术已经取代了许多传统工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <text x="20" y="60" class="content">Magnet</text>
    <!-- Objects being displaced -->
    <circle cx="150" cy="50" r="20" class="image" />
    <text x="140" y="60" class="content">Obj1</text>
    <circle cx="200" cy="50" r="20" class="image" />
    <text x="190" y="60" class="content">Obj2</text>
    <circle cx="250" cy="50" r="20" class="image" />
    <text x="240" y="60" class="content">Obj3</text>
    <!-- Arrows showing displacement -->
    <line x1="100" y1="50" x2="130" y2="50" class="image" />
    <line x1="100" y1="50" x2="180" y2="50" class="image" />
    <line x1="100" y1="50" x2="230" y2="50" class="image" />
  </g>
</svg>