<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antidote</text>
  <text x="50" y="120" class="subtitle">[ˈæntɪdoʊt] n. 解毒剂，解药</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (对抗) + dote (给予)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的骑士，手持一瓶"对抗(anti-)"
    <tspan x="50" dy="25">毒药的解药(dote)，准备拯救中毒的公主。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor quickly administered the antidote to the poisoned patient.
  </text>
  <text x="50" y="310" class="content">
    医生迅速给中毒的病人服用了解毒剂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knight -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Bottle -->
    <rect x="70" y="90" width="30" height="60" class="image" />
    <line x1="85" y1="90" x2="85" y2="70" class="image" />
    <!-- Poison -->
    <line x1="120" y1="100" x2="150" y2="100" class="image" />
    <line x1="120" y1="120" x2="150" y2="120" class="image" />
    <line x1="120" y1="140" x2="150" y2="140" class="image" />
    <!-- Princess -->
    <circle cx="180" cy="100" r="15" class="image" />
    <line x1="180" y1="115" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="160" y2="180" class="image" />
    <line x1="180" y1="150" x2="200" y2="180" class="image" />
    <line x1="180" y1="130" x2="210" y2="120" class="image" />
  </g>
</svg>