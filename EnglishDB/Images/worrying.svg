<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">worrying</text>
  <text x="50" y="120" class="subtitle">[ˈwʌrɪŋ] adj. 令人担忧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> worr (烦恼) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人皱着眉头，"烦恼(worr)"
    <tspan x="50" dy="25">的表情，这就是"令人担忧的(worrying)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The worrying news made everyone anxious.
  </text>
  <text x="50" y="310" class="content">
    这个令人担忧的消息让每个人都感到焦虑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyebrows -->
    <line x1="70" y1="80" x2="90" y2="70" class="image" />
    <line x1="110" y1="70" x2="130" y2="80" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="100" r="5" class="image" />
    <circle cx="120" cy="100" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
  </g>
</svg>