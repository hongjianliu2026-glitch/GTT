<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">networking</text>
  <text x="50" y="120" class="subtitle">[ˈnɛtwɜrkɪŋ] n. 网络，社交网络</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> net (网) + work (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一个巨大的网中，"通过网络(net-work)"
    <tspan x="50" dy="25">互相连接，分享信息，这就是社交网络(networking)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She attended a networking event to meet new clients.
  </text>
  <text x="50" y="310" class="content">
    她参加了一个社交活动以结识新客户。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Network connections -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <line x1="50" y1="150" x2="350" y2="150" class="image" />
    <line x1="50" y1="200" x2="350" y2="200" class="image" />
    <line x1="50" y1="250" x2="350" y2="250" class="image" />
    <!-- People -->
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="300" cy="150" r="15" class="image" />
    <circle cx="150" cy="200" r="15" class="image" />
    <circle cx="250" cy="250" r="15" class="image" />
    <!-- Connecting lines -->
    <line x1="100" y1="50" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="250" y2="250" class="image" />
  </g>
</svg>