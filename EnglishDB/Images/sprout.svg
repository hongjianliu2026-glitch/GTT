<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .plant { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sprout</text>
  <text x="50" y="120" class="subtitle">[spraʊt] v. 发芽，生长；n. 芽，幼苗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sprout (源自中古英语 spruten，意为“发芽”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗种子在土壤中“发芽(sprout)”，
    <tspan x="50" dy="25">幼苗从地面冒出，生机勃勃地生长。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The seeds sprouted after a week of rain.
  </text>
  <text x="50" y="310" class="content">
    经过一周的雨水，种子发芽了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soil -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#8D6E63" />
    <!-- Seed -->
    <circle cx="175" cy="140" r="10" class="image" fill="#D4AC0D" />
    <!-- Sprout -->
    <line x1="175" y1="140" x2="175" y2="50" class="image" />
    <line x1="175" y1="50" x2="160" y2="70" class="image" />
    <line x1="175" y1="50" x2="190" y2="70" class="image" />
    <line x1="175" y1="50" x2="165" y2="80" class="image" />
    <line x1="175" y1="50" x2="185" y2="80" class="image" />
    <!-- Leaves -->
    <circle cx="175" cy="50" r="15" class="plant" />
    <circle cx="160" cy="70" r="10" class="plant" />
    <circle cx="190" cy="70" r="10" class="plant" />
    <circle cx="165" cy="80" r="8" class="plant" />
    <circle cx="185" cy="80" r="8" class="plant" />
  </g>
</svg>