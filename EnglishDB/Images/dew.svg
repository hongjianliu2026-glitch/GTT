<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .dew { fill: #A3E4D7; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dew</text>
  <text x="50" y="120" class="subtitle">[djuː] n. 露水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + w (水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象清晨的草地上，"水滴(w)"
    <tspan x="50" dy="25">从天空中"向下(de)"轻轻落下，</tspan>
    <tspan x="50" dy="25">形成了晶莹剔透的露水(dew)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The grass was covered with dew in the early morning.
  </text>
  <text x="50" y="310" class="content">
    清晨的草地上覆盖着露水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Dew drops -->
    <circle cx="50" cy="140" r="10" class="dew" />
    <circle cx="100" cy="130" r="10" class="dew" />
    <circle cx="150" cy="145" r="10" class="dew" />
    <circle cx="200" cy="135" r="10" class="dew" />
    <circle cx="250" cy="140" r="10" class="dew" />
    <circle cx="300" cy="130" r="10" class="dew" />
  </g>
</svg>