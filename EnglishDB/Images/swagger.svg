<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swagger</text>
  <text x="50" y="120" class="subtitle">[ˈswæɡər] v. 大摇大摆地走，自夸；n. 自大，炫耀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swag (摇摆) + -er (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走路时，"摇摆(swag)"着身体，
    <tspan x="50" dy="25">每一步都显得非常自信和自大，这就是"swagger"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He swaggered into the room, confident of his success.
  </text>
  <text x="50" y="310" class="content">
    他自信满满地大摇大摆走进房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person swaggering -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Swaggering motion -->
    <line x1="30" y1="220" x2="20" y2="240" class="image" />
    <line x1="70" y1="220" x2="80" y2="240" class="image" />
  </g>
</svg>