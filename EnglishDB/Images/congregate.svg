<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">congregate</text>
  <text x="50" y="120" class="subtitle">[ˈkɒŋɡrɪɡeɪt] v. 聚集，集合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + greg (群体) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人从四面八方"一起(con-)"
    <tspan x="50" dy="25">走向一个中心点，形成一个"群体(greg)"，</tspan>
    <tspan x="50" dy="25">这就是"聚集(congregate)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> People congregated in the square to celebrate the festival.
  </text>
  <text x="50" y="310" class="content">
    人们聚集在广场上庆祝节日。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Center point -->
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <circle cx="300" cy="50" r="15" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="65" x2="165" y2="90" class="image" />
    <line x1="100" y1="165" x2="170" y2="110" class="image" />
    <line x1="250" y1="165" x2="180" y2="110" class="image" />
    <line x1="300" y1="65" x2="185" y2="90" class="image" />
    <polygon points="165,90 170,85 175,90 170,95" class="image" />
    <polygon points="170,110 175,105 180,110 175,115" class="image" />
    <polygon points="180,110 185,105 190,110 185,115" class="image" />
    <polygon points="185,90 190,85 195,90 190,95" class="image" />
  </g>
</svg>