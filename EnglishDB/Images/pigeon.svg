<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pigeon</text>
  <text x="50" y="120" class="subtitle">[ˈpɪdʒɪn] n. 鸽子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "pipio" (小鸟)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟(pipio)在城市的高楼间飞翔，
    <tspan x="50" dy="25">它就是那只象征和平的鸽子(pigeon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pigeon cooed softly on the windowsill.
  </text>
  <text x="50" y="310" class="content">
    鸽子在窗台上轻轻地咕咕叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skyscraper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />

    <!-- Pigeon -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
  </g>
</svg>