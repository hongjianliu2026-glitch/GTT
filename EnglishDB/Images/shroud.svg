<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shroud</text>
  <text x="50" y="120" class="subtitle">[ʃraʊd] n. 裹尸布，遮蔽物；v. 覆盖，遮蔽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shroud (源自中古英语 shrowd，意为覆盖物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的裹尸布"覆盖(shroud)"在一座古老的雕像上，
    <tspan x="50" dy="25">遮蔽了它的真实面貌，增添了一层神秘感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mountain was shrouded in mist.
  </text>
  <text x="50" y="310" class="content">
    那座山被雾气笼罩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ancient statue -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Shroud -->
    <rect x="20" y="20" width="160" height="260" class="image" />
    <!-- Eyes -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="120" cy="100" r="10" class="image" />
    <!-- Mouth -->
    <line x1="90" y1="150" x2="130" y2="150" class="image" />
  </g>
</svg>