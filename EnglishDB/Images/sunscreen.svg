<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunscreen</text>
  <text x="50" y="120" class="subtitle">[ˈsʌnˌskriːn] n. 防晒霜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + screen (屏蔽)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在沙滩上，"太阳(sun)"
    <tspan x="50" dy="25">强烈照射，他涂抹"屏蔽(screen)"</tspan>
    <tspan x="50" dy="25">紫外线的防晒霜(sunscreen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She applied sunscreen before going to the beach.
  </text>
  <text x="50" y="310" class="content">
    她去海滩前涂抹了防晒霜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="250" cy="100" r="20" fill="#2C3E50" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="150" x2="220" y2="130" class="image" />
    <line x1="250" y1="150" x2="280" y2="130" class="image" />
    <line x1="250" y1="180" x2="220" y2="210" class="image" />
    <line x1="250" y1="180" x2="280" y2="210" class="image" />
    <!-- Sunscreen -->
    <rect x="220" y="80" width="60" height="20" fill="#E67E22" />
    <text x="230" y="95" fill="#FFFFFF" font-size="12">Sunscreen</text>
  </g>
</svg>