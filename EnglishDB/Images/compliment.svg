<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compliment</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmplɪmənt] n. 赞美，恭维；v. 赞美，恭维</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + pli (充满) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人充满(pli)真诚的赞美(com-pli-ment)，
    <tspan x="50" dy="25">他的话语像花朵一样绽放，让人感到无比愉悦。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received many compliments on her new dress.
  </text>
  <text x="50" y="310" class="content">
    她收到了许多对她新裙子的赞美。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person receiving compliment -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />

    <!-- Flowers representing compliments -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="180" cy="100" r="20" class="image" />
    <circle cx="210" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="180" y1="120" x2="180" y2="150" class="image" />
    <line x1="210" y1="120" x2="210" y2="150" class="image" />

    <!-- Speech bubble -->
    <path d="M250,100 Q300,50 350,100" class="image" />
    <text x="270" y="100" class="content" text-anchor="middle">赞美</text>
  </g>
</svg>