<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">railway</text>
  <text x="50" y="120" class="subtitle">[ˈreɪlweɪ] n. 铁路</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rail (铁轨) + way (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条铁轨(rail)上，火车在"路上(way)"飞驰，
    <tspan x="50" dy="25">这就是铁路(railway)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The railway connects the two cities.
  </text>
  <text x="50" y="310" class="content">
    这条铁路连接了两个城市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rail tracks -->
    <line x1="0" y1="50" x2="350" y2="50" class="image" />
    <line x1="0" y1="70" x2="350" y2="70" class="image" />
    <!-- Train -->
    <rect x="100" y="20" width="150" height="50" class="image" />
    <circle cx="120" cy="45" r="10" class="image" />
    <circle cx="280" cy="45" r="10" class="image" />
    <!-- Smoke -->
    <path d="M100,20 Q80,10 60,20" class="image" />
    <path d="M90,20 Q70,10 50,20" class="image" />
  </g>
</svg>