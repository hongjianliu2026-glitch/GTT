<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outing</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtɪŋ] n. 外出，郊游</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外面) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"走出(out-ing)"家门，
    <tspan x="50" dy="25">来到大自然中享受阳光和新鲜空气，这就是一次郊游(outing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had a great time on our family outing last weekend.
  </text>
  <text x="50" y="310" class="content">
    我们上周末的家庭郊游玩得很开心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" fill="#F39C12" />
    <!-- People -->
    <circle cx="150" cy="100" r="15" fill="#2980B9" />
    <circle cx="180" cy="100" r="15" fill="#2980B9" />
    <circle cx="210" cy="100" r="15" fill="#2980B9" />
    <!-- Path -->
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <!-- Trees -->
    <rect x="280" y="60" width="40" height="80" class="image" />
    <rect x="330" y="60" width="40" height="80" class="image" />
  </g>
</svg>