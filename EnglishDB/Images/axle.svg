<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">axle</text>
  <text x="50" y="120" class="subtitle">[ˈæksl] n. 车轴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> axl (源自拉丁语 "axis"，意为轴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆巨大的卡车，它的轮子围绕着一个巨大的"轴(axle)"旋转，
    <tspan x="50" dy="25">这个轴支撑着整个卡车的重量，就像一根巨大的棍子贯穿车轮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mechanic replaced the broken axle on the truck.
  </text>
  <text x="50" y="310" class="content">
    机械师更换了卡车上的断轴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Axle -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="50" cy="150" r="30" class="image" />
    <!-- Truck -->
    <rect x="0" y="80" width="100" height="40" class="image" />
  </g>
</svg>