<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">projector</text>
  <text x="50" y="120" class="subtitle">[prəˈdʒektər] n. 投影仪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + ject (投掷) + -or (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的投影仪，"向前投掷(pro-ject)"
    <tspan x="50" dy="25">出巨大的影像，覆盖整个墙壁，就像一个巨人</tspan>
    <tspan x="50" dy="25">在展示他的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The projector displayed the movie on the big screen.
  </text>
  <text x="50" y="310" class="content">
    投影仪将电影投射在大屏幕上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Projector -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Lens -->
    <circle cx="100" cy="75" r="30" class="image" />
    <!-- Beam -->
    <line x1="100" y1="150" x2="100" y2="300" class="image" />
    <!-- Screen -->
    <rect x="250" y="250" width="300" height="150" class="image" />
    <!-- Image on screen -->
    <rect x="270" y="270" width="260" height="110" class="image" />
  </g>
</svg>