<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pedigree</text>
  <text x="50" y="120" class="subtitle">[ˈpedɪɡriː] n. 家谱，血统</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pedi- (儿童) + -gram (写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的家族，"写下(gram)"
    <tspan x="50" dy="25">他们的"儿童(pedi)"历史，</tspan>
    <tspan x="50" dy="25">这些记录就构成了家谱(pedigree)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog's pedigree shows it has a noble ancestry.
  </text>
  <text x="50" y="310" class="content">
    这只狗的家谱显示它有高贵的血统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family tree -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="150" y2="80" class="image" />
    <line x1="50" y1="20" x2="250" y2="80" class="image" />
    <line x1="150" y1="80" x2="250" y2="80" class="image" />
    <line x1="150" y1="80" x2="150" y2="180" class="image" />
    <line x1="250" y1="80" x2="250" y2="180" class="image" />
    <line x1="150" y1="180" x2="250" y2="180" class="image" />
    <!-- Family members -->
    <circle cx="50" cy="20" r="10" class="image" />
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="250" cy="80" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
  </g>
</svg>