<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">herring</text>
  <text x="50" y="120" class="subtitle">[ˈhɛrɪŋ] n. 鲱鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> herr (源自中古英语，意为“鲱鱼”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群鲱鱼在海中游动，它们成群结队，
    <tspan x="50" dy="25">就像一条条银色的线在水中穿梭，这就是“鲱鱼(herring)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fishermen caught a large school of herring.
  </text>
  <text x="50" y="310" class="content">
    渔民们捕获了一大群鲱鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish body -->
    <ellipse cx="100" cy="100" rx="80" ry="40" class="image" />
    <!-- Fish tail -->
    <polygon points="180,100 220,80 220,120" class="image" />
    <!-- Fish eye -->
    <circle cx="60" cy="90" r="10" class="image" />
    <!-- Fish gills -->
    <line x1="80" y1="80" x2="80" y2="120" class="image" />
    <line x1="90" y1="80" x2="90" y2="120" class="image" />
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
  </g>
</svg>