<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ass</text>
  <text x="50" y="120" class="subtitle">[æs] n. 驴子，傻瓜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "asinus"，意为驴子
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只驴子(ass)在田野里悠闲地吃草，
    <tspan x="50" dy="25">它的傻乎乎的样子让人忍俊不禁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He acted like an ass in front of everyone.
  </text>
  <text x="50" y="310" class="content">
    他在大家面前表现得像个傻瓜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Donkey -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Leg 1 -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Leg 2 -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Ear 1 -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Ear 2 -->
    <circle cx="50" cy="40" r="5" class="image" /> <!-- Eye -->
    <line x1="50" y1="60" x2="50" y2="70" class="image" /> <!-- Mouth -->
  </g>
</svg>