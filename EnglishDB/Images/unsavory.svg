<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unsavory</text>
  <text x="50" y="120" class="subtitle">[ʌnˈseɪvəri] adj. 令人不快的，味道不好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + savory (美味的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人咬了一口"不美味(un-savory)"的食物，
    <tspan x="50" dy="25">立刻皱起眉头，露出厌恶的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smell of the rotten fish was unsavory.
  </text>
  <text x="50" y="310" class="content">
    腐烂的鱼散发出的气味令人不快。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rotten fish -->
    <ellipse cx="100" cy="100" rx="80" ry="40" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <!-- Disgusted face -->
    <circle cx="300" cy="100" r="50" class="image" />
    <line x1="280" y1="90" x2="320" y2="90" class="image" />
    <line x1="290" y1="110" x2="310" y2="110" class="image" />
    <line x1="280" y1="130" x2="320" y2="130" class="image" />
    <line x1="290" y1="150" x2="310" y2="150" class="image" />
    <line x1="300" y1="160" x2="300" y2="180" class="image" />
  </g>
</svg>