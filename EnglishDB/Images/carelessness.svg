<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carelessness</text>
  <text x="50" y="120" class="subtitle">[ˈkerləsnəs] n. 粗心，疏忽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> care (关心) + less (没有) + ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路时，"没有关心(care-less)"
    <tspan x="50" dy="25">脚下的小石头，结果被绊倒，这就是粗心(carelessness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His carelessness caused the accident.
  </text>
  <text x="50" y="310" class="content">
    他的粗心导致了事故。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="150" y2="100" class="image" />
    <circle cx="50" cy="100" r="10" class="image" />
    <!-- Stone -->
    <rect x="140" y="90" width="20" height="10" class="image" />
    <!-- Fallen person -->
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="250" y2="100" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
  </g>
</svg>