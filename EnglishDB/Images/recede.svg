<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recede</text>
  <text x="50" y="120" class="subtitle">[rɪˈsiːd] v. 后退，退去</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + ced (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海浪，"向后走(re-ced)"
    <tspan x="50" dy="25">逐渐退去，留下一片平静的海滩。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The floodwaters finally receded, revealing the damage.
  </text>
  <text x="50" y="310" class="content">
    洪水终于退去，露出了被破坏的景象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wave -->
    <path d="M50 100 C100 50, 250 50, 300 100" class="image" />
    <path d="M50 120 C100 170, 250 170, 300 120" class="image" />
    <!-- Beach -->
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
  </g>
</svg>