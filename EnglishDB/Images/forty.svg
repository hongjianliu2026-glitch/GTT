<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forty</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrti] n. 四十</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> four (四) + ty (表示“十”的后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“40”，它是由“四(four)”和“十(ty)”组成的，
    <tspan x="50" dy="25">就像四十个苹果排成一排，整齐地排列在一起。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has forty apples in her basket.
  </text>
  <text x="50" y="310" class="content">
    她的篮子里有四十个苹果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large number "40" -->
    <text x="0" y="100" font-size="200" fill="#E74C3C">40</text>
    <!-- Apples -->
    <g transform="translate(0,200)">
      <circle cx="20" cy="20" r="15" fill="#FF6347" />
      <circle cx="60" cy="20" r="15" fill="#FF6347" />
      <circle cx="100" cy="20" r="15" fill="#FF6347" />
      <circle cx="140" cy="20" r="15" fill="#FF6347" />
      <circle cx="180" cy="20" r="15" fill="#FF6347" />
      <circle cx="220" cy="20" r="15" fill="#FF6347" />
      <circle cx="260" cy="20" r="15" fill="#FF6347" />
      <circle cx="300" cy="20" r="15" fill="#FF6347" />
      <circle cx="340" cy="20" r="15" fill="#FF6347" />
      <circle cx="380" cy="20" r="15" fill="#FF6347" />
      <circle cx="20" cy="60" r="15" fill="#FF6347" />
      <circle cx="60" cy="60" r="15" fill="#FF6347" />
      <circle cx="100" cy="60" r="15" fill="#FF6347" />
      <circle cx="140" cy="60" r="15" fill="#FF6347" />
      <circle cx="180" cy="60" r="15" fill="#FF6347" />
      <circle cx="220" cy="60" r="15" fill="#FF6347" />
      <circle cx="260" cy="60" r="15" fill="#FF6347" />
      <circle cx="300" cy="60" r="15" fill="#FF6347" />
      <circle cx="340" cy="60" r="15" fill="#FF6347" />
      <circle cx="380" cy="60" r="15" fill="#FF6347" />
      <circle cx="20" cy="100" r="15" fill="#FF6347" />
      <circle cx="60" cy="100" r="15" fill="#FF6347" />
      <circle cx="100" cy="100" r="15" fill="#FF6347" />
      <circle cx="140" cy="100" r="15" fill="#FF6347" />
      <circle cx="180" cy="100" r="15" fill="#FF6347" />
      <circle cx="220" cy="100" r="15" fill="#FF6347" />
      <circle cx="260" cy="100" r="15" fill="#FF6347" />
      <circle cx="300" cy="100" r="15" fill="#FF6347" />
      <circle cx="340" cy="100" r="15" fill="#FF6347" />
      <circle cx="380" cy="100" r="15" fill="#FF6347" />
      <circle cx="20" cy="140" r="15" fill="#FF6347" />
      <circle cx="60" cy="140" r="15" fill="#FF6347" />
      <circle cx="100" cy="140" r="15" fill="#FF6347" />
      <circle cx="140" cy="140" r="15" fill="#FF6347" />
      <circle cx="180" cy="140" r="15" fill="#FF6347" />
      <circle cx="220" cy="140" r="15" fill="#FF6347" />
      <circle cx="260" cy="140" r="15" fill="#FF6347" />
      <circle cx="300" cy="140" r="15" fill="#FF6347" />
      <circle cx="340" cy="140" r="15" fill="#FF6347" />
      <circle cx="380" cy="140" r="15" fill="#FF6347" />
    </g>
  </g>
</svg>