<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">long-lasting</text>
  <text x="50" y="120" class="subtitle">[ˈlɔːŋˈlæstɪŋ] adj. 持久的，耐久的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> long (长) + lasting (持续)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的钟表，"长(long)"时间地"持续(lasting)"
    <tspan x="50" dy="25">运转，象征着持久的品质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This long-lasting battery can power your device for days.
  </text>
  <text x="50" y="310" class="content">
    这块持久的电池可以为你的设备供电数天。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="245" y2="100" class="image" />
    <!-- Ancient symbol -->
    <text x="150" y="220" class="content" style="font-size: 36px; fill: #7F8C8D;">⏳</text>
  </g>
</svg>