<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4E8F3; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sorcerer</text>
  <text x="50" y="120" class="subtitle">[ˈsɔːrsərər] n. 男巫，术士</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sorc (咒语) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个男巫(sorcerer)手持魔杖，念着咒语(sorc)，
    <tspan x="50" dy="25">周围环绕着神秘的魔法光芒，仿佛掌控着整个世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sorcerer cast a spell to protect the village.
  </text>
  <text x="50" y="310" class="content">
    男巫施了一个咒语来保护村庄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sorcerer -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Right leg -->
    <!-- Magic wand -->
    <line x1="80" y1="130" x2="120" y2="80" class="image" />
    <!-- Magic circle -->
    <circle cx="50" cy="100" r="50" class="image" />
    <!-- Stars -->
    <circle cx="30" cy="80" r="5" class="image" />
    <circle cx="70" cy="80" r="5" class="image" />
    <circle cx="50" cy="60" r="5" class="image" />
  </g>
</svg>