<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .land { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">floodplain</text>
  <text x="50" y="120" class="subtitle">[ˈflʌdpleɪn] n. 泛滥平原，河漫滩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flood (洪水) + plain (平原)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片平原，"洪水(flood)"
    <tspan x="50" dy="25">经常淹没这片土地，形成了泛滥平原(floodplain)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The village was built on a floodplain, making it prone to flooding.
  </text>
  <text x="50" y="310" class="content">
    这个村庄建在泛滥平原上，容易遭受洪水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Floodplain -->
    <rect x="0" y="0" width="350" height="200" class="land" />
    <!-- Water -->
    <rect x="50" y="50" width="250" height="100" class="water" />
    <!-- Trees -->
    <line x1="70" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="100" y2="180" class="image" />
    <line x1="130" y1="150" x2="130" y2="180" class="image" />
    <line x1="160" y1="150" x2="160" y2="180" class="image" />
    <line x1="190" y1="150" x2="190" y2="180" class="image" />
    <line x1="220" y1="150" x2="220" y2="180" class="image" />
    <line x1="250" y1="150" x2="250" y2="180" class="image" />
    <line x1="280" y1="150" x2="280" y2="180" class="image" />
  </g>
</svg>