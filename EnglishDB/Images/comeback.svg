<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comeback</text>
  <text x="50" y="120" class="subtitle">[ˈkʌmˌbæk] n. 回归，复原</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> come (来) + back (回)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在比赛中落后，但他"回来(come)"并"回到(back)"
    <tspan x="50" dy="25">领先位置，这就是他的"回归(comeback)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a long absence, she made a successful comeback in the music industry.
  </text>
  <text x="50" y="310" class="content">
    经过长时间的缺席，她在音乐行业成功回归。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Runner -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Finish line -->
    <line x1="200" y1="80" x2="200" y2="200" class="image" />
    <line x1="210" y1="80" x2="210" y2="200" class="image" />
    <line x1="200" y1="80" x2="210" y2="80" class="image" />
    <line x1="200" y1="200" x2="210" y2="200" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <line x1="180" y1="100" x2="170" y2="90" class="image" />
    <line x1="180" y1="100" x2="170" y2="110" class="image" />
  </g>
</svg>