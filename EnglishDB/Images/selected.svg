<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">selected</text>
  <text x="50" y="120" class="subtitle">[sɪˈlektɪd] adj. 被选中的，精选的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + lect (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宝箱，里面装满了各种宝物。
    <tspan x="50" dy="25">一个智者从宝箱中"分开(se-)"挑选(lect)出最珍贵的宝物，</tspan>
    <tspan x="50" dy="25">这些宝物就是"被选中的(selected)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The selected candidates will be invited for an interview.
  </text>
  <text x="50" y="310" class="content">
    被选中的候选人将被邀请参加面试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Treasure -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Selected treasure -->
    <circle cx="300" cy="100" r="25" class="image" fill="#FFD700" />
    <!-- Hand selecting -->
    <line x1="300" y1="125" x2="350" y2="175" class="image" />
    <line x1="350" y1="175" x2="330" y2="195" class="image" />
    <line x1="350" y1="175" x2="370" y2="195" class="image" />
  </g>
</svg>