<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">improbable</text>
  <text x="50" y="120" class="subtitle">[ɪmˈprɒbəbl] adj. 不可能的，未必会发生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + prob (证明) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫试图"证明(prob)"自己能飞，
    <tspan x="50" dy="25">但我们都知道这是"不可能的(im-probable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It is improbable that she will arrive on time.
  </text>
  <text x="50" y="310" class="content">
    她不太可能准时到达。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat trying to fly -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="50" y2="220" class="image" /> <!-- Tail -->
    <!-- Wings -->
    <polyline points="50,80 20,120 80,120 50,80" class="image" />
    <polyline points="50,80 20,100 80,100 50,80" class="image" />
    <!-- Clouds -->
    <ellipse cx="150" cy="50" rx="60" ry="30" class="image" />
    <ellipse cx="220" cy="70" rx="50" ry="25" class="image" />
    <ellipse cx="280" cy="60" rx="40" ry="20" class="image" />
  </g>
</svg>