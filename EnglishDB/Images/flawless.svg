<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flawless</text>
  <text x="50" y="120" class="subtitle">[ˈflɔːləs] adj. 无瑕的，完美的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flaw (瑕疵) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗完美无瑕的钻石，"没有(less)任何瑕疵(flaw)"，
    <tspan x="50" dy="25">它就是无瑕的(flawless)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her performance was flawless.
  </text>
  <text x="50" y="310" class="content">
    她的表演完美无瑕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Diamond -->
    <polygon points="150,0 300,150 150,300 0,150" class="image" />
    <!-- No flaw symbol -->
    <line x1="100" y1="100" x2="200" y2="200" class="image" />
    <line x1="100" y1="200" x2="200" y2="100" class="image" />
    <text x="140" y="150" class="content" fill="#E74C3C">NO</text>
  </g>
</svg>