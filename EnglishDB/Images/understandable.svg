<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">understandable</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈstændəbl] adj. 可理解的，明白易懂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...下面) + stand (站立) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在你的"下面(under)"，用简单的语言解释复杂的概念，
    <tspan x="50" dy="25">让你能够"站立(stand)"在理解的高度上，这就是"可理解的(understandable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructions were clear and understandable.
  </text>
  <text x="50" y="310" class="content">
    这些说明清晰易懂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person explaining -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M100,80 Q150,60 200,80 Q250,100 200,120 Q150,140 100,120 Z" class="image" />
    <text x="130" y="100" class="content">简单解释</text>
    <!-- Person understanding -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="200" class="image" />
    <line x1="300" y1="160" x2="320" y2="200" class="image" />
    <line x1="300" y1="140" x2="340" y2="130" class="image" />
    <!-- Light bulb -->
    <circle cx="300" cy="50" r="20" class="image" />
    <line x1="300" y1="70" x2="300" y2="90" class="image" />
  </g>
</svg>