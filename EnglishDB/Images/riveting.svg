<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">riveting</text>
  <text x="50" y="120" class="subtitle">[ˈrɪvɪtɪŋ] adj. 吸引人的，迷人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rivet (铆钉) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者用"铆钉(rivet)"般的力量，
    <tspan x="50" dy="25">牢牢吸引住听众的注意力，让人无法移开目光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was so riveting that I couldn't take my eyes off the screen.
  </text>
  <text x="50" y="310" class="content">
    这部电影如此吸引人，以至于我无法将目光从屏幕上移开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Speaker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Audience -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Rivet -->
    <rect x="180" y="90" width="20" height="20" class="image" />
    <line x1="190" y1="90" x2="190" y2="110" class="image" />
    <line x1="180" y1="100" x2="200" y2="100" class="image" />
  </g>
</svg>