<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mannerism</text>
  <text x="50" y="120" class="subtitle">[ˈmænərɪzəm] n. 习性，癖好</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (手) + -er (名词后缀) + -ism (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人总是用同一种"手势(man-er)"来表达自己，
    <tspan x="50" dy="25">这种固定的行为就成为了他的"习性(ism)"，即mannerism。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His mannerism of constantly tapping his fingers was annoying.
  </text>
  <text x="50" y="310" class="content">
    他不停地敲手指的习惯很烦人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand gesture -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />

    <!-- Repeated gesture -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="140" x2="130" y2="160" class="image" />
    <line x1="150" y1="140" x2="170" y2="160" class="image" />
    <line x1="150" y1="180" x2="130" y2="200" class="image" />
    <line x1="150" y1="180" x2="170" y2="200" class="image" />

    <!-- Person -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="200" class="image" />
    <line x1="250" y1="180" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="230" y2="160" class="image" />
    <line x1="250" y1="140" x2="270" y2="160" class="image" />
  </g>
</svg>