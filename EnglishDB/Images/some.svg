<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">some</text>
  <text x="50" y="120" class="subtitle">[sʌm] adj. 一些，若干；pron. 一些</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *sam- (一起，共同)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人聚集在一起，"共同(sam-)"
    <tspan x="50" dy="25">分享一些(some)食物，每个人都能得到一部分。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought some apples from the market.
  </text>
  <text x="50" y="310" class="content">
    她从市场买了一些苹果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Food -->
    <rect x="50" y="80" width="100" height="50" class="image" />
    <!-- Sharing -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
  </g>
</svg>