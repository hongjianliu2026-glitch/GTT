<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spurious</text>
  <text x="50" y="120" class="subtitle">[ˈspjʊəriəs] adj. 假的，伪造的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spu- (污垢) + -rious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个伪造的宝石，表面看起来闪闪发光，
    <tspan x="50" dy="25">但内部却是"污垢(spu-)"，这就是"假的(spurious)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evidence he presented was spurious and easily debunked.
  </text>
  <text x="50" y="310" class="content">
    他提供的证据是假的，很容易被揭穿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fake gem -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="45" fill="#FFD700" />
    <circle cx="100" cy="100" r="40" fill="#D3D3D3" />
    <!-- Dirt inside -->
    <circle cx="80" cy="90" r="10" fill="#6D4C41" />
    <circle cx="120" cy="90" r="10" fill="#6D4C41" />
    <circle cx="100" cy="110" r="10" fill="#6D4C41" />
  </g>
</svg>