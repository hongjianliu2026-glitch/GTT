<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dissonance</text>
  <text x="50" y="120" class="subtitle">[ˈdɪsənəns] n. 不和谐，不一致</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + son (声音) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个音符在空中碰撞，发出刺耳的"不和谐(dis-sonance)"声音，
    <tspan x="50" dy="25">这种声音让人感到不适，就像意见不一致一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dissonance between their opinions caused tension.
  </text>
  <text x="50" y="310" class="content">
    他们意见的不一致导致了紧张气氛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two notes -->
    <path d="M50 50 L70 70 L50 90 Z" class="image" />
    <path d="M100 50 L120 70 L100 90 Z" class="image" />
    <!-- Collision -->
    <line x1="70" y1="70" x2="100" y2="70" class="image" />
    <!-- Dissonant sound waves -->
    <path d="M50 120 Q70 100 90 120 T130 120" class="image" />
    <path d="M50 140 Q70 160 90 140 T130 140" class="image" />
  </g>
</svg>