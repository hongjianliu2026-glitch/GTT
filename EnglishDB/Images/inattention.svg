<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inattention</text>
  <text x="50" y="120" class="subtitle">[ˌɪnəˈtɛnʃən] n. 不注意，疏忽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + attention (注意)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在看书，但他的眼睛却"不注意(in-attention)"
    <tspan x="50" dy="25">书本，而是四处游离，完全忽略了书中的内容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His inattention to detail cost him the job.
  </text>
  <text x="50" y="310" class="content">
    他对细节的疏忽让他失去了工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Eyes -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <!-- Lines indicating distraction -->
    <line x1="50" y1="70" x2="100" y2="120" class="image" />
    <line x1="150" y1="70" x2="100" y2="120" class="image" />
    <!-- Person -->
    <circle cx="100" cy="180" r="20" class="image" />
    <line x1="100" y1="200" x2="100" y2="240" class="image" />
    <line x1="100" y1="240" x2="80" y2="280" class="image" />
    <line x1="100" y1="240" x2="120" y2="280" class="image" />
    <line x1="100" y1="220" x2="70" y2="210" class="image" />
    <line x1="100" y1="220" x2="130" y2="210" class="image" />
  </g>
</svg>