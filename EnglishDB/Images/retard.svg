<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retard</text>
  <text x="50" y="120" class="subtitle">[rɪˈtɑːrd] v. 延迟，阻碍；n. 迟钝者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + tard (慢)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在高速公路上，"向后(re-)"
    <tspan x="50" dy="25">慢慢(tard)行驶，结果被其他车超越，这就是延迟(retard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The construction work was retarded by bad weather.
  </text>
  <text x="50" y="310" class="content">
    建筑工程因恶劣天气而延迟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="100" height="60" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="90" r="10" class="image" />
    <circle cx="130" cy="90" r="10" class="image" />
    <!-- Slow motion -->
    <line x1="170" y1="50" x2="300" y2="50" class="image" />
    <line x1="170" y1="70" x2="300" y2="70" class="image" />
    <line x1="170" y1="90" x2="300" y2="90" class="image" />
    <line x1="170" y1="110" x2="300" y2="110" class="image" />
    <!-- Other cars -->
    <rect x="200" y="20" width="100" height="60" class="image" />
    <rect x="250" y="40" width="100" height="60" class="image" />
  </g>
</svg>