<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unimaginable</text>
  <text x="50" y="120" class="subtitle">[ˌʌnɪˈmædʒɪnəbl] adj. 难以想象的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + imagine (想象) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的问号悬浮在空中，"无法想象(un-imagine)"
    <tspan x="50" dy="25">的场景，就像一个巨大的谜团，让人无法理解。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beauty of the sunset was unimaginable.
  </text>
  <text x="50" y="310" class="content">
    日落的美景难以想象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large question mark -->
    <path d="M50,50 Q100,100 150,50 T250,50" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
    <!-- Cloud of confusion -->
    <ellipse cx="150" cy="150" rx="100" ry="50" class="image" />
    <ellipse cx="200" cy="120" rx="50" ry="30" class="image" />
    <ellipse cx="100" cy="130" rx="60" ry="40" class="image" />
  </g>
</svg>