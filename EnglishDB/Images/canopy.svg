<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">canopy</text>
  <text x="50" y="120" class="subtitle">[ˈkænəpi] n. 天篷，遮篷；树冠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> can (能) + op (覆盖) + y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂密的森林，"能覆盖(can-op-y)"
    <tspan x="50" dy="25">整个天空的树冠(canopy)，形成了一个巨大的绿色天篷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dense canopy of the rainforest provided shade from the sun.
  </text>
  <text x="50" y="310" class="content">
    热带雨林的浓密树冠为人们提供了遮阳的地方。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="150" y="100" width="20" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="160" y1="100" x2="100" y2="50" class="image" />
    <line x1="160" y1="100" x2="220" y2="50" class="image" />
    <line x1="160" y1="150" x2="100" y2="100" class="image" />
    <line x1="160" y1="150" x2="220" y2="100" class="image" />
    <line x1="160" y1="200" x2="100" y2="150" class="image" />
    <line x1="160" y1="200" x2="220" y2="150" class="image" />
    <!-- Leaves -->
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="220" cy="50" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="220" cy="100" r="20" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="220" cy="150" r="20" class="image" />
  </g>
</svg>