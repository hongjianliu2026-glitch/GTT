<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .collar { fill: #FFFFFF; stroke: #000000; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">white-collar</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪt ˈkɒlə(r)] n. 白领</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> white (白色) + collar (衣领)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着白色衬衫的人，"白色衣领(white-collar)"
    <tspan x="50" dy="25">象征着办公室工作，这些人通常是白领(white-collar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He works in a white-collar job in the city.
  </text>
  <text x="50" y="310" class="content">
    他在城里从事一份白领工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shirt -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Collar -->
    <rect x="150" y="20" width="50" height="30" class="collar" />
    <rect x="200" y="20" width="50" height="30" class="collar" />
    <!-- Neck -->
    <circle cx="175" cy="50" r="20" class="image" />
    <circle cx="225" cy="50" r="20" class="image" />
    <!-- Head -->
    <circle cx="200" cy="100" r="30" class="image" />
  </g>
</svg>