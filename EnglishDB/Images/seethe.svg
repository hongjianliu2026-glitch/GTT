<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seethe</text>
  <text x="50" y="120" class="subtitle">[siːð] v. 沸腾，激动，发怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + the (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一锅水在火上"分开(se-)"并"放置(the)"，
    <tspan x="50" dy="25">水开始沸腾，就像一个人内心的愤怒在不断积累，最终爆发。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was seething with anger after the argument.
  </text>
  <text x="50" y="310" class="content">
    争论过后，她怒火中烧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Bubbles -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <circle cx="200" cy="80" r="12" class="image" />
    <circle cx="250" cy="140" r="14" class="image" />
    <!-- Fire -->
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <line x1="75" y1="190" x2="125" y2="190" class="image" />
    <line x1="100" y1="200" x2="150" y2="200" class="image" />
  </g>
</svg>