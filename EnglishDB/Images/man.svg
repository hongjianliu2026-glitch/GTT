<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">man</text>
  <text x="50" y="120" class="subtitle">[mæn] n. 男人，人类</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man- (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的"男人(man)"，
    <tspan x="50" dy="25">他站在大地上，象征着力量和勇气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a strong man who can lift heavy weights.
  </text>
  <text x="50" y="310" class="content">
    他是一个强壮的男人，能举起重物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Man -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
  </g>
</svg>