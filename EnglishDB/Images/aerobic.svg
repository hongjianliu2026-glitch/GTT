<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aerobic</text>
  <text x="50" y="120" class="subtitle">[eɪˈroʊbɪk] adj. 需氧的，有氧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aero- (空气) + -bic (需要)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在健身房里，"需要空气(aero-bic)"
    <tspan x="50" dy="25">来维持高强度的有氧运动，这样才能保持健康。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enjoys aerobic exercises like running and cycling.
  </text>
  <text x="50" y="310" class="content">
    她喜欢像跑步和骑自行车这样的有氧运动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gym scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person running -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Air symbol -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="170" cy="100" r="10" class="image" />
    <circle cx="190" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="190" y2="110" class="image" />
    <!-- Gym equipment -->
    <rect x="250" y="50" width="50" height="100" class="image" />
    <line x1="275" y1="50" x2="275" y2="150" class="image" />
  </g>
</svg>