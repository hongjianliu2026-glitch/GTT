<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">left-handed</text>
  <text x="50" y="120" class="subtitle">[ˌlɛftˈhændɪd] adj. 左撇子的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> left (左) + hand (手) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个左撇子(left-handed)的人，他用左手
    <tspan x="50" dy="25">握着一把巨大的剪刀，剪出了一只巨大的左手形状的纸片。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is left-handed, so he writes with his left hand.
  </text>
  <text x="50" y="310" class="content">
    他是左撇子，所以用左手写字。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Left hand -->
    <path d="M50 50 L100 50 L120 70 L120 100 L100 120 L50 120 L30 100 L30 70 Z" class="image" />
    <!-- Scissors -->
    <path d="M150 50 L170 50 L180 70 L180 100 L170 120 L150 120 L140 100 L140 70 Z" class="image" />
    <line x1="160" y1="50" x2="160" y2="120" class="image" />
    <!-- Paper cutout -->
    <rect x="200" y="50" width="150" height="100" class="image" />
    <path d="M220 70 L280 70 L300 90 L300 120 L280 140 L220 140 L200 120 L200 90 Z" class="image" />
  </g>
</svg>