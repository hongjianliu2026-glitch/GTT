<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">immense</text>
  <text x="50" y="120" class="subtitle">[ɪˈmens] adj. 巨大的，广大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + mens (测量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个无法测量(im-mens)的巨大(immense)
    <tspan x="50" dy="25">物体，比如一个巨大的鲸鱼在海洋中游动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The immense whale breached the surface of the ocean.
  </text>
  <text x="50" y="310" class="content">
    巨大的鲸鱼跃出海面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#4CAF50" />
    <!-- Whale -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" fill="#8BC34A" />
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <line x1="125" y1="75" x2="225" y2="75" class="image" />
    <line x1="125" y1="125" x2="225" y2="125" class="image" />
  </g>
</svg>