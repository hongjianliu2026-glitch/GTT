<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hoist</text>
  <text x="50" y="120" class="subtitle">[hɔɪst] v. 升起，吊起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hō (高) + st (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的起重机，"高高站立(hō-st)"
    <tspan x="50" dy="25">并吊起(hoist)一个沉重的货物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The workers hoisted the flag to the top of the pole.
  </text>
  <text x="50" y="310" class="content">
    工人们把旗子升到了旗杆的顶端。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Crane base -->
    <rect x="0" y="150" width="100" height="50" class="image" />
    <!-- Crane arm -->
    <line x1="50" y1="150" x2="50" y2="0" class="image" />
    <!-- Hook -->
    <line x1="50" y1="0" x2="30" y2="20" class="image" />
    <line x1="50" y1="0" x2="70" y2="20" class="image" />
    <!-- Cargo -->
    <rect x="20" y="20" width="60" height="40" class="image" />
  </g>
</svg>