<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">constitutionally</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnstɪˈtjuːʃənəli] adv. 按照宪法地，本质上</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + stitut (建立) + -ion (名词后缀) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"共同建立(con-stitut)"
    <tspan x="50" dy="25">一个国家的宪法(constitution)，然后按照这个宪法来行动(constitutionally)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The president acted constitutionally during the crisis.
  </text>
  <text x="50" y="310" class="content">
    总统在危机期间按照宪法行事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People sitting around a table -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <rect x="30" y="70" width="220" height="10" class="image" />
    <!-- Constitution document -->
    <rect x="100" y="100" width="100" height="150" class="image" />
    <line x1="110" y1="120" x2="190" y2="120" class="image" />
    <line x1="110" y1="140" x2="190" y2="140" class="image" />
    <line x1="110" y1="160" x2="190" y2="160" class="image" />
    <line x1="110" y1="180" x2="190" y2="180" class="image" />
    <line x1="110" y1="200" x2="190" y2="200" class="image" />
  </g>
</svg>