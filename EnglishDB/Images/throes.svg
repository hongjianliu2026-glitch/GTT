<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">throes</text>
  <text x="50" y="120" class="subtitle">[θroʊz] n. 剧痛，阵痛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thron (痛苦) + -es (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在经历剧烈的"痛苦(thron)"，
    <tspan x="50" dy="25">身体扭曲，表情痛苦，这就是"剧痛(throes)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was in the throes of labor when the baby was born.
  </text>
  <text x="50" y="310" class="content">
    孩子出生时，她正经历着分娩的剧痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in pain -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="160" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="20" y2="240" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="240" class="image" /> <!-- Right leg -->
    <!-- Pain expression -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" /> <!-- Mouth -->
    <line x1="45" y1="80" x2="50" y2="85" class="image" /> <!-- Left eye -->
    <line x1="55" y1="80" x2="50" y2="85" class="image" /> <!-- Right eye -->
  </g>
</svg>