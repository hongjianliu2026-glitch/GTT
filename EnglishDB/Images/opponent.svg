<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">opponent</text>
  <text x="50" y="120" class="subtitle">[əˈpoʊnənt] n. 对手，反对者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> op- (对抗) + pon (放置) + -ent (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在拳击场上，"对抗(op-)"
    <tspan x="50" dy="25">并"放置(pon)"自己的拳头，他们就是对手(opponent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He faced a strong opponent in the final match.
  </text>
  <text x="50" y="310" class="content">
    他在决赛中面对了一个强大的对手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boxing ring -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boxers -->
    <circle cx="70" cy="100" r="20" class="image" />
    <circle cx="280" cy="100" r="20" class="image" />
    <!-- Boxing gloves -->
    <rect x="50" y="80" width="40" height="40" class="image" />
    <rect x="260" y="80" width="40" height="40" class="image" />
    <!-- Boxing stance -->
    <line x1="70" y1="120" x2="70" y2="160" class="image" />
    <line x1="280" y1="120" x2="280" y2="160" class="image" />
    <line x1="70" y1="160" x2="50" y2="180" class="image" />
    <line x1="280" y1="160" x2="300" y2="180" class="image" />
  </g>
</svg>