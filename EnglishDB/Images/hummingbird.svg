<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hummingbird</text>
  <text x="50" y="120" class="subtitle">[ˈhʌmɪŋbɜːrd] n. 蜂鸟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hum (嗡嗡声) + bird (鸟)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蜂鸟在花丛中快速飞舞，发出"嗡嗡(hum)"的声音，
    <tspan x="50" dy="25">就像一台微型直升机，这就是蜂鸟(hummingbird)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hummingbird hovered over the flower, sipping nectar.
  </text>
  <text x="50" y="310" class="content">
    蜂鸟在花上盘旋，吮吸花蜜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird body -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Wings -->
    <line x1="70" y1="90" x2="130" y2="90" class="image" />
    <line x1="70" y1="110" x2="130" y2="110" class="image" />
    <!-- Beak -->
    <line x1="130" y1="100" x2="160" y2="100" class="image" />
    <!-- Flower -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <line x1="190" y1="90" x2="210" y2="90" class="image" />
    <line x1="190" y1="110" x2="210" y2="110" class="image" />
  </g>
</svg>