<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">desired</text>
  <text x="50" y="120" class="subtitle">[dɪˈzaɪərd] adj. 渴望的，想要的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + sire (渴望)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一座高山上，"强烈地渴望(de-sire)"
    <tspan x="50" dy="25">得到山顶的宝藏，这种强烈的愿望就是desired。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The desired outcome was achieved after months of hard work.
  </text>
  <text x="50" y="310" class="content">
    经过数月的努力，终于达成了渴望的结果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 175,0 350,200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="180" r="15" class="image" />
    <line x1="175" y1="195" x2="175" y2="230" class="image" />
    <line x1="175" y1="230" x2="155" y2="260" class="image" />
    <line x1="175" y1="230" x2="195" y2="260" class="image" />
    <line x1="175" y1="210" x2="205" y2="200" class="image" />
    <!-- Treasure -->
    <rect x="160" y="10" width="30" height="30" class="image" />
    <line x1="175" y1="10" x2="175" y2="40" class="image" />
    <line x1="160" y1="25" x2="190" y2="25" class="image" />
  </g>
</svg>