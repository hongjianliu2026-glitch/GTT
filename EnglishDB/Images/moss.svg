<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .moss { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moss</text>
  <text x="50" y="120" class="subtitle">[mɒs] n. 苔藓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> moss (源自中古英语 mos, 意为苔藓)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片古老的石头上，"苔藓(moss)"
    <tspan x="50" dy="25">覆盖其上，仿佛给石头穿上了绿色的外衣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old stone wall was covered with moss.
  </text>
  <text x="50" y="310" class="content">
    古老的石墙上长满了苔藓。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Moss -->
    <circle cx="50" cy="50" r="20" class="moss" />
    <circle cx="100" cy="70" r="25" class="moss" />
    <circle cx="150" cy="60" r="30" class="moss" />
    <circle cx="200" cy="80" r="25" class="moss" />
    <circle cx="250" cy="50" r="20" class="moss" />
    <circle cx="300" cy="70" r="30" class="moss" />
  </g>
</svg>