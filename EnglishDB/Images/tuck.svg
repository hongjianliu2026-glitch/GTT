<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tuck</text>
  <text x="50" y="120" class="subtitle">[tʌk] v. 塞进，卷起；n. 褶皱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "tukken"，意为“折叠”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个顽皮的小孩，把被子"卷起(tuck)"
    <tspan x="50" dy="25">塞进床垫里，结果被子形成了一个可爱的褶皱(tuck)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tucked the blanket under her chin.
  </text>
  <text x="50" y="310" class="content">
    她把毯子塞到下巴下面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Blanket -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Tucked corner -->
    <line x1="70" y1="180" x2="280" y2="180" class="image" />
    <line x1="70" y1="180" x2="70" y2="160" class="image" />
    <line x1="280" y1="180" x2="280" y2="160" class="image" />
    <line x1="70" y1="160" x2="280" y2="160" class="image" />
    <!-- Child -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>