<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .acne { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acne</text>
  <text x="50" y="120" class="subtitle">[ˈækni] n. 痤疮，粉刺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> acn (尖，刺) + -e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个脸上长满了"尖刺(acn)"的小怪物，
    <tspan x="50" dy="25">这些尖刺就是痤疮(acne)，让人感到疼痛和不适。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She struggled with acne during her teenage years.
  </text>
  <text x="50" y="310" class="content">
    她在青少年时期饱受痤疮的困扰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Acne -->
    <circle cx="60" cy="70" r="10" class="acne" />
    <circle cx="120" cy="80" r="12" class="acne" />
    <circle cx="80" cy="120" r="15" class="acne" />
    <circle cx="140" cy="110" r="10" class="acne" />
    <circle cx="100" cy="140" r="12" class="acne" />
  </g>
</svg>