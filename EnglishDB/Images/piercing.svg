<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">piercing</text>
  <text x="50" y="120" class="subtitle">[ˈpɪərsɪŋ] adj. 刺穿的，尖锐的；n. 穿孔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pierc (刺穿) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的剑"刺穿(pierc)"空气，发出尖锐的"声音(ing)"，
    <tspan x="50" dy="25">这种声音让人感到刺耳，这就是"piercing"的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The piercing scream of the alarm woke everyone up.
  </text>
  <text x="50" y="310" class="content">
    刺耳的警报声把所有人都吵醒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sword -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <!-- Air -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="125" y1="90" x2="125" y2="110" class="image" />
    <!-- Sound waves -->
    <circle cx="175" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="225" cy="100" r="20" class="image" />
  </g>
</svg>