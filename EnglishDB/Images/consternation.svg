<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consternation</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnstəˈneɪʃn] n. 惊愕，惊恐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + stern (坚定) + ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人原本"坚定(stern)"地站在一起，突然间"共同(con-)"
    <tspan x="50" dy="25">面对一件令人惊愕的事情，他们的表情瞬间变得惊恐(consternation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the accident caused great consternation among the villagers.
  </text>
  <text x="50" y="310" class="content">
    事故的消息在村民中引起了极大的惊愕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />

    <circle cx="100" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="130" y2="70" class="image" />

    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />

    <!-- Shocked expressions -->
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="90" y1="40" x2="110" y2="40" class="image" />
    <line x1="140" y1="40" x2="160" y2="40" class="image" />

    <line x1="50" y1="30" x2="50" y2="40" class="image" />
    <line x1="100" y1="30" x2="100" y2="40" class="image" />
    <line x1="150" y1="30" x2="150" y2="40" class="image" />

    <!-- Background event -->
    <rect x="200" y="20" width="150" height="100" class="image" />
    <text x="220" y="70" class="content" fill="#E74C3C">Accident</text>
  </g>
</svg>