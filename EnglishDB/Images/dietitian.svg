<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dietitian</text>
  <text x="50" y="120" class="subtitle">[ˌdaɪəˈtɪʃən] n. 营养师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> diet (饮食) + -itian (从事...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个营养师在厨房里，"精心调配(diet)"
    <tspan x="50" dy="25">各种健康食物，确保每个人都能获得均衡的营养。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dietitian created a personalized meal plan for the patient.
  </text>
  <text x="50" y="310" class="content">
    营养师为病人制定了一份个性化的饮食计划。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kitchen counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Vegetables -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="80" cy="50" r="20" class="image" />
    <circle cx="110" cy="50" r="20" class="image" />
    <!-- Bowl -->
    <rect x="150" y="30" width="100" height="50" class="image" />
    <!-- Dietitian -->
    <circle cx="270" cy="100" r="15" class="image" />
    <line x1="270" y1="115" x2="270" y2="150" class="image" />
    <line x1="270" y1="150" x2="250" y2="180" class="image" />
    <line x1="270" y1="150" x2="290" y2="180" class="image" />
    <line x1="270" y1="130" x2="300" y2="120" class="image" />
  </g>
</svg>