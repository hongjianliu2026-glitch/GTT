<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">convenience</text>
  <text x="50" y="120" class="subtitle">[kənˈviːniəns] n. 便利，方便</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + veni (来) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个现代化的城市，"所有(con-)"
    <tspan x="50" dy="25">便利设施(veni)都聚集在一起，</tspan>
    <tspan x="50" dy="25">让人们的生活更加方便(convenience)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new shopping mall offers great convenience to the residents.
  </text>
  <text x="50" y="310" class="content">
    新的购物中心为居民提供了极大的便利。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="30" height="100" class="image" />
    <rect x="100" y="40" width="30" height="80" class="image" />
    <rect x="150" y="60" width="30" height="60" class="image" />
    <rect x="200" y="80" width="30" height="40" class="image" />
    <rect x="250" y="100" width="30" height="20" class="image" />
    <!-- Convenience store -->
    <rect x="300" y="120" width="50" height="80" class="image" />
    <line x1="300" y1="120" x2="350" y2="120" class="image" />
    <line x1="300" y1="140" x2="350" y2="140" class="image" />
    <line x1="300" y1="160" x2="350" y2="160" class="image" />
    <line x1="300" y1="180" x2="350" y2="180" class="image" />
    <line x1="300" y1="200" x2="350" y2="200" class="image" />
    <!-- Person -->
    <circle cx="20" cy="180" r="15" class="image" />
    <line x1="20" y1="195" x2="20" y2="230" class="image" />
    <line x1="20" y1="230" x2="0" y2="260" class="image" />
    <line x1="20" y1="230" x2="40" y2="260" class="image" />
    <line x1="20" y1="210" x2="50" y2="200" class="image" />
  </g>
</svg>