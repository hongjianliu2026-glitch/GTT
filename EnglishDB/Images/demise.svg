<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">demise</text>
  <text x="50" y="120" class="subtitle">[dɪˈmaɪz] n. 死亡，终止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + miss (送)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"送下去(de-miss)"，
    <tspan x="50" dy="25">象征着生命的终结(demise)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The demise of the company was sudden and unexpected.
  </text>
  <text x="50" y="310" class="content">
    公司的倒闭是突然且出乎意料的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tombstone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cross on tombstone -->
    <line x1="175" y1="40" x2="175" y2="140" class="image" />
    <line x1="125" y1="90" x2="225" y2="90" class="image" />
    <!-- Person being lowered -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Rope lowering the person -->
    <line x1="20" y1="100" x2="20" y2="20" class="image" />
    <line x1="20" y1="20" x2="175" y2="20" class="image" />
  </g>
</svg>