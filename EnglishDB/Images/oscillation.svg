<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oscillation</text>
  <text x="50" y="120" class="subtitle">[ˌɒsɪˈleɪʃn] n. 振荡，摆动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oscill (摆动) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟摆，"摆动(oscill)"
    <tspan x="50" dy="25">不停，这种持续的摆动就是振荡(oscillation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oscillation of the pendulum was mesmerizing.
  </text>
  <text x="50" y="310" class="content">
    钟摆的振荡令人着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pendulum -->
    <line x1="175" y1="0" x2="175" y2="150" class="image" />
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="100" y2="300" class="image" />
    <line x1="175" y1="170" x2="250" y2="300" class="image" />
    <!-- Swing path -->
    <path d="M100,300 Q175,170 250,300" class="image" />
  </g>
</svg>