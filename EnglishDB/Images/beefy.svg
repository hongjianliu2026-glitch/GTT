<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beefy</text>
  <text x="50" y="120" class="subtitle">[ˈbiːfi] adj. 健壮的，结实的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> beef (牛肉) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头健壮的牛，"牛肉(beef)"般的
    <tspan x="50" dy="25">肌肉线条，让人联想到强壮和结实(beefy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He has a beefy physique from years of weightlifting.
  </text>
  <text x="50" y="310" class="content">
    他因多年的举重训练而拥有健壮的体格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beefy cow -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="250" x2="50" y2="300" class="image" /> <!-- Front leg -->
    <line x1="100" y1="250" x2="150" y2="300" class="image" /> <!-- Back leg -->
    <line x1="100" y1="180" x2="50" y2="180" class="image" /> <!-- Front arm -->
    <line x1="100" y1="180" x2="150" y2="180" class="image" /> <!-- Back arm -->
    <circle cx="80" cy="80" r="10" class="image" /> <!-- Left eye -->
    <circle cx="120" cy="80" r="10" class="image" /> <!-- Right eye -->
  </g>
</svg>