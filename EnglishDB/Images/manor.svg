<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manor</text>
  <text x="50" y="120" class="subtitle">[ˈmænər] n. 庄园，领地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (手) + -or (表地点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的庄园，"手(man)"
    <tspan x="50" dy="25">握着权杖的领主站在庄园(manor)前，</tspan>
    <tspan x="50" dy="25">象征着他的统治和领地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manor was passed down through generations.
  </text>
  <text x="50" y="310" class="content">
    这个庄园世代相传。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Manor house -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <rect x="20" y="20" width="260" height="160" class="image" />
    <rect x="40" y="40" width="220" height="120" class="image" />
    <rect x="60" y="60" width="180" height="80" class="image" />
    <!-- Lord with scepter -->
    <circle cx="150" cy="250" r="20" class="image" />
    <line x1="150" y1="270" x2="150" y2="320" class="image" />
    <line x1="150" y1="320" x2="130" y2="350" class="image" />
    <line x1="150" y1="320" x2="170" y2="350" class="image" />
    <line x1="150" y1="290" x2="190" y2="280" class="image" />
    <line x1="150" y1="290" x2="110" y2="280" class="image" />
    <line x1="150" y1="290" x2="150" y2="310" class="image" />
  </g>
</svg>