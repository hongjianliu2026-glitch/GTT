<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aspirin</text>
  <text x="50" y="120" class="subtitle">[ˈæsprɪn] n. 阿司匹林（一种解热镇痛药）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (无) + spir (呼吸) + -in (化学物质后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个病人，因为疼痛而无法"呼吸(spir)"，
    <tspan x="50" dy="25">医生给他一片"阿司匹林(aspirin)"，他立刻恢复了呼吸。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took an aspirin to relieve her headache.
  </text>
  <text x="50" y="310" class="content">
    她吃了一片阿司匹林来缓解头痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pill -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <!-- Breath -->
    <line x1="50" y1="60" x2="50" y2="100" class="image" />
    <line x1="50" y1="80" x2="30" y2="60" class="image" />
    <line x1="50" y1="80" x2="70" y2="60" class="image" />
    <!-- Patient -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="185" x2="30" y2="170" class="image" />
    <line x1="50" y1="185" x2="70" y2="170" class="image" />
    <line x1="50" y1="200" x2="30" y2="220" class="image" />
    <line x1="50" y1="200" x2="70" y2="220" class="image" />
  </g>
</svg>