<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irrelevant</text>
  <text x="50" y="120" class="subtitle">[ɪˈreləvənt] adj. 不相关的，无关的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (不) + relev (相关) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头指向一个完全不相关的物体，"不相关(ir-relevant)"
    <tspan x="50" dy="25">的物体就像是被忽略的旁观者，与主题毫无关联。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His comments were irrelevant to the discussion.
  </text>
  <text x="50" y="310" class="content">
    他的评论与讨论无关。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow pointing to irrelevant object -->
    <line x1="0" y1="0" x2="200" y2="100" class="image" />
    <polygon points="200,100 180,90 180,110" class="image" />
    <!-- Irrelevant object -->
    <rect x="220" y="50" width="100" height="100" class="image" />
    <!-- Text label -->
    <text x="230" y="110" class="content" fill="#A93226">Irrelevant</text>
  </g>
</svg>