<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neglect</text>
  <text x="50" y="120" class="subtitle">[nɪˈɡlɛkt] v. 忽视，忽略；n. 疏忽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neg- (不) + lect (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一堆任务前，"不选择(neg-lect)"
    <tspan x="50" dy="25">去做任何事情，结果所有任务都被忽视了(neglect)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was fired for neglecting his duties.
  </text>
  <text x="50" y="310" class="content">
    他因疏忽职责而被解雇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Tasks -->
    <rect x="100" y="80" width="100" height="50" class="image" />
    <rect x="100" y="150" width="100" height="50" class="image" />
    <rect x="100" y="220" width="100" height="50" class="image" />
    <!-- Neglect symbol -->
    <line x1="50" y1="100" x2="200" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="250" class="image" />
  </g>
</svg>