<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">good-looking</text>
  <text x="50" y="120" class="subtitle">[ˌɡʊd ˈlʊkɪŋ] adj. 好看的，英俊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> good (好的) + look (看) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个英俊的人站在镜子前，"好(good)看(look)"
    <tspan x="50" dy="25">的样子让人忍不住多看几眼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a good-looking woman.
  </text>
  <text x="50" y="310" class="content">
    她是一个好看的女人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="175" x2="150" y2="225" class="image" />
    <line x1="175" y1="175" x2="200" y2="225" class="image" />
    <line x1="175" y1="200" x2="150" y2="250" class="image" />
    <line x1="175" y1="200" x2="200" y2="250" class="image" />
    <!-- Eyes -->
    <circle cx="150" cy="90" r="5" class="image" />
    <circle cx="200" cy="90" r="5" class="image" />
    <!-- Smile -->
    <path d="M150 110 Q175 120 200 110" class="image" />
  </g>
</svg>