<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knife</text>
  <text x="50" y="120" class="subtitle">[naɪf] n. 刀，匕首；v. 用刀切，用匕首刺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kni- (刀) + fe (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀(kni-fe)，它不仅仅是一个工具，
    <tspan x="50" dy="25">更是一种象征，代表着力量和精准。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a knife to cut the steak.
  </text>
  <text x="50" y="310" class="content">
    他用刀切牛排。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knife handle -->
    <rect x="0" y="0" width="100" height="20" class="image" />
    <!-- Knife blade -->
    <polygon points="100,0 150,0 150,100 100,100" class="image" />
    <!-- Grip lines -->
    <line x1="10" y1="5" x2="90" y2="5" class="image" />
    <line x1="10" y1="15" x2="90" y2="15" class="image" />
  </g>
</svg>