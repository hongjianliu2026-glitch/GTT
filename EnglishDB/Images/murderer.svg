<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">murderer</text>
  <text x="50" y="120" class="subtitle">[ˈmɜrdərər] n. 杀人犯，凶手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> murd (杀) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑暗的夜晚，一个"杀人(murd)"的人(er)
    <tspan x="50" dy="25">在阴影中潜行，他的身影让人不寒而栗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The murderer was finally caught by the police.
  </text>
  <text x="50" y="310" class="content">
    凶手最终被警察抓获。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Shadow figure -->
    <path d="M50 150 L100 100 L150 150 L100 200 Z" class="image" fill="#7F8C8D" />
    <!-- Knife -->
    <line x1="120" y1="120" x2="180" y2="180" class="image" stroke="#E74C3C" stroke-width="5" />
    <!-- Blood drop -->
    <circle cx="180" cy="180" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>