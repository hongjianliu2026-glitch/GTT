<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">zest</text>
  <text x="50" y="120" class="subtitle">[zɛst] n. 热情，风味；v. 给…加调味</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> zest (源自拉丁语 "cedere"，意为“去”或“走”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"热情地(zest)"
    <tspan x="50" dy="25">给菜肴添加调味料，使其充满风味(zest)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added a touch of zest to the dish with some lemon juice.
  </text>
  <text x="50" y="310" class="content">
    她用一些柠檬汁给菜肴增添了风味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Lemon -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="90" y1="90" x2="110" y2="110" class="image" />
    <line x1="90" y1="110" x2="110" y2="90" class="image" />
    <!-- Dish -->
    <rect x="150" y="80" width="100" height="50" class="image" />
    <line x1="160" y1="90" x2="240" y2="90" class="image" />
    <line x1="160" y1="110" x2="240" y2="110" class="image" />
    <line x1="160" y1="130" x2="240" y2="130" class="image" />
  </g>
</svg>