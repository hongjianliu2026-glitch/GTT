<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">torpedo</text>
  <text x="50" y="120" class="subtitle">[tɔːrˈpiːdoʊ] n. 鱼雷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> torp (麻木) + -edo (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘潜艇发射出一枚"麻木(torp)"的鱼雷，
    <tspan x="50" dy="25">它在水下无声无息地前进，直到击中目标，</tspan>
    <tspan x="50" dy="25">让敌人瞬间"麻木"，无法动弹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The submarine launched a torpedo at the enemy ship.
  </text>
  <text x="50" y="310" class="content">
    潜艇向敌舰发射了一枚鱼雷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Submarine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Torpedo -->
    <line x1="300" y1="100" x2="450" y2="100" class="image" />
    <line x1="300" y1="100" x2="300" y2="130" class="image" />
    <line x1="300" y1="130" x2="280" y2="110" class="image" />
    <line x1="300" y1="130" x2="320" y2="110" class="image" />
    <!-- Water -->
    <line x1="0" y1="200" x2="450" y2="200" class="image" />
    <line x1="0" y1="210" x2="450" y2="210" class="image" />
    <line x1="0" y1="220" x2="450" y2="220" class="image" />
  </g>
</svg>