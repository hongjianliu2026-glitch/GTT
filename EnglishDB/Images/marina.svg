<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marina</text>
  <text x="50" y="120" class="subtitle">[məˈriːnə] n. 游艇码头，海滨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar (海) + -ina (表示地点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阳光明媚的日子，海浪轻轻拍打着岸边，
    <tspan x="50" dy="25">一排排游艇整齐地停靠在"海滨(mar-ina)"，</tspan>
    <tspan x="50" dy="25">人们在这里享受着海风和宁静。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We spent the weekend at the marina, enjoying the sea breeze.
  </text>
  <text x="50" y="310" class="content">
    我们周末在游艇码头度过了，享受着海风。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#AED6F1" />
    <!-- Boats -->
    <rect x="50" y="20" width="50" height="30" class="image" fill="#F4D03F" />
    <rect x="120" y="20" width="50" height="30" class="image" fill="#F4D03F" />
    <rect x="190" y="20" width="50" height="30" class="image" fill="#F4D03F" />
    <!-- Waves -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
  </g>
</svg>