<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">condensed</text>
  <text x="50" y="120" class="subtitle">[kənˈdɛnst] adj. 浓缩的，压缩的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + dense (密集)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球被"压缩(con-dense)"成一个小球，
    <tspan x="50" dy="25">所有的空气都被挤在一起，变得非常"浓缩(condensed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef made a condensed soup by boiling it down.
  </text>
  <text x="50" y="310" class="content">
    厨师通过煮沸制作了浓缩汤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large balloon -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Small balloon -->
    <ellipse cx="150" cy="100" rx="30" ry="15" class="image" />
    <!-- Arrow -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,90 260,100 250,110" class="image" />
    <!-- Text -->
    <text x="270" y="105" class="content">condensed</text>
  </g>
</svg>