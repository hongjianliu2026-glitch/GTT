<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mortality</text>
  <text x="50" y="120" class="subtitle">[mɔːrˈtæləti] n. 死亡率，必死性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mort- (死亡) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的墓地，"死亡(mort-)"
    <tspan x="50" dy="25">的象征无处不在，这就是"死亡率(mortality)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mortality rate of the disease is very high.
  </text>
  <text x="50" y="310" class="content">
    这种疾病的死亡率非常高。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tombstone -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="75" y1="0" x2="75" y2="200" class="image" />
    <line x1="0" y1="100" x2="150" y2="100" class="image" />
    <!-- Skull -->
    <circle cx="75" cy="250" r="30" class="image" />
    <line x1="55" y1="260" x2="95" y2="260" class="image" />
    <line x1="55" y1="280" x2="95" y2="280" class="image" />
    <line x1="65" y1="300" x2="85" y2="300" class="image" />
  </g>
</svg>