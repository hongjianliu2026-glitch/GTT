<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">masculinity</text>
  <text x="50" y="120" class="subtitle">[ˌmæskjəˈlɪnəti] n. 男子气概，阳刚之气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mascul (男性) + -inity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的男性，"男性(mascul)"
    <tspan x="50" dy="25">展现出强大的力量和勇气，这就是男子气概(masculinity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His masculinity was evident in his confident demeanor.
  </text>
  <text x="50" y="310" class="content">
    他自信的举止显示出他的男子气概。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Strong man -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="160" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
    <!-- Muscles -->
    <circle cx="50" cy="160" r="10" class="image" /> <!-- Chest -->
    <circle cx="40" cy="180" r="5" class="image" /> <!-- Left arm muscle -->
    <circle cx="60" cy="180" r="5" class="image" /> <!-- Right arm muscle -->
    <circle cx="35" cy="220" r="5" class="image" /> <!-- Left leg muscle -->
    <circle cx="65" cy="220" r="5" class="image" /> <!-- Right leg muscle -->
  </g>
</svg>