<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FFA500; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">candlelight</text>
  <text x="50" y="120" class="subtitle">[ˈkændlˌlaɪt] n. 烛光</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> candle (蜡烛) + light (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在一个浪漫的夜晚，"蜡烛(candle)"
    <tspan x="50" dy="25">发出的柔和"光(light)"照亮了整个房间，营造出温馨的氛围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was illuminated by candlelight.
  </text>
  <text x="50" y="310" class="content">
    房间被烛光照亮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candle -->
    <rect x="0" y="0" width="50" height="150" class="image" />
    <!-- Flame -->
    <circle cx="25" cy="0" r="20" class="flame" />
    <!-- Light rays -->
    <line x1="25" y1="20" x2="25" y2="100" class="image" />
    <line x1="25" y1="20" x2="75" y2="50" class="image" />
    <line x1="25" y1="20" x2="-25" y2="50" class="image" />
  </g>
</svg>