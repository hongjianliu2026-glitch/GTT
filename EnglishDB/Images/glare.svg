<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glare</text>
  <text x="50" y="120" class="subtitle">[ɡlɛər] v. 瞪眼，怒视；n. 刺眼的强光</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gl- (光) + -are (表动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为愤怒而"发出(gl-)"刺眼的"光(are)"，
    <tspan x="50" dy="25">他的眼睛像太阳一样刺眼，这就是glare。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave him a fierce glare when he interrupted her.
  </text>
  <text x="50" y="310" class="content">
    当他打断她时，她狠狠地瞪了他一眼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" fill="#E74C3C" />
    <circle cx="130" cy="80" r="10" class="image" fill="#E74C3C" />
    <!-- Angry eyebrows -->
    <line x1="50" y1="60" x2="90" y2="60" class="image" />
    <line x1="110" y1="60" x2="150" y2="60" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
  </g>
</svg>