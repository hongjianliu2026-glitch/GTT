<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rebuff</text>
  <text x="50" y="120" class="subtitle">[rɪˈbʌf] n. 断然拒绝；v. 拒绝，抵制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + buff (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人伸出友谊之手，却被"回击(re-buff)"，
    <tspan x="50" dy="25">这种断然拒绝的画面让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave him a cold rebuff when he asked her out.
  </text>
  <text x="50" y="310" class="content">
    当他约她出去时，她冷冷地拒绝了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand reaching out -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="140" y2="40" class="image" />
    <line x1="150" y1="50" x2="140" y2="60" class="image" />
    <line x1="150" y1="50" x2="160" y2="40" class="image" />
    <line x1="150" y1="50" x2="160" y2="60" class="image" />
    <!-- Hand being pushed back -->
    <line x1="150" y1="50" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="240" y2="40" class="image" />
    <line x1="250" y1="50" x2="240" y2="60" class="image" />
    <line x1="250" y1="50" x2="260" y2="40" class="image" />
    <line x1="250" y1="50" x2="260" y2="60" class="image" />
    <!-- Person being rejected -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>