<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">working</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrkɪŋ] adj. 工作的，劳动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> work (工作) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人在工厂里，"工作(work)"
    <tspan x="50" dy="25">不停，汗水滴落，这就是工作的状态(working)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The working conditions in the factory are poor.
  </text>
  <text x="50" y="310" class="content">
    工厂的工作条件很差。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Worker -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Machine -->
    <rect x="100" y="50" width="200" height="100" class="image" />
    <line x1="120" y1="70" x2="280" y2="70" class="image" />
    <line x1="120" y1="90" x2="280" y2="90" class="image" />
    <line x1="120" y1="110" x2="280" y2="110" class="image" />
    <!-- Sweat -->
    <circle cx="40" cy="90" r="5" class="image" fill="#8E44AD" />
    <circle cx="45" cy="85" r="5" class="image" fill="#8E44AD" />
    <circle cx="50" cy="80" r="5" class="image" fill="#8E44AD" />
  </g>
</svg>