<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">noteworthy</text>
  <text x="50" y="120" class="subtitle">[ˈnoʊtˌwɜrði] adj. 值得注意的，显著的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> note (注意) + worth (值得)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的公告板，上面贴满了"值得注意(note-worthy)"
    <tspan x="50" dy="25">的事件，每个事件都被特别标注，引人注目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her performance was noteworthy for its originality.
  </text>
  <text x="50" y="310" class="content">
    她的表演因其原创性而值得注意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Notice board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Notes -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <rect x="170" y="20" width="100" height="50" class="image" />
    <rect x="50" y="90" width="100" height="50" class="image" />
    <rect x="170" y="90" width="100" height="50" class="image" />
    <!-- Pins -->
    <circle cx="60" cy="30" r="5" class="image" />
    <circle cx="180" cy="30" r="5" class="image" />
    <circle cx="60" cy="100" r="5" class="image" />
    <circle cx="180" cy="100" r="5" class="image" />
    <!-- Arrows -->
    <line x1="60" y1="30" x2="40" y2="10" class="image" />
    <line x1="180" y1="30" x2="160" y2="10" class="image" />
    <line x1="60" y1="100" x2="40" y2="80" class="image" />
    <line x1="180" y1="100" x2="160" y2="80" class="image" />
  </g>
</svg>