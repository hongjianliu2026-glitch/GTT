<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comfortably</text>
  <text x="50" y="120" class="subtitle">[ˈkʌmfərtəbli] adv. 舒适地，安逸地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + fort (力量) + -able (能够) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在柔软的沙发上，"共同(com-)"
    <tspan x="50" dy="25">感受到力量(fort)的支持，感到非常舒适(comfortably)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sat comfortably on the couch, reading a book.
  </text>
  <text x="50" y="310" class="content">
    她舒适地坐在沙发上，读着一本书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sofa -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Person sitting on the sofa -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />
    <!-- Book -->
    <rect x="100" y="50" width="50" height="30" class="image" />
    <line x1="110" y1="60" x2="140" y2="60" class="image" />
    <line x1="110" y1="70" x2="140" y2="70" class="image" />
  </g>
</svg>