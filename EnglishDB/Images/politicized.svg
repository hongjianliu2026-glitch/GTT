<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">politicized</text>
  <text x="50" y="120" class="subtitle">[pəˈlɪtɪˌsaɪzd] v. 使政治化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poli- (国家) + -tic (与...有关的) + -ize (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通的日常话题被"国家化(poli-tic-ize)"，
    <tspan x="50" dy="25">突然变成了一个充满争议的政治话题。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The issue of climate change has been politicized in recent years.
  </text>
  <text x="50" y="310" class="content">
    近年来，气候变化问题已经被政治化了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Speech bubble -->
    <path d="M 10 10 Q 50 20 100 10 Q 150 20 200 10" class="image" />
    <!-- Political symbol -->
    <rect x="150" y="50" width="50" height="50" class="image" />
    <!-- Arrow -->
    <line x1="200" y1="75" x2="250" y2="75" class="image" />
    <polygon points="250,75 240,65 240,85" class="image" />
  </g>
</svg>