<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turbine</text>
  <text x="50" y="120" class="subtitle">[ˈtɜːrbaɪn] n. 涡轮机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turb (搅动) + -ine (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的涡轮机在工厂里，"搅动(turb)"
    <tspan x="50" dy="25">空气或水流，产生巨大的能量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wind turbine generates electricity for the village.
  </text>
  <text x="50" y="310" class="content">
    风力涡轮机为村庄发电。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Turbine base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Turbine blades -->
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="125" y1="60" x2="175" y2="140" class="image" />
    <line x1="175" y1="60" x2="125" y2="140" class="image" />
    <!-- Turbine center -->
    <circle cx="150" cy="100" r="20" class="image" />
  </g>
</svg>