<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">use</text>
  <text x="50" y="120" class="subtitle">[juːs] v. 使用，利用；n. 用途，使用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> us (使用)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人手持工具，"使用(us)"
    <tspan x="50" dy="25">它来完成任务，这个动作就是use。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He uses a hammer to build the house.
  </text>
  <text x="50" y="310" class="content">
    他用锤子建造房子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Person -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Tool -->
    <rect x="80" y="60" width="50" height="10" class="image" />
    <line x1="80" y1="60" x2="130" y2="60" class="image" />
  </g>
</svg>