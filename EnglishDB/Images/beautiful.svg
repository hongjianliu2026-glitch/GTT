<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF5E1; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #4A4A4A; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #FF6F61; }
      .story { font: 16px serif; fill: #6D5ACF; }
      .image { stroke: #FF6F61; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beautiful</text>
  <text x="50" y="120" class="subtitle">[ˈbjuːtɪfəl] adj. 美丽的，漂亮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> beau- (美) + -tiful (充满)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满美丽(beau-tiful)的花园，
    <tspan x="50" dy="25">花朵盛开，蝴蝶飞舞，整个场景令人陶醉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked beautiful in her wedding dress.
  </text>
  <text x="50" y="310" class="content">
    她穿着婚纱看起来很美。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flowers -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="120" r="25" class="image" />
    <circle cx="150" cy="80" r="30" class="image" />
    <!-- Butterfly -->
    <path d="M200,100 Q220,80 240,100 T280,100" class="image" />
    <path d="M200,120 Q220,140 240,120 T280,120" class="image" />
  </g>
</svg>