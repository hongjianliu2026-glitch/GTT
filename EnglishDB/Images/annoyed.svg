<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">annoyed</text>
  <text x="50" y="120" class="subtitle">[əˈnɔɪd] adj. 恼怒的，生气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (加强) + noy (烦恼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一群蜜蜂"加强烦恼(an-noy)"，
    <tspan x="50" dy="25">不停地嗡嗡声让他感到非常恼怒(annoyed)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was annoyed by the constant noise from the construction site.
  </text>
  <text x="50" y="310" class="content">
    她被建筑工地的持续噪音弄得很恼火。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Annoying bees -->
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="120" cy="90" r="10" class="image" />
    <circle cx="140" cy="70" r="10" class="image" />
    <circle cx="160" cy="85" r="10" class="image" />
    <circle cx="180" cy="75" r="10" class="image" />
    <!-- Lines representing buzzing sound -->
    <line x1="100" y1="80" x2="120" y2="90" class="image" />
    <line x1="120" y1="90" x2="140" y2="70" class="image" />
    <line x1="140" y1="70" x2="160" y2="85" class="image" />
    <line x1="160" y1="85" x2="180" y2="75" class="image" />
  </g>
</svg>