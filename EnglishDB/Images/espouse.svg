<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">espouse</text>
  <text x="50" y="120" class="subtitle">[ɪˈspaʊz] v. 支持，拥护；娶，嫁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (向外) + spous (配偶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在婚礼台上，"向外(e-)"
    <tspan x="50" dy="25">宣布自己与某人结为"配偶(spous)"，</tspan>
    <tspan x="50" dy="25">这就是"支持(espouse)"的夸张画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She espoused the cause of women's rights.
  </text>
  <text x="50" y="310" class="content">
    她支持妇女权利的事业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wedding stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bride and groom -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Vows -->
    <line x1="100" y1="120" x2="250" y2="120" class="image" />
    <line x1="100" y1="140" x2="250" y2="140" class="image" />
    <line x1="100" y1="160" x2="250" y2="160" class="image" />
    <!-- Audience -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="300" cy="50" r="10" class="image" />
    <circle cx="175" cy="50" r="10" class="image" />
  </g>
</svg>