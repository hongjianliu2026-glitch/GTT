<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stair</text>
  <text x="50" y="120" class="subtitle">[ster] n. 楼梯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sta- (站立) + ir (上升)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在(sta-)楼梯上，一步一步上升(ir)，
    <tspan x="50" dy="25">就像爬楼梯一样，这就是楼梯(stair)的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She climbed the stairs to the top floor.
  </text>
  <text x="50" y="310" class="content">
    她爬楼梯到了顶楼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Stairs -->
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <line x1="50" y1="120" x2="250" y2="120" class="image" />
    <line x1="50" y1="90" x2="250" y2="90" class="image" />
    <line x1="50" y1="60" x2="250" y2="60" class="image" />
    <line x1="50" y1="30" x2="250" y2="30" class="image" />
    <line x1="50" y1="0" x2="250" y2="0" class="image" />
    <!-- Steps -->
    <line x1="50" y1="150" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="80" y2="90" class="image" />
    <line x1="80" y1="90" x2="110" y2="60" class="image" />
    <line x1="110" y1="60" x2="140" y2="30" class="image" />
    <line x1="140" y1="30" x2="170" y2="0" class="image" />
    <!-- Person -->
    <circle cx="30" cy="135" r="10" class="image" />
    <line x1="30" y1="145" x2="30" y2="160" class="image" />
    <line x1="30" y1="160" x2="20" y2="170" class="image" />
    <line x1="30" y1="160" x2="40" y2="170" class="image" />
    <line x1="30" y1="150" x2="50" y2="140" class="image" />
  </g>
</svg>