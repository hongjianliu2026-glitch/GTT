<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glorify</text>
  <text x="50" y="120" class="subtitle">[ˈɡlɔːrɪfaɪ] v. 赞美，颂扬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glor (荣耀) + -ify (使...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个英雄站在高台上，"使荣耀(glor-ify)"
    <tspan x="50" dy="25">，人们为他欢呼，他的事迹被传颂。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The poet glorifies the bravery of the soldiers.
  </text>
  <text x="50" y="310" class="content">
    诗人赞美了士兵们的勇敢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hero on a pedestal -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Crowd cheering -->
    <circle cx="100" cy="220" r="10" class="image" />
    <circle cx="120" cy="220" r="10" class="image" />
    <circle cx="140" cy="220" r="10" class="image" />
    <circle cx="160" cy="220" r="10" class="image" />
    <circle cx="180" cy="220" r="10" class="image" />
    <circle cx="200" cy="220" r="10" class="image" />
    <circle cx="220" cy="220" r="10" class="image" />
    <circle cx="240" cy="220" r="10" class="image" />
    <circle cx="260" cy="220" r="10" class="image" />
    <circle cx="280" cy="220" r="10" class="image" />
  </g>
</svg>