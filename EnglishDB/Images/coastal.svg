<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coastal</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊstl] adj. 海岸的，沿海的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> coast (海岸) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海浪拍打在"海岸(coast)"上，
    <tspan x="50" dy="25">溅起的水花形成了一幅壮观的"沿海(coastal)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coastal town is famous for its beautiful beaches.
  </text>
  <text x="50" y="310" class="content">
    这个沿海小镇以其美丽的海滩而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coastline -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Waves -->
    <path d="M0,100 Q50,50 100,100 T200,100 T300,100 T350,100" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Sea -->
    <rect x="0" y="100" width="350" height="100" class="image" />
    <!-- Beach -->
    <rect x="0" y="200" width="350" height="100" class="image" />
    <!-- Palm tree -->
    <line x1="150" y1="200" x2="150" y2="150" class="image" />
    <line x1="140" y1="160" x2="160" y2="160" class="image" />
    <line x1="130" y1="170" x2="170" y2="170" class="image" />
    <line x1="120" y1="180" x2="180" y2="180" class="image" />
  </g>
</svg>