<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sanction</text>
  <text x="50" y="120" class="subtitle">[ˈsæŋkʃən] n. 制裁，认可；v. 批准，认可</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sanct- (神圣) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神圣的仪式，"神圣的认可(sanct-ion)"
    <tspan x="50" dy="25">象征着一种正式的批准或制裁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government imposed sanctions on the rogue state.
  </text>
  <text x="50" y="310" class="content">
    政府对这个流氓国家实施了制裁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Holy symbol -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Gavel -->
    <rect x="180" y="50" width="100" height="100" class="image" />
    <line x1="230" y1="50" x2="230" y2="150" class="image" />
    <!-- Text -->
    <text x="100" y="200" class="content">神圣的认可</text>
  </g>
</svg>