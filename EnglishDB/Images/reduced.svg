<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reduced</text>
  <text x="50" y="120" class="subtitle">[rɪˈdjuːst] adj. 减少的，简化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + duce (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师将一个大蛋糕"再次引导(re-duce)"成一个小蛋糕，
    <tspan x="50" dy="25">这个过程就是减少(reduce)，结果就是减少的(reduced)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The reduced price made the product more affordable.
  </text>
  <text x="50" y="310" class="content">
    降价使产品更加实惠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large cake -->
    <circle cx="100" cy="100" r="50" class="image" />
    <text x="80" y="110" class="content">大蛋糕</text>
    <!-- Small cake -->
    <circle cx="300" cy="100" r="25" class="image" />
    <text x="280" y="110" class="content">小蛋糕</text>
    <!-- Arrow -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,90 270,100 250,110" class="image" />
    <text x="200" y="90" class="content">减少</text>
  </g>
</svg>