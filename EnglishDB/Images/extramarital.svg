<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extramarital</text>
  <text x="50" y="120" class="subtitle">[ˌekstrəˈmærɪtl] adj. 婚外的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> extra- (在...之外) + marital (婚姻的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个婚姻的边界之外，"在婚姻之外(extra-marital)"
    <tspan x="50" dy="25">发生的事情，这就是婚外情(extramarital affair)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scandal involved an extramarital affair.
  </text>
  <text x="50" y="310" class="content">
    这起丑闻涉及婚外情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Marriage boundary -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Heart outside the boundary -->
    <circle cx="200" cy="100" r="50" class="image" />
    <!-- Broken heart inside the boundary -->
    <line x1="150" y1="50" x2="250" y2="150" class="image" />
    <line x1="150" y1="150" x2="250" y2="50" class="image" />
    <!-- Person outside the boundary -->
    <circle cx="200" cy="200" r="15" class="image" />
    <line x1="200" y1="215" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="180" y2="280" class="image" />
    <line x1="200" y1="250" x2="220" y2="280" class="image" />
    <line x1="200" y1="230" x2="250" y2="220" class="image" />
  </g>
</svg>