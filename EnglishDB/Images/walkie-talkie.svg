<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">walkie-talkie</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːki ˈtɔːki] n. 对讲机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> walkie (行走) + talkie (说话)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在行走(walkie)时，通过一个小巧的设备互相说话(talkie)，
    <tspan x="50" dy="25">这个设备就是对讲机(walkie-talkie)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hikers used a walkie-talkie to communicate.
  </text>
  <text x="50" y="310" class="content">
    徒步旅行者使用对讲机进行通信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Walkie-talkie device -->
    <rect x="0" y="0" width="150" height="80" class="image" />
    <rect x="10" y="10" width="130" height="60" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <!-- Antenna -->
    <line x1="75" y1="0" x2="75" y2="-30" class="image" />
    <!-- Person walking -->
    <circle cx="200" cy="40" r="15" class="image" />
    <line x1="200" y1="55" x2="200" y2="90" class="image" />
    <line x1="200" y1="90" x2="180" y2="120" class="image" />
    <line x1="200" y1="90" x2="220" y2="120" class="image" />
    <line x1="200" y1="70" x2="230" y2="60" class="image" />
  </g>
</svg>