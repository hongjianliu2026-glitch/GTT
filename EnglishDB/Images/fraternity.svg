<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fraternity</text>
  <text x="50" y="120" class="subtitle">[frəˈtɜːrnɪti] n. 兄弟会，友爱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frater (兄弟) + -nity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群兄弟(frater)手拉手围成一个圈，象征着
    <tspan x="50" dy="25">他们之间的友爱(fraternity)和团结。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fraternity held a charity event to help the community.
  </text>
  <text x="50" y="310" class="content">
    兄弟会举办了一场慈善活动来帮助社区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle of brothers -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Brothers holding hands -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <!-- Brothers' heads -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="175" cy="100" r="15" class="image" />
  </g>
</svg>