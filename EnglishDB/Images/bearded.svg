<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bearded</text>
  <text x="50" y="120" class="subtitle">[ˈbɪrdɪd] adj. 有胡须的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> beard (胡须) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个满脸胡须的人，"胡子(beard)覆盖(ed)"
    <tspan x="50" dy="25">在他的脸上，看起来就像一个"有胡须的(bearded)"人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bearded man looked like a wise old sage.
  </text>
  <text x="50" y="310" class="content">
    那个有胡须的男人看起来像一位智慧的老者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Beard -->
    <path d="M 50 150 Q 100 200 150 150" class="image" />
    <path d="M 50 150 Q 100 180 150 150" class="image" />
    <path d="M 50 150 Q 100 160 150 150" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
  </g>
</svg>