<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stature</text>
  <text x="50" y="120" class="subtitle">[ˈstætʃər] n. 身高，地位</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stat (站立) + ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在那里，"站立(stat)"
    <tspan x="50" dy="25">的高度(ure)就是他的身高(stature)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a man of great stature in the academic world.
  </text>
  <text x="50" y="310" class="content">
    他在学术界地位很高。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" /> <!-- Body -->
    <circle cx="50" cy="15" r="15" class="image" /> <!-- Head -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="30" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="70" y2="140" class="image" /> <!-- Right arm -->
    <!-- Height measurement -->
    <line x1="20" y1="20" x2="80" y2="20" class="image" />
    <line x1="20" y1="20" x2="20" y2="220" class="image" />
    <line x1="80" y1="20" x2="80" y2="220" class="image" />
    <line x1="20" y1="220" x2="80" y2="220" class="image" />
    <text x="10" y="120" class="content" transform="rotate(-90, 10, 120)">Height</text>
  </g>
</svg>