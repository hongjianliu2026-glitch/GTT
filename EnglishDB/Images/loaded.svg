<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loaded</text>
  <text x="50" y="120" class="subtitle">[ˈloʊdɪd] adj. 装满的，富有的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> load (装载) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆卡车，"装载(load)"了满满的货物，
    <tspan x="50" dy="25">卡车变得"装满的(loaded)"，就像一个富有的人一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The truck was loaded with goods for the market.
  </text>
  <text x="50" y="310" class="content">
    卡车装满了运往市场的货物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Truck -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Goods -->
    <rect x="70" y="40" width="210" height="120" class="image" />
    <line x1="80" y1="50" x2="270" y2="50" class="image" />
    <line x1="80" y1="80" x2="240" y2="80" class="image" />
    <line x1="80" y1="110" x2="260" y2="110" class="image" />
    <line x1="80" y1="140" x2="230" y2="140" class="image" />
    <!-- Label -->
    <text x="150" y="180" class="content">Loaded</text>
  </g>
</svg>