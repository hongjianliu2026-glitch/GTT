<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">week</text>
  <text x="50" y="120" class="subtitle">[wiːk] n. 周，星期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> week (源自古英语 wice，意为“星期”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的日历，上面有七个格子，每个格子代表一天。
    <tspan x="50" dy="25">这七个格子组成了一周(week)，就像一个循环的时间段。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I have a meeting every week on Monday.
  </text>
  <text x="50" y="310" class="content">
    我每周一都有个会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Days of the week -->
    <rect x="50" y="20" width="40" height="40" class="image" />
    <rect x="100" y="20" width="40" height="40" class="image" />
    <rect x="150" y="20" width="40" height="40" class="image" />
    <rect x="200" y="20" width="40" height="40" class="image" />
    <rect x="250" y="20" width="40" height="40" class="image" />
    <rect x="300" y="20" width="40" height="40" class="image" />
    <rect x="350" y="20" width="40" height="40" class="image" />
    <!-- Day labels -->
    <text x="55" y="50" class="content">M</text>
    <text x="105" y="50" class="content">T</text>
    <text x="155" y="50" class="content">W</text>
    <text x="205" y="50" class="content">T</text>
    <text x="255" y="50" class="content">F</text>
    <text x="305" y="50" class="content">S</text>
    <text x="355" y="50" class="content">S</text>
  </g>
</svg>