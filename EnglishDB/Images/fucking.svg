<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fucking</text>
  <text x="50" y="120" class="subtitle">[ˈfʌkɪŋ] adj. 该死的，非常的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fuck (性行为) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在极度愤怒时，"该死的(fucking)"
    <tspan x="50" dy="25">一切，这种强烈的情绪表达让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I'm so fucking tired of this.
  </text>
  <text x="50" y="310" class="content">
    我真是受够了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="30" y1="30" x2="40" y2="40" class="image" />
    <line x1="70" y1="30" x2="60" y2="40" class="image" />
    <line x1="30" y1="70" x2="70" y2="70" class="image" />
    <line x1="50" y1="80" x2="50" y2="90" class="image" />
    <!-- Exclamation marks -->
    <text x="100" y="50" class="image" font-size="40">!!!</text>
  </g>
</svg>