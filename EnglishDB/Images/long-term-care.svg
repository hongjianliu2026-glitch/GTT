<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">long-term-care</text>
  <text x="50" y="120" class="subtitle">[ˌlɔŋˈtɜːrm kɛər] n. 长期护理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> long (长) + term (期限) + care (照顾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位老人坐在轮椅上，护士在旁边细心照顾，"长期(long-term)"
    <tspan x="50" dy="25">的照顾(care)，这就是长期护理(long-term-care)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She needs long-term-care due to her chronic illness.
  </text>
  <text x="50" y="310" class="content">
    由于她的慢性病，她需要长期护理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wheelchair -->
    <rect x="50" y="20" width="200" height="100" class="image" />
    <line x1="70" y1="40" x2="230" y2="40" class="image" />
    <line x1="70" y1="60" x2="230" y2="60" class="image" />
    <line x1="70" y1="80" x2="230" y2="80" class="image" />
    <!-- Nurse -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Care symbol -->
    <line x1="250" y1="40" x2="250" y2="80" class="image" />
    <line x1="250" y1="60" x2="270" y2="60" class="image" />
    <line x1="260" y1="50" x2="260" y2="70" class="image" />
  </g>
</svg>