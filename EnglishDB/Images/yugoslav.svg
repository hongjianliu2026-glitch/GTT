<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Yugoslav</text>
  <text x="50" y="120" class="subtitle">[ˈjuːɡəslɑːv] n. 南斯拉夫人；adj. 南斯拉夫的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Yugo- (南) + Slav (斯拉夫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个南斯拉夫人站在南方的土地上，"南(Yugo-)"
    <tspan x="50" dy="25">斯拉夫(Slav)民族的代表，这就是南斯拉夫(Yugoslav)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Yugoslav people have a rich cultural heritage.
  </text>
  <text x="50" y="310" class="content">
    南斯拉夫人民有着丰富的文化遗产。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Southern land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="130" y2="140" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Southern sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
    <line x1="300" y1="80" x2="300" y2="120" class="image" />
    <line x1="300" y1="80" x2="270" y2="100" class="image" />
    <line x1="300" y1="80" x2="330" y2="100" class="image" />
    <line x1="300" y1="120" x2="270" y2="140" class="image" />
    <line x1="300" y1="120" x2="330" y2="140" class="image" />
  </g>
</svg>