<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abort</text>
  <text x="50" y="120" class="subtitle">[əˈbɔːrt] v. 中止，放弃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + or (上升)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架火箭在发射台上，"离开(ab-)"
    <tspan x="50" dy="25">上升(or)的过程中突然中止(abort)，</tspan>
    <tspan x="50" dy="25">火箭被迫返回地面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mission had to be aborted due to technical issues.
  </text>
  <text x="50" y="310" class="content">
    由于技术问题，任务不得不中止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rocket -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="20" x2="20" y2="50" class="image" />
    <line x1="50" y1="20" x2="80" y2="50" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Abort symbol -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="35" y1="90" x2="65" y2="110" class="image" />
    <line x1="35" y1="110" x2="65" y2="90" class="image" />
  </g>
</svg>