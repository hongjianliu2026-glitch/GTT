<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">postmodern</text>
  <text x="50" y="120" class="subtitle">[ˈpoʊstˈmɒdərn] adj. 后现代的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> post- (在...之后) + modern (现代的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在现代艺术的基础上，"在现代之后(post-modern)"
    <tspan x="50" dy="25">创造出更加前卫和混搭的作品，这就是后现代(postmodern)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The architecture of this building is very postmodern.
  </text>
  <text x="50" y="310" class="content">
    这座建筑的建筑风格非常后现代。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Modern art -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="170" y="20" width="100" height="100" class="image" />
    <rect x="50" y="140" width="100" height="40" class="image" />
    <rect x="170" y="140" width="100" height="40" class="image" />
    <!-- Postmodern art -->
    <circle cx="280" cy="100" r="50" class="image" />
    <line x1="280" y1="150" x2="350" y2="200" class="image" />
    <line x1="280" y1="150" x2="210" y2="200" class="image" />
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>