<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">backbone</text>
  <text x="50" y="120" class="subtitle">[ˈbækboʊn] n. 脊梁，支柱，骨干</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> back (背部) + bone (骨头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在那里，他的"背部(back)"有一根"骨头(bone)"，
    <tspan x="50" dy="25">这根骨头支撑着他，就像一个团队的骨干一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is the backbone of our team.
  </text>
  <text x="50" y="310" class="content">
    她是我们的团队骨干。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Human figure -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="50" x2="20" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="50" x2="80" y2="100" class="image" /> <!-- Right arm -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Right leg -->
    <!-- Backbone -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" stroke-width="4" stroke="#E74C3C" />
    <!-- Bone symbol -->
    <line x1="45" y1="50" x2="55" y2="50" class="image" stroke-width="4" stroke="#E74C3C" />
    <line x1="45" y1="150" x2="55" y2="150" class="image" stroke-width="4" stroke="#E74C3C" />
  </g>
</svg>