<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inferior</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfɪriər] adj. 下等的，劣等的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + fer (带来) + -ior (比较级后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的阴影下，"不带来(in-fer)"
    <tspan x="50" dy="25">任何好处，显得非常劣等(inferior)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The quality of this product is inferior to that one.
  </text>
  <text x="50" y="310" class="content">
    这个产品的质量比那个差。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shadow -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="170" class="image" />
    <line x1="175" y1="150" x2="200" y2="170" class="image" />
    <line x1="175" y1="130" x2="150" y2="120" class="image" />
    <line x1="175" y1="130" x2="200" y2="120" class="image" />
    <!-- Shadow effect -->
    <rect x="150" y="120" width="50" height="80" class="image" />
  </g>
</svg>