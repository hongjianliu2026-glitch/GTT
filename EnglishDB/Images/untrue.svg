<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">untrue</text>
  <text x="50" y="120" class="subtitle">[ʌnˈtruː] adj. 不真实的，假的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + true (真实的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被揭穿的谎言，"不真实(un-true)"
    <tspan x="50" dy="25">的气球在空中爆裂，真相大白。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The story he told was untrue.
  </text>
  <text x="50" y="310" class="content">
    他讲的故事是不真实的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Rope -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Explosion -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="80" y1="80" x2="120" y2="120" class="image" />
    <line x1="80" y1="120" x2="120" y2="80" class="image" />
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
  </g>
</svg>