<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Parisian</text>
  <text x="50" y="120" class="subtitle">[pəˈriziən] n. 巴黎人，巴黎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Paris (巴黎) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个优雅的巴黎人，穿着时尚的服装，
    <tspan x="50" dy="25">漫步在埃菲尔铁塔下，享受着巴黎的浪漫氛围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Parisian fashion is known worldwide for its elegance.
  </text>
  <text x="50" y="310" class="content">
    巴黎的时尚以其优雅闻名于世。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eiffel Tower -->
    <path d="M0 150 L50 50 L100 150 Z" class="image" />
    <path d="M50 50 L150 150" class="image" />
    <path d="M100 150 L150 50 L200 150" class="image" />
    <!-- Parisian -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="260" class="image" />
    <line x1="100" y1="260" x2="80" y2="300" class="image" />
    <line x1="100" y1="260" x2="120" y2="300" class="image" />
    <line x1="100" y1="240" x2="140" y2="230" class="image" />
    <line x1="100" y1="240" x2="60" y2="230" class="image" />
  </g>
</svg>