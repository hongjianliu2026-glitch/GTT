<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crusader</text>
  <text x="50" y="120" class="subtitle">[kruːˈseɪdə(r)] n. 十字军战士，改革者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crus (十字) + -ader (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个身穿盔甲的战士，胸前有一个巨大的十字架，
    <tspan x="50" dy="25">他手持长剑，勇敢地冲向敌人，这就是一个十字军战士(crusader)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was a crusader for women's rights.
  </text>
  <text x="50" y="310" class="content">
    她是一位争取妇女权利的改革者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knight -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <!-- Sword -->
    <line x1="70" y1="160" x2="100" y2="130" class="image" />
    <!-- Cross -->
    <line x1="50" y1="80" x2="50" y2="60" class="image" />
    <line x1="40" y1="70" x2="60" y2="70" class="image" />
  </g>
</svg>