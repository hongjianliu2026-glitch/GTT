<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">painkiller</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪnˌkɪlər] n. 止痛药</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pain (疼痛) + kill (杀死) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人痛苦地捂着头，突然一颗神奇的药丸从天而降，"杀死(kill)"
    <tspan x="50" dy="25">了他所有的疼痛(pain)，这就是止痛药(painkiller)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He took a painkiller to relieve his headache.
  </text>
  <text x="50" y="310" class="content">
    他吃了一片止痛药来缓解头痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with pain -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Pill falling -->
    <rect x="150" y="50" width="30" height="10" class="image" />
    <line x1="165" y1="50" x2="165" y2="100" class="image" />
    <!-- Pain disappearing -->
    <line x1="50" y1="130" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="170" class="image" />
    <line x1="50" y1="150" x2="80" y2="170" class="image" />
  </g>
</svg>