<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humiliation</text>
  <text x="50" y="120" class="subtitle">[hjuːˌmɪliˈeɪʃn] n. 羞辱，屈辱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> humil (低) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"压低(humil)"到地面上，
    <tspan x="50" dy="25">脸上写满了羞愧和屈辱(humiliation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The public humiliation made him feel worthless.
  </text>
  <text x="50" y="310" class="content">
    公开的羞辱让他感到毫无价值。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Person -->
    <circle cx="175" cy="160" r="20" class="image" />
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="220" class="image" />
    <line x1="175" y1="200" x2="195" y2="220" class="image" />
    <line x1="175" y1="190" x2="145" y2="180" class="image" />
    <line x1="175" y1="190" x2="205" y2="180" class="image" />
    <!-- Humiliation expression -->
    <line x1="165" y1="150" x2="185" y2="150" class="image" />
    <line x1="165" y1="150" x2="160" y2="145" class="image" />
    <line x1="185" y1="150" x2="190" y2="145" class="image" />
    <line x1="170" y1="170" x2="180" y2="170" class="image" />
    <line x1="170" y1="170" x2="165" y2="175" class="image" />
    <line x1="180" y1="170" x2="185" y2="175" class="image" />
  </g>
</svg>