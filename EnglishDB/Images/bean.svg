<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bean</text>
  <text x="50" y="120" class="subtitle">[biːn] n. 豆子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "bene"，意为豆子。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的豆子从天而降，"砰"的一声砸在地上，
    <tspan x="50" dy="25">豆子裂开，里面蹦出一个小人，这就是"豆子(bean)"的奇妙故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She planted a row of beans in her garden.
  </text>
  <text x="50" y="310" class="content">
    她在花园里种了一排豆子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bean -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <!-- Cracked bean -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <!-- Little person -->
    <circle cx="100" cy="120" r="10" class="image" />
    <line x1="100" y1="130" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="90" y2="170" class="image" />
    <line x1="100" y1="150" x2="110" y2="170" class="image" />
    <line x1="100" y1="140" x2="80" y2="130" class="image" />
    <line x1="100" y1="140" x2="120" y2="130" class="image" />
  </g>
</svg>