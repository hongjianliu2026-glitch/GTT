<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">car</text>
  <text x="50" y="120" class="subtitle">[kɑːr] n. 汽车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> car- (车)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车在公路上飞驰，"车(car)"
    <tspan x="50" dy="25">轮子飞速旋转，带我们穿越城市和乡村。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought a new car last week.
  </text>
  <text x="50" y="310" class="content">
    他上周买了一辆新车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="300" height="100" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="120" r="30" class="image" />
    <circle cx="250" cy="120" r="30" class="image" />
    <!-- Windows -->
    <rect x="50" y="20" width="80" height="40" class="image" />
    <rect x="170" y="20" width="80" height="40" class="image" />
  </g>
</svg>