<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">corkscrew</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrkˌskruː] n. 开瓶器，螺旋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cork (软木) + screw (螺丝)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个螺旋形的开瓶器，"螺旋(screw)"
    <tspan x="50" dy="25">钻入软木塞(cork)，轻松打开酒瓶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a corkscrew to open the wine bottle.
  </text>
  <text x="50" y="310" class="content">
    他用开瓶器打开了酒瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Cork -->
    <rect x="40" y="0" width="20" height="20" class="image" />
    <!-- Corkscrew -->
    <line x1="120" y1="100" x2="220" y2="0" class="image" />
    <line x1="120" y1="100" x2="140" y2="80" class="image" />
    <line x1="140" y1="80" x2="160" y2="60" class="image" />
    <line x1="160" y1="60" x2="180" y2="40" class="image" />
    <line x1="180" y1="40" x2="200" y2="20" class="image" />
    <line x1="200" y1="20" x2="220" y2="0" class="image" />
  </g>
</svg>