<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">murderous</text>
  <text x="50" y="120" class="subtitle">[ˈmɜrdərəs] adj. 杀人的，凶残的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> murd (杀) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个凶残的杀手，手持一把血淋淋的刀，"杀(murd)"
    <tspan x="50" dy="25">气腾腾，令人不寒而栗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The murderer's eyes were murderous.
  </text>
  <text x="50" y="310" class="content">
    凶手的眼睛充满了杀气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blood splatter -->
    <circle cx="50" cy="50" r="30" class="image" fill="#B03A2E" />
    <circle cx="100" cy="80" r="20" class="image" fill="#B03A2E" />
    <circle cx="150" cy="50" r="25" class="image" fill="#B03A2E" />
    <!-- Knife -->
    <line x1="200" y1="20" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <!-- Killer -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>