<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laity</text>
  <text x="50" y="120" class="subtitle">[ˈleɪəti] n. 俗人，外行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lai- (来自拉丁语 laicus, 意为“俗人”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着普通衣服的人站在一群穿着神职服装的人中间，
    <tspan x="50" dy="25">他显得格格不入，因为他是个“俗人(laity)”，</tspan>
    <tspan x="50" dy="25">而不是神职人员。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The laity are not allowed to perform the sacraments.
  </text>
  <text x="50" y="310" class="content">
    俗人不能执行圣礼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clergy -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="120" y="0" width="100" height="200" class="image" />
    <rect x="240" y="0" width="100" height="200" class="image" />
    <!-- Laity -->
    <rect x="360" y="0" width="100" height="200" class="image" />
    <!-- Clergy heads -->
    <circle cx="50" cy="150" r="30" class="image" />
    <circle cx="170" cy="150" r="30" class="image" />
    <circle cx="290" cy="150" r="30" class="image" />
    <!-- Laity head -->
    <circle cx="410" cy="150" r="30" class="image" />
    <!-- Clergy robes -->
    <line x1="50" y1="180" x2="50" y2="200" class="image" />
    <line x1="170" y1="180" x2="170" y2="200" class="image" />
    <line x1="290" y1="180" x2="290" y2="200" class="image" />
    <!-- Laity clothes -->
    <line x1="410" y1="180" x2="410" y2="200" class="image" />
  </g>
</svg>