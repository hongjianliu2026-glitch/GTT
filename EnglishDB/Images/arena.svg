<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arena</text>
  <text x="50" y="120" class="subtitle">[əˈriːnə] n. 竞技场，舞台</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aren (沙子) + -a (表示场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象古罗马的竞技场，"沙子(aren)"
    <tspan x="50" dy="25">铺成的场地，是勇士们战斗的舞台(arena)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The political arena is full of debates.
  </text>
  <text x="50" y="310" class="content">
    政治舞台上充满了辩论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arena outline -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Sand texture -->
    <rect x="120" y="20" width="160" height="160" class="image" fill="#D2B48C" />
    <!-- Gladiators -->
    <circle cx="150" cy="80" r="15" class="image" fill="#000" />
    <line x1="150" y1="95" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="105" x2="180" y2="95" class="image" />

    <circle cx="250" cy="80" r="15" class="image" fill="#000" />
    <line x1="250" y1="95" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <line x1="250" y1="105" x2="220" y2="95" class="image" />
  </g>
</svg>