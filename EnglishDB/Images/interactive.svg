<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interactive</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈæktɪv] adj. 交互式的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + act (行动) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在玩一个"互动(inter-active)"的游戏，
    <tspan x="50" dy="25">他们之间不断"行动(act)"，互相影响，这就是交互式的体验。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The website is designed to be interactive, allowing users to customize their experience.
  </text>
  <text x="50" y="310" class="content">
    这个网站设计为交互式的，允许用户自定义他们的体验。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Hands reaching out -->
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <line x1="70" y1="120" x2="70" y2="140" class="image" />
    <line x1="130" y1="120" x2="130" y2="140" class="image" />
    <!-- Game board -->
    <rect x="30" y="150" width="140" height="50" class="image" />
    <!-- Game pieces -->
    <circle cx="50" cy="175" r="10" class="image" />
    <circle cx="150" cy="175" r="10" class="image" />
  </g>
</svg>