<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thereafter</text>
  <text x="50" y="120" class="subtitle">[ˌðɛrˈæftər] adv. 之后，此后</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> there (那里) + after (之后)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个时间轴上，"那里之后(there-after)"
    <tspan x="50" dy="25">发生的事情，就是此后(thereafter)的事情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She left the party, and thereafter we never saw her again.
  </text>
  <text x="50" y="310" class="content">
    她离开了派对，此后我们再也没有见过她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Timeline -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <polygon points="300,90 320,100 300,110" class="image" />
    <!-- Text -->
    <text x="150" y="80" class="content">there</text>
    <text x="250" y="80" class="content">after</text>
  </g>
</svg>