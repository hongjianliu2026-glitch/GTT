<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reversible</text>
  <text x="50" y="120" class="subtitle">[rɪˈvɜːrsəbl] adj. 可逆的，可反转的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + vers (转) + -ible (可...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件衣服，你可以"反转(re-vers)"它的颜色，
    <tspan x="50" dy="25">从黑色变成白色，再从白色变回黑色，这就是可逆的(reversible)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jacket is reversible, so you can wear it inside out.
  </text>
  <text x="50" y="310" class="content">
    这件夹克是可逆的，所以你可以把它翻过来穿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jacket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Jacket front -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#000000" />
    <!-- Jacket back -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#FFFFFF" transform="translate(250,0) scale(-1,1)" />
    <!-- Arrow -->
    <line x1="175" y1="180" x2="325" y2="180" class="image" />
    <polygon points="325,180 315,175 315,185" class="image" />
    <!-- Text -->
    <text x="200" y="220" class="content" text-anchor="middle">Reversible</text>
  </g>
</svg>