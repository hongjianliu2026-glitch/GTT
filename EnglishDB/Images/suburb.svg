<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suburb</text>
  <text x="50" y="120" class="subtitle">[ˈsʌbɜːrb] n. 郊区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + urb (城市)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市(urb)的边缘，"在城市下面(sub-urb)"
    <tspan x="50" dy="25">的地方，就是郊区(suburb)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They moved to the suburb for a quieter life.
  </text>
  <text x="50" y="310" class="content">
    他们为了更安静的生活搬到了郊区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="40" width="50" height="80" class="image" />
    <rect x="190" y="60" width="50" height="60" class="image" />
    <rect x="260" y="80" width="50" height="40" class="image" />
    <!-- Suburb houses -->
    <rect x="50" y="140" width="30" height="30" class="image" />
    <rect x="100" y="140" width="30" height="30" class="image" />
    <rect x="150" y="140" width="30" height="30" class="image" />
    <rect x="200" y="140" width="30" height="30" class="image" />
    <rect x="250" y="140" width="30" height="30" class="image" />
    <!-- Trees -->
    <line x1="70" y1="130" x2="70" y2="110" class="image" />
    <line x1="70" y1="110" x2="60" y2="100" class="image" />
    <line x1="70" y1="110" x2="80" y2="100" class="image" />
    <line x1="120" y1="130" x2="120" y2="110" class="image" />
    <line x1="120" y1="110" x2="110" y2="100" class="image" />
    <line x1="120" y1="110" x2="130" y2="100" class="image" />
    <line x1="170" y1="130" x2="170" y2="110" class="image" />
    <line x1="170" y1="110" x2="160" y2="100" class="image" />
    <line x1="170" y1="110" x2="180" y2="100" class="image" />
    <line x1="220" y1="130" x2="220" y2="110" class="image" />
    <line x1="220" y1="110" x2="210" y2="100" class="image" />
    <line x1="220" y1="110" x2="230" y2="100" class="image" />
    <line x1="270" y1="130" x2="270" y2="110" class="image" />
    <line x1="270" y1="110" x2="260" y2="100" class="image" />
    <line x1="270" y1="110" x2="280" y2="100" class="image" />
  </g>
</svg>