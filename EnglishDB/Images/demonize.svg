<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">demonize</text>
  <text x="50" y="120" class="subtitle">[ˈdiːmənaɪz] v. 妖魔化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> demon (恶魔) + -ize (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被描绘成恶魔(demon)，
    <tspan x="50" dy="25">他的形象被"使成为(ize)"恶魔的样子，</tspan>
    <tspan x="50" dy="25">这就是妖魔化(demonize)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The media often demonizes political opponents.
  </text>
  <text x="50" y="310" class="content">
    媒体经常妖魔化政治对手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Demon head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Horns -->
    <path d="M 20 20 L 80 100 L 20 180 Z" class="image" />
    <path d="M 180 20 L 120 100 L 180 180 Z" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 60 140 Q 100 160 140 140" class="image" />
  </g>
</svg>