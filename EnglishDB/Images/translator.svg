<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">translator</text>
  <text x="50" y="120" class="subtitle">[trænsˈleɪtər] n. 翻译者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + lat (携带) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个翻译者，"跨越语言的界限，携带(trans-lat)"
    <tspan x="50" dy="25">信息，将一种语言转换成另一种语言。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She works as a translator for the United Nations.
  </text>
  <text x="50" y="310" class="content">
    她在联合国担任翻译工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="70" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,100 240,90 240,110" class="image" />
    <line x1="250" y1="100" x2="100" y2="100" class="image" />
    <polygon points="100,100 110,90 110,110" class="image" />
    <!-- Translator -->
    <circle cx="175" cy="200" r="15" class="image" />
    <line x1="175" y1="215" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="155" y2="280" class="image" />
    <line x1="175" y1="250" x2="195" y2="280" class="image" />
    <line x1="175" y1="230" x2="205" y2="220" class="image" />
  </g>
</svg>