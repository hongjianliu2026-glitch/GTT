<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soaked</text>
  <text x="50" y="120" class="subtitle">[soʊkt] adj. 湿透的，浸透的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soak (浸泡) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在暴雨中，全身被雨水"浸泡(soak)"，
    <tspan x="50" dy="25">衣服和头发都湿透了，变成了"湿透的(soaked)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the storm, the ground was soaked.
  </text>
  <text x="50" y="310" class="content">
    暴风雨过后，地面湿透了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />

    <!-- Water droplets -->
    <circle cx="40" cy="90" r="5" class="water" />
    <circle cx="60" cy="95" r="5" class="water" />
    <circle cx="55" cy="80" r="5" class="water" />
    <circle cx="45" cy="110" r="5" class="water" />
    <circle cx="70" cy="105" r="5" class="water" />

    <!-- Rain -->
    <line x1="10" y1="20" x2="10" y2="40" class="image" />
    <line x1="30" y1="25" x2="30" y2="45" class="image" />
    <line x1="50" y1="30" x2="50" y2="50" class="image" />
    <line x1="70" y1="35" x2="70" y2="55" class="image" />
    <line x1="90" y1="40" x2="90" y2="60" class="image" />
  </g>
</svg>