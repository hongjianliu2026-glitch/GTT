<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">respiratory</text>
  <text x="50" y="120" class="subtitle">[rɪˈspɪrətɔːri] adj. 呼吸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + spir (呼吸) + -atory (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在深呼吸，"再次呼吸(re-spir)"
    <tspan x="50" dy="25">以保持生命，这就是呼吸系统(respiratory)的作用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor checked her respiratory system.
  </text>
  <text x="50" y="310" class="content">
    医生检查了她的呼吸系统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lungs -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <ellipse cx="250" cy="100" rx="100" ry="50" class="image" />
    <!-- Diaphragm -->
    <rect x="100" y="150" width="300" height="20" class="image" />
    <!-- Air flow -->
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <line x1="250" y1="100" x2="250" y2="200" class="image" />
    <!-- Person -->
    <circle cx="200" cy="250" r="30" class="image" />
    <line x1="200" y1="280" x2="200" y2="350" class="image" />
    <line x1="200" y1="350" x2="170" y2="400" class="image" />
    <line x1="200" y1="350" x2="230" y2="400" class="image" />
    <line x1="200" y1="300" x2="150" y2="320" class="image" />
    <line x1="200" y1="300" x2="250" y2="320" class="image" />
  </g>
</svg>