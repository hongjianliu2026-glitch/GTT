<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hastily</text>
  <text x="50" y="120" class="subtitle">[ˈheɪstɪli] adv. 匆忙地，急速地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hast (快) + -ily (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在赶时间，"快快地(hast-ily)"
    <tspan x="50" dy="25">跑着去上班，结果不小心撞到了路人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She packed her bag hastily and left.
  </text>
  <text x="50" y="310" class="content">
    她匆忙地收拾好包离开了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person running -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="130" class="image" />
    <line x1="50" y1="150" x2="80" y2="130" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <!-- Road -->
    <line x1="0" y1="230" x2="150" y2="230" class="image" />
    <line x1="0" y1="240" x2="150" y2="240" class="image" />
    <line x1="0" y1="250" x2="150" y2="250" class="image" />
    <!-- Person being bumped -->
    <circle cx="120" cy="100" r="20" class="image" />
    <line x1="120" y1="120" x2="120" y2="180" class="image" />
    <line x1="120" y1="150" x2="90" y2="130" class="image" />
    <line x1="120" y1="150" x2="150" y2="130" class="image" />
    <line x1="120" y1="180" x2="90" y2="220" class="image" />
    <line x1="120" y1="180" x2="150" y2="220" class="image" />
  </g>
</svg>