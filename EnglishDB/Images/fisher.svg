<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fisher</text>
  <text x="50" y="120" class="subtitle">[ˈfɪʃər] n. 渔夫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fish (鱼) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个渔夫站在船上，手里拿着渔网，
    <tspan x="50" dy="25">正在努力地捕鱼。他的目标就是"捕鱼(fish)"，</tspan>
    <tspan x="50" dy="25">而他就是那个"捕鱼的人(fisher)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fisher caught a big fish this morning.
  </text>
  <text x="50" y="310" class="content">
    渔夫今天早上捕到了一条大鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boat -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Fisherman -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Fishing net -->
    <polyline points="100,50 150,100 200,50 250,100 300,50" class="image" />
    <!-- Fish -->
    <path d="M320,50 C330,30 350,30 360,50 S380,70 370,90" class="image" />
  </g>
</svg>