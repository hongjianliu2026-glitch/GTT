<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">installment</text>
  <text x="50" y="120" class="subtitle">[ɪnˈstɔːlmənt] n. 分期付款，分期交付</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + stall (放置) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你买了一台昂贵的电视，但你没有足够的钱一次性付清，所以你选择"分期付款(installment)"。
    <tspan x="50" dy="25">每次付款就像把一部分钱"放入(in-stall)"一个"放置(stall)"的地方，直到全部付清。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She paid for her new car in monthly installments.
  </text>
  <text x="50" y="310" class="content">
    她每月分期付款购买了新车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- TV -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Money bags -->
    <circle cx="70" cy="100" r="20" class="image" />
    <circle cx="120" cy="100" r="20" class="image" />
    <circle cx="170" cy="100" r="20" class="image" />
    <circle cx="220" cy="100" r="20" class="image" />
    <circle cx="270" cy="100" r="20" class="image" />
    <!-- Arrows -->
    <line x1="70" y1="120" x2="70" y2="180" class="image" />
    <line x1="120" y1="120" x2="120" y2="180" class="image" />
    <line x1="170" y1="120" x2="170" y2="180" class="image" />
    <line x1="220" y1="120" x2="220" y2="180" class="image" />
    <line x1="270" y1="120" x2="270" y2="180" class="image" />
    <!-- Installment text -->
    <text x="70" y="210" class="content">1st</text>
    <text x="120" y="210" class="content">2nd</text>
    <text x="170" y="210" class="content">3rd</text>
    <text x="220" y="210" class="content">4th</text>
    <text x="270" y="210" class="content">5th</text>
  </g>
</svg>