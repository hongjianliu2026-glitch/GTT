<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incorporation</text>
  <text x="50" y="120" class="subtitle">[ˌɪnkɔːrpəˈreɪʃn] n. 合并，公司</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + corpor (身体) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个公司"进入(in-)"同一个"身体(corpor)"，
    <tspan x="50" dy="25">形成了一个新的整体，这就是合并(incorporation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The incorporation of the two companies created a new industry leader.
  </text>
  <text x="50" y="310" class="content">
    两家公司的合并创造了一个新的行业领导者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First company -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <text x="20" y="50" class="content">Company A</text>
    <!-- Second company -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <text x="220" y="50" class="content">Company B</text>
    <!-- Merged company -->
    <rect x="100" y="120" width="200" height="100" class="image" />
    <text x="120" y="170" class="content">New Company</text>
    <!-- Arrows -->
    <line x1="75" y1="100" x2="100" y2="120" class="image" />
    <line x1="275" y1="100" x2="250" y2="120" class="image" />
    <line x1="100" y1="120" x2="250" y2="120" class="image" />
  </g>
</svg>