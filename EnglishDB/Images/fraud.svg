<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fraud</text>
  <text x="50" y="120" class="subtitle">[frɔːd] n. 欺诈，欺骗行为</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frau (欺骗) + d (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骗子在街头，"欺骗(frau)"
    <tspan x="50" dy="25">路人，这种行为就是欺诈(fraud)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was arrested for credit card fraud.
  </text>
  <text x="50" y="310" class="content">
    他因信用卡欺诈被捕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Con artist -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Victim -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Money -->
    <rect x="100" y="130" width="30" height="20" class="image" />
    <rect x="110" y="140" width="10" height="10" class="image" />
    <rect x="120" y="150" width="10" height="10" class="image" />
    <!-- Speech bubble -->
    <path d="M 50 80 Q 100 70 150 80 Q 200 90 250 80" class="image" />
    <circle cx="250" cy="80" r="5" class="image" />
  </g>
</svg>