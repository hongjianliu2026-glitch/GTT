<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dais</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪɪs] n. 讲台，高台</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dais (源自法语，意为“讲台”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者站在一个高高的讲台(dais)上，
    <tspan x="50" dy="25">他的声音响彻整个大厅，所有人都仰望着他。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The professor stood on the dais to deliver his lecture.
  </text>
  <text x="50" y="310" class="content">
    教授站在讲台上发表演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dais -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lecturer -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Audience -->
    <circle cx="100" cy="250" r="10" class="image" />
    <circle cx="150" cy="250" r="10" class="image" />
    <circle cx="200" cy="250" r="10" class="image" />
    <circle cx="250" cy="250" r="10" class="image" />
    <circle cx="300" cy="250" r="10" class="image" />
  </g>
</svg>