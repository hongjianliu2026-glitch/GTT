<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">organizational</text>
  <text x="50" y="120" class="subtitle">[ˌɔːrɡənaɪˈzeɪʃənl] adj. 组织的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> organ (器官，工具) + -ize (使成为) + -ational (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机器，每个部分都是"器官(organ)"，
    <tspan x="50" dy="25">它们被"组织化(organizational)"地连接在一起，</tspan>
    <tspan x="50" dy="25">形成一个高效运作的整体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The organizational structure of the company is very efficient.
  </text>
  <text x="50" y="310" class="content">
    公司的组织结构非常高效。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Machine parts -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Connections -->
    <line x1="50" y1="100" x2="170" y2="100" class="image" />
    <line x1="170" y1="100" x2="290" y2="100" class="image" />
    <line x1="50" y1="220" x2="170" y2="220" class="image" />
    <line x1="170" y1="220" x2="290" y2="220" class="image" />
    <line x1="50" y1="100" x2="50" y2="220" class="image" />
    <line x1="170" y1="100" x2="170" y2="220" class="image" />
    <line x1="290" y1="100" x2="290" y2="220" class="image" />
  </g>
</svg>