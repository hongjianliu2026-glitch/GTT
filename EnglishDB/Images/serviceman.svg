<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">serviceman</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrvɪsmən] n. 维修人员，军人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> servi- (服务) + -man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着制服的人，"服务(servi-)"
    <tspan x="50" dy="25">于社会，无论是修理机器还是保卫国家，</tspan>
    <tspan x="50" dy="25">他都是一名服务人员(serviceman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The serviceman fixed the broken machine in no time.
  </text>
  <text x="50" y="310" class="content">
    维修人员很快就修好了坏掉的机器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Uniform -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Head -->
    <circle cx="75" cy="50" r="30" class="image" />
    <!-- Body -->
    <rect x="50" y="80" width="50" height="100" class="image" />
    <!-- Arms -->
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <!-- Legs -->
    <line x1="60" y1="180" x2="60" y2="220" class="image" />
    <line x1="90" y1="180" x2="90" y2="220" class="image" />
    <!-- Tool -->
    <line x1="150" y1="150" x2="180" y2="120" class="image" />
    <line x1="180" y1="120" x2="180" y2="150" class="image" />
  </g>
</svg>