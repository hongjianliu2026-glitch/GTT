<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antigen</text>
  <text x="50" y="120" class="subtitle">[ˈæntɪdʒən] n. 抗原</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (对抗) + gen (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个细胞表面有一个"对抗产生(anti-gen)"的标记，
    <tspan x="50" dy="25">这个标记会引发免疫系统的反应，就像一个警示灯。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The body produces antibodies to fight the antigen.
  </text>
  <text x="50" y="310" class="content">
    身体产生抗体来对抗抗原。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cell -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Antigen marker -->
    <circle cx="100" cy="100" r="10" class="image" fill="#E74C3C" />
    <!-- Immune response -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="70" y2="230" class="image" />
    <line x1="100" y1="200" x2="130" y2="230" class="image" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
  </g>
</svg>