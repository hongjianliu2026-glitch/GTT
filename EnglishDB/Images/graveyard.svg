<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5EFE6; }
      .title { font: bold 48px sans-serif; fill: #5D4037; }
      .subtitle { font: italic 24px serif; fill: #795548; }
      .content { font: 18px sans-serif; fill: #6D4C41; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #4E342E; }
      .image { stroke: #8D6E63; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">graveyard</text>
  <text x="50" y="120" class="subtitle">[ˈɡreɪvjɑːrd] n. 墓地，坟场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grave (坟墓) + yard (场地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阴森的夜晚，"坟墓(grave)"
    <tspan x="50" dy="25">整齐排列在"场地(yard)"上，这就是墓地(graveyard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old mansion was surrounded by a graveyard.
  </text>
  <text x="50" y="310" class="content">
    那座古老的宅邸被一片墓地环绕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Graves -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="120" y="20" width="50" height="30" class="image" />
    <rect x="190" y="20" width="50" height="30" class="image" />
    <rect x="260" y="20" width="50" height="30" class="image" />
    <!-- Crosses -->
    <line x1="75" y1="20" x2="75" y2="40" class="image" />
    <line x1="70" y1="30" x2="80" y2="30" class="image" />
    <line x1="145" y1="20" x2="145" y2="40" class="image" />
    <line x1="140" y1="30" x2="150" y2="30" class="image" />
    <line x1="215" y1="20" x2="215" y2="40" class="image" />
    <line x1="210" y1="30" x2="220" y2="30" class="image" />
    <line x1="285" y1="20" x2="285" y2="40" class="image" />
    <line x1="280" y1="30" x2="290" y2="30" class="image" />
  </g>
</svg>