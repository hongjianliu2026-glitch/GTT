<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">investor</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvɛstər] n. 投资者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vest (衣服) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装的人，"穿上(vest)"
    <tspan x="50" dy="25">投资的外衣(in-vest-or)，成为了一个投资者(investor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The investor made a fortune in the stock market.
  </text>
  <text x="50" y="310" class="content">
    这位投资者在股市中赚了一大笔钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Suit -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Tie -->
    <line x1="75" y1="20" x2="75" y2="60" class="image" />
    <line x1="75" y1="40" x2="50" y2="30" class="image" />
    <line x1="75" y1="40" x2="100" y2="30" class="image" />
    <!-- Head -->
    <circle cx="75" cy="100" r="15" class="image" />
    <!-- Arms -->
    <line x1="20" y1="120" x2="0" y2="150" class="image" />
    <line x1="130" y1="120" x2="150" y2="150" class="image" />
    <!-- Legs -->
    <line x1="75" y1="200" x2="75" y2="230" class="image" />
    <line x1="75" y1="230" x2="50" y2="260" class="image" />
    <line x1="75" y1="230" x2="100" y2="260" class="image" />
  </g>
</svg>