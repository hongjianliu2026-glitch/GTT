<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reap</text>
  <text x="50" y="120" class="subtitle">[riːp] v. 收割，收获</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + ap (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在田地里，"再次拿起(re-ap)"
    <tspan x="50" dy="25">镰刀，收割成熟的庄稼，这就是收获(reap)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmers are busy reaping the wheat.
  </text>
  <text x="50" y="310" class="content">
    农民们正忙着收割小麦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Farmer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Scythe -->
    <line x1="90" y1="140" x2="150" y2="100" class="image" />
    <!-- Wheat -->
    <line x1="200" y1="100" x2="200" y2="180" class="image" />
    <line x1="220" y1="100" x2="220" y2="180" class="image" />
    <line x1="240" y1="100" x2="240" y2="180" class="image" />
    <line x1="260" y1="100" x2="260" y2="180" class="image" />
  </g>
</svg>