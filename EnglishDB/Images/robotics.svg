<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">robotics</text>
  <text x="50" y="120" class="subtitle">[roʊˈbɑːtɪks] n. 机器人学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> robot (机器人) + -ics (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机器人工厂，"机器人(robot)"
    <tspan x="50" dy="25">们在流水线上忙碌，这就是机器人学(robotics)的</tspan>
    <tspan x="50" dy="25">核心场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Robotics is a rapidly growing field.
  </text>
  <text x="50" y="310" class="content">
    机器人学是一个快速发展的领域。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Robot -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Conveyor belt -->
    <line x1="100" y1="190" x2="300" y2="190" class="image" />
    <line x1="100" y1="200" x2="300" y2="200" class="image" />
    <line x1="100" y1="210" x2="300" y2="210" class="image" />
    <!-- Another robot -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="170" y2="220" class="image" />
    <line x1="200" y1="180" x2="230" y2="220" class="image" />
    <line x1="200" y1="150" x2="170" y2="140" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
  </g>
</svg>