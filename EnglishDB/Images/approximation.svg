<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">approximation</text>
  <text x="50" y="120" class="subtitle">[əˌprɒksɪˈmeɪʃn] n. 近似，接近</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (朝向) + proxim (接近) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在努力"朝向(ap-)"一个目标，但只能"接近(proxim)"，
    <tspan x="50" dy="25">无法完全达到，这就是一个近似(approximation)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The approximation of the solution was sufficient for our needs.
  </text>
  <text x="50" y="310" class="content">
    这个解决方案的近似值足以满足我们的需求。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Target -->
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Person approaching -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Arrow pointing towards target -->
    <line x1="80" y1="100" x2="130" y2="100" class="image" />
    <polygon points="130,90 140,100 130,110" class="image" />
  </g>
</svg>