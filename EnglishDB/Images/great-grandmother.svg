<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">great-grandmother</text>
  <text x="50" y="120" class="subtitle">[ˌɡreɪt ˈɡrændˌmʌðər] n. 曾祖母</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> great (伟大的) + grand (大的) + mother (母亲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个慈祥的曾祖母，她坐在摇椅上，"伟大的(great)、大的(grand)"
    <tspan x="50" dy="25">母亲(mother)，她是我们家族的支柱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My great-grandmother used to tell us stories every night.
  </text>
  <text x="50" y="310" class="content">
    我的曾祖母过去每晚都会给我们讲故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="50" y="20" width="200" height="100" class="image" />
    <!-- Great-grandmother -->
    <circle cx="150" cy="80" r="20" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="120" x2="120" y2="140" class="image" />
    <line x1="150" y1="120" x2="180" y2="140" class="image" />
    <line x1="150" y1="150" x2="120" y2="180" class="image" />
    <line x1="150" y1="150" x2="180" y2="180" class="image" />
    <!-- Heart -->
    <path d="M130,190 C120,210 170,210 160,190" class="image" />
    <path d="M145,200 C135,220 185,220 175,200" class="image" />
  </g>
</svg>