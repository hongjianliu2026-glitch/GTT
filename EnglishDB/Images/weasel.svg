<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weasel</text>
  <text x="50" y="120" class="subtitle">[ˈwiːzəl] n. 黄鼠狼，狡猾的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> weas- (黄鼠狼) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小黄鼠狼(weasel)在森林里，
    <tspan x="50" dy="25">它狡猾地避开陷阱，偷偷摸摸地行动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is as cunning as a weasel.
  </text>
  <text x="50" y="310" class="content">
    他像黄鼠狼一样狡猾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Weasel body -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <!-- Weasel head -->
    <circle cx="100" cy="70" r="20" class="image" />
    <!-- Weasel eyes -->
    <circle cx="90" cy="65" r="3" class="image" fill="#000" />
    <circle cx="110" cy="65" r="3" class="image" fill="#000" />
    <!-- Weasel tail -->
    <line x1="100" y1="130" x2="150" y2="180" class="image" />
    <!-- Weasel legs -->
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
  </g>
</svg>