<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">invite</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvaɪt] v. 邀请</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vit (生命)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一张邀请函，"进入(in-)"
    <tspan x="50" dy="25">一个充满活力(vit)的派对，这就是邀请(invite)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She invited me to her birthday party.
  </text>
  <text x="50" y="310" class="content">
    她邀请我参加她的生日派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Invitation card -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <text x="20" y="40" class="content" fill="#2C3E50">Invitation</text>
    <!-- Person -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="230" y2="160" class="image" />
    <line x1="250" y1="130" x2="270" y2="160" class="image" />
    <line x1="250" y1="110" x2="280" y2="100" class="image" />
    <!-- Party scene -->
    <rect x="300" y="0" width="150" height="150" class="image" />
    <circle cx="330" cy="50" r="10" class="image" />
    <circle cx="370" cy="50" r="10" class="image" />
    <circle cx="350" cy="80" r="10" class="image" />
  </g>
</svg>