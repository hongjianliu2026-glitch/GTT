<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intent</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtent] n. 意图，目的；adj. 专心的，坚决的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (向内) + tend (伸展)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人内心深处"向内伸展(in-tend)"
    <tspan x="50" dy="25">出强烈的意图，这种意图驱使他坚定地行动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His intent was clear: to win the race at all costs.
  </text>
  <text x="50" y="310" class="content">
    他的意图很明确：不惜一切代价赢得比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 Q100,20 150,50 Q100,80 50,50" class="image" />
    <!-- Arrow pointing inward -->
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <polygon points="100,50 90,40 95,45 90,50" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>