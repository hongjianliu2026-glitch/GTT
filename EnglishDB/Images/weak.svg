<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weak</text>
  <text x="50" y="120" class="subtitle">[wiːk] adj. 虚弱的，无力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> w- (表示“弯曲”) + eak (表示“力量”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为力量不足而"弯曲(w-eak)"，
    <tspan x="50" dy="25">显得非常虚弱和无力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the surgery, he felt too weak to walk.
  </text>
  <text x="50" y="310" class="content">
    手术后，他感到太虚弱以至于无法走路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person bending -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Head -->
    <circle cx="50" cy="10" r="10" class="image" />
  </g>
</svg>