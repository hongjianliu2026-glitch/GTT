<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fastest-growing</text>
  <text x="50" y="120" class="subtitle">[ˈfɑːstɪst ˈɡroʊɪŋ] adj. 增长最快的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fast (快速的) + grow (生长) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树，它的枝条以惊人的速度"快速生长(fast-growing)"，
    <tspan x="50" dy="25">转眼间就变成了森林中最"最快(fastest)"的那一棵。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fastest-growing sector in the economy is technology.
  </text>
  <text x="50" y="310" class="content">
    经济中增长最快的领域是科技。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="50" y2="150" class="image" />
    <line x1="100" y1="200" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="50" y2="100" class="image" />
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="50" y2="50" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <!-- Fast arrow -->
    <polyline points="200,200 250,150 300,200" class="image" />
    <polyline points="200,150 250,100 300,150" class="image" />
    <polyline points="200,100 250,50 300,100" class="image" />
  </g>
</svg>