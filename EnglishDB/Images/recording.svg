<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recording</text>
  <text x="50" y="120" class="subtitle">[rɪˈkɔːrdɪŋ] n. 录音，记录</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + cord (心)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在录音室里，"再次用心(re-cord)"
    <tspan x="50" dy="25">捕捉每一个音符，这些音符就构成了录音(recording)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The band made a recording of their new song.
  </text>
  <text x="50" y="310" class="content">
    乐队录制了他们的新歌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microphone -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Sound waves -->
    <path d="M30,230 Q40,210 50,230 Q60,250 70,230" class="image" />
    <path d="M30,240 Q40,220 50,240 Q60,260 70,240" class="image" />
    <path d="M30,250 Q40,230 50,250 Q60,270 70,250" class="image" />
    <!-- Music note -->
    <path d="M80,150 Q90,130 100,150 Q110,170 120,150" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
  </g>
</svg>