<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">menace</text>
  <text x="50" y="120" class="subtitle">[ˈmɛnəs] n. 威胁，恐吓；v. 威胁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> men- (威胁) + -ace (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的怪兽，"威胁(men-)"
    <tspan x="50" dy="25">着整个城市，它的存在就是一种威胁(menace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The looming storm was a menace to the coastal town.
  </text>
  <text x="50" y="310" class="content">
    即将到来的风暴对沿海小镇构成了威胁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="150" class="image" />
    <line x1="100" y1="180" x2="150" y2="150" class="image" />
    <!-- City -->
    <rect x="0" y="300" width="200" height="50" class="image" />
    <rect x="20" y="310" width="30" height="30" class="image" />
    <rect x="70" y="310" width="30" height="30" class="image" />
    <rect x="120" y="310" width="30" height="30" class="image" />
    <rect x="170" y="310" width="30" height="30" class="image" />
  </g>
</svg>