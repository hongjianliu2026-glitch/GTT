<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scattering</text>
  <text x="50" y="120" class="subtitle">[ˈskætərɪŋ] n. 散布，分散</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scat (散开) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群小鸟从树上飞起，"散开(scat)"
    <tspan x="50" dy="25">成不同的方向，这就是散布(scattering)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scattering of leaves in the wind created a beautiful scene.
  </text>
  <text x="50" y="310" class="content">
    风吹散的树叶创造了一幅美丽的景象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Birds -->
    <circle cx="120" cy="50" r="10" class="image" />
    <circle cx="150" cy="70" r="10" class="image" />
    <circle cx="180" cy="90" r="10" class="image" />
    <circle cx="210" cy="110" r="10" class="image" />
    <circle cx="240" cy="130" r="10" class="image" />
    <!-- Lines representing flight paths -->
    <line x1="120" y1="50" x2="100" y2="20" class="image" />
    <line x1="150" y1="70" x2="170" y2="40" class="image" />
    <line x1="180" y1="90" x2="200" y2="60" class="image" />
    <line x1="210" y1="110" x2="230" y2="80" class="image" />
    <line x1="240" y1="130" x2="260" y2="100" class="image" />
  </g>
</svg>