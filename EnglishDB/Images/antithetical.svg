<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antithetical</text>
  <text x="50" y="120" class="subtitle">[ˌæntɪˈθetɪkl] adj. 对立的，相反的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对) + thet (放置) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站着，"反对放置(anti-thet)"
    <tspan x="50" dy="25">在相反的位置，他们的观点完全对立(antithetical)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His views on politics are antithetical to mine.
  </text>
  <text x="50" y="310" class="content">
    他对政治的看法与我的完全对立。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="120" y1="100" x2="280" y2="100" class="image" />
    <!-- Arrows pointing opposite directions -->
    <polygon points="150,80 130,100 150,120" class="image" />
    <polygon points="250,80 270,100 250,120" class="image" />
  </g>
</svg>