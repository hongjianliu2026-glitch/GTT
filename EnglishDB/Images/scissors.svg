<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scissors</text>
  <text x="50" y="120" class="subtitle">[ˈsɪzərz] n. 剪刀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sci (切割) + ssors (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把剪刀，"切割(sci)"
    <tspan x="50" dy="25">纸张或布料，这就是剪刀(scissors)的用途。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a pair of scissors to cut the fabric.
  </text>
  <text x="50" y="310" class="content">
    她用剪刀剪布料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Scissors handle -->
    <rect x="0" y="0" width="100" height="20" class="image" />
    <rect x="100" y="0" width="100" height="20" class="image" />
    <!-- Scissors blade -->
    <line x1="20" y1="20" x2="80" y2="80" class="image" />
    <line x1="120" y1="20" x2="180" y2="80" class="image" />
    <!-- Scissors pivot -->
    <circle cx="100" cy="20" r="10" class="image" />
  </g>
</svg>