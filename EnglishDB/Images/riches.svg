<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">riches</text>
  <text x="50" y="120" class="subtitle">[ˈrɪtʃɪz] n. 财富，财产</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rich (富有的) + -es (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金库，里面堆满了金币和珠宝，
    <tspan x="50" dy="25">这些闪闪发光的财富(riches)让人眼花缭乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His riches allowed him to live a luxurious life.
  </text>
  <text x="50" y="310" class="content">
    他的财富使他过上了奢侈的生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vault -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gold coins -->
    <circle cx="50" cy="50" r="15" class="image" fill="#FFD700" />
    <circle cx="80" cy="50" r="15" class="image" fill="#FFD700" />
    <circle cx="110" cy="50" r="15" class="image" fill="#FFD700" />
    <circle cx="140" cy="50" r="15" class="image" fill="#FFD700" />
    <circle cx="170" cy="50" r="15" class="image" fill="#FFD700" />
    <!-- Jewels -->
    <rect x="200" y="30" width="30" height="30" class="image" fill="#8B008B" />
    <rect x="240" y="30" width="30" height="30" class="image" fill="#00CED1" />
    <rect x="280" y="30" width="30" height="30" class="image" fill="#FF69B4" />
  </g>
</svg>