<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inspector</text>
  <text x="50" y="120" class="subtitle">[ɪnˈspɛktər] n. 检查员，巡视员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + spect (看) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个检查员拿着放大镜，"深入查看(in-spect)"
    <tspan x="50" dy="25">每一个细节，确保一切都符合标准。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The inspector carefully examined the building's structure.
  </text>
  <text x="50" y="310" class="content">
    检查员仔细检查了建筑物的结构。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Inspector -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Magnifying glass -->
    <circle cx="80" cy="100" r="10" class="image" />
    <line x1="80" y1="110" x2="120" y2="110" class="image" />
    <line x1="120" y1="110" x2="120" y2="130" class="image" />
    <line x1="120" y1="130" x2="80" y2="130" class="image" />
    <line x1="80" y1="130" x2="80" y2="110" class="image" />
    <!-- Detail -->
    <rect x="150" y="90" width="50" height="50" class="image" />
    <line x1="160" y1="100" x2="190" y2="130" class="image" />
    <line x1="160" y1="130" x2="190" y2="100" class="image" />
  </g>
</svg>