<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">communal</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmjʊnl] adj. 公共的，集体的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + mun (服务)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一个大桌子旁，"共同(com-)"
    <tspan x="50" dy="25">分享食物和服务，这就是"公共的(communal)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The park has a communal picnic area.
  </text>
  <text x="50" y="310" class="content">
    公园里有一个公共的野餐区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Food -->
    <rect x="100" y="50" width="150" height="30" class="image" />
    <rect x="120" y="70" width="30" height="30" class="image" />
    <rect x="170" y="70" width="30" height="30" class="image" />
    <rect x="220" y="70" width="30" height="30" class="image" />
  </g>
</svg>