<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contemptuous</text>
  <text x="50" y="120" class="subtitle">[kənˈtemptʃuəs] adj. 轻蔑的，鄙视的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (加强) + tempt (尝试) + -uous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人对某事"加强尝试(con-tempt)"后，
    <tspan x="50" dy="25">却感到极度不屑，这种态度就是轻蔑的(contemptuous)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave him a contemptuous look when he mentioned his new job.
  </text>
  <text x="50" y="310" class="content">
    当他提到他的新工作时，她给了他一个轻蔑的眼神。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a contemptuous look -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Contemptuous expression -->
    <line x1="35" y1="40" x2="45" y2="40" class="image" />
    <line x1="55" y1="40" x2="65" y2="40" class="image" />
    <line x1="45" y1="60" x2="55" y2="60" class="image" />
    <line x1="50" y1="60" x2="50" y2="70" class="image" />
  </g>
</svg>