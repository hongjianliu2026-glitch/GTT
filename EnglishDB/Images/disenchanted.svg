<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disenchanted</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsɪnˈtʃæntɪd] adj. 不再着迷的，失望的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + enchant (使着迷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个曾经被魔法(enchant)深深吸引的人，
    <tspan x="50" dy="25">现在却因为失望(dis-)而不再着迷(disenchanted)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the scandal, many fans became disenchanted with the star.
  </text>
  <text x="50" y="310" class="content">
    丑闻曝光后，许多粉丝对这位明星感到失望。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken heart -->
    <path d="M50 50 Q100 25 150 50 T250 50" class="image" />
    <path d="M50 50 Q25 75 50 100 T150 100" class="image" />
    <path d="M150 100 Q175 75 200 100 T250 100" class="image" />
    <!-- Disappointed face -->
    <circle cx="150" cy="150" r="50" class="image" />
    <circle cx="125" cy="135" r="5" class="image" />
    <circle cx="175" cy="135" r="5" class="image" />
    <path d="M125 170 Q150 180 175 170" class="image" />
  </g>
</svg>