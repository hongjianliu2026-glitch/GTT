<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">implausible</text>
  <text x="50" y="120" class="subtitle">[ɪmˈplɔːzəbl] adj. 难以置信的，不合理的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + plaus (可信) + -ible (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在讲述一个"不可信(im-plausible)"的故事，
    <tspan x="50" dy="25">他的话像是从一个破损的气球(plaus)中漏出，</tspan>
    <tspan x="50" dy="25">听众们都摇头表示不相信。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His implausible story about meeting a ghost was met with skepticism.
  </text>
  <text x="50" y="310" class="content">
    他关于遇见鬼的难以置信的故事遭到了怀疑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person speaking -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Broken balloon -->
    <path d="M70 50 Q100 20 130 50 T190 50" class="image" />
    <line x1="130" y1="50" x2="130" y2="100" class="image" />
    <!-- Audience shaking heads -->
    <circle cx="220" cy="100" r="15" class="image" />
    <line x1="220" y1="115" x2="220" y2="150" class="image" />
    <line x1="220" y1="150" x2="200" y2="180" class="image" />
    <line x1="220" y1="150" x2="240" y2="180" class="image" />
    <line x1="220" y1="130" x2="270" y2="120" class="image" />
    <circle cx="270" cy="100" r="15" class="image" />
    <line x1="270" y1="115" x2="270" y2="150" class="image" />
    <line x1="270" y1="150" x2="250" y2="180" class="image" />
    <line x1="270" y1="150" x2="290" y2="180" class="image" />
    <line x1="270" y1="130" x2="320" y2="120" class="image" />
  </g>
</svg>