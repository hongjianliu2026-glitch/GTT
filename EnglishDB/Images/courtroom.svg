<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">courtroom</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrtruːm] n. 法庭，审判室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> court (法庭) + room (房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个庄严的法庭，法官坐在高高的椅子上，
    <tspan x="50" dy="25">律师们在辩论，而陪审团在认真聆听。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The trial took place in a large courtroom.
  </text>
  <text x="50" y="310" class="content">
    审判在一个大法庭里进行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="100" y="20" width="150" height="50" class="image" />
    <!-- Judge -->
    <circle cx="175" cy="50" r="15" class="image" />
    <line x1="175" y1="65" x2="175" y2="100" class="image" />
    <line x1="175" y1="100" x2="150" y2="130" class="image" />
    <line x1="175" y1="100" x2="200" y2="130" class="image" />
    <!-- Lawyers -->
    <circle cx="75" cy="120" r="15" class="image" />
    <line x1="75" y1="135" x2="75" y2="170" class="image" />
    <line x1="75" y1="170" x2="50" y2="200" class="image" />
    <line x1="75" y1="170" x2="100" y2="200" class="image" />
    <circle cx="275" cy="120" r="15" class="image" />
    <line x1="275" y1="135" x2="275" y2="170" class="image" />
    <line x1="275" y1="170" x2="250" y2="200" class="image" />
    <line x1="275" y1="170" x2="300" y2="200" class="image" />
    <!-- Jury -->
    <rect x="125" y="150" width="100" height="30" class="image" />
    <circle cx="135" cy="165" r="5" class="image" />
    <circle cx="155" cy="165" r="5" class="image" />
    <circle cx="175" cy="165" r="5" class="image" />
    <circle cx="195" cy="165" r="5" class="image" />
  </g>
</svg>