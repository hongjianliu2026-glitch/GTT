<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">daisy</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪzi] n. 雏菊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> day (白天) + -y (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵小雏菊(daisy)在阳光明媚的白天(day)
    <tspan x="50" dy="25">绽放，它的花瓣像太阳的光芒一样耀眼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meadow was covered with daisies.
  </text>
  <text x="50" y="310" class="content">
    草地上开满了雏菊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Daisy flower -->
    <circle cx="100" cy="100" r="50" fill="#F4D03F" stroke="#873600" stroke-width="2" />
    <circle cx="100" cy="50" r="10" fill="#F1C40F" />
    <circle cx="130" cy="70" r="10" fill="#F1C40F" />
    <circle cx="70" cy="70" r="10" fill="#F1C40F" />
    <circle cx="140" cy="100" r="10" fill="#F1C40F" />
    <circle cx="60" cy="100" r="10" fill="#F1C40F" />
    <circle cx="130" cy="130" r="10" fill="#F1C40F" />
    <circle cx="70" cy="130" r="10" fill="#F1C40F" />
    <circle cx="100" cy="150" r="10" fill="#F1C40F" />
  </g>
</svg>