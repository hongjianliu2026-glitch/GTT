<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">negate</text>
  <text x="50" y="120" class="subtitle">[nɪˈɡeɪt] v. 否定，否认</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neg- (否定) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的"不"字前，"否定(neg-)"
    <tspan x="50" dy="25">一切，就像在说"不，这不是真的"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tried to negate the accusation, but it was too late.
  </text>
  <text x="50" y="310" class="content">
    她试图否认指控，但为时已晚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant "NO" -->
    <text x="50" y="100" font-size="150" font-weight="bold" fill="#C0392B">NO</text>
    <!-- Person -->
    <circle cx="200" cy="250" r="20" class="image" />
    <line x1="200" y1="270" x2="200" y2="320" class="image" />
    <line x1="200" y1="320" x2="180" y2="360" class="image" />
    <line x1="200" y1="320" x2="220" y2="360" class="image" />
    <line x1="200" y1="290" x2="160" y2="280" class="image" />
    <line x1="200" y1="290" x2="240" y2="280" class="image" />
  </g>
</svg>