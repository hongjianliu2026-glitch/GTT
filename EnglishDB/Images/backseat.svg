<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">backseat</text>
  <text x="50" y="120" class="subtitle">[ˈbækˌsit] n. 后座</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> back (后面) + seat (座位)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车，司机在前面开车，而乘客坐在"后面(back)"的"座位(seat)"上，
    <tspan x="50" dy="25">这就是后座(backseat)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers to sit in the backseat during long drives.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在长途驾驶时坐在后座上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Front seat -->
    <rect x="50" y="20" width="250" height="80" class="image" />
    <!-- Back seat -->
    <rect x="50" y="120" width="250" height="80" class="image" />
    <!-- Driver -->
    <circle cx="80" cy="60" r="15" class="image" />
    <line x1="80" y1="75" x2="80" y2="100" class="image" />
    <line x1="80" y1="100" x2="60" y2="120" class="image" />
    <line x1="80" y1="100" x2="100" y2="120" class="image" />
    <line x1="80" y1="85" x2="110" y2="75" class="image" />
    <!-- Passenger in backseat -->
    <circle cx="200" cy="160" r="15" class="image" />
    <line x1="200" y1="175" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="220" class="image" />
    <line x1="200" y1="200" x2="220" y2="220" class="image" />
    <line x1="200" y1="185" x2="230" y2="175" class="image" />
  </g>
</svg>