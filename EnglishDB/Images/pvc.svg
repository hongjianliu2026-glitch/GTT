<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">PVC</text>
  <text x="50" y="120" class="subtitle">[Polyvinyl Chloride] n. 聚氯乙烯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Poly- (多) + Vinyl (乙烯) + Chloride (氯化物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的化学工厂，"多(Poly)"个乙烯(Vinyl)分子被"氯化(Chloride)"，
    <tspan x="50" dy="25">形成了坚固的聚氯乙烯(PVC)管道，用于输送各种液体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The construction site used PVC pipes for the plumbing system.
  </text>
  <text x="50" y="310" class="content">
    建筑工地使用PVC管道进行管道系统安装。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chemical factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="20" width="50" height="100" class="image" />
    <!-- Smoke -->
    <circle cx="175" cy="10" r="10" class="image" />
    <circle cx="175" cy="0" r="15" class="image" />
    <circle cx="175" cy="-15" r="20" class="image" />
    <!-- PVC pipe -->
    <rect x="50" y="120" width="250" height="20" class="image" />
    <rect x="50" y="140" width="250" height="20" class="image" />
    <rect x="50" y="160" width="250" height="20" class="image" />
  </g>
</svg>