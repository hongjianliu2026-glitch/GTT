<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">microscopic</text>
  <text x="50" y="120" class="subtitle">[ˌmaɪkrəˈskɑːpɪk] adj. 显微镜的，极微小的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> micro- (小) + scop (看) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家用显微镜观察微小的物体，"用小(micro-)的视角(scop)"
    <tspan x="50" dy="25">来看世界，这些物体在显微镜下变得清晰可见。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bacteria were so small that they could only be seen with a microscope.
  </text>
  <text x="50" y="310" class="content">
    这些细菌非常小，只能用显微镜才能看到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microscope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="40" class="image" />
    <line x1="90" y1="100" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <!-- Small object -->
    <circle cx="300" cy="100" r="10" class="image" />
    <text x="290" y="120" class="content">微小物体</text>
  </g>
</svg>