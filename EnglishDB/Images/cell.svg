<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cell</text>
  <text x="50" y="120" class="subtitle">[sel] n. 细胞，电池，牢房</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cella (小房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微小的"小房间(cella)"，里面充满了生命的能量，
    <tspan x="50" dy="25">这个"小房间"就是细胞(cell)，它是生命的基本单位。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The human body is made up of trillions of cells.
  </text>
  <text x="50" y="310" class="content">
    人体由数万亿个细胞组成。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cell -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Nucleus -->
    <circle cx="100" cy="100" r="20" class="image" fill="#E74C3C" />
    <!-- Mitochondria -->
    <rect x="50" y="50" width="20" height="30" class="image" fill="#F39C12" />
    <!-- Ribosomes -->
    <circle cx="130" cy="70" r="5" class="image" fill="#2ECC71" />
    <circle cx="140" cy="80" r="5" class="image" fill="#2ECC71" />
    <circle cx="120" cy="90" r="5" class="image" fill="#2ECC71" />
  </g>
</svg>