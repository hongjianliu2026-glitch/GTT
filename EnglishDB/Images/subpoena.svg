<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subpoena</text>
  <text x="50" y="120" class="subtitle">[səbˈpiːnə] n. 传票</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + poena (惩罚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法庭场景，法官在"下面(sub-)"
    <tspan x="50" dy="25">发出一张"惩罚(poena)"的传票(subpoena)，</tspan>
    <tspan x="50" dy="25">要求某人出庭作证。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lawyer served a subpoena on the witness.
  </text>
  <text x="50" y="310" class="content">
    律师向证人发出了传票。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Judge -->
    <circle cx="100" cy="45" r="15" class="image" />
    <line x1="100" y1="60" x2="100" y2="90" class="image" />
    <line x1="100" y1="70" x2="80" y2="60" class="image" />
    <line x1="100" y1="70" x2="120" y2="60" class="image" />
    <!-- Subpoena -->
    <rect x="150" y="30" width="100" height="30" class="image" />
    <text x="155" y="50" class="content" fill="#000">Subpoena</text>
  </g>
</svg>