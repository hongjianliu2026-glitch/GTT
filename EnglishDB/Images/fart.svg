<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fart</text>
  <text x="50" y="120" class="subtitle">[fɑːrt] n. 放屁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "fart"，与古英语 "feortan" 相关。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公共场合突然放了一个响亮的屁，"fart"
    <tspan x="50" dy="25">的声音让周围的人都捂住了鼻子，场面十分尴尬。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He couldn't hold it in and let out a loud fart.
  </text>
  <text x="50" y="310" class="content">
    他忍不住了，放了一个响亮的屁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Fart cloud -->
    <ellipse cx="100" cy="120" rx="30" ry="20" class="image" />
    <ellipse cx="120" cy="110" rx="25" ry="15" class="image" />
    <ellipse cx="140" cy="100" rx="20" ry="10" class="image" />
    <!-- Nose holding -->
    <line x1="50" y1="100" x2="30" y2="80" class="image" />
    <line x1="50" y1="100" x2="70" y2="80" class="image" />
  </g>
</svg>