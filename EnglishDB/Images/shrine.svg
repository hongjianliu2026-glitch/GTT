<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shrine</text>
  <text x="50" y="120" class="subtitle">[ʃraɪn] n. 神龛，圣地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shrin (神圣) + e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的"神圣(shrin)"之地，
    <tspan x="50" dy="25">被人们视为"圣地(shrine)"，供奉着神灵。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The temple has a small shrine dedicated to the goddess.
  </text>
  <text x="50" y="310" class="content">
    这座寺庙里有一个供奉女神的小神龛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shrine structure -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Roof -->
    <polygon points="50,20 300,20 275,50 75,50" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="80" class="image" />
    <!-- Holy symbol -->
    <circle cx="200" cy="60" r="10" class="image" />
    <!-- Light rays -->
    <line x1="200" y1="70" x2="200" y2="150" class="image" />
    <line x1="180" y1="110" x2="220" y2="110" class="image" />
    <line x1="190" y1="90" x2="210" y2="90" class="image" />
  </g>
</svg>