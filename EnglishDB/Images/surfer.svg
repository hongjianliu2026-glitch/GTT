<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surfer</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrfər] n. 冲浪者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> surf (海浪) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的冲浪者，站在巨大的海浪上，
    <tspan x="50" dy="25">"驾驭(surf)"着海浪，展现出无畏的精神。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The surfer caught the perfect wave and rode it all the way to the shore.
  </text>
  <text x="50" y="310" class="content">
    那位冲浪者抓住了完美的海浪，一路冲到了岸边。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wave -->
    <path d="M0 100 C100 200, 300 200, 400 100" class="image" />
    <path d="M0 100 C100 0, 300 0, 400 100" class="image" />
    <!-- Surfer -->
    <circle cx="200" cy="80" r="15" class="image" />
    <line x1="200" y1="95" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="180" y2="160" class="image" />
    <line x1="200" y1="130" x2="220" y2="160" class="image" />
    <line x1="200" y1="110" x2="230" y2="100" class="image" />
  </g>
</svg>