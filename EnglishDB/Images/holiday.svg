<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">holiday</text>
  <text x="50" y="120" class="subtitle">[ˈhɒlədeɪ] n. 假日，节日</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> holi (神圣的) + day (日子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神圣的日子(holi-day)，人们放下工作，
    <tspan x="50" dy="25">享受阳光和海滩，这就是假日(holiday)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We planned a beach holiday for the summer.
  </text>
  <text x="50" y="310" class="content">
    我们计划夏天去海滩度假。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" class="image" fill="#F1C40F" />
    <!-- Beach -->
    <rect x="0" y="100" width="350" height="100" class="image" fill="#3498DB" />
    <!-- People -->
    <circle cx="100" cy="130" r="15" class="image" fill="#E74C3C" />
    <circle cx="150" cy="130" r="15" class="image" fill="#E74C3C" />
    <circle cx="200" cy="130" r="15" class="image" fill="#E74C3C" />
    <!-- Umbrella -->
    <path d="M250,100 L280,100 L265,130 Z" class="image" fill="#2ECC71" />
    <!-- Waves -->
    <path d="M0,200 Q50,180 100,200 T200,200" class="image" fill="none" stroke="#2980B9" stroke-width="5" />
    <path d="M0,210 Q50,190 100,210 T200,210" class="image" fill="none" stroke="#2980B9" stroke-width="5" />
  </g>
</svg>