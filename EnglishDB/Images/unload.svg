<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unload</text>
  <text x="50" y="120" class="subtitle">[ʌnˈloʊd] v. 卸载，卸货</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (去掉) + load (装载)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆卡车停在码头，"去掉(un-)"
    <tspan x="50" dy="25">装载(load)的货物，工人们正在卸货(unload)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The workers began to unload the cargo from the ship.
  </text>
  <text x="50" y="310" class="content">
    工人们开始从船上卸货。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Truck -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Cargo -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="170" y="20" width="100" height="100" class="image" />
    <rect x="290" y="20" width="100" height="100" class="image" />
    <!-- Workers -->
    <circle cx="70" cy="130" r="15" class="image" />
    <line x1="70" y1="145" x2="70" y2="180" class="image" />
    <line x1="70" y1="180" x2="50" y2="210" class="image" />
    <line x1="70" y1="180" x2="90" y2="210" class="image" />
    <line x1="70" y1="160" x2="100" y2="150" class="image" />
    <circle cx="190" cy="130" r="15" class="image" />
    <line x1="190" y1="145" x2="190" y2="180" class="image" />
    <line x1="190" y1="180" x2="170" y2="210" class="image" />
    <line x1="190" y1="180" x2="210" y2="210" class="image" />
    <line x1="190" y1="160" x2="220" y2="150" class="image" />
  </g>
</svg>