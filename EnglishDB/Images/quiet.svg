<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quiet</text>
  <text x="50" y="120" class="subtitle">[ˈkwaɪət] adj. 安静的，平静的；n. 安静，平静</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quie (安静) + -t (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宁静的夜晚，"安静(quie)"
    <tspan x="50" dy="25">的湖面上只有微风拂过，一切都显得那么平静(quiet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The library is a quiet place to study.
  </text>
  <text x="50" y="310" class="content">
    图书馆是一个安静的学习场所。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Moon -->
    <circle cx="300" cy="50" r="20" class="image" />
    <!-- Trees -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="70" y1="100" x2="70" y2="150" class="image" />
    <line x1="90" y1="100" x2="90" y2="150" class="image" />
    <line x1="110" y1="100" x2="110" y2="150" class="image" />
    <line x1="130" y1="100" x2="130" y2="150" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="170" y1="100" x2="170" y2="150" class="image" />
    <line x1="190" y1="100" x2="190" y2="150" class="image" />
    <line x1="210" y1="100" x2="210" y2="150" class="image" />
    <line x1="230" y1="100" x2="230" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="270" y1="100" x2="270" y2="150" class="image" />
    <line x1="290" y1="100" x2="290" y2="150" class="image" />
    <line x1="310" y1="100" x2="310" y2="150" class="image" />
    <line x1="330" y1="100" x2="330" y2="150" class="image" />
    <line x1="350" y1="100" x2="350" y2="150" class="image" />
  </g>
</svg>