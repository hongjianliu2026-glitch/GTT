<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">piping</text>
  <text x="50" y="120" class="subtitle">[ˈpaɪpɪŋ] n. 管道系统，吹管乐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pipe (管道) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的管道系统，"管道(pipe)"
    <tspan x="50" dy="25">纵横交错，形成了一个复杂的网络，这就是管道系统(piping)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The building's piping system needs to be inspected regularly.
  </text>
  <text x="50" y="310" class="content">
    这栋楼的管道系统需要定期检查。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pipe system -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
  </g>
</svg>