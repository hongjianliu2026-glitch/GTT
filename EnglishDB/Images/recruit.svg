<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recruit</text>
  <text x="50" y="120" class="subtitle">[rɪˈkruːt] v. 招募，招聘；n. 新兵，新成员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + cru (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个军队指挥官在战场上，"再次生长(re-cru)"
    <tspan x="50" dy="25">出新的士兵，这些士兵就是新兵(recruit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is recruiting new employees for the upcoming project.
  </text>
  <text x="50" y="310" class="content">
    公司正在为即将到来的项目招聘新员工。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Army officer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Soldiers -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="90" y2="150" class="image" />
    <line x1="100" y1="130" x2="110" y2="150" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <line x1="130" y1="110" x2="130" y2="130" class="image" />
    <line x1="130" y1="130" x2="120" y2="150" class="image" />
    <line x1="130" y1="130" x2="140" y2="150" class="image" />
    <!-- Growth symbol -->
    <line x1="180" y1="100" x2="180" y2="150" class="image" />
    <line x1="170" y1="125" x2="190" y2="125" class="image" />
    <line x1="175" y1="110" x2="185" y2="140" class="image" />
  </g>
</svg>