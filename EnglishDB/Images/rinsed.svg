<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rinsed</text>
  <text x="50" y="120" class="subtitle">[rɪnst] v. 冲洗，漂洗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rin- (冲洗) + -sed (过去分词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水龙头，"冲洗(rin-)"
    <tspan x="50" dy="25">着一堆脏盘子，直到它们变得干净(rinsed)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She rinsed the dishes before putting them in the dishwasher.
  </text>
  <text x="50" y="310" class="content">
    她在把盘子放进洗碗机之前先冲洗了一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water tap -->
    <line x1="0" y1="0" x2="0" y2="100" class="image" />
    <circle cx="0" cy="100" r="10" class="image" />
    <!-- Water stream -->
    <line x1="0" y1="100" x2="50" y2="150" class="image" />
    <line x1="0" y1="100" x2="50" y2="160" class="image" />
    <line x1="0" y1="100" x2="50" y2="170" class="image" />
    <!-- Dirty dishes -->
    <rect x="60" y="150" width="30" height="20" class="image" />
    <rect x="100" y="150" width="30" height="20" class="image" />
    <rect x="140" y="150" width="30" height="20" class="image" />
    <!-- Clean dishes -->
    <rect x="60" y="180" width="30" height="20" class="image" />
    <rect x="100" y="180" width="30" height="20" class="image" />
    <rect x="140" y="180" width="30" height="20" class="image" />
  </g>
</svg>