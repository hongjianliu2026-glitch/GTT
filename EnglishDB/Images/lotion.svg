<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lotion</text>
  <text x="50" y="120" class="subtitle">[ˈloʊʃn] n. 洗液，护肤液</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lot (部分) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个精致的瓶子，里面装满了"部分(lot)"
    <tspan x="50" dy="25">护肤液，轻轻涂抹在皮肤上，瞬间变得光滑细腻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She applied some lotion to her dry skin.
  </text>
  <text x="50" y="310" class="content">
    她给干燥的皮肤涂了一些护肤液。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <!-- Liquid -->
    <rect x="25" y="25" width="50" height="150" fill="#85C1E9" />
    <!-- Cap -->
    <rect x="10" y="10" width="80" height="20" class="image" />
    <!-- Hand applying lotion -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="150" x2="130" y2="130" class="image" />
    <line x1="150" y1="150" x2="170" y2="130" class="image" />
    <line x1="150" y1="180" x2="130" y2="200" class="image" />
    <line x1="150" y1="180" x2="170" y2="200" class="image" />
  </g>
</svg>