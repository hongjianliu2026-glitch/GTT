<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">correspondence</text>
  <text x="50" y="120" class="subtitle">[ˌkɔːrəˈspɑːndəns] n. 通信，信件；对应关系</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cor- (共同) + respond (回应) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人通过信件进行"共同回应(cor-respond-ence)"，
    <tspan x="50" dy="25">他们的信件往来形成了通信(correspondence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The correspondence between the two scientists lasted for years.
  </text>
  <text x="50" y="310" class="content">
    两位科学家之间的通信持续了多年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Envelopes -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="200" y="0" width="150" height="100" class="image" />
    <!-- Letters inside envelopes -->
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="220" y1="20" x2="330" y2="20" class="image" />
    <line x1="220" y1="40" x2="330" y2="40" class="image" />
    <line x1="220" y1="60" x2="330" y2="60" class="image" />
    <!-- Arrows indicating correspondence -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="175" y1="50" x2="175" y2="70" class="image" />
    <line x1="175" y1="70" x2="150" y2="70" class="image" />
    <line x1="200" y1="50" x2="225" y2="50" class="image" />
    <line x1="225" y1="50" x2="225" y2="70" class="image" />
    <line x1="225" y1="70" x2="200" y2="70" class="image" />
  </g>
</svg>