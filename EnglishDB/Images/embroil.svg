<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">embroil</text>
  <text x="50" y="120" class="subtitle">[ɪmˈbrɔɪl] v. 使卷入，使陷入纠纷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + broil (争吵)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"卷入(en-)"一场激烈的"争吵(broil)"，
    <tspan x="50" dy="25">他无法脱身，完全陷入了纠纷(embroil)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The argument embroiled both families in a long-standing feud.
  </text>
  <text x="50" y="310" class="content">
    这场争论使两个家庭卷入了一场长期的仇恨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in the middle -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="220" class="image" />
    <line x1="175" y1="180" x2="195" y2="220" class="image" />
    <line x1="175" y1="140" x2="135" y2="160" class="image" />
    <line x1="175" y1="140" x2="215" y2="160" class="image" />

    <!-- Arrows representing conflict -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,90 150,110 170,100" class="image" />
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <polygon points="300,90 300,110 280,100" class="image" />
    <line x1="175" y1="50" x2="175" y2="80" class="image" />
    <polygon points="165,80 185,80 175,100" class="image" />
    <line x1="175" y1="120" x2="175" y2="150" class="image" />
    <polygon points="165,150 185,150 175,170" class="image" />
  </g>
</svg>