<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">airstrip</text>
  <text x="50" y="120" class="subtitle">[ˈɛrˌstrɪp] n. 简易机场，飞机跑道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气，天空) + strip (条，带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条"带子(strip)"在"天空(air)"中延伸，
    <tspan x="50" dy="25">这就是飞机起飞和降落的跑道(airstrip)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The small plane landed on the airstrip in the jungle.
  </text>
  <text x="50" y="310" class="content">
    小型飞机降落在丛林中的简易机场上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airstrip -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Airplane -->
    <polygon points="20,50 120,50 100,80 40,80" class="image" />
    <!-- Clouds -->
    <circle cx="50" cy="20" r="20" class="image" />
    <circle cx="100" cy="20" r="20" class="image" />
    <circle cx="150" cy="20" r="20" class="image" />
  </g>
</svg>