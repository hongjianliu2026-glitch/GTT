<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">junkyard</text>
  <text x="50" y="120" class="subtitle">[ˈdʒʌŋkjɑːrd] n. 废车场，垃圾场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> junk (废旧物品) + yard (场地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的场地，堆满了各种废旧物品和破旧的汽车，
    <tspan x="50" dy="25">这就是一个"废旧物品的场地(junk-yard)"，即废车场(junkyard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old car was towed to the junkyard.
  </text>
  <text x="50" y="310" class="content">
    那辆旧车被拖到了废车场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Junkyard boundary -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Junk items -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Car outline -->
    <rect x="100" y="100" width="150" height="50" class="image" />
    <rect x="120" y="150" width="30" height="20" class="image" />
    <rect x="200" y="150" width="30" height="20" class="image" />
  </g>
</svg>