<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impetus</text>
  <text x="50" y="120" class="subtitle">[ˈɪmpɪtəs] n. 动力，推动力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + pet (追求) + -us (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头"进入(im-)"你的生活，"追求(pet)"
    <tspan x="50" dy="25">着你的目标，给你无尽的动力(impetus)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new project gave us an impetus to work harder.
  </text>
  <text x="50" y="310" class="content">
    新项目给了我们更努力工作的动力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow -->
    <polygon points="0,100 100,100 100,50 150,100 100,150 100,100" class="image" />
    <!-- Target -->
    <circle cx="250" cy="100" r="50" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <!-- Person -->
    <circle cx="350" cy="100" r="20" class="image" />
    <line x1="350" y1="120" x2="350" y2="180" class="image" />
    <line x1="350" y1="150" x2="320" y2="130" class="image" />
    <line x1="350" y1="150" x2="380" y2="130" class="image" />
    <line x1="350" y1="180" x2="320" y2="200" class="image" />
    <line x1="350" y1="180" x2="380" y2="200" class="image" />
  </g>
</svg>