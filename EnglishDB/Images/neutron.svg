<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neutron</text>
  <text x="50" y="120" class="subtitle">[ˈnjuːtrɒn] n. 中子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neutro- (中性) + -on (粒子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"中性(neutro-)"的粒子，它不带电荷，
    <tspan x="50" dy="25">就像一个平静的"中子(neutron)"，在原子核中静静地存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The neutron is a fundamental particle in the nucleus of an atom.
  </text>
  <text x="50" y="310" class="content">
    中子是原子核中的基本粒子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Atom nucleus -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Neutron -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="175" cy="175" r="15" class="image" />
    <circle cx="175" cy="25" r="15" class="image" />
    <circle cx="125" cy="150" r="15" class="image" />
    <circle cx="225" cy="150" r="15" class="image" />
    <circle cx="125" cy="50" r="15" class="image" />
    <circle cx="225" cy="50" r="15" class="image" />
  </g>
</svg>