<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">little</text>
  <text x="50" y="120" class="subtitle">[ˈlɪtl] adj. 小的，少的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> litt (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫，"小小的(litt)"
    <tspan x="50" dy="25">身体蜷缩在角落里，显得格外可爱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a little kitten that she loves very much.
  </text>
  <text x="50" y="310" class="content">
    她有一只她非常喜欢的小猫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small cat -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Back leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Front leg -->
    <line x1="50" y1="100" x2="30" y2="90" class="image" /> <!-- Tail -->
    <line x1="50" y1="100" x2="70" y2="90" class="image" /> <!-- Tail -->
  </g>
</svg>