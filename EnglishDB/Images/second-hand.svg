<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">second-hand</text>
  <text x="50" y="120" class="subtitle">[ˈsɛkənd hænd] adj. 二手的，间接的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> second (第二) + hand (手)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在二手市场，"第二手(second-hand)"
    <tspan x="50" dy="25">拿着别人用过的物品，这些物品就是二手的(second-hand)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I bought a second-hand car last week.
  </text>
  <text x="50" y="310" class="content">
    我上周买了一辆二手车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person holding a second-hand item -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Second-hand item (used car) -->
    <rect x="70" y="80" width="200" height="100" class="image" />
    <line x1="70" y1="80" x2="270" y2="80" class="image" />
    <line x1="70" y1="180" x2="270" y2="180" class="image" />
    <line x1="70" y1="80" x2="70" y2="180" class="image" />
    <line x1="270" y1="80" x2="270" y2="180" class="image" />
    <line x1="120" y1="80" x2="120" y2="180" class="image" />
    <line x1="170" y1="80" x2="170" y2="180" class="image" />
    <line x1="70" y1="130" x2="270" y2="130" class="image" />
  </g>
</svg>