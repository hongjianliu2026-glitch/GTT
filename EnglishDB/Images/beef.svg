<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beef</text>
  <text x="50" y="120" class="subtitle">[biːf] n. 牛肉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> beef (源自中古英语 bif, 意为“牛”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头强壮的牛，"牛(beef)"
    <tspan x="50" dy="25">在草原上悠闲地吃草，它的肉就是美味的牛肉(beef)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I ordered a steak made from beef.
  </text>
  <text x="50" y="310" class="content">
    我点了一份用牛肉做的牛排。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cow body -->
    <ellipse cx="150" cy="100" rx="100" ry="60" class="image" />
    <!-- Cow head -->
    <circle cx="230" cy="80" r="30" class="image" />
    <!-- Cow legs -->
    <line x1="80" y1="160" x2="80" y2="220" class="image" />
    <line x1="120" y1="160" x2="120" y2="220" class="image" />
    <line x1="180" y1="160" x2="180" y2="220" class="image" />
    <line x1="220" y1="160" x2="220" y2="220" class="image" />
    <!-- Cow tail -->
    <line x1="250" y1="100" x2="280" y2="80" class="image" />
  </g>
</svg>