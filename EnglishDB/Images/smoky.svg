<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .smoke { fill: #808080; opacity: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smoky</text>
  <text x="50" y="120" class="subtitle">[ˈsmoʊki] adj. 烟雾弥漫的，烟熏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smok (烟) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个烟雾缭绕的房间，"烟(smok)"
    <tspan x="50" dy="25">弥漫(y)在整个空间，这就是smoky的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was smoky after the barbecue.
  </text>
  <text x="50" y="310" class="content">
    烧烤后房间里烟雾弥漫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Smoke clouds -->
    <ellipse cx="100" cy="100" rx="80" ry="40" class="smoke" />
    <ellipse cx="150" cy="120" rx="60" ry="30" class="smoke" />
    <ellipse cx="200" cy="80" rx="70" ry="35" class="smoke" />
    <ellipse cx="250" cy="110" rx="50" ry="25" class="smoke" />
    <!-- Room outline -->
    <rect x="50" y="50" width="250" height="150" class="image" />
  </g>
</svg>