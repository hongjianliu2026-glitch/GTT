<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humanities</text>
  <text x="50" y="120" class="subtitle">[hjuːˈmænɪtiːz] n. 人文学科</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> human (人) + -ities (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群学者在讨论"人(human)"的
    <tspan x="50" dy="25">各种学问，这些学问就构成了人文学科(humanities)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She majored in the humanities at university.
  </text>
  <text x="50" y="310" class="content">
    她在大学主修人文学科。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Books -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="110" y="0" width="100" height="150" class="image" />
    <rect x="220" y="0" width="100" height="150" class="image" />
    <!-- Scholars -->
    <circle cx="50" cy="200" r="20" class="image" />
    <line x1="50" y1="220" x2="50" y2="260" class="image" />
    <line x1="50" y1="260" x2="30" y2="300" class="image" />
    <line x1="50" y1="260" x2="70" y2="300" class="image" />
    <line x1="50" y1="240" x2="90" y2="230" class="image" />
    <circle cx="160" cy="200" r="20" class="image" />
    <line x1="160" y1="220" x2="160" y2="260" class="image" />
    <line x1="160" y1="260" x2="140" y2="300" class="image" />
    <line x1="160" y1="260" x2="180" y2="300" class="image" />
    <line x1="160" y1="240" x2="200" y2="230" class="image" />
    <circle cx="270" cy="200" r="20" class="image" />
    <line x1="270" y1="220" x2="270" y2="260" class="image" />
    <line x1="270" y1="260" x2="250" y2="300" class="image" />
    <line x1="270" y1="260" x2="290" y2="300" class="image" />
    <line x1="270" y1="240" x2="310" y2="230" class="image" />
  </g>
</svg>