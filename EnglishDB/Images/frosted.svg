<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frosted</text>
  <text x="50" y="120" class="subtitle">[ˈfrɔstɪd] adj. 结霜的，霜冻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frost (霜) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的早晨，窗户上"结满了霜(frost)"，
    <tspan x="50" dy="25">整个窗户都被"霜冻(frosted)"覆盖，看起来像是被魔法冻结了一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The windows were frosted over with ice.
  </text>
  <text x="50" y="310" class="content">
    窗户被冰霜覆盖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Window frame -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Frosted glass -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#E5E7E9" />
    <!-- Frost patterns -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" stroke-dasharray="5,5" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" stroke-dasharray="5,5" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" stroke-dasharray="5,5" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" stroke-dasharray="5,5" />
    <!-- Snowflake -->
    <polygon points="175,100 150,150 200,150" class="image" />
    <polygon points="175,100 150,50 200,50" class="image" />
    <polygon points="175,100 125,100 125,125" class="image" />
    <polygon points="175,100 225,100 225,125" class="image" />
  </g>
</svg>