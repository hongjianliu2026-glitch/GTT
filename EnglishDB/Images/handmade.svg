<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handmade</text>
  <text x="50" y="120" class="subtitle">[ˈhændmeɪd] adj. 手工制作的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + made (制作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠用"手(hand)"亲自"制作(made)"
    <tspan x="50" dy="25">一件精美的工艺品，这就是手工制作(handmade)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves wearing handmade jewelry.
  </text>
  <text x="50" y="310" class="content">
    她喜欢佩戴手工制作的珠宝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />

    <!-- Craft -->
    <rect x="100" y="80" width="150" height="100" class="image" />
    <line x1="120" y1="100" x2="230" y2="100" class="image" />
    <line x1="120" y1="120" x2="230" y2="120" class="image" />
    <line x1="120" y1="140" x2="230" y2="140" class="image" />
    <line x1="120" y1="160" x2="230" y2="160" class="image" />
  </g>
</svg>