<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">invest</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvest] v. 投资，投入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vest (衣服)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把金币"投入(in-)"一件衣服(vest)里，
    <tspan x="50" dy="25">这件衣服变成了一个装满财富的宝库，这就是投资(invest)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He decided to invest in the stock market.
  </text>
  <text x="50" y="310" class="content">
    他决定投资股市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coin -->
    <circle cx="50" cy="100" r="20" class="image" />
    <text x="45" y="105" class="content" fill="#FFD700">💰</text>
    <!-- Vest -->
    <rect x="80" y="80" width="150" height="100" class="image" />
    <line x1="80" y1="80" x2="155" y2="30" class="image" />
    <line x1="230" y1="80" x2="155" y2="30" class="image" />
    <!-- Coins in vest -->
    <circle cx="120" cy="120" r="10" class="image" />
    <circle cx="160" cy="120" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
  </g>
</svg>