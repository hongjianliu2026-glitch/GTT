<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scared</text>
  <text x="50" y="120" class="subtitle">[skerd] adj. 害怕的，恐惧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scari (恐惧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在黑暗中，突然看到一个幽灵，"恐惧(scari)"
    <tspan x="50" dy="25">的感觉瞬间袭来，他吓得(scared)脸色苍白。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child was scared of the dark.
  </text>
  <text x="50" y="310" class="content">
    那个孩子害怕黑暗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Ghost -->
    <circle cx="100" cy="100" r="30" class="image" fill="white" />
    <line x1="80" y1="130" x2="120" y2="130" class="image" />
    <line x1="90" y1="150" x2="110" y2="150" class="image" />
    <line x1="100" y1="170" x2="100" y2="190" class="image" />
    <!-- Scared person -->
    <circle cx="250" cy="100" r="20" class="image" fill="#E74C3C" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>