<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thrill</text>
  <text x="50" y="120" class="subtitle">[θrɪl] n. 兴奋，激动；v. 使兴奋，使激动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thri- (快速移动) + ll (重复)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在过山车上，"快速移动(thri-)"
    <tspan x="50" dy="25">并不断重复(ll)这种刺激，这就是兴奋(thrill)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roller coaster ride thrilled the children.
  </text>
  <text x="50" y="310" class="content">
    过山车让孩子们感到兴奋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Roller coaster track -->
    <path d="M0 100 C 50 50, 150 50, 200 100 S 300 150, 350 100" class="image" />
    <!-- Roller coaster car -->
    <rect x="180" y="80" width="40" height="20" class="image" />
    <!-- Person in the car -->
    <circle cx="200" cy="90" r="10" class="image" />
    <!-- Thrilled face -->
    <circle cx="195" cy="85" r="2" class="image" />
    <circle cx="205" cy="85" r="2" class="image" />
    <line x1="195" y1="95" x2="205" y2="95" class="image" />
  </g>
</svg>