<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">joint</text>
  <text x="50" y="120" class="subtitle">[dʒɔɪnt] n. 关节，接头；adj. 联合的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> join (连接) + -t (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机械手臂，"连接(join)"
    <tspan x="50" dy="25">在一起的各个部分形成了关节(joint)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The carpenter used a joint to connect the two pieces of wood.
  </text>
  <text x="50" y="310" class="content">
    木匠用一个接头连接了两块木头。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mechanical arm -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Joints -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Connecting parts -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <!-- Mechanical arm -->
    <rect x="50" y="80" width="80" height="40" class="image" />
    <rect x="150" y="80" width="80" height="40" class="image" />
    <rect x="250" y="80" width="80" height="40" class="image" />
  </g>
</svg>