<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gregarious</text>
  <text x="50" y="120" class="subtitle">[ɡrɪˈɡɛəriəs] adj. 群居的，爱社交的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> greg (群) + -arious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人像羊群一样聚集在一起，"群居(greg)"
    <tspan x="50" dy="25">在一起，形成了一个爱社交的(gregarious)群体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a gregarious person who loves to attend parties.
  </text>
  <text x="50" y="310" class="content">
    她是一个爱社交的人，喜欢参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Lines connecting people -->
    <line x1="70" y1="70" x2="90" y2="70" class="image" />
    <line x1="120" y1="70" x2="140" y2="70" class="image" />
    <line x1="170" y1="70" x2="190" y2="70" class="image" />
    <line x1="220" y1="70" x2="240" y2="70" class="image" />
  </g>
</svg>