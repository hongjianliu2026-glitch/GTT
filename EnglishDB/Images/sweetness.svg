<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sweet { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sweetness</text>
  <text x="50" y="120" class="subtitle">[ˈswiːtnəs] n. 甜蜜，甜味</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sweet (甜的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的糖果山，"甜(sweet)"
    <tspan x="50" dy="25">蜜的气息弥漫在空气中，这就是甜蜜(sweetness)的极致体验。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sweetness of the cake made everyone smile.
  </text>
  <text x="50" y="310" class="content">
    蛋糕的甜味让每个人都露出了笑容。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candy mountain -->
    <circle cx="100" cy="100" r="80" class="sweet" />
    <circle cx="150" cy="120" r="60" class="sweet" />
    <circle cx="200" cy="140" r="40" class="sweet" />
    <circle cx="250" cy="160" r="20" class="sweet" />
    <!-- Candy stripes -->
    <line x1="100" y1="20" x2="280" y2="20" class="image" />
    <line x1="100" y1="40" x2="280" y2="40" class="image" />
    <line x1="100" y1="60" x2="280" y2="60" class="image" />
    <line x1="100" y1="80" x2="280" y2="80" class="image" />
    <line x1="100" y1="100" x2="280" y2="100" class="image" />
    <line x1="100" y1="120" x2="280" y2="120" class="image" />
    <line x1="100" y1="140" x2="280" y2="140" class="image" />
    <line x1="100" y1="160" x2="280" y2="160" class="image" />
    <line x1="100" y1="180" x2="280" y2="180" class="image" />
  </g>
</svg>