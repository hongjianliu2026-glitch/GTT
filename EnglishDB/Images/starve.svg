<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">starve</text>
  <text x="50" y="120" class="subtitle">[stɑrv] v. 挨饿，饿死</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sta- (站立) + -rve (剥夺)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在那里，"被剥夺(sta-rve)"
    <tspan x="50" dy="25">了食物，最终饿得无法动弹，这就是挨饿(starve)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The refugees were starving due to the lack of food.
  </text>
  <text x="50" y="310" class="content">
    由于缺乏食物，难民们正在挨饿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="50" y1="80" x2="80" y2="100" class="image" />
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Starving effect -->
    <line x1="50" y1="150" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="30" y2="300" class="image" />
    <line x1="50" y1="250" x2="70" y2="300" class="image" />
    <line x1="50" y1="220" x2="80" y2="240" class="image" />
    <circle cx="50" cy="200" r="20" class="image" />
  </g>
</svg>