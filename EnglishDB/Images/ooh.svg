<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ooh</text>
  <text x="50" y="120" class="subtitle">[uː] int. （表示惊讶、赞叹等）哦，啊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 拟声词，模拟惊讶或赞叹的声音
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到令人惊叹的景象，发出"哦(ooh)"的声音，
    <tspan x="50" dy="25">眼睛瞪大，嘴巴张开，仿佛被眼前的景象震撼到了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Ooh, what a beautiful sunset!
  </text>
  <text x="50" y="310" class="content">
    哦，多么美丽的日落啊！
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with open mouth -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="90" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <ellipse cx="50" cy="60" rx="10" ry="5" class="image" /> <!-- Mouth -->
    <circle cx="40" cy="45" r="3" class="image" /> <!-- Left eye -->
    <circle cx="60" cy="45" r="3" class="image" /> <!-- Right eye -->

    <!-- Sun setting -->
    <circle cx="200" cy="150" r="50" class="image" /> <!-- Sun -->
    <line x1="200" y1="200" x2="200" y2="300" class="image" /> <!-- Sunbeam -->
    <line x1="150" y1="250" x2="250" y2="250" class="image" /> <!-- Horizon -->
  </g>
</svg>