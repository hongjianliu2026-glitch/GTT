<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conservative</text>
  <text x="50" y="120" class="subtitle">[kənˈsɜːrvətɪv] adj. 保守的，守旧的；n. 保守派</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + serv (保持) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着传统服装的人，"共同保持(con-serv)"
    <tspan x="50" dy="25">着旧有的价值观和习俗，这就是保守派(conservative)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The conservative party won the election.
  </text>
  <text x="50" y="310" class="content">
    保守党赢得了选举。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional clothing -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Old-fashioned hat -->
    <rect x="10" y="80" width="20" height="10" class="image" />
    <!-- Old-fashioned coat -->
    <rect x="0" y="150" width="40" height="30" class="image" />
  </g>
</svg>