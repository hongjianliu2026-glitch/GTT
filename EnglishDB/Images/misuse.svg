<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misuse</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsˈjuːz] v. 误用，滥用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + use (使用)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一把锤子，却用它来"错误地使用(mis-use)"
    <tspan x="50" dy="25">敲打键盘，结果键盘被砸坏了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He misused the company's funds for personal expenses.
  </text>
  <text x="50" y="310" class="content">
    他将公司的资金用于个人开支，这是滥用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <line x1="0" y1="0" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="0" class="image" />
    <rect x="40" y="50" width="20" height="100" class="image" />
    <!-- Keyboard -->
    <rect x="150" y="0" width="200" height="100" class="image" />
    <line x1="160" y1="20" x2="340" y2="20" class="image" />
    <line x1="160" y1="40" x2="340" y2="40" class="image" />
    <line x1="160" y1="60" x2="340" y2="60" class="image" />
    <line x1="160" y1="80" x2="340" y2="80" class="image" />
    <!-- Broken keyboard -->
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="300" y2="100" class="image" />
  </g>
</svg>