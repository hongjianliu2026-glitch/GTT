<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outdo</text>
  <text x="50" y="120" class="subtitle">[aʊtˈduː] v. 超越，胜过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (超过) + do (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在比赛中，"做(do)"得比别人更好，
    <tspan x="50" dy="25">超过了所有人，这就是"超越(outdo)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She outdid herself in the marathon.
  </text>
  <text x="50" y="310" class="content">
    她在马拉松比赛中超越了自己。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Race track -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <!-- Runner 1 -->
    <circle cx="50" cy="10" r="15" class="image" />
    <line x1="50" y1="25" x2="50" y2="60" class="image" />
    <line x1="50" y1="60" x2="30" y2="90" class="image" />
    <line x1="50" y1="60" x2="70" y2="90" class="image" />
    <line x1="50" y1="40" x2="80" y2="30" class="image" />
    <!-- Runner 2 -->
    <circle cx="150" cy="10" r="15" class="image" />
    <line x1="150" y1="25" x2="150" y2="60" class="image" />
    <line x1="150" y1="60" x2="130" y2="90" class="image" />
    <line x1="150" y1="60" x2="170" y2="90" class="image" />
    <line x1="150" y1="40" x2="180" y2="30" class="image" />
    <!-- Winner -->
    <circle cx="250" cy="10" r="15" class="image" />
    <line x1="250" y1="25" x2="250" y2="60" class="image" />
    <line x1="250" y1="60" x2="230" y2="90" class="image" />
    <line x1="250" y1="60" x2="270" y2="90" class="image" />
    <line x1="250" y1="40" x2="280" y2="30" class="image" />
    <text x="240" y="110" class="content" style="fill: #E74C3C;">Winner</text>
  </g>
</svg>