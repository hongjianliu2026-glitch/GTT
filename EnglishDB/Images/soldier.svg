<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soldier</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊldʒər] n. 士兵，军人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sol- (单独) + di- (做) + er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵独自站在战场上，"单独做(sol-di-er)"
    <tspan x="50" dy="25">着保卫国家的任务，他就是一名士兵(soldier)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldier bravely fought in the battle.
  </text>
  <text x="50" y="310" class="content">
    这名士兵在战斗中勇敢作战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <circle cx="20" cy="100" r="15" class="image" /> <!-- Head -->
    <line x1="20" y1="115" x2="20" y2="150" class="image" /> <!-- Body -->
    <line x1="20" y1="150" x2="0" y2="180" class="image" /> <!-- Left leg -->
    <line x1="20" y1="150" x2="40" y2="180" class="image" /> <!-- Right leg -->
    <line x1="20" y1="130" x2="50" y2="120" class="image" /> <!-- Right arm -->
    <line x1="20" y1="130" x2="0" y2="120" class="image" /> <!-- Left arm -->
    <!-- Gun -->
    <line x1="50" y1="120" x2="70" y2="120" class="image" />
    <line x1="70" y1="120" x2="70" y2="100" class="image" />
    <!-- Helmet -->
    <path d="M10,90 Q20,80 30,90" class="image" />
  </g>
</svg>