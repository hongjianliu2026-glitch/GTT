<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #641E16; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #922B21; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crunchy</text>
  <text x="50" y="120" class="subtitle">[ˈkrʌntʃi] adj. 松脆的，易碎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crunch (嘎吱声) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你咬下一口松脆的饼干，发出"嘎吱嘎吱(crunch)"的声音，
    <tspan x="50" dy="25">这种感觉就是crunchy。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cereal was crunchy and delicious.
  </text>
  <text x="50" y="310" class="content">
    这种麦片又松脆又好吃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crunchy biscuit -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="50" class="image" />
    <line x1="60" y1="30" x2="140" y2="30" class="image" />
    <line x1="60" y1="40" x2="140" y2="40" class="image" />
    <line x1="60" y1="50" x2="140" y2="50" class="image" />
    <!-- Crunch sound -->
    <text x="200" y="60" class="content" style="font-size: 36px;">🎵</text>
    <text x="220" y="60" class="content" style="font-size: 36px;">🎵</text>
    <text x="240" y="60" class="content" style="font-size: 36px;">🎵</text>
  </g>
</svg>