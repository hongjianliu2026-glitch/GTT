<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crashing</text>
  <text x="50" y="120" class="subtitle">[ˈkræʃɪŋ] v. 崩溃，撞击；adj. 猛烈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crash (撞击) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆失控的汽车"猛烈撞击(crash)"到墙上，发出巨大的声响，这就是"崩溃(crashing)"的画面。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The computer started crashing after I installed the new software.
  </text>
  <text x="50" y="310" class="content">
    在我安装了新软件后，电脑开始崩溃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car -->
    <rect x="0" y="0" width="150" height="70" class="image" />
    <rect x="10" y="10" width="130" height="50" class="image" />
    <circle cx="30" cy="80" r="20" class="image" />
    <circle cx="120" cy="80" r="20" class="image" />
    <!-- Wall -->
    <rect x="160" y="0" width="20" height="100" class="image" />
    <!-- Impact -->
    <line x1="150" y1="35" x2="160" y2="35" class="image" />
    <line x1="150" y1="45" x2="160" y2="45" class="image" />
    <line x1="150" y1="55" x2="160" y2="55" class="image" />
  </g>
</svg>