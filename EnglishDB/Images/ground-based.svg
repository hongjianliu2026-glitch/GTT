<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ground-based</text>
  <text x="50" y="120" class="subtitle">[ˈɡraʊndˌbeɪst] adj. 基于地面的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ground (地面) + based (基于)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的雷达站在地面上，"基于地面(ground-based)"
    <tspan x="50" dy="25">发射出强大的信号，监视着天空中的每一个角落。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ground-based radar system detected the incoming missile.
  </text>
  <text x="50" y="310" class="content">
    基于地面的雷达系统探测到了来袭的导弹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Radar -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <circle cx="175" cy="50" r="25" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <!-- Signal lines -->
    <line x1="175" y1="50" x2="100" y2="0" class="image" />
    <line x1="175" y1="50" x2="250" y2="0" class="image" />
    <line x1="175" y1="50" x2="50" y2="0" class="image" />
    <line x1="175" y1="50" x2="300" y2="0" class="image" />
  </g>
</svg>