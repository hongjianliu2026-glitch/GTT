<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">greet</text>
  <text x="50" y="120" class="subtitle">[ɡriːt] v. 问候，迎接</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> greet (来自古英语 grētan，意为“问候”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在门口，微笑着伸出双臂，
    <tspan x="50" dy="25">热情地“迎接(greet)”客人，这种温暖的问候让人感到宾至如归。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She greeted her guests with a warm smile.
  </text>
  <text x="50" y="310" class="content">
    她用温暖的微笑迎接客人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Person -->
    <circle cx="80" cy="100" r="20" class="image" />
    <line x1="80" y1="120" x2="80" y2="160" class="image" />
    <line x1="80" y1="160" x2="60" y2="190" class="image" />
    <line x1="80" y1="160" x2="100" y2="190" class="image" />
    <line x1="80" y1="140" x2="120" y2="130" class="image" />
    <line x1="80" y1="140" x2="40" y2="130" class="image" />
    <!-- Smile -->
    <path d="M70 90 Q80 85 90 90" class="image" />
  </g>
</svg>