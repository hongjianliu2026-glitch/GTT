<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mosque</text>
  <text x="50" y="120" class="subtitle">[mɒsk] n. 清真寺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mos- (源自阿拉伯语 masjid，意为“跪拜的地方”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群信徒在清真寺(mosque)里，"跪拜(mos-)"
    <tspan x="50" dy="25">祈祷，这个地方就是他们心灵的归宿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mosque was filled with worshippers during Friday prayers.
  </text>
  <text x="50" y="310" class="content">
    周五祈祷时，清真寺里挤满了信徒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mosque -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dome -->
    <ellipse cx="175" cy="50" rx="100" ry="30" class="image" />
    <!-- Minaret -->
    <rect x="250" y="0" width="20" height="150" class="image" />
    <!-- Prayer area -->
    <rect x="50" y="100" width="250" height="80" class="image" />
    <!-- Worshippers -->
    <circle cx="80" cy="140" r="10" class="image" />
    <circle cx="120" cy="140" r="10" class="image" />
    <circle cx="160" cy="140" r="10" class="image" />
    <circle cx="200" cy="140" r="10" class="image" />
    <circle cx="240" cy="140" r="10" class="image" />
  </g>
</svg>