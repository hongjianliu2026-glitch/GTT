<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shackle</text>
  <text x="50" y="120" class="subtitle">[ˈʃækl] n. 镣铐，束缚；v. 束缚，限制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shack (束缚) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被"小束缚(shack-le)"的人，
    <tspan x="50" dy="25">他的手脚被镣铐紧紧锁住，无法自由行动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chains shackled his wrists and ankles.
  </text>
  <text x="50" y="310" class="content">
    链条束缚住了他的手腕和脚踝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shackles -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="130" y1="100" x2="220" y2="100" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Ankle shackles -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="300" y2="120" class="image" />
  </g>
</svg>