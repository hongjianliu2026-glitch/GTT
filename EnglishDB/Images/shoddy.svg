<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shoddy</text>
  <text x="50" y="120" class="subtitle">[ˈʃɒdi] adj. 劣质的，假冒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shod (鞋) + -dy (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一双"鞋(shod)"，但它们是用"劣质(dy)"材料制成的，
    <tspan x="50" dy="25">走几步就破了，这就是"劣质的(shoddy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shoddy workmanship was evident in the broken handle.
  </text>
  <text x="50" y="310" class="content">
    劣质的做工在断裂的把手上显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shoe -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="10" y="10" width="130" height="80" class="image" />
    <!-- Broken parts -->
    <line x1="20" y1="20" x2="130" y2="90" class="image" />
    <line x1="20" y1="90" x2="130" y2="20" class="image" />
    <!-- Label -->
    <text x="160" y="50" class="content">劣质鞋</text>
  </g>
</svg>