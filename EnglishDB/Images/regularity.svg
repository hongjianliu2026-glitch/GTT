<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">regularity</text>
  <text x="50" y="120" class="subtitle">[ˌreɡjəˈlærəti] n. 规律性，规则性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> reg (统治) + ular (形容词后缀) + ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个统治者(reg)用尺子(ruler)在纸上画出一条条直线，
    <tspan x="50" dy="25">这些直线排列得非常整齐，形成了规律性(regularity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The regularity of his jogging routine impressed everyone.
  </text>
  <text x="50" y="310" class="content">
    他跑步的规律性让每个人都印象深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ruler -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <line x1="20" y1="10" x2="330" y2="10" class="image" />
    <line x1="20" y1="20" x2="330" y2="20" class="image" />
    <line x1="20" y1="30" x2="330" y2="30" class="image" />
    <line x1="20" y1="40" x2="330" y2="40" class="image" />
    <!-- Lines on paper -->
    <rect x="50" y="70" width="250" height="160" class="image" />
    <line x1="70" y1="90" x2="280" y2="90" class="image" />
    <line x1="70" y1="120" x2="280" y2="120" class="image" />
    <line x1="70" y1="150" x2="280" y2="150" class="image" />
    <line x1="70" y1="180" x2="280" y2="180" class="image" />
  </g>
</svg>