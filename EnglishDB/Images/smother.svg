<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smother</text>
  <text x="50" y="120" class="subtitle">[ˈsmʌðər] v. 窒息，闷死；抑制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sm- (烟雾) + other (覆盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被浓烟"覆盖(sm-other)"，无法呼吸，
    <tspan x="50" dy="25">最终窒息而死。这个画面让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smoke from the fire almost smothered us.
  </text>
  <text x="50" y="310" class="content">
    火灾的烟雾几乎让我们窒息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Smoke cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <ellipse cx="175" cy="120" rx="130" ry="60" class="image" />
    <ellipse cx="175" cy="140" rx="110" ry="50" class="image" />
    <!-- Person -->
    <circle cx="175" cy="160" r="20" class="image" />
    <line x1="175" y1="180" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="155" y2="250" class="image" />
    <line x1="175" y1="220" x2="195" y2="250" class="image" />
    <line x1="175" y1="200" x2="145" y2="190" class="image" />
    <line x1="175" y1="200" x2="205" y2="190" class="image" />
  </g>
</svg>