<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shimmering</text>
  <text x="50" y="120" class="subtitle">[ˈʃɪmərɪŋ] adj. 闪烁的，微微发光的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shim (闪烁) + -er (表反复动作) + -ing (表状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片湖面在阳光下"闪烁(shim)"，
    <tspan x="50" dy="25">微光不断"反复(er)"，形成"闪烁的(ing)"景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lake was shimmering under the moonlight.
  </text>
  <text x="50" y="310" class="content">
    湖面在月光下闪烁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" fill="#FFD700" />
    <!-- Shimmering effect -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" stroke-dasharray="10,5" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" stroke-dasharray="10,5" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" stroke-dasharray="10,5" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" stroke-dasharray="10,5" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" stroke-dasharray="10,5" />
  </g>
</svg>