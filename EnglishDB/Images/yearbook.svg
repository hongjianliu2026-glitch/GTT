<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yearbook</text>
  <text x="50" y="120" class="subtitle">[ˈjɪrbʊk] n. 年鉴，年刊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> year (年) + book (书)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本厚厚的书，封面写着"2023年"，
    <tspan x="50" dy="25">里面记录了这一年的所有重要事件和回忆，</tspan>
    <tspan x="50" dy="25">这就是年鉴(yearbook)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The school's yearbook is a cherished keepsake for many alumni.
  </text>
  <text x="50" y="310" class="content">
    学校的年鉴是许多校友珍爱的纪念品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Book cover -->
    <rect x="0" y="0" width="300" height="400" class="image" />
    <!-- Year label -->
    <text x="150" y="50" text-anchor="middle" class="title">2023</text>
    <!-- Pages -->
    <line x1="20" y1="80" x2="280" y2="80" class="image" />
    <line x1="20" y1="120" x2="280" y2="120" class="image" />
    <line x1="20" y1="160" x2="280" y2="160" class="image" />
    <line x1="20" y1="200" x2="280" y2="200" class="image" />
    <line x1="20" y1="240" x2="280" y2="240" class="image" />
    <line x1="20" y1="280" x2="280" y2="280" class="image" />
    <line x1="20" y1="320" x2="280" y2="320" class="image" />
    <line x1="20" y1="360" x2="280" y2="360" class="image" />
  </g>
</svg>