<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cross-legged</text>
  <text x="50" y="120" class="subtitle">[ˈkrɔːsˌlɛɡd] adj. 盘腿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cross (交叉) + leg (腿) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在地上，双腿"交叉(cross)"，
    <tspan x="50" dy="25">形成一个"盘腿(legged)"的姿势，这就是cross-legged。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He sat cross-legged on the floor, meditating.
  </text>
  <text x="50" y="310" class="content">
    他盘腿坐在地板上，冥想。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person sitting cross-legged -->
    <circle cx="100" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="100" y1="120" x2="100" y2="160" class="image" /> <!-- Body -->
    <line x1="100" y1="160" x2="80" y2="200" class="image" /> <!-- Left leg -->
    <line x1="100" y1="160" x2="120" y2="200" class="image" /> <!-- Right leg -->
    <line x1="80" y1="200" x2="120" y2="200" class="image" /> <!-- Crossed legs -->
  </g>
</svg>