<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nave</text>
  <text x="50" y="120" class="subtitle">[neɪv] n. 教堂的中殿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nav- (船)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的教堂中殿，形状像一艘船的船舱，
    <tspan x="50" dy="25">人们在其中祈祷，仿佛在船上航行，寻找心灵的港湾。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nave of the cathedral was filled with worshippers.
  </text>
  <text x="50" y="310" class="content">
    大教堂的中殿挤满了信徒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church nave -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Church roof -->
    <polygon points="50,20 300,20 275,50 75,50" class="image" />
    <!-- Church columns -->
    <line x1="75" y1="50" x2="75" y2="200" class="image" />
    <line x1="275" y1="50" x2="275" y2="200" class="image" />
    <!-- Church pews -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="130" x2="250" y2="130" class="image" />
    <line x1="100" y1="160" x2="250" y2="160" class="image" />
    <!-- Worshippers -->
    <circle cx="120" cy="115" r="10" class="image" />
    <circle cx="180" cy="115" r="10" class="image" />
    <circle cx="240" cy="115" r="10" class="image" />
  </g>
</svg>