<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">silken</text>
  <text x="50" y="120" class="subtitle">[ˈsɪlkən] adj. 丝的，柔软光滑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> silk (丝) + -en (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条柔软光滑的丝巾，轻轻地滑过你的脸颊，
    <tspan x="50" dy="25">那种触感就像丝绸(silk)一样，让人感到无比舒适。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a silken dress to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件丝绸礼服去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Silk scarf -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" />
    <path d="M50 70 Q100 100 150 70 T250 70" class="image" />
    <path d="M50 90 Q100 120 150 90 T250 90" class="image" />
    <!-- Face -->
    <circle cx="150" cy="150" r="50" class="image" />
    <!-- Cheek -->
    <circle cx="120" cy="170" r="10" class="image" />
    <circle cx="180" cy="170" r="10" class="image" />
  </g>
</svg>