<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disobey</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈbeɪ] v. 不服从，违抗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + obey (服从)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在公园里，"不(dis-)"
    <tspan x="50" dy="25">听从(obey)父母的指令，跑向了危险的地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child disobeyed his parents and climbed the tree.
  </text>
  <text x="50" y="310" class="content">
    孩子不听父母的话，爬上了树。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Tree -->
    <rect x="150" y="20" width="50" height="180" class="image" />
    <line x1="175" y1="20" x2="150" y2="0" class="image" />
    <line x1="175" y1="20" x2="200" y2="0" class="image" />
    <line x1="175" y1="20" x2="200" y2="20" class="image" />
    <line x1="175" y1="20" x2="150" y2="20" class="image" />
    <!-- Danger sign -->
    <rect x="250" y="100" width="50" height="50" class="image" />
    <line x1="275" y1="100" x2="275" y2="150" class="image" />
    <line x1="275" y1="125" x2="250" y2="125" class="image" />
    <line x1="275" y1="125" x2="300" y2="125" class="image" />
  </g>
</svg>