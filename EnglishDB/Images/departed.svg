<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">departed</text>
  <text x="50" y="120" class="subtitle">[dɪˈpɑːrtɪd] adj. 已离开的，已故的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + part (分开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从我们身边"离开(de-part)"，
    <tspan x="50" dy="25">他/她已经"分开(part)"了我们，成为了"已离开的(departed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The departed soul will always be remembered.
  </text>
  <text x="50" y="310" class="content">
    已故的灵魂将永远被铭记。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Departed person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Departure path -->
    <line x1="50" y1="220" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <!-- Departure symbol -->
    <polyline points="250,100 280,130 250,160" class="image" />
  </g>
</svg>