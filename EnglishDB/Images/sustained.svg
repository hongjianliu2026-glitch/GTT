<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sustained</text>
  <text x="50" y="120" class="subtitle">[səˈsteɪnd] adj. 持续的，持久的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sus- (在下面) + tan (保持)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的弹簧上，"在下面保持(sus-tan)"
    <tspan x="50" dy="25">平衡，这个弹簧持续不断地支撑着他，这就是sustained(持续的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has achieved sustained growth over the past decade.
  </text>
  <text x="50" y="310" class="content">
    公司在过去十年中实现了持续增长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spring -->
    <path d="M50 200 Q100 100 150 200 Q200 300 250 200 Q300 100 350 200" class="image" />
    <!-- Person -->
    <circle cx="200" cy="180" r="20" class="image" />
    <line x1="200" y1="200" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="180" y2="280" class="image" />
    <line x1="200" y1="250" x2="220" y2="280" class="image" />
    <line x1="200" y1="220" x2="230" y2="210" class="image" />
  </g>
</svg>