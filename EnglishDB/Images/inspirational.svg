<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inspirational</text>
  <text x="50" y="120" class="subtitle">[ˌɪnspəˈreɪʃənl] adj. 鼓舞人心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + spir (呼吸) + -ation (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人深吸一口气，"吸入(in-spir)"
    <tspan x="50" dy="25">灵感，这种灵感让人充满力量和动力，</tspan>
    <tspan x="50" dy="25">这就是鼓舞人心的(inspirational)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her speech was truly inspirational.
  </text>
  <text x="50" y="310" class="content">
    她的演讲真是鼓舞人心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Inspirational figure -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Light bulb -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="180" y1="150" x2="220" y2="150" class="image" />
    <!-- Inspirational rays -->
    <line x1="200" y1="80" x2="150" y2="50" class="image" />
    <line x1="200" y1="80" x2="250" y2="50" class="image" />
    <line x1="200" y1="80" x2="175" y2="20" class="image" />
    <line x1="200" y1="80" x2="225" y2="20" class="image" />
  </g>
</svg>