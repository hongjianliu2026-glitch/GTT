<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eloquent</text>
  <text x="50" y="120" class="subtitle">[ˈɛləkwənt] adj. 雄辩的，有口才的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + loqu (说) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者站在讲台上，"说出(loqu)"
    <tspan x="50" dy="25">的话语如同泉水般涌出(e-)，令人信服且印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His eloquent speech moved the audience to tears.
  </text>
  <text x="50" y="310" class="content">
    他雄辩的演讲感动了观众，令他们落泪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <line x1="175" y1="140" x2="130" y2="130" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M200,80 Q250,80 250,100 Q250,120 200,120 Q150,120 150,100 Q150,80 200,80" class="image" />
    <text x="175" y="105" text-anchor="middle" class="content">Eloquent</text>
  </g>
</svg>