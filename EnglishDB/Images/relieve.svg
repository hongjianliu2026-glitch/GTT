<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relieve</text>
  <text x="50" y="120" class="subtitle">[rɪˈliːv] v. 减轻，解除，救济</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + lieve (轻)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在压力山大时，"再次减轻(re-lieve)"
    <tspan x="50" dy="25">他的负担，让他感到轻松和解脱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The medicine relieved his headache.
  </text>
  <text x="50" y="310" class="content">
    药物减轻了他的头痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with stress -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Relief -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="125" y1="100" x2="125" y2="150" class="image" />
    <line x1="125" y1="150" x2="100" y2="180" class="image" />
    <line x1="125" y1="150" x2="150" y2="180" class="image" />
    <line x1="125" y1="120" x2="100" y2="110" class="image" />
    <line x1="125" y1="120" x2="150" y2="110" class="image" />
    <!-- Arrow -->
    <line x1="80" y1="140" x2="120" y2="140" class="image" />
    <polygon points="120,140 115,135 115,145" class="image" />
  </g>
</svg>