<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intangible</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtændʒəbl] adj. 无形的，难以捉摸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + tang (接触) + -ible (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幽灵，"无法接触(in-tang-ible)"，
    <tspan x="50" dy="25">它飘忽不定，难以捉摸，这就是无形(intangible)的本质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The value of a good reputation is intangible.
  </text>
  <text x="50" y="310" class="content">
    好名声的价值是无形的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ghost -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Fading effect -->
    <line x1="100" y1="100" x2="100" y2="50" class="image" stroke-dasharray="5,5" />
    <line x1="100" y1="50" x2="50" y2="25" class="image" stroke-dasharray="5,5" />
    <line x1="100" y1="50" x2="150" y2="25" class="image" stroke-dasharray="5,5" />
  </g>
</svg>