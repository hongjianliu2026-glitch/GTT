<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fret</text>
  <text x="50" y="120" class="subtitle">[frɛt] v. 焦虑，烦躁；n. 琴弦上的格子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frict (摩擦) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为焦虑而不断"摩擦(frict)"自己的头发，
    <tspan x="50" dy="25">结果头发都快被磨光了，这就是"烦躁(fret)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She fretted over the upcoming exam.
  </text>
  <text x="50" y="310" class="content">
    她为即将到来的考试感到焦虑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Hair -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="60" y1="40" x2="140" y2="40" class="image" />
    <line x1="70" y1="30" x2="130" y2="30" class="image" />
    <!-- Fretting hands -->
    <line x1="80" y1="120" x2="80" y2="150" class="image" />
    <line x1="120" y1="120" x2="120" y2="150" class="image" />
    <!-- Fretting motion -->
    <line x1="80" y1="150" x2="120" y2="150" class="image" />
    <line x1="80" y1="160" x2="120" y2="160" class="image" />
    <line x1="80" y1="170" x2="120" y2="170" class="image" />
  </g>
</svg>