<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">collie</text>
  <text x="50" y="120" class="subtitle">[ˈkɒli] n. 柯利牧羊犬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> collie (源自苏格兰语，意为“牧羊犬”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只柯利牧羊犬在苏格兰的草原上，"守护着(collie)"
    <tspan x="50" dy="25">一群羊，它的聪明和忠诚让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The collie was known for its herding skills.
  </text>
  <text x="50" y="310" class="content">
    这只柯利牧羊犬以其放牧技能而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog outline -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="200" class="image" />
    <line x1="100" y1="180" x2="150" y2="200" class="image" />
    <!-- Sheep -->
    <circle cx="200" cy="150" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <circle cx="300" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="200" class="image" />
    <line x1="250" y1="170" x2="250" y2="200" class="image" />
    <line x1="300" y1="170" x2="300" y2="200" class="image" />
  </g>
</svg>