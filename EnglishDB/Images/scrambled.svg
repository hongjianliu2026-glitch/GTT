<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scrambled</text>
  <text x="50" y="120" class="subtitle">[ˈskræmbəld] v. 搅乱，打乱；adj. 混乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scram (滑) + -ble (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"反复滑动(scram-ble)"
    <tspan x="50" dy="25">鸡蛋，结果鸡蛋变得一团糟，这就是scrambled eggs。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thief scrambled the files on the computer.
  </text>
  <text x="50" y="310" class="content">
    小偷搅乱了电脑上的文件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kitchen counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Eggshells -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="80" cy="50" r="15" class="image" />
    <!-- Scrambled eggs -->
    <path d="M120 50 Q150 20, 180 50 T240 50" class="image" />
    <path d="M120 70 Q150 40, 180 70 T240 70" class="image" />
    <path d="M120 90 Q150 60, 180 90 T240 90" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>