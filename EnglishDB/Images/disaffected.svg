<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disaffected</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈfektɪd] adj. 不满的，叛逆的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + affect (影响)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个叛逆的少年，"不受影响(dis-affect)"
    <tspan x="50" dy="25">地站在人群中，脸上写满了不满(disaffected)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The disaffected youth protested against the government.
  </text>
  <text x="50" y="310" class="content">
    不满的年轻人抗议政府。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Disaffected youth -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Unhappy face -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="35" y1="110" x2="65" y2="110" class="image" />
    <!-- Crowd -->
    <rect x="100" y="100" width="200" height="100" class="image" />
    <line x1="120" y1="120" x2="280" y2="120" class="image" />
    <line x1="120" y1="140" x2="280" y2="140" class="image" />
    <line x1="120" y1="160" x2="280" y2="160" class="image" />
  </g>
</svg>