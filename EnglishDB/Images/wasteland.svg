<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E9E2; }
      .title { font: bold 48px sans-serif; fill: #A84300; }
      .subtitle { font: italic 24px serif; fill: #5C3D2E; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wasteland</text>
  <text x="50" y="120" class="subtitle">[ˈweɪstlænd] n. 荒地，废墟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wast (浪费) + land (土地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片被"浪费(wast)"的土地，
    <tspan x="50" dy="25">变成了荒芜的"荒地(wasteland)"，</tspan>
    <tspan x="50" dy="25">到处是废弃的建筑物和枯萎的植物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The once-thriving city had become a wasteland after the war.
  </text>
  <text x="50" y="310" class="content">
    这座曾经繁华的城市在战争后变成了废墟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wasteland -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Abandoned building -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="120" class="image" />
    <line x1="150" y1="20" x2="150" y2="120" class="image" />
    <!-- Dead tree -->
    <line x1="250" y1="20" x2="250" y2="120" class="image" />
    <line x1="250" y1="20" x2="230" y2="50" class="image" />
    <line x1="250" y1="20" x2="270" y2="50" class="image" />
    <line x1="250" y1="20" x2="240" y2="30" class="image" />
    <line x1="250" y1="20" x2="260" y2="30" class="image" />
  </g>
</svg>