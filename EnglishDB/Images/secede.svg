<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">secede</text>
  <text x="50" y="120" class="subtitle">[sɪˈsiːd] v. 脱离，退出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + cede (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人从一个大团体中"分开走(se-cede)"，
    <tspan x="50" dy="25">他们决定脱离并形成自己的小团体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The region voted to secede from the country.
  </text>
  <text x="50" y="310" class="content">
    该地区投票决定脱离国家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large group -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <circle cx="300" cy="100" r="30" class="image" />

    <!-- Small group -->
    <circle cx="50" cy="200" r="20" class="image" />
    <circle cx="100" cy="200" r="20" class="image" />
    <circle cx="150" cy="200" r="20" class="image" />

    <!-- Arrows -->
    <line x1="80" y1="130" x2="80" y2="180" class="image" />
    <line x1="130" y1="130" x2="130" y2="180" class="image" />
    <line x1="180" y1="130" x2="180" y2="180" class="image" />
    <line x1="230" y1="130" x2="230" y2="180" class="image" />
    <line x1="280" y1="130" x2="280" y2="180" class="image" />

    <!-- Labels -->
    <text x="50" y="250" class="content">Large Group</text>
    <text x="50" y="300" class="content">Small Group</text>
  </g>
</svg>