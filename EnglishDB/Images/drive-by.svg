<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drive-by</text>
  <text x="50" y="120" class="subtitle">[ˈdraɪv baɪ] adj. 开车经过的，顺便的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drive (驾驶) + by (经过)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车快速"驾驶经过(drive-by)"，
    <tspan x="50" dy="25">车上的人只是顺便看了一眼，没有停留。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made a drive-by visit to the store.
  </text>
  <text x="50" y="310" class="content">
    他开车经过商店，顺便进去了一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <rect x="20" y="20" width="310" height="60" class="image" />
    <circle cx="50" cy="80" r="15" class="image" />
    <circle cx="300" cy="80" r="15" class="image" />
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="110" x2="350" y2="110" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Store -->
    <rect x="150" y="130" width="50" height="50" class="image" />
    <text x="160" y="160" class="content">Store</text>
  </g>
</svg>