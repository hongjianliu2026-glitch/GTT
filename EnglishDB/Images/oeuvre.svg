<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oeuvre</text>
  <text x="50" y="120" class="subtitle">[ˈwɛr] n. 作品，全部作品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oeuvre (源自法语，意为“工作”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位艺术家，他的一生都在“工作(oeuvre)”中度过，
    <tspan x="50" dy="25">创作出无数作品，这些作品汇聚成他的全部作品(oeuvre)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The museum showcased the artist's complete oeuvre.
  </text>
  <text x="50" y="310" class="content">
    博物馆展出了这位艺术家的全部作品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Paintings -->
    <rect x="50" y="20" width="100" height="150" class="image" />
    <rect x="160" y="20" width="100" height="150" class="image" />
    <rect x="270" y="20" width="100" height="150" class="image" />
    <!-- Brushes -->
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <line x1="50" y1="180" x2="75" y2="200" class="image" />
    <line x1="160" y1="180" x2="210" y2="180" class="image" />
    <line x1="160" y1="180" x2="185" y2="200" class="image" />
    <line x1="270" y1="180" x2="320" y2="180" class="image" />
    <line x1="270" y1="180" x2="295" y2="200" class="image" />
  </g>
</svg>