<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comment</text>
  <text x="50" y="120" class="subtitle">[ˈkɒment] n. 评论，意见；v. 评论，发表意见</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + ment (思考)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在讨论，"共同思考(com-ment)"
    <tspan x="50" dy="25">并发表意见，这些意见就构成了评论(comment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She often comments on social media.
  </text>
  <text x="50" y="310" class="content">
    她经常在社交媒体上发表评论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Speech bubble -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image" />
    <path d="M250,50 Q280,70 250,90" class="image" />
    <!-- Text inside speech bubble -->
    <text x="70" y="70" class="content">Comment</text>
    <!-- People -->
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <!-- Lines connecting people -->
    <line x1="50" y1="165" x2="100" y2="165" class="image" />
    <line x1="100" y1="165" x2="150" y2="165" class="image" />
  </g>
</svg>