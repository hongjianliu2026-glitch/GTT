<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">linguist</text>
  <text x="50" y="120" class="subtitle">[ˈlɪŋɡwɪst] n. 语言学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lingu (语言) + -ist (从事...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个语言学家(linguist)，他/她就像一个"语言的魔法师"，
    <tspan x="50" dy="25">能够理解和掌握多种语言，就像在语言的海洋中自由游弋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The linguist was fascinated by the ancient texts.
  </text>
  <text x="50" y="310" class="content">
    这位语言学家对古代文献非常着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Body -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <!-- Arms -->
    <line x1="50" y1="100" x2="20" y2="130" class="image" />
    <line x1="50" y1="100" x2="80" y2="130" class="image" />
    <!-- Legs -->
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <!-- Books -->
    <rect x="100" y="20" width="100" height="160" class="image" />
    <rect x="110" y="30" width="80" height="140" class="image" />
    <rect x="120" y="40" width="60" height="120" class="image" />
    <!-- Speech bubble -->
    <path d="M220,50 Q250,20 280,50 Q250,80 220,50" class="image" />
    <text x="230" y="60" class="content">语言</text>
  </g>
</svg>