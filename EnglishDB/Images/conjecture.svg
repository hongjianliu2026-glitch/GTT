<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conjecture</text>
  <text x="50" y="120" class="subtitle">[kənˈdʒɛktʃər] n. 推测，猜想</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + ject (投掷) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在会议室里，"共同投掷(con-ject)"
    <tspan x="50" dy="25">各种想法，这些想法就像飞镖一样，最终形成了一个推测(conjecture)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientist made a conjecture about the origin of the universe.
  </text>
  <text x="50" y="310" class="content">
    这位科学家对宇宙的起源做出了推测。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Dartboard -->
    <circle cx="250" cy="100" r="50" class="image" />
    <!-- Darts -->
    <line x1="50" y1="70" x2="240" y2="90" class="image" />
    <line x1="100" y1="70" x2="260" y2="110" class="image" />
    <line x1="150" y1="70" x2="250" y2="130" class="image" />
  </g>
</svg>