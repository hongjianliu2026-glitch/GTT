<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thermometer</text>
  <text x="50" y="120" class="subtitle">[θərˈmɒmɪtə(r)] n. 温度计</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thermo- (热) + meter (测量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的温度计，"测量(meter)"
    <tspan x="50" dy="25">整个城市的热度(thermo)，温度计的红色液体</tspan>
    <tspan x="50" dy="25">随着温度上升而飙升，仿佛要喷发出来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thermometer showed 38°C in the shade.
  </text>
  <text x="50" y="310" class="content">
    温度计显示在阴凉处有38°C。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thermometer -->
    <rect x="0" y="0" width="50" height="200" class="image" />
    <!-- Red liquid -->
    <rect x="10" y="10" width="30" height="190" class="image" fill="#E74C3C" />
    <!-- Bulb -->
    <circle cx="25" cy="210" r="20" class="image" fill="#E74C3C" />
    <!-- Temperature mark -->
    <line x1="55" y1="10" x2="65" y2="10" class="image" />
    <line x1="55" y1="50" x2="65" y2="50" class="image" />
    <line x1="55" y1="100" x2="65" y2="100" class="image" />
    <line x1="55" y1="150" x2="65" y2="150" class="image" />
    <line x1="55" y1="190" x2="65" y2="190" class="image" />
    <!-- Temperature text -->
    <text x="70" y="15" class="content">0°C</text>
    <text x="70" y="55" class="content">10°C</text>
    <text x="70" y="105" class="content">20°C</text>
    <text x="70" y="155" class="content">30°C</text>
    <text x="70" y="195" class="content">40°C</text>
  </g>
</svg>