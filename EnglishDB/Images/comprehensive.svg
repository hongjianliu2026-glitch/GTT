<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comprehensive</text>
  <text x="50" y="120" class="subtitle">[ˌkɒmprɪˈhensɪv] adj. 全面的，综合的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (全部) + prehend (抓住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用双手"抓住(prehend)"
    <tspan x="50" dy="25">所有的知识，这就是"全面的(comprehensive)"学习。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The course offers a comprehensive overview of modern history.
  </text>
  <text x="50" y="310" class="content">
    这门课程提供了现代历史的全面概述。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hands -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <!-- Books -->
    <rect x="70" y="70" width="20" height="60" class="image" />
    <rect x="110" y="70" width="20" height="60" class="image" />
    <rect x="90" y="100" width="20" height="60" class="image" />
  </g>
</svg>