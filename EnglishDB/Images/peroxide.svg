<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peroxide</text>
  <text x="50" y="120" class="subtitle">[pəˈrɒksaɪd] n. 过氧化物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + ox (氧) + ide (化合物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学实验室里，"完全充满(per-)"
    <tspan x="50" dy="25">氧气的(ox)"瓶子，里面装满了"过氧化物(peroxide)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used peroxide to bleach her hair.
  </text>
  <text x="50" y="310" class="content">
    她用过氧化物漂白了她的头发。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flask -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Oxygen symbol -->
    <text x="20" y="100" class="image" font-size="48" fill="#2980B9">O</text>
    <!-- Peroxide symbol -->
    <text x="20" y="150" class="image" font-size="48" fill="#E74C3C">O₂</text>
    <!-- Lab background -->
    <rect x="160" y="0" width="200" height="200" class="image" />
    <!-- Scientist -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>