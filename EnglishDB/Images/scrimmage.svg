<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scrimmage</text>
  <text x="50" y="120" class="subtitle">[ˈskrɪmɪdʒ] n. 混战，混杂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scrim (争斗) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一个混乱的"争斗(scrim)"中，
    <tspan x="50" dy="25">每个人都试图在混战中脱颖而出，这就是"混战(scrimmage)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The players were involved in a scrimmage near the goal.
  </text>
  <text x="50" y="310" class="content">
    球员们在球门附近陷入了一场混战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Players -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="150" cy="80" r="15" class="image" />
    <circle cx="200" cy="110" r="15" class="image" />
    <circle cx="250" cy="90" r="15" class="image" />
    <!-- Lines representing movement -->
    <line x1="50" y1="115" x2="100" y2="135" class="image" />
    <line x1="100" y1="135" x2="150" y2="95" class="image" />
    <line x1="150" y1="95" x2="200" y2="125" class="image" />
    <line x1="200" y1="125" x2="250" y2="105" class="image" />
  </g>
</svg>