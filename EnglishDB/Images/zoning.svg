<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">zoning</text>
  <text x="50" y="120" class="subtitle">[ˈzoʊnɪŋ] n. 分区，区域划分</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> zone (区域) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市被划分成不同的区域，每个区域都有特定的用途，
    <tspan x="50" dy="25">比如住宅区、商业区、工业区等，这就是分区(zoning)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city council approved the new zoning regulations.
  </text>
  <text x="50" y="310" class="content">
    市议会批准了新的分区法规。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Residential zone -->
    <rect x="50" y="20" width="100" height="60" class="image" />
    <text x="90" y="50" class="content">住宅区</text>
    <!-- Commercial zone -->
    <rect x="170" y="20" width="100" height="60" class="image" />
    <text x="210" y="50" class="content">商业区</text>
    <!-- Industrial zone -->
    <rect x="50" y="100" width="100" height="60" class="image" />
    <text x="90" y="130" class="content">工业区</text>
    <!-- Green zone -->
    <rect x="170" y="100" width="100" height="60" class="image" />
    <text x="210" y="130" class="content">绿地</text>
  </g>
</svg>