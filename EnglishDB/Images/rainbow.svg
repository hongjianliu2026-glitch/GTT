<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .rainbow { fill: none; stroke-width: 10; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rainbow</text>
  <text x="50" y="120" class="subtitle">[ˈreɪnboʊ] n. 彩虹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rain (雨) + bow (弓)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场大雨过后，天空出现了一道"弓形(bow)"的
    <tspan x="50" dy="25">"彩虹(rainbow)"，色彩斑斓，美丽无比。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the storm, a beautiful rainbow appeared in the sky.
  </text>
  <text x="50" y="310" class="content">
    暴风雨过后，天空中出现了一道美丽的彩虹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rainbow -->
    <path d="M0 100 A100 100 0 0 1 200 100" class="rainbow" stroke="#FF0000" />
    <path d="M0 110 A90 90 0 0 1 180 110" class="rainbow" stroke="#FF7F00" />
    <path d="M0 120 A80 80 0 0 1 160 120" class="rainbow" stroke="#FFFF00" />
    <path d="M0 130 A70 70 0 0 1 140 130" class="rainbow" stroke="#00FF00" />
    <path d="M0 140 A60 60 0 0 1 120 140" class="rainbow" stroke="#0000FF" />
    <path d="M0 150 A50 50 0 0 1 100 150" class="rainbow" stroke="#4B0082" />
    <path d="M0 160 A40 40 0 0 1 80 160" class="rainbow" stroke="#8B00FF" />
  </g>
</svg>