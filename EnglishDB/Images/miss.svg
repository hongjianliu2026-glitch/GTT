<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">miss</text>
  <text x="50" y="120" class="subtitle">[mɪs] v. 错过，想念；n. 小姐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> miss (送出，错过)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在车站，"送出(miss)"
    <tspan x="50" dy="25">一份礼物给朋友，但朋友已经离开，他错过了(miss)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She missed the train and had to wait for the next one.
  </text>
  <text x="50" y="310" class="content">
    她错过了火车，不得不等下一班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Station -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Train -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <line x1="200" y1="75" x2="300" y2="75" class="image" />
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <!-- Gift -->
    <rect x="100" y="120" width="30" height="20" class="image" />
    <line x1="115" y1="120" x2="115" y2="100" class="image" />
    <line x1="100" y1="110" x2="130" y2="110" class="image" />
  </g>
</svg>