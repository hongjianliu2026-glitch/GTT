<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spousal</text>
  <text x="50" y="120" class="subtitle">[ˈspaʊzl] adj. 配偶的，婚姻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spous (配偶) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一对夫妻在婚礼上，"配偶(spous)"
    <tspan x="50" dy="25">之间的誓言和承诺，构成了他们婚姻(spousal)的基础。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spousal support was agreed upon during the divorce settlement.
  </text>
  <text x="50" y="310" class="content">
    配偶赡养费在离婚协议中达成一致。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wedding rings -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="130" y1="100" x2="170" y2="100" class="image" />
    <!-- Couple -->
    <circle cx="50" cy="150" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="250" y2="170" class="image" />
    <!-- Heart -->
    <path d="M150,200 C130,220 170,220 150,200 Z" class="image" />
  </g>
</svg>