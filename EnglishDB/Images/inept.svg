<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inept</text>
  <text x="50" y="120" class="subtitle">[ɪˈnɛpt] adj. 不熟练的，无能的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + ept (能力)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个笨拙的人试图"不(in-)有能力(ept)"地完成一项任务，
    <tspan x="50" dy="25">结果却搞得一团糟，这就是inept的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His inept handling of the situation led to a disaster.
  </text>
  <text x="50" y="310" class="content">
    他对情况的拙劣处理导致了灾难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clumsy person -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Messy situation -->
    <rect x="100" y="80" width="200" height="100" class="image" />
    <line x1="120" y1="100" x2="280" y2="100" class="image" />
    <line x1="120" y1="120" x2="280" y2="120" class="image" />
    <line x1="120" y1="140" x2="280" y2="140" class="image" />
    <line x1="120" y1="160" x2="280" y2="160" class="image" />
  </g>
</svg>