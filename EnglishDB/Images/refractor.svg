<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">refractor</text>
  <text x="50" y="120" class="subtitle">[rɪˈfræktər] n. 折射器，折光镜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + fract (打破) + -or (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"再次打破(re-fract)"
    <tspan x="50" dy="25">光线的路径，用一个折射器(refractor)来观察光线的变化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The astronomer used a refractor to study the stars.
  </text>
  <text x="50" y="310" class="content">
    天文学家用折射器来研究星星。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Laboratory table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Refractor -->
    <ellipse cx="175" cy="100" rx="50" ry="30" class="image" />
    <!-- Light rays -->
    <line x1="100" y1="50" x2="175" y2="100" class="image" />
    <line x1="175" y1="100" x2="250" y2="50" class="image" />
    <!-- Scientist -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="35" y2="210" class="image" />
    <line x1="50" y1="190" x2="65" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="170" class="image" />
  </g>
</svg>