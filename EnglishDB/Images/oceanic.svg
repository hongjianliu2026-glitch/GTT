<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .wave { fill: #3498DB; }
      .fish { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oceanic</text>
  <text x="50" y="120" class="subtitle">[ˌoʊʃiˈænɪk] adj. 海洋的，海洋性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oceano- (海洋) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的海洋，"海洋(oceano-)"
    <tspan x="50" dy="25">中充满了各种生物和神秘的景象，这就是海洋性的(oceanic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oceanic currents play a crucial role in global climate.
  </text>
  <text x="50" y="310" class="content">
    海洋洋流在全球气候中起着至关重要的作用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean waves -->
    <path d="M0 100 Q100 200 200 100 T400 100 T600 100 T800 100" class="wave" />
    <path d="M0 120 Q100 220 200 120 T400 120 T600 120 T800 120" class="wave" />
    <path d="M0 140 Q100 240 200 140 T400 140 T600 140 T800 140" class="wave" />
    <!-- Fish -->
    <circle cx="150" cy="110" r="15" class="fish" />
    <line x1="150" y1="110" x2="130" y2="100" class="image" />
    <line x1="150" y1="110" x2="130" y2="120" class="image" />
    <line x1="150" y1="110" x2="170" y2="100" class="image" />
    <line x1="150" y1="110" x2="170" y2="120" class="image" />
  </g>
</svg>