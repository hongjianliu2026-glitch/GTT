<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elbow</text>
  <text x="50" y="120" class="subtitle">[ˈɛlboʊ] n. 肘部，弯头；v. 用肘推</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> el (胳膊) + bow (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在拥挤的地铁里，"用胳膊弯曲(el-bow)"
    <tspan x="50" dy="25">的部分推开人群，为自己腾出空间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She elbowed her way through the crowd.
  </text>
  <text x="50" y="310" class="content">
    她用肘部推开人群，挤了过去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Arm -->
    <line x1="50" y1="100" x2="200" y2="100" class="image" />
    <!-- Elbow -->
    <line x1="125" y1="100" x2="125" y2="200" class="image" />
    <!-- Hand -->
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <!-- Crowd -->
    <circle cx="300" cy="150" r="20" class="image" />
    <circle cx="350" cy="150" r="20" class="image" />
    <circle cx="400" cy="150" r="20" class="image" />
    <circle cx="450" cy="150" r="20" class="image" />
  </g>
</svg>