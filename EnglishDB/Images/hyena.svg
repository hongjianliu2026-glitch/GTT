<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hyena</text>
  <text x="50" y="120" class="subtitle">[haɪˈiːnə] n. 鬣狗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hyen- (源自希腊语 hyaina, 意为“鬣狗”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鬣狗(hyena)在非洲草原上，"狂笑(hyena的叫声)"
    <tspan x="50" dy="25">着追逐猎物，它的笑声让人毛骨悚然。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hyena's laugh echoed through the night.
  </text>
  <text x="50" y="310" class="content">
    鬣狗的笑声在夜晚回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hyena body -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <!-- Head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Eyes -->
    <circle cx="85" cy="45" r="5" class="image" />
    <circle cx="115" cy="45" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 70 60 Q 100 80 130 60" class="image" />
    <!-- Legs -->
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <line x1="75" y1="150" x2="75" y2="200" class="image" />
    <line x1="125" y1="150" x2="125" y2="200" class="image" />
    <!-- Tail -->
    <path d="M 180 100 Q 220 80 240 100" class="image" />
  </g>
</svg>