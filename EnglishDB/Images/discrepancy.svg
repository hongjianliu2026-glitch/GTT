<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discrepancy</text>
  <text x="50" y="120" class="subtitle">[dɪˈskrepənsi] n. 差异，不一致</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + crep (破裂) + -ancy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两块原本紧密相连的拼图，突然"分开(dis-)"并"破裂(crep)"，
    <tspan x="50" dy="25">形成了明显的"差异(discrepancy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There was a discrepancy between the two reports.
  </text>
  <text x="50" y="310" class="content">
    两份报告之间存在差异。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First puzzle piece -->
    <path d="M50 50 L150 50 Q200 50 200 100 L200 150 Q200 200 150 200 L50 200 Q0 200 0 150 L0 100 Q0 50 50 50 Z" class="image" />
    <!-- Second puzzle piece -->
    <path d="M250 50 L350 50 Q400 50 400 100 L400 150 Q400 200 350 200 L250 200 Q200 200 200 150 L200 100 Q200 50 250 50 Z" class="image" />
    <!-- Crack between the pieces -->
    <line x1="200" y1="50" x2="200" y2="200" class="image" />
  </g>
</svg>