<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sidekick</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪdˌkɪk] n. 助手，伙伴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> side (旁边) + kick (踢)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个英雄和他的助手，助手总是站在英雄的"旁边(side)"，
    <tspan x="50" dy="25">随时准备"踢(kick)"开障碍，帮助英雄完成任务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was my sidekick during the adventure.
  </text>
  <text x="50" y="310" class="content">
    他在冒险中是我的伙伴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hero -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />

    <!-- Sidekick -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="210" class="image" />
    <line x1="150" y1="170" x2="170" y2="210" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />

    <!-- Connection -->
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
  </g>
</svg>