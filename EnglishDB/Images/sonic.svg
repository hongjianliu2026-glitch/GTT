<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sonic</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊnɪk] adj. 声音的，音速的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> son (声音) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的声波在空中传播，"声音(son)"
    <tspan x="50" dy="25">以超快的速度(sonic)穿越空气，震撼人心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sonic boom from the jet plane was deafening.
  </text>
  <text x="50" y="310" class="content">
    喷气式飞机的音爆震耳欲聋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sound waves -->
    <path d="M0 100 Q50 50, 100 100 T200 100 T300 100 T400 100" class="image" />
    <path d="M0 120 Q50 70, 100 120 T200 120 T300 120 T400 120" class="image" />
    <path d="M0 140 Q50 90, 100 140 T200 140 T300 140 T400 140" class="image" />
    <!-- Sonic speed -->
    <text x="200" y="200" class="content" text-anchor="middle">Sonic Speed</text>
  </g>
</svg>