<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lookout</text>
  <text x="50" y="120" class="subtitle">[ˈlukˌaʊt] n. 瞭望台，警戒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> look (看) + out (向外)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的守望者站在高高的瞭望台上，"向外看(look-out)"
    <tspan x="50" dy="25">以警戒周围的一切，这就是lookout的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lookout spotted a ship on the horizon.
  </text>
  <text x="50" y="310" class="content">
    瞭望员在远处地平线上发现了一艘船。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lookout tower -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Watchman -->
    <circle cx="50" cy="30" r="15" class="image" />
    <line x1="50" y1="45" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="30" y2="110" class="image" />
    <line x1="50" y1="80" x2="70" y2="110" class="image" />
    <line x1="50" y1="60" x2="80" y2="50" class="image" />
    <!-- Horizon -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <circle cx="150" cy="200" r="10" class="image" />
  </g>
</svg>