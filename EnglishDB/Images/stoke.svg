<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stoke</text>
  <text x="50" y="120" class="subtitle">[stoʊk] v. 拨旺（火），激起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stok (木棍)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫用一根木棍(stok)拨动火堆，
    <tspan x="50" dy="25">火苗瞬间窜高，火焰熊熊燃烧，激起了更多的热情(stoke)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He stoked the fire to keep the cabin warm.
  </text>
  <text x="50" y="310" class="content">
    他用木棍拨旺火堆，让小屋保持温暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF6347" />
    <circle cx="120" cy="80" r="30" class="image" fill="#FF7F50" />
    <circle cx="80" cy="80" r="30" class="image" fill="#FF7F50" />
    <circle cx="100" cy="60" r="20" class="image" fill="#FF4500" />
    <!-- Stick -->
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <!-- Farmer -->
    <circle cx="50" cy="150" r="15" class="image" fill="#8B4513" />
    <line x1="50" y1="165" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
  </g>
</svg>