<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">caregiver</text>
  <text x="50" y="120" class="subtitle">[ˈkerˌɡɪvər] n. 照顾者，护理者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> care (照顾) + give (给予) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温柔的照顾者，"给予(give)"
    <tspan x="50" dy="25">无微不至的"照顾(care)"，这就是护理者(caregiver)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a dedicated caregiver for her elderly parents.
  </text>
  <text x="50" y="310" class="content">
    她是一位尽职尽责的老年父母护理者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Caregiver -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="90" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <line x1="50" y1="120" x2="30" y2="150" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="150" class="image" /> <!-- Right leg -->

    <!-- Patient -->
    <circle cx="200" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="200" y1="70" x2="200" y2="120" class="image" /> <!-- Body -->
    <line x1="200" y1="90" x2="180" y2="100" class="image" /> <!-- Left arm -->
    <line x1="200" y1="90" x2="220" y2="100" class="image" /> <!-- Right arm -->
    <line x1="200" y1="120" x2="180" y2="150" class="image" /> <!-- Left leg -->
    <line x1="200" y1="120" x2="220" y2="150" class="image" /> <!-- Right leg -->

    <!-- Heart symbol -->
    <path d="M125,100 C125,50 175,50 175,100 Z" class="image" />
    <line x1="125" y1="100" x2="175" y2="100" class="image" />
  </g>
</svg>