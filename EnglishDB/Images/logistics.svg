<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">logistics</text>
  <text x="50" y="120" class="subtitle">[loʊˈdʒɪstɪks] n. 物流，后勤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> log (词根，表示“说话”或“计算”) + -istics (表示“学科”或“特性”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的仓库，里面堆满了各种货物，工人们正在忙碌地“计算(log)”和“安排(istics)”
    <tspan x="50" dy="25">货物的运输路线，确保每一件货物都能准时到达目的地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's logistics department handles all the shipping and receiving.
  </text>
  <text x="50" y="310" class="content">
    公司的物流部门负责所有的运输和接收工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warehouse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boxes -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- Workers -->
    <circle cx="70" cy="100" r="15" class="image" />
    <line x1="70" y1="115" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="70" y1="130" x2="100" y2="120" class="image" />
    <circle cx="140" cy="100" r="15" class="image" />
    <line x1="140" y1="115" x2="140" y2="150" class="image" />
    <line x1="140" y1="150" x2="120" y2="180" class="image" />
    <line x1="140" y1="150" x2="160" y2="180" class="image" />
    <line x1="140" y1="130" x2="170" y2="120" class="image" />
  </g>
</svg>