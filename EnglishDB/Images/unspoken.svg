<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unspoken</text>
  <text x="50" y="120" class="subtitle">[ʌnˈspoʊkən] adj. 未说出口的，未表达的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + spoken (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，心中有千言万语，却"未说出口(un-spoken)"，
    <tspan x="50" dy="25">他们的眼神和沉默传达了所有的情感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unspoken agreement between them was clear.
  </text>
  <text x="50" y="310" class="content">
    他们之间未说出口的协议很清楚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Mouths covered with lines -->
    <line x1="40" y1="120" x2="60" y2="120" class="image" />
    <line x1="190" y1="120" x2="210" y2="120" class="image" />
    <!-- Eyes -->
    <circle cx="45" cy="90" r="3" class="image" />
    <circle cx="55" cy="90" r="3" class="image" />
    <circle cx="195" cy="90" r="3" class="image" />
    <circle cx="205" cy="90" r="3" class="image" />
    <!-- Connection between them -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="110" x2="150" y2="110" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
  </g>
</svg>