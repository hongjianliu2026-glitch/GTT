<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inflammation</text>
  <text x="50" y="120" class="subtitle">[ˌɪnfləˈmeɪʃn] n. 炎症，发炎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flamm (火焰) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你的身体内部突然"进入(in-)"了一团"火焰(flamm)"，
    <tspan x="50" dy="25">这团火焰在你的组织中燃烧，引起了"炎症(inflammation)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor prescribed medication to reduce the inflammation.
  </text>
  <text x="50" y="310" class="content">
    医生开了药来减轻炎症。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body part -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Inflamed area -->
    <circle cx="175" cy="100" r="50" class="image flame" />
    <!-- Flame -->
    <polygon points="150,100 200,100 175,50" class="flame" />
    <polygon points="140,90 210,90 175,40" class="flame" />
    <polygon points="130,80 220,80 175,30" class="flame" />
  </g>
</svg>