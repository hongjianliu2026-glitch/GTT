<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pathetic</text>
  <text x="50" y="120" class="subtitle">[pəˈθetɪk] adj. 可怜的，可悲的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> path (感情) + -etic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个悲伤的小丑，脸上画着夸张的泪水，
    <tspan x="50" dy="25">他的表演让人感到"感情上的(path-etic)"可怜和可悲。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pathetic sight of the homeless man made everyone feel sad.
  </text>
  <text x="50" y="310" class="content">
    那个无家可归的男人的可怜景象让每个人都感到难过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clown face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Nose -->
    <circle cx="100" cy="120" r="15" class="image" />
    <!-- Mouth -->
    <path d="M 60 140 Q 100 180 140 140" class="image" />
    <!-- Tears -->
    <line x1="60" y1="90" x2="40" y2="120" class="image" />
    <line x1="60" y1="100" x2="30" y2="140" class="image" />
    <line x1="140" y1="90" x2="160" y2="120" class="image" />
    <line x1="140" y1="100" x2="170" y2="140" class="image" />
  </g>
</svg>