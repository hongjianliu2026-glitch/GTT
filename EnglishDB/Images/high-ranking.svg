<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">high-ranking</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪˈræŋkɪŋ] adj. 高级别的，高级的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + rank (级别)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个高级别的官员站在高高的讲台上，"高高在上(high)"
    <tspan x="50" dy="25">发表演讲，显示其高级别的地位(high-ranking)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a high-ranking officer in the military.
  </text>
  <text x="50" y="310" class="content">
    他是军队中的高级军官。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- High podium -->
    <rect x="125" y="20" width="100" height="160" class="image" />
    <!-- Officer -->
    <circle cx="175" cy="40" r="15" class="image" />
    <line x1="175" y1="55" x2="175" y2="100" class="image" />
    <line x1="175" y1="70" x2="150" y2="90" class="image" />
    <line x1="175" y1="70" x2="200" y2="90" class="image" />
    <line x1="175" y1="100" x2="150" y2="130" class="image" />
    <line x1="175" y1="100" x2="200" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M200,20 Q250,20 250,50 Q250,80 200,80 Q150,80 150,50 Q150,20 200,20" class="image" />
  </g>
</svg>