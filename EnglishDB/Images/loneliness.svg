<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loneliness</text>
  <text x="50" y="120" class="subtitle">[ˈloʊnlinəs] n. 孤独，寂寞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lone (孤独) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人独自站在荒凉的沙漠中，"孤独(lone)"
    <tspan x="50" dy="25">的感觉像无尽的沙丘一样蔓延，这就是孤独(loneliness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man felt a deep sense of loneliness after his wife passed away.
  </text>
  <text x="50" y="310" class="content">
    老妇人去世后，老人感到深深的孤独。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sand dunes -->
    <line x1="50" y1="20" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="20" class="image" />
    <line x1="150" y1="20" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="20" class="image" />
    <line x1="250" y1="20" x2="300" y2="100" class="image" />
    <!-- Lonely person -->
    <circle cx="175" cy="120" r="15" class="image" />
    <line x1="175" y1="135" x2="175" y2="170" class="image" />
    <line x1="175" y1="170" x2="155" y2="200" class="image" />
    <line x1="175" y1="170" x2="195" y2="200" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
  </g>
</svg>