<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">high-flying</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪ ˈflaɪɪŋ] adj. 高飞的，雄心勃勃的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + flying (飞)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只雄鹰在高空中翱翔，"高高飞翔(high-flying)"，
    <tspan x="50" dy="25">象征着雄心勃勃和远大的志向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a high-flying executive with a bright future.
  </text>
  <text x="50" y="310" class="content">
    他是一位前途光明的雄心勃勃的执行官。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Eagle -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" stroke-width="3" />
    <circle cx="50" cy="50" r="10" class="image" fill="#000" />
    <circle cx="150" cy="50" r="10" class="image" fill="#000" />
    <circle cx="250" cy="50" r="10" class="image" fill="#000" />
    <!-- Sun -->
    <circle cx="300" cy="30" r="20" class="image" fill="#FFD700" />
  </g>
</svg>