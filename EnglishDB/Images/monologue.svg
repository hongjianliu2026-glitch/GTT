<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monologue</text>
  <text x="50" y="120" class="subtitle">[ˈmɒnəlɒɡ] n. 独白</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mono- (单一) + logue (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在舞台上，"独自一人(mono-logue)"
    <tspan x="50" dy="25">对着空气滔滔不绝地说话，这就是独白(monologue)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The actor delivered a powerful monologue in the play.
  </text>
  <text x="50" y="310" class="content">
    演员在剧中发表了一段有力的独白。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actor -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="140" x2="150" y2="160" class="image" />
    <line x1="175" y1="140" x2="200" y2="160" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Speech bubble -->
    <path d="M 175 80 Q 250 80 250 50 Q 250 20 220 20 Q 190 20 175 40 Q 160 20 130 20 Q 100 20 100 50 Q 100 80 175 80" class="image" />
  </g>
</svg>