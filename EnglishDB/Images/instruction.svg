<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">instruction</text>
  <text x="50" y="120" class="subtitle">[ɪnˈstrʌkʃn] n. 指令，指导</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + struct (建造) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老师在教室里，"进入(in-)"
    <tspan x="50" dy="25">学生的思维，"建造(struct)"</tspan>
    <tspan x="50" dy="25">他们的知识结构，这就是指导(instruction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manual provides clear instructions on how to assemble the furniture.
  </text>
  <text x="50" y="310" class="content">
    手册提供了如何组装家具的清晰说明。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teacher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Classroom -->
    <rect x="50" y="20" width="300" height="200" class="image" />
    <!-- Blackboard -->
    <rect x="70" y="40" width="260" height="160" class="image" />
    <!-- Instructions -->
    <line x1="90" y1="70" x2="310" y2="70" class="image" />
    <line x1="90" y1="100" x2="280" y2="100" class="image" />
    <line x1="90" y1="130" x2="300" y2="130" class="image" />
    <line x1="90" y1="160" x2="270" y2="160" class="image" />
  </g>
</svg>