<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nine</text>
  <text x="50" y="120" class="subtitle">[naɪn] n. 九</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *newn, 意为“九”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“9”在天空中旋转，
    <tspan x="50" dy="25">像一个巨大的风车，带来九倍的快乐和能量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are nine planets in our solar system.
  </text>
  <text x="50" y="310" class="content">
    太阳系中有九颗行星。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large number "9" -->
    <path d="M 0 0 L 100 0 L 100 200 L 50 200 L 50 100 L 0 100 Z" class="image" />
    <!-- Windmill effect -->
    <line x1="50" y1="100" x2="200" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="250" class="image" />
    <line x1="50" y1="100" x2="-100" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="-50" class="image" />
    <line x1="50" y1="100" x2="150" y2="200" class="image" />
    <line x1="50" y1="100" x2="150" y2="0" class="image" />
    <line x1="50" y1="100" x2="-50" y2="200" class="image" />
    <line x1="50" y1="100" x2="-50" y2="0" class="image" />
  </g>
</svg>