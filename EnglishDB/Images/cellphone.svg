<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cellphone</text>
  <text x="50" y="120" class="subtitle">[ˈsɛlˌfoʊn] n. 手机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cell (细胞) + phone (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小小的"细胞(cell)"里，传出了"声音(phone)"，
    <tspan x="50" dy="25">这个细胞就是你的手机(cellphone)，随时随地都能通话。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He always keeps his cellphone on silent mode.
  </text>
  <text x="50" y="310" class="content">
    他总是把手机调成静音模式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cellphone outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Screen -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Speaker -->
    <rect x="120" y="10" width="60" height="10" class="image" />
    <!-- Buttons -->
    <circle cx="70" cy="190" r="10" class="image" />
    <circle cx="120" cy="190" r="10" class="image" />
    <circle cx="170" cy="190" r="10" class="image" />
    <circle cx="220" cy="190" r="10" class="image" />
    <circle cx="270" cy="190" r="10" class="image" />
    <!-- Antenna -->
    <line x1="175" y1="0" x2="175" y2="20" class="image" />
  </g>
</svg>