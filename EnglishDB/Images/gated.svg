<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gated</text>
  <text x="50" y="120" class="subtitle">[ɡeɪtɪd] adj. 有门的，受限制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gate (门) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门(gate)，它像巨人一样守护着入口，
    <tspan x="50" dy="25">只有持有特殊钥匙的人才能进入，这就是"有门的(gated)"社区。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gated community has strict security measures.
  </text>
  <text x="50" y="310" class="content">
    这个有门的社区有严格的安全措施。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Keyhole -->
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Key -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="150" class="image" />
    <line x1="230" y1="150" x2="230" y2="130" class="image" />
  </g>
</svg>