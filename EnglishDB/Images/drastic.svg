<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drastic</text>
  <text x="50" y="120" class="subtitle">[ˈdræstɪk] adj. 激烈的，猛烈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drast- (行动) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"猛烈地(drast-ic)"砸向地面，
    <tspan x="50" dy="25">地面瞬间裂开，这种强烈的行动就是drastic的体现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government took drastic measures to control the epidemic.
  </text>
  <text x="50" y="310" class="content">
    政府采取了激烈的措施来控制疫情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Hammer -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <rect x="140" y="50" width="70" height="10" class="image" />
    <!-- Crack in the ground -->
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
  </g>
</svg>