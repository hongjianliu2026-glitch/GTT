<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bumper</text>
  <text x="50" y="120" class="subtitle">[ˈbʌmpər] n. 保险杠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bump (碰撞) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在高速公路上飞驰，突然"砰"(bump)的一声，
    <tspan x="50" dy="25">撞上了前面的车。这时，保险杠(bumper)就起到了保护作用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car's bumper was damaged in the accident.
  </text>
  <text x="50" y="310" class="content">
    这辆车的保险杠在事故中受损了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Bumper -->
    <rect x="50" y="150" width="250" height="20" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="180" r="20" class="image" />
    <circle cx="280" cy="180" r="20" class="image" />
    <!-- Crash effect -->
    <line x1="50" y1="150" x2="0" y2="180" class="image" />
    <line x1="300" y1="150" x2="350" y2="180" class="image" />
  </g>
</svg>