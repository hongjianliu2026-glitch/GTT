<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">solidly</text>
  <text x="50" y="120" class="subtitle">[ˈsɒlɪdli] adv. 坚固地，牢固地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> solid (坚固的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的城堡，"坚固地(solidly)"
    <tspan x="50" dy="25">屹立在风暴中，无论风雨如何猛烈，它都纹丝不动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The foundation of the building is solidly built.
  </text>
  <text x="50" y="310" class="content">
    这座建筑的地基建造得非常牢固。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="70" y="40" width="210" height="120" class="image" />
    <rect x="90" y="60" width="170" height="80" class="image" />
    <!-- Storm clouds -->
    <ellipse cx="200" cy="50" rx="150" ry="30" class="image" />
    <ellipse cx="250" cy="30" rx="100" ry="20" class="image" />
    <ellipse cx="150" cy="30" rx="100" ry="20" class="image" />
    <!-- Lightning -->
    <line x1="100" y1="20" x2="200" y2="180" class="image" />
    <line x1="150" y1="20" x2="250" y2="180" class="image" />
  </g>
</svg>