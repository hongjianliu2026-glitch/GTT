<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eloquence</text>
  <text x="50" y="120" class="subtitle">[ˈɛləkwəns] n. 雄辩，口才</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + loqu (说) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在讲台上，"说出(loqu)"
    <tspan x="50" dy="25">动人的话语，这些话语如泉水般涌出(e-)，</tspan>
    <tspan x="50" dy="25">这就是雄辩(eloquence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her eloquence moved the audience to tears.
  </text>
  <text x="50" y="310" class="content">
    她的雄辩让观众感动得落泪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M 220 80 Q 280 80 280 120 Q 280 160 220 160 Q 160 160 160 120 Q 160 80 220 80 Z" class="image" />
    <text x="225" y="110" class="content" style="font-size: 14px;">"说出动人的话语"</text>
  </g>
</svg>