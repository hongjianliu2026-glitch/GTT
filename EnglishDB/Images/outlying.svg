<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outlying</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtlaɪɪŋ] adj. 偏远的，远离中心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外面) + lying (躺着)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小镇，"躺在外面(out-lying)"，远离城市中心，
    <tspan x="50" dy="25">四周被广阔的田野包围，这就是偏远(outlying)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outlying villages were cut off by the heavy snow.
  </text>
  <text x="50" y="310" class="content">
    大雪切断了偏远村庄的联系。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City center -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <text x="50" y="50" text-anchor="middle" class="content">City</text>
    <!-- Outlying village -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <text x="250" y="75" text-anchor="middle" class="content">Village</text>
    <!-- Path -->
    <line x1="100" y1="50" x2="200" y2="75" class="image" />
    <!-- Fields -->
    <rect x="300" y="0" width="100" height="100" class="image" />
    <text x="350" y="50" text-anchor="middle" class="content">Fields</text>
  </g>
</svg>