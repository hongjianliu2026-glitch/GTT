<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vividly</text>
  <text x="50" y="120" class="subtitle">[ˈvɪvɪdli] adv. 生动地，鲜明地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> viv (生命) + id (形容词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家在画布上"赋予生命(viv)"，
    <tspan x="50" dy="25">他的画作色彩鲜明，栩栩如生，仿佛要从画中跳出来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She described the scene vividly, making it seem real.
  </text>
  <text x="50" y="310" class="content">
    她生动地描述了那个场景，使其显得非常真实。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Paintbrush -->
    <line x1="50" y1="20" x2="100" y2="180" class="image" />
    <line x1="50" y1="20" x2="70" y2="20" class="image" />
    <line x1="70" y1="20" x2="70" y2="40" class="image" />
    <!-- Colors -->
    <circle cx="150" cy="50" r="20" fill="#FF5733" />
    <circle cx="200" cy="50" r="20" fill="#33FF57" />
    <circle cx="250" cy="50" r="20" fill="#3357FF" />
    <!-- Vivid image -->
    <rect x="100" y="100" width="150" height="80" class="image" />
    <circle cx="175" cy="140" r="30" fill="#FFC300" />
    <line x1="150" y1="100" x2="200" y2="180" class="image" />
    <line x1="200" y1="100" x2="150" y2="180" class="image" />
  </g>
</svg>