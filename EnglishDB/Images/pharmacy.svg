<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pharmacy</text>
  <text x="50" y="120" class="subtitle">[ˈfɑːrməsi] n. 药房，药剂学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pharm (药) + -acy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的炼金术士，手持药瓶，"调制药剂(pharm)"，
    <tspan x="50" dy="25">这些药剂最终被存放在一个药房(pharmacy)中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She works at a local pharmacy.
  </text>
  <text x="50" y="310" class="content">
    她在当地的一家药房工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Alchemist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Bottle -->
    <rect x="70" y="80" width="30" height="60" class="image" />
    <line x1="70" y1="80" x2="100" y2="80" class="image" />
    <line x1="70" y1="140" x2="100" y2="140" class="image" />
    <!-- Pharmacy -->
    <rect x="120" y="60" width="150" height="100" class="image" />
    <line x1="120" y1="60" x2="270" y2="60" class="image" />
    <line x1="120" y1="160" x2="270" y2="160" class="image" />
    <line x1="120" y1="60" x2="120" y2="160" class="image" />
    <line x1="270" y1="60" x2="270" y2="160" class="image" />
    <!-- Pills -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="180" cy="100" r="10" class="image" />
    <circle cx="210" cy="100" r="10" class="image" />
  </g>
</svg>