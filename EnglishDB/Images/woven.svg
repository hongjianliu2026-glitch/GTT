<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">woven</text>
  <text x="50" y="120" class="subtitle">[ˈwoʊvən] adj. 编织的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> weave (编织) + -en (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的织布机上，"编织(weave)"
    <tspan x="50" dy="25">的线交织在一起，形成了一块精美的布料(woven fabric)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tapestry was a beautiful piece of woven art.
  </text>
  <text x="50" y="310" class="content">
    这幅挂毯是一件精美的编织艺术品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Loom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Warp threads -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Weft threads -->
    <line x1="50" y1="20" x2="250" y2="20" class="image" />
    <line x1="50" y1="60" x2="250" y2="60" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="50" y1="140" x2="250" y2="140" class="image" />
    <line x1="50" y1="180" x2="250" y2="180" class="image" />
    <!-- Woven fabric -->
    <rect x="70" y="40" width="180" height="120" class="image" />
  </g>
</svg>