<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #FFD700; }
      .rays { stroke: #FFD700; stroke-width: 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brighten</text>
  <text x="50" y="120" class="subtitle">[ˈbraɪtn] v. 使明亮，使愉快</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bright (明亮的) + -en (使动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阴暗的房间里，突然"使明亮(bright-en)"
    <tspan x="50" dy="25">的阳光照进来，整个房间瞬间变得明亮和愉快。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flowers brightened the room.
  </text>
  <text x="50" y="310" class="content">
    这些花使房间变得明亮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Sun rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="rays" />
    <line x1="150" y1="100" x2="200" y2="100" class="rays" />
    <line x1="100" y1="150" x2="100" y2="200" class="rays" />
    <line x1="50" y1="100" x2="0" y2="100" class="rays" />
    <!-- Room -->
    <rect x="0" y="200" width="350" height="150" class="image" />
    <!-- Window -->
    <rect x="150" y="220" width="50" height="50" class="image" />
    <!-- Light rays -->
    <line x1="175" y1="220" x2="175" y2="150" class="rays" />
    <line x1="200" y1="220" x2="200" y2="150" class="rays" />
  </g>
</svg>