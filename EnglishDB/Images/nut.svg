<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nut</text>
  <text x="50" y="120" class="subtitle">[nʌt] n. 坚果，螺母</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nut (坚果)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的坚果(nut)，它不仅是一种美味的零食，
    <tspan x="50" dy="25">还可以是一个坚固的螺母，固定着巨大的机械结构。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cracked open a nut and enjoyed its rich flavor.
  </text>
  <text x="50" y="310" class="content">
    她敲开了一个坚果，享受着它丰富的味道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nut -->
    <circle cx="100" cy="100" r="50" class="image" fill="#D35400" />
    <!-- Nut cracker -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" stroke-width="10" stroke="#2C3E50" />
    <!-- Nut shell -->
    <path d="M 100 50 A 50 50 0 0 1 100 150 Z" class="image" fill="#8E44AD" />
  </g>
</svg>