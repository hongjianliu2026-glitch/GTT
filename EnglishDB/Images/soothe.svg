<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soothe</text>
  <text x="50" y="120" class="subtitle">[suːð] v. 安慰，抚慰，使平静</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> so- (表示“完全”) + oth (来自拉丁语“os”，意为“嘴”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个哭泣的孩子，妈妈用温柔的话语和轻柔的抚摸，"完全(so-)"
    <tspan x="50" dy="25">用嘴(oth)说出安慰的话，让孩子平静下来(soothe)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tried to soothe the crying baby with a lullaby.
  </text>
  <text x="50" y="310" class="content">
    她试图用摇篮曲安慰哭泣的婴儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crying baby -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <line x1="45" y1="120" x2="55" y2="120" class="image" />
    <line x1="50" y1="130" x2="50" y2="140" class="image" />
    <line x1="40" y1="150" x2="60" y2="150" class="image" />
    <line x1="45" y1="160" x2="55" y2="160" class="image" />
    <!-- Mother soothing -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="190" y1="110" x2="210" y2="110" class="image" />
    <line x1="195" y1="120" x2="205" y2="120" class="image" />
    <line x1="200" y1="130" x2="200" y2="140" class="image" />
    <line x1="190" y1="150" x2="210" y2="150" class="image" />
    <line x1="195" y1="160" x2="205" y2="160" class="image" />
    <line x1="200" y1="170" x2="50" y2="170" class="image" />
    <line x1="200" y1="180" x2="50" y2="180" class="image" />
    <!-- Heart symbol -->
    <path d="M125,150 C110,180 140,180 125,150 Z" class="image" />
  </g>
</svg>