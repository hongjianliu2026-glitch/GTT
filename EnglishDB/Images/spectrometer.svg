<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spectrometer</text>
  <text x="50" y="120" class="subtitle">[spɛkˈtrɒmɪtə(r)] n. 分光仪，光谱仪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spect (看) + -o- (连接词) + meter (测量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台神奇的仪器，它能"看(spect)"到光的秘密，
    <tspan x="50" dy="25">并"测量(meter)"出光的不同颜色和波长，这就是分光仪(spectrometer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spectrometer helped us analyze the light spectrum.
  </text>
  <text x="50" y="310" class="content">
    分光仪帮助我们分析了光谱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spectrometer -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Light beam -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Spectrum -->
    <rect x="50" y="70" width="50" height="100" class="image" />
    <rect x="100" y="70" width="50" height="100" class="image" />
    <rect x="150" y="70" width="50" height="100" class="image" />
    <rect x="200" y="70" width="50" height="100" class="image" />
    <rect x="250" y="70" width="50" height="100" class="image" />
    <!-- Colors -->
    <rect x="50" y="70" width="50" height="100" fill="red" />
    <rect x="100" y="70" width="50" height="100" fill="orange" />
    <rect x="150" y="70" width="50" height="100" fill="yellow" />
    <rect x="200" y="70" width="50" height="100" fill="green" />
    <rect x="250" y="70" width="50" height="100" fill="blue" />
  </g>
</svg>