<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #154360; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mud</text>
  <text x="50" y="120" class="subtitle">[mʌd] n. 泥，泥浆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mud (源自中古英语 mudde, 意为泥)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子在泥坑里玩耍，"踩在泥(mud)里"，
    <tspan x="50" dy="25">溅起泥浆，全身都是泥巴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car got stuck in the mud.
  </text>
  <text x="50" y="310" class="content">
    汽车陷入了泥里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mud pit -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#85929E" />
    <!-- Child in mud -->
    <circle cx="100" cy="100" r="20" class="image" fill="#F1C40F" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Splashes of mud -->
    <circle cx="150" cy="80" r="10" class="image" fill="#85929E" />
    <circle cx="180" cy="90" r="12" class="image" fill="#85929E" />
    <circle cx="200" cy="70" r="8" class="image" fill="#85929E" />
  </g>
</svg>