<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tantalizing</text>
  <text x="50" y="120" class="subtitle">[ˈtæntəlaɪzɪŋ] adj. 诱人的，令人垂涎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tantal (诱惑) + -ize (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个诱人的蛋糕放在你面前，"诱惑(tantal)"
    <tspan x="50" dy="25">你却无法吃到，这种感觉就是tantalizing。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tantalizing aroma of freshly baked bread filled the air.
  </text>
  <text x="50" y="310" class="content">
    新鲜出炉的面包诱人的香气弥漫在空气中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <circle cx="100" cy="100" r="50" class="image" />
    <rect x="50" y="150" width="100" height="20" class="image" />
    <!-- Fork -->
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="250" y2="200" class="image" />
    <!-- Hand -->
    <circle cx="225" cy="220" r="15" class="image" />
    <line x1="225" y1="235" x2="225" y2="270" class="image" />
    <line x1="225" y1="270" x2="200" y2="300" class="image" />
    <line x1="225" y1="270" x2="250" y2="300" class="image" />
    <line x1="225" y1="250" x2="275" y2="240" class="image" />
  </g>
</svg>