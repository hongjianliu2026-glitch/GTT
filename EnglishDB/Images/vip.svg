<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .vip { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">VIP</text>
  <text x="50" y="120" class="subtitle">[ˌviːaɪˈpiː] n. 贵宾，非常重要的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Very Important Person
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个超级重要的人(VIP)，他/她被一群人簇拥着，
    <tspan x="50" dy="25">享受着特殊的待遇，就像明星一样闪耀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The VIP lounge at the airport offers exclusive services.
  </text>
  <text x="50" y="310" class="content">
    机场的贵宾休息室提供专属服务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- VIP person -->
    <circle cx="50" cy="100" r="30" class="image vip" />
    <!-- Star -->
    <polygon points="100,50 120,100 170,100 130,130 150,180 100,150 50,180 70,130 30,100 80,100" class="image vip" />
    <!-- People around -->
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="50" y1="130" x2="200" y2="130" class="image" />
    <line x1="50" y1="130" x2="250" y2="130" class="image" />
    <line x1="50" y1="130" x2="300" y2="130" class="image" />
  </g>
</svg>