<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drawl</text>
  <text x="50" y="120" class="subtitle">[drɔːl] v. 慢吞吞地说，拉长调子说话</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> draw (拉) + l (表示动作的延续)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在说话时，"拉长(draw)"每个音节，
    <tspan x="50" dy="25">声音拖得很长，就像一条被拉长的橡皮筋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He drawled out his words, making the conversation last longer.
  </text>
  <text x="50" y="310" class="content">
    他慢吞吞地说着话，让对话持续得更久。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Tongue -->
    <line x1="50" y1="70" x2="50" y2="150" class="image" />
    <!-- Sound waves -->
    <path d="M50 150 Q 100 100 150 150 Q 200 200 250 150" class="image" />
    <path d="M50 160 Q 100 110 150 160 Q 200 210 250 160" class="image" />
    <path d="M50 170 Q 100 120 150 170 Q 200 220 250 170" class="image" />
  </g>
</svg>