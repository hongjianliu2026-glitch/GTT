<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bait</text>
  <text x="50" y="120" class="subtitle">[beɪt] n. 饵，诱饵；v. 引诱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ba- (来自古英语 "bæt"，意为食物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个渔夫在河边，用"食物(ba-)"
    <tspan x="50" dy="25">作为诱饵(bait)，吸引鱼儿上钩。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a worm as bait to catch the fish.
  </text>
  <text x="50" y="310" class="content">
    他用虫子作为诱饵来捕鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fisherman -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Bait -->
    <circle cx="100" cy="100" r="5" class="image" />
    <line x1="100" y1="105" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <!-- Fish -->
    <path d="M150,100 Q170,80 190,100 T230,100" class="image" />
    <line x1="150" y1="100" x2="190" y2="100" class="image" />
    <line x1="190" y1="100" x2="210" y2="120" class="image" />
    <line x1="210" y1="120" x2="230" y2="100" class="image" />
  </g>
</svg>