<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fatten</text>
  <text x="50" y="120" class="subtitle">[ˈfætn] v. 使变胖，养肥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fat (胖) + -en (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猪被"使动(en)"得越来越"胖(fat)"，
    <tspan x="50" dy="25">最终变成了一个圆滚滚的大肥猪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer fattened the pigs for the market.
  </text>
  <text x="50" y="310" class="content">
    农夫把猪养肥以供市场出售。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pig -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="80" y1="140" x2="60" y2="130" class="image" />
    <line x1="120" y1="140" x2="140" y2="130" class="image" />
    <line x1="80" y1="170" x2="60" y2="180" class="image" />
    <line x1="120" y1="170" x2="140" y2="180" class="image" />
    <!-- Food -->
    <rect x="50" y="200" width="100" height="20" class="image" />
    <rect x="60" y="210" width="80" height="10" class="image" />
    <rect x="70" y="220" width="60" height="10" class="image" />
    <rect x="80" y="230" width="40" height="10" class="image" />
  </g>
</svg>