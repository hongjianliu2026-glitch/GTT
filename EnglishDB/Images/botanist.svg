<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">botanist</text>
  <text x="50" y="120" class="subtitle">[ˈboʊtənɪst] n. 植物学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> botani (植物) + -ist (从事...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个植物学家(botanist)在森林中，"研究(botani)"
    <tspan x="50" dy="25">各种植物，他的背包里装满了植物标本。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The botanist identified several rare species during her expedition.
  </text>
  <text x="50" y="310" class="content">
    这位植物学家在探险中发现了好几种稀有物种。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="100" x2="50" y2="20" class="image" />
    <line x1="70" y1="100" x2="70" y2="30" class="image" />
    <line x1="90" y1="100" x2="90" y2="40" class="image" />
    <line x1="110" y1="100" x2="110" y2="50" class="image" />
    <!-- Botanist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Backpack -->
    <rect x="0" y="150" width="30" height="30" class="image" />
    <!-- Plant specimens -->
    <line x1="10" y1="160" x2="20" y2="170" class="image" />
    <line x1="20" y1="160" x2="30" y2="170" class="image" />
  </g>
</svg>