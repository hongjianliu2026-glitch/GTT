<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">levy</text>
  <text x="50" y="120" class="subtitle">[ˈlɛvi] v. 征收，征税；n. 征税，征兵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lev (升起) + -y (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象政府官员"升起(lev)"一个巨大的钱袋，象征着"征收(levy)"税款。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government decided to levy a new tax on luxury goods.
  </text>
  <text x="50" y="310" class="content">
    政府决定对奢侈品征收新税。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Government official -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />

    <!-- Money bag -->
    <rect x="100" y="80" width="100" height="100" class="image" />
    <line x1="100" y1="80" x2="150" y2="30" class="image" />
    <line x1="200" y1="80" x2="150" y2="30" class="image" />
    <line x1="100" y1="80" x2="200" y2="80" class="image" />
    <line x1="100" y1="180" x2="200" y2="180" class="image" />

    <!-- Coins -->
    <circle cx="120" cy="120" r="10" class="image" />
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="180" cy="120" r="10" class="image" />
  </g>
</svg>