<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buyer</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪər] n. 买者，购买者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> buy (买) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个购物狂，手里拿着满满的购物袋，"买(buy)"
    <tspan x="50" dy="25">了一大堆东西，这个人就是"买者(buyer)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The buyer was very satisfied with the deal.
  </text>
  <text x="50" y="310" class="content">
    买者对这笔交易非常满意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shopping bags -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <!-- Buyer -->
    <circle cx="180" cy="150" r="20" class="image" />
    <line x1="180" y1="170" x2="180" y2="220" class="image" />
    <line x1="180" y1="220" x2="160" y2="250" class="image" />
    <line x1="180" y1="220" x2="200" y2="250" class="image" />
    <line x1="180" y1="190" x2="140" y2="180" class="image" />
    <line x1="180" y1="190" x2="220" y2="180" class="image" />
  </g>
</svg>