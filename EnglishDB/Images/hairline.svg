<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hairline</text>
  <text x="50" y="120" class="subtitle">[ˈherlaɪn] n. 发际线，极细的线</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hair (头发) + line (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个理发师在镜子前，用一把极细的剃刀在"头发(hair)"上划出一条"线(line)"，
    <tspan x="50" dy="25">这条线就是发际线(hairline)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist drew a hairline with a fine pen.
  </text>
  <text x="50" y="310" class="content">
    艺术家用细笔画了一条极细的线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hairline -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" style="stroke-width: 0.5;" />
    <!-- Hair -->
    <line x1="50" y1="90" x2="50" y2="100" class="image" />
    <line x1="70" y1="90" x2="70" y2="100" class="image" />
    <line x1="90" y1="90" x2="90" y2="100" class="image" />
    <line x1="110" y1="90" x2="110" y2="100" class="image" />
    <line x1="130" y1="90" x2="130" y2="100" class="image" />
    <line x1="150" y1="90" x2="150" y2="100" class="image" />
    <line x1="170" y1="90" x2="170" y2="100" class="image" />
    <line x1="190" y1="90" x2="190" y2="100" class="image" />
    <line x1="210" y1="90" x2="210" y2="100" class="image" />
    <line x1="230" y1="90" x2="230" y2="100" class="image" />
    <line x1="250" y1="90" x2="250" y2="100" class="image" />
    <line x1="270" y1="90" x2="270" y2="100" class="image" />
    <line x1="290" y1="90" x2="290" y2="100" class="image" />
    <!-- Barber -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
  </g>
</svg>