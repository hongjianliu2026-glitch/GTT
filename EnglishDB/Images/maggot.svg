<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maggot</text>
  <text x="50" y="120" class="subtitle">[ˈmæɡət] n. 蛆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mag (软的，易变的) + got (小东西)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蛆在腐烂的肉上蠕动，"软软的(mag)"
    <tspan x="50" dy="25">小东西(got)，这就是蛆(maggot)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rotting meat was infested with maggots.
  </text>
  <text x="50" y="310" class="content">
    腐烂的肉上爬满了蛆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rotten meat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Maggots -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="90" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
  </g>
</svg>