<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beep</text>
  <text x="50" y="120" class="subtitle">[biːp] n. 哔哔声；v. 发出哔哔声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拟声词，模拟电子设备发出的声音
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机器人正在发出"哔哔(beep)"声，
    <tspan x="50" dy="25">提醒你它正在工作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The microwave beeped when the food was ready.
  </text>
  <text x="50" y="310" class="content">
    微波炉在食物准备好时发出了哔哔声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot -->
    <circle cx="50" cy="100" r="30" class="image" />
    <rect x="35" y="130" width="30" height="50" class="image" />
    <line x1="50" y1="180" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="250" class="image" />
    <line x1="50" y1="220" x2="70" y2="250" class="image" />
    <line x1="50" y1="130" x2="20" y2="160" class="image" />
    <line x1="50" y1="130" x2="80" y2="160" class="image" />
    <!-- Beep sound -->
    <path d="M100,100 Q150,50 200,100" class="image" />
    <path d="M100,120 Q150,70 200,120" class="image" />
    <path d="M100,140 Q150,90 200,140" class="image" />
  </g>
</svg>