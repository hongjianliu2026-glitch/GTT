<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spreadsheet</text>
  <text x="50" y="120" class="subtitle">[ˈspredʃiːt] n. 电子表格</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spread (展开) + sheet (纸张)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张巨大的纸张(sheet)被展开(spread)，上面布满了
    <tspan x="50" dy="25">各种数据和计算公式，这就是电子表格(spreadsheet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She uses a spreadsheet to manage her budget.
  </text>
  <text x="50" y="310" class="content">
    她用电子表格来管理她的预算。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spreadsheet grid -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="0" y1="70" x2="350" y2="70" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="170" x2="350" y2="170" class="image" />
    <!-- Data cells -->
    <text x="60" y="50" class="content">A1</text>
    <text x="110" y="50" class="content">B1</text>
    <text x="160" y="50" class="content">C1</text>
    <text x="210" y="50" class="content">D1</text>
    <text x="260" y="50" class="content">E1</text>
    <text x="310" y="50" class="content">F1</text>
    <text x="60" y="100" class="content">A2</text>
    <text x="110" y="100" class="content">B2</text>
    <text x="160" y="100" class="content">C2</text>
    <text x="210" y="100" class="content">D2</text>
    <text x="260" y="100" class="content">E2</text>
    <text x="310" y="100" class="content">F2</text>
    <text x="60" y="150" class="content">A3</text>
    <text x="110" y="150" class="content">B3</text>
    <text x="160" y="150" class="content">C3</text>
    <text x="210" y="150" class="content">D3</text>
    <text x="260" y="150" class="content">E3</text>
    <text x="310" y="150" class="content">F3</text>
  </g>
</svg>