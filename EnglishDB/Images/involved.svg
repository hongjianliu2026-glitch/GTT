<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">involved</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvɒlvd] adj. 复杂的，涉及的；v. 使卷入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + volv (卷) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"卷入(in-volv-ed)"一个复杂的迷宫中，
    <tspan x="50" dy="25">周围全是错综复杂的线条和路径，这就是"复杂的(involved)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The situation became too involved for me to handle.
  </text>
  <text x="50" y="310" class="content">
    情况变得太复杂，我无法处理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Maze -->
    <path d="M50,50 L150,50 L150,150 L50,150 Z" class="image" />
    <path d="M70,70 L130,70 L130,130 L70,130 Z" class="image" />
    <path d="M90,90 L110,90 L110,110 L90,110 Z" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
  </g>
</svg>