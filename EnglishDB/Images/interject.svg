<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interject</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈdʒekt] v. 插话，打断</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在中间) + ject (投掷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在对话中突然"投掷(ject)"
    <tspan x="50" dy="25">一句话到中间(inter-)，打断了原本的对话。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She interjected with a question, breaking the flow of the conversation.
  </text>
  <text x="50" y="310" class="content">
    她插话问了一个问题，打断了对话的流程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dialogue bubbles -->
    <circle cx="50" cy="50" r="40" class="image" />
    <text x="35" y="55" class="content">"Hello!"</text>
    <circle cx="200" cy="50" r="40" class="image" />
    <text x="185" y="55" class="content">"Hi!"</text>
    <!-- Interjection -->
    <circle cx="125" cy="150" r="40" class="image" />
    <text x="110" y="155" class="content">"Wait!"</text>
    <!-- Arrows -->
    <line x1="50" y1="90" x2="125" y2="110" class="image" />
    <line x1="200" y1="90" x2="125" y2="110" class="image" />
  </g>
</svg>