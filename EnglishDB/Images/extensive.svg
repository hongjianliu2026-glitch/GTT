<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extensive</text>
  <text x="50" y="120" class="subtitle">[ɪkˈstensɪv] adj. 广泛的，大量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + tens (伸展)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的伸展(tens)手，"向外伸展(ex-tens)"
    <tspan x="50" dy="25">到无限远，覆盖了广阔的区域，这就是广泛的(extensive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project requires extensive knowledge of physics.
  </text>
  <text x="50" y="310" class="content">
    这个项目需要广泛的物理知识。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large hand -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="350" y2="250" class="image" />
    <line x1="350" y1="50" x2="350" y2="250" class="image" />
    <!-- Fingers -->
    <line x1="350" y1="50" x2="400" y2="100" class="image" />
    <line x1="350" y1="100" x2="400" y2="150" class="image" />
    <line x1="350" y1="150" x2="400" y2="200" class="image" />
    <line x1="350" y1="200" x2="400" y2="250" class="image" />
    <!-- Wrist -->
    <circle cx="50" cy="50" r="20" class="image" />
  </g>
</svg>