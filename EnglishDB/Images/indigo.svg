<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7FF; }
      .title { font: bold 48px sans-serif; fill: #4A235A; }
      .subtitle { font: italic 24px serif; fill: #6C3483; }
      .content { font: 18px sans-serif; fill: #5B2C6F; }
      .highlight { font-weight: bold; fill: #8E44AD; }
      .story { font: 16px serif; fill: #7D3C98; }
      .image { stroke: #A569BD; stroke-width: 2; fill: none; }
      .indigo-color { fill: #4B0082; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indigo</text>
  <text x="50" y="120" class="subtitle">[ˈɪndɪɡəʊ] n. 靛蓝色，靛蓝染料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> indico (拉丁语，靛蓝)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的染坊，"靛蓝(indigo)"
    <tspan x="50" dy="25">染料从植物中提取，染出深邃的蓝色。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dress was dyed in a deep indigo color.
  </text>
  <text x="50" y="310" class="content">
    这条裙子被染成了深靛蓝色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Indigo plant -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="indigo-color" />
    <circle cx="100" cy="100" r="30" class="indigo-color" />
    <circle cx="150" cy="100" r="30" class="indigo-color" />
    <circle cx="200" cy="100" r="30" class="indigo-color" />
    <circle cx="250" cy="100" r="30" class="indigo-color" />
    <circle cx="300" cy="100" r="30" class="indigo-color" />
    <!-- Dyeing process -->
    <rect x="50" y="150" width="250" height="30" class="indigo-color" />
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="210" x2="300" y2="210" class="image" />
  </g>
</svg>