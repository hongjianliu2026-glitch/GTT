<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .blood { fill: #C0392B; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bleed</text>
  <text x="50" y="120" class="subtitle">[bliːd] v. 流血，渗出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bles (血) + ed (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只受伤的小动物，"血(bles)"从伤口"流出(ed)"，
    <tspan x="50" dy="25">这就是"流血(bleed)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cut on his finger made him bleed.
  </text>
  <text x="50" y="310" class="content">
    他手指上的伤口让他流血了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Animal -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />

    <!-- Blood -->
    <circle cx="50" cy="120" r="5" class="blood" />
    <circle cx="50" cy="130" r="5" class="blood" />
    <circle cx="50" cy="140" r="5" class="blood" />
    <circle cx="50" cy="150" r="5" class="blood" />
    <circle cx="50" cy="160" r="5" class="blood" />
  </g>
</svg>