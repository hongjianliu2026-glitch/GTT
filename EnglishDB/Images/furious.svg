<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">furious</text>
  <text x="50" y="120" class="subtitle">[ˈfjʊriəs] adj. 狂怒的，猛烈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fur- (愤怒) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头愤怒的狮子，"愤怒(fur-)"
    <tspan x="50" dy="25">咆哮着，周围的空气都变得"猛烈(furious)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was furious when he found out about the mistake.
  </text>
  <text x="50" y="310" class="content">
    当他发现这个错误时，他非常愤怒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion's head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Nose -->
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
    <!-- Mouth -->
    <path d="M 50 140 Q 100 180 150 140" class="image" />
    <!-- Fur -->
    <line x1="20" y1="40" x2="180" y2="40" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="120" x2="180" y2="120" class="image" />
    <line x1="20" y1="140" x2="180" y2="140" class="image" />
    <line x1="20" y1="160" x2="180" y2="160" class="image" />
    <line x1="20" y1="180" x2="180" y2="180" class="image" />
  </g>
</svg>