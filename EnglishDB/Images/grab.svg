<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grab</text>
  <text x="50" y="120" class="subtitle">[ɡræb] v. 抓取，抢夺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grab (抓)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手突然伸出，"抓住(grab)"
    <tspan x="50" dy="25">一块美味的蛋糕，生怕别人抢走。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He grabbed the last piece of pizza before anyone else could.
  </text>
  <text x="50" y="310" class="content">
    他在别人之前抢到了最后一块披萨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand grabbing a cake -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <rect x="160" y="40" width="100" height="60" class="image" />
    <circle cx="210" cy="70" r="20" class="image" />
  </g>
</svg>