<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obedient</text>
  <text x="50" y="120" class="subtitle">[əˈbiːdiənt] adj. 顺从的，服从的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (朝向) + ed (做) + ient (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小狗，"朝向(ob-)"主人，"做(ed)"出各种服从的动作，
    <tspan x="50" dy="25">这就是顺从的(obedient)小狗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog was very obedient and followed every command.
  </text>
  <text x="50" y="310" class="content">
    这只狗非常顺从，听从每一个命令。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />
    <!-- Leash -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <!-- Person -->
    <circle cx="150" cy="40" r="20" class="image" />
    <line x1="150" y1="60" x2="150" y2="100" class="image" />
    <line x1="150" y1="80" x2="120" y2="70" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />
  </g>
</svg>