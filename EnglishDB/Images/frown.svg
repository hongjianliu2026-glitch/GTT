<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frown</text>
  <text x="50" y="120" class="subtitle">[fraʊn] v. 皱眉，表示不满</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fr- (向前) + own (向下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为不满意而"向前(fr-)"
    <tspan x="50" dy="25">"向下(own)"皱起眉头，这就是皱眉(frown)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She frowned at the noisy children.
  </text>
  <text x="50" y="310" class="content">
    她对吵闹的孩子们皱起了眉头。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Frown -->
    <path d="M 60 120 Q 100 150 140 120" class="image" />
  </g>
</svg>