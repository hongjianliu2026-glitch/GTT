<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cripple</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪpəl] v. 使跛，使残废；n. 跛子，残废人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ciph (腿) + le (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路时，突然"腿(ciph)"
    <tspan x="50" dy="25">受伤，导致他"跛行(le)"，这就是"cripple"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident crippled him for life.
  </text>
  <text x="50" y="310" class="content">
    那次事故使他终身残废。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Legs -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <!-- Broken leg -->
    <line x1="50" y1="60" x2="70" y2="80" class="image" />
    <line x1="70" y1="80" x2="50" y2="100" class="image" />
    <!-- Person -->
    <circle cx="75" cy="10" r="15" class="image" />
    <line x1="75" y1="25" x2="75" y2="40" class="image" />
    <line x1="75" y1="40" x2="50" y2="60" class="image" />
    <line x1="75" y1="40" x2="100" y2="60" class="image" />
  </g>
</svg>