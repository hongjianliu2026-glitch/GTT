<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #E67E22; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cayenne</text>
  <text x="50" y="120" class="subtitle">[kaɪˈɛn] n. 卡宴辣椒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自法语“Cayenne”，指法国圭亚那的首府，因当地盛产辣椒而得名。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，手持一串火红的“卡宴辣椒(cayenne)”，
    <tspan x="50" dy="25">准备用它来给菜肴增添火辣的味道。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dish was too bland, so she added some cayenne pepper.
  </text>
  <text x="50" y="310" class="content">
    这道菜太淡了，所以她加了一些卡宴辣椒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Pepper -->
    <rect x="70" y="80" width="30" height="60" class="image" />
    <rect x="110" y="80" width="30" height="60" class="image" />
    <rect x="150" y="80" width="30" height="60" class="image" />
    <!-- Fire -->
    <line x1="85" y1="70" x2="85" y2="50" class="image" />
    <line x1="105" y1="70" x2="105" y2="50" class="image" />
    <line x1="125" y1="70" x2="125" y2="50" class="image" />
    <line x1="145" y1="70" x2="145" y2="50" class="image" />
  </g>
</svg>