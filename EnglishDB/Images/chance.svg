<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chance</text>
  <text x="50" y="120" class="subtitle">[tʃæns] n. 机会，可能性；v. 偶然发生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chanc (机会) + -e (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幸运的硬币，"机会(chance)"
    <tspan x="50" dy="25">从天而降，落在你的手中，带来了好运。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took a chance on the new job and got it.
  </text>
  <text x="50" y="310" class="content">
    她抓住了新工作的机会，并得到了它。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coin -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <text x="75" y="110" class="content" fill="#000">幸运</text>
    <!-- Hand -->
    <path d="M 50 150 Q 100 200 150 150" class="image" />
    <circle cx="50" cy="150" r="10" class="image" fill="#FFD700" />
    <circle cx="150" cy="150" r="10" class="image" fill="#FFD700" />
  </g>
</svg>