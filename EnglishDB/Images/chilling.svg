<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .chill { fill: #BDC3C7; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chilling</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɪlɪŋ] adj. 令人恐惧的，令人寒心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chill (寒冷) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的夜晚，风吹过，"寒气逼人(chill-ing)"，
    <tspan x="50" dy="25">让人感到恐惧和不安。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chilling scream echoed through the empty house.
  </text>
  <text x="50" y="310" class="content">
    那令人寒心的尖叫声在空荡荡的房子里回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="50" r="30" class="chill" />
    <!-- House -->
    <rect x="50" y="100" width="100" height="80" class="image" />
    <rect x="70" y="120" width="20" height="20" class="image" />
    <rect x="110" y="120" width="20" height="20" class="image" />
    <!-- Tree -->
    <line x1="180" y1="100" x2="180" y2="180" class="image" />
    <line x1="180" y1="140" x2="160" y2="120" class="image" />
    <line x1="180" y1="140" x2="200" y2="120" class="image" />
    <line x1="180" y1="160" x2="160" y2="140" class="image" />
    <line x1="180" y1="160" x2="200" y2="140" class="image" />
    <!-- Wind -->
    <polyline points="220,100 240,80 260,100" class="image" />
    <polyline points="220,120 240,100 260,120" class="image" />
    <polyline points="220,140 240,120 260,140" class="image" />
  </g>
</svg>