<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFC107; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #FFD700; }
      .rays { stroke: #FFD700; stroke-width: 5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunlight</text>
  <text x="50" y="120" class="subtitle">[ˈsʌnlaɪt] n. 阳光</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + light (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳(sun)放射出光芒(light)，照亮了整个世界，这就是阳光(sunlight)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sunlight warmed the garden.
  </text>
  <text x="50" y="310" class="content">
    阳光温暖了花园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Sun rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="rays" />
    <line x1="150" y1="100" x2="200" y2="100" class="rays" />
    <line x1="100" y1="150" x2="100" y2="200" class="rays" />
    <line x1="50" y1="100" x2="0" y2="100" class="rays" />
    <!-- Ground -->
    <rect x="0" y="180" width="200" height="20" class="image" />
    <!-- Garden -->
    <rect x="50" y="160" width="10" height="20" class="image" />
    <rect x="70" y="140" width="10" height="40" class="image" />
    <rect x="90" y="150" width="10" height="30" class="image" />
  </g>
</svg>