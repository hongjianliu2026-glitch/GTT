<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snake</text>
  <text x="50" y="120" class="subtitle">[sneɪk] n. 蛇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snak (蛇)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蛇在草丛中"悄悄滑行(snak)"，
    <tspan x="50" dy="25">它的身体弯曲成各种形状，就像字母"S"一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snake slithered through the grass.
  </text>
  <text x="50" y="310" class="content">
    蛇在草丛中滑行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snake body -->
    <path d="M50 50 C 100 0, 150 0, 200 50 S 250 100, 300 50" class="image" />
    <!-- Snake head -->
    <circle cx="300" cy="50" r="20" class="image" />
    <!-- Snake eyes -->
    <circle cx="290" cy="40" r="3" class="image" />
    <circle cx="310" cy="40" r="3" class="image" />
    <!-- Grass -->
    <line x1="0" y1="100" x2="400" y2="100" class="image" />
    <line x1="0" y1="110" x2="400" y2="110" class="image" />
    <line x1="0" y1="120" x2="400" y2="120" class="image" />
  </g>
</svg>