<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disposal</text>
  <text x="50" y="120" class="subtitle">[dɪˈspoʊzəl] n. 处理，处置；安排</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + pos (放置) + -al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的垃圾场，"分开放置(dis-pos-al)"
    <tspan x="50" dy="25">各种垃圾，这就是垃圾的处置(disposal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city has a good system for waste disposal.
  </text>
  <text x="50" y="310" class="content">
    这座城市有一个很好的废物处理系统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trash bin -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Trash -->
    <circle cx="30" cy="50" r="20" class="image" />
    <circle cx="100" cy="70" r="25" class="image" />
    <circle cx="60" cy="120" r="30" class="image" />
    <circle cx="120" cy="150" r="20" class="image" />
    <!-- Disposal action -->
    <line x1="160" y1="100" x2="200" y2="100" class="image" />
    <line x1="180" y1="80" x2="180" y2="120" class="image" />
    <line x1="170" y1="100" x2="190" y2="100" class="image" />
  </g>
</svg>