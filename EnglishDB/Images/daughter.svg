<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">daughter</text>
  <text x="50" y="120" class="subtitle">[ˈdɔːtər] n. 女儿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> daugh (后代) + -ter (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个母亲怀抱着她的"后代(daugh-ter)"，
    <tspan x="50" dy="25">这个孩子就是她的女儿(daughter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a loving daughter to her parents.
  </text>
  <text x="50" y="310" class="content">
    她是一个孝顺的女儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Mother -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />

    <!-- Daughter -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="90" x2="130" y2="100" class="image" />
    <line x1="150" y1="90" x2="170" y2="100" class="image" />

    <!-- Heart -->
    <path d="M100,100 C90,80 110,80 100,100 Z" class="image" />
    <path d="M100,100 C110,80 90,80 100,100 Z" class="image" />
  </g>
</svg>