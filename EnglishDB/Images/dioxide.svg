<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dioxide</text>
  <text x="50" y="120" class="subtitle">[daɪˈɒksaɪd] n. 二氧化物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (二) + oxide (氧化物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学实验室里，"两个(di-)"
    <tspan x="50" dy="25">氧原子与一个碳原子结合，形成了二氧化碳(dioxide)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Carbon dioxide is a common greenhouse gas.
  </text>
  <text x="50" y="310" class="content">
    二氧化碳是一种常见的温室气体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chemical structure -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Carbon atom -->
    <circle cx="120" cy="80" r="15" class="image" /> <!-- Oxygen atom 1 -->
    <circle cx="120" cy="120" r="15" class="image" /> <!-- Oxygen atom 2 -->
    <line x1="70" y1="100" x2="105" y2="80" class="image" /> <!-- Bond 1 -->
    <line x1="70" y1="100" x2="105" y2="120" class="image" /> <!-- Bond 2 -->
  </g>
</svg>