<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prepaid</text>
  <text x="50" y="120" class="subtitle">[priːˈpeɪd] adj. 预付的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + paid (支付)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在购物前，"提前支付(pre-paid)"
    <tspan x="50" dy="25">了所有费用，这样他就可以安心购物了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought a prepaid phone card to make international calls.
  </text>
  <text x="50" y="310" class="content">
    他买了一张预付费电话卡来打国际电话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shopping cart -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Money bag -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <line x1="200" y1="50" x2="250" y2="0" class="image" />
    <line x1="300" y1="50" x2="250" y2="0" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <line x1="300" y1="100" x2="250" y2="150" class="image" />
  </g>
</svg>