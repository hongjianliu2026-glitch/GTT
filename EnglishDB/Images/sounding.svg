<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sounding</text>
  <text x="50" y="120" class="subtitle">[ˈsaʊndɪŋ] n. 发声，探测；adj. 发声的，探测的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sound (声音) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的喇叭在"发出(sound)"
    <tspan x="50" dy="25">震耳欲聋的声音，这就是"发声(sounding)"的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sounding of the alarm woke everyone up.
  </text>
  <text x="50" y="310" class="content">
    警报声把大家都吵醒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large speaker -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="95" y1="100" x2="255" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <!-- Sound waves -->
    <path d="M175 20 Q225 50 175 80 Q125 50 175 20" class="image" />
    <path d="M175 80 Q225 110 175 140 Q125 110 175 80" class="image" />
    <path d="M175 140 Q225 170 175 200 Q125 170 175 140" class="image" />
  </g>
</svg>