<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">premiere</text>
  <text x="50" y="120" class="subtitle">[prɪˈmɪər] n. 首映，初次公演；v. 首次公演</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + miere (出现)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一部电影在巨大的屏幕上"提前出现(pre-miere)"，
    <tspan x="50" dy="25">观众们激动地等待着这场首映(premiere)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie premiere was a star-studded event.
  </text>
  <text x="50" y="310" class="content">
    这部电影的首映式是一个星光熠熠的活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Movie screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Movie screen -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Movie reel -->
    <circle cx="70" cy="100" r="15" class="image" />
    <circle cx="280" cy="100" r="15" class="image" />
    <line x1="85" y1="100" x2="265" y2="100" class="image" />
    <!-- Audience -->
    <circle cx="120" cy="220" r="10" class="image" />
    <circle cx="160" cy="220" r="10" class="image" />
    <circle cx="200" cy="220" r="10" class="image" />
    <circle cx="240" cy="220" r="10" class="image" />
  </g>
</svg>