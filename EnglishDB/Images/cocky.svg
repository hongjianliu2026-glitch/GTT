<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cocky</text>
  <text x="50" y="120" class="subtitle">[ˈkɒki] adj. 自大的，傲慢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cock (公鸡) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只公鸡(cock)昂首挺胸，"自大(cocky)"地走在路上，
    <tspan x="50" dy="25">仿佛自己是世界的中心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was too cocky to admit his mistake.
  </text>
  <text x="50" y="310" class="content">
    他太自大了，不肯承认自己的错误。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cock -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="20" y2="100" class="image" /> <!-- Left wing -->
    <line x1="50" y1="120" x2="80" y2="100" class="image" /> <!-- Right wing -->
    <line x1="50" y1="150" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <line x1="50" y1="40" x2="50" y2="20" class="image" /> <!-- Beak -->
    <line x1="50" y1="20" x2="40" y2="10" class="image" /> <!-- Beak tip -->
    <line x1="50" y1="20" x2="60" y2="10" class="image" /> <!-- Beak tip -->
    <circle cx="40" cy="40" r="5" class="image" /> <!-- Left eye -->
    <circle cx="60" cy="40" r="5" class="image" /> <!-- Right eye -->
  </g>
</svg>