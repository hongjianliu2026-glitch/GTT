<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">organism</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrɡənɪzəm] n. 有机体，生物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> organ (器官) + -ism (表示“状态或特性”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的生物，它的每个器官(organ)
    <tspan x="50" dy="25">都在协同工作，形成了一个完整的有机体(organism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientist studied the behavior of the organism in the lab.
  </text>
  <text x="50" y="310" class="content">
    科学家在实验室里研究了这种生物的行为。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Organism body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Heart -->
    <circle cx="100" cy="50" r="10" class="image" />
    <!-- Brain -->
    <rect x="80" y="120" width="40" height="20" class="image" />
    <!-- Lungs -->
    <rect x="50" y="70" width="20" height="30" class="image" />
    <rect x="130" y="70" width="20" height="30" class="image" />
    <!-- Legs -->
    <line x1="80" y1="150" x2="80" y2="180" class="image" />
    <line x1="120" y1="150" x2="120" y2="180" class="image" />
    <!-- Arms -->
    <line x1="60" y1="120" x2="40" y2="140" class="image" />
    <line x1="140" y1="120" x2="160" y2="140" class="image" />
  </g>
</svg>