<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">centrifugal</text>
  <text x="50" y="120" class="subtitle">[senˈtrɪfjuɡl] adj. 离心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> centri- (中心) + fug (逃离) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体在旋转时，"逃离中心(centri-fug-al)"，
    <tspan x="50" dy="25">就像一个旋转的陀螺，边缘的物体被甩出去。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The centrifugal force caused the water to fly out of the bucket.
  </text>
  <text x="50" y="310" class="content">
    离心力使水从桶中飞出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Center point -->
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Rotating object -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="60" x2="175" y2="140" class="image" />
    <line x1="155" y1="100" x2="195" y2="100" class="image" />
    <line x1="165" y1="70" x2="185" y2="130" class="image" />
    <line x1="185" y1="70" x2="165" y2="130" class="image" />
    <!-- Flying object -->
    <circle cx="250" cy="100" r="10" class="image" />
    <line x1="200" y1="100" x2="240" y2="100" class="image" />
  </g>
</svg>