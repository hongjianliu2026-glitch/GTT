<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spoonful</text>
  <text x="50" y="120" class="subtitle">[ˈspuːnˌfʊl] n. 一勺的量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spoon (勺子) + -ful (充满...的量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的勺子，"充满(ful)"了满满的汤，
    <tspan x="50" dy="25">这一勺的量(spoonful)足够填满一个小碗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took a spoonful of soup from the bowl.
  </text>
  <text x="50" y="310" class="content">
    她从碗里舀了一勺汤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spoon -->
    <path d="M50 50 Q100 20 150 50 L150 100 Q100 130 50 100 Z" class="image" fill="#F39C12" />
    <!-- Soup -->
    <ellipse cx="100" cy="80" rx="40" ry="20" class="image" fill="#F5D76E" />
    <!-- Bowl -->
    <path d="M50 150 Q100 120 150 150 L150 200 Q100 230 50 200 Z" class="image" fill="#F1C40F" />
  </g>
</svg>