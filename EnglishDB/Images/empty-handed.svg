<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">empty-handed</text>
  <text x="50" y="120" class="subtitle">[ˈɛmptiˈhændɪd] adj. 空手的，一无所获的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> empty (空的) + hand (手) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人两手空空地站在那里，"空手(empty-handed)"
    <tspan x="50" dy="25">什么也没带，什么也没得到。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He returned home empty-handed after a long day of searching.
  </text>
  <text x="50" y="310" class="content">
    他经过一天的寻找后，空手而归。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with empty hands -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="90" x2="20" y2="80" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="80" y2="80" class="image" /> <!-- Right arm -->
    <line x1="50" y1="120" x2="30" y2="150" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="150" class="image" /> <!-- Right leg -->
    <!-- Empty hands -->
    <circle cx="20" cy="80" r="5" class="image" /> <!-- Left hand -->
    <circle cx="80" cy="80" r="5" class="image" /> <!-- Right hand -->
  </g>
</svg>