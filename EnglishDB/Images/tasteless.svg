<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tasteless</text>
  <text x="50" y="120" class="subtitle">[ˈteɪstlɪs] adj. 无味的，乏味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> taste (味道) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人吃了一口"无味(taste-less)"的食物，
    <tspan x="50" dy="25">脸上露出失望的表情，因为这食物完全没有味道。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soup was tasteless and bland.
  </text>
  <text x="50" y="310" class="content">
    这汤无味且平淡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Face -->
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Eyes -->
    <circle cx="185" cy="90" r="5" class="image" />
    <circle cx="215" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <line x1="185" y1="120" x2="215" y2="120" class="image" />
    <!-- Disappointed expression -->
    <line x1="185" y1="125" x2="185" y2="135" class="image" />
    <line x1="215" y1="125" x2="215" y2="135" class="image" />
  </g>
</svg>