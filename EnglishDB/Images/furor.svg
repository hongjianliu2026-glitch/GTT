<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">furor</text>
  <text x="50" y="120" class="subtitle">[ˈfjʊərə(r)] n. 狂怒，狂热</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fur- (愤怒) + or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人因为某个事件而"愤怒(fur-)"，
    <tspan x="50" dy="25">场面失控，形成了一场"狂怒(furor)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news caused a furor among the public.
  </text>
  <text x="50" y="310" class="content">
    这个消息在公众中引起了轩然大波。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry crowd -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Angry expressions -->
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="90" y1="40" x2="110" y2="40" class="image" />
    <line x1="140" y1="40" x2="160" y2="40" class="image" />
    <line x1="190" y1="40" x2="210" y2="40" class="image" />
    <line x1="240" y1="40" x2="260" y2="40" class="image" />
    <!-- Angry mouths -->
    <path d="M30,60 Q40,80 50,60" class="image" />
    <path d="M80,60 Q90,80 100,60" class="image" />
    <path d="M130,60 Q140,80 150,60" class="image" />
    <path d="M180,60 Q190,80 200,60" class="image" />
    <path d="M230,60 Q240,80 250,60" class="image" />
  </g>
</svg>