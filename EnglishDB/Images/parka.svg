<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parka</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːrkə] n. 派克大衣，防寒外套</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自因纽特语 "parka"，意为 "兽皮"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个因纽特人穿着一件用兽皮制成的防寒外套，
    <tspan x="50" dy="25">这件外套不仅保暖，还能抵御严寒，这就是派克大衣(parka)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a parka to keep warm in the cold weather.
  </text>
  <text x="50" y="310" class="content">
    她在寒冷的天气里穿了一件派克大衣来保暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parka outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hood -->
    <rect x="120" y="20" width="110" height="50" class="image" />
    <!-- Body -->
    <rect x="100" y="70" width="150" height="100" class="image" />
    <!-- Pockets -->
    <rect x="110" y="130" width="40" height="40" class="image" />
    <rect x="200" y="130" width="40" height="40" class="image" />
    <!-- Arms -->
    <line x1="100" y1="90" x2="50" y2="120" class="image" />
    <line x1="250" y1="90" x2="300" y2="120" class="image" />
    <!-- Person -->
    <circle cx="175" cy="180" r="15" class="image" />
    <line x1="175" y1="195" x2="175" y2="230" class="image" />
    <line x1="175" y1="230" x2="150" y2="260" class="image" />
    <line x1="175" y1="230" x2="200" y2="260" class="image" />
    <line x1="175" y1="210" x2="225" y2="200" class="image" />
  </g>
</svg>