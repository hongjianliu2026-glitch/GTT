<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">homesick</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊmˌsɪk] adj. 想家的，思乡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> home (家) + sick (生病的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人远离家乡，心中充满了对家的思念，
    <tspan x="50" dy="25">这种思念让他感到"生病(sick)"，这就是homesick的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a month abroad, she started to feel homesick.
  </text>
  <text x="50" y="310" class="content">
    在国外一个月后，她开始感到想家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="20" y="20" width="110" height="60" class="image" />
    <line x1="75" y1="20" x2="75" y2="0" class="image" />
    <line x1="75" y1="0" x2="150" y2="50" class="image" />
    <line x1="75" y1="0" x2="0" y2="50" class="image" />
    <!-- Person -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="80" x2="230" y2="70" class="image" />
    <!-- Heart -->
    <path d="M250,50 C250,20 280,20 280,50 S310,80 310,50" class="image" />
    <line x1="250" y1="50" x2="310" y2="50" class="image" />
    <!-- Arrow -->
    <line x1="280" y1="50" x2="180" y2="50" class="image" />
    <polygon points="280,50 270,40 270,60" class="image" />
  </g>
</svg>