<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retailing</text>
  <text x="50" y="120" class="subtitle">[ˈriːteɪlɪŋ] n. 零售</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再) + tail (切) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商店老板在"再次切割(re-tail)"商品，
    <tspan x="50" dy="25">将大块商品分成小块，以便零售(retailing)给顾客。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company specializes in retailing high-end fashion.
  </text>
  <text x="50" y="310" class="content">
    该公司专门从事高端时尚的零售。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Storefront -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Shop sign -->
    <text x="150" y="30" class="image" font-size="30" fill="#7F8C8D">Shop</text>
    <!-- Products -->
    <rect x="50" y="50" width="50" height="50" class="image" />
    <rect x="120" y="50" width="50" height="50" class="image" />
    <rect x="190" y="50" width="50" height="50" class="image" />
    <!-- Customer -->
    <circle cx="280" cy="100" r="15" class="image" />
    <line x1="280" y1="115" x2="280" y2="150" class="image" />
    <line x1="280" y1="150" x2="260" y2="180" class="image" />
    <line x1="280" y1="150" x2="300" y2="180" class="image" />
    <line x1="280" y1="130" x2="310" y2="120" class="image" />
    <!-- Cash register -->
    <rect x="250" y="150" width="50" height="30" class="image" />
    <line x1="260" y1="160" x2="290" y2="160" class="image" />
    <line x1="260" y1="170" x2="290" y2="170" class="image" />
  </g>
</svg>