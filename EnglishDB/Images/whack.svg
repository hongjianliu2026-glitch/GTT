<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whack</text>
  <text x="50" y="120" class="subtitle">[wæk] v. 重击，猛击；n. 重击声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whack (源自拟声词，模拟重击声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棒球手挥棒猛击(whack)球，发出"啪"的一声，
    <tspan x="50" dy="25">球飞得远远的，这就是whack的力量！</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gave the ball a powerful whack.
  </text>
  <text x="50" y="310" class="content">
    他用力猛击了球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Baseball bat -->
    <line x1="0" y1="0" x2="150" y2="0" class="image" />
    <line x1="150" y1="0" x2="140" y2="10" class="image" />
    <line x1="150" y1="0" x2="140" y2="-10" class="image" />
    <!-- Ball -->
    <circle cx="200" cy="0" r="20" class="image" />
    <!-- Whack effect -->
    <line x1="200" y1="0" x2="300" y2="-50" class="image" />
    <line x1="200" y1="0" x2="300" y2="50" class="image" />
  </g>
</svg>