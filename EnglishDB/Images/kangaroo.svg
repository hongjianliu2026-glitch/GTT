<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kangaroo</text>
  <text x="50" y="120" class="subtitle">[ˌkæŋɡəˈruː] n. 袋鼠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自澳大利亚原住民语言，意为“我不知道”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家第一次见到袋鼠，惊讶地问：“这是什么？”
    <tspan x="50" dy="25">当地人笑着回答：“Kangaroo！”（我不知道）</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kangaroo is a symbol of Australia.
  </text>
  <text x="50" y="310" class="content">
    袋鼠是澳大利亚的象征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kangaroo body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Head -->
    <circle cx="100" cy="70" r="30" class="image" />
    <!-- Ears -->
    <line x1="80" y1="40" x2="60" y2="20" class="image" />
    <line x1="120" y1="40" x2="140" y2="20" class="image" />
    <!-- Legs -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <!-- Tail -->
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <!-- Pouch -->
    <rect x="120" y="100" width="60" height="40" class="image" />
  </g>
</svg>