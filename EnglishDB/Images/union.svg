<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">union</text>
  <text x="50" y="120" class="subtitle">[ˈjuːniən] n. 联合，联盟；工会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (一个) + -on (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个原本分离的个体，通过"联合(uni-on)"
    <tspan x="50" dy="25">成为一个整体，就像两个半圆合并成一个完整的圆。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The workers formed a union to protect their rights.
  </text>
  <text x="50" y="310" class="content">
    工人们组建了一个工会来保护他们的权利。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two half circles merging into one -->
    <path d="M 0 100 A 50 50 0 0 1 100 100" class="image" />
    <path d="M 100 100 A 50 50 0 0 1 200 100" class="image" />
    <path d="M 0 100 A 50 50 0 0 1 200 100" class="image" />
    <!-- Merged circle -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Text annotation -->
    <text x="100" y="200" class="content" text-anchor="middle">联合</text>
  </g>
</svg>