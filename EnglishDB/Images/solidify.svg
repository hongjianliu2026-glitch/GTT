<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">solidify</text>
  <text x="50" y="120" class="subtitle">[səˈlɪdɪfaɪ] v. 使固化，使坚固</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> solid (固体) + -ify (使...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个液体逐渐"固化(solidify)"成固体，
    <tspan x="50" dy="25">就像水变成了冰，变得坚固不可动摇。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mixture will solidify after it cools down.
  </text>
  <text x="50" y="310" class="content">
    混合物冷却后会固化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Liquid -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <!-- Solid -->
    <rect x="75" y="150" width="200" height="100" class="image" />
    <!-- Arrow -->
    <line x1="175" y1="100" x2="175" y2="250" class="image" />
    <polygon points="170,240 180,240 175,250" class="image" />
  </g>
</svg>