<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">issuer</text>
  <text x="50" y="120" class="subtitle">[ˈɪʃuːər] n. 发行者，发行机构</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> is- (走) + sue (跟随) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个发行者站在高台上，"走(is-)"
    <tspan x="50" dy="25">在前面，引领着一群人"跟随(sue)"，</tspan>
    <tspan x="50" dy="25">这些人就是他的"追随者(-er)"，</tspan>
    <tspan x="50" dy="25">他们共同构成了一个发行机构(issuer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The issuer of the bonds promised to pay back the investors.
  </text>
  <text x="50" y="330" class="content">
    债券的发行者承诺会偿还投资者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Issuer -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Followers -->
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="180" cy="100" r="15" class="image" />
    <circle cx="240" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="180" y1="115" x2="180" y2="150" class="image" />
    <line x1="240" y1="115" x2="240" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="180" y1="150" x2="160" y2="180" class="image" />
    <line x1="240" y1="150" x2="220" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="180" y1="150" x2="200" y2="180" class="image" />
    <line x1="240" y1="150" x2="260" y2="180" class="image" />
  </g>
</svg>