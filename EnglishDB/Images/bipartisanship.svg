<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bipartisanship</text>
  <text x="50" y="120" class="subtitle">[ˌbaɪˌpɑːrtɪˈzænʃɪp] n. 两党合作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (两个) + parti (党派) + -ship (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个党派的代表，"两个(bi-)"
    <tspan x="50" dy="25">党派(parti)"，手拉手合作，</tspan>
    <tspan x="50" dy="25">共同推动政策，这就是"两党合作(bipartisanship)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bill passed due to bipartisanship support.
  </text>
  <text x="50" y="310" class="content">
    该法案因两党合作支持而通过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two parties -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Hands joining -->
    <line x1="80" y1="130" x2="120" y2="130" class="image" />
    <!-- Policy document -->
    <rect x="50" y="160" width="150" height="80" class="image" />
    <line x1="60" y1="170" x2="190" y2="170" class="image" />
    <line x1="60" y1="190" x2="190" y2="190" class="image" />
    <line x1="60" y1="210" x2="190" y2="210" class="image" />
  </g>
</svg>