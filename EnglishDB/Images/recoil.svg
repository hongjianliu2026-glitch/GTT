<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recoil</text>
  <text x="50" y="120" class="subtitle">[rɪˈkɔɪl] v. 后退，退缩；n. 反冲，后坐力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + co- (共同) + il (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在开枪时，枪口"向后拉(re-co-il)"，
    <tspan x="50" dy="25">导致他身体不由自主地后退，这就是反冲(recoil)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hunter felt the recoil of the rifle.
  </text>
  <text x="50" y="310" class="content">
    猎人感受到了步枪的后坐力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gun -->
    <rect x="0" y="0" width="200" height="50" class="image" />
    <!-- Gun barrel -->
    <rect x="180" y="10" width="20" height="30" class="image" />
    <!-- Recoil effect -->
    <line x1="180" y1="25" x2="150" y2="25" class="image" />
    <line x1="150" y1="25" x2="140" y2="20" class="image" />
    <line x1="150" y1="25" x2="140" y2="30" class="image" />
    <!-- Hunter -->
    <circle cx="50" cy="25" r="15" class="image" />
    <line x1="50" y1="40" x2="50" y2="70" class="image" />
    <line x1="50" y1="70" x2="30" y2="100" class="image" />
    <line x1="50" y1="70" x2="70" y2="100" class="image" />
    <line x1="50" y1="55" x2="80" y2="45" class="image" />
  </g>
</svg>