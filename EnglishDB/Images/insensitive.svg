<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insensitive</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsɛnsətɪv] adj. 不敏感的，麻木的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + sens (感觉) + -itive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人戴着耳塞，"听不到(in-sens)"
    <tspan x="50" dy="25">周围的声音，完全麻木不仁(insensitive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was insensitive to her feelings and didn't notice her tears.
  </text>
  <text x="50" y="310" class="content">
    他对她的感受麻木不仁，没有注意到她的眼泪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with earplugs -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="40" y1="40" x2="30" y2="30" class="image" />
    <line x1="60" y1="40" x2="70" y2="30" class="image" />
    <line x1="40" y1="60" x2="30" y2="70" class="image" />
    <line x1="60" y1="60" x2="70" y2="70" class="image" />
    <!-- Earplugs -->
    <rect x="20" y="20" width="20" height="20" class="image" />
    <rect x="60" y="20" width="20" height="20" class="image" />
  </g>
</svg>