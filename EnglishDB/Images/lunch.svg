<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lunch</text>
  <text x="50" y="120" class="subtitle">[lʌntʃ] n. 午餐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lun (月亮) + ch (吃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在月亮升起的时候，"月亮下吃(lun-ch)"
    <tspan x="50" dy="25">一顿丰盛的午餐，享受美食的时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We usually have lunch at noon.
  </text>
  <text x="50" y="310" class="content">
    我们通常在中午吃午餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="50" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Plate -->
    <rect x="100" y="20" width="200" height="100" class="image" fill="#ECF0F1" />
    <!-- Food -->
    <circle cx="150" cy="70" r="15" class="image" fill="#E67E22" />
    <rect x="180" y="55" width="30" height="30" class="image" fill="#2ECC71" />
    <rect x="220" y="55" width="30" height="30" class="image" fill="#3498DB" />
  </g>
</svg>