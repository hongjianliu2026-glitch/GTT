<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #9B59B6; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grieve</text>
  <text x="50" y="120" class="subtitle">[ɡriːv] v. 感到悲痛，伤心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gri- (抓) + eve (离去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为失去亲人而"抓心(gri-eve)"，
    <tspan x="50" dy="25">心痛得无法自拔，这就是grieve的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She grieved for her lost pet for weeks.
  </text>
  <text x="50" y="310" class="content">
    她为失去的宠物伤心了好几周。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 C50,25 90,25 90,50 S130,75 130,50" class="image" />
    <!-- Hand reaching for the heart -->
    <line x1="100" y1="100" x2="130" y2="70" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <!-- Tears -->
    <circle cx="70" cy="120" r="10" class="image" />
    <circle cx="80" cy="140" r="10" class="image" />
    <circle cx="90" cy="160" r="10" class="image" />
  </g>
</svg>