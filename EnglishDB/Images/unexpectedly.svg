<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unexpectedly</text>
  <text x="50" y="120" class="subtitle">[ˌʌnɪkˈspektɪdli] adv. 出乎意料地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + expect (期望) + -ed (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在街上走着，突然"不期望(un-expect)"
    <tspan x="50" dy="25">地被一只巨大的气球砸中，这就是"出乎意料地(unexpectedly)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The surprise party was unexpectedly fun.
  </text>
  <text x="50" y="310" class="content">
    这个惊喜派对出乎意料地有趣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Balloon -->
    <ellipse cx="200" cy="50" rx="40" ry="60" class="image" />
    <line x1="200" y1="110" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />

    <!-- Shocked expression -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="65" cy="90" r="5" class="image" />
    <path d="M45 110 Q50 120 55 110" class="image" />
  </g>
</svg>