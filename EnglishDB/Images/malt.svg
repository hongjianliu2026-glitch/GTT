<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">malt</text>
  <text x="50" y="120" class="subtitle">[mɔlt] n. 麦芽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mal- (麦芽)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的麦芽工厂，"麦芽(mal-)"
    <tspan x="50" dy="25">像瀑布一样倾泻而下，形成了一个巨大的麦芽山(malt)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The brewery uses high-quality malt in its beer production.
  </text>
  <text x="50" y="310" class="content">
    这家酿酒厂在啤酒生产中使用高质量的麦芽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Malt factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Malt falling -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Malt pile -->
    <rect x="50" y="180" width="250" height="20" class="image" />
    <rect x="75" y="160" width="200" height="20" class="image" />
    <rect x="100" y="140" width="150" height="20" class="image" />
    <rect x="125" y="120" width="100" height="20" class="image" />
    <rect x="150" y="100" width="50" height="20" class="image" />
  </g>
</svg>