<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">regardless</text>
  <text x="50" y="120" class="subtitle">[rɪˈɡɑːrdləs] adv. 不顾，不管</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + gard (看) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路，"回头看(re-gard)"
    <tspan x="50" dy="25">但什么也没看到，因为他"不管(less)"周围的环境。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He walked home regardless of the rain.
  </text>
  <text x="50" y="310" class="content">
    他不顾雨天走回家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Rain drops -->
    <line x1="100" y1="80" x2="100" y2="100" class="image" />
    <line x1="120" y1="80" x2="120" y2="100" class="image" />
    <line x1="140" y1="80" x2="140" y2="100" class="image" />
    <line x1="160" y1="80" x2="160" y2="100" class="image" />
    <!-- Person looking back -->
    <line x1="50" y1="115" x2="20" y2="100" class="image" />
  </g>
</svg>