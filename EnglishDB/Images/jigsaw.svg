<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jigsaw</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɪɡsɔː] n. 拼图，线锯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jig (快速移动) + saw (锯)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠在快速移动(jig)的锯子(saw)下，
    <tspan x="50" dy="25">将木板切割成各种形状，这些形状最终拼成了一幅拼图(jigsaw)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent the afternoon assembling a jigsaw puzzle.
  </text>
  <text x="50" y="310" class="content">
    她花了一个下午的时间拼拼图。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jigsaw puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Saw -->
    <line x1="360" y1="60" x2="460" y2="60" class="image" />
    <line x1="410" y1="10" x2="410" y2="110" class="image" />
    <line x1="410" y1="60" x2="460" y2="10" class="image" />
    <line x1="410" y1="60" x2="460" y2="110" class="image" />
  </g>
</svg>