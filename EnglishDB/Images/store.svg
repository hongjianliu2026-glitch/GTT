<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">store</text>
  <text x="50" y="120" class="subtitle">[stɔːr] n. 商店，储存；v. 储存，储备</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stor (保持)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的仓库，里面堆满了各种物品，
    <tspan x="50" dy="25">"保持(stor)"着这些物品，这就是一个商店(store)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She went to the store to buy groceries.
  </text>
  <text x="50" y="310" class="content">
    她去商店买杂货。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warehouse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Shelves -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Items on shelves -->
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="130" cy="50" r="10" class="image" />
    <circle cx="160" cy="50" r="10" class="image" />
    <circle cx="190" cy="50" r="10" class="image" />
    <circle cx="220" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <circle cx="160" cy="80" r="10" class="image" />
    <circle cx="190" cy="80" r="10" class="image" />
    <circle cx="220" cy="80" r="10" class="image" />
    <circle cx="250" cy="80" r="10" class="image" />
    <circle cx="70" cy="110" r="10" class="image" />
    <circle cx="100" cy="110" r="10" class="image" />
    <circle cx="130" cy="110" r="10" class="image" />
    <circle cx="160" cy="110" r="10" class="image" />
    <circle cx="190" cy="110" r="10" class="image" />
    <circle cx="220" cy="110" r="10" class="image" />
    <circle cx="250" cy="110" r="10" class="image" />
    <circle cx="70" cy="140" r="10" class="image" />
    <circle cx="100" cy="140" r="10" class="image" />
    <circle cx="130" cy="140" r="10" class="image" />
    <circle cx="160" cy="140" r="10" class="image" />
    <circle cx="190" cy="140" r="10" class="image" />
    <circle cx="220" cy="140" r="10" class="image" />
    <circle cx="250" cy="140" r="10" class="image" />
  </g>
</svg>