<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">missile</text>
  <text x="50" y="120" class="subtitle">[ˈmɪsaɪl] n. 导弹，投射物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> miss (投掷) + -ile (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"投掷物(miss-ile)"从天而降，
    <tspan x="50" dy="25">它的速度和威力让人无法忽视，这就是导弹(missile)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The military launched a missile to intercept the incoming threat.
  </text>
  <text x="50" y="310" class="content">
    军方发射了一枚导弹以拦截来袭的威胁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Missile -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="350" y1="0" x2="320" y2="20" class="image" />
    <line x1="350" y1="0" x2="320" y2="-20" class="image" />
    <!-- Exhaust -->
    <line x1="350" y1="0" x2="370" y2="20" class="image" />
    <line x1="350" y1="0" x2="370" y2="-20" class="image" />
    <line x1="350" y1="0" x2="390" y2="40" class="image" />
    <line x1="350" y1="0" x2="390" y2="-40" class="image" />
  </g>
</svg>