<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perpendicular</text>
  <text x="50" y="120" class="subtitle">[ˌpɜːrpənˈdɪkjələr] adj. 垂直的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + pend (悬挂) + ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根完全悬挂(per-pend)的线，它与地面形成90度角，
    <tspan x="50" dy="25">这就是垂直(perpendicular)的定义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wall is perpendicular to the floor.
  </text>
  <text x="50" y="310" class="content">
    墙壁与地面垂直。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vertical line -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <!-- Horizontal line -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Right angle symbol -->
    <line x1="90" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="90" x2="100" y2="100" class="image" />
    <!-- Text annotation -->
    <text x="110" y="110" class="content">90°</text>
  </g>
</svg>