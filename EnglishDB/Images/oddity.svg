<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oddity</text>
  <text x="50" y="120" class="subtitle">[ˈɒdɪti] n. 怪异的事物，奇特的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> odd (奇怪的) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着奇装异服的人，"奇怪的(odd)"
    <tspan x="50" dy="25">外表让人一眼就能认出他的奇特(oddity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oddity of the situation made everyone laugh.
  </text>
  <text x="50" y="310" class="content">
    这个奇特的情景让大家笑了起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Strange person -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Strange clothes -->
    <rect x="20" y="130" width="60" height="50" class="image" /> <!-- Shirt -->
    <rect x="40" y="180" width="20" height="40" class="image" /> <!-- Pants -->
    <!-- Odd accessories -->
    <circle cx="50" cy="80" r="10" class="image" /> <!-- Hat -->
    <line x1="50" y1="220" x2="50" y2="250" class="image" /> <!-- Umbrella -->
  </g>
</svg>