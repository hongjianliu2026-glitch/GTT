<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">babe</text>
  <text x="50" y="120" class="subtitle">[beɪb] n. 宝贝，婴儿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bab (婴儿的咿呀声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个可爱的婴儿在摇篮里，发出"咿呀(bab)"的声音，
    <tspan x="50" dy="25">这个声音就是"babe"的来源，象征着纯真和可爱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She called her newborn baby a little babe.
  </text>
  <text x="50" y="310" class="content">
    她称她刚出生的宝宝为小宝贝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cradle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="300" y1="20" x2="300" y2="100" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Baby -->
    <circle cx="175" cy="60" r="20" class="image" />
    <line x1="175" y1="80" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="155" y2="160" class="image" />
    <line x1="175" y1="120" x2="195" y2="160" class="image" />
    <line x1="175" y1="100" x2="145" y2="90" class="image" />
    <line x1="175" y1="100" x2="205" y2="90" class="image" />
  </g>
</svg>