<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">daycare</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪkɛər] n. 日托，日间托儿所</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> day (白天) + care (照顾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温馨的日托中心，"白天(day)"
    <tspan x="50" dy="25">里，一群孩子在老师的"照顾(care)"下玩耍。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She takes her child to daycare every morning.
  </text>
  <text x="50" y="310" class="content">
    她每天早上都把孩子送到日托中心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Daycare center -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Children -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Teacher -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="80" x2="230" y2="70" class="image" />
    <!-- Playground -->
    <rect x="50" y="100" width="250" height="80" class="image" />
    <line x1="70" y1="120" x2="280" y2="120" class="image" />
    <line x1="70" y1="140" x2="250" y2="140" class="image" />
    <line x1="70" y1="160" x2="270" y2="160" class="image" />
  </g>
</svg>