<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unbelievable</text>
  <text x="50" y="120" class="subtitle">[ˌʌnbɪˈliːvəbl] adj. 难以置信的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + believe (相信) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到一只猫在弹钢琴，"不(un-)"
    <tspan x="50" dy="25">能相信(believe)这能发生，这就是难以置信的(unbelievable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's tricks were unbelievable.
  </text>
  <text x="50" y="310" class="content">
    魔术师的把戏令人难以置信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat playing piano -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Cat head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Cat body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Cat leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Cat leg -->
    <line x1="50" y1="130" x2="20" y2="120" class="image" /> <!-- Cat tail -->
    <line x1="50" y1="130" x2="80" y2="120" class="image" /> <!-- Cat tail -->
    <rect x="100" y="50" width="200" height="100" class="image" /> <!-- Piano -->
    <line x1="120" y1="70" x2="120" y2="130" class="image" /> <!-- Piano key -->
    <line x1="140" y1="70" x2="140" y2="130" class="image" /> <!-- Piano key -->
    <line x1="160" y1="70" x2="160" y2="130" class="image" /> <!-- Piano key -->
    <line x1="180" y1="70" x2="180" y2="130" class="image" /> <!-- Piano key -->
    <line x1="200" y1="70" x2="200" y2="130" class="image" /> <!-- Piano key -->
    <line x1="220" y1="70" x2="220" y2="130" class="image" /> <!-- Piano key -->
    <line x1="240" y1="70" x2="240" y2="130" class="image" /> <!-- Piano key -->
    <line x1="260" y1="70" x2="260" y2="130" class="image" /> <!-- Piano key -->
    <line x1="280" y1="70" x2="280" y2="130" class="image" /> <!-- Piano key -->
    <line x1="300" y1="70" x2="300" y2="130" class="image" /> <!-- Piano key -->
  </g>
</svg>