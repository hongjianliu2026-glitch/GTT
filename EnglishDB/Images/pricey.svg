<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pricey</text>
  <text x="50" y="120" class="subtitle">[ˈpraɪsi] adj. 昂贵的，价格高的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> price (价格) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个标价牌上写着"高价(pricey)"，
    <tspan x="50" dy="25">旁边有一个巨大的金币堆，象征着昂贵的价格。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new smartphone is quite pricey.
  </text>
  <text x="50" y="310" class="content">
    这款新智能手机相当昂贵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Price tag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <text x="20" y="50" class="content" fill="#E74C3C">高价</text>
    <!-- Gold coins -->
    <circle cx="200" cy="50" r="20" class="image" fill="#D4AF37" />
    <circle cx="240" cy="50" r="20" class="image" fill="#D4AF37" />
    <circle cx="280" cy="50" r="20" class="image" fill="#D4AF37" />
    <circle cx="220" cy="80" r="20" class="image" fill="#D4AF37" />
    <circle cx="260" cy="80" r="20" class="image" fill="#D4AF37" />
  </g>
</svg>