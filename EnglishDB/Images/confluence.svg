<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confluence</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnfluəns] n. 汇合，合流</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + flu (流) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两条河流"一起流动(con-flu)"，最终汇合在一起，形成一个壮观的合流点(confluence)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The confluence of the two rivers created a beautiful waterfall.
  </text>
  <text x="50" y="310" class="content">
    两条河流的汇合形成了一个美丽的瀑布。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- River 1 -->
    <path d="M0 100 Q100 50 200 100" class="image" />
    <!-- River 2 -->
    <path d="M0 200 Q100 150 200 200" class="image" />
    <!-- Confluence -->
    <path d="M200 100 Q250 150 300 100" class="image" />
    <path d="M200 200 Q250 150 300 200" class="image" />
    <!-- Waterfall -->
    <path d="M300 100 Q350 50 400 100" class="image" />
    <path d="M300 200 Q350 150 400 200" class="image" />
    <!-- Waterfall drop -->
    <path d="M400 100 Q450 150 500 100" class="image" />
    <path d="M400 200 Q450 150 500 200" class="image" />
  </g>
</svg>