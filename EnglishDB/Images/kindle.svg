<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kindle</text>
  <text x="50" y="120" class="subtitle">[ˈkɪndl] v. 点燃，激起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kin (燃烧) + dle (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个火柴在黑暗中被划燃，"点燃(kin-dle)"
    <tspan x="50" dy="25">了周围的空气，激起了温暖和光明。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The campfire kindled the children's imagination.
  </text>
  <text x="50" y="310" class="content">
    篝火点燃了孩子们的想象力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Matchstick -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="50" y1="20" x2="70" y2="40" class="image" />
    <line x1="50" y1="20" x2="30" y2="40" class="image" />
    <!-- Flame -->
    <polygon points="50,100 40,120 60,120" style="fill:#FF6347;stroke:#FF4500;stroke-width:2" />
    <polygon points="50,100 30,110 70,110" style="fill:#FF6347;stroke:#FF4500;stroke-width:2" />
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" style="fill:#2C3E50;opacity:0.5" />
  </g>
</svg>