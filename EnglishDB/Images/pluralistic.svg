<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pluralistic</text>
  <text x="50" y="120" class="subtitle">[ˌplʊərəˈlɪstɪk] adj. 多元主义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plu- (多) + -al (形容词后缀) + -istic (关于...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世界，"多种(plu-)"
    <tspan x="50" dy="25">不同的文化和思想和谐共存，这就是多元主义(pluralistic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city is known for its pluralistic society.
  </text>
  <text x="50" y="310" class="content">
    这座城市以其多元化的社会而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Multiple circles representing different cultures -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <circle cx="350" cy="100" r="30" class="image" />
    <!-- Connecting lines -->
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
    <line x1="280" y1="100" x2="320" y2="100" class="image" />
    <!-- Text labels -->
    <text x="40" y="160" class="content">文化1</text>
    <text x="140" y="160" class="content">文化2</text>
    <text x="240" y="160" class="content">文化3</text>
    <text x="340" y="160" class="content">文化4</text>
  </g>
</svg>