<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nervousness</text>
  <text x="50" y="120" class="subtitle">[ˈnɜːrvəsnəs] n. 紧张，神经质</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nerv (神经) + -ous (形容词后缀) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为紧张，神经(nerv)像被电击一样颤抖，
    <tspan x="50" dy="25">这种状态就是神经质(nervousness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The interviewer's questions made her feel nervousness.
  </text>
  <text x="50" y="310" class="content">
    面试官的问题让她感到紧张。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nervous person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Electric shock -->
    <line x1="50" y1="100" x2="50" y2="130" class="image" stroke-dasharray="5,5" />
    <line x1="40" y1="110" x2="60" y2="120" class="image" stroke-dasharray="5,5" />
    <line x1="45" y1="120" x2="55" y2="110" class="image" stroke-dasharray="5,5" />
  </g>
</svg>