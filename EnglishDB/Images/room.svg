<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">room</text>
  <text x="50" y="120" class="subtitle">[ruːm] n. 房间，空间；v. 居住，留宿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roo- (空间) + m (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的空间(roo-)，里面有各种家具和装饰，
    <tspan x="50" dy="25">这个空间就是一个房间(room)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decorated her new room with colorful paintings.
  </text>
  <text x="50" y="310" class="content">
    她用色彩鲜艳的画装饰了她的新房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Furniture -->
    <rect x="50" y="20" width="100" height="80" class="image" /> <!-- Bed -->
    <rect x="200" y="20" width="100" height="80" class="image" /> <!-- Desk -->
    <rect x="50" y="120" width="100" height="60" class="image" /> <!-- Chair -->
    <rect x="200" y="120" width="100" height="60" class="image" /> <!-- Bookshelf -->
    <!-- Decorations -->
    <circle cx="100" cy="160" r="10" class="image" /> <!-- Lamp -->
    <circle cx="250" cy="160" r="10" class="image" /> <!-- Plant -->
  </g>
</svg>