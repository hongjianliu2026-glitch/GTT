<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rationale</text>
  <text x="50" y="120" class="subtitle">[ˌræʃəˈnæl] n. 基本原理，理论基础</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ratio (理性) + -nale (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"理性地(ratio)"
    <tspan x="50" dy="25">解释(nale)实验结果，这就是他的理论基础(rationale)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rationale behind the new policy was explained in the meeting.
  </text>
  <text x="50" y="310" class="content">
    新政策的理论基础在会议上得到了解释。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Lab table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Beakers -->
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <circle cx="160" cy="60" r="10" class="image" />
    <!-- Flask -->
    <rect x="200" y="40" width="30" height="100" class="image" />
    <circle cx="215" cy="40" r="15" class="image" />
    <!-- Rational explanation -->
    <line x1="70" y1="100" x2="250" y2="100" class="image" />
    <line x1="70" y1="130" x2="250" y2="130" class="image" />
    <line x1="70" y1="160" x2="250" y2="160" class="image" />
  </g>
</svg>