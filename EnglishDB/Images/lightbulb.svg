<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lightbulb</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪtbʌlb] n. 电灯泡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> light (光) + bulb (球)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个灯泡突然亮起，"光(light)"
    <tspan x="50" dy="25">照亮了整个房间，这个"球(bulb)"</tspan>
    <tspan x="50" dy="25">就是电灯泡(lightbulb)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a lightbulb moment when she solved the problem.
  </text>
  <text x="50" y="310" class="content">
    她在解决问题时突然灵光一现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lightbulb -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="75" y1="175" x2="125" y2="175" class="image" />
    <line x1="75" y1="200" x2="125" y2="200" class="image" />
    <line x1="75" y1="225" x2="125" y2="225" class="image" />
    <!-- Light rays -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
    <line x1="75" y1="60" x2="50" y2="40" class="image" />
    <line x1="125" y1="60" x2="150" y2="40" class="image" />
    <line x1="50" y1="80" x2="25" y2="70" class="image" />
    <line x1="150" y1="80" x2="175" y2="70" class="image" />
  </g>
</svg>