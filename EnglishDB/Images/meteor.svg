<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meteor</text>
  <text x="50" y="120" class="subtitle">[ˈmiːtiər] n. 流星</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meta- (超越) + -eor (飞行物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗流星"超越(meta-)"地球大气层，
    <tspan x="50" dy="25">划过夜空，留下一道耀眼的光迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We saw a meteor streak across the sky last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚我们看见一颗流星划过天空。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Meteor -->
    <line x1="50" y1="20" x2="300" y2="180" class="image" stroke="#F1C40F" stroke-width="5" />
    <!-- Star -->
    <circle cx="100" cy="50" r="5" class="image" fill="#ECF0F1" />
    <circle cx="150" cy="70" r="5" class="image" fill="#ECF0F1" />
    <circle cx="200" cy="30" r="5" class="image" fill="#ECF0F1" />
    <circle cx="250" cy="90" r="5" class="image" fill="#ECF0F1" />
  </g>
</svg>