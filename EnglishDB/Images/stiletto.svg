<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stiletto</text>
  <text x="50" y="120" class="subtitle">[stɪˈletəʊ] n. 细高跟鞋，细长匕首</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stil (站立) + etto (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女人穿着"细长站立(stil-etto)"的
    <tspan x="50" dy="25">高跟鞋，优雅地走在红毯上，每一步都像一把细长的匕首(stiletto)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a pair of stilettos to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一双细高跟鞋去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stiletto heel -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="25" y2="300" class="image" />
    <line x1="50" y1="250" x2="75" y2="300" class="image" />
    <!-- Woman's leg -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="25" y2="300" class="image" />
    <line x1="50" y1="250" x2="75" y2="300" class="image" />
    <circle cx="50" cy="180" r="15" class="image" />
    <line x1="50" y1="195" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="25" y2="300" class="image" />
    <line x1="50" y1="250" x2="75" y2="300" class="image" />
  </g>
</svg>