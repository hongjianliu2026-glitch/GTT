<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delude</text>
  <text x="50" y="120" class="subtitle">[dɪˈluːd] v. 欺骗，迷惑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + lud (玩)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"玩弄(lud)"得"离开(de-)"了现实，
    <tspan x="50" dy="25">完全被欺骗(delude)了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was deluded into thinking he could win the lottery.
  </text>
  <text x="50" y="310" class="content">
    他被欺骗，以为自己能赢得彩票。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Cloud -->
    <ellipse cx="150" cy="80" rx="100" ry="50" class="image" />
    <!-- Lightning bolt -->
    <line x1="120" y1="100" x2="180" y2="60" class="image" />
    <line x1="180" y1="60" x2="140" y2="120" class="image" />
    <!-- Text in cloud -->
    <text x="100" y="90" class="content" style="font-size: 24px; fill: #E74C3C;">Win!</text>
  </g>
</svg>