<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ineligible</text>
  <text x="50" y="120" class="subtitle">[ˌɪnˈɛlɪdʒəbəl] adj. 不合格的，无资格的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + eligible (有资格的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的红色“X”标志前，表示他“没有资格(ineligible)”
    <tspan x="50" dy="25">参加某个活动或获得某种资格。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Due to his poor grades, he was deemed ineligible for the scholarship.
  </text>
  <text x="50" y="310" class="content">
    由于他的成绩不佳，他被认为没有资格获得奖学金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red "X" -->
    <line x1="50" y1="50" x2="300" y2="300" class="image" />
    <line x1="50" y1="300" x2="300" y2="50" class="image" />
    <!-- Person -->
    <circle cx="175" cy="175" r="30" class="image" />
    <line x1="175" y1="205" x2="175" y2="280" class="image" />
    <line x1="175" y1="280" x2="140" y2="320" class="image" />
    <line x1="175" y1="280" x2="210" y2="320" class="image" />
    <line x1="175" y1="230" x2="120" y2="220" class="image" />
    <line x1="175" y1="230" x2="230" y2="220" class="image" />
  </g>
</svg>