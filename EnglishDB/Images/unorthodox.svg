<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unorthodox</text>
  <text x="50" y="120" class="subtitle">[ʌnˈɔːrθədɑːks] adj. 非正统的，异端的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + orthodox (正统的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着奇装异服的人，"不(un-)"
    <tspan x="50" dy="25">遵循传统(orthodox)，他的行为和想法都与众不同。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His unorthodox teaching methods were highly effective.
  </text>
  <text x="50" y="310" class="content">
    他非正统的教学方法非常有效。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with unusual clothing -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <!-- Unusual clothing -->
    <rect x="20" y="120" width="60" height="60" class="image" />
    <line x1="20" y1="120" x2="80" y2="120" class="image" />
    <line x1="20" y1="180" x2="80" y2="180" class="image" />
    <line x1="20" y1="120" x2="20" y2="180" class="image" />
    <line x1="80" y1="120" x2="80" y2="180" class="image" />
  </g>
</svg>