<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bribe</text>
  <text x="50" y="120" class="subtitle">[braɪb] n. 贿赂；v. 贿赂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> br- (带来) + ibe (给予)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人偷偷地"带来(br-)"一袋金币，"给予(ibe)"
    <tspan x="50" dy="25">给官员，试图影响他的决定，这就是贿赂(bribe)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He tried to bribe the judge with money.
  </text>
  <text x="50" y="310" class="content">
    他试图用钱贿赂法官。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bag of coins -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <circle cx="20" cy="20" r="10" class="image" />
    <circle cx="50" cy="20" r="10" class="image" />
    <circle cx="80" cy="20" r="10" class="image" />
    <circle cx="110" cy="20" r="10" class="image" />
    <circle cx="20" cy="50" r="10" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />

    <!-- Person giving the bribe -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="90" x2="230" y2="80" class="image" />

    <!-- Judge receiving the bribe -->
    <circle cx="300" cy="50" r="20" class="image" />
    <line x1="300" y1="70" x2="300" y2="120" class="image" />
    <line x1="300" y1="120" x2="280" y2="150" class="image" />
    <line x1="300" y1="120" x2="320" y2="150" class="image" />
    <line x1="300" y1="90" x2="330" y2="80" class="image" />
    <line x1="300" y1="70" x2="250" y2="50" class="image" />
  </g>
</svg>