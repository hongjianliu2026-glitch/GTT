<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Shiite</text>
  <text x="50" y="120" class="subtitle">[ʃiːt] n. 什叶派教徒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Shi'a (什叶派) + -ite (表示“属于...的人”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个虔诚的什叶派教徒，"属于(ite)"
    <tspan x="50" dy="25">什叶派(Shi'a)，他们有着独特的宗教信仰和仪式。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Shiite community in the region is very devout.
  </text>
  <text x="50" y="310" class="content">
    该地区的什叶派社区非常虔诚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mosque -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Minaret -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <!-- Prayer rug -->
    <rect x="70" y="100" width="210" height="80" class="image" />
    <!-- Worshipper -->
    <circle cx="175" cy="140" r="15" class="image" />
    <line x1="175" y1="155" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="155" y2="220" class="image" />
    <line x1="175" y1="190" x2="195" y2="220" class="image" />
    <line x1="175" y1="170" x2="205" y2="160" class="image" />
  </g>
</svg>