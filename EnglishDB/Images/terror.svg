<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">terror</text>
  <text x="50" y="120" class="subtitle">[ˈterər] n. 恐怖，惊骇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> terr (地) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，脚下是深不见底的"地(terr)"，
    <tspan x="50" dy="25">这种"地"的深度让人感到极度的"恐怖(terror)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The horror movie filled the audience with terror.
  </text>
  <text x="50" y="310" class="content">
    那部恐怖电影让观众充满了恐惧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on the cliff -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Deep abyss -->
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="150" y1="200" x2="150" y2="250" class="image" />
    <line x1="200" y1="200" x2="200" y2="250" class="image" />
    <line x1="250" y1="200" x2="250" y2="250" class="image" />
    <line x1="300" y1="200" x2="300" y2="250" class="image" />
  </g>
</svg>