<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">box</text>
  <text x="50" y="120" class="subtitle">[bɒks] n. 盒子，箱子；v. 拳击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> box (源自拉丁语 "buxis"，意为“盒子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的盒子，里面装满了各种物品，
    <tspan x="50" dy="25">突然，这个盒子变成了一个拳击场，两个拳击手在里面激烈对战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She packed her clothes in a box before moving.
  </text>
  <text x="50" y="310" class="content">
    她在搬家前把衣服装进了箱子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Items in the box -->
    <circle cx="50" cy="50" r="10" class="image" />
    <rect x="80" y="40" width="30" height="30" class="image" />
    <line x1="120" y1="40" x2="150" y2="70" class="image" />
    <line x1="120" y1="70" x2="150" y2="40" class="image" />
    <!-- Boxing ring -->
    <rect x="0" y="160" width="200" height="100" class="image" />
    <!-- Boxers -->
    <circle cx="50" cy="210" r="15" class="image" />
    <line x1="50" y1="225" x2="50" y2="260" class="image" />
    <line x1="50" y1="260" x2="30" y2="290" class="image" />
    <line x1="50" y1="260" x2="70" y2="290" class="image" />
    <circle cx="150" cy="210" r="15" class="image" />
    <line x1="150" y1="225" x2="150" y2="260" class="image" />
    <line x1="150" y1="260" x2="130" y2="290" class="image" />
    <line x1="150" y1="260" x2="170" y2="290" class="image" />
  </g>
</svg>