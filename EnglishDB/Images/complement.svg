<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">complement</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmplɪmənt] n. 补充，补足物；v. 补充，补足</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + ple (填满) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"一起填满(com-ple-ment)"
    <tspan x="50" dy="25">食材，使得菜肴更加完美。这个过程就是补充(complement)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wine complements the meal perfectly.
  </text>
  <text x="50" y="310" class="content">
    这酒与餐食完美搭配。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Kitchen -->
    <rect x="50" y="20" width="300" height="200" class="image" />
    <!-- Ingredients -->
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <circle cx="160" cy="60" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <!-- Completed dish -->
    <rect x="240" y="50" width="50" height="50" class="image" />
    <line x1="240" y1="50" x2="290" y2="100" class="image" />
    <line x1="290" y1="100" x2="240" y2="150" class="image" />
    <line x1="240" y1="150" x2="290" y2="200" class="image" />
  </g>
</svg>