<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">viciously</text>
  <text x="50" y="120" class="subtitle">[ˈvɪʃəsli] adv. 恶毒地，凶残地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vic (生命) + ious (形容词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只凶猛的野兽，"生命(vic)"的力量被扭曲，
    <tspan x="50" dy="25">变得"恶毒(ious)"且"凶残(ly)"，这就是viciously的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog attacked viciously, leaving deep wounds.
  </text>
  <text x="50" y="310" class="content">
    那只狗凶残地攻击，留下了深深的伤口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wild beast -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Tail -->
    <!-- Fangs -->
    <line x1="35" y1="110" x2="45" y2="120" class="image" />
    <line x1="65" y1="110" x2="55" y2="120" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="90" r="5" fill="#E74C3C" />
    <circle cx="60" cy="90" r="5" fill="#E74C3C" />
  </g>
</svg>