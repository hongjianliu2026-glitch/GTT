<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">customary</text>
  <text x="50" y="120" class="subtitle">[ˈkʌstəməri] adj. 习惯的，惯例的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> custom (习惯) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小镇上，人们每天早上都会"习惯性地(customary)"
    <tspan x="50" dy="25">去同一个咖啡馆喝咖啡，这种习惯已经成为了他们的日常。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It is customary for them to gather at the café every morning.
  </text>
  <text x="50" y="310" class="content">
    他们习惯每天早上在咖啡馆集合。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee shop -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Coffee cup -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <!-- People -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="170" y2="120" class="image" />
    <circle cx="190" cy="100" r="15" class="image" />
    <line x1="190" y1="115" x2="190" y2="150" class="image" />
    <line x1="190" y1="150" x2="170" y2="180" class="image" />
    <line x1="190" y1="150" x2="210" y2="180" class="image" />
    <line x1="190" y1="130" x2="240" y2="120" class="image" />
  </g>
</svg>