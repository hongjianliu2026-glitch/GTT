<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">saturation</text>
  <text x="50" y="120" class="subtitle">[ˌsætʃəˈreɪʃn] n. 饱和，浸透</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> satur (充满) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家的调色板，"充满(satur)"
    <tspan x="50" dy="25">了各种颜色，达到了饱和(saturation)状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paint reached saturation after several hours.
  </text>
  <text x="50" y="310" class="content">
    几个小时后，颜料达到了饱和状态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Palette -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Colors -->
    <rect x="50" y="20" width="50" height="50" class="image" fill="#FF5733" />
    <rect x="120" y="20" width="50" height="50" class="image" fill="#33FF57" />
    <rect x="190" y="20" width="50" height="50" class="image" fill="#3357FF" />
    <rect x="260" y="20" width="50" height="50" class="image" fill="#FF33A6" />
    <rect x="50" y="90" width="50" height="50" class="image" fill="#A6FF33" />
    <rect x="120" y="90" width="50" height="50" class="image" fill="#33A6FF" />
    <rect x="190" y="90" width="50" height="50" class="image" fill="#FFA633" />
    <rect x="260" y="90" width="50" height="50" class="image" fill="#A633FF" />
  </g>
</svg>