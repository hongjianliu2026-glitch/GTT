<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hope</text>
  <text x="50" y="120" class="subtitle">[hoʊp] n. 希望；v. 希望</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hop (跳跃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在黑暗中，"跳跃(hop)"
    <tspan x="50" dy="25">向着光明，心中充满了希望(hope)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always hopes for the best in every situation.
  </text>
  <text x="50" y="310" class="content">
    她在每种情况下总是希望最好的结果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Light at the end of the tunnel -->
    <circle cx="300" cy="100" r="30" fill="#F1C40F" />
    <!-- Person jumping -->
    <circle cx="50" cy="150" r="15" fill="#2ECC71" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="30" y2="220" class="image" />
    <line x1="50" y1="190" x2="70" y2="220" class="image" />
    <line x1="50" y1="175" x2="80" y2="165" class="image" />
  </g>
</svg>