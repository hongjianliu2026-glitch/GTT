<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .shine { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gleaming</text>
  <text x="50" y="120" class="subtitle">[ˈɡliːmɪŋ] adj. 闪闪发光的，闪亮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gleam (闪光) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钻石，"闪闪发光(gleaming)"
    <tspan x="50" dy="25">在阳光下，光芒四射，令人目眩神迷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gleaming diamond sparkled under the light.
  </text>
  <text x="50" y="310" class="content">
    那颗闪闪发光的钻石在灯光下闪烁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diamond -->
    <polygon points="175,50 225,150 125,150" class="image" />
    <!-- Shine effect -->
    <circle cx="175" cy="100" r="50" class="shine" />
    <circle cx="175" cy="100" r="40" class="shine" />
    <circle cx="175" cy="100" r="30" class="shine" />
    <circle cx="175" cy="100" r="20" class="shine" />
    <circle cx="175" cy="100" r="10" class="shine" />
  </g>
</svg>