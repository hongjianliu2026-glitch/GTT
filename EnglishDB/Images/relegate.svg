<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relegate</text>
  <text x="50" y="120" class="subtitle">[ˈrelɪɡeɪt] v. 降级，贬低</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + leg (选择) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被"向后选择(re-leg-ate)"的人，
    <tspan x="50" dy="25">从高处被贬低到低处，就像从山顶被推到山谷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was relegated to a lower position after the scandal.
  </text>
  <text x="50" y="310" class="content">
    丑闻后他被降职到较低的职位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <line x1="0" y1="150" x2="150" y2="0" class="image" />
    <line x1="150" y1="0" x2="300" y2="150" class="image" />
    <!-- Person on top -->
    <circle cx="150" cy="20" r="15" class="image" />
    <line x1="150" y1="35" x2="150" y2="70" class="image" />
    <line x1="150" y1="70" x2="130" y2="100" class="image" />
    <line x1="150" y1="70" x2="170" y2="100" class="image" />
    <line x1="150" y1="50" x2="180" y2="40" class="image" />
    <!-- Person at bottom -->
    <circle cx="225" cy="135" r="15" class="image" />
    <line x1="225" y1="150" x2="225" y2="185" class="image" />
    <line x1="225" y1="185" x2="205" y2="215" class="image" />
    <line x1="225" y1="185" x2="245" y2="215" class="image" />
    <line x1="225" y1="165" x2="255" y2="155" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="70" x2="225" y2="135" class="image" />
    <polygon points="225,135 220,125 230,125" class="image" />
  </g>
</svg>