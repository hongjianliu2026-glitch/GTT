<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">embroidery</text>
  <text x="50" y="120" class="subtitle">[ɪmˈbrɔɪdəri] n. 刺绣，绣花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + broidery (编织)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位艺术家用针线"进入(en-)"布料，
    <tspan x="50" dy="25">编织(broidery)出美丽的图案，这就是刺绣(embroidery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent hours perfecting her embroidery skills.
  </text>
  <text x="50" y="310" class="content">
    她花了几个小时来完善她的刺绣技巧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fabric -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stitches -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Needle -->
    <line x1="20" y1="100" x2="40" y2="120" class="image" />
    <line x1="40" y1="120" x2="60" y2="100" class="image" />
    <!-- Thread -->
    <line x1="60" y1="100" x2="80" y2="120" class="image" />
    <line x1="80" y1="120" x2="100" y2="100" class="image" />
    <!-- Artist -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>