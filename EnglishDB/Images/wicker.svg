<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wicker</text>
  <text x="50" y="120" class="subtitle">[ˈwɪkər] n. 柳条，柳条制品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wick (柳条) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的柳条编织的篮子，里面装满了各种水果，
    <tspan x="50" dy="25">篮子由细长的柳条(wick)编织而成，这就是wicker(柳条制品)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a wicker basket for her picnic.
  </text>
  <text x="50" y="310" class="content">
    她为她的野餐买了一个柳条篮子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Wicker basket -->
    <path d="M50 50 Q100 20 150 50 T250 50 Q250 100 200 150 T100 150 Q50 100 50 50 Z" class="image" />
    <!-- Fruits -->
    <circle cx="100" cy="100" r="15" fill="#FFD700" />
    <circle cx="150" cy="120" r="15" fill="#FF6347" />
    <circle cx="200" cy="100" r="15" fill="#8B4513" />
  </g>
</svg>