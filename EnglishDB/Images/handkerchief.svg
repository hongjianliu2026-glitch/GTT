<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handkerchief</text>
  <text x="50" y="120" class="subtitle">[ˈhæŋkərtʃɪf] n. 手帕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + kerchief (覆盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手(hand)拿着一块布(kerchief)，
    <tspan x="50" dy="25">这块布可以用来擦汗或眼泪，就像手帕一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pulled out a handkerchief to wipe her tears.
  </text>
  <text x="50" y="310" class="content">
    她拿出一块手帕擦眼泪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <line x1="50" y1="150" x2="0" y2="140" class="image" />

    <!-- Handkerchief -->
    <rect x="20" y="20" width="60" height="60" class="image" />
    <line x1="20" y1="20" x2="80" y2="80" class="image" />
    <line x1="20" y1="80" x2="80" y2="20" class="image" />
  </g>
</svg>