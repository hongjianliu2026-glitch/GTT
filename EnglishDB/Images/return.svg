<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">return</text>
  <text x="50" y="120" class="subtitle">[rɪˈtɜːrn] v. 返回，归还；n. 返回，归还</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + turn (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅行者，"转回(re-turn)"
    <tspan x="50" dy="25">到出发的地方，这就是返回(return)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He will return home after the trip.
  </text>
  <text x="50" y="310" class="content">
    他旅行结束后会回家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path representing the return journey -->
    <path d="M50 100 Q150 50 250 100" class="image" />
    <path d="M250 100 Q350 150 450 100" class="image" />
    <!-- Traveler -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Home -->
    <rect x="430" y="80" width="40" height="40" class="image" />
    <line x1="450" y1="80" x2="450" y2="120" class="image" />
    <line x1="430" y1="100" x2="470" y2="100" class="image" />
  </g>
</svg>