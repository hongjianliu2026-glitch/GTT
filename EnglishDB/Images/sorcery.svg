<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sorcery</text>
  <text x="50" y="120" class="subtitle">[ˈsɔːrsəri] n. 巫术，魔法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sorc (巫师) + -ery (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巫师(sorc)在施展魔法，周围环绕着神秘的符文和光芒，这就是巫术(sorcery)的画面。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The villagers believed the old woman practiced sorcery.
  </text>
  <text x="50" y="310" class="content">
    村民们相信那个老妇人施展巫术。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sorcerer -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />

    <!-- Magic symbols -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <line x1="200" y1="100" x2="200" y2="170" class="image" />

    <!-- Light rays -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="50" y1="100" x2="200" y2="150" class="image" />
  </g>
</svg>