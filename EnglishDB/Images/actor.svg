<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">actor</text>
  <text x="50" y="120" class="subtitle">[ˈæktər] n. 演员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> act (行动) + -or (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演员在舞台上，"行动(act)"
    <tspan x="50" dy="25">并扮演各种角色，他就是演员(actor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The actor received critical acclaim for his performance.
  </text>
  <text x="50" y="310" class="content">
    这位演员因他的表演获得了广泛好评。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actor -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="145" y2="130" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Spotlight -->
    <line x1="175" y1="0" x2="175" y2="80" class="image" />
    <line x1="155" y1="20" x2="195" y2="20" class="image" />
    <line x1="145" y1="40" x2="205" y2="40" class="image" />
  </g>
</svg>