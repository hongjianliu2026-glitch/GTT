<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF3E0; }
      .title { font: bold 48px sans-serif; fill: #FFA726; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .orange { fill: #FFA500; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orange</text>
  <text x="50" y="120" class="subtitle">[ˈɒrɪndʒ] n. 橙子，橙色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ora (口) + ange (颜色)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个橙子，它的颜色(ange)就像太阳的光芒，
    <tspan x="50" dy="25">照亮了整个果园(ora)，这就是橙色(orange)的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She picked a ripe orange from the tree.
  </text>
  <text x="50" y="310" class="content">
    她从树上摘了一个成熟的橙子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Orange -->
    <circle cx="100" cy="100" r="60" class="orange" />
    <!-- Sun rays -->
    <line x1="100" y1="40" x2="100" y2="10" class="image" />
    <line x1="140" y1="60" x2="180" y2="20" class="image" />
    <line x1="160" y1="100" x2="200" y2="100" class="image" />
    <line x1="140" y1="140" x2="180" y2="180" class="image" />
    <line x1="100" y1="160" x2="100" y2="200" class="image" />
    <line x1="60" y1="140" x2="20" y2="180" class="image" />
    <line x1="40" y1="100" x2="0" y2="100" class="image" />
    <line x1="60" y1="60" x2="20" y2="20" class="image" />
  </g>
</svg>