<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dichotomy</text>
  <text x="50" y="120" class="subtitle">[daɪˈkɒtəmi] n. 二分法，对立</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (二) + chot (切) + -omy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把巨大的剪刀，"切开(chot)"
    <tspan x="50" dy="25">一个整体，分成两个完全对立的部分，这就是二分法(dichotomy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dichotomy between good and evil is a common theme in literature.
  </text>
  <text x="50" y="310" class="content">
    善恶对立是文学中常见的主题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scissors -->
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <line x1="0" y1="150" x2="150" y2="0" class="image" />
    <line x1="75" y1="75" x2="200" y2="75" class="image" />
    <!-- Two parts -->
    <rect x="220" y="0" width="100" height="150" class="image" />
    <rect x="340" y="0" width="100" height="150" class="image" />
    <!-- Labels -->
    <text x="230" y="170" class="content">Part 1</text>
    <text x="350" y="170" class="content">Part 2</text>
  </g>
</svg>