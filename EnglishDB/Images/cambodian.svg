<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Cambodian</text>
  <text x="50" y="120" class="subtitle">[ˌkæmˈboʊdiən] adj. 柬埔寨的；n. 柬埔寨人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Cambodia (柬埔寨) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着传统服饰的柬埔寨人，站在吴哥窟前，
    <tspan x="50" dy="25">背景是壮丽的寺庙和热带雨林，这就是"柬埔寨的(Cambodian)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Cambodian culture is rich in history and tradition.
  </text>
  <text x="50" y="310" class="content">
    柬埔寨文化历史悠久，传统丰富。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional Cambodian attire -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <circle cx="75" cy="50" r="30" class="image" />
    <line x1="75" y1="80" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="50" y2="180" class="image" />
    <line x1="75" y1="150" x2="100" y2="180" class="image" />
    <line x1="75" y1="120" x2="50" y2="110" class="image" />
    <line x1="75" y1="120" x2="100" y2="110" class="image" />

    <!-- Angkor Wat -->
    <rect x="160" y="0" width="200" height="200" class="image" />
    <rect x="170" y="20" width="180" height="160" class="image" />
    <line x1="180" y1="50" x2="340" y2="50" class="image" />
    <line x1="180" y1="80" x2="320" y2="80" class="image" />
    <line x1="180" y1="110" x2="340" y2="110" class="image" />
    <line x1="180" y1="140" x2="320" y2="140" class="image" />
  </g>
</svg>