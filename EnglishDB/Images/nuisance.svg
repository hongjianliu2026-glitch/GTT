<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nuisance</text>
  <text x="50" y="120" class="subtitle">[ˈnjuːsəns] n. 讨厌的人或事物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nui- (来自拉丁语 "nocere"，意为伤害) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调皮的小孩在房间里捣乱，"伤害(nui-)"
    <tspan x="50" dy="25">了大家的安宁，这个小孩就成了一个讨厌的人(nuisance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loud music next door is such a nuisance.
  </text>
  <text x="50" y="310" class="content">
    隔壁的吵闹音乐真是讨厌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Child -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Mess -->
    <line x1="100" y1="50" x2="150" y2="150" class="image" />
    <line x1="150" y1="50" x2="200" y2="150" class="image" />
    <line x1="200" y1="50" x2="250" y2="150" class="image" />
    <line x1="250" y1="50" x2="300" y2="150" class="image" />
    <!-- Annoyed face -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="290" y1="90" x2="310" y2="90" class="image" />
    <line x1="290" y1="110" x2="310" y2="110" class="image" />
    <line x1="295" y1="115" x2="305" y2="115" class="image" />
  </g>
</svg>