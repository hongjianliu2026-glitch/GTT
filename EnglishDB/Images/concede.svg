<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concede</text>
  <text x="50" y="120" class="subtitle">[kənˈsiːd] v. 承认，让步</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + cede (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在争论，其中一个人"共同走开(con-cede)"，
    <tspan x="50" dy="25">表示他承认对方的观点，这就是让步(concede)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He finally conceded that he was wrong.
  </text>
  <text x="50" y="310" class="content">
    他最终承认自己错了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Arrows -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="130" y1="100" x2="130" y2="80" class="image" />
    <line x1="130" y1="80" x2="150" y2="80" class="image" />
    <!-- Speech bubbles -->
    <rect x="20" y="50" width="60" height="30" class="image" />
    <rect x="120" y="50" width="60" height="30" class="image" />
    <!-- Text in speech bubbles -->
    <text x="30" y="70" class="content">I'm</text>
    <text x="30" y="90" class="content">right</text>
    <text x="130" y="70" class="content">You're</text>
    <text x="130" y="90" class="content">wrong</text>
  </g>
</svg>