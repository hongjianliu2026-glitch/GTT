<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overtake</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈteɪk] v. 追上，超过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + take (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在另一辆车上面，"在上面拿走(over-take)"
    <tspan x="50" dy="25">领先的位置，这就是追上并超过(overtake)的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The racer managed to overtake his opponent in the final lap.
  </text>
  <text x="50" y="310" class="content">
    赛车手在最后一圈成功超过了对手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- First car -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <!-- Second car overtaking -->
    <rect x="120" y="20" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
    <circle cx="190" cy="70" r="10" class="image" />
    <circle cx="260" cy="70" r="10" class="image" />
  </g>
</svg>