<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">precipitation</text>
  <text x="50" y="120" class="subtitle">[prɪˌsɪpɪˈteɪʃən] n. 降水，沉淀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + cip (落下) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象天空中突然"提前落下(pre-cip)"
    <tspan x="50" dy="25">无数的水滴，这些水滴汇聚成了一场大雨(precipitation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heavy precipitation caused flooding in the city.
  </text>
  <text x="50" y="310" class="content">
    大雨导致了城市的洪水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Rain drops -->
    <line x1="70" y1="120" x2="70" y2="180" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="130" y1="120" x2="130" y2="180" class="image" />
    <line x1="160" y1="120" x2="160" y2="180" class="image" />
    <line x1="190" y1="120" x2="190" y2="180" class="image" />
    <line x1="220" y1="120" x2="220" y2="180" class="image" />
    <!-- Ground -->
    <rect x="0" y="180" width="300" height="20" class="image" />
  </g>
</svg>