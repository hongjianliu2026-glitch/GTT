<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #FF4500; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tangy</text>
  <text x="50" y="120" class="subtitle">[ˈtændʒi] adj. 有强烈味道的，刺激的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tang (接触) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个柠檬，当你"接触(tang)"到它时，
    <tspan x="50" dy="25">强烈的酸味(tangy)立刻刺激你的味蕾。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lemonade had a tangy flavor that woke up my taste buds.
  </text>
  <text x="50" y="310" class="content">
    柠檬水的强烈味道唤醒了我的味蕾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lemon -->
    <circle cx="100" cy="100" r="50" fill="#FFD700" stroke="#8B8B00" stroke-width="3" />
    <!-- Pucker face -->
    <circle cx="150" cy="150" r="30" fill="#FF6347" stroke="#8B3626" stroke-width="3" />
    <circle cx="140" cy="140" r="5" fill="#000000" />
    <circle cx="160" cy="140" r="5" fill="#000000" />
    <path d="M140 160 Q150 180 160 160" stroke="#000000" stroke-width="2" fill="none" />
  </g>
</svg>