<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">finding</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪndɪŋ] n. 发现，调查结果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> find (找到) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探在森林中，"找到(find)"
    <tspan x="50" dy="25">一个隐藏的宝藏，这个宝藏就是他的发现(finding)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The finding of the study surprised everyone.
  </text>
  <text x="50" y="310" class="content">
    这项研究的发现让所有人都感到惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="50" class="image" />
    <line x1="300" y1="50" x2="350" y2="100" class="image" />
    <!-- Detective -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
    <!-- Treasure -->
    <rect x="200" y="120" width="50" height="50" class="image" />
    <line x1="200" y1="120" x2="250" y2="170" class="image" />
    <line x1="250" y1="120" x2="200" y2="170" class="image" />
  </g>
</svg>