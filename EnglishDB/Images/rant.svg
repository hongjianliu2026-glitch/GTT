<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rant</text>
  <text x="50" y="120" class="subtitle">[rænt] v. 咆哮，怒骂；n. 长篇大论</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ran- (跑) + -t (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在街头，"跑着(ran-)"
    <tspan x="50" dy="25">大声咆哮(rant)，声音如雷贯耳。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He ranted about the unfair treatment he received.
  </text>
  <text x="50" y="310" class="content">
    他咆哮着抱怨自己受到的不公平待遇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person shouting -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Sound waves -->
    <path d="M100,100 C120,80 160,80 180,100" class="image" />
    <path d="M100,120 C120,100 160,100 180,120" class="image" />
    <path d="M100,140 C120,120 160,120 180,140" class="image" />
  </g>
</svg>