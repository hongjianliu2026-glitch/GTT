<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disgust</text>
  <text x="50" y="120" class="subtitle">[dɪsˈɡʌst] n. 厌恶，反感；v. 使厌恶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + gust (味道)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闻到一种"不好的味道(dis-gust)"，
    <tspan x="50" dy="25">他的表情立刻变得厌恶(disgust)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smell of rotten food filled her with disgust.
  </text>
  <text x="50" y="310" class="content">
    腐烂食物的气味让她感到厌恶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <!-- Eyes -->
    <circle cx="35" cy="40" r="5" class="image" />
    <circle cx="65" cy="40" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 30 70 Q 50 80 70 70" class="image" />
    <!-- Smell -->
    <line x1="50" y1="90" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <!-- Rotten food -->
    <rect x="100" y="20" width="100" height="100" class="image" />
    <line x1="120" y1="40" x2="180" y2="40" class="image" />
    <line x1="120" y1="60" x2="180" y2="60" class="image" />
    <line x1="120" y1="80" x2="180" y2="80" class="image" />
  </g>
</svg>