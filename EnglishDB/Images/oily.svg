<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oily</text>
  <text x="50" y="120" class="subtitle">[ˈɔɪli] adj. 油的，油腻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oil (油) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个油腻的厨房，到处都是油滴，
    <tspan x="50" dy="25">连空气都变得"油腻(oily)"起来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pan was so oily that it was hard to clean.
  </text>
  <text x="50" y="310" class="content">
    锅太油腻了，很难清洗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Oil drops -->
    <circle cx="50" cy="50" r="20" class="image" fill="#F1C40F" />
    <circle cx="100" cy="70" r="15" class="image" fill="#F1C40F" />
    <circle cx="150" cy="60" r="25" class="image" fill="#F1C40F" />
    <circle cx="200" cy="80" r="18" class="image" fill="#F1C40F" />
    <circle cx="250" cy="55" r="22" class="image" fill="#F1C40F" />
    <!-- Kitchen counter -->
    <rect x="0" y="100" width="350" height="50" class="image" fill="#D5DBDB" />
    <!-- Pan -->
    <rect x="150" y="110" width="100" height="30" class="image" fill="#85929E" />
  </g>
</svg>