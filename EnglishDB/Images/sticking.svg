<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sticking</text>
  <text x="50" y="120" class="subtitle">[ˈstɪkɪŋ] adj. 粘的，粘性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stick (粘住) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手伸进一罐蜂蜜里，"粘住(stick)"
    <tspan x="50" dy="25">了蜂蜜，手上全是粘粘的蜂蜜(sticking)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The glue made the paper sticking to my fingers.
  </text>
  <text x="50" y="310" class="content">
    胶水让纸粘在了我的手指上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Honey jar -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <circle cx="75" cy="100" r="50" class="image" />
    <!-- Hand -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="180" y2="130" class="image" />
    <line x1="200" y1="150" x2="220" y2="130" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <!-- Honey on hand -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="210" cy="110" r="5" class="image" />
    <circle cx="190" cy="110" r="5" class="image" />
  </g>
</svg>