<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sheep</text>
  <text x="50" y="120" class="subtitle">[ʃiːp] n. 羊，绵羊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *skēpā (羊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群绵羊在绿色的山坡上悠闲地吃草，
    <tspan x="50" dy="25">它们温顺而可爱，就像一群"羊(sheep)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shepherd watched over his flock of sheep.
  </text>
  <text x="50" y="310" class="content">
    牧羊人看护着他的羊群。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Green hill -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2ECC71" />
    <!-- Sheep -->
    <circle cx="50" cy="100" r="20" class="image" fill="#FFFFFF" />
    <circle cx="100" cy="100" r="20" class="image" fill="#FFFFFF" />
    <circle cx="150" cy="100" r="20" class="image" fill="#FFFFFF" />
    <circle cx="200" cy="100" r="20" class="image" fill="#FFFFFF" />
    <circle cx="250" cy="100" r="20" class="image" fill="#FFFFFF" />
    <!-- Legs -->
    <line x1="40" y1="120" x2="40" y2="140" class="image" />
    <line x1="60" y1="120" x2="60" y2="140" class="image" />
    <line x1="90" y1="120" x2="90" y2="140" class="image" />
    <line x1="110" y1="120" x2="110" y2="140" class="image" />
    <line x1="140" y1="120" x2="140" y2="140" class="image" />
    <line x1="160" y1="120" x2="160" y2="140" class="image" />
    <line x1="190" y1="120" x2="190" y2="140" class="image" />
    <line x1="210" y1="120" x2="210" y2="140" class="image" />
    <line x1="240" y1="120" x2="240" y2="140" class="image" />
    <line x1="260" y1="120" x2="260" y2="140" class="image" />
  </g>
</svg>