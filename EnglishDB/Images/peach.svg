<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FF8C00; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .peach { fill: #FFDAB9; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peach</text>
  <text x="50" y="120" class="subtitle">[piːtʃ] n. 桃子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 peche，源自拉丁语 persica，意为“波斯果”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的桃子从天而降，砸在了一个人的头上，
    <tspan x="50" dy="25">那个人惊讶地喊道：“哇，好大一个桃子(peach)！”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She picked a ripe peach from the tree.
  </text>
  <text x="50" y="310" class="content">
    她从树上摘了一个成熟的桃子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Peach -->
    <ellipse cx="100" cy="100" rx="80" ry="60" class="peach" />
    <circle cx="100" cy="80" r="10" class="peach" />
    <circle cx="120" cy="110" r="10" class="peach" />
    <circle cx="80" cy="110" r="10" class="peach" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <line x1="200" y1="140" x2="160" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M220,80 Q260,80 260,100 Q260,120 220,120 Q180,120 180,100 Q180,80 220,80" class="image" />
    <text x="200" y="105" class="content" text-anchor="middle">Wow!</text>
  </g>
</svg>