<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ever-changing</text>
  <text x="50" y="120" class="subtitle">[ˈɛvər tʃeɪndʒɪŋ] adj. 不断变化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ever (永远) + change (变化)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个永远在变化的场景，就像一个不停旋转的万花筒，
    <tspan x="50" dy="25">每一刻都有新的图案出现，这就是"不断变化的(ever-changing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ever-changing landscape of technology keeps us on our toes.
  </text>
  <text x="50" y="310" class="content">
    不断变化的技术景观让我们时刻保持警觉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kaleidoscope -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="130" y1="40" x2="220" y2="160" class="image" />
    <line x1="220" y1="40" x2="130" y2="160" class="image" />
    <!-- Rotating effect -->
    <circle cx="175" cy="100" r="5" class="image" fill="#E74C3C" />
    <line x1="175" y1="100" x2="175" y2="20" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="100" x2="250" y2="100" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="100" x2="220" y2="160" class="image" stroke-dasharray="5,5" />
  </g>
</svg>