<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">precondition</text>
  <text x="50" y="120" class="subtitle">[ˌpriːkənˈdɪʃn] n. 前提，先决条件</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + condition (条件)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门，门前有一个"提前(pre-)"放置的
    <tspan x="50" dy="25">条件标志(condition)，只有满足这个条件，门才会打开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Having a good education is a precondition for success.
  </text>
  <text x="50" y="310" class="content">
    接受良好的教育是成功的先决条件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Condition sign -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <text x="60" y="50" class="content">Condition</text>
    <!-- Arrow pointing to the door -->
    <line x1="175" y1="70" x2="175" y2="150" class="image" />
    <polygon points="170,150 180,150 175,160" class="image" />
  </g>
</svg>