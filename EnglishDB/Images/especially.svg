<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">especially</text>
  <text x="50" y="120" class="subtitle">[ɪˈspɛʃəli] adv. 特别，尤其</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> es- (出) + pecial (特别的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头从人群中"突出(es-)"，
    <tspan x="50" dy="25">指向一个特别的人或事物，这就是"尤其(especially)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves chocolate, especially dark chocolate.
  </text>
  <text x="50" y="310" class="content">
    她喜欢巧克力，尤其是黑巧克力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow pointing to a person -->
    <line x1="0" y1="0" x2="200" y2="150" class="image" />
    <polygon points="200,150 180,130 180,170" class="image" />
    <!-- Person -->
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="250" y1="170" x2="250" y2="220" class="image" />
    <line x1="250" y1="220" x2="230" y2="250" class="image" />
    <line x1="250" y1="220" x2="270" y2="250" class="image" />
    <line x1="250" y1="190" x2="220" y2="180" class="image" />
    <line x1="250" y1="190" x2="280" y2="180" class="image" />
  </g>
</svg>