<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">onlooker</text>
  <text x="50" y="120" class="subtitle">[ˈɒnlʊkə(r)] n. 旁观者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> on- (在...上) + look (看) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个站在高处的人，"在上面看着(on-look-er)"
    <tspan x="50" dy="25">下面发生的事情，这个人就是旁观者(onlooker)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The onlookers watched the parade with great interest.
  </text>
  <text x="50" y="310" class="content">
    旁观者们饶有兴趣地观看着游行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person on a higher platform -->
    <rect x="100" y="0" width="100" height="50" class="image" />
    <circle cx="150" cy="70" r="20" class="image" />
    <line x1="150" y1="90" x2="150" y2="140" class="image" />
    <line x1="150" y1="140" x2="130" y2="170" class="image" />
    <line x1="150" y1="140" x2="170" y2="170" class="image" />
    <line x1="150" y1="110" x2="120" y2="100" class="image" />
    <line x1="150" y1="110" x2="180" y2="100" class="image" />
    <!-- Looking down -->
    <line x1="150" y1="70" x2="150" y2="10" class="image" />
    <line x1="150" y1="10" x2="130" y2="30" class="image" />
    <line x1="150" y1="10" x2="170" y2="30" class="image" />
  </g>
</svg>