<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">offspring</text>
  <text x="50" y="120" class="subtitle">[ˈɔːfsprɪŋ] n. 后代，子女</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> off- (离开) + spring (跳跃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小兔子从母兔的怀里"跳跃(spring)"出来，
    <tspan x="50" dy="25">这就是它的"后代(offspring)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer's offspring are all grown up now.
  </text>
  <text x="50" y="310" class="content">
    农夫的子女现在都长大了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mother rabbit -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="130" class="image" />
    <line x1="100" y1="150" x2="130" y2="130" class="image" />
    <line x1="100" y1="180" x2="70" y2="210" class="image" />
    <line x1="100" y1="180" x2="130" y2="210" class="image" />

    <!-- Offspring rabbit -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="150" class="image" />
    <line x1="200" y1="135" x2="180" y2="120" class="image" />
    <line x1="200" y1="135" x2="220" y2="120" class="image" />
    <line x1="200" y1="150" x2="180" y2="170" class="image" />
    <line x1="200" y1="150" x2="220" y2="170" class="image" />

    <!-- Jump action -->
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="280" y2="100" class="image" />
  </g>
</svg>