<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bigot</text>
  <text x="50" y="120" class="subtitle">[ˈbɪɡət] n. 偏执的人，顽固者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (二) + got (上帝)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个偏执的人，他只相信"两个(bi-)"东西：他自己和"上帝(got)"，
    <tspan x="50" dy="25">其他一切都不屑一顾，这就是一个bigot。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was a bigot who refused to listen to any opinions different from his own.
  </text>
  <text x="50" y="310" class="content">
    他是一个顽固的人，拒绝听取任何与自己不同的意见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Cross -->
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <!-- Speech bubble -->
    <path d="M250,50 Q300,70 300,120 Q250,140 250,170" class="image" />
    <text x="260" y="110" class="content">I & God</text>
  </g>
</svg>