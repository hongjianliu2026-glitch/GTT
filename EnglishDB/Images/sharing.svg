<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sharing</text>
  <text x="50" y="120" class="subtitle">[ˈʃɛrɪŋ] n. 分享，共享</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> share (分享) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"分享(share)"
    <tspan x="50" dy="25">他们的食物和故事，这种行为就是共享(sharing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The community organizes regular sharing sessions.
  </text>
  <text x="50" y="310" class="content">
    社区定期组织分享会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Table -->
    <rect x="20" y="120" width="260" height="50" class="image" />
    <!-- Food -->
    <circle cx="80" cy="145" r="10" class="image" />
    <circle cx="180" cy="145" r="10" class="image" />
    <circle cx="280" cy="145" r="10" class="image" />
    <!-- Sharing gesture -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
  </g>
</svg>