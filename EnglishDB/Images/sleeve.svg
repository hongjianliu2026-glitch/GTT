<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sleeve</text>
  <text x="50" y="120" class="subtitle">[sliːv] n. 袖子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sleev (源自中古英语，意为“袖子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件衣服的袖子(sleeve)，它像一条长长的管道，
    <tspan x="50" dy="25">包裹着你的手臂，让你在寒冷的冬天保持温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She rolled up the sleeves of her sweater.
  </text>
  <text x="50" y="310" class="content">
    她卷起了毛衣的袖子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Shirt body -->
    <rect x="0" y="0" width="200" height="250" class="image" />
    <!-- Sleeves -->
    <rect x="20" y="0" width="40" height="200" class="image" />
    <rect x="140" y="0" width="40" height="200" class="image" />
    <!-- Arm -->
    <circle cx="40" cy="220" r="20" class="image" />
    <circle cx="160" cy="220" r="20" class="image" />
  </g>
</svg>