<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Cuban</text>
  <text x="50" y="120" class="subtitle">[ˈkjuːbən] adj. 古巴的；n. 古巴人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Cuba (古巴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热情的古巴人，戴着宽边帽，
    <tspan x="50" dy="25">在阳光明媚的海滩上跳着Salsa舞，这就是Cuban的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Cuban music is very lively and energetic.
  </text>
  <text x="50" y="310" class="content">
    古巴音乐非常活泼和充满活力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Beach -->
    <rect x="0" y="150" width="350" height="100" fill="#3498DB" />
    <!-- Person -->
    <circle cx="100" cy="180" r="20" fill="#E74C3C" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
    <line x1="100" y1="220" x2="70" y2="210" class="image" />
    <line x1="100" y1="220" x2="130" y2="210" class="image" />
    <!-- Hat -->
    <path d="M70 160 Q100 140 130 160" fill="#2C3E50" />
  </g>
</svg>