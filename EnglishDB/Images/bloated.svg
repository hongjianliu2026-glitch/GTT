<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bloated</text>
  <text x="50" y="120" class="subtitle">[ˈbloʊtɪd] adj. 臃肿的，膨胀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bloat (膨胀) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球被吹得"膨胀(bloat)"到极限，
    <tspan x="50" dy="25">表面变得光滑且紧绷，这就是"臃肿的(bloated)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The software became bloated with unnecessary features.
  </text>
  <text x="50" y="310" class="content">
    软件因不必要的功能而变得臃肿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Inflated surface -->
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="60" y1="60" x2="140" y2="140" class="image" />
    <line x1="60" y1="140" x2="140" y2="60" class="image" />
    <!-- String -->
    <line x1="100" y1="180" x2="100" y2="220" class="image" />
  </g>
</svg>