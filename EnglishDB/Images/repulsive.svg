<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">repulsive</text>
  <text x="50" y="120" class="subtitle">[rɪˈpʌlsɪv] adj. 令人厌恶的，排斥的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + puls (推) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个令人作呕的场景，"向后推开(re-puls)"
    <tspan x="50" dy="25">所有靠近的东西，这种感觉就是repulsive。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smell of rotten eggs is repulsive.
  </text>
  <text x="50" y="310" class="content">
    腐烂的鸡蛋气味令人作呕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face with disgusted expression -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="80" cy="80" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <line x1="100" y1="140" x2="100" y2="150" class="image" />
    <!-- Hand pushing away -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="140" y2="90" class="image" />
    <line x1="150" y1="100" x2="140" y2="110" class="image" />
  </g>
</svg>