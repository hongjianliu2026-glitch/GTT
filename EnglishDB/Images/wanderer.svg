<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wanderer</text>
  <text x="50" y="120" class="subtitle">[ˈwɒndərə(r)] n. 流浪者，漫游者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wander (漫游) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个流浪者，背着行囊，"漫游(wander)"在无尽的
    <tspan x="50" dy="25">道路上，寻找着未知的冒险和故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wanderer traveled across the vast desert.
  </text>
  <text x="50" y="310" class="content">
    流浪者穿越了广阔的沙漠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path -->
    <path d="M0 100 Q 100 50 200 100 T 400 100" class="image" />
    <!-- Wanderer -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Backpack -->
    <rect x="30" y="150" width="40" height="20" class="image" />
    <!-- Road -->
    <line x1="0" y1="190" x2="400" y2="190" class="image" />
  </g>
</svg>