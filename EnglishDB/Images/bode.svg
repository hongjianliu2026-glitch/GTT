<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bode</text>
  <text x="50" y="120" class="subtitle">[boʊd] v. 预示，预兆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bo- (来自古英语 "bōd"，意为 "告知")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的预言家，手持水晶球，"告知(bo-)"
    <tspan x="50" dy="25">未来即将发生的事情，这就是预兆(bode)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dark clouds bode rain.
  </text>
  <text x="50" y="310" class="content">
    乌云预示着要下雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crystal ball -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Prophet -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Future scene -->
    <line x1="160" y1="80" x2="200" y2="80" class="image" />
    <line x1="160" y1="100" x2="200" y2="100" class="image" />
    <line x1="160" y1="120" x2="200" y2="120" class="image" />
    <line x1="160" y1="140" x2="200" y2="140" class="image" />
  </g>
</svg>