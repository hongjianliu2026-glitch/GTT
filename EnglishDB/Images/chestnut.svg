<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .chestnut { fill: #D35400; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chestnut</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɛsnʌt] n. 栗子，栗树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chest (胸部) + nut (坚果)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的栗子从天而降，"砸在(chest)"
    <tspan x="50" dy="25">一个人的胸口上，这个人被栗子(chestnut)砸得喘不过气来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She roasted a bag of chestnuts over an open fire.
  </text>
  <text x="50" y="310" class="content">
    她在篝火上烤了一袋栗子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chestnut -->
    <circle cx="100" cy="100" r="50" class="chestnut" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="180" y2="130" class="image" />
    <line x1="200" y1="150" x2="220" y2="130" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <!-- Chest -->
    <rect x="180" y="120" width="40" height="30" class="image" />
    <!-- Impact -->
    <line x1="100" y1="100" x2="180" y2="135" class="image" />
  </g>
</svg>