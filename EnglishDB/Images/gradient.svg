<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .gradient { fill: url(#gradient-fill); }
    </style>
    <linearGradient id="gradient-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:red;stop-opacity:1" />
      <stop offset="50%" style="stop-color:yellow;stop-opacity:1" />
      <stop offset="100%" style="stop-color:blue;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gradient</text>
  <text x="50" y="120" class="subtitle">[ˈɡreɪdiənt] n. 梯度，渐变</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grad (走) + -ient (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家在画布上"逐渐行走(grad-ient)"，
    <tspan x="50" dy="25">颜色从红色逐渐变为蓝色，形成了一个渐变(gradient)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The designer used a gradient to make the logo more dynamic.
  </text>
  <text x="50" y="310" class="content">
    设计师使用渐变使标志更具动感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gradient rectangle -->
    <rect x="50" y="20" width="250" height="160" class="gradient" />
    <!-- Paintbrush -->
    <line x1="320" y1="100" x2="350" y2="100" class="image" />
    <line x1="350" y1="100" x2="340" y2="90" class="image" />
    <line x1="350" y1="100" x2="340" y2="110" class="image" />
  </g>
</svg>