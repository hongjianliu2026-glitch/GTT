<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">canon</text>
  <text x="50" y="120" class="subtitle">[ˈkænən] n. 教规，准则；大炮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> can (容器) + -on (大)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的容器(can)，里面装满了教规(canon)，
    <tspan x="50" dy="25">或者是一门大炮(canon)，威力无比，象征着权威和力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The canon of the church is strict.
  </text>
  <text x="50" y="310" class="content">
    教会的教规很严格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large container -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Cannon -->
    <rect x="220" y="50" width="150" height="50" class="image" />
    <rect x="220" y="100" width="100" height="50" class="image" />
    <circle cx="370" cy="125" r="25" class="image" />
    <!-- Symbols inside container -->
    <line x1="20" y1="20" x2="180" y2="130" class="image" />
    <line x1="20" y1="130" x2="180" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="130" class="image" />
  </g>
</svg>