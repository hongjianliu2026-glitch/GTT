<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Icelandic</text>
  <text x="50" y="120" class="subtitle">[aɪsˈlændɪk] adj. 冰岛的；n. 冰岛语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Iceland (冰岛) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的冰岛，"冰(Ice)"覆盖着"岛(land)"，
    <tspan x="50" dy="25">这里的人们说着独特的"冰岛语(Icelandic)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent Icelandic.
  </text>
  <text x="50" y="310" class="content">
    她能说流利的冰岛语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Iceberg -->
    <polygon points="0,200 100,0 200,200" class="image" />
    <!-- Island -->
    <rect x="50" y="200" width="100" height="50" class="image" />
    <!-- Snow -->
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="120" cy="160" r="10" class="image" />
    <circle cx="80" cy="170" r="10" class="image" />
  </g>
</svg>