<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">punch</text>
  <text x="50" y="120" class="subtitle">[pʌntʃ] n. 冲压机，拳打；v. 用拳猛击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> punc (刺) + h (加强)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拳击手用"刺(punc)"的力量
    <tspan x="50" dy="25">猛击(h)对手，这就是punch的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He landed a powerful punch on his opponent's jaw.
  </text>
  <text x="50" y="310" class="content">
    他一拳重重地打在对手的下巴上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boxing glove -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="175" x2="50" y2="175" class="image" />
    <line x1="100" y1="175" x2="150" y2="175" class="image" />
    <!-- Punching motion -->
    <line x1="100" y1="100" x2="200" y2="50" class="image" />
    <!-- Target -->
    <circle cx="250" cy="50" r="20" class="image" />
  </g>
</svg>