<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hill</text>
  <text x="50" y="120" class="subtitle">[hɪl] n. 小山，丘陵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "hil"，意为"小山"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小山丘(hill)，像一个巨大的绿色波浪，
    <tspan x="50" dy="25">上面覆盖着茂密的树木，仿佛在向你招手。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We went hiking on the hill last weekend.
  </text>
  <text x="50" y="310" class="content">
    我们上周末去山上徒步了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hill -->
    <path d="M 0 200 Q 100 100 200 200 L 200 300 L 0 300 Z" class="image" fill="#2ECC71" />
    <!-- Trees -->
    <g transform="translate(50,180)">
      <path d="M 0 0 L 10 -20 L 20 0 Z" class="image" fill="#27AE60" />
      <path d="M 30 0 L 40 -20 L 50 0 Z" class="image" fill="#27AE60" />
      <path d="M 60 0 L 70 -20 L 80 0 Z" class="image" fill="#27AE60" />
    </g>
  </g>
</svg>