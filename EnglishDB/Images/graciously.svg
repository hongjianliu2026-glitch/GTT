<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">graciously</text>
  <text x="50" y="120" class="subtitle">[ˈɡreɪʃəsli] adv. 优雅地，亲切地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grace (优雅) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位女士在舞会上，"优雅地(grace)"
    <tspan x="50" dy="25">行走，她的每一个动作都充满了魅力和亲切感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She accepted the award graciously.
  </text>
  <text x="50" y="310" class="content">
    她优雅地接受了奖项。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elegant lady -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="80" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="80" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Dress -->
    <path d="M50,120 Q70,110 50,100 Q30,110 50,120" class="image" />
    <!-- Smile -->
    <path d="M40,55 Q50,60 60,55" class="image" />
  </g>
</svg>