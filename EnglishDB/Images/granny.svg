<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">granny</text>
  <text x="50" y="120" class="subtitle">[ˈɡræni] n. 奶奶，外婆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gran- (祖母) + -y (表示亲昵)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个慈祥的奶奶(gran-)，她总是带着温暖的微笑，
    <tspan x="50" dy="25">给孩子们讲故事，她的存在就像一个温暖的避风港(-y)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My granny always bakes the best cookies.
  </text>
  <text x="50" y="310" class="content">
    我的奶奶总是烤最好的饼干。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Granny -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right leg -->
    <!-- Smile -->
    <path d="M35,55 Q50,70 65,55" class="image" />
    <!-- Storytelling -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <line x1="120" y1="50" x2="280" y2="50" class="image" />
    <line x1="120" y1="80" x2="250" y2="80" class="image" />
    <line x1="120" y1="110" x2="270" y2="110" class="image" />
    <line x1="120" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>