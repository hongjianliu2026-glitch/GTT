<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uncomplicated</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˈkɑːmplɪkeɪtɪd] adj. 不复杂的，简单的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + complicate (使复杂) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个简单的场景，一个"不复杂(un-complicate)"的拼图，
    <tspan x="50" dy="25">每个拼图块都很容易找到位置，整个画面清晰明了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructions for assembling the furniture were uncomplicated.
  </text>
  <text x="50" y="310" class="content">
    组装家具的说明很简单。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Completed puzzle -->
    <rect x="0" y="240" width="360" height="100" class="image" />
    <!-- Simple scene -->
    <circle cx="50" cy="300" r="15" class="image" />
    <circle cx="150" cy="300" r="15" class="image" />
    <circle cx="250" cy="300" r="15" class="image" />
    <line x1="50" y1="320" x2="250" y2="320" class="image" />
  </g>
</svg>