<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">traveling</text>
  <text x="50" y="120" class="subtitle">[ˈtrævəlɪŋ] adj. 旅行的，移动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> travel (旅行) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背着背包，"旅行(travel)"
    <tspan x="50" dy="25">在世界各地，他的身影在移动(traveling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves traveling to different countries.
  </text>
  <text x="50" y="310" class="content">
    她喜欢去不同的国家旅行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Backpack -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Person -->
    <circle cx="100" cy="120" r="20" class="image" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="160" x2="140" y2="150" class="image" />
    <!-- Path -->
    <line x1="50" y1="220" x2="300" y2="220" class="image" />
    <circle cx="100" cy="220" r="5" class="image" />
    <circle cx="150" cy="220" r="5" class="image" />
    <circle cx="200" cy="220" r="5" class="image" />
    <circle cx="250" cy="220" r="5" class="image" />
    <circle cx="300" cy="220" r="5" class="image" />
  </g>
</svg>