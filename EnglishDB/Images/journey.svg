<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">journey</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɜːrni] n. 旅行，旅程</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> journ (一天) + -ey (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在一天(journ)内经历的旅程(journey)，
    <tspan x="50" dy="25">从日出到日落，沿途的风景和经历构成了这段旅程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They embarked on a long journey across the desert.
  </text>
  <text x="50" y="310" class="content">
    他们开始了穿越沙漠的漫长旅程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Path -->
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" fill="#2ECC71" />
    <!-- Mountains -->
    <polyline points="200,100 250,50 300,100" class="image" fill="#3498DB" />
    <!-- Trees -->
    <line x1="100" y1="100" x2="100" y2="80" class="image" />
    <line x1="110" y1="100" x2="110" y2="70" class="image" />
    <line x1="120" y1="100" x2="120" y2="90" class="image" />
    <!-- Clouds -->
    <ellipse cx="200" cy="50" rx="40" ry="20" class="image" fill="#ECF0F1" />
    <ellipse cx="250" cy="40" rx="30" ry="15" class="image" fill="#ECF0F1" />
  </g>
</svg>