<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">penthouse</text>
  <text x="50" y="120" class="subtitle">[ˈpɛntˌhaʊs] n. 顶层公寓，阁楼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pent (五) + house (房子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个富豪住在"五层(pent)"高的"房子(house)"顶层，
    <tspan x="50" dy="25">这个顶层就是他的豪华顶层公寓(penthouse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought a luxurious penthouse in the city center.
  </text>
  <text x="50" y="310" class="content">
    他在市中心买了一套豪华的顶层公寓。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Floors -->
    <rect x="50" y="20" width="250" height="30" class="image" />
    <rect x="50" y="60" width="250" height="30" class="image" />
    <rect x="50" y="100" width="250" height="30" class="image" />
    <rect x="50" y="140" width="250" height="30" class="image" />
    <!-- Penthouse -->
    <rect x="50" y="180" width="250" height="20" class="image" />
    <rect x="70" y="160" width="210" height="20" class="image" />
    <!-- Windows -->
    <rect x="80" y="30" width="20" height="20" class="image" />
    <rect x="120" y="30" width="20" height="20" class="image" />
    <rect x="160" y="30" width="20" height="20" class="image" />
    <rect x="200" y="30" width="20" height="20" class="image" />
    <rect x="240" y="30" width="20" height="20" class="image" />
    <!-- Penthouse windows -->
    <rect x="90" y="170" width="20" height="10" class="image" />
    <rect x="130" y="170" width="20" height="10" class="image" />
    <rect x="170" y="170" width="20" height="10" class="image" />
    <rect x="210" y="170" width="20" height="10" class="image" />
  </g>
</svg>