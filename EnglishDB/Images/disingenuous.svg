<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disingenuous</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsɪnˈdʒenjuəs] adj. 不真诚的，虚伪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + in- (不) + genu (真诚) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人表面上微笑，但内心却在"不真诚(dis-in-genu-ous)"地
    <tspan x="50" dy="25">想着其他事情，这种虚伪的行为让人一眼就能看穿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His disingenuous smile made it clear he was hiding something.
  </text>
  <text x="50" y="310" class="content">
    他那不真诚的微笑表明他隐藏了什么。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Smiling face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <circle cx="35" cy="40" r="5" class="image" />
    <circle cx="65" cy="40" r="5" class="image" />
    <path d="M 30 60 Q 50 80 70 60" class="image" />
    <!-- Hidden thought bubble -->
    <circle cx="150" cy="50" r="30" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="140" class="image" />
    <line x1="150" y1="120" x2="170" y2="140" class="image" />
    <line x1="150" y1="100" x2="180" y2="90" class="image" />
  </g>
</svg>