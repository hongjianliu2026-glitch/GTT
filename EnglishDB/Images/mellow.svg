<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mellow</text>
  <text x="50" y="120" class="subtitle">[ˈmeloʊ] adj. 柔和的，成熟的；v. 使柔和，使成熟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mel (蜂蜜) + low (低)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个成熟的水果，"蜂蜜般甜美的(mel)"
    <tspan x="50" dy="25">低沉而柔和(low)，给人一种宁静的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sunset cast a mellow glow over the landscape.
  </text>
  <text x="50" y="310" class="content">
    夕阳给大地投下柔和的光辉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F39C12" />
    <!-- Landscape -->
    <rect x="0" y="150" width="350" height="100" fill="#2ECC71" />
    <!-- Fruit -->
    <circle cx="250" cy="120" r="30" fill="#F1C40F" />
    <!-- Honey -->
    <rect x="50" y="200" width="50" height="20" fill="#D4AC0D" />
    <rect x="120" y="200" width="50" height="20" fill="#D4AC0D" />
    <rect x="190" y="200" width="50" height="20" fill="#D4AC0D" />
  </g>
</svg>