<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grandparent</text>
  <text x="50" y="120" class="subtitle">[ˈɡrændˌpɛrənt] n. 祖父母</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grand- (大的) + parent (父母)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的(grand)父母(parent)，他们像巨人一样照顾着我们，
    <tspan x="50" dy="25">这就是我们的祖父母(grandparent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My grandparents live in the countryside.
  </text>
  <text x="50" y="310" class="content">
    我的祖父母住在乡下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grandparent -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
    <!-- Grandchild -->
    <circle cx="150" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="150" y1="120" x2="150" y2="160" class="image" /> <!-- Body -->
    <line x1="150" y1="140" x2="130" y2="160" class="image" /> <!-- Left arm -->
    <line x1="150" y1="140" x2="170" y2="160" class="image" /> <!-- Right arm -->
    <line x1="150" y1="160" x2="140" y2="200" class="image" /> <!-- Left leg -->
    <line x1="150" y1="160" x2="160" y2="200" class="image" /> <!-- Right leg -->
    <!-- Connection -->
    <line x1="80" y1="180" x2="130" y2="160" class="image" /> <!-- Hand holding -->
  </g>
</svg>