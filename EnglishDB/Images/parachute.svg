<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .parachute { fill: #F1C40F; }
      .person { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parachute</text>
  <text x="50" y="120" class="subtitle">[ˈpærəʃuːt] n. 降落伞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (保护) + chute (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从飞机上跳下，"保护(para)"
    <tspan x="50" dy="25">自己安全"落下(chute)"，这就是降落伞(parachute)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a parachute to safely land after jumping from the plane.
  </text>
  <text x="50" y="310" class="content">
    他从飞机上跳下后使用降落伞安全着陆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parachute -->
    <path d="M 0 0 L 150 0 L 200 100 L 100 100 Z" class="parachute" />
    <!-- Person -->
    <circle cx="150" cy="150" r="20" class="person" />
    <line x1="150" y1="170" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="250" class="image" />
    <line x1="150" y1="220" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="120" y2="180" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />
  </g>
</svg>