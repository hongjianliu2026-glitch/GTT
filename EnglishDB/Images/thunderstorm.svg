<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cloud { fill: #ECF0F1; stroke: #7F8C8D; stroke-width: 2; }
      .lightning { fill: #F39C12; stroke: #E67E22; stroke-width: 2; }
      .rain { fill: #3498DB; stroke: #2980B9; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thunderstorm</text>
  <text x="50" y="120" class="subtitle">[ˈθʌndərstɔːrm] n. 雷暴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thunder (雷) + storm (风暴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场"雷(thunder)"声隆隆的"风暴(storm)"，
    <tspan x="50" dy="25">闪电划破天空，大雨倾盆而下，这就是雷暴(thunderstorm)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thunderstorm last night was terrifying.
  </text>
  <text x="50" y="310" class="content">
    昨晚的雷暴非常可怕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="cloud" />
    <ellipse cx="100" cy="80" rx="50" ry="30" class="cloud" />
    <ellipse cx="200" cy="80" rx="50" ry="30" class="cloud" />

    <!-- Lightning -->
    <polygon points="150,100 180,50 160,50 190,0 170,0 200,50 180,50 210,100" class="lightning" />

    <!-- Rain -->
    <line x1="100" y1="150" x2="100" y2="200" class="rain" />
    <line x1="120" y1="150" x2="120" y2="200" class="rain" />
    <line x1="140" y1="150" x2="140" y2="200" class="rain" />
    <line x1="160" y1="150" x2="160" y2="200" class="rain" />
    <line x1="180" y1="150" x2="180" y2="200" class="rain" />
    <line x1="200" y1="150" x2="200" y2="200" class="rain" />
  </g>
</svg>