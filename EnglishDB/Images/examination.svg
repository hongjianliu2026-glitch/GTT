<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">examination</text>
  <text x="50" y="120" class="subtitle">[ɪɡˌzæmɪˈneɪʃn] n. 考试，检查</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + am (爱) + in (进入) + ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在考试中，"向外展示(ex-)"
    <tspan x="50" dy="25">他对知识的"爱(am)"，通过"进入(in)"考试的</tspan>
    <tspan x="50" dy="25">过程，最终完成"检查(examination)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor performed a thorough examination of the patient.
  </text>
  <text x="50" y="310" class="content">
    医生对病人进行了彻底的检查。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Student -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Exam paper -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <!-- Question marks -->
    <text x="120" y="60" class="content" font-size="48">?</text>
    <text x="180" y="120" class="content" font-size="48">?</text>
    <text x="240" y="60" class="content" font-size="48">?</text>
  </g>
</svg>