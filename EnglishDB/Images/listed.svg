<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">listed</text>
  <text x="50" y="120" class="subtitle">[ˈlɪstɪd] adj. 列出的，上市的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> list (列表) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的公告板，上面"列出(list)"
    <tspan x="50" dy="25">了所有上市公司的名字，这些公司都是"列出的(listed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is now listed on the stock exchange.
  </text>
  <text x="50" y="310" class="content">
    这家公司现在在证券交易所上市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Notice board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- List lines -->
    <line x1="50" y1="30" x2="300" y2="30" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="90" x2="300" y2="90" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <!-- Company names -->
    <text x="60" y="50" class="content">Company A</text>
    <text x="60" y="80" class="content">Company B</text>
    <text x="60" y="110" class="content">Company C</text>
    <text x="60" y="140" class="content">Company D</text>
    <text x="60" y="170" class="content">Company E</text>
  </g>
</svg>