<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">periodically</text>
  <text x="50" y="120" class="subtitle">[ˌpɪriˈɑːdɪkli] adv. 定期地，周期性地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peri- (周围) + od (路) + -ic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个钟表的指针在"周围的路(peri-od)"上
    <tspan x="50" dy="25">定期地(periodically)绕圈，就像我们定期检查身体一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He visits his parents periodically.
  </text>
  <text x="50" y="310" class="content">
    他定期去看望父母。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="245" y2="100" class="image" />
    <!-- Clock center -->
    <circle cx="175" cy="100" r="5" class="image" />
    <!-- Path around the clock -->
    <circle cx="175" cy="100" r="60" class="image" stroke-dasharray="10,10" />
  </g>
</svg>