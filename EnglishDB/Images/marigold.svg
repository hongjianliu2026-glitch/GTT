<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flower { fill: #FFC107; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marigold</text>
  <text x="50" y="120" class="subtitle">[ˈmærɪɡoʊld] n. 万寿菊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar- (海) + gold (金)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片金色的海洋(mar-gold)，
    <tspan x="50" dy="25">海面上漂浮着无数金色的万寿菊(marigold)，</tspan>
    <tspan x="50" dy="25">它们在阳光下闪闪发光，如同金色的波浪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was filled with marigolds in autumn.
  </text>
  <text x="50" y="310" class="content">
    秋天，花园里开满了万寿菊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#80D8FF" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#FFC107" />
    <!-- Marigolds -->
    <circle cx="50" cy="100" r="20" class="flower" />
    <circle cx="100" cy="120" r="20" class="flower" />
    <circle cx="150" cy="100" r="20" class="flower" />
    <circle cx="200" cy="120" r="20" class="flower" />
    <circle cx="250" cy="100" r="20" class="flower" />
    <circle cx="300" cy="120" r="20" class="flower" />
  </g>
</svg>