<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">latitude</text>
  <text x="50" y="120" class="subtitle">[ˈlætɪˌtud] n. 纬度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lat (宽) + -itude (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，上面标注着不同的纬度线，
    <tspan x="50" dy="25">这些线就像地球的"宽度(lat)"，帮助我们定位位置。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship sailed at a latitude of 30 degrees north.
  </text>
  <text x="50" y="310" class="content">
    这艘船在北纬30度航行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Latitude lines -->
    <line x1="20" y1="100" x2="330" y2="100" class="image" />
    <line x1="20" y1="60" x2="330" y2="60" class="image" />
    <line x1="20" y1="140" x2="330" y2="140" class="image" />
    <!-- Labels -->
    <text x="340" y="60" class="content">30°N</text>
    <text x="340" y="100" class="content">0°</text>
    <text x="340" y="140" class="content">30°S</text>
  </g>
</svg>