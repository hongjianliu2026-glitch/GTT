<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F7FA; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">serenity</text>
  <text x="50" y="120" class="subtitle">[səˈrɛnɪti] n. 宁静，平静</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seren (平静) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在湖边，湖面如镜，"平静(seren)"
    <tspan x="50" dy="25">无波，周围一片宁静(serenity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man found serenity in the mountains.
  </text>
  <text x="50" y="310" class="content">
    老人在山中找到了宁静。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person sitting -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <!-- Lake surface -->
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <line x1="100" y1="120" x2="300" y2="120" class="image" />
    <line x1="100" y1="140" x2="300" y2="140" class="image" />
    <line x1="100" y1="160" x2="300" y2="160" class="image" />
    <!-- Trees -->
    <line x1="20" y1="50" x2="30" y2="20" class="image" />
    <line x1="30" y1="20" x2="40" y2="50" class="image" />
    <line x1="300" y1="50" x2="310" y2="20" class="image" />
    <line x1="310" y1="20" x2="320" y2="50" class="image" />
  </g>
</svg>