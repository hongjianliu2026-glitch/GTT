<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .syringe { fill: #F39C12; }
      .virus { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vaccine</text>
  <text x="50" y="120" class="subtitle">[ˈvæksiːn] n. 疫苗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vacca (牛) + -ine (表示药物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家从牛(vacca)身上提取了一种药物(-ine)，
    <tspan x="50" dy="25">这种药物能够预防疾病，这就是疫苗(vaccine)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor recommended a vaccine for the flu.
  </text>
  <text x="50" y="310" class="content">
    医生推荐了流感疫苗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Syringe -->
    <rect x="0" y="0" width="100" height="200" class="syringe" />
    <rect x="40" y="0" width="20" height="200" class="syringe" />
    <rect x="20" y="180" width="60" height="20" class="syringe" />
    <!-- Virus -->
    <circle cx="150" cy="100" r="30" class="virus" />
    <circle cx="150" cy="100" r="20" class="virus" />
    <circle cx="150" cy="100" r="10" class="virus" />
    <!-- Connection -->
    <line x1="100" y1="100" x2="120" y2="100" class="image" />
  </g>
</svg>