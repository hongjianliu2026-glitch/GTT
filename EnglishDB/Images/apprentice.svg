<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apprentice</text>
  <text x="50" y="120" class="subtitle">[əˈprentɪs] n. 学徒，徒弟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (加强) + prent (学习) + ice (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个年轻人，"加强学习(ap-prent-ice)"
    <tspan x="50" dy="25">在一个老工匠的指导下，成为一名学徒(apprentice)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He started as an apprentice in the blacksmith's shop.
  </text>
  <text x="50" y="310" class="content">
    他开始在铁匠铺当学徒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old craftsman -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Young apprentice -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Teaching -->
    <line x1="50" y1="140" x2="200" y2="140" class="image" />
    <line x1="50" y1="140" x2="200" y2="140" class="image" />
    <line x1="50" y1="140" x2="200" y2="140" class="image" />
  </g>
</svg>