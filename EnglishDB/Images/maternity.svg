<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maternity</text>
  <text x="50" y="120" class="subtitle">[məˈtɜːrnɪti] n. 母性，产科医院</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mater (母亲) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满母爱的场景，"母亲(mater)"
    <tspan x="50" dy="25">怀抱着新生儿，这种母性的光辉(maternity)让人感到温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent her maternity leave at home with her baby.
  </text>
  <text x="50" y="310" class="content">
    她在家里和宝宝一起度过了产假。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mother and baby -->
    <circle cx="100" cy="100" r="30" class="image" /> <!-- Mother's head -->
    <line x1="100" y1="130" x2="100" y2="200" class="image" /> <!-- Mother's body -->
    <line x1="100" y1="150" x2="70" y2="120" class="image" /> <!-- Mother's left arm -->
    <line x1="100" y1="150" x2="130" y2="120" class="image" /> <!-- Mother's right arm -->
    <circle cx="100" cy="230" r="15" class="image" /> <!-- Baby's head -->
    <line x1="100" y1="245" x2="100" y2="270" class="image" /> <!-- Baby's body -->
  </g>
</svg>