<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meaningful</text>
  <text x="50" y="120" class="subtitle">[ˈmiːnɪŋfəl] adj. 有意义的，意味深长的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mean (意味) + -ing (正在) + -ful (充满)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考，"正在充满(ing-ful)"
    <tspan x="50" dy="25">意味(mean)的话语，这些话语就变得有意义(meaningful)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave a meaningful speech at the graduation ceremony.
  </text>
  <text x="50" y="310" class="content">
    她在毕业典礼上发表了一篇意味深长的演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thought bubble -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Person thinking -->
    <circle cx="175" cy="200" r="30" class="image" />
    <line x1="175" y1="230" x2="175" y2="300" class="image" />
    <line x1="175" y1="250" x2="140" y2="230" class="image" />
    <line x1="175" y1="250" x2="210" y2="230" class="image" />
    <line x1="175" y1="300" x2="140" y2="330" class="image" />
    <line x1="175" y1="300" x2="210" y2="330" class="image" />
    <!-- Meaningful words -->
    <text x="50" y="80" class="content" fill="#2980B9">意味</text>
    <text x="250" y="80" class="content" fill="#2980B9">深长</text>
  </g>
</svg>