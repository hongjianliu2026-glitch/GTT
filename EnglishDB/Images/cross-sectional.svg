<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cross-sectional</text>
  <text x="50" y="120" class="subtitle">[ˌkrɔːsˈsɛkʃənl] adj. 横截面的，截面的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cross (交叉) + section (部分) + al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆柱体，被一把巨大的刀"横切(cross-section)"，
    <tspan x="50" dy="25">切面展示出内部的结构，这就是横截面(cross-sectional)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cross-sectional view of the tree revealed its annual growth rings.
  </text>
  <text x="50" y="310" class="content">
    树的横截面展示了它的年轮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cylinder -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <!-- Cross-section cut -->
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <!-- Cross-section view -->
    <rect x="50" y="160" width="250" height="100" class="image" />
    <line x1="100" y1="180" x2="100" y2="240" class="image" />
    <line x1="150" y1="180" x2="150" y2="240" class="image" />
    <line x1="200" y1="180" x2="200" y2="240" class="image" />
    <line x1="250" y1="180" x2="250" y2="240" class="image" />
  </g>
</svg>