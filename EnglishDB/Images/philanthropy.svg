<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">philanthropy</text>
  <text x="50" y="120" class="subtitle">[fɪˈlænθrəpi] n. 慈善，博爱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> philo- (爱) + anthro- (人) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱心的人(philo-anthro)，
    <tspan x="50" dy="25">他无私地帮助他人，这种行为就是慈善(philanthropy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She practices philanthropy by donating to various charities.
  </text>
  <text x="50" y="310" class="content">
    她通过向各种慈善机构捐款来实践慈善。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Person -->
    <circle cx="40" cy="100" r="15" class="image" />
    <line x1="40" y1="115" x2="40" y2="150" class="image" />
    <line x1="40" y1="150" x2="20" y2="180" class="image" />
    <line x1="40" y1="150" x2="60" y2="180" class="image" />
    <line x1="40" y1="130" x2="70" y2="120" class="image" />
    <!-- Helping hand -->
    <line x1="40" y1="150" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
  </g>
</svg>