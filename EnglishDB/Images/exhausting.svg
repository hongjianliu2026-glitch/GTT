<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exhausting</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzɔːstɪŋ] adj. 令人筋疲力尽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + haust (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在拉车，"拉出(ex-haust)"
    <tspan x="50" dy="25">所有的力气，最后筋疲力尽(exhausting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The marathon was so exhausting that I couldn't move for hours.
  </text>
  <text x="50" y="310" class="content">
    马拉松比赛让我筋疲力尽，几个小时都无法动弹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person pulling a cart -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="20" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="80" y2="150" class="image" /> <!-- Right arm -->
    <rect x="100" y="140" width="100" height="50" class="image" /> <!-- Cart -->
    <line x1="80" y1="165" x2="100" y2="165" class="image" /> <!-- Rope -->
  </g>
</svg>