<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vested</text>
  <text x="50" y="120" class="subtitle">[ˈvɛstɪd] adj. 既得的，授予的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vest (衣服) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着一件"衣服(vest)"，这件衣服象征着他的权利和利益，
    <tspan x="50" dy="25">这些权利和利益已经"授予(vested)"给他，无法轻易剥夺。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He has a vested interest in the company's success.
  </text>
  <text x="50" y="310" class="content">
    他对公司的成功有既得利益。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person wearing a vest -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="80" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="80" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Vest -->
    <rect x="30" y="70" width="40" height="50" class="image" />
    <line x1="30" y1="70" x2="70" y2="70" class="image" />
    <line x1="30" y1="120" x2="70" y2="120" class="image" />
    <line x1="30" y1="70" x2="30" y2="120" class="image" />
    <line x1="70" y1="70" x2="70" y2="120" class="image" />
  </g>
</svg>