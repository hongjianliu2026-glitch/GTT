<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #641E16; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #922B21; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laughing</text>
  <text x="50" y="120" class="subtitle">[ˈlæfɪŋ] v. 笑，大笑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> laugh (笑) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公园里，突然看到一只小丑表演，
    <tspan x="50" dy="25">忍不住"大笑(laugh)"起来，笑声回荡在整个公园。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The audience burst into laughing when the comedian told a joke.
  </text>
  <text x="50" y="310" class="content">
    当喜剧演员讲笑话时，观众爆发出笑声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Mouth -->
    <path d="M35 110 Q50 120 65 110" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <!-- Clown -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="170" class="image" />
    <line x1="250" y1="170" x2="230" y2="200" class="image" />
    <line x1="250" y1="170" x2="270" y2="200" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />
    <!-- Clown's mouth -->
    <path d="M235 120 Q250 130 265 120" class="image" />
    <!-- Clown's eyes -->
    <circle cx="240" cy="100" r="5" class="image" />
    <circle cx="260" cy="100" r="5" class="image" />
  </g>
</svg>