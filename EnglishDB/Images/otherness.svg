<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">otherness</text>
  <text x="50" y="120" class="subtitle">[ˈʌðərnəs] n. 他者性，异质性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> other (其他的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的镜子，镜子里映出两个世界，一个是"自我"，另一个是"他者"。
    <tspan x="50" dy="25">这种对比突显了"他者性(otherness)"，即与自我不同的特质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concept of otherness is central to understanding cultural diversity.
  </text>
  <text x="50" y="310" class="content">
    他者性的概念对于理解文化多样性至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Self -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Other -->
    <circle cx="250" cy="100" r="50" class="image" />
    <!-- Mirror line -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Labels -->
    <text x="80" y="220" class="content">Self</text>
    <text x="230" y="220" class="content">Other</text>
  </g>
</svg>