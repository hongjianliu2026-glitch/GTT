<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .purse { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">purse</text>
  <text x="50" y="120" class="subtitle">[pɜːrs] n. 钱包，小钱袋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pur- (钱) + -se (容器)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的商人，"把钱(pur-)"
    <tspan x="50" dy="25">装进一个小袋子(-se)，这个袋子就是钱包(purse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She lost her purse on the bus.
  </text>
  <text x="50" y="310" class="content">
    她在公交车上丢了钱包。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Purse -->
    <path d="M 0 0 L 100 0 L 100 50 Q 90 60 80 50 L 20 50 Q 10 60 0 50 Z" class="purse" />
    <!-- Coins -->
    <circle cx="20" cy="25" r="5" class="image" />
    <circle cx="40" cy="25" r="5" class="image" />
    <circle cx="60" cy="25" r="5" class="image" />
    <circle cx="80" cy="25" r="5" class="image" />
  </g>
</svg>