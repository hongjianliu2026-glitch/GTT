<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E9E2; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #A0522D; }
      .content { font: 18px sans-serif; fill: #654321; }
      .highlight { font-weight: bold; fill: #CD853F; }
      .story { font: 16px serif; fill: #8B4513; }
      .image { stroke: #8B4513; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leather</text>
  <text x="50" y="120" class="subtitle">[ˈlɛðər] n. 皮革</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lēth- (皮肤) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的动物，它的皮肤被剥下来，"皮肤(lēth-)"
    <tspan x="50" dy="25">经过加工变成了柔软的皮革(leather)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a leather jacket for her birthday.
  </text>
  <text x="50" y="310" class="content">
    她为生日买了一件皮夹克。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Animal skin -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Leather texture -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Leather pattern -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Leather product -->
    <rect x="150" y="100" width="50" height="80" class="image" />
  </g>
</svg>