<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reproduction</text>
  <text x="50" y="120" class="subtitle">[ˌriːprəˈdʌkʃn] n. 复制，繁殖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + produce (生产)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶在花丛中，"再次生产(re-produce)"
    <tspan x="50" dy="25">出无数的小蝴蝶，这些小蝴蝶就是繁殖(reproduction)的结果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The reproduction of these plants is very fast.
  </text>
  <text x="50" y="310" class="content">
    这些植物的繁殖速度非常快。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly -->
    <path d="M50 50 C 70 20, 130 20, 150 50" class="image" />
    <path d="M50 50 C 30 80, 30 120, 50 150" class="image" />
    <path d="M150 50 C 170 80, 170 120, 150 150" class="image" />
    <!-- Flowers -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="80" cy="120" r="15" class="image" />
    <circle cx="120" cy="120" r="15" class="image" />
    <!-- Small butterflies -->
    <path d="M200 50 C 220 20, 280 20, 300 50" class="image" />
    <path d="M200 50 C 180 80, 180 120, 200 150" class="image" />
    <path d="M300 50 C 320 80, 320 120, 300 150" class="image" />
  </g>
</svg>