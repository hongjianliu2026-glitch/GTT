<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anomalous</text>
  <text x="50" y="120" class="subtitle">[əˈnɒmələs] adj. 异常的，不规则的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (不) + -omalous (规则)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"不规则(an-omalous)"的生物，它有
    <tspan x="50" dy="25">三条腿和四只眼睛，完全不符合常规生物的特征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The anomalous weather patterns caused widespread disruption.
  </text>
  <text x="50" y="310" class="content">
    异常的天气模式导致了广泛的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Anomalous creature -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <circle cx="30" cy="90" r="10" class="image" /> <!-- Eye 1 -->
    <circle cx="70" cy="90" r="10" class="image" /> <!-- Eye 2 -->
    <circle cx="50" cy="110" r="10" class="image" /> <!-- Eye 3 -->
    <circle cx="50" cy="130" r="10" class="image" /> <!-- Eye 4 -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Leg 1 -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Leg 2 -->
    <line x1="50" y1="180" x2="50" y2="220" class="image" /> <!-- Leg 3 -->
  </g>
</svg>