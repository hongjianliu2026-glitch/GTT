<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .asphalt { fill: #34495E; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">asphalt</text>
  <text x="50" y="120" class="subtitle">[ˈæsfɔːlt] n. 沥青，柏油</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (强调) + sphalte (沥青)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条道路，上面铺满了黑色的"沥青(asphalt)"，
    <tspan x="50" dy="25">车辆在上面行驶，发出"嗡嗡"的声音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road was covered with fresh asphalt.
  </text>
  <text x="50" y="310" class="content">
    道路被新铺的沥青覆盖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="asphalt" />
    <!-- Car -->
    <rect x="50" y="100" width="100" height="50" class="image" />
    <circle cx="70" cy="150" r="15" class="image" />
    <circle cx="130" cy="150" r="15" class="image" />
    <!-- Windows -->
    <rect x="60" y="110" width="30" height="20" class="image" />
    <rect x="110" y="110" width="30" height="20" class="image" />
  </g>
</svg>