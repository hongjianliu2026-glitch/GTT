<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .pineapple { fill: #F4D03F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pineapple</text>
  <text x="50" y="120" class="subtitle">[ˈpaɪnˌæpəl] n. 菠萝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pine (松果) + apple (苹果)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的松果(pine)上长满了苹果(apple)，
    <tspan x="50" dy="25">这些苹果其实是菠萝(pineapple)的鳞片，</tspan>
    <tspan x="50" dy="25">形成了一个奇特的水果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat fresh pineapple in summer.
  </text>
  <text x="50" y="310" class="content">
    她夏天喜欢吃新鲜的菠萝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pineapple body -->
    <circle cx="100" cy="100" r="80" class="pineapple" />
    <!-- Pineapple leaves -->
    <path d="M 100 20 Q 150 50 100 80 Q 50 50 100 20" class="image" />
    <path d="M 100 25 Q 140 60 100 90 Q 60 60 100 25" class="image" />
    <path d="M 100 30 Q 130 70 100 100 Q 70 70 100 30" class="image" />
    <!-- Pineapple scales -->
    <rect x="30" y="40" width="140" height="10" class="image" />
    <rect x="30" y="60" width="140" height="10" class="image" />
    <rect x="30" y="80" width="140" height="10" class="image" />
    <rect x="30" y="100" width="140" height="10" class="image" />
    <rect x="30" y="120" width="140" height="10" class="image" />
  </g>
</svg>