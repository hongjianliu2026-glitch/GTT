<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Bosnian</text>
  <text x="50" y="120" class="subtitle">[ˈbɒznɪən] n. 波斯尼亚人；adj. 波斯尼亚的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Bosn- (波斯尼亚) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个波斯尼亚人站在波斯尼亚的标志性建筑前，
    <tspan x="50" dy="25">这个建筑象征着波斯尼亚的文化和历史。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Bosnian community is known for its rich cultural heritage.
  </text>
  <text x="50" y="310" class="content">
    波斯尼亚社区以其丰富的文化遗产而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bosnian flag -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="60" class="image" fill="#001489" />
    <rect x="50" y="80" width="250" height="60" class="image" fill="#FFCD00" />
    <rect x="50" y="140" width="250" height="60" class="image" fill="#009460" />
    <!-- Bosnian person -->
    <circle cx="20" cy="100" r="15" class="image" fill="#FFCD00" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>