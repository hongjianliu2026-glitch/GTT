<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">garment</text>
  <text x="50" y="120" class="subtitle">[ˈɡɑːrmənt] n. 衣服，服装</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> garb (衣服) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的衣架上挂满了各种"衣服(garb)"，
    <tspan x="50" dy="25">这些衣服被整齐地排列在一起，形成了一个"服装(garment)"的海洋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a new garment for the party.
  </text>
  <text x="50" y="310" class="content">
    她为派对买了一件新衣服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clothes hanger -->
    <line x1="50" y1="20" x2="50" y2="200" class="image" />
    <line x1="20" y1="20" x2="80" y2="20" class="image" />
    <!-- Garments -->
    <rect x="30" y="40" width="40" height="100" class="image" />
    <rect x="10" y="150" width="80" height="30" class="image" />
    <rect x="20" y="190" width="60" height="10" class="image" />
  </g>
</svg>