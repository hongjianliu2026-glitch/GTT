<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">treetop</text>
  <text x="50" y="120" class="subtitle">[ˈtriːtɒp] n. 树顶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tree (树) + top (顶部)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟站在树顶(treetop)，
    <tspan x="50" dy="25">它俯瞰着整个森林，仿佛站在世界的巅峰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The squirrel reached the treetop and looked around.
  </text>
  <text x="50" y="310" class="content">
    松鼠到达了树顶，环顾四周。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="100" y="0" width="50" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="125" y1="200" x2="75" y2="150" class="image" />
    <line x1="125" y1="200" x2="175" y2="150" class="image" />
    <line x1="125" y1="150" x2="75" y2="100" class="image" />
    <line x1="125" y1="150" x2="175" y2="100" class="image" />
    <!-- Tree leaves -->
    <circle cx="100" cy="100" r="25" class="image" />
    <circle cx="75" cy="125" r="20" class="image" />
    <circle cx="125" cy="125" r="20" class="image" />
    <!-- Bird on the treetop -->
    <circle cx="100" cy="75" r="10" class="image" />
    <line x1="100" y1="85" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="90" y2="110" class="image" />
    <line x1="100" y1="100" x2="110" y2="110" class="image" />
  </g>
</svg>