<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boss</text>
  <text x="50" y="120" class="subtitle">[bɒs] n. 老板，上司</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bos (牛) + -s (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老板(boss)像一头强壮的牛(bos)，
    <tspan x="50" dy="25">带领着团队向前冲，掌控全局。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boss made a decision that surprised everyone.
  </text>
  <text x="50" y="310" class="content">
    老板做出了一个让所有人都惊讶的决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Boss figure -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right leg -->
    <!-- Bull horns -->
    <line x1="30" y1="30" x2="10" y2="10" class="image" />
    <line x1="70" y1="30" x2="90" y2="10" class="image" />
  </g>
</svg>