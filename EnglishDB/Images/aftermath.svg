<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aftermath</text>
  <text x="50" y="120" class="subtitle">[ˈɑːftərmæθ] n. 后果，余波</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> after (之后) + math (割草)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场暴风雨过后，"之后(after)"
    <tspan x="50" dy="25">田野上的草被"割(math)"得乱七八糟，</tspan>
    <tspan x="50" dy="25">这就是暴风雨的"后果(aftermath)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aftermath of the hurricane left the town in ruins.
  </text>
  <text x="50" y="310" class="content">
    飓风的后果使小镇变成了一片废墟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tornado -->
    <path d="M0 100 C 50 50, 150 50, 200 100" class="image" />
    <path d="M200 100 C 250 150, 350 150, 400 100" class="image" />
    <!-- Ruined field -->
    <line x1="50" y1="120" x2="350" y2="120" class="image" />
    <line x1="50" y1="140" x2="350" y2="140" class="image" />
    <line x1="50" y1="160" x2="350" y2="160" class="image" />
    <line x1="50" y1="180" x2="350" y2="180" class="image" />
    <!-- Torn grass -->
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="150" y1="140" x2="150" y2="180" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="250" y1="140" x2="250" y2="180" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
  </g>
</svg>