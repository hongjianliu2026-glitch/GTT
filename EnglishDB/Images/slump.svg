<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slump</text>
  <text x="50" y="120" class="subtitle">[slʌmp] v. 猛然落下，暴跌；n. 暴跌，衰退</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sl- (向下) + ump (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然"向下(sl-)" "落下(ump)"，
    <tspan x="50" dy="25">就像一个疲惫的人猛然坐在椅子上，这就是slump。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stock market slumped after the news.
  </text>
  <text x="50" y="310" class="content">
    消息传出后，股市暴跌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person slumping -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <!-- Chair -->
    <rect x="20" y="220" width="60" height="20" class="image" />
    <line x1="30" y1="240" x2="30" y2="260" class="image" />
    <line x1="70" y1="240" x2="70" y2="260" class="image" />
  </g>
</svg>