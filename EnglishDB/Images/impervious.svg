<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impervious</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpɜːrviəs] adj. 不可渗透的，不受影响的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + per- (通过) + vi (路) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头墙，"水无法通过(im-per-vi-ous)"，
    <tspan x="50" dy="25">因为它太坚硬了，任何东西都无法渗透进去。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fortress was impervious to enemy attacks.
  </text>
  <text x="50" y="310" class="content">
    这座堡垒对敌人的攻击是不可渗透的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="100" y="40" width="150" height="120" class="image" />
    <rect x="150" y="60" width="50" height="80" class="image" />
    <!-- Water drops -->
    <circle cx="20" cy="100" r="10" class="image" />
    <circle cx="40" cy="120" r="10" class="image" />
    <circle cx="60" cy="140" r="10" class="image" />
    <circle cx="80" cy="160" r="10" class="image" />
    <!-- Water splashes -->
    <line x1="20" y1="100" x2="10" y2="90" class="image" />
    <line x1="40" y1="120" x2="30" y2="110" class="image" />
    <line x1="60" y1="140" x2="50" y2="130" class="image" />
    <line x1="80" y1="160" x2="70" y2="150" class="image" />
  </g>
</svg>