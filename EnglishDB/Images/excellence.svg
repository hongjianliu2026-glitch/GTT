<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">excellence</text>
  <text x="50" y="120" class="subtitle">[ˈɛksələns] n. 卓越，优秀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + cell (上升) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从人群中"脱颖而出(ex-cell)"，
    <tspan x="50" dy="25">展现出非凡的"卓越(excellence)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was awarded for her excellence in mathematics.
  </text>
  <text x="50" y="310" class="content">
    她因在数学方面的卓越表现而获奖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Crowd -->
    <rect x="0" y="100" width="350" height="50" class="image" />
    <!-- Person rising above -->
    <circle cx="175" cy="70" r="20" class="image" />
    <line x1="175" y1="90" x2="175" y2="150" class="image" />
    <line x1="175" y1="120" x2="150" y2="140" class="image" />
    <line x1="175" y1="120" x2="200" y2="140" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <!-- Star for excellence -->
    <polygon points="175,20 200,80 260,80 210,120 230,180 175,140 120,180 140,120 90,80 150,80" class="image" />
  </g>
</svg>