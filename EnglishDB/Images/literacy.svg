<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">literacy</text>
  <text x="50" y="120" class="subtitle">[ˈlɪtərəsi] n. 识字，读写能力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liter (文字) + -acy (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子在书桌前，"掌握文字(liter)"
    <tspan x="50" dy="25">的状态(acy)，这就是识字能力(literacy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The program aims to improve adult literacy rates.
  </text>
  <text x="50" y="310" class="content">
    该计划旨在提高成人识字率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Book -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Child -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Pen -->
    <line x1="250" y1="120" x2="280" y2="120" class="image" />
    <line x1="280" y1="120" x2="280" y2="140" class="image" />
  </g>
</svg>