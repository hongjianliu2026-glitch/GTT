<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liter</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪtər] n. 升（容量单位）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> litr (来自拉丁语 litra, 表示重量单位)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的液体容器，里面装满了"升(liter)"的液体，
    <tspan x="50" dy="25">每一升都精确地测量，就像古代的重量单位一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bottle contains 2 liters of water.
  </text>
  <text x="50" y="310" class="content">
    这个瓶子里装有2升水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Liquid container -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Liquid -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#16A085" />
    <!-- Measurement lines -->
    <line x1="70" y1="50" x2="300" y2="50" class="image" />
    <line x1="70" y1="80" x2="300" y2="80" class="image" />
    <line x1="70" y1="110" x2="300" y2="110" class="image" />
    <line x1="70" y1="140" x2="300" y2="140" class="image" />
    <!-- Labels -->
    <text x="310" y="55" class="content">1 liter</text>
    <text x="310" y="85" class="content">2 liters</text>
    <text x="310" y="115" class="content">3 liters</text>
    <text x="310" y="145" class="content">4 liters</text>
  </g>
</svg>