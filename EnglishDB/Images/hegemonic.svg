<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hegemonic</text>
  <text x="50" y="120" class="subtitle">[ˌhedʒɪˈmɒnɪk] adj. 霸权的，支配的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hegemon (领导者) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的领导者(hegemon)站在一群人之上，
    <tspan x="50" dy="25">他的影子覆盖了所有人，象征着他的霸权(hegemonic)地位。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The country's hegemonic influence spread across the region.
  </text>
  <text x="50" y="310" class="content">
    这个国家的霸权影响力遍布整个地区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Leader -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="130" y2="180" class="image" />
    <line x1="100" y1="200" x2="70" y2="230" class="image" />
    <line x1="100" y1="200" x2="130" y2="230" class="image" />

    <!-- Shadow -->
    <ellipse cx="100" cy="250" rx="100" ry="30" class="image" />

    <!-- People -->
    <circle cx="50" cy="300" r="10" class="image" />
    <circle cx="150" cy="300" r="10" class="image" />
    <circle cx="75" cy="320" r="10" class="image" />
    <circle cx="125" cy="320" r="10" class="image" />
  </g>
</svg>