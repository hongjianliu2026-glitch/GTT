<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trusting</text>
  <text x="50" y="120" class="subtitle">[ˈtrʌstɪŋ] adj. 信任的，信赖的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trust (信任) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小兔子毫无防备地躺在草地上，完全信任(trusting)
    <tspan x="50" dy="25">周围的环境，因为它知道这里是安全的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a trusting person, always believing in others.
  </text>
  <text x="50" y="310" class="content">
    她是一个信任他人的人，总是相信别人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rabbit -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="140" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <line x1="100" y1="180" x2="70" y2="200" class="image" />
    <line x1="100" y1="180" x2="130" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="40" class="image" />
    <line x1="250" y1="90" x2="250" y2="150" class="image" />
    <line x1="210" y1="120" x2="290" y2="120" class="image" />
    <line x1="230" y1="80" x2="270" y2="160" class="image" />
    <line x1="270" y1="80" x2="230" y2="160" class="image" />
  </g>
</svg>