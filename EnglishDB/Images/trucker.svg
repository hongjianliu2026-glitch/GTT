<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trucker</text>
  <text x="50" y="120" class="subtitle">[ˈtrʌkər] n. 卡车司机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> truck (卡车) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的卡车司机，驾驶着巨大的卡车，
    <tspan x="50" dy="25">在公路上飞驰，运送着各种货物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The trucker delivered the goods on time.
  </text>
  <text x="50" y="310" class="content">
    卡车司机按时送到了货物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Truck -->
    <rect x="0" y="0" width="300" height="150" class="image" />
    <rect x="20" y="20" width="260" height="110" class="image" />
    <rect x="20" y="130" width="260" height="20" class="image" />
    <rect x="40" y="150" width="220" height="30" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="180" r="20" class="image" />
    <circle cx="250" cy="180" r="20" class="image" />
    <!-- Driver -->
    <circle cx="150" cy="80" r="15" class="image" />
    <line x1="150" y1="95" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="130" y2="160" class="image" />
    <line x1="150" y1="130" x2="170" y2="160" class="image" />
    <line x1="150" y1="110" x2="180" y2="100" class="image" />
  </g>
</svg>