<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mortar</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrtər] n. 灰浆，迫击炮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mort (死) + ar (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的石匠，他用"死亡之工具(mort-ar)"
    <tspan x="50" dy="25">混合石灰和沙子，制作出坚固的灰浆(mortar)，</tspan>
    <tspan x="50" dy="25">或者想象一个士兵用迫击炮(mortar)摧毁敌人的阵地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The mason mixed the mortar to repair the wall.
  </text>
  <text x="50" y="330" class="content">
    泥瓦匠混合灰浆来修补墙壁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mortar container -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Mortar mix -->
    <rect x="10" y="10" width="180" height="80" fill="#D3D3D3" />
    <!-- Mortar texture -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="40" x2="180" y2="40" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <!-- Mortar label -->
    <text x="100" y="120" class="content" text-anchor="middle">Mortar</text>
  </g>
</svg>