<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anachronism</text>
  <text x="50" y="120" class="subtitle">[əˈnækrəˌnɪzəm] n. 时代错误，不合时宜的事物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ana- (错误) + chron (时间) + -ism (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个现代人穿着古代的盔甲，"错误地(ana-)"
    <tspan x="50" dy="25">出现在现代(chron)，这就是一个时代错误(anachronism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Wearing a suit of armor to a modern party is an anachronism.
  </text>
  <text x="50" y="310" class="content">
    穿着盔甲去现代派对是一种时代错误。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Modern person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Ancient armor -->
    <rect x="0" y="150" width="40" height="50" class="image" />
    <rect x="10" y="150" width="20" height="50" class="image" />
    <line x1="20" y1="150" x2="20" y2="200" class="image" />
    <line x1="10" y1="150" x2="30" y2="150" class="image" />
    <line x1="10" y1="200" x2="30" y2="200" class="image" />
  </g>
</svg>