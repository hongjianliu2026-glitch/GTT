<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">corrosive</text>
  <text x="50" y="120" class="subtitle">[kəˈroʊsɪv] adj. 腐蚀性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cor- (共同) + ros (咬) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一种液体，它"共同咬(cor-ros)"穿了所有接触到的金属，
    <tspan x="50" dy="25">这种液体就是腐蚀性的(corrosive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The acid is highly corrosive and should be handled with care.
  </text>
  <text x="50" y="310" class="content">
    这种酸具有高度腐蚀性，应小心处理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Liquid container -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Liquid -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#E74C3C" />
    <!-- Metal -->
    <rect x="70" y="40" width="210" height="120" class="image" fill="#7F8C8D" />
    <!-- Corrosion effect -->
    <line x1="80" y1="50" x2="260" y2="50" class="image" />
    <line x1="80" y1="80" x2="230" y2="80" class="image" />
    <line x1="80" y1="110" x2="250" y2="110" class="image" />
    <line x1="80" y1="140" x2="220" y2="140" class="image" />
    <!-- Corrosion marks -->
    <circle cx="100" cy="100" r="10" class="image" fill="#E74C3C" />
    <circle cx="150" cy="120" r="10" class="image" fill="#E74C3C" />
    <circle cx="200" cy="90" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>