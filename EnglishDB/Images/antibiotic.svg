<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antibiotic</text>
  <text x="50" y="120" class="subtitle">[ˌæntibaɪˈɒtɪk] n. 抗生素</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (对抗) + bio (生命) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"对抗(anti)"符号，
    <tspan x="50" dy="25">它正在与一个代表"生命(bio)"的细菌战斗，</tspan>
    <tspan x="50" dy="25">这个对抗生命的物质就是抗生素(antibiotic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Penicillin is a widely used antibiotic.
  </text>
  <text x="50" y="310" class="content">
    青霉素是一种广泛使用的抗生素。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Anti symbol -->
    <line x1="50" y1="20" x2="250" y2="220" class="image" />
    <line x1="50" y1="220" x2="250" y2="20" class="image" />
    <!-- Bacteria -->
    <circle cx="150" cy="120" r="30" class="image" />
    <line x1="150" y1="90" x2="150" y2="150" class="image" />
    <line x1="120" y1="120" x2="180" y2="120" class="image" />
    <line x1="135" y1="105" x2="165" y2="135" class="image" />
    <line x1="135" y1="135" x2="165" y2="105" class="image" />
  </g>
</svg>