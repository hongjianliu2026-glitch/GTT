<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">metro</text>
  <text x="50" y="120" class="subtitle">[ˈmɛtroʊ] n. 地铁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> metr (测量) + -o (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的测量工具"测量(metr)"
    <tspan x="50" dy="25">地下隧道，这些隧道构成了地铁(metro)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He takes the metro to work every day.
  </text>
  <text x="50" y="310" class="content">
    他每天乘地铁去上班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Underground tunnel -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Train -->
    <rect x="50" y="50" width="250" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="170" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="270" cy="100" r="10" class="image" />
    <!-- Measuring tool -->
    <line x1="30" y1="150" x2="320" y2="150" class="image" />
    <line x1="30" y1="150" x2="30" y2="180" class="image" />
    <line x1="320" y1="150" x2="320" y2="180" class="image" />
  </g>
</svg>