<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cease-fire</text>
  <text x="50" y="120" class="subtitle">[siːs faɪər] n. 停火，停战</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cease (停止) + fire (火)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在战场上，双方士兵突然"停止(cease)"
    <tspan x="50" dy="25">开火(fire)，战火熄灭，和平降临。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cease-fire agreement was signed yesterday.
  </text>
  <text x="50" y="310" class="content">
    停火协议昨天签署了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soldiers -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Guns -->
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <!-- Cease-fire sign -->
    <text x="200" y="120" class="highlight" font-size="30">STOP</text>
    <line x1="200" y1="130" x2="250" y2="130" class="image" />
    <line x1="225" y1="110" x2="225" y2="150" class="image" />
  </g>
</svg>