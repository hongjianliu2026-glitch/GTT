<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sacrament</text>
  <text x="50" y="120" class="subtitle">[ˈsækrəmənt] n. 圣礼，圣事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sacri- (神圣) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神圣的仪式，"神圣的(sacri-)"
    <tspan x="50" dy="25">仪式中，人们通过特定的仪式(sacrament)来表达对神的敬意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The priest performed the sacrament of baptism.
  </text>
  <text x="50" y="310" class="content">
    牧师进行了洗礼圣事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Altar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cross -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="125" y1="100" x2="225" y2="100" class="image" />
    <!-- Priest -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Holy Water -->
    <rect x="200" y="150" width="50" height="30" class="image" />
    <line x1="225" y1="150" x2="225" y2="180" class="image" />
  </g>
</svg>