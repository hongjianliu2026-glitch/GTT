<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mediator</text>
  <text x="50" y="120" class="subtitle">[ˈmiːdiˌeɪtər] n. 调解人，中介</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medi- (中间) + -ator (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调解人站在两群争吵的人中间，"站在中间(medi-)"
    <tspan x="50" dy="25">调解双方的矛盾，这个人就是调解人(mediator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mediator helped the two parties reach a compromise.
  </text>
  <text x="50" y="310" class="content">
    调解人帮助双方达成了妥协。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two groups of people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="650" cy="100" r="20" class="image" />
    <circle cx="700" cy="100" r="20" class="image" />
    <circle cx="750" cy="100" r="20" class="image" />
    <!-- Arrows representing conflict -->
    <line x1="100" y1="120" x2="650" y2="120" class="image" />
    <line x1="650" y1="120" x2="100" y2="120" class="image" />
    <!-- Mediator in the middle -->
    <circle cx="400" cy="100" r="25" class="image" />
    <line x1="400" y1="125" x2="400" y2="170" class="image" />
    <line x1="400" y1="170" x2="380" y2="200" class="image" />
    <line x1="400" y1="170" x2="420" y2="200" class="image" />
    <line x1="400" y1="150" x2="430" y2="140" class="image" />
  </g>
</svg>