<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resonant</text>
  <text x="50" y="120" class="subtitle">[ˈrɛzənənt] adj. 共鸣的，回响的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + son (声音) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山谷，"再次发出(re-son)"
    <tspan x="50" dy="25">回响的声音，这种声音就是共鸣的(resonant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The speaker's voice was resonant and filled the hall.
  </text>
  <text x="50" y="310" class="content">
    演讲者的声音充满了共鸣，充满了整个大厅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 50 L200 200 Z" class="image" />
    <!-- Sound waves -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="40" class="image" />
    <circle cx="100" cy="100" r="60" class="image" />
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Sound source -->
    <circle cx="100" cy="100" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>