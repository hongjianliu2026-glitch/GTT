<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pencil</text>
  <text x="50" y="120" class="subtitle">[ˈpensl] n. 铅笔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pen- (写) + cil (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小小的笔尖(cil)，"写下(pen)"
    <tspan x="50" dy="25">文字，这就是铅笔(pencil)的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sharpened her pencil before starting to write.
  </text>
  <text x="50" y="310" class="content">
    她在开始写字前把铅笔削尖了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pencil body -->
    <rect x="0" y="0" width="300" height="20" class="image" />
    <!-- Pencil tip -->
    <polygon points="300,0 280,10 300,20" class="image" />
    <!-- Eraser -->
    <rect x="280" y="0" width="20" height="20" class="image" />
    <!-- Lead tip -->
    <line x1="280" y1="10" x2="290" y2="10" class="image" />
  </g>
</svg>