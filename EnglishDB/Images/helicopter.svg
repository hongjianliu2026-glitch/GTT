<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">helicopter</text>
  <text x="50" y="120" class="subtitle">[ˈhɛlɪkɒptə] n. 直升机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heli- (太阳) + copt (切割) + -er (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架直升机像太阳一样旋转，"切割(copt)"
    <tspan x="50" dy="25">空气，飞向天空，这就是直升机(helicopter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rescue helicopter arrived within minutes.
  </text>
  <text x="50" y="310" class="content">
    救援直升机几分钟内就到达了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Helicopter body -->
    <rect x="50" y="20" width="200" height="50" class="image" />
    <!-- Rotor blades -->
    <line x1="150" y1="20" x2="150" y2="0" class="image" />
    <line x1="150" y1="20" x2="250" y2="20" class="image" />
    <line x1="150" y1="20" x2="50" y2="20" class="image" />
    <line x1="150" y1="20" x2="150" y2="40" class="image" />
    <!-- Tail -->
    <line x1="250" y1="45" x2="300" y2="45" class="image" />
    <line x1="300" y1="45" x2="300" y2="20" class="image" />
  </g>
</svg>