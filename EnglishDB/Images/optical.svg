<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">optical</text>
  <text x="50" y="120" class="subtitle">[ˈɑːptɪkl] adj. 光学的，视觉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> opt (眼睛) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的眼睛(opt)，它不仅能看到(optical)
    <tspan x="50" dy="25">周围的一切，还能发射激光(optical)，照亮整个世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new optical device can measure distances with high precision.
  </text>
  <text x="50" y="310" class="content">
    这个新的光学设备可以高精度地测量距离。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="image" fill="#2C3E50" />
    <!-- Laser beams -->
    <line x1="100" y1="150" x2="100" y2="300" class="image" stroke-width="5" stroke="#E74C3C" />
    <line x1="100" y1="150" x2="50" y2="300" class="image" stroke-width="5" stroke="#E74C3C" />
    <line x1="100" y1="150" x2="150" y2="300" class="image" stroke-width="5" stroke="#E74C3C" />
  </g>
</svg>