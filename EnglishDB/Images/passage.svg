<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">passage</text>
  <text x="50" y="120" class="subtitle">[ˈpæsɪdʒ] n. 通道，段落，通行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pass (通过) + age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门，门上有一个"通过(pass)"的标志，
    <tspan x="50" dy="25">人们排队通过这个门，这个过程就是"通行(passage)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The passage through the narrow tunnel was slow.
  </text>
  <text x="50" y="310" class="content">
    通过狭窄的隧道很慢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People -->
    <circle cx="70" cy="100" r="15" class="image" />
    <line x1="70" y1="115" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="70" y1="130" x2="100" y2="120" class="image" />
    <!-- More people -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="150" y2="120" class="image" />
    <!-- More people -->
    <circle cx="170" cy="100" r="15" class="image" />
    <line x1="170" y1="115" x2="170" y2="150" class="image" />
    <line x1="170" y1="150" x2="150" y2="180" class="image" />
    <line x1="170" y1="150" x2="190" y2="180" class="image" />
    <line x1="170" y1="130" x2="200" y2="120" class="image" />
  </g>
</svg>