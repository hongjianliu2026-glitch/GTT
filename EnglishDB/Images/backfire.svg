<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">backfire</text>
  <text x="50" y="120" class="subtitle">[ˈbækˌfaɪər] v. 事与愿违，适得其反</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> back (后面) + fire (火)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图用火把驱赶野兽，结果火把的火焰却
    <tspan x="50" dy="25">"反向燃烧(back-fire)"，烧到了自己，事与愿违。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His plan to impress her backfired when she found out the truth.
  </text>
  <text x="50" y="310" class="content">
    他试图给她留下好印象的计划适得其反，当她发现真相时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Fire -->
    <line x1="100" y1="100" x2="120" y2="80" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
    <line x1="100" y1="100" x2="140" y2="100" class="image" />
    <!-- Backfire -->
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <line x1="100" y1="100" x2="80" y2="80" class="image" />
    <line x1="100" y1="100" x2="60" y2="100" class="image" />
  </g>
</svg>