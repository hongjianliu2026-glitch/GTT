<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subversive</text>
  <text x="50" y="120" class="subtitle">[səbˈvɜːrsɪv] adj. 颠覆性的，破坏性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + vers (转) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个秘密特工在地下室，"从下面转动(sub-vers)"
    <tspan x="50" dy="25">整个社会的根基，试图颠覆(subversive)现状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The subversive activities were quickly discovered by the authorities.
  </text>
  <text x="50" y="310" class="content">
    这些颠覆性的活动很快被当局发现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basement -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Secret agent -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Rotating base -->
    <circle cx="180" cy="100" r="50" class="image" />
    <line x1="180" y1="50" x2="180" y2="150" class="image" />
    <line x1="130" y1="100" x2="230" y2="100" class="image" />
    <!-- Arrow indicating rotation -->
    <line x1="180" y1="50" x2="230" y2="100" class="image" />
    <line x1="230" y1="100" x2="180" y2="150" class="image" />
  </g>
</svg>