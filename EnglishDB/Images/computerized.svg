<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">computerized</text>
  <text x="50" y="120" class="subtitle">[kəmˈpjuːtəraɪzd] adj. 计算机化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> computer (计算机) + -ize (使...化)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工厂，所有的机器都被"计算机化(computerized)"，
    <tspan x="50" dy="25">每个机器都由电脑控制，精确无误地运转。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory has been fully computerized to increase efficiency.
  </text>
  <text x="50" y="310" class="content">
    这家工厂已经完全计算机化以提高效率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Computer screens -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <rect x="200" y="20" width="100" height="80" class="image" />
    <!-- Machines -->
    <rect x="50" y="120" width="50" height="50" class="image" />
    <rect x="150" y="120" width="50" height="50" class="image" />
    <rect x="250" y="120" width="50" height="50" class="image" />
    <!-- Connections -->
    <line x1="100" y1="100" x2="100" y2="120" class="image" />
    <line x1="250" y1="100" x2="250" y2="120" class="image" />
    <line x1="75" y1="145" x2="125" y2="145" class="image" />
    <line x1="175" y1="145" x2="225" y2="145" class="image" />
  </g>
</svg>