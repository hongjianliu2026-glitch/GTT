<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tenement</text>
  <text x="50" y="120" class="subtitle">[ˈtɛnəmənt] n. 公寓，廉价住宅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ten- (持有) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"持有(ten-)"着各自的房间，
    <tspan x="50" dy="25">这些房间聚集在一起，形成了一个公寓楼(tenement)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old tenement was renovated to provide better living conditions.
  </text>
  <text x="50" y="310" class="content">
    那栋旧公寓楼经过翻新，提供了更好的居住条件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Windows -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <rect x="50" y="90" width="50" height="50" class="image" />
    <rect x="120" y="90" width="50" height="50" class="image" />
    <rect x="190" y="90" width="50" height="50" class="image" />
    <rect x="260" y="90" width="50" height="50" class="image" />
    <!-- Doors -->
    <rect x="120" y="160" width="50" height="40" class="image" />
    <rect x="190" y="160" width="50" height="40" class="image" />
  </g>
</svg>