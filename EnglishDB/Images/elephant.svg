<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elephant</text>
  <text x="50" y="120" class="subtitle">[ˈɛləfənt] n. 大象</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eleph (象) + ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的大象，它的身体像一座移动的山，
    <tspan x="50" dy="25">四条腿像柱子一样支撑着它庞大的身躯，长长的鼻子可以</tspan>
    <tspan x="50" dy="25">卷起各种东西，这就是大象(elephant)的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The elephant is the largest land animal.
  </text>
  <text x="50" y="310" class="content">
    大象是陆地上最大的动物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elephant body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Elephant head -->
    <circle cx="220" cy="70" r="30" class="image" />
    <!-- Elephant trunk -->
    <path d="M220,70 Q250,100 220,130" class="image" />
    <!-- Elephant legs -->
    <rect x="70" y="100" width="20" height="100" class="image" />
    <rect x="130" y="100" width="20" height="100" class="image" />
    <rect x="180" y="100" width="20" height="100" class="image" />
    <rect x="240" y="100" width="20" height="100" class="image" />
  </g>
</svg>