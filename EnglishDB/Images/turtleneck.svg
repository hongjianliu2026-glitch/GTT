<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turtleneck</text>
  <text x="50" y="120" class="subtitle">[ˈtɜːrtlˌnɛk] n. 高领毛衣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turtle (乌龟) + neck (脖子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只乌龟(turtle)的脖子(neck)被拉长，变成了一个高领毛衣(turtleneck)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a turtleneck to keep warm during the winter.
  </text>
  <text x="50" y="310" class="content">
    她冬天穿了一件高领毛衣来保暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Turtle -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />

    <!-- Turtleneck -->
    <rect x="200" y="50" width="150" height="200" class="image" />
    <line x1="275" y1="50" x2="275" y2="250" class="image" />
    <line x1="275" y1="250" x2="225" y2="300" class="image" />
    <line x1="275" y1="250" x2="325" y2="300" class="image" />
    <line x1="275" y1="180" x2="225" y2="160" class="image" />
    <line x1="275" y1="180" x2="325" y2="160" class="image" />
  </g>
</svg>