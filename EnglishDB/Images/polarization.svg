<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polarization</text>
  <text x="50" y="120" class="subtitle">[ˌpoʊləraɪˈzeɪʃən] n. 极化，两极分化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pol- (极) + -ar (形容词后缀) + -ize (使...) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世界被分成两极，一边是"极(pol-)"
    <tspan x="50" dy="25">端的热情，另一边是极端的冷漠，这就是极化(polarization)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The debate led to a polarization of opinions.
  </text>
  <text x="50" y="310" class="content">
    这场辩论导致了意见的两极分化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two poles -->
    <line x1="0" y1="0" x2="0" y2="200" class="image" />
    <line x1="350" y1="0" x2="350" y2="200" class="image" />
    <!-- Polarization -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Hot and cold symbols -->
    <circle cx="50" cy="100" r="30" class="image" fill="#FF4136" />
    <circle cx="300" cy="100" r="30" class="image" fill="#0074D9" />
    <!-- Labels -->
    <text x="30" y="150" class="content">热情</text>
    <text x="280" y="150" class="content">冷漠</text>
  </g>
</svg>