<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">circumscribe</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrkəmˌskraɪb] v. 限制，划界</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> circum- (周围) + scrib (写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在纸上"围绕(circum-)"某个区域"写下(scrib)"
    <tspan x="50" dy="25">边界线，这个动作就是在限制(circumscribe)某个范围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government decided to circumscribe the area for development.
  </text>
  <text x="50" y="310" class="content">
    政府决定划定开发区域。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle representing the boundary -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Person drawing the boundary -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Pen drawing the boundary -->
    <line x1="175" y1="115" x2="255" y2="115" class="image" />
    <line x1="255" y1="115" x2="255" y2="135" class="image" />
  </g>
</svg>