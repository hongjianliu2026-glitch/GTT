<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quadrant</text>
  <text x="50" y="120" class="subtitle">[ˈkwɒdrənt] n. 象限，四分之一</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quadr- (四) + -ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆形被分成四个相等的部分，每个部分就是一个"四分之一(quadrant)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The graph is divided into four quadrants.
  </text>
  <text x="50" y="310" class="content">
    这个图表被分成了四个象限。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Circle -->
    <circle cx="200" cy="200" r="150" class="image" />
    <!-- Quadrants -->
    <line x1="200" y1="50" x2="200" y2="350" class="image" />
    <line x1="50" y1="200" x2="350" y2="200" class="image" />
    <!-- Labels -->
    <text x="150" y="120" class="content">Quadrant 1</text>
    <text x="250" y="120" class="content">Quadrant 2</text>
    <text x="150" y="280" class="content">Quadrant 3</text>
    <text x="250" y="280" class="content">Quadrant 4</text>
  </g>
</svg>