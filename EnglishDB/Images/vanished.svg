<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vanished</text>
  <text x="50" y="120" class="subtitle">[ˈvænɪʃt] v. 消失，突然不见</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> van (空) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体突然"空(van)"了，就像魔术师变魔术一样，
    <tspan x="50" dy="25">瞬间消失不见(vanish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thief vanished into the crowd.
  </text>
  <text x="50" y="310" class="content">
    小偷消失在人群中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vanished object -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <!-- Vanished effect -->
    <line x1="20" y1="20" x2="80" y2="80" class="image" />
    <line x1="20" y1="80" x2="80" y2="20" class="image" />
    <!-- Crowd -->
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="170" cy="50" r="10" class="image" />
    <circle cx="190" cy="50" r="10" class="image" />
    <circle cx="210" cy="50" r="10" class="image" />
    <circle cx="230" cy="50" r="10" class="image" />
  </g>
</svg>