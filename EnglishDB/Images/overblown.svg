<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overblown</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈbloʊn] adj. 夸张的，过度的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (过度) + blown (吹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球被"过度吹(over-blown)"得太大，
    <tspan x="50" dy="25">以至于快要爆炸，这就是夸张的(overblown)画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The situation was described as overblown by the media.
  </text>
  <text x="50" y="310" class="content">
    媒体将情况描述为过度夸张。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Overblown effect -->
    <circle cx="100" cy="100" r="70" class="image" stroke-dasharray="5,5" />
    <!-- Explosion -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <line x1="100" y1="30" x2="100" y2="170" class="image" />
    <line x1="30" y1="100" x2="170" y2="100" class="image" />
  </g>
</svg>