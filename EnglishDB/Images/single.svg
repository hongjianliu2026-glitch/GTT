<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">single</text>
  <text x="50" y="120" class="subtitle">[ˈsɪŋɡl] adj. 单一的，单个的；n. 单曲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> singul (单一)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孤独的音符"单一(singul)"地漂浮在空中，
    <tspan x="50" dy="25">这个音符就是一首单曲(single)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She released a single last week.
  </text>
  <text x="50" y="310" class="content">
    她上周发布了一首单曲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Single note -->
    <path d="M50 50 Q75 25 100 50 T150 50" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <!-- Floating note -->
    <line x1="100" y1="60" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
  </g>
</svg>