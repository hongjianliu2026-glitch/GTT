<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lethal</text>
  <text x="50" y="120" class="subtitle">[ˈliːθl] adj. 致命的，致死的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leth (死亡) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个毒药瓶，"死亡(leth)"的力量在其中，
    <tspan x="50" dy="25">任何接触它的人都会面临致命(lethal)的后果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The venom of this snake is lethal.
  </text>
  <text x="50" y="310" class="content">
    这种蛇的毒液是致命的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Poison bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="30" class="image" />
    <!-- Skull -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="30" y1="100" x2="70" y2="100" class="image" />
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <line x1="50" y1="120" x2="50" y2="140" class="image" />
    <line x1="40" y1="140" x2="60" y2="140" class="image" />
    <line x1="40" y1="140" x2="30" y2="160" class="image" />
    <line x1="60" y1="140" x2="70" y2="160" class="image" />
  </g>
</svg>