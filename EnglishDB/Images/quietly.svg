<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quietly</text>
  <text x="50" y="120" class="subtitle">[ˈkwaɪətli] adv. 安静地，悄悄地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quiet (安静) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在夜晚的房间里，"安静地(quiet-ly)"
    <tspan x="50" dy="25">踮着脚尖走路，生怕吵醒熟睡的主人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke quietly so as not to wake the baby.
  </text>
  <text x="50" y="310" class="content">
    她轻声说话，以免吵醒婴儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Front leg -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Back leg -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Tail -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Tail -->
    <!-- Moon -->
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Stars -->
    <circle cx="180" cy="30" r="5" class="image" />
    <circle cx="220" cy="40" r="5" class="image" />
    <circle cx="210" cy="70" r="5" class="image" />
  </g>
</svg>