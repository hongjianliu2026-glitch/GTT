<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unchanging</text>
  <text x="50" y="120" class="subtitle">[ʌnˈtʃeɪndʒɪŋ] adj. 不变的，恒定的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + change (改变) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的时钟，"不改变(un-changing)"
    <tspan x="50" dy="25">它的指针永远停留在同一位置，象征着恒定不变。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unchanging nature of the mountains is comforting.
  </text>
  <text x="50" y="310" class="content">
    山脉恒定不变的特性令人感到安慰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="30" class="image" />
    <line x1="175" y1="100" x2="235" y2="100" class="image" />
    <!-- Fixed position -->
    <circle cx="175" cy="100" r="5" class="image" fill="#7F8C8D" />
  </g>
</svg>