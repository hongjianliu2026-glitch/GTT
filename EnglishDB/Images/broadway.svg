<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Broadway</text>
  <text x="50" y="120" class="subtitle">[ˈbrɔːdweɪ] n. 百老汇（纽约市的一条著名街道）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> broad (宽的) + way (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条宽阔的街道(broad-way)，两旁灯火辉煌，
    <tspan x="50" dy="25">剧院林立，这就是纽约著名的百老汇(Broadway)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The musical was a hit on Broadway.
  </text>
  <text x="50" y="310" class="content">
    这部音乐剧在百老汇大受欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Theater -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="200" y="20" width="100" height="160" class="image" />
    <!-- Lights -->
    <line x1="70" y1="10" x2="70" y2="20" class="image" />
    <line x1="90" y1="10" x2="90" y2="20" class="image" />
    <line x1="110" y1="10" x2="110" y2="20" class="image" />
    <line x1="220" y1="10" x2="220" y2="20" class="image" />
    <line x1="240" y1="10" x2="240" y2="20" class="image" />
    <line x1="260" y1="10" x2="260" y2="20" class="image" />
    <!-- People -->
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
  </g>
</svg>