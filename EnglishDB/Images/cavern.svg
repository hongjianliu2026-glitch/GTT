<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cavern</text>
  <text x="50" y="120" class="subtitle">[ˈkævərn] n. 洞穴，大山洞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cav (洞) + -ern (表示场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"洞(cav)"，里面藏着无数的秘密，
    <tspan x="50" dy="25">这个洞就是"洞穴(cavern)"，深邃而神秘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The explorers discovered a hidden cavern deep in the mountains.
  </text>
  <text x="50" y="310" class="content">
    探险家们在深山中发现了一个隐藏的洞穴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cave entrance -->
    <path d="M0 100 Q 100 50 200 100 T 400 100" class="image" />
    <path d="M0 100 L0 200 L400 200 L400 100" class="image" />
    <!-- Shadows inside the cave -->
    <path d="M50 120 Q 100 110 150 120 T 350 120" class="image" />
    <path d="M50 140 Q 100 130 150 140 T 350 140" class="image" />
    <!-- Explorer -->
    <circle cx="300" cy="180" r="15" class="image" />
    <line x1="300" y1="195" x2="300" y2="220" class="image" />
    <line x1="300" y1="220" x2="280" y2="240" class="image" />
    <line x1="300" y1="220" x2="320" y2="240" class="image" />
    <line x1="300" y1="210" x2="330" y2="200" class="image" />
  </g>
</svg>