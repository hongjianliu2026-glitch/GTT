<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loath</text>
  <text x="50" y="120" class="subtitle">[loʊθ] adj. 不愿意的，勉强的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loa- (不愿意) + -th (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"不愿意(loa-)"
    <tspan x="50" dy="25">跳下去，表现出勉强的状态(loath)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was loath to leave his hometown.
  </text>
  <text x="50" y="310" class="content">
    他不愿意离开他的家乡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Expression -->
    <line x1="40" y1="140" x2="60" y2="140" class="image" />
    <line x1="45" y1="135" x2="40" y2="140" class="image" />
    <line x1="55" y1="135" x2="60" y2="140" class="image" />
    <line x1="45" y1="150" x2="55" y2="150" class="image" />
    <line x1="45" y1="150" x2="40" y2="155" class="image" />
    <line x1="55" y1="150" x2="60" y2="155" class="image" />
  </g>
</svg>