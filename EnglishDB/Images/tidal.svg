<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .wave { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tidal</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪdl] adj. 潮汐的，潮水的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tide (潮汐) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的潮汐(tide)，像一只巨大的手，
    <tspan x="50" dy="25">每天两次"拍打(tidal)"海岸，带来潮汐的变化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tidal wave caused significant damage to the coastal town.
  </text>
  <text x="50" y="310" class="content">
    潮汐波对沿海城镇造成了重大破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Waves -->
    <path d="M50 50 Q100 20 150 50 T250 50 T300 20 T350 50" class="wave" />
    <path d="M50 80 Q100 50 150 80 T250 80 T300 50 T350 80" class="wave" />
    <path d="M50 110 Q100 80 150 110 T250 110 T300 80 T350 110" class="wave" />
    <path d="M50 140 Q100 110 150 140 T250 140 T300 110 T350 140" class="wave" />
    <!-- Shoreline -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>