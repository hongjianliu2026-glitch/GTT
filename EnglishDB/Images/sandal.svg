<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sandal</text>
  <text x="50" y="120" class="subtitle">[ˈsændl] n. 凉鞋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sand (沙子) + al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着凉鞋，走在沙滩上，"沙子(sand)"
    <tspan x="50" dy="25">从脚趾间滑过，这种鞋就叫做凉鞋(sandal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a pair of sandals to the beach.
  </text>
  <text x="50" y="310" class="content">
    她穿着一双凉鞋去海滩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sandal -->
    <rect x="0" y="0" width="150" height="50" class="image" />
    <line x1="20" y1="50" x2="130" y2="50" class="image" />
    <line x1="20" y1="50" x2="20" y2="0" class="image" />
    <line x1="130" y1="50" x2="130" y2="0" class="image" />
    <line x1="75" y1="50" x2="75" y2="0" class="image" />
    <!-- Foot -->
    <circle cx="75" cy="60" r="20" class="image" />
    <line x1="75" y1="80" x2="75" y2="100" class="image" />
    <line x1="75" y1="100" x2="55" y2="120" class="image" />
    <line x1="75" y1="100" x2="95" y2="120" class="image" />
    <line x1="75" y1="90" x2="105" y2="80" class="image" />
  </g>
</svg>