<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grimace</text>
  <text x="50" y="120" class="subtitle">[ɡrɪˈmeɪs] n. 鬼脸，痛苦的表情；v. 做鬼脸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gri- (抓) + mace (面具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为痛苦而"抓(gri-)"住自己的"面具(mace)"，
    <tspan x="50" dy="25">做出扭曲的鬼脸(grimace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made a grimace when he tasted the bitter medicine.
  </text>
  <text x="50" y="310" class="content">
    他尝到苦药时做出了痛苦的表情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 50 140 Q 100 180 150 140" class="image" />
    <!-- Hand -->
    <line x1="100" y1="200" x2="100" y2="280" class="image" />
    <line x1="100" y1="240" x2="80" y2="220" class="image" />
    <line x1="100" y1="240" x2="120" y2="220" class="image" />
  </g>
</svg>