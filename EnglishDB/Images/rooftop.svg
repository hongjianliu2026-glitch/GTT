<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rooftop</text>
  <text x="50" y="120" class="subtitle">[ˈruːftɒp] n. 屋顶，屋顶平台</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roof (屋顶) + top (顶部)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在屋顶(roof)的顶部(top)，
    <tspan x="50" dy="25">俯瞰整个城市，享受着高处的风景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They had a party on the rooftop last night.
  </text>
  <text x="50" y="310" class="content">
    他们昨晚在屋顶平台上举办了一个派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Building -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Roof -->
    <polygon points="50,0 250,0 200,50 100,50" class="image" />
    <!-- Person on the rooftop -->
    <circle cx="150" cy="30" r="15" class="image" />
    <line x1="150" y1="45" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="130" y2="110" class="image" />
    <line x1="150" y1="80" x2="170" y2="110" class="image" />
    <line x1="150" y1="60" x2="180" y2="50" class="image" />
  </g>
</svg>