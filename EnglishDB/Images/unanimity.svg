<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unanimity</text>
  <text x="50" y="120" class="subtitle">[ˌjuːnəˈnɪmɪti] n. 全体一致，一致同意</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (一个) + anim (心) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"一个心(uni-anim)"
    <tspan x="50" dy="25">都同意某件事，这就是全体一致(unanimity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The proposal was approved with unanimity.
  </text>
  <text x="50" y="310" class="content">
    该提案以全体一致通过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Hearts -->
    <path d="M50 80 C50 100, 150 100, 150 80" class="image" />
    <path d="M150 80 C150 100, 250 100, 250 80" class="image" />
    <!-- Agreement -->
    <line x1="50" y1="120" x2="250" y2="120" class="image" />
    <line x1="50" y1="120" x2="50" y2="140" class="image" />
    <line x1="250" y1="120" x2="250" y2="140" class="image" />
    <line x1="50" y1="140" x2="250" y2="140" class="image" />
  </g>
</svg>