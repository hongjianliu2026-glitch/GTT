<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">continual</text>
  <text x="50" y="120" class="subtitle">[kənˈtɪnjuəl] adj. 持续不断的，频繁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tin (保持) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个钟表的指针"一起保持(con-tin-ual)"
    <tspan x="50" dy="25">不停地转动，象征着持续不断的时间流逝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The continual rain made the trip difficult.
  </text>
  <text x="50" y="310" class="content">
    持续不断的雨让旅行变得困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Dots for hours -->
    <circle cx="105" cy="100" r="5" class="image" />
    <circle cx="245" cy="100" r="5" class="image" />
    <circle cx="175" cy="20" r="5" class="image" />
    <circle cx="175" cy="180" r="5" class="image" />
  </g>
</svg>