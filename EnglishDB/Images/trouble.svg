<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trouble</text>
  <text x="50" y="120" class="subtitle">[ˈtrʌbl] n. 麻烦，困难；v. 使烦恼，使苦恼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> troubl (拉丁语 turbare，意为“扰乱”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的风暴(turbare)席卷而来，
    <tspan x="50" dy="25">扰乱(trouble)了平静的海面，带来了无尽的麻烦。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was in trouble when she lost her keys.
  </text>
  <text x="50" y="310" class="content">
    她丢了钥匙，陷入了麻烦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Storm clouds -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <ellipse cx="100" cy="80" rx="100" ry="40" class="image" />
    <ellipse cx="250" cy="80" rx="100" ry="40" class="image" />
    <!-- Waves -->
    <path d="M50 200 Q100 150 150 200 T250 200" class="image" />
    <path d="M50 220 Q100 170 150 220 T250 220" class="image" />
    <path d="M50 240 Q100 190 150 240 T250 240" class="image" />
    <!-- Ship in trouble -->
    <rect x="120" y="180" width="100" height="20" class="image" />
    <line x1="120" y1="180" x2="170" y2="160" class="image" />
    <line x1="220" y1="180" x2="170" y2="160" class="image" />
  </g>
</svg>