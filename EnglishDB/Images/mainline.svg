<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mainline</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪnlaɪn] n. 主线，干线；v. 注入主线</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> main (主要的) + line (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的高速公路，"主要的线(main-line)"
    <tspan x="50" dy="25">上车辆川流不息，这就是主线(mainline)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new feature was mainlined into the project.
  </text>
  <text x="50" y="310" class="content">
    新功能被注入到项目的主线中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main road -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Cars -->
    <rect x="20" y="10" width="30" height="30" class="image" />
    <rect x="80" y="10" width="30" height="30" class="image" />
    <rect x="140" y="10" width="30" height="30" class="image" />
    <rect x="200" y="10" width="30" height="30" class="image" />
    <rect x="260" y="10" width="30" height="30" class="image" />
    <rect x="320" y="10" width="30" height="30" class="image" />
  </g>
</svg>