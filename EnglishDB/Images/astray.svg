<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">astray</text>
  <text x="50" y="120" class="subtitle">[əˈstreɪ] adv. 迷途地，误入歧途地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (离开) + str (拉) + ay (方向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小羊被"拉离(a-str)"了正确的道路，
    <tspan x="50" dy="25">迷途地(astray)走在错误的路上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child went astray in the forest.
  </text>
  <text x="50" y="310" class="content">
    孩子在森林里迷路了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path -->
    <path d="M0 100 Q100 200 200 100 T400 100" class="image" />
    <!-- Sheep -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Wrong path -->
    <path d="M250 100 Q350 200 450 100" class="image" />
    <!-- Arrow pointing astray -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,80 270,100 250,120" class="image" />
  </g>
</svg>