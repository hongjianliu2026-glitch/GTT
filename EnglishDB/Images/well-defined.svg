<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">well-defined</text>
  <text x="50" y="120" class="subtitle">[ˌwɛl dɪˈfaɪnd] adj. 定义明确的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> well (好) + define (定义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完美的圆圈，"好地定义(well-define)"
    <tspan x="50" dy="25">它的边界清晰，没有任何模糊的地方，这就是定义明确的(well-defined)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rules of the game are well-defined.
  </text>
  <text x="50" y="310" class="content">
    游戏的规则定义得很明确。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Perfect circle -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Clear boundary -->
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <!-- Text annotation -->
    <text x="100" y="220" class="content" text-anchor="middle">清晰边界</text>
  </g>
</svg>