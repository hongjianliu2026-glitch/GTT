<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clearinghouse</text>
  <text x="50" y="120" class="subtitle">[ˈklɪrɪŋhaʊs] n. 票据交换所，清算中心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clear (清除) + house (房子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的房子，里面堆满了各种票据和账单，
    <tspan x="50" dy="25">工人们正在忙碌地"清除(clear)"这些票据，</tspan>
    <tspan x="50" dy="25">确保所有交易都被正确处理，这就是票据交换所(clearinghouse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clearinghouse ensures all transactions are settled accurately.
  </text>
  <text x="50" y="310" class="content">
    票据交换所确保所有交易都能准确结算。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="80" class="image" />
    <!-- Window -->
    <rect x="50" y="50" width="80" height="50" class="image" />
    <rect x="220" y="50" width="80" height="50" class="image" />
    <!-- Clearing action -->
    <line x1="70" y1="180" x2="280" y2="180" class="image" />
    <line x1="70" y1="180" x2="70" y2="200" class="image" />
    <line x1="280" y1="180" x2="280" y2="200" class="image" />
    <line x1="70" y1="200" x2="280" y2="200" class="image" />
    <!-- Documents -->
    <rect x="100" y="100" width="30" height="40" class="image" />
    <rect x="140" y="100" width="30" height="40" class="image" />
    <rect x="180" y="100" width="30" height="40" class="image" />
    <rect x="220" y="100" width="30" height="40" class="image" />
  </g>
</svg>