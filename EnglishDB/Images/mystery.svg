<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5EEF8; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mystery</text>
  <text x="50" y="120" class="subtitle">[ˈmɪstri] n. 神秘，谜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> myst (神秘) + -ery (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的卷轴，上面写着"神秘(myst)"
    <tspan x="50" dy="25">的文字，没有人能解开它的谜(mystery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The identity of the thief remains a mystery.
  </text>
  <text x="50" y="310" class="content">
    小偷的身份仍然是个谜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancient scroll -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Mysterious text -->
    <text x="70" y="60" class="content" style="font-family: 'Times New Roman', serif; font-size: 24px;">
      神秘文字
    </text>
    <!-- Question mark -->
    <text x="180" y="140" class="content" style="font-size: 60px; fill: #C0392B;">
      ?
    </text>
  </g>
</svg>