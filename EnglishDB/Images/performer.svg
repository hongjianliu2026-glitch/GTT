<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">performer</text>
  <text x="50" y="120" class="subtitle">[pərˈfɔːrmər] n. 表演者，执行者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + form (形式) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完全掌握(per-)某种形式(form)的人，
    <tspan x="50" dy="25">他/她就是表演者(performer)，能在舞台上完美呈现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The performer captivated the audience with her dance.
  </text>
  <text x="50" y="310" class="content">
    这位表演者用她的舞蹈迷住了观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Performer -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="150" y2="190" class="image" />
    <line x1="175" y1="160" x2="200" y2="190" class="image" />
    <line x1="175" y1="140" x2="140" y2="130" class="image" />
    <line x1="175" y1="140" x2="210" y2="130" class="image" />
    <!-- Spotlight -->
    <ellipse cx="175" cy="50" rx="50" ry="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="100" class="image" />
  </g>
</svg>