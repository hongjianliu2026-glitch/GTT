<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .coral { fill: #FF6F61; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coral</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrəl] n. 珊瑚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cor- (心) + al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗心形的珊瑚(coral)，它像一颗红色的心，
    <tspan x="50" dy="25">静静地躺在海底，守护着海洋的秘密。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The diver found a beautiful piece of coral.
  </text>
  <text x="50" y="310" class="content">
    潜水员发现了一块美丽的珊瑚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart-shaped coral -->
    <path d="M50,50 C50,25 90,25 90,50 C90,75 50,75 50,50 Z" class="coral" />
    <!-- Sea background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bubbles -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="130" cy="90" r="12" class="image" />
    <!-- Fish -->
    <path d="M150,150 Q170,140 180,160 Q190,180 170,170 Z" class="image" />
  </g>
</svg>