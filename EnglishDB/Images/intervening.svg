<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intervening</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈviːnɪŋ] adj. 介于中间的，插入的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + ven (来) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然"插入(inter-ven)"到两个人之间，
    <tspan x="50" dy="25">就像一个巨大的箭头从天而降，把他们分隔开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The intervening years had changed him a lot.
  </text>
  <text x="50" y="310" class="content">
    这些年里，他改变了很多。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Intervening arrow -->
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <polygon points="150,50 140,60 160,60" class="image" />
    <polygon points="150,150 140,140 160,140" class="image" />
  </g>
</svg>