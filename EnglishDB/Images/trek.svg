<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trek</text>
  <text x="50" y="120" class="subtitle">[trɛk] v. 艰苦跋涉，徒步旅行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trek (源自荷兰语 trekken，意为“拉，拖”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群徒步旅行者，"拖着(trek)"
    <tspan x="50" dy="25">沉重的背包，穿越崎岖的山路，这就是trek的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to trek across the Himalayas.
  </text>
  <text x="50" y="310" class="content">
    他们决定徒步穿越喜马拉雅山。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 50 L200 200 Z" class="image" />
    <!-- Hiker -->
    <circle cx="100" cy="150" r="10" class="image" />
    <line x1="100" y1="160" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="90" y2="210" class="image" />
    <line x1="100" y1="190" x2="110" y2="210" class="image" />
    <line x1="100" y1="170" x2="120" y2="160" class="image" />
    <!-- Backpack -->
    <rect x="90" y="160" width="20" height="30" class="image" />
  </g>
</svg>