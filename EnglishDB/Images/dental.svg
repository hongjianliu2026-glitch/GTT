<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dental</text>
  <text x="50" y="120" class="subtitle">[ˈdɛntl] adj. 牙齿的，牙科的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dent (牙齿) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个牙医在检查病人的牙齿，"牙齿(dent)"
    <tspan x="50" dy="25">相关的所有事物都被称为牙科的(dental)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Regular dental check-ups are important for maintaining good oral health.
  </text>
  <text x="50" y="310" class="content">
    定期进行牙科检查对保持良好的口腔健康很重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tooth -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image" />
    <path d="M50,50 L50,150 Q100,180 150,150 T250,150 L250,50" class="image" />
    <!-- Dentist -->
    <circle cx="150" cy="200" r="20" class="image" />
    <line x1="150" y1="220" x2="150" y2="260" class="image" />
    <line x1="150" y1="260" x2="130" y2="300" class="image" />
    <line x1="150" y1="260" x2="170" y2="300" class="image" />
    <line x1="150" y1="240" x2="120" y2="230" class="image" />
    <line x1="150" y1="240" x2="180" y2="230" class="image" />
    <!-- Dentist's tools -->
    <rect x="130" y="170" width="40" height="20" class="image" />
    <rect x="140" y="160" width="20" height="10" class="image" />
  </g>
</svg>