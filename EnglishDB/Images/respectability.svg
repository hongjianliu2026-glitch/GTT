<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">respectability</text>
  <text x="50" y="120" class="subtitle">[rɪˌspektəˈbɪləti] n. 可敬，体面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + spect (看) + -ability (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着整洁的西装，戴着礼帽，"再次被人们(re-spect)"
    <tspan x="50" dy="25">尊敬地看待，因为他展现了体面(respectability)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His new job gave him a sense of respectability.
  </text>
  <text x="50" y="310" class="content">
    他的新工作给了他一种体面的感觉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Man in suit -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="0" y2="200" class="image" />
    <line x1="50" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="120" class="image" />
    <line x1="50" y1="100" x2="100" y2="120" class="image" />
    <!-- Hat -->
    <rect x="30" y="20" width="40" height="10" class="image" />
    <!-- Respect symbol -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
  </g>
</svg>