<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enigmatic</text>
  <text x="50" y="120" class="subtitle">[ˌɛnɪɡˈmætɪk] adj. 神秘的，难以理解的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + -ig (做) + -matic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的盒子，"使(en-)做(ig)"
    <tspan x="50" dy="25">出难以理解的事情，这个盒子就是enigmatic的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enigmatic smile of the Mona Lisa has puzzled art historians for centuries.
  </text>
  <text x="50" y="310" class="content">
    蒙娜丽莎神秘的微笑让艺术史学家们困惑了几个世纪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mysterious box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Question mark -->
    <text x="100" y="80" class="image" font-size="80" text-anchor="middle">?</text>
    <!-- Light rays -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
  </g>
</svg>