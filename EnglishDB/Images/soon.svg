<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soon</text>
  <text x="50" y="120" class="subtitle">[suːn] adv. 很快，不久</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> so- (表示强调) + on (继续)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟的指针飞速转动，"强调继续(so-on)"
    <tspan x="50" dy="25">向前，时间很快就会到来，这就是'很快'(soon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We will meet soon.
  </text>
  <text x="50" y="310" class="content">
    我们很快就会见面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Fast-forward symbol -->
    <polygon points="220,100 260,80 260,120" class="image" />
    <polygon points="280,100 320,80 320,120" class="image" />
  </g>
</svg>