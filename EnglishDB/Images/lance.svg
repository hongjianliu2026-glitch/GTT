<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lance</text>
  <text x="50" y="120" class="subtitle">[læns] n. 长矛，标枪；v. 用长矛刺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lanc (刺，切)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骑士手持"长矛(lance)"，
    <tspan x="50" dy="25">准备在战场上"刺穿(lanc)"敌人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The knight wielded his lance with precision.
  </text>
  <text x="50" y="310" class="content">
    骑士精准地挥舞着他的长矛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lance -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <polygon points="40,50 60,50 50,30" class="image" />
    <!-- Knight -->
    <circle cx="50" cy="220" r="20" class="image" />
    <line x1="50" y1="240" x2="50" y2="280" class="image" />
    <line x1="50" y1="280" x2="30" y2="320" class="image" />
    <line x1="50" y1="280" x2="70" y2="320" class="image" />
    <line x1="50" y1="260" x2="80" y2="250" class="image" />
  </g>
</svg>