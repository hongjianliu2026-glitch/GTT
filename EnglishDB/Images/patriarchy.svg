<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">patriarchy</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪtriɑːrki] n. 父权制，家长制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> patria (父亲) + archy (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的父亲形象，手持权杖，
    <tspan x="50" dy="25">统治着整个家庭和社会，这就是父权制(patriarchy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concept of patriarchy has been challenged in recent years.
  </text>
  <text x="50" y="310" class="content">
    近年来，父权制的概念受到了挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Father figure -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Scepter -->
    <line x1="50" y1="130" x2="50" y2="50" class="image" />
    <circle cx="50" cy="40" r="10" class="image" />
    <!-- Family -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="175" cy="150" r="20" class="image" />
    <!-- Ruler -->
    <line x1="0" y1="280" x2="300" y2="280" class="image" />
  </g>
</svg>