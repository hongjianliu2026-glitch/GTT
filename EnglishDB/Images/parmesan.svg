<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Parmesan</text>
  <text x="50" y="120" class="subtitle">[ˌpɑrməˈsɑn] n. 帕尔马干酪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自意大利帕尔马地区，以其独特的奶酪闻名。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个意大利厨师在厨房里，"切下(Parmesan)"
    <tspan x="50" dy="25">一块金黄色的帕尔马干酪，香气四溢，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She grated some Parmesan over her pasta.
  </text>
  <text x="50" y="310" class="content">
    她在她的意大利面上撒了一些帕尔马干酪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cheese block -->
    <rect x="0" y="0" width="200" height="150" class="image" fill="#F9E79F" />
    <!-- Chef -->
    <circle cx="250" cy="75" r="20" class="image" fill="#F1C40F" />
    <line x1="250" y1="95" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="120" x2="280" y2="110" class="image" />
    <!-- Knife -->
    <line x1="250" y1="100" x2="300" y2="50" class="image" stroke="#C0392B" stroke-width="4" />
    <!-- Cheese slice -->
    <rect x="100" y="160" width="100" height="20" class="image" fill="#F9E79F" />
  </g>
</svg>