<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hallmark</text>
  <text x="50" y="120" class="subtitle">[ˈhɔːlmɑːrk] n. 标志，特征；v. 给...打上品质证明印记</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hall (大厅) + mark (标记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的大厅里，墙上挂满了各种品质证明的印记(hallmark)，
    <tspan x="50" dy="25">每个印记都代表着一种独特的特征或标志。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hallmark of a great leader is their ability to inspire others.
  </text>
  <text x="50" y="310" class="content">
    伟大领导者的标志是他们激励他人的能力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wall with marks -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Marks -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="140" r="10" class="image" />
    <!-- Hallmark -->
    <text x="100" y="180" class="image" font-size="24" fill="#2980B9">Hallmark</text>
  </g>
</svg>