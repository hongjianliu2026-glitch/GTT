<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irregular</text>
  <text x="50" y="120" class="subtitle">[ɪˈreɡjələr] adj. 不规则的，不整齐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (不) + regular (规则的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拼图游戏，其中有一块拼图形状"不规则(irregular)"，
    <tspan x="50" dy="25">它无法与其他拼图完美契合，显得格外突出。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coastline is irregular, with many bays and inlets.
  </text>
  <text x="50" y="310" class="content">
    海岸线不规则，有许多海湾和入口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Irregular piece -->
    <polygon points="360,0 460,0 460,100 410,100 410,50 360,50" class="image" />
    <!-- Label -->
    <text x="380" y="120" class="highlight">Irregular</text>
  </g>
</svg>