<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discipline</text>
  <text x="50" y="120" class="subtitle">[ˈdɪsəplɪn] n. 纪律，学科；v. 训练，惩罚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + cip (拿) + line (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老师在教室里，"分开(dis-)"学生们，让他们"拿(cip)"起书本，
    <tspan x="50" dy="25">沿着"线(line)"坐好，这就是纪律(discipline)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher enforced discipline in the classroom.
  </text>
  <text x="50" y="310" class="content">
    老师在教室里执行纪律。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teacher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Students -->
    <rect x="70" y="20" width="50" height="100" class="image" />
    <rect x="140" y="20" width="50" height="100" class="image" />
    <rect x="210" y="20" width="50" height="100" class="image" />
    <!-- Books -->
    <rect x="80" y="30" width="30" height="80" class="image" />
    <rect x="150" y="30" width="30" height="80" class="image" />
    <rect x="220" y="30" width="30" height="80" class="image" />
    <!-- Lines -->
    <line x1="70" y1="130" x2="260" y2="130" class="image" />
  </g>
</svg>