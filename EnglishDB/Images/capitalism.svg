<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">capitalism</text>
  <text x="50" y="120" class="subtitle">[ˈkæpɪtəlɪzəm] n. 资本主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> capital (资本) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金币堆，上面写着"资本(capital)"，
    <tspan x="50" dy="25">周围环绕着各种商业活动，这就是"主义(ism)"，</tspan>
    <tspan x="50" dy="25">象征着资本主义(capitalism)的核心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Capitalism has shaped modern economic systems.
  </text>
  <text x="50" y="310" class="content">
    资本主义塑造了现代经济体系。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coin stack -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <circle cx="100" cy="150" r="40" class="image" fill="#FFD700" />
    <circle cx="100" cy="200" r="30" class="image" fill="#FFD700" />
    <circle cx="100" cy="250" r="20" class="image" fill="#FFD700" />
    <circle cx="100" cy="300" r="10" class="image" fill="#FFD700" />
    <!-- Capital text -->
    <text x="80" y="180" class="content" fill="#000000">Capital</text>
    <!-- Business activities -->
    <rect x="200" y="50" width="100" height="50" class="image" fill="#3498DB" />
    <rect x="200" y="120" width="100" height="50" class="image" fill="#3498DB" />
    <rect x="200" y="190" width="100" height="50" class="image" fill="#3498DB" />
    <rect x="200" y="260" width="100" height="50" class="image" fill="#3498DB" />
    <!-- Business text -->
    <text x="210" y="80" class="content" fill="#FFFFFF">Business</text>
    <text x="210" y="150" class="content" fill="#FFFFFF">Business</text>
    <text x="210" y="220" class="content" fill="#FFFFFF">Business</text>
    <text x="210" y="290" class="content" fill="#FFFFFF">Business</text>
  </g>
</svg>