<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">restaurant</text>
  <text x="50" y="120" class="subtitle">[ˈrestrɒnt] n. 餐馆，饭店</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> restauro (恢复) + -ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的旅行者走进一家餐馆，"恢复(restauro)"
    <tspan x="50" dy="25">他的精力，享受美食，这就是餐馆(restaurant)的意义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had dinner at a fancy restaurant last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚我们在一家高档餐厅吃了晚餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Restaurant building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Window -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <rect x="200" y="50" width="100" height="50" class="image" />
    <!-- Table -->
    <rect x="100" y="150" width="150" height="30" class="image" />
    <!-- Chairs -->
    <line x1="110" y1="180" x2="110" y2="200" class="image" />
    <line x1="240" y1="180" x2="240" y2="200" class="image" />
    <!-- Traveler -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>