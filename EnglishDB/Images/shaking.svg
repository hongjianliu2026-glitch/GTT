<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shaking</text>
  <text x="50" y="120" class="subtitle">[ˈʃeɪkɪŋ] adj. 令人震惊的，颤抖的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shake (摇动) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为听到一个"令人震惊(shaking)"的消息，
    <tspan x="50" dy="25">身体不由自主地开始"摇动(shake)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the accident was really shaking.
  </text>
  <text x="50" y="310" class="content">
    事故的消息真是令人震惊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person shaking -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Shocked expression -->
    <circle cx="40" cy="90" r="3" class="image" /> <!-- Left eye -->
    <circle cx="60" cy="90" r="3" class="image" /> <!-- Right eye -->
    <line x1="45" y1="110" x2="55" y2="110" class="image" /> <!-- Mouth -->
    <!-- Shocked message -->
    <text x="100" y="120" class="content" style="font-size: 24px; fill: #E74C3C;">"Shocking News!"</text>
  </g>
</svg>