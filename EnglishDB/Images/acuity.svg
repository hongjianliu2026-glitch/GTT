  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acuity</text>
  <text x="50" y="120" class="subtitle">[əˈkjuːɪti] n. 敏锐，尖锐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> acu- (尖锐) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探用"尖锐的(acu-)"目光
    <tspan x="50" dy="25">盯着线索，他的敏锐(acuity)帮助他迅速破案。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her visual acuity is remarkable.
  </text>
  <text x="50" y="310" class="content">
    她的视觉敏锐度非常出色。
  </text>

