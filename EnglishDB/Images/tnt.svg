<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">TNT</text>
  <text x="50" y="120" class="subtitle">[trinitrotoluene] n. 三硝基甲苯，炸药</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tri- (三) + nitro (硝基) + toluene (甲苯)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的炸弹，上面写着"TNT"，
    <tspan x="50" dy="25">它由三个硝基(tri-nitro)和一个甲苯(toluene)组成，</tspan>
    <tspan x="50" dy="25">一旦引爆，威力无比，震撼天地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The demolition team used TNT to bring down the old building.
  </text>
  <text x="50" y="310" class="content">
    拆除队使用TNT炸药来拆除旧建筑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bomb -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- TNT label -->
    <text x="50" y="80" class="title" style="font-size: 48px;">TNT</text>
    <!-- Explosion -->
    <circle cx="100" cy="200" r="50" class="image" />
    <circle cx="120" cy="220" r="40" class="image" />
    <circle cx="80" cy="220" r="40" class="image" />
    <circle cx="100" cy="240" r="30" class="image" />
  </g>
</svg>