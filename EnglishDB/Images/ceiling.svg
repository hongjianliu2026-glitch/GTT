<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ceiling</text>
  <text x="50" y="120" class="subtitle">[ˈsiːlɪŋ] n. 天花板</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> celi- (天空) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间的天花板，它就像天空(celi-)一样，
    <tspan x="50" dy="25">覆盖在房间的上方，给人一种被天空包围的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ceiling in the room was painted with stars.
  </text>
  <text x="50" y="310" class="content">
    房间的天花板上画满了星星。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ceiling -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="45" r="5" class="image" />
    <circle cx="150" cy="45" r="5" class="image" />
    <circle cx="200" cy="45" r="5" class="image" />
    <circle cx="250" cy="45" r="5" class="image" />
    <!-- Walls -->
    <line x1="50" y1="70" x2="50" y2="200" class="image" />
    <line x1="300" y1="70" x2="300" y2="200" class="image" />
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
  </g>
</svg>