<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFC107; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #FFA000; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunshine</text>
  <text x="50" y="120" class="subtitle">[ˈsʌnʃaɪn] n. 阳光，晴天</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + shine (照耀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳(sun)在天空中"照耀(shine)"，
    <tspan x="50" dy="25">洒下温暖的光芒，这就是阳光(sunshine)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sunshine made the flowers bloom.
  </text>
  <text x="50" y="310" class="content">
    阳光使花朵盛开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFEB3B" />
    <!-- Rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Ground -->
    <rect x="0" y="200" width="200" height="50" class="image" fill="#8BC34A" />
    <!-- Flowers -->
    <circle cx="50" cy="220" r="10" class="image" fill="#FF5722" />
    <circle cx="150" cy="220" r="10" class="image" fill="#FF5722" />
  </g>
</svg>