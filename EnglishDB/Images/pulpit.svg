<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pulpit</text>
  <text x="50" y="120" class="subtitle">[ˈpʊl.pɪt] n. 讲坛，布道坛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pul (拉) + pit (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个牧师站在一个高高的讲坛上，"拉(pul)"
    <tspan x="50" dy="25">住听众的注意力，这个地方(pit)就是讲坛(pulpit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The preacher climbed up to the pulpit to deliver his sermon.
  </text>
  <text x="50" y="310" class="content">
    牧师爬上讲坛开始布道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Pulpit -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Speaker -->
    <circle cx="100" cy="50" r="20" class="image" />
    <line x1="100" y1="70" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="200" class="image" />
    <line x1="100" y1="150" x2="120" y2="200" class="image" />
    <line x1="100" y1="100" x2="150" y2="90" class="image" />
  </g>
</svg>