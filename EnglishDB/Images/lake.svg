<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lake</text>
  <text x="50" y="120" class="subtitle">[leɪk] n. 湖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lac (湖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"湖(lake)"，湖水清澈见底，
    <tspan x="50" dy="25">湖边有树木环绕，湖面上有几只天鹅在悠闲地游动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We spent the weekend by the lake, enjoying the peaceful scenery.
  </text>
  <text x="50" y="310" class="content">
    我们在湖边度过了周末，享受着宁静的景色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lake -->
    <ellipse cx="200" cy="150" rx="150" ry="70" class="water" />
    <!-- Trees -->
    <rect x="50" y="100" width="30" height="100" class="image" />
    <rect x="100" y="100" width="30" height="100" class="image" />
    <rect x="150" y="100" width="30" height="100" class="image" />
    <rect x="250" y="100" width="30" height="100" class="image" />
    <rect x="300" y="100" width="30" height="100" class="image" />
    <!-- Swans -->
    <circle cx="150" cy="130" r="10" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
  </g>
</svg>