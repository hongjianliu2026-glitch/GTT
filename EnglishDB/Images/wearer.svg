<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wearer</text>
  <text x="50" y="120" class="subtitle">[ˈwɛrər] n. 穿戴者，佩戴者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wear (穿戴) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着华丽服装的人，"穿戴(wear)"
    <tspan x="50" dy="25">着各种饰品，这个人就是穿戴者(wearer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wearer of the crown must bear its weight.
  </text>
  <text x="50" y="310" class="content">
    戴皇冠的人必须承受其重量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Clothing -->
    <rect x="20" y="80" width="60" height="70" class="image" />
    <!-- Accessories -->
    <circle cx="50" cy="40" r="10" class="image" />
    <line x1="50" y1="50" x2="50" y2="60" class="image" />
    <line x1="50" y1="60" x2="40" y2="70" class="image" />
    <line x1="50" y1="60" x2="60" y2="70" class="image" />
  </g>
</svg>