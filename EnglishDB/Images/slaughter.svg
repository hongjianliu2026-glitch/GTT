<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slaughter</text>
  <text x="50" y="120" class="subtitle">[ˈslɔːtər] n. 屠杀，屠宰；v. 屠杀，屠宰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slav (奴隶) + -er (动作执行者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的奴隶(slav)被迫执行屠杀(slaughter)，
    <tspan x="50" dy="25">场面血腥，令人心惊。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers were accused of slaughtering innocent civilians.
  </text>
  <text x="50" y="310" class="content">
    士兵们被指控屠杀了无辜的平民。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blood splatter -->
    <circle cx="50" cy="50" r="20" class="image" fill="#B03A2E" />
    <circle cx="80" cy="70" r="15" class="image" fill="#B03A2E" />
    <circle cx="110" cy="60" r="25" class="image" fill="#B03A2E" />
    <!-- Slave figure -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="150" x2="130" y2="130" class="image" />
    <line x1="150" y1="150" x2="170" y2="130" class="image" />
    <line x1="150" y1="180" x2="130" y2="200" class="image" />
    <line x1="150" y1="180" x2="170" y2="200" class="image" />
    <!-- Slaughtering action -->
    <line x1="150" y1="120" x2="100" y2="80" class="image" stroke-width="4" />
  </g>
</svg>