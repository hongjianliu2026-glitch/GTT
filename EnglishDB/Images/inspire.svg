<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inspire</text>
  <text x="50" y="120" class="subtitle">[ɪnˈspaɪər] v. 激励，鼓舞；激发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + spir (呼吸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位艺术家在创作时，"吸入(in-spir)"
    <tspan x="50" dy="25">灵感，这些灵感激发了他的创作热情，</tspan>
    <tspan x="50" dy="25">使他创作出令人惊叹的作品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her speech inspired the audience to take action.
  </text>
  <text x="50" y="310" class="content">
    她的演讲激励了观众采取行动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Inspiration -->
    <line x1="20" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="250" y2="100" class="image" />
    <!-- Artwork -->
    <rect x="100" y="120" width="150" height="100" class="image" />
    <line x1="120" y1="140" x2="230" y2="140" class="image" />
    <line x1="120" y1="160" x2="230" y2="160" class="image" />
    <line x1="120" y1="180" x2="230" y2="180" class="image" />
  </g>
</svg>