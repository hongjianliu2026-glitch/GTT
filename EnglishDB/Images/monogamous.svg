<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monogamous</text>
  <text x="50" y="120" class="subtitle">[məˈnɒɡəməs] adj. 一夫一妻制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mono- (单一) + gam (婚姻) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个只与一个人结婚的场景，"单一的婚姻(mono-gam-ous)"
    <tspan x="50" dy="25">象征着忠诚和专一。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They have a monogamous relationship.
  </text>
  <text x="50" y="310" class="content">
    他们有一段一夫一妻制的关系。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Heart with one arrow -->
    <path d="M100,100 C100,50 150,50 150,100 C150,150 100,150 100,100 Z" class="image" fill="#E74C3C" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="125" y1="100" x2="125" y2="150" class="image" />
    <polygon points="125,150 120,145 130,145" class="image" fill="#7F8C8D" />
  </g>
</svg>