<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">embark</text>
  <text x="50" y="120" class="subtitle">[ɪmˈbɑːrk] v. 上船，开始</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (进入) + bark (船)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"进入(em-)"一艘"船(bark)"，准备开始一段新的旅程，这就是"上船(embark)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to embark on a new adventure.
  </text>
  <text x="50" y="310" class="content">
    他们决定开始一段新的冒险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Boat -->
    <rect x="0" y="0" width="300" height="100" class="image" />
    <line x1="50" y1="0" x2="250" y2="0" class="image" />
    <line x1="50" y1="0" x2="50" y2="100" class="image" />
    <line x1="250" y1="0" x2="250" y2="100" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <!-- Person -->
    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />
  </g>
</svg>