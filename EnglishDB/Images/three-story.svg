<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-story</text>
  <text x="50" y="120" class="subtitle">[θriːˈstɔːri] adj. 三层的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + story (层)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座三层楼的房子，每一层都有不同的故事。
    <tspan x="50" dy="25">第一层是客厅，第二层是卧室，第三层是阁楼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The three-story house was built in the 19th century.
  </text>
  <text x="50" y="310" class="content">
    这座三层楼的房子建于19世纪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ground floor -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- First floor -->
    <rect x="0" y="110" width="200" height="100" class="image" />
    <!-- Second floor -->
    <rect x="0" y="220" width="200" height="100" class="image" />
    <!-- Roof -->
    <polygon points="0,330 100,270 200,330" class="image" />
    <!-- Windows -->
    <rect x="20" y="20" width="40" height="40" class="image" />
    <rect x="80" y="20" width="40" height="40" class="image" />
    <rect x="20" y="130" width="40" height="40" class="image" />
    <rect x="80" y="130" width="40" height="40" class="image" />
    <rect x="20" y="240" width="40" height="40" class="image" />
    <rect x="80" y="240" width="40" height="40" class="image" />
  </g>
</svg>