<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interconnection</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərkəˈnɛkʃən] n. 相互连接，互联</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + connect (连接)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的网络，"在...之间连接(inter-connect)"
    <tspan x="50" dy="25">着无数的节点，这些节点相互连接(interconnection)，</tspan>
    <tspan x="50" dy="25">形成了一个复杂的系统。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The interconnection of computers in the office allows for efficient data sharing.
  </text>
  <text x="50" y="310" class="content">
    办公室里电脑的相互连接使得数据共享更加高效。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Network nodes -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />
    <!-- Connections -->
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <line x1="170" y1="50" x2="230" y2="50" class="image" />
    <line x1="100" y1="70" x2="100" y2="130" class="image" />
    <line x1="200" y1="70" x2="200" y2="130" class="image" />
    <line x1="50" y1="70" x2="100" y2="130" class="image" />
    <line x1="150" y1="70" x2="200" y2="130" class="image" />
    <line x1="250" y1="70" x2="200" y2="130" class="image" />
  </g>
</svg>