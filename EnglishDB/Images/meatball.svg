<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meatball</text>
  <text x="50" y="120" class="subtitle">[ˈmiːtbɔːl] n. 肉丸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meat (肉) + ball (球)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的肉球(meatball)，它不仅是一个普通的球，
    <tspan x="50" dy="25">而是一个由美味肉块组成的球，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made delicious meatballs for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐做了美味的肉丸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meatball -->
    <circle cx="100" cy="100" r="50" fill="#D68910" stroke="#873600" stroke-width="3" />
    <!-- Meat chunks -->
    <circle cx="80" cy="80" r="10" fill="#873600" />
    <circle cx="120" cy="80" r="10" fill="#873600" />
    <circle cx="100" cy="120" r="10" fill="#873600" />
    <!-- Drooling -->
    <path d="M 150 120 Q 180 140 200 120" stroke="#873600" stroke-width="3" fill="none" />
    <circle cx="200" cy="120" r="5" fill="#873600" />
  </g>
</svg>