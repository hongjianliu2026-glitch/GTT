<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">culturally</text>
  <text x="50" y="120" class="subtitle">[ˈkʌltʃərəli] adv. 文化上地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cultur (文化) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满各种文化元素的场景，"文化上地(culturally)"
    <tspan x="50" dy="25">融合了不同国家的艺术、音乐和传统。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The festival was celebrated culturally diverse.
  </text>
  <text x="50" y="310" class="content">
    这个节日以文化多样性庆祝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="75" class="image" />
    <!-- Flags -->
    <rect x="100" y="20" width="30" height="50" class="image" />
    <rect x="200" y="20" width="30" height="50" class="image" />
    <rect x="150" y="150" width="30" height="50" class="image" />
    <!-- Musical notes -->
    <path d="M100 100 Q120 80 140 100 T180 100" class="image" />
    <path d="M120 120 Q140 100 160 120 T200 120" class="image" />
    <!-- Traditional costumes -->
    <rect x="50" y="150" width="30" height="50" class="image" />
    <rect x="250" y="150" width="30" height="50" class="image" />
  </g>
</svg>