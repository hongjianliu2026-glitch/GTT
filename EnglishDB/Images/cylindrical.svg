<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cylindrical</text>
  <text x="50" y="120" class="subtitle">[səˈlɪndrɪkəl] adj. 圆柱形的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cylindr (圆柱) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆柱体，它像一根巨大的蜡烛，
    <tspan x="50" dy="25">直立在地球上，这就是"圆柱形的(cylindrical)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The container was cylindrical, with a flat top and bottom.
  </text>
  <text x="50" y="310" class="content">
    这个容器是圆柱形的，顶部和底部都是平的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cylinder -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <rect x="75" y="100" width="200" height="100" class="image" />
    <ellipse cx="175" cy="200" rx="100" ry="50" class="image" />
  </g>
</svg>