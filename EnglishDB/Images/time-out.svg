<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">time-out</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪm aʊt] n. 暂停，休息时间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> time (时间) + out (出去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在比赛中，"时间(time)到了(out)"，
    <tspan x="50" dy="25">他需要暂停(time-out)休息一下，恢复体力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coach called a time-out to discuss the strategy.
  </text>
  <text x="50" y="310" class="content">
    教练叫了暂停来讨论策略。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="100" x2="140" y2="100" class="image" />
    <!-- Athlete -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Bench -->
    <rect x="180" y="200" width="40" height="20" class="image" />
    <line x1="180" y1="200" x2="220" y2="200" class="image" />
    <line x1="180" y1="220" x2="220" y2="220" class="image" />
  </g>
</svg>