<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">announcement</text>
  <text x="50" y="120" class="subtitle">[əˈnaʊnsmənt] n. 公告，宣告</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> announ (宣布) + -cement (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的喇叭在空中，"宣布(announ)"
    <tspan x="50" dy="25">一个重要的消息，这个消息就是公告(announcement)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The announcement of the new policy was met with excitement.
  </text>
  <text x="50" y="310" class="content">
    新政策的公告引起了人们的兴奋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Megaphone -->
    <path d="M0 0 L50 0 L70 30 L30 30 Z" class="image" />
    <!-- Speech bubble -->
    <path d="M100 0 Q150 20 100 40 Q50 20 100 0 Z" class="image" />
    <!-- Text in speech bubble -->
    <text x="105" y="25" class="content" style="font-size: 14px;">New Policy!</text>
  </g>
</svg>