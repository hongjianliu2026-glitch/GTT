<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">butcher</text>
  <text x="50" y="120" class="subtitle">[ˈbʊtʃər] n. 屠夫，肉贩；v. 屠宰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> butch (屠夫) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个屠夫站在肉铺前，手持一把锋利的刀，"屠宰(butcher)"
    <tspan x="50" dy="25">着一头巨大的牛，血溅四方，场面极其震撼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The butcher expertly sliced the meat for us.
  </text>
  <text x="50" y="310" class="content">
    屠夫熟练地为我们切肉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butcher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Knife -->
    <line x1="20" y1="115" x2="70" y2="80" class="image" />
    <line x1="70" y1="80" x2="80" y2="90" class="image" />
    <!-- Meat -->
    <rect x="100" y="80" width="100" height="50" class="image" />
    <!-- Blood splatter -->
    <circle cx="120" cy="100" r="5" class="image" />
    <circle cx="140" cy="110" r="5" class="image" />
    <circle cx="160" cy="90" r="5" class="image" />
  </g>
</svg>