<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">onset</text>
  <text x="50" y="120" class="subtitle">[ˈɒnset] n. 开始，发作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> on- (在...上) + set (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟表，指针"放置在(on-set)"
    <tspan x="50" dy="25">零点，标志着新的一天或事件的开始(onset)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The onset of winter brought cold weather.
  </text>
  <text x="50" y="310" class="content">
    冬天的开始带来了寒冷的天气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="245" y2="100" class="image" />
    <!-- Zero mark -->
    <text x="165" y="120" class="content">0</text>
  </g>
</svg>