<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">newsstand</text>
  <text x="50" y="120" class="subtitle">[ˈnjuːzstænd] n. 报摊，报刊亭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> news (新闻) + stand (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个报摊(newsstand)，它"站立(stand)"在街角，
    <tspan x="50" dy="25">上面摆满了各种新闻(news)报纸和杂志。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought a newspaper from the newsstand on his way to work.
  </text>
  <text x="50" y="310" class="content">
    他在上班的路上从报摊买了一份报纸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Newsstand -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Newspaper stack -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Magazine stack -->
    <rect x="170" y="20" width="100" height="160" class="image" />
    <!-- Person buying newspaper -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="350" y2="120" class="image" />
    <!-- Newspaper -->
    <rect x="280" y="100" width="50" height="30" class="image" />
  </g>
</svg>