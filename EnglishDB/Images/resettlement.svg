<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resettlement</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈsɛtlmənt] n. 重新安置，重新定居</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + settle (安置) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人搬家，"再次安置(re-settle)"
    <tspan x="50" dy="25">在一个新的地方，这就是重新安置(resettlement)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government provided support for the resettlement of refugees.
  </text>
  <text x="50" y="310" class="content">
    政府为难民的重新安置提供了支持。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="100" x2="130" y2="100" class="image" />
    <line x1="75" y1="50" x2="75" y2="100" class="image" />
    <!-- Moving truck -->
    <rect x="170" y="50" width="150" height="50" class="image" />
    <line x1="170" y1="50" x2="320" y2="50" class="image" />
    <line x1="170" y1="100" x2="320" y2="100" class="image" />
    <line x1="170" y1="50" x2="170" y2="100" class="image" />
    <line x1="320" y1="50" x2="320" y2="100" class="image" />
    <!-- Person -->
    <circle cx="245" cy="75" r="15" class="image" />
    <line x1="245" y1="90" x2="245" y2="120" class="image" />
    <line x1="245" y1="120" x2="230" y2="150" class="image" />
    <line x1="245" y1="120" x2="260" y2="150" class="image" />
    <line x1="245" y1="100" x2="270" y2="90" class="image" />
  </g>
</svg>