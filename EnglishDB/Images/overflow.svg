<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overflow</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈfloʊ] v. 溢出，泛滥；n. 溢出物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (超过) + flow (流动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装满水的杯子，水"超过(over)"杯子的边缘，"流动(flow)"出来，这就是溢出(overflow)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The river overflowed its banks after heavy rain.
  </text>
  <text x="50" y="310" class="content">
    大雨过后，河水溢出了河岸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cup -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Water -->
    <rect x="10" y="10" width="180" height="130" class="image" fill="#3498DB" />
    <!-- Overflowing water -->
    <rect x="10" y="140" width="180" height="20" class="image" fill="#3498DB" />
    <rect x="10" y="160" width="180" height="20" class="image" fill="#3498DB" />
    <rect x="10" y="180" width="180" height="20" class="image" fill="#3498DB" />
  </g>
</svg>