<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">silly</text>
  <text x="50" y="120" class="subtitle">[ˈsɪli] adj. 愚蠢的，可笑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syl- (愚蠢)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人头上戴着一顶巨大的帽子，帽子上有许多小丑的装饰，
    <tspan x="50" dy="25">这个人走路时摇摇晃晃，显得非常滑稽和愚蠢(silly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't be silly, you can't wear that hat in public.
  </text>
  <text x="50" y="310" class="content">
    别犯傻了，你不能在公共场合戴那顶帽子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Silly person -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <!-- Silly hat -->
    <ellipse cx="50" cy="20" rx="40" ry="15" class="image" />
    <line x1="30" y1="20" x2="70" y2="20" class="image" />
    <line x1="40" y1="10" x2="60" y2="10" class="image" />
    <line x1="50" y1="0" x2="50" y2="10" class="image" />
  </g>
</svg>