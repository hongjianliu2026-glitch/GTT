<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">industrialization</text>
  <text x="50" y="120" class="subtitle">[ˌɪndəˌstrial-ˌzeɪʃən] n. 工业化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> industri (工业) + -al (形容词后缀) + -ize (动词后缀) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工厂，"工业(industri)"
    <tspan x="50" dy="25">机器轰鸣，烟囱冒烟，象征着工业化(industrialization)的进程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rapid industrialization of the country has led to significant economic growth.
  </text>
  <text x="50" y="310" class="content">
    这个国家快速的工业化进程带来了显著的经济增长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="20" width="50" height="100" class="image" />
    <!-- Smoke -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <line x1="165" y1="25" x2="165" y2="5" class="image" />
    <line x1="185" y1="25" x2="185" y2="5" class="image" />
    <!-- Machine -->
    <rect x="50" y="120" width="250" height="60" class="image" />
    <line x1="70" y1="140" x2="280" y2="140" class="image" />
    <line x1="70" y1="160" x2="280" y2="160" class="image" />
  </g>
</svg>