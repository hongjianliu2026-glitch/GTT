<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orthodox</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrθədɑːks] adj. 正统的，传统的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ortho- (正直) + dox (观点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的教堂里，一位神父在宣讲"正直的观点(ortho-dox)"，
    <tspan x="50" dy="25">这些观点被认为是正统的(orthodox)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His views on religion are very orthodox.
  </text>
  <text x="50" y="310" class="content">
    他对宗教的看法非常正统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cross -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <!-- Priest -->
    <circle cx="175" cy="220" r="15" class="image" />
    <line x1="175" y1="235" x2="175" y2="270" class="image" />
    <line x1="175" y1="270" x2="155" y2="300" class="image" />
    <line x1="175" y1="270" x2="195" y2="300" class="image" />
    <line x1="175" y1="250" x2="205" y2="240" class="image" />
  </g>
</svg>