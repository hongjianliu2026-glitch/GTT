<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disband</text>
  <text x="50" y="120" class="subtitle">[dɪsˈbænd] v. 解散，散开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + band (捆绑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人原本被"捆绑(band)"在一起，
    <tspan x="50" dy="25">"分开(dis-)"后各自散开，这就是解散(disband)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team decided to disband after the project was completed.
  </text>
  <text x="50" y="310" class="content">
    项目完成后，团队决定解散。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <!-- Lines connecting them -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <!-- Arrows showing disbanding -->
    <line x1="50" y1="50" x2="20" y2="100" class="image" />
    <line x1="100" y1="50" x2="130" y2="100" class="image" />
    <line x1="150" y1="50" x2="180" y2="100" class="image" />
    <line x1="200" y1="50" x2="230" y2="100" class="image" />
    <!-- Arrows -->
    <polygon points="20,100 30,90 30,110" class="image" />
    <polygon points="130,100 140,90 140,110" class="image" />
    <polygon points="180,100 190,90 190,110" class="image" />
    <polygon points="230,100 240,90 240,110" class="image" />
  </g>
</svg>