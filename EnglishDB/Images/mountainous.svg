<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mountainous</text>
  <text x="50" y="120" class="subtitle">[ˈmaʊntənəs] adj. 多山的，山一般的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mountain (山) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片区域被无数的"山(mountain)"覆盖，
    <tspan x="50" dy="25">就像一个巨大的山脉，这就是"多山的(mountainous)"景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The region is mountainous and difficult to navigate.
  </text>
  <text x="50" y="310" class="content">
    这个地区多山，难以通行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountains -->
    <path d="M0 150 L50 50 L100 150 L150 50 L200 150 L250 50 L300 150 L350 50 L400 150" class="image" />
    <!-- Base line -->
    <line x1="0" y1="150" x2="400" y2="150" class="image" />
  </g>
</svg>