<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twenty</text>
  <text x="50" y="120" class="subtitle">[ˈtwɛnti] n. 二十</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twen- (二) + ty (表示数量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“20”，它由两个“2”组成，
    <tspan x="50" dy="25">每个“2”都像一对双胞胎，紧紧相连，形成了一个完整的“二十”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has twenty apples in her basket.
  </text>
  <text x="50" y="310" class="content">
    她的篮子里有二十个苹果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number "20" -->
    <text x="0" y="100" font-size="200" font-family="sans-serif" fill="#16A085">20</text>
    <!-- Twin "2"s -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="150" y2="250" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <line x1="200" y1="150" x2="300" y2="150" class="image" />
    <line x1="200" y1="150" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="300" y2="250" class="image" />
    <line x1="300" y1="150" x2="300" y2="250" class="image" />
  </g>
</svg>