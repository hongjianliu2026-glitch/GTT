<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inferiority</text>
  <text x="50" y="120" class="subtitle">[ˌɪnfɪəriˈɒrəti] n. 自卑，劣等</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> infer (下面) + -ior (比较级) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的阴影下，"在下面(infer)"
    <tspan x="50" dy="25">感到自己比别人"低一等(inferiority)"，</tspan>
    <tspan x="50" dy="25">这种感觉让他感到自卑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She struggled with feelings of inferiority throughout her childhood.
  </text>
  <text x="50" y="310" class="content">
    她在整个童年时期都挣扎于自卑感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shadow -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Shadow effect -->
    <rect x="150" y="80" width="50" height="120" class="image" />
  </g>
</svg>