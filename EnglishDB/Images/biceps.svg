<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">biceps</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪseps] n. 二头肌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (二) + ceps (头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个健美运动员展示他的"二头(bi-)"肌，
    <tspan x="50" dy="25">每个头都像一个强壮的"头(ceps)"，这就是二头肌(biceps)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He flexed his biceps to show off his strength.
  </text>
  <text x="50" y="310" class="content">
    他弯曲二头肌来展示他的力量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arm with biceps -->
    <line x1="50" y1="100" x2="50" y2="200" class="image" />
    <line x1="50" y1="100" x2="100" y2="150" class="image" />
    <line x1="50" y1="200" x2="100" y2="250" class="image" />
    <!-- Biceps -->
    <ellipse cx="75" cy="150" rx="25" ry="50" class="image" />
    <!-- Forearm -->
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <!-- Hand -->
    <line x1="150" y1="150" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="140" y2="180" class="image" />
    <line x1="150" y1="170" x2="160" y2="180" class="image" />
  </g>
</svg>