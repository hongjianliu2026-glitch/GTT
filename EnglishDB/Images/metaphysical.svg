<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">metaphysical</text>
  <text x="50" y="120" class="subtitle">[ˌmetəˈfɪzɪkl] adj. 形而上学的，超自然的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meta- (超越) + physical (物质的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个哲学家站在物质世界之外，"超越(meta-)"
    <tspan x="50" dy="25">物质(physical)，探索更深层次的真理，这就是形而上学(metaphysical)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His metaphysical writings delve into the nature of existence.
  </text>
  <text x="50" y="310" class="content">
    他的形而上学著作深入探讨了存在的本质。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Philosopher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Thought bubble -->
    <path d="M 70 80 Q 120 50 170 80 Q 150 100 170 120 Q 120 150 70 120 Z" class="image" />
    <!-- Symbols -->
    <circle cx="120" cy="100" r="10" class="image" />
    <line x1="120" y1="110" x2="120" y2="140" class="image" />
    <line x1="110" y1="125" x2="130" y2="125" class="image" />
  </g>
</svg>