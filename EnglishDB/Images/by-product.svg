<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">by-product</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪˌprɒdəkt] n. 副产品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> by- (旁边) + product (产品)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂在生产主要产品时，"旁边(by-)"
    <tspan x="50" dy="25">意外地产生了另一个产品，这就是副产品(by-product)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory's by-product is used as fertilizer.
  </text>
  <text x="50" y="310" class="content">
    工厂的副产品被用作肥料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Main product -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <!-- By-product -->
    <rect x="200" y="20" width="100" height="100" class="image" />
    <!-- Arrows -->
    <line x1="150" y1="70" x2="200" y2="70" class="image" />
    <polygon points="200,70 190,60 190,80" class="image" />
  </g>
</svg>