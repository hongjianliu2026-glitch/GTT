<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">canteen</text>
  <text x="50" y="120" class="subtitle">[kænˈtiːn] n. 食堂，小卖部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cant (唱) + een (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个食堂(canteen)里，人们边吃边"唱(cant)"，
    <tspan x="50" dy="25">欢声笑语充满了整个"地方(een)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We usually have lunch in the school canteen.
  </text>
  <text x="50" y="310" class="content">
    我们通常在学校食堂吃午饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Canteen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tables -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <rect x="200" y="50" width="100" height="50" class="image" />
    <!-- People -->
    <circle cx="80" cy="100" r="10" class="image" />
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="260" cy="100" r="10" class="image" />
    <!-- Food -->
    <rect x="70" y="120" width="20" height="10" class="image" />
    <rect x="110" y="120" width="20" height="10" class="image" />
    <rect x="210" y="120" width="20" height="10" class="image" />
    <rect x="250" y="120" width="20" height="10" class="image" />
    <!-- Singing -->
    <line x1="80" y1="140" x2="120" y2="140" class="image" />
    <line x1="220" y1="140" x2="260" y2="140" class="image" />
  </g>
</svg>