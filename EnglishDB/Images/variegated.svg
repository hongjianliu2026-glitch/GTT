<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">variegated</text>
  <text x="50" y="120" class="subtitle">[ˈvɛriəˌɡeɪtɪd] adj. 杂色的，斑驳的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vari (变化) + eg (出来) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片树叶，"变化出来(vari-eg-ate)"
    <tspan x="50" dy="25">各种颜色，形成斑驳的图案，这就是杂色的(variegated)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The variegated leaves of the plant added a splash of color to the garden.
  </text>
  <text x="50" y="310" class="content">
    植物的杂色叶子为花园增添了一抹色彩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leaf with variegated colors -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" stroke-width="5" stroke="#2ECC71" />
    <path d="M50 70 Q100 40 150 70 T250 70" class="image" stroke-width="5" stroke="#3498DB" />
    <path d="M50 90 Q100 60 150 90 T250 90" class="image" stroke-width="5" stroke="#E74C3C" />
    <path d="M50 110 Q100 80 150 110 T250 110" class="image" stroke-width="5" stroke="#F1C40F" />
    <path d="M50 130 Q100 100 150 130 T250 130" class="image" stroke-width="5" stroke="#9B59B6" />
  </g>
</svg>