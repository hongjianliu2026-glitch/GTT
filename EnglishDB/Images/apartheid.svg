<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apartheid</text>
  <text x="50" y="120" class="subtitle">[əˈpɑːrtaɪt] n. 种族隔离</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (分开) + part (部分) + -heid (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的墙，"分开(ap-part)"
    <tspan x="50" dy="25">不同种族的人，这就是种族隔离(apartheid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The apartheid system was abolished in South Africa in 1994.
  </text>
  <text x="50" y="310" class="content">
    南非的种族隔离制度于1994年被废除。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Wall lines -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Arrows -->
    <line x1="170" y1="50" x2="180" y2="50" class="image" />
    <line x1="170" y1="100" x2="180" y2="100" class="image" />
    <line x1="170" y1="150" x2="180" y2="150" class="image" />
  </g>
</svg>