<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">furthermore</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrðərmɔːr] adv. 此外，而且</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> further (更远) + more (更多)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在一条无尽的道路上行走，"更远(further)"
    <tspan x="50" dy="25">并且"更多(more)"地探索，这就是"此外，而且(furthermore)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The house is too small, and furthermore, it's too far from the city.
  </text>
  <text x="50" y="310" class="content">
    房子太小了，而且离城市太远。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="110" r="15" class="image" />
    <line x1="50" y1="125" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Arrow pointing further -->
    <line x1="100" y1="110" x2="150" y2="110" class="image" />
    <polygon points="150,110 140,105 140,115" class="image" />
    <!-- More symbol -->
    <line x1="200" y1="90" x2="200" y2="130" class="image" />
    <line x1="180" y1="110" x2="220" y2="110" class="image" />
  </g>
</svg>