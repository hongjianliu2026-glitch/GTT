<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frustrating</text>
  <text x="50" y="120" class="subtitle">[frʌˈstreɪtɪŋ] adj. 令人沮丧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frust (失败) + -ate (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在努力尝试后，"失败(frust)"了，
    <tspan x="50" dy="25">脸上露出沮丧的表情，这就是"令人沮丧的(frustrating)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The traffic jam was so frustrating that I missed my meeting.
  </text>
  <text x="50" y="310" class="content">
    交通堵塞太令人沮丧了，我错过了会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Frustrated person -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- X marks the failure -->
    <line x1="30" y1="30" x2="70" y2="70" class="image" />
    <line x1="30" y1="70" x2="70" y2="30" class="image" />
  </g>
</svg>