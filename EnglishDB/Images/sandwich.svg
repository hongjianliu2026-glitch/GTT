<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sandwich</text>
  <text x="50" y="120" class="subtitle">[ˈsænwɪtʃ] n. 三明治</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sandwiched (夹在中间的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被两片巨大的面包"夹在中间(sandwiched)"，
    <tspan x="50" dy="25">就像一个三明治(sandwich)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He packed a sandwich for his lunch.
  </text>
  <text x="50" y="310" class="content">
    他为午餐打包了一个三明治。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Top bread -->
    <rect x="50" y="0" width="300" height="50" class="image" />
    <!-- Bottom bread -->
    <rect x="50" y="200" width="300" height="50" class="image" />
    <!-- Filling -->
    <rect x="70" y="60" width="260" height="130" class="image" />
    <!-- Person -->
    <circle cx="200" cy="125" r="20" class="image" />
    <line x1="200" y1="145" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="160" x2="230" y2="150" class="image" />
  </g>
</svg>