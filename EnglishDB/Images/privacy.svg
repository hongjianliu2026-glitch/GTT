<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">privacy</text>
  <text x="50" y="120" class="subtitle">[ˈpraɪvəsi] n. 隐私，私密</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> priv- (私人的) + -acy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躲在一个巨大的"私人(priv-)"
    <tspan x="50" dy="25">盾牌后面，保护自己的隐私(privacy)不被窥探。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She values her privacy and rarely shares personal information.
  </text>
  <text x="50" y="310" class="content">
    她非常重视自己的隐私，很少分享个人信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <path d="M50 50 L250 50 L300 150 L250 250 L50 250 Z" class="image" />
    <!-- Person -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="250" class="image" />
    <line x1="150" y1="220" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="120" y2="180" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />
  </g>
</svg>