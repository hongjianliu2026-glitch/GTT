<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .infection { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infection</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfekʃn] n. 感染，传染病</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + fect (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个病毒"进入(in-)"人体，"做(fect)"
    <tspan x="50" dy="25">坏事，导致感染(infection)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She developed an infection after the surgery.
  </text>
  <text x="50" y="310" class="content">
    手术后她出现了感染。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Virus -->
    <circle cx="150" cy="150" r="20" class="infection" />
    <circle cx="180" cy="120" r="15" class="infection" />
    <circle cx="130" cy="170" r="18" class="infection" />
    <!-- Arrow -->
    <line x1="200" y1="100" x2="120" y2="100" class="image" />
    <polygon points="200,100 190,95 190,105" class="image" />
  </g>
</svg>