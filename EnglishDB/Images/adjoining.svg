<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adjoining</text>
  <text x="50" y="120" class="subtitle">[əˈdʒɔɪnɪŋ] adj. 邻接的，毗连的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + join (连接)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两栋房子，"朝向(ad-)"彼此"连接(join)"，
    <tspan x="50" dy="25">它们就是"邻接的(adjoining)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The adjoining rooms share a common wall.
  </text>
  <text x="50" y="310" class="content">
    邻接的房间共用一面墙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First house -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Second house -->
    <rect x="150" y="0" width="150" height="100" class="image" />
    <!-- Common wall -->
    <line x1="150" y1="0" x2="150" y2="100" class="image" />
    <!-- Roofs -->
    <polyline points="0,0 75,50 150,0" class="image" />
    <polyline points="150,0 225,50 300,0" class="image" />
  </g>
</svg>