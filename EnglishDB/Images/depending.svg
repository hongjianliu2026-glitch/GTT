<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">depending</text>
  <text x="50" y="120" class="subtitle">[dɪˈpendɪŋ] adv. 取决于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + pend (悬挂) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个悬挂的钟摆，"向下悬挂(de-pend)"
    <tspan x="50" dy="25">的状态取决于(depending)它的摆动方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outcome depends on your decision.
  </text>
  <text x="50" y="310" class="content">
    结果取决于你的决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pendulum -->
    <line x1="175" y1="0" x2="175" y2="150" class="image" />
    <circle cx="175" cy="150" r="20" class="image" />
    <!-- Base -->
    <rect x="150" y="170" width="50" height="10" class="image" />
    <!-- Direction arrows -->
    <line x1="175" y1="150" x2="100" y2="250" class="image" />
    <line x1="175" y1="150" x2="250" y2="250" class="image" />
    <polygon points="175,150 100,250 250,250" class="image" />
  </g>
</svg>