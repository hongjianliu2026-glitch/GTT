<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unofficial</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəˈfɪʃl] adj. 非官方的，未经官方认可的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + official (官方的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着便装的人，"不穿(un-)"
    <tspan x="50" dy="25">官方制服，他就是一个非官方(unofficial)的代表。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event was an unofficial gathering of fans.
  </text>
  <text x="50" y="310" class="content">
    这个活动是粉丝们的一次非官方聚会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in casual clothes -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="90" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <line x1="50" y1="120" x2="30" y2="150" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="150" class="image" /> <!-- Right leg -->
    <!-- Official uniform -->
    <rect x="100" y="30" width="100" height="100" class="image" />
    <line x1="120" y1="50" x2="180" y2="50" class="image" />
    <line x1="120" y1="70" x2="180" y2="70" class="image" />
    <line x1="120" y1="90" x2="180" y2="90" class="image" />
    <line x1="120" y1="110" x2="180" y2="110" class="image" />
    <!-- Cross out the official uniform -->
    <line x1="90" y1="20" x2="210" y2="140" class="image" />
    <line x1="90" y1="140" x2="210" y2="20" class="image" />
  </g>
</svg>