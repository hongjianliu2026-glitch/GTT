<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enamor</text>
  <text x="50" y="120" class="subtitle">[ɪˈnæmər] v. 使迷恋，使倾心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + amor (爱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"使(en)"入了"爱(amor)"的魔咒，
    <tspan x="50" dy="25">他的心被深深吸引，无法自拔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beautiful scenery enamored the tourists.
  </text>
  <text x="50" y="310" class="content">
    美丽的风景使游客们倾心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Person -->
    <circle cx="40" cy="100" r="15" class="image" />
    <line x1="40" y1="115" x2="40" y2="150" class="image" />
    <line x1="40" y1="150" x2="20" y2="180" class="image" />
    <line x1="40" y1="150" x2="60" y2="180" class="image" />
    <line x1="40" y1="130" x2="70" y2="120" class="image" />
    <!-- Arrow pointing to heart -->
    <line x1="40" y1="100" x2="40" y2="50" class="image" />
    <polygon points="40,50 35,40 45,40" class="image" />
  </g>
</svg>