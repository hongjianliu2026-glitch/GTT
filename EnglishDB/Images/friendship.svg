<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">friendship</text>
  <text x="50" y="120" class="subtitle">[ˈfrɛndʃɪp] n. 友谊，友情</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> friend (朋友) + -ship (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个朋友手牵手，"朋友(friend)"
    <tspan x="50" dy="25">之间的"状态(ship)"就是友谊(friendship)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Their friendship lasted for decades.
  </text>
  <text x="50" y="310" class="content">
    他们的友谊持续了几十年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Friends holding hands -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <!-- Hearts -->
    <path d="M 50 80 Q 70 100 90 80 Q 110 100 130 80" class="image" />
    <path d="M 70 80 Q 90 100 110 80" class="image" />
  </g>
</svg>