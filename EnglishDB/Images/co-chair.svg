<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">co-chair</text>
  <text x="50" y="120" class="subtitle">[koʊˈtʃɛr] n. 共同主席</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + chair (椅子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个领导坐在同一把椅子上，"共同(co-)"
    <tspan x="50" dy="25">承担责任，他们就是共同主席(co-chair)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They were appointed as co-chairs of the committee.
  </text>
  <text x="50" y="310" class="content">
    他们被任命为委员会的共同主席。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Two people sitting on the chair -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="100" y1="160" x2="200" y2="160" class="image" />
    <!-- Arms of the chair -->
    <line x1="50" y1="120" x2="70" y2="120" class="image" />
    <line x1="280" y1="120" x2="300" y2="120" class="image" />
  </g>
</svg>