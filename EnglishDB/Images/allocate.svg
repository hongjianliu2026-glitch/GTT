<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">allocate</text>
  <text x="50" y="120" class="subtitle">[ˈæləkeɪt] v. 分配，拨出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (朝向) + loc (地方) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个管理者在办公室里，"朝向(al-)"
    <tspan x="50" dy="25">不同的"地方(loc)"，分配(allocate)</tspan>
    <tspan x="50" dy="25">资源和任务，确保每个地方都有足够的支持。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company allocated funds for the new project.
  </text>
  <text x="50" y="310" class="content">
    公司为新项目拨出了资金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Manager -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Resources -->
    <rect x="70" y="20" width="50" height="50" class="image" />
    <rect x="140" y="20" width="50" height="50" class="image" />
    <rect x="210" y="20" width="50" height="50" class="image" />
    <!-- Arrows -->
    <line x1="95" y1="70" x2="135" y2="120" class="image">
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" />
      </marker>
      <marker-end url="#arrowhead" />
    </line>
    <line x1="165" y1="70" x2="175" y2="120" class="image">
      <marker-end url="#arrowhead" />
    </line>
    <line x1="235" y1="70" x2="215" y2="120" class="image">
      <marker-end url="#arrowhead" />
    </line>
  </g>
</svg>