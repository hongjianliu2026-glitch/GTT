<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">explicit</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsplɪsɪt] adj. 明确的，清楚的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + plic (折叠) + -it (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师将一张折叠的纸"向外展开(ex-plic)"，
    <tspan x="50" dy="25">纸上的文字清晰可见，这就是明确的(explicit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructions were explicit, so there was no confusion.
  </text>
  <text x="50" y="310" class="content">
    说明非常明确，所以没有混淆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Paper -->
    <rect x="70" y="80" width="150" height="100" class="image" />
    <line x1="80" y1="90" x2="210" y2="90" class="image" />
    <line x1="80" y1="110" x2="210" y2="110" class="image" />
    <line x1="80" y1="130" x2="210" y2="130" class="image" />
    <line x1="80" y1="150" x2="210" y2="150" class="image" />
    <!-- Text on paper -->
    <text x="90" y="120" class="content" fill="#34495E">
      <tspan>This is an</tspan>
      <tspan x="90" dy="25" class="highlight">explicit</tspan>
      <tspan x="90" dy="25">message.</tspan>
    </text>
  </g>
</svg>