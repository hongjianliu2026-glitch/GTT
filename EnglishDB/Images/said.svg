<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">said</text>
  <text x="50" y="120" class="subtitle">[sed] v. 说（say的过去式）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> say (说) 的过去式
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人张开嘴巴，"说(say)"出话来，
    <tspan x="50" dy="25">这些话已经"过去(said)"，但仍然在空气中回荡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He said he would come back later.
  </text>
  <text x="50" y="310" class="content">
    他说他稍后会回来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Speech bubble -->
    <path d="M 90 20 Q 150 20 150 80 Q 150 140 90 140 Q 50 140 50 100 Z" class="image" />
    <!-- Text in speech bubble -->
    <text x="100" y="70" class="content">said</text>
  </g>
</svg>