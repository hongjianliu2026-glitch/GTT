<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handle</text>
  <text x="50" y="120" class="subtitle">[ˈhændl] n. 把手，处理；v. 处理，操作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门把手，"手(hand)"握住它，
    <tspan x="50" dy="25">轻轻一转，门就开了。这个动作就是"处理(handle)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She knows how to handle difficult situations.
  </text>
  <text x="50" y="310" class="content">
    她知道如何处理困难的情况。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door handle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Hand -->
    <circle cx="175" cy="50" r="15" class="image" />
    <line x1="175" y1="65" x2="175" y2="100" class="image" />
    <line x1="175" y1="65" x2="160" y2="80" class="image" />
    <line x1="175" y1="65" x2="190" y2="80" class="image" />
  </g>
</svg>