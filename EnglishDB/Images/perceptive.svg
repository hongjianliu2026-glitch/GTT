<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perceptive</text>
  <text x="50" y="120" class="subtitle">[pərˈseptɪv] adj. 有洞察力的，敏锐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + cept (拿) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拥有"完全拿住(per-cept)"
    <tspan x="50" dy="25">所有信息的能力，他能够敏锐地洞察一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very perceptive and noticed the small changes in his behavior.
  </text>
  <text x="50" y="310" class="content">
    她非常敏锐，注意到了他行为上的细微变化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Light bulb -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="200" class="image" />
    <line x1="250" y1="180" x2="270" y2="200" class="image" />
    <line x1="250" y1="150" x2="220" y2="140" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />
    <!-- Connection -->
    <line x1="150" y1="100" x2="220" y2="100" class="image" />
  </g>
</svg>