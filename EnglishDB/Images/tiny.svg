<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tiny</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪni] adj. 极小的，微小的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tin (小) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蚂蚁站在一个巨大的苹果上，苹果对于蚂蚁来说就像是一个巨大的世界，而蚂蚁本身则是"极小的(tiny)"存在。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a tiny button on her shirt.
  </text>
  <text x="50" y="310" class="content">
    她在衬衫上发现了一个极小的纽扣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Giant apple -->
    <circle cx="200" cy="150" r="100" class="image" />
    <!-- Tiny ant -->
    <circle cx="200" cy="150" r="5" class="image" />
    <!-- Ant's legs -->
    <line x1="200" y1="155" x2="190" y2="170" class="image" />
    <line x1="200" y1="155" x2="210" y2="170" class="image" />
    <!-- Ant's antennae -->
    <line x1="200" y1="145" x2="195" y2="135" class="image" />
    <line x1="200" y1="145" x2="205" y2="135" class="image" />
  </g>
</svg>