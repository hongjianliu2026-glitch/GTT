<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">martini</text>
  <text x="50" y="120" class="subtitle">[mɑrˈtiːni] n. 马提尼酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自意大利语Martini，可能与意大利地名Martina Franca有关。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个优雅的酒吧，调酒师正在调制一杯马提尼酒，
    <tspan x="50" dy="25">酒杯中冰块轻轻碰撞，发出清脆的声音，这就是马提尼(martini)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He ordered a classic martini with olives.
  </text>
  <text x="50" y="310" class="content">
    他点了一杯经典的马提尼酒，配橄榄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Martini glass -->
    <path d="M 0 100 Q 50 50 100 100 L 100 200 L 0 200 Z" class="image" />
    <!-- Ice cubes -->
    <rect x="20" y="120" width="20" height="20" class="image" />
    <rect x="60" y="120" width="20" height="20" class="image" />
    <!-- Olive -->
    <circle cx="80" cy="180" r="10" class="image" />
  </g>
</svg>