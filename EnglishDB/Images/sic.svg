<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sic</text>
  <text x="50" y="120" class="subtitle">[sɪk] adv. 原文如此，表示原文中的错误或奇怪之处</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "sic"，意为“如此”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个编辑在审阅一篇文章，发现一个明显的错误，
    <tspan x="50" dy="25">但他只能无奈地标注“sic”，表示原文如此。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The text reads, "She was born in the year 1900s," sic.
  </text>
  <text x="50" y="310" class="content">
    文中写道：“她出生于1900年代，”sic。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Text on paper -->
    <text x="50" y="50" class="content">She was born in the year 1900s,</text>
    <text x="50" y="80" class="highlight">sic</text>
    <!-- Editor's note -->
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="50" y2="100" class="image" />
    <!-- Editor -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>