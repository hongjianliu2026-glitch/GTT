<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">showy</text>
  <text x="50" y="120" class="subtitle">[ˈʃoʊi] adj. 艳丽的，炫耀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> show (展示) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个花坛里，一朵巨大的、色彩斑斓的花朵"展示(show)"
    <tspan x="50" dy="25">自己，吸引所有人的目光，这就是"艳丽的(showy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The showy peacock spread its feathers in the garden.
  </text>
  <text x="50" y="310" class="content">
    那只艳丽的孔雀在花园里展开了它的羽毛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flower -->
    <circle cx="175" cy="100" r="80" fill="#FF6F61" />
    <circle cx="130" cy="70" r="20" fill="#FFCC5C" />
    <circle cx="220" cy="70" r="20" fill="#FFCC5C" />
    <circle cx="130" cy="130" r="20" fill="#FFCC5C" />
    <circle cx="220" cy="130" r="20" fill="#FFCC5C" />
    <!-- Stem -->
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
  </g>
</svg>