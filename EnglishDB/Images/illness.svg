<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">illness</text>
  <text x="50" y="120" class="subtitle">[ˈɪlnəs] n. 疾病，病</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ill (坏的) + ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在床上，"坏的状态(ill-ness)"
    <tspan x="50" dy="25">让他无法动弹，这就是疾病(illness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was absent from work due to illness.
  </text>
  <text x="50" y="310" class="content">
    他因病缺席了工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person in bed -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="130" y2="140" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Pill -->
    <rect x="250" y="50" width="30" height="10" class="image" />
    <line x1="250" y1="50" x2="280" y2="50" class="image" />
    <line x1="250" y1="60" x2="280" y2="60" class="image" />
  </g>
</svg>