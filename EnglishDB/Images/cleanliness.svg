<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .clean { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cleanliness</text>
  <text x="50" y="120" class="subtitle">[ˈkliːnlɪnəs] n. 清洁，干净</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clean (清洁) + -liness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个超级干净的房间，"清洁(clean)"
    <tspan x="50" dy="25">到闪闪发光，这就是清洁(cleanliness)的极致。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hotel is renowned for its cleanliness.
  </text>
  <text x="50" y="310" class="content">
    这家酒店以其清洁度而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clean room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bed -->
    <rect x="50" y="20" width="250" height="80" class="clean" />
    <!-- Table -->
    <rect x="100" y="120" width="150" height="60" class="clean" />
    <!-- Chair -->
    <rect x="120" y="190" width="30" height="30" class="clean" />
    <!-- Floor -->
    <rect x="0" y="220" width="350" height="30" class="clean" />
    <!-- Shine effect -->
    <circle cx="200" cy="100" r="10" class="clean" />
    <circle cx="150" cy="150" r="10" class="clean" />
  </g>
</svg>