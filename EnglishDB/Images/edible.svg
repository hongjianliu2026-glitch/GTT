<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">edible</text>
  <text x="50" y="120" class="subtitle">[ˈɛdəbl] adj. 可食用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ed- (吃) + -ible (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的嘴巴，"能够吃(ed-ible)"
    <tspan x="50" dy="25">下任何东西，这些食物都是可食用的(edible)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Are these mushrooms edible?
  </text>
  <text x="50" y="310" class="content">
    这些蘑菇可以吃吗？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <path d="M50 50 Q100 100 150 50 Q200 0 250 50" class="image" />
    <!-- Food items -->
    <circle cx="100" cy="100" r="20" class="image" /> <!-- Apple -->
    <rect x="150" y="80" width="40" height="40" class="image" /> <!-- Carrot -->
    <circle cx="220" cy="100" r="20" class="image" /> <!-- Orange -->
  </g>
</svg>