<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">artery</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrtəri] n. 动脉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arter (空气) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条"空气通道(arter)"，血液通过它快速流动，
    <tspan x="50" dy="25">就像一条繁忙的动脉(artery)，为身体输送氧气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor explained the function of the artery.
  </text>
  <text x="50" y="310" class="content">
    医生解释了动脉的功能。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artery -->
    <path d="M50 100 Q150 50 250 100 T450 100" class="image" />
    <!-- Blood flow -->
    <circle cx="70" cy="100" r="5" fill="#E74C3C" />
    <circle cx="120" cy="90" r="5" fill="#E74C3C" />
    <circle cx="170" cy="80" r="5" fill="#E74C3C" />
    <circle cx="220" cy="90" r="5" fill="#E74C3C" />
    <circle cx="270" cy="100" r="5" fill="#E74C3C" />
    <circle cx="320" cy="110" r="5" fill="#E74C3C" />
    <circle cx="370" cy="120" r="5" fill="#E74C3C" />
    <circle cx="420" cy="110" r="5" fill="#E74C3C" />
    <circle cx="470" cy="100" r="5" fill="#E74C3C" />
  </g>
</svg>