<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">instinctive</text>
  <text x="50" y="120" class="subtitle">[ɪnˈstɪŋktɪv] adj. 本能的，天生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (向内) + stinct (刺激) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟，"向内刺激(in-stinct)"
    <tspan x="50" dy="25">促使它本能地飞翔，这就是本能(instinctive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her instinctive reaction was to protect her child.
  </text>
  <text x="50" y="310" class="content">
    她本能的反应是保护她的孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <line x1="50" y1="140" x2="70" y2="130" class="image" />
    <line x1="50" y1="160" x2="30" y2="180" class="image" />
    <line x1="50" y1="160" x2="70" y2="180" class="image" />
    <!-- Wings -->
    <path d="M30,100 Q20,80 30,60 L50,70 Q60,80 50,90 Z" class="image" />
    <path d="M70,100 Q80,80 70,60 L50,70 Q40,80 50,90 Z" class="image" />
  </g>
</svg>