<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">martyrdom</text>
  <text x="50" y="120" class="subtitle">[ˈmɑrtərdəm] n. 殉难，牺牲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> martyro- (见证) + -dom (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的人，为了信仰或正义，"见证(martyro-)"
    <tspan x="50" dy="25">自己的牺牲，这种状态就是殉难(martyrdom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His martyrdom inspired many people to fight for justice.
  </text>
  <text x="50" y="310" class="content">
    他的牺牲激励了许多人去为正义而战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cross -->
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Flame -->
    <polygon points="100,20 80,60 120,60" class="image" />
    <polygon points="100,30 70,70 130,70" class="image" />
    <!-- Person -->
    <circle cx="100" cy="180" r="15" class="image" />
    <line x1="100" y1="195" x2="100" y2="230" class="image" />
    <line x1="100" y1="230" x2="80" y2="260" class="image" />
    <line x1="100" y1="230" x2="120" y2="260" class="image" />
    <line x1="100" y1="210" x2="130" y2="200" class="image" />
  </g>
</svg>