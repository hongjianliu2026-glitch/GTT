<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">genre</text>
  <text x="50" y="120" class="subtitle">[ˈʒɑːnrə] n. 类型，流派</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> genr (种类) + -e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的图书馆，每个书架上都有不同的"种类(genr)"
    <tspan x="50" dy="25">书籍，这些书籍按照流派(genre)整齐排列。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This novel belongs to the mystery genre.
  </text>
  <text x="50" y="310" class="content">
    这本小说属于悬疑流派。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bookshelf -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- Genre labels -->
    <text x="55" y="40" class="content">Mystery</text>
    <text x="125" y="40" class="content">Romance</text>
    <text x="195" y="40" class="content">Sci-Fi</text>
    <text x="265" y="40" class="content">Fantasy</text>
  </g>
</svg>