<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frequency</text>
  <text x="50" y="120" class="subtitle">[ˈfriːkwənsi] n. 频率，频繁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 来自拉丁语 "frequentia"，意为“聚集”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，指针疯狂地转动，"频繁(frequentia)"
    <tspan x="50" dy="25">地聚集时间，频率(frequency)极高，让人眼花缭乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The frequency of earthquakes in this region is alarming.
  </text>
  <text x="50" y="310" class="content">
    这个地区地震的频率令人担忧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Dots representing frequent ticks -->
    <circle cx="175" cy="20" r="5" class="image" />
    <circle cx="255" cy="100" r="5" class="image" />
    <circle cx="175" cy="180" r="5" class="image" />
    <circle cx="95" cy="100" r="5" class="image" />
    <circle cx="235" cy="50" r="5" class="image" />
    <circle cx="115" cy="150" r="5" class="image" />
  </g>
</svg>