<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stability</text>
  <text x="50" y="120" class="subtitle">[stəˈbɪlɪti] n. 稳定性，稳固</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sta- (站立) + -ility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨人稳稳地"站立(sta-)"在地球上，
    <tspan x="50" dy="25">他的脚下是稳固的地面，象征着稳定性(stability)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's financial stability is crucial for its long-term success.
  </text>
  <text x="50" y="310" class="content">
    公司的财务稳定性对其长期成功至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Giant -->
    <circle cx="175" cy="150" r="30" class="image" />
    <line x1="175" y1="180" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="140" y2="300" class="image" />
    <line x1="175" y1="250" x2="210" y2="300" class="image" />
    <line x1="175" y1="220" x2="120" y2="200" class="image" />
    <line x1="175" y1="220" x2="230" y2="200" class="image" />
  </g>
</svg>