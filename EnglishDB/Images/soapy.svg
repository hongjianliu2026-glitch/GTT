<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soapy</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊpi] adj. 肥皂的，滑腻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soap (肥皂) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个滑腻的肥皂泡泡，"肥皂(soap)"
    <tspan x="50" dy="25">在空中飘浮，触感滑腻(soapy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby's skin felt soapy after the bath.
  </text>
  <text x="50" y="310" class="content">
    宝宝洗完澡后皮肤感觉滑腻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soap bubble -->
    <circle cx="100" cy="100" r="50" class="image" fill="#E8F6F3" />
    <circle cx="120" cy="80" r="30" class="image" fill="#E8F6F3" />
    <circle cx="80" cy="120" r="20" class="image" fill="#E8F6F3" />
    <!-- Soap bar -->
    <rect x="180" y="50" width="100" height="100" class="image" fill="#F9E79F" />
    <!-- Soap suds -->
    <line x1="200" y1="160" x2="220" y2="180" class="image" />
    <line x1="210" y1="160" x2="230" y2="180" class="image" />
    <line x1="220" y1="160" x2="240" y2="180" class="image" />
  </g>
</svg>