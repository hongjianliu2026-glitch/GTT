<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">their</text>
  <text x="50" y="120" class="subtitle">[ðɛr] adj. 他们的，她们的，它们的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> the (定冠词) + ir (表所有格)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群小动物，"它们(their)"
    <tspan x="50" dy="25">各自拥有自己的小窝，每个小窝都标有它们的名字。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cats love their cozy nests.
  </text>
  <text x="50" y="310" class="content">
    这些猫喜欢它们舒适的窝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Houses -->
    <rect x="0" y="0" width="100" height="80" class="image" />
    <rect x="120" y="0" width="100" height="80" class="image" />
    <rect x="240" y="0" width="100" height="80" class="image" />
    <!-- Animals -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="170" cy="100" r="15" class="image" />
    <circle cx="290" cy="100" r="15" class="image" />
    <!-- Labels -->
    <text x="30" y="140" class="content">Cat 1</text>
    <text x="150" y="140" class="content">Cat 2</text>
    <text x="270" y="140" class="content">Cat 3</text>
  </g>
</svg>