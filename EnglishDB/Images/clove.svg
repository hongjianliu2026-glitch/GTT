<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clove</text>
  <text x="50" y="120" class="subtitle">[kloʊv] n. 丁香，丁香花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clov (钉子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一株丁香花，它的花蕾形状像"钉子(clov)"，
    <tspan x="50" dy="25">这种独特的形状让人一眼就能记住它的名字——丁香(clove)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aroma of cloves filled the kitchen.
  </text>
  <text x="50" y="310" class="content">
    厨房里弥漫着丁香的香气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Flower stem -->
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <!-- Flower petals -->
    <circle cx="150" cy="100" r="50" class="image" />
    <!-- Clove shape -->
    <rect x="120" y="50" width="60" height="100" class="image" />
    <!-- Nail head -->
    <circle cx="150" cy="50" r="20" class="image" />
  </g>
</svg>