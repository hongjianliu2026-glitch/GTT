<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supply</text>
  <text x="50" y="120" class="subtitle">[səˈplaɪ] n. 供应，补给；v. 供给，提供</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sup- (在下面) + ply (充满)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的仓库，"在下面充满(sup-ply)"
    <tspan x="50" dy="25">各种物资，这些物资源源不断地供应(supply)给需要的人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company supplies food to the local schools.
  </text>
  <text x="50" y="310" class="content">
    这家公司为当地学校提供食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warehouse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Shelves -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Boxes -->
    <rect x="70" y="40" width="50" height="50" class="image" />
    <rect x="140" y="40" width="50" height="50" class="image" />
    <rect x="210" y="40" width="50" height="50" class="image" />
    <rect x="70" y="110" width="50" height="50" class="image" />
    <rect x="140" y="110" width="50" height="50" class="image" />
    <rect x="210" y="110" width="50" height="50" class="image" />
    <!-- Truck -->
    <rect x="20" y="180" width="100" height="20" class="image" />
    <rect x="30" y="160" width="80" height="20" class="image" />
    <rect x="40" y="140" width="60" height="20" class="image" />
    <!-- Wheels -->
    <circle cx="40" cy="200" r="10" class="image" />
    <circle cx="100" cy="200" r="10" class="image" />
  </g>
</svg>