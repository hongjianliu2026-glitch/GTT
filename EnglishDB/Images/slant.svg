<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slant</text>
  <text x="50" y="120" class="subtitle">[slænt] v. 倾斜；n. 斜线，斜面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slant (来自古英语 "slent"，意为"倾斜")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个倾斜的屋顶，雨水顺着斜面(slant)滑落，
    <tspan x="50" dy="25">形成一条条斜线(slant)，这就是"倾斜"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roof slants to allow rainwater to drain off.
  </text>
  <text x="50" y="310" class="content">
    屋顶倾斜以使雨水排出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Slanted roof -->
    <line x1="50" y1="150" x2="350" y2="150" class="image" />
    <line x1="50" y1="150" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="350" y2="150" class="image" />
    <!-- Rain drops -->
    <line x1="100" y1="150" x2="100" y2="100" class="image" />
    <line x1="150" y1="150" x2="150" y2="80" class="image" />
    <line x1="200" y1="150" x2="200" y2="60" class="image" />
    <line x1="250" y1="150" x2="250" y2="90" class="image" />
    <line x1="300" y1="150" x2="300" y2="70" class="image" />
  </g>
</svg>