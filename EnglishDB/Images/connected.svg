<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">connected</text>
  <text x="50" y="120" class="subtitle">[kəˈnektɪd] adj. 连接的，有联系的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + nect (绑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人被一根绳子"绑在一起(con-nect)"，
    <tspan x="50" dy="25">他们之间就有了联系(connected)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two computers are connected via a network cable.
  </text>
  <text x="50" y="310" class="content">
    这两台电脑通过网络电缆连接在一起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Rope connecting them -->
    <line x1="70" y1="100" x2="180" y2="100" class="image" />
    <line x1="70" y1="100" x2="125" y2="80" class="image" />
    <line x1="180" y1="100" x2="125" y2="80" class="image" />
  </g>
</svg>