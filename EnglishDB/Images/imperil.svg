<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imperil</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpɛrəl] v. 使处于危险，危害</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + peril (危险)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人不小心"进入(im-)"了一个充满"危险(peril)"的森林，
    <tspan x="50" dy="25">每一步都可能让他陷入更深的危险。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm imperiled the lives of the hikers.
  </text>
  <text x="50" y="310" class="content">
    暴风雨使徒步旅行者的生命处于危险之中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Danger sign -->
    <polygon points="175,100 150,150 200,150" class="image" />
    <circle cx="175" cy="80" r="10" class="image" />
    <!-- Hiker -->
    <circle cx="175" cy="120" r="15" class="image" />
    <line x1="175" y1="135" x2="175" y2="170" class="image" />
    <line x1="175" y1="170" x2="155" y2="200" class="image" />
    <line x1="175" y1="170" x2="195" y2="200" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
  </g>
</svg>