<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">opposing</text>
  <text x="50" y="120" class="subtitle">[əˈpoʊzɪŋ] adj. 对立的，反对的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> op- (相反) + pos (放置) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站立，"相反地放置(op-pos-ing)"
    <tspan x="50" dy="25">他们的立场，形成对立的局面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The opposing teams were evenly matched.
  </text>
  <text x="50" y="310" class="content">
    对立的两队实力相当。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <!-- Arrows pointing opposite directions -->
    <line x1="70" y1="90" x2="100" y2="60" class="image" />
    <line x1="70" y1="110" x2="100" y2="140" class="image" />
    <line x1="280" y1="90" x2="250" y2="60" class="image" />
    <line x1="280" y1="110" x2="250" y2="140" class="image" />
  </g>
</svg>