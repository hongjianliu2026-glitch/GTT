<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overload</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈloʊd] v. 超载，过载</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (超过) + load (负荷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆卡车，"超过(over-)"了它的"负荷(load)"，
    <tspan x="50" dy="25">车上的货物堆得像山一样高，随时可能倾倒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The system crashed because it was overloaded with requests.
  </text>
  <text x="50" y="310" class="content">
    系统因为请求过载而崩溃了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Truck -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Overloaded cargo -->
    <rect x="70" y="40" width="210" height="60" class="image" />
    <rect x="80" y="50" width="190" height="40" class="image" />
    <rect x="90" y="60" width="170" height="20" class="image" />
    <!-- Cargo spilling -->
    <line x1="100" y1="80" x2="150" y2="120" class="image" />
    <line x1="110" y1="80" x2="160" y2="120" class="image" />
    <line x1="120" y1="80" x2="170" y2="120" class="image" />
  </g>
</svg>