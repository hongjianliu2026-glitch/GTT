<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crock</text>
  <text x="50" y="120" class="subtitle">[krɒk] n. 瓦罐，陶罐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crok (源自中古英语，意为“陶罐”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，村民们用"陶罐(crock)"
    <tspan x="50" dy="25">来储存水和食物，这个陶罐就是他们的生活必需品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used an old crock to store her pickles.
  </text>
  <text x="50" y="310" class="content">
    她用一个旧陶罐来储存她的泡菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crock -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <!-- Handle -->
    <line x1="150" y1="80" x2="180" y2="80" class="image" />
    <line x1="165" y1="60" x2="165" y2="100" class="image" />
  </g>
</svg>