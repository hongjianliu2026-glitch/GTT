<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .smell { fill: #873600; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stink</text>
  <text x="50" y="120" class="subtitle">[stɪŋk] v. 发出恶臭，臭气熏天</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stink (直接来源于古英语，意为“臭味”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个垃圾堆，"臭气(stink)"
    <tspan x="50" dy="25">熏天，让人无法靠近。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garbage bin stinks so bad that no one wants to go near it.
  </text>
  <text x="50" y="310" class="content">
    垃圾桶臭气熏天，没人愿意靠近。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garbage bin -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <!-- Smell lines -->
    <line x1="50" y1="20" x2="100" y2="50" class="image smell" />
    <line x1="70" y1="20" x2="120" y2="50" class="image smell" />
    <line x1="90" y1="20" x2="140" y2="50" class="image smell" />
    <line x1="110" y1="20" x2="160" y2="50" class="image smell" />
    <line x1="130" y1="20" x2="180" y2="50" class="image smell" />
    <line x1="150" y1="20" x2="200" y2="50" class="image smell" />
    <!-- Person covering nose -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
    <line x1="250" y1="130" x2="220" y2="120" class="image" />
  </g>
</svg>