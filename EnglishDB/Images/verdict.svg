<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">verdict</text>
  <text x="50" y="120" class="subtitle">[ˈvɜːrdɪkt] n. 裁决，判决</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ver- (真实) + dict (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，"真实地说出(ver-dict)"
    <tspan x="50" dy="25">最终的判决，这个判决就是裁决(verdict)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jury delivered a unanimous verdict.
  </text>
  <text x="50" y="310" class="content">
    陪审团做出了全体一致的裁决。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge's bench -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Gavel -->
    <rect x="100" y="120" width="50" height="20" class="image" />
    <line x1="125" y1="140" x2="125" y2="160" class="image" />
    <!-- Verdict -->
    <text x="200" y="150" class="content" style="font-size: 36px; fill: #E74C3C;">Verdict</text>
  </g>
</svg>