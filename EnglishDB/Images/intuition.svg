<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intuition</text>
  <text x="50" y="120" class="subtitle">[ˌɪntjuˈɪʃn] n. 直觉，直觉力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (内部) + tuit (保护) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闭上眼睛，"内心深处(in-)"
    <tspan x="50" dy="25">感受到一种"保护(tuit)"的力量，这就是直觉(intuition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She followed her intuition and made the right decision.
  </text>
  <text x="50" y="310" class="content">
    她跟随直觉做出了正确的决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with closed eyes -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="40" y1="40" x2="60" y2="60" class="image" />
    <line x1="60" y1="40" x2="40" y2="60" class="image" />
    <!-- Light bulb -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <!-- Connection line -->
    <line x1="80" y1="50" x2="130" y2="50" class="image" />
  </g>
</svg>