<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">synagogue</text>
  <text x="50" y="120" class="subtitle">[ˈsɪnəɡɒɡ] n. 犹太教堂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syn- (一起) + agog (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群犹太人聚集在一起，"引导(agog)"
    <tspan x="50" dy="25">他们走向一个神圣的地方，这个地方就是犹太教堂(synagogue)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The synagogue was filled with people on the Sabbath.
  </text>
  <text x="50" y="310" class="content">
    安息日时，犹太教堂里挤满了人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Synagogue building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Star of David -->
    <polygon points="175,30 200,90 275,100 225,150 250,210 175,180 100,210 125,150 75,100 150,90" class="image" />
    <!-- People -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <circle cx="190" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="280" cy="100" r="10" class="image" />
  </g>
</svg>