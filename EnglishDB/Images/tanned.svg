<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tanned</text>
  <text x="50" y="120" class="subtitle">[tænd] adj. 晒黑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tan (晒黑) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在沙滩上，"晒黑(tan)"
    <tspan x="50" dy="25">的皮肤变成了深棕色，这就是晒黑的(tanned)状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She came back from the beach with a tanned complexion.
  </text>
  <text x="50" y="310" class="content">
    她从海滩回来时，皮肤晒黑了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="100" r="30" fill="#D35400" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="170" y2="130" class="image" />
    <line x1="200" y1="150" x2="230" y2="130" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <!-- Beach -->
    <rect x="0" y="200" width="400" height="50" fill="#F4D03F" />
  </g>
</svg>