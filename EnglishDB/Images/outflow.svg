<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outflow</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtfloʊ] n. 流出，外流</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (向外) + flow (流动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水龙头，"向外流动(out-flow)"
    <tspan x="50" dy="25">的水流如同瀑布般倾泻而出，这就是外流(outflow)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outflow of refugees has increased due to the war.
  </text>
  <text x="50" y="310" class="content">
    由于战争，难民的外流增加了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water tap -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="150" r="20" class="image" />
    <!-- Water flow -->
    <path d="M 50 130 Q 100 100 150 130 Q 200 160 250 130" class="image" />
    <path d="M 50 120 Q 100 90 150 120 Q 200 150 250 120" class="image" />
    <path d="M 50 110 Q 100 80 150 110 Q 200 140 250 110" class="image" />
  </g>
</svg>