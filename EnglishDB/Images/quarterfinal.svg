<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quarterfinal</text>
  <text x="50" y="120" class="subtitle">[ˌkwɔːrtərˈfaɪnl] n. 四分之一决赛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quarter (四分之一) + final (决赛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场激烈的足球比赛，"四分之一(quarter)"
    <tspan x="50" dy="25">的队伍进入了"决赛(final)"，这就是四分之一决赛(quarterfinal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team advanced to the quarterfinals after a thrilling match.
  </text>
  <text x="50" y="310" class="content">
    这支队伍在一场激动人心的比赛后进入了四分之一决赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Football field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Goal posts -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Football -->
    <circle cx="175" cy="100" r="15" class="image" />
    <!-- Players -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
  </g>
</svg>