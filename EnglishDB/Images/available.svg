<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">available</text>
  <text x="50" y="120" class="subtitle">[əˈveɪləbl] adj. 可用的，可获得的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + vail (价值) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宝箱，里面装满了"有价值的(vail)"
    <tspan x="50" dy="25">物品，并且这些物品都是"可以获得的(available)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tickets for the concert are available online.
  </text>
  <text x="50" y="310" class="content">
    音乐会的门票可以在网上购买。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Treasure items -->
    <circle cx="100" cy="100" r="20" class="image" />
    <rect x="150" y="80" width="40" height="40" class="image" />
    <line x1="220" y1="80" x2="260" y2="120" class="image" />
    <line x1="260" y1="120" x2="220" y2="160" class="image" />
    <line x1="220" y1="160" x2="180" y2="120" class="image" />
    <!-- Available sign -->
    <text x="150" y="180" class="highlight">Available</text>
  </g>
</svg>