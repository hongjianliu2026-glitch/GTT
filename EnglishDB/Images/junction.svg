<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">junction</text>
  <text x="50" y="120" class="subtitle">[ˈdʒʌŋkʃən] n. 交叉点，汇合处</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> junct (连接) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条公路和一条铁路在某个地方"连接(junct)"，
    <tspan x="50" dy="25">形成了一个交叉点(junction)，车辆和火车在这里交汇。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident happened at the busy junction.
  </text>
  <text x="50" y="310" class="content">
    事故发生在繁忙的交叉路口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Rail -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Junction point -->
    <circle cx="175" cy="100" r="10" class="image" fill="#E74C3C" />
    <!-- Car -->
    <rect x="150" y="85" width="20" height="30" class="image" fill="#34495E" />
    <!-- Train -->
    <rect x="165" y="10" width="20" height="80" class="image" fill="#2980B9" />
  </g>
</svg>