<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recapture</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈkæptʃər] v. 重新获得，夺回</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + capture (捕获)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士在战场上，"再次捕获(re-capture)"
    <tspan x="50" dy="25">失去的旗帜，象征着重新夺回(recapture)胜利。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team managed to recapture the lead in the final minutes.
  </text>
  <text x="50" y="310" class="content">
    队伍在最后几分钟重新夺回了领先优势。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flagpole -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <!-- Flag -->
    <polygon points="175,20 125,70 175,120 225,70" class="image" />
    <!-- Warrior -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>