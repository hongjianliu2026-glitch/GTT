<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #B7950B; }
      .subtitle { font: italic 24px serif; fill: #6E2C00; }
      .content { font: 18px sans-serif; fill: #873600; }
      .highlight { font-weight: bold; fill: #D35400; }
      .story { font: 16px serif; fill: #196F3D; }
      .image { stroke: #7D6608; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hemp</text>
  <text x="50" y="120" class="subtitle">[hɛmp] n. 大麻，麻绳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hemp (源自中古英语 hempe，指大麻植物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在田里种植大麻(hemp)，
    <tspan x="50" dy="25">这些大麻植物长得很高，最后被用来制作麻绳。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer grew hemp to make ropes.
  </text>
  <text x="50" y="310" class="content">
    农夫种植大麻来制作麻绳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hemp plants -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Farmer -->
    <circle cx="30" cy="100" r="15" class="image" />
    <line x1="30" y1="115" x2="30" y2="150" class="image" />
    <line x1="30" y1="150" x2="10" y2="180" class="image" />
    <line x1="30" y1="150" x2="50" y2="180" class="image" />
    <line x1="30" y1="130" x2="70" y2="120" class="image" />
  </g>
</svg>