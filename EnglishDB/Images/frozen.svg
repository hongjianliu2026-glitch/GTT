<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ice { fill: #AED6F1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frozen</text>
  <text x="50" y="120" class="subtitle">[ˈfroʊzn] adj. 冻结的，冰冻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frōs (霜) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冰淇淋被"霜(frōs)"覆盖，
    <tspan x="50" dy="25">变成了"冻结的(frozen)"冰淇淋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lake was frozen solid after the cold snap.
  </text>
  <text x="50" y="310" class="content">
    寒流过后，湖面完全结冰了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice cream -->
    <circle cx="100" cy="100" r="50" class="ice" />
    <!-- Frost -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="50" y1="90" x2="150" y2="90" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
  </g>
</svg>