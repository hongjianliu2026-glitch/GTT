<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whistling</text>
  <text x="50" y="120" class="subtitle">[ˈwɪslɪŋ] v. 吹口哨，发出哨声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whist (哨声) + -ling (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公园里，"吹出(whist)"
    <tspan x="50" dy="25">清脆的哨声(whistling)，鸟儿们都被吸引过来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He whistled a cheerful tune while walking in the park.
  </text>
  <text x="50" y="310" class="content">
    他在公园里散步时吹着欢快的曲调。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person whistling -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Whistling sound waves -->
    <path d="M100,100 Q150,50 200,100" class="image" />
    <path d="M100,120 Q150,70 200,120" class="image" />
    <path d="M100,140 Q150,90 200,140" class="image" />
    <!-- Birds -->
    <circle cx="250" cy="80" r="10" class="image" />
    <circle cx="270" cy="90" r="10" class="image" />
    <circle cx="290" cy="80" r="10" class="image" />
  </g>
</svg>