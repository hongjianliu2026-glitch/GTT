<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">edgy</text>
  <text x="50" y="120" class="subtitle">[ˈɛdʒi] adj. 急躁的，紧张的；有锋芒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> edge (边缘) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀，刀刃(edge)非常锋利，让人感到紧张和急躁(edgy)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He felt edgy before the big presentation.
  </text>
  <text x="50" y="310" class="content">
    他在大型演讲前感到紧张。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Knife -->
    <line x1="0" y1="0" x2="150" y2="0" class="image" />
    <line x1="150" y1="0" x2="140" y2="10" class="image" />
    <line x1="150" y1="0" x2="140" y2="-10" class="image" />
    <line x1="140" y1="10" x2="140" y2="-10" class="image" />
    <!-- Edge -->
    <line x1="140" y1="0" x2="150" y2="0" class="image" />
    <!-- Handle -->
    <rect x="0" y="-20" width="30" height="40" class="image" />
  </g>
</svg>