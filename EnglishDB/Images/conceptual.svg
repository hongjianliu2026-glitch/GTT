<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conceptual</text>
  <text x="50" y="120" class="subtitle">[kənˈseptʃuəl] adj. 概念的，观念的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + cept (拿) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"共同拿(con-cept)"
    <tspan x="50" dy="25">出一些抽象的想法，这些想法就是概念(conceptual)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist's work is highly conceptual.
  </text>
  <text x="50" y="310" class="content">
    这位艺术家的作品非常概念化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People sitting around a table -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <rect x="30" y="70" width="180" height="20" class="image" />
    <!-- Lightbulb representing ideas -->
    <circle cx="120" cy="120" r="20" class="image" />
    <line x1="120" y1="140" x2="120" y2="180" class="image" />
    <line x1="120" y1="150" x2="100" y2="160" class="image" />
    <line x1="120" y1="150" x2="140" y2="160" class="image" />
  </g>
</svg>