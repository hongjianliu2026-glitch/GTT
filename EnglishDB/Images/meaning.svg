<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meaning</text>
  <text x="50" y="120" class="subtitle">[ˈmiːnɪŋ] n. 意义，含义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mean (意味) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考，"意味(mean)"着什么，
    <tspan x="50" dy="25">这个过程就是寻找"意义(meaning)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Can you explain the meaning of this word?
  </text>
  <text x="50" y="310" class="content">
    你能解释一下这个词的意思吗？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thought bubble -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="150" cy="150" r="60" class="image" />
    <circle cx="200" cy="100" r="40" class="image" />
    <!-- Person thinking -->
    <circle cx="100" cy="250" r="30" class="image" />
    <line x1="100" y1="280" x2="100" y2="350" class="image" />
    <line x1="100" y1="350" x2="70" y2="400" class="image" />
    <line x1="100" y1="350" x2="130" y2="400" class="image" />
    <line x1="100" y1="320" x2="150" y2="310" class="image" />
  </g>
</svg>