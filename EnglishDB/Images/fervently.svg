<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fervently</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrvəntli] adv. 热情地，热烈地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ferv (热) + -ent (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在演讲时，"热情如火(ferv-ent)"，
    <tspan x="50" dy="25">他的话语像火焰一样燃烧，听众都被他的热情所感染。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke fervently about her love for animals.
  </text>
  <text x="50" y="310" class="content">
    她热情地谈论她对动物的爱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flame -->
    <path d="M50 50 C 70 20, 90 20, 110 50 S 150 80, 130 100 S 90 120, 70 100 Z" class="image" fill="#FF6F61" />
    <!-- Speaker -->
    <circle cx="100" cy="150" r="20" class="image" fill="#34495E" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="140" y2="180" class="image" />
    <!-- Speech bubble -->
    <path d="M150 140 Q 200 130, 250 140 Q 200 150, 150 140 Z" class="image" fill="#F1C40F" />
    <text x="170" y="150" class="content" fill="#34495E">热情</text>
  </g>
</svg>