<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .card { fill: #FFF; stroke: #7F8C8D; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">postcard</text>
  <text x="50" y="120" class="subtitle">[ˈpoʊstkɑːrd] n. 明信片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> post- (邮寄) + card (卡片)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张明信片从远方邮寄(post)过来，
    <tspan x="50" dy="25">卡片(card)上印着美丽的风景，让人心生向往。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sent me a postcard from her vacation.
  </text>
  <text x="50" y="310" class="content">
    她从度假地给我寄了一张明信片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Postcard -->
    <rect x="0" y="0" width="300" height="200" class="card" />
    <!-- Stamp -->
    <circle cx="250" cy="20" r="15" class="image" />
    <!-- Picture on the postcard -->
    <rect x="20" y="20" width="260" height="120" class="image" />
    <!-- Text on the postcard -->
    <line x1="20" y1="160" x2="280" y2="160" class="image" />
    <line x1="20" y1="180" x2="250" y2="180" class="image" />
    <line x1="20" y1="200" x2="270" y2="200" class="image" />
  </g>
</svg>