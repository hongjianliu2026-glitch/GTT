<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sickening</text>
  <text x="50" y="120" class="subtitle">[ˈsɪkənɪŋ] adj. 令人作呕的，令人厌恶的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sick (生病) + -en (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到一盘腐烂的食物，"使(en)"
    <tspan x="50" dy="25">他感到"生病(sick)"，这种感觉就是"令人作呕的(sickening)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sight of the rotten food was sickening.
  </text>
  <text x="50" y="310" class="content">
    看到腐烂的食物令人作呕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rotten food -->
    <circle cx="100" cy="100" r="50" class="image" fill="#8B4513" />
    <circle cx="120" cy="80" r="10" class="image" fill="#A52A2A" />
    <circle cx="80" cy="110" r="10" class="image" fill="#A52A2A" />
    <circle cx="130" cy="120" r="10" class="image" fill="#A52A2A" />
    <!-- Person reacting -->
    <circle cx="250" cy="100" r="30" class="image" fill="#F1C40F" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="210" class="image" />
    <line x1="250" y1="180" x2="270" y2="210" class="image" />
    <line x1="250" y1="150" x2="220" y2="140" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />
    <!-- Exclamation marks -->
    <text x="240" y="90" class="image" font-size="30" fill="#E74C3C">!</text>
    <text x="230" y="70" class="image" font-size="30" fill="#E74C3C">!</text>
    <text x="250" y="70" class="image" font-size="30" fill="#E74C3C">!</text>
  </g>
</svg>