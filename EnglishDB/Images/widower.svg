<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">widower</text>
  <text x="50" y="120" class="subtitle">[ˈwɪdoʊər] n. 鳏夫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wid (寡) + -ow (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孤独的"寡人(wid-ow)"，
    <tspan x="50" dy="25">失去了妻子，独自一人坐在空荡荡的房间里，</tspan>
    <tspan x="50" dy="25">这就是鳏夫(widower)的形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After his wife passed away, he became a widower.
  </text>
  <text x="50" y="310" class="content">
    妻子去世后，他成了鳏夫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Empty room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Man sitting alone -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Empty chair -->
    <rect x="100" y="120" width="40" height="60" class="image" />
    <line x1="120" y1="120" x2="120" y2="180" class="image" />
    <!-- Empty room walls -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="0" x2="0" y2="200" class="image" />
    <line x1="350" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>