<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sweet</text>
  <text x="50" y="120" class="subtitle">[swiːt] adj. 甜的，甜美的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swēt (古英语，甜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的糖果山，"甜(swēt)"
    <tspan x="50" dy="25">美的味道弥漫在空气中，让人忍不住微笑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake was so sweet that it made my teeth hurt.
  </text>
  <text x="50" y="310" class="content">
    蛋糕太甜了，甜得我的牙都疼了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candy mountain -->
    <polygon points="0,200 150,0 300,200" style="fill:#FFD700;stroke:#FF6F61;stroke-width:2" />
    <!-- Candy -->
    <circle cx="75" cy="100" r="20" style="fill:#FF6F61;stroke:#FF6F61;stroke-width:2" />
    <circle cx="125" cy="100" r="20" style="fill:#FF6F61;stroke:#FF6F61;stroke-width:2" />
    <circle cx="175" cy="100" r="20" style="fill:#FF6F61;stroke:#FF6F61;stroke-width:2" />
    <circle cx="225" cy="100" r="20" style="fill:#FF6F61;stroke:#FF6F61;stroke-width:2" />
    <!-- Smile -->
    <path d="M50,150 Q100,180 150,150" style="fill:none;stroke:#FF6F61;stroke-width:2" />
  </g>
</svg>