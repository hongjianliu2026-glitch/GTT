<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">emigrant</text>
  <text x="50" y="120" class="subtitle">[ˈemɪɡrənt] n. 移民，移居外国者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + migr (移动) + -ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背着行李，"走出(e-)"
    <tspan x="50" dy="25">自己的国家，"移动(migr)"</tspan>
    <tspan x="50" dy="25">到另一个国家，成为"移民(emigrant)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many emigrants seek better opportunities abroad.
  </text>
  <text x="50" y="310" class="content">
    许多移民寻求国外更好的机会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with luggage -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="140" class="image" /> <!-- Right arm -->
    <rect x="80" y="90" width="40" height="30" class="image" /> <!-- Luggage -->
    <line x1="120" y1="100" x2="160" y2="100" class="image" /> <!-- Path -->
    <line x1="160" y1="100" x2="200" y2="120" class="image" /> <!-- Path -->
    <line x1="200" y1="120" x2="240" y2="140" class="image" /> <!-- Path -->
  </g>
</svg>