<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brewery</text>
  <text x="50" y="120" class="subtitle">[ˈbruːəri] n. 啤酒厂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brew (酿造) + -ery (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的啤酒厂，里面有无数的酿造桶，
    <tspan x="50" dy="25">"酿造(brew)"出美味的啤酒，这就是"啤酒厂(brewery)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The brewery produces a variety of craft beers.
  </text>
  <text x="50" y="310" class="content">
    这家啤酒厂生产各种精酿啤酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brewery building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Brewing tanks -->
    <circle cx="70" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="230" cy="100" r="30" class="image" />
    <!-- Pipes -->
    <line x1="70" y1="130" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="230" y2="130" class="image" />
    <!-- Beer pouring -->
    <line x1="70" y1="100" x2="70" y2="150" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="230" y1="100" x2="230" y2="150" class="image" />
  </g>
</svg>