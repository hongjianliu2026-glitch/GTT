<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hose</text>
  <text x="50" y="120" class="subtitle">[hoʊz] n. 软管，水龙带；v. 用软管浇水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hose (源自中古英语 hose，意为“袜子”，后引申为“软管”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的“袜子(hose)”变成了软管，喷出水来，
    <tspan x="50" dy="25">就像一个巨人用它来浇灌花园。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a hose to water the garden.
  </text>
  <text x="50" y="310" class="content">
    他用软管给花园浇水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hose -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Water spray -->
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="50" y1="50" x2="150" y2="100" class="image" />
    <line x1="50" y1="50" x2="200" y2="100" class="image" />
    <line x1="50" y1="50" x2="250" y2="100" class="image" />
    <!-- Garden -->
    <rect x="200" y="100" width="100" height="50" class="image" />
    <circle cx="220" cy="125" r="10" class="image" />
    <circle cx="240" cy="125" r="10" class="image" />
    <circle cx="260" cy="125" r="10" class="image" />
  </g>
</svg>