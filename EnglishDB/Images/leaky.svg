<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leaky</text>
  <text x="50" y="120" class="subtitle">[ˈliːki] adj. 漏的，有漏洞的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leak (漏) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个水桶，底部有一个小洞，水不断从洞里"漏出(leak)"，
    <tspan x="50" dy="25">这个水桶就是"漏的(leaky)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roof is leaky, and water drips inside during rain.
  </text>
  <text x="50" y="310" class="content">
    屋顶漏水，下雨时水滴会滴进来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bucket -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Water -->
    <rect x="50" y="20" width="100" height="100" class="image" fill="#3498DB" />
    <!-- Leak -->
    <line x1="100" y1="120" x2="100" y2="150" class="image" stroke-width="4" stroke="#E74C3C" />
    <circle cx="100" cy="150" r="5" class="image" fill="#E74C3C" />
    <!-- Dripping water -->
    <line x1="100" y1="150" x2="100" y2="180" class="image" stroke-width="2" stroke="#3498DB" />
    <line x1="100" y1="180" x2="100" y2="210" class="image" stroke-width="2" stroke="#3498DB" />
    <line x1="100" y1="210" x2="100" y2="240" class="image" stroke-width="2" stroke="#3498DB" />
  </g>
</svg>