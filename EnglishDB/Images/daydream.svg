<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">daydream</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪdriːm] n. 白日梦；v. 做白日梦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> day (白天) + dream (梦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光明媚的白天，"白天做梦(day-dream)"，
    <tspan x="50" dy="25">沉浸在自己的幻想世界中，这就是白日梦(daydream)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She often daydreams about traveling the world.
  </text>
  <text x="50" y="310" class="content">
    她经常幻想环游世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" class="image" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" fill="#2C3E50" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="180" y2="130" class="image" />
    <line x1="200" y1="150" x2="220" y2="130" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <!-- Thought bubble -->
    <path d="M 220 80 Q 300 60 380 80 Q 300 100 220 80" class="image" fill="#ECF0F1" stroke="#7F8C8D" />
    <circle cx="250" cy="70" r="10" class="image" fill="#2980B9" />
    <circle cx="300" cy="70" r="10" class="image" fill="#2980B9" />
    <circle cx="350" cy="70" r="10" class="image" fill="#2980B9" />
  </g>
</svg>