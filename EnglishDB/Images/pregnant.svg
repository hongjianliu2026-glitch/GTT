<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pregnant</text>
  <text x="50" y="120" class="subtitle">[ˈprɛɡnənt] adj. 怀孕的，充满的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + gn (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女人，"在前面(pre-)"
    <tspan x="50" dy="25">已经"产生(gn)"了一个小生命，</tspan>
    <tspan x="50" dy="25">她就是怀孕的(pregnant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is pregnant with her first child.
  </text>
  <text x="50" y="310" class="content">
    她怀着她的第一个孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pregnant woman -->
    <circle cx="100" cy="100" r="50" class="image" />
    <ellipse cx="100" cy="150" rx="60" ry="40" class="image" />
    <!-- Baby bump -->
    <ellipse cx="100" cy="120" rx="40" ry="20" class="image" fill="#F1C40F" />
    <!-- Arms -->
    <line x1="60" y1="120" x2="30" y2="100" class="image" />
    <line x1="140" y1="120" x2="170" y2="100" class="image" />
    <!-- Legs -->
    <line x1="80" y1="190" x2="80" y2="220" class="image" />
    <line x1="120" y1="190" x2="120" y2="220" class="image" />
  </g>
</svg>