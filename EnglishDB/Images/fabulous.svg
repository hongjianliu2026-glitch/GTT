<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fabulous</text>
  <text x="50" y="120" class="subtitle">[ˈfæbjələs] adj. 极好的，绝妙的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fabul (说) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个说书人(fabul)在讲述一个
    <tspan x="50" dy="25">极其精彩的故事，听众们都被深深吸引，</tspan>
    <tspan x="50" dy="25">觉得这个故事"极好的(fabulous)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The performance was fabulous, everyone loved it.
  </text>
  <text x="50" y="310" class="content">
    表演非常精彩，大家都喜欢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Storyteller -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 50 80 Q 100 50 150 80 Q 100 110 50 80" class="image" />
    <text x="60" y="90" class="content">精彩故事</text>
    <!-- Audience -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="230" cy="100" r="10" class="image" />
    <circle cx="260" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="200" y2="130" class="image" />
    <line x1="230" y1="110" x2="230" y2="130" class="image" />
    <line x1="260" y1="110" x2="260" y2="130" class="image" />
  </g>
</svg>