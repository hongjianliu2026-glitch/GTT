<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scholastic</text>
  <text x="50" y="120" class="subtitle">[skəˈlæstɪk] adj. 学校的，学术的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> schol (学校) + -astic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在学校里，"学校(schol)"
    <tspan x="50" dy="25">里充满了学术(scholastic)的氛围，</tspan>
    <tspan x="50" dy="25">学生们都在认真学习。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scholastic achievements of the students were impressive.
  </text>
  <text x="50" y="310" class="content">
    学生们的学术成就令人印象深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- School building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Classroom -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Student -->
    <circle cx="70" cy="100" r="15" class="image" />
    <line x1="70" y1="115" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="70" y1="130" x2="100" y2="120" class="image" />
    <!-- Books -->
    <rect x="120" y="30" width="30" height="40" class="image" />
    <rect x="160" y="30" width="30" height="40" class="image" />
    <rect x="200" y="30" width="30" height="40" class="image" />
  </g>
</svg>