<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consonant</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːnsənənt] n. 辅音；adj. 一致的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + son (声音) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一起唱歌，"共同发出(con-son)"
    <tspan x="50" dy="25">声音，这些声音中有些是辅音(consonant)，</tspan>
    <tspan x="50" dy="25">它们与元音一起构成了和谐的旋律。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The word "cat" has two consonants and one vowel.
  </text>
  <text x="50" y="310" class="content">
    "cat"这个词有两个辅音和一个元音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Sound waves -->
    <path d="M50 80 C 70 100, 130 100, 150 80" class="image" />
    <path d="M50 90 C 70 110, 130 110, 150 90" class="image" />
    <path d="M50 100 C 70 120, 130 120, 150 100" class="image" />
    <!-- Consonant sound -->
    <text x="100" y="150" class="content" text-anchor="middle">C</text>
  </g>
</svg>