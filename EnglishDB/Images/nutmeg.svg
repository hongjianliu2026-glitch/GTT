<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nutmeg</text>
  <text x="50" y="120" class="subtitle">[ˈnʌtmɛɡ] n. 肉豆蔻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nut (坚果) + meg (豆蔻)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的坚果(nut)，里面藏着一颗神奇的豆蔻(meg)，
    <tspan x="50" dy="25">这颗豆蔻散发出诱人的香气，让人忍不住想咬一口。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Add a pinch of nutmeg to the soup for extra flavor.
  </text>
  <text x="50" y="310" class="content">
    在汤里加一点肉豆蔻，增加风味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nutmeg -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="40" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Aroma lines -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="120" y1="50" x2="140" y2="0" class="image" />
    <line x1="80" y1="50" x2="60" y2="0" class="image" />
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="120" y1="50" x2="140" y2="0" class="image" />
    <line x1="80" y1="50" x2="60" y2="0" class="image" />
  </g>
</svg>