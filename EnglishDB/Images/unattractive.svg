<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unattractive</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəˈtræktɪv] adj. 不吸引人的，无魅力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + attract (吸引) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"不吸引人(un-attractive)"的人，
    <tspan x="50" dy="25">站在镜子前，镜子里的自己毫无魅力，</tspan>
    <tspan x="50" dy="25">仿佛被"吸引力(attract)"抛弃了一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old building looked unattractive and neglected.
  </text>
  <text x="50" y="310" class="content">
    那座旧建筑看起来既不吸引人又无人照料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="125" y2="140" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
    <!-- X mark -->
    <line x1="150" y1="80" x2="200" y2="120" class="image" />
    <line x1="150" y1="120" x2="200" y2="80" class="image" />
  </g>
</svg>