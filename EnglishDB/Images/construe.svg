<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">construe</text>
  <text x="50" y="120" class="subtitle">[kənˈstruː] v. 解释，理解</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + strue (建造)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在"一起建造(con-strue)"一个复杂的谜题，
    <tspan x="50" dy="25">通过逐步推理来"解释(construe)"它的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lawyer tried to construe the contract in favor of his client.
  </text>
  <text x="50" y="310" class="content">
    律师试图为他的客户解释合同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="110" y="0" width="100" height="100" class="image" />
    <rect x="220" y="0" width="100" height="100" class="image" />
    <rect x="0" y="110" width="100" height="100" class="image" />
    <rect x="110" y="110" width="100" height="100" class="image" />
    <rect x="220" y="110" width="100" height="100" class="image" />
    <!-- Person thinking -->
    <circle cx="160" cy="250" r="20" class="image" />
    <line x1="160" y1="270" x2="160" y2="320" class="image" />
    <line x1="160" y1="320" x2="140" y2="350" class="image" />
    <line x1="160" y1="320" x2="180" y2="350" class="image" />
    <line x1="160" y1="290" x2="120" y2="280" class="image" />
    <line x1="160" y1="290" x2="200" y2="280" class="image" />
  </g>
</svg>