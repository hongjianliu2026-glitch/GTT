<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deplorable</text>
  <text x="50" y="120" class="subtitle">[dɪˈplɔːrəbl] adj. 可悲的，糟糕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + plor (哭泣) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，一个人因为看到"向下哭泣(de-plor)"的景象而感到
    <tspan x="50" dy="25">非常悲伤，这种景象是"可悲的(deplorable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The living conditions in the slum were deplorable.
  </text>
  <text x="50" y="310" class="content">
    贫民窟的生活条件非常糟糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sad face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="35" y1="40" x2="65" y2="40" class="image" />
    <line x1="35" y1="60" x2="65" y2="60" class="image" />
    <path d="M35 70 Q50 90 65 70" class="image" />
    <!-- Downward arrow -->
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <polygon points="150,100 140,90 145,95" class="image" />
    <!-- Tear drop -->
    <ellipse cx="125" cy="120" rx="10" ry="15" class="image" />
  </g>
</svg>