<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transatlantic</text>
  <text x="50" y="120" class="subtitle">[ˌtrænzətˈlæntɪk] adj. 横跨大西洋的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + atlantic (大西洋)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘巨大的船，"跨越(trans-)"
    <tspan x="50" dy="25">大西洋(atlantic)，从欧洲到美洲，这就是transatlantic。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The transatlantic flight took 8 hours.
  </text>
  <text x="50" y="310" class="content">
    横跨大西洋的飞行花了8个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Ship -->
    <rect x="150" y="50" width="50" height="30" class="image" fill="#D35400" />
    <rect x="140" y="80" width="70" height="10" class="image" fill="#D35400" />
    <!-- Waves -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
  </g>
</svg>