<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">topography</text>
  <text x="50" y="120" class="subtitle">[təˈpɑːɡrəfi] n. 地形，地貌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> topo- (地方) + graph (写) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在地图上"写下(graph)"
    <tspan x="50" dy="25">不同地方(topo)的地形特征，这些特征就构成了地形学(topography)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The topography of the region is very diverse, with mountains, valleys, and plains.
  </text>
  <text x="50" y="310" class="content">
    该地区的地形非常多样，有山脉、山谷和平原。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mountains -->
    <polyline points="50,150 75,100 100,150" class="image" />
    <polyline points="125,150 150,100 175,150" class="image" />
    <!-- Valley -->
    <polyline points="200,150 225,125 250,150" class="image" />
    <!-- Plains -->
    <line x1="275" y1="150" x2="325" y2="150" class="image" />
    <!-- Explorer -->
    <circle cx="20" cy="180" r="15" class="image" />
    <line x1="20" y1="195" x2="20" y2="220" class="image" />
    <line x1="20" y1="220" x2="0" y2="250" class="image" />
    <line x1="20" y1="220" x2="40" y2="250" class="image" />
    <line x1="20" y1="205" x2="50" y2="195" class="image" />
  </g>
</svg>