<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contagion</text>
  <text x="50" y="120" class="subtitle">[kənˈteɪdʒən] n. 传染，感染</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tag (接触) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"一起接触(con-tag)"，
    <tspan x="50" dy="25">病毒迅速传播，形成了一场大规模的"传染(contagion)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spread of the disease was due to contagion.
  </text>
  <text x="50" y="310" class="content">
    疾病的传播是由于传染。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Virus -->
    <circle cx="100" cy="100" r="15" class="image" fill="#E74C3C" />
    <circle cx="200" cy="100" r="15" class="image" fill="#E74C3C" />
    <!-- Lines of contagion -->
    <line x1="70" y1="70" x2="130" y2="120" class="image" />
    <line x1="170" y1="70" x2="230" y2="120" class="image" />
  </g>
</svg>