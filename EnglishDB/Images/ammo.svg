<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ammo</text>
  <text x="50" y="120" class="subtitle">[ˈæmoʊ] n. 弹药</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> am (来自拉丁语 "arma"，武器) + mo (表示物质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵在战场上，"武器(am)"
    <tspan x="50" dy="25">需要"物质(mo)"来发射，这就是弹药(ammo)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldier checked his ammo before entering the battlefield.
  </text>
  <text x="50" y="310" class="content">
    士兵在进入战场前检查了他的弹药。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Gun -->
    <rect x="50" y="90" width="100" height="20" class="image" />
    <line x1="150" y1="100" x2="170" y2="100" class="image" />
    <!-- Ammo -->
    <rect x="180" y="80" width="20" height="40" class="image" />
    <rect x="210" y="80" width="20" height="40" class="image" />
    <rect x="240" y="80" width="20" height="40" class="image" />
  </g>
</svg>