<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lightning { stroke: #F39C12; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">electric</text>
  <text x="50" y="120" class="subtitle">[ɪˈlektrɪk] adj. 电的，电动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> electr (电) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的闪电(lightning)从天而降，"电(electr)"
    <tspan x="50" dy="25">流瞬间充满了整个房间，这就是电的力量(electric)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The electric car is becoming more popular.
  </text>
  <text x="50" y="310" class="content">
    电动汽车正变得越来越受欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lightning bolt -->
    <path d="M 0 0 L 50 100 L 100 0 L 150 100 L 200 0" class="lightning" />
    <!-- Electric symbol -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <circle cx="250" cy="120" r="20" class="image" />
    <line x1="250" y1="140" x2="250" y2="170" class="image" />
  </g>
</svg>