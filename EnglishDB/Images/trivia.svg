<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trivia</text>
  <text x="50" y="120" class="subtitle">[ˈtrɪviə] n. 琐事，小知识</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tri- (三) + via (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象三条小路(tri-via)上，每条路上都有一些
    <tspan x="50" dy="25">无关紧要的小知识(trivia)，就像路边的小石子一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves sharing trivia about celebrities.
  </text>
  <text x="50" y="310" class="content">
    她喜欢分享关于名人的琐事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Three paths -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="50" x2="350" y2="50" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Trivia symbols -->
    <circle cx="50" cy="0" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <!-- Labels -->
    <text x="50" y="-20" class="content">小知识1</text>
    <text x="150" y="30" class="content">小知识2</text>
    <text x="250" y="80" class="content">小知识3</text>
  </g>
</svg>