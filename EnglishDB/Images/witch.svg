<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">witch</text>
  <text x="50" y="120" class="subtitle">[wɪtʃ] n. 女巫，巫婆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wicca (巫术)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女巫(witch)在夜晚的森林中，骑着扫帚飞行，
    <tspan x="50" dy="25">她的魔法帽和斗篷在风中飘扬，周围是闪烁的星星和月亮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The witch cast a spell on the villagers.
  </text>
  <text x="50" y="310" class="content">
    女巫对村民们施了咒语。
  </text>

