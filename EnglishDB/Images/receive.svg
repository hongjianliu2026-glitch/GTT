<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">receive</text>
  <text x="50" y="120" class="subtitle">[rɪˈsiːv] v. 接收，收到</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + ceive (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在门口，"再次拿起(re-ceive)"
    <tspan x="50" dy="25">一个包裹，这个动作就是接收(receive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received a gift from her friend.
  </text>
  <text x="50" y="310" class="content">
    她收到了朋友送的礼物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Package -->
    <rect x="100" y="120" width="80" height="60" class="image" />
    <line x1="100" y1="120" x2="180" y2="120" class="image" />
    <line x1="100" y1="150" x2="180" y2="150" class="image" />
    <line x1="100" y1="180" x2="180" y2="180" class="image" />
  </g>
</svg>