<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">amino</text>
  <text x="50" y="120" class="subtitle">[əˈmiːnoʊ] adj. 氨基的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> amin (氨基) + -o (表示“属于”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学实验室里，一个科学家正在研究"氨基(amin)"
    <tspan x="50" dy="25">化合物，这些化合物都属于"氨基(amino)"类别。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Amino acids are the building blocks of proteins.
  </text>
  <text x="50" y="310" class="content">
    氨基酸是蛋白质的基本组成部分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chemical structure -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="120" y2="100" class="image" />
    <circle cx="140" cy="100" r="20" class="image" />
    <line x1="160" y1="100" x2="210" y2="100" class="image" />
    <circle cx="230" cy="100" r="20" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="180" r="15" class="image" />
    <line x1="20" y1="195" x2="20" y2="230" class="image" />
    <line x1="20" y1="230" x2="0" y2="260" class="image" />
    <line x1="20" y1="230" x2="40" y2="260" class="image" />
    <line x1="20" y1="210" x2="50" y2="200" class="image" />
    <!-- Beaker -->
    <rect x="100" y="160" width="100" height="80" class="image" />
    <line x1="100" y1="160" x2="200" y2="160" class="image" />
    <line x1="100" y1="240" x2="200" y2="240" class="image" />
    <line x1="100" y1="160" x2="100" y2="240" class="image" />
    <line x1="200" y1="160" x2="200" y2="240" class="image" />
  </g>
</svg>