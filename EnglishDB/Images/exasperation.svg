<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exasperation</text>
  <text x="50" y="120" class="subtitle">[ɪɡˌzæspəˈreɪʃən] n. 恼怒，激怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + asper (粗糙) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被粗糙的沙砾（asper）刺激到，
    <tspan x="50" dy="25">情绪爆发（ex-），变得极度恼怒（exasperation）。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His constant interruptions caused her exasperation.
  </text>
  <text x="50" y="310" class="content">
    他不断的打断让她感到非常恼怒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="80" y1="80" x2="120" y2="80" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <line x1="100" y1="140" x2="100" y2="150" class="image" />
    <!-- Sand particles -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="150" cy="50" r="5" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <circle cx="250" cy="50" r="5" class="image" />
    <circle cx="300" cy="50" r="5" class="image" />
  </g>
</svg>