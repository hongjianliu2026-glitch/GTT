<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shack</text>
  <text x="50" y="120" class="subtitle">[ʃæk] n. 简陋的小屋，棚屋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shac (简陋的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个破旧的"简陋小屋(shac)"，
    <tspan x="50" dy="25">屋顶漏水，墙壁摇摇欲坠，这就是一个shack。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They lived in a small shack by the river.
  </text>
  <text x="50" y="310" class="content">
    他们住在河边的一个小棚屋里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shack -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Roof -->
    <polygon points="50,20 300,20 275,50 75,50" class="image" />
    <!-- Walls -->
    <rect x="75" y="50" width="200" height="150" class="image" />
    <!-- Door -->
    <rect x="150" y="150" width="50" height="50" class="image" />
    <!-- Window -->
    <rect x="100" y="80" width="50" height="50" class="image" />
    <!-- Cracks -->
    <line x1="80" y1="60" x2="120" y2="100" class="image" />
    <line x1="180" y1="60" x2="220" y2="100" class="image" />
    <line x1="100" y1="160" x2="140" y2="200" class="image" />
  </g>
</svg>