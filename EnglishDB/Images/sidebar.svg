<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sidebar</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪdˌbɑːr] n. 侧边栏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> side (侧面) + bar (条)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个网页的侧面，有一条(bar)
    <tspan x="50" dy="25">长长的侧边栏(sidebar)，里面放满了各种链接和信息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sidebar on the website contains navigation links.
  </text>
  <text x="50" y="310" class="content">
    网站的侧边栏包含导航链接。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main content area -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sidebar -->
    <rect x="0" y="0" width="50" height="200" class="image" />
    <!-- Links in sidebar -->
    <line x1="10" y1="30" x2="40" y2="30" class="image" />
    <line x1="10" y1="60" x2="40" y2="60" class="image" />
    <line x1="10" y1="90" x2="40" y2="90" class="image" />
    <line x1="10" y1="120" x2="40" y2="120" class="image" />
    <line x1="10" y1="150" x2="40" y2="150" class="image" />
  </g>
</svg>