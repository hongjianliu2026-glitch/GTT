<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Welsh</text>
  <text x="50" y="120" class="subtitle">[wɛlʃ] adj. 威尔士的；n. 威尔士人，威尔士语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自威尔士语 "Cymry"，意为"同胞"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群"同胞(Cymry)"在威尔士的绿色山丘上，
    <tspan x="50" dy="25">他们说着威尔士语，自豪地展示着他们的文化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He speaks fluent Welsh and English.
  </text>
  <text x="50" y="310" class="content">
    他能流利地说威尔士语和英语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Green hills -->
    <path d="M0 100 Q100 200 200 100 T400 100" class="image" />
    <path d="M0 120 Q100 220 200 120 T400 120" class="image" />
    <!-- Welsh flag -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <!-- People -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <line x1="250" y1="165" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="230" y2="230" class="image" />
    <line x1="250" y1="200" x2="270" y2="230" class="image" />
    <line x1="250" y1="180" x2="280" y2="170" class="image" />
  </g>
</svg>