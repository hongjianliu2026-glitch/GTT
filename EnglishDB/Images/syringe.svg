<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">syringe</text>
  <text x="50" y="120" class="subtitle">[sɪˈrɪndʒ] n. 注射器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syring- (管子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的注射器，"管子(syring-)"
    <tspan x="50" dy="25">里装满了液体，准备给一个巨大的气球注射。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nurse used a syringe to inject the medicine.
  </text>
  <text x="50" y="310" class="content">
    护士用注射器注射药物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Syringe body -->
    <rect x="0" y="0" width="200" height="50" class="image" />
    <!-- Syringe plunger -->
    <rect x="180" y="10" width="20" height="30" class="image" />
    <!-- Syringe needle -->
    <line x1="200" y1="25" x2="250" y2="25" class="image" />
    <!-- Balloon -->
    <circle cx="300" cy="25" r="20" class="image" />
  </g>
</svg>