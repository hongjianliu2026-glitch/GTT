<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anonymous</text>
  <text x="50" y="120" class="subtitle">[əˈnɒnɪməs] adj. 匿名的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (没有) + onym (名字) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘人，"没有名字(an-onym-ous)"，
    <tspan x="50" dy="25">他穿着黑色斗篷，脸上戴着面具，完全匿名。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The donation was made by an anonymous donor.
  </text>
  <text x="50" y="310" class="content">
    这笔捐款是由一位匿名捐赠者捐赠的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloak -->
    <path d="M0 0 L50 0 Q75 50 50 100 L0 100 Z" class="image" />
    <!-- Mask -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="40" y1="50" x2="60" y2="50" class="image" />
    <line x1="50" y1="40" x2="50" y2="60" class="image" />
    <!-- Question mark -->
    <text x="80" y="60" font-size="48" fill="#7F8C8D">?</text>
  </g>
</svg>