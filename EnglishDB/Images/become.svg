<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">become</text>
  <text x="50" y="120" class="subtitle">[bɪˈkʌm] v. 成为，变得</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + come (来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从远处"来(come)"，逐渐"成为(be-come)"
    <tspan x="50" dy="25">你心目中的英雄，这个过程就是"变得(become)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wants to become a doctor in the future.
  </text>
  <text x="50" y="310" class="content">
    她希望将来成为一名医生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path of becoming -->
    <path d="M0,100 Q100,50 200,100 T400,100" class="image" />
    <!-- Person walking -->
    <circle cx="0" cy="100" r="15" class="image" />
    <line x1="0" y1="115" x2="0" y2="150" class="image" />
    <line x1="0" y1="150" x2="-15" y2="180" class="image" />
    <line x1="0" y1="150" x2="15" y2="180" class="image" />
    <line x1="0" y1="130" x2="30" y2="120" class="image" />
    <!-- Hero symbol -->
    <polygon points="200,100 180,140 220,140" class="image" />
    <line x1="200" y1="100" x2="200" y2="140" class="image" />
    <line x1="180" y1="120" x2="220" y2="120" class="image" />
  </g>
</svg>