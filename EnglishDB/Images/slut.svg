<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slut</text>
  <text x="50" y="120" class="subtitle">[slʌt] n. 荡妇，邋遢女人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slu- (滑) + t (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女人穿着破旧的衣服，"滑(slu-)"
    <tspan x="50" dy="25">倒在地上，形象邋遢，这就是"荡妇(slut)"的形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was called a slut by her classmates.
  </text>
  <text x="50" y="310" class="content">
    她被同学们称为荡妇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Woman -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Torn clothes -->
    <line x1="30" y1="130" x2="70" y2="130" class="image" />
    <line x1="30" y1="140" x2="70" y2="140" class="image" />
    <line x1="30" y1="150" x2="70" y2="150" class="image" />
    <!-- Sliding -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="30" y2="300" class="image" />
    <line x1="50" y1="250" x2="70" y2="300" class="image" />
  </g>
</svg>