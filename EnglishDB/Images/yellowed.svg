<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #795548; }
      .content { font: 18px sans-serif; fill: #5D4037; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #689F38; }
      .image { stroke: #8D6E63; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yellowed</text>
  <text x="50" y="120" class="subtitle">[ˈjɛloʊd] adj. 变黄的，发黄的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yellow (黄色) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张古老的纸张，随着时间的流逝，"变黄(yellowed)"
    <tspan x="50" dy="25">成了淡黄色，仿佛在诉说着岁月的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pages of the book had yellowed with age.
  </text>
  <text x="50" y="310" class="content">
    这本书的页面因年代久远而变黄了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" fill="#F5F5DC" />
    <!-- Yellowed effect -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="url(#yellowGradient)" />
    <defs>
      <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#FFFFE0;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
      </linearGradient>
    </defs>
    <!-- Folds -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
  </g>
</svg>