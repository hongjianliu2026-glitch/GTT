<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kindly</text>
  <text x="50" y="120" class="subtitle">[ˈkaɪndli] adv. 友善地，亲切地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kind (种类，性质) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个友善的人，"以一种友好的性质(kind-ly)"
    <tspan x="50" dy="25">对待他人，这种友善的行为让人感到温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke to him kindly after the argument.
  </text>
  <text x="50" y="310" class="content">
    争论后，她友善地对他说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 Q100,0 150,50 Q100,100 50,50" class="image" />
    <!-- Smiling face -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="85" cy="90" r="5" class="image" />
    <circle cx="115" cy="90" r="5" class="image" />
    <path d="M85,110 Q100,120 115,110" class="image" />
  </g>
</svg>