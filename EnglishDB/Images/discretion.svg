<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discretion</text>
  <text x="50" y="120" class="subtitle">[dɪˈskreʃən] n. 谨慎，判断力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + cret (区分)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在两个选择之间"分开(dis-)"，
    <tspan x="50" dy="25">用"区分(cret)"的能力做出明智的决定，这就是谨慎(discretion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Use your discretion when deciding whether to speak up.
  </text>
  <text x="50" y="310" class="content">
    在决定是否发言时，请运用你的判断力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two paths representing choices -->
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <line x1="0" y1="0" x2="150" y2="-150" class="image" />
    <!-- Person making a decision -->
    <circle cx="0" cy="0" r="20" class="image" />
    <line x1="0" y1="20" x2="0" y2="50" class="image" />
    <line x1="0" y1="50" x2="-20" y2="80" class="image" />
    <line x1="0" y1="50" x2="20" y2="80" class="image" />
    <line x1="0" y1="30" x2="30" y2="20" class="image" />
  </g>
</svg>