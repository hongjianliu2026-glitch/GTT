<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">genesis</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɛnəsɪs] n. 起源，创始</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen- (出生) + -esis (过程)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宇宙大爆炸的场景，"出生(gen-)"
    <tspan x="50" dy="25">和"过程(-esis)"共同构成了宇宙的起源(genesis)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The genesis of the universe is still a mystery.
  </text>
  <text x="50" y="310" class="content">
    宇宙的起源仍然是一个谜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Big Bang -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="95" y1="100" x2="255" y2="100" class="image" />
    <line x1="135" y1="50" x2="215" y2="150" class="image" />
    <line x1="215" y1="50" x2="135" y2="150" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="250" cy="50" r="5" class="image" />
    <circle cx="100" cy="150" r="5" class="image" />
    <circle cx="250" cy="150" r="5" class="image" />
  </g>
</svg>