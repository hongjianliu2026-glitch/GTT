<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">addict</text>
  <text x="50" y="120" class="subtitle">[ˈædɪkt] n. 上瘾者；v. 使上瘾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (向) + dict (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人对某种事物"不断地说(ad-dict)"
    <tspan x="50" dy="25">着"我需要它"，最终变成了一个上瘾者(addict)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He became an addict to video games.
  </text>
  <text x="50" y="310" class="content">
    他变成了一个电子游戏上瘾者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Speech bubble -->
    <path d="M 80 80 Q 150 80 150 120 Q 150 160 100 160 Q 80 160 80 140 Z" class="image" />
    <text x="90" y="130" class="content">"I need it!"</text>
    <!-- Addiction symbol -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="70" x2="200" y2="130" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
  </g>
</svg>