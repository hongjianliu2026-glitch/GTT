<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #6C3483; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antiquity</text>
  <text x="50" y="120" class="subtitle">[ænˈtɪkwɪti] n. 古代，古老</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (前) + quity (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的城堡，"前(anti-)"
    <tspan x="50" dy="25">的状态(quity)，代表着古代(antiquity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ruins of the ancient city are a testament to antiquity.
  </text>
  <text x="50" y="310" class="content">
    这座古城的废墟见证了古代。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancient castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Ancient symbol -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>