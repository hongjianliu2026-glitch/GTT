<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">secondary</text>
  <text x="50" y="120" class="subtitle">[ˈsɛkəndəri] adj. 次要的，第二的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sec (跟随) + -ond (第二) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舞台上有两个演员，"跟随(sec)"
    <tspan x="50" dy="25">在主角之后，扮演第二(ond)的角色，</tspan>
    <tspan x="50" dy="25">这个角色就是次要的(secondary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> In this play, she played a secondary role.
  </text>
  <text x="50" y="310" class="content">
    在这部戏剧中，她扮演了一个次要的角色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Main actor -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="50" y2="140" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <!-- Secondary actor -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="210" y2="130" class="image" />
    <line x1="250" y1="140" x2="290" y2="130" class="image" />
  </g>
</svg>