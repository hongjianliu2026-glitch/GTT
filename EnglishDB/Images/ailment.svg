<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ailment</text>
  <text x="50" y="120" class="subtitle">[ˈeɪlmənt] n. 疾病，小病</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ail (痛苦) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为"痛苦(ail)"而皱眉，
    <tspan x="50" dy="25">这种痛苦就表现为一种"疾病(ailment)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffers from a minor ailment.
  </text>
  <text x="50" y="310" class="content">
    他患有一种小病。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a frown -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <line x1="30" y1="70" x2="70" y2="70" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
  </g>
</svg>