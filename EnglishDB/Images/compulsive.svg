<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compulsive</text>
  <text x="50" y="120" class="subtitle">[kəmˈpʌlsɪv] adj. 强迫性的，强制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (加强) + puls (推) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一股无形的力量"推着(puls)"，
    <tspan x="50" dy="25">无法控制地做某事，这就是"强迫性的(compulsive)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His compulsive behavior made him check the door lock ten times.
  </text>
  <text x="50" y="310" class="content">
    他的强迫行为让他检查门锁十次。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Invisible force pushing -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="250" y1="50" x2="150" y2="150" class="image" />
    <!-- Person being pushed -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="250" class="image" />
    <line x1="150" y1="220" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="120" y2="180" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />
    <!-- Door lock -->
    <rect x="200" y="100" width="50" height="100" class="image" />
    <line x1="225" y1="100" x2="225" y2="50" class="image" />
  </g>
</svg>