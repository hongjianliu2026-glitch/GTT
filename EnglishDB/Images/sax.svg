<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sax</text>
  <text x="50" y="120" class="subtitle">[sæks] n. 萨克斯管</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自比利时乐器制造家阿道夫·萨克斯(Adolphe Sax)的名字
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在舞台上，吹奏着"萨克斯(sax)"，
    <tspan x="50" dy="25">那悠扬的旋律仿佛在空中跳跃，让人陶醉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He played a beautiful sax solo at the concert.
  </text>
  <text x="50" y="310" class="content">
    他在音乐会上演奏了一段美妙的萨克斯独奏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Saxophone -->
    <path d="M50 50 L100 50 Q150 100 200 50 L250 50 Q300 100 350 50 L400 50" class="image" />
    <circle cx="75" cy="50" r="10" class="image" />
    <circle cx="125" cy="50" r="10" class="image" />
    <circle cx="175" cy="50" r="10" class="image" />
    <circle cx="225" cy="50" r="10" class="image" />
    <circle cx="275" cy="50" r="10" class="image" />
    <circle cx="325" cy="50" r="10" class="image" />
    <circle cx="375" cy="50" r="10" class="image" />
    <!-- Musician -->
    <circle cx="30" cy="100" r="15" class="image" />
    <line x1="30" y1="115" x2="30" y2="150" class="image" />
    <line x1="30" y1="150" x2="10" y2="180" class="image" />
    <line x1="30" y1="150" x2="50" y2="180" class="image" />
    <line x1="30" y1="130" x2="60" y2="120" class="image" />
    <!-- Music notes -->
    <path d="M50 200 Q100 150 150 200 Q200 150 250 200" class="image" />
    <path d="M75 220 Q125 170 175 220 Q225 170 275 220" class="image" />
  </g>
</svg>