<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flood</text>
  <text x="50" y="120" class="subtitle">[flʌd] n. 洪水，大量；v. 淹没，涌入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fl- (流动) + -ood (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流突然"流动(fl-)"得异常迅猛，
    <tspan x="50" dy="25">水位迅速上升，最终"淹没(flood)"了整个村庄。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The river flooded its banks after heavy rain.
  </text>
  <text x="50" y="310" class="content">
    大雨过后，河水淹没了河岸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q100 50 200 100 T400 100" class="image" />
    <!-- Flood -->
    <path d="M0 100 Q100 150 200 100 T400 100" class="image" />
    <!-- House -->
    <rect x="150" y="80" width="50" height="50" class="image" />
    <line x1="175" y1="80" x2="175" y2="60" class="image" />
    <line x1="150" y1="105" x2="200" y2="105" class="image" />
    <!-- Water lines -->
    <line x1="0" y1="100" x2="400" y2="100" class="image" />
    <line x1="0" y1="110" x2="400" y2="110" class="image" />
    <line x1="0" y1="120" x2="400" y2="120" class="image" />
  </g>
</svg>