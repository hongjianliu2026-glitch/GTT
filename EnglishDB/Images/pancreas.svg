<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pancreas</text>
  <text x="50" y="120" class="subtitle">[ˈpæŋkrɪəs] n. 胰腺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pan- (全部) + creas (肉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"全部(pan-)"肉块"creas"，
    <tspan x="50" dy="25">它实际上是一个重要的消化器官——胰腺(pancreas)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pancreas produces enzymes that aid digestion.
  </text>
  <text x="50" y="310" class="content">
    胰腺产生有助于消化的酶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Pancreas shape -->
    <ellipse cx="200" cy="150" rx="100" ry="50" class="image" />
    <!-- Enzymes -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="200" cy="200" r="10" class="image" />
    <!-- Label -->
    <text x="200" y="300" class="content" text-anchor="middle">Pancreas</text>
  </g>
</svg>