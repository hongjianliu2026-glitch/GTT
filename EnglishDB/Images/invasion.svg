<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">invasion</text>
  <text x="50" y="120" class="subtitle">[ɪnˈveɪʒn] n. 入侵，侵略</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vas (走) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一支军队"走进(in-vas)"一个国家，
    <tspan x="50" dy="25">强行进入并占领，这就是入侵(invasion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The invasion of the country was swift and brutal.
  </text>
  <text x="50" y="310" class="content">
    对这个国家的入侵迅速而残酷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Country border -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Army marching in -->
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="100" class="image" />
    <!-- Soldiers -->
    <circle cx="75" cy="100" r="10" class="image" />
    <circle cx="125" cy="100" r="10" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
    <circle cx="225" cy="100" r="10" class="image" />
    <circle cx="275" cy="100" r="10" class="image" />
    <!-- Flag -->
    <line x1="300" y1="80" x2="300" y2="120" class="image" />
    <rect x="300" y="60" width="20" height="20" class="image" />
  </g>
</svg>