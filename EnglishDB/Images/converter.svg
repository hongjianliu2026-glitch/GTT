<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">converter</text>
  <text x="50" y="120" class="subtitle">[kənˈvɜːrtər] n. 转换器，变流器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + vert (转) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神奇的装置，它能把"共同(con-)"的能量"转(vert)"变成另一种形式，
    <tspan x="50" dy="25">这个装置就是转换器(converter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The converter changed the AC power to DC.
  </text>
  <text x="50" y="310" class="content">
    转换器将交流电转换为直流电。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Converter device -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Input and output arrows -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <!-- Arrows -->
    <polygon points="150,50 140,40 160,40" class="image" />
    <polygon points="150,150 140,160 160,160" class="image" />
    <!-- Converter box -->
    <rect x="100" y="70" width="100" height="80" class="image" />
    <!-- Labels -->
    <text x="50" y="40" class="content">Input</text>
    <text x="260" y="160" class="content">Output</text>
  </g>
</svg>