<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fertility</text>
  <text x="50" y="120" class="subtitle">[fərˈtɪləti] n. 肥沃，生育能力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fert- (携带) + -ility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片肥沃的土地，"携带(fert-)"着丰富的生命力，
    <tspan x="50" dy="25">孕育着无数的植物和动物，这就是肥沃(fertility)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fertility of the soil is crucial for agriculture.
  </text>
  <text x="50" y="310" class="content">
    土壤的肥沃对农业至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fertile land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Plants -->
    <line x1="50" y1="180" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="40" y2="120" class="image" />
    <line x1="50" y1="100" x2="60" y2="120" class="image" />
    <line x1="100" y1="180" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="90" y2="140" class="image" />
    <line x1="100" y1="120" x2="110" y2="140" class="image" />
    <line x1="150" y1="180" x2="150" y2="140" class="image" />
    <line x1="150" y1="140" x2="140" y2="160" class="image" />
    <line x1="150" y1="140" x2="160" y2="160" class="image" />
    <!-- Animals -->
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="250" y1="170" x2="250" y2="190" class="image" />
    <line x1="250" y1="190" x2="230" y2="210" class="image" />
    <line x1="250" y1="190" x2="270" y2="210" class="image" />
    <line x1="250" y1="180" x2="280" y2="170" class="image" />
  </g>
</svg>