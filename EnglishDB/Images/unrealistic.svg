<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unrealistic</text>
  <text x="50" y="120" class="subtitle">[ˌʌnrɪˈælɪstɪk] adj. 不切实际的，不真实的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + real (真实的) + -istic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图用"不真实的(un-real)"
    <tspan x="50" dy="25">魔法棒变出一只独角兽，这显然是不切实际的(unrealistic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's unrealistic to expect overnight success in such a competitive field.
  </text>
  <text x="50" y="310" class="content">
    在如此竞争激烈的领域期望一夜成功是不切实际的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic wand -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <!-- Unicorn -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="120" y2="250" class="image" />
    <line x1="150" y1="200" x2="180" y2="250" class="image" />
    <line x1="150" y1="150" x2="120" y2="120" class="image" />
    <line x1="150" y1="150" x2="180" y2="120" class="image" />
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <!-- Unicorn horn -->
    <line x1="150" y1="50" x2="150" y2="20" class="image" />
  </g>
</svg>