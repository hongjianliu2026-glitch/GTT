<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interrogate</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɛrəˌɡeɪt] v. 审问，盘问</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + rog (问)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警察在审讯室里，"在两个人之间(inter-)"
    <tspan x="50" dy="25">不停地提问(rog)，这就是审问(interrogate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective interrogate the suspect for hours.
  </text>
  <text x="50" y="310" class="content">
    侦探对嫌疑人进行了数小时的审问。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Interrogation room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Detective -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Suspect -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <!-- Question marks -->
    <text x="100" y="80" class="image" font-size="48">?</text>
    <text x="150" y="120" class="image" font-size="48">?</text>
    <text x="200" y="80" class="image" font-size="48">?</text>
  </g>
</svg>