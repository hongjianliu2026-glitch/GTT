<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">voodoo</text>
  <text x="50" y="120" class="subtitle">[ˈvuːduː] n. 伏都教，巫术</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自西非的宗教和巫术
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的仪式，"伏都教(voodoo)"
    <tspan x="50" dy="25">的巫师在夜晚施展魔法，操控着</tspan>
    <tspan x="50" dy="25">木偶和符咒，让人心生敬畏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The villagers believed in voodoo and its powers.
  </text>
  <text x="50" y="310" class="content">
    村民们相信伏都教及其力量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Voodoo doll -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <circle cx="75" cy="50" r="20" class="image" />
    <line x1="75" y1="70" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="50" y2="180" class="image" />
    <line x1="75" y1="150" x2="100" y2="180" class="image" />
    <line x1="75" y1="100" x2="50" y2="120" class="image" />
    <line x1="75" y1="100" x2="100" y2="120" class="image" />
    <!-- Pins -->
    <line x1="75" y1="50" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="50" y2="180" class="image" />
    <line x1="75" y1="150" x2="100" y2="180" class="image" />
    <line x1="75" y1="100" x2="50" y2="120" class="image" />
    <line x1="75" y1="100" x2="100" y2="120" class="image" />
    <!-- Ritual -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="220" y2="230" class="image" />
    <line x1="250" y1="200" x2="280" y2="230" class="image" />
    <line x1="250" y1="160" x2="200" y2="150" class="image" />
    <line x1="250" y1="160" x2="300" y2="150" class="image" />
    <!-- Fire -->
    <rect x="220" y="230" width="60" height="30" class="image" />
    <line x1="220" y1="230" x2="280" y2="230" class="image" />
    <line x1="220" y1="245" x2="280" y2="245" class="image" />
    <line x1="220" y1="260" x2="280" y2="260" class="image" />
  </g>
</svg>