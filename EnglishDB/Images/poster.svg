<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">poster</text>
  <text x="50" y="120" class="subtitle">[ˈpoʊstər] n. 海报，招贴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> post (放置) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在墙上"放置(post)"一张大纸，
    <tspan x="50" dy="25">这张纸就是海报(poster)，用来吸引人们的注意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie theater displayed a new poster for the upcoming film.
  </text>
  <text x="50" y="310" class="content">
    电影院展示了一张即将上映电影的新海报。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="300" class="image" />
    <!-- Poster -->
    <rect x="50" y="50" width="250" height="200" class="image" fill="#F1C40F" />
    <!-- Text on the poster -->
    <text x="125" y="150" class="content" fill="#34495E" text-anchor="middle">UPCOMING FILM</text>
  </g>
</svg>