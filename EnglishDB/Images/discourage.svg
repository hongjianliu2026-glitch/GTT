<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discourage</text>
  <text x="50" y="120" class="subtitle">[dɪsˈkɜːrɪdʒ] v. 使泄气，阻止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (否定) + courage (勇气)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人原本充满勇气(courage)，但突然被"否定(dis-)"了，
    <tspan x="50" dy="25">结果变得泄气(discourage)，不再敢前进。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His failure discouraged him from trying again.
  </text>
  <text x="50" y="310" class="content">
    他的失败使他泄气，不再尝试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with courage -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <text x="40" y="230" class="content">勇气</text>

    <!-- Person discouraged -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="150" x2="230" y2="130" class="image" />
    <line x1="250" y1="150" x2="270" y2="130" class="image" />
    <line x1="250" y1="180" x2="230" y2="210" class="image" />
    <line x1="250" y1="180" x2="270" y2="210" class="image" />
    <text x="240" y="230" class="content">泄气</text>

    <!-- Arrow -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
    <text x="140" y="80" class="content">dis-</text>
  </g>
</svg>