<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exposition</text>
  <text x="50" y="120" class="subtitle">[ˌɛkspəˈzɪʃən] n. 展览，阐述</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + posit (放置) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的展览馆，里面摆满了各种展品，"向外放置(ex-posit)"
    <tspan x="50" dy="25">展示给所有人看，这就是一个展览(exposition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The art exposition attracted thousands of visitors.
  </text>
  <text x="50" y="310" class="content">
    艺术展览吸引了成千上万的参观者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Exhibition hall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Exhibits -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Visitors -->
    <circle cx="75" cy="100" r="15" class="image" />
    <circle cx="145" cy="100" r="15" class="image" />
    <circle cx="215" cy="100" r="15" class="image" />
    <circle cx="285" cy="100" r="15" class="image" />
    <!-- Labels -->
    <text x="50" y="180" class="content">展品</text>
    <text x="260" y="180" class="content">参观者</text>
  </g>
</svg>