<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underfunded</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈfʌndɪd] adj. 资金不足的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (不足) + fund (资金) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个项目，资金"不足(under-)"，导致项目进展缓慢，
    <tspan x="50" dy="25">就像一个漏水的桶，永远装不满水。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was underfunded and eventually failed.
  </text>
  <text x="50" y="310" class="content">
    这个项目资金不足，最终失败了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Project box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Leaking bucket -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="70" y2="200" class="image" />
    <line x1="100" y1="150" x2="130" y2="200" class="image" />
    <!-- Water drops -->
    <circle cx="100" cy="160" r="5" class="image" fill="#16A085" />
    <circle cx="90" cy="170" r="5" class="image" fill="#16A085" />
    <circle cx="110" cy="180" r="5" class="image" fill="#16A085" />
  </g>
</svg>