<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dwarf</text>
  <text x="50" y="120" class="subtitle">[dwɔrf] n. 矮人，侏儒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dw- (向下) + arf (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个矮人(dwarf)，他"向下(dw-)"生长，
    <tspan x="50" dy="25">所以比其他人"小(arf)"，这就是矮人的形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dwarf in the fairy tale lived in a tiny cottage.
  </text>
  <text x="50" y="310" class="content">
    童话故事中的矮人住在一个小屋里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dwarf -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="150" x2="30" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="70" y2="140" class="image" /> <!-- Right arm -->
    <!-- Tiny cottage -->
    <rect x="10" y="220" width="80" height="60" class="image" />
    <line x1="10" y1="220" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="90" y2="220" class="image" />
  </g>
</svg>