<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bleak</text>
  <text x="50" y="120" class="subtitle">[bliːk] adj. 荒凉的，阴冷的，黯淡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bli- (光) + ek (减弱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个荒凉的冬天，阳光"减弱(bli-ek)"，
    <tspan x="50" dy="25">整个世界变得阴冷而黯淡(bleak)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The future looked bleak after the company's bankruptcy.
  </text>
  <text x="50" y="310" class="content">
    公司在破产后，未来看起来一片黯淡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="image" fill="#FFD700" />
    <!-- Sun rays -->
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <line x1="70" y1="30" x2="90" y2="10" class="image" />
    <line x1="80" y1="50" x2="100" y2="50" class="image" />
    <line x1="70" y1="70" x2="90" y2="90" class="image" />
    <line x1="50" y1="80" x2="50" y2="100" class="image" />
    <line x1="30" y1="70" x2="10" y2="90" class="image" />
    <line x1="20" y1="50" x2="0" y2="50" class="image" />
    <line x1="30" y1="30" x2="10" y2="10" class="image" />
    <!-- Snowy landscape -->
    <rect x="0" y="100" width="350" height="100" class="image" fill="#FFFFFF" />
    <!-- Trees -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="125" x2="30" y2="125" class="image" />
    <line x1="50" y1="125" x2="70" y2="125" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="125" x2="130" y2="125" class="image" />
    <line x1="150" y1="125" x2="170" y2="125" class="image" />
  </g>
</svg>