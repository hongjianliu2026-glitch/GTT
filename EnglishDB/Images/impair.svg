<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impair</text>
  <text x="50" y="120" class="subtitle">[ɪmˈper] v. 损害，削弱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + pair (平等)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完美的平衡被"进入(im-)"并"不平等(pair)"，
    <tspan x="50" dy="25">导致整体被"损害(impair)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm impaired the power supply.
  </text>
  <text x="50" y="310" class="content">
    暴风雨损害了电力供应。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="20" y1="150" x2="80" y2="150" class="image" />
    <!-- Weights -->
    <rect x="10" y="60" width="20" height="80" class="image" />
    <rect x="70" y="100" width="20" height="40" class="image" />
    <!-- Impairment -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" stroke-dasharray="5,5" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" stroke-dasharray="5,5" />
    <line x1="20" y1="150" x2="80" y2="150" class="image" stroke-dasharray="5,5" />
  </g>
</svg>