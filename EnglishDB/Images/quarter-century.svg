<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quarter-century</text>
  <text x="50" y="120" class="subtitle">[ˈkwɔːrtər ˈsɛntʃəri] n. 二十五年</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quarter (四分之一) + century (世纪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"四分之一(quarter)"
    <tspan x="50" dy="25">的世纪(century)，即25年，就像时钟的</tspan>
    <tspan x="50" dy="25">四分之一圈，时间飞逝，25年转瞬即逝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company celebrated its quarter-century anniversary last year.
  </text>
  <text x="50" y="310" class="content">
    公司去年庆祝了它的二十五周年纪念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Clock hands -->
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <!-- Quarter mark -->
    <line x1="150" y1="50" x2="150" y2="70" class="image" />
    <line x1="250" y1="150" x2="230" y2="150" class="image" />
    <!-- Quarter text -->
    <text x="150" y="60" class="content" text-anchor="middle">¼</text>
    <text x="260" y="150" class="content" text-anchor="middle">25</text>
  </g>
</svg>