<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shaggy</text>
  <text x="50" y="120" class="subtitle">[ˈʃæɡi] adj. 毛发蓬乱的，粗糙的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shag (粗糙的毛发) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只毛发蓬乱的狗，"粗糙的毛发(shag)"
    <tspan x="50" dy="25">让它看起来像一只"蓬乱的(shaggy)"小狗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shaggy dog shook off the water from its fur.
  </text>
  <text x="50" y="310" class="content">
    那只毛发蓬乱的狗抖掉了身上的水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Dog head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Dog ears -->
    <polygon points="70,30 50,50 70,70" class="image" />
    <polygon points="130,30 150,50 130,70" class="image" />
    <!-- Dog eyes -->
    <circle cx="85" cy="45" r="5" class="image" />
    <circle cx="115" cy="45" r="5" class="image" />
    <!-- Dog nose -->
    <circle cx="100" cy="60" r="5" class="image" />
    <!-- Dog mouth -->
    <line x1="90" y1="70" x2="110" y2="70" class="image" />
    <!-- Dog fur -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
  </g>
</svg>