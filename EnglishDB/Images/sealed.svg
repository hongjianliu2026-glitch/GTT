<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sealed</text>
  <text x="50" y="120" class="subtitle">[siːld] adj. 密封的，封闭的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seal (密封) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的宝箱，"密封(seal)"得严严实实，
    <tspan x="50" dy="25">只有找到正确的钥匙才能打开，里面藏着无尽的宝藏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The document was sealed with a wax stamp.
  </text>
  <text x="50" y="310" class="content">
    文件用蜡封封住了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Lid -->
    <rect x="0" y="0" width="200" height="30" class="image" />
    <!-- Seal -->
    <circle cx="100" cy="15" r="10" class="image" />
    <!-- Keyhole -->
    <rect x="90" y="110" width="20" height="10" class="image" />
  </g>
</svg>