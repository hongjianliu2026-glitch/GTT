<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grapevine</text>
  <text x="50" y="120" class="subtitle">[ˈɡreɪpvaɪn] n. 葡萄藤；小道消息</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grape (葡萄) + vine (藤)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个葡萄藤(grapevine)上挂满了葡萄，
    <tspan x="50" dy="25">但突然间，这些葡萄变成了一个个小道消息(grapevine)，</tspan>
    <tspan x="50" dy="25">迅速在人群中传播开来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news spread like wildfire through the grapevine.
  </text>
  <text x="50" y="310" class="content">
    消息像野火一样通过小道消息迅速传播。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grapevine -->
    <path d="M0,0 C50,100 150,100 200,0" class="image" />
    <path d="M200,0 C250,100 350,100 400,0" class="image" />
    <!-- Grapes -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="300" cy="50" r="10" class="image" />
    <circle cx="350" cy="50" r="10" class="image" />
    <!-- People talking -->
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <circle cx="300" cy="150" r="15" class="image" />
    <circle cx="350" cy="150" r="15" class="image" />
    <!-- Speech bubbles -->
    <path d="M50,130 Q70,120 90,130" class="image" />
    <path d="M100,130 Q120,120 140,130" class="image" />
    <path d="M150,130 Q170,120 190,130" class="image" />
    <path d="M250,130 Q270,120 290,130" class="image" />
    <path d="M300,130 Q320,120 340,130" class="image" />
    <path d="M350,130 Q370,120 390,130" class="image" />
  </g>
</svg>