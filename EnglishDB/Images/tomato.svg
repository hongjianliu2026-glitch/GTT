<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #E67E22; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tomato { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tomato</text>
  <text x="50" y="120" class="subtitle">[təˈmeɪtoʊ] n. 番茄，西红柿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自纳瓦特尔语 "tomatl"，意为“浆果”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的番茄(tomato)从天而降，
    <tspan x="50" dy="25">砸在了一个浆果摊上，所有的浆果都被压扁了，</tspan>
    <tspan x="50" dy="25">但番茄依然完好无损，因为它本身就是一种浆果(tomatl)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added tomatoes to her salad for extra flavor.
  </text>
  <text x="50" y="310" class="content">
    她在沙拉中加入了番茄以增加风味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant tomato -->
    <circle cx="100" cy="100" r="80" class="tomato" />
    <!-- Crushed berries -->
    <ellipse cx="250" cy="100" rx="50" ry="30" class="image" />
    <ellipse cx="300" cy="100" rx="40" ry="25" class="image" />
    <ellipse cx="350" cy="100" rx="30" ry="20" class="image" />
    <!-- Berry stand -->
    <rect x="200" y="150" width="200" height="50" class="image" />
  </g>
</svg>