<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">optimist</text>
  <text x="50" y="120" class="subtitle">[ˈɒptɪmɪst] n. 乐观主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> opti- (最好) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个乐观主义者(optimist)，他总是看到事情的"最好(opti-)"一面，
    <tspan x="50" dy="25">即使在最糟糕的情况下，他也能找到希望和光明。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Despite the challenges, she remained an optimist.
  </text>
  <text x="50" y="310" class="content">
    尽管面临挑战，她仍然保持乐观。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Face -->
    <circle cx="100" cy="100" r="20" fill="#FFFFFF" />
    <circle cx="85" cy="90" r="5" fill="#000000" />
    <circle cx="115" cy="90" r="5" fill="#000000" />
    <path d="M80 110 Q100 130 120 110" fill="none" stroke="#000000" stroke-width="2" />
    <!-- Rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <line x1="135" y1="65" x2="170" y2="30" class="image" />
    <line x1="135" y1="135" x2="170" y2="170" class="image" />
    <line x1="65" y1="65" x2="30" y2="30" class="image" />
    <line x1="65" y1="135" x2="30" y2="170" class="image" />
  </g>
</svg>