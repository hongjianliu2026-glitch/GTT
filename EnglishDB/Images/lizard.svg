<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lizard</text>
  <text x="50" y="120" class="subtitle">[ˈlɪzərd] n. 蜥蜴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liz (爬行) + ard (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蜥蜴在沙漠中"爬行(liz)"，它的身体灵活地"移动(ard)"，
    <tspan x="50" dy="25">就像一个灵活的"爬行者(lizard)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lizard quickly scurried up the tree.
  </text>
  <text x="50" y="310" class="content">
    蜥蜴迅速地爬上了树。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lizard body -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="70" y2="80" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="80" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <!-- Lizard head -->
    <circle cx="30" cy="100" r="20" class="image" />
    <!-- Lizard tail -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="220" y2="80" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
  </g>
</svg>