<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dollop</text>
  <text x="50" y="120" class="subtitle">[ˈdɑləp] n. 一团，一块</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> doll (玩偶) + -op (表示量词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的玩偶(doll)头上顶着一团(op)奶油，
    <tspan x="50" dy="25">这团奶油就像是一个巨大的"dollop"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She scooped a dollop of whipped cream onto her dessert.
  </text>
  <text x="50" y="310" class="content">
    她在甜点上舀了一团鲜奶油。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doll head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Dollop of cream -->
    <ellipse cx="100" cy="50" rx="40" ry="20" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 80 110 Q 100 120 120 110" class="image" />
  </g>
</svg>