<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">override</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈraɪd] v. 推翻，覆盖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + ride (骑，控制)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人骑在另一人身上，"在上面控制(over-ride)"
    <tspan x="50" dy="25">，完全推翻了对方的意愿，这就是override的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager can override the system settings.
  </text>
  <text x="50" y="310" class="content">
    经理可以覆盖系统设置。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being overridden -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <!-- Person overriding -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="110" class="image" />
    <line x1="150" y1="110" x2="130" y2="150" class="image" />
    <line x1="150" y1="110" x2="170" y2="150" class="image" />
    <line x1="150" y1="90" x2="190" y2="80" class="image" />

    <!-- Arrow showing control -->
    <line x1="150" y1="50" x2="50" y2="100" class="image" />
    <polygon points="150,50 140,60 160,60" class="image" />
  </g>
</svg>