<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fashion</text>
  <text x="50" y="120" class="subtitle">[ˈfæʃn] n. 时尚，流行；v. 制作，塑造</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fact (做) + ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位设计师在工作室里，"制作(fact)"
    <tspan x="50" dy="25">出一件件引领潮流的服装，这些服装就构成了时尚(fashion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always follows the latest fashion trends.
  </text>
  <text x="50" y="310" class="content">
    她总是紧跟最新的时尚潮流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dress form -->
    <rect x="0" y="0" width="150" height="300" class="image" />
    <!-- Dress -->
    <rect x="20" y="20" width="110" height="260" class="image" />
    <!-- Designer -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="180" y2="280" class="image" />
    <line x1="200" y1="250" x2="220" y2="280" class="image" />
    <line x1="200" y1="200" x2="240" y2="190" class="image" />
    <!-- Scissors -->
    <line x1="240" y1="190" x2="260" y2="170" class="image" />
    <line x1="240" y1="190" x2="260" y2="210" class="image" />
  </g>
</svg>