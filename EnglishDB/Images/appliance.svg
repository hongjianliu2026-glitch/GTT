<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">appliance</text>
  <text x="50" y="120" class="subtitle">[əˈplaɪəns] n. 器具，器械，家用电器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (加强) + pli (充满) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满(pli)能量的家用电器(appliance)，
    <tspan x="50" dy="25">它被加强(ap-)到极致，成为家庭中不可或缺的器具。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new appliance made cooking much easier.
  </text>
  <text x="50" y="310" class="content">
    新的家用电器让烹饪变得容易多了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Appliance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Microwave -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Door -->
    <rect x="70" y="40" width="210" height="120" class="image" />
    <!-- Control panel -->
    <line x1="80" y1="60" x2="260" y2="60" class="image" />
    <line x1="80" y1="80" x2="260" y2="80" class="image" />
    <line x1="80" y1="100" x2="260" y2="100" class="image" />
    <!-- Light -->
    <circle cx="200" cy="140" r="10" class="image" />
  </g>
</svg>