<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fog { fill: #CCCCCC; opacity: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">murky</text>
  <text x="50" y="120" class="subtitle">[ˈmɜːrki] adj. 黑暗的，阴暗的，模糊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mur (黑暗) + -ky (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个深不见底的湖，湖水"黑暗(mur)"得让人看不清底部，
    <tspan x="50" dy="25">周围弥漫着浓雾，一切都变得"模糊(ky)"不清。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forest was so murky that we couldn't see the path.
  </text>
  <text x="50" y="310" class="content">
    森林太阴暗了，我们看不清路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Fog -->
    <rect x="50" y="20" width="250" height="160" class="fog" />
    <!-- Dark water -->
    <rect x="50" y="100" width="250" height="80" class="image" />
    <!-- Tree -->
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <line x1="140" y1="30" x2="160" y2="30" class="image" />
    <line x1="130" y1="40" x2="170" y2="40" class="image" />
    <line x1="120" y1="50" x2="180" y2="50" class="image" />
    <line x1="110" y1="60" x2="190" y2="60" class="image" />
    <line x1="100" y1="70" x2="200" y2="70" class="image" />
    <line x1="90" y1="80" x2="210" y2="80" class="image" />
    <line x1="80" y1="90" x2="220" y2="90" class="image" />
  </g>
</svg>