<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">willing</text>
  <text x="50" y="120" class="subtitle">[ˈwɪlɪŋ] adj. 愿意的，乐意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> will (意愿) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的心形气球前，"心(will)"
    <tspan x="50" dy="25">中充满了愿意和乐意(willing)，准备随时帮助他人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is always willing to help her friends.
  </text>
  <text x="50" y="310" class="content">
    她总是愿意帮助她的朋友。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart balloon -->
    <path d="M50 150 C50 120, 100 120, 100 150 C100 180, 50 180, 50 150" class="image" />
    <path d="M50 150 L75 100 L100 150" class="image" />
    <!-- Person -->
    <circle cx="75" cy="200" r="15" class="image" />
    <line x1="75" y1="215" x2="75" y2="250" class="image" />
    <line x1="75" y1="250" x2="60" y2="280" class="image" />
    <line x1="75" y1="250" x2="90" y2="280" class="image" />
    <line x1="75" y1="230" x2="100" y2="220" class="image" />
  </g>
</svg>