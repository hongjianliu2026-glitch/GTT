<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">toenail</text>
  <text x="50" y="120" class="subtitle">[ˈtoʊneɪl] n. 脚趾甲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> toe (脚趾) + nail (指甲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的脚趾甲(toenail)，它像一座小山一样，
    <tspan x="50" dy="25">上面还长满了各种奇怪的植物，仿佛是一个微型森林。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She painted her toenails with bright colors.
  </text>
  <text x="50" y="310" class="content">
    她用鲜艳的颜色涂了她的脚趾甲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toe -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Toenail -->
    <rect x="125" y="50" width="100" height="50" class="image" />
    <!-- Plants -->
    <line x1="130" y1="55" x2="130" y2="30" class="image" />
    <line x1="140" y1="55" x2="140" y2="35" class="image" />
    <line x1="150" y1="55" x2="150" y2="40" class="image" />
    <line x1="160" y1="55" x2="160" y2="45" class="image" />
    <line x1="170" y1="55" x2="170" y2="50" class="image" />
  </g>
</svg>