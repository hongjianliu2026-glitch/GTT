<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">GDP</text>
  <text x="50" y="120" class="subtitle">[Gross Domestic Product] n. 国内生产总值</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Gross (总的) + Domestic (国内的) + Product (产品)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工厂，"总的生产(Gross)"
    <tspan x="50" dy="25">在国内(Domestic)制造出无数的产品(Product)，</tspan>
    <tspan x="50" dy="25">这些产品的总和就是GDP。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The GDP of the country increased by 5% last year.
  </text>
  <text x="50" y="310" class="content">
    该国的国内生产总值去年增长了5%。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="-50" width="20" height="50" class="image" />
    <!-- Smoke -->
    <circle cx="160" cy="-60" r="10" class="image" />
    <circle cx="160" cy="-70" r="15" class="image" />
    <circle cx="160" cy="-80" r="20" class="image" />
    <!-- Products -->
    <rect x="50" y="50" width="30" height="30" class="image" />
    <rect x="100" y="50" width="30" height="30" class="image" />
    <rect x="150" y="50" width="30" height="30" class="image" />
    <rect x="200" y="50" width="30" height="30" class="image" />
    <rect x="250" y="50" width="30" height="30" class="image" />
  </g>
</svg>