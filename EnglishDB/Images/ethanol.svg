<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ethanol</text>
  <text x="50" y="120" class="subtitle">[ˈɛθəˌnɔl] n. 乙醇，酒精</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eth- (乙) + -anol (醇)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学家在实验室里，"乙(eth-)"
    <tspan x="50" dy="25">和"醇(anol)"结合，创造出乙醇(ethanol)，</tspan>
    <tspan x="50" dy="25">一种常见的酒精。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Ethanol is widely used as a fuel additive.
  </text>
  <text x="50" y="310" class="content">
    乙醇被广泛用作燃料添加剂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flask -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="10" y="10" width="80" height="180" class="image" />
    <!-- Ethanol liquid -->
    <rect x="20" y="30" width="60" height="140" class="image" fill="#F39C12" />
    <!-- Chemical formula -->
    <text x="120" y="100" class="content" fill="#2C3E50">C<tspan dy="-10" dx="10">2</tspan>H<tspan dy="-10" dx="10">5</tspan>OH</text>
  </g>
</svg>