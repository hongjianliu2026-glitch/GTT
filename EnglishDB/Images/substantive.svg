<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">substantive</text>
  <text x="50" y="120" class="subtitle">[ˈsʌbstəntɪv] adj. 实质的，真实的；n. 实质性的事物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + stant (站立) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头"在下面支撑(sub-stant)"着整个建筑，
    <tspan x="50" dy="25">这个石头就是建筑的"实质(substantive)"部分。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The substantive changes in the law were well received.
  </text>
  <text x="50" y="310" class="content">
    法律中的实质性变化得到了很好的接受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Foundation stone -->
    <rect x="150" y="150" width="50" height="50" class="image" />
    <!-- Building structure -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Roof -->
    <polygon points="100,50 250,50 200,0" class="image" />
    <!-- Text on stone -->
    <text x="160" y="180" class="content" style="font-size: 12px;">SUB-STANT</text>
  </g>
</svg>