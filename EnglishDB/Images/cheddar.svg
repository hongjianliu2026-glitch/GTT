<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8DC; }
      .title { font: bold 48px sans-serif; fill: #D2691E; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #A0522D; }
      .highlight { font-weight: bold; fill: #8B0000; }
      .story { font: 16px serif; fill: #8B4513; }
      .image { stroke: #D2691E; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheddar</text>
  <text x="50" y="120" class="subtitle">[ˈtʃedər] n. 切达干酪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自英国切达村，以其出产的干酪命名。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的奶酪块，上面刻着"切达(Cheddar)"
    <tspan x="50" dy="25">的字样，散发着浓郁的奶酪香气，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He sliced the cheddar cheese for the sandwich.
  </text>
  <text x="50" y="310" class="content">
    他为三明治切了切达干酪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cheese block -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cheese text -->
    <text x="150" y="100" class="title" style="font-size: 60px;">Cheddar</text>
    <!-- Cheese aroma -->
    <circle cx="200" cy="150" r="20" class="image" />
    <circle cx="220" cy="170" r="25" class="image" />
    <circle cx="240" cy="190" r="30" class="image" />
  </g>
</svg>