<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">civilized</text>
  <text x="50" y="120" class="subtitle">[ˈsɪvəlaɪzd] adj. 文明的，有教养的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> civ (城市) + -ilize (使成为) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人逐渐"被城市化(civ-ilize)"，
    <tspan x="50" dy="25">学会了礼仪和规则，变成了一个有教养的文明人(civilized)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dinner was a civilized affair, with everyone behaving politely.
  </text>
  <text x="50" y="310" class="content">
    晚餐是一个文明的活动，每个人都表现得很有礼貌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="40" width="50" height="80" class="image" />
    <rect x="190" y="60" width="50" height="60" class="image" />
    <rect x="260" y="80" width="50" height="40" class="image" />
    <!-- Civilized person -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
    <!-- Table with etiquette -->
    <rect x="100" y="120" width="150" height="50" class="image" />
    <line x1="120" y1="140" x2="230" y2="140" class="image" />
    <line x1="120" y1="160" x2="230" y2="160" class="image" />
    <line x1="120" y1="180" x2="230" y2="180" class="image" />
  </g>
</svg>