<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overcrowded</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈkraʊdɪd] adj. 过度拥挤的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (过度) + crowd (人群) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，"过度(over-)"挤满了"人群(crowd)"，
    <tspan x="50" dy="25">每个人都紧紧贴在一起，这就是过度拥挤(overcrowded)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The subway was overcrowded during rush hour.
  </text>
  <text x="50" y="310" class="content">
    地铁在高峰时段非常拥挤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="300" cy="50" r="15" class="image" />
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <circle cx="300" cy="150" r="15" class="image" />
  </g>
</svg>