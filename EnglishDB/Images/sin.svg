<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sin</text>
  <text x="50" y="120" class="subtitle">[sɪn] n. 罪，罪恶；v. 犯罪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sin- (罪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶魔手持叉子，"犯下(sin)"
    <tspan x="50" dy="25">罪行，这个画面让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He committed a sin by lying to his parents.
  </text>
  <text x="50" y="310" class="content">
    他对父母撒谎，犯下了罪行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Devil with trident -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />
    <line x1="50" y1="130" x2="20" y2="100" class="image" />
    <line x1="50" y1="130" x2="80" y2="100" class="image" />
    <!-- Trident -->
    <line x1="50" y1="100" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="30" y2="20" class="image" />
    <line x1="50" y1="50" x2="70" y2="20" class="image" />
  </g>
</svg>