<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cap</text>
  <text x="50" y="120" class="subtitle">[kæp] n. 帽子，盖子；v. 覆盖，胜过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cap (头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的帽子(cap)，"盖在(cap)"
    <tspan x="50" dy="25">一个巨大的头上，这个头大得像一座山！</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a cap to protect his head from the sun.
  </text>
  <text x="50" y="310" class="content">
    他戴了一顶帽子来保护头部免受阳光照射。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large head -->
    <circle cx="150" cy="100" r="80" class="image" />
    <!-- Giant cap -->
    <path d="M 70 50 Q 150 20 230 50 L 230 100 L 70 100 Z" class="image" />
    <!-- Text annotation -->
    <text x="150" y="200" class="content" text-anchor="middle">巨大的头</text>
    <text x="150" y="150" class="content" text-anchor="middle">巨大的帽子</text>
  </g>
</svg>