<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resuscitate</text>
  <text x="50" y="120" class="subtitle">[rɪˈsʌsɪˌteɪt] v. 使复苏，使复活</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sus- (下面) + cit (唤起) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在抢救一个"倒下(sus-)"的病人，
    <tspan x="50" dy="25">"再次唤起(re-cit)"他的生命力，使他复苏(resuscitate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paramedics managed to resuscitate the drowning victim.
  </text>
  <text x="50" y="310" class="content">
    急救人员成功地使溺水的受害者复苏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doctor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Patient -->
    <rect x="100" y="80" width="100" height="50" class="image" />
    <line x1="150" y1="80" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="130" y2="150" class="image" />
    <line x1="150" y1="130" x2="170" y2="150" class="image" />
    <!-- Heart monitor -->
    <rect x="220" y="80" width="100" height="50" class="image" />
    <line x1="240" y1="100" x2="260" y2="100" class="image" />
    <line x1="240" y1="110" x2="260" y2="110" class="image" />
    <line x1="240" y1="120" x2="260" y2="120" class="image" />
    <line x1="240" y1="130" x2="260" y2="130" class="image" />
  </g>
</svg>