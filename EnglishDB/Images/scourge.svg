<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scourge</text>
  <text x="50" y="120" class="subtitle">[skɜːrdʒ] n. 鞭子，灾难；v. 鞭打，折磨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scour (擦) + -ge (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的鞭子，"擦过(scour)"
    <tspan x="50" dy="25">皮肤，带来痛苦和灾难(scourge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plague was a scourge that ravaged Europe.
  </text>
  <text x="50" y="310" class="content">
    瘟疫是蹂躏欧洲的灾难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Whip -->
    <line x1="0" y1="0" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="150" class="image" />
    <!-- Person being whipped -->
    <circle cx="100" cy="200" r="30" class="image" />
    <line x1="100" y1="230" x2="100" y2="300" class="image" />
    <line x1="100" y1="250" x2="50" y2="280" class="image" />
    <line x1="100" y1="250" x2="150" y2="280" class="image" />
    <line x1="100" y1="300" x2="50" y2="350" class="image" />
    <line x1="100" y1="300" x2="150" y2="350" class="image" />
  </g>
</svg>