<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coin</text>
  <text x="50" y="120" class="subtitle">[kɔɪn] n. 硬币，钱币；v. 创造新词</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (一起) + in (进入)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的铸币厂，工匠们"一起(co-)"
    <tspan x="50" dy="25">将金属"进入(in)"模具，创造出新的硬币(coin)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He found a rare coin in the attic.
  </text>
  <text x="50" y="310" class="content">
    他在阁楼里发现了一枚稀有的硬币。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coin -->
    <circle cx="100" cy="100" r="50" class="image" />
    <text x="75" y="110" class="content" fill="#FFD700">COIN</text>
    <!-- Mold -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <text x="160" y="110" class="content" fill="#8B4513">MOLD</text>
    <!-- Craftsman -->
    <circle cx="270" cy="100" r="15" class="image" />
    <line x1="270" y1="115" x2="270" y2="150" class="image" />
    <line x1="270" y1="150" x2="250" y2="180" class="image" />
    <line x1="270" y1="150" x2="290" y2="180" class="image" />
    <line x1="270" y1="130" x2="320" y2="120" class="image" />
  </g>
</svg>