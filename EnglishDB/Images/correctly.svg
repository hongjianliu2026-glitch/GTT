<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">correctly</text>
  <text x="50" y="120" class="subtitle">[kəˈrektli] adv. 正确地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cor- (强调) + rect (直，正确) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个箭头笔直地指向目标，"强调(cor-)"
    <tspan x="50" dy="25">它"直(rect)"指的方向是正确的，这就是"正确地(correctly)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She answered the question correctly.
  </text>
  <text x="50" y="310" class="content">
    她正确地回答了问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Target -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="200" x2="175" y2="100" class="image" />
    <polygon points="50,200 40,190 60,190" class="image" />
    <!-- Text -->
    <text x="150" y="250" class="content" text-anchor="middle">直指目标</text>
  </g>
</svg>