<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gaudy</text>
  <text x="50" y="120" class="subtitle">[ˈɡɔːdi] adj. 俗丽的，华而不实的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gaud (欢乐) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装饰过度的房间，"欢乐(gaud)"
    <tspan x="50" dy="25">的气氛被过度夸张的装饰所掩盖，显得俗丽(gaudy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The party was too gaudy for my taste.
  </text>
  <text x="50" y="310" class="content">
    这个派对对我来说太俗丽了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Over-decorated elements -->
    <circle cx="50" cy="50" r="20" class="image" fill="#FFD700" />
    <circle cx="100" cy="50" r="20" class="image" fill="#FF6347" />
    <circle cx="150" cy="50" r="20" class="image" fill="#40E0D0" />
    <circle cx="200" cy="50" r="20" class="image" fill="#FF69B4" />
    <circle cx="250" cy="50" r="20" class="image" fill="#8A2BE2" />
    <circle cx="300" cy="50" r="20" class="image" fill="#FF4500" />
    <!-- Person -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
  </g>
</svg>