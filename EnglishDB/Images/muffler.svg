<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">muffler</text>
  <text x="50" y="120" class="subtitle">[ˈmʌflər] n. 消音器，围巾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> muff (遮盖) + -ler (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的围巾(muffler)，它不仅能保暖，还能"遮盖(muff)"住你的声音，
    <tspan x="50" dy="25">就像汽车上的消音器一样，让声音变得柔和。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wrapped a muffler around his neck to keep warm.
  </text>
  <text x="50" y="310" class="content">
    他用围巾裹住脖子保暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Muffler -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Head -->
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Muffler around neck -->
    <rect x="150" y="130" width="100" height="40" class="image" />
    <!-- Sound waves -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="70" x2="150" y2="70" class="image" />
    <line x1="100" y1="90" x2="150" y2="90" class="image" />
  </g>
</svg>