<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">borough</text>
  <text x="50" y="120" class="subtitle">[ˈbʌroʊ] n. 自治市镇，行政区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bor- (边界) + -ough (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个自治市镇，"边界(bor-)"
    <tspan x="50" dy="25">清晰地划分出一个"地方(ough)"，</tspan>
    <tspan x="50" dy="25">这就是borough。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The borough council is responsible for local services.
  </text>
  <text x="50" y="310" class="content">
    自治市镇议会负责当地服务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boundary lines -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="0" x2="0" y2="200" class="image" />
    <line x1="350" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <!-- Borough area -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Buildings -->
    <rect x="70" y="40" width="40" height="120" class="image" />
    <rect x="130" y="40" width="40" height="120" class="image" />
    <rect x="190" y="40" width="40" height="120" class="image" />
    <rect x="250" y="40" width="40" height="120" class="image" />
  </g>
</svg>