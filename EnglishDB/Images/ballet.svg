<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ballet</text>
  <text x="50" y="120" class="subtitle">[bæˈleɪ] n. 芭蕾舞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ball (舞) + et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小舞者(ball-et)在舞台上轻盈地跳跃，
    <tspan x="50" dy="25">每一个动作都优雅而精确，这就是芭蕾舞(ballet)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has been practicing ballet since she was five.
  </text>
  <text x="50" y="310" class="content">
    她从五岁起就开始练习芭蕾舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dancer -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="130" x2="220" y2="120" class="image" />
    <!-- Tutu -->
    <path d="M150,180 Q175,200 200,180" class="image" />
    <!-- Ballet shoes -->
    <rect x="165" y="180" width="20" height="10" class="image" />
    <rect x="195" y="180" width="20" height="10" class="image" />
  </g>
</svg>