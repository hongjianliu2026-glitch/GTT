<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extortion</text>
  <text x="50" y="120" class="subtitle">[ɪkˈstɔːrʃn] n. 敲诈，勒索</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + tort (扭曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶棍"向外扭曲(ex-tort)"
    <tspan x="50" dy="25">别人的意愿，强迫他们交出钱财，这就是敲诈(extortion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gang used extortion to get money from local businesses.
  </text>
  <text x="50" y="310" class="content">
    这个团伙通过敲诈勒索从当地企业获取钱财。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thug -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Money bag -->
    <rect x="70" y="90" width="30" height="30" class="image" />
    <line x1="85" y1="90" x2="85" y2="80" class="image" />
    <!-- Victim -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="170" y2="120" class="image" />
    <!-- Force arrow -->
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <polygon points="100,100 95,95 95,105" class="image" />
  </g>
</svg>