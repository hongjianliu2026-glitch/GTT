<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">test</text>
  <text x="50" y="120" class="subtitle">[test] n. 测试，试验；v. 测试，试验</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> test (证明，证据)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"通过试验(test)"
    <tspan x="50" dy="25">来证明一个理论，这个试验就是测试(test)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher gave us a test on Friday.
  </text>
  <text x="50" y="310" class="content">
    老师在周五给我们进行了一次测试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Laboratory table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Beaker -->
    <ellipse cx="100" cy="100" rx="50" ry="70" class="image" />
    <!-- Scientist -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Test tube -->
    <rect x="280" y="50" width="20" height="100" class="image" />
    <ellipse cx="290" cy="150" rx="10" ry="20" class="image" />
  </g>
</svg>