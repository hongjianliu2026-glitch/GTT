<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fab</text>
  <text x="50" y="120" class="subtitle">[fæb] n. 工厂，制造厂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fab (源自拉丁语 "fabrica"，意为“制造”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工厂，里面充满了各种机器和工人，
    <tspan x="50" dy="25">他们正在忙碌地制造各种产品，这就是一个“fab”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new fab will produce smartphones.
  </text>
  <text x="50" y="310" class="content">
    新的工厂将生产智能手机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="-50" width="50" height="50" class="image" />
    <!-- Smoke -->
    <circle cx="175" cy="-60" r="10" class="image" />
    <circle cx="175" cy="-75" r="15" class="image" />
    <circle cx="175" cy="-90" r="20" class="image" />
    <!-- Factory doors -->
    <rect x="50" y="150" width="100" height="50" class="image" />
    <rect x="200" y="150" width="100" height="50" class="image" />
    <!-- Worker -->
    <circle cx="100" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
  </g>
</svg>