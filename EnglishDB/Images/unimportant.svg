<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unimportant</text>
  <text x="50" y="120" class="subtitle">[ˌʌnɪmˈpɔːrtnt] adj. 不重要的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + important (重要的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被忽视的小物件，"不(un-)"
    <tspan x="50" dy="25">被认为是"重要的(important)"，</tspan>
    <tspan x="50" dy="25">它静静地躺在角落，无人问津。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't waste your time on unimportant details.
  </text>
  <text x="50" y="310" class="content">
    不要在不重要的细节上浪费时间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small object -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Arrow pointing away -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
    <!-- Text label -->
    <text x="210" y="105" class="content">Ignored</text>
  </g>
</svg>