<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Koran</text>
  <text x="50" y="120" class="subtitle">[kɔˈrɑːn] n. 古兰经</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Koran (源自阿拉伯语，意为“诵读”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位虔诚的穆斯林在诵读《古兰经》，
    <tspan x="50" dy="25">书页翻动，神圣的文字在空中回荡，</tspan>
    <tspan x="50" dy="25">仿佛整个世界都在聆听这神圣的诵读。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Koran is the holy book of Islam.
  </text>
  <text x="50" y="310" class="content">
    《古兰经》是伊斯兰教的圣书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="140" x2="180" y2="140" class="image" />
    <line x1="20" y1="180" x2="180" y2="180" class="image" />
    <line x1="20" y1="220" x2="180" y2="220" class="image" />
    <line x1="20" y1="260" x2="180" y2="260" class="image" />
    <!-- Person reading -->
    <circle cx="250" cy="150" r="30" class="image" />
    <line x1="250" y1="180" x2="250" y2="250" class="image" />
    <line x1="250" y1="250" x2="220" y2="300" class="image" />
    <line x1="250" y1="250" x2="280" y2="300" class="image" />
    <line x1="250" y1="200" x2="200" y2="180" class="image" />
    <line x1="250" y1="200" x2="300" y2="180" class="image" />
  </g>
</svg>