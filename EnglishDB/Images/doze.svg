<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">doze</text>
  <text x="50" y="120" class="subtitle">[doʊz] v. 打瞌睡，打盹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> doz (来自古英语 dōs, 意为“打瞌睡”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在午后的阳光下，"打瞌睡(doze)"
    <tspan x="50" dy="25">在舒适的沙发上，眼皮渐渐沉重，进入了梦乡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He dozed off during the long lecture.
  </text>
  <text x="50" y="310" class="content">
    他在冗长的讲座中打起了瞌睡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" class="image" fill="#F1C40F" />
    <!-- Couch -->
    <rect x="100" y="100" width="200" height="50" class="image" fill="#D35400" />
    <rect x="100" y="150" width="200" height="50" class="image" fill="#D35400" />
    <!-- Person -->
    <circle cx="200" cy="125" r="20" class="image" fill="#2C3E50" />
    <line x1="200" y1="145" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="160" x2="230" y2="150" class="image" />
  </g>
</svg>