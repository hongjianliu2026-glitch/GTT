<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snowstorm</text>
  <text x="50" y="120" class="subtitle">[ˈsnoʊstɔrm] n. 暴风雪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snow (雪) + storm (风暴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场"雪(snow)"和"风暴(storm)"的结合，
    <tspan x="50" dy="25">雪花像子弹一样密集地飞舞，整个世界都被白茫茫的雪覆盖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snowstorm caused the airport to close for several hours.
  </text>
  <text x="50" y="310" class="content">
    暴风雪导致机场关闭了几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowflakes -->
    <line x1="50" y1="20" x2="100" y2="70" class="image" />
    <line x1="100" y1="20" x2="50" y2="70" class="image" />
    <line x1="75" y1="45" x2="75" y2="95" class="image" />
    <line x1="50" y1="120" x2="100" y2="170" class="image" />
    <line x1="100" y1="120" x2="50" y2="170" class="image" />
    <line x1="75" y1="145" x2="75" y2="195" class="image" />
    <line x1="50" y1="220" x2="100" y2="270" class="image" />
    <line x1="100" y1="220" x2="50" y2="270" class="image" />
    <line x1="75" y1="245" x2="75" y2="295" class="image" />
    <!-- Wind -->
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="150" y1="150" x2="200" y2="200" class="image" />
    <line x1="150" y1="250" x2="200" y2="300" class="image" />
    <!-- Ground -->
    <rect x="0" y="300" width="350" height="20" class="image" />
  </g>
</svg>