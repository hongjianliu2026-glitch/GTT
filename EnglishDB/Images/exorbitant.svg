<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exorbitant</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzɔːrbɪtənt] adj. 过高的，过度的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + orbit (轨道) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个价格标签"飞出(ex-)"了正常的"轨道(orbit)"，
    <tspan x="50" dy="25">变得"过高(exorbitant)"，让人难以接受。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hotel charged an exorbitant price for a single night.
  </text>
  <text x="50" y="310" class="content">
    这家酒店对一晚的住宿收取了过高的价格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Price tag -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <text x="20" y="60" class="content">$1000</text>
    <!-- Arrow -->
    <line x1="200" y1="50" x2="300" y2="50" class="image" />
    <polygon points="300,50 290,45 290,55" class="image" />
    <!-- Orbit -->
    <ellipse cx="400" cy="50" rx="100" ry="50" class="image" />
    <!-- Exorbitant price -->
    <text x="320" y="60" class="content">$10000</text>
  </g>
</svg>