<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tractor</text>
  <text x="50" y="120" class="subtitle">[ˈtræktər] n. 拖拉机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tract (拉) + -or (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拖拉机在田野上"拉(tract)"着沉重的货物，
    <tspan x="50" dy="25">它的力量和效率让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer used a tractor to plow the field.
  </text>
  <text x="50" y="310" class="content">
    农民用拖拉机犁地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tractor body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Tractor wheels -->
    <circle cx="50" cy="140" r="30" class="image" />
    <circle cx="250" cy="140" r="30" class="image" />
    <!-- Tractor cabin -->
    <rect x="100" y="20" width="150" height="80" class="image" />
    <!-- Tractor front -->
    <rect x="150" y="0" width="50" height="20" class="image" />
  </g>
</svg>