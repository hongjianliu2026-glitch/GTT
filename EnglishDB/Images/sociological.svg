<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sociological</text>
  <text x="50" y="120" class="subtitle">[ˌsoʊsiəˈlɑdʒɪkl] adj. 社会学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soci- (社会) + -ology (学科) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群学者在研究社会现象，他们用"社会(soci-)"
    <tspan x="50" dy="25">的视角来分析问题，这就是社会学(sociological)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sociological impact of social media is profound.
  </text>
  <text x="50" y="310" class="content">
    社交媒体的社会学影响是深远的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <!-- Discussion -->
    <line x1="50" y1="70" x2="200" y2="70" class="image" />
    <line x1="50" y1="90" x2="200" y2="90" class="image" />
    <line x1="50" y1="110" x2="200" y2="110" class="image" />
    <!-- Books -->
    <rect x="50" y="130" width="30" height="40" class="image" />
    <rect x="90" y="130" width="30" height="40" class="image" />
    <rect x="130" y="130" width="30" height="40" class="image" />
    <rect x="170" y="130" width="30" height="40" class="image" />
  </g>
</svg>