<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bogey</text>
  <text x="50" y="120" class="subtitle">[ˈboʊɡi] n. 鬼怪，障碍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bog (沼泽) + -ey (表示“小”或“类似”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幽灵般的生物从"沼泽(bog)"中冒出来，
    <tspan x="50" dy="25">它就像一个小鬼怪(bogey)，吓得人们四处逃窜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bogey in the closet scared the child.
  </text>
  <text x="50" y="310" class="content">
    衣柜里的鬼怪吓坏了孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Swamp -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="120" r="30" class="image" />
    <circle cx="200" cy="140" r="40" class="image" />
    <!-- Bogey -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>