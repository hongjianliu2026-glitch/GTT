<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humbling</text>
  <text x="50" y="120" class="subtitle">[ˈhʌmbəlɪŋ] adj. 令人谦卑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> humbl (谦卑) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骄傲的人被"压低(humbl-ing)"到地面上，
    <tspan x="50" dy="25">他的骄傲被粉碎，只剩下谦卑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The experience was humbling for the once-arrogant CEO.
  </text>
  <text x="50" y="310" class="content">
    这次经历让曾经傲慢的CEO感到谦卑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="200" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
    <line x1="100" y1="170" x2="80" y2="160" class="image" />
    <line x1="100" y1="170" x2="120" y2="160" class="image" />
    <!-- Arrow pointing down -->
    <line x1="150" y1="100" x2="150" y2="180" class="image" />
    <polygon points="145,105 155,105 150,115" class="image" />
    <!-- Broken crown -->
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
    <line x1="200" y1="120" x2="220" y2="100" class="image" />
  </g>
</svg>