<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Scot</text>
  <text x="50" y="120" class="subtitle">[skɒt] n. 苏格兰人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Scot (源自苏格兰的名称)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着苏格兰传统服装的苏格兰人，
    <tspan x="50" dy="25">戴着格子呢帽，吹着风笛，在高地草原上行走。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Scot played the bagpipes at the festival.
  </text>
  <text x="50" y="310" class="content">
    这位苏格兰人在节日上吹奏风笛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Highlander -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="80" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="80" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Kilt -->
    <rect x="30" y="120" width="40" height="40" class="image" />
    <!-- Bagpipes -->
    <rect x="80" y="50" width="30" height="70" class="image" />
    <line x1="95" y1="50" x2="95" y2="30" class="image" />
    <line x1="95" y1="30" x2="110" y2="40" class="image" />
    <line x1="95" y1="30" x2="80" y2="40" class="image" />
  </g>
</svg>