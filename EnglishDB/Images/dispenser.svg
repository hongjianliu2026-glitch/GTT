<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dispenser</text>
  <text x="50" y="120" class="subtitle">[dɪˈspensər] n. 分配器，自动售货机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + pens (称量) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的自动售货机，"分开称量(dis-pens)"
    <tspan x="50" dy="25">并分配(dis-pens-er)各种零食和饮料。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dispenser in the office provides free coffee.
  </text>
  <text x="50" y="310" class="content">
    办公室里的分配器提供免费咖啡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vending machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Screen -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Buttons -->
    <circle cx="80" cy="100" r="10" class="image" />
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Dispensing area -->
    <rect x="100" y="150" width="150" height="30" class="image" />
    <!-- Items -->
    <circle cx="120" cy="165" r="5" class="image" />
    <circle cx="140" cy="165" r="5" class="image" />
    <circle cx="160" cy="165" r="5" class="image" />
  </g>
</svg>