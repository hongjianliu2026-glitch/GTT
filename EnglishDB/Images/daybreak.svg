<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">daybreak</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪbreɪk] n. 黎明，破晓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> day (天) + break (打破)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳"打破(break)"了黑夜的束缚，
    <tspan x="50" dy="25">天空中逐渐亮起，这就是黎明(daybreak)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We started our hike at daybreak.
  </text>
  <text x="50" y="310" class="content">
    我们在黎明时分开始了徒步旅行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="150" cy="150" r="50" fill="#F39C12" />
    <!-- Sky -->
    <rect x="0" y="0" width="300" height="300" fill="#3498DB" />
    <!-- Ground -->
    <rect x="0" y="250" width="300" height="50" fill="#2ECC71" />
    <!-- Sun rays -->
    <line x1="150" y1="100" x2="150" y2="0" class="image" />
    <line x1="200" y1="150" x2="300" y2="150" class="image" />
    <line x1="150" y1="200" x2="150" y2="300" class="image" />
    <line x1="100" y1="150" x2="0" y2="150" class="image" />
  </g>
</svg>