<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">string</text>
  <text x="50" y="120" class="subtitle">[strɪŋ] n. 绳子，弦；v. 串起，拉紧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> string (源自拉丁语 stringere，意为“拉紧”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根绳子被拉得紧紧的，就像一根弦(string)，
    <tspan x="50" dy="25">它可以把东西串起来，也可以用来拉紧某个东西。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a string to tie up the package.
  </text>
  <text x="50" y="310" class="content">
    她用一根绳子把包裹捆起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rope -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="70" x2="300" y2="70" class="image" />
    <line x1="50" y1="90" x2="300" y2="90" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="130" x2="300" y2="130" class="image" />
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <!-- Knot -->
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Tightening -->
    <line x1="300" y1="50" x2="350" y2="0" class="image" />
    <line x1="300" y1="150" x2="350" y2="200" class="image" />
  </g>
</svg>