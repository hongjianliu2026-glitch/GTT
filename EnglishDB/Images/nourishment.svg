<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nourishment</text>
  <text x="50" y="120" class="subtitle">[ˈnʊrɪʃmənt] n. 营养，滋养</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nour (滋养) + -ish (动词后缀) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的碗，里面装满了各种食物，"滋养(nour)"
    <tspan x="50" dy="25">着你的身体，让你充满活力。这就是营养(nourishment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A balanced diet provides essential nourishment for the body.
  </text>
  <text x="50" y="310" class="content">
    均衡的饮食为身体提供必要的营养。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Food items -->
    <circle cx="100" cy="80" r="20" class="image" /> <!-- Apple -->
    <rect x="200" y="60" width="30" height="40" class="image" /> <!-- Carrot -->
    <circle cx="250" cy="80" r="20" class="image" /> <!-- Orange -->
    <rect x="150" y="60" width="30" height="40" class="image" /> <!-- Broccoli -->
    <!-- Spoon -->
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="120" x2="70" y2="140" class="image" />
    <line x1="150" y1="120" x2="130" y2="140" class="image" />
  </g>
</svg>