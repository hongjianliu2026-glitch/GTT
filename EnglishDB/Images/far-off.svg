<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">far-off</text>
  <text x="50" y="120" class="subtitle">[ˈfɑːr ɒf] adj. 遥远的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> far (远) + off (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地球的一端，遥望着"远处的(far-off)"
    <tspan x="50" dy="25">地平线，那里仿佛是另一个世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The far-off mountains were barely visible through the mist.
  </text>
  <text x="50" y="310" class="content">
    远处的山脉在雾中几乎看不见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Horizon line -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Far-off mountains -->
    <polyline points="250,180 270,140 290,180" class="image" />
    <polyline points="270,180 290,140 310,180" class="image" />
    <polyline points="290,180 310,140 330,180" class="image" />
  </g>
</svg>