<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">convulsion</text>
  <text x="50" y="120" class="subtitle">[kənˈvʌlʃən] n. 痉挛，抽搐；剧烈震动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + vul (摇动) + -sion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然全身"一起摇动(con-vul-sion)"，
    <tspan x="50" dy="25">就像被电击一样，这就是痉挛(convulsion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The patient had a convulsion during the seizure.
  </text>
  <text x="50" y="310" class="content">
    病人在发作期间出现了痉挛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="180" class="image" />
    <line x1="50" y1="160" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Convulsion lines -->
    <line x1="50" y1="100" x2="20" y2="150" class="image" />
    <line x1="50" y1="100" x2="80" y2="150" class="image" />
    <line x1="50" y1="130" x2="20" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="180" class="image" />
  </g>
</svg>