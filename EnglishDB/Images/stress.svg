<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stress</text>
  <text x="50" y="120" class="subtitle">[stres] n. 压力，强调；v. 强调，重读</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + ress (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"拉扯(ress)"得"站立(st-)"不稳，
    <tspan x="50" dy="25">这种拉扯的感觉就是压力(stress)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heavy workload caused him a lot of stress.
  </text>
  <text x="50" y="310" class="content">
    繁重的工作量给他带来了很大的压力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being pulled -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Pulling forces -->
    <line x1="50" y1="100" x2="0" y2="50" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="50" y1="100" x2="50" y2="0" class="image" />
  </g>
</svg>