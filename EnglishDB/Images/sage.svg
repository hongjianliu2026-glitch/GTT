<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sage</text>
  <text x="50" y="120" class="subtitle">[seɪdʒ] n. 智者，圣人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sag (切，割) + -e (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个智者(sage)手持一把锋利的刀(sag)，
    <tspan x="50" dy="25">他能够"切开(sag)"复杂的谜题，揭示真理。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sage's wisdom guided the village through difficult times.
  </text>
  <text x="50" y="310" class="content">
    智者的智慧引导村庄度过了艰难时期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sage -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Knife -->
    <line x1="70" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="85" y2="80" class="image" />
    <line x1="100" y1="100" x2="85" y2="120" class="image" />
    <!-- Puzzle -->
    <rect x="120" y="80" width="100" height="40" class="image" />
    <line x1="130" y1="90" x2="210" y2="90" class="image" />
    <line x1="130" y1="110" x2="210" y2="110" class="image" />
    <line x1="140" y1="80" x2="140" y2="120" class="image" />
    <line x1="180" y1="80" x2="180" y2="120" class="image" />
  </g>
</svg>