<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discard</text>
  <text x="50" y="120" class="subtitle">[dɪˈskɑːrd] v. 丢弃，抛弃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (离开) + card (纸牌)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你在玩纸牌游戏，"离开(dis-)"
    <tspan x="50" dy="25">一张牌(card)，把它丢弃(discard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He discarded the old newspaper.
  </text>
  <text x="50" y="310" class="content">
    他把旧报纸丢弃了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Card -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Crossed out card -->
    <line x1="10" y1="10" x2="140" y2="190" class="image" />
    <line x1="10" y1="190" x2="140" y2="10" class="image" />
    <!-- Hand -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
  </g>
</svg>