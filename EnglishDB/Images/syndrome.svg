<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">syndrome</text>
  <text x="50" y="120" class="subtitle">[ˈsɪndroʊm] n. 综合症，症状群</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syn- (一起) + drome (跑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群症状"一起跑(syn-drome)"出来，
    <tspan x="50" dy="25">形成了一个综合症(syndrome)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor diagnosed him with a rare syndrome.
  </text>
  <text x="50" y="310" class="content">
    医生诊断他患有一种罕见的综合症。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Symptoms running together -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="200" y2="70" class="image" />
    <line x1="50" y1="90" x2="200" y2="90" class="image" />
    <line x1="50" y1="110" x2="200" y2="110" class="image" />
    <line x1="50" y1="130" x2="200" y2="130" class="image" />
    <text x="100" y="170" class="content">症状一起跑</text>
  </g>
</svg>