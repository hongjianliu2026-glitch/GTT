<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">languid</text>
  <text x="50" y="120" class="subtitle">[ˈlæŋɡwɪd] adj. 无精打采的，倦怠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lang (懒惰) + uid (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在沙滩上，"懒惰(lang)"得连手指都不想动，
    <tspan x="50" dy="25">整个人都"无精打采(languid)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hot weather made her feel languid.
  </text>
  <text x="50" y="310" class="content">
    炎热的天气让她感到无精打采。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Sand -->
    <rect x="0" y="200" width="350" height="100" fill="#D4AC0D" />
    <!-- Person -->
    <circle cx="175" cy="150" r="20" fill="#E74C3C" />
    <line x1="175" y1="170" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="150" y2="300" class="image" />
    <line x1="175" y1="250" x2="200" y2="300" class="image" />
    <line x1="175" y1="200" x2="125" y2="220" class="image" />
    <line x1="175" y1="200" x2="225" y2="220" class="image" />
  </g>
</svg>