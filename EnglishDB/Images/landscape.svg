<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">landscape</text>
  <text x="50" y="120" class="subtitle">[ˈlændskeɪp] n. 风景，地形</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> land (土地) + scape (形状)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的"土地(land)"上，
    <tspan x="50" dy="25">"形状(scape)"各异的山丘、河流和森林，</tspan>
    <tspan x="50" dy="25">构成了一幅壮丽的风景(landscape)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The landscape of the countryside is breathtaking.
  </text>
  <text x="50" y="310" class="content">
    乡村的风景令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ground -->
    <rect x="0" y="150" width="400" height="50" class="image" />
    <!-- Hills -->
    <path d="M50 150 Q100 50 150 150" class="image" />
    <path d="M150 150 Q200 100 250 150" class="image" />
    <path d="M250 150 Q300 50 350 150" class="image" />
    <!-- River -->
    <line x1="0" y1="175" x2="400" y2="175" class="image" />
    <!-- Trees -->
    <rect x="50" y="120" width="20" height="30" class="image" />
    <rect x="100" y="110" width="20" height="40" class="image" />
    <rect x="150" y="130" width="20" height="20" class="image" />
    <rect x="200" y="100" width="20" height="50" class="image" />
    <rect x="250" y="120" width="20" height="30" class="image" />
    <rect x="300" y="110" width="20" height="40" class="image" />
    <rect x="350" y="130" width="20" height="20" class="image" />
  </g>
</svg>