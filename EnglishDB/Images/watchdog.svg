<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">watchdog</text>
  <text x="50" y="120" class="subtitle">[ˈwɒtʃdɒɡ] n. 看门狗，监视器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> watch (看) + dog (狗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只忠诚的狗，它时刻"看守(watch)"着大门，
    <tspan x="50" dy="25">就像一个监视器(watchdog)一样，保护着主人的安全。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The watchdog software monitors the network for any suspicious activity.
  </text>
  <text x="50" y="310" class="content">
    看门狗软件监控网络中的任何可疑活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Leg 1 -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Leg 2 -->
    <line x1="50" y1="140" x2="20" y2="160" class="image" /> <!-- Ear 1 -->
    <line x1="50" y1="140" x2="80" y2="160" class="image" /> <!-- Ear 2 -->
    <!-- Watch -->
    <rect x="120" y="80" width="60" height="60" class="image" />
    <circle cx="150" cy="110" r="20" class="image" />
    <line x1="150" y1="110" x2="150" y2="90" class="image" /> <!-- Hour hand -->
    <line x1="150" y1="110" x2="165" y2="110" class="image" /> <!-- Minute hand -->
  </g>
</svg>