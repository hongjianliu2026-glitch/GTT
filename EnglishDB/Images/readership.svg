<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">readership</text>
  <text x="50" y="120" class="subtitle">[ˈriːdəʃɪp] n. 读者群，读者人数</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> read (读) + -er (人) + -ship (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一个大书架前，每个人都在"读(read)"书，
    <tspan x="50" dy="25">这些人的集合就构成了一个读者群(readership)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The author's new book attracted a large readership.
  </text>
  <text x="50" y="310" class="content">
    这位作者的新书吸引了大量的读者群。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bookshelf -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- Readers -->
    <circle cx="70" cy="100" r="15" class="image" />
    <circle cx="140" cy="100" r="15" class="image" />
    <circle cx="210" cy="100" r="15" class="image" />
    <circle cx="280" cy="100" r="15" class="image" />
    <!-- Reading -->
    <line x1="70" y1="115" x2="70" y2="150" class="image" />
    <line x1="140" y1="115" x2="140" y2="150" class="image" />
    <line x1="210" y1="115" x2="210" y2="150" class="image" />
    <line x1="280" y1="115" x2="280" y2="150" class="image" />
  </g>
</svg>