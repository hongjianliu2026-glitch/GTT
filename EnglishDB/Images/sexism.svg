<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sexism</text>
  <text x="50" y="120" class="subtitle">[ˈsɛksɪzəm] n. 性别歧视</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sex (性别) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个性别歧视者，他/她"基于性别(sex)"
    <tspan x="50" dy="25">对他人进行不公平的对待，这就是性别歧视(sexism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company was criticized for its sexism in hiring practices.
  </text>
  <text x="50" y="310" class="content">
    该公司因招聘中的性别歧视而受到批评。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Male and Female symbols -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="100" x2="20" y2="80" class="image" />
    <line x1="50" y1="100" x2="80" y2="80" class="image" />
    <line x1="50" y1="120" x2="20" y2="140" class="image" />
    <line x1="50" y1="120" x2="80" y2="140" class="image" />

    <circle cx="200" cy="50" r="30" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <line x1="200" y1="100" x2="170" y2="80" class="image" />
    <line x1="200" y1="100" x2="230" y2="80" class="image" />
    <line x1="200" y1="120" x2="170" y2="140" class="image" />
    <line x1="200" y1="120" x2="230" y2="140" class="image" />

    <!-- Unequal scales -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="230" class="image" />
    <line x1="100" y1="250" x2="120" y2="230" class="image" />

    <line x1="250" y1="150" x2="250" y2="300" class="image" />
    <line x1="250" y1="300" x2="230" y2="280" class="image" />
    <line x1="250" y1="300" x2="270" y2="280" class="image" />

    <!-- Unequal sign -->
    <line x1="150" y1="200" x2="200" y2="200" class="image" />
    <line x1="175" y1="180" x2="175" y2="220" class="image" />
  </g>
</svg>