<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">machine</text>
  <text x="50" y="120" class="subtitle">[məˈʃiːn] n. 机器，机械</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> machin (机械)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台巨大的机器(machine)，它由无数的齿轮和杠杆组成，
    <tspan x="50" dy="25">每一个部件都在精确地运转，就像一台精密的机械(machin)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory is equipped with advanced machines.
  </text>
  <text x="50" y="310" class="content">
    这家工厂配备了先进的机器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Machine body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gears -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Levers -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <!-- Machine base -->
    <rect x="0" y="180" width="350" height="20" class="image" />
  </g>
</svg>