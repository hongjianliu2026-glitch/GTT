<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">habitable</text>
  <text x="50" y="120" class="subtitle">[ˈhæbɪtəbl] adj. 适合居住的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> habit (居住) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个外星人来到地球，发现地球"能够居住(habit-able)"，
    <tspan x="50" dy="25">于是决定在这里安家。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The planet Mars is not yet habitable for humans.
  </text>
  <text x="50" y="310" class="content">
    火星目前还不适合人类居住。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <line x1="100" y1="20" x2="100" y2="0" class="image" />
    <line x1="20" y1="20" x2="100" y2="0" class="image" />
    <line x1="180" y1="20" x2="100" y2="0" class="image" />
    <!-- Alien -->
    <circle cx="100" cy="180" r="20" class="image" />
    <line x1="100" y1="200" x2="100" y2="240" class="image" />
    <line x1="100" y1="240" x2="80" y2="280" class="image" />
    <line x1="100" y1="240" x2="120" y2="280" class="image" />
    <line x1="100" y1="220" x2="140" y2="210" class="image" />
  </g>
</svg>