<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">combat</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmbæt] n. 战斗，格斗；v. 与...战斗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + bat (打)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在激烈的"一起打(com-bat)"，
    <tspan x="50" dy="25">他们挥舞着拳头，这就是战斗(combat)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers were trained to combat the enemy.
  </text>
  <text x="50" y="310" class="content">
    士兵们被训练来与敌人战斗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two fighters -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Arms and fists -->
    <line x1="50" y1="120" x2="20" y2="150" class="image" />
    <line x1="50" y1="120" x2="80" y2="150" class="image" />
    <line x1="150" y1="120" x2="120" y2="150" class="image" />
    <line x1="150" y1="120" x2="180" y2="150" class="image" />
    <!-- Ground -->
    <line x1="0" y1="180" x2="200" y2="180" class="image" />
  </g>
</svg>