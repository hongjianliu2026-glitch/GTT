<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disfigure</text>
  <text x="50" y="120" class="subtitle">[dɪsˈfɪɡər] v. 毁容，破坏外貌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (否定) + figure (形状)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人原本完美的脸庞，突然被"否定(dis-)"了"形状(figure)"，
    <tspan x="50" dy="25">变得面目全非，这就是毁容(disfigure)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident disfigured his face permanently.
  </text>
  <text x="50" y="310" class="content">
    那次事故永久地毁了他的容貌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Original face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <path d="M80 120 Q100 140 120 120" class="image" />

    <!-- Disfigured face -->
    <circle cx="250" cy="100" r="50" class="image" />
    <line x1="230" y1="80" x2="270" y2="80" class="image" />
    <line x1="230" y1="120" x2="270" y2="120" class="image" />
    <line x1="230" y1="100" x2="270" y2="100" class="image" />

    <!-- Arrow -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,85 215,100 200,115" class="image" />
  </g>
</svg>