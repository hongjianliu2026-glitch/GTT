<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">experienced</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspɪriənst] adj. 有经验的，经验丰富的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + peri (尝试) + ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人经历了无数次"尝试(peri)"，最终"脱颖而出(ex-)"，
    <tspan x="50" dy="25">成为了一个经验丰富的(experienced)专家。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is an experienced teacher with over 20 years of teaching.
  </text>
  <text x="50" y="310" class="content">
    她是一位有20多年教学经验的资深教师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />

    <!-- Experience lines -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="120" x2="200" y2="120" class="image" />
    <line x1="100" y1="140" x2="200" y2="140" class="image" />
    <line x1="100" y1="160" x2="200" y2="160" class="image" />
    <line x1="100" y1="180" x2="200" y2="180" class="image" />

    <!-- Star for experience -->
    <polygon points="250,100 265,135 300,140 275,165 280,200 250,185 220,200 225,165 200,140 235,135" class="image" />
  </g>
</svg>