<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">expressly</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspresli] adv. 明确地，特意地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + press (压) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在讲台上，"向外压(ex-press)"
    <tspan x="50" dy="25">出自己的观点，明确地表达(expressly)自己的想法。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She expressly stated her opinion during the meeting.
  </text>
  <text x="50" y="310" class="content">
    她在会议上明确地表达了自己的观点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on stage -->
    <circle cx="175" cy="80" r="20" class="image" />
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="120" x2="220" y2="110" class="image" />
    <!-- Speech bubble -->
    <path d="M220,70 Q250,60 280,70 Q250,80 220,70" class="image" />
    <text x="230" y="75" class="content">观点</text>
  </g>
</svg>