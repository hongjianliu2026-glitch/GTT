<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sear</text>
  <text x="50" y="120" class="subtitle">[sɪr] v. 烧焦，烤焦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sear (来自古英语 searu, 意为“烧焦”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块肉在火上被“烧焦(sear)”，表面变得焦黑，
    <tspan x="50" dy="25">散发出诱人的香气，这就是“sear”的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef seared the steak to perfection.
  </text>
  <text x="50" y="310" class="content">
    厨师将牛排烤得恰到好处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grill -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Meat -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#8B4513" />
    <!-- Burn marks -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" stroke="#000000" stroke-width="5" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" stroke="#000000" stroke-width="5" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" stroke="#000000" stroke-width="5" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" stroke="#000000" stroke-width="5" />
    <!-- Smoke -->
    <circle cx="150" cy="10" r="10" class="image" fill="#808080" />
    <circle cx="170" cy="5" r="15" class="image" fill="#808080" />
    <circle cx="190" cy="0" r="20" class="image" fill="#808080" />
  </g>
</svg>