<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">war</text>
  <text x="50" y="120" class="subtitle">[wɔːr] n. 战争</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> war (源自原始日耳曼语 *werran，意为“混乱”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场战争中，"混乱(war)"
    <tspan x="50" dy="25">的场面，士兵们激烈交战，硝烟弥漫。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two countries have been at war for years.
  </text>
  <text x="50" y="310" class="content">
    这两个国家已经打了多年的仗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soldiers -->
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <!-- Smoke -->
    <circle cx="250" cy="75" r="20" class="image" />
    <circle cx="270" cy="75" r="25" class="image" />
    <circle cx="290" cy="75" r="30" class="image" />
  </g>
</svg>