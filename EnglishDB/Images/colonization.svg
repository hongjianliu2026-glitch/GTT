<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">colonization</text>
  <text x="50" y="120" class="subtitle">[ˌkɒlənaɪˈzeɪʃn] n. 殖民化，殖民地化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> colo- (耕种) + -nization (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群殖民者带着工具，"耕种(colo-)"
    <tspan x="50" dy="25">一片新土地，将其变为自己的殖民地(colonization)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The colonization of America began in the 16th century.
  </text>
  <text x="50" y="310" class="content">
    美洲的殖民化始于16世纪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Colonists -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Tools -->
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <!-- Land being cultivated -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="130" x2="250" y2="130" class="image" />
    <line x1="200" y1="160" x2="250" y2="160" class="image" />
  </g>
</svg>