<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">butt</text>
  <text x="50" y="120" class="subtitle">[bʌt] n. 屁股，烟蒂；v. 碰撞，顶撞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> but (来自古英语，原意为“末端”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"顶撞(butt)"
    <tspan x="50" dy="25">自己的屁股(butt)，结果镜子碎了，烟蒂(butt)散落一地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He accidentally butted his head against the wall.
  </text>
  <text x="50" y="310" class="content">
    他不小心把头撞到了墙上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <!-- Butt -->
    <circle cx="50" cy="180" r="20" class="image" />
    <!-- Mirror -->
    <rect x="100" y="50" width="100" height="150" class="image" />
    <!-- Broken mirror -->
    <line x1="110" y1="60" x2="190" y2="140" class="image" />
    <line x1="110" y1="140" x2="190" y2="60" class="image" />
    <!-- Cigarette butt -->
    <rect x="220" y="100" width="20" height="50" class="image" />
    <circle cx="230" cy="150" r="5" class="image" />
  </g>
</svg>