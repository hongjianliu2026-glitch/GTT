<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9F9F9; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #7F8C8D; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neutral</text>
  <text x="50" y="120" class="subtitle">[ˈnjuːtrəl] adj. 中立的，中性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neuter (中性的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个站在两个对立阵营中间的人，"保持中立(neutral)"，
    <tspan x="50" dy="25">既不偏向任何一方，就像一个中性的(neuter)立场。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The country remained neutral during the war.
  </text>
  <text x="50" y="310" class="content">
    这个国家在战争期间保持中立。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person in the middle -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="160" y2="160" class="image" />
    <line x1="200" y1="140" x2="240" y2="160" class="image" />

    <!-- Left side -->
    <rect x="50" y="50" width="100" height="100" class="image" />
    <text x="70" y="100" class="content">A</text>

    <!-- Right side -->
    <rect x="350" y="50" width="100" height="100" class="image" />
    <text x="370" y="100" class="content">B</text>
  </g>
</svg>