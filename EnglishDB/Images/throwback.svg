<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">throwback</text>
  <text x="50" y="120" class="subtitle">[ˈθroʊbæk] n. 回忆，怀旧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> throw (投掷) + back (回)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在看老照片，突然被一张照片"投掷回(throw-back)"
    <tspan x="50" dy="25">到了过去的时光，这就是throwback的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old movie was a throwback to the 1980s.
  </text>
  <text x="50" y="310" class="content">
    这部电影让人回忆起80年代。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old photo -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="110" x2="180" y2="110" class="image" />
    <!-- Person -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="230" y2="160" class="image" />
    <line x1="250" y1="130" x2="270" y2="160" class="image" />
    <line x1="250" y1="110" x2="280" y2="100" class="image" />
    <!-- Arrow -->
    <line x1="200" y1="75" x2="230" y2="75" class="image" />
    <polygon points="230,65 240,75 230,85" class="image" />
  </g>
</svg>