<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fewer</text>
  <text x="50" y="120" class="subtitle">[ˈfjuːər] adj. 较少的，更少的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> few (少) + -er (比较级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，原本有很多苹果，但突然间"更少(fewer)"了，
    <tspan x="50" dy="25">只剩下几个苹果在桌子上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are fewer apples on the table today.
  </text>
  <text x="50" y="310" class="content">
    今天桌子上的苹果少了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fewer apples -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- More apples (faded) -->
    <circle cx="250" cy="100" r="20" class="image" fill="none" stroke-opacity="0.3" />
    <circle cx="300" cy="100" r="20" class="image" fill="none" stroke-opacity="0.3" />
    <circle cx="350" cy="100" r="20" class="image" fill="none" stroke-opacity="0.3" />
  </g>
</svg>