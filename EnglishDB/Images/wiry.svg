<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wiry</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪəri] adj. 细长的，瘦而结实的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wi- (来自古英语 "wīr"，意为"线") + -ry (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根细长的电线(wi-)，它虽然细小，但却非常坚韧(wiry)，
    <tspan x="50" dy="25">就像一个瘦而结实的人，虽然看起来瘦弱，但却充满力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He has a wiry frame, but he's surprisingly strong.
  </text>
  <text x="50" y="310" class="content">
    他身材瘦削，但出乎意料地强壮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wire -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="70" x2="300" y2="70" class="image" />
    <line x1="50" y1="90" x2="300" y2="90" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="70" y2="180" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
  </g>
</svg>