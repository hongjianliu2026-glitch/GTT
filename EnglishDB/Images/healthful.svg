<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #27AE60; }
      .apple { fill: #E74C3C; }
      .heart { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">healthful</text>
  <text x="50" y="120" class="subtitle">[ˈhɛlθfəl] adj. 有益健康的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> health (健康) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满健康(health)的果园，"充满(ful)"
    <tspan x="50" dy="25">着新鲜的苹果和绿叶，这就是有益健康的(healthful)场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Eating a healthful diet can improve your well-being.
  </text>
  <text x="50" y="310" class="content">
    吃有益健康的食物可以改善你的健康状况。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apple -->
    <circle cx="50" cy="50" r="30" class="apple" />
    <!-- Leaf -->
    <path d="M 50 20 Q 70 10 50 0 Q 30 10 50 20" class="leaf" />
    <!-- Heart -->
    <path d="M 100 50 C 90 20 130 20 120 50 Z" class="heart" />
    <!-- Healthy environment -->
    <rect x="0" y="100" width="350" height="100" class="image" />
    <!-- Trees -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>