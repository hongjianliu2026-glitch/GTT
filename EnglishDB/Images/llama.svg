<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">llama</text>
  <text x="50" y="120" class="subtitle">[ˈlɑːmə] n. 美洲驼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自西班牙语 "llama"，意为“火焰”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只美洲驼，它的毛发像火焰一样红，
    <tspan x="50" dy="25">在阳光下闪耀，仿佛一团燃烧的火焰(llama)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The llama's coat was as red as a flame.
  </text>
  <text x="50" y="310" class="content">
    美洲驼的毛色红得像火焰一样。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Llama body -->
    <ellipse cx="150" cy="150" rx="100" ry="60" class="image" />
    <!-- Llama head -->
    <circle cx="250" cy="150" r="40" class="image" />
    <!-- Llama legs -->
    <line x1="100" y1="210" x2="100" y2="280" class="image" />
    <line x1="200" y1="210" x2="200" y2="280" class="image" />
    <!-- Llama neck -->
    <line x1="150" y1="150" x2="210" y2="150" class="image" />
    <!-- Flame-like hair -->
    <path d="M250,110 C260,90 280,90 290,110 S310,130 300,150" class="image" />
    <path d="M250,110 C240,90 220,90 210,110 S190,130 200,150" class="image" />
  </g>
</svg>