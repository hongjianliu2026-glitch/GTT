<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">third-generation</text>
  <text x="50" y="120" class="subtitle">[θɜːrd ˌdʒenəˈreɪʃn] n. 第三代</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> third (第三) + generation (代)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家族的第三代成员，他们继承了前两代人的智慧和经验，
    <tspan x="50" dy="25">形成了独特的"第三代(third-generation)"特征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is now in its third-generation of leadership.
  </text>
  <text x="50" y="310" class="content">
    这家公司现在处于第三代领导层。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family tree -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="60" x2="150" y2="60" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <circle cx="50" cy="20" r="15" class="image" />
    <circle cx="150" cy="60" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="150" cy="140" r="15" class="image" />
    <!-- Labels -->
    <text x="30" y="25" class="content">1st</text>
    <text x="170" y="65" class="content">2nd</text>
    <text x="170" y="105" class="content">3rd</text>
  </g>
</svg>