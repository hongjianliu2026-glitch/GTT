<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">organized</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrɡənaɪzd] adj. 有组织的，有条理的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> organ (器官，工具) + -ize (使...) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工具箱，里面所有的工具都"有条理地(organized)"
    <tspan x="50" dy="25">排列着，就像身体的器官各司其职一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event was well organized, with everything running smoothly.
  </text>
  <text x="50" y="310" class="content">
    活动组织得很好，一切都进行得很顺利。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toolbox -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tools -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Organized tools -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="100" y="20" width="50" height="50" class="image" />
    <rect x="150" y="20" width="50" height="50" class="image" />
    <rect x="200" y="20" width="50" height="50" class="image" />
    <rect x="250" y="20" width="50" height="50" class="image" />
    <rect x="300" y="20" width="50" height="50" class="image" />
  </g>
</svg>