<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #E67E22; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">midday</text>
  <text x="50" y="120" class="subtitle">[ˈmɪddeɪ] n. 正午，中午</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mid- (中间) + day (白天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳在天空的"中间(mid)"，正好是"白天(day)"的正午时分，
    <tspan x="50" dy="25">阳光最强烈，人们都在吃午饭。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We usually have lunch at midday.
  </text>
  <text x="50" y="310" class="content">
    我们通常在中午吃午饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Ground -->
    <rect x="0" y="150" width="200" height="50" class="image" fill="#7F8C8D" />
    <!-- Person -->
    <circle cx="50" cy="130" r="15" class="image" fill="#2C3E50" />
    <line x1="50" y1="145" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="35" y2="210" class="image" />
    <line x1="50" y1="180" x2="65" y2="210" class="image" />
    <line x1="50" y1="160" x2="70" y2="150" class="image" />
    <!-- Lunch -->
    <rect x="70" y="120" width="30" height="20" class="image" fill="#E74C3C" />
    <line x1="85" y1="120" x2="85" y2="140" class="image" />
  </g>
</svg>