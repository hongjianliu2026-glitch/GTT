<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ponder</text>
  <text x="50" y="120" class="subtitle">[ˈpɒndə(r)] v. 仔细考虑，沉思</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pond (重量) + -er (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考时，"重量(pond)"
    <tspan x="50" dy="25">压在他的心头，他需要"仔细考虑(ponder)"每一个细节。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pondered the question for a long time before answering.
  </text>
  <text x="50" y="310" class="content">
    她在回答之前对这个问题的思考了很久。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person thinking -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="100" cy="50" rx="60" ry="40" class="image" />
    <line x1="100" y1="90" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <!-- Weight symbol -->
    <rect x="150" y="20" width="30" height="60" class="image" />
    <line x1="165" y1="80" x2="165" y2="150" class="image" />
    <line x1="165" y1="150" x2="145" y2="180" class="image" />
    <line x1="165" y1="150" x2="185" y2="180" class="image" />
  </g>
</svg>