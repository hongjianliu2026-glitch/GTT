<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snip</text>
  <text x="50" y="120" class="subtitle">[snɪp] v. 剪断，剪去；n. 剪，剪断</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sn- (剪) + -ip (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把剪刀"咔嚓"(sn-)一声，"剪断(snip)"了一根绳子。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She snipped the thread with a pair of scissors.
  </text>
  <text x="50" y="310" class="content">
    她用剪刀剪断了线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Scissors -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="0" y1="0" x2="0" y2="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <line x1="0" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <!-- Thread -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <!-- Snipped part -->
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
  </g>
</svg>