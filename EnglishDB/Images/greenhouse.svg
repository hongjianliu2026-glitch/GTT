<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .glass { fill: #AED6F1; }
      .plant { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">greenhouse</text>
  <text x="50" y="120" class="subtitle">[ˈɡriːnhaʊs] n. 温室，暖房</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> green (绿色) + house (房子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"绿色房子(green-house)"，
    <tspan x="50" dy="25">里面充满了生机勃勃的植物，阳光透过玻璃</tspan>
    <tspan x="50" dy="25">温暖地照耀着，这就是温室(greenhouse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The greenhouse is full of exotic plants.
  </text>
  <text x="50" y="310" class="content">
    温室里满是奇异的植物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Greenhouse structure -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="glass" />
    <!-- Plants -->
    <circle cx="100" cy="100" r="20" class="plant" />
    <circle cx="150" cy="120" r="25" class="plant" />
    <circle cx="200" cy="110" r="30" class="plant" />
    <circle cx="250" cy="90" r="25" class="plant" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" fill="#F1C40F" />
    <line x1="300" y1="80" x2="300" y2="150" class="image" />
    <line x1="270" y1="115" x2="330" y2="115" class="image" />
    <line x1="285" y1="90" x2="315" y2="140" class="image" />
    <line x1="315" y1="90" x2="285" y2="140" class="image" />
  </g>
</svg>