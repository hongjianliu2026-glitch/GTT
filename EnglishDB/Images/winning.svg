<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">winning</text>
  <text x="50" y="120" class="subtitle">[ˈwɪnɪŋ] adj. 获胜的，赢得的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> win (赢) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在赛场上，"赢得(win)"
    <tspan x="50" dy="25">比赛后，他满脸笑容，这就是获胜的(winning)状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His winning smile made everyone cheer.
  </text>
  <text x="50" y="310" class="content">
    他获胜的笑容让每个人都欢呼起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trophy -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="30" class="image" />
    <!-- Smiling face -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="180" y1="90" x2="220" y2="90" class="image" />
    <line x1="180" y1="110" x2="220" y2="110" class="image" />
    <path d="M180,130 Q200,150 220,130" class="image" />
  </g>
</svg>