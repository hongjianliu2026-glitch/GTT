<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .liquid { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liquor</text>
  <text x="50" y="120" class="subtitle">[ˈlɪkər] n. 酒，烈性酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liqu (液体) + or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个酒瓶里装满了"液体(liqu)"，
    <tspan x="50" dy="25">这种液体就是烈性酒(liquor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He prefers whiskey over any other liquor.
  </text>
  <text x="50" y="310" class="content">
    比起其他酒，他更喜欢威士忌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <!-- Liquid inside the bottle -->
    <rect x="25" y="25" width="50" height="150" class="liquid" />
    <!-- Cork -->
    <rect x="10" y="0" width="80" height="20" class="image" />
  </g>
</svg>