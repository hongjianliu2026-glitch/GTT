<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overhead</text>
  <text x="50" y="120" class="subtitle">[ˈoʊvərˌhɛd] n. 管理费用，间接费用；adj. 在头顶上的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在...之上) + head (头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地上，头顶上有一盏巨大的灯，"在头顶上(over-head)"
    <tspan x="50" dy="25">照亮了他的周围，这个灯就象征着管理费用或间接费用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's overhead costs are too high.
  </text>
  <text x="50" y="310" class="content">
    公司的管理费用太高了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="160" y2="130" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />

    <!-- Overhead light -->
    <rect x="150" y="20" width="100" height="20" class="image" />
    <line x1="150" y1="20" x2="100" y2="0" class="image" />
    <line x1="250" y1="20" x2="300" y2="0" class="image" />
    <line x1="200" y1="20" x2="200" y2="0" class="image" />
  </g>
</svg>