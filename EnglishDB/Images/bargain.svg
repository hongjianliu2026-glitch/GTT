<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bargain</text>
  <text x="50" y="120" class="subtitle">[ˈbɑːrɡɪn] n. 交易，便宜货；v. 讨价还价</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bar (棒子) + gain (获得)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人用一根棒子(bar)在市场上讨价还价，最终获得(gain)了一个好交易(bargain)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a bargain at the flea market.
  </text>
  <text x="50" y="310" class="content">
    她在跳蚤市场上找到了一个便宜货。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Merchant -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Bar -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <!-- Goods -->
    <rect x="220" y="80" width="100" height="40" class="image" />
    <rect x="220" y="130" width="100" height="40" class="image" />
  </g>
</svg>