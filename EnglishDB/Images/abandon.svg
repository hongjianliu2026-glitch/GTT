<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abandon</text>
  <text x="50" y="120" class="subtitle">[əˈbændən] v. 放弃，抛弃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + -andon (安全)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在荒岛上，"离开(ab-)"
    <tspan x="50" dy="25">安全(andon)的地方，选择放弃(abandon)一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He abandoned his car by the side of the road.
  </text>
  <text x="50" y="310" class="content">
    他把车丢弃在路边。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Island -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person leaving -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Boat -->
    <rect x="100" y="150" width="150" height="20" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <line x1="175" y1="150" x2="175" y2="130" class="image" />
    <!-- Waves -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="190" x2="350" y2="190" class="image" />
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
  </g>
</svg>