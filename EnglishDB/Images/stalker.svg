<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stalker</text>
  <text x="50" y="120" class="subtitle">[ˈstɔːkər] n. 跟踪者，潜行者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stalk (潜行) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的人在夜晚"潜行(stalk)"，
    <tspan x="50" dy="25">悄悄跟踪着目标，这个人就是"跟踪者(stalker)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stalker was arrested by the police.
  </text>
  <text x="50" y="310" class="content">
    那个跟踪者被警察逮捕了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#1B4F72" />
    <!-- Moon -->
    <circle cx="30" cy="30" r="20" class="image" fill="#F1C40F" />
    <!-- Stalker -->
    <circle cx="200" cy="100" r="15" class="image" fill="#7F8C8D" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Target -->
    <circle cx="300" cy="100" r="10" class="image" fill="#E74C3C" />
    <line x1="300" y1="110" x2="300" y2="140" class="image" />
    <line x1="300" y1="140" x2="280" y2="170" class="image" />
    <line x1="300" y1="140" x2="320" y2="170" class="image" />
    <line x1="300" y1="120" x2="330" y2="110" class="image" />
    <!-- Arrow -->
    <line x1="215" y1="100" x2="285" y2="100" class="image" stroke="#F1C40F" stroke-width="3" />
    <polygon points="285,100 280,95 280,105" class="image" fill="#F1C40F" />
  </g>
</svg>