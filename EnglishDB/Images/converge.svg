<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">converge</text>
  <text x="50" y="120" class="subtitle">[kənˈvɜːrdʒ] v. 汇聚，集中</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + verg (转向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人从不同的方向"转向(verg)"，
    <tspan x="50" dy="25">最终"一起(con)"汇聚到一个点上，这就是converge。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roads converge at the central square.
  </text>
  <text x="50" y="310" class="content">
    这些道路在中央广场汇聚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paths converging -->
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <line x1="0" y1="150" x2="150" y2="0" class="image" />
    <line x1="150" y1="150" x2="300" y2="150" class="image" />
    <!-- Converging point -->
    <circle cx="300" cy="150" r="10" class="image" />
  </g>
</svg>