<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">astound</text>
  <text x="50" y="120" class="subtitle">[əˈstaʊnd] v. 使震惊，使大吃一惊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + stound (震惊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"加强的震惊(a-stound)"到，
    <tspan x="50" dy="25">他的眼睛瞪得像铜铃，嘴巴张得大大的，</tspan>
    <tspan x="50" dy="25">完全无法相信眼前发生的事情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's trick astounded the audience.
  </text>
  <text x="50" y="310" class="content">
    魔术师的把戏让观众大吃一惊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Eyes -->
    <circle cx="35" cy="90" r="5" class="image" />
    <circle cx="65" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <path d="M30 110 Q50 120 70 110" class="image" />
    <!-- Shocked expression -->
    <line x1="30" y1="80" x2="70" y2="80" class="image" />
    <line x1="30" y1="85" x2="70" y2="85" class="image" />
  </g>
</svg>