<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irritation</text>
  <text x="50" y="120" class="subtitle">[ˌɪrɪˈteɪʃən] n. 刺激，激怒，恼怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (进入) + rit (擦) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被激怒的人，"擦(rit)"
    <tspan x="50" dy="25">入(ir-)了情绪的漩涡，</tspan>
    <tspan x="50" dy="25">这种情绪就是恼怒(irritation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His constant interruptions caused irritation.
  </text>
  <text x="50" y="310" class="content">
    他不断的打断引起了恼怒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="80" y1="150" x2="120" y2="150" class="image" />
    <line x1="80" y1="150" x2="70" y2="140" class="image" />
    <line x1="120" y1="150" x2="130" y2="140" class="image" />
  </g>
</svg>