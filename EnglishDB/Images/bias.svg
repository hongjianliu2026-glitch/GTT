<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bias</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪəs] n. 偏见，偏爱；v. 使有偏见</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (两个) + as (朝向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在争论，"两个方向(bi-as)"
    <tspan x="50" dy="25">朝向不同的观点，这就是偏见(bias)的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge tried to avoid bias in his decision.
  </text>
  <text x="50" y="310" class="content">
    法官试图避免在判决中带有偏见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people arguing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <line x1="70" y1="100" x2="70" y2="150" class="image" />
    <line x1="230" y1="100" x2="230" y2="150" class="image" />
    <line x1="70" y1="150" x2="230" y2="150" class="image" />
    <!-- Arrows pointing in different directions -->
    <polygon points="150,50 130,80 170,80" class="image" />
    <polygon points="150,150 130,120 170,120" class="image" />
  </g>
</svg>