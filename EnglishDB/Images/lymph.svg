<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lymph</text>
  <text x="50" y="120" class="subtitle">[lɪmf] n. 淋巴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lympha (水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水球，里面充满了"水(lympha)"，
    <tspan x="50" dy="25">这些水在人体内流动，帮助清除废物和细菌，这就是淋巴(lymph)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor checked his lymph nodes for any signs of infection.
  </text>
  <text x="50" y="310" class="content">
    医生检查了他的淋巴结，看是否有感染的迹象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water droplet -->
    <circle cx="100" cy="100" r="50" class="image" fill="#1ABC9C" />
    <!-- Lymphatic vessel -->
    <line x1="150" y1="100" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="150" y2="100" class="image" />
    <!-- Waste particles -->
    <circle cx="200" cy="150" r="10" class="image" fill="#E74C3C" />
    <circle cx="220" cy="170" r="10" class="image" fill="#E74C3C" />
    <circle cx="240" cy="190" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>