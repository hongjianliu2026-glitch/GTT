<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kosher</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊʃər] adj. 符合犹太教规的，合适的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kashér (符合犹太教规的食物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个犹太教徒在检查食物，确保它们"符合犹太教规(kosher)"，
    <tspan x="50" dy="25">这些食物被标记为"合适"的，可以安全食用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The restaurant only serves kosher food.
  </text>
  <text x="50" y="310" class="content">
    这家餐厅只供应符合犹太教规的食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Food -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Apple -->
    <rect x="100" y="70" width="50" height="60" class="image" /> <!-- Bread -->
    <circle cx="180" cy="100" r="20" class="image" /> <!-- Grape -->
    <rect x="220" y="70" width="50" height="60" class="image" /> <!-- Fish -->
    <!-- Kosher symbol -->
    <text x="280" y="120" class="image" font-size="48" fill="#2ECC71">✡</text>
  </g>
</svg>