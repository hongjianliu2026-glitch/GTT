<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .land { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irrigation</text>
  <text x="50" y="120" class="subtitle">[ˌɪrɪˈɡeɪʃn] n. 灌溉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (进入) + rig (水) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片干旱的土地，突然"水(rig)"从"进入(ir-)"
    <tspan x="50" dy="25">土地，滋润了整个田野，这就是灌溉(irrigation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer uses irrigation to water his crops.
  </text>
  <text x="50" y="310" class="content">
    农民使用灌溉来浇灌他的庄稼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="0" width="350" height="200" class="land" />
    <!-- Water flow -->
    <rect x="50" y="100" width="250" height="20" class="water" />
    <rect x="100" y="120" width="200" height="20" class="water" />
    <rect x="150" y="140" width="150" height="20" class="water" />
    <!-- Water source -->
    <circle cx="25" cy="110" r="20" class="water" />
    <!-- Irrigation system -->
    <line x1="25" y1="110" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="150" y2="140" class="image" />
    <line x1="150" y1="140" x2="200" y2="160" class="image" />
  </g>
</svg>