<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glib</text>
  <text x="50" y="120" class="subtitle">[ɡlɪb] adj. 油嘴滑舌的，口齿伶俐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gl- (光亮) + ib (嘴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人嘴巴像涂了油一样，"光亮(gl-)"
    <tspan x="50" dy="25">且"嘴(ib)"齿伶俐，说话油嘴滑舌(glib)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gave a glib excuse for being late.
  </text>
  <text x="50" y="310" class="content">
    他找了个油嘴滑舌的借口解释迟到的原因。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Teeth -->
    <rect x="70" y="80" width="60" height="40" class="image" />
    <!-- Tongue -->
    <ellipse cx="100" cy="120" rx="30" ry="15" class="image" />
    <!-- Oil drop -->
    <circle cx="150" cy="90" r="10" class="image" />
    <circle cx="160" cy="85" r="8" class="image" />
    <circle cx="170" cy="80" r="6" class="image" />
  </g>
</svg>