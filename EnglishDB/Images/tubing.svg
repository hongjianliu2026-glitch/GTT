<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tubing</text>
  <text x="50" y="120" class="subtitle">[ˈtjuːbɪŋ] n. 管道系统，管材</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tub (管子) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的管道系统，"管子(tub)"
    <tspan x="50" dy="25">像蛇一样蜿蜒穿过整个城市，这就是管材(tubing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new building uses advanced tubing for its plumbing system.
  </text>
  <text x="50" y="310" class="content">
    这座新建筑使用了先进的管材用于其管道系统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tubes -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <!-- City skyline -->
    <rect x="50" y="200" width="20" height="50" class="image" />
    <rect x="100" y="180" width="20" height="70" class="image" />
    <rect x="150" y="190" width="20" height="60" class="image" />
    <rect x="200" y="170" width="20" height="80" class="image" />
    <rect x="250" y="185" width="20" height="65" class="image" />
  </g>
</svg>