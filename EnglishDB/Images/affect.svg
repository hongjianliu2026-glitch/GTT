<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">affect</text>
  <text x="50" y="120" class="subtitle">[əˈfekt] v. 影响，感动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> af- (朝向) + fect (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人朝向(af-)另一个人，用行动(fect)
    <tspan x="50" dy="25">去影响或感动对方，这就是affect的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie deeply affected the audience.
  </text>
  <text x="50" y="310" class="content">
    这部电影深深地影响了观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person A -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Person B -->
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Arrow -->
    <line x1="80" y1="100" x2="170" y2="100" class="image" />
    <polygon points="170,85 170,115 200,100" class="image" />
    <!-- Heart -->
    <path d="M150,150 C140,130 160,130 150,150 Z" class="image" />
    <path d="M150,150 C160,170 140,170 150,150 Z" class="image" />
  </g>
</svg>