<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sixty</text>
  <text x="50" y="120" class="subtitle">[ˈsɪksti] n. 六十</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sex- (六) + -ty (表示数量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，上面有60个刻度，每个刻度代表一分钟。
    <tspan x="50" dy="25">这个时钟的每一圈都代表着"六十(sixty)"分钟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He ran sixty laps around the track.
  </text>
  <text x="50" y="310" class="content">
    他在跑道上跑了六十圈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Hour marks -->
    <line x1="175" y1="20" x2="175" y2="30" class="image" />
    <line x1="240" y1="65" x2="230" y2="75" class="image" />
    <line x1="240" y1="135" x2="230" y2="125" class="image" />
    <line x1="175" y1="180" x2="175" y2="170" class="image" />
    <line x1="110" y1="135" x2="120" y2="125" class="image" />
    <line x1="110" y1="65" x2="120" y2="75" class="image" />
    <!-- Minute hand -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <!-- Hour hand -->
    <line x1="175" y1="100" x2="240" y2="100" class="image" />
  </g>
</svg>