<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #7E5109; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #1B4F72; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mourning</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrnɪŋ] n. 哀悼，悲痛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mourn (哀悼) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在墓碑前，"哀悼(mourn)"
    <tspan x="50" dy="25">逝去的亲人，整个场景充满了悲痛(mourning)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent the day in mourning for her lost pet.
  </text>
  <text x="50" y="310" class="content">
    她为失去的宠物哀悼了一整天。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tombstone -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <text x="20" y="100" class="image" style="font: bold 24px serif; fill: #000;">R.I.P.</text>
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="160" y2="130" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Tear -->
    <circle cx="210" cy="90" r="5" class="image" style="fill: #000;" />
    <line x1="210" y1="90" x2="210" y2="110" class="image" style="stroke-dasharray: 5,5;" />
  </g>
</svg>