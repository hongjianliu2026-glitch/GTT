<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">put</text>
  <text x="50" y="120" class="subtitle">[pʊt] v. 放，安置</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> put (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人小心翼翼地"放置(put)"
    <tspan x="50" dy="25">一个珍贵的物品在桌子上，确保它安全无损。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully put the vase on the table.
  </text>
  <text x="50" y="310" class="content">
    她小心地把花瓶放在桌子上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,220)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Vase -->
    <circle cx="175" cy="50" r="20" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Hand putting the vase -->
    <line x1="50" y1="180" x2="175" y2="60" class="image" />
  </g>
</svg>