<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">significance</text>
  <text x="50" y="120" class="subtitle">[sɪɡˈnɪfɪkəns] n. 重要性，意义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sign (标记) + -ific (使) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的标记(sign)，它"使(ific)"
    <tspan x="50" dy="25">人们意识到某件事的重要性(significance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The significance of this discovery cannot be overstated.
  </text>
  <text x="50" y="310" class="content">
    这一发现的重要性怎么强调都不为过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large sign -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <text x="50" y="100" class="image" style="font: bold 48px sans-serif; fill: #E74C3C;">SIGN</text>
    <!-- Spotlight -->
    <circle cx="200" cy="100" r="50" class="image" style="fill: #F39C12;" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="150" y2="250" class="image" />
    <line x1="200" y1="200" x2="250" y2="250" class="image" />
  </g>
</svg>