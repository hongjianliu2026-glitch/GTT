<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">billow</text>
  <text x="50" y="120" class="subtitle">[ˈbɪloʊ] n. 巨浪，波浪；v. 翻腾，汹涌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bill (波浪) + -ow (表示状态或动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片海洋，"波浪(bill)"在海面上"翻腾(ow)"，
    <tspan x="50" dy="25">形成巨大的"巨浪(billow)"，仿佛要将一切吞没。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship was tossed by the billows of the storm.
  </text>
  <text x="50" y="310" class="content">
    船在风暴的巨浪中颠簸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#4CAF50" />
    <!-- Billow -->
    <path d="M50 50 C100 10, 250 10, 300 50 S350 90, 300 130 S250 170, 200 130 S150 90, 100 130 S50 170, 50 130 Z" class="image" fill="#81C784" />
    <!-- Another billow -->
    <path d="M50 100 C100 60, 250 60, 300 100 S350 140, 300 180 S250 220, 200 180 S150 140, 100 180 S50 220, 50 180 Z" class="image" fill="#66BB6A" />
  </g>
</svg>