<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">huge</text>
  <text x="50" y="120" class="subtitle">[hjuːdʒ] adj. 巨大的，庞大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hug (大) + -e (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的鲸鱼，"大到(hug-e)"
    <tspan x="50" dy="25">可以吞下整个小岛，这就是huge(巨大的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The huge whale swam gracefully in the ocean.
  </text>
  <text x="50" y="310" class="content">
    巨大的鲸鱼在海洋中优雅地游动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Whale body -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Whale tail -->
    <polygon points="325,100 375,70 375,130" class="image" />
    <!-- Whale eye -->
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Island -->
    <rect x="50" y="150" width="250" height="50" class="image" />
    <!-- Ocean -->
    <rect x="0" y="200" width="400" height="100" class="image" />
  </g>
</svg>