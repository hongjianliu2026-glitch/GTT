<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indulge</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdʌldʒ] v. 放纵，沉溺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + dulge (甜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"进入(in-)"甜蜜的"沉溺(dulge)"状态，
    <tspan x="50" dy="25">手里拿着一大块巧克力，脸上洋溢着满足的笑容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She indulged in a piece of cake after dinner.
  </text>
  <text x="50" y="310" class="content">
    她晚饭后放纵自己吃了一块蛋糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Chocolate -->
    <rect x="100" y="80" width="100" height="50" class="image" />
    <line x1="120" y1="90" x2="180" y2="90" class="image" />
    <line x1="120" y1="110" x2="180" y2="110" class="image" />
    <line x1="120" y1="130" x2="180" y2="130" class="image" />
    <!-- Smile -->
    <path d="M 50 110 Q 60 100 70 110" class="image" />
  </g>
</svg>