<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #A93226; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">auburn</text>
  <text x="50" y="120" class="subtitle">[ˈɔːbərn] adj. 红褐色的，栗色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auburn (源自中古英语，意为“红褐色”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只红褐色的狐狸在秋天的森林中奔跑，
    <tspan x="50" dy="25">它的毛发在阳光下闪耀着红褐色的光芒，这就是auburn的颜色。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her auburn hair caught the sunlight beautifully.
  </text>
  <text x="50" y="310" class="content">
    她的红褐色头发在阳光下显得格外美丽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#82E0AA" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" fill="#F1C40F" />
    <!-- Fox -->
    <circle cx="100" cy="100" r="20" fill="#A569BD" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Leaves -->
    <circle cx="50" cy="50" r="10" fill="#A569BD" />
    <circle cx="70" cy="70" r="10" fill="#A569BD" />
    <circle cx="90" cy="50" r="10" fill="#A569BD" />
  </g>
</svg>