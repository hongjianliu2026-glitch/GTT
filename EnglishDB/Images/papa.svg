<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">papa</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːpə] n. 爸爸，父亲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> papa (源自拉丁语pappas，意为“父亲”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小宝宝在叫"papa"，声音甜美，
    <tspan x="50" dy="25">爸爸听到后满脸笑容，这就是“papa”的温馨画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby called out "papa" when he saw his father.
  </text>
  <text x="50" y="310" class="content">
    宝宝看到爸爸时叫了声“papa”。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baby -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />

    <!-- Father -->
    <circle cx="200" cy="100" r="40" class="image" />
    <line x1="200" y1="140" x2="200" y2="200" class="image" />
    <line x1="200" y1="160" x2="160" y2="150" class="image" />
    <line x1="200" y1="160" x2="240" y2="150" class="image" />
    <line x1="200" y1="200" x2="160" y2="230" class="image" />
    <line x1="200" y1="200" x2="240" y2="230" class="image" />

    <!-- Speech bubble -->
    <path d="M 50 70 Q 100 50 150 70 Q 100 90 50 70" class="image" />
    <text x="70" y="75" class="content" text-anchor="middle">papa</text>
  </g>
</svg>