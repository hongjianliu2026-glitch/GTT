<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jealousy</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɛləsi] n. 嫉妒，妒忌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jeal (看守) + -ous (形容词后缀) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人紧紧"看守(jeal)"着他的爱人，
    <tspan x="50" dy="25">生怕别人抢走，这种强烈的占有欲就是嫉妒(jealousy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her jealousy drove her to check his phone every night.
  </text>
  <text x="50" y="310" class="content">
    她的嫉妒心驱使她每晚都要检查他的手机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 Q100,20 150,50 Q100,80 50,50" class="image" />
    <!-- Eye watching the heart -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <!-- Hand guarding the heart -->
    <line x1="50" y1="70" x2="20" y2="100" class="image" />
    <line x1="150" y1="70" x2="180" y2="100" class="image" />
  </g>
</svg>