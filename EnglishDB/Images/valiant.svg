<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">valiant</text>
  <text x="50" y="120" class="subtitle">[ˈvæliənt] adj. 勇敢的，英勇的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> val (强壮) + -iant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的骑士(val)，他面对巨龙毫不畏惧，
    <tspan x="50" dy="25">展现出无比的勇气(valiant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The valiant knight saved the princess from the dragon.
  </text>
  <text x="50" y="310" class="content">
    勇敢的骑士从巨龙手中救出了公主。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knight -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Dragon -->
    <path d="M150,100 C160,80 200,80 210,100" class="image" />
    <line x1="180" y1="100" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="160" y2="190" class="image" />
    <line x1="180" y1="150" x2="200" y2="190" class="image" />
    <line x1="180" y1="120" x2="150" y2="110" class="image" />
    <line x1="180" y1="120" x2="210" y2="110" class="image" />
  </g>
</svg>