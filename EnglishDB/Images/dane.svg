<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Dane</text>
  <text x="50" y="120" class="subtitle">[deɪn] n. 丹麦人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自丹麦语 "Dane"，指丹麦人。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着传统服饰的丹麦人，手持丹麦国旗，站在丹麦的标志性建筑——小美人鱼雕像旁边，这就是一个典型的丹麦人(Dane)的形象。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Dane spoke fluent Danish.
  </text>
  <text x="50" y="310" class="content">
    这位丹麦人说一口流利的丹麦语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional Danish clothing -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <!-- Danish flag -->
    <rect x="120" y="0" width="80" height="50" class="image" />
    <line x1="130" y1="10" x2="130" y2="40" class="image" />
    <line x1="150" y1="10" x2="150" y2="40" class="image" />
    <line x1="120" y1="20" x2="200" y2="20" class="image" />
    <line x1="120" y1="30" x2="200" y2="30" class="image" />
    <!-- Little Mermaid statue -->
    <circle cx="250" cy="75" r="30" class="image" />
    <line x1="250" y1="105" x2="250" y2="150" class="image" />
    <line x1="250" y1="120" x2="220" y2="140" class="image" />
    <line x1="250" y1="120" x2="280" y2="140" class="image" />
    <line x1="250" y1="150" x2="220" y2="180" class="image" />
    <line x1="250" y1="150" x2="280" y2="180" class="image" />
  </g>
</svg>