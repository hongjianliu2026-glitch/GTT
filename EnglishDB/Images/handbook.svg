<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handbook</text>
  <text x="50" y="120" class="subtitle">[ˈhændˌbʊk] n. 手册，指南</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + book (书)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人手里拿着一本"手(hand)书(book)"，
    <tspan x="50" dy="25">这本书就是他的指南(handbook)，随时可以翻阅。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He always carries a handbook for emergencies.
  </text>
  <text x="50" y="310" class="content">
    他总是随身携带一本应急手册。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <path d="M20,100 C20,50 100,50 100,100 L100,150 C100,200 20,200 20,150 Z" class="image" fill="#F1C40F" />
    <!-- Book -->
    <rect x="120" y="80" width="150" height="150" class="image" fill="#ECF0F1" />
    <line x1="120" y1="100" x2="270" y2="100" class="image" />
    <line x1="120" y1="120" x2="270" y2="120" class="image" />
    <line x1="120" y1="140" x2="270" y2="140" class="image" />
    <line x1="120" y1="160" x2="270" y2="160" class="image" />
    <line x1="120" y1="180" x2="270" y2="180" class="image" />
    <line x1="120" y1="200" x2="270" y2="200" class="image" />
  </g>
</svg>