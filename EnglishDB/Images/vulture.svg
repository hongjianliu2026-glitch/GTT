<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vulture</text>
  <text x="50" y="120" class="subtitle">[ˈvʌltʃər] n. 秃鹫，贪婪的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vult (飞) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只秃鹫在天空中盘旋，"飞翔(vult)"
    <tspan x="50" dy="25">寻找着腐肉，贪婪地等待着机会。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vulture circled above the carcass, waiting for its chance to feed.
  </text>
  <text x="50" y="310" class="content">
    秃鹫在尸体上方盘旋，等待着进食的机会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Vulture -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="90" x2="30" y2="80" class="image" />
    <line x1="50" y1="90" x2="70" y2="80" class="image" />
    <line x1="50" y1="120" x2="30" y2="140" class="image" />
    <line x1="50" y1="120" x2="70" y2="140" class="image" />
    <!-- Carcass -->
    <rect x="200" y="100" width="100" height="50" class="image" />
    <line x1="220" y1="120" x2="280" y2="120" class="image" />
    <line x1="220" y1="140" x2="280" y2="140" class="image" />
  </g>
</svg>