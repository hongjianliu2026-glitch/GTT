<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ideology</text>
  <text x="50" y="120" class="subtitle">[ˌaɪdiˈɒlədʒi] n. 意识形态，思想体系</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ideo- (思想) + -logy (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的大脑，"思想(ideo)"
    <tspan x="50" dy="25">在空中漂浮，形成了一个完整的"学科(logy)"，</tspan>
    <tspan x="50" dy="25">这就是意识形态(ideology)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ideology of the party is deeply rooted in its history.
  </text>
  <text x="50" y="310" class="content">
    该党的意识形态深深植根于其历史之中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Thought bubbles -->
    <circle cx="200" cy="50" r="30" class="image" />
    <circle cx="250" cy="120" r="40" class="image" />
    <circle cx="150" cy="180" r="50" class="image" />
    <!-- Lines connecting brain to thoughts -->
    <line x1="100" y1="100" x2="200" y2="50" class="image" />
    <line x1="100" y1="100" x2="250" y2="120" class="image" />
    <line x1="100" y1="100" x2="150" y2="180" class="image" />
  </g>
</svg>