<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">a</text>
  <text x="50" y="120" class="subtitle">[ə] art. 一（个）；每一（个）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "ad" (朝向) 的缩写
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个箭头(a)指向一个目标，这个目标可以是任何事物，
    <tspan x="50" dy="25">它代表了"一个"或"每一"的概念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A cat is sitting on the fence.
  </text>
  <text x="50" y="310" class="content">
    一只猫坐在篱笆上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow -->
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <polygon points="150,150 140,135 140,165" class="image" />
    <!-- Target -->
    <circle cx="200" cy="200" r="50" class="image" />
    <circle cx="200" cy="200" r="30" class="image" />
    <circle cx="200" cy="200" r="10" class="image" />
  </g>
</svg>