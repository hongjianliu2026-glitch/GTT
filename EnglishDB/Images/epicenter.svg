<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">epicenter</text>
  <text x="50" y="120" class="subtitle">[ˈɛpɪˌsɛntər] n. 震中，中心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> epi- (在...之上) + center (中心)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场大地震，"在中心之上(epi-center)"
    <tspan x="50" dy="25">是最强烈的地方，那里就是震中(epicenter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The epicenter of the earthquake was located near the city.
  </text>
  <text x="50" y="310" class="content">
    地震的震中位于城市附近。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Epicenter -->
    <circle cx="175" cy="100" r="10" class="image" fill="#E74C3C" />
    <!-- Waves -->
    <line x1="175" y1="100" x2="300" y2="100" class="image" />
    <line x1="175" y1="100" x2="300" y2="150" class="image" />
    <line x1="175" y1="100" x2="300" y2="50" class="image" />
    <line x1="175" y1="100" x2="250" y2="180" class="image" />
    <line x1="175" y1="100" x2="250" y2="20" class="image" />
  </g>
</svg>