<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">towards</text>
  <text x="50" y="120" class="subtitle">[təˈwɔrdz] prep. 向，朝，对于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> to- (向) + wards (方向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面向太阳，"向着(to-wards)"
    <tspan x="50" dy="25">光明前进，象征着积极的方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She walked towards the light at the end of the tunnel.
  </text>
  <text x="50" y="310" class="content">
    她朝着隧道尽头的那束光走去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <!-- Sun -->
    <circle cx="200" cy="100" r="30" class="image" fill="#F1C40F" />
    <line x1="200" y1="70" x2="200" y2="40" class="image" />
    <line x1="200" y1="130" x2="200" y2="160" class="image" />
    <line x1="170" y1="100" x2="140" y2="100" class="image" />
    <line x1="230" y1="100" x2="260" y2="100" class="image" />
    <line x1="185" y1="75" x2="160" y2="50" class="image" />
    <line x1="215" y1="75" x2="240" y2="50" class="image" />
    <line x1="185" y1="125" x2="160" y2="150" class="image" />
    <line x1="215" y1="125" x2="240" y2="150" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,100 170,90 170,110" class="image" />
  </g>
</svg>