<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bounce</text>
  <text x="50" y="120" class="subtitle">[baʊns] v. 弹跳，反弹；n. 弹跳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boun- (跳)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个球从地面"跳起(boun-)"，
    <tspan x="50" dy="25">然后又"反弹(bounce)"回来，这就是弹跳(bounce)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ball bounced off the wall and into the room.
  </text>
  <text x="50" y="310" class="content">
    球从墙上弹开，滚进了房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Ball -->
    <circle cx="100" cy="150" r="20" class="image" />
    <!-- Ball bouncing path -->
    <path d="M100 150 Q150 50 200 150" class="image" />
    <!-- Ball bouncing path -->
    <path d="M200 150 Q250 50 300 150" class="image" />
  </g>
</svg>