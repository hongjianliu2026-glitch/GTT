<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mailbox</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪlˌbɒks] n. 邮箱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mail (邮件) + box (箱子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个邮递员把信件投进一个"箱子(box)"里，
    <tspan x="50" dy="25">这个箱子就是用来接收邮件(mail)的邮箱(mailbox)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The letter was delivered to our mailbox this morning.
  </text>
  <text x="50" y="310" class="content">
    信件今天早上被投递到我们的邮箱里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mailbox -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <line x1="75" y1="20" x2="75" y2="200" class="image" />
    <!-- Letter -->
    <rect x="40" y="50" width="70" height="30" class="image" />
    <line x1="40" y1="50" x2="110" y2="50" class="image" />
    <line x1="40" y1="80" x2="110" y2="80" class="image" />
    <line x1="40" y1="50" x2="40" y2="80" class="image" />
    <line x1="110" y1="50" x2="110" y2="80" class="image" />
    <!-- Postman -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>