<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psychological</text>
  <text x="50" y="120" class="subtitle">[ˌsaɪkəˈlɒdʒɪkl] adj. 心理的，心理学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psyche (心灵) + logy (学科) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心理学家在研究"心灵(psyche)"的学科(logy)，
    <tspan x="50" dy="25">这个学科就是心理学(psychological)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The therapist used psychological techniques to help her patient.
  </text>
  <text x="50" y="310" class="content">
    治疗师使用心理学技巧来帮助她的病人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="170" x2="50" y2="150" class="image" />
    <line x1="100" y1="170" x2="150" y2="150" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <!-- Book -->
    <rect x="200" y="50" width="100" height="150" class="image" />
    <line x1="220" y1="70" x2="280" y2="70" class="image" />
    <line x1="220" y1="100" x2="280" y2="100" class="image" />
    <line x1="220" y1="130" x2="280" y2="130" class="image" />
    <line x1="220" y1="160" x2="280" y2="160" class="image" />
    <!-- Psychologist -->
    <circle cx="350" cy="100" r="15" class="image" />
    <line x1="350" y1="115" x2="350" y2="150" class="image" />
    <line x1="350" y1="150" x2="330" y2="180" class="image" />
    <line x1="350" y1="150" x2="370" y2="180" class="image" />
    <line x1="350" y1="130" x2="380" y2="120" class="image" />
  </g>
</svg>