<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">landfill</text>
  <text x="50" y="120" class="subtitle">[ˈlændfɪl] n. 垃圾填埋场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> land (土地) + fill (填满)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片土地被垃圾"填满(fill)"，
    <tspan x="50" dy="25">形成了一个巨大的垃圾填埋场(landfill)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city is planning to build a new landfill to handle its waste.
  </text>
  <text x="50" y="310" class="content">
    这座城市计划建造一个新的垃圾填埋场来处理垃圾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trash -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Landfill -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>