<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">progressive</text>
  <text x="50" y="120" class="subtitle">[prəˈɡresɪv] adj. 进步的，前进的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + gress (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在不断"向前走(pro-gress)"，
    <tspan x="50" dy="25">每一步都代表着进步(progressive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a progressive approach to employee development.
  </text>
  <text x="50" y="310" class="content">
    公司对员工发展采取了一种进步的方法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path representing progress -->
    <path d="M0,0 Q100,50 200,0 T400,0" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="10" r="15" class="image" />
    <line x1="50" y1="25" x2="50" y2="60" class="image" />
    <line x1="50" y1="60" x2="30" y2="90" class="image" />
    <line x1="50" y1="60" x2="70" y2="90" class="image" />
    <line x1="50" y1="40" x2="80" y2="30" class="image" />
    <!-- Steps -->
    <rect x="100" y="-10" width="20" height="20" class="image" />
    <rect x="200" y="-10" width="20" height="20" class="image" />
    <rect x="300" y="-10" width="20" height="20" class="image" />
  </g>
</svg>