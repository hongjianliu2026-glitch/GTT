<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">detectable</text>
  <text x="50" y="120" class="subtitle">[dɪˈtektəbl] adj. 可察觉的，可发现的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + tect (覆盖) + -able (可...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探用放大镜"向下揭开(de-tect)"
    <tspan x="50" dy="25">覆盖的秘密，这些秘密变得可察觉(detectable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The faint scent was barely detectable.
  </text>
  <text x="50" y="310" class="content">
    那微弱的香味几乎难以察觉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <!-- Hidden secret -->
    <rect x="120" y="20" width="150" height="60" class="image" />
    <text x="130" y="55" class="content" fill="#7F8C8D">Hidden Secret</text>
    <!-- Detective -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>