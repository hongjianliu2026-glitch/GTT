<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dumb</text>
  <text x="50" y="120" class="subtitle">[dʌm] adj. 哑的，愚蠢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dum- (沉默，无声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为"沉默(dum-)"而无法说话，
    <tspan x="50" dy="25">结果被认为是"愚蠢的(dumb)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He felt dumb when he couldn't answer the question.
  </text>
  <text x="50" y="310" class="content">
    当他无法回答问题时，他感到很愚蠢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a zipper on the mouth -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="30" y1="70" x2="70" y2="70" class="image" />
    <line x1="40" y1="80" x2="60" y2="80" class="image" />
    <line x1="50" y1="90" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <!-- Zipper -->
    <line x1="40" y1="80" x2="60" y2="80" class="image" />
    <line x1="40" y1="85" x2="60" y2="85" class="image" />
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="40" y1="95" x2="60" y2="95" class="image" />
    <line x1="40" y1="100" x2="60" y2="100" class="image" />
  </g>
</svg>