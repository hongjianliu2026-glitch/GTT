<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">terribly</text>
  <text x="50" y="120" class="subtitle">[ˈterəbli] adv. 非常，极其</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> terribilis (可怕的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个可怕的怪物，"极其(terribly)"
    <tspan x="50" dy="25">吓人，让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was terribly excited about the trip.
  </text>
  <text x="50" y="310" class="content">
    她对这次旅行非常兴奋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Right leg -->
    <!-- Eyes -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
  </g>
</svg>