<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ruthless</text>
  <text x="50" y="120" class="subtitle">[ˈruːθləs] adj. 无情的，冷酷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ruth (怜悯) + -less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有怜悯(ruth-less)的恶魔，
    <tspan x="50" dy="25">他冷酷无情地摧毁一切，不留任何余地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ruthless dictator ruled with an iron fist.
  </text>
  <text x="50" y="310" class="content">
    那个无情的独裁者用铁腕统治。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Demon -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Destruction -->
    <line x1="100" y1="100" x2="200" y2="200" class="image" />
    <line x1="100" y1="200" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
  </g>
</svg>