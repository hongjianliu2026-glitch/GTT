<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tee</text>
  <text x="50" y="120" class="subtitle">[tiː] n. T字形，T恤；v. 放置T字形</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "te" (T字形)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的T字形标志，"T"字形的顶部是一个巨大的T恤，
    <tspan x="50" dy="25">T恤上印着一个夸张的笑脸，这个T恤就像一个巨大的T字形标志，</tspan>
    <tspan x="50" dy="25">让人一眼就能记住这个单词。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a tee with a funny design.
  </text>
  <text x="50" y="310" class="content">
    他穿了一件带有有趣图案的T恤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- T-shirt -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- T-shape -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="20" x2="250" y2="20" class="image" />
    <!-- Face -->
    <circle cx="175" cy="100" r="30" class="image" />
    <circle cx="155" cy="90" r="5" class="image" />
    <circle cx="195" cy="90" r="5" class="image" />
    <path d="M155 120 Q175 140 195 120" class="image" />
  </g>
</svg>