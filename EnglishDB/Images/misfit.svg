<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misfit</text>
  <text x="50" y="120" class="subtitle">[ˈmɪsˌfɪt] n. 不适应环境的人，不合适的东西</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + fit (适合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着超大号鞋子的小孩，"错误地适合(mis-fit)"
    <tspan x="50" dy="25">他的脚，显得格格不入，这就是一个misfit。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new employee was a misfit in the team.
  </text>
  <text x="50" y="310" class="content">
    新员工在这个团队中格格不入。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Big shoes -->
    <rect x="0" y="0" width="150" height="50" class="image" />
    <rect x="160" y="0" width="150" height="50" class="image" />
    <!-- Small child -->
    <circle cx="75" cy="100" r="20" class="image" />
    <line x1="75" y1="120" x2="75" y2="160" class="image" />
    <line x1="75" y1="160" x2="50" y2="200" class="image" />
    <line x1="75" y1="160" x2="100" y2="200" class="image" />
    <line x1="75" y1="140" x2="120" y2="130" class="image" />
    <!-- Shoes on child's feet -->
    <rect x="50" y="160" width="50" height="20" class="image" />
    <rect x="110" y="160" width="50" height="20" class="image" />
  </g>
</svg>