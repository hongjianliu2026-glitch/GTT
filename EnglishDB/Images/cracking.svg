<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cracking</text>
  <text x="50" y="120" class="subtitle">[ˈkrækɪŋ] v. 破裂，破解；adj. 极好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crack (裂缝) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个鸡蛋，"裂开(crack)"
    <tspan x="50" dy="25">后，蛋液流出，这就是cracking的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ice on the lake started cracking in the warm weather.
  </text>
  <text x="50" y="310" class="content">
    温暖的天气里，湖面上的冰开始破裂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Egg -->
    <ellipse cx="175" cy="100" rx="100" ry="70" class="image" />
    <!-- Crack lines -->
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <line x1="175" y1="30" x2="175" y2="170" class="image" />
    <!-- Egg yolk -->
    <circle cx="175" cy="100" r="30" fill="#F1C40F" />
  </g>
</svg>