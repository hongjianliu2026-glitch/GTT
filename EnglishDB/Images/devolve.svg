<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">devolve</text>
  <text x="50" y="120" class="subtitle">[dɪˈvɒlv] v. 移交，转移；退化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + volv (卷，转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个任务从高层"向下卷(de-volv)"到低层，
    <tspan x="50" dy="25">最终被移交给基层员工，这就是任务的转移(devolve)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The responsibility was devolved to the team leader.
  </text>
  <text x="50" y="310" class="content">
    责任被移交给了团队领导。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Upper level -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <text x="50" y="50" class="content">Upper Level</text>
    <!-- Lower level -->
    <rect x="0" y="150" width="350" height="100" class="image" />
    <text x="50" y="200" class="content">Lower Level</text>
    <!-- Arrow -->
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <polygon points="170,125 175,150 180,125" class="image" />
    <!-- Task -->
    <rect x="150" y="110" width="50" height="20" class="image" />
    <text x="155" y="125" class="content">Task</text>
  </g>
</svg>