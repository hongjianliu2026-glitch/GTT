<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mystify</text>
  <text x="50" y="120" class="subtitle">[ˈmɪstɪfaɪ] v. 使迷惑，使困惑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> myst (神秘) + -ify (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在舞台上，"使(ify)"
    <tspan x="50" dy="25">观众陷入"神秘(myst)"的困惑中，这就是mystify。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's tricks mystified the audience.
  </text>
  <text x="50" y="310" class="content">
    魔术师的把戏让观众感到困惑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Hat -->
    <path d="M30,80 Q50,50 70,80" class="image" />
    <!-- Audience -->
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
    <circle cx="250" cy="120" r="10" class="image" />
    <!-- Question marks -->
    <text x="150" y="150" class="image" font-size="30">?</text>
    <text x="200" y="150" class="image" font-size="30">?</text>
    <text x="250" y="150" class="image" font-size="30">?</text>
  </g>
</svg>