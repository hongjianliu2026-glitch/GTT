<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">agree</text>
  <text x="50" y="120" class="subtitle">[əˈɡriː] v. 同意，赞同</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + gre (高兴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，"朝向(ad-)"彼此，脸上露出"高兴(gre)"的笑容，
    <tspan x="50" dy="25">表示他们"同意(agree)"了某个观点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They finally agreed on the terms of the contract.
  </text>
  <text x="50" y="310" class="content">
    他们最终就合同条款达成了一致。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <line x1="70" y1="120" x2="70" y2="150" class="image" />
    <line x1="130" y1="120" x2="130" y2="150" class="image" />
    <line x1="70" y1="150" x2="130" y2="150" class="image" />
    <!-- Smiling faces -->
    <line x1="60" y1="90" x2="70" y2="95" class="image" />
    <line x1="80" y1="90" x2="70" y2="95" class="image" />
    <line x1="140" y1="90" x2="150" y2="95" class="image" />
    <line x1="160" y1="90" x2="150" y2="95" class="image" />
    <path d="M60 110 Q70 120 80 110" class="image" />
    <path d="M140 110 Q150 120 160 110" class="image" />
  </g>
</svg>