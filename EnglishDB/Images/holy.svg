<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">holy</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊli] adj. 神圣的，圣洁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hol- (完整，神圣)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神圣的教堂，"完整(hol-)"
    <tspan x="50" dy="25">且庄严，充满了神圣的气息(holy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The holy scriptures are revered by many.
  </text>
  <text x="50" y="310" class="content">
    神圣的经文受到许多人的尊敬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Church -->
    <polygon points="0,150 150,0 300,150" class="image" />
    <rect x="120" y="150" width="60" height="100" class="image" />
    <!-- Cross -->
    <line x1="150" y1="50" x2="150" y2="120" class="image" />
    <line x1="120" y1="85" x2="180" y2="85" class="image" />
  </g>
</svg>