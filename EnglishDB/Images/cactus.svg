<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cactus { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cactus</text>
  <text x="50" y="120" class="subtitle">[ˈkæktəs] n. 仙人掌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cact- (刺) + -us (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个仙人掌，浑身长满了刺(cact-)，
    <tspan x="50" dy="25">就像一个勇敢的战士，在沙漠中顽强生存。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cactus plant can survive in the desert for months without water.
  </text>
  <text x="50" y="310" class="content">
    仙人掌植物可以在沙漠中数月不喝水而存活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cactus body -->
    <rect x="50" y="50" width="100" height="200" class="cactus" />
    <!-- Cactus spines -->
    <line x1="100" y1="50" x2="100" y2="30" class="image" />
    <line x1="120" y1="50" x2="120" y2="30" class="image" />
    <line x1="140" y1="50" x2="140" y2="30" class="image" />
    <line x1="80" y1="100" x2="60" y2="80" class="image" />
    <line x1="120" y1="100" x2="140" y2="80" class="image" />
    <line x1="100" y1="150" x2="100" y2="130" class="image" />
    <line x1="120" y1="150" x2="120" y2="130" class="image" />
    <line x1="140" y1="150" x2="140" y2="130" class="image" />
    <line x1="80" y1="200" x2="60" y2="180" class="image" />
    <line x1="120" y1="200" x2="140" y2="180" class="image" />
  </g>
</svg>