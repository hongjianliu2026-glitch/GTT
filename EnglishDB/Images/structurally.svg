<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">structurally</text>
  <text x="50" y="120" class="subtitle">[ˈstrʌktʃərəli] adv. 结构上地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> struct (建造) + -ure (名词后缀) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的建筑，"建造(struct)"
    <tspan x="50" dy="25">过程中，每个部分都严格按照结构(structural)要求进行，</tspan>
    <tspan x="50" dy="25">最终形成了一个坚固的结构(structurally)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The building was structurally sound, but aesthetically outdated.
  </text>
  <text x="50" y="310" class="content">
    这座建筑结构上很稳固，但外观上已经过时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building structure -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- Foundation -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Roof -->
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="20" x2="175" y2="0" class="image" />
    <line x1="350" y1="20" x2="175" y2="0" class="image" />
  </g>
</svg>