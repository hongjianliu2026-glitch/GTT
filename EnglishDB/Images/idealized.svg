<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">idealized</text>
  <text x="50" y="120" class="subtitle">[aɪˈdiːəlaɪzd] v. 理想化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ide(a) (思想) + -lize (使…化)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"使思想(ide-a)变成理想(ideal)"
    <tspan x="50" dy="25">化的形象，这个过程就是理想化(idealized)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She idealized her father, seeing him as a perfect hero.
  </text>
  <text x="50" y="310" class="content">
    她理想化了她的父亲，把他看作一个完美的英雄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="130" class="image" />
    <line x1="175" y1="150" x2="205" y2="130" class="image" />
    <line x1="175" y1="180" x2="145" y2="200" class="image" />
    <line x1="175" y1="180" x2="205" y2="200" class="image" />
    <!-- Idealized image -->
    <circle cx="175" cy="100" r="25" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="130" x2="175" y2="170" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="150" x2="145" y2="130" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="150" x2="205" y2="130" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="170" x2="145" y2="190" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="170" x2="205" y2="190" class="image" stroke-dasharray="5,5" />
  </g>
</svg>