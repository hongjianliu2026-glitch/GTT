<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">two-year-old</text>
  <text x="50" y="120" class="subtitle">[tuː jɪr əʊld] n. 两岁大的孩子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> two (二) + year (年) + old (老的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个两岁大的孩子，"两岁(two-year)"
    <tspan x="50" dy="25">意味着他已经在这个世界上度过了两个年头，</tspan>
    <tspan x="50" dy="25">正处于充满好奇和探索的阶段。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two-year-old child was full of energy and curiosity.
  </text>
  <text x="50" y="310" class="content">
    那个两岁大的孩子充满了活力和好奇心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />
    <!-- Ball -->
    <circle cx="120" cy="150" r="20" class="image" />
    <!-- Diaper -->
    <rect x="20" y="180" width="60" height="20" class="image" />
  </g>
</svg>