<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sift</text>
  <text x="50" y="120" class="subtitle">[sɪft] v. 筛选，过滤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sift (来自古英语 siftan，意为筛选)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在用筛子"筛选(sift)"谷物，
    <tspan x="50" dy="25">把杂质和好的谷物分开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sifted through the documents to find the important information.
  </text>
  <text x="50" y="310" class="content">
    她筛选了文件以找到重要信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sifter -->
    <rect x="0" y="0" width="300" height="100" class="image" />
    <!-- Grain -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />
    <circle cx="140" cy="50" r="10" class="image" />
    <circle cx="170" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="230" cy="50" r="10" class="image" />
    <circle cx="260" cy="50" r="10" class="image" />
    <circle cx="290" cy="50" r="10" class="image" />
    <!-- Farmer -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>