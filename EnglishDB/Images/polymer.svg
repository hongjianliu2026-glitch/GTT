<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polymer</text>
  <text x="50" y="120" class="subtitle">[ˈpɒlɪmə] n. 聚合物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poly- (多) + mer (部分)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的分子，由许多"小部分(mer)"
    <tspan x="50" dy="25">连接在一起，形成了一个"多部分(poly-mer)"的聚合物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plastic bottle is made of a polymer called PET.
  </text>
  <text x="50" y="310" class="content">
    这个塑料瓶是由一种叫做PET的聚合物制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large molecule -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Connecting lines -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <!-- Small parts -->
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <!-- Connecting lines -->
    <line x1="60" y1="110" x2="60" y2="140" class="image" />
    <line x1="160" y1="110" x2="160" y2="140" class="image" />
    <line x1="260" y1="110" x2="260" y2="140" class="image" />
  </g>
</svg>