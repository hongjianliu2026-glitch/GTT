<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">labor-intensive</text>
  <text x="50" y="120" class="subtitle">[ˈleɪbər ɪnˈtensɪv] adj. 劳动密集型的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> labor (劳动) + intensive (密集的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂里，"劳动(labor)"
    <tspan x="50" dy="25">密集(intensive)地进行生产，工人们忙碌地穿梭在机器之间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The textile industry is highly labor-intensive.
  </text>
  <text x="50" y="310" class="content">
    纺织业是高度劳动密集型的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Workers -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="90" y2="70" class="image" />

    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="190" y2="70" class="image" />

    <circle cx="250" cy="50" r="15" class="image" />
    <line x1="250" y1="65" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <line x1="250" y1="80" x2="290" y2="70" class="image" />

    <!-- Machines -->
    <rect x="50" y="120" width="50" height="50" class="image" />
    <rect x="150" y="120" width="50" height="50" class="image" />
    <rect x="250" y="120" width="50" height="50" class="image" />
  </g>
</svg>