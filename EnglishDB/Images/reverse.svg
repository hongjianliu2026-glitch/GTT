<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reverse</text>
  <text x="50" y="120" class="subtitle">[rɪˈvɜːrs] v. 反转，颠倒；n. 反面，相反</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + vers (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在道路上行驶，突然"向后转(re-vers)"，
    <tspan x="50" dy="25">整个方向都颠倒了，这就是reverse的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She reversed the car into the garage.
  </text>
  <text x="50" y="310" class="content">
    她把车倒进了车库。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Car -->
    <rect x="150" y="50" width="50" height="30" class="image" />
    <circle cx="160" cy="90" r="10" class="image" />
    <circle cx="240" cy="90" r="10" class="image" />
    <!-- Arrows -->
    <line x1="175" y1="50" x2="175" y2="20" class="image" />
    <line x1="175" y1="20" x2="165" y2="30" class="image" />
    <line x1="175" y1="20" x2="185" y2="30" class="image" />
    <line x1="175" y1="50" x2="165" y2="40" class="image" />
    <line x1="175" y1="50" x2="185" y2="40" class="image" />
  </g>
</svg>