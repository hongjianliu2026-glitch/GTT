<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">patronize</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪtrənaɪz] v. 资助，光顾；以高人一等的态度对待</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> patr (父亲) + -on (人) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"父亲般的人(patr-on)"走进一家小店，
    <tspan x="50" dy="25">他不仅"资助(patronize)"了这家店，还以高高在上的态度对待店主。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt patronized by her boss's comments.
  </text>
  <text x="50" y="310" class="content">
    她觉得老板的评论让她感到被高人一等地对待。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Storefront -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Patron -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Shopkeeper -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="350" y2="120" class="image" />
    <!-- Patron's attitude -->
    <line x1="20" y1="90" x2="300" y2="90" class="image" />
    <line x1="20" y1="90" x2="10" y2="80" class="image" />
    <line x1="20" y1="90" x2="10" y2="100" class="image" />
  </g>
</svg>