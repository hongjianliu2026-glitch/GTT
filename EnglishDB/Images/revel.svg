<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">revel</text>
  <text x="50" y="120" class="subtitle">[ˈrevəl] v. 狂欢，陶醉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + vel (面纱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在狂欢节上，"再次揭开(re-vel)"
    <tspan x="50" dy="25">面纱，尽情享受，陶醉其中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They reveled in the joy of the festival.
  </text>
  <text x="50" y="310" class="content">
    他们在节日中尽情享受欢乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Party scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Dancing -->
    <line x1="50" y1="115" x2="100" y2="130" class="image" />
    <line x1="100" y1="115" x2="150" y2="130" class="image" />
    <line x1="150" y1="115" x2="200" y2="130" class="image" />
    <!-- Veil -->
    <line x1="200" y1="80" x2="250" y2="80" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="120" x2="250" y2="120" class="image" />
  </g>
</svg>