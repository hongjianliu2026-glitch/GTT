<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alloy</text>
  <text x="50" y="120" class="subtitle">[ˈælɔɪ] n. 合金；v. 使成合金</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (使) + loy (结合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两种金属被"使(al-)"在一起，"结合(loy)"
    <tspan x="50" dy="25">形成了一种新的、更强的合金(alloy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Steel is an alloy of iron and carbon.
  </text>
  <text x="50" y="310" class="content">
    钢是铁和碳的合金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two metals -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <!-- Combined metal -->
    <rect x="240" y="0" width="100" height="100" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="50" x2="120" y2="50" class="image" />
    <line x1="110" y1="40" x2="120" y2="50" class="image" />
    <line x1="110" y1="60" x2="120" y2="50" class="image" />
    <line x1="220" y1="50" x2="240" y2="50" class="image" />
    <line x1="230" y1="40" x2="240" y2="50" class="image" />
    <line x1="230" y1="60" x2="240" y2="50" class="image" />
  </g>
</svg>