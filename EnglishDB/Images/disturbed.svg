<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disturbed</text>
  <text x="50" y="120" class="subtitle">[dɪˈstɜːrbt] adj. 被打扰的，不安的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + turb (扰乱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人正在安静地读书，突然一只巨大的手从天而降，"分开(dis-)"
    <tspan x="50" dy="25">并"扰乱(turb)"了他的平静，他变得"不安(disturbed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loud noise outside disturbed my concentration.
  </text>
  <text x="50" y="310" class="content">
    外面的噪音打扰了我的注意力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person reading -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Book -->
    <rect x="90" y="90" width="100" height="80" class="image" />
    <!-- Disturbing hand -->
    <line x1="250" y1="50" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="130" class="image" />
    <line x1="200" y1="150" x2="220" y2="130" class="image" />
  </g>
</svg>