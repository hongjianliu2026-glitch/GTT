<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crazy</text>
  <text x="50" y="120" class="subtitle">[ˈkreɪzi] adj. 疯狂的，狂热的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cera (蜡) + -zy (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被蜡(cera)封住了嘴巴，无法正常表达，
    <tspan x="50" dy="25">结果变得"疯狂(crazy)"，行为异常。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She went crazy when she lost her phone.
  </text>
  <text x="50" y="310" class="content">
    她丢了手机后变得疯狂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="50" cy="50" r="40" class="image" />
    <!-- Mouth covered with wax -->
    <rect x="30" y="70" width="40" height="10" class="image" />
    <!-- Crazy eyes -->
    <circle cx="35" cy="40" r="5" class="image" />
    <circle cx="65" cy="40" r="5" class="image" />
    <!-- Crazy hair -->
    <line x1="10" y1="20" x2="90" y2="20" class="image" />
    <line x1="20" y1="10" x2="80" y2="10" class="image" />
    <line x1="30" y1="0" x2="70" y2="0" class="image" />
  </g>
</svg>