<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">emission</text>
  <text x="50" y="120" class="subtitle">[ɪˈmɪʃn] n. 排放，散发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (向外) + miss (发送) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂的烟囱，"向外发送(e-miss)"
    <tspan x="50" dy="25">大量的烟雾，这些烟雾就是排放(emission)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory's emission levels are strictly regulated.
  </text>
  <text x="50" y="310" class="content">
    这家工厂的排放水平受到严格监管。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="20" width="50" height="160" class="image" />
    <!-- Smoke -->
    <line x1="175" y1="20" x2="125" y2="0" class="image" />
    <line x1="175" y1="20" x2="225" y2="0" class="image" />
    <line x1="175" y1="40" x2="100" y2="20" class="image" />
    <line x1="175" y1="40" x2="250" y2="20" class="image" />
    <line x1="175" y1="60" x2="75" y2="40" class="image" />
    <line x1="175" y1="60" x2="275" y2="40" class="image" />
  </g>
</svg>