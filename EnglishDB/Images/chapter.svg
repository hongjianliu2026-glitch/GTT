<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chapter</text>
  <text x="50" y="120" class="subtitle">[ˈtʃæptər] n. 章节，回</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chap (头) + -ter (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本书的每一章节都有一个"头(chap)"，
    <tspan x="50" dy="25">就像每个章节都有一个标题，引领着故事的发展。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The book is divided into ten chapters.
  </text>
  <text x="50" y="310" class="content">
    这本书被分成了十个章节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chapter title -->
    <rect x="50" y="20" width="250" height="40" class="image" />
    <text x="60" y="50" class="content">Chapter 1</text>
    <!-- Pages -->
    <line x1="50" y1="70" x2="300" y2="70" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="130" x2="300" y2="130" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
  </g>
</svg>