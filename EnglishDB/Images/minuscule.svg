<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">minuscule</text>
  <text x="50" y="120" class="subtitle">[mɪˈnʌskjuːl] adj. 极小的，微小的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> min- (小) + -uscule (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蚂蚁在巨大的草叶上，"小到几乎看不见(min-uscule)"，
    <tspan x="50" dy="25">这就是minuscule的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The error was minuscule, but it still caused a big problem.
  </text>
  <text x="50" y="310" class="content">
    这个错误虽然微小，但仍然引发了大问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large leaf -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Small ant -->
    <circle cx="50" cy="100" r="5" class="image" />
    <line x1="50" y1="105" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="40" y2="130" class="image" />
    <line x1="50" y1="120" x2="60" y2="130" class="image" />
    <line x1="50" y1="110" x2="45" y2="100" class="image" />
    <line x1="50" y1="110" x2="55" y2="100" class="image" />
  </g>
</svg>