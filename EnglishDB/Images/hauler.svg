<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hauler</text>
  <text x="50" y="120" class="subtitle">[ˈhɔːlər] n. 拖运者，运输工具</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> haul (拖，拉) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆巨大的卡车，"拖着(haul)"
    <tspan x="50" dy="25">沉重的货物，它就是运输工具(hauler)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hauler transported the heavy machinery to the construction site.
  </text>
  <text x="50" y="310" class="content">
    拖运者将重型机械运输到建筑工地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Truck body -->
    <rect x="0" y="50" width="300" height="100" class="image" />
    <!-- Truck cabin -->
    <rect x="20" y="30" width="80" height="40" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="160" r="20" class="image" />
    <circle cx="250" cy="160" r="20" class="image" />
    <!-- Cargo -->
    <rect x="100" y="70" width="180" height="60" class="image" />
    <!-- Lines on the cargo -->
    <line x1="110" y1="80" x2="270" y2="80" class="image" />
    <line x1="110" y1="100" x2="270" y2="100" class="image" />
    <line x1="110" y1="120" x2="270" y2="120" class="image" />
  </g>
</svg>