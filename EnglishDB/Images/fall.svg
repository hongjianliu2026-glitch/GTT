<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fall</text>
  <text x="50" y="120" class="subtitle">[fɔːl] v. 落下，跌倒；n. 秋天</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fall (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片树叶从树上"落下(fall)"，
    <tspan x="50" dy="25">缓缓飘落到地面，这就是秋天的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leaves fall in autumn.
  </text>
  <text x="50" y="310" class="content">
    树叶在秋天落下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="150" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="75" y1="25" x2="125" y2="75" class="image" />
    <line x1="125" y1="25" x2="75" y2="75" class="image" />
    <!-- Falling leaf -->
    <path d="M100,150 Q100,200 150,200" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
  </g>
</svg>