<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neural</text>
  <text x="50" y="120" class="subtitle">[ˈnjʊərəl] adj. 神经的，神经系统的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neur (神经) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的神经网络，"神经(neur)"
    <tspan x="50" dy="25">像蜘蛛网一样遍布全身，这就是神经系统的(neural)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The neural pathways in the brain are complex.
  </text>
  <text x="50" y="310" class="content">
    大脑中的神经通路非常复杂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Neural network -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="50" y1="70" x2="100" y2="130" class="image" />
    <line x1="150" y1="70" x2="100" y2="130" class="image" />
    <!-- Brain -->
    <ellipse cx="250" cy="100" rx="50" ry="70" class="image" />
    <!-- Neural connections -->
    <line x1="250" y1="30" x2="200" y2="100" class="image" />
    <line x1="250" y1="30" x2="300" y2="100" class="image" />
    <line x1="250" y1="170" x2="200" y2="100" class="image" />
    <line x1="250" y1="170" x2="300" y2="100" class="image" />
  </g>
</svg>