<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4ECF7; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .magenta { fill: #FF00FF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">magenta</text>
  <text x="50" y="120" class="subtitle">[məˈdʒɛntə] n. 洋红色，品红色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自意大利语 "magenta"，指一种深红色染料，得名于1859年意大利的马真塔战役。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场激烈的战役中，士兵们的旗帜和战袍都被染成了鲜艳的洋红色(magenta)，这种颜色成为了胜利的象征。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist used magenta to highlight the central figure in the painting.
  </text>
  <text x="50" y="310" class="content">
    艺术家使用洋红色来突出画中的中心人物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battle scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flag -->
    <rect x="50" y="20" width="100" height="160" class="magenta" />
    <!-- Soldier -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
    <!-- Magenta color -->
    <rect x="160" y="20" width="100" height="160" class="magenta" />
  </g>
</svg>