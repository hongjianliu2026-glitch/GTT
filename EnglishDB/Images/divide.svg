<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">divide</text>
  <text x="50" y="120" class="subtitle">[dɪˈvaɪd] v. 分开，划分</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + vide (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人站在一条线的两边，"分开看(di-vide)"
    <tspan x="50" dy="25">不同的风景，这就是划分(divide)的概念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The river divides the city into two parts.
  </text>
  <text x="50" y="310" class="content">
    这条河将城市分成了两部分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Line dividing the scene -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person on the left -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="90" y2="70" class="image" />
    <!-- Person on the right -->
    <circle cx="300" cy="50" r="15" class="image" />
    <line x1="300" y1="65" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="280" y2="130" class="image" />
    <line x1="300" y1="100" x2="320" y2="130" class="image" />
    <line x1="300" y1="80" x2="340" y2="70" class="image" />
  </g>
</svg>