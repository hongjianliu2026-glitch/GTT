<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glee</text>
  <text x="50" y="120" class="subtitle">[ɡliː] n. 欢乐，高兴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gle (欢乐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光下跳跃，脸上洋溢着"欢乐(gle)"的笑容，
    <tspan x="50" dy="25">这种心情就是glee。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children's glee was contagious.
  </text>
  <text x="50" y="310" class="content">
    孩子们的欢乐是会传染的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Person jumping -->
    <circle cx="200" cy="150" r="20" class="image" fill="#2ECC71" />
    <line x1="200" y1="170" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="180" y2="300" class="image" />
    <line x1="200" y1="250" x2="220" y2="300" class="image" />
    <line x1="200" y1="200" x2="240" y2="180" class="image" />
    <line x1="200" y1="200" x2="160" y2="180" class="image" />
    <!-- Smile -->
    <path d="M185,160 Q195,155 205,160" class="image" />
    <path d="M185,160 Q195,165 205,160" class="image" />
  </g>
</svg>