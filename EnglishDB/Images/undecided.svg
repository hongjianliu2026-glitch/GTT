<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undecided</text>
  <text x="50" y="120" class="subtitle">[ˌʌndɪˈsaɪdɪd] adj. 未决定的，犹豫不决的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + decide (决定) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两个门之间，"无法决定(un-decided)"
    <tspan x="50" dy="25">该走哪条路，脸上写满了犹豫和困惑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is still undecided about which college to attend.
  </text>
  <text x="50" y="310" class="content">
    她还在犹豫该上哪所大学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two doors -->
    <rect x="0" y="0" width="150" height="300" class="image" />
    <rect x="200" y="0" width="150" height="300" class="image" />
    <!-- Person in between -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="150" y2="300" class="image" />
    <line x1="175" y1="250" x2="200" y2="300" class="image" />
    <line x1="175" y1="200" x2="125" y2="180" class="image" />
    <line x1="175" y1="200" x2="225" y2="180" class="image" />
  </g>
</svg>