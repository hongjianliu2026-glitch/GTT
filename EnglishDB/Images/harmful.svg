<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .danger { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">harmful</text>
  <text x="50" y="120" class="subtitle">[ˈhɑrmfəl] adj. 有害的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> harm (伤害) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色警告标志，上面写着"有害(harmful)"，
    <tspan x="50" dy="25">提醒人们远离危险区域。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Smoking is harmful to your health.
  </text>
  <text x="50" y="310" class="content">
    吸烟对你的健康有害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warning sign -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="175,20 330,180 20,180" class="danger" />
    <text x="175" y="120" text-anchor="middle" class="danger" font-size="60">!</text>
    <text x="175" y="160" text-anchor="middle" class="content" font-size="24">harmful</text>
  </g>
</svg>