<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rebound</text>
  <text x="50" y="120" class="subtitle">[rɪˈbaʊnd] v. 弹回，反弹；n. 反弹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + bound (跳)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个篮球从地面"跳回(re-bound)"到空中，
    <tspan x="50" dy="25">这个动作就是反弹(rebound)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ball rebounded off the wall and hit him.
  </text>
  <text x="50" y="310" class="content">
    球从墙上反弹回来，打中了他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Basketball -->
    <circle cx="100" cy="160" r="20" class="image" />
    <!-- Rebound path -->
    <path d="M100 160 Q150 100 200 160" class="image" />
    <!-- Rebound arrow -->
    <polygon points="200,160 190,150 190,170" class="image" />
  </g>
</svg>