<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">circuit</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrkɪt] n. 电路，环路</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> circu- (环) + it (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个电子在电路中"环形行走(circu-it)"，
    <tspan x="50" dy="25">形成一个闭合的环路，这就是电路(circuit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The circuit was designed to control the flow of electricity.
  </text>
  <text x="50" y="310" class="content">
    这个电路被设计用来控制电流的流动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circuit path -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Electron -->
    <circle cx="100" cy="20" r="10" class="image" fill="#E74C3C" />
    <!-- Arrow indicating movement -->
    <path d="M 100 20 L 180 100 L 100 180 L 20 100 Z" class="image" fill="none" stroke="#2980B9" />
    <polygon points="100,20 180,100 100,180 20,100" class="image" fill="#2980B9" />
  </g>
</svg>