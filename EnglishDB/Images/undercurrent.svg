<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undercurrent</text>
  <text x="50" y="120" class="subtitle">[ˈʌndərˌkɜːrənt] n. 潜流，暗流</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在下面) + current (流动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流表面平静，但水下却有一股强劲的"潜流(undercurrent)"，
    <tspan x="50" dy="25">这股力量在暗中推动着一切，就像隐藏的力量在背后运作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There was an undercurrent of tension at the meeting.
  </text>
  <text x="50" y="310" class="content">
    会议中有一股紧张的暗流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River surface -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Undercurrent -->
    <line x1="50" y1="100" x2="50" y2="200" class="image" />
    <line x1="100" y1="100" x2="100" y2="200" class="image" />
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <line x1="200" y1="100" x2="200" y2="200" class="image" />
    <line x1="250" y1="100" x2="250" y2="200" class="image" />
    <line x1="300" y1="100" x2="300" y2="200" class="image" />
    <!-- Fish in the undercurrent -->
    <path d="M70,150 Q100,120 130,150 T190,150" class="image" />
    <path d="M100,150 Q130,180 160,150 T220,150" class="image" />
  </g>
</svg>