<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polluter</text>
  <text x="50" y="120" class="subtitle">[pəˈlutər] n. 污染者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pollute (污染) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂排放黑烟，"污染者(polluter)"
    <tspan x="50" dy="25">正在破坏环境，黑烟滚滚，污染空气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory was fined for being a major polluter.
  </text>
  <text x="50" y="310" class="content">
    这家工厂因成为主要污染者而被罚款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="20" width="50" height="160" class="image" />
    <!-- Smoke -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <line x1="165" y1="30" x2="165" y2="10" class="image" />
    <line x1="185" y1="30" x2="185" y2="10" class="image" />
    <line x1="155" y1="40" x2="155" y2="20" class="image" />
    <line x1="195" y1="40" x2="195" y2="20" class="image" />
    <!-- Polluter -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>