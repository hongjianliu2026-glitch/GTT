<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plural</text>
  <text x="50" y="120" class="subtitle">[ˈplʊrəl] adj. 复数的；n. 复数</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plu- (多) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"多(plu-)"字，它分裂成无数个小字，
    <tspan x="50" dy="25">每个小字都代表一个复数(plural)的概念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plural form of "child" is "children."
  </text>
  <text x="50" y="310" class="content">
    "child"的复数形式是"children"。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large "多" character -->
    <text x="0" y="100" font-size="150" class="image" fill="#34495E">多</text>
    <!-- Splitting lines -->
    <line x1="50" y1="150" x2="150" y2="250" class="image" />
    <line x1="50" y1="150" x2="250" y2="250" class="image" />
    <line x1="50" y1="150" x2="350" y2="250" class="image" />
    <!-- Small "多" characters -->
    <text x="150" y="250" font-size="50" class="image" fill="#34495E">多</text>
    <text x="250" y="250" font-size="50" class="image" fill="#34495E">多</text>
    <text x="350" y="250" font-size="50" class="image" fill="#34495E">多</text>
  </g>
</svg>