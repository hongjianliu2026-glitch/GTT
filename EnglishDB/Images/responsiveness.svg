<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">responsiveness</text>
  <text x="50" y="120" class="subtitle">[rɪˈspɒnsɪvnəs] n. 响应性，反应能力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + spon(d) (承诺) + -ive (形容词后缀) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个用户在点击按钮后，系统立即"回应(re-spon-d)"，
    <tspan x="50" dy="25">这种快速反应的能力就是响应性(responsiveness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The website's responsiveness greatly improved after the update.
  </text>
  <text x="50" y="310" class="content">
    更新后，网站的响应性大大提高了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- User clicking button -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Button -->
    <rect x="100" y="90" width="80" height="40" class="image" />
    <text x="120" y="120" class="content" fill="#34495E">Click</text>
    <!-- Response -->
    <line x1="180" y1="110" x2="250" y2="110" class="image" />
    <line x1="250" y1="110" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="150" class="image" />
    <line x1="250" y1="150" x2="270" y2="150" class="image" />
    <text x="260" y="140" class="content" fill="#34495E">Response</text>
  </g>
</svg>