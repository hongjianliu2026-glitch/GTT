<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supervision</text>
  <text x="50" y="120" class="subtitle">[ˌsuːpərˈvɪʒən] n. 监督，管理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (在上面) + vision (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个领导站在高处，"从上面看(super-vision)"
    <tspan x="50" dy="25">着整个团队的工作，确保一切井然有序，这就是监督(supervision)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was completed under his close supervision.
  </text>
  <text x="50" y="310" class="content">
    这个项目在他的密切监督下完成了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leader -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Team -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="90" y2="150" class="image" />
    <line x1="100" y1="130" x2="110" y2="150" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="140" y2="150" class="image" />
    <line x1="150" y1="130" x2="160" y2="150" class="image" />
    <!-- Vision line -->
    <line x1="20" y1="100" x2="150" y2="100" class="image" />
    <polygon points="20,100 150,100 85,50" class="image" />
  </g>
</svg>