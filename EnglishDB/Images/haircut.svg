<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">haircut</text>
  <text x="50" y="120" class="subtitle">[ˈherˌkʌt] n. 理发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hair (头发) + cut (剪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个理发师拿着剪刀，"剪下(cut)"
    <tspan x="50" dy="25">顾客的"头发(hair)"，这就是一个理发(haircut)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He got a new haircut yesterday.
  </text>
  <text x="50" y="310" class="content">
    他昨天剪了个新发型。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hair -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" />
    <path d="M50 70 Q100 40 150 70 T250 70" class="image" />
    <path d="M50 90 Q100 60 150 90 T250 90" class="image" />
    <!-- Barber -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="250" class="image" />
    <line x1="150" y1="220" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="120" y2="180" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />
    <!-- Scissors -->
    <line x1="140" y1="100" x2="160" y2="100" class="image" />
    <line x1="140" y1="100" x2="130" y2="90" class="image" />
    <line x1="160" y1="100" x2="170" y2="90" class="image" />
  </g>
</svg>