<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seductive</text>
  <text x="50" y="120" class="subtitle">[sɪˈdʌktɪv] adj. 诱人的，有魅力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seduct (引诱) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满诱惑的场景，一个"引诱(seduct)"
    <tspan x="50" dy="25">者用迷人的眼神和动作，让人无法抗拒，</tspan>
    <tspan x="50" dy="25">这就是"诱人的(seductive)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The seductive aroma of freshly baked bread filled the air.
  </text>
  <text x="50" y="310" class="content">
    新鲜出炉的面包的诱人香气弥漫在空气中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" fill="#000" />
    <!-- Lashes -->
    <line x1="50" y1="50" x2="100" y2="80" class="image" />
    <line x1="150" y1="50" x2="100" y2="80" class="image" />
    <line x1="50" y1="70" x2="100" y2="90" class="image" />
    <line x1="150" y1="70" x2="100" y2="90" class="image" />
    <!-- Lips -->
    <path d="M50,150 Q100,200 150,150" class="image" />
    <path d="M50,150 Q100,180 150,150" class="image" />
  </g>
</svg>