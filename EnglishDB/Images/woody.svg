<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .wood { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">woody</text>
  <text x="50" y="120" class="subtitle">[ˈwʊdi] adj. 木质的，木头的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wood (木头) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林，到处都是"木头(wood)"，
    <tspan x="50" dy="25">这些木头构成了一个"木质的(woody)"世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The furniture in the room was made of woody materials.
  </text>
  <text x="50" y="310" class="content">
    房间里的家具是用木质材料制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="0" y="0" width="100" height="200" class="wood" />
    <!-- Branches -->
    <line x1="50" y1="0" x2="0" y2="-50" class="image" />
    <line x1="50" y1="0" x2="100" y2="-50" class="image" />
    <line x1="50" y1="0" x2="25" y2="-100" class="image" />
    <line x1="50" y1="0" x2="75" y2="-100" class="image" />
    <!-- Leaves -->
    <circle cx="50" cy="-120" r="20" class="wood" />
    <circle cx="25" cy="-140" r="15" class="wood" />
    <circle cx="75" cy="-140" r="15" class="wood" />
  </g>
</svg>