<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plaza</text>
  <text x="50" y="120" class="subtitle">[ˈplɑːzə] n. 广场，市场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plac (平地) + -a (表示地点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的平地(plac)，上面挤满了人，
    <tspan x="50" dy="25">这就是一个热闹的广场(plaza)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The festival was held in the town plaza.
  </text>
  <text x="50" y="310" class="content">
    节日在镇上的广场举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plaza outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="70" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="300" cy="70" r="10" class="image" />
    <!-- Market stalls -->
    <rect x="50" y="100" width="50" height="50" class="image" />
    <rect x="150" y="100" width="50" height="50" class="image" />
    <rect x="250" y="100" width="50" height="50" class="image" />
  </g>
</svg>