<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-day</text>
  <text x="50" y="120" class="subtitle">[θriː deɪ] adj. 三天的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + day (天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个日历上，"三天(three-day)"
    <tspan x="50" dy="25">被特别标注出来，形成了一个三天的活动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They planned a three-day trip to the mountains.
  </text>
  <text x="50" y="310" class="content">
    他们计划了一次为期三天的山间旅行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Days -->
    <rect x="50" y="20" width="80" height="80" class="image" />
    <rect x="150" y="20" width="80" height="80" class="image" />
    <rect x="250" y="20" width="80" height="80" class="image" />
    <!-- Day numbers -->
    <text x="90" y="65" class="content">1</text>
    <text x="190" y="65" class="content">2</text>
    <text x="290" y="65" class="content">3</text>
    <!-- Highlight -->
    <rect x="50" y="20" width="280" height="80" class="image" stroke-dasharray="5,5" />
  </g>
</svg>