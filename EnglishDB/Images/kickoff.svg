<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kickoff</text>
  <text x="50" y="120" class="subtitle">[ˈkɪkˌɒf] n. 开始，开球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kick (踢) + off (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场足球比赛，裁判吹响哨子，球员"踢(kick)"球"离开(off)"，
    <tspan x="50" dy="25">比赛正式开始，这就是"开球(kickoff)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kickoff of the game was delayed due to rain.
  </text>
  <text x="50" y="310" class="content">
    由于下雨，比赛的开球时间被推迟了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Football field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Football -->
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Player kicking the ball -->
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="180" y1="100" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="160" y2="130" class="image" />
    <line x1="180" y1="150" x2="200" y2="130" class="image" />
    <!-- Referee -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>