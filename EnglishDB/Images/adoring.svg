<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adoring</text>
  <text x="50" y="120" class="subtitle">[əˈdɔːrɪŋ] adj. 崇拜的，爱慕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + or (说) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"朝向(ad-)"另一个人，"说(or)"出
    <tspan x="50" dy="25">无数赞美的话语，这种状态就是"崇拜的(adoring)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked at him with adoring eyes.
  </text>
  <text x="50" y="310" class="content">
    她用崇拜的眼神看着他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 31.7C10 15.1 22.7 2.4 39.3 2.4S68.7 15.1 68.7 31.7C68.7 48.3 39.3 61 39.3 61S10 48.3 10 31.7Z" class="image" fill="#E91E63" />
    <!-- Eyes -->
    <circle cx="25" cy="25" r="5" class="image" fill="#FFFFFF" />
    <circle cx="53" cy="25" r="5" class="image" fill="#FFFFFF" />
    <!-- Mouth -->
    <path d="M34 40 Q39 45 44 40" class="image" fill="none" stroke="#FFFFFF" stroke-width="2" />
  </g>
</svg>