<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swan</text>
  <text x="50" y="120" class="subtitle">[swɒn] n. 天鹅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "swan"，与古英语 "swan" 相关。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只优雅的天鹅在湖面上滑行，它的白色羽毛在阳光下闪闪发光，
    <tspan x="50" dy="25">仿佛在水中绘制出一幅美丽的画卷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The swan gracefully glided across the lake.
  </text>
  <text x="50" y="310" class="content">
    天鹅优雅地滑过湖面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Swan body -->
    <ellipse cx="150" cy="150" rx="100" ry="50" class="image" />
    <!-- Swan neck -->
    <path d="M 150 150 Q 200 50 250 150" class="image" />
    <!-- Swan head -->
    <circle cx="250" cy="150" r="20" class="image" />
    <!-- Swan wings -->
    <path d="M 50 150 Q 100 100 150 150" class="image" />
    <path d="M 250 150 Q 300 100 350 150" class="image" />
    <!-- Water -->
    <rect x="0" y="200" width="400" height="50" class="image" />
  </g>
</svg>