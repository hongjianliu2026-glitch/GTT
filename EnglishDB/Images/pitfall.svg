<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pitfall</text>
  <text x="50" y="120" class="subtitle">[ˈpɪtfɔːl] n. 陷阱，隐患</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pit (坑) + fall (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在森林中行走，不小心"掉进(fall)"
    <tspan x="50" dy="25">一个隐藏的"坑(pit)"里，这就是一个陷阱(pitfall)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Be careful of the pitfalls in the project plan.
  </text>
  <text x="50" y="310" class="content">
    小心项目计划中的隐患。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hidden pit -->
    <rect x="50" y="50" width="150" height="100" class="image" />
    <!-- Person falling -->
    <circle cx="125" cy="40" r="15" class="image" />
    <line x1="125" y1="55" x2="125" y2="100" class="image" />
    <line x1="125" y1="70" x2="100" y2="80" class="image" />
    <line x1="125" y1="70" x2="150" y2="80" class="image" />
    <!-- Ground -->
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
  </g>
</svg>