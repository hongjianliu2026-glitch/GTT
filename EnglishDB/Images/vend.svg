<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vend</text>
  <text x="50" y="120" class="subtitle">[vɛnd] v. 出售，贩卖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ven- (来) + -d (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人带着商品"走来(ven-)"，
    <tspan x="50" dy="25">然后"出售(vend)"给顾客，这就是贩卖的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The street vendor sells fresh fruits every morning.
  </text>
  <text x="50" y="310" class="content">
    这个街头小贩每天早上都卖新鲜水果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vendor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Cart -->
    <rect x="50" y="80" width="100" height="50" class="image" />
    <!-- Fruits -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="90" cy="100" r="10" class="image" />
    <circle cx="110" cy="100" r="10" class="image" />
    <!-- Customer -->
    <circle cx="180" cy="100" r="15" class="image" />
    <line x1="180" y1="115" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="160" y2="180" class="image" />
    <line x1="180" y1="150" x2="200" y2="180" class="image" />
    <line x1="180" y1="130" x2="210" y2="120" class="image" />
    <!-- Money -->
    <rect x="160" y="80" width="20" height="10" class="image" />
    <rect x="190" y="80" width="20" height="10" class="image" />
  </g>
</svg>