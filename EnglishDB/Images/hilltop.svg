<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hilltop</text>
  <text x="50" y="120" class="subtitle">[ˈhɪltɑp] n. 山顶，山丘顶部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hill (山) + top (顶部)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在山顶(hilltop)，俯瞰整个山谷，
    <tspan x="50" dy="25">仿佛站在世界的顶端，感受着风的呼啸和自然的壮丽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We reached the hilltop just as the sun was setting.
  </text>
  <text x="50" y="310" class="content">
    我们到达山顶时，太阳正好在落山。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hill -->
    <path d="M 0 200 Q 100 100 200 200 L 200 300 L 0 300 Z" class="image" fill="#82CA9D" />
    <!-- Top of the hill -->
    <circle cx="100" cy="150" r="20" class="image" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="100" cy="130" r="10" class="image" fill="#34495E" />
    <line x1="100" y1="140" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="90" y2="200" class="image" />
    <line x1="100" y1="170" x2="110" y2="200" class="image" />
    <line x1="100" y1="150" x2="80" y2="160" class="image" />
    <line x1="100" y1="150" x2="120" y2="160" class="image" />
  </g>
</svg>