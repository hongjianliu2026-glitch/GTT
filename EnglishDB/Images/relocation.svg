<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relocation</text>
  <text x="50" y="120" class="subtitle">[ˌriːloʊˈkeɪʃn] n. 重新安置，迁移</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + loc (地方) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人搬家，"再次(re-)"
    <tspan x="50" dy="25">找到一个新的"地方(loc)"，这就是重新安置(relocation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to relocate its headquarters to a bigger city.
  </text>
  <text x="50" y="310" class="content">
    公司决定将其总部迁往一个更大的城市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old house -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Moving truck -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <line x1="220" y1="20" x2="330" y2="20" class="image" />
    <line x1="220" y1="40" x2="330" y2="40" class="image" />
    <line x1="220" y1="60" x2="330" y2="60" class="image" />
    <line x1="220" y1="80" x2="330" y2="80" class="image" />
    <!-- New house -->
    <rect x="400" y="0" width="150" height="100" class="image" />
    <line x1="420" y1="20" x2="530" y2="20" class="image" />
    <line x1="420" y1="40" x2="530" y2="40" class="image" />
    <line x1="420" y1="60" x2="530" y2="60" class="image" />
    <line x1="420" y1="80" x2="530" y2="80" class="image" />
    <!-- Arrows -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="155" y1="50" x2="155" y2="40" class="image" />
    <line x1="155" y1="50" x2="155" y2="60" class="image" />
    <line x1="350" y1="50" x2="400" y2="50" class="image" />
    <line x1="355" y1="50" x2="355" y2="40" class="image" />
    <line x1="355" y1="50" x2="355" y2="60" class="image" />
  </g>
</svg>