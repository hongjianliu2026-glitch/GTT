<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slug</text>
  <text x="50" y="120" class="subtitle">[slʌɡ] n. 蛞蝓，缓慢移动的人或物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slug (源自中古英语，意为“缓慢移动的生物”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蛞蝓(slug)在草地上缓慢爬行，它的黏液拖出一条长长的痕迹，
    <tspan x="50" dy="25">就像一个缓慢移动的人在时间的长河中留下的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man moved like a slug, taking his time to cross the street.
  </text>
  <text x="50" y="310" class="content">
    那位老人像蛞蝓一样缓慢移动，花了很长时间才穿过街道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Slug body -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <!-- Slug head -->
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Slug trail -->
    <path d="M 50 100 Q 75 120 100 100 Q 125 80 150 100 Q 175 120 200 100" class="image" />
  </g>
</svg>