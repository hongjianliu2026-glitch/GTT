<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bug</text>
  <text x="50" y="120" class="subtitle">[bʌɡ] n. 虫子，程序错误</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bug (原意为小虫子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个程序员在电脑前，突然发现屏幕上出现了一个"小虫子(bug)"，
    <tspan x="50" dy="25">原来这是一个程序错误，需要修复。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The programmer spent hours debugging the code.
  </text>
  <text x="50" y="310" class="content">
    程序员花了几个小时调试代码。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Computer screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bug -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="85" y2="180" class="image" />
    <line x1="100" y1="150" x2="115" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Programmer -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="185" y2="180" class="image" />
    <line x1="200" y1="150" x2="215" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>