<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pompous</text>
  <text x="50" y="120" class="subtitle">[ˈpɒmpəs] adj. 自负的，浮夸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pomp (壮丽，盛况) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个自负的人，穿着华丽的衣服，"壮丽(pomp)"
    <tspan x="50" dy="25">地走在街上，显得非常浮夸(pompous)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His pompous speech made everyone uncomfortable.
  </text>
  <text x="50" y="310" class="content">
    他自负的演讲让每个人都感到不舒服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with fancy clothes -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="80" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="80" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Fancy clothes -->
    <rect x="20" y="70" width="60" height="50" class="image" /> <!-- Jacket -->
    <rect x="30" y="120" width="40" height="40" class="image" /> <!-- Pants -->
    <!-- Crown -->
    <circle cx="50" cy="30" r="10" class="image" />
    <line x1="40" y1="30" x2="60" y2="30" class="image" />
    <line x1="45" y1="20" x2="55" y2="20" class="image" />
    <line x1="50" y1="10" x2="50" y2="30" class="image" />
  </g>
</svg>