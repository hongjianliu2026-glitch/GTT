<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loser</text>
  <text x="50" y="120" class="subtitle">[ˈluːzər] n. 失败者，输家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lose (失去) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在比赛中"失去(lose)"了所有机会，
    <tspan x="50" dy="25">最终成为了失败者(loser)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He felt like a loser after the game.
  </text>
  <text x="50" y="310" class="content">
    比赛后他感觉自己像个失败者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Sad face -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <path d="M45 110 Q50 120 55 110" class="image" />
    <!-- Broken heart -->
    <path d="M100 100 Q120 80 140 100 Q120 120 100 100" class="image" />
    <line x1="100" y1="100" x2="140" y2="100" class="image" />
  </g>
</svg>