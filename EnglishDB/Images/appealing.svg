<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">appealing</text>
  <text x="50" y="120" class="subtitle">[əˈpiːlɪŋ] adj. 吸引人的，有感染力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (向) + peal (呼喊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者站在台上，"向(ap-)"
    <tspan x="50" dy="25">观众"呼喊(peal)"，他的话语充满了</tspan>
    <tspan x="50" dy="25">感染力，吸引了所有人的注意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new product design is very appealing to young consumers.
  </text>
  <text x="50" y="310" class="content">
    这个新产品的设计对年轻消费者非常有吸引力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Audience -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <!-- Sound waves -->
    <line x1="20" y1="90" x2="100" y2="90" class="image" />
    <line x1="20" y1="80" x2="150" y2="80" class="image" />
    <line x1="20" y1="70" x2="200" y2="70" class="image" />
    <line x1="20" y1="60" x2="250" y2="60" class="image" />
    <line x1="20" y1="50" x2="300" y2="50" class="image" />
  </g>
</svg>