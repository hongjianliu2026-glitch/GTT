<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eyesight</text>
  <text x="50" y="120" class="subtitle">[ˈaɪsaɪt] n. 视力，目力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eye (眼睛) + sight (视力)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在远处，用他的"眼睛(eye)"
    <tspan x="50" dy="25">和"视力(sight)"来观察远处的物体，</tspan>
    <tspan x="50" dy="25">这就是他的"eyesight"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His eyesight is so good that he can see the details from a long distance.
  </text>
  <text x="50" y="310" class="content">
    他的视力非常好，可以从远处看到细节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eyes -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="150" cy="50" r="30" class="image" />
    <!-- Person -->
    <line x1="100" y1="100" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <line x1="100" y1="150" x2="50" y2="130" class="image" />
    <line x1="100" y1="150" x2="150" y2="130" class="image" />
    <!-- Distance -->
    <line x1="200" y1="50" x2="300" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <line x1="300" y1="50" x2="300" y2="100" class="image" />
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <circle cx="250" cy="75" r="10" class="image" />
  </g>
</svg>