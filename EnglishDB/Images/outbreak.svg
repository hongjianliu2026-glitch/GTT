<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outbreak</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtbreɪk] n. 爆发，突然发生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (向外) + break (打破)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个平静的村庄，突然"向外打破(out-break)"
    <tspan x="50" dy="25">了宁静，爆发了一场突如其来的灾难。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outbreak of the virus caused panic in the city.
  </text>
  <text x="50" y="310" class="content">
    病毒的爆发在城市中引起了恐慌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- House -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Tree -->
    <line x1="200" y1="20" x2="200" y2="100" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Explosion -->
    <circle cx="150" cy="120" r="40" class="image" fill="#E74C3C" />
    <line x1="150" y1="80" x2="150" y2="160" class="image" />
    <line x1="110" y1="120" x2="190" y2="120" class="image" />
    <line x1="130" y1="100" x2="170" y2="140" class="image" />
    <line x1="130" y1="140" x2="170" y2="100" class="image" />
  </g>
</svg>