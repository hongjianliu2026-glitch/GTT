<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dominion</text>
  <text x="50" y="120" class="subtitle">[dəˈmɪniən] n. 统治，主权；领土</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> domin (统治) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国王站在高塔上，"统治(domin)"
    <tspan x="50" dy="25">着他的领土(dominion)，整个王国都在他的掌控之中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The king extended his dominion over neighboring lands.
  </text>
  <text x="50" y="310" class="content">
    国王将他的统治扩展到了邻近的土地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tower -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- King -->
    <circle cx="75" cy="150" r="15" class="image" />
    <line x1="75" y1="165" x2="75" y2="190" class="image" />
    <line x1="75" y1="190" x2="60" y2="220" class="image" />
    <line x1="75" y1="190" x2="90" y2="220" class="image" />
    <line x1="75" y1="175" x2="100" y2="165" class="image" />
    <!-- Crown -->
    <polygon points="60,130 90,130 100,140 75,150 50,140" class="image" />
    <!-- Land -->
    <rect x="160" y="180" width="200" height="20" class="image" />
    <line x1="160" y1="190" x2="360" y2="190" class="image" />
    <line x1="160" y1="200" x2="360" y2="200" class="image" />
    <line x1="160" y1="210" x2="360" y2="210" class="image" />
  </g>
</svg>