<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mostly</text>
  <text x="50" y="120" class="subtitle">[ˈmoʊstli] adv. 主要地，大部分</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> most (大部分) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕，"大部分(most)"
    <tspan x="50" dy="25">被吃掉了，只剩下一点点，这就是"mostly"的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake was mostly eaten by the kids.
  </text>
  <text x="50" y="310" class="content">
    蛋糕大部分被孩子们吃掉了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eaten part -->
    <path d="M 100 100 A 80 80 0 0 1 180 100 L 100 100" class="image" />
    <!-- Remaining part -->
    <path d="M 100 100 A 80 80 0 0 0 20 100 L 100 100" class="image" />
    <!-- Fork -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="225" y2="125" class="image" />
    <line x1="250" y1="100" x2="225" y2="75" class="image" />
  </g>
</svg>