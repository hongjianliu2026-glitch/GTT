<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">politics</text>
  <text x="50" y="120" class="subtitle">[ˈpɒlətɪks] n. 政治，政治学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poli- (多) + tics (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满"多(poli)"种声音和观点的房间，
    <tspan x="50" dy="25">人们在这里讨论和辩论，这就是"政治(politics)"的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is majoring in politics at university.
  </text>
  <text x="50" y="310" class="content">
    她在大学主修政治学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Speech bubbles -->
    <path d="M50 70 Q40 90 50 110" class="image" />
    <path d="M100 70 Q90 90 100 110" class="image" />
    <path d="M150 70 Q140 90 150 110" class="image" />
    <path d="M200 70 Q190 90 200 110" class="image" />
    <path d="M250 70 Q240 90 250 110" class="image" />
  </g>
</svg>