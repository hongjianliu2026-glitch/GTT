<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cocktail</text>
  <text x="50" y="120" class="subtitle">[ˈkɒkteɪl] n. 鸡尾酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cock (公鸡) + tail (尾巴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只公鸡(cock)的尾巴(tail)上插着各种水果和装饰，
    <tspan x="50" dy="25">这些装饰就像鸡尾酒(cocktail)上的装饰一样，色彩缤纷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ordered a fruity cocktail at the bar.
  </text>
  <text x="50" y="310" class="content">
    她在酒吧点了一杯果味鸡尾酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cocktail glass -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="25" y="20" width="100" height="160" class="image" />
    <!-- Cocktail liquid -->
    <rect x="30" y="30" width="90" height="140" fill="#FFD700" />
    <!-- Fruit decorations -->
    <circle cx="75" cy="180" r="15" fill="#FF6347" /> <!-- Strawberry -->
    <circle cx="50" cy="160" r="10" fill="#FFA500" /> <!-- Orange -->
    <circle cx="100" cy="160" r="10" fill="#FFFF00" /> <!-- Lemon -->
    <!-- Cocktail stirrer -->
    <line x1="75" y1="20" x2="75" y2="150" class="image" />
  </g>
</svg>