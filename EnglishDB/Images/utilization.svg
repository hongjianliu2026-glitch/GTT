<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">utilization</text>
  <text x="50" y="120" class="subtitle">[ˌjuːtɪlaɪˈzeɪʃn] n. 利用，使用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> util (有用) + -ization (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工具箱，里面装满了各种工具，
    <tspan x="50" dy="25">"利用(util)"这些工具来完成各种任务，</tspan>
    <tspan x="50" dy="25">这就是工具的"使用(utilization)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The utilization of renewable energy is crucial for sustainability.
  </text>
  <text x="50" y="310" class="content">
    可再生能源的利用对可持续发展至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toolbox -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tools -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="110" x2="100" y2="110" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <!-- Hammer -->
    <line x1="120" y1="50" x2="120" y2="100" class="image" />
    <line x1="120" y1="100" x2="150" y2="80" class="image" />
    <!-- Screwdriver -->
    <line x1="170" y1="50" x2="170" y2="100" class="image" />
    <line x1="170" y1="100" x2="200" y2="80" class="image" />
    <!-- Wrench -->
    <line x1="220" y1="50" x2="220" y2="100" class="image" />
    <line x1="220" y1="100" x2="250" y2="80" class="image" />
  </g>
</svg>