<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">barn</text>
  <text x="50" y="120" class="subtitle">[bɑːrn] n. 谷仓，牲口棚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bar- (木头) + -n (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的木头(bar-)结构，里面堆满了谷物和牲畜，这就是一个谷仓(barn)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer stored his hay in the barn.
  </text>
  <text x="50" y="310" class="content">
    农夫把干草存放在谷仓里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Barn structure -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Roof -->
    <polygon points="0,0 150,100 300,0" class="image" />
    <!-- Door -->
    <rect x="120" y="100" width="60" height="100" class="image" />
    <!-- Hay bales -->
    <rect x="20" y="120" width="40" height="60" class="image" />
    <rect x="80" y="120" width="40" height="60" class="image" />
    <rect x="140" y="120" width="40" height="60" class="image" />
    <rect x="200" y="120" width="40" height="60" class="image" />
    <rect x="260" y="120" width="40" height="60" class="image" />
  </g>
</svg>