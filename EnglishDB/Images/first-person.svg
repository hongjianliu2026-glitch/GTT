<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">first-person</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrst ˈpɜːrsən] n. 第一人称</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> first (第一) + person (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你站在镜子前，"第一人称(first-person)"
    <tspan x="50" dy="25">视角下，你看到的只有自己，仿佛整个世界</tspan>
    <tspan x="50" dy="25">都围绕着你旋转。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The novel is written in the first-person perspective.
  </text>
  <text x="50" y="310" class="content">
    这本小说是以第一人称视角写的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="150" x2="125" y2="200" class="image" />
    <line x1="175" y1="150" x2="225" y2="200" class="image" />
    <line x1="175" y1="120" x2="125" y2="110" class="image" />
    <line x1="175" y1="120" x2="225" y2="110" class="image" />
  </g>
</svg>