<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twenty-seven</text>
  <text x="50" y="120" class="subtitle">[ˈtwɛnti-ˈsɛvən] n. 二十七</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twenty (二十) + seven (七)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“27”，像一座高塔一样耸立在城市中，
    <tspan x="50" dy="25">每个数字都像是一个巨大的积木，堆叠在一起，形成了一个</tspan>
    <tspan x="50" dy="25">令人印象深刻的数字塔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are twenty-seven students in the class.
  </text>
  <text x="50" y="310" class="content">
    班里有二十七个学生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Number 2 -->
    <path d="M0 0 L20 0 L20 20 L0 20 Z" class="image" />
    <path d="M10 20 L20 40 L0 40 Z" class="image" />
    <!-- Number 7 -->
    <path d="M30 0 L50 0 L50 20 L30 40 L30 0 Z" class="image" />
    <!-- Tower -->
    <rect x="0" y="50" width="50" height="150" class="image" />
    <rect x="10" y="70" width="30" height="130" class="image" />
    <rect x="20" y="90" width="10" height="110" class="image" />
  </g>
</svg>