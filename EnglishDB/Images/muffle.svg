<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">muffle</text>
  <text x="50" y="120" class="subtitle">[ˈmʌfəl] v. 使声音减弱，压抑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> muff (手套) + -le (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人戴着厚厚的手套(muff)，试图捂住(muffle)
    <tspan x="50" dy="25">自己的嘴巴，声音因此变得低沉而模糊。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She muffled her laughter with her hand.
  </text>
  <text x="50" y="310" class="content">
    她用手捂住嘴，笑声变得低沉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gloves -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="170" y="20" width="100" height="100" class="image" />
    <!-- Hand covering mouth -->
    <circle cx="120" cy="100" r="30" class="image" />
    <line x1="120" y1="130" x2="120" y2="180" class="image" />
    <line x1="120" y1="180" x2="90" y2="210" class="image" />
    <line x1="120" y1="180" x2="150" y2="210" class="image" />
    <line x1="120" y1="160" x2="180" y2="150" class="image" />
  </g>
</svg>