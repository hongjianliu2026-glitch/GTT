<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">baby</text>
  <text x="50" y="120" class="subtitle">[ˈbeɪbi] n. 婴儿，宝贝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bab (婴儿的咿呀声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个可爱的婴儿在摇篮里，发出"咿呀(bab)"的声音，
    <tspan x="50" dy="25">这个声音就是"baby"的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby is sleeping peacefully in the crib.
  </text>
  <text x="50" y="310" class="content">
    婴儿在婴儿床里安静地睡着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Crib -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Baby -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="150" y1="150" x2="120" y2="140" class="image" />
    <line x1="150" y1="150" x2="180" y2="140" class="image" />
    <line x1="150" y1="180" x2="120" y2="200" class="image" />
    <line x1="150" y1="180" x2="180" y2="200" class="image" />
  </g>
</svg>