<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">attrition</text>
  <text x="50" y="120" class="subtitle">[əˈtrɪʃən] n. 磨损，消耗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> at- (加强) + trit (摩擦) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块石头在河床上，"不断摩擦(trit)"
    <tspan x="50" dy="25">，最终被"磨损(attrition)"成小石子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The attrition of the rock over time created a smooth pebble.
  </text>
  <text x="50" y="310" class="content">
    随着时间的推移，岩石的磨损形成了一块光滑的鹅卵石。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large rock -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Smaller rocks -->
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <!-- River bed -->
    <line x1="50" y1="150" x2="350" y2="150" class="image" />
    <line x1="50" y1="160" x2="350" y2="160" class="image" />
    <line x1="50" y1="170" x2="350" y2="170" class="image" />
    <!-- Water flow -->
    <line x1="50" y1="155" x2="350" y2="155" class="image" />
    <line x1="50" y1="165" x2="350" y2="165" class="image" />
  </g>
</svg>