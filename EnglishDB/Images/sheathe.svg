<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sheathe</text>
  <text x="50" y="120" class="subtitle">[ʃiːð] v. 插入鞘中，覆盖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sheath (鞘)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把剑被"插入(sheathe)"剑鞘中，
    <tspan x="50" dy="25">剑鞘保护剑身，同时也象征着安全与保护。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He carefully sheathed his sword after the battle.
  </text>
  <text x="50" y="310" class="content">
    战斗结束后，他小心地将剑插入鞘中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sword in sheath -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="250" height="100" class="image" />
    <line x1="70" y1="70" x2="280" y2="70" class="image" />
    <line x1="70" y1="90" x2="250" y2="90" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="130" x2="240" y2="130" class="image" />
    <!-- Sword -->
    <rect x="100" y="20" width="150" height="180" class="image" />
    <line x1="175" y1="20" x2="175" y2="200" class="image" />
  </g>
</svg>