<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preacher</text>
  <text x="50" y="120" class="subtitle">[ˈpriːtʃər] n. 传教士，布道者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + ach (说) + er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个传教士站在讲台上，"提前说(pre-ach)"
    <tspan x="50" dy="25">教义，他就是布道者(preacher)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The preacher delivered a powerful sermon.
  </text>
  <text x="50" y="310" class="content">
    传教士发表了一场有力的布道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pulpit -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Preacher -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Microphone -->
    <line x1="180" y1="80" x2="220" y2="80" class="image" />
    <line x1="200" y1="80" x2="200" y2="60" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
  </g>
</svg>