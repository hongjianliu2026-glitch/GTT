<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">niche</text>
  <text x="50" y="120" class="subtitle">[niːʃ] n. 壁龛，合适的位置</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nidus (巢) + -che (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小鸟在墙上找到一个"小巢(nidus-che)"，
    <tspan x="50" dy="25">这个位置非常适合它，这就是它的"壁龛(niche)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found her niche in the art world.
  </text>
  <text x="50" y="310" class="content">
    她在艺术界找到了自己的位置。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Niche -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Bird -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>