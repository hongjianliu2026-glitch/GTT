<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">no-fly</text>
  <text x="50" y="120" class="subtitle">[ˈnoʊˌflaɪ] adj. 禁飞的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> no- (不) + fly (飞)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色"X"标记在飞机跑道上，
    <tspan x="50" dy="25">表示"禁止飞行(no-fly)"，任何飞机都不能起飞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The area was declared a no-fly zone due to military operations.
  </text>
  <text x="50" y="310" class="content">
    由于军事行动，该区域被宣布为禁飞区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Runway -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Plane -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <!-- Red X -->
    <line x1="200" y1="20" x2="300" y2="180" class="image" style="stroke: #E74C3C; stroke-width: 5;" />
    <line x1="200" y1="180" x2="300" y2="20" class="image" style="stroke: #E74C3C; stroke-width: 5;" />
  </g>
</svg>