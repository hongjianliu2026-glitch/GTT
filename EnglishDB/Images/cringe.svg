<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cringe</text>
  <text x="50" y="120" class="subtitle">[krɪndʒ] v. 畏缩，感到尴尬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cring (弯曲) + -e (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在看到尴尬的场景时，身体不由自主地"弯曲(cring)"，
    <tspan x="50" dy="25">仿佛在躲避什么，这就是"畏缩(cringe)"的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cringed when she heard her old voicemail.
  </text>
  <text x="50" y="310" class="content">
    当她听到自己以前的语音留言时，她感到很尴尬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person cringing -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Cringing effect -->
    <line x1="50" y1="120" x2="30" y2="140" class="image" /> <!-- Left shoulder -->
    <line x1="50" y1="120" x2="70" y2="140" class="image" /> <!-- Right shoulder -->
    <line x1="50" y1="160" x2="30" y2="170" class="image" /> <!-- Left knee -->
    <line x1="50" y1="160" x2="70" y2="170" class="image" /> <!-- Right knee -->
  </g>
</svg>