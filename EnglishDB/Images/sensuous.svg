<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sensuous</text>
  <text x="50" y="120" class="subtitle">[ˈsɛnʃuəs] adj. 感官的，感觉上的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sens (感觉) + -uous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在创作一幅画，"通过感觉(sens)"
    <tspan x="50" dy="25">和感官(sensuous)捕捉色彩和纹理，创造出令人陶醉的艺术品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sensuous melody of the violin captivated the audience.
  </text>
  <text x="50" y="310" class="content">
    小提琴的感官旋律吸引了观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Painting -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Colors -->
    <circle cx="80" cy="50" r="10" fill="#FF5733" />
    <circle cx="120" cy="50" r="10" fill="#33FF57" />
    <circle cx="160" cy="50" r="10" fill="#3357FF" />
    <circle cx="200" cy="50" r="10" fill="#FF33A6" />
    <circle cx="240" cy="50" r="10" fill="#A633FF" />
    <!-- Texture -->
    <line x1="70" y1="80" x2="280" y2="80" class="image" />
    <line x1="70" y1="110" x2="250" y2="110" class="image" />
    <line x1="70" y1="140" x2="270" y2="140" class="image" />
    <line x1="70" y1="170" x2="240" y2="170" class="image" />
  </g>
</svg>