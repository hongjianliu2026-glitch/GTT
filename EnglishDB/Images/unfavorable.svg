<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfavorable</text>
  <text x="50" y="120" class="subtitle">[ʌnˈfeɪvərəbl] adj. 不利的，不顺利的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + favor (喜爱) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个乌云密布的天气，"不(un-)"
    <tspan x="50" dy="25">被喜爱(favor)"的情景，这就是不利的(unfavorable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weather forecast is unfavorable for the outdoor event.
  </text>
  <text x="50" y="310" class="content">
    天气预报对户外活动不利。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Rain drops -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <line x1="250" y1="150" x2="250" y2="200" class="image" />
    <!-- Sun behind cloud -->
    <circle cx="300" cy="50" r="40" class="image" />
    <!-- Sun rays -->
    <line x1="300" y1="10" x2="300" y2="20" class="image" />
    <line x1="300" y1="90" x2="300" y2="100" class="image" />
    <line x1="260" y1="50" x2="250" y2="50" class="image" />
    <line x1="340" y1="50" x2="350" y2="50" class="image" />
  </g>
</svg>