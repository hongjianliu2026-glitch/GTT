<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delta</text>
  <text x="50" y="120" class="subtitle">[ˈdeltə] n. 三角洲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> delta (源自希腊字母Δ，形状像三角洲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条大河在入海处，河水冲积形成了一个三角形的"三角洲(delta)"，
    <tspan x="50" dy="25">这个形状就像希腊字母Δ一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Nile delta is one of the most fertile regions in Egypt.
  </text>
  <text x="50" y="310" class="content">
    尼罗河三角洲是埃及最肥沃的地区之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- River -->
    <line x1="0" y1="200" x2="300" y2="200" class="image" />
    <!-- Delta shape -->
    <polygon points="300,200 250,150 250,250" class="image" />
    <!-- Greek letter Δ -->
    <text x="320" y="220" font-size="80" fill="#7F8C8D">Δ</text>
  </g>
</svg>