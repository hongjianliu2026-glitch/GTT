<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">firewood</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪrwʊd] n. 柴火</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fire (火) + wood (木头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的夜晚，"火(fire)"在壁炉中燃烧，
    <tspan x="50" dy="25">旁边堆满了"木头(wood)"，这些木头就是用来生火的柴火(firewood)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gathered firewood for the campfire.
  </text>
  <text x="50" y="310" class="content">
    他为篝火收集了柴火。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fireplace -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fire -->
    <path d="M50 20 L100 20 Q125 70 100 120 L50 120 Q25 70 50 20" class="image" fill="#FF6347" />
    <!-- Wood logs -->
    <rect x="150" y="20" width="100" height="160" class="image" fill="#8B4513" />
    <rect x="270" y="20" width="100" height="160" class="image" fill="#8B4513" />
  </g>
</svg>