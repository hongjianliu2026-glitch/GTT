<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fellowship</text>
  <text x="50" y="120" class="subtitle">[ˈfeloʊʃɪp] n. 伙伴关系，友谊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fellow (伙伴) + -ship (状态或性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群伙伴(fellow)围坐在篝火旁，分享故事和笑声，
    <tspan x="50" dy="25">这种亲密无间的关系(ship)就是友谊(fellowship)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They formed a strong fellowship during the expedition.
  </text>
  <text x="50" y="310" class="content">
    他们在探险过程中建立了深厚的友谊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Campfire -->
    <circle cx="175" cy="100" r="30" class="image" fill="#FFA500" />
    <!-- People around the campfire -->
    <circle cx="100" cy="150" r="20" class="image" fill="#FFD700" />
    <circle cx="250" cy="150" r="20" class="image" fill="#FFD700" />
    <circle cx="175" cy="200" r="20" class="image" fill="#FFD700" />
    <!-- Arms and legs -->
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="250" y1="170" x2="230" y2="200" class="image" />
    <line x1="250" y1="170" x2="270" y2="200" class="image" />
    <line x1="175" y1="220" x2="155" y2="250" class="image" />
    <line x1="175" y1="220" x2="195" y2="250" class="image" />
    <!-- Smiling faces -->
    <circle cx="100" cy="140" r="5" class="image" fill="#000" />
    <circle cx="250" cy="140" r="5" class="image" fill="#000" />
    <circle cx="175" cy="190" r="5" class="image" fill="#000" />
    <path d="M90 160 Q100 170 110 160" class="image" fill="none" stroke="#000" />
    <path d="M240 160 Q250 170 260 160" class="image" fill="none" stroke="#000" />
    <path d="M165 210 Q175 220 185 210" class="image" fill="none" stroke="#000" />
  </g>
</svg>