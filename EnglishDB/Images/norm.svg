<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">norm</text>
  <text x="50" y="120" class="subtitle">[nɔːrm] n. 标准，规范</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> norm (规则，标准)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的尺子，上面刻着"标准(norm)"，
    <tspan x="50" dy="25">每个人都在用它来衡量自己的行为，确保符合规范。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It is important to follow the social norms.
  </text>
  <text x="50" y="310" class="content">
    遵循社会规范是很重要的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ruler -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Marks on the ruler -->
    <line x1="20" y1="0" x2="20" y2="50" class="image" />
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="80" y1="0" x2="80" y2="50" class="image" />
    <line x1="110" y1="0" x2="110" y2="50" class="image" />
    <line x1="140" y1="0" x2="140" y2="50" class="image" />
    <line x1="170" y1="0" x2="170" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <line x1="230" y1="0" x2="230" y2="50" class="image" />
    <line x1="260" y1="0" x2="260" y2="50" class="image" />
    <line x1="290" y1="0" x2="290" y2="50" class="image" />
    <line x1="320" y1="0" x2="320" y2="50" class="image" />
    <!-- Person measuring -->
    <circle cx="150" cy="80" r="15" class="image" />
    <line x1="150" y1="95" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="130" y2="160" class="image" />
    <line x1="150" y1="130" x2="170" y2="160" class="image" />
    <line x1="150" y1="110" x2="180" y2="100" class="image" />
  </g>
</svg>