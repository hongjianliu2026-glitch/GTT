<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flower { fill: #FF6F61; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tulip</text>
  <text x="50" y="120" class="subtitle">[ˈtjuːlɪp] n. 郁金香</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自土耳其语 "tulbend"，意为 "穆斯林头巾"，
    <tspan x="50" dy="25">因其形状类似郁金香花而得名。</tspan>
  </text>

  <!-- Story -->
  <text x="50" y="230" class="story">
    想象一个土耳其人戴着头巾，头巾的形状像一朵郁金香，
    <tspan x="50" dy="25">于是这种花就被命名为 "tulip"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The garden was filled with colorful tulips.
  </text>
  <text x="50" y="330" class="content">
    花园里开满了五颜六色的郁金香。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tulip flower -->
    <path d="M 0 100 Q 50 0 100 100 L 100 200 L 0 200 Z" class="flower" />
    <!-- Headscarf -->
    <path d="M 150 100 Q 200 0 250 100 L 250 200 L 150 200 Z" class="image" />
    <!-- Person -->
    <circle cx="200" cy="250" r="30" class="image" />
    <line x1="200" y1="280" x2="200" y2="350" class="image" />
    <line x1="200" y1="350" x2="170" y2="400" class="image" />
    <line x1="200" y1="350" x2="230" y2="400" class="image" />
    <line x1="200" y1="300" x2="150" y2="320" class="image" />
    <line x1="200" y1="300" x2="250" y2="320" class="image" />
  </g>
</svg>