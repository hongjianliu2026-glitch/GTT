<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anti-American</text>
  <text x="50" y="120" class="subtitle">[ˌænti əˈmerɪkən] adj. 反美的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对) + American (美国的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在美国国旗前，双手交叉，
    <tspan x="50" dy="25">脸上带着不满的表情，这就是"反美的(anti-American)"形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His anti-American remarks caused a stir in the community.
  </text>
  <text x="50" y="310" class="content">
    他的反美言论在社区引起了轰动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- American flag -->
    <rect x="0" y="0" width="300" height="150" class="image" />
    <rect x="0" y="0" width="300" height="30" fill="#B22234" />
    <rect x="0" y="30" width="300" height="30" fill="#FFFFFF" />
    <rect x="0" y="60" width="300" height="30" fill="#B22234" />
    <rect x="0" y="90" width="300" height="30" fill="#FFFFFF" />
    <rect x="0" y="120" width="300" height="30" fill="#B22234" />
    <rect x="0" y="0" width="120" height="90" fill="#3C3B6E" />
    <circle cx="20" cy="20" r="10" fill="#FFFFFF" />
    <circle cx="40" cy="20" r="10" fill="#FFFFFF" />
    <circle cx="60" cy="20" r="10" fill="#FFFFFF" />
    <circle cx="80" cy="20" r="10" fill="#FFFFFF" />
    <circle cx="100" cy="20" r="10" fill="#FFFFFF" />
    <circle cx="20" cy="40" r="10" fill="#FFFFFF" />
    <circle cx="40" cy="40" r="10" fill="#FFFFFF" />
    <circle cx="60" cy="40" r="10" fill="#FFFFFF" />
    <circle cx="80" cy="40" r="10" fill="#FFFFFF" />
    <circle cx="100" cy="40" r="10" fill="#FFFFFF" />

    <!-- Person with crossed arms -->
    <circle cx="150" cy="100" r="20" fill="#7F8C8D" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="210" class="image" />
    <line x1="150" y1="180" x2="170" y2="210" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
  </g>
</svg>