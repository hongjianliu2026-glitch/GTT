<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sulfur</text>
  <text x="50" y="120" class="subtitle">[ˈsʌlfər] n. 硫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sul- (硫) + -fur (来自拉丁语 sulfur)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的炼金术士，手持一个装满"硫(sul-)"的瓶子，
    <tspan x="50" dy="25">瓶子里的硫燃烧着蓝色的火焰，散发出刺鼻的气味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The volcano emitted a large amount of sulfur dioxide.
  </text>
  <text x="50" y="310" class="content">
    火山喷发出大量的二氧化硫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Alchemist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Bottle -->
    <rect x="50" y="80" width="50" height="100" class="image" />
    <!-- Flame -->
    <polygon points="75,80 100,80 88,50" style="fill:orange;stroke:red;stroke-width:2" />
    <polygon points="75,80 100,80 88,60" style="fill:yellow;stroke:red;stroke-width:2" />
  </g>
</svg>