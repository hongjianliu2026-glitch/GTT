<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flicker { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flickering</text>
  <text x="50" y="120" class="subtitle">[ˈflɪkərɪŋ] adj. 闪烁的，忽隐忽现的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flick (轻弹) + -er (表示反复动作) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一盏老旧的灯泡，"轻弹(flick)"着发出微弱的光，
    <tspan x="50" dy="25">光亮忽隐忽现，就像是在跳舞一样，这就是闪烁(flickering)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flickering candlelight created a romantic atmosphere.
  </text>
  <text x="50" y="310" class="content">
    闪烁的烛光营造出浪漫的氛围。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light bulb -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Flickering light -->
    <circle cx="100" cy="100" r="40" class="flicker" opacity="0.5" />
    <circle cx="100" cy="100" r="30" class="flicker" opacity="0.7" />
    <circle cx="100" cy="100" r="20" class="flicker" opacity="0.9" />
  </g>
</svg>