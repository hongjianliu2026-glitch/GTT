<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sensory</text>
  <text x="50" y="120" class="subtitle">[ˈsɛnsəri] adj. 感觉的，感官的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sens (感觉) + -ory (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满各种感官刺激的世界，"感觉(sens)"
    <tspan x="50" dy="25">无处不在，每一步都充满了感官的体验(sensory)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new restaurant is designed to stimulate the sensory experience.
  </text>
  <text x="50" y="310" class="content">
    这家新餐厅的设计旨在刺激感官体验。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sensory symbols -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Eye -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="50" y1="80" x2="30" y2="70" class="image" />
    <line x1="50" y1="80" x2="70" y2="70" class="image" />

    <circle cx="150" cy="50" r="20" class="image" /> <!-- Ear -->
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="150" y1="80" x2="130" y2="70" class="image" />
    <line x1="150" y1="80" x2="170" y2="70" class="image" />

    <circle cx="250" cy="50" r="20" class="image" /> <!-- Nose -->
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <line x1="250" y1="80" x2="230" y2="70" class="image" />
    <line x1="250" y1="80" x2="270" y2="70" class="image" />

    <circle cx="350" cy="50" r="20" class="image" /> <!-- Mouth -->
    <line x1="350" y1="70" x2="350" y2="100" class="image" />
    <line x1="350" y1="80" x2="330" y2="70" class="image" />
    <line x1="350" y1="80" x2="370" y2="70" class="image" />

    <!-- Sensory world -->
    <rect x="0" y="120" width="400" height="100" class="image" />
    <line x1="20" y1="140" x2="380" y2="140" class="image" />
    <line x1="20" y1="160" x2="380" y2="160" class="image" />
    <line x1="20" y1="180" x2="380" y2="180" class="image" />
    <line x1="20" y1="200" x2="380" y2="200" class="image" />
  </g>
</svg>