<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mantel</text>
  <text x="50" y="120" class="subtitle">[ˈmæntl] n. 壁炉架</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (手) + tel (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的壁炉，壁炉架(mantel)上摆放着各种工具，
    <tspan x="50" dy="25">这些工具都是用来"手(man)"工制作的，壁炉架就像是一个"工具(tel)"的展示台。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed a vase on the mantel.
  </text>
  <text x="50" y="310" class="content">
    她把花瓶放在了壁炉架上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fireplace -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mantel -->
    <rect x="50" y="20" width="250" height="40" class="image" />
    <!-- Tools on the mantel -->
    <line x1="70" y1="40" x2="70" y2="60" class="image" />
    <line x1="100" y1="40" x2="100" y2="60" class="image" />
    <line x1="130" y1="40" x2="130" y2="60" class="image" />
    <line x1="160" y1="40" x2="160" y2="60" class="image" />
    <line x1="190" y1="40" x2="190" y2="60" class="image" />
    <line x1="220" y1="40" x2="220" y2="60" class="image" />
    <line x1="250" y1="40" x2="250" y2="60" class="image" />
  </g>
</svg>