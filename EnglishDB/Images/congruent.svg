<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">congruent</text>
  <text x="50" y="120" class="subtitle">[ˈkɒŋɡruənt] adj. 一致的，和谐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + gru (生长) + ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两棵树，它们"一起生长(con-gru-ent)"，
    <tspan x="50" dy="25">它们的枝叶完美地交织在一起，形成了一幅和谐的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two plans were congruent with each other.
  </text>
  <text x="50" y="310" class="content">
    这两个计划彼此一致。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree 1 -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />

    <!-- Tree 2 -->
    <line x1="150" y1="0" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="200" class="image" />
    <line x1="150" y1="150" x2="170" y2="200" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />

    <!-- Connecting branches -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="40" y1="120" x2="160" y2="120" class="image" />
  </g>
</svg>