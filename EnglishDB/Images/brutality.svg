<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brutality</text>
  <text x="50" y="120" class="subtitle">[bruːˈtælɪti] n. 残忍，野蛮行为</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brut- (野兽) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只野兽(brut-)在森林中展现出极端的残忍行为，
    <tspan x="50" dy="25">这种行为就是野蛮(brutality)的体现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The brutality of the war was hard to witness.
  </text>
  <text x="50" y="310" class="content">
    战争的残忍让人难以目睹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beast -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Blood splatter -->
    <circle cx="100" cy="80" r="10" class="image" fill="#B03A2E" />
    <circle cx="120" cy="90" r="10" class="image" fill="#B03A2E" />
    <circle cx="110" cy="110" r="10" class="image" fill="#B03A2E" />
  </g>
</svg>