<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conceit</text>
  <text x="50" y="120" class="subtitle">[kənˈsiːt] n. 自负，自大</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (强调) + ceit (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"强调地拿(con-ceit)"着一面镜子，
    <tspan x="50" dy="25">不停地照自己，表现出极度的自负(conceit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His conceit made him unpopular among his peers.
  </text>
  <text x="50" y="310" class="content">
    他的自负使他在同龄人中不受欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <circle cx="100" cy="75" r="60" class="image" />
    <!-- Person -->
    <circle cx="100" cy="250" r="30" class="image" />
    <line x1="100" y1="280" x2="100" y2="350" class="image" />
    <line x1="100" y1="350" x2="70" y2="400" class="image" />
    <line x1="100" y1="350" x2="130" y2="400" class="image" />
    <line x1="100" y1="320" x2="50" y2="300" class="image" />
    <line x1="100" y1="320" x2="150" y2="300" class="image" />
    <!-- Hand holding mirror -->
    <line x1="100" y1="280" x2="100" y2="150" class="image" />
  </g>
</svg>