<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">first-rate</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrst reɪt] adj. 一流的，极好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> first (第一) + rate (等级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的奖杯，上面写着"第一等级(first-rate)"，
    <tspan x="50" dy="25">象征着最高品质和卓越。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The performance was first-rate.
  </text>
  <text x="50" y="310" class="content">
    表演非常出色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trophy -->
    <path d="M50 50 L100 50 L125 100 L75 100 Z" class="image" />
    <rect x="60" y="100" width="80" height="100" class="image" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="75" y1="250" x2="125" y2="250" class="image" />
    <!-- First-rate label -->
    <text x="70" y="150" class="highlight">First-rate</text>
  </g>
</svg>