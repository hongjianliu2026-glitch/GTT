<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comet</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmɪt] n. 彗星</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + et (星)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗彗星(comet)拖着长长的尾巴，"共同(com-)"
    <tspan x="50" dy="25">穿越星空，就像一颗闪亮的星星(et)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comet passed by Earth last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚这颗彗星经过了地球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Comet body -->
    <circle cx="100" cy="100" r="20" class="image" fill="#FFD700" />
    <!-- Comet tail -->
    <line x1="120" y1="100" x2="250" y2="100" class="image" stroke-dasharray="5,5" />
    <line x1="120" y1="100" x2="250" y2="80" class="image" stroke-dasharray="5,5" />
    <line x1="120" y1="100" x2="250" y2="120" class="image" stroke-dasharray="5,5" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="3" class="image" fill="#FFFFFF" />
    <circle cx="150" cy="50" r="3" class="image" fill="#FFFFFF" />
    <circle cx="200" cy="150" r="3" class="image" fill="#FFFFFF" />
  </g>
</svg>