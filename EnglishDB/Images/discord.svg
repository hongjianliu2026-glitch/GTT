<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discord</text>
  <text x="50" y="120" class="subtitle">[ˈdɪskɔːrd] n. 不和，纷争</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + cord (心)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人，他们的心"分开(dis-)"了，
    <tspan x="50" dy="25">彼此之间充满了"纷争(cord)"，这就是不和(discord)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The discord among the team members led to a failed project.
  </text>
  <text x="50" y="310" class="content">
    团队成员之间的不和导致了项目的失败。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken heart -->
    <path d="M50,50 L100,100 L50,150 L0,100 Z" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <!-- People -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="300" y2="120" class="image" />
    <!-- Arrows -->
    <line x1="210" y1="120" x2="240" y2="120" class="image" />
    <line x1="240" y1="120" x2="225" y2="100" class="image" />
    <line x1="240" y1="120" x2="225" y2="140" class="image" />
  </g>
</svg>