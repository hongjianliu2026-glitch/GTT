<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">campaigner</text>
  <text x="50" y="120" class="subtitle">[kæmˈpeɪnər] n. 活动家，竞选者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> camp (田野) + aign (做) + er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个活动家在田野上"做(aign)"着各种活动，
    <tspan x="50" dy="25">他/她就是一位竞选者(campaigner)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a dedicated campaigner for environmental protection.
  </text>
  <text x="50" y="310" class="content">
    她是一位致力于环境保护的活动家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Campaigner -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Banner -->
    <rect x="100" y="20" width="200" height="30" class="image" />
    <text x="110" y="45" class="content">Campaign</text>
    <!-- Crowd -->
    <circle cx="200" cy="150" r="10" class="image" />
    <circle cx="230" cy="150" r="10" class="image" />
    <circle cx="260" cy="150" r="10" class="image" />
  </g>
</svg>