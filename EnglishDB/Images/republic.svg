<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">republic</text>
  <text x="50" y="120" class="subtitle">[rɪˈpʌblɪk] n. 共和国，共和政体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + public (公众)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国家，"再次(re-)"由"公众(public)"共同管理，
    <tspan x="50" dy="25">这个国家就是一个共和国(republic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> France is a republic with a long history.
  </text>
  <text x="50" y="310" class="content">
    法国是一个有着悠久历史的共和国。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Government building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flag -->
    <rect x="50" y="20" width="250" height="40" class="image" />
    <!-- People -->
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <circle cx="200" cy="120" r="15" class="image" />
    <circle cx="250" cy="120" r="15" class="image" />
    <!-- Voting -->
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="150" y1="140" x2="150" y2="180" class="image" />
    <line x1="200" y1="140" x2="200" y2="180" class="image" />
    <line x1="250" y1="140" x2="250" y2="180" class="image" />
  </g>
</svg>