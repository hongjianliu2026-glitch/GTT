<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #D32F2F; }
      .subtitle { font: italic 24px serif; fill: #424242; }
      .content { font: 18px sans-serif; fill: #616161; }
      .highlight { font-weight: bold; fill: #FF5722; }
      .story { font: 16px serif; fill: #1976D2; }
      .image { stroke: #757575; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Soviet</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊviət] n. 苏维埃，苏联</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sov- (联合) + -iet (表示“组织”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群工人联合起来，形成一个强大的组织，
    <tspan x="50" dy="25">这个组织就是“苏维埃(Soviet)”，象征着团结和力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Soviet Union was a major world power.
  </text>
  <text x="50" y="310" class="content">
    苏联是一个世界强国。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer and Sickle -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="100" y1="100" x2="50" y2="50" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <!-- Workers -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="300" y2="120" class="image" />
  </g>
</svg>