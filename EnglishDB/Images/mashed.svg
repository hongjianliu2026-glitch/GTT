<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mashed</text>
  <text x="50" y="120" class="subtitle">[mæʃt] adj. 捣碎的，压碎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mash (捣碎) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的土豆被压路机"捣碎(mash)"，
    <tspan x="50" dy="25">变成了一堆"捣碎的(mashed)"土豆泥。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She served mashed potatoes for dinner.
  </text>
  <text x="50" y="310" class="content">
    她晚餐时端上了捣碎的土豆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Potato -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Road roller -->
    <rect x="100" y="80" width="150" height="40" class="image" />
    <rect x="120" y="60" width="110" height="20" class="image" />
    <!-- Mashed potato -->
    <rect x="50" y="140" width="100" height="20" class="image" />
    <rect x="60" y="160" width="80" height="20" class="image" />
    <rect x="70" y="180" width="60" height="20" class="image" />
  </g>
</svg>