<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pulp</text>
  <text x="50" y="120" class="subtitle">[pʌlp] n. 果肉，纸浆；v. 使成浆状</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pul (软) + p (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的橙子被压榨机压榨，"软软的(pul)"
    <tspan x="50" dy="25">果肉被压成了浆状(pulp)，流了出来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made fresh orange juice from the pulp of the fruit.
  </text>
  <text x="50" y="310" class="content">
    她用水果的果肉制作了新鲜的橙汁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Orange -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFA500" />
    <!-- Squeezer -->
    <rect x="150" y="50" width="100" height="100" class="image" fill="#D35400" />
    <!-- Pulp -->
    <ellipse cx="200" cy="150" rx="50" ry="20" class="image" fill="#FFDAB9" />
    <!-- Juice -->
    <line x1="200" y1="170" x2="200" y2="200" class="image" stroke-width="5" stroke="#FF6347" />
  </g>
</svg>