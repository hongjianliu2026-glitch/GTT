<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dandy</text>
  <text x="50" y="120" class="subtitle">[ˈdændi] n. 花花公子，纨绔子弟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语“dand”，意为“骄傲、自负”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着华丽、举止优雅的“花花公子(dandy)”，
    <tspan x="50" dy="25">他总是走在时尚的前沿，自负且骄傲。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was a real dandy, always dressed in the latest fashion.
  </text>
  <text x="50" y="310" class="content">
    他真是个花花公子，总是穿着最新潮的服装。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dandy figure -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="80" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="80" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Fancy clothes -->
    <rect x="30" y="70" width="40" height="50" class="image" /> <!-- Jacket -->
    <rect x="40" y="120" width="20" height="40" class="image" /> <!-- Pants -->
    <!-- Fashionable accessories -->
    <circle cx="50" cy="40" r="5" class="image" /> <!-- Hat -->
    <line x1="50" y1="70" x2="50" y2="80" class="image" /> <!-- Tie -->
  </g>
</svg>