<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">domination</text>
  <text x="50" y="120" class="subtitle">[ˌdɒmɪˈneɪʃn] n. 统治，控制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> domin (统治) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强大的统治者站在山顶，"统治(domin)"
    <tspan x="50" dy="25">整个王国，他的控制力无处不在，这就是统治(domination)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's domination of the market is unchallenged.
  </text>
  <text x="50" y="310" class="content">
    该公司在市场上的统治地位无可挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 175,0 350,200" class="image" />
    <!-- Ruler -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
    <!-- Crown -->
    <polyline points="165,80 175,60 185,80" class="image" />
    <polyline points="160,90 175,70 190,90" class="image" />
  </g>
</svg>