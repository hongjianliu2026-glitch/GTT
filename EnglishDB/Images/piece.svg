<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">piece</text>
  <text x="50" y="120" class="subtitle">[piːs] n. 片，块；v. 拼合，修补</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pie (拼合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拼图游戏，"拼合(pie)"
    <tspan x="50" dy="25">成一幅完整的画面，每一小块(piece)都是不可或缺的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She put the pieces of the puzzle together.
  </text>
  <text x="50" y="310" class="content">
    她把拼图的碎片拼在一起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Connecting lines -->
    <line x1="100" y1="50" x2="120" y2="50" class="image" />
    <line x1="220" y1="50" x2="240" y2="50" class="image" />
    <line x1="50" y1="150" x2="70" y2="150" class="image" />
    <line x1="170" y1="150" x2="190" y2="150" class="image" />
  </g>
</svg>