<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">almighty</text>
  <text x="50" y="120" class="subtitle">[ɔːlˈmaɪti] adj. 全能的，万能的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (全部) + might (力量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"全能(al-mighty)"的神，拥有"全部的力量(al-might)"，
    <tspan x="50" dy="25">可以掌控一切，无所不能。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He felt like an almighty god when he solved the complex problem.
  </text>
  <text x="50" y="310" class="content">
    当他解决了那个复杂的问题时，他感觉自己像一个全能的神。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- God figure -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="200" x2="50" y2="150" class="image" />
    <line x1="100" y1="200" x2="150" y2="150" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Lightning bolts -->
    <line x1="100" y1="50" x2="50" y2="0" class="image" />
    <line x1="100" y1="50" x2="150" y2="0" class="image" />
    <line x1="100" y1="50" x2="0" y2="100" class="image" />
    <line x1="100" y1="50" x2="200" y2="100" class="image" />
  </g>
</svg>