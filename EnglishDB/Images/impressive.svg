<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impressive</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpresɪv] adj. 给人深刻印象的，感人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + press (压) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在舞台上，"压入(im-press)"
    <tspan x="50" dy="25">观众的心中，留下深刻的印象(impressive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fireworks display was truly impressive.
  </text>
  <text x="50" y="310" class="content">
    烟火表演真是令人印象深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on stage -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="130" y2="140" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Audience -->
    <circle cx="75" cy="250" r="15" class="image" />
    <circle cx="125" cy="250" r="15" class="image" />
    <circle cx="175" cy="250" r="15" class="image" />
    <circle cx="225" cy="250" r="15" class="image" />
    <circle cx="275" cy="250" r="15" class="image" />
    <!-- Hearts -->
    <path d="M75,270 C85,260 95,270 85,280 Z" class="image" />
    <path d="M125,270 C135,260 145,270 135,280 Z" class="image" />
    <path d="M175,270 C185,260 195,270 185,280 Z" class="image" />
    <path d="M225,270 C235,260 245,270 235,280 Z" class="image" />
    <path d="M275,270 C285,260 295,270 285,280 Z" class="image" />
  </g>
</svg>