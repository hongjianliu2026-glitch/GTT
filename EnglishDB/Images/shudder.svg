<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shudder</text>
  <text x="50" y="120" class="subtitle">[ˈʃʌdər] v. 颤抖，战栗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shud (颤抖) + -er (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在寒冷的夜晚，突然感到一阵寒意，身体不由自主地"颤抖(shudder)"，
    <tspan x="50" dy="25">仿佛被一股无形的力量所惊吓。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house made her shudder with fear.
  </text>
  <text x="50" y="310" class="content">
    那座老房子让她感到恐惧，不由自主地颤抖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Shudder effect -->
    <line x1="50" y1="130" x2="40" y2="120" class="image" />
    <line x1="50" y1="130" x2="60" y2="120" class="image" />
    <line x1="50" y1="130" x2="45" y2="110" class="image" />
    <line x1="50" y1="130" x2="55" y2="110" class="image" />
  </g>
</svg>