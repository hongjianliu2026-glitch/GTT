<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">circulate</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrkjəleɪt] v. 循环，流通，传播</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> circ (圆) + ul + ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个圆形的传送带，"圆(circ)"
    <tspan x="50" dy="25">形的东西不断循环(circulate)，</tspan>
    <tspan x="50" dy="25">就像血液在体内循环一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news quickly circulated around the office.
  </text>
  <text x="50" y="310" class="content">
    消息很快在办公室里传开了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Arrows -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="255" y2="100" class="image" />
    <line x1="255" y1="100" x2="95" y2="100" class="image" />
    <line x1="95" y1="100" x2="175" y2="20" class="image" />
    <!-- Arrowheads -->
    <polygon points="175,20 170,30 180,30" class="image" />
    <polygon points="175,180 170,170 180,170" class="image" />
    <polygon points="255,100 245,105 245,95" class="image" />
    <polygon points="95,100 105,105 105,95" class="image" />
  </g>
</svg>