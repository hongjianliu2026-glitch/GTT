<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contraction</text>
  <text x="50" y="120" class="subtitle">[kənˈtrækʃn] n. 收缩，紧缩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tract (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个肌肉在运动时，"一起拉紧(con-tract)"，
    <tspan x="50" dy="25">这种拉紧的动作就是收缩(contraction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The muscle's contraction was visible under the skin.
  </text>
  <text x="50" y="310" class="content">
    肌肉的收缩在皮肤下清晰可见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Muscle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Contraction -->
    <line x1="50" y1="50" x2="100" y2="140" class="image" />
    <line x1="300" y1="50" x2="250" y2="140" class="image" />
    <!-- Arrows -->
    <polygon points="100,140 120,130 120,150" class="image" />
    <polygon points="250,140 230,130 230,150" class="image" />
  </g>
</svg>