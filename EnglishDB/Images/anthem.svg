<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anthem</text>
  <text x="50" y="120" class="subtitle">[ˈænθəm] n. 国歌，颂歌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (前) + -em (唱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在广场上，"提前唱(anti-em)"
    <tspan x="50" dy="25">一首庄严的歌曲，这就是国歌(anthem)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The national anthem was played at the beginning of the ceremony.
  </text>
  <text x="50" y="310" class="content">
    仪式开始时演奏了国歌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Microphone -->
    <rect x="120" y="50" width="60" height="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="20" class="image" />
    <line x1="150" y1="20" x2="130" y2="0" class="image" />
    <line x1="150" y1="20" x2="170" y2="0" class="image" />
    <!-- Music notes -->
    <path d="M100,150 Q120,130 140,150 T180,150" class="image" />
    <path d="M120,160 Q140,140 160,160 T200,160" class="image" />
  </g>
</svg>