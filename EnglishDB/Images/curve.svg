<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">curve</text>
  <text x="50" y="120" class="subtitle">[kɜːrv] n. 曲线，弯曲；v. 使弯曲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> curv (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蛇在草地上"弯曲(curv)"前行，
    <tspan x="50" dy="25">它的身体形成了一条曲线(curve)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road curved sharply to the left.
  </text>
  <text x="50" y="310" class="content">
    道路向左急转弯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snake -->
    <path d="M0,0 C50,50 100,50 150,0" class="image" />
    <!-- Grass -->
    <line x1="0" y1="20" x2="150" y2="20" class="image" />
    <line x1="0" y1="25" x2="150" y2="25" class="image" />
    <line x1="0" y1="30" x2="150" y2="30" class="image" />
  </g>
</svg>