<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">firmly</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrmli] adv. 坚定地，牢固地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> firm (坚固的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用双手"紧紧地(firmly)"握住一根坚固的柱子，
    <tspan x="50" dy="25">就像他坚定不移的信念一样，牢不可破。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He held the rope firmly and climbed up the mountain.
  </text>
  <text x="50" y="310" class="content">
    他紧紧抓住绳子，爬上了山。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Firmly holding a pillar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pillar -->
    <rect x="150" y="20" width="50" height="160" class="image" />
    <!-- Hands -->
    <line x1="120" y1="50" x2="150" y2="50" class="image" />
    <line x1="120" y1="80" x2="150" y2="80" class="image" />
    <line x1="120" y1="110" x2="150" y2="110" class="image" />
    <line x1="120" y1="140" x2="150" y2="140" class="image" />
    <line x1="230" y1="50" x2="200" y2="50" class="image" />
    <line x1="230" y1="80" x2="200" y2="80" class="image" />
    <line x1="230" y1="110" x2="200" y2="110" class="image" />
    <line x1="230" y1="140" x2="200" y2="140" class="image" />
    <!-- Person -->
    <circle cx="175" cy="180" r="20" class="image" />
    <line x1="175" y1="200" x2="175" y2="240" class="image" />
    <line x1="175" y1="240" x2="150" y2="270" class="image" />
    <line x1="175" y1="240" x2="200" y2="270" class="image" />
    <line x1="175" y1="220" x2="220" y2="210" class="image" />
  </g>
</svg>