<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">detriment</text>
  <text x="50" y="120" class="subtitle">[ˈdetrɪmənt] n. 损害，伤害</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + triment (伤害)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"向下(de-)"砸向一个脆弱的玻璃瓶，
    <tspan x="50" dy="25">玻璃瓶瞬间破碎，象征着"伤害(triment)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Smoking is a detriment to your health.
  </text>
  <text x="50" y="310" class="content">
    吸烟对你的健康有害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="90" y2="20" class="image" />
    <line x1="90" y1="20" x2="110" y2="20" class="image" />
    <line x1="110" y1="20" x2="100" y2="40" class="image" />
    <line x1="100" y1="40" x2="0" y2="40" class="image" />
    <line x1="0" y1="40" x2="10" y2="20" class="image" />
    <line x1="10" y1="20" x2="0" y2="0" class="image" />

    <!-- Broken bottle -->
    <path d="M150,0 Q170,20 150,40 Q130,20 150,0" class="image" />
    <line x1="150" y1="0" x2="150" y2="40" class="image" />
    <line x1="150" y1="40" x2="130" y2="60" class="image" />
    <line x1="150" y1="40" x2="170" y2="60" class="image" />
  </g>
</svg>