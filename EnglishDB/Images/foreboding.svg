<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foreboding</text>
  <text x="50" y="120" class="subtitle">[fɔːrˈboʊdɪŋ] n. 预感，不祥的预感</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (在前面) + bode (预示)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"提前预示(fore-bode)"
    <tspan x="50" dy="25">着即将发生的危险，这种不祥的预感(foreboding)让人心惊胆战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dark clouds brought a sense of foreboding.
  </text>
  <text x="50" y="310" class="content">
    乌云密布，带来了一种不祥的预感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Dark clouds -->
    <ellipse cx="200" cy="50" rx="100" ry="30" class="image" />
    <ellipse cx="250" cy="70" rx="100" ry="30" class="image" />
    <ellipse cx="150" cy="70" rx="100" ry="30" class="image" />
    <!-- Lightning bolt -->
    <line x1="200" y1="50" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="220" y2="100" class="image" />
  </g>
</svg>