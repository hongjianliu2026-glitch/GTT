<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #A0522D; }
      .content { font: 18px sans-serif; fill: #654321; }
      .highlight { font-weight: bold; fill: #CD853F; }
      .story { font: 16px serif; fill: #D2691E; }
      .image { stroke: #8B4513; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leathery</text>
  <text x="50" y="120" class="subtitle">[ˈlɛðəri] adj. 皮革般的，坚韧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leather (皮革) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块皮革，经过岁月的洗礼，变得"坚韧如皮革(leathery)"，
    <tspan x="50" dy="25">仿佛能抵挡一切风雨。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man's skin was leathery from years of working outdoors.
  </text>
  <text x="50" y="310" class="content">
    这位老人的皮肤因多年在户外工作而变得如皮革般坚韧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leather texture -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <!-- Old man's face -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
  </g>
</svg>