<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">institution</text>
  <text x="50" y="120" class="subtitle">[ˌɪnstɪˈtjuːʃn] n. 机构，制度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + stitut (建立) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的建筑，象征着"建立(stitut)"
    <tspan x="50" dy="25">的机构(institution)，人们进入(in-)其中，遵循其制度。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The university is a well-known institution.
  </text>
  <text x="50" y="310" class="content">
    这所大学是一个著名的机构。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Door -->
    <rect x="150" y="160" width="50" height="40" class="image" />
    <!-- People entering -->
    <circle cx="175" cy="180" r="5" class="image" />
    <line x1="175" y1="185" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="165" y2="210" class="image" />
    <line x1="175" y1="200" x2="185" y2="210" class="image" />
    <line x1="175" y1="190" x2="190" y2="180" class="image" />
  </g>
</svg>