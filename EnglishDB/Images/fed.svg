<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fed</text>
  <text x="50" y="120" class="subtitle">[fed] v. 喂养，供给</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feed (喂养) 的过去式
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟被"喂养(feed)"，
    <tspan x="50" dy="25">它吃饱后满足地飞走了，这就是"fed"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mother bird fed her chicks.
  </text>
  <text x="50" y="310" class="content">
    母鸟喂养了她的雏鸟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />

    <!-- Food -->
    <rect x="120" y="90" width="50" height="20" class="image" />
    <rect x="120" y="120" width="50" height="20" class="image" />
    <rect x="120" y="150" width="50" height="20" class="image" />

    <!-- Feeding action -->
    <line x1="50" y1="100" x2="120" y2="100" class="image" />
    <line x1="50" y1="100" x2="120" y2="130" class="image" />
    <line x1="50" y1="100" x2="120" y2="160" class="image" />
  </g>
</svg>