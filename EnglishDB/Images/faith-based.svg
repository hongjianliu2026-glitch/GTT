<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">faith-based</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪθ beɪst] adj. 基于信仰的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> faith (信仰) + based (基于)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的十字架，"信仰(faith)"
    <tspan x="50" dy="25">支撑着(based)整个社区，这就是基于信仰的(faith-based)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The charity is a faith-based organization.
  </text>
  <text x="50" y="310" class="content">
    这个慈善机构是一个基于信仰的组织。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cross -->
    <line x1="100" y1="50" x2="100" y2="200" class="image" />
    <line x1="50" y1="125" x2="150" y2="125" class="image" />
    <!-- Community -->
    <rect x="20" y="220" width="160" height="50" class="image" />
    <rect x="20" y="280" width="160" height="50" class="image" />
    <rect x="20" y="340" width="160" height="50" class="image" />
    <!-- Faith supporting community -->
    <line x1="100" y1="200" x2="100" y2="220" class="image" />
  </g>
</svg>