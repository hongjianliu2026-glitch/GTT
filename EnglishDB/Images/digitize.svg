<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">digitize</text>
  <text x="50" y="120" class="subtitle">[ˈdɪdʒɪtaɪz] v. 数字化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> digit (数字) + -ize (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师挥动魔杖，将一本厚重的书瞬间"数字化(digitize)"，
    <tspan x="50" dy="25">书页变成了一串串数字代码，飞舞在空中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The library is digitizing all its old manuscripts.
  </text>
  <text x="50" y="310" class="content">
    图书馆正在将其所有旧手稿数字化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Magic wand -->
    <line x1="160" y1="100" x2="250" y2="100" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <!-- Digital code -->
    <line x1="270" y1="20" x2="350" y2="20" class="image" />
    <line x1="270" y1="50" x2="350" y2="50" class="image" />
    <line x1="270" y1="80" x2="350" y2="80" class="image" />
    <line x1="270" y1="110" x2="350" y2="110" class="image" />
    <line x1="270" y1="140" x2="350" y2="140" class="image" />
    <line x1="270" y1="170" x2="350" y2="170" class="image" />
  </g>
</svg>