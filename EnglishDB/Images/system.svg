<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">system</text>
  <text x="50" y="120" class="subtitle">[ˈsɪstəm] n. 系统，体系；制度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syn- (一起) + sta (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机器，"所有部件一起站立(syn-sta)"
    <tspan x="50" dy="25">并协同工作，形成一个完整的系统(system)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a complex system for managing projects.
  </text>
  <text x="50" y="310" class="content">
    公司有一个复杂的管理项目的系统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Machine parts -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Connecting lines -->
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
    <line x1="50" y1="130" x2="250" y2="130" class="image" />
  </g>
</svg>