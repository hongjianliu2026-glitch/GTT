<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">endeavor</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdevər] n. 努力，尽力；v. 努力，尽力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + deavor (债务)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人肩负着"债务(deavor)"，
    <tspan x="50" dy="25">他必须"使(en)"自己努力工作，</tspan>
    <tspan x="50" dy="25">以偿还债务，这就是"努力(endeavor)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a great endeavor to finish the project on time.
  </text>
  <text x="50" y="310" class="content">
    她尽了很大努力按时完成项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person carrying a heavy load -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Heavy load -->
    <rect x="30" y="220" width="40" height="20" class="image" />
    <text x="45" y="235" class="content" text-anchor="middle">Debt</text>
  </g>
</svg>