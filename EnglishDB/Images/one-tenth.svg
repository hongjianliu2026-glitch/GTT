<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">one-tenth</text>
  <text x="50" y="120" class="subtitle">[wʌnˈtɛnθ] n. 十分之一</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> one (一) + tenth (第十)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕被切成十份，其中一份就是"十分之一(one-tenth)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ate one-tenth of the cake.
  </text>
  <text x="50" y="310" class="content">
    她吃了蛋糕的十分之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cake -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Slice -->
    <path d="M150,150 L250,150 A100,100 0 0,1 150,250 Z" class="image" fill="#F39C12" />
    <!-- Text -->
    <text x="150" y="150" text-anchor="middle" font-size="30" fill="#34495E">1/10</text>
  </g>
</svg>