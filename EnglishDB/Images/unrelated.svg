<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unrelated</text>
  <text x="50" y="120" class="subtitle">[ˌʌnrɪˈleɪtɪd] adj. 无关的，不相关的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + relate (关联) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个完全不相关的物体，一个是<tspan x="50" dy="25">苹果(apple)</tspan>，另一个是<tspan x="50" dy="25">汽车(car)</tspan>，它们之间没有任何联系，这就是"unrelated"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two events are completely unrelated.
  </text>
  <text x="50" y="310" class="content">
    这两个事件完全无关。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apple -->
    <circle cx="50" cy="100" r="30" class="image" fill="#FF4500" />
    <!-- Car -->
    <rect x="150" y="70" width="100" height="60" class="image" fill="#34495E" />
    <rect x="160" y="50" width="80" height="20" class="image" fill="#34495E" />
    <circle cx="170" cy="140" r="10" class="image" fill="#34495E" />
    <circle cx="230" cy="140" r="10" class="image" fill="#34495E" />
    <!-- Arrow -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,100 140,95 140,105" class="image" />
  </g>
</svg>