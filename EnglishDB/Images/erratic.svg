<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">erratic</text>
  <text x="50" y="120" class="subtitle">[ɪˈrætɪk] adj. 不稳定的，古怪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> err (错误) + -atic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个球在地板上"错误地(err)"滚动，
    <tspan x="50" dy="25">它的路径毫无规律，就像一个古怪的人(erratic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His behavior was erratic, making it hard to predict what he would do next.
  </text>
  <text x="50" y="310" class="content">
    他的行为古怪，让人难以预测他下一步会做什么。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ball -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Path lines -->
    <line x1="70" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="150" class="image" />
  </g>
</svg>