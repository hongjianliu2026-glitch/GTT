<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">losing</text>
  <text x="50" y="120" class="subtitle">[ˈluːzɪŋ] adj. 失败的，失去的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lose (失去) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在比赛中，"正在失去(losing)"
    <tspan x="50" dy="25">优势，他的表情充满了失望和沮丧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was losing the game, but he didn't give up.
  </text>
  <text x="50" y="310" class="content">
    他在比赛中处于劣势，但他没有放弃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Sad face -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <line x1="45" y1="110" x2="65" y2="110" class="image" />
    <!-- Game -->
    <rect x="100" y="80" width="150" height="100" class="image" />
    <line x1="120" y1="100" x2="230" y2="100" class="image" />
    <line x1="120" y1="120" x2="230" y2="120" class="image" />
    <line x1="120" y1="140" x2="230" y2="140" class="image" />
    <line x1="120" y1="160" x2="230" y2="160" class="image" />
  </g>
</svg>