<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">literate</text>
  <text x="50" y="120" class="subtitle">[ˈlɪtərət] adj. 有文化的，有读写能力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liter (文字) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学者，手持一本厚重的书，"文字(liter)"
    <tspan x="50" dy="25">在他手中流淌，他因此变得有文化(literate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a highly literate individual who enjoys reading classic literature.
  </text>
  <text x="50" y="310" class="content">
    她是一个非常有文化的人，喜欢阅读经典文学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="140" x2="180" y2="140" class="image" />
    <line x1="20" y1="180" x2="180" y2="180" class="image" />
    <line x1="20" y1="220" x2="180" y2="220" class="image" />
    <line x1="20" y1="260" x2="180" y2="260" class="image" />
    <!-- Scholar -->
    <circle cx="300" cy="150" r="30" class="image" />
    <line x1="300" y1="180" x2="300" y2="250" class="image" />
    <line x1="300" y1="250" x2="270" y2="300" class="image" />
    <line x1="300" y1="250" x2="330" y2="300" class="image" />
    <line x1="300" y1="200" x2="350" y2="180" class="image" />
    <line x1="300" y1="200" x2="250" y2="180" class="image" />
    <!-- Hand holding book -->
    <line x1="300" y1="200" x2="200" y2="150" class="image" />
  </g>
</svg>