<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spreading</text>
  <text x="50" y="120" class="subtitle">[ˈsprɛdɪŋ] v. 传播，扩散</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spread (展开) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张巨大的纸，"展开(spread)"
    <tspan x="50" dy="25">成一个巨大的平面，信息在上面迅速扩散(spreading)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the event quickly spread across the city.
  </text>
  <text x="50" y="310" class="content">
    这个事件的消息很快传遍了整个城市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Spreading lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Spreading dots -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="100" cy="80" r="5" class="image" />
    <circle cx="150" cy="110" r="5" class="image" />
    <circle cx="200" cy="140" r="5" class="image" />
    <circle cx="250" cy="170" r="5" class="image" />
    <circle cx="300" cy="200" r="5" class="image" />
  </g>
</svg>