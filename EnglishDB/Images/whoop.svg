<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whoop</text>
  <text x="50" y="120" class="subtitle">[wuːp] v. 高呼，欢呼；n. 高呼声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whoop (源自拟声词，模仿欢呼声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在庆祝胜利时，"高呼(whoop)"
    <tspan x="50" dy="25">的声音响彻云霄，场面热闹非凡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd whooped with joy when the team scored.
  </text>
  <text x="50" y="310" class="content">
    当队伍得分时，人群欢呼雀跃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Mouths -->
    <path d="M50 115 Q50 130, 70 130" class="image" />
    <path d="M100 115 Q100 130, 120 130" class="image" />
    <path d="M150 115 Q150 130, 170 130" class="image" />
    <path d="M200 115 Q200 130, 220 130" class="image" />
    <!-- Sound waves -->
    <path d="M50 140 Q50 160, 70 160" class="image" />
    <path d="M100 140 Q100 160, 120 160" class="image" />
    <path d="M150 140 Q150 160, 170 160" class="image" />
    <path d="M200 140 Q200 160, 220 160" class="image" />
  </g>
</svg>