<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accompanying</text>
  <text x="50" y="120" class="subtitle">[əˈkʌmpəniŋ] adj. 陪伴的，附带的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + company (陪伴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人紧紧地"陪伴(ac-company)"在另一个人身边，
    <tspan x="50" dy="25">就像影子一样，时刻不离。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accompanying music made the movie more enjoyable.
  </text>
  <text x="50" y="310" class="content">
    伴奏音乐使电影更加有趣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person 1 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <!-- Person 2 -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="190" y2="130" class="image" />

    <!-- Connection -->
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
  </g>
</svg>