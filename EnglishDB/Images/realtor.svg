<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">realtor</text>
  <text x="50" y="120" class="subtitle">[ˈriːəltər] n. 房地产经纪人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> real (真实的) + -tor (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房地产经纪人站在一栋真实的房子前，
    <tspan x="50" dy="25">手里拿着钥匙，准备带客户参观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The realtor showed us several properties in the area.
  </text>
  <text x="50" y="310" class="content">
    房地产经纪人带我们看了该地区的几处房产。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <polygon points="0,0 100,0 100,50 0,50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <!-- Realtor -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="230" y2="160" class="image" />
    <line x1="250" y1="130" x2="270" y2="160" class="image" />
    <line x1="250" y1="110" x2="280" y2="100" class="image" />
    <!-- Key -->
    <rect x="240" y="50" width="10" height="30" class="image" />
    <rect x="240" y="40" width="20" height="10" class="image" />
  </g>
</svg>