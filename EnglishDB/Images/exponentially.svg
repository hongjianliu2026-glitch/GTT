<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exponentially</text>
  <text x="50" y="120" class="subtitle">[ˌɛkspoʊˈnɛnʃəli] adv. 指数地，迅速增长地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + pon (放置) + -ent (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师从帽子里不断"取出(ex-pon)"兔子，
    <tspan x="50" dy="25">每取一次，兔子数量就"指数级增长(exponentially)"，</tspan>
    <tspan x="50" dy="25">场面越来越夸张，让人目瞪口呆。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The population grew exponentially after the war.
  </text>
  <text x="50" y="310" class="content">
    战争结束后，人口迅速增长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hat -->
    <rect x="50" y="20" width="200" height="100" class="image" />
    <!-- Rabbits -->
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="150" cy="150" r="20" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />
    <circle cx="125" cy="180" r="20" class="image" />
    <circle cx="175" cy="180" r="20" class="image" />
    <!-- Exponential growth -->
    <line x1="50" y1="120" x2="250" y2="200" class="image" />
    <line x1="50" y1="120" x2="250" y2="220" class="image" />
    <line x1="50" y1="120" x2="250" y2="240" class="image" />
    <line x1="50" y1="120" x2="250" y2="260" class="image" />
  </g>
</svg>