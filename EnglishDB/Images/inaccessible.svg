<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inaccessible</text>
  <text x="50" y="120" class="subtitle">[ˌɪnəkˈsɛsəbl] adj. 无法到达的，难以接近的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + access (接近) + -ible (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高耸入云的山峰，"无法接近(in-access-ible)"，
    <tspan x="50" dy="25">周围环绕着深不见底的峡谷，任何人都难以到达。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The remote village is inaccessible by road.
  </text>
  <text x="50" y="310" class="content">
    那个偏远的村庄无法通过公路到达。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Valley -->
    <rect x="50" y="200" width="200" height="100" class="image" />
    <!-- Person trying to reach -->
    <circle cx="150" cy="300" r="15" class="image" />
    <line x1="150" y1="315" x2="150" y2="350" class="image" />
    <line x1="150" y1="350" x2="130" y2="380" class="image" />
    <line x1="150" y1="350" x2="170" y2="380" class="image" />
    <line x1="150" y1="330" x2="120" y2="320" class="image" />
    <line x1="150" y1="330" x2="180" y2="320" class="image" />
  </g>
</svg>