<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #641E16; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soil</text>
  <text x="50" y="120" class="subtitle">[sɔɪl] n. 土壤，土地；v. 弄脏，污损</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sol (地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片肥沃的"土地(sol)"，上面覆盖着厚厚的"土壤(soil)"，
    <tspan x="50" dy="25">农民们在这片土地上辛勤耕作，种植出丰硕的果实。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soil in this region is very fertile.
  </text>
  <text x="50" y="310" class="content">
    这个地区的土壤非常肥沃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soil -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#8B4513" />
    <!-- Farmer -->
    <circle cx="20" cy="100" r="15" class="image" fill="#FFD700" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Plants -->
    <line x1="70" y1="180" x2="70" y2="100" class="image" />
    <line x1="70" y1="100" x2="60" y2="120" class="image" />
    <line x1="70" y1="100" x2="80" y2="120" class="image" />
    <line x1="120" y1="180" x2="120" y2="100" class="image" />
    <line x1="120" y1="100" x2="110" y2="120" class="image" />
    <line x1="120" y1="100" x2="130" y2="120" class="image" />
  </g>
</svg>