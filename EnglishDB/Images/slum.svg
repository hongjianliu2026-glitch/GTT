<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slum</text>
  <text x="50" y="120" class="subtitle">[slʌm] n. 贫民窟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slum (源自slummock，意为“破旧的住所”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个破旧的街区，"破旧的住所(slum)"
    <tspan x="50" dy="25">里挤满了人，街道狭窄，房屋摇摇欲坠。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many people live in slums without proper sanitation.
  </text>
  <text x="50" y="310" class="content">
    许多人住在没有适当卫生设施的贫民窟里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken houses -->
    <rect x="0" y="0" width="100" height="80" class="image" />
    <rect x="120" y="0" width="100" height="80" class="image" />
    <rect x="240" y="0" width="100" height="80" class="image" />
    <!-- Narrow street -->
    <line x1="0" y1="90" x2="350" y2="90" class="image" />
    <!-- People -->
    <circle cx="50" cy="120" r="10" class="image" />
    <circle cx="170" cy="120" r="10" class="image" />
    <circle cx="290" cy="120" r="10" class="image" />
  </g>
</svg>