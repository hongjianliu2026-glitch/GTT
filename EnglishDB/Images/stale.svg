<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stale</text>
  <text x="50" y="120" class="subtitle">[steɪl] adj. 不新鲜的，陈旧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sta- (站立) + -le (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块面包在架子上"站立(sta-)"了太久，变得"不新鲜(stale)"，
    <tspan x="50" dy="25">表面开始发霉，失去了原有的香气和口感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bread in the pantry had gone stale.
  </text>
  <text x="50" y="310" class="content">
    食品储藏室里的面包已经不新鲜了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bread -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Mold spots -->
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
    <!-- Bread outline -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>