<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">increased</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkriːst] adj. 增加的，增强的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + creas (生长) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个种子"进入(in)"土壤后，开始"生长(creas)"，
    <tspan x="50" dy="25">最终变成了一棵大树，这就是"增加的(increased)"过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's profits have increased significantly this year.
  </text>
  <text x="50" y="310" class="content">
    公司今年的利润显著增加。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soil -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Seed -->
    <circle cx="50" cy="140" r="10" class="image" />
    <!-- Growing plant -->
    <line x1="50" y1="140" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="40" y2="70" class="image" />
    <line x1="50" y1="50" x2="60" y2="70" class="image" />
    <line x1="50" y1="50" x2="30" y2="90" class="image" />
    <line x1="50" y1="50" x2="70" y2="90" class="image" />
    <!-- Tree -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <line x1="150" y1="50" x2="100" y2="0" class="image" />
    <line x1="200" y1="50" x2="250" y2="0" class="image" />
    <line x1="150" y1="100" x2="100" y2="150" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
  </g>
</svg>