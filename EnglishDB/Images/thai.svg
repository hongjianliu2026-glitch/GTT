<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Thai</text>
  <text x="50" y="120" class="subtitle">[taɪ] adj. 泰国的，泰语的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自泰语 "ภาษาไทย" (Phasa Thai)，意为泰语
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满泰国风情的画面，"泰国的(Thai)"
    <tspan x="50" dy="25">寺庙、美食和传统服饰，让人一眼就能认出这是泰国。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves Thai food and often visits the local Thai restaurant.
  </text>
  <text x="50" y="310" class="content">
    她喜欢泰国菜，经常光顾当地的泰国餐厅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thai temple -->
    <polygon points="0,100 50,0 100,100" class="image" />
    <rect x="40" y="100" width="20" height="50" class="image" />
    <!-- Thai food -->
    <circle cx="150" cy="100" r="30" class="image" />
    <rect x="130" y="130" width="40" height="20" class="image" />
    <!-- Thai traditional dress -->
    <rect x="200" y="50" width="50" height="100" class="image" />
    <line x1="225" y1="50" x2="225" y2="150" class="image" />
  </g>
</svg>