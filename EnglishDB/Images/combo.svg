<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">combo</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmbəʊ] n. 组合，套餐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + bo (盒子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个餐厅里，服务员将各种食物"一起放进(com-bo)"
    <tspan x="50" dy="25">一个盒子里，这个盒子里的食物就构成了一个套餐(combo)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I ordered a burger combo with fries and a drink.
  </text>
  <text x="50" y="310" class="content">
    我点了一个包含汉堡、薯条和饮料的套餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Burger -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="60" x2="150" y2="60" class="image" />
    <!-- Fries -->
    <line x1="170" y1="20" x2="270" y2="20" class="image" />
    <line x1="170" y1="40" x2="270" y2="40" class="image" />
    <line x1="170" y1="60" x2="270" y2="60" class="image" />
    <!-- Drink -->
    <circle cx="300" cy="60" r="30" class="image" />
  </g>
</svg>