<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decrease</text>
  <text x="50" y="120" class="subtitle">[dɪˈkris] v. 减少，降低</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + creas (增长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个数字从高处"向下(de-)"逐渐"减少(creas)"，
    <tspan x="50" dy="25">就像一个倒计时，数字越来越小，直到归零。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The number of accidents has decreased significantly this year.
  </text>
  <text x="50" y="310" class="content">
    今年事故的数量显著减少了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Number decreasing -->
    <text x="50" y="50" class="image" font-size="48">10</text>
    <text x="100" y="100" class="image" font-size="48">9</text>
    <text x="150" y="150" class="image" font-size="48">8</text>
    <text x="200" y="200" class="image" font-size="48">7</text>
    <text x="250" y="250" class="image" font-size="48">6</text>
    <text x="300" y="300" class="image" font-size="48">5</text>
    <text x="350" y="350" class="image" font-size="48">4</text>
    <text x="400" y="400" class="image" font-size="48">3</text>
    <text x="450" y="450" class="image" font-size="48">2</text>
    <text x="500" y="500" class="image" font-size="48">1</text>
    <text x="550" y="550" class="image" font-size="48">0</text>
    <!-- Arrow pointing down -->
    <line x1="50" y1="50" x2="550" y2="550" class="image" />
    <polygon points="550,550 540,540 560,540" class="image" />
  </g>
</svg>