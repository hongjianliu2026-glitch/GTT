<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">birthday</text>
  <text x="50" y="120" class="subtitle">[ˈbɜːrθdeɪ] n. 生日</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> birth (出生) + day (天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个婴儿从妈妈的肚子里"出生(birth)"，
    <tspan x="50" dy="25">这一天就被称为"生日(birthday)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We celebrated her birthday with a big cake.
  </text>
  <text x="50" y="310" class="content">
    我们用一个大蛋糕庆祝了她的生日。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Baby -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />

    <!-- Mother -->
    <circle cx="200" cy="100" r="40" class="image" />
    <line x1="200" y1="140" x2="200" y2="200" class="image" />
    <line x1="200" y1="170" x2="160" y2="160" class="image" />
    <line x1="200" y1="170" x2="240" y2="160" class="image" />
    <line x1="200" y1="200" x2="160" y2="230" class="image" />
    <line x1="200" y1="200" x2="240" y2="230" class="image" />

    <!-- Cake -->
    <rect x="300" y="50" width="100" height="50" class="image" />
    <rect x="310" y="60" width="80" height="30" class="image" />
    <circle cx="340" cy="75" r="5" class="image" />
    <circle cx="320" cy="75" r="5" class="image" />
    <circle cx="360" cy="75" r="5" class="image" />
  </g>
</svg>