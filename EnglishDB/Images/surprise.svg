<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surprise</text>
  <text x="50" y="120" class="subtitle">[sərˈpraɪz] n. 惊讶，意外；v. 使惊讶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (在上面) + pris (抓住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走在路上，突然"从上面抓住(sur-prise)"
    <tspan x="50" dy="25">他的注意力，让他感到惊讶(surprise)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The surprise party was a complete success.
  </text>
  <text x="50" y="310" class="content">
    这个惊喜派对非常成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Surprise element -->
    <rect x="100" y="80" width="50" height="50" class="image" />
    <line x1="100" y1="80" x2="150" y2="130" class="image" />
    <line x1="150" y1="80" x2="100" y2="130" class="image" />
    <text x="110" y="110" class="content" fill="#E74C3C">!</text>
  </g>
</svg>