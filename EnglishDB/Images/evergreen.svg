<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .evergreen { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evergreen</text>
  <text x="50" y="120" class="subtitle">[ˈɛvərɡriːn] adj. 常绿的；n. 常绿植物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ever- (总是) + green (绿色的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林，"总是(ever)"
    <tspan x="50" dy="25">保持绿色的(green)"树木，</tspan>
    <tspan x="50" dy="25">它们就是常绿植物(evergreen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evergreen trees provided a constant source of shade.
  </text>
  <text x="50" y="310" class="content">
    常绿树木提供了持续的阴凉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Evergreen tree -->
    <path d="M 0 150 L 50 0 L 100 150 Z" class="evergreen" />
    <path d="M 25 100 L 75 50 L 125 100 Z" class="evergreen" />
    <path d="M 50 150 L 100 100 L 150 150 Z" class="evergreen" />
    <!-- Trunk -->
    <rect x="65" y="150" width="20" height="50" class="image" />
  </g>
</svg>