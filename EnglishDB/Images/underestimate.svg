<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underestimate</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈestɪmeɪt] v. 低估</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在下面) + estimate (估计)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的物体下面，"在下面估计(under-estimate)"
    <tspan x="50" dy="25">这个物体的重量，结果发现自己严重低估了它的重量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't underestimate the power of teamwork.
  </text>
  <text x="50" y="310" class="content">
    不要低估团队合作的力量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large object -->
    <rect x="50" y="0" width="200" height="150" class="image" />
    <!-- Person under the object -->
    <circle cx="150" cy="180" r="15" class="image" />
    <line x1="150" y1="195" x2="150" y2="230" class="image" />
    <line x1="150" y1="230" x2="130" y2="260" class="image" />
    <line x1="150" y1="230" x2="170" y2="260" class="image" />
    <line x1="150" y1="210" x2="120" y2="200" class="image" />
    <line x1="150" y1="210" x2="180" y2="200" class="image" />
    <!-- Thought bubble -->
    <path d="M150,170 Q180,160 200,170 Q180,180 150,170" class="image" />
    <text x="160" y="175" class="content" text-anchor="middle">?</text>
  </g>
</svg>