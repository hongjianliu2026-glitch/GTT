<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">instantly</text>
  <text x="50" y="120" class="subtitle">[ˈɪnstəntli] adv. 立即，立刻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + stant (站立) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在门口，突然间"进入(in)"并"站立(stant)"，
    <tspan x="50" dy="25">这一刻是如此迅速，仿佛"立即(instantly)"发生。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She reacted instantly when she heard the news.
  </text>
  <text x="50" y="310" class="content">
    她听到消息后立即做出了反应。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="300" class="image" />
    <!-- Person standing -->
    <circle cx="75" cy="150" r="20" class="image" />
    <line x1="75" y1="170" x2="75" y2="250" class="image" />
    <line x1="75" y1="250" x2="50" y2="300" class="image" />
    <line x1="75" y1="250" x2="100" y2="300" class="image" />
    <line x1="75" y1="200" x2="120" y2="180" class="image" />
    <!-- Lightning bolt -->
    <polyline points="170,150 200,100 230,150 260,100 290,150" class="image" />
  </g>
</svg>