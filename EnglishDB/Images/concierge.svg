<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concierge</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnsiˈɛərʒ] n. 门房，礼宾员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + cierge (蜡烛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的酒店，门房手持蜡烛，"共同照亮(con-cierge)"
    <tspan x="50" dy="25">客人的道路，为他们提供服务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concierge helped us with our luggage.
  </text>
  <text x="50" y="310" class="content">
    门房帮我们搬运行李。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hotel door -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Concierge -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Candle -->
    <line x1="50" y1="120" x2="50" y2="80" class="image" />
    <circle cx="50" cy="70" r="10" class="image" />
    <!-- Door -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
  </g>
</svg>