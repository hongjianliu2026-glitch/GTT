<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">generally</text>
  <text x="50" y="120" class="subtitle">[ˈdʒenərəli] adv. 通常，一般地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen- (出生) + -er (人) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，上面标注着"出生(gen-)"
    <tspan x="50" dy="25">在不同地方的人们，他们通常(generally)</tspan>
    <tspan x="50" dy="25">有着相似的生活习惯和行为方式。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Generally, people prefer to live in cities.
  </text>
  <text x="50" y="310" class="content">
    通常，人们更喜欢住在城市里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Continents -->
    <path d="M175,20 A80,80 0 1,1 175,180 A80,80 0 1,1 175,20" class="image" />
    <!-- People -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="175" cy="20" r="10" class="image" />
    <circle cx="175" cy="180" r="10" class="image" />
  </g>
</svg>