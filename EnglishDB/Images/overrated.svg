<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overrated</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈreɪtɪd] adj. 评价过高的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (过度) + rate (评价) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个电影被"过度评价(over-rated)"，
    <tspan x="50" dy="25">结果观众看完后大失所望，纷纷摇头表示不满。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was overrated; it didn't live up to the hype.
  </text>
  <text x="50" y="310" class="content">
    这部电影被评价过高了；它并没有达到宣传的效果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Movie screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Film reel -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Disappointed faces -->
    <circle cx="70" cy="150" r="15" class="image" />
    <line x1="70" y1="165" x2="70" y2="180" class="image" />
    <line x1="60" y1="170" x2="80" y2="170" class="image" />
    <line x1="60" y1="175" x2="80" y2="175" class="image" />
    <circle cx="170" cy="150" r="15" class="image" />
    <line x1="170" y1="165" x2="170" y2="180" class="image" />
    <line x1="160" y1="170" x2="180" y2="170" class="image" />
    <line x1="160" y1="175" x2="180" y2="175" class="image" />
    <circle cx="270" cy="150" r="15" class="image" />
    <line x1="270" y1="165" x2="270" y2="180" class="image" />
    <line x1="260" y1="170" x2="280" y2="170" class="image" />
    <line x1="260" y1="175" x2="280" y2="175" class="image" />
  </g>
</svg>