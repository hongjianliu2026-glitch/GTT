<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">terrifying</text>
  <text x="50" y="120" class="subtitle">[ˈterəˌfaɪɪŋ] adj. 令人恐惧的，可怕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> terr (地) + -ify (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的怪物从地下("terr")冒出来，
    <tspan x="50" dy="25">它的出现让人感到极度恐惧("-ify")，</tspan>
    <tspan x="50" dy="25">这种感觉就是"terrifying"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sight of the terrifying monster made everyone scream.
  </text>
  <text x="50" y="310" class="content">
    看到那个可怕的怪物，所有人都尖叫起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Monster -->
    <circle cx="175" cy="120" r="50" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="230" class="image" />
    <line x1="175" y1="200" x2="200" y2="230" class="image" />
    <line x1="175" y1="190" x2="220" y2="180" class="image" />
    <line x1="175" y1="190" x2="130" y2="180" class="image" />
    <!-- Eyes -->
    <circle cx="160" cy="110" r="5" class="image" fill="#000" />
    <circle cx="190" cy="110" r="5" class="image" fill="#000" />
    <!-- Mouth -->
    <line x1="160" y1="130" x2="190" y2="130" class="image" />
  </g>
</svg>