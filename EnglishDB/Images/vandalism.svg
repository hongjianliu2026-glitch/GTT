<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vandalism</text>
  <text x="50" y="120" class="subtitle">[ˈvændəlɪzəm] n. 故意破坏公物的行为</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Vandal (汪达尔人) + -ism (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群汪达尔人手持喷漆罐，在墙上"肆意涂鸦(Vandal-ism)"，
    <tspan x="50" dy="25">这种行为就是故意破坏公物(vandalism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The act of vandalism left the park in disarray.
  </text>
  <text x="50" y="310" class="content">
    故意破坏公物的行为让公园一片狼藉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Graffiti -->
    <text x="50" y="50" class="image" style="font: bold 36px sans-serif; fill: #E74C3C;">
      Graffiti
    </text>
    <!-- Vandal -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
    <!-- Spray can -->
    <rect x="60" y="140" width="20" height="40" class="image" />
    <line x1="70" y1="140" x2="70" y2="120" class="image" />
  </g>
</svg>