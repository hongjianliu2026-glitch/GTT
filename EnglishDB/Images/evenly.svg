<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evenly</text>
  <text x="50" y="120" class="subtitle">[ˈiːvənli] adv. 均匀地，平等地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> even (平的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天平，"平等地(evenly)"
    <tspan x="50" dy="25">分配着所有的物品，确保每一边都完全平衡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake was cut evenly among the children.
  </text>
  <text x="50" y="310" class="content">
    蛋糕被均匀地分给了孩子们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
    <circle cx="25" cy="100" r="15" class="image" />
    <circle cx="75" cy="100" r="15" class="image" />
    <!-- Items on both sides -->
    <rect x="10" y="120" width="30" height="30" class="image" />
    <rect x="60" y="120" width="30" height="30" class="image" />
    <rect x="10" y="160" width="30" height="30" class="image" />
    <rect x="60" y="160" width="30" height="30" class="image" />
  </g>
</svg>