<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">balsamic</text>
  <text x="50" y="120" class="subtitle">[bɔːlˈsæmɪk] adj. 香脂的，香膏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> balsam (香脂) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的药剂师，手中握着一瓶"香脂(balsam)"，
    <tspan x="50" dy="25">它的香气弥漫在整个房间，仿佛治愈了所有的伤痛。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The balsamic vinegar adds a unique flavor to the salad.
  </text>
  <text x="50" y="310" class="content">
    香脂醋为沙拉增添了独特的风味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Liquid inside the bottle -->
    <rect x="10" y="10" width="80" height="180" class="image" fill="#85C1E9" />
    <!-- Cork -->
    <rect x="0" y="0" width="100" height="20" class="image" fill="#D7DBDD" />
    <!-- Aromas -->
    <circle cx="50" cy="250" r="30" class="image" fill="#FAD7A0" />
    <circle cx="100" cy="270" r="25" class="image" fill="#FAD7A0" />
    <circle cx="150" cy="250" r="30" class="image" fill="#FAD7A0" />
  </g>
</svg>