<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unopened</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˈoʊpənd] adj. 未打开的，未开启的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + open (打开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的礼物盒，"不打开(un-open)"
    <tspan x="50" dy="25">它，里面藏着什么惊喜呢？</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The letter remained unopened for weeks.
  </text>
  <text x="50" y="310" class="content">
    这封信几个星期都没有被打开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gift box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <line x1="30" y1="40" x2="170" y2="40" class="image" />
    <line x1="30" y1="70" x2="170" y2="70" class="image" />
    <line x1="30" y1="100" x2="170" y2="100" class="image" />
    <!-- Ribbon -->
    <line x1="100" y1="20" x2="100" y2="50" class="image" />
    <line x1="80" y1="35" x2="120" y2="35" class="image" />
  </g>
</svg>