<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">avatar</text>
  <text x="50" y="120" class="subtitle">[ˈævətɑːr] n. 化身，头像</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ava- (离开) + tar (下降)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神灵从天而降，"离开(ava-)"
    <tspan x="50" dy="25">神界，"下降(tar)"到人间，化身为一个</tspan>
    <tspan x="50" dy="25">具体的形象(avatar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He created an avatar for his online game.
  </text>
  <text x="50" y="310" class="content">
    他为他的在线游戏创建了一个化身。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- God descending -->
    <circle cx="175" cy="50" r="20" class="image" fill="#FFD700" />
    <line x1="175" y1="70" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="130" x2="225" y2="120" class="image" />
    <!-- Avatar -->
    <circle cx="175" cy="150" r="30" class="image" fill="#FF69B4" />
    <line x1="175" y1="180" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="150" y2="250" class="image" />
    <line x1="175" y1="220" x2="200" y2="250" class="image" />
    <line x1="175" y1="200" x2="225" y2="190" class="image" />
  </g>
</svg>