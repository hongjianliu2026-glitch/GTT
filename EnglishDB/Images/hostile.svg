<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hostile</text>
  <text x="50" y="120" class="subtitle">[ˈhɒstaɪl] adj. 敌对的，敌意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> host (敌人) + -ile (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士面对一群"敌人(host)"，
    <tspan x="50" dy="25">他们的表情充满"敌意(hostile)"，准备随时发起攻击。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hostile crowd shouted angrily at the speaker.
  </text>
  <text x="50" y="310" class="content">
    敌对的群众对演讲者愤怒地大喊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Enemies -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <circle cx="180" cy="100" r="15" class="image" />
    <line x1="180" y1="115" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="160" y2="180" class="image" />
    <line x1="180" y1="150" x2="200" y2="180" class="image" />
    <line x1="180" y1="130" x2="230" y2="120" class="image" />
    <!-- Angry expressions -->
    <line x1="100" y1="90" x2="120" y2="90" class="image" />
    <line x1="180" y1="90" x2="200" y2="90" class="image" />
    <line x1="110" y1="110" x2="110" y2="120" class="image" />
    <line x1="190" y1="110" x2="190" y2="120" class="image" />
  </g>
</svg>