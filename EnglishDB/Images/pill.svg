<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pill</text>
  <text x="50" y="120" class="subtitle">[pɪl] n. 药丸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pil- (来自拉丁语 pilula，意为“小球”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的药丸(pill)，它像一座小山一样高，
    <tspan x="50" dy="25">人们需要爬上去才能拿到它。这个夸张的画面让人</tspan>
    <tspan x="50" dy="25">印象深刻，记住了药丸的形状和用途。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She takes a pill every morning to control her blood pressure.
  </text>
  <text x="50" y="310" class="content">
    她每天早上吃一片药来控制血压。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pill -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <!-- People climbing -->
    <line x1="75" y1="100" x2="175" y2="50" class="image" />
    <line x1="275" y1="100" x2="175" y2="50" class="image" />
    <circle cx="100" cy="120" r="10" class="image" />
    <circle cx="250" cy="120" r="10" class="image" />
    <line x1="100" y1="130" x2="100" y2="150" class="image" />
    <line x1="250" y1="130" x2="250" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="170" class="image" />
    <line x1="250" y1="150" x2="270" y2="170" class="image" />
    <line x1="100" y1="150" x2="120" y2="170" class="image" />
    <line x1="250" y1="150" x2="230" y2="170" class="image" />
  </g>
</svg>