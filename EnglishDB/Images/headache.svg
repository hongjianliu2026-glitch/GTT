<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">headache</text>
  <text x="50" y="120" class="subtitle">[ˈhedeɪk] n. 头痛，令人头痛的事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> head (头) + ache (痛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人抱着头，脸上露出痛苦的表情，"头(head)痛(ache)"
    <tspan x="50" dy="25">得让他无法集中注意力，这就是头痛(headache)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project has been a real headache for the team.
  </text>
  <text x="50" y="310" class="content">
    这个项目对团队来说真是个头痛的问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Pain expression -->
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="70" y1="80" x2="80" y2="90" class="image" />
    <line x1="130" y1="80" x2="120" y2="90" class="image" />
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
    <line x1="90" y1="120" x2="80" y2="110" class="image" />
    <line x1="110" y1="120" x2="120" y2="110" class="image" />
    <!-- Hand holding head -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="40" y2="90" class="image" />
    <line x1="150" y1="100" x2="160" y2="90" class="image" />
  </g>
</svg>