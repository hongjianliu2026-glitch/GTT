<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recrimination</text>
  <text x="50" y="120" class="subtitle">[rɪˌkrɪmɪˈneɪʃn] n. 反责，反诉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + crimin (罪) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在争吵，互相指责对方，"回击对方的罪责(re-crimin-ation)"，
    <tspan x="50" dy="25">这种互相指责的行为就是反责(recrimination)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Their argument quickly descended into recriminations.
  </text>
  <text x="50" y="310" class="content">
    他们的争论很快变成了互相指责。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people pointing at each other -->
    <line x1="50" y1="50" x2="250" y2="200" class="image" />
    <line x1="250" y1="50" x2="50" y2="200" class="image" />
    <!-- Arrows -->
    <polygon points="50,50 70,70 30,70" class="image" />
    <polygon points="250,50 230,70 270,70" class="image" />
    <!-- People -->
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <!-- Speech bubbles -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <ellipse cx="200" cy="100" rx="50" ry="30" class="image" />
    <!-- Text in speech bubbles -->
    <text x="70" y="105" class="content">You!</text>
    <text x="170" y="105" class="content">No, you!</text>
  </g>
</svg>