<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">celery</text>
  <text x="50" y="120" class="subtitle">[ˈsɛləri] n. 芹菜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> celer (快速) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个快速生长的芹菜(celery)，它像闪电一样迅速地从地里冒出来，
    <tspan x="50" dy="25">仿佛在说：“我可是最快的蔬菜！”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added celery to her salad for extra crunch.
  </text>
  <text x="50" y="310" class="content">
    她在沙拉中加入了芹菜，增加了脆脆的口感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Celery stalk -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="25" y1="0" x2="25" y2="200" class="image" />
    <line x1="75" y1="0" x2="75" y2="200" class="image" />
    <line x1="10" y1="0" x2="10" y2="200" class="image" />
    <line x1="90" y1="0" x2="90" y2="200" class="image" />
    <!-- Lightning bolt -->
    <polyline points="120,100 150,50 180,100 210,50 240,100" class="image" />
  </g>
</svg>