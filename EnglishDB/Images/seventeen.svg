<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seventeen</text>
  <text x="50" y="120" class="subtitle">[ˌsevənˈtiːn] n. 十七</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seven (七) + teen (表示“十”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“7”，它被一个夸张的“10”字形环绕，
    <tspan x="50" dy="25">就像一个巨大的数字“7”被“10”紧紧拥抱，形成了“十七(seventeen)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She turned seventeen last month.
  </text>
  <text x="50" y="310" class="content">
    她上个月满十七岁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Number 7 -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />

    <!-- Number 10 -->
    <line x1="200" y1="50" x2="300" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="300" y2="150" class="image" />
    <line x1="300" y1="50" x2="300" y2="150" class="image" />

    <!-- Surrounding 10 -->
    <line x1="100" y1="0" x2="350" y2="0" class="image" />
    <line x1="100" y1="200" x2="350" y2="200" class="image" />
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="350" y1="0" x2="350" y2="200" class="image" />
  </g>
</svg>