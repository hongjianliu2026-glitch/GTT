<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ethnic</text>
  <text x="50" y="120" class="subtitle">[ˈɛθnɪk] adj. 种族的，民族的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ethno- (种族) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个五彩斑斓的世界，"种族(ethno-)"
    <tspan x="50" dy="25">的多样性在这里绽放，每个民族(ethnic)都有其独特的文化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city is known for its ethnic diversity.
  </text>
  <text x="50" y="310" class="content">
    这座城市以其种族多样性而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- World map -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Ethnic symbols -->
    <circle cx="120" cy="60" r="10" class="image" fill="#E74C3C" />
    <circle cx="230" cy="60" r="10" class="image" fill="#3498DB" />
    <circle cx="175" cy="140" r="10" class="image" fill="#2ECC71" />
    <circle cx="120" cy="140" r="10" class="image" fill="#F1C40F" />
    <circle cx="230" cy="140" r="10" class="image" fill="#9B59B6" />
    <!-- Connecting lines -->
    <line x1="120" y1="70" x2="175" y2="90" class="image" />
    <line x1="230" y1="70" x2="175" y2="90" class="image" />
    <line x1="120" y1="150" x2="175" y2="120" class="image" />
    <line x1="230" y1="150" x2="175" y2="120" class="image" />
  </g>
</svg>