<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">headquarters</text>
  <text x="50" y="120" class="subtitle">[ˈhɛdˌkwɔrtərz] n. 总部，司令部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> head (头) + quarters (部分)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的建筑，顶部有一个巨大的"头(head)"，
    <tspan x="50" dy="25">这个建筑就是某个组织的"总部(headquarters)"，</tspan>
    <tspan x="50" dy="25">所有的决策和指挥都从这里发出。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's headquarters is located in New York.
  </text>
  <text x="50" y="310" class="content">
    公司的总部位于纽约。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Roof -->
    <polygon points="175,20 50,100 300,100" class="image" />
    <!-- Head on top -->
    <circle cx="175" cy="60" r="30" class="image" />
    <!-- Eyes -->
    <circle cx="155" cy="50" r="5" class="image" />
    <circle cx="195" cy="50" r="5" class="image" />
    <!-- Mouth -->
    <line x1="150" y1="70" x2="200" y2="70" class="image" />
  </g>
</svg>