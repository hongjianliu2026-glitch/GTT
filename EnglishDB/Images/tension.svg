<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tension</text>
  <text x="50" y="120" class="subtitle">[ˈtɛnʃən] n. 紧张，张力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tens (拉紧) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根拉紧的橡皮筋，"拉紧(tens)"
    <tspan x="50" dy="25">的状态就是紧张(tension)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tension in the room was palpable.
  </text>
  <text x="50" y="310" class="content">
    房间里的紧张气氛显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rubber band -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="300" y1="50" x2="250" y2="100" class="image" />
    <!-- Hands pulling -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="300" cy="50" r="10" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="300" y1="50" x2="300" y2="100" class="image" />
  </g>
</svg>