<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pinch</text>
  <text x="50" y="120" class="subtitle">[pɪntʃ] v. 捏，掐；n. 少量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pinch (来自古英语，原意为“捏”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手在捏(pinch)一块面团，
    <tspan x="50" dy="25">面团被捏得变形，这就是“捏”的动作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave him a pinch on the cheek.
  </text>
  <text x="50" y="310" class="content">
    她在他脸颊上捏了一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Hand -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="90" x2="30" y2="100" class="image" />
    <line x1="50" y1="90" x2="70" y2="100" class="image" />
    <line x1="50" y1="120" x2="30" y2="140" class="image" />
    <line x1="50" y1="120" x2="70" y2="140" class="image" />

    <!-- Dough -->
    <ellipse cx="150" cy="100" rx="50" ry="30" class="image" />
    <line x1="150" y1="100" x2="100" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="70" class="image" />
    <line x1="150" y1="100" x2="150" y2="130" class="image" />
  </g>
</svg>