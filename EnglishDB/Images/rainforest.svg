<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
      .rain { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rainforest</text>
  <text x="50" y="120" class="subtitle">[ˈreɪnˌfɔːrɪst] n. 雨林</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rain (雨) + forest (森林)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂密的森林，"雨(rain)"
    <tspan x="50" dy="25">滴不断落下，滋润着"森林(forest)"，</tspan>
    <tspan x="50" dy="25">这就是雨林(rainforest)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Amazon rainforest is the largest in the world.
  </text>
  <text x="50" y="310" class="content">
    亚马逊雨林是世界上最大的雨林。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trees -->
    <rect x="0" y="0" width="100" height="200" class="tree" />
    <rect x="120" y="0" width="100" height="200" class="tree" />
    <rect x="240" y="0" width="100" height="200" class="tree" />
    <!-- Rain drops -->
    <circle cx="50" cy="50" r="10" class="rain" />
    <circle cx="170" cy="70" r="10" class="rain" />
    <circle cx="290" cy="60" r="10" class="rain" />
    <circle cx="30" cy="120" r="10" class="rain" />
    <circle cx="150" cy="140" r="10" class="rain" />
    <circle cx="270" cy="130" r="10" class="rain" />
  </g>
</svg>