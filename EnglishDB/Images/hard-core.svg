<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hard-core</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrdˌkɔːr] adj. 核心的，坚定的；n. 核心成员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hard (坚硬的) + core (核心)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个坚硬的石头(hard)，里面藏着一颗闪闪发光的宝石(core)，
    <tspan x="50" dy="25">这颗宝石就是团队中最坚定的核心成员(hard-core)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is the hard-core member of the team, always leading by example.
  </text>
  <text x="50" y="310" class="content">
    他是团队的核心成员，总是以身作则。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hard stone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gem inside the stone -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Shine effect -->
    <line x1="175" y1="70" x2="175" y2="50" class="image" />
    <line x1="175" y1="130" x2="175" y2="150" class="image" />
    <line x1="155" y1="100" x2="135" y2="100" class="image" />
    <line x1="195" y1="100" x2="215" y2="100" class="image" />
  </g>
</svg>