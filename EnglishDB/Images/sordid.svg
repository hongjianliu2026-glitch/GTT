<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sordid</text>
  <text x="50" y="120" class="subtitle">[ˈsɔːrdɪd] adj. 肮脏的，卑鄙的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sor (脏) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个肮脏的角落，"脏(sor)"得让人无法忍受，
    <tspan x="50" dy="25">这种地方就是"肮脏的(sordid)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sordid details of the scandal shocked everyone.
  </text>
  <text x="50" y="310" class="content">
    丑闻的肮脏细节震惊了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dirty corner -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trash -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="80" cy="70" r="15" class="image" />
    <circle cx="110" cy="90" r="10" class="image" />
    <!-- Dirty floor -->
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <line x1="0" y1="170" x2="350" y2="170" class="image" />
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <line x1="0" y1="190" x2="350" y2="190" class="image" />
    <!-- Dirty wall -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <line x1="250" y1="0" x2="250" y2="200" class="image" />
    <line x1="300" y1="0" x2="300" y2="200" class="image" />
  </g>
</svg>