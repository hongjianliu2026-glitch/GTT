<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gross</text>
  <text x="50" y="120" class="subtitle">[ɡroʊs] adj. 总的，毛的；粗俗的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gross (大，粗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的(gross)垃圾堆，里面充满了各种
    <tspan x="50" dy="25">粗俗(gross)的东西，让人感到非常不舒服。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gross profit of the company increased this year.
  </text>
  <text x="50" y="310" class="content">
    公司今年的毛利润增加了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gross pile -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trash items -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <line x1="180" y1="30" x2="220" y2="70" class="image" />
    <line x1="220" y1="30" x2="180" y2="70" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Gross face -->
    <circle cx="150" cy="150" r="30" class="image" />
    <line x1="135" y1="140" x2="165" y2="140" class="image" />
    <line x1="145" y1="160" x2="155" y2="160" class="image" />
    <line x1="140" y1="170" x2="160" y2="170" class="image" />
  </g>
</svg>