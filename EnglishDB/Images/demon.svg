<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">demon</text>
  <text x="50" y="120" class="subtitle">[ˈdiːmən] n. 恶魔，魔鬼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + mon (警告)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶魔从地下"向下(de-)"冒出来，
    <tspan x="50" dy="25">发出可怕的"警告(mon)"，让人心生恐惧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The demon in the story was terrifying.
  </text>
  <text x="50" y="310" class="content">
    故事中的恶魔非常可怕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Demon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="150" class="image" />
    <line x1="100" y1="180" x2="150" y2="150" class="image" />
    <!-- Warning sign -->
    <polygon points="200,50 250,100 200,150 150,100" class="image" />
    <text x="185" y="105" class="content" style="font-size: 24px; fill: #E74C3C;">!</text>
  </g>
</svg>