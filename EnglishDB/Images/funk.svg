<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">funk</text>
  <text x="50" y="120" class="subtitle">[fʌŋk] n. 放克音乐，恐惧；v. 害怕，畏缩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "fonke"，意为“烟雾”或“气味”，后引申为“恐惧”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在舞台上，突然闻到一股“烟雾(fonke)”，
    <tspan x="50" dy="25">他开始感到“恐惧(funk)”，音乐风格也变得紧张起来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The band played a funky tune that got everyone dancing.
  </text>
  <text x="50" y="310" class="content">
    乐队演奏了一首放克音乐，让所有人都跳起舞来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Musician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Smoke -->
    <path d="M100,50 C120,30 180,30 200,50" class="image" />
    <path d="M100,70 C120,50 180,50 200,70" class="image" />
    <path d="M100,90 C120,70 180,70 200,90" class="image" />
    <!-- Fear -->
    <text x="220" y="120" class="content" style="font-size: 36px;">😨</text>
  </g>
</svg>