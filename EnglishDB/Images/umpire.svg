<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">umpire</text>
  <text x="50" y="120" class="subtitle">[ˈʌmpaɪər] n. 裁判，仲裁者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> umpi (裁判) + re (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个裁判(umpire)站在比赛场地中央，
    <tspan x="50" dy="25">手持哨子，公正地判断比赛中的每一个动作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The umpire blew the whistle to signal the start of the game.
  </text>
  <text x="50" y="310" class="content">
    裁判吹响了哨子，标志着比赛的开始。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Umpire -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Whistle -->
    <line x1="50" y1="120" x2="50" y2="110" class="image" />
    <line x1="45" y1="110" x2="55" y2="110" class="image" />
  </g>
</svg>