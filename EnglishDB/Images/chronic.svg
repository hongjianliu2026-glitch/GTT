<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chronic</text>
  <text x="50" y="120" class="subtitle">[ˈkrɒnɪk] adj. 慢性的，长期的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chron- (时间) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的钟表，"时间(chron-)"
    <tspan x="50" dy="25">不停地走，象征着长期的(chronic)状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffers from chronic back pain.
  </text>
  <text x="50" y="310" class="content">
    他长期遭受背痛的折磨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Hour marks -->
    <line x1="100" y1="25" x2="100" y2="35" class="image" />
    <line x1="175" y1="100" x2="165" y2="100" class="image" />
    <line x1="100" y1="175" x2="100" y2="165" class="image" />
    <line x1="25" y1="100" x2="35" y2="100" class="image" />
  </g>
</svg>