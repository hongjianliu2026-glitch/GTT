<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dial</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪəl] n. 刻度盘，拨号盘；v. 拨号</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (二) + al (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的电话机，上面有一个"双动作(di-al)"的拨号盘，
    <tspan x="50" dy="25">你需要转动它来拨打电话号码。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She dialed the number to order a pizza.
  </text>
  <text x="50" y="310" class="content">
    她拨打了电话号码来订购披萨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Phone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dial -->
    <circle cx="175" cy="100" r="70" class="image" />
    <!-- Numbers -->
    <text x="135" y="60" class="content">1</text>
    <text x="215" y="60" class="content">2</text>
    <text x="285" y="100" class="content">3</text>
    <text x="285" y="180" class="content">4</text>
    <text x="215" y="220" class="content">5</text>
    <text x="135" y="220" class="content">6</text>
    <text x="65" y="180" class="content">7</text>
    <text x="65" y="100" class="content">8</text>
    <text x="135" y="140" class="content">9</text>
    <text x="215" y="140" class="content">0</text>
    <!-- Hand -->
    <line x1="175" y1="100" x2="245" y2="100" class="image" />
  </g>
</svg>