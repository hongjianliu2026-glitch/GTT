<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">callous</text>
  <text x="50" y="120" class="subtitle">[ˈkæləs] adj. 无情的，冷酷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> callus (老茧) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人手上的老茧(callus)变得如此厚实，以至于他变得"无情(callous)"，
    <tspan x="50" dy="25">对周围的一切都漠不关心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His callous disregard for the suffering of others shocked everyone.
  </text>
  <text x="50" y="310" class="content">
    他对他人痛苦的冷酷无视震惊了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand with callus -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="40" class="image" fill="#F1C40F" />
    <circle cx="100" cy="100" r="30" class="image" fill="#E67E22" />
    <circle cx="100" cy="100" r="20" class="image" fill="#D35400" />
    <circle cx="100" cy="100" r="10" class="image" fill="#B03A2E" />
    <!-- Fingers -->
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="150" x2="50" y2="250" class="image" />
    <line x1="100" y1="150" x2="150" y2="250" class="image" />
  </g>
</svg>