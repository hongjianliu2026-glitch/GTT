<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">goo</text>
  <text x="50" y="120" class="subtitle">[ɡuː] n. 黏性物质，黏液</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拟声词，模拟黏液流动的声音
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小怪兽在实验室里，不小心打翻了一瓶黏液，黏液"咕噜咕噜(goo)"地流出来，
    <tspan x="50" dy="25">覆盖了整个地面，小怪兽惊慌失措地试图逃离。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The goo from the experiment covered the floor.
  </text>
  <text x="50" y="310" class="content">
    实验中的黏液覆盖了地板。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Laboratory table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Beaker -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <!-- Goo spill -->
    <ellipse cx="150" cy="150" rx="100" ry="50" class="image" />
    <!-- Monster -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>