<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boob</text>
  <text x="50" y="120" class="subtitle">[buːb] n. 笨蛋，傻瓜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "bobbe"，意为“笨蛋”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个笨蛋(boob)在努力思考，却总是做出愚蠢的决定，
    <tspan x="50" dy="25">就像一个迷路的小丑在舞台上滑稽地表演。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made such a boob of himself at the party.
  </text>
  <text x="50" y="310" class="content">
    他在派对上表现得像个十足的笨蛋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clown head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Clown nose -->
    <circle cx="100" cy="100" r="10" class="image" fill="#E74C3C" />
    <!-- Clown eyes -->
    <circle cx="80" cy="80" r="5" class="image" fill="#2C3E50" />
    <circle cx="120" cy="80" r="5" class="image" fill="#2C3E50" />
    <!-- Clown mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" fill="none" />
    <!-- Clown hat -->
    <rect x="50" y="20" width="100" height="30" class="image" />
    <rect x="60" y="10" width="80" height="20" class="image" />
  </g>
</svg>