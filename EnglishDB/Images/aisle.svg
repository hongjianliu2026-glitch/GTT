<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aisle</text>
  <text x="50" y="120" class="subtitle">[aɪl] n. 过道，通道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (朝向) + is (走) + le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狭窄的通道，人们"朝向(a-)"
    <tspan x="50" dy="25">走(is)"过这个"小(le)"空间，这就是过道(aisle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She walked down the aisle to the stage.
  </text>
  <text x="50" y="310" class="content">
    她沿着过道走向舞台。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Aisle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Narrow path -->
    <rect x="100" y="20" width="150" height="160" class="image" />
    <!-- Person walking -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="170" y2="120" class="image" />
  </g>
</svg>