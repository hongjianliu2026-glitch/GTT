<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sheer</text>
  <text x="50" y="120" class="subtitle">[ʃɪər] adj. 纯粹的，绝对的；adv. 完全地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sheer (来自古英语 scir，意为“清晰的，纯粹的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块完全透明的玻璃，"纯粹的(sheer)"
    <tspan x="50" dy="25">没有任何杂质，就像这个词所表达的纯粹和绝对。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sheer beauty of the landscape took my breath away.
  </text>
  <text x="50" y="310" class="content">
    那纯粹的美景让我屏住了呼吸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass pane -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Reflection lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Text on glass -->
    <text x="150" y="100" class="content" fill="#7F8C8D" font-size="36">SHEER</text>
  </g>
</svg>