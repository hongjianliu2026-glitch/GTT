<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vertically</text>
  <text x="50" y="120" class="subtitle">[ˈvɜːrtɪkli] adv. 垂直地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vert (转) + -ical (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的旋转木马，"转(vert)"成了
    <tspan x="50" dy="25">一根直立的柱子，这就是"垂直地(vertically)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ladder was placed vertically against the wall.
  </text>
  <text x="50" y="310" class="content">
    梯子垂直地靠在墙上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vertical line -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Rotating carousel -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <line x1="125" y1="100" x2="225" y2="100" class="image" />
    <!-- Arrow indicating vertical direction -->
    <polygon points="175,210 165,230 185,230" class="image" />
  </g>
</svg>