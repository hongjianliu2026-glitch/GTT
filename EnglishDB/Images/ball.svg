<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ball</text>
  <text x="50" y="120" class="subtitle">[bɔːl] n. 球，舞会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ball (源自拉丁语 "ballare"，意为跳舞)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的球在舞会上滚动，人们围绕着它跳舞，
    <tspan x="50" dy="25">这个球既是舞会的中心，也是人们欢乐的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She kicked the ball into the goal.
  </text>
  <text x="50" y="310" class="content">
    她把球踢进了球门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ball -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- People dancing around the ball -->
    <circle cx="50" cy="100" r="10" class="image" fill="#2ECC71" />
    <circle cx="150" cy="100" r="10" class="image" fill="#2ECC71" />
    <circle cx="100" cy="50" r="10" class="image" fill="#2ECC71" />
    <circle cx="100" cy="150" r="10" class="image" fill="#2ECC71" />
  </g>
</svg>