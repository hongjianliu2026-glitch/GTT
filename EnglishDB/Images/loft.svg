<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loft</text>
  <text x="50" y="120" class="subtitle">[lɔft] n. 阁楼，顶楼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loft (高处)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个高高的阁楼(loft)，里面堆满了旧家具和箱子，
    <tspan x="50" dy="25">仿佛时间在这里停滞了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They found an old painting in the loft.
  </text>
  <text x="50" y="310" class="content">
    他们在阁楼里发现了一幅旧画。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Roof -->
    <polygon points="0,0 200,0 150,50 50,50" class="image" />
    <!-- Loft -->
    <rect x="50" y="50" width="100" height="100" class="image" />
    <!-- Window -->
    <rect x="80" y="70" width="40" height="40" class="image" />
    <!-- Furniture -->
    <rect x="60" y="120" width="80" height="30" class="image" />
    <rect x="70" y="160" width="60" height="20" class="image" />
  </g>
</svg>