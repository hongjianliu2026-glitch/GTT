<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">birth</text>
  <text x="50" y="120" class="subtitle">[bɜːrθ] n. 出生，诞生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (生命) + -rth (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新生命从母亲的子宫中"产生(bi-rth)"，
    <tspan x="50" dy="25">这个过程就是出生(birth)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby's birth was a joyful event for the family.
  </text>
  <text x="50" y="310" class="content">
    这个婴儿的出生是全家人的一件喜事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mother's womb -->
    <ellipse cx="200" cy="150" rx="150" ry="100" class="image" />
    <!-- Baby -->
    <circle cx="200" cy="150" r="30" class="image" />
    <!-- Umbilical cord -->
    <line x1="200" y1="180" x2="200" y2="250" class="image" />
    <!-- Mother -->
    <circle cx="200" cy="300" r="50" class="image" />
    <line x1="200" y1="350" x2="200" y2="400" class="image" />
    <line x1="200" y1="370" x2="150" y2="350" class="image" />
    <line x1="200" y1="370" x2="250" y2="350" class="image" />
  </g>
</svg>