<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">assign</text>
  <text x="50" y="120" class="subtitle">[əˈsaɪn] v. 分配，指派</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> as- (朝向) + sign (标记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老师在黑板上，"朝向(as-)"
    <tspan x="50" dy="25">某个学生，用粉笔"标记(sign)"出任务，</tspan>
    <tspan x="50" dy="25">这个学生就被"分配(assign)"了任务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager assigned the new project to the team.
  </text>
  <text x="50" y="310" class="content">
    经理将新项目分配给了团队。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blackboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Teacher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Student -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="200" y2="120" class="image" />
    <!-- Arrow pointing to student -->
    <line x1="50" y1="100" x2="130" y2="100" class="image" />
    <polygon points="130,100 125,95 125,105" class="image" />
    <!-- Task mark -->
    <text x="250" y="120" class="content" fill="#000">Task</text>
  </g>
</svg>