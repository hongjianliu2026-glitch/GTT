<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flannel</text>
  <text x="50" y="120" class="subtitle">[ˈflænl] n. 法兰绒，法兰绒衣服</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flan (法兰绒) + nel (表示材料)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的冬天，你穿着一件柔软的"法兰绒(flan-nel)"
    <tspan x="50" dy="25">衣服，温暖舒适，就像被包裹在一片温暖的云朵中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a flannel shirt to keep warm.
  </text>
  <text x="50" y="310" class="content">
    他穿了一件法兰绒衬衫来保暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flannel shirt -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Buttons -->
    <circle cx="100" cy="60" r="10" class="image" />
    <circle cx="150" cy="60" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <!-- Sleeves -->
    <line x1="70" y1="20" x2="70" y2="180" class="image" />
    <line x1="280" y1="20" x2="280" y2="180" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="125" y2="140" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
  </g>
</svg>