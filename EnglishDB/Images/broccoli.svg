<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">broccoli</text>
  <text x="50" y="120" class="subtitle">[ˈbrɑːkəli] n. 西兰花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> broccolo (意大利语，意为“小芽”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小芽(broccolo)在阳光下茁壮成长，
    <tspan x="50" dy="25">最终长成了一棵茂盛的西兰花(broccoli)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat steamed broccoli with a little bit of salt.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃蒸西兰花，加点盐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broccoli stem -->
    <rect x="150" y="0" width="20" height="150" class="image" />
    <!-- Broccoli florets -->
    <circle cx="160" cy="10" r="20" class="image" />
    <circle cx="160" cy="40" r="20" class="image" />
    <circle cx="160" cy="70" r="20" class="image" />
    <circle cx="160" cy="100" r="20" class="image" />
    <circle cx="160" cy="130" r="20" class="image" />
  </g>
</svg>