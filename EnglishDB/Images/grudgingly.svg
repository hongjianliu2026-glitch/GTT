<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grudgingly</text>
  <text x="50" y="120" class="subtitle">[ˈɡrʌdʒɪŋli] adv. 勉强地，不情愿地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grudg (怨恨) + -ing (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人满脸怨恨，"勉强地(grudgingly)"
    <tspan x="50" dy="25">递给你一个礼物，他的表情和动作都透露出不情愿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He grudgingly admitted that she was right.
  </text>
  <text x="50" y="310" class="content">
    他勉强承认她是对的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a grudging expression -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="120" x2="20" y2="110" class="image" />
    <line x1="50" y1="120" x2="80" y2="110" class="image" />
    <!-- Gift box -->
    <rect x="100" y="50" width="60" height="40" class="image" />
    <line x1="100" y1="50" x2="160" y2="50" class="image" />
    <line x1="100" y1="90" x2="160" y2="90" class="image" />
    <line x1="100" y1="50" x2="100" y2="90" class="image" />
    <line x1="160" y1="50" x2="160" y2="90" class="image" />
    <!-- Hand reaching out -->
    <line x1="50" y1="150" x2="100" y2="90" class="image" />
  </g>
</svg>