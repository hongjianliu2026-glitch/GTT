<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knock</text>
  <text x="50" y="120" class="subtitle">[nɒk] v. 敲，击；n. 敲击声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kn- (手) + -ock (击打)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手("kn-")用力击打("-ock")门，发出"咚咚"的声音，这就是敲门(knock)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He knocked on the door before entering.
  </text>
  <text x="50" y="310" class="content">
    他进门前敲了敲门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Hand knocking -->
    <line x1="220" y1="150" x2="280" y2="150" class="image" />
    <line x1="280" y1="150" x2="260" y2="130" class="image" />
    <line x1="280" y1="150" x2="260" y2="170" class="image" />
    <!-- Knocking sound -->
    <circle cx="300" cy="120" r="10" class="image" />
    <circle cx="320" cy="100" r="10" class="image" />
    <circle cx="340" cy="80" r="10" class="image" />
  </g>
</svg>