<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overwhelming</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈwelmɪŋ] adj. 压倒性的，势不可挡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + whelm (淹没)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海浪"从上面淹没(over-whelm)"
    <tspan x="50" dy="25">整个城市，这种力量是压倒性的(overwhelming)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The overwhelming majority voted for the new policy.
  </text>
  <text x="50" y="310" class="content">
    绝大多数人投票支持新政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="20" height="100" class="image" />
    <rect x="100" y="20" width="20" height="120" class="image" />
    <rect x="150" y="20" width="20" height="140" class="image" />
    <rect x="200" y="20" width="20" height="160" class="image" />
    <rect x="250" y="20" width="20" height="180" class="image" />
    <rect x="300" y="20" width="20" height="200" class="image" />
    <!-- Wave -->
    <path d="M0,100 C100,50 250,50 350,100" class="image" />
    <path d="M0,120 C100,70 250,70 350,120" class="image" />
    <path d="M0,140 C100,90 250,90 350,140" class="image" />
  </g>
</svg>