<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">honest</text>
  <text x="50" y="120" class="subtitle">[ˈɒnɪst] adj. 诚实的，正直的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hon (荣誉) + -est (最高级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在荣誉的领奖台上，"荣誉(hon)"
    <tspan x="50" dy="25">最高级(est)，这个人就是最诚实(honest)的人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is known for his honest character.
  </text>
  <text x="50" y="310" class="content">
    他以诚实的品格著称。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Podium -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on podium -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="170" class="image" />
    <line x1="175" y1="150" x2="205" y2="170" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
    <!-- Medal -->
    <circle cx="175" cy="80" r="20" class="image" />
    <line x1="175" y1="80" x2="175" y2="100" class="image" />
  </g>
</svg>