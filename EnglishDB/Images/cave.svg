<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cave</text>
  <text x="50" y="120" class="subtitle">[keɪv] n. 洞穴，山洞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cav (空)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"空洞(cav)"，里面充满了神秘和未知，
    <tspan x="50" dy="25">这就是一个洞穴(cave)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They discovered a hidden cave in the mountains.
  </text>
  <text x="50" y="310" class="content">
    他们在山中发现了一个隐藏的洞穴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cave entrance -->
    <path d="M 0 100 Q 50 50 100 100 L 300 100 Q 350 50 400 100 L 400 200 L 0 200 Z" class="image" />
    <!-- Shadows -->
    <path d="M 0 100 Q 50 50 100 100 L 100 200 Z" class="image" />
    <path d="M 300 100 Q 350 50 400 100 L 400 200 Z" class="image" />
  </g>
</svg>