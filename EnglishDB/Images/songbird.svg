<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">songbird</text>
  <text x="50" y="120" class="subtitle">[ˈsɒŋbɜːrd] n. 鸣鸟，鸣禽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> song (歌曲) + bird (鸟)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在树枝上，"唱出(song)"
    <tspan x="50" dy="25">美妙的旋律，它就是一只鸣鸟(songbird)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The songbird's melody filled the morning air.
  </text>
  <text x="50" y="310" class="content">
    鸣鸟的旋律充满了清晨的空气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Bird -->
    <circle cx="175" cy="0" r="20" class="image" />
    <line x1="175" y1="20" x2="175" y2="50" class="image" />
    <line x1="175" y1="50" x2="155" y2="80" class="image" />
    <line x1="175" y1="50" x2="195" y2="80" class="image" />
    <line x1="175" y1="30" x2="205" y2="20" class="image" />
    <!-- Musical notes -->
    <circle cx="220" cy="-10" r="5" class="image" />
    <circle cx="240" cy="-20" r="5" class="image" />
    <circle cx="260" cy="-10" r="5" class="image" />
    <line x1="220" y1="-5" x2="240" y2="-15" class="image" />
    <line x1="240" y1="-15" x2="260" y2="-5" class="image" />
  </g>
</svg>