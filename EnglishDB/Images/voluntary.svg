<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">voluntary</text>
  <text x="50" y="120" class="subtitle">[ˈvɒləntəri] adj. 自愿的，志愿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vol- (意愿) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的心形标志前，"心(vol)"
    <tspan x="50" dy="25">中充满了自愿(voluntary)的意愿，象征着自愿的行为。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a voluntary donation to the charity.
  </text>
  <text x="50" y="310" class="content">
    她自愿向慈善机构捐款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30 Q90 30 100 50 T90 90 Q70 110 50 90 T10 90 Q0 70 10 50 Z" class="image" fill="#E74C3C" />
    <!-- Person -->
    <circle cx="55" cy="120" r="15" class="image" fill="#2980B9" />
    <line x1="55" y1="135" x2="55" y2="170" class="image" />
    <line x1="55" y1="170" x2="40" y2="200" class="image" />
    <line x1="55" y1="170" x2="70" y2="200" class="image" />
    <line x1="55" y1="150" x2="80" y2="140" class="image" />
  </g>
</svg>