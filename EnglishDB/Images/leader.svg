<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leader</text>
  <text x="50" y="120" class="subtitle">[ˈliːdər] n. 领导者，领袖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lead (引导) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个领袖(leader)站在高处，"引导(lead)"
    <tspan x="50" dy="25">一群人前进，他的身影高大而坚定。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leader of the team motivated everyone to work harder.
  </text>
  <text x="50" y="310" class="content">
    团队的领导者激励每个人更加努力工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leader -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- People following -->
    <circle cx="150" cy="120" r="15" class="image" />
    <line x1="150" y1="135" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="150" x2="190" y2="140" class="image" />
    <circle cx="250" cy="120" r="15" class="image" />
    <line x1="250" y1="135" x2="250" y2="170" class="image" />
    <line x1="250" y1="170" x2="230" y2="200" class="image" />
    <line x1="250" y1="170" x2="270" y2="200" class="image" />
    <line x1="250" y1="150" x2="290" y2="140" class="image" />
  </g>
</svg>