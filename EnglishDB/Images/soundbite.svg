<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soundbite</text>
  <text x="50" y="120" class="subtitle">[ˈsaʊndbaɪt] n. 简短引语，简短有力的言论</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sound (声音) + bite (咬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个政治家在演讲中，"咬住(bite)"
    <tspan x="50" dy="25">关键点，用简短有力的声音(sound)表达观点，</tspan>
    <tspan x="50" dy="25">这就是一个soundbite。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The politician's soundbite went viral on social media.
  </text>
  <text x="50" y="310" class="content">
    这位政治家的简短引语在社交媒体上疯传。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microphone -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="20" r="20" class="image" />
    <line x1="50" y1="40" x2="50" y2="200" class="image" />
    <!-- Speech bubble -->
    <path d="M 120 100 Q 200 100 200 150 Q 150 150 120 100" class="image" />
    <text x="130" y="130" class="content">"简短有力"</text>
  </g>
</svg>