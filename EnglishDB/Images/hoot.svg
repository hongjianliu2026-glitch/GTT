<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hoot</text>
  <text x="50" y="120" class="subtitle">[hut] n. 猫头鹰的叫声，嘲笑声；v. 发出猫头鹰般的叫声，嘲笑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hoot (源自拟声词，模仿猫头鹰的叫声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫头鹰在夜晚发出"hoot hoot"的叫声，
    <tspan x="50" dy="25">声音在森林中回荡，仿佛在嘲笑那些迷路的旅人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The owl's hoot echoed through the forest.
  </text>
  <text x="50" y="310" class="content">
    猫头鹰的叫声在森林中回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Owl -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="130" y2="140" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Moon -->
    <circle cx="300" cy="50" r="20" class="image" />
    <!-- Forest -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="50" y1="200" x2="50" y2="150" class="image" />
    <line x1="100" y1="200" x2="100" y2="160" class="image" />
    <line x1="150" y1="200" x2="150" y2="170" class="image" />
    <line x1="200" y1="200" x2="200" y2="180" class="image" />
    <line x1="250" y1="200" x2="250" y2="190" class="image" />
    <line x1="300" y1="200" x2="300" y2="200" class="image" />
  </g>
</svg>