<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yeah</text>
  <text x="50" y="120" class="subtitle">[jeɪ] adv. 是的，对</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "yea"，表示肯定
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在听到好消息时，兴奋地跳起来，大声喊出"yeah!"，
    <tspan x="50" dy="25">表达他的喜悦和肯定。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> "Do you want to go to the party?" "Yeah, I'd love to!"
  </text>
  <text x="50" y="310" class="content">
    "你想去参加派对吗？" "是的，我很想去！"
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person jumping -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="30" y2="140" class="image" />
    <line x1="50" y1="150" x2="70" y2="140" class="image" />
    <!-- Exclamation mark -->
    <text x="80" y="120" class="image" font-size="48" fill="#C0392B">!</text>
  </g>
</svg>