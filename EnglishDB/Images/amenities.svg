<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">amenities</text>
  <text x="50" y="120" class="subtitle">[əˈmiːnətiːz] n. 便利设施，舒适设备</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (强调) + men (保持) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个豪华酒店，"强调保持(a-men-ity)"
    <tspan x="50" dy="25">舒适的环境，提供各种便利设施(amenities)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hotel offers a range of amenities including a spa and a gym.
  </text>
  <text x="50" y="310" class="content">
    这家酒店提供一系列便利设施，包括水疗中心和健身房。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hotel building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Swimming pool -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Gym -->
    <rect x="50" y="90" width="100" height="50" class="image" />
    <!-- Spa -->
    <rect x="200" y="90" width="100" height="50" class="image" />
    <!-- Sunbeds -->
    <line x1="70" y1="40" x2="100" y2="40" class="image" />
    <line x1="120" y1="40" x2="150" y2="40" class="image" />
    <line x1="170" y1="40" x2="200" y2="40" class="image" />
    <!-- Gym equipment -->
    <line x1="60" y1="100" x2="60" y2="130" class="image" />
    <line x1="70" y1="100" x2="70" y2="130" class="image" />
    <line x1="80" y1="100" x2="80" y2="130" class="image" />
    <!-- Spa chair -->
    <line x1="210" y1="100" x2="210" y2="130" class="image" />
    <line x1="220" y1="100" x2="220" y2="130" class="image" />
  </g>
</svg>