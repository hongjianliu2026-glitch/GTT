<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buyout</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪaʊt] n. 收购，买断</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> buy (买) + out (出去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人用一大堆钱"买(buy)"走了一家公司，
    <tspan x="50" dy="25">把其他人都"赶出去(out)"，这就是买断(buyout)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company was facing a hostile buyout.
  </text>
  <text x="50" y="310" class="content">
    这家公司正面临敌意收购。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Money stack -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="10" y="10" width="80" height="180" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <rect x="30" y="30" width="40" height="140" class="image" />
    <rect x="40" y="40" width="20" height="120" class="image" />
    <!-- Company building -->
    <rect x="150" y="100" width="150" height="100" class="image" />
    <line x1="160" y1="110" x2="290" y2="110" class="image" />
    <line x1="160" y1="130" x2="290" y2="130" class="image" />
    <line x1="160" y1="150" x2="290" y2="150" class="image" />
    <line x1="160" y1="170" x2="290" y2="170" class="image" />
    <!-- Exit sign -->
    <rect x="320" y="120" width="30" height="30" class="image" />
    <line x1="325" y1="125" x2="345" y2="145" class="image" />
    <line x1="345" y1="125" x2="325" y2="145" class="image" />
  </g>
</svg>