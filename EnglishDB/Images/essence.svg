<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">essence</text>
  <text x="50" y="120" class="subtitle">[ˈɛsəns] n. 本质，精髓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> es- (存在) + -sence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的瓶子，里面装着"存在的核心(es-sence)"，
    <tspan x="50" dy="25">这个核心就是事物的本质(essence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The essence of the problem is a lack of communication.
  </text>
  <text x="50" y="310" class="content">
    问题的本质在于缺乏沟通。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <!-- Essence -->
    <circle cx="50" cy="100" r="30" fill="#FFD700" />
    <!-- Light rays -->
    <line x1="50" y1="70" x2="50" y2="0" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="20" y1="100" x2="0" y2="100" class="image" />
    <line x1="80" y1="100" x2="100" y2="100" class="image" />
  </g>
</svg>