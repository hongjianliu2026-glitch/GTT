<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">linen</text>
  <text x="50" y="120" class="subtitle">[ˈlɪnɪn] n. 亚麻布，亚麻织品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lin (亚麻) + -en (表示材料)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，村民们正在用亚麻(lin)
    <tspan x="50" dy="25">编织成柔软的亚麻布(linen)，用来制作衣物和床单。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers to use linen sheets for their softness.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢用亚麻床单，因为它们很柔软。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Loom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flax plant -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="75" y1="20" x2="75" y2="100" class="image" />
    <line x1="75" y1="100" x2="50" y2="120" class="image" />
    <line x1="75" y1="100" x2="100" y2="120" class="image" />
    <!-- Linen fabric -->
    <rect x="150" y="20" width="150" height="160" class="image" />
    <line x1="160" y1="50" x2="290" y2="50" class="image" />
    <line x1="160" y1="80" x2="290" y2="80" class="image" />
    <line x1="160" y1="110" x2="290" y2="110" class="image" />
    <line x1="160" y1="140" x2="290" y2="140" class="image" />
  </g>
</svg>