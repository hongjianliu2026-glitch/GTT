<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">capability</text>
  <text x="50" y="120" class="subtitle">[ˌkeɪpəˈbɪləti] n. 能力，才能</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cap (拿) + -ability (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一座巨大的山峰前，"拿(cap)"
    <tspan x="50" dy="25">起自己的能力(ability)，准备攀登这座山峰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His capability to solve complex problems is impressive.
  </text>
  <text x="50" y="310" class="content">
    他解决复杂问题的能力令人印象深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Person -->
    <circle cx="150" cy="220" r="15" class="image" />
    <line x1="150" y1="235" x2="150" y2="270" class="image" />
    <line x1="150" y1="270" x2="130" y2="300" class="image" />
    <line x1="150" y1="270" x2="170" y2="300" class="image" />
    <line x1="150" y1="250" x2="180" y2="240" class="image" />
    <!-- Ability symbol -->
    <text x="150" y="350" class="highlight" text-anchor="middle">能力</text>
  </g>
</svg>