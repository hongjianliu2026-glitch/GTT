<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">racketeering</text>
  <text x="50" y="120" class="subtitle">[ˌrækɪˈtɪərɪŋ] n. 敲诈勒索，诈骗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> racket (喧闹) + -eer (从事...的人) + -ing (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑帮老大在街头，"制造喧闹(racket)"
    <tspan x="50" dy="25">并勒索路人，这种行为就是敲诈勒索(racketeering)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police arrested him for racketeering.
  </text>
  <text x="50" y="310" class="content">
    警察因他敲诈勒索而逮捕了他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Thug -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Victim -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Money -->
    <rect x="250" y="80" width="30" height="20" class="image" />
    <line x1="250" y1="80" x2="280" y2="80" class="image" />
    <line x1="250" y1="90" x2="280" y2="90" class="image" />
    <line x1="250" y1="100" x2="280" y2="100" class="image" />
  </g>
</svg>