<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shortfall</text>
  <text x="50" y="120" class="subtitle">[ˈʃɔːrtfɔːl] n. 短缺，不足</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> short (短的) + fall (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装满苹果的篮子，突然"短了一截(short)"，
    <tspan x="50" dy="25">苹果"掉落(fall)"了一些，篮子里出现了短缺(shortfall)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company experienced a shortfall in revenue last quarter.
  </text>
  <text x="50" y="310" class="content">
    公司上个季度收入出现了短缺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Apples in the basket -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Falling apples -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="120" r="20" class="image" />
    <circle cx="200" cy="140" r="20" class="image" />
    <!-- Shortfall -->
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <text x="150" y="200" class="content">Shortfall</text>
  </g>
</svg>