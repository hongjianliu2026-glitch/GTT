<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">All-American</text>
  <text x="50" y="120" class="subtitle">[ˌɔl əˈmɛrɪkən] adj. 全美的，典型的美国人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> all- (全部) + American (美国的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个典型的美国人在棒球场上，"全部(all)"
    <tspan x="50" dy="25">代表着美国的价值观和生活方式，这就是全美(All-American)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was the epitome of an All-American boy.
  </text>
  <text x="50" y="310" class="content">
    他是典型的美国男孩的代表。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baseball field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Baseball diamond -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Home plate -->
    <rect x="170" y="160" width="10" height="10" class="image" />
    <!-- Bases -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="240" cy="100" r="10" class="image" />
    <circle cx="170" cy="40" r="10" class="image" />
    <!-- Player -->
    <circle cx="170" cy="140" r="15" class="image" />
    <line x1="170" y1="155" x2="170" y2="190" class="image" />
    <line x1="170" y1="190" x2="150" y2="220" class="image" />
    <line x1="170" y1="190" x2="190" y2="220" class="image" />
    <line x1="170" y1="170" x2="200" y2="160" class="image" />
  </g>
</svg>