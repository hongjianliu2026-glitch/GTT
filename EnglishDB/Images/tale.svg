<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tale</text>
  <text x="50" y="120" class="subtitle">[teɪl] n. 故事，传说</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tal (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，一位老人坐在火堆旁，"讲述(tal)"
    <tspan x="50" dy="25">着神秘的传说，这些传说就构成了一个故事(tale)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to listen to the old tales of her grandmother.
  </text>
  <text x="50" y="310" class="content">
    她喜欢听祖母讲述古老的故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Old man -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Fire -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="170" cy="100" r="15" class="image" />
    <circle cx="190" cy="100" r="10" class="image" />
    <!-- Speech bubble -->
    <path d="M220,50 Q250,30 280,50 Q250,70 220,50" class="image" />
    <text x="230" y="60" class="content">"Once upon a time..."</text>
  </g>
</svg>