<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">homogeneous</text>
  <text x="50" y="120" class="subtitle">[ˌhoʊməˈdʒiːniəs] adj. 同质的，均匀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> homo- (相同) + gen (产生) + -eous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的搅拌机，将所有东西都"混合成相同(homo-gen)"
    <tspan x="50" dy="25">的状态，这就是同质(homogeneous)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soup was homogeneous, with all ingredients perfectly blended.
  </text>
  <text x="50" y="310" class="content">
    这汤是均匀的，所有成分都完美地混合在一起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blender -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Blender container -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Blender blades -->
    <line x1="150" y1="40" x2="150" y2="140" class="image" />
    <line x1="100" y1="90" x2="200" y2="90" class="image" />
    <!-- Mixed ingredients -->
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="180" cy="100" r="10" class="image" />
    <circle cx="140" cy="120" r="10" class="image" />
    <circle cx="160" cy="60" r="10" class="image" />
  </g>
</svg>