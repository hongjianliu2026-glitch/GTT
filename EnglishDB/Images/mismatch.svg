<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mismatch</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsˈmætʃ] n. 不匹配，不协调</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + match (匹配)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着一只红鞋和一只绿鞋，"错误地匹配(mis-match)"
    <tspan x="50" dy="25">了鞋子，形成了不协调的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The colors of the curtains and the walls created a mismatch.
  </text>
  <text x="50" y="310" class="content">
    窗帘和墙壁的颜色形成了不协调。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Left shoe -->
    <rect x="50" y="20" width="100" height="50" class="image" fill="#FF5733" />
    <!-- Right shoe -->
    <rect x="200" y="20" width="100" height="50" class="image" fill="#33FF57" />
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="100" y2="220" class="image" />
    <line x1="150" y1="180" x2="200" y2="220" class="image" />
    <line x1="150" y1="140" x2="100" y2="130" class="image" />
    <line x1="150" y1="140" x2="200" y2="130" class="image" />
  </g>
</svg>