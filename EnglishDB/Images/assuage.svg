<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">assuage</text>
  <text x="50" y="120" class="subtitle">[əˈsweɪdʒ] v. 缓和，减轻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + suav (甜，缓和)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在喝一杯甜甜的蜂蜜水，"朝向(ad-)"
    <tspan x="50" dy="25">甜味(suav)，痛苦和焦虑被缓和(assuage)了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tried to assuage her guilt by donating to charity.
  </text>
  <text x="50" y="310" class="content">
    她试图通过向慈善机构捐款来减轻自己的内疚感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Honey jar -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="160" r="10" class="image" />
    <circle cx="40" cy="140" r="8" class="image" />
    <circle cx="60" cy="130" r="6" class="image" />
    <!-- Spoon -->
    <line x1="120" y1="50" x2="200" y2="150" class="image" />
    <line x1="120" y1="50" x2="120" y2="100" class="image" />
    <!-- Person -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Smile -->
    <path d="M240,110 Q250,100 260,110" class="image" />
  </g>
</svg>