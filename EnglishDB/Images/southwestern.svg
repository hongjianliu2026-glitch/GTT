<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">southwestern</text>
  <text x="50" y="120" class="subtitle">[ˌsaʊθˈwɛstərn] adj. 西南的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> south (南) + west (西) + -ern (方向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指南针，指向"南(south)"和"西(west)"的方向，
    <tspan x="50" dy="25">这个方向就是西南(southwestern)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The southwestern part of the country is known for its deserts.
  </text>
  <text x="50" y="310" class="content">
    这个国家的西南部以其沙漠而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="20" y1="100" x2="330" y2="100" class="image" />
    <!-- South arrow -->
    <line x1="175" y1="180" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="160" y2="205" class="image" />
    <line x1="175" y1="220" x2="190" y2="205" class="image" />
    <!-- West arrow -->
    <line x1="20" y1="100" x2="0" y2="100" class="image" />
    <line x1="0" y1="100" x2="15" y2="85" class="image" />
    <line x1="0" y1="100" x2="15" y2="115" class="image" />
    <!-- Southwestern arrow -->
    <line x1="20" y1="180" x2="100" y2="260" class="image" />
    <line x1="100" y1="260" x2="85" y2="245" class="image" />
    <line x1="100" y1="260" x2="115" y2="245" class="image" />
  </g>
</svg>