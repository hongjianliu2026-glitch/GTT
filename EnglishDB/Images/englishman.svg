<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Englishman</text>
  <text x="50" y="120" class="subtitle">[ˈɪŋɡlɪʃmən] n. 英国人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> English (英国的) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着传统英国服装的人，戴着高顶礼帽，
    <tspan x="50" dy="25">手里拿着一把雨伞，站在伦敦的街头。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Englishman spoke with a distinct accent.
  </text>
  <text x="50" y="310" class="content">
    那个英国人说话带有明显的口音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Top hat -->
    <rect x="100" y="20" width="100" height="20" class="image" />
    <rect x="120" y="0" width="60" height="20" class="image" />
    <!-- Face -->
    <circle cx="150" cy="70" r="30" class="image" />
    <!-- Body -->
    <rect x="130" y="100" width="40" height="80" class="image" />
    <!-- Umbrella -->
    <line x1="150" y1="100" x2="150" y2="20" class="image" />
    <path d="M150,20 L180,50 L120,50 Z" class="image" />
    <!-- Legs -->
    <line x1="130" y1="180" x2="110" y2="220" class="image" />
    <line x1="170" y1="180" x2="190" y2="220" class="image" />
  </g>
</svg>