<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laid-back</text>
  <text x="50" y="120" class="subtitle">[ˈleɪd bæk] adj. 放松的，悠闲的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> laid (放置) + back (后面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"放置(laid)"自己"在后面(back)"，
    <tspan x="50" dy="25">悠闲地躺在沙滩椅上，享受着阳光和海风。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He has a laid-back attitude towards life.
  </text>
  <text x="50" y="310" class="content">
    他对生活有一种悠闲的态度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beach chair -->
    <rect x="50" y="20" width="200" height="50" class="image" />
    <rect x="70" y="70" width="160" height="10" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Waves -->
    <path d="M50,200 Q100,150 150,200 T250,200" class="image" />
    <path d="M50,220 Q100,170 150,220 T250,220" class="image" />
  </g>
</svg>