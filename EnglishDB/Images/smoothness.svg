<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smoothness</text>
  <text x="50" y="120" class="subtitle">[ˈsmuːðnəs] n. 光滑，平滑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smooth (光滑的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块光滑的冰面，"光滑(smooth)"得连一只蚂蚁都能轻松滑行，
    <tspan x="50" dy="25">这种极致的平滑就是"光滑度(smoothness)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smoothness of the silk made it a pleasure to touch.
  </text>
  <text x="50" y="310" class="content">
    丝绸的光滑度让人爱不释手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Ant -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="190" y2="150" class="image" />
    <line x1="200" y1="130" x2="210" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="115" class="image" />
  </g>
</svg>