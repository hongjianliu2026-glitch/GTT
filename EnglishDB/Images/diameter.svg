<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diameter</text>
  <text x="50" y="120" class="subtitle">[daɪˈæmɪtər] n. 直径</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dia- (通过) + meter (测量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆盘，"通过(dia-)"
    <tspan x="50" dy="25">圆心测量(meter)出一条直线，这条直线就是直径(diameter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The diameter of the circle is 10 cm.
  </text>
  <text x="50" y="310" class="content">
    这个圆的直径是10厘米。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle -->
    <circle cx="175" cy="100" r="100" class="image" />
    <!-- Diameter line -->
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <!-- Arrowheads -->
    <polygon points="75,100 85,95 85,105" class="image" />
    <polygon points="275,100 265,95 265,105" class="image" />
    <!-- Center point -->
    <circle cx="175" cy="100" r="5" class="image" />
  </g>
</svg>