<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frontline</text>
  <text x="50" y="120" class="subtitle">[ˈfrʌntlaɪn] n. 前线，最前线</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> front (前面) + line (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群士兵站在一条"前面(front)"的"线(line)"上，
    <tspan x="50" dy="25">他们就是前线(frontline)的战士，直面敌人的最前线。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers were stationed at the frontline during the battle.
  </text>
  <text x="50" y="310" class="content">
    士兵们在战斗中驻扎在前线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Frontline -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Soldiers -->
    <circle cx="50" cy="20" r="15" class="image" />
    <circle cx="120" cy="20" r="15" class="image" />
    <circle cx="190" cy="20" r="15" class="image" />
    <circle cx="260" cy="20" r="15" class="image" />
    <!-- Enemy -->
    <rect x="300" y="-30" width="50" height="50" class="image" />
  </g>
</svg>