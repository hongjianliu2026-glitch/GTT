<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shake</text>
  <text x="50" y="120" class="subtitle">[ʃeɪk] v. 摇动，震动；n. 摇动，震动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sh- (表示动作) + -ake (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手拿着一杯水，"摇动(sh-ake)"
    <tspan x="50" dy="25">杯子，水在杯中晃动，这就是shake的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She shook the bottle before opening it.
  </text>
  <text x="50" y="310" class="content">
    她在打开瓶子之前摇了摇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hand -->
    <path d="M 0 100 Q 50 50 100 100 L 100 150 Q 50 200 0 150 Z" class="image" />
    <!-- Cup -->
    <rect x="100" y="100" width="50" height="70" class="image" />
    <!-- Water -->
    <path d="M 110 110 Q 120 120 130 110 Q 120 130 110 120 Z" class="image" />
  </g>
</svg>