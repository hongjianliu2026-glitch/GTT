<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cryptic</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪptɪk] adj. 神秘的，隐晦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crypt (隐藏) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的石碑，上面刻着"隐藏(crypt)"的符号，
    <tspan x="50" dy="25">这些符号难以理解，充满了神秘(cryptic)的气息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The message was so cryptic that no one could decipher it.
  </text>
  <text x="50" y="310" class="content">
    这条信息如此隐晦，以至于没有人能解开它。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ancient stone tablet -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hidden symbols -->
    <text x="50" y="100" font-size="48" fill="#7F8C8D" transform="rotate(-10 50 100)">?</text>
    <text x="150" y="120" font-size="48" fill="#7F8C8D" transform="rotate(10 150 120)">!</text>
    <text x="250" y="80" font-size="48" fill="#7F8C8D" transform="rotate(-5 250 80)">*</text>
    <!-- Ancient stone texture -->
    <rect x="0" y="0" width="350" height="200" fill="url(#stoneTexture)" />
    <defs>
      <pattern id="stoneTexture" patternUnits="userSpaceOnUse" width="10" height="10">
        <circle cx="5" cy="5" r="2" fill="#BDC3C7" />
      </pattern>
    </defs>
  </g>
</svg>