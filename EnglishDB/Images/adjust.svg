<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adjust</text>
  <text x="50" y="120" class="subtitle">[əˈdʒʌst] v. 调整，适应</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + just (正确)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在调整(adjust)一个不平衡的天平，
    <tspan x="50" dy="25">他不断朝向(ad-)正确的(just)位置移动砝码，</tspan>
    <tspan x="50" dy="25">直到天平完全平衡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She adjusted her schedule to fit in more study time.
  </text>
  <text x="50" y="310" class="content">
    她调整了她的日程安排，以便有更多时间学习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="0" y1="50" x2="100" y2="50" class="image" />
    <line x1="20" y1="50" x2="20" y2="100" class="image" />
    <line x1="80" y1="50" x2="80" y2="100" class="image" />
    <!-- Weights -->
    <rect x="10" y="100" width="20" height="30" class="image" />
    <rect x="70" y="100" width="20" height="30" class="image" />
    <!-- Person adjusting -->
    <circle cx="50" cy="200" r="15" class="image" />
    <line x1="50" y1="215" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="30" y2="280" class="image" />
    <line x1="50" y1="250" x2="70" y2="280" class="image" />
    <line x1="50" y1="230" x2="80" y2="220" class="image" />
  </g>
</svg>