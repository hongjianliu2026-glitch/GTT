<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">magazine</text>
  <text x="50" y="120" class="subtitle">[ˌmæɡəˈziːn] n. 杂志，弹药库</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mag (仓库) + azine (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小仓库(mag-azine)里堆满了各种杂志，
    <tspan x="50" dy="25">每本杂志都装满了知识和故事，就像一个小型的知识仓库。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She reads a fashion magazine every month.
  </text>
  <text x="50" y="310" class="content">
    她每个月都读一本时尚杂志。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magazine stack -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="30" class="image" />
    <rect x="50" y="60" width="250" height="30" class="image" />
    <rect x="50" y="100" width="250" height="30" class="image" />
    <rect x="50" y="140" width="250" height="30" class="image" />
    <!-- Magazine cover -->
    <text x="60" y="45" class="content" style="font-size: 20px;">Fashion</text>
    <text x="60" y="85" class="content" style="font-size: 20px;">Science</text>
    <text x="60" y="125" class="content" style="font-size: 20px;">Travel</text>
    <text x="60" y="165" class="content" style="font-size: 20px;">Health</text>
  </g>
</svg>