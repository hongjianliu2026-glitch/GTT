<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">veritable</text>
  <text x="50" y="120" class="subtitle">[ˈvɛrɪtəbl] adj. 真正的，名副其实的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> veri (真实) + -table (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"真实(veri)"标志，上面写着"真正的(veritable)"，
    <tspan x="50" dy="25">象征着某物是名副其实的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This is a veritable feast for the eyes.
  </text>
  <text x="50" y="310" class="content">
    这是一场名副其实的视觉盛宴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Giant "veri" sign -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <text x="50" y="100" class="title" style="font-size: 60px; fill: #E74C3C;">veri</text>
    <!-- "True" label -->
    <text x="150" y="150" class="content" style="font-size: 30px; fill: #2980B9;">True</text>
  </g>
</svg>