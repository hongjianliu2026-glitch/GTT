<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">improve</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpruːv] v. 改善，提高</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + prove (证明)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一个破旧的物品，"进入(im-)"
    <tspan x="50" dy="25">一个神奇的房间，出来时物品变得更好(prove)了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She improved her English skills by practicing every day.
  </text>
  <text x="50" y="310" class="content">
    她通过每天练习提高了她的英语技能。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken item -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="70" class="image" />
    <line x1="100" y1="20" x2="100" y2="70" class="image" />
    <line x1="50" y1="70" x2="100" y2="70" class="image" />
    <line x1="75" y1="70" x2="75" y2="120" class="image" />
    <line x1="50" y1="95" x2="100" y2="95" class="image" />

    <!-- Magic room -->
    <rect x="150" y="20" width="150" height="100" class="image" />
    <line x1="225" y1="20" x2="225" y2="120" class="image" />

    <!-- Improved item -->
    <line x1="350" y1="20" x2="400" y2="20" class="image" />
    <line x1="350" y1="20" x2="350" y2="70" class="image" />
    <line x1="400" y1="20" x2="400" y2="70" class="image" />
    <line x1="350" y1="70" x2="400" y2="70" class="image" />
    <line x1="375" y1="70" x2="375" y2="120" class="image" />
    <line x1="350" y1="95" x2="400" y2="95" class="image" />
    <line x1="350" y1="120" x2="400" y2="120" class="image" />
  </g>
</svg>