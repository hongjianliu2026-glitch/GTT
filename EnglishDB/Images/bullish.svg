<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bullish</text>
  <text x="50" y="120" class="subtitle">[ˈbʊlɪʃ] adj. 看涨的，乐观的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bull (公牛) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头强壮的公牛(bull)在股市中横冲直撞，
    <tspan x="50" dy="25">它的气势和力量让人感到市场前景一片光明，</tspan>
    <tspan x="50" dy="25">这就是"bullish"（看涨的）的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The analysts are bullish about the company's future.
  </text>
  <text x="50" y="310" class="content">
    分析师们对公司的未来持乐观态度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bull -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="160" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="200" x2="20" y2="240" class="image" /> <!-- Front leg -->
    <line x1="50" y1="200" x2="80" y2="240" class="image" /> <!-- Back leg -->
    <line x1="50" y1="130" x2="20" y2="110" class="image" /> <!-- Horn -->
    <line x1="50" y1="130" x2="80" y2="110" class="image" /> <!-- Horn -->
    <!-- Market graph -->
    <polyline points="150,200 200,150 250,180 300,120 350,160" class="image" />
    <text x="150" y="210" class="content">Market</text>
  </g>
</svg>