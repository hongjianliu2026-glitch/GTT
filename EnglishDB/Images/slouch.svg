<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slouch</text>
  <text x="50" y="120" class="subtitle">[slaʊtʃ] v. 懒散地坐或站；n. 懒散的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sl- (表示懒散) + ouch (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人懒散地坐在沙发上，"懒散地(sl-)"
    <tspan x="50" dy="25">瘫坐着，这就是一个懒散的人(slouch)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was slouching in his chair, looking bored.
  </text>
  <text x="50" y="310" class="content">
    他懒散地坐在椅子上，看起来很无聊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sofa -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person slouching -->
    <circle cx="100" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="100" y1="120" x2="100" y2="180" class="image" /> <!-- Body -->
    <line x1="100" y1="180" x2="80" y2="220" class="image" /> <!-- Left leg -->
    <line x1="100" y1="180" x2="120" y2="220" class="image" /> <!-- Right leg -->
    <line x1="100" y1="140" x2="80" y2="160" class="image" /> <!-- Left arm -->
    <line x1="100" y1="140" x2="120" y2="160" class="image" /> <!-- Right arm -->
  </g>
</svg>