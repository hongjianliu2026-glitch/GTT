<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">espresso</text>
  <text x="50" y="120" class="subtitle">[ɛˈsprɛsoʊ] n. 浓缩咖啡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + press (压)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台咖啡机，"压出(ex-press)"
    <tspan x="50" dy="25">浓郁的咖啡，这就是浓缩咖啡(espresso)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He ordered an espresso to start his day.
  </text>
  <text x="50" y="310" class="content">
    他点了一杯浓缩咖啡来开始新的一天。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Coffee cup -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Steam -->
    <line x1="100" y1="20" x2="120" y2="0" class="image" />
    <line x1="100" y1="30" x2="130" y2="10" class="image" />
    <line x1="100" y1="40" x2="140" y2="20" class="image" />
    <!-- Coffee beans -->
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="270" cy="50" r="10" class="image" />
    <circle cx="290" cy="50" r="10" class="image" />
    <!-- Pressing mechanism -->
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="180" y1="125" x2="220" y2="125" class="image" />
  </g>
</svg>