<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cold { fill: #AED6F1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chilly</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɪli] adj. 寒冷的，冷淡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chill (寒冷) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的冬天，你站在户外，"寒冷(chill)"
    <tspan x="50" dy="25">的感觉让你全身发抖，这就是"寒冷的(chilly)"感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wind made the evening feel chilly.
  </text>
  <text x="50" y="310" class="content">
    风让夜晚感觉很冷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowman -->
    <circle cx="100" cy="100" r="50" class="cold" />
    <circle cx="100" cy="180" r="70" class="cold" />
    <circle cx="100" cy="280" r="90" class="cold" />
    <!-- Eyes -->
    <circle cx="70" cy="90" r="10" class="image" />
    <circle cx="130" cy="90" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
    <!-- Arms -->
    <line x1="50" y1="180" x2="0" y2="150" class="image" />
    <line x1="150" y1="180" x2="200" y2="150" class="image" />
    <!-- Snowflakes -->
    <circle cx="250" cy="50" r="10" class="cold" />
    <circle cx="300" cy="100" r="10" class="cold" />
    <circle cx="350" cy="150" r="10" class="cold" />
  </g>
</svg>