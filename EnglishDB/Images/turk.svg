<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Turk</text>
  <text x="50" y="120" class="subtitle">[tɜːrk] n. 土耳其人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中世纪拉丁语 "Turcus"，意为"土耳其人"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个土耳其人戴着传统的土耳其毡帽，站在伊斯坦布尔的蓝色清真寺前，
    <tspan x="50" dy="25">背景是博斯普鲁斯海峡，这样的画面让人立刻联想到"Turk"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Turk spoke fluent Turkish.
  </text>
  <text x="50" y="310" class="content">
    那个土耳其人讲一口流利的土耳其语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional Turkish hat -->
    <circle cx="100" cy="50" r="30" class="image" />
    <rect x="70" y="80" width="60" height="20" class="image" />
    <!-- Blue Mosque -->
    <rect x="0" y="120" width="200" height="100" class="image" />
    <line x1="20" y1="120" x2="20" y2="220" class="image" />
    <line x1="180" y1="120" x2="180" y2="220" class="image" />
    <!-- Bosphorus Strait -->
    <line x1="0" y1="240" x2="200" y2="240" class="image" />
    <line x1="0" y1="250" x2="200" y2="250" class="image" />
    <line x1="0" y1="260" x2="200" y2="260" class="image" />
  </g>
</svg>