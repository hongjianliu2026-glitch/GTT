<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deflate</text>
  <text x="50" y="120" class="subtitle">[dɪˈfleɪt] v. 放气，缩小，泄气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + flate (膨胀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球被"向下(de-)"挤压，"膨胀(flate)"的部分逐渐消失，
    <tspan x="50" dy="25">最终气球"放气(deflate)"缩小了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She deflated the balloon after the party.
  </text>
  <text x="50" y="310" class="content">
    派对结束后，她把气球放气了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <ellipse cx="150" cy="100" rx="100" ry="150" class="image" />
    <!-- Deflated balloon -->
    <ellipse cx="150" cy="200" rx="50" ry="75" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <polygon points="150,100 140,120 160,120" class="image" />
  </g>
</svg>