<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tourist</text>
  <text x="50" y="120" class="subtitle">[ˈtʊərɪst] n. 游客，旅行者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tour (旅行) + -ist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个游客(tourist)背着相机，"四处旅行(tour)"，
    <tspan x="50" dy="25">记录下每一个美丽的瞬间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Eiffel Tower attracts millions of tourists every year.
  </text>
  <text x="50" y="310" class="content">
    埃菲尔铁塔每年吸引数百万游客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tourist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Camera -->
    <rect x="50" y="80" width="30" height="20" class="image" />
    <line x1="65" y1="80" x2="65" y2="60" class="image" />
    <circle cx="65" cy="55" r="5" class="image" />
    <!-- Landscape -->
    <rect x="0" y="180" width="100" height="20" class="image" />
    <rect x="20" y="160" width="60" height="20" class="image" />
    <rect x="40" y="140" width="20" height="20" class="image" />
  </g>
</svg>