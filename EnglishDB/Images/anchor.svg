<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anchor</text>
  <text x="50" y="120" class="subtitle">[ˈæŋkər] n. 锚；v. 抛锚，固定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (加强) + chor (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在大海上，"加强弯曲(an-chor)"
    <tspan x="50" dy="25">的锚深深扎入海底，牢牢固定住船只。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship anchored in the harbor for the night.
  </text>
  <text x="50" y="310" class="content">
    船只在港口抛锚过夜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Boat -->
    <rect x="150" y="50" width="100" height="30" class="image" fill="#8E44AD" />
    <!-- Anchor -->
    <path d="M200,80 L200,150 L180,170 L220,170 Z" class="image" fill="#2C3E50" />
    <!-- Chain -->
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <line x1="200" y1="160" x2="190" y2="170" class="image" />
    <line x1="200" y1="160" x2="210" y2="170" class="image" />
    <line x1="200" y1="170" x2="190" y2="180" class="image" />
    <line x1="200" y1="170" x2="210" y2="180" class="image" />
    <line x1="200" y1="180" x2="190" y2="190" class="image" />
    <line x1="200" y1="180" x2="210" y2="190" class="image" />
  </g>
</svg>