<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fostering</text>
  <text x="50" y="120" class="subtitle">[ˈfɒstərɪŋ] v. 培养，促进</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> foster (养育，培养)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个园丁在花园里，"精心培养(foster)"
    <tspan x="50" dy="25">每一株植物，让它们茁壮成长。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher's role is to foster a love of learning in her students.
  </text>
  <text x="50" y="310" class="content">
    老师的角色是培养学生对学习的热爱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Plants -->
    <line x1="50" y1="180" x2="50" y2="100" class="image" />
    <line x1="100" y1="180" x2="100" y2="120" class="image" />
    <line x1="150" y1="180" x2="150" y2="140" class="image" />
    <line x1="200" y1="180" x2="200" y2="160" class="image" />
    <!-- Gardener -->
    <circle cx="250" cy="150" r="15" class="image" />
    <line x1="250" y1="165" x2="250" y2="190" class="image" />
    <line x1="250" y1="190" x2="230" y2="210" class="image" />
    <line x1="250" y1="190" x2="270" y2="210" class="image" />
    <line x1="250" y1="175" x2="280" y2="165" class="image" />
  </g>
</svg>