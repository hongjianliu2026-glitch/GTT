<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mare</text>
  <text x="50" y="120" class="subtitle">[mɛər] n. 母马，母驴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar- (海) + -e (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一匹母马(mare)在海边(mar-)，
    <tspan x="50" dy="25">它的鬃毛在海风中飘扬，仿佛海浪一般。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mare trotted gracefully across the meadow.
  </text>
  <text x="50" y="310" class="content">
    那匹母马优雅地小跑穿过草地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Neck -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="180" x2="50" y2="250" class="image" /> <!-- Body -->
    <line x1="50" y1="250" x2="20" y2="290" class="image" /> <!-- Back leg -->
    <line x1="50" y1="250" x2="80" y2="290" class="image" /> <!-- Back leg -->
    <line x1="50" y1="250" x2="50" y2="280" class="image" /> <!-- Tail -->
    <!-- Sea -->
    <rect x="0" y="300" width="350" height="50" class="image" />
    <line x1="0" y1="300" x2="350" y2="300" class="image" />
    <line x1="0" y1="325" x2="350" y2="325" class="image" />
    <line x1="0" y1="350" x2="350" y2="350" class="image" />
  </g>
</svg>