<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clothing</text>
  <text x="50" y="120" class="subtitle">[ˈkloʊðɪŋ] n. 衣服，服装</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cloth (布) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的衣柜，里面挂满了各种"布料(cloth)"，
    <tspan x="50" dy="25">这些布料被精心制作成各种衣服(clothing)，</tspan>
    <tspan x="50" dy="25">每一件都像是艺术品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She packed her clothing for the trip.
  </text>
  <text x="50" y="310" class="content">
    她为旅行打包了衣服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wardrobe -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clothes -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- Hanger -->
    <line x1="75" y1="20" x2="75" y2="40" class="image" />
    <line x1="145" y1="20" x2="145" y2="40" class="image" />
    <line x1="215" y1="20" x2="215" y2="40" class="image" />
    <line x1="285" y1="20" x2="285" y2="40" class="image" />
  </g>
</svg>