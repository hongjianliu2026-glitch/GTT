<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bead</text>
  <text x="50" y="120" class="subtitle">[biːd] n. 珠子，水珠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (存在) + ad (附加)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一串珠子，每一颗珠子都是"存在(be-)"的，
    <tspan x="50" dy="25">它们被"附加(ad)"在一起，形成了一串美丽的项链。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a necklace of colorful beads.
  </text>
  <text x="50" y="310" class="content">
    她戴着一串彩色珠子的项链。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Necklace -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <!-- Beads -->
    <circle cx="100" cy="50" r="15" class="image" fill="#FFD700" />
    <circle cx="150" cy="50" r="15" class="image" fill="#C0C0C0" />
    <circle cx="200" cy="50" r="15" class="image" fill="#8B4513" />
    <circle cx="250" cy="50" r="15" class="image" fill="#FF69B4" />
    <circle cx="300" cy="50" r="15" class="image" fill="#40E0D0" />
  </g>
</svg>