<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orbital</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrbɪtl] adj. 轨道的，眼窝的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> orbi- (轨道) + -tal (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宇航员在太空中，"围绕(orbi-)"
    <tspan x="50" dy="25">地球的轨道上飞行，这就是轨道(orbital)的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The satellite is in a stable orbital path.
  </text>
  <text x="50" y="310" class="content">
    卫星处于稳定的轨道上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="150" cy="100" r="50" class="image" fill="#3498DB" />
    <!-- Satellite -->
    <circle cx="250" cy="100" r="10" class="image" fill="#E74C3C" />
    <!-- Orbit path -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Astronaut -->
    <circle cx="250" cy="100" r="15" class="image" fill="#F1C40F" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>