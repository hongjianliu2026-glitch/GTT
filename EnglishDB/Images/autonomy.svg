<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">autonomy</text>
  <text x="50" y="120" class="subtitle">[ɔːˈtɒnəmi] n. 自治，自主</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auto- (自己) + nomy (法律，规则)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个独立的小岛，"自己制定法律(auto-nomy)"，
    <tspan x="50" dy="25">不受外界干扰，完全自主(autonomy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The region gained autonomy after years of struggle.
  </text>
  <text x="50" y="310" class="content">
    经过多年的斗争，该地区获得了自治权。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Island -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Flag -->
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <rect x="80" y="20" width="40" height="30" class="image" />
    <!-- Law book -->
    <rect x="150" y="50" width="60" height="40" class="image" />
    <line x1="160" y1="60" x2="200" y2="60" class="image" />
    <line x1="160" y1="70" x2="200" y2="70" class="image" />
    <line x1="160" y1="80" x2="200" y2="80" class="image" />
  </g>
</svg>