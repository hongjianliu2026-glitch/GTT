<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gala</text>
  <text x="50" y="120" class="subtitle">[ˈɡɑːlə] n. 盛会，庆典</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gala (源自拉丁语 "galea"，意为头盔，象征庄严和盛大)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个盛大的庆典，人们戴着华丽的头盔(gala)，
    <tspan x="50" dy="25">欢聚一堂，庆祝这个庄严而盛大的时刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company held a gala to celebrate its 20th anniversary.
  </text>
  <text x="50" y="310" class="content">
    公司举办了一场盛会来庆祝其20周年纪念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Party scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Helmet -->
    <path d="M50 85 L70 60 L90 85 Z" class="image" />
    <path d="M100 85 L120 60 L140 85 Z" class="image" />
    <path d="M150 85 L170 60 L190 85 Z" class="image" />
    <path d="M200 85 L220 60 L240 85 Z" class="image" />
    <path d="M250 85 L270 60 L290 85 Z" class="image" />
    <!-- Table -->
    <rect x="50" y="120" width="250" height="50" class="image" />
    <!-- Food -->
    <circle cx="70" cy="145" r="10" class="image" />
    <circle cx="120" cy="145" r="10" class="image" />
    <circle cx="170" cy="145" r="10" class="image" />
    <circle cx="220" cy="145" r="10" class="image" />
    <circle cx="270" cy="145" r="10" class="image" />
  </g>
</svg>