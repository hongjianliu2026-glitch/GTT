<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lumbering</text>
  <text x="50" y="120" class="subtitle">[ˈlʌmbərɪŋ] adj. 笨重的，缓慢移动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lumber (木材) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头巨大的木头大象，"笨重地(lumbering)"
    <tspan x="50" dy="25">在森林中缓慢移动，每一步都发出沉重的声音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lumbering truck took forever to pass by.
  </text>
  <text x="50" y="310" class="content">
    那辆笨重的卡车花了很长时间才开过去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Elephant body -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <!-- Elephant legs -->
    <line x1="75" y1="150" x2="75" y2="200" class="image" />
    <line x1="125" y1="150" x2="125" y2="200" class="image" />
    <line x1="225" y1="150" x2="225" y2="200" class="image" />
    <line x1="275" y1="150" x2="275" y2="200" class="image" />
    <!-- Elephant head -->
    <circle cx="275" cy="75" r="25" class="image" />
    <!-- Elephant trunk -->
    <path d="M275,75 Q300,50 325,75" class="image" />
  </g>
</svg>