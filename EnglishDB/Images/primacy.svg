<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">primacy</text>
  <text x="50" y="120" class="subtitle">[ˈpraɪməsi] n. 首要地位，首位</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prim (第一) + -acy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“1”被放在所有其他数字的前面，象征着“首要地位(primacy)”。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The primacy of the CEO is undisputed in the company.
  </text>
  <text x="50" y="310" class="content">
    公司里CEO的首要地位是毋庸置疑的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large number "1" -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <line x1="50" y1="50" x2="20" y2="80" class="image" />
    <line x1="50" y1="50" x2="80" y2="80" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />

    <!-- Smaller numbers "2" and "3" -->
    <g transform="translate(150,0)">
      <line x1="50" y1="50" x2="50" y2="120" class="image" />
      <line x1="50" y1="50" x2="20" y2="80" class="image" />
      <line x1="50" y1="50" x2="80" y2="80" class="image" />
      <line x1="50" y1="120" x2="20" y2="150" class="image" />
      <line x1="50" y1="120" x2="80" y2="150" class="image" />
    </g>
    <g transform="translate(250,0)">
      <line x1="50" y1="50" x2="50" y2="120" class="image" />
      <line x1="50" y1="50" x2="20" y2="80" class="image" />
      <line x1="50" y1="50" x2="80" y2="80" class="image" />
      <line x1="50" y1="120" x2="20" y2="150" class="image" />
      <line x1="50" y1="120" x2="80" y2="150" class="image" />
    </g>
  </g>
</svg>