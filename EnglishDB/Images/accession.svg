<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accession</text>
  <text x="50" y="120" class="subtitle">[ækˈseʃən] n. 就职，加入，增加</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + cess (走) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"朝向(ad-)"某个位置"走(cess)"去，
    <tspan x="50" dy="25">象征着加入或就职，这就是"accession"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accession of the new president was celebrated nationwide.
  </text>
  <text x="50" y="310" class="content">
    新总统的就职在全国范围内庆祝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path representing the movement -->
    <path d="M50,150 Q150,50 250,150" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Destination -->
    <rect x="230" y="130" width="40" height="40" class="image" />
    <text x="240" y="160" class="content">就职</text>
  </g>
</svg>