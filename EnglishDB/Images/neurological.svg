<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neurological</text>
  <text x="50" y="120" class="subtitle">[ˌnʊroʊˈlɑdʒɪkl] adj. 神经学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neuro- (神经) + logy (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神经学家在研究大脑，"神经(neuro-)"
    <tspan x="50" dy="25">和"学科(logy)"的结合，构成了神经学(neurological)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor specializes in neurological disorders.
  </text>
  <text x="50" y="310" class="content">
    这位医生专门研究神经紊乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Doctor -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Brain-Doctor connection -->
    <line x1="150" y1="100" x2="185" y2="100" class="image" />
  </g>
</svg>