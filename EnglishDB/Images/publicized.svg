<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">publicized</text>
  <text x="50" y="120" class="subtitle">[ˈpʌblɪsaɪzd] v. 宣传，公布</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> public (公众) + -ize (使) + -ed (过去分词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的喇叭，"使(ize)"
    <tspan x="50" dy="25">公众(public)听到消息，这就是宣传(publicized)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event was publicized widely on social media.
  </text>
  <text x="50" y="310" class="content">
    这个活动在社交媒体上被广泛宣传。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Loudspeaker -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="50" y="20" width="50" height="60" class="image" />
    <line x1="75" y1="80" x2="75" y2="120" class="image" />
    <line x1="75" y1="120" x2="50" y2="150" class="image" />
    <line x1="75" y1="120" x2="100" y2="150" class="image" />
    <!-- Sound waves -->
    <circle cx="75" cy="160" r="10" class="image" />
    <circle cx="75" cy="180" r="15" class="image" />
    <circle cx="75" cy="200" r="20" class="image" />
  </g>
</svg>