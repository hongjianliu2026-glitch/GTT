<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">encouragement</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkɜːrɪdʒmənt] n. 鼓励，激励</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + courage (勇气)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在困境中，突然被"注入(en-)"
    <tspan x="50" dy="25">勇气(courage)，瞬间充满了力量和希望，这就是鼓励(encouragement)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her words of encouragement helped me to keep going.
  </text>
  <text x="50" y="310" class="content">
    她鼓励的话语帮助我继续前行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in distress -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Light of encouragement -->
    <circle cx="150" cy="100" r="20" class="image" fill="#F1C40F" />
    <line x1="150" y1="120" x2="50" y2="120" class="image" stroke="#F1C40F" stroke-width="3" />
    <!-- Person receiving encouragement -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <line x1="250" y1="150" x2="220" y2="140" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />
  </g>
</svg>