<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cigar</text>
  <text x="50" y="120" class="subtitle">[sɪˈɡɑːr] n. 雪茄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自西班牙语 "cigarro"，意为“小烟卷”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个富豪在豪华游艇上，手持一根巨大的雪茄，
    <tspan x="50" dy="25">烟雾缭绕，仿佛整个世界都在他的掌控之中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He lit a cigar and enjoyed the sunset.
  </text>
  <text x="50" y="310" class="content">
    他点燃了一根雪茄，享受着日落的美景。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cigar -->
    <rect x="0" y="0" width="300" height="50" rx="25" ry="25" class="image" fill="#8B4513" />
    <!-- Smoke -->
    <circle cx="320" cy="25" r="20" class="image" fill="#E5E5E5" />
    <circle cx="350" cy="25" r="25" class="image" fill="#E5E5E5" />
    <circle cx="380" cy="25" r="30" class="image" fill="#E5E5E5" />
    <!-- Rich man -->
    <circle cx="50" cy="100" r="20" class="image" fill="#FFD700" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
  </g>
</svg>