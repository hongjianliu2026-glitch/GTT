<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resonate</text>
  <text x="50" y="120" class="subtitle">[ˈrɛzəˌneɪt] v. 共鸣，回响</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + son (声音) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的声音在山谷中回荡，"再次发出(re-son)"
    <tspan x="50" dy="25">声音，引起共鸣(resonate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her words resonated with the audience.
  </text>
  <text x="50" y="310" class="content">
    她的话引起了观众的共鸣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountains -->
    <path d="M0,200 L100,50 L200,200 L300,50 L400,200" class="image" />
    <!-- Sound waves -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="40" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
    <!-- Sound source -->
    <circle cx="200" cy="100" r="5" class="image" fill="#E74C3C" />
  </g>
</svg>