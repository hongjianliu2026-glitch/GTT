<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .berry { fill: #C0392B; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cranberry</text>
  <text x="50" y="120" class="subtitle">[ˈkrænˌbɛri] n. 蔓越莓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cran (鹤) + berry (浆果)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鹤(cran)在沼泽地里，"啄食(berry)"
    <tspan x="50" dy="25">红色的蔓越莓，这些浆果就叫做蔓越莓(cranberry)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to make cranberry sauce for Thanksgiving.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在感恩节做蔓越莓酱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cranberry bush -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cranberries -->
    <circle cx="50" cy="50" r="15" class="berry" />
    <circle cx="100" cy="70" r="15" class="berry" />
    <circle cx="150" cy="60" r="15" class="berry" />
    <circle cx="200" cy="80" r="15" class="berry" />
    <circle cx="250" cy="50" r="15" class="berry" />
    <!-- Crane -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="190" class="image" />
    <line x1="300" y1="160" x2="320" y2="190" class="image" />
    <line x1="300" y1="140" x2="330" y2="130" class="image" />
  </g>
</svg>