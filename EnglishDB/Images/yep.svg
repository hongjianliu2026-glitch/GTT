<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yep</text>
  <text x="50" y="120" class="subtitle">[jɛp] int. 是的，对</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自 yes (是的) 的缩写
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在回答问题时，快速而肯定地说 "yep"，
    <tspan x="50" dy="25">就像一个快速的点头动作，表示 "是的，对"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> "Do you want to go out tonight?" "Yep!"
  </text>
  <text x="50" y="310" class="content">
    "你今晚想出去吗？" "是的！"
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Mouth -->
    <line x1="30" y1="65" x2="70" y2="65" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="40" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
    <!-- Body -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <!-- Arms -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Legs -->
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <!-- Nodding motion -->
    <line x1="50" y1="20" x2="50" y2="30" class="image" />
  </g>
</svg>