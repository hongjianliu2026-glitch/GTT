<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pressing</text>
  <text x="50" y="120" class="subtitle">[ˈprɛsɪŋ] adj. 紧迫的，迫切的；v. 压，按</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> press (压) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头压在一个人身上，"压(press)"
    <tspan x="50" dy="25">得他喘不过气来，这种紧迫感(pressing)让人无法忽视。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pressing deadline made us work overtime.
  </text>
  <text x="50" y="310" class="content">
    紧迫的截止日期让我们不得不加班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large stone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person under the stone -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="180" x2="205" y2="170" class="image" />
    <line x1="175" y1="180" x2="145" y2="170" class="image" />
    <!-- Pressure lines -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="250" y1="0" x2="250" y2="200" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
  </g>
</svg>