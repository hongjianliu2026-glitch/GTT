<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underground</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈɡraʊnd] adj. 地下的；秘密的；n. 地铁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...下面) + ground (地面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在地下(under-)行走，脚踩着地面(ground)，
    <tspan x="50" dy="25">突然发现了一个秘密通道，这就是地下(underground)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spy sent messages through the underground network.
  </text>
  <text x="50" y="310" class="content">
    间谍通过地下网络发送信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Underground tunnel -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Tunnel entrance -->
    <rect x="150" y="160" width="100" height="40" class="image" />
  </g>
</svg>