<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">respectable</text>
  <text x="50" y="120" class="subtitle">[rɪˈspektəbl] adj. 值得尊敬的，体面的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + spect (看) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着整洁西装的人，"再次被人们(re-spect)"
    <tspan x="50" dy="25">注视，因为他举止得体，值得尊敬(respectable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a respectable man with a good reputation.
  </text>
  <text x="50" y="310" class="content">
    他是一个有良好声誉的值得尊敬的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in a suit -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <line x1="50" y1="20" x2="30" y2="40" class="image" />
    <line x1="50" y1="20" x2="70" y2="40" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Respect symbol -->
    <line x1="120" y1="100" x2="160" y2="100" class="image" />
    <line x1="140" y1="80" x2="140" y2="120" class="image" />
    <line x1="120" y1="100" x2="140" y2="80" class="image" />
    <line x1="160" y1="100" x2="140" y2="120" class="image" />
  </g>
</svg>