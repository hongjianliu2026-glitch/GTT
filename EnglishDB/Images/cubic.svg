<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cubic</text>
  <text x="50" y="120" class="subtitle">[ˈkjuːbɪk] adj. 立方体的，立方的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cub (立方体) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的立方体，每个面都"立方(cub)"
    <tspan x="50" dy="25">对称，这就是cubic的本质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The volume of the cubic box is 27 cubic meters.
  </text>
  <text x="50" y="310" class="content">
    这个立方体盒子的体积是27立方米。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cube -->
    <polygon points="0,0 100,0 100,100 0,100" class="image" />
    <polygon points="0,0 50,50 150,50 100,0" class="image" />
    <polygon points="100,0 150,50 150,150 100,100" class="image" />
    <polygon points="0,100 50,150 150,150 100,100" class="image" />
    <polygon points="50,50 100,100 100,100 50,150" class="image" />
    <polygon points="50,50 150,50 150,150 50,150" class="image" />
  </g>
</svg>