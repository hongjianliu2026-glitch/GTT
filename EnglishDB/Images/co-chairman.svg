<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">co-chairman</text>
  <text x="50" y="120" class="subtitle">[koʊˈtʃɛərmən] n. 联合主席</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + chairman (主席)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个主席坐在同一张桌子前，"共同(co-)"
    <tspan x="50" dy="25">主持会议，他们就是联合主席(co-chairman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event was organized by the co-chairmen of the committee.
  </text>
  <text x="50" y="310" class="content">
    这次活动是由委员会的联合主席组织的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chairs -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="250" y="20" width="50" height="100" class="image" />
    <!-- People -->
    <circle cx="75" cy="130" r="20" class="image" />
    <circle cx="275" cy="130" r="20" class="image" />
    <!-- Hands -->
    <line x1="75" y1="150" x2="100" y2="180" class="image" />
    <line x1="275" y1="150" x2="250" y2="180" class="image" />
  </g>
</svg>