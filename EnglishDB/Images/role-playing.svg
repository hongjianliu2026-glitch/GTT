<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">role-playing</text>
  <text x="50" y="120" class="subtitle">[ˈroʊl ˌpleɪɪŋ] n. 角色扮演</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> role (角色) + play (扮演)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一个房间里，每个人都"扮演(play)"
    <tspan x="50" dy="25">一个特定的"角色(role)"，他们通过对话和行动来</tspan>
    <tspan x="50" dy="25">展现这个角色的特点，这就是角色扮演(role-playing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They enjoy role-playing games on weekends.
  </text>
  <text x="50" y="310" class="content">
    他们周末喜欢玩角色扮演游戏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Characters -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="90" y2="120" class="image" />

    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="190" y2="120" class="image" />

    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="290" y2="120" class="image" />

    <!-- Dialogue bubbles -->
    <path d="M50 80 Q70 70 90 80" class="image" />
    <path d="M150 80 Q170 70 190 80" class="image" />
    <path d="M250 80 Q270 70 290 80" class="image" />
  </g>
</svg>