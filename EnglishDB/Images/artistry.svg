<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">artistry</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrtɪstri] n. 艺术才能，艺术性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arti- (艺术) + -stry (表示“技能”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在画布上，"用艺术(arti-)"
    <tspan x="50" dy="25">展现出非凡的技能(stry)，这就是艺术才能(artistry)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her artistry in painting is truly remarkable.
  </text>
  <text x="50" y="310" class="content">
    她在绘画中的艺术才能真是令人惊叹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Paintbrush -->
    <line x1="20" y1="115" x2="70" y2="50" class="image" />
    <line x1="70" y1="50" x2="80" y2="40" class="image" />
    <!-- Painting -->
    <circle cx="150" cy="100" r="30" class="image" />
    <rect x="200" y="70" width="100" height="60" class="image" />
    <line x1="320" y1="70" x2="320" y2="130" class="image" />
    <line x1="320" y1="100" x2="350" y2="100" class="image" />
  </g>
</svg>