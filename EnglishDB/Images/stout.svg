<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stout</text>
  <text x="50" y="120" class="subtitle">[staʊt] adj. 结实的，勇敢的；n. 烈性黑啤酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + out (出来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的战士，"站立(st-)"
    <tspan x="50" dy="25">在战场上，勇敢地"出来(out)"面对敌人，</tspan>
    <tspan x="50" dy="25">他就是"结实的(stout)"象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a stout man, able to carry heavy loads.
  </text>
  <text x="50" y="310" class="content">
    他是个结实的男人，能扛重物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="20" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="20" y1="130" x2="20" y2="200" class="image" /> <!-- Body -->
    <line x1="20" y1="150" x2="0" y2="180" class="image" /> <!-- Left arm -->
    <line x1="20" y1="150" x2="40" y2="180" class="image" /> <!-- Right arm -->
    <line x1="20" y1="200" x2="0" y2="230" class="image" /> <!-- Left leg -->
    <line x1="20" y1="200" x2="40" y2="230" class="image" /> <!-- Right leg -->
    <!-- Shield -->
    <rect x="50" y="120" width="60" height="60" class="image" />
    <!-- Sword -->
    <line x1="120" y1="120" x2="120" y2="200" class="image" />
    <line x1="120" y1="120" x2="100" y2="140" class="image" />
  </g>
</svg>