<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commonly</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmənli] adv. 通常地，普遍地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> common (普通的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小镇上，每个人都在做同样的事情，"普遍地(commonly)"
    <tspan x="50" dy="25">走在同一条街道上，这种场景就是commonly的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It is commonly believed that exercise is good for health.
  </text>
  <text x="50" y="310" class="content">
    人们普遍认为锻炼对健康有益。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Town -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Street -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- People -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <!-- Houses -->
    <rect x="70" y="50" width="30" height="40" class="image" />
    <rect x="120" y="50" width="30" height="40" class="image" />
    <rect x="170" y="50" width="30" height="40" class="image" />
    <rect x="220" y="50" width="30" height="40" class="image" />
  </g>
</svg>