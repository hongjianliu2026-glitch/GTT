<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">re-enact</text>
  <text x="50" y="120" class="subtitle">[ˌriːɪˈnækt] v. 重新表演，重演</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + en- (使进入) + act (行动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群演员在舞台上，"再次进入(re-en)"
    <tspan x="50" dy="25">并表演(act)一个历史事件，这就是重演(re-enact)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The students re-enacted the Battle of Waterloo.
  </text>
  <text x="50" y="310" class="content">
    学生们重演了滑铁卢战役。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actors -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Action lines -->
    <line x1="50" y1="115" x2="100" y2="115" class="image" />
    <line x1="100" y1="115" x2="150" y2="115" class="image" />
    <!-- History event -->
    <text x="200" y="110" class="content" style="font-size: 24px;">Battle</text>
  </g>
</svg>