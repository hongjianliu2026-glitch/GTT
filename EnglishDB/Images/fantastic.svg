<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fantastic</text>
  <text x="50" y="120" class="subtitle">[fænˈtæstɪk] adj. 极好的，奇异的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fanta- (幻想) + -stic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满幻想(fanta-)的世界，
    <tspan x="50" dy="25">那里的一切都超乎寻常，令人惊叹(fantastic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was fantastic, with stunning visual effects.
  </text>
  <text x="50" y="310" class="content">
    这部电影非常棒，视觉效果令人惊叹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Star -->
    <polygon points="175,50 190,80 225,85 200,110 205,145 175,130 145,145 150,110 125,85 160,80" class="image" />
    <!-- Rainbow -->
    <path d="M50,200 C100,150 250,150 300,200" class="image" />
    <!-- Unicorn -->
    <circle cx="175" cy="250" r="30" class="image" />
    <line x1="175" y1="280" x2="175" y2="350" class="image" />
    <line x1="175" y1="350" x2="150" y2="400" class="image" />
    <line x1="175" y1="350" x2="200" y2="400" class="image" />
    <line x1="175" y1="320" x2="220" y2="310" class="image" />
    <line x1="175" y1="320" x2="130" y2="310" class="image" />
  </g>
</svg>