<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sequence</text>
  <text x="50" y="120" class="subtitle">[ˈsiːkwəns] n. 序列，顺序</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sequ (跟随) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群小球一个接一个地"跟随(sequ)"，
    <tspan x="50" dy="25">形成了一条有序的"序列(sequence)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sequence of events led to the accident.
  </text>
  <text x="50" y="310" class="content">
    事件的顺序导致了事故。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sequence of balls -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="120" cy="50" r="20" class="image" />
    <circle cx="190" cy="50" r="20" class="image" />
    <circle cx="260" cy="50" r="20" class="image" />
    <circle cx="330" cy="50" r="20" class="image" />
    <!-- Arrows -->
    <line x1="70" y1="50" x2="100" y2="50" class="image" />
    <line x1="140" y1="50" x2="170" y2="50" class="image" />
    <line x1="210" y1="50" x2="240" y2="50" class="image" />
    <line x1="280" y1="50" x2="310" y2="50" class="image" />
    <polygon points="310,40 330,50 310,60" class="image" />
  </g>
</svg>