<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cognition</text>
  <text x="50" y="120" class="subtitle">[kɒɡˈnɪʃ(ə)n] n. 认知，认识</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + gn (知道) + -ition (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在互相交流，"共同知道(co-gn)"
    <tspan x="50" dy="25">彼此的想法，这就是认知(cognition)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The study of cognition involves understanding how we process information.
  </text>
  <text x="50" y="310" class="content">
    认知研究涉及理解我们如何处理信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two heads -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Thought bubbles -->
    <ellipse cx="50" cy="50" rx="30" ry="20" class="image" />
    <ellipse cx="150" cy="50" rx="30" ry="20" class="image" />
    <!-- Connecting lines -->
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
  </g>
</svg>