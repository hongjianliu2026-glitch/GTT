<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mountaintop</text>
  <text x="50" y="120" class="subtitle">[ˈmaʊntəntɒp] n. 山顶，山峰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mountain (山) + top (顶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的登山者，"攀登到山的顶端(mountain-top)"，
    <tspan x="50" dy="25">站在山峰上，俯瞰整个世界，感受那种征服自然的壮丽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They reached the mountaintop after a long hike.
  </text>
  <text x="50" y="310" class="content">
    经过长时间的徒步，他们到达了山顶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <polygon points="0,200 200,0 400,200" style="fill:#7F8C8D;stroke:#34495E;stroke-width:2" />
    <!-- Mountaintop -->
    <circle cx="200" cy="50" r="30" style="fill:#E74C3C;stroke:#34495E;stroke-width:2" />
    <!-- Climber -->
    <circle cx="180" cy="80" r="10" style="fill:#2980B9;stroke:#34495E;stroke-width:2" />
    <line x1="180" y1="90" x2="180" y2="120" style="stroke:#2980B9;stroke-width:2" />
    <line x1="180" y1="120" x2="160" y2="150" style="stroke:#2980B9;stroke-width:2" />
    <line x1="180" y1="120" x2="200" y2="150" style="stroke:#2980B9;stroke-width:2" />
    <line x1="180" y1="100" x2="210" y2="90" style="stroke:#2980B9;stroke-width:2" />
  </g>
</svg>