<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">appetizer</text>
  <text x="50" y="120" class="subtitle">[ˈæpɪtaɪzər] n. 开胃菜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (加强) + pet (追求) + -izer (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个饥饿的人，"加强追求(ap-pet)"
    <tspan x="50" dy="25">美味的食物，这些食物就是开胃菜(appetizer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The appetizer was a delicious plate of bruschetta.
  </text>
  <text x="50" y="310" class="content">
    开胃菜是一盘美味的烤面包片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Fork -->
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <line x1="250" y1="50" x2="230" y2="70" class="image" />
    <line x1="250" y1="50" x2="270" y2="70" class="image" />
    <!-- Person -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="350" y2="120" class="image" />
  </g>
</svg>