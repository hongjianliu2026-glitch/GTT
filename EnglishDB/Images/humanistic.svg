<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humanistic</text>
  <text x="50" y="120" class="subtitle">[ˌhjuːməˈnɪstɪk] adj. 人文主义的，人道主义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> human (人) + -istic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满人文关怀的场景，"人(human)"
    <tspan x="50" dy="25">们聚集在一起，分享知识、艺术和情感，</tspan>
    <tspan x="50" dy="25">这就是人文主义(humanistic)的精髓。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The professor's teaching style is very humanistic.
  </text>
  <text x="50" y="310" class="content">
    这位教授的教学风格非常人文主义。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Books -->
    <rect x="30" y="80" width="40" height="60" class="image" />
    <rect x="130" y="80" width="40" height="60" class="image" />
    <rect x="230" y="80" width="40" height="60" class="image" />
    <!-- Art -->
    <rect x="100" y="150" width="100" height="50" class="image" />
    <line x1="120" y1="160" x2="180" y2="160" class="image" />
    <line x1="120" y1="170" x2="180" y2="170" class="image" />
    <line x1="120" y1="180" x2="180" y2="180" class="image" />
    <!-- Emotions -->
    <circle cx="150" cy="220" r="30" class="image" />
    <line x1="150" y1="250" x2="150" y2="280" class="image" />
    <line x1="150" y1="280" x2="130" y2="310" class="image" />
    <line x1="150" y1="280" x2="170" y2="310" class="image" />
    <line x1="150" y1="260" x2="180" y2="250" class="image" />
  </g>
</svg>