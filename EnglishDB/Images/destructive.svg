<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">destructive</text>
  <text x="50" y="120" class="subtitle">[dɪˈstrʌktɪv] adj. 破坏性的，毁灭性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + struct (建造) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"向下(de-)"砸向一座"建造(struct)"中的大楼，
    <tspan x="50" dy="25">瞬间将其摧毁，这就是"破坏性的(destructive)"力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hurricane was so destructive that it leveled entire towns.
  </text>
  <text x="50" y="310" class="content">
    飓风如此具有破坏性，以至于整个城镇都被夷为平地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <rect x="40" y="40" width="70" height="120" class="image" />
    <!-- Hammer -->
    <line x1="200" y1="0" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="0" x2="200" y2="100" class="image" />
    <!-- Cracked building -->
    <line x1="10" y1="180" x2="140" y2="180" class="image" />
    <line x1="10" y1="190" x2="140" y2="190" class="image" />
    <line x1="10" y1="200" x2="140" y2="200" class="image" />
  </g>
</svg>