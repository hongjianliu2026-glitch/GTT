<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monopoly</text>
  <text x="50" y="120" class="subtitle">[məˈnɒpəli] n. 垄断，独占</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mono- (单一) + poly (卖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的市场，只有一家商店"独占(mono-poly)"
    <tspan x="50" dy="25">所有的商品，其他商店都被挤出了市场。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a monopoly on the software market.
  </text>
  <text x="50" y="310" class="content">
    这家公司在软件市场上拥有垄断地位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Single store -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Products -->
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="120" cy="50" r="10" class="image" />
    <circle cx="160" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="240" cy="50" r="10" class="image" />
    <!-- Other stores -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="190" x2="300" y2="190" class="image" />
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
  </g>
</svg>