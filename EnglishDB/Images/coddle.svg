<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coddle</text>
  <text x="50" y="120" class="subtitle">[ˈkɒdl] v. 娇养，溺爱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cod (蛋) + -le (表示小或动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个母亲小心翼翼地"孵蛋(cod-)"，
    <tspan x="50" dy="25">生怕蛋壳破裂，这种小心翼翼的动作就是"娇养(coddle)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She coddled her son, never letting him do anything on his own.
  </text>
  <text x="50" y="310" class="content">
    她娇养她的儿子，从不让他自己做任何事情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Egg -->
    <ellipse cx="100" cy="100" rx="50" ry="70" class="image" />
    <!-- Mother -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="170" y2="130" class="image" />
    <line x1="200" y1="150" x2="230" y2="130" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <!-- Arms around egg -->
    <line x1="150" y1="100" x2="50" y2="100" class="image" />
    <line x1="250" y1="100" x2="350" y2="100" class="image" />
  </g>
</svg>