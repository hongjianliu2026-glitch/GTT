<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incest</text>
  <text x="50" y="120" class="subtitle">[ˈɪnsɛst] n. 乱伦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (在内) + cest (亲属)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭，"在亲属(cest)内部(in-)"
    <tspan x="50" dy="25">发生了不道德的行为，这就是乱伦(incest)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The law prohibits incest between close relatives.
  </text>
  <text x="50" y="310" class="content">
    法律禁止近亲之间的乱伦行为。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family tree -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="180" x2="250" y2="180" class="image" />
    <line x1="250" y1="100" x2="250" y2="180" class="image" />
    <!-- Family members -->
    <circle cx="50" cy="20" r="10" class="image" />
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="50" cy="180" r="10" class="image" />
    <circle cx="150" cy="20" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
    <!-- Warning sign -->
    <polygon points="300,100 320,80 340,100 320,120" class="image" />
    <text x="310" y="105" class="highlight">!</text>
  </g>
</svg>