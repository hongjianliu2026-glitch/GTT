<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">catalytic</text>
  <text x="50" y="120" class="subtitle">[ˌkætəˈlɪtɪk] adj. 催化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cata- (向下) + lysis (松解)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学家在实验室里，"向下松解(cata-lysis)"
    <tspan x="50" dy="25">复杂的化学反应，使其加速进行，这就是催化(catalytic)的作用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The catalytic converter in the car reduces emissions.
  </text>
  <text x="50" y="310" class="content">
    汽车中的催化转化器减少了排放。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Beaker -->
    <ellipse cx="175" cy="100" rx="50" ry="70" class="image" />
    <!-- Chemical reaction -->
    <line x1="125" y1="100" x2="225" y2="100" class="image" />
    <line x1="150" y1="80" x2="200" y2="120" class="image" />
    <line x1="150" y1="120" x2="200" y2="80" class="image" />
    <!-- Chemist -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>