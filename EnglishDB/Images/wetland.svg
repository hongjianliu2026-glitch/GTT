<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .land { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wetland</text>
  <text x="50" y="120" class="subtitle">[ˈwɛtlənd] n. 湿地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wet (湿的) + land (土地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片"湿的土地(wet-land)"，
    <tspan x="50" dy="25">上面覆盖着浅浅的水，周围是茂密的植被，</tspan>
    <tspan x="50" dy="25">这就是湿地(wetland)的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wetland is home to many species of birds.
  </text>
  <text x="50" y="310" class="content">
    这片湿地是许多鸟类的家园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Land -->
    <rect x="50" y="100" width="250" height="100" class="land" />
    <!-- Plants -->
    <line x1="70" y1="150" x2="70" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="110" class="image" />
    <line x1="130" y1="150" x2="130" y2="120" class="image" />
    <line x1="160" y1="150" x2="160" y2="130" class="image" />
    <line x1="190" y1="150" x2="190" y2="140" class="image" />
    <line x1="220" y1="150" x2="220" y2="130" class="image" />
    <line x1="250" y1="150" x2="250" y2="120" class="image" />
    <line x1="280" y1="150" x2="280" y2="110" class="image" />
    <line x1="310" y1="150" x2="310" y2="100" class="image" />
  </g>
</svg>