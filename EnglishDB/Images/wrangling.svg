<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrangling</text>
  <text x="50" y="120" class="subtitle">[ˈræŋɡlɪŋ] n. 争论，争吵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wrang (争论) + -ling (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在激烈地"争论(wrang)"，
    <tspan x="50" dy="25">他们的声音越来越高，场面越来越混乱，这就是"争吵(wrangling)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting turned into a heated wrangling session.
  </text>
  <text x="50" y="310" class="content">
    会议变成了激烈的争吵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people arguing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <!-- Speech bubbles -->
    <path d="M50,160 Q70,180 100,160" class="image" />
    <path d="M150,160 Q130,180 100,160" class="image" />
  </g>
</svg>