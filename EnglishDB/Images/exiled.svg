<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exiled</text>
  <text x="50" y="120" class="subtitle">[ˈɛksaɪld] v. 流放，放逐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + ile (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"赶出(ex-)"家园，"走(ile)"向未知的远方，
    <tspan x="50" dy="25">这就是被流放(exiled)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The king was exiled to a remote island.
  </text>
  <text x="50" y="310" class="content">
    国王被流放到一个偏远的岛屿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="20" x2="75" y2="0" class="image" />
    <line x1="130" y1="20" x2="75" y2="0" class="image" />
    <!-- Person -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="80" x2="230" y2="70" class="image" />
    <!-- Path -->
    <line x1="200" y1="130" x2="350" y2="130" class="image" />
    <line x1="350" y1="130" x2="350" y2="200" class="image" />
    <!-- Island -->
    <circle cx="400" cy="250" r="50" class="image" />
  </g>
</svg>