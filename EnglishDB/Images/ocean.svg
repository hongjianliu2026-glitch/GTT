<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .wave { fill: #4CAF50; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ocean</text>
  <text x="50" y="120" class="subtitle">[ˈoʊʃən] n. 海洋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oceano- (海洋)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片无边无际的海洋，"海洋(oceano-)"
    <tspan x="50" dy="25">覆盖了地球的大部分表面，深邃而神秘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship sailed across the vast ocean.
  </text>
  <text x="50" y="310" class="content">
    船只航行在广阔的海洋上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean waves -->
    <path d="M0 100 Q100 200 200 100 T400 100 T600 100 T800 100" class="wave" />
    <path d="M0 120 Q100 220 200 120 T400 120 T600 120 T800 120" class="wave" />
    <path d="M0 140 Q100 240 200 140 T400 140 T600 140 T800 140" class="wave" />
  </g>
</svg>