<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thoroughly</text>
  <text x="50" y="120" class="subtitle">[ˈθɜːroʊli] adv. 彻底地，完全地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> through (通过) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一把巨大的刷子，"通过(through)"
    <tspan x="50" dy="25">整个房间，彻底地(thoroughly)清洁每一个角落。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cleaned the room thoroughly before the guests arrived.
  </text>
  <text x="50" y="310" class="content">
    她在客人到来之前彻底地打扫了房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person with brush -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Brush -->
    <rect x="100" y="120" width="100" height="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="100" class="image" />
    <line x1="200" y1="120" x2="200" y2="100" class="image" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
  </g>
</svg>