<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mocking</text>
  <text x="50" y="120" class="subtitle">[ˈmɒkɪŋ] v. 嘲笑，模仿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mock (模仿) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在模仿(mock)别人的声音和动作，
    <tspan x="50" dy="25">夸张地嘲笑(mocking)对方，让周围的人都忍不住笑出声。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comedian's mocking of politicians always gets a big laugh.
  </text>
  <text x="50" y="310" class="content">
    喜剧演员对政客的模仿总是能引起哄堂大笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person mimicking -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Person being mocked -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M 50 80 Q 100 50 150 80 Q 100 100 50 80" class="image" />
    <text x="70" y="85" class="content">Ha ha!</text>
  </g>
</svg>