<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skier</text>
  <text x="50" y="120" class="subtitle">[ˈskaɪər] n. 滑雪者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ski- (滑雪) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个滑雪者(skier)在雪山上，"滑行(ski-)"
    <tspan x="50" dy="25">如飞，享受着速度与激情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The skier gracefully navigated the slopes.
  </text>
  <text x="50" y="310" class="content">
    那位滑雪者优雅地滑过山坡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowy mountain -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
    <!-- Skier -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Skis -->
    <line x1="155" y1="180" x2="195" y2="180" class="image" />
    <line x1="155" y1="180" x2="160" y2="190" class="image" />
    <line x1="195" y1="180" x2="190" y2="190" class="image" />
  </g>
</svg>