<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">autopilot</text>
  <text x="50" y="120" class="subtitle">[ˈɔːtəˌpaɪlət] n. 自动驾驶仪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auto- (自动) + pilot (飞行员)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机在空中飞行，飞行员坐在驾驶舱里，但飞机却在"自动(auto)"地飞行，
    <tspan x="50" dy="25">就像有一个看不见的飞行员(pilot)在操控它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plane was on autopilot during the long flight.
  </text>
  <text x="50" y="310" class="content">
    这架飞机在长途飞行中使用了自动驾驶仪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane -->
    <polygon points="0,100 100,50 100,150" class="image" />
    <!-- Pilot seat -->
    <rect x="110" y="70" width="40" height="60" class="image" />
    <!-- Pilot -->
    <circle cx="130" cy="100" r="15" class="image" />
    <line x1="130" y1="115" x2="130" y2="150" class="image" />
    <line x1="130" y1="150" x2="110" y2="180" class="image" />
    <line x1="130" y1="150" x2="150" y2="180" class="image" />
    <line x1="130" y1="130" x2="180" y2="120" class="image" />
    <!-- Autopilot symbol -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
  </g>
</svg>