<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diversity</text>
  <text x="50" y="120" class="subtitle">[daɪˈvɜːrsəti] n. 多样性，差异</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + vers (转) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的转盘，上面有各种不同的颜色和形状，"分开转动(di-vers)"
    <tspan x="50" dy="25">形成了多样性(diversity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company values diversity in its workforce.
  </text>
  <text x="50" y="310" class="content">
    公司重视员工队伍的多样性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large wheel -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Segments -->
    <path d="M175,20 A80,80 0 0,1 255,100" class="image" />
    <path d="M175,20 A80,80 0 0,0 95,100" class="image" />
    <path d="M175,180 A80,80 0 0,1 255,100" class="image" />
    <path d="M175,180 A80,80 0 0,0 95,100" class="image" />
    <!-- Colors -->
    <circle cx="175" cy="20" r="10" fill="#FF5733" />
    <circle cx="255" cy="100" r="10" fill="#33FF57" />
    <circle cx="95" cy="100" r="10" fill="#3357FF" />
    <circle cx="175" cy="180" r="10" fill="#FF33A6" />
  </g>
</svg>