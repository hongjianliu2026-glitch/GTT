<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .plum { fill: #8E44AD; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plum</text>
  <text x="50" y="120" class="subtitle">[plʌm] n. 李子，梅子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语“plume”，意为“果实”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的李子树，树上挂满了紫色的李子，
    <tspan x="50" dy="25">每个李子都像一个小小的紫色宝石，闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She picked a ripe plum from the tree.
  </text>
  <text x="50" y="310" class="content">
    她从树上摘了一个成熟的李子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plum tree -->
    <line x1="0" y1="0" x2="0" y2="200" class="image" />
    <!-- Plums -->
    <circle cx="0" cy="20" r="15" class="plum" />
    <circle cx="50" cy="40" r="15" class="plum" />
    <circle cx="100" cy="60" r="15" class="plum" />
    <circle cx="150" cy="80" r="15" class="plum" />
    <circle cx="200" cy="100" r="15" class="plum" />
    <circle cx="250" cy="120" r="15" class="plum" />
    <circle cx="300" cy="140" r="15" class="plum" />
    <circle cx="350" cy="160" r="15" class="plum" />
    <circle cx="400" cy="180" r="15" class="plum" />
  </g>
</svg>