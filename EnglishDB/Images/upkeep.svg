<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">upkeep</text>
  <text x="50" y="120" class="subtitle">[ˈʌpkiːp] n. 保养，维护</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + keep (保持)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人正在"向上保持(up-keep)"
    <tspan x="50" dy="25">一座高楼的清洁和维护，确保它始终保持良好状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The upkeep of the old house is expensive.
  </text>
  <text x="50" y="310" class="content">
    这栋老房子的保养费用很高。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <rect x="40" y="40" width="70" height="120" class="image" />
    <!-- Worker -->
    <circle cx="80" cy="220" r="15" class="image" />
    <line x1="80" y1="235" x2="80" y2="270" class="image" />
    <line x1="80" y1="270" x2="60" y2="300" class="image" />
    <line x1="80" y1="270" x2="100" y2="300" class="image" />
    <line x1="80" y1="250" x2="110" y2="240" class="image" />
    <!-- Cleaning tools -->
    <line x1="60" y1="240" x2="100" y2="240" class="image" />
    <line x1="80" y1="240" x2="80" y2="260" class="image" />
  </g>
</svg>