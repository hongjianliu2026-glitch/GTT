<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">occult</text>
  <text x="50" y="120" class="subtitle">[əˈkʌlt] adj. 神秘的，秘密的；n. 神秘学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oc- (在前面) + cult (隐藏)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的仪式，"在前面隐藏(oc-cult)"
    <tspan x="50" dy="25">着不可告人的秘密，这就是神秘学(occult)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The occult practices of the ancient civilization are still a mystery.
  </text>
  <text x="50" y="310" class="content">
    古代文明的神秘实践至今仍是一个谜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle representing the hidden secret -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Eye representing the hidden knowledge -->
    <circle cx="175" cy="100" r="10" class="image" fill="#2C3E50" />
    <!-- Lines representing the hidden symbols -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <!-- Pentagram representing the occult -->
    <polygon points="175,20 100,180 250,180" class="image" />
  </g>
</svg>