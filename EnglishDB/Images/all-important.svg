<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">all-important</text>
  <text x="50" y="120" class="subtitle">[ˌɔːl ɪmˈpɔːrtnt] adj. 极其重要的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> all- (全部) + important (重要的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头指向一个闪闪发光的宝箱，宝箱上写着"ALL"，
    <tspan x="50" dy="25">表示所有的东西都集中在这里，而这个宝箱就是"极其重要的(all-important)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The all-important deadline was approaching.
  </text>
  <text x="50" y="310" class="content">
    极其重要的截止日期即将到来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Arrow -->
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 180,90 180,110" class="image" />
    <!-- Treasure chest -->
    <rect x="220" y="50" width="150" height="100" class="image" />
    <line x1="220" y1="100" x2="370" y2="100" class="image" />
    <line x1="295" y1="50" x2="295" y2="100" class="image" />
    <!-- Text on chest -->
    <text x="270" y="90" class="content" style="font-size: 24px; fill: #E74C3C;">ALL</text>
  </g>
</svg>