<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heft</text>
  <text x="50" y="120" class="subtitle">[hɛft] n. 重量，力量；v. 举起，用力提起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heft (来自古英语 heft, 意为“手”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用双手"举起(heft)"一个巨大的石头，
    <tspan x="50" dy="25">石头的重量(heft)让他感到力量(heft)的挑战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heft of the suitcase made it difficult to carry.
  </text>
  <text x="50" y="310" class="content">
    手提箱的重量使得它很难携带。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant stone -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Hands lifting the stone -->
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="220" r="15" class="image" />
    <line x1="100" y1="235" x2="100" y2="270" class="image" />
    <line x1="100" y1="270" x2="80" y2="300" class="image" />
    <line x1="100" y1="270" x2="120" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="240" class="image" />
  </g>
</svg>