<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nuzzle</text>
  <text x="50" y="120" class="subtitle">[ˈnʌzl] v. 用鼻子轻触，依偎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nuzz (鼻子) + -le (表示小或动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫用它的小鼻子轻轻地"触碰(nuzz-le)"
    <tspan x="50" dy="25">你的脸颊，那种温暖和亲密的感觉让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kitten nuzzled against my leg, seeking comfort.
  </text>
  <text x="50" y="310" class="content">
    小猫用鼻子轻触我的腿，寻求安慰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Nose -->
    <circle cx="100" cy="110" r="10" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Whiskers -->
    <line x1="70" y1="110" x2="50" y2="105" class="image" />
    <line x1="70" y1="120" x2="50" y2="125" class="image" />
    <line x1="130" y1="110" x2="150" y2="105" class="image" />
    <line x1="130" y1="120" x2="150" y2="125" class="image" />
    <!-- Nuzzle action -->
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="170" class="image" />
    <line x1="100" y1="150" x2="120" y2="170" class="image" />
  </g>
</svg>