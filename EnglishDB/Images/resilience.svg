<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resilience</text>
  <text x="50" y="120" class="subtitle">[rɪˈzɪliəns] n. 弹性，恢复力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sili (跳跃) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个弹簧，被压下去后，"再次跳跃(re-sili)"
    <tspan x="50" dy="25">回到原来的位置，这就是它的弹性(resilience)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The resilience of the human spirit is truly remarkable.
  </text>
  <text x="50" y="310" class="content">
    人类精神的恢复力真是令人惊叹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spring -->
    <path d="M50 100 Q100 50 150 100 T250 100" class="image" />
    <path d="M50 150 Q100 200 150 150 T250 150" class="image" />
    <path d="M50 200 Q100 250 150 200 T250 200" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <polygon points="150,100 140,110 160,110" class="image" />
    <polygon points="150,200 140,190 160,190" class="image" />
  </g>
</svg>