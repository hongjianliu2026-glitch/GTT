<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">promotional</text>
  <text x="50" y="120" class="subtitle">[prəˈmoʊʃənl] adj. 促销的，推广的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + mot (移动) + -ion (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的广告牌，上面写着"促销(promotion)"，
    <tspan x="50" dy="25">广告牌向前移动(pro-mot)，吸引人们的注意，这就是促销(promotional)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company launched a promotional campaign to boost sales.
  </text>
  <text x="50" y="310" class="content">
    公司发起了一场促销活动以提升销量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Billboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Text on Billboard -->
    <text x="50" y="100" class="content" style="font-size: 36px; fill: #E74C3C;">SALE</text>
    <!-- Arrow -->
    <line x1="200" y1="150" x2="300" y2="150" class="image" />
    <polygon points="300,150 290,140 290,160" class="image" />
  </g>
</svg>