<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">embroidered</text>
  <text x="50" y="120" class="subtitle">[ɪmˈbrɔɪdərd] adj. 绣花的，刺绣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + broider (刺绣)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位艺术家将针线"刺入(en-)"布料，
    <tspan x="50" dy="25">创造出精美的"刺绣(broider)"图案，这就是embroidered。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a beautifully embroidered dress to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件绣花精美的裙子去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fabric -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Embroidery -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <circle cx="170" cy="50" r="10" class="image" />
    <circle cx="200" cy="80" r="10" class="image" />
    <circle cx="230" cy="50" r="10" class="image" />
    <circle cx="260" cy="80" r="10" class="image" />
    <!-- Thread -->
    <line x1="50" y1="50" x2="260" y2="80" class="image" />
    <line x1="80" y1="80" x2="230" y2="50" class="image" />
    <line x1="110" y1="50" x2="200" y2="80" class="image" />
    <line x1="140" y1="80" x2="170" y2="50" class="image" />
    <!-- Needle -->
    <line x1="20" y1="100" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
  </g>
</svg>