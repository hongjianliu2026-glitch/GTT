<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entrepreneurship</text>
  <text x="50" y="120" class="subtitle">[ˌɒntrəprəˈnəːʃɪp] n. 企业家精神，创业</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> entre- (在...之间) + preneur (行动者) + -ship (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个企业家在人群中脱颖而出，"在行动中(entre-preneur)"
    <tspan x="50" dy="25">展现出非凡的领导力和创新精神，这就是企业家精神(entrepreneurship)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She demonstrated exceptional entrepreneurship in launching her startup.
  </text>
  <text x="50" y="310" class="content">
    她在创办自己的初创公司时展现了非凡的企业家精神。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Entrepreneur -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="190" class="image" />
    <line x1="300" y1="160" x2="320" y2="190" class="image" />
    <line x1="300" y1="140" x2="330" y2="130" class="image" />
    <!-- Lightbulb -->
    <circle cx="300" cy="70" r="10" class="image" />
    <line x1="300" y1="80" x2="300" y2="100" class="image" />
  </g>
</svg>