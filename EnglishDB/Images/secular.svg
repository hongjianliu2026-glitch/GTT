<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">secular</text>
  <text x="50" y="120" class="subtitle">[ˈsɛkjələr] adj. 世俗的，非宗教的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sec (跟随) + ular (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世俗的世界，"跟随(sec)"
    <tspan x="50" dy="25">着日常生活的节奏，远离宗教的束缚。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The school offers both religious and secular education.
  </text>
  <text x="50" y="310" class="content">
    这所学校提供宗教和非宗教教育。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- World -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- People -->
    <circle cx="60" cy="60" r="10" class="image" />
    <circle cx="140" cy="60" r="10" class="image" />
    <circle cx="100" cy="140" r="10" class="image" />
    <!-- Cross (religious symbol) -->
    <line x1="200" y1="60" x2="240" y2="100" class="image" />
    <line x1="240" y1="60" x2="200" y2="100" class="image" />
    <!-- Arrow pointing away from cross -->
    <line x1="220" y1="100" x2="180" y2="140" class="image" />
    <polygon points="180,140 175,130 185,130" class="image" />
  </g>
</svg>