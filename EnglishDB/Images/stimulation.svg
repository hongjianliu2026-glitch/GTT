<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stimulation</text>
  <text x="50" y="120" class="subtitle">[ˌstɪmjəˈleɪʃn] n. 刺激，激励</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stimul (刺激) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，用一根"刺激(stimul)"
    <tspan x="50" dy="25">针轻轻触碰一只小鼠，小鼠立刻活跃起来，这就是</tspan>
    <tspan x="50" dy="25">"刺激(stimulation)"的效果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher's praise provided great stimulation for the students.
  </text>
  <text x="50" y="310" class="content">
    老师的表扬极大地激励了学生们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Lab table -->
    <rect x="50" y="20" width="300" height="160" class="image" />
    <!-- Mouse -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="90" y2="150" class="image" />
    <line x1="100" y1="130" x2="110" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="110" class="image" />
    <!-- Stimulus needle -->
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
  </g>
</svg>