<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inescapable</text>
  <text x="50" y="120" class="subtitle">[ˌɪnɪˈskeɪpəbl] adj. 不可避免的，逃不掉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + escape (逃脱) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的网，"无法逃脱(in-escape-able)"
    <tspan x="50" dy="25">的命运笼罩着你，无论你怎么挣扎，都无法摆脱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The consequences of his actions were inescapable.
  </text>
  <text x="50" y="310" class="content">
    他行为的后果是不可避免的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Net -->
    <path d="M0,0 L350,0 L350,200 L0,200 Z" class="image" />
    <path d="M50,20 L300,20 M50,40 L300,40 M50,60 L300,60 M50,80 L300,80 M50,100 L300,100 M50,120 L300,120 M50,140 L300,140 M50,160 L300,160 M50,180 L300,180" class="image" />
    <path d="M20,50 L20,150 M40,50 L40,150 M60,50 L60,150 M80,50 L80,150 M100,50 L100,150 M120,50 L120,150 M140,50 L140,150 M160,50 L160,150 M180,50 L180,150 M200,50 L200,150 M220,50 L220,150 M240,50 L240,150 M260,50 L260,150 M280,50 L280,150 M300,50 L300,150" class="image" />
    <!-- Person trapped -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>