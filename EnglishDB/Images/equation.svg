<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">equation</text>
  <text x="50" y="120" class="subtitle">[ɪˈkweɪʒn] n. 方程，等式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> equ (相等) + ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个数学家在黑板上写下"相等(equ)"的符号，
    <tspan x="50" dy="25">两边各有一个数字，这就是一个方程(equation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Solving the equation was a challenge for the students.
  </text>
  <text x="50" y="310" class="content">
    解这个方程对学生们来说是个挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blackboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Equation -->
    <text x="50" y="100" class="content" font-size="36" fill="#000">2x + 3 = 7</text>
    <!-- Equal sign -->
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <!-- Math symbols -->
    <text x="50" y="150" class="content" font-size="24" fill="#000">x = 2</text>
  </g>
</svg>