  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paintbrush</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪntbrʌʃ] n. 画笔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> paint (绘画) + brush (刷子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家手持"画笔(paintbrush)"，
    <tspan x="50" dy="25">在画布上挥洒色彩，创造出美丽的画作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a paintbrush to create a masterpiece.
  </text>
  <text x="50" y="310" class="content">
    她用画笔创作了一幅杰作。
  </text>

