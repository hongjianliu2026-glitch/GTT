<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retiree</text>
  <text x="50" y="120" class="subtitle">[ˌrɛtaɪˈriː] n. 退休者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + tire (拉) + -ee (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老人，"向后拉(re-tire)"
    <tspan x="50" dy="25">着自己，不再工作，享受退休生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The retiree spends his days gardening and reading.
  </text>
  <text x="50" y="310" class="content">
    这位退休者每天都在园艺和阅读中度过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old man -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Chair -->
    <rect x="30" y="220" width="40" height="20" class="image" />
    <rect x="20" y="240" width="60" height="10" class="image" />
    <!-- Garden -->
    <line x1="100" y1="250" x2="150" y2="250" class="image" />
    <line x1="100" y1="230" x2="150" y2="230" class="image" />
    <line x1="100" y1="210" x2="150" y2="210" class="image" />
    <line x1="100" y1="190" x2="150" y2="190" class="image" />
  </g>
</svg>