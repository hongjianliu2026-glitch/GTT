<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">patronage</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪtrənɪdʒ] n. 赞助，资助；保护</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> patr (父亲) + -on (人) + -age (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"父亲般的人(patr-on)"，
    <tspan x="50" dy="25">他伸出援手，提供"资助(patronage)"，</tspan>
    <tspan x="50" dy="25">就像父亲保护孩子一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist received patronage from a wealthy businessman.
  </text>
  <text x="50" y="310" class="content">
    这位艺术家得到了一位富商的赞助。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Patron -->
    <circle cx="20" cy="100" r="30" class="image" />
    <line x1="20" y1="130" x2="20" y2="200" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <!-- Artist -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="140" x2="130" y2="180" class="image" />
    <line x1="150" y1="140" x2="170" y2="180" class="image" />
    <!-- Money -->
    <rect x="100" y="180" width="100" height="50" class="image" />
    <text x="120" y="210" class="content" fill="#2980B9">$</text>
  </g>
</svg>