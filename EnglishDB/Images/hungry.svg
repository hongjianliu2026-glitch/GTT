<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hungry</text>
  <text x="50" y="120" class="subtitle">[ˈhʌŋɡri] adj. 饥饿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hunger (饥饿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个饥饿的人，肚子咕咕叫，眼睛盯着食物，
    <tspan x="50" dy="25">仿佛整个世界都变成了食物的形状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a long hike, he was very hungry.
  </text>
  <text x="50" y="310" class="content">
    长途徒步后，他非常饥饿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hungry person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Food -->
    <rect x="150" y="80" width="100" height="50" class="image" />
    <line x1="150" y1="80" x2="250" y2="80" class="image" />
    <line x1="150" y1="130" x2="250" y2="130" class="image" />
    <line x1="150" y1="80" x2="150" y2="130" class="image" />
    <line x1="250" y1="80" x2="250" y2="130" class="image" />
    <!-- Eyes on food -->
    <line x1="50" y1="100" x2="150" y2="105" class="image" />
    <line x1="50" y1="100" x2="250" y2="105" class="image" />
  </g>
</svg>