<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .translucent { fill: rgba(128, 128, 128, 0.5); }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">translucent</text>
  <text x="50" y="120" class="subtitle">[ˌtrænzˈluːsnt] adj. 半透明的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (穿过) + luc (光) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一束光穿过一个半透明的物体，"光穿透(trans-luc)"
    <tspan x="50" dy="25">但仍能隐约看到后面的景象，这就是半透明(translucent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The window was made of translucent glass.
  </text>
  <text x="50" y="310" class="content">
    窗户是用半透明的玻璃制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light beam -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" stroke-width="5" stroke="yellow" />
    <!-- Translucent object -->
    <rect x="100" y="50" width="150" height="100" class="translucent" />
    <!-- Behind the object -->
    <text x="120" y="110" class="content" fill="black">隐约可见</text>
  </g>
</svg>