<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">courteous</text>
  <text x="50" y="120" class="subtitle">[ˈkɜːrtiəs] adj. 有礼貌的，谦恭的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> court (宫廷) + -eous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个在宫廷(court)中的人，他必须时刻保持谦恭(courteous)，
    <tspan x="50" dy="25">因为宫廷礼仪要求他必须如此。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The waiter was very courteous and attentive to our needs.
  </text>
  <text x="50" y="310" class="content">
    服务员非常礼貌，并且很注意我们的需求。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Court -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Bowing -->
    <line x1="50" y1="120" x2="30" y2="100" class="image" />
    <line x1="50" y1="120" x2="70" y2="100" class="image" />
    <!-- Crown -->
    <circle cx="50" cy="80" r="10" class="image" />
    <line x1="40" y1="80" x2="60" y2="80" class="image" />
    <line x1="45" y1="75" x2="55" y2="75" class="image" />
  </g>
</svg>