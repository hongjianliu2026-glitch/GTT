<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .goo { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gooey</text>
  <text x="50" y="120" class="subtitle">[ˈɡuːi] adj. 黏糊糊的，胶状的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> goo (黏液) + -ey (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块黏糊糊的太妃糖，"黏液(goo)"
    <tspan x="50" dy="25">在嘴里拉出长长的丝，这就是"黏糊糊的(gooey)"感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The caramel was so gooey that it stuck to my fingers.
  </text>
  <text x="50" y="310" class="content">
    焦糖太黏糊了，粘在了我的手指上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gooey caramel -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="goo" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <!-- Sticky fingers -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Gooey strings -->
    <path d="M100,100 Q150,50 200,100" class="goo" />
    <path d="M100,100 Q150,150 200,100" class="goo" />
  </g>
</svg>