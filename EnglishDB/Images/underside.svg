<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underside</text>
  <text x="50" y="120" class="subtitle">[ˈʌndərsaɪd] n. 下侧，底部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...下面) + side (侧面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫躺在地上，露出它的"下侧(underside)"，
    <tspan x="50" dy="25">柔软的腹部朝上，仿佛在邀请你抚摸。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He inspected the underside of the car for rust.
  </text>
  <text x="50" y="310" class="content">
    他检查了汽车的底部是否有生锈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cat head -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Cat ears -->
    <polygon points="30,70 50,30 70,70" class="image" />
    <polygon points="30,130 50,170 70,130" class="image" />
    <!-- Cat eyes -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <!-- Cat underside -->
    <rect x="100" y="100" width="150" height="50" class="image" />
    <!-- Cat legs -->
    <line x1="100" y1="150" x2="80" y2="200" class="image" />
    <line x1="250" y1="150" x2="270" y2="200" class="image" />
    <line x1="120" y1="150" x2="100" y2="200" class="image" />
    <line x1="230" y1="150" x2="250" y2="200" class="image" />
  </g>
</svg>