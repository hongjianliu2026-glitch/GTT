<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rich</text>
  <text x="50" y="120" class="subtitle">[rɪtʃ] adj. 富有的，丰富的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ric (财富)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金库，里面堆满了金币和珠宝，
    <tspan x="50" dy="25">这就是"财富(ric)"的象征，让人联想到富有(rich)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He became rich after winning the lottery.
  </text>
  <text x="50" y="310" class="content">
    他中了彩票后变得富有。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vault -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gold coins -->
    <circle cx="50" cy="50" r="20" class="image" fill="#FFD700" />
    <circle cx="100" cy="70" r="20" class="image" fill="#FFD700" />
    <circle cx="150" cy="50" r="20" class="image" fill="#FFD700" />
    <circle cx="200" cy="70" r="20" class="image" fill="#FFD700" />
    <circle cx="250" cy="50" r="20" class="image" fill="#FFD700" />
    <!-- Jewels -->
    <rect x="50" y="120" width="30" height="30" class="image" fill="#8B008B" />
    <rect x="100" y="140" width="30" height="30" class="image" fill="#8B008B" />
    <rect x="150" y="120" width="30" height="30" class="image" fill="#8B008B" />
    <rect x="200" y="140" width="30" height="30" class="image" fill="#8B008B" />
    <rect x="250" y="120" width="30" height="30" class="image" fill="#8B008B" />
  </g>
</svg>