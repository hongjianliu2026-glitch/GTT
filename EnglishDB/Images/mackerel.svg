<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fish { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mackerel</text>
  <text x="50" y="120" class="subtitle">[ˈmækrəl] n. 鲭鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mackerel (源自中世纪英语，指鲭鱼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条鲭鱼在海中快速游动，它的身体像一把锋利的刀，
    <tspan x="50" dy="25">划破海浪，留下一道道银色的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We caught a few mackerel for dinner.
  </text>
  <text x="50" y="310" class="content">
    我们抓了几条鲭鱼做晚餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish body -->
    <path d="M 0 100 Q 50 50 100 100 T 200 100" class="fish" />
    <!-- Fish tail -->
    <polygon points="200,100 220,80 220,120" class="fish" />
    <!-- Fish eye -->
    <circle cx="30" cy="100" r="5" fill="#000" />
    <!-- Fish fins -->
    <line x1="50" y1="80" x2="70" y2="60" class="image" />
    <line x1="50" y1="120" x2="70" y2="140" class="image" />
  </g>
</svg>