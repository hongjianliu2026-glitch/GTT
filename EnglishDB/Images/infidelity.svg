<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infidelity</text>
  <text x="50" y="120" class="subtitle">[ˌɪnfɪˈdelɪti] n. 不忠，不贞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + fidel (忠实的) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心形被"不忠(in-fidel)"的箭射穿，
    <tspan x="50" dy="25">象征着感情中的背叛和不贞(infidelity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her infidelity shattered their marriage.
  </text>
  <text x="50" y="310" class="content">
    她的不忠毁了他们的婚姻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M100,50 Q150,20 200,50 Q250,80 200,110 Q150,140 100,110 Q50,80 100,50" class="image" />
    <!-- Arrow -->
    <line x1="250" y1="50" x2="100" y2="110" class="image" />
    <polygon points="250,50 240,60 260,60" class="image" />
  </g>
</svg>