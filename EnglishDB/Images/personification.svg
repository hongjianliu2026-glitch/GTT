<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">personification</text>
  <text x="50" y="120" class="subtitle">[pɜːrsənɪfɪˈkeɪʃn] n. 拟人化，人格化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> person (人) + ify (使成为) + ication (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个太阳戴着墨镜，"使(ify)"
    <tspan x="50" dy="25">太阳"成为(person)"一个人，这就是拟人化(personification)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sun smiled down on the earth, a perfect example of personification.
  </text>
  <text x="50" y="310" class="content">
    太阳微笑着照耀大地，这是一个完美的拟人化例子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FDB813" />
    <!-- Sunglasses -->
    <rect x="60" y="70" width="80" height="10" class="image" fill="#34495E" />
    <line x1="60" y1="75" x2="140" y2="75" class="image" />
    <!-- Smile -->
    <path d="M 70 130 Q 100 150 130 130" class="image" fill="none" stroke="#34495E" stroke-width="3" />
  </g>
</svg>