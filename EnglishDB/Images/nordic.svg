<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Nordic</text>
  <text x="50" y="120" class="subtitle">[ˈnɔːrdɪk] adj. 北欧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nord (北) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的北方(nord)，那里有壮丽的峡湾和极光，这就是北欧(Nordic)的景象。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Nordic countries are known for their high standard of living.
  </text>
  <text x="50" y="310" class="content">
    北欧国家以其高生活水平而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Snowy mountain -->
    <polygon points="0,150 100,0 200,150" class="image" fill="#BDC3C7" />
    <!-- Fjord -->
    <rect x="0" y="150" width="200" height="50" class="image" fill="#3498DB" />
    <!-- Aurora -->
    <path d="M0,200 Q50,100 100,200 T200,200" class="image" stroke="#F1C40F" stroke-width="5" fill="none" />
  </g>
</svg>