<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diaphragm</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪəfræm] n. 隔膜，横膈膜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dia- (穿过) + phragma (分割)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"隔膜(diaphragm)"，它"穿过(dia-)"
    <tspan x="50" dy="25">身体，将胸腔和腹腔"分割(phragma)"开来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The diaphragm helps in breathing by contracting and relaxing.
  </text>
  <text x="50" y="310" class="content">
    横膈膜通过收缩和放松来帮助呼吸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Diaphragm -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Chest cavity -->
    <rect x="50" y="20" width="250" height="80" class="image" />
    <!-- Abdominal cavity -->
    <rect x="50" y="120" width="250" height="80" class="image" />
    <!-- Arrows indicating separation -->
    <line x1="175" y1="100" x2="175" y2="120" class="image" />
    <line x1="170" y1="110" x2="175" y2="100" class="image" />
    <line x1="180" y1="110" x2="175" y2="100" class="image" />
  </g>
</svg>