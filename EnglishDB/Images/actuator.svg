<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">actuator</text>
  <text x="50" y="120" class="subtitle">[ˈæktʃuˌeɪtər] n. 执行器，驱动器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> act (行动) + -u- + -ator (执行者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机械手臂，"行动(act)"
    <tspan x="50" dy="25">并执行(u-ator)各种任务，这就是执行器(actuator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The actuator in the robot arm moved the object precisely.
  </text>
  <text x="50" y="310" class="content">
    机器人手臂中的执行器精确地移动了物体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mechanical arm -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="250" y2="20" class="image" />
    <!-- Gripper -->
    <line x1="250" y1="20" x2="230" y2="40" class="image" />
    <line x1="250" y1="20" x2="270" y2="40" class="image" />
  </g>
</svg>