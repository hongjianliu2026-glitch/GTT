<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8B0000; }
      .subtitle { font: italic 24px serif; fill: #4B0000; }
      .content { font: 18px sans-serif; fill: #660000; }
      .highlight { font-weight: bold; fill: #FF4500; }
      .story { font: 16px serif; fill: #8B4513; }
      .image { stroke: #A52A2A; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dungeon</text>
  <text x="50" y="120" class="subtitle">[ˈdʌndʒən] n. 地牢，监狱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dung (底部) + -eon (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阴暗的地下室，"底部的地方(dung-eon)"
    <tspan x="50" dy="25">被用作囚禁犯人的地牢(dungeon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The knight was imprisoned in the dungeon for treason.
  </text>
  <text x="50" y="310" class="content">
    骑士因叛国罪被关押在地牢里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dungeon entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Bars -->
    <line x1="70" y1="50" x2="70" y2="190" class="image" />
    <line x1="120" y1="50" x2="120" y2="190" class="image" />
    <line x1="170" y1="50" x2="170" y2="190" class="image" />
    <line x1="220" y1="50" x2="220" y2="190" class="image" />
    <line x1="270" y1="50" x2="270" y2="190" class="image" />
    <!-- Prisoner -->
    <circle cx="145" cy="120" r="15" class="image" />
    <line x1="145" y1="135" x2="145" y2="170" class="image" />
    <line x1="145" y1="170" x2="125" y2="200" class="image" />
    <line x1="145" y1="170" x2="165" y2="200" class="image" />
    <line x1="145" y1="150" x2="180" y2="140" class="image" />
  </g>
</svg>