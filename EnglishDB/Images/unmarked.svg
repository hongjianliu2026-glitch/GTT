<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unmarked</text>
  <text x="50" y="120" class="subtitle">[ʌnˈmɑːrkt] adj. 未标记的，未加记号的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + mark (标记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的宝箱，"没有标记(un-marked)"，
    <tspan x="50" dy="25">它静静地躺在角落，等待着被发现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The treasure chest remained unmarked and unnoticed for years.
  </text>
  <text x="50" y="310" class="content">
    这个宝箱多年来一直未被标记和注意到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <line x1="30" y1="40" x2="170" y2="40" class="image" />
    <line x1="30" y1="70" x2="150" y2="70" class="image" />
    <line x1="30" y1="100" x2="170" y2="100" class="image" />
    <!-- No mark -->
    <text x="100" y="180" class="content" text-anchor="middle">No Mark</text>
  </g>
</svg>