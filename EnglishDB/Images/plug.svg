<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plug</text>
  <text x="50" y="120" class="subtitle">[plʌɡ] n. 插头，塞子；v. 插入，塞住</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pl- (填充) + ug (孔)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的插头(plug)，它"填充(pl-)"进一个巨大的插座孔(ug)，
    <tspan x="50" dy="25">瞬间点亮了整个房间，就像魔法一样！</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't forget to plug in your phone before you go to bed.
  </text>
  <text x="50" y="310" class="content">
    睡觉前别忘了给手机充电。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plug -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="20" y="10" width="60" height="130" class="image" />
    <rect x="30" y="20" width="40" height="110" class="image" />
    <!-- Socket -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <rect x="160" y="60" width="80" height="80" class="image" />
    <rect x="170" y="70" width="60" height="60" class="image" />
    <!-- Lightning effect -->
    <line x1="200" y1="150" x2="200" y2="250" class="image" />
    <line x1="190" y1="200" x2="210" y2="200" class="image" />
    <line x1="180" y1="250" x2="220" y2="250" class="image" />
  </g>
</svg>