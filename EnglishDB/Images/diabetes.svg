<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diabetes</text>
  <text x="50" y="120" class="subtitle">[ˌdaɪəˈbiːtiːz] n. 糖尿病</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dia- (通过) + betes (通过)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的糖块，"通过(dia-)"
    <tspan x="50" dy="25">身体，导致血糖失控，这就是糖尿病(diabetes)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was diagnosed with diabetes last year.
  </text>
  <text x="50" y="310" class="content">
    他去年被诊断出患有糖尿病。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sugar cube -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="10" y="10" width="80" height="80" class="image" />
    <rect x="20" y="20" width="60" height="60" class="image" />
    <rect x="30" y="30" width="40" height="40" class="image" />
    <rect x="40" y="40" width="20" height="20" class="image" />
    <!-- Blood drop -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <!-- Sugar level -->
    <rect x="200" y="0" width="50" height="200" class="image" />
    <rect x="205" y="50" width="40" height="150" class="image" />
    <rect x="210" y="100" width="30" height="100" class="image" />
    <rect x="215" y="150" width="20" height="50" class="image" />
  </g>
</svg>