<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">splice</text>
  <text x="50" y="120" class="subtitle">[splaɪs] v. 拼接，接合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> splic (结合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根绳子被"结合(splic)"成两段，
    <tspan x="50" dy="25">然后又被巧妙地拼接在一起，恢复了完整。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spliced the broken rope together.
  </text>
  <text x="50" y="310" class="content">
    他把断了的绳子拼接在一起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rope -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="70" x2="300" y2="70" class="image" />
    <line x1="50" y1="90" x2="300" y2="90" class="image" />
    <!-- Broken rope -->
    <line x1="150" y1="50" x2="150" y2="90" class="image" />
    <!-- Spliced rope -->
    <line x1="150" y1="50" x2="200" y2="90" class="image" />
    <line x1="150" y1="90" x2="200" y2="50" class="image" />
  </g>
</svg>