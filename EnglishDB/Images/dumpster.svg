<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dumpster</text>
  <text x="50" y="120" class="subtitle">[ˈdʌmpstər] n. 大型垃圾箱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dump (倾倒) + ster (表示“物”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的垃圾箱(dumpster)，里面堆满了各种垃圾，
    <tspan x="50" dy="25">就像是一个"倾倒(dump)"垃圾的"物(ster)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The construction site had a large dumpster for debris.
  </text>
  <text x="50" y="310" class="content">
    建筑工地上有一个用来装碎石的大型垃圾箱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dumpster -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trash inside -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <line x1="180" y1="30" x2="220" y2="70" class="image" />
    <line x1="180" y1="70" x2="220" y2="30" class="image" />
    <rect x="250" y="40" width="30" height="30" class="image" />
    <!-- Dumpster lid -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="0" x2="0" y2="200" class="image" />
    <line x1="350" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>