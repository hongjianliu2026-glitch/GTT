<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">encroach</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkroʊtʃ] v. 侵占，侵犯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + croach (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的怪兽，"弯曲着身体(croach)"
    <tspan x="50" dy="25">慢慢"进入(en-)"你的领地，侵占了你的空间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The construction project encroached on the park's green space.
  </text>
  <text x="50" y="310" class="content">
    建筑工程侵占了公园的绿地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <line x1="50" y1="150" x2="0" y2="140" class="image" />
    <!-- Territory -->
    <rect x="150" y="50" width="200" height="150" class="image" />
    <line x1="150" y1="50" x2="350" y2="50" class="image" />
    <line x1="150" y1="200" x2="350" y2="200" class="image" />
    <line x1="150" y1="50" x2="150" y2="200" class="image" />
    <line x1="350" y1="50" x2="350" y2="200" class="image" />
    <!-- Encroachment -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="100" y1="140" x2="150" y2="140" class="image" />
  </g>
</svg>