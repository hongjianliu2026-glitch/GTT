<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mitigate</text>
  <text x="50" y="120" class="subtitle">[ˈmɪtɪɡeɪt] v. 减轻，缓和</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mit (发送) + ig (移动) + ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个消防员在火灾现场，"发送(mit)"
    <tspan x="50" dy="25">水流"移动(ig)"到火源，"减轻(ate)"火势。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sprinkler system helped mitigate the fire damage.
  </text>
  <text x="50" y="310" class="content">
    洒水系统帮助减轻了火灾的损害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <polygon points="0,0 50,0 25,50" class="image" fill="#E74C3C" />
    <polygon points="25,0 75,0 50,50" class="image" fill="#E74C3C" />
    <polygon points="50,0 100,0 75,50" class="image" fill="#E74C3C" />
    <!-- Water stream -->
    <line x1="125" y1="25" x2="200" y2="25" class="image" stroke-width="5" stroke="#3498DB" />
    <!-- Fireman -->
    <circle cx="250" cy="25" r="20" class="image" fill="#2C3E50" />
    <line x1="250" y1="45" x2="250" y2="80" class="image" />
    <line x1="250" y1="80" x2="230" y2="110" class="image" />
    <line x1="250" y1="80" x2="270" y2="110" class="image" />
    <line x1="250" y1="60" x2="280" y2="50" class="image" />
  </g>
</svg>