<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lurid</text>
  <text x="50" y="120" class="subtitle">[ˈlʊərɪd] adj. 可怕的，骇人听闻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lur (隐藏) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个隐藏在黑暗中的可怕场景，"隐藏的(lur)"
    <tspan x="50" dy="25">恐怖事件被揭露出来，令人毛骨悚然(lurid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news report was filled with lurid details of the crime.
  </text>
  <text x="50" y="310" class="content">
    新闻报道中充满了这起犯罪的骇人细节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Hidden figure -->
    <path d="M50,100 C50,50 150,50 150,100 S250,150 250,100" class="image" fill="#E74C3C" />
    <!-- Revealed figure -->
    <path d="M50,100 C50,150 150,150 150,100 S250,50 250,100" class="image" fill="#F1C40F" />
    <!-- Light beam -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" stroke="#F1C40F" stroke-width="5" />
  </g>
</svg>