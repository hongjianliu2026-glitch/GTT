<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extensively</text>
  <text x="50" y="120" class="subtitle">[ɪkˈstensɪvli] adv. 广泛地，大规模地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + tens (伸展) + -ive (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手，"向外伸展(ex-tens)"
    <tspan x="50" dy="25">到各个方向，覆盖了广阔的区域，这就是"广泛地(extensively)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was researched extensively before implementation.
  </text>
  <text x="50" y="310" class="content">
    这个项目在实施前经过了广泛的研究。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large hand -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="200" class="image" />
    <line x1="100" y1="200" x2="150" y2="200" class="image" />
    <!-- Arrows indicating extension -->
    <line x1="100" y1="50" x2="50" y2="0" class="image">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="100" y1="50" x2="150" y2="0" class="image">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="100" y1="50" x2="0" y2="50" class="image">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="100" y1="50" x2="200" y2="50" class="image">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="2s" repeatCount="indefinite" />
    </line>
  </g>
</svg>