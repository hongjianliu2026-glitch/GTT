<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disorderly</text>
  <text x="50" y="120" class="subtitle">[dɪsˈɔːrdərli] adj. 无秩序的，混乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + order (秩序) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，所有的东西都被"不(dis-)"按照"秩序(order)"摆放，
    <tspan x="50" dy="25">结果就是一片混乱(disorderly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was so disorderly that it was hard to find anything.
  </text>
  <text x="50" y="310" class="content">
    房间太乱了，很难找到任何东西。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Messy items -->
    <line x1="50" y1="20" x2="300" y2="180" class="image" />
    <line x1="50" y1="180" x2="300" y2="20" class="image" />
    <line x1="100" y1="20" x2="250" y2="180" class="image" />
    <line x1="100" y1="180" x2="250" y2="20" class="image" />
    <line x1="150" y1="20" x2="200" y2="180" class="image" />
    <line x1="150" y1="180" x2="200" y2="20" class="image" />
    <!-- Label -->
    <text x="175" y="220" class="content" text-anchor="middle">混乱</text>
  </g>
</svg>