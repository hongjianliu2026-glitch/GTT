<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">us</text>
  <text x="50" y="120" class="subtitle">[ʌs] pron. 我们</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语的 "us"，意为“我们”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人手拉手，形成一个圆圈，象征着“我们(us)”团结在一起。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They invited us to their party.
  </text>
  <text x="50" y="310" class="content">
    他们邀请我们参加他们的派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Circle of people -->
    <circle cx="200" cy="150" r="100" class="image" />
    <!-- People -->
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="280" cy="100" r="15" class="image" />
    <circle cx="200" cy="250" r="15" class="image" />
    <!-- Hands -->
    <line x1="135" y1="115" x2="265" y2="115" class="image" />
    <line x1="200" y1="130" x2="200" y2="235" class="image" />
  </g>
</svg>