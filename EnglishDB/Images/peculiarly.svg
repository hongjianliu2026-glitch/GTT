<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peculiarly</text>
  <text x="50" y="120" class="subtitle">[pɪˈkjuːliəli] adv. 特别地，奇特地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pecul (私人财产) + -i- + -ar (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拥有一件"私人财产(pecul)"，
    <tspan x="50" dy="25">这件财产非常独特，以至于他"特别地(peculiarly)"引人注目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She dressed peculiarly for the party.
  </text>
  <text x="50" y="310" class="content">
    她为派对穿得特别奇特。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Unique item -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="200" x2="150" y2="180" class="image" />
    <!-- Person looking at it -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="220" y2="200" class="image" />
    <line x1="250" y1="160" x2="280" y2="200" class="image" />
    <line x1="250" y1="140" x2="300" y2="130" class="image" />
    <!-- Arrow pointing to the unique item -->
    <line x1="250" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,100 140,90 140,110" class="image" />
  </g>
</svg>