<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">embolden</text>
  <text x="50" y="120" class="subtitle">[ɪmˈboʊldn] v. 使大胆，使有勇气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (使) + bold (大胆的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人原本胆小如鼠，但突然被"注入(em-)"
    <tspan x="50" dy="25">了勇气，变得"大胆(bold)"起来，敢于面对挑战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her encouraging words emboldened me to speak up.
  </text>
  <text x="50" y="310" class="content">
    她鼓励的话语让我有勇气开口说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouse -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="20" y2="150" class="image" />
    <line x1="50" y1="140" x2="80" y2="150" class="image" />

    <!-- Arrow -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,100 140,90 140,110" class="image" />

    <!-- Brave person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="170" y2="150" class="image" />
    <line x1="200" y1="140" x2="230" y2="150" class="image" />
    <line x1="200" y1="120" x2="180" y2="130" class="image" />
    <line x1="200" y1="120" x2="220" y2="130" class="image" />
  </g>
</svg>