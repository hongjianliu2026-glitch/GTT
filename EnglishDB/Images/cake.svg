<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #FF6F00; }
      .highlight { font-weight: bold; fill: #D84315; }
      .story { font: 16px serif; fill: #FF5722; }
      .image { stroke: #FF8A65; stroke-width: 2; fill: none; }
      .cake { fill: #FFD740; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cake</text>
  <text x="50" y="120" class="subtitle">[keɪk] n. 蛋糕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cak (源自中古英语cakke，意为“糕点”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕，上面堆满了各种美味的装饰，
    <tspan x="50" dy="25">就像一座甜蜜的山峰，让人忍不住想咬一口。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She baked a chocolate cake for her birthday.
  </text>
  <text x="50" y="310" class="content">
    她为她的生日烤了一个巧克力蛋糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake base -->
    <rect x="0" y="0" width="350" height="200" class="cake" />
    <!-- Frosting -->
    <rect x="50" y="20" width="250" height="160" class="cake" />
    <!-- Candles -->
    <line x1="100" y1="20" x2="100" y2="0" class="image" />
    <line x1="150" y1="20" x2="150" y2="0" class="image" />
    <line x1="200" y1="20" x2="200" y2="0" class="image" />
    <!-- Decoration -->
    <circle cx="175" cy="100" r="20" class="image" />
    <circle cx="125" cy="80" r="15" class="image" />
    <circle cx="225" cy="90" r="18" class="image" />
  </g>
</svg>