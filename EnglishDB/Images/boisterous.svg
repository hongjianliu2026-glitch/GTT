<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boisterous</text>
  <text x="50" y="120" class="subtitle">[ˈbɔɪstərəs] adj. 喧闹的，狂暴的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boist (noise) + -erous (full of)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满噪音(boist)的房间，人们大声喧哗，
    <tspan x="50" dy="25">笑声和喊叫声此起彼伏，整个场景非常喧闹(boisterous)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boisterous crowd at the concert made it hard to hear the music.
  </text>
  <text x="50" y="310" class="content">
    演唱会上喧闹的人群使得音乐难以听清。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="70" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="70" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Noise lines -->
    <line x1="50" y1="30" x2="40" y2="20" class="image" />
    <line x1="50" y1="30" x2="60" y2="20" class="image" />
    <line x1="100" y1="50" x2="90" y2="40" class="image" />
    <line x1="100" y1="50" x2="110" y2="40" class="image" />
    <line x1="150" y1="30" x2="140" y2="20" class="image" />
    <line x1="150" y1="30" x2="160" y2="20" class="image" />
    <line x1="200" y1="50" x2="190" y2="40" class="image" />
    <line x1="200" y1="50" x2="210" y2="40" class="image" />
    <line x1="250" y1="30" x2="240" y2="20" class="image" />
    <line x1="250" y1="30" x2="260" y2="20" class="image" />
  </g>
</svg>