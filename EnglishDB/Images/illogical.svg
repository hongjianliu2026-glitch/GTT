<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">illogical</text>
  <text x="50" y="120" class="subtitle">[ɪˈlɒdʒɪkl] adj. 不合逻辑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> il- (不) + logic (逻辑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大脑，"不(il-)"
    <tspan x="50" dy="25">遵循逻辑(logic)，结果思维混乱，</tspan>
    <tspan x="50" dy="25">这就是不合逻辑(illogical)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His argument was so illogical that no one could follow it.
  </text>
  <text x="50" y="310" class="content">
    他的论点如此不合逻辑，以至于没人能理解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Confusion lines -->
    <line x1="20" y1="20" x2="180" y2="180" class="image" />
    <line x1="20" y1="180" x2="180" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <!-- Cross out logic -->
    <line x1="20" y1="220" x2="180" y2="380" class="image" />
    <line x1="20" y1="380" x2="180" y2="220" class="image" />
    <text x="50" y="300" class="content" style="font-size: 36px; fill: #E74C3C;">LOGIC</text>
  </g>
</svg>