<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outlay</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtˌleɪ] n. 支出，花费</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (向外) + lay (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从钱包里"向外放置(out-lay)"
    <tspan x="50" dy="25">钱，这些钱就变成了支出(outlay)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outlay for the new project was substantial.
  </text>
  <text x="50" y="310" class="content">
    新项目的支出相当可观。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wallet -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Money coming out -->
    <line x1="75" y1="100" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="50" y2="250" class="image" />
    <line x1="75" y1="200" x2="100" y2="250" class="image" />
    <!-- Money -->
    <rect x="50" y="250" width="50" height="20" class="image" />
    <rect x="100" y="250" width="50" height="20" class="image" />
  </g>
</svg>