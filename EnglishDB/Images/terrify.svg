<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">terrify</text>
  <text x="50" y="120" class="subtitle">[ˈterɪfaɪ] v. 使害怕，使恐惧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> terr (土地) + -ify (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在"土地(terr)"上，突然被"使(ify)"
    <tspan x="50" dy="25">得害怕，仿佛脚下的大地裂开，露出恐怖的深渊。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sudden loud noise terrified the children.
  </text>
  <text x="50" y="310" class="content">
    突然的巨响吓坏了孩子们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Crack in the ground -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <line x1="150" y1="140" x2="250" y2="140" class="image" />
    <line x1="150" y1="160" x2="250" y2="160" class="image" />
    <line x1="150" y1="180" x2="250" y2="180" class="image" />
    <!-- Abyss -->
    <rect x="150" y="100" width="100" height="100" class="image" />
  </g>
</svg>