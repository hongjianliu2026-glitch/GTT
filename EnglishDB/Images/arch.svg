<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arch</text>
  <text x="50" y="120" class="subtitle">[ɑːrtʃ] n. 拱门，拱形；v. 使成拱形</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arch- (主要的，统治的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拱门，象征着"主要的(arch-)"
    <tspan x="50" dy="25">力量和统治，它横跨在道路之上，成为</tspan>
    <tspan x="50" dy="25">一个永恒的标志。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient Romans built many arches in their cities.
  </text>
  <text x="50" y="310" class="content">
    古罗马人在他们的城市里建造了许多拱门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arch -->
    <path d="M 0 100 Q 100 0 200 100 L 200 200 L 0 200 Z" class="image" />
    <!-- Road -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <!-- Symbol of power -->
    <circle cx="100" cy="50" r="10" class="image" />
    <line x1="100" y1="60" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
  </g>
</svg>