<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twenty-two</text>
  <text x="50" y="120" class="subtitle">[ˈtwɛnti tu] n. 二十二</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twenty (二十) + two (二)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“22”，像两座高耸的山峰，
    <tspan x="50" dy="25">山峰上挂满了22个闪闪发光的星星，象征着22这个数字的独特和重要。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are twenty-two players on the field.
  </text>
  <text x="50" y="310" class="content">
    场上有二十二名球员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two mountains -->
    <path d="M0 100 L50 0 L100 100 Z" class="image" />
    <path d="M100 100 L150 0 L200 100 Z" class="image" />
    <!-- Stars -->
    <circle cx="25" cy="50" r="5" class="image" />
    <circle cx="75" cy="50" r="5" class="image" />
    <circle cx="125" cy="50" r="5" class="image" />
    <circle cx="175" cy="50" r="5" class="image" />
    <circle cx="50" cy="75" r="5" class="image" />
    <circle cx="100" cy="75" r="5" class="image" />
    <circle cx="150" cy="75" r="5" class="image" />
    <circle cx="25" cy="100" r="5" class="image" />
    <circle cx="75" cy="100" r="5" class="image" />
    <circle cx="125" cy="100" r="5" class="image" />
    <circle cx="175" cy="100" r="5" class="image" />
    <circle cx="50" cy="125" r="5" class="image" />
    <circle cx="100" cy="125" r="5" class="image" />
    <circle cx="150" cy="125" r="5" class="image" />
    <circle cx="25" cy="150" r="5" class="image" />
    <circle cx="75" cy="150" r="5" class="image" />
    <circle cx="125" cy="150" r="5" class="image" />
    <circle cx="175" cy="150" r="5" class="image" />
    <circle cx="50" cy="175" r="5" class="image" />
    <circle cx="100" cy="175" r="5" class="image" />
    <circle cx="150" cy="175" r="5" class="image" />
  </g>
</svg>