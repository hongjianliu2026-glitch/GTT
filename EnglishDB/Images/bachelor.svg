<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bachelor</text>
  <text x="50" y="120" class="subtitle">[ˈbætʃələr] n. 学士，单身汉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bacca (浆果) + -lor (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个单身汉(bachelor)，他独自一人，
    <tspan x="50" dy="25">就像一棵树上只结了一个浆果(bacca)，</tspan>
    <tspan x="50" dy="25">孤独地等待着伴侣的到来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He earned his bachelor's degree in computer science.
  </text>
  <text x="50" y="310" class="content">
    他获得了计算机科学的学士学位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <!-- Single berry -->
    <circle cx="50" cy="50" r="15" class="image" fill="#8E44AD" />
    <!-- Bachelor -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="180" x2="30" y2="160" class="image" />
    <line x1="50" y1="180" x2="70" y2="160" class="image" />
    <line x1="50" y1="200" x2="30" y2="220" class="image" />
    <line x1="50" y1="200" x2="70" y2="220" class="image" />
  </g>
</svg>