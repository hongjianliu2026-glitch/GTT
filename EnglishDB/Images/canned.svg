<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">canned</text>
  <text x="50" y="120" class="subtitle">[kænd] adj. 罐装的，预先录制好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> can (罐子) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的罐子，里面装满了"预先录制好的(canned)"
    <tspan x="50" dy="25">笑声和音乐，这些声音就像罐头食品一样，随时可以打开享用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comedian used canned laughter in his show.
  </text>
  <text x="50" y="310" class="content">
    这位喜剧演员在他的节目中使用了预先录制的笑声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Can -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Top of the can -->
    <rect x="0" y="0" width="200" height="20" class="image" />
    <!-- Sound waves -->
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <line x1="20" y1="80" x2="150" y2="80" class="image" />
    <line x1="20" y1="110" x2="170" y2="110" class="image" />
    <line x1="20" y1="140" x2="140" y2="140" class="image" />
    <!-- Laughter -->
    <circle cx="50" cy="200" r="15" class="image" />
    <circle cx="150" cy="200" r="15" class="image" />
    <line x1="50" y1="215" x2="150" y2="215" class="image" />
    <line x1="50" y1="230" x2="150" y2="230" class="image" />
  </g>
</svg>