<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hijacker</text>
  <text x="50" y="120" class="subtitle">[ˈhaɪdʒækər] n. 劫机者，劫持者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hi- (高) + jack (劫持) + er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个劫机者站在飞机的驾驶舱前，"高高在上(hi-)"
    <tspan x="50" dy="25">地劫持(jack)了整个飞机，他就是劫机者(hijacker)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hijacker demanded a ransom for the passengers.
  </text>
  <text x="50" y="310" class="content">
    劫机者要求为乘客支付赎金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Cockpit -->
    <rect x="50" y="20" width="250" height="60" class="image" />
    <!-- Hijacker -->
    <circle cx="20" cy="60" r="15" class="image" />
    <line x1="20" y1="75" x2="20" y2="110" class="image" />
    <line x1="20" y1="110" x2="0" y2="140" class="image" />
    <line x1="20" y1="110" x2="40" y2="140" class="image" />
    <line x1="20" y1="90" x2="50" y2="80" class="image" />
    <!-- Gun -->
    <line x1="20" y1="75" x2="60" y2="75" class="image" />
    <line x1="60" y1="75" x2="55" y2="70" class="image" />
    <line x1="60" y1="75" x2="55" y2="80" class="image" />
  </g>
</svg>