<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">black</text>
  <text x="50" y="120" class="subtitle">[blæk] adj. 黑色的，黑暗的；n. 黑色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blaek (古英语，意为黑暗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个漆黑的夜晚，"黑暗(blaek)"
    <tspan x="50" dy="25">笼罩着大地，一切都变得模糊不清。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sky turned black as the storm approached.
  </text>
  <text x="50" y="310" class="content">
    随着风暴的临近，天空变得漆黑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#000000" />
    <!-- Moon -->
    <circle cx="50" cy="50" r="20" class="image" fill="#FFFFFF" />
    <!-- Stars -->
    <circle cx="100" cy="30" r="3" class="image" fill="#FFFFFF" />
    <circle cx="120" cy="60" r="3" class="image" fill="#FFFFFF" />
    <circle cx="150" cy="40" r="3" class="image" fill="#FFFFFF" />
    <circle cx="180" cy="70" r="3" class="image" fill="#FFFFFF" />
    <circle cx="200" cy="50" r="3" class="image" fill="#FFFFFF" />
  </g>
</svg>