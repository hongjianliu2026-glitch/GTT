<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">administrative</text>
  <text x="50" y="120" class="subtitle">[ədˈmɪnɪstrətɪv] adj. 管理的，行政的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + ministr (服务) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装的人，手持文件夹，"朝向(ad-)"
    <tspan x="50" dy="25">服务(ministr)"，处理各种行政事务，这就是"管理的(administrative)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has an administrative role in the company.
  </text>
  <text x="50" y="310" class="content">
    她在公司担任行政职务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in suit -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="160" class="image" />
    <line x1="50" y1="120" x2="70" y2="160" class="image" />
    <line x1="50" y1="90" x2="20" y2="100" class="image" />
    <line x1="50" y1="90" x2="80" y2="100" class="image" />
    <!-- File folder -->
    <rect x="100" y="40" width="80" height="60" class="image" />
    <line x1="100" y1="60" x2="180" y2="60" class="image" />
    <line x1="100" y1="80" x2="180" y2="80" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
  </g>
</svg>