<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">macho</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːtʃoʊ] adj. 男子气概的，强壮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mach (力量) + -o (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的男子，"力量(mach)"
    <tspan x="50" dy="25">十足，展现出男子气概(macho)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He always tries to act macho in front of his friends.
  </text>
  <text x="50" y="310" class="content">
    他总是在朋友面前表现得很有男子气概。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Strong man -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="250" x2="50" y2="350" class="image" /> <!-- Left leg -->
    <line x1="100" y1="250" x2="150" y2="350" class="image" /> <!-- Right leg -->
    <line x1="100" y1="180" x2="50" y2="220" class="image" /> <!-- Left arm -->
    <line x1="100" y1="180" x2="150" y2="220" class="image" /> <!-- Right arm -->
    <!-- Muscles -->
    <circle cx="80" cy="120" r="10" class="image" />
    <circle cx="120" cy="120" r="10" class="image" />
    <circle cx="100" cy="160" r="15" class="image" />
    <circle cx="70" cy="200" r="10" class="image" />
    <circle cx="130" cy="200" r="10" class="image" />
  </g>
</svg>