<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">first-time</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrst taɪm] adj. 第一次的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> first (第一) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新手站在起跑线上，"第一次(first)"
    <tspan x="50" dy="25">尝试某事，这种经历总是令人难忘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was a first-time experience for her.
  </text>
  <text x="50" y="310" class="content">
    这对她来说是一次全新的体验。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Start line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Runner -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Number 1 -->
    <text x="100" y="60" class="highlight" font-size="48">1</text>
  </g>
</svg>