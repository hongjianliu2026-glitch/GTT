<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paradox</text>
  <text x="50" y="120" class="subtitle">[ˈpærədɑːks] n. 悖论，自相矛盾的事物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (旁边) + dox (观点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两个对立的观点旁边，"旁边(para)"
    <tspan x="50" dy="25">有两个完全相反的"观点(dox)"，这就是一个悖论(paradox)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paradox of her success is that she never wanted to be famous.
  </text>
  <text x="50" y="310" class="content">
    她成功的悖论在于她从未想过要出名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two opposing signs -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="200" y="20" width="100" height="160" class="image" />
    <!-- Text on signs -->
    <text x="70" y="100" class="content" text-anchor="middle">YES</text>
    <text x="220" y="100" class="content" text-anchor="middle">NO</text>
    <!-- Person standing between -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
  </g>
</svg>