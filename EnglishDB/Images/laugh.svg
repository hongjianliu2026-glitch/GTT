<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laugh</text>
  <text x="50" y="120" class="subtitle">[lɑːf] v. 笑，大笑；n. 笑声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> laug (笑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然看到一只巨大的香蕉，忍不住"大笑(laugh)"，
    <tspan x="50" dy="25">笑声震天，连香蕉都开始跳舞了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comedian's joke made everyone laugh.
  </text>
  <text x="50" y="310" class="content">
    喜剧演员的笑话让每个人都笑了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person laughing -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Banana -->
    <rect x="150" y="30" width="100" height="20" class="image" />
    <line x1="150" y1="50" x2="250" y2="50" class="image" />
    <line x1="150" y1="70" x2="250" y2="70" class="image" />
    <line x1="150" y1="90" x2="250" y2="90" class="image" />
    <line x1="150" y1="110" x2="250" y2="110" class="image" />
    <!-- Dancing banana -->
    <line x1="150" y1="30" x2="130" y2="10" class="image" />
    <line x1="250" y1="30" x2="270" y2="10" class="image" />
  </g>
</svg>