<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">congestion</text>
  <text x="50" y="120" class="subtitle">[kənˈdʒestʃən] n. 拥挤，堵塞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + gest (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条街道上，"一起携带(con-gest)"
    <tspan x="50" dy="25">着大量的人和车辆，导致交通堵塞(congestion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city suffers from severe traffic congestion during rush hours.
  </text>
  <text x="50" y="310" class="content">
    这座城市在高峰时段遭受严重的交通堵塞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cars -->
    <rect x="50" y="20" width="30" height="20" class="image" />
    <rect x="100" y="20" width="30" height="20" class="image" />
    <rect x="150" y="20" width="30" height="20" class="image" />
    <rect x="200" y="20" width="30" height="20" class="image" />
    <rect x="250" y="20" width="30" height="20" class="image" />
    <rect x="300" y="20" width="30" height="20" class="image" />
    <!-- People -->
    <circle cx="70" cy="60" r="10" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <circle cx="170" cy="60" r="10" class="image" />
    <circle cx="220" cy="60" r="10" class="image" />
    <circle cx="270" cy="60" r="10" class="image" />
    <circle cx="320" cy="60" r="10" class="image" />
  </g>
</svg>