<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elk</text>
  <text x="50" y="120" class="subtitle">[ɛlk] n. 麋鹿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "elk"，与古英语 "elh" 相关，意为 "麋鹿"。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的麋鹿在森林中漫步，它的角像树枝一样繁茂，
    <tspan x="50" dy="25">每一步都让大地震动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The elk was grazing peacefully in the meadow.
  </text>
  <text x="50" y="310" class="content">
    那只麋鹿正在草地上平静地吃草。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Elk body -->
    <ellipse cx="150" cy="150" rx="100" ry="50" class="image" />
    <!-- Elk head -->
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Elk antlers -->
    <line x1="120" y1="80" x2="80" y2="50" class="image" />
    <line x1="180" y1="80" x2="220" y2="50" class="image" />
    <line x1="120" y1="80" x2="80" y2="100" class="image" />
    <line x1="180" y1="80" x2="220" y2="100" class="image" />
    <!-- Elk legs -->
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="200" y1="200" x2="200" y2="250" class="image" />
    <line x1="120" y1="200" x2="120" y2="250" class="image" />
    <line x1="180" y1="200" x2="180" y2="250" class="image" />
  </g>
</svg>