<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Zionist</text>
  <text x="50" y="120" class="subtitle">[ˈzaɪənɪst] n. 犹太复国主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Zion (锡安山，耶路撒冷的一座山) + -ist (表示“信仰者”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个信仰者站在锡安山上，"仰望(Zion)"
    <tspan x="50" dy="25">并坚定地支持犹太复国主义(Zionist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a strong Zionist who believes in the return of Jews to Israel.
  </text>
  <text x="50" y="310" class="content">
    他是一个坚定的犹太复国主义者，坚信犹太人应该回到以色列。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Zionist -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />
    <!-- Zion Mountain -->
    <polygon points="150,200 250,200 200,100" class="image" />
    <line x1="200" y1="100" x2="200" y2="200" class="image" />
    <line x1="200" y1="150" x2="170" y2="180" class="image" />
    <line x1="200" y1="150" x2="230" y2="180" class="image" />
  </g>
</svg>