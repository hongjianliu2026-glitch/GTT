<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cubicle</text>
  <text x="50" y="120" class="subtitle">[ˈkjuːbɪkl] n. 小隔间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cub (躺) + -icle (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个员工在一个小隔间(cubicle)里，"躺(cub)"
    <tspan x="50" dy="25">在一个小空间里工作，这个小空间就是他的小隔间(cubicle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She works in a small cubicle at the office.
  </text>
  <text x="50" y="310" class="content">
    她在办公室的一个小隔间里工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cubicle walls -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="100" y="40" width="150" height="120" class="image" />
    <!-- Desk -->
    <rect x="120" y="60" width="110" height="80" class="image" />
    <!-- Chair -->
    <circle cx="175" cy="160" r="15" class="image" />
    <line x1="175" y1="175" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="160" y2="220" class="image" />
    <line x1="175" y1="200" x2="190" y2="220" class="image" />
  </g>
</svg>