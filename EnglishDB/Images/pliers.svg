<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pliers</text>
  <text x="50" y="120" class="subtitle">[ˈplaɪərz] n. 钳子，夹子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plic (折叠) + -er (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠用"折叠(plic)"的工具"钳子(pliers)"
    <tspan x="50" dy="25">夹住金属，将其弯曲成所需的形状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used pliers to tighten the screws.
  </text>
  <text x="50" y="310" class="content">
    他用钳子拧紧螺丝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pliers -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <!-- Handle -->
    <rect x="40" y="100" width="120" height="20" class="image" />
    <!-- Metal piece -->
    <rect x="75" y="120" width="50" height="10" class="image" />
  </g>
</svg>