<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">starch</text>
  <text x="50" y="120" class="subtitle">[stɑːrtʃ] n. 淀粉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + arch (主要)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"站立(st-)"的"主要(arch)"食物来源，
    <tspan x="50" dy="25">就像一个巨大的土豆，里面充满了淀粉(starch)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Potatoes are a good source of starch.
  </text>
  <text x="50" y="310" class="content">
    土豆是淀粉的良好来源。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Potato -->
    <ellipse cx="175" cy="100" rx="100" ry="70" class="image" />
    <!-- Starch particles -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="175" cy="150" r="10" class="image" />
    <circle cx="125" cy="120" r="10" class="image" />
    <circle cx="225" cy="120" r="10" class="image" />
  </g>
</svg>