<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">allowance</text>
  <text x="50" y="120" class="subtitle">[əˈlaʊəns] n. 津贴，零用钱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> allow (允许) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子每天被"允许(allow)"
    <tspan x="50" dy="25">得到一些零用钱(allowance)，</tspan>
    <tspan x="50" dy="25">这些钱是他自由支配的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gets a weekly allowance to buy snacks.
  </text>
  <text x="50" y="310" class="content">
    他每周得到零用钱买零食。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Money bag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Child -->
    <circle cx="80" cy="150" r="20" class="image" />
    <line x1="80" y1="170" x2="80" y2="200" class="image" />
    <line x1="80" y1="200" x2="60" y2="230" class="image" />
    <line x1="80" y1="200" x2="100" y2="230" class="image" />
    <line x1="80" y1="180" x2="120" y2="170" class="image" />
    <!-- Hand reaching for money -->
    <line x1="80" y1="170" x2="50" y2="120" class="image" />
  </g>
</svg>