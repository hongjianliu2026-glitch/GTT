<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maximal</text>
  <text x="50" y="120" class="subtitle">[ˈmæksɪməl] adj. 最大的，最高的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> max (最大) + -imal (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨人站在山顶，他的身影"最大(max)"
    <tspan x="50" dy="25">到几乎看不见天空，这就是"最大的(maximal)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company aims to achieve maximal profits this year.
  </text>
  <text x="50" y="310" class="content">
    公司今年的目标是实现最大利润。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Giant -->
    <circle cx="150" cy="100" r="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="100" y2="250" class="image" />
    <line x1="150" y1="200" x2="200" y2="250" class="image" />
    <line x1="150" y1="170" x2="100" y2="160" class="image" />
    <line x1="150" y1="170" x2="200" y2="160" class="image" />
  </g>
</svg>