<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">joyful</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɔɪfəl] adj. 快乐的，高兴的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> joy (快乐) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满快乐(joy)的人，脸上洋溢着笑容，
    <tspan x="50" dy="25">周围环绕着五彩斑斓的气球，这就是一个充满快乐(joyful)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were joyful at the birthday party.
  </text>
  <text x="50" y="310" class="content">
    孩子们在生日派对上非常快乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Happy face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <circle cx="80" cy="80" r="10" class="image" fill="#000" />
    <circle cx="120" cy="80" r="10" class="image" fill="#000" />
    <path d="M80 120 Q100 140 120 120" class="image" fill="none" stroke="#000" stroke-width="5" />

    <!-- Balloons -->
    <circle cx="200" cy="50" r="20" class="image" fill="#E74C3C" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <circle cx="250" cy="50" r="20" class="image" fill="#3498DB" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <circle cx="300" cy="50" r="20" class="image" fill="#2ECC71" />
    <line x1="300" y1="70" x2="300" y2="120" class="image" />
  </g>
</svg>