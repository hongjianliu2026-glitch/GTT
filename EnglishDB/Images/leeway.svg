<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leeway</text>
  <text x="50" y="120" class="subtitle">[ˈliːweɪ] n. 余地，回旋余地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lee (避风处) + way (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在海上航行，"避风处(lee)"
    <tspan x="50" dy="25">给了它"路(way)"，即回旋的余地(leeway)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We have some leeway in our schedule to visit the museum.
  </text>
  <text x="50" y="310" class="content">
    我们的日程安排有一些余地，可以去参观博物馆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boat -->
    <polygon points="0,100 50,50 100,100" class="image" />
    <!-- Wind -->
    <line x1="120" y1="80" x2="180" y2="80" class="image" />
    <line x1="120" y1="80" x2="140" y2="60" class="image" />
    <line x1="120" y1="80" x2="140" y2="100" class="image" />
    <!-- Path -->
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="220" y2="80" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
  </g>
</svg>