<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">day-to-day</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪ tu ˈdeɪ] adj. 日常的，每日的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> day (天) + to (到) + day (天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人每天都在做同样的事情，从一天到另一天，
    <tspan x="50" dy="25">这就是"day-to-day"的生活，充满了日常的琐事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She manages her day-to-day tasks efficiently.
  </text>
  <text x="50" y="310" class="content">
    她高效地管理着日常任务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Days -->
    <text x="70" y="50" class="content">Mon</text>
    <text x="140" y="50" class="content">Tue</text>
    <text x="210" y="50" class="content">Wed</text>
    <text x="280" y="50" class="content">Thu</text>
    <text x="70" y="80" class="content">Fri</text>
    <text x="140" y="80" class="content">Sat</text>
    <text x="210" y="80" class="content">Sun</text>
    <!-- Tasks -->
    <line x1="70" y1="110" x2="280" y2="110" class="image" />
    <line x1="70" y1="140" x2="250" y2="140" class="image" />
    <line x1="70" y1="170" x2="270" y2="170" class="image" />
    <line x1="70" y1="200" x2="240" y2="200" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>