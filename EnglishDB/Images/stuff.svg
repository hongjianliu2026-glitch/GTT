<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stuff</text>
  <text x="50" y="120" class="subtitle">[stʌf] n. 东西，材料；v. 填满，塞满</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stu- (站立) + ff (重复)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箱子，里面"站满了(stu-ff)"
    <tspan x="50" dy="25">各种各样的东西，这些堆积如山的物品就是stuff。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stuffed her suitcase with clothes for the trip.
  </text>
  <text x="50" y="310" class="content">
    她为旅行把衣服塞满了行李箱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Box -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Stuffed items -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Label -->
    <text x="150" y="190" class="content">Stuff</text>
  </g>
</svg>