<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uterus</text>
  <text x="50" y="120" class="subtitle">[ˈjuːtərəs] n. 子宫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uter (子宫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的子宫形状的气球，里面装满了生命力，
    <tspan x="50" dy="25">象征着孕育和生命的开始。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor examined her uterus for any abnormalities.
  </text>
  <text x="50" y="310" class="content">
    医生检查了她的子宫是否有异常。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Uterus shape -->
    <path d="M 0 100 Q 50 50 100 100 Q 150 150 200 100 Q 250 50 300 100" class="image" />
    <!-- Life symbol -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="140" x2="130" y2="130" class="image" />
    <line x1="150" y1="140" x2="170" y2="130" class="image" />
  </g>
</svg>