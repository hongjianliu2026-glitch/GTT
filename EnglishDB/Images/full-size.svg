<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">full-size</text>
  <text x="50" y="120" class="subtitle">[ˌfʊlˈsaɪz] adj. 全尺寸的，满尺寸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> full (满的) + size (尺寸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的尺子，"满(full)"到"尺寸(size)"都撑满了，这就是全尺寸(full-size)的意思。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store sells full-size furniture.
  </text>
  <text x="50" y="310" class="content">
    这家商店出售全尺寸的家具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ruler -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Marks on the ruler -->
    <line x1="20" y1="0" x2="20" y2="50" class="image" />
    <line x1="40" y1="0" x2="40" y2="50" class="image" />
    <line x1="60" y1="0" x2="60" y2="50" class="image" />
    <line x1="80" y1="0" x2="80" y2="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <line x1="120" y1="0" x2="120" y2="50" class="image" />
    <line x1="140" y1="0" x2="140" y2="50" class="image" />
    <line x1="160" y1="0" x2="160" y2="50" class="image" />
    <line x1="180" y1="0" x2="180" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <line x1="220" y1="0" x2="220" y2="50" class="image" />
    <line x1="240" y1="0" x2="240" y2="50" class="image" />
    <line x1="260" y1="0" x2="260" y2="50" class="image" />
    <line x1="280" y1="0" x2="280" y2="50" class="image" />
    <line x1="300" y1="0" x2="300" y2="50" class="image" />
    <line x1="320" y1="0" x2="320" y2="50" class="image" />
    <line x1="340" y1="0" x2="340" y2="50" class="image" />
  </g>
</svg>