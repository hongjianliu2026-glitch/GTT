<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frontier</text>
  <text x="50" y="120" class="subtitle">[ˈfrʌnˌtɪr] n. 边境，边疆；新领域</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> front- (前面) + -ier (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的探险家站在"前面(front)"，
    <tspan x="50" dy="25">面对未知的"边境(frontier)"，准备开辟新天地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientists are exploring the frontiers of space.
  </text>
  <text x="50" y="310" class="content">
    科学家们正在探索太空的新领域。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain range -->
    <polyline points="0,150 50,100 100,150 150,100 200,150 250,100 300,150" class="image" />
    <!-- Explorer -->
    <circle cx="20" cy="130" r="15" class="image" />
    <line x1="20" y1="145" x2="20" y2="180" class="image" />
    <line x1="20" y1="180" x2="0" y2="210" class="image" />
    <line x1="20" y1="180" x2="40" y2="210" class="image" />
    <line x1="20" y1="160" x2="50" y2="150" class="image" />
    <!-- Frontier line -->
    <line x1="0" y1="150" x2="300" y2="150" class="image" />
    <text x="150" y="170" class="content" text-anchor="middle">Frontier</text>
  </g>
</svg>