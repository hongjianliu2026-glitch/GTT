<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nationalize</text>
  <text x="50" y="120" class="subtitle">[ˈnæʃənəlaɪz] v. 国有化，使成为国家财产</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nation (国家) + -al (形容词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的国家标志（如国旗）正在"吞噬"一家工厂，
    <tspan x="50" dy="25">象征着国家将工厂"国有化(nationalize)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government decided to nationalize the oil industry.
  </text>
  <text x="50" y="310" class="content">
    政府决定将石油工业国有化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Flag -->
    <rect x="20" y="10" width="30" height="180" class="image" />
    <polygon points="50,10 80,30 50,50 80,70 50,90 80,110 50,130 80,150 50,170" class="image" />
    <!-- Flag swallowing the factory -->
    <line x1="50" y1="10" x2="50" y2="200" class="image" />
    <line x1="80" y1="30" x2="80" y2="200" class="image" />
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <line x1="80" y1="70" x2="80" y2="200" class="image" />
    <line x1="50" y1="90" x2="50" y2="200" class="image" />
    <line x1="80" y1="110" x2="80" y2="200" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="80" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
  </g>
</svg>