<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ash</text>
  <text x="50" y="120" class="subtitle">[æʃ] n. 灰，灰烬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *askaz，意为“灰烬”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场大火过后，留下了一堆灰烬(ash)，
    <tspan x="50" dy="25">这些灰烬轻轻一吹就会飘散，象征着火的余烬。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forest fire left behind a thick layer of ash.
  </text>
  <text x="50" y="310" class="content">
    森林大火留下了一层厚厚的灰烬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire pit -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ashes -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#D7DBDD" />
    <!-- Wind blowing -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Smoke -->
    <circle cx="20" cy="100" r="15" class="image" fill="#808B96" />
    <circle cx="40" cy="120" r="15" class="image" fill="#808B96" />
    <circle cx="60" cy="140" r="15" class="image" fill="#808B96" />
  </g>
</svg>