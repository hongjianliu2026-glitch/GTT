<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sound</text>
  <text x="50" y="120" class="subtitle">[saʊnd] n. 声音，音调；v. 听起来</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> son (声音) + -d (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的喇叭，"发出(son)"
    <tspan x="50" dy="25">震耳欲聋的声音(sound)，整个世界都在回响。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sound of the ocean waves is soothing.
  </text>
  <text x="50" y="310" class="content">
    海浪的声音令人感到舒缓。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large speaker -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Sound waves -->
    <line x1="100" y1="20" x2="250" y2="20" class="image" />
    <line x1="100" y1="40" x2="250" y2="40" class="image" />
    <line x1="100" y1="60" x2="250" y2="60" class="image" />
    <line x1="100" y1="80" x2="250" y2="80" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="120" x2="250" y2="120" class="image" />
    <line x1="100" y1="140" x2="250" y2="140" class="image" />
    <line x1="100" y1="160" x2="250" y2="160" class="image" />
    <line x1="100" y1="180" x2="250" y2="180" class="image" />
  </g>
</svg>