<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .snowball { fill: #FFFFFF; stroke: #7F8C8D; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snowball</text>
  <text x="50" y="120" class="subtitle">[ˈsnoʊbɔːl] n. 雪球；v. 迅速增长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snow (雪) + ball (球)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩在雪地里，"滚雪球(snowball)"，
    <tspan x="50" dy="25">雪球越滚越大，就像某些事情迅速增长一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The debt snowballed over the years.
  </text>
  <text x="50" y="310" class="content">
    债务在这些年里迅速增长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowball -->
    <circle cx="100" cy="100" r="50" class="snowball" />
    <!-- Child -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Snowball rolling -->
    <circle cx="150" cy="100" r="30" class="snowball" />
    <circle cx="200" cy="100" r="20" class="snowball" />
    <circle cx="250" cy="100" r="10" class="snowball" />
  </g>
</svg>