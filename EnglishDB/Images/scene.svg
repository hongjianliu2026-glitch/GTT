<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scene</text>
  <text x="50" y="120" class="subtitle">[siːn] n. 场景，场面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scena (舞台)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的舞台(scena)上，演员们正在表演，
    <tspan x="50" dy="25">这个舞台就是他们展示的场景(scene)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scene in the park was full of laughter.
  </text>
  <text x="50" y="310" class="content">
    公园里的场景充满了笑声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actors -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Curtains -->
    <line x1="0" y1="0" x2="0" y2="200" class="image" />
    <line x1="350" y1="0" x2="350" y2="200" class="image" />
    <!-- Spotlight -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="200" class="image" />
  </g>
</svg>