<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ship</text>
  <text x="50" y="120" class="subtitle">[ʃɪp] n. 船，舰；v. 运送</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "shippe"，意为“船”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘巨大的船在海上航行，"运送(ship)"
    <tspan x="50" dy="25">着货物和乘客，这艘船就是"ship"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cargo ship was loaded with goods from China.
  </text>
  <text x="50" y="310" class="content">
    这艘货船装载着来自中国的货物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 250,120 0,120" class="image" />
    <line x1="50" y1="180" x2="50" y2="120" class="image" />
    <line x1="200" y1="180" x2="200" y2="120" class="image" />
    <line x1="125" y1="120" x2="125" y2="80" class="image" />
    <line x1="125" y1="80" x2="100" y2="80" class="image" />
    <line x1="125" y1="80" x2="150" y2="80" class="image" />
    <line x1="100" y1="80" x2="100" y2="60" class="image" />
    <line x1="150" y1="80" x2="150" y2="60" class="image" />
    <line x1="100" y1="60" x2="150" y2="60" class="image" />
  </g>
</svg>