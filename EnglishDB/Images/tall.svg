<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tall</text>
  <text x="50" y="120" class="subtitle">[tɔːl] adj. 高的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tall (源自中古英语，意为“高的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵参天大树，"高耸入云(tall)"，
    <tspan x="50" dy="25">仿佛要触摸到天空的边缘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tall building was visible from miles away.
  </text>
  <text x="50" y="310" class="content">
    那座高楼从几英里外就能看到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tall tree -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Branches -->
    <line x1="175" y1="50" x2="150" y2="70" class="image" />
    <line x1="175" y1="50" x2="200" y2="70" class="image" />
    <line x1="175" y1="100" x2="140" y2="120" class="image" />
    <line x1="175" y1="100" x2="210" y2="120" class="image" />
    <line x1="175" y1="150" x2="130" y2="170" class="image" />
    <line x1="175" y1="150" x2="220" y2="170" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="30" rx="50" ry="20" class="image" />
    <ellipse cx="250" cy="40" rx="60" ry="25" class="image" />
  </g>
</svg>