<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">classmate</text>
  <text x="50" y="120" class="subtitle">[ˈklæsmeɪt] n. 同班同学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> class (班级) + mate (伙伴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个教室里，"班级(class)"里的"伙伴(mate)"们
    <tspan x="50" dy="25">一起学习，这些伙伴就是你的同班同学(classmate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is my classmate from high school.
  </text>
  <text x="50" y="310" class="content">
    她是我高中时的同班同学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Desks -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <rect x="200" y="20" width="100" height="80" class="image" />
    <!-- Students -->
    <circle cx="100" cy="70" r="15" class="image" />
    <circle cx="250" cy="70" r="15" class="image" />
    <!-- Teacher -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="155" y2="210" class="image" />
    <line x1="175" y1="190" x2="195" y2="210" class="image" />
    <line x1="175" y1="180" x2="205" y2="170" class="image" />
  </g>
</svg>