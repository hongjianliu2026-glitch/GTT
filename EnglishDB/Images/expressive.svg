<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">expressive</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspresɪv] adj. 表达的，有表现力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + press (压) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在舞台上，"向外压出(ex-press)"
    <tspan x="50" dy="25">情感，用丰富的表情和肢体语言表达(expressive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her expressive eyes conveyed her deep emotions.
  </text>
  <text x="50" y="310" class="content">
    她那富有表现力的眼睛传达了她深沉的情感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actor -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Expressive eyes -->
    <ellipse cx="150" cy="90" rx="10" ry="15" class="image" />
    <ellipse cx="200" cy="90" rx="10" ry="15" class="image" />
    <!-- Mouth -->
    <path d="M150 120 Q175 140 200 120" class="image" />
    <!-- Arms -->
    <line x1="145" y1="130" x2="100" y2="160" class="image" />
    <line x1="205" y1="130" x2="250" y2="160" class="image" />
  </g>
</svg>