<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kid</text>
  <text x="50" y="120" class="subtitle">[kɪd] n. 小孩，小山羊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kid (小山羊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小山羊(kid)在山坡上跳跃，
    <tspan x="50" dy="25">它的活泼和天真让人联想到小孩(kid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kid was playing in the park.
  </text>
  <text x="50" y="310" class="content">
    小孩在公园里玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hill -->
    <path d="M0 200 Q100 100 200 200 T400 200" class="image" />
    <!-- Kid (goat) -->
    <circle cx="100" cy="180" r="20" class="image" />
    <line x1="100" y1="200" x2="100" y2="240" class="image" />
    <line x1="100" y1="240" x2="80" y2="270" class="image" />
    <line x1="100" y1="240" x2="120" y2="270" class="image" />
    <line x1="100" y1="220" x2="70" y2="210" class="image" />
    <line x1="100" y1="220" x2="130" y2="210" class="image" />
    <!-- Kid (child) -->
    <circle cx="300" cy="180" r="20" class="image" />
    <line x1="300" y1="200" x2="300" y2="240" class="image" />
    <line x1="300" y1="240" x2="280" y2="270" class="image" />
    <line x1="300" y1="240" x2="320" y2="270" class="image" />
    <line x1="300" y1="220" x2="270" y2="210" class="image" />
    <line x1="300" y1="220" x2="330" y2="210" class="image" />
  </g>
</svg>