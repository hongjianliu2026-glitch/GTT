<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blade</text>
  <text x="50" y="120" class="subtitle">[bleɪd] n. 刀片，叶片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blad (刀片)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀片(blad)，它像风一样快速地切割空气，
    <tspan x="50" dy="25">仿佛在空中留下了一道闪亮的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef carefully sharpened the blade of the knife.
  </text>
  <text x="50" y="310" class="content">
    厨师仔细地磨快了刀的刀片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Blade -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <line x1="0" y1="0" x2="0" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <line x1="0" y1="50" x2="200" y2="50" class="image" />
    <!-- Handle -->
    <rect x="80" y="50" width="40" height="80" class="image" />
  </g>
</svg>