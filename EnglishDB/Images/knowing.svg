<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knowing</text>
  <text x="50" y="120" class="subtitle">[ˈnoʊɪŋ] adj. 知道的，有知识的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> know (知道) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个智者，他的头顶上有一个闪亮的灯泡，象征着"知道(know)"的智慧。
    <tspan x="50" dy="25">这个灯泡照亮了他的周围，显示出他丰富的知识(knowing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a knowing person who always has the right answers.
  </text>
  <text x="50" y="310" class="content">
    她是一个知识渊博的人，总是能给出正确的答案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wise man -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Light bulb -->
    <circle cx="50" cy="30" r="20" class="image" />
    <line x1="50" y1="10" x2="50" y2="0" class="image" />
    <line x1="40" y1="5" x2="60" y2="5" class="image" />
    <line x1="45" y1="0" x2="55" y2="0" class="image" />
    <!-- Rays of light -->
    <line x1="50" y1="0" x2="50" y2="-30" class="image" />
    <line x1="50" y1="0" x2="80" y2="-10" class="image" />
    <line x1="50" y1="0" x2="20" y2="-10" class="image" />
    <line x1="50" y1="0" x2="70" y2="20" class="image" />
    <line x1="50" y1="0" x2="30" y2="20" class="image" />
  </g>
</svg>