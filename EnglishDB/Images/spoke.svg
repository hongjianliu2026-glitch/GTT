<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spoke</text>
  <text x="50" y="120" class="subtitle">[spoʊk] n. 辐条，轮辐；v. speak的过去式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spok (源自古英语 spoc, 意为"辐条")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆自行车，轮子上的"辐条(spoke)"
    <tspan x="50" dy="25">像是一根根细长的手指，支撑着整个车轮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spoke of the wheel broke during the race.
  </text>
  <text x="50" y="310" class="content">
    比赛过程中，车轮的辐条断了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle wheel -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Spokes -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="20" x2="250" y2="100" class="image" />
    <line x1="175" y1="20" x2="100" y2="100" class="image" />
    <line x1="175" y1="180" x2="250" y2="100" class="image" />
    <line x1="175" y1="180" x2="100" y2="100" class="image" />
  </g>
</svg>