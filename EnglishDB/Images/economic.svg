<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">economic</text>
  <text x="50" y="120" class="subtitle">[ˌiːkəˈnɒmɪk] adj. 经济的，经济学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eco- (家) + nom (管理) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭(eco-)的管理者(nom)，他需要精打细算，
    <tspan x="50" dy="25">合理分配资源，这就是经济(economic)的本质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The economic situation in the country is improving.
  </text>
  <text x="50" y="310" class="content">
    该国的经济状况正在改善。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="100" x2="130" y2="100" class="image" />
    <line x1="75" y1="50" x2="75" y2="100" class="image" />
    <!-- Money -->
    <rect x="180" y="20" width="100" height="50" class="image" />
    <line x1="180" y1="45" x2="280" y2="45" class="image" />
    <line x1="230" y1="20" x2="230" y2="70" class="image" />
    <!-- Manager -->
    <circle cx="350" cy="50" r="20" class="image" />
    <line x1="350" y1="70" x2="350" y2="100" class="image" />
    <line x1="350" y1="100" x2="330" y2="130" class="image" />
    <line x1="350" y1="100" x2="370" y2="130" class="image" />
    <line x1="350" y1="80" x2="380" y2="70" class="image" />
  </g>
</svg>