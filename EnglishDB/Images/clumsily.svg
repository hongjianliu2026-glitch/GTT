<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clumsily</text>
  <text x="50" y="120" class="subtitle">[ˈklʌmzɪli] adv. 笨拙地，不灵巧地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clum- (笨拙) + -sily (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图跳舞，但"笨拙地(clum-sily)"
    <tspan x="50" dy="25">摔倒了，手里还拿着一个破碎的花瓶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He walked clumsily across the room, knocking over a vase.
  </text>
  <text x="50" y="310" class="content">
    他笨拙地走过房间，撞倒了一个花瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Broken vase -->
    <path d="M 100 100 Q 120 80 140 100 L 140 120 Q 120 140 100 120 Z" class="image" />
    <line x1="120" y1="100" x2="120" y2="120" class="image" />
    <line x1="110" y1="110" x2="130" y2="110" class="image" />
  </g>
</svg>