<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bind</text>
  <text x="50" y="120" class="subtitle">[baɪnd] v. 捆绑，绑定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bind (捆绑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用绳子紧紧地"捆绑(bind)"
    <tspan x="50" dy="25">住两个物体，使它们紧密相连，无法分离。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a rope to bind the two boxes together.
  </text>
  <text x="50" y="310" class="content">
    她用绳子把两个箱子捆绑在一起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rope -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="70" x2="300" y2="70" class="image" />
    <line x1="50" y1="90" x2="300" y2="90" class="image" />
    <!-- Boxes -->
    <rect x="70" y="20" width="100" height="100" class="image" />
    <rect x="200" y="20" width="100" height="100" class="image" />
    <!-- Knot -->
    <circle cx="170" cy="60" r="10" class="image" />
  </g>
</svg>