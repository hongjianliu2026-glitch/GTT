<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">magnetism</text>
  <text x="50" y="120" class="subtitle">[ˈmæɡnɪtɪzəm] n. 磁性，磁力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> magnet (磁铁) + -ism (性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的磁铁，"吸引(magnet)"
    <tspan x="50" dy="25">周围的所有金属物体，这种强大的吸引力就是磁性(magnetism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magnetism of the magnet is strong enough to pick up all the paper clips.
  </text>
  <text x="50" y="310" class="content">
    这块磁铁的磁性很强，足以吸起所有的回形针。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Metal objects -->
    <circle cx="250" cy="50" r="20" class="image" />
    <rect x="280" y="40" width="40" height="20" class="image" />
    <line x1="330" y1="50" x2="350" y2="50" class="image" />
    <!-- Attraction lines -->
    <line x1="200" y1="50" x2="230" y2="50" class="image" />
    <line x1="200" y1="50" x2="270" y2="50" class="image" />
    <line x1="200" y1="50" x2="320" y2="50" class="image" />
  </g>
</svg>