<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ledge</text>
  <text x="50" y="120" class="subtitle">[lɛdʒ] n. 壁架，突出部分</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> led (lead, 引导) + ge (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在悬崖边，"引导(led)"
    <tspan x="50" dy="25">他前进的是一个突出的"地方(ge)"，那就是壁架(ledge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He carefully climbed down the narrow ledge.
  </text>
  <text x="50" y="310" class="content">
    他小心翼翼地沿着狭窄的壁架爬下去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ledge -->
    <rect x="100" y="100" width="150" height="20" class="image" />
    <!-- Explorer -->
    <circle cx="175" cy="90" r="15" class="image" />
    <line x1="175" y1="105" x2="175" y2="140" class="image" />
    <line x1="175" y1="140" x2="155" y2="170" class="image" />
    <line x1="175" y1="140" x2="195" y2="170" class="image" />
    <line x1="175" y1="120" x2="205" y2="110" class="image" />
  </g>
</svg>