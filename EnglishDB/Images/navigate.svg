<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">navigate</text>
  <text x="50" y="120" class="subtitle">[ˈnævɪɡeɪt] v. 导航，航行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> navi (船) + gate (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在海上，"引导(gate)"着船只"航行(navi)"，
    <tspan x="50" dy="25">这就是导航(navigate)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The captain navigated the ship through the storm.
  </text>
  <text x="50" y="310" class="content">
    船长在暴风雨中为船只导航。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 175,150 75,150" class="image" />
    <line x1="125" y1="150" x2="125" y2="100" class="image" />
    <line x1="125" y1="100" x2="100" y2="120" class="image" />
    <line x1="125" y1="100" x2="150" y2="120" class="image" />
    <!-- Waves -->
    <path d="M50,180 Q100,200 150,180 Q200,200 250,180" class="image" />
    <path d="M50,190 Q100,210 150,190 Q200,210 250,190" class="image" />
    <path d="M50,200 Q100,220 150,200 Q200,220 250,200" class="image" />
  </g>
</svg>