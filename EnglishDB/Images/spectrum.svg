<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spectrum</text>
  <text x="50" y="120" class="subtitle">[ˈspektrəm] n. 光谱，范围，系列</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spect- (看) + -rum (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家用棱镜将白光"看(spect-)"成
    <tspan x="50" dy="25">七彩的光谱(spectrum)，这个光谱展示了光的范围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spectrum of colors in the rainbow is beautiful.
  </text>
  <text x="50" y="310" class="content">
    彩虹中的色彩光谱非常美丽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Prism -->
    <polygon points="0,0 150,0 75,150" class="image" />
    <!-- Spectrum -->
    <rect x="160" y="0" width="200" height="150" class="image" />
    <line x1="160" y1="10" x2="360" y2="10" class="image" />
    <line x1="160" y1="30" x2="360" y2="30" class="image" />
    <line x1="160" y1="50" x2="360" y2="50" class="image" />
    <line x1="160" y1="70" x2="360" y2="70" class="image" />
    <line x1="160" y1="90" x2="360" y2="90" class="image" />
    <line x1="160" y1="110" x2="360" y2="110" class="image" />
    <line x1="160" y1="130" x2="360" y2="130" class="image" />
    <!-- Colors -->
    <rect x="160" y="0" width="200" height="20" fill="red" />
    <rect x="160" y="20" width="200" height="20" fill="orange" />
    <rect x="160" y="40" width="200" height="20" fill="yellow" />
    <rect x="160" y="60" width="200" height="20" fill="green" />
    <rect x="160" y="80" width="200" height="20" fill="blue" />
    <rect x="160" y="100" width="200" height="20" fill="indigo" />
    <rect x="160" y="120" width="200" height="20" fill="violet" />
  </g>
</svg>