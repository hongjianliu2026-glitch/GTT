<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abut</text>
  <text x="50" y="120" class="subtitle">[əˈbʌt] v. 邻接，紧靠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (朝向) + but (边界)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两栋房子"朝向(a-)"同一个"边界(but)"，
    <tspan x="50" dy="25">它们紧紧"邻接(abut)"在一起。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two properties abut each other.
  </text>
  <text x="50" y="310" class="content">
    这两块地产彼此邻接。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- First house -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Second house -->
    <rect x="150" y="0" width="150" height="100" class="image" />
    <!-- Shared wall -->
    <line x1="150" y1="0" x2="150" y2="100" class="image" />
    <!-- Roofs -->
    <polyline points="0,0 75,50 150,0" class="image" />
    <polyline points="150,0 225,50 300,0" class="image" />
  </g>
</svg>