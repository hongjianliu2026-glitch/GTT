<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">avalanche</text>
  <text x="50" y="120" class="subtitle">[ˈævəˌlæntʃ] n. 雪崩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (向下) + val (山) + -anche (大量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座山，"向下(a-)"突然"大量(anche)"的雪"山(val)"
    <tspan x="50" dy="25">崩塌下来，这就是雪崩(avalanche)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The avalanche buried the entire village.
  </text>
  <text x="50" y="310" class="content">
    雪崩掩埋了整个村庄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Snow -->
    <polygon points="50,150 150,50 250,150" class="image" fill="white" />
    <!-- Avalanche -->
    <polygon points="75,175 150,100 225,175" class="image" fill="white" />
    <line x1="75" y1="175" x2="225" y2="175" class="image" />
    <line x1="100" y1="175" x2="100" y2="200" class="image" />
    <line x1="125" y1="175" x2="125" y2="200" class="image" />
    <line x1="150" y1="175" x2="150" y2="200" class="image" />
    <line x1="175" y1="175" x2="175" y2="200" class="image" />
    <line x1="200" y1="175" x2="200" y2="200" class="image" />
  </g>
</svg>