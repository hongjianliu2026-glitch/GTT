<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">waitress</text>
  <text x="50" y="120" class="subtitle">[ˈweɪtrɪs] n. 女服务员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wait (等待) + -ress (女性)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女服务员在餐厅里，"等待(wait)"
    <tspan x="50" dy="25">顾客的点单，她就是女服务员(waitress)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The waitress brought us the menu and took our order.
  </text>
  <text x="50" y="310" class="content">
    女服务员给我们拿来菜单并接受了我们的点单。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Restaurant table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Waitress -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Menu -->
    <rect x="100" y="50" width="100" height="100" class="image" />
    <!-- Customer -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <line x1="250" y1="140" x2="300" y2="130" class="image" />
  </g>
</svg>