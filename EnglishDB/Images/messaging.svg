<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">messaging</text>
  <text x="50" y="120" class="subtitle">[ˈmɛsɪdʒɪŋ] n. 消息传递，通信</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mess (送) + -age (行为) + -ing (进行中)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个快递员在城市中穿梭，"送(mess)"
    <tspan x="50" dy="25">着各种消息，这些消息在空中飞舞，构成了消息传递(messaging)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The app is designed for seamless messaging.
  </text>
  <text x="50" y="310" class="content">
    这个应用程序是为无缝消息传递而设计的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courier -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Messages -->
    <rect x="70" y="80" width="30" height="20" class="image" />
    <rect x="120" y="90" width="30" height="20" class="image" />
    <rect x="170" y="70" width="30" height="20" class="image" />
    <rect x="220" y="85" width="30" height="20" class="image" />
    <!-- Flying messages -->
    <line x1="70" y1="80" x2="100" y2="50" class="image" />
    <line x1="120" y1="90" x2="150" y2="60" class="image" />
    <line x1="170" y1="70" x2="200" y2="40" class="image" />
    <line x1="220" y1="85" x2="250" y2="55" class="image" />
  </g>
</svg>