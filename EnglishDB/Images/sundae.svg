<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .icecream { fill: #FFF3E0; stroke: #FFA000; stroke-width: 2; }
      .cherry { fill: #E74C3C; }
      .spoon { fill: #BDC3C7; stroke: #7F8C8D; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sundae</text>
  <text x="50" y="120" class="subtitle">[ˈsʌndeɪ] n. 圣代冰淇淋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + dae (日)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个炎热的夏日，太阳(sun)高照，你坐在公园的长椅上，享受着一份美味的圣代冰淇淋(sundae)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ordered a chocolate sundae with extra whipped cream.
  </text>
  <text x="50" y="310" class="content">
    她点了一份巧克力圣代，上面加了很多鲜奶油。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice cream sundae -->
    <circle cx="100" cy="100" r="50" class="icecream" />
    <circle cx="120" cy="80" r="10" class="cherry" />
    <rect x="80" y="150" width="40" height="100" class="spoon" />
    <line x1="100" y1="150" x2="100" y2="250" class="spoon" />
  </g>
</svg>