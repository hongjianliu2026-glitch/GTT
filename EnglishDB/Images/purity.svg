<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .drop { fill: #1ABC9C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">purity</text>
  <text x="50" y="120" class="subtitle">[ˈpjʊrəti] n. 纯净，纯洁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pur- (纯净) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个清澈的湖泊，"纯净(pur-)"
    <tspan x="50" dy="25">的水面上没有一丝杂质，这就是纯净(purity)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The purity of the mountain spring water is remarkable.
  </text>
  <text x="50" y="310" class="content">
    山泉水的纯净度令人惊叹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Water drops -->
    <circle cx="50" cy="100" r="15" class="drop" />
    <circle cx="100" cy="120" r="15" class="drop" />
    <circle cx="150" cy="140" r="15" class="drop" />
    <circle cx="200" cy="160" r="15" class="drop" />
    <circle cx="250" cy="180" r="15" class="drop" />
    <!-- Reflection -->
    <line x1="50" y1="115" x2="300" y2="115" class="image" />
    <line x1="50" y1="135" x2="300" y2="135" class="image" />
    <line x1="50" y1="155" x2="300" y2="155" class="image" />
    <line x1="50" y1="175" x2="300" y2="175" class="image" />
  </g>
</svg>