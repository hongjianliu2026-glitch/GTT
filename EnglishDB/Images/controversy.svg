<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">controversy</text>
  <text x="50" y="120" class="subtitle">[ˈkɒntrəvɜːrsi] n. 争论，争议</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> contro- (相反) + vers (转) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，"相反地转动(contro-vers)"
    <tspan x="50" dy="25">他们的观点，激烈地争论，这就是争议(controversy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy has sparked a heated controversy.
  </text>
  <text x="50" y="310" class="content">
    新政策引发了激烈的争议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Arrows representing opposing views -->
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <line x1="230" y1="100" x2="210" y2="80" class="image" />
    <line x1="230" y1="100" x2="210" y2="120" class="image" />
    <line x1="70" y1="100" x2="90" y2="80" class="image" />
    <line x1="70" y1="100" x2="90" y2="120" class="image" />
    <!-- Speech bubbles -->
    <path d="M50,130 Q30,150 50,170 Q70,150 50,130" class="image" />
    <path d="M250,130 Q270,150 250,170 Q230,150 250,130" class="image" />
  </g>
</svg>