<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">six</text>
  <text x="50" y="120" class="subtitle">[sɪks] n. 六</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *seks, 意为“六”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“6”在天空中飞翔，
    <tspan x="50" dy="25">它的尾巴像一条长长的蛇，环绕着整个城市。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are six apples on the table.
  </text>
  <text x="50" y="310" class="content">
    桌子上有六个苹果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number "6" -->
    <path d="M0 0 L50 0 L50 100 L0 100 Z" class="image" />
    <!-- Snake tail -->
    <path d="M50 50 Q75 25, 100 50 T150 50 T200 50 T250 50 T300 50" class="image" />
    <!-- City skyline -->
    <rect x="300" y="80" width="50" height="20" class="image" />
    <rect x="350" y="60" width="50" height="40" class="image" />
    <rect x="400" y="70" width="50" height="30" class="image" />
  </g>
</svg>