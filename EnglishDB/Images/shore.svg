<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shore</text>
  <text x="50" y="120" class="subtitle">[ʃɔːr] n. 岸，海滨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shor (来自古英语 scora，意为“海岸”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片宽广的海岸线，海浪轻轻拍打着沙滩，
    <tspan x="50" dy="25">岸边的树木随风摇曳，仿佛在向你招手。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We spent the day walking along the shore.
  </text>
  <text x="50" y="310" class="content">
    我们一整天都在岸边散步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Shoreline -->
    <line x1="0" y1="100" x2="400" y2="100" class="image" />
    <!-- Waves -->
    <polyline points="0,100 20,90 40,100 60,90 80,100 100,90 120,100 140,90 160,100 180,90 200,100 220,90 240,100 260,90 280,100 300,90 320,100 340,90 360,100 380,90 400,100" class="image" />
    <!-- Trees -->
    <line x1="50" y1="100" x2="50" y2="50" class="image" />
    <line x1="55" y1="100" x2="55" y2="55" class="image" />
    <line x1="60" y1="100" x2="60" y2="60" class="image" />
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <line x1="155" y1="100" x2="155" y2="55" class="image" />
    <line x1="160" y1="100" x2="160" y2="60" class="image" />
  </g>
</svg>