<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">connoisseur</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnəˈsɜːr] n. 鉴赏家，行家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + noiss (知道) + eur (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个鉴赏家，他"共同知道(con-noiss)"
    <tspan x="50" dy="25">许多事物的细节，就像一个行家(connoisseur)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a connoisseur of fine wines.
  </text>
  <text x="50" y="310" class="content">
    他是品酒的行家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="80" y1="50" x2="150" y2="50" class="image" />
    <!-- Eye -->
    <circle cx="200" cy="50" r="20" class="image" />
    <!-- Wine bottle -->
    <rect x="250" y="20" width="50" height="60" class="image" />
    <!-- Wine glass -->
    <rect x="320" y="40" width="20" height="40" class="image" />
    <line x1="330" y1="40" x2="330" y2="0" class="image" />
  </g>
</svg>