<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">broad-based</text>
  <text x="50" y="120" class="subtitle">[ˈbrɔːdbeɪst] adj. 广泛的，基础广泛的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> broad (宽的) + based (基于)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的平台，"宽阔的基础(broad-based)"
    <tspan x="50" dy="25">支撑着无数的人和事物，象征着广泛的基础。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a broad-based approach to employee training.
  </text>
  <text x="50" y="310" class="content">
    公司对员工培训采取了广泛的方法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wide platform -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- People on the platform -->
    <circle cx="50" cy="30" r="10" class="image" />
    <circle cx="100" cy="30" r="10" class="image" />
    <circle cx="150" cy="30" r="10" class="image" />
    <circle cx="200" cy="30" r="10" class="image" />
    <circle cx="250" cy="30" r="10" class="image" />
    <circle cx="300" cy="30" r="10" class="image" />
  </g>
</svg>