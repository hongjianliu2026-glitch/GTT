<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">raid</text>
  <text x="50" y="120" class="subtitle">[reɪd] n. 突袭，袭击；v. 突袭，袭击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rai- (突袭) + d (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群士兵突然"突袭(rai-d)"一个村庄，
    <tspan x="50" dy="25">他们迅速行动，让敌人措手不及。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police conducted a raid on the drug den.
  </text>
  <text x="50" y="310" class="content">
    警察对毒品窝点进行了突袭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="40" class="image" />
    <rect x="120" y="20" width="50" height="40" class="image" />
    <rect x="190" y="20" width="50" height="40" class="image" />
    <!-- Soldiers -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <circle cx="80" cy="100" r="15" class="image" />
    <line x1="80" y1="115" x2="80" y2="150" class="image" />
    <line x1="80" y1="150" x2="60" y2="180" class="image" />
    <line x1="80" y1="150" x2="100" y2="180" class="image" />
    <line x1="80" y1="130" x2="110" y2="120" class="image" />
  </g>
</svg>