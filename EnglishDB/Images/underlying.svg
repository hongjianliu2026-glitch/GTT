<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underlying</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈlaɪɪŋ] adj. 潜在的，根本的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在下面) + lying (躺着)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张桌子，"在下面躺着(under-lying)"
    <tspan x="50" dy="25">一个秘密文件，这个文件就是潜在的(underlying)真相。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The underlying cause of the problem was never addressed.
  </text>
  <text x="50" y="310" class="content">
    问题的根本原因从未被解决。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Secret document -->
    <rect x="50" y="120" width="250" height="50" class="image" />
    <!-- Arrow pointing to the document -->
    <line x1="200" y1="100" x2="200" y2="120" class="image" />
    <polygon points="200,120 190,115 210,115" class="image" />
    <!-- Text label -->
    <text x="100" y="150" class="content">秘密文件</text>
  </g>
</svg>