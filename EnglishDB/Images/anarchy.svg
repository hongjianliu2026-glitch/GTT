<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anarchy</text>
  <text x="50" y="120" class="subtitle">[ˈænərki] n. 无政府状态，混乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (没有) + archy (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有统治者(an-archy)的世界，
    <tspan x="50" dy="25">街道上到处都是混乱(anarchy)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city descended into anarchy after the government collapsed.
  </text>
  <text x="50" y="310" class="content">
    政府垮台后，这座城市陷入了无政府状态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken buildings -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="110" y="0" width="100" height="100" class="image" />
    <rect x="220" y="0" width="100" height="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="160" y1="100" x2="260" y2="100" class="image" />
    <!-- Chaos symbols -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="160" cy="50" r="10" class="image" />
    <circle cx="270" cy="50" r="10" class="image" />
    <line x1="50" y1="60" x2="160" y2="60" class="image" />
    <line x1="160" y1="60" x2="270" y2="60" class="image" />
  </g>
</svg>