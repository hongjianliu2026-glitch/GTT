<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">idol</text>
  <text x="50" y="120" class="subtitle">[ˈaɪdəl] n. 偶像，崇拜对象</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ido- (形象) + -l (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"形象(ido-)"被人们高高举起，
    <tspan x="50" dy="25">每个人都仰望着它，这就是他们的"偶像(idol)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is the idol of many young fans.
  </text>
  <text x="50" y="310" class="content">
    她是许多年轻粉丝的偶像。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Idol -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- People looking up -->
    <line x1="50" y1="180" x2="100" y2="150" class="image" />
    <line x1="150" y1="180" x2="100" y2="150" class="image" />
    <line x1="75" y1="200" x2="100" y2="170" class="image" />
    <line x1="125" y1="200" x2="100" y2="170" class="image" />
    <!-- Arrows pointing up -->
    <line x1="50" y1="180" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="40" y2="170" class="image" />
    <line x1="150" y1="180" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="160" y2="170" class="image" />
  </g>
</svg>