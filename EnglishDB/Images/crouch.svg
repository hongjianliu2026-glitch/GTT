<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crouch</text>
  <text x="50" y="120" class="subtitle">[kraʊtʃ] v. 蹲下，蜷缩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crouch (源自中古英语 crouchen，意为“蹲下”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫在寒冷的夜晚，"蜷缩(crouch)"
    <tspan x="50" dy="25">成一个小球，以保持温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat crouched down under the table.
  </text>
  <text x="50" y="310" class="content">
    猫蹲在桌子下面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Cat head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Cat ears -->
    <polygon points="80,30 100,10 120,30" class="image" />
    <!-- Cat legs -->
    <line x1="70" y1="150" x2="70" y2="200" class="image" />
    <line x1="130" y1="150" x2="130" y2="200" class="image" />
    <!-- Cat tail -->
    <path d="M 150,100 Q 200,50 250,100" class="image" />
  </g>
</svg>