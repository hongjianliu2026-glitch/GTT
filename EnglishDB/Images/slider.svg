<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slider</text>
  <text x="50" y="120" class="subtitle">[ˈslaɪdər] n. 滑块，滑动器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slid (滑) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的滑块，"滑动(slid)"在一条
    <tspan x="50" dy="25">彩虹轨道上，滑块上坐着一个小人，</tspan>
    <tspan x="50" dy="25">小人随着滑块的滑动而上下移动，</tspan>
    <tspan x="50" dy="25">这就是滑块(slider)的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> Adjust the volume using the slider on the screen.
  </text>
  <text x="50" y="330" class="content">
    使用屏幕上的滑块调整音量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rainbow track -->
    <path d="M0,100 C100,0 300,0 400,100" class="image" />
    <!-- Slider -->
    <rect x="180" y="80" width="40" height="40" class="image" />
    <!-- Little person on slider -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="190" y2="150" class="image" />
    <line x1="200" y1="130" x2="210" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="110" class="image" />
  </g>
</svg>