<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incumbent</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkʌmbənt] n. 在职者，现任者；adj. 现任的，义不容辞的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (在...上) + cum (躺) + bent (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个在职者(incumbent)，他"躺在(cum)"
    <tspan x="50" dy="25">职位上，弯曲(bent)着身体，</tspan>
    <tspan x="50" dy="25">象征着他的责任和义务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The incumbent mayor is facing a tough re-election campaign.
  </text>
  <text x="50" y="310" class="content">
    现任市长正面临一场艰难的连任竞选。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Person sitting -->
    <circle cx="100" cy="80" r="20" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="120" x2="140" y2="110" class="image" />
  </g>
</svg>