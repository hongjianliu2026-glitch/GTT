<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">split</text>
  <text x="50" y="120" class="subtitle">[splɪt] v. 分裂，分开；n. 裂口，分裂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spli- (分裂) + -t (动作完成)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的冰块被"劈开(spli-t)"，
    <tspan x="50" dy="25">裂成两半，形成了一个深深的裂口(split)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tree split in half during the storm.
  </text>
  <text x="50" y="310" class="content">
    那棵树在暴风雨中被劈成了两半。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice block -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Split line -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" stroke-width="4" stroke="#E74C3C" />
    <!-- Cracks -->
    <line x1="160" y1="20" x2="190" y2="20" class="image" stroke-width="2" stroke="#E74C3C" />
    <line x1="160" y1="40" x2="190" y2="40" class="image" stroke-width="2" stroke="#E74C3C" />
    <line x1="160" y1="60" x2="190" y2="60" class="image" stroke-width="2" stroke="#E74C3C" />
    <line x1="160" y1="80" x2="190" y2="80" class="image" stroke-width="2" stroke="#E74C3C" />
    <line x1="160" y1="100" x2="190" y2="100" class="image" stroke-width="2" stroke="#E74C3C" />
    <line x1="160" y1="120" x2="190" y2="120" class="image" stroke-width="2" stroke="#E74C3C" />
    <line x1="160" y1="140" x2="190" y2="140" class="image" stroke-width="2" stroke="#E74C3C" />
    <line x1="160" y1="160" x2="190" y2="160" class="image" stroke-width="2" stroke="#E74C3C" />
    <line x1="160" y1="180" x2="190" y2="180" class="image" stroke-width="2" stroke="#E74C3C" />
  </g>
</svg>