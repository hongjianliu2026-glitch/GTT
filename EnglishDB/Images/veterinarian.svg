<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">veterinarian</text>
  <text x="50" y="120" class="subtitle">[ˌvɛtərəˈnɛriən] n. 兽医</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> veteri (老) + -arian (从事...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"老(veteri)"医生，专门照顾"动物(arian)"，
    <tspan x="50" dy="25">他就像一个经验丰富的兽医(veterinarian)，</tspan>
    <tspan x="50" dy="25">用他的智慧和爱心治愈每一只小动物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The veterinarian treated the dog's broken leg.
  </text>
  <text x="50" y="310" class="content">
    兽医治疗了狗的断腿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Veterinarian -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Animal -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="200" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Medical tools -->
    <rect x="150" y="80" width="30" height="100" class="image" />
    <rect x="160" y="80" width="10" height="100" class="image" />
    <rect x="170" y="80" width="30" height="100" class="image" />
  </g>
</svg>