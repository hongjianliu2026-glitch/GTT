<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sheltered</text>
  <text x="50" y="120" class="subtitle">[ˈʃeltəd] adj. 受保护的，遮蔽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shel (遮蔽) + -tered (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在屋檐下，"遮蔽(shel)"
    <tspan x="50" dy="25">在雨中，感到安全而受保护(sheltered)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was sheltered from the wind by tall trees.
  </text>
  <text x="50" y="310" class="content">
    花园被高大的树木遮蔽，免受风吹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Roof -->
    <polygon points="0,0 350,0 300,50 50,50" class="image" />
    <!-- Wall -->
    <rect x="50" y="50" width="250" height="150" class="image" />
    <!-- Child -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="180" x2="205" y2="170" class="image" />
  </g>
</svg>