<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #A04000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .copper { fill: #B87333; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">copper</text>
  <text x="50" y="120" class="subtitle">[ˈkɒpə(r)] n. 铜，铜币</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cupr- (铜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的矿工，"挖掘出(cupr-)"
    <tspan x="50" dy="25">闪闪发光的铜矿石，这些矿石最终被制成铜币(copper)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He found a copper coin in the old chest.
  </text>
  <text x="50" y="310" class="content">
    他在旧箱子里发现了一枚铜币。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Copper ore -->
    <rect x="0" y="0" width="150" height="150" class="copper" />
    <rect x="20" y="20" width="110" height="110" class="copper" />
    <rect x="40" y="40" width="70" height="70" class="copper" />
    <!-- Miner -->
    <circle cx="200" cy="75" r="20" class="image" />
    <line x1="200" y1="95" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="180" y2="160" class="image" />
    <line x1="200" y1="130" x2="220" y2="160" class="image" />
    <line x1="200" y1="110" x2="230" y2="100" class="image" />
    <!-- Copper coin -->
    <circle cx="280" cy="75" r="20" class="copper" />
    <text x="270" y="80" class="content" fill="#FFFFFF">COP</text>
  </g>
</svg>