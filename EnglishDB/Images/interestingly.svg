<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interestingly</text>
  <text x="50" y="120" class="subtitle">[ˌɪntrəˈstɪŋli] adv. 有趣地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + est (存在) + ing (形容词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在讨论一个话题，"在存在(est)的兴趣(inter-est)之间"，
    <tspan x="50" dy="25">这个话题变得有趣(interestingly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Interestingly, the results of the experiment were unexpected.
  </text>
  <text x="50" y="310" class="content">
    有趣的是，实验结果出乎意料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People discussing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <!-- Speech bubbles -->
    <path d="M50 70 Q30 50 50 30 Q70 50 50 70" class="image" />
    <path d="M150 70 Q130 50 150 30 Q170 50 150 70" class="image" />
    <path d="M250 70 Q230 50 250 30 Q270 50 250 70" class="image" />
    <!-- Interesting symbol -->
    <text x="150" y="150" class="highlight" font-size="48">?</text>
  </g>
</svg>