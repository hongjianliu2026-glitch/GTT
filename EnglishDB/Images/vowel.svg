<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vowel</text>
  <text x="50" y="120" class="subtitle">[ˈvaʊəl] n. 元音</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vow (声音) + el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小声音(vow-el)在唱歌，它的声音是如此纯净，
    <tspan x="50" dy="25">以至于它成为了语言中的元音(vowel)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The word "apple" contains two vowels: a and e.
  </text>
  <text x="50" y="310" class="content">
    单词"apple"包含两个元音：a和e。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sound wave -->
    <path d="M0,100 C50,50 150,50 200,100 C250,150 350,150 400,100" class="image" />
    <!-- Small voice -->
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Text label -->
    <text x="200" y="150" class="content" text-anchor="middle">小声音</text>
  </g>
</svg>