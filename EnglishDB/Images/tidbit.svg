<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tidbit</text>
  <text x="50" y="120" class="subtitle">[ˈtɪdˌbɪt] n. 小片，小部分；趣闻，花絮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tid (小) + bit (一点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子手里拿着一小块(tidbit)巧克力，
    <tspan x="50" dy="25">脸上洋溢着满足的笑容，这就是"小片(tidbit)"的快乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She shared a tidbit of gossip at the party.
  </text>
  <text x="50" y="310" class="content">
    她在派对上分享了一则趣闻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small piece of chocolate -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <!-- Child's face -->
    <circle cx="100" cy="35" r="20" class="image" />
    <!-- Smile -->
    <path d="M110,45 Q105,50 100,45" class="image" />
    <path d="M90,45 Q95,50 100,45" class="image" />
  </g>
</svg>