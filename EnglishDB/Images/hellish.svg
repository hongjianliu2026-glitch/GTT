<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hellish</text>
  <text x="50" y="120" class="subtitle">[ˈhɛlɪʃ] adj. 地狱般的，极恶劣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hell (地狱) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个地狱般的场景，"地狱(hell)"
    <tspan x="50" dy="25">中充满了火焰和痛苦，这就是"地狱般的(hellish)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The traffic jam was hellish; it took hours to get home.
  </text>
  <text x="50" y="310" class="content">
    交通堵塞非常糟糕，花了好几个小时才到家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hellish scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flames -->
    <line x1="50" y1="20" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="150" y2="20" class="image" />
    <line x1="150" y1="20" x2="200" y2="80" class="image" />
    <line x1="200" y1="80" x2="250" y2="20" class="image" />
    <line x1="250" y1="20" x2="300" y2="80" class="image" />
    <!-- Painful face -->
    <circle cx="175" cy="120" r="30" class="image" />
    <line x1="160" y1="110" x2="190" y2="110" class="image" />
    <line x1="160" y1="130" x2="190" y2="130" class="image" />
    <line x1="175" y1="140" x2="175" y2="160" class="image" />
    <line x1="165" y1="150" x2="185" y2="150" class="image" />
  </g>
</svg>