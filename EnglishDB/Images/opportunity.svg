<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">opportunity</text>
  <text x="50" y="120" class="subtitle">[ˌɒpəˈtjuːnɪti] n. 机会，时机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> op- (靠近) + port (门) + -unity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一扇门(port)突然打开，一个机会(opportunity)
    <tspan x="50" dy="25">靠近(op-)你，等待你抓住它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He saw an opportunity to start his own business.
  </text>
  <text x="50" y="310" class="content">
    他看到了一个创业的机会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="250" class="image" />
    <line x1="75" y1="0" x2="75" y2="250" class="image" />
    <!-- Handle -->
    <circle cx="130" cy="125" r="10" class="image" />
    <!-- Light from the door -->
    <line x1="150" y1="125" x2="300" y2="125" class="image" />
    <line x1="150" y1="125" x2="225" y2="75" class="image" />
    <line x1="150" y1="125" x2="225" y2="175" class="image" />
    <!-- Person reaching for the door -->
    <circle cx="350" cy="125" r="20" class="image" />
    <line x1="350" y1="145" x2="350" y2="200" class="image" />
    <line x1="350" y1="200" x2="320" y2="230" class="image" />
    <line x1="350" y1="200" x2="380" y2="230" class="image" />
    <line x1="350" y1="165" x2="300" y2="155" class="image" />
  </g>
</svg>