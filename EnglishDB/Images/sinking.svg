<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sinking</text>
  <text x="50" y="120" class="subtitle">[ˈsɪŋkɪŋ] v. 下沉，沉没</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sink (下沉) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船正在"下沉(sink)"，水不断涌入，船体逐渐消失在水面下。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship started sinking after hitting the iceberg.
  </text>
  <text x="50" y="310" class="content">
    船在撞上冰山后开始下沉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water surface -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#3498DB" />
    <!-- Sinking ship -->
    <rect x="150" y="100" width="50" height="50" class="image" fill="#D35400" />
    <rect x="140" y="150" width="70" height="50" class="image" fill="#D35400" />
    <rect x="130" y="200" width="90" height="50" class="image" fill="#D35400" />
    <!-- Water lines -->
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="250" x2="350" y2="250" class="image" />
  </g>
</svg>