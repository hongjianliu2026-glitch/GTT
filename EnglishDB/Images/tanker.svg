<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tanker</text>
  <text x="50" y="120" class="subtitle">[ˈtæŋkər] n. 油轮，坦克车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tank (坦克) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆巨大的油轮，"装满了(tank)"
    <tspan x="50" dy="25">石油，在海上航行，这就是油轮(tanker)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tanker was carrying millions of barrels of oil.
  </text>
  <text x="50" y="310" class="content">
    这艘油轮载着数百万桶石油。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tanker body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Tanker deck -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Tanker pipes -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <!-- Tanker water -->
    <rect x="0" y="150" width="350" height="50" class="image" />
  </g>
</svg>