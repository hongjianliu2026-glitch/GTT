<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compositional</text>
  <text x="50" y="120" class="subtitle">[ˌkɒmpəˈzɪʃənl] adj. 组成的，构成的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + posit (放置) + -ional (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在创作，"把各种元素(com-)"
    <tspan x="50" dy="25">放在一起(posit)"，形成一幅完整的画作，这就是"组成的(compositional)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The compositional elements of the painting are well balanced.
  </text>
  <text x="50" y="310" class="content">
    这幅画的构成元素非常平衡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Elements -->
    <circle cx="50" cy="100" r="20" class="image" />
    <rect x="100" y="80" width="40" height="40" class="image" />
    <line x1="180" y1="80" x2="220" y2="120" class="image" />
    <line x1="180" y1="120" x2="220" y2="80" class="image" />
    <polygon points="260,80 280,120 300,80" class="image" />
    <!-- Artist -->
    <circle cx="20" cy="180" r="15" class="image" />
    <line x1="20" y1="195" x2="20" y2="230" class="image" />
    <line x1="20" y1="230" x2="0" y2="260" class="image" />
    <line x1="20" y1="230" x2="40" y2="260" class="image" />
    <line x1="20" y1="210" x2="50" y2="200" class="image" />
  </g>
</svg>