<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hopeless</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊpləs] adj. 无望的，绝望的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hop (希望) + -less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"没有希望(hop-less)"，
    <tspan x="50" dy="25">面对着无尽的深渊，感到彻底的绝望。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The situation seemed hopeless, but they didn't give up.
  </text>
  <text x="50" y="310" class="content">
    情况看似无望，但他们没有放弃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Abyss -->
    <line x1="100" y1="200" x2="350" y2="200" class="image" />
    <line x1="100" y1="200" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="350" y2="150" class="image" />
  </g>
</svg>