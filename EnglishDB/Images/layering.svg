<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">layering</text>
  <text x="50" y="120" class="subtitle">[ˈleɪərɪŋ] n. 分层，层叠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lay (放置) + er (名词后缀) + ing (动名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个建筑工人，"一层一层地放置(lay-er-ing)"
    <tspan x="50" dy="25">砖块，这些砖块就构成了一个坚固的墙(layering)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The designer used layering to create depth in the image.
  </text>
  <text x="50" y="310" class="content">
    设计师使用分层技术在图像中创造了深度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Layers -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <rect x="20" y="60" width="310" height="50" class="image" />
    <rect x="40" y="120" width="270" height="50" class="image" />
    <rect x="60" y="180" width="230" height="50" class="image" />
    <rect x="80" y="240" width="190" height="50" class="image" />
    <!-- Worker -->
    <circle cx="20" cy="20" r="15" class="image" />
    <line x1="20" y1="35" x2="20" y2="70" class="image" />
    <line x1="20" y1="70" x2="0" y2="100" class="image" />
    <line x1="20" y1="70" x2="40" y2="100" class="image" />
    <line x1="20" y1="50" x2="50" y2="40" class="image" />
  </g>
</svg>