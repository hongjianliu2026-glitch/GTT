<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">next-door</text>
  <text x="50" y="120" class="subtitle">[ˈnɛkstˈdɔr] adj. 隔壁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> next (下一个) + door (门)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你站在一扇门前，"下一个门(next-door)"
    <tspan x="50" dy="25">就是你隔壁的邻居家。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My next-door neighbor is very friendly.
  </text>
  <text x="50" y="310" class="content">
    我的隔壁邻居非常友好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- House 1 -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="75" y1="0" x2="75" y2="100" class="image" />
    <line x1="0" y1="50" x2="150" y2="50" class="image" />
    <!-- Door -->
    <rect x="60" y="60" width="30" height="40" class="image" />
    <!-- House 2 (next-door) -->
    <rect x="160" y="0" width="150" height="100" class="image" />
    <line x1="235" y1="0" x2="235" y2="100" class="image" />
    <line x1="160" y1="50" x2="310" y2="50" class="image" />
    <!-- Door -->
    <rect x="220" y="60" width="30" height="40" class="image" />
    <!-- Arrow pointing to next-door -->
    <line x1="150" y1="50" x2="160" y2="50" class="image" />
    <polygon points="150,50 160,45 160,55" class="image" />
  </g>
</svg>