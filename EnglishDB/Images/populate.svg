<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">populate</text>
  <text x="50" y="120" class="subtitle">[ˈpɒpjuleɪt] v. 居住于，构成人口</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pop (人民) + -ulate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市，"人民(pop)"
    <tspan x="50" dy="25">像种子一样"生长(ulate)"，</tspan>
    <tspan x="50" dy="25">逐渐填满了整个城市，</tspan>
    <tspan x="50" dy="25">这就是"居住于(populate)"的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The island is populated by a diverse group of people.
  </text>
  <text x="50" y="330" class="content">
    这个岛屿居住着一群多样化的人群。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="30" height="100" class="image" />
    <rect x="100" y="40" width="30" height="80" class="image" />
    <rect x="150" y="60" width="30" height="60" class="image" />
    <rect x="200" y="80" width="30" height="40" class="image" />
    <rect x="250" y="100" width="30" height="20" class="image" />
    <!-- People -->
    <circle cx="70" cy="130" r="10" class="image" />
    <circle cx="120" cy="150" r="10" class="image" />
    <circle cx="170" cy="170" r="10" class="image" />
    <circle cx="220" cy="190" r="10" class="image" />
    <circle cx="270" cy="210" r="10" class="image" />
  </g>
</svg>