<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">newscast</text>
  <text x="50" y="120" class="subtitle">[ˈnjuːzˌkæst] n. 新闻广播</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> news (新闻) + cast (投射)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新闻主播站在镜头前，"投射(cast)"
    <tspan x="50" dy="25">最新的新闻(news)给观众，这就是新闻广播(newscast)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The newscast reported on the latest political developments.
  </text>
  <text x="50" y="310" class="content">
    新闻广播报道了最新的政治动态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- News anchor -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- News desk -->
    <rect x="0" y="200" width="150" height="50" class="image" />
    <!-- TV screen -->
    <rect x="180" y="50" width="200" height="150" class="image" />
    <!-- News ticker -->
    <line x1="190" y1="200" x2="370" y2="200" class="image" />
    <line x1="190" y1="210" x2="370" y2="210" class="image" />
    <line x1="190" y1="220" x2="370" y2="220" class="image" />
    <line x1="190" y1="230" x2="370" y2="230" class="image" />
  </g>
</svg>