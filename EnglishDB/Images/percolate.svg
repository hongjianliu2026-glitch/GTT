<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">percolate</text>
  <text x="50" y="120" class="subtitle">[ˈpɜːr.kə.leɪt] v. 渗透，过滤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (通过) + col (滤) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯咖啡，水"通过(per-)"咖啡粉"过滤(col)"，
    <tspan x="50" dy="25">慢慢渗透下来，形成一杯香浓的咖啡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The water slowly percolated through the coffee grounds.
  </text>
  <text x="50" y="310" class="content">
    水慢慢地通过咖啡粉渗透下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee cup -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Coffee grounds -->
    <rect x="20" y="20" width="160" height="30" class="image" />
    <!-- Water dripping -->
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
    <!-- Coffee liquid -->
    <rect x="20" y="120" width="160" height="30" class="image" />
  </g>
</svg>