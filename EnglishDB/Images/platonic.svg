<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">platonic</text>
  <text x="50" y="120" class="subtitle">[pləˈtɒnɪk] adj. 柏拉图式的，纯精神的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Plato (柏拉图) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象柏拉图(Plato)坐在一个巨大的书堆上，
    <tspan x="50" dy="25">周围环绕着抽象的哲学符号，象征着纯精神的(platonic)关系。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Their relationship was purely platonic.
  </text>
  <text x="50" y="310" class="content">
    他们的关系完全是柏拉图式的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plato sitting on books -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <!-- Books -->
    <rect x="70" y="50" width="50" height="30" class="image" />
    <rect x="130" y="50" width="50" height="30" class="image" />
    <rect x="190" y="50" width="50" height="30" class="image" />
    <rect x="70" y="90" width="50" height="30" class="image" />
    <rect x="130" y="90" width="50" height="30" class="image" />
    <rect x="190" y="90" width="50" height="30" class="image" />
    <!-- Abstract symbols -->
    <circle cx="280" cy="70" r="10" class="image" />
    <line x1="280" y1="80" x2="300" y2="100" class="image" />
    <line x1="280" y1="80" x2="260" y2="100" class="image" />
    <line x1="280" y1="80" x2="280" y2="100" class="image" />
  </g>
</svg>