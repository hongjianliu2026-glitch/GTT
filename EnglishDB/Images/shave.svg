<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shave</text>
  <text x="50" y="120" class="subtitle">[ʃeɪv] v. 剃，刮；n. 刮脸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shav (刮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着剃刀，"刮(shav)"
    <tspan x="50" dy="25">掉脸上的毛发，这就是剃(shave)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He shaved off his beard this morning.
  </text>
  <text x="50" y="310" class="content">
    他今天早上刮掉了胡子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Razor -->
    <rect x="150" y="70" width="100" height="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <!-- Beard -->
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <line x1="75" y1="130" x2="125" y2="130" class="image" />
    <line x1="80" y1="140" x2="120" y2="140" class="image" />
  </g>
</svg>