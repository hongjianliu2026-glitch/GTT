<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mutant</text>
  <text x="50" y="120" class="subtitle">[ˈmjuːtənt] n. 突变体，变种</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mut (改变) + -ant (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通人在实验室中，突然"改变(mut)"
    <tspan x="50" dy="25">成了一个拥有超能力的变种人(mutant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientist discovered a new mutant strain of bacteria.
  </text>
  <text x="50" y="310" class="content">
    科学家发现了一种新的突变细菌菌株。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Scientist -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Mutant -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="220" y2="210" class="image" />
    <line x1="250" y1="180" x2="280" y2="210" class="image" />
    <line x1="250" y1="150" x2="300" y2="140" class="image" />
    <!-- Lightning bolt -->
    <polyline points="150,100 200,50 250,100" class="image" />
    <polyline points="150,100 200,150 250,100" class="image" />
  </g>
</svg>