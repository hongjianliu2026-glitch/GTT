<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tubular</text>
  <text x="50" y="120" class="subtitle">[ˈtjuːbjələr] adj. 管状的，管式的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tub (管) + -ular (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的管子(tub)，它像一条巨龙一样蜿蜒曲折，
    <tspan x="50" dy="25">穿过整个城市，这就是"管状的(tubular)"景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new design features a tubular frame for better stability.
  </text>
  <text x="50" y="310" class="content">
    新设计采用了管状框架以提高稳定性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tubular shape -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <ellipse cx="175" cy="100" rx="140" ry="40" class="image" />
    <ellipse cx="175" cy="100" rx="130" ry="30" class="image" />
    <ellipse cx="175" cy="100" rx="120" ry="20" class="image" />
    <ellipse cx="175" cy="100" rx="110" ry="10" class="image" />
  </g>
</svg>