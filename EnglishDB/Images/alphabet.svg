<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alphabet</text>
  <text x="50" y="120" class="subtitle">[ˈælfəbɛt] n. 字母表</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alpha (希腊字母A) + beta (希腊字母B)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的字母表，"A(alpha)"和"B(beta)"
    <tspan x="50" dy="25">在前面，带领着其他字母，形成了一个完整的字母表(alphabet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She learned the alphabet in kindergarten.
  </text>
  <text x="50" y="310" class="content">
    她在幼儿园学会了字母表。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Alphabet letters -->
    <text x="50" y="50" class="image" font-size="48">A</text>
    <text x="100" y="50" class="image" font-size="48">B</text>
    <text x="150" y="50" class="image" font-size="48">C</text>
    <text x="200" y="50" class="image" font-size="48">D</text>
    <text x="250" y="50" class="image" font-size="48">E</text>
    <text x="300" y="50" class="image" font-size="48">F</text>
    <text x="350" y="50" class="image" font-size="48">G</text>
    <text x="400" y="50" class="image" font-size="48">H</text>
    <text x="450" y="50" class="image" font-size="48">I</text>
    <text x="500" y="50" class="image" font-size="48">J</text>
    <text x="550" y="50" class="image" font-size="48">K</text>
    <text x="600" y="50" class="image" font-size="48">L</text>
    <text x="650" y="50" class="image" font-size="48">M</text>
    <text x="700" y="50" class="image" font-size="48">N</text>
    <text x="750" y="50" class="image" font-size="48">O</text>
    <text x="800" y="50" class="image" font-size="48">P</text>
    <text x="850" y="50" class="image" font-size="48">Q</text>
    <text x="900" y="50" class="image" font-size="48">R</text>
    <text x="950" y="50" class="image" font-size="48">S</text>
    <text x="1000" y="50" class="image" font-size="48">T</text>
    <text x="1050" y="50" class="image" font-size="48">U</text>
    <text x="1100" y="50" class="image" font-size="48">V</text>
    <text x="1150" y="50" class="image" font-size="48">W</text>
    <text x="1200" y="50" class="image" font-size="48">X</text>
    <text x="1250" y="50" class="image" font-size="48">Y</text>
    <text x="1300" y="50" class="image" font-size="48">Z</text>
  </g>
</svg>