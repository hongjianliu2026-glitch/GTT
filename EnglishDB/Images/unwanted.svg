<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unwanted</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˈwɒntɪd] adj. 不需要的，不受欢迎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + want (想要) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的垃圾堆，里面堆满了"不想要的(un-wanted)"
    <tspan x="50" dy="25">东西，这些东西被人们无情地丢弃，因为它们毫无价值。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unwanted items were donated to charity.
  </text>
  <text x="50" y="310" class="content">
    这些不需要的物品被捐赠给了慈善机构。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trash pile -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trash items -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <line x1="180" y1="30" x2="220" y2="70" class="image" />
    <line x1="220" y1="70" x2="180" y2="110" class="image" />
    <line x1="180" y1="110" x2="140" y2="70" class="image" />
    <line x1="140" y1="70" x2="180" y2="30" class="image" />
    <!-- Person throwing away -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="350" y2="120" class="image" />
    <line x1="300" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>