<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meditation</text>
  <text x="50" y="120" class="subtitle">[ˌmɛdɪˈteɪʃən] n. 冥想，沉思</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medit- (思考) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在莲花上，闭着眼睛，"深入思考(medit-)"
    <tspan x="50" dy="25">内心世界，这就是冥想(meditation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She practices meditation to calm her mind.
  </text>
  <text x="50" y="310" class="content">
    她通过冥想来平静心灵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lotus flower -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="120" cy="80" r="20" class="image" />
    <circle cx="80" cy="80" r="20" class="image" />
    <circle cx="100" cy="60" r="20" class="image" />
    <!-- Person sitting -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="70" y2="170" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Eyes closed -->
    <line x1="90" y1="145" x2="110" y2="145" class="image" />
  </g>
</svg>