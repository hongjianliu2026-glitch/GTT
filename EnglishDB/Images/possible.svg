<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">possible</text>
  <text x="50" y="120" class="subtitle">[ˈpɒsəbl] adj. 可能的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pos (能力) + -ible (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的"能力(pos)"球上，
    <tspan x="50" dy="25">他能够(ible)保持平衡，这就是"可能的(possible)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It is possible to achieve this goal with hard work.
  </text>
  <text x="50" y="310" class="content">
    通过努力工作，这个目标是可以实现的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,220)">
    <!-- Ability ball -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Person on the ball -->
    <circle cx="100" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="130" y2="70" class="image" />
  </g>
</svg>