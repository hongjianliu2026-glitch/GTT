<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">euro</text>
  <text x="50" y="120" class="subtitle">[ˈjʊroʊ] n. 欧元</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eur- (欧洲) + -o (表示货币单位)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的欧元符号(€)从欧洲大陆升起，
    <tspan x="50" dy="25">象征着欧洲的统一货币(euro)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He exchanged his dollars for euros before his trip to Europe.
  </text>
  <text x="50" y="310" class="content">
    他在去欧洲旅行前把美元换成了欧元。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Euro symbol -->
    <path d="M0 0 L50 0 L50 50 L0 50 Z" class="image" />
    <path d="M25 10 L35 25 L25 40 L15 25 Z" class="image" />
    <!-- European map -->
    <path d="M0 0 L100 0 L100 50 L0 50 Z" class="image" />
    <path d="M10 10 L90 10 L90 40 L10 40 Z" class="image" />
    <path d="M20 20 L80 20 L80 30 L20 30 Z" class="image" />
    <path d="M30 15 L70 15 L70 35 L30 35 Z" class="image" />
    <path d="M40 10 L60 10 L60 40 L40 40 Z" class="image" />
  </g>
</svg>