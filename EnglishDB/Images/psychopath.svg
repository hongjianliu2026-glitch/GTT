<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psychopath</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪkəˌpæθ] n. 精神病患者，冷血杀手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psyche (心灵) + path (疾病)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心灵(psyche)被疾病(path)侵蚀的人，
    <tspan x="50" dy="25">他失去了正常的情感和道德，变成了一个冷血杀手(psychopath)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective suspected the suspect was a psychopath.
  </text>
  <text x="50" y="310" class="content">
    侦探怀疑嫌疑人是个精神病患者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain with a cross -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="60" y1="100" x2="140" y2="100" class="image" />
    <line x1="100" y1="60" x2="100" y2="140" class="image" />
    <!-- Evil face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <path d="M 80 120 Q 100 140 120 120" class="image" />
  </g>
</svg>