<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">circle</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrkl] n. 圆圈，循环；v. 环绕，盘旋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> circ (圆) + -le (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个圆圈(circle)，它象征着完美和无限，
    <tspan x="50" dy="25">就像一个循环(cycle)，不断重复，永不停歇。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She drew a circle around the spot where the treasure was buried.
  </text>
  <text x="50" y="310" class="content">
    她在埋藏宝藏的地方画了一个圆圈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="160" class="image" />
    <line x1="100" y1="180" x2="120" y2="160" class="image" />
    <!-- Text -->
    <text x="100" y="220" class="content" text-anchor="middle">圆圈</text>
  </g>
</svg>