<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">latex</text>
  <text x="50" y="120" class="subtitle">[ˈleɪteks] n. 乳胶，橡胶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> latex (源自拉丁语，意为“乳汁”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵橡胶树，树干上流出白色的“乳汁(latex)”，
    <tspan x="50" dy="25">这些乳汁凝固后变成了弹性十足的橡胶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gloves are made of latex for better grip.
  </text>
  <text x="50" y="310" class="content">
    这些手套是用乳胶制成的，以获得更好的抓握力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rubber tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="180" x2="50" y2="20" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <!-- Latex flow -->
    <line x1="75" y1="50" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="125" y2="150" class="image" />
    <line x1="125" y1="150" x2="125" y2="50" class="image" />
    <line x1="125" y1="50" x2="75" y2="50" class="image" />
    <!-- Rubber -->
    <rect x="150" y="100" width="100" height="50" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
  </g>
</svg>