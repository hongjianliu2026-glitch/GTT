<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">patio</text>
  <text x="50" y="120" class="subtitle">[ˈpætiˌoʊ] n. 露台，庭院</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pat (踏) + -io (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宽敞的庭院(patio)，人们可以在上面"踏步(pat)"，
    <tspan x="50" dy="25">享受户外的美好时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had a barbecue on the patio last weekend.
  </text>
  <text x="50" y="310" class="content">
    我们上周末在露台上烧烤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Patio -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />

    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />

    <!-- Table and chairs -->
    <rect x="100" y="120" width="100" height="30" class="image" />
    <line x1="110" y1="120" x2="110" y2="150" class="image" />
    <line x1="190" y1="120" x2="190" y2="150" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
  </g>
</svg>