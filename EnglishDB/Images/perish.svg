<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perish</text>
  <text x="50" y="120" class="subtitle">[ˈpɛrɪʃ] v. 死亡，毁灭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + ish (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个生命体"完全走到了尽头(per-ish)"，
    <tspan x="50" dy="25">最终走向了死亡(perish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many people perished in the flood.
  </text>
  <text x="50" y="310" class="content">
    许多人在洪水中丧生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tombstone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cross on tombstone -->
    <line x1="175" y1="40" x2="175" y2="140" class="image" />
    <line x1="125" y1="90" x2="225" y2="90" class="image" />
    <!-- Flowers -->
    <circle cx="100" cy="180" r="15" class="image" />
    <circle cx="120" cy="180" r="15" class="image" />
    <circle cx="140" cy="180" r="15" class="image" />
    <circle cx="160" cy="180" r="15" class="image" />
    <circle cx="180" cy="180" r="15" class="image" />
    <circle cx="200" cy="180" r="15" class="image" />
    <circle cx="220" cy="180" r="15" class="image" />
    <circle cx="240" cy="180" r="15" class="image" />
    <circle cx="260" cy="180" r="15" class="image" />
  </g>
</svg>