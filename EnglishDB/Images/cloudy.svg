<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cloud { fill: #BDC3C7; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cloudy</text>
  <text x="50" y="120" class="subtitle">[ˈklaʊdi] adj. 多云的，阴天的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cloud (云) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象天空被大片的云朵覆盖，"云(cloud)"
    <tspan x="50" dy="25">朵密布，天空变得阴沉，这就是多云的(cloudy)天气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was a cloudy day, perfect for staying indoors.
  </text>
  <text x="50" y="310" class="content">
    那是一个多云的日子，很适合待在室内。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clouds -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="cloud" />
    <ellipse cx="150" cy="120" rx="60" ry="40" class="cloud" />
    <ellipse cx="50" cy="120" rx="70" ry="45" class="cloud" />
    <ellipse cx="200" cy="100" rx="50" ry="35" class="cloud" />
    <!-- Sun partially hidden -->
    <circle cx="250" cy="50" r="30" fill="#F39C12" />
    <line x1="250" y1="20" x2="250" y2="0" class="image" />
    <line x1="280" y1="50" x2="300" y2="50" class="image" />
    <line x1="220" y1="50" x2="200" y2="50" class="image" />
    <line x1="250" y1="80" x2="250" y2="100" class="image" />
  </g>
</svg>