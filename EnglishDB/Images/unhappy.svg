<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unhappy</text>
  <text x="50" y="120" class="subtitle">[ʌnˈhæpi] adj. 不快乐的，不幸福的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定前缀) + happy (快乐的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人脸上挂着"不(un-)"笑容，
    <tspan x="50" dy="25">他的心情显然是"不快乐(unhappy)"的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt unhappy after hearing the bad news.
  </text>
  <text x="50" y="310" class="content">
    听到坏消息后，她感到不快乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Sad mouth -->
    <path d="M 80 120 Q 100 140 120 120" class="image" />
  </g>
</svg>