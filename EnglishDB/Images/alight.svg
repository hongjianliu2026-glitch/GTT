<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alight</text>
  <text x="50" y="120" class="subtitle">[əˈlaɪt] v. 下车，降落；adj. 点亮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + light (光，轻)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机在夜空中"加强光亮(a-light)"，
    <tspan x="50" dy="25">缓缓降落，乘客们纷纷下车(alight)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The passengers alighted from the plane after a long flight.
  </text>
  <text x="50" y="310" class="content">
    经过长途飞行后，乘客们从飞机上下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plane -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <line x1="200" y1="0" x2="180" y2="20" class="image" />
    <line x1="200" y1="0" x2="180" y2="-20" class="image" />
    <line x1="100" y1="0" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="80" y2="40" class="image" />
    <line x1="100" y1="20" x2="120" y2="40" class="image" />
    <!-- Light -->
    <circle cx="100" cy="0" r="10" class="image" />
    <!-- Passengers -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="90" cy="50" r="10" class="image" />
  </g>
</svg>