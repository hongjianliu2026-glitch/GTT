<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">justifiably</text>
  <text x="50" y="120" class="subtitle">[dʒʌˈstɪfaɪəbli] adv. 有理由地，无可非议地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> just (正义) + -i- + fy (使) + -able (能够) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，"正义地(just)"
    <tspan x="50" dy="25">使(fy)某人能够(able)被理解(ly)，</tspan>
    <tspan x="50" dy="25">这就是有理由地(justifiably)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was justifiably angry after being treated unfairly.
  </text>
  <text x="50" y="310" class="content">
    在被不公平对待后，他有理由感到愤怒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Gavel -->
    <rect x="10" y="180" width="20" height="40" class="image" />
    <line x1="20" y1="220" x2="20" y2="240" class="image" />
    <!-- Scales -->
    <line x1="50" y1="100" x2="70" y2="100" class="image" />
    <line x1="60" y1="100" x2="60" y2="140" class="image" />
    <line x1="50" y1="140" x2="70" y2="140" class="image" />
    <line x1="55" y1="140" x2="55" y2="160" class="image" />
    <line x1="65" y1="140" x2="65" y2="160" class="image" />
  </g>
</svg>