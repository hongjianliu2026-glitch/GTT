<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sympathetic</text>
  <text x="50" y="120" class="subtitle">[ˌsɪmpəˈθetɪk] adj. 同情的，有同情心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sym- (共同) + path (感情) + -etic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在安慰另一个人，"共同感受(sym-path)"
    <tspan x="50" dy="25">对方的痛苦，表现出同情心(sympathetic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was very sympathetic when I told her about my loss.
  </text>
  <text x="50" y="310" class="content">
    当我告诉她我的损失时，她非常同情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 C50,25 90,25 90,50 S130,75 130,50" class="image" />
    <!-- Two people -->
    <circle cx="70" cy="100" r="15" class="image" />
    <line x1="70" y1="115" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="55" y2="180" class="image" />
    <line x1="70" y1="150" x2="85" y2="180" class="image" />
    <line x1="70" y1="130" x2="100" y2="120" class="image" />

    <circle cx="110" cy="100" r="15" class="image" />
    <line x1="110" y1="115" x2="110" y2="150" class="image" />
    <line x1="110" y1="150" x2="95" y2="180" class="image" />
    <line x1="110" y1="150" x2="125" y2="180" class="image" />
    <line x1="110" y1="130" x2="140" y2="120" class="image" />

    <!-- Connection between two people -->
    <line x1="70" y1="120" x2="110" y2="120" class="image" />
  </g>
</svg>