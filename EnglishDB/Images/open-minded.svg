<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">open-minded</text>
  <text x="50" y="120" class="subtitle">[ˈoʊpənˈmaɪndɪd] adj. 思想开明的，愿意接受新思想的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> open (打开) + mind (思想) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人，他的思想像一扇敞开的大门，
    <tspan x="50" dy="25">随时准备接纳新的观点和想法。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very open-minded and willing to try new things.
  </text>
  <text x="50" y="310" class="content">
    她非常思想开明，愿意尝试新事物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Open door -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="75" y1="0" x2="75" y2="200" class="image" />
    <!-- Mind symbol -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <line x1="200" y1="150" x2="150" y2="180" class="image" />
    <line x1="200" y1="150" x2="250" y2="180" class="image" />
  </g>
</svg>