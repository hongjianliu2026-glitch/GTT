<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">essentially</text>
  <text x="50" y="120" class="subtitle">[ɪˈsɛnʃəli] adv. 本质上，基本上</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> essen (本质) + -tial (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水晶球，里面装满了"本质(essen)"，
    <tspan x="50" dy="25">当你透过它看世界，一切都被简化为最基本的形式，</tspan>
    <tspan x="50" dy="25">这就是"本质上(essentially)"的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is essentially a kind person, despite her occasional outbursts.
  </text>
  <text x="50" y="310" class="content">
    尽管她偶尔会发脾气，但她本质上是个善良的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Crystal ball -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Reflections inside the ball -->
    <circle cx="120" cy="130" r="10" class="image" />
    <circle cx="180" cy="170" r="15" class="image" />
    <circle cx="140" cy="180" r="8" class="image" />
    <!-- Person looking into the ball -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="250" class="image" />
    <line x1="50" y1="220" x2="70" y2="250" class="image" />
    <line x1="50" y1="190" x2="80" y2="180" class="image" />
  </g>
</svg>