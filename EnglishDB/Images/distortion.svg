<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">distortion</text>
  <text x="50" y="120" class="subtitle">[dɪˈstɔːrʃn] n. 扭曲，变形</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + tort (扭曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张照片被"分开并扭曲(dis-tort)"，
    <tspan x="50" dy="25">结果变得面目全非，这就是distortion。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The distortion of the image made it unrecognizable.
  </text>
  <text x="50" y="310" class="content">
    图像的扭曲使其变得无法辨认。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Original image -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <text x="100" y="80" text-anchor="middle" class="content">Original</text>
    <!-- Distorted image -->
    <rect x="250" y="0" width="200" height="150" class="image" transform="skewX(20)" />
    <text x="350" y="80" text-anchor="middle" class="content">Distorted</text>
  </g>
</svg>