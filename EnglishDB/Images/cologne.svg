<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cologne</text>
  <text x="50" y="120" class="subtitle">[kəˈloʊn] n. 古龙水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cologne (源自德国城市科隆)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅行者在德国科隆(Cologne)的街头，
    <tspan x="50" dy="25">闻到了一种独特的香味，这就是古龙水(cologne)的诞生地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He splashed some cologne on before the date.
  </text>
  <text x="50" y="310" class="content">
    他在约会前喷了些古龙水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cologne bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="30" class="image" />
    <!-- Cologne liquid -->
    <rect x="10" y="20" width="80" height="160" class="image" fill="#85C1E9" />
    <!-- Cologne city -->
    <rect x="120" y="100" width="150" height="100" class="image" />
    <line x1="130" y1="110" x2="130" y2="200" class="image" />
    <line x1="150" y1="110" x2="150" y2="200" class="image" />
    <line x1="170" y1="110" x2="170" y2="200" class="image" />
    <line x1="190" y1="110" x2="190" y2="200" class="image" />
    <line x1="210" y1="110" x2="210" y2="200" class="image" />
    <line x1="230" y1="110" x2="230" y2="200" class="image" />
    <!-- Traveler -->
    <circle cx="300" cy="150" r="15" class="image" />
    <line x1="300" y1="165" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="280" y2="230" class="image" />
    <line x1="300" y1="200" x2="320" y2="230" class="image" />
    <line x1="300" y1="180" x2="330" y2="170" class="image" />
  </g>
</svg>