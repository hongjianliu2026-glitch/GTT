<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sterling</text>
  <text x="50" y="120" class="subtitle">[ˈstɜːrlɪŋ] adj. 纯银的，优秀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ster- (星) + ling (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗闪耀的星星(ster-)，它虽然小(ling)，
    <tspan x="50" dy="25">但光芒四射，象征着纯银(sterling)的珍贵和优秀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sterling silverware was passed down through generations.
  </text>
  <text x="50" y="310" class="content">
    这套纯银餐具代代相传。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="0,50 20,0 40,50 0,30 40,30" class="image" />
    <!-- Small star -->
    <polygon points="20,40 25,30 30,40 20,35 30,35" class="image" />
    <!-- Silverware -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <rect x="60" y="30" width="80" height="30" class="image" />
  </g>
</svg>