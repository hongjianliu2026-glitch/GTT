<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">matching</text>
  <text x="50" y="120" class="subtitle">[ˈmætʃɪŋ] adj. 匹配的，相配的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> match (匹配) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两双鞋子，一双是左脚，一双是右脚，它们完美地"匹配(match)"在一起，
    <tspan x="50" dy="25">就像一对完美的搭档，这就是"匹配的(matching)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shoes are a perfect matching pair.
  </text>
  <text x="50" y="310" class="content">
    这双鞋子是完美匹配的一对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Left shoe -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <text x="90" y="120" class="content">左脚</text>

    <!-- Right shoe -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <line x1="200" y1="50" x2="300" y2="50" class="image" />
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <line x1="300" y1="50" x2="300" y2="100" class="image" />
    <text x="240" y="120" class="content">右脚</text>

    <!-- Matching line -->
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <text x="175" y="170" class="content">匹配</text>
  </g>
</svg>