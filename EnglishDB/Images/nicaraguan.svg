<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Nicaraguan</text>
  <text x="50" y="120" class="subtitle">[ˌnɪkəˈrɑːɡjuən] adj. 尼加拉瓜的；n. 尼加拉瓜人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Nicarao (尼加拉瓜原住民部落) + -ian (表示“属于...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个尼加拉瓜人站在尼加拉瓜湖边，"尼加拉瓜(Nicarao)"
    <tspan x="50" dy="25">的湖水波光粼粼，这个人就是尼加拉瓜人(Nicaraguan)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Nicaraguan government has implemented new policies.
  </text>
  <text x="50" y="310" class="content">
    尼加拉瓜政府实施了新政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="80" class="image" />
    <line x1="240" y1="60" x2="230" y2="70" class="image" />
    <line x1="260" y1="60" x2="270" y2="70" class="image" />
    <line x1="230" y1="50" x2="220" y2="60" class="image" />
    <line x1="270" y1="50" x2="280" y2="60" class="image" />
  </g>
</svg>