<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">circular</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrkjələr] adj. 圆形的，循环的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> circ (圆) + -ular (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆形时钟，"圆(circ)"
    <tspan x="50" dy="25">形的指针不停地转动，形成了一个循环(circular)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The circular motion of the wheel keeps the car moving.
  </text>
  <text x="50" y="310" class="content">
    车轮的圆形运动使汽车保持前进。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Clock center -->
    <circle cx="175" cy="100" r="5" class="image" />
  </g>
</svg>