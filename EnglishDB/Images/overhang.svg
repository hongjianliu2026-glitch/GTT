<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overhang</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈhæŋ] v. 悬垂，突出；n. 悬垂物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + hang (悬挂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树的树枝"悬挂在(over-hang)"
    <tspan x="50" dy="25">上方，形成了一个巨大的悬垂物(overhang)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cliff's overhang made the climb extremely dangerous.
  </text>
  <text x="50" y="310" class="content">
    悬崖的悬垂部分使得攀爬变得极其危险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="100" y="0" width="50" height="200" class="image" />
    <!-- Tree branch -->
    <line x1="125" y1="50" x2="250" y2="50" class="image" />
    <!-- Overhanging part -->
    <line x1="250" y1="50" x2="300" y2="100" class="image" />
    <!-- Leaves -->
    <circle cx="275" cy="75" r="10" class="image" />
    <circle cx="285" cy="85" r="10" class="image" />
    <circle cx="295" cy="95" r="10" class="image" />
  </g>
</svg>