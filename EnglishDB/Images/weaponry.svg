<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weaponry</text>
  <text x="50" y="120" class="subtitle">[ˈwepənrɪ] n. 武器，兵器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> weap (武器) + -on (表示工具) + -ry (表示集合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的武器库，里面堆满了各种"武器(weap-on)"，
    <tspan x="50" dy="25">这些武器集合在一起，构成了一个"武器库(weaponry)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The museum displayed a vast collection of ancient weaponry.
  </text>
  <text x="50" y="310" class="content">
    博物馆展示了一系列古代武器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Weapon rack -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Swords -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Handles -->
    <circle cx="50" cy="190" r="10" class="image" />
    <circle cx="100" cy="190" r="10" class="image" />
    <circle cx="150" cy="190" r="10" class="image" />
    <circle cx="200" cy="190" r="10" class="image" />
    <circle cx="250" cy="190" r="10" class="image" />
  </g>
</svg>