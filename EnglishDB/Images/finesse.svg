<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">finesse</text>
  <text x="50" y="120" class="subtitle">[fɪˈnes] n. 技巧，策略；v. 巧妙处理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fin (结束) + esse (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在表演结束时，"巧妙地存在(fin-esse)"
    <tspan x="50" dy="25">于观众的掌声中，展现了他的高超技巧(finesse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used her finesse to negotiate a better deal.
  </text>
  <text x="50" y="310" class="content">
    她运用她的技巧谈判了一个更好的交易。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Hat -->
    <rect x="0" y="80" width="40" height="20" class="image" />
    <!-- Wand -->
    <line x1="20" y1="150" x2="60" y2="110" class="image" />
    <!-- Audience -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
    <!-- Applause -->
    <line x1="100" y1="120" x2="100" y2="140" class="image" />
    <line x1="120" y1="120" x2="120" y2="140" class="image" />
    <line x1="140" y1="120" x2="140" y2="140" class="image" />
  </g>
</svg>