<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dwindle</text>
  <text x="50" y="120" class="subtitle">[ˈdwɪndl] v. 逐渐减少，缩小</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dwin (双) + dle (减少)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"双倍减少(dwin-dle)"
    <tspan x="50" dy="25">体积，直到它变得非常小，最终消失。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The number of participants dwindled over time.
  </text>
  <text x="50" y="310" class="content">
    随着时间的推移，参与者的数量逐渐减少。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large balloon -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Medium balloon -->
    <circle cx="250" cy="100" r="50" class="image" />
    <!-- Small balloon -->
    <circle cx="400" cy="100" r="20" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="200" x2="400" y2="200" class="image" />
    <polygon points="400,200 380,190 380,210" class="image" />
  </g>
</svg>