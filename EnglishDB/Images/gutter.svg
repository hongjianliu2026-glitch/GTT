<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gutter</text>
  <text x="50" y="120" class="subtitle">[ˈɡʌtər] n. 排水沟，贫民区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gut (肠) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个排水沟(gutter)，它的形状像一条长长的肠子(gut)，
    <tspan x="50" dy="25">里面充满了各种污物，就像贫民区的生活一样混乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leaves clogged the gutter and caused water to overflow.
  </text>
  <text x="50" y="310" class="content">
    树叶堵塞了排水沟，导致水溢出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gutter -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Water -->
    <rect x="10" y="10" width="330" height="30" fill="#3498DB" />
    <!-- Leaves -->
    <circle cx="50" cy="25" r="10" fill="#2ECC71" />
    <circle cx="100" cy="25" r="10" fill="#2ECC71" />
    <circle cx="150" cy="25" r="10" fill="#2ECC71" />
    <circle cx="200" cy="25" r="10" fill="#2ECC71" />
    <circle cx="250" cy="25" r="10" fill="#2ECC71" />
    <circle cx="300" cy="25" r="10" fill="#2ECC71" />
  </g>
</svg>