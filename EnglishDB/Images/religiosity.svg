<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">religiosity</text>
  <text x="50" y="120" class="subtitle">[rɪˌlɪdʒiˈɒsəti] n. 宗教虔诚，宗教狂热</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> relig (宗教) + -iosity (名词后缀，表示状态或性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个极度虔诚的信徒，"宗教(relig)"
    <tspan x="50" dy="25">狂热(iosity)到每天都在祈祷，甚至走路都在念经。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His religiosity made him a devoted follower of the church.
  </text>
  <text x="50" y="310" class="content">
    他的宗教虔诚使他成为教会的忠实信徒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Prayer person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Prayer book -->
    <rect x="30" y="70" width="40" height="20" class="image" />
    <!-- Cross -->
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="85" y1="100" x2="115" y2="100" class="image" />
  </g>
</svg>