<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skew</text>
  <text x="50" y="120" class="subtitle">[skjuː] v. 歪斜，扭曲；n. 歪斜，偏差</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (表示加强) + kew (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根原本笔直的木棍，被"加强弯曲(s-kew)"
    <tspan x="50" dy="25">成了一个歪斜的形状，这就是skew的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The data was skewed due to a technical error.
  </text>
  <text x="50" y="310" class="content">
    由于技术错误，数据出现了偏差。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Straight line -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Skewed line -->
    <line x1="50" y1="100" x2="300" y2="150" class="image" />
    <!-- Arrow indicating skew -->
    <polygon points="300,150 280,140 280,160" class="image" />
    <!-- Text annotation -->
    <text x="310" y="150" class="content" text-anchor="start">skew</text>
  </g>
</svg>