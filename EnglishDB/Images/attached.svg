<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">attached</text>
  <text x="50" y="120" class="subtitle">[əˈtætʃt] adj. 附着的，连接的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> at- (向) + tach (钉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个钉子"向(at-)"某个物体"钉(tach)"去，
    <tspan x="50" dy="25">这个物体就被"附着(attached)"在了另一个物体上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The key is attached to a small keyring.
  </text>
  <text x="50" y="310" class="content">
    钥匙附着在一个小钥匙圈上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nail -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="40" y1="150" x2="60" y2="150" class="image" />
    <!-- Object 1 -->
    <rect x="100" y="50" width="100" height="50" class="image" />
    <!-- Object 2 -->
    <rect x="250" y="50" width="100" height="50" class="image" />
    <!-- Attachment -->
    <line x1="150" y1="75" x2="250" y2="75" class="image" />
  </g>
</svg>