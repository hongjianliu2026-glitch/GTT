<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Trojan</text>
  <text x="50" y="120" class="subtitle">[ˈtroʊdʒən] n. 特洛伊木马</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自特洛伊战争中的“特洛伊木马”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的木马，外表看似无害，
    <tspan x="50" dy="25">但内部却隐藏着敌军士兵，一旦进入城内，</tspan>
    <tspan x="50" dy="25">就会突然袭击，这就是特洛伊木马(Trojan)的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The antivirus software detected a Trojan in the system.
  </text>
  <text x="50" y="310" class="content">
    杀毒软件检测到系统中有一个特洛伊木马。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Wooden horse -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <circle cx="100" cy="150" r="50" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <line x1="75" y1="250" x2="125" y2="250" class="image" />
    <line x1="100" y1="300" x2="100" y2="350" class="image" />
    <line x1="100" y1="350" x2="50" y2="400" class="image" />
    <line x1="100" y1="350" x2="150" y2="400" class="image" />
    <!-- Hidden soldiers -->
    <circle cx="30" cy="250" r="10" class="image" />
    <circle cx="170" cy="250" r="10" class="image" />
    <line x1="30" y1="260" x2="30" y2="280" class="image" />
    <line x1="170" y1="260" x2="170" y2="280" class="image" />
  </g>
</svg>