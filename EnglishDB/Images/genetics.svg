<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">genetics</text>
  <text x="50" y="120" class="subtitle">[dʒəˈnetɪks] n. 遗传学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen- (出生) + -etics (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"研究出生(gen-etics)"
    <tspan x="50" dy="25">的奥秘，这些奥秘就构成了遗传学(genetics)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He studied genetics to understand the inheritance of traits.
  </text>
  <text x="50" y="310" class="content">
    他研究遗传学以理解性状的遗传。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- DNA double helix -->
    <path d="M50 50 C 100 0, 150 0, 200 50" class="image" />
    <path d="M50 100 C 100 150, 150 150, 200 100" class="image" />
    <path d="M50 50 L 50 100" class="image" />
    <path d="M200 50 L 200 100" class="image" />
    <!-- Scientist -->
    <circle cx="125" cy="175" r="20" class="image" />
    <line x1="125" y1="195" x2="125" y2="230" class="image" />
    <line x1="125" y1="230" x2="105" y2="260" class="image" />
    <line x1="125" y1="230" x2="145" y2="260" class="image" />
    <line x1="125" y1="210" x2="160" y2="200" class="image" />
  </g>
</svg>