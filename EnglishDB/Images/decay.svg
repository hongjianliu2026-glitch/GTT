<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decay</text>
  <text x="50" y="120" class="subtitle">[dɪˈkeɪ] v. 腐烂，衰退；n. 腐朽，衰败</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + cay (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苹果从树上"落下(cay)"，
    <tspan x="50" dy="25">然后"向下(de-)"腐烂，最终变成了一堆腐朽的果泥。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fruit began to decay after a few days.
  </text>
  <text x="50" y="310" class="content">
    几天后，水果开始腐烂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="50" y1="50" x2="20" y2="100" class="image" />
    <line x1="50" y1="50" x2="80" y2="100" class="image" />
    <line x1="50" y1="50" x2="30" y2="70" class="image" />
    <line x1="50" y1="50" x2="70" y2="70" class="image" />
    <!-- Falling apple -->
    <circle cx="50" cy="160" r="20" class="image" />
    <line x1="50" y1="160" x2="50" y2="200" class="image" />
    <!-- Decayed apple -->
    <circle cx="50" cy="220" r="20" class="image" fill="#8B4513" />
    <line x1="50" y1="220" x2="50" y2="240" class="image" />
    <line x1="40" y1="230" x2="60" y2="230" class="image" />
    <line x1="45" y1="235" x2="55" y2="235" class="image" />
  </g>
</svg>