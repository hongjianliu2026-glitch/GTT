<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rival</text>
  <text x="50" y="120" class="subtitle">[ˈraɪvl] n. 对手，竞争者；v. 竞争，对抗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> riv (河) + -al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两条河流(riv)在争夺同一水源，它们互相竞争(rival)，
    <tspan x="50" dy="25">都想成为主导的那一条。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a fierce rival in the business world.
  </text>
  <text x="50" y="310" class="content">
    她在商界是一个强劲的对手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River 1 -->
    <path d="M0 100 Q100 50, 200 100 T400 100" class="image" />
    <!-- River 2 -->
    <path d="M0 150 Q100 200, 200 150 T400 150" class="image" />
    <!-- Rivals -->
    <circle cx="150" cy="80" r="15" class="image" />
    <circle cx="150" cy="170" r="15" class="image" />
    <!-- Competition -->
    <line x1="150" y1="80" x2="150" y2="170" class="image" />
  </g>
</svg>