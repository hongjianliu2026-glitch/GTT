<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outfitter</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtfɪtər] n. 装备商，服装商</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外) + fit (适合) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装备商站在店外，"为顾客提供适合(fit)的装备(out-fit)"，
    <tspan x="50" dy="25">这些装备让他们看起来非常合适(outfitter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He went to the outfitter to buy a new hiking outfit.
  </text>
  <text x="50" y="310" class="content">
    他去装备商那里买了一套新的徒步装备。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Storefront -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sign -->
    <text x="150" y="30" class="title" style="font-size: 36px;">Outfitter</text>
    <!-- Clothing rack -->
    <line x1="50" y1="50" x2="50" y2="180" class="image" />
    <line x1="100" y1="50" x2="100" y2="180" class="image" />
    <line x1="150" y1="50" x2="150" y2="180" class="image" />
    <line x1="200" y1="50" x2="200" y2="180" class="image" />
    <!-- Clothes -->
    <rect x="50" y="60" width="50" height="30" class="image" />
    <rect x="100" y="70" width="50" height="30" class="image" />
    <rect x="150" y="80" width="50" height="30" class="image" />
    <rect x="200" y="90" width="50" height="30" class="image" />
    <!-- Outfitter -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>