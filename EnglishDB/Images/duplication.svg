<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">duplication</text>
  <text x="50" y="120" class="subtitle">[ˌduːplɪˈkeɪʃn] n. 复制，重复</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> du- (二) + plic (折叠) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个文件被"折叠(plic)"成两份，
    <tspan x="50" dy="25">一份放在左边，一份放在右边，这就是"复制(duplication)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The duplication of the document was necessary for the project.
  </text>
  <text x="50" y="310" class="content">
    复制这份文件对项目来说是必要的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Left file -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Right file -->
    <rect x="200" y="0" width="150" height="200" class="image" />
    <!-- Fold line -->
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <!-- Fold symbol -->
    <text x="140" y="100" class="image" transform="rotate(-90 140 100)" font-size="30">↔</text>
  </g>
</svg>