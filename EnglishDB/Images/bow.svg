<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bow</text>
  <text x="50" y="120" class="subtitle">[baʊ] n. 弓，鞠躬；v. 鞠躬，屈服</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bow (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在鞠躬，身体"弯曲(bow)"成一个优雅的弧形，
    <tspan x="50" dy="25">这个动作就像拉弓一样，充满了力量和美感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bowed deeply to show his respect.
  </text>
  <text x="50" y="310" class="content">
    他深深地鞠躬以示敬意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bow -->
    <path d="M 0 100 Q 100 0 200 100" class="image" />
    <!-- Person bowing -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="220" class="image" />
    <line x1="100" y1="200" x2="150" y2="220" class="image" />
  </g>
</svg>