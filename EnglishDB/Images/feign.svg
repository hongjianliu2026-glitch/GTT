<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feign</text>
  <text x="50" y="120" class="subtitle">[feɪn] v. 假装，佯装</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feign (来自古法语 feindre，意为“假装”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在舞台上，"假装(feign)"
    <tspan x="50" dy="25">成一个悲伤的角色，脸上挂着假眼泪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She feigned illness to avoid the meeting.
  </text>
  <text x="50" y="310" class="content">
    她假装生病以避免会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actor -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Fake tears -->
    <line x1="150" y1="80" x2="140" y2="70" class="image" />
    <line x1="150" y1="80" x2="140" y2="90" class="image" />
    <line x1="200" y1="80" x2="210" y2="70" class="image" />
    <line x1="200" y1="80" x2="210" y2="90" class="image" />
    <!-- Fake expression -->
    <line x1="160" y1="120" x2="190" y2="120" class="image" />
    <line x1="160" y1="120" x2="155" y2="115" class="image" />
    <line x1="160" y1="120" x2="155" y2="125" class="image" />
    <line x1="190" y1="120" x2="195" y2="115" class="image" />
    <line x1="190" y1="120" x2="195" y2="125" class="image" />
  </g>
</svg>