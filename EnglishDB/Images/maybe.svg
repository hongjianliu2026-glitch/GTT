<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maybe</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪbi] adv. 可能，也许</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> may (可能) + be (是)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两个门之间，"可能(may)"
    <tspan x="50" dy="25">选择左边，也可能选择右边，这就是"也许(maybe)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Maybe it will rain tomorrow.
  </text>
  <text x="50" y="310" class="content">
    明天可能会下雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two doors -->
    <rect x="0" y="0" width="150" height="300" class="image" />
    <rect x="200" y="0" width="150" height="300" class="image" />
    <!-- Person in between -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="150" y2="300" class="image" />
    <line x1="175" y1="250" x2="200" y2="300" class="image" />
    <line x1="175" y1="200" x2="125" y2="180" class="image" />
    <line x1="175" y1="200" x2="225" y2="180" class="image" />
  </g>
</svg>