<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFC107; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #FFEB3B; }
      .face { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheery</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɪri] adj. 愉快的，欢乐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cheer (愉快) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阳光明媚的日子，太阳(cheer)高高挂起，
    <tspan x="50" dy="25">人们脸上洋溢着愉快的笑容(cheery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She greeted everyone with a cheery smile.
  </text>
  <text x="50" y="310" class="content">
    她用愉快的微笑迎接每个人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Face -->
    <circle cx="100" cy="100" r="40" class="face" />
    <circle cx="80" cy="90" r="5" class="face" />
    <circle cx="120" cy="90" r="5" class="face" />
    <path d="M80 110 Q100 120 120 110" class="face" />
  </g>
</svg>