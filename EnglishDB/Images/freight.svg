<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">freight</text>
  <text x="50" y="120" class="subtitle">[freɪt] n. 货物，货运；v. 装货于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fr- (来自) + -eigh- (运送) + -t (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆大卡车，"运送(eigh-t)"
    <tspan x="50" dy="25">着满满的货物(freight)，从远方(fr-)驶来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The freight was delayed due to bad weather.
  </text>
  <text x="50" y="310" class="content">
    由于恶劣天气，货运被延迟了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Truck -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <rect x="50" y="20" width="250" height="110" class="image" />
    <!-- Cargo -->
    <rect x="70" y="40" width="80" height="70" class="image" />
    <rect x="170" y="40" width="80" height="70" class="image" />
    <rect x="270" y="40" width="80" height="70" class="image" />
    <!-- Wheels -->
    <circle cx="100" cy="140" r="20" class="image" />
    <circle cx="300" cy="140" r="20" class="image" />
  </g>
</svg>