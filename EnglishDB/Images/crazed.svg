<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crazed</text>
  <text x="50" y="120" class="subtitle">[kreɪzd] adj. 疯狂的，狂热的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cera (疯狂) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为过度兴奋而"疯狂(cera)"，
    <tspan x="50" dy="25">眼睛瞪得大大的，头发竖起，完全失去了理智。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crazed fan tried to break into the concert.
  </text>
  <text x="50" y="310" class="content">
    那个疯狂的粉丝试图闯入演唱会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Eyes -->
    <circle cx="35" cy="40" r="5" class="image" />
    <circle cx="65" cy="40" r="5" class="image" />
    <!-- Hair -->
    <line x1="20" y1="20" x2="80" y2="20" class="image" />
    <line x1="25" y1="10" x2="75" y2="10" class="image" />
    <line x1="30" y1="0" x2="70" y2="0" class="image" />
    <!-- Mouth -->
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <!-- Body -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <!-- Arms -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Legs -->
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
  </g>
</svg>