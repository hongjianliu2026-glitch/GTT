<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mammalian</text>
  <text x="50" y="120" class="subtitle">[məˈmeɪliən] adj. 哺乳动物的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mamm (乳房) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只母熊用它的"乳房(mamm)"喂养小熊，
    <tspan x="50" dy="25">这种哺乳行为是哺乳动物(mammalian)的特征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The study focused on the behavior of mammalian species.
  </text>
  <text x="50" y="310" class="content">
    这项研究专注于哺乳动物物种的行为。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bear -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="250" x2="50" y2="300" class="image" /> <!-- Left leg -->
    <line x1="100" y1="250" x2="150" y2="300" class="image" /> <!-- Right leg -->
    <line x1="100" y1="180" x2="50" y2="180" class="image" /> <!-- Left arm -->
    <line x1="100" y1="180" x2="150" y2="180" class="image" /> <!-- Right arm -->
    <!-- Baby bear -->
    <circle cx="200" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="200" y1="130" x2="200" y2="200" class="image" /> <!-- Body -->
    <line x1="200" y1="200" x2="170" y2="230" class="image" /> <!-- Left leg -->
    <line x1="200" y1="200" x2="230" y2="230" class="image" /> <!-- Right leg -->
    <line x1="200" y1="150" x2="170" y2="150" class="image" /> <!-- Left arm -->
    <line x1="200" y1="150" x2="230" y2="150" class="image" /> <!-- Right arm -->
    <!-- Milk -->
    <line x1="100" y1="150" x2="200" y2="130" class="image" />
  </g>
</svg>