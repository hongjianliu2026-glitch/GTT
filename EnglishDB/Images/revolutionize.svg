<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">revolutionize</text>
  <text x="50" y="120" class="subtitle">[ˌrevəˈluːʃənaɪz] v. 彻底改革，使发生革命性剧变</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + volut (转动) + -ize (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的齿轮在转动，"再次转动(re-volut)"
    <tspan x="50" dy="25">整个世界，带来翻天覆地的变化，这就是革命(revolutionize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The invention of the internet revolutionized communication.
  </text>
  <text x="50" y="310" class="content">
    互联网的发明彻底改变了通信方式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gear -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- World -->
    <circle cx="300" cy="100" r="60" class="image" />
    <!-- Explosion -->
    <circle cx="300" cy="100" r="10" class="image" />
    <circle cx="320" cy="80" r="10" class="image" />
    <circle cx="280" cy="80" r="10" class="image" />
    <circle cx="320" cy="120" r="10" class="image" />
    <circle cx="280" cy="120" r="10" class="image" />
  </g>
</svg>