<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sedan</text>
  <text x="50" y="120" class="subtitle">[sɪˈdæn] n. 轿车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自法语“sedan”，原指一种封闭的轿子。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆豪华的轿车，"封闭的轿子(sedan)"
    <tspan x="50" dy="25">在城市中穿梭，象征着舒适与奢华。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He drives a black sedan to work every day.
  </text>
  <text x="50" y="310" class="content">
    他每天开着一辆黑色轿车去上班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Car windows -->
    <rect x="20" y="20" width="100" height="60" class="image" />
    <rect x="140" y="20" width="100" height="60" class="image" />
    <!-- Car wheels -->
    <circle cx="60" cy="120" r="20" class="image" />
    <circle cx="280" cy="120" r="20" class="image" />
  </g>
</svg>