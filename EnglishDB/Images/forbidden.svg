<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forbidden</text>
  <text x="50" y="120" class="subtitle">[fərˈbɪdn] adj. 被禁止的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (离开) + bid (命令)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警示牌，上面写着"禁止(forbidden)"，
    <tspan x="50" dy="25">表示命令人们离开(for-bid)这个地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Smoking is forbidden in this area.
  </text>
  <text x="50" y="310" class="content">
    这个区域禁止吸烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warning sign -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <circle cx="100" cy="100" r="90" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <!-- Forbidden text -->
    <text x="70" y="110" class="content" style="font-size: 36px; fill: #B03A2E;">X</text>
  </g>
</svg>