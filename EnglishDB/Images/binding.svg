<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">binding</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪndɪŋ] n. 绑定，装订；adj. 有约束力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bind (绑) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本书被"绑(bind)"在一起，形成了一个"绑定(binding)"的整体。
    <tspan x="50" dy="25">这个绑定的过程使得书页紧密相连，无法轻易分开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The binding of the contract is legally enforceable.
  </text>
  <text x="50" y="310" class="content">
    合同的绑定具有法律约束力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Binding -->
    <rect x="10" y="10" width="180" height="280" class="image" />
    <!-- Pages -->
    <line x1="20" y1="30" x2="180" y2="30" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="90" x2="180" y2="90" class="image" />
    <line x1="20" y1="120" x2="180" y2="120" class="image" />
    <line x1="20" y1="150" x2="180" y2="150" class="image" />
    <line x1="20" y1="180" x2="180" y2="180" class="image" />
    <line x1="20" y1="210" x2="180" y2="210" class="image" />
    <line x1="20" y1="240" x2="180" y2="240" class="image" />
    <line x1="20" y1="270" x2="180" y2="270" class="image" />
  </g>
</svg>