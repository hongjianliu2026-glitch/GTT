<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shh</text>
  <text x="50" y="120" class="subtitle">[ʃ] int. 嘘，安静</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 拟声词，模仿安静时的声音
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个图书馆里，一个学生轻轻地发出"嘘(shh)"的声音，
    <tspan x="50" dy="25">提醒周围的人保持安静。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Shh, the baby is sleeping.
  </text>
  <text x="50" y="310" class="content">
    嘘，宝宝在睡觉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Library -->
    <rect x="0" y="0" width="350" height="300" class="image" />
    <!-- Bookshelves -->
    <rect x="50" y="20" width="250" height="260" class="image" />
    <!-- Books -->
    <rect x="60" y="30" width="40" height="180" class="image" />
    <rect x="120" y="30" width="40" height="180" class="image" />
    <rect x="180" y="30" width="40" height="180" class="image" />
    <rect x="240" y="30" width="40" height="180" class="image" />
    <!-- Student -->
    <circle cx="150" cy="200" r="15" class="image" />
    <line x1="150" y1="215" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="130" y2="280" class="image" />
    <line x1="150" y1="250" x2="170" y2="280" class="image" />
    <line x1="150" y1="230" x2="190" y2="220" class="image" />
    <!-- Shh -->
    <text x="100" y="150" class="content" style="font-size: 60px; fill: #E74C3C;">shh</text>
  </g>
</svg>