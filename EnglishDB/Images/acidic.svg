<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .acid { fill: #FF5733; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acidic</text>
  <text x="50" y="120" class="subtitle">[əˈsɪdɪk] adj. 酸的，酸性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> acid (酸) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个柠檬被挤出汁液，"酸(acid)"
    <tspan x="50" dy="25">的汁液溅到你的舌头上，让你感到酸(acidic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lemon juice was so acidic that it made my mouth pucker.
  </text>
  <text x="50" y="310" class="content">
    柠檬汁太酸了，让我的嘴巴都皱起来了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lemon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Juice splashing -->
    <path d="M 100 50 Q 150 20 200 50 T 250 100" class="acid" />
    <path d="M 100 50 Q 50 20 0 50 T 50 100" class="acid" />
    <!-- Tongue -->
    <path d="M 150 200 Q 200 250 250 200" class="image" />
    <!-- Puckered mouth -->
    <circle cx="200" cy="250" r="20" class="image" />
  </g>
</svg>