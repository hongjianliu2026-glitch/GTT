<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">livestock</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪvstɒk] n. 家畜，牲畜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> live (活的) + stock (牲畜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农场，"活的(live)"
    <tspan x="50" dy="25">牲畜(stock)在草地上悠闲地吃草，</tspan>
    <tspan x="50" dy="25">这就是家畜(livestock)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer raises livestock on his farm.
  </text>
  <text x="50" y="310" class="content">
    农夫在他的农场里饲养家畜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Farm -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Grass -->
    <rect x="50" y="150" width="250" height="50" class="image" fill="#27AE60" />
    <!-- Cow -->
    <circle cx="100" cy="120" r="20" class="image" fill="#D35400" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="160" x2="140" y2="150" class="image" />
    <!-- Sheep -->
    <circle cx="200" cy="120" r="15" class="image" fill="#F1C40F" />
    <line x1="200" y1="135" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="185" y2="200" class="image" />
    <line x1="200" y1="170" x2="215" y2="200" class="image" />
    <line x1="200" y1="155" x2="230" y2="145" class="image" />
  </g>
</svg>