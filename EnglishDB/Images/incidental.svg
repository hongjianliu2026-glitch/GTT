<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incidental</text>
  <text x="50" y="120" class="subtitle">[ˌɪnsɪˈdent(ə)l] adj. 附带的，偶然的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (向内) + cid (落下) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，一个苹果从树上"落下(cid)"，
    <tspan x="50" dy="25">正好砸在牛顿头上，这个"偶然(incidental)"的事件</tspan>
    <tspan x="50" dy="25">启发了他的万有引力理论。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The discovery was incidental to their main research.
  </text>
  <text x="50" y="310" class="content">
    这个发现是他们的主要研究中的偶然事件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="40" y1="20" x2="60" y2="20" class="image" />
    <line x1="30" y1="40" x2="70" y2="40" class="image" />
    <line x1="20" y1="60" x2="80" y2="60" class="image" />
    <line x1="10" y1="80" x2="90" y2="80" class="image" />
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
    <!-- Apple falling -->
    <circle cx="50" cy="100" r="10" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <!-- Newton -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
  </g>
</svg>