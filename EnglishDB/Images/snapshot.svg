<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snapshot</text>
  <text x="50" y="120" class="subtitle">[ˈsnæpʃɒt] n. 快照，瞬间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snap (突然折断) + shot (射击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摄影师突然"折断(snap)"快门，"射击(shot)"出一张瞬间的画面，这就是快照(snapshot)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He took a snapshot of the beautiful sunset.
  </text>
  <text x="50" y="310" class="content">
    他拍了一张美丽日落的快照。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Camera -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <circle cx="100" cy="75" r="50" class="image" />
    <!-- Flash -->
    <polygon points="100,0 150,50 50,50" class="image" />
    <!-- Snapshot -->
    <rect x="220" y="50" width="150" height="100" class="image" />
    <line x1="230" y1="60" x2="360" y2="60" class="image" />
    <line x1="230" y1="80" x2="360" y2="80" class="image" />
    <line x1="230" y1="100" x2="360" y2="100" class="image" />
    <line x1="230" y1="120" x2="360" y2="120" class="image" />
  </g>
</svg>