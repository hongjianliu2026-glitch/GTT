<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">activation</text>
  <text x="50" y="120" class="subtitle">[ˌæktɪˈveɪʃn] n. 激活，启动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> act (行动) + -iv (形容词后缀) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色按钮，上面写着"激活(act-iv-ation)"，
    <tspan x="50" dy="25">当你按下它时，整个系统开始运转，就像启动了一台机器。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The activation of the alarm system alerted the security team.
  </text>
  <text x="50" y="310" class="content">
    报警系统的激活通知了安保团队。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large red button -->
    <circle cx="100" cy="100" r="50" class="image" fill="#E74C3C" />
    <text x="85" y="110" class="content" fill="#FFFFFF">ACTIVATE</text>
    <!-- System starting -->
    <rect x="200" y="50" width="150" height="100" class="image" fill="#3498DB" />
    <line x1="220" y1="70" x2="330" y2="70" class="image" />
    <line x1="220" y1="90" x2="330" y2="90" class="image" />
    <line x1="220" y1="110" x2="330" y2="110" class="image" />
    <line x1="220" y1="130" x2="330" y2="130" class="image" />
    <text x="220" y="160" class="content" fill="#FFFFFF">SYSTEM</text>
  </g>
</svg>