<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">posture</text>
  <text x="50" y="120" class="subtitle">[ˈpɒstʃə(r)] n. 姿势，姿态；v. 摆姿势</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> post (放置) + ure (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在拍照时，"放置(post)"自己的身体，
    <tspan x="50" dy="25">摆出各种"状态(ure)"，这就是姿势(posture)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She struck a confident posture for the photo.
  </text>
  <text x="50" y="310" class="content">
    她为照片摆出了一个自信的姿势。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Camera -->
    <rect x="100" y="80" width="80" height="60" class="image" />
    <line x1="140" y1="80" x2="140" y2="60" class="image" />
    <line x1="140" y1="60" x2="160" y2="60" class="image" />
    <line x1="160" y1="60" x2="160" y2="80" class="image" />
  </g>
</svg>