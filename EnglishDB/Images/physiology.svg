<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">physiology</text>
  <text x="50" y="120" class="subtitle">[ˌfɪziˈɒlədʒi] n. 生理学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> physio- (自然) + -logy (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"研究自然(physio-)"
    <tspan x="50" dy="25">人体的运作机制，这就是生理学(physiology)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She studied physiology to understand how the human body works.
  </text>
  <text x="50" y="310" class="content">
    她学习生理学以了解人体的工作原理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Laboratory -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Microscope -->
    <rect x="70" y="50" width="50" height="80" class="image" />
    <line x1="95" y1="50" x2="95" y2="130" class="image" />
    <line x1="95" y1="130" x2="70" y2="150" class="image" />
    <line x1="95" y1="130" x2="120" y2="150" class="image" />
    <!-- Human body -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="170" y2="220" class="image" />
    <line x1="200" y1="180" x2="230" y2="220" class="image" />
    <line x1="200" y1="150" x2="150" y2="140" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
  </g>
</svg>