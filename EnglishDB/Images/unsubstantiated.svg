<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unsubstantiated</text>
  <text x="50" y="120" class="subtitle">[ˌʌnsəbˈstænʃieɪtɪd] adj. 未经证实的，无根据的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + substantiate (证实)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在法庭上，手里拿着一张空白的纸，"没有证据(un-substantiated)"
    <tspan x="50" dy="25">来支持他的说法，他的话就是未经证实的(unsubstantiated)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The claim was dismissed as unsubstantiated.
  </text>
  <text x="50" y="310" class="content">
    这个说法被驳回了，因为它未经证实。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Defendant -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="290" y2="130" class="image" />
    <!-- Blank paper -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <line x1="150" y1="50" x2="250" y2="50" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>