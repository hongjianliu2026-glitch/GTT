<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">notation</text>
  <text x="50" y="120" class="subtitle">[noʊˈteɪʃn] n. 符号，记号，乐谱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> not (标记) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在谱写乐谱，"标记(not)"
    <tspan x="50" dy="25">每一个音符，这些标记就构成了乐谱(notation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The musician used standard musical notation to write the song.
  </text>
  <text x="50" y="310" class="content">
    音乐家使用标准的音乐符号来写这首歌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Staff lines -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="50" y1="80" x2="350" y2="80" class="image" />
    <line x1="50" y1="110" x2="350" y2="110" class="image" />
    <line x1="50" y1="140" x2="350" y2="140" class="image" />
    <!-- Notes -->
    <circle cx="100" cy="35" r="10" class="image" />
    <circle cx="150" cy="65" r="10" class="image" />
    <circle cx="200" cy="95" r="10" class="image" />
    <circle cx="250" cy="125" r="10" class="image" />
    <!-- Musician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>