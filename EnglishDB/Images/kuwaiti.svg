<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Kuwaiti</text>
  <text x="50" y="120" class="subtitle">[kʊˈweɪti] adj. 科威特的；n. 科威特人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Kuwait (科威特) + -i (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着传统长袍的科威特人，站在沙漠中，
    <tspan x="50" dy="25">背景是高耸的科威特塔，象征着科威特的文化和身份。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Kuwaiti ambassador delivered a speech at the UN.
  </text>
  <text x="50" y="310" class="content">
    科威特大使在联合国发表了演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Desert -->
    <rect x="0" y="150" width="350" height="150" class="image" fill="#F4D03F" />
    <!-- Kuwait Tower -->
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <line x1="165" y1="70" x2="185" y2="70" class="image" />
    <line x1="160" y1="90" x2="190" y2="90" class="image" />
    <line x1="155" y1="110" x2="195" y2="110" class="image" />
    <!-- Traditional Robe -->
    <rect x="150" y="160" width="50" height="100" class="image" fill="#8E44AD" />
    <circle cx="175" cy="150" r="15" class="image" fill="#34495E" />
    <!-- Head -->
    <circle cx="175" cy="140" r="10" class="image" fill="#F1C40F" />
  </g>
</svg>