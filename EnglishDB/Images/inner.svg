<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inner</text>
  <text x="50" y="120" class="subtitle">[ˈɪnər] adj. 内部的，内心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (内部) + -er (表示比较)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的透明球体中，球体内部充满了光芒，象征着内心的世界。
    <tspan x="50" dy="25">这个球体就是他的"inner(内部的)"世界，充满了深邃和神秘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tried to understand his inner thoughts.
  </text>
  <text x="50" y="310" class="content">
    她试图理解他的内心想法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Transparent sphere -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Light inside the sphere -->
    <circle cx="175" cy="100" r="70" fill="#F39C12" opacity="0.5" />
    <!-- Person inside the sphere -->
    <circle cx="175" cy="100" r="15" fill="#2C3E50" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>