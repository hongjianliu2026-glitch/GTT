<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brew</text>
  <text x="50" y="120" class="subtitle">[bruː] v. 酿造，冲泡；n. 酿造物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brew (源自中古英语 brewe，意为“酿造”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的酿酒师，手持大木勺，在巨大的铜锅中“酿造(brew)”
    <tspan x="50" dy="25">着美味的啤酒，空气中弥漫着麦芽的香气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He enjoys brewing his own beer at home.
  </text>
  <text x="50" y="310" class="content">
    他喜欢在家里自己酿啤酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brewing pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Handle -->
    <line x1="255" y1="60" x2="300" y2="20" class="image" />
    <line x1="300" y1="20" x2="340" y2="60" class="image" />
    <!-- Bubbles -->
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="180" cy="130" r="12" class="image" />
    <circle cx="210" cy="110" r="8" class="image" />
    <!-- Brewer -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Spoon -->
    <line x1="50" y1="150" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
  </g>
</svg>