<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lame</text>
  <text x="50" y="120" class="subtitle">[leɪm] adj. 跛的，瘸的；无说服力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lam (伤害)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只受伤的鸟，"伤害(lam)"
    <tspan x="50" dy="25">导致它跛行，这就是"跛的(lame)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lame bird struggled to fly.
  </text>
  <text x="50" y="310" class="content">
    那只跛脚的鸟挣扎着飞翔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Wing -->
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <!-- Leg -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <!-- Crutch -->
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="200" y2="200" class="image" />
  </g>
</svg>