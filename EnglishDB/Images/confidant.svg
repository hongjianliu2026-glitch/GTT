<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confidant</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnfɪˈdænt] n. 知己，密友</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + fid (信任) + -ant (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在月光下，"共同信任(con-fid-ant)"
    <tspan x="50" dy="25">彼此，分享秘密，他们就是知己(confidant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She confided in her confidant about her fears.
  </text>
  <text x="50" y="310" class="content">
    她向她的知己倾诉了她的恐惧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Two people -->
    <circle cx="50" cy="150" r="20" class="image" fill="#2ECC71" />
    <circle cx="150" cy="150" r="20" class="image" fill="#2ECC71" />
    <!-- Heart connection -->
    <line x1="70" y1="170" x2="130" y2="170" class="image" />
    <polygon points="100,180 90,200 110,200" class="image" fill="#E74C3C" />
  </g>
</svg>