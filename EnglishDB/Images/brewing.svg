<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brewing</text>
  <text x="50" y="120" class="subtitle">[ˈbruːɪŋ] v. 酿造，酝酿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brew (酿造) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的啤酒桶，里面"正在酿造(brewing)"
    <tspan x="50" dy="25">着美味的啤酒，泡沫不断上升，香气四溢。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The brewery is brewing a new batch of beer.
  </text>
  <text x="50" y="310" class="content">
    酿酒厂正在酿造一批新啤酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beer barrel -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Bubbles -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="60" r="12" class="image" />
    <circle cx="200" cy="70" r="14" class="image" />
    <circle cx="250" cy="80" r="16" class="image" />
    <!-- Spigot -->
    <rect x="165" y="180" width="20" height="20" class="image" />
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
  </g>
</svg>