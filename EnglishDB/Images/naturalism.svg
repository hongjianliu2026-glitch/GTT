<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">naturalism</text>
  <text x="50" y="120" class="subtitle">[ˈnætʃrəlɪzəm] n. 自然主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> natura (自然) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在户外，"沉浸在自然(natura)"
    <tspan x="50" dy="25">中，用画笔捕捉自然的美丽，这就是自然主义(naturalism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His paintings are a perfect example of naturalism.
  </text>
  <text x="50" y="310" class="content">
    他的画作是自然主义的完美典范。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nature scene -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Sun -->
    <line x1="100" y1="150" x2="100" y2="300" class="image" /> <!-- Tree trunk -->
    <polyline points="70,300 100,250 130,300" class="image" /> <!-- Tree branches -->
    <circle cx="100" cy="250" r="20" class="image" /> <!-- Tree leaves -->
    <circle cx="70" cy="280" r="15" class="image" /> <!-- Tree leaves -->
    <circle cx="130" cy="280" r="15" class="image" /> <!-- Tree leaves -->
    <!-- Artist -->
    <circle cx="200" cy="200" r="15" class="image" /> <!-- Head -->
    <line x1="200" y1="215" x2="200" y2="250" class="image" /> <!-- Body -->
    <line x1="200" y1="250" x2="180" y2="280" class="image" /> <!-- Left arm -->
    <line x1="200" y1="250" x2="220" y2="280" class="image" /> <!-- Right arm -->
    <line x1="200" y1="250" x2="170" y2="240" class="image" /> <!-- Left leg -->
    <line x1="200" y1="250" x2="230" y2="240" class="image" /> <!-- Right leg -->
    <rect x="180" y="180" width="40" height="20" class="image" /> <!-- Easel -->
    <rect x="185" y="185" width="30" height="10" class="image" /> <!-- Canvas -->
  </g>
</svg>