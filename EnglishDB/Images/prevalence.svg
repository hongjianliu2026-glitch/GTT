<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prevalence</text>
  <text x="50" y="120" class="subtitle">[ˈprevələns] n. 流行，普遍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + val (强壮) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的巨人(val)站在人群前面(pre-)，
    <tspan x="50" dy="25">他的存在使得某种现象变得非常普遍(prevalence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The prevalence of smartphones has changed our daily lives.
  </text>
  <text x="50" y="310" class="content">
    智能手机的普及改变了我们的日常生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />

    <!-- Crowd -->
    <circle cx="250" cy="200" r="10" class="image" />
    <circle cx="280" cy="210" r="10" class="image" />
    <circle cx="310" cy="220" r="10" class="image" />
    <circle cx="340" cy="230" r="10" class="image" />
    <circle cx="370" cy="240" r="10" class="image" />
    <circle cx="400" cy="250" r="10" class="image" />
  </g>
</svg>