<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disillusion</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsɪˈluːʒn] v. 使醒悟，使不再抱幻想</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + illusion (幻想)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人原本沉浸在美好的幻想中，突然被现实"打破(dis-illusion)"，
    <tspan x="50" dy="25">幻想的泡泡一个个破灭，他终于醒悟过来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The truth disillusioned her about her idol.
  </text>
  <text x="50" y="310" class="content">
    真相让她对她的偶像不再抱有幻想。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with bubble -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Bubble -->
    <circle cx="100" cy="50" r="30" class="image" />
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="150" class="image" />
    <!-- Broken bubble -->
    <circle cx="200" cy="50" r="30" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="50" x2="170" y2="20" class="image" />
    <line x1="200" y1="50" x2="230" y2="20" class="image" />
  </g>
</svg>