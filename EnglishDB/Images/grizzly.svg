<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grizzly</text>
  <text x="50" y="120" class="subtitle">[ˈɡrɪzli] adj. 灰色的，灰白头发的；n. 灰熊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gris (灰色) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的灰熊(grizzly bear)在森林中漫步，
    <tspan x="50" dy="25">它的毛发是灰色的(grizzly)，给人一种威严而古老的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The grizzly bear is a symbol of strength and resilience.
  </text>
  <text x="50" y="310" class="content">
    灰熊是力量和坚韧的象征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bear body -->
    <ellipse cx="150" cy="100" rx="100" ry="60" class="image" />
    <!-- Bear head -->
    <circle cx="150" cy="50" r="40" class="image" />
    <!-- Bear ears -->
    <circle cx="120" cy="30" r="15" class="image" />
    <circle cx="180" cy="30" r="15" class="image" />
    <!-- Bear eyes -->
    <circle cx="135" cy="50" r="5" class="image" />
    <circle cx="165" cy="50" r="5" class="image" />
    <!-- Bear nose -->
    <circle cx="150" cy="65" r="10" class="image" />
    <!-- Bear legs -->
    <line x1="70" y1="160" x2="70" y2="220" class="image" />
    <line x1="230" y1="160" x2="230" y2="220" class="image" />
    <line x1="110" y1="160" x2="110" y2="220" class="image" />
    <line x1="190" y1="160" x2="190" y2="220" class="image" />
  </g>
</svg>