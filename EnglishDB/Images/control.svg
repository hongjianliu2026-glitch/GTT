<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">control</text>
  <text x="50" y="120" class="subtitle">[kənˈtroʊl] n. 控制，管理；v. 控制，支配</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (加强) + troll (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨人在拉扯(troll)一根绳子，"加强(con-)"
    <tspan x="50" dy="25">对绳子的控制，这种力量就是控制(control)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has full control over the project.
  </text>
  <text x="50" y="310" class="content">
    她对项目有完全的控制权。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant pulling a rope -->
    <circle cx="20" cy="100" r="30" class="image" /> <!-- Giant's head -->
    <line x1="20" y1="130" x2="20" y2="200" class="image" /> <!-- Giant's body -->
    <line x1="20" y1="200" x2="0" y2="230" class="image" /> <!-- Giant's left arm -->
    <line x1="20" y1="200" x2="40" y2="230" class="image" /> <!-- Giant's right arm -->
    <line x1="20" y1="200" x2="20" y2="250" class="image" /> <!-- Giant's legs -->
    <line x1="20" y1="250" x2="0" y2="280" class="image" /> <!-- Giant's left leg -->
    <line x1="20" y1="250" x2="40" y2="280" class="image" /> <!-- Giant's right leg -->
    <line x1="20" y1="130" x2="100" y2="130" class="image" /> <!-- Rope -->
    <line x1="100" y1="130" x2="100" y2="200" class="image" /> <!-- Rope pulled -->
  </g>
</svg>