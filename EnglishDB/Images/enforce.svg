<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enforce</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfɔːrs] v. 强制执行，迫使</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + force (力量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警察用"力量(force)"
    <tspan x="50" dy="25">迫使(en-force)一个罪犯遵守法律。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The law was enforced to protect the environment.
  </text>
  <text x="50" y="310" class="content">
    法律被强制执行以保护环境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Police officer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Handcuffs -->
    <line x1="50" y1="180" x2="120" y2="180" class="image" />
    <line x1="120" y1="180" x2="120" y2="220" class="image" />
    <line x1="120" y1="200" x2="140" y2="200" class="image" />
    <!-- Criminal -->
    <circle cx="180" cy="100" r="20" class="image" />
    <line x1="180" y1="120" x2="180" y2="180" class="image" />
    <line x1="180" y1="180" x2="160" y2="220" class="image" />
    <line x1="180" y1="180" x2="200" y2="220" class="image" />
    <line x1="180" y1="140" x2="210" y2="130" class="image" />
  </g>
</svg>