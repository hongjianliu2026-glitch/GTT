<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recycle</text>
  <text x="50" y="120" class="subtitle">[ˈriːsaɪkl] v. 回收利用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + cycle (循环)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的回收工厂，"再次循环(re-cycle)"
    <tspan x="50" dy="25">废弃的物品被重新加工，变成了新的产品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We should recycle our plastic bottles to reduce waste.
  </text>
  <text x="50" y="310" class="content">
    我们应该回收塑料瓶以减少浪费。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Recycling symbol -->
    <path d="M 0 0 L 50 50 L 100 0 L 50 -50 Z" class="image" />
    <path d="M 50 50 L 100 100 L 150 50 L 100 0 Z" class="image" />
    <path d="M 100 100 L 150 150 L 200 100 L 150 50 Z" class="image" />
    <!-- Factory -->
    <rect x="250" y="0" width="150" height="100" class="image" />
    <line x1="270" y1="20" x2="380" y2="20" class="image" />
    <line x1="270" y1="40" x2="380" y2="40" class="image" />
    <line x1="270" y1="60" x2="380" y2="60" class="image" />
    <line x1="270" y1="80" x2="380" y2="80" class="image" />
    <!-- Conveyor belt -->
    <line x1="250" y1="100" x2="400" y2="100" class="image" />
    <line x1="250" y1="120" x2="400" y2="120" class="image" />
    <line x1="250" y1="140" x2="400" y2="140" class="image" />
    <line x1="250" y1="160" x2="400" y2="160" class="image" />
    <!-- Recycled items -->
    <circle cx="300" cy="130" r="10" class="image" />
    <circle cx="320" cy="130" r="10" class="image" />
    <circle cx="340" cy="130" r="10" class="image" />
    <circle cx="360" cy="130" r="10" class="image" />
  </g>
</svg>