<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .spice { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spice</text>
  <text x="50" y="120" class="subtitle">[spaɪs] n. 香料，调味品；v. 加香料，使增添趣味</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spic (看) + e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"看(spic)"
    <tspan x="50" dy="25">着各种香料，然后选择合适的香料(spice)来调味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added a pinch of spice to the dish to enhance the flavor.
  </text>
  <text x="50" y="310" class="content">
    她往菜里加了一点香料以增强味道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Spice jars -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="20" width="50" height="100" class="image" />
    <rect x="190" y="20" width="50" height="100" class="image" />
    <!-- Spices -->
    <circle cx="75" cy="70" r="10" class="spice" />
    <circle cx="145" cy="70" r="10" class="spice" />
    <circle cx="215" cy="70" r="10" class="spice" />
  </g>
</svg>