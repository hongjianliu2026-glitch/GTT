<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acculturation</text>
  <text x="50" y="120" class="subtitle">[əˌkʌltʃəˈreɪʃn] n. 文化适应</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + cultur (文化) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅行者来到一个陌生的国度，"加强(ac-)"
    <tspan x="50" dy="25">学习当地"文化(cultur)"，逐渐适应(acculturation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The process of acculturation can be challenging but rewarding.
  </text>
  <text x="50" y="310" class="content">
    文化适应的过程可能充满挑战，但也会带来回报。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="70" class="image" />
    <!-- Traveler -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Learning symbols -->
    <line x1="200" y1="50" x2="250" y2="50" class="image" />
    <line x1="225" y1="50" x2="225" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
  </g>
</svg>