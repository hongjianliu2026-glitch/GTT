<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supplementation</text>
  <text x="50" y="120" class="subtitle">[ˌsʌplɪmenˈteɪʃn] n. 补充，增补</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sup- (在下面) + ple (充满) + ment (名词后缀) + ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瓶子，里面已经装满了水，但还在"下面(sup-)"
    <tspan x="50" dy="25">继续"充满(ple)"更多的水，这就是补充(supplementation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Vitamin supplements are often used for supplementation.
  </text>
  <text x="50" y="310" class="content">
    维生素补充剂常用于补充营养。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Water in the bottle -->
    <rect x="2" y="2" width="96" height="150" fill="#16A085" />
    <!-- Additional water -->
    <rect x="2" y="152" width="96" height="48" fill="#2980B9" />
    <!-- Arrow pointing to additional water -->
    <line x1="50" y1="152" x2="50" y2="200" class="image" />
    <polygon points="45,152 55,152 50,142" fill="#7F8C8D" />
  </g>
</svg>