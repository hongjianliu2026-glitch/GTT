<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">refreshment</text>
  <text x="50" y="120" class="subtitle">[rɪˈfreʃmənt] n. 恢复，精神爽快；点心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + fresh (新鲜的) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在疲惫时，"再次(re-)" 喝了一杯 "新鲜的(fresh)" 果汁，
    <tspan x="50" dy="25">立刻感到精神爽快(refreshment)，仿佛重获新生。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a long hike, some refreshments were much appreciated.
  </text>
  <text x="50" y="310" class="content">
    长途徒步后，一些点心非常受欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass of juice -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="160" r="40" class="image" />
    <!-- Straw -->
    <line x1="50" y1="160" x2="50" y2="250" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="200" class="image" />
    <line x1="200" y1="150" x2="170" y2="180" class="image" />
    <line x1="200" y1="150" x2="230" y2="180" class="image" />
    <line x1="200" y1="200" x2="180" y2="250" class="image" />
    <line x1="200" y1="200" x2="220" y2="250" class="image" />
    <!-- Smiling face -->
    <circle cx="200" cy="90" r="5" class="image" />
    <circle cx="220" cy="90" r="5" class="image" />
    <path d="M190 110 Q200 120 210 110" class="image" />
  </g>
</svg>