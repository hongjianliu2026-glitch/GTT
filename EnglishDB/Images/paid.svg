<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paid</text>
  <text x="50" y="120" class="subtitle">[peɪd] adj. 已支付的，有报酬的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pay (支付) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人收到一袋金币，"支付(pay)"
    <tspan x="50" dy="25">后，金币袋上贴着"已支付(paid)"的标签。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bill was paid in full.
  </text>
  <text x="50" y="310" class="content">
    账单已全额支付。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bag of coins -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Coins -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Tag -->
    <rect x="70" y="100" width="60" height="30" class="image" />
    <text x="80" y="120" class="content">paid</text>
  </g>
</svg>