<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">particle</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːrtɪkl] n. 粒子，微粒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> part (部分) + -icle (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宇宙中，"小部分(part-icle)"
    <tspan x="50" dy="25">的物质在漂浮，这些微小的粒子构成了宇宙的基石。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientist studied the behavior of particles in the experiment.
  </text>
  <text x="50" y="310" class="content">
    科学家在实验中研究了粒子的行为。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Universe background -->
    <circle cx="200" cy="100" r="150" class="image" />
    <!-- Particles -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="250" cy="150" r="5" class="image" />
    <circle cx="300" cy="80" r="5" class="image" />
    <circle cx="150" cy="120" r="5" class="image" />
    <circle cx="200" cy="20" r="5" class="image" />
    <!-- Scientist -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>