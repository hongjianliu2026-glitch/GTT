<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swab</text>
  <text x="50" y="120" class="subtitle">[swɒb] n. 拭子，药签；v. 擦拭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sw- (类似“擦”的动作) + ab (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生拿着一根"擦拭(sw-)"用的"工具(ab)"，
    <tspan x="50" dy="25">轻轻地在病人身上取样，这就是拭子(swab)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nurse used a swab to collect a sample from the patient's throat.
  </text>
  <text x="50" y="310" class="content">
    护士用拭子从病人的喉咙取样。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Doctor -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />

    <!-- Swab -->
    <rect x="100" y="150" width="100" height="10" class="image" />
    <rect x="100" y="140" width="10" height="20" class="image" />
    <rect x="190" y="140" width="10" height="20" class="image" />
    <rect x="100" y="140" width="100" height="10" class="image" />
    <rect x="100" y="150" width="100" height="10" class="image" />
    <rect x="100" y="160" width="100" height="10" class="image" />
  </g>
</svg>