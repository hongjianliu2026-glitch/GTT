<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grandfather</text>
  <text x="50" y="120" class="subtitle">[ˈɡrænfɑːðər] n. 祖父，外祖父</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grand- (大的) + father (父亲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的(grand)父亲(father)，他坐在一张巨大的椅子上，
    <tspan x="50" dy="25">手里拿着一本厚厚的书，他就是你的祖父(grandfather)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My grandfather always tells me stories before bedtime.
  </text>
  <text x="50" y="310" class="content">
    我的祖父总是在睡前给我讲故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grandfather -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
    <!-- Chair -->
    <rect x="20" y="250" width="60" height="30" class="image" />
    <!-- Book -->
    <rect x="80" y="140" width="40" height="60" class="image" />
  </g>
</svg>