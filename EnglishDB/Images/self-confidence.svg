<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-confidence</text>
  <text x="50" y="120" class="subtitle">[ˈsɛlf ˈkɒnfɪdəns] n. 自信</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + confidence (信任)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"自己(self)"
    <tspan x="50" dy="25">对自己充满"信任(confidence)"，这就是自信(self-confidence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her self-confidence helped her succeed in the interview.
  </text>
  <text x="50" y="310" class="content">
    她的自信帮助她在面试中取得了成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="130" y2="140" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Reflection -->
    <circle cx="175" cy="300" r="30" class="image" />
    <line x1="175" y1="330" x2="175" y2="380" class="image" />
    <line x1="175" y1="380" x2="150" y2="420" class="image" />
    <line x1="175" y1="380" x2="200" y2="420" class="image" />
    <line x1="175" y1="350" x2="130" y2="340" class="image" />
    <line x1="175" y1="350" x2="220" y2="340" class="image" />
  </g>
</svg>