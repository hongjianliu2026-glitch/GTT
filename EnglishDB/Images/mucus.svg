<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .mucus { fill: #85C1E9; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mucus</text>
  <text x="50" y="120" class="subtitle">[ˈmjuːkəs] n. 黏液</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> muc (黏液)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的黏液球，"黏黏的(muc)"
    <tspan x="50" dy="25">覆盖了一切，这就是黏液(mucus)的夸张画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cold caused an excessive production of mucus.
  </text>
  <text x="50" y="310" class="content">
    感冒导致黏液过度分泌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mucus ball -->
    <circle cx="100" cy="100" r="80" class="mucus" />
    <!-- Mucus strings -->
    <line x1="100" y1="180" x2="100" y2="300" class="image" />
    <line x1="100" y1="180" x2="20" y2="250" class="image" />
    <line x1="100" y1="180" x2="180" y2="250" class="image" />
    <!-- Mucus drops -->
    <circle cx="50" cy="280" r="10" class="mucus" />
    <circle cx="150" cy="280" r="10" class="mucus" />
  </g>
</svg>