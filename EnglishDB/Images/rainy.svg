<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .rain { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rainy</text>
  <text x="50" y="120" class="subtitle">[ˈreɪni] adj. 下雨的，多雨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rain (雨) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个乌云密布的天空，"雨(rain)"
    <tspan x="50" dy="25">滴从天而降，整个世界变得湿润(rainy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weather forecast predicts a rainy day tomorrow.
  </text>
  <text x="50" y="310" class="content">
    天气预报预测明天会下雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Rain drops -->
    <line x1="70" y1="120" x2="70" y2="180" class="rain" />
    <line x1="120" y1="120" x2="120" y2="180" class="rain" />
    <line x1="170" y1="120" x2="170" y2="180" class="rain" />
    <line x1="220" y1="120" x2="220" y2="180" class="rain" />
    <line x1="270" y1="120" x2="270" y2="180" class="rain" />
  </g>
</svg>