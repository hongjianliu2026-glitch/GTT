<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">falsely</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːlsli] adv. 错误地，虚假地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fals (虚假) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一个<tspan class="highlight">假(fals)</tspan>的镜子，
    <tspan x="50" dy="25">照出来的自己都是<tspan class="highlight">错误(ly)</tspan>的形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was accused of falsely claiming to be a doctor.
  </text>
  <text x="50" y="310" class="content">
    他被指控虚假地声称自己是医生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Person -->
    <circle cx="100" cy="200" r="30" class="image" />
    <line x1="100" y1="230" x2="100" y2="300" class="image" />
    <line x1="100" y1="250" x2="50" y2="280" class="image" />
    <line x1="100" y1="250" x2="150" y2="280" class="image" />
    <line x1="100" y1="300" x2="50" y2="350" class="image" />
    <line x1="100" y1="300" x2="150" y2="350" class="image" />
    <!-- Reflection -->
    <circle cx="100" cy="75" r="20" class="image" />
    <line x1="100" y1="95" x2="100" y2="125" class="image" />
    <line x1="100" y1="110" x2="80" y2="100" class="image" />
    <line x1="100" y1="110" x2="120" y2="100" class="image" />
  </g>
</svg>