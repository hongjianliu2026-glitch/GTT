<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weather</text>
  <text x="50" y="120" class="subtitle">[ˈwɛðər] n. 天气；v. 经受住，风化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> weath (风) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的岩石，"经受住(weather)"
    <tspan x="50" dy="25">了无数次的风吹雨打，最终风化成了独特的形状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weather forecast predicts rain for tomorrow.
  </text>
  <text x="50" y="310" class="content">
    天气预报预测明天会下雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="100" cy="50" rx="80" ry="40" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="40" class="image" />
    <!-- Rain drops -->
    <line x1="120" y1="80" x2="120" y2="120" class="image" />
    <line x1="140" y1="80" x2="140" y2="120" class="image" />
    <line x1="160" y1="80" x2="160" y2="120" class="image" />
    <!-- Wind -->
    <line x1="20" y1="150" x2="100" y2="150" class="image" />
    <line x1="20" y1="160" x2="100" y2="160" class="image" />
    <line x1="20" y1="170" x2="100" y2="170" class="image" />
    <!-- Rock -->
    <rect x="150" y="100" width="100" height="100" class="image" />
  </g>
</svg>