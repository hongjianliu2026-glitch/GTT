<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gendered</text>
  <text x="50" y="120" class="subtitle">[ˈdʒendərd] adj. 有性别的，分性别的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gender (性别) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世界，所有的物品都被"性别化(gendered)"，
    <tspan x="50" dy="25">比如一把椅子被标记为"男性椅"，另一把被标记为"女性椅"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The toy store has gendered sections for boys and girls.
  </text>
  <text x="50" y="310" class="content">
    这家玩具店有分性别的男孩和女孩专区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Male symbol -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="140" class="image" />
    <line x1="50" y1="100" x2="20" y2="80" class="image" />
    <line x1="50" y1="100" x2="80" y2="80" class="image" />
    <!-- Female symbol -->
    <circle cx="200" cy="50" r="30" class="image" />
    <line x1="200" y1="80" x2="200" y2="140" class="image" />
    <line x1="200" y1="100" x2="170" y2="130" class="image" />
    <line x1="200" y1="100" x2="230" y2="130" class="image" />
    <!-- Gendered items -->
    <rect x="20" y="160" width="60" height="40" class="image" />
    <text x="30" y="190" class="content">男椅</text>
    <rect x="170" y="160" width="60" height="40" class="image" />
    <text x="180" y="190" class="content">女椅</text>
  </g>
</svg>