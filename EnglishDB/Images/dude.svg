<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dude</text>
  <text x="50" y="120" class="subtitle">[dud] n. 伙计，老兄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自美国俚语，原意为“花花公子”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着时髦的“花花公子(dude)”，
    <tspan x="50" dy="25">戴着墨镜，手插口袋，潇洒地走在街上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Hey dude, what's up?
  </text>
  <text x="50" y="310" class="content">
    嘿，老兄，最近怎么样？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dude -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Sunglasses -->
    <line x1="35" y1="90" x2="65" y2="90" class="image" />
    <line x1="35" y1="90" x2="35" y2="95" class="image" />
    <line x1="65" y1="90" x2="65" y2="95" class="image" />
    <!-- Pocket -->
    <line x1="40" y1="150" x2="60" y2="150" class="image" />
    <line x1="40" y1="150" x2="40" y2="160" class="image" />
    <line x1="60" y1="150" x2="60" y2="160" class="image" />
  </g>
</svg>