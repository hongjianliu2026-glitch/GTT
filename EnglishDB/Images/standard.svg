<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">standard</text>
  <text x="50" y="120" class="subtitle">[ˈstændərd] n. 标准，规格；adj. 标准的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stand (站立) + -ard (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的尺子"站立(stand)"在那里，
    <tspan x="50" dy="25">它代表着测量事物的"标准(standard)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company sets high standards for quality.
  </text>
  <text x="50" y="310" class="content">
    公司对质量设定了高标准。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ruler -->
    <rect x="0" y="0" width="300" height="50" class="image" />
    <line x1="20" y1="0" x2="20" y2="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <line x1="180" y1="0" x2="180" y2="50" class="image" />
    <line x1="260" y1="0" x2="260" y2="50" class="image" />
    <!-- Markings -->
    <text x="10" y="70" class="content">0</text>
    <text x="90" y="70" class="content">10</text>
    <text x="170" y="70" class="content">20</text>
    <text x="250" y="70" class="content">30</text>
  </g>
</svg>