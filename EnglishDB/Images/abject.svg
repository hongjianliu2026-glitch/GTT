<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abject</text>
  <text x="50" y="120" class="subtitle">[ˈæbdʒekt] adj. 可怜的，卑鄙的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + ject (扔)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"扔离(ab-ject)"了社会，
    <tspan x="50" dy="25">变得可怜(abject)和卑鄙(abject)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beggar's abject state made everyone feel sorry for him.
  </text>
  <text x="50" y="310" class="content">
    乞丐的可怜状态让每个人都为他感到难过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="70" y2="130" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Social circle -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <!-- Arrow -->
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,100 170,95 170,105" class="image" />
  </g>
</svg>