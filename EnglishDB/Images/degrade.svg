<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">degrade</text>
  <text x="50" y="120" class="subtitle">[dɪˈɡreɪd] v. 降级，退化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + grad (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体从高处"向下走(de-grad)"，
    <tspan x="50" dy="25">逐渐失去原有的品质，这就是降级(degrade)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The quality of the product has degraded over time.
  </text>
  <text x="50" y="310" class="content">
    随着时间的推移，产品的质量已经下降。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High point -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <line x1="200" y1="0" x2="180" y2="20" class="image" />
    <line x1="200" y1="0" x2="220" y2="20" class="image" />
    <text x="210" y="15" class="content">High</text>

    <!-- Low point -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="180" class="image" />
    <line x1="200" y1="200" x2="220" y2="180" class="image" />
    <text x="210" y="215" class="content">Low</text>

    <!-- Degradation path -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="100" cy="200" r="10" class="image" />
  </g>
</svg>