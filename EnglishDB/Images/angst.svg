<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">angst</text>
  <text x="50" y="120" class="subtitle">[æŋst] n. 焦虑，不安</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> angst (源自德语，意为“焦虑”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被巨大的"焦虑(angst)"笼罩，
    <tspan x="50" dy="25">他的心脏像被一只无形的手紧紧抓住，无法呼吸。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The uncertainty of the future filled him with angst.
  </text>
  <text x="50" y="310" class="content">
    未来的不确定性让他充满了焦虑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 50 Q25 20 40 50 T70 50" class="image" />
    <!-- Hand gripping the heart -->
    <line x1="30" y1="50" x2="30" y2="100" class="image" />
    <line x1="30" y1="70" x2="10" y2="60" class="image" />
    <line x1="30" y1="70" x2="50" y2="60" class="image" />
    <!-- Person with anxiety -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
  </g>
</svg>