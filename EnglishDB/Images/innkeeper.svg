<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">innkeeper</text>
  <text x="50" y="120" class="subtitle">[ˈɪnˌkiːpər] n. 旅店老板</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inn (旅店) + keeper (看守者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅店老板(innkeeper)站在旅店(inn)门口，
    <tspan x="50" dy="25">热情地迎接每一位客人，确保他们的住宿舒适。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The innkeeper greeted us with a warm smile.
  </text>
  <text x="50" y="310" class="content">
    旅店老板热情地向我们微笑致意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Inn -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Innkeeper -->
    <circle cx="200" cy="80" r="20" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="120" x2="240" y2="110" class="image" />
    <!-- Guest -->
    <circle cx="100" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="180" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />
    <line x1="100" y1="145" x2="130" y2="135" class="image" />
  </g>
</svg>