<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">competition</text>
  <text x="50" y="120" class="subtitle">[ˌkɒmpəˈtɪʃn] n. 竞争，比赛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + pet (追求) + -ition (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在赛场上，"共同追求(com-pet)"
    <tspan x="50" dy="25">胜利，这种激烈的追逐就是竞争(competition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The competition for the job was fierce.
  </text>
  <text x="50" y="310" class="content">
    这份工作的竞争非常激烈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Runners -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="190" cy="100" r="15" class="image" />
    <circle cx="260" cy="100" r="15" class="image" />
    <!-- Finish line -->
    <line x1="320" y1="20" x2="320" y2="180" class="image" />
    <text x="330" y="100" class="content" style="font-size: 24px;">Finish</text>
  </g>
</svg>