<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coefficient</text>
  <text x="50" y="120" class="subtitle">[ˌkoʊɪˈfɪʃnt] n. 系数，协同因素</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + effici (做) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个数学家在实验室里，"共同做(co-effici)"
    <tspan x="50" dy="25">实验，他们发现了一个重要的系数(coefficient)，</tspan>
    <tspan x="50" dy="25">这个系数帮助他们更好地理解了实验结果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coefficient of friction was higher than expected.
  </text>
  <text x="50" y="310" class="content">
    摩擦系数比预期的要高。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Laboratory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Scientists -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <!-- Experiment -->
    <rect x="150" y="50" width="150" height="100" class="image" />
    <!-- Coefficient -->
    <text x="225" y="100" class="highlight">X</text>
    <text x="240" y="100" class="highlight">2</text>
  </g>
</svg>