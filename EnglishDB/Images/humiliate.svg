<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humiliate</text>
  <text x="50" y="120" class="subtitle">[hjuːˈmɪlieɪt] v. 羞辱，使丢脸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hum (地) + -il (使) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"压到地上(hum-il-ate)"，
    <tspan x="50" dy="25">他的尊严被践踏，这就是羞辱(humiliate)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher humiliated the student in front of the class.
  </text>
  <text x="50" y="310" class="content">
    老师在全班面前羞辱了那个学生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Person being humiliated -->
    <circle cx="100" cy="160" r="20" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
    <line x1="100" y1="200" x2="120" y2="220" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
    <!-- Humiliation symbol -->
    <line x1="150" y1="160" x2="200" y2="160" class="image" />
    <line x1="175" y1="160" x2="175" y2="180" class="image" />
    <line x1="150" y1="180" x2="200" y2="180" class="image" />
    <line x1="150" y1="160" x2="150" y2="180" class="image" />
    <line x1="200" y1="160" x2="200" y2="180" class="image" />
  </g>
</svg>