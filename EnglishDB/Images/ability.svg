<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ability</text>
  <text x="50" y="120" class="subtitle">[əˈbɪlɪti] n. 能力，才能</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (从) + il (能力) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在起跑线上，"从(ab-)"
    <tspan x="50" dy="25">开始展现出他的"能力(il)"，</tspan>
    <tspan x="50" dy="25">最终成功完成比赛，这就是他的"能力(ability)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has the ability to solve complex problems.
  </text>
  <text x="50" y="310" class="content">
    她有能力解决复杂的问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Start line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person running -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />
    <!-- Finish line -->
    <line x1="300" y1="0" x2="350" y2="0" class="image" />
    <line x1="300" y1="0" x2="300" y2="50" class="image" />
    <line x1="350" y1="0" x2="350" y2="50" class="image" />
  </g>
</svg>