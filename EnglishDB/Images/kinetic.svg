<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kinetic</text>
  <text x="50" y="120" class="subtitle">[kaɪˈnetɪk] adj. 运动的，动力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kine- (运动) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的滚石从山上滚下，"运动(kine-)"
    <tspan x="50" dy="25">的力量(tic)让它势不可挡，这就是kinetic(运动的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kinetic energy of the moving car was immense.
  </text>
  <text x="50" y="310" class="content">
    这辆移动的汽车的动能是巨大的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 0 L200 200 Z" class="image" />
    <!-- Rolling stone -->
    <circle cx="100" cy="150" r="20" class="image" />
    <!-- Path of the stone -->
    <path d="M100 150 Q150 100 200 150" class="image" />
  </g>
</svg>