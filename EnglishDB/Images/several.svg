<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">several</text>
  <text x="50" y="120" class="subtitle">[ˈsev(ə)r(ə)l] adj. 几个的，数个的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sev- (分开) + eral (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师将一堆物品"分开(sev-)"，变成了"几个(eral)"不同的部分，这就是several的意思。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I have several books to read this weekend.
  </text>
  <text x="50" y="310" class="content">
    这个周末我有几本书要读。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Magic wand -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="80" class="image" />
    <!-- Items -->
    <circle cx="150" cy="50" r="20" class="image" />
    <rect x="200" y="30" width="40" height="40" class="image" />
    <rect x="260" y="30" width="40" height="40" class="image" />
    <circle cx="320" cy="50" r="20" class="image" />
    <!-- Separator lines -->
    <line x1="150" y1="70" x2="320" y2="70" class="image" />
    <line x1="150" y1="90" x2="320" y2="90" class="image" />
  </g>
</svg>