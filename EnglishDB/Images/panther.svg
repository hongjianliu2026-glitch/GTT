<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4ECF7; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">panther</text>
  <text x="50" y="120" class="subtitle">[ˈpænθər] n. 黑豹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pan- (全部) + ther (野兽)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只全身漆黑的黑豹("全部的野兽")，
    <tspan x="50" dy="25">在夜晚的森林中悄无声息地潜行，它的身影如同夜幕下的幽灵。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The panther moved silently through the jungle.
  </text>
  <text x="50" y="310" class="content">
    黑豹在丛林中悄无声息地移动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Panther body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Panther head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Panther eyes -->
    <circle cx="85" cy="45" r="5" class="image" />
    <circle cx="115" cy="45" r="5" class="image" />
    <!-- Panther ears -->
    <polygon points="70,30 85,10 100,30" class="image" />
    <polygon points="130,30 115,10 100,30" class="image" />
    <!-- Panther tail -->
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <!-- Forest background -->
    <rect x="0" y="200" width="300" height="100" class="image" />
    <line x1="50" y1="200" x2="50" y2="300" class="image" />
    <line x1="100" y1="200" x2="100" y2="300" class="image" />
    <line x1="150" y1="200" x2="150" y2="300" class="image" />
    <line x1="200" y1="200" x2="200" y2="300" class="image" />
    <line x1="250" y1="200" x2="250" y2="300" class="image" />
  </g>
</svg>