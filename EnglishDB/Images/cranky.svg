<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cranky</text>
  <text x="50" y="120" class="subtitle">[ˈkræŋki] adj. 脾气坏的，古怪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crank (曲柄) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个脾气暴躁的人，他的情绪就像一个"曲柄(crank)"，
    <tspan x="50" dy="25">随时可能转动，让人捉摸不透，这就是cranky。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man was cranky and refused to talk to anyone.
  </text>
  <text x="50" y="310" class="content">
    那位老人脾气很坏，拒绝和任何人说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crank -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <!-- Face -->
    <circle cx="250" cy="100" r="50" class="image" />
    <circle cx="230" cy="80" r="10" class="image" />
    <circle cx="270" cy="80" r="10" class="image" />
    <line x1="230" y1="120" x2="270" y2="120" class="image" />
    <!-- Angry expression -->
    <line x1="220" y1="130" x2="280" y2="130" class="image" />
    <line x1="220" y1="130" x2="230" y2="140" class="image" />
    <line x1="280" y1="130" x2="270" y2="140" class="image" />
  </g>
</svg>