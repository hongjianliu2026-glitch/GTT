<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mite</text>
  <text x="50" y="120" class="subtitle">[maɪt] n. 螨，微小的东西</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mit (来自古英语 myt, 意为“小”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只微小的螨虫(mite)，它小到几乎看不见，
    <tspan x="50" dy="25">但它的存在却能引发过敏反应，让人不得不重视。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Dust mites can cause allergic reactions in some people.
  </text>
  <text x="50" y="310" class="content">
    尘螨会引起一些人的过敏反应。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mite -->
    <circle cx="50" cy="50" r="10" class="image" />
    <line x1="50" y1="60" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="40" y2="100" class="image" />
    <line x1="50" y1="80" x2="60" y2="100" class="image" />
    <line x1="50" y1="70" x2="30" y2="60" class="image" />
    <line x1="50" y1="70" x2="70" y2="60" class="image" />
    <!-- Magnifying glass -->
    <circle cx="150" cy="50" r="30" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="120" y2="150" class="image" />
    <line x1="150" y1="120" x2="180" y2="150" class="image" />
  </g>
</svg>