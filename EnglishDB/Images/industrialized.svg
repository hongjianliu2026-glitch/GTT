<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">industrialized</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdʌstriəlaɪzd] adj. 工业化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + dustry (行业) + -ize (使成为) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个村庄被"带入(in-)"了"行业(dustry)"，变成了一个"工业化的(industrialized)"城市，到处都是工厂和烟囱。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The country has been rapidly industrialized in the past decade.
  </text>
  <text x="50" y="310" class="content">
    这个国家在过去十年里迅速实现了工业化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimneys -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <!-- Smoke -->
    <circle cx="50" cy="15" r="10" fill="#808080" />
    <circle cx="100" cy="15" r="10" fill="#808080" />
    <circle cx="150" cy="15" r="10" fill="#808080" />
    <!-- Factory building -->
    <rect x="0" y="100" width="350" height="100" class="image" />
  </g>
</svg>