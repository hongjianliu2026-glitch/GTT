<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">utopia</text>
  <text x="50" y="120" class="subtitle">[juːˈtoʊpiə] n. 乌托邦，理想国</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> u- (无) + topos (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有地方(u-topos)的理想国，
    <tspan x="50" dy="25">那里人人平等，没有纷争，这就是乌托邦(utopia)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The novel describes a utopia where everyone lives in harmony.
  </text>
  <text x="50" y="310" class="content">
    小说描述了一个人人和谐共处的乌托邦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ideal land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" fill="#F1C40F" />
    <!-- Houses -->
    <rect x="50" y="100" width="50" height="50" class="image" />
    <rect x="120" y="100" width="50" height="50" class="image" />
    <rect x="190" y="100" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="75" cy="160" r="10" fill="#2ECC71" />
    <circle cx="145" cy="160" r="10" fill="#2ECC71" />
    <circle cx="215" cy="160" r="10" fill="#2ECC71" />
    <!-- Harmony -->
    <line x1="75" y1="170" x2="145" y2="170" class="image" />
    <line x1="145" y1="170" x2="215" y2="170" class="image" />
  </g>
</svg>