<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abduction</text>
  <text x="50" y="120" class="subtitle">[æbˈdʌkʃən] n. 诱拐，绑架</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + duct (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个坏人"引导(duct)"某人"离开(ab-)"他们的家，
    <tspan x="50" dy="25">这就是绑架(abduction)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police are investigating the abduction of the child.
  </text>
  <text x="50" y="310" class="content">
    警方正在调查这起儿童绑架案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="100" x2="130" y2="100" class="image" />
    <line x1="75" y1="100" x2="75" y2="50" class="image" />
    <!-- Kid -->
    <circle cx="100" cy="70" r="10" class="image" />
    <line x1="100" y1="80" x2="100" y2="100" class="image" />
    <line x1="100" y1="90" x2="90" y2="80" class="image" />
    <line x1="100" y1="90" x2="110" y2="80" class="image" />
    <!-- Kidnapper -->
    <circle cx="200" cy="70" r="15" class="image" />
    <line x1="200" y1="85" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="190" y2="140" class="image" />
    <line x1="200" y1="120" x2="210" y2="140" class="image" />
    <line x1="200" y1="100" x2="180" y2="90" class="image" />
    <!-- Arrow -->
    <line x1="110" y1="70" x2="190" y2="70" class="image" />
    <polygon points="190,70 185,65 185,75" class="image" />
  </g>
</svg>