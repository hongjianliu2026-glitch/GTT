<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">immutable</text>
  <text x="50" y="120" class="subtitle">[ɪˈmjuːtəbl] adj. 不可改变的，不变的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + mut (改变) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块石头，"无法改变(im-mutable)"，
    <tspan x="50" dy="25">无论风吹雨打，它始终保持原样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The laws of physics are immutable.
  </text>
  <text x="50" y="310" class="content">
    物理定律是不可改变的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Wind and rain -->
    <line x1="20" y1="20" x2="180" y2="130" class="image" />
    <line x1="20" y1="130" x2="180" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="130" class="image" />
    <line x1="20" y1="75" x2="180" y2="75" class="image" />
    <!-- Text on stone -->
    <text x="50" y="90" class="content" fill="#FFFFFF">IM-MUTABLE</text>
  </g>
</svg>