<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skip</text>
  <text x="50" y="120" class="subtitle">[skɪp] v. 跳过，略过；n. 跳跃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sk- (跳) + -ip (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小兔子在草地上"跳跃(sk-ip)"，
    <tspan x="50" dy="25">它灵活地跳过一个个障碍，就像我们跳过不喜欢的部分。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to skip the boring lecture.
  </text>
  <text x="50" y="310" class="content">
    她决定跳过那个无聊的讲座。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Rabbit -->
    <circle cx="50" cy="120" r="20" class="image" />
    <line x1="50" y1="140" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="160" x2="80" y2="150" class="image" />
    <!-- Jump arc -->
    <path d="M50 120 Q100 50 150 120" class="image" />
  </g>
</svg>