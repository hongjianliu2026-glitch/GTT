<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unsalted</text>
  <text x="50" y="120" class="subtitle">[ʌnˈsɔːltɪd] adj. 未加盐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + salt (盐) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"不加盐(un-salted)"
    <tspan x="50" dy="25">地烹饪食物，结果食物淡而无味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dish was unsalted, making it bland.
  </text>
  <text x="50" y="310" class="content">
    这道菜没有加盐，味道很淡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Pot -->
    <rect x="70" y="80" width="150" height="100" class="image" />
    <!-- Food -->
    <line x1="80" y1="100" x2="210" y2="100" class="image" />
    <line x1="80" y1="120" x2="200" y2="120" class="image" />
    <line x1="80" y1="140" x2="190" y2="140" class="image" />
    <!-- Salt shaker -->
    <rect x="240" y="80" width="30" height="100" class="image" />
    <line x1="255" y1="90" x2="255" y2="170" class="image" />
    <line x1="245" y1="100" x2="265" y2="100" class="image" />
    <line x1="245" y1="120" x2="265" y2="120" class="image" />
    <line x1="245" y1="140" x2="265" y2="140" class="image" />
    <line x1="245" y1="160" x2="265" y2="160" class="image" />
  </g>
</svg>