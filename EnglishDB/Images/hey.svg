<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hey</text>
  <text x="50" y="120" class="subtitle">[heɪ] int. 嘿，喂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，常用作打招呼
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在路上突然对你喊"嘿(hey)"，
    <tspan x="50" dy="25">你回头一看，发现是你的老朋友。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Hey, how have you been?
  </text>
  <text x="50" y="310" class="content">
    嘿，你最近怎么样？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person waving -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 100 50 Q 150 20 200 50 Q 150 80 100 50" class="image" />
    <text x="120" y="60" class="content">hey</text>
  </g>
</svg>