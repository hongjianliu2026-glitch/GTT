<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">later</text>
  <text x="50" y="120" class="subtitle">[ˈleɪtər] adv. 后来，稍后</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lat (宽) + -er (比较级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在时间的起点，"宽阔的时间(lat-er)"
    <tspan x="50" dy="25">让他有更多的时间去经历，后来(later)他到达了时间的另一端。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I will call you later.
  </text>
  <text x="50" y="310" class="content">
    我稍后会给你打电话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Time line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person at the start -->
    <circle cx="20" cy="0" r="15" class="image" />
    <!-- Person at the end -->
    <circle cx="330" cy="0" r="15" class="image" />
    <!-- Arrows indicating time passing -->
    <line x1="40" y1="0" x2="310" y2="0" class="image">
      <animate attributeName="x2" from="40" to="310" dur="5s" repeatCount="indefinite" />
    </line>
    <polygon points="310,-10 310,10 330,0" class="image" />
  </g>
</svg>