<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">remember</text>
  <text x="50" y="120" class="subtitle">[rɪˈmembər] v. 记得，记住</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + member (成员，部分)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在脑海中"再次(re-)"找回"成员(member)"，
    <tspan x="50" dy="25">就像从记忆的拼图中找回丢失的部分，这就是记住(remember)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I remember meeting her at the conference last year.
  </text>
  <text x="50" y="310" class="content">
    我记得去年在会议上见过她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Puzzle piece -->
    <polygon points="150,100 200,50 250,100 200,150" class="image" />
    <!-- Arrow -->
    <line x1="250" y1="100" x2="350" y2="100" class="image" />
    <polygon points="350,100 340,90 340,110" class="image" />
    <!-- Text -->
    <text x="360" y="105" class="content">找回</text>
  </g>
</svg>