<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coward</text>
  <text x="50" y="120" class="subtitle">[ˈkaʊərd] n. 懦夫，胆小鬼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cow (恐吓) + -ard (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被吓得瑟瑟发抖的"胆小鬼(cow-ard)"，
    <tspan x="50" dy="25">他因为害怕而蜷缩在角落里，不敢面对任何挑战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was called a coward for refusing to fight.
  </text>
  <text x="50" y="310" class="content">
    他因为拒绝战斗而被称作懦夫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coward -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="150" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <!-- Corner -->
    <rect x="0" y="200" width="100" height="100" class="image" />
    <!-- Shaking -->
    <line x1="50" y1="100" x2="40" y2="90" class="image" />
    <line x1="50" y1="100" x2="60" y2="90" class="image" />
  </g>
</svg>