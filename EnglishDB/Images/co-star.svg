<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">co-star</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊstɑːr] n. 联合主演</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + star (明星)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个明星在同一部电影中"共同(co-)成为明星(star)"，
    <tspan x="50" dy="25">他们就是联合主演(co-star)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They were both co-stars in the hit movie.
  </text>
  <text x="50" y="310" class="content">
    他们都是那部热门电影的联合主演。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two stars -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Connecting line -->
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <!-- Star symbols -->
    <text x="40" y="110" class="image" font-size="40">★</text>
    <text x="140" y="110" class="image" font-size="40">★</text>
  </g>
</svg>