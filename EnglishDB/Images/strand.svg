<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">strand</text>
  <text x="50" y="120" class="subtitle">[strænd] n. 绳股，海滨；v. 使滞留</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strand (来自古英语 "strand"，意为海滨)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"绳股(strand)"缠住，无法动弹，
    <tspan x="50" dy="25">就像被滞留在海滨(strand)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship was stranded on the rocky shore.
  </text>
  <text x="50" y="310" class="content">
    船被滞留在多岩石的海岸上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Beach -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sea -->
    <rect x="0" y="100" width="350" height="100" class="image" />
    <!-- Ship -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <!-- Rope -->
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <line x1="100" y1="160" x2="250" y2="160" class="image" />
    <line x1="100" y1="170" x2="250" y2="170" class="image" />
    <!-- Person -->
    <circle cx="200" cy="120" r="15" class="image" />
    <line x1="200" y1="135" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="200" class="image" />
    <line x1="200" y1="170" x2="220" y2="200" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
  </g>
</svg>