<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uniformly</text>
  <text x="50" y="120" class="subtitle">[ˈjuːnɪfɔːrmli] adv. 一致地，均匀地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (单一) + form (形式) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群穿着<tspan class="highlight">统一制服(uniform)</tspan>的学生，
    <tspan x="50" dy="25">他们步伐一致，动作整齐划一，这就是"一致地(uniformly)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paint was applied uniformly across the wall.
  </text>
  <text x="50" y="310" class="content">
    油漆均匀地涂在墙上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Uniformed students -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="90" x2="180" y2="80" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <line x1="250" y1="90" x2="280" y2="80" class="image" />
    <!-- Uniforms -->
    <rect x="30" y="120" width="40" height="30" class="image" />
    <rect x="130" y="120" width="40" height="30" class="image" />
    <rect x="230" y="120" width="40" height="30" class="image" />
  </g>
</svg>