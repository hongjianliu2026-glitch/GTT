<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incarnation</text>
  <text x="50" y="120" class="subtitle">[ˌɪnkɑːrˈneɪʃn] n. 化身，具体化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + carne (肉) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个灵魂"进入(in-)"一个肉体(carne)，
    <tspan x="50" dy="25">这个肉体就成了灵魂的化身(incarnation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He believed that the artist was the incarnation of creativity.
  </text>
  <text x="50" y="310" class="content">
    他认为艺术家是创造力的化身。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Soul entering -->
    <line x1="200" y1="100" x2="100" y2="100" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Soul -->
    <text x="200" y="90" class="content" text-anchor="middle">灵魂</text>
    <!-- Body -->
    <text x="100" y="110" class="content" text-anchor="middle">肉体</text>
  </g>
</svg>