<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Austrian</text>
  <text x="50" y="120" class="subtitle">[ˈɔːstriən] adj. 奥地利的；n. 奥地利人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Austro- (南方) + -ian (人或形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个南方(Austro-)的国度，那里的人们(ian)
    <tspan x="50" dy="25">都穿着传统服饰，跳着欢快的舞蹈，这就是奥地利(Austrian)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Austrian Alps are famous for their beauty.
  </text>
  <text x="50" y="310" class="content">
    奥地利的阿尔卑斯山以其美丽而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional Austrian clothing -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Lederhosen -->
    <line x1="30" y1="50" x2="140" y2="50" class="image" />
    <line x1="30" y1="80" x2="140" y2="80" class="image" />
    <line x1="30" y1="110" x2="140" y2="110" class="image" />
    <line x1="30" y1="140" x2="140" y2="140" class="image" />
    <!-- Alpine landscape -->
    <polygon points="180,200 250,50 320,200" class="image" />
    <polygon points="200,180 250,100 300,180" class="image" />
    <polygon points="220,160 250,150 280,160" class="image" />
  </g>
</svg>