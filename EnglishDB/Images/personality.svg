<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">personality</text>
  <text x="50" y="120" class="subtitle">[ˌpɜːrsəˈnæləti] n. 个性，人格</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> person (人) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舞台上有多个"人(person)"，每个人都在展示自己独特的"个性(-ality)"，
    <tspan x="50" dy="25">有的在唱歌，有的在跳舞，有的在演讲，这就是他们的personality。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her personality made her stand out in the crowd.
  </text>
  <text x="50" y="310" class="content">
    她的个性使她在人群中脱颖而出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />

    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />

    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />

    <!-- Actions -->
    <line x1="50" y1="150" x2="30" y2="120" class="image" />
    <line x1="150" y1="150" x2="170" y2="120" class="image" />
    <line x1="250" y1="150" x2="270" y2="120" class="image" />
  </g>
</svg>