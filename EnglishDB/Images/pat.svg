<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pat</text>
  <text x="50" y="120" class="subtitle">[pæt] v. 轻拍，轻打</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pat (轻拍)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在轻轻地"拍(pat)"你的手，
    <tspan x="50" dy="25">这种温柔的动作让人感到舒适和放松。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She patted the cat gently on the head.
  </text>
  <text x="50" y="310" class="content">
    她轻轻地拍了拍猫的头。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Cat -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="80" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Hand -->
    <rect x="100" y="40" width="50" height="30" class="image" />
    <line x1="125" y1="70" x2="125" y2="100" class="image" />
    <line x1="125" y1="100" x2="105" y2="130" class="image" />
    <line x1="125" y1="100" x2="145" y2="130" class="image" />
    <line x1="125" y1="80" x2="95" y2="70" class="image" />
    <line x1="125" y1="80" x2="155" y2="70" class="image" />
  </g>
</svg>