<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jury</text>
  <text x="50" y="120" class="subtitle">[ˈdʒʊəri] n. 陪审团</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jur- (法律) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人坐在法庭里，他们都是"法律(jur-)"的守护者，
    <tspan x="50" dy="25">组成了一个陪审团(jury)，决定案件的最终判决。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jury reached a unanimous verdict.
  </text>
  <text x="50" y="310" class="content">
    陪审团达成了一致裁决。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Jury box -->
    <rect x="100" y="80" width="150" height="100" class="image" />
    <!-- Jurors -->
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="180" cy="100" r="10" class="image" />
    <circle cx="210" cy="100" r="10" class="image" />
    <circle cx="120" cy="130" r="10" class="image" />
    <circle cx="150" cy="130" r="10" class="image" />
    <circle cx="180" cy="130" r="10" class="image" />
    <circle cx="210" cy="130" r="10" class="image" />
  </g>
</svg>