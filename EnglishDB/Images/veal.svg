<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">veal</text>
  <text x="50" y="120" class="subtitle">[viːl] n. 小牛肉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> veal (源自拉丁语 "vitellus"，意为小牛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头小牛(veal)在草地上悠闲地吃草，
    <tspan x="50" dy="25">它的肉质鲜嫩，是美味的食材。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef prepared a delicious veal dish for the guests.
  </text>
  <text x="50" y="310" class="content">
    厨师为客人们准备了一道美味的小牛肉菜肴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" fill="#27AE60" />
    <!-- Cow -->
    <circle cx="100" cy="120" r="30" fill="#D35400" /> <!-- Head -->
    <rect x="85" y="150" width="30" height="50" fill="#D35400" /> <!-- Body -->
    <line x1="100" y1="200" x2="100" y2="250" stroke="#D35400" stroke-width="10" /> <!-- Leg -->
    <line x1="120" y1="200" x2="120" y2="250" stroke="#D35400" stroke-width="10" /> <!-- Leg -->
    <line x1="80" y1="200" x2="80" y2="250" stroke="#D35400" stroke-width="10" /> <!-- Leg -->
    <line x1="140" y1="200" x2="140" y2="250" stroke="#D35400" stroke-width="10" /> <!-- Leg -->
    <!-- Grass -->
    <line x1="50" y1="150" x2="50" y2="140" stroke="#27AE60" stroke-width="5" />
    <line x1="70" y1="150" x2="70" y2="140" stroke="#27AE60" stroke-width="5" />
    <line x1="90" y1="150" x2="90" y2="140" stroke="#27AE60" stroke-width="5" />
    <line x1="110" y1="150" x2="110" y2="140" stroke="#27AE60" stroke-width="5" />
    <line x1="130" y1="150" x2="130" y2="140" stroke="#27AE60" stroke-width="5" />
  </g>
</svg>