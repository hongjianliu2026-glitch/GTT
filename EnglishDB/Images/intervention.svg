<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intervention</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈvɛnʃən] n. 介入，干预</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + ven (来) + tion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个超级英雄突然"介入(inter-)"两个正在打架的人之间，
    <tspan x="50" dy="25">"来(ven)"阻止他们的冲突，这就是干预(intervention)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government's intervention in the economy helped stabilize the market.
  </text>
  <text x="50" y="310" class="content">
    政府的干预帮助稳定了市场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two fighting figures -->
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="100" y1="50" x2="50" y2="100" class="image" />
    <line x1="200" y1="50" x2="250" y2="100" class="image" />
    <line x1="250" y1="50" x2="200" y2="100" class="image" />
    <!-- Superhero intervening -->
    <circle cx="150" cy="150" r="30" class="image" />
    <line x1="150" y1="180" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="120" y2="300" class="image" />
    <line x1="150" y1="250" x2="180" y2="300" class="image" />
    <line x1="150" y1="200" x2="100" y2="220" class="image" />
    <line x1="150" y1="200" x2="200" y2="220" class="image" />
  </g>
</svg>