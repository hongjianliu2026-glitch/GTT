<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">long-running</text>
  <text x="50" y="120" class="subtitle">[ˌlɔŋ ˈrʌnɪŋ] adj. 长时间运行的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> long (长) + run (跑) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个马拉松运动员在赛道上，"长时间奔跑(long-running)"，
    <tspan x="50" dy="25">他的耐力和坚持象征着长时间运行的任务或过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The long-running project finally came to an end.
  </text>
  <text x="50" y="310" class="content">
    这个长时间运行的项目终于结束了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <!-- Runner -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Finish line -->
    <line x1="300" y1="80" x2="300" y2="180" class="image" />
    <line x1="310" y1="80" x2="310" y2="180" class="image" />
  </g>
</svg>