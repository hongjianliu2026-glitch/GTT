<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kidding</text>
  <text x="50" y="120" class="subtitle">[ˈkɪdɪŋ] v. 开玩笑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kid (小山羊) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小山羊(kid)在草地上蹦蹦跳跳，
    <tspan x="50" dy="25">突然停下来，调皮地对你眨眼，仿佛在说：</tspan>
    <tspan x="50" dy="25">"我只是在开玩笑(kidding)啦！"</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Are you kidding me? That's hilarious!
  </text>
  <text x="50" y="310" class="content">
    你在开玩笑吧？太搞笑了！
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="180" width="350" height="20" class="image" fill="#27AE60" />
    <!-- Kid -->
    <circle cx="100" cy="150" r="30" class="image" fill="#F1C40F" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
    <line x1="100" y1="200" x2="120" y2="220" class="image" />
    <line x1="100" y1="190" x2="70" y2="180" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
    <!-- Winking eye -->
    <circle cx="85" cy="140" r="5" class="image" fill="#000" />
    <line x1="110" y1="140" x2="120" y2="140" class="image" />
  </g>
</svg>