<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clarinet</text>
  <text x="50" y="120" class="subtitle">[ˌklærəˈnɛt] n. 单簧管</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clar (清楚) + -inet (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小巧的单簧管(clarinet)，它的声音清晰(clar)
    <tspan x="50" dy="25">而明亮，就像清晨的第一缕阳光，穿透了薄雾。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clarinetist played a beautiful melody.
  </text>
  <text x="50" y="310" class="content">
    单簧管演奏者演奏了一首优美的旋律。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clarinet body -->
    <rect x="50" y="20" width="200" height="50" class="image" />
    <!-- Clarinet mouthpiece -->
    <rect x="40" y="20" width="10" height="50" class="image" />
    <!-- Clarinet keys -->
    <circle cx="100" cy="45" r="5" class="image" />
    <circle cx="120" cy="45" r="5" class="image" />
    <circle cx="140" cy="45" r="5" class="image" />
    <circle cx="160" cy="45" r="5" class="image" />
    <circle cx="180" cy="45" r="5" class="image" />
    <!-- Music notes -->
    <path d="M250,40 Q270,20 290,40 T330,40" class="image" />
    <path d="M250,60 Q270,40 290,60 T330,60" class="image" />
    <path d="M250,80 Q270,60 290,80 T330,80" class="image" />
  </g>
</svg>