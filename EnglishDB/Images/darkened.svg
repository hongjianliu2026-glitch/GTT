<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">darkened</text>
  <text x="50" y="120" class="subtitle">[ˈdɑːrkənd] adj. 变暗的，变黑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dark (黑暗) + -en (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间，原本明亮，但突然"使(en)"
    <tspan x="50" dy="25">变得黑暗(dark)，整个房间都变暗了(darkened)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room darkened as the sun set.
  </text>
  <text x="50" y="310" class="content">
    随着太阳落山，房间变暗了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Window -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Sun setting -->
    <circle cx="200" cy="100" r="30" class="image" fill="#FFD700" />
    <line x1="200" y1="130" x2="200" y2="200" class="image" />
    <!-- Darkened room -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#333333" opacity="0.5" />
  </g>
</svg>