<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dominance</text>
  <text x="50" y="120" class="subtitle">[ˈdɒmɪnəns] n. 优势，支配</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> domin (统治) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的国王坐在宝座上，"统治(domin)"
    <tspan x="50" dy="25">整个王国，展现出无与伦比的支配力(dominance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's dominance in the market is undeniable.
  </text>
  <text x="50" y="310" class="content">
    该公司在市场上的主导地位是毋庸置疑的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- King -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="120" y2="140" class="image" />
    <line x1="175" y1="150" x2="230" y2="140" class="image" />
    <!-- Crown -->
    <polyline points="155,70 175,50 195,70" class="image" />
    <line x1="155" y1="70" x2="195" y2="70" class="image" />
    <!-- Scepter -->
    <line x1="175" y1="180" x2="250" y2="100" class="image" />
  </g>
</svg>