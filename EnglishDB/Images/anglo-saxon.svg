<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Anglo-Saxon</text>
  <text x="50" y="120" class="subtitle">[ˈæŋɡloʊ ˈsæksən] n. 盎格鲁-撒克逊人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Anglo- (盎格鲁) + Saxon (撒克逊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群盎格鲁-撒克逊战士，"盎格鲁(Anglo)"
    <tspan x="50" dy="25">和"撒克逊(Saxon)"两个部落的勇士</tspan>
    <tspan x="50" dy="25">联合起来，形成了强大的盎格鲁-撒克逊人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Anglo-Saxon period is known for its rich literature.
  </text>
  <text x="50" y="310" class="content">
    盎格鲁-撒克逊时期以其丰富的文学而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <!-- Cross on the shield -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <!-- Helmet -->
    <polygon points="100,20 150,70 100,120 50,70" class="image" />
    <!-- Sword -->
    <line x1="220" y1="100" x2="350" y2="100" class="image" />
    <line x1="350" y1="100" x2="330" y2="80" class="image" />
    <line x1="350" y1="100" x2="330" y2="120" class="image" />
  </g>
</svg>