<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paddle</text>
  <text x="50" y="120" class="subtitle">[ˈpædl] n. 桨，划桨；v. 用桨划</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pad (脚掌) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸭子用它的"小脚掌(pad-le)"在水面上划动，
    <tspan x="50" dy="25">就像我们用桨(paddle)划船一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They paddled the canoe across the lake.
  </text>
  <text x="50" y="310" class="content">
    他们用桨划着独木舟穿过湖面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Canoe -->
    <rect x="150" y="50" width="100" height="30" class="image" fill="#D3D3D3" />
    <!-- Paddle -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <!-- Duck -->
    <circle cx="50" cy="150" r="15" class="image" fill="#FFD700" />
    <line x1="50" y1="165" x2="50" y2="185" class="image" />
    <line x1="50" y1="185" x2="40" y2="200" class="image" />
    <line x1="50" y1="185" x2="60" y2="200" class="image" />
  </g>
</svg>