<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ensemble</text>
  <text x="50" y="120" class="subtitle">[ɑːnˈsɒmb(ə)l] n. 全体，整体；合奏团</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (在...之中) + semble (一起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群音乐家"在一起(en-semble)"演奏，
    <tspan x="50" dy="25">他们的声音和乐器融合成一个和谐的整体(ensemble)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ensemble played a beautiful symphony.
  </text>
  <text x="50" y="310" class="content">
    合奏团演奏了一首美妙的交响乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Musicians -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Instruments -->
    <rect x="30" y="70" width="40" height="80" class="image" />
    <rect x="130" y="70" width="40" height="80" class="image" />
    <rect x="230" y="70" width="40" height="80" class="image" />
    <!-- Music notes -->
    <line x1="50" y1="160" x2="50" y2="200" class="image" />
    <line x1="150" y1="160" x2="150" y2="200" class="image" />
    <line x1="250" y1="160" x2="250" y2="200" class="image" />
    <circle cx="50" cy="180" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
  </g>
</svg>