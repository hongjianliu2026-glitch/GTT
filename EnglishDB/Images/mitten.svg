<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mitten</text>
  <text x="50" y="120" class="subtitle">[ˈmɪtn] n. 连指手套</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mit (来自古英语 myte，意为“手套”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的冬天，一只小猫戴着连指手套(mitten)，
    <tspan x="50" dy="25">手套的五个手指连在一起，像一只小爪子，温暖又可爱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore mittens to keep her hands warm.
  </text>
  <text x="50" y="310" class="content">
    她戴了连指手套来保暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mittens -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="160" y="0" width="150" height="100" class="image" />
    <!-- Cat -->
    <circle cx="80" cy="150" r="30" class="image" />
    <line x1="80" y1="180" x2="80" y2="220" class="image" />
    <line x1="80" y1="220" x2="50" y2="250" class="image" />
    <line x1="80" y1="220" x2="110" y2="250" class="image" />
    <line x1="80" y1="200" x2="120" y2="190" class="image" />
    <line x1="80" y1="200" x2="40" y2="190" class="image" />
    <!-- Mittens on cat's paws -->
    <rect x="50" y="180" width="60" height="30" class="image" />
    <rect x="110" y="180" width="60" height="30" class="image" />
  </g>
</svg>