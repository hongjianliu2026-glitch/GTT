<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">one-sided</text>
  <text x="50" y="120" class="subtitle">[ˈwʌnˈsaɪdɪd] adj. 片面的，单方面的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> one (一) + side (边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天平，只有一边放了重物，"一边(side)"
    <tspan x="50" dy="25">重，另一边轻，这就是片面的(one-sided)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The argument was one-sided, with only one person speaking.
  </text>
  <text x="50" y="310" class="content">
    这场辩论是片面的，只有一个人在说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="100" y1="50" x2="300" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <!-- Heavy side -->
    <rect x="150" y="60" width="100" height="50" class="image" />
    <!-- Light side -->
    <rect x="250" y="60" width="100" height="25" class="image" />
    <!-- Pointer -->
    <line x1="200" y1="150" x2="250" y2="200" class="image" />
  </g>
</svg>