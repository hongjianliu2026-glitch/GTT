<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">injustice</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdʒʌstɪs] n. 不公正，不公平</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + just (公正) + -ice (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，一边是正义(just)，另一边是不公正(in-just)，
    <tspan x="50" dy="25">天平倾斜，象征着不公正(injustice)的存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge condemned the injustice of the trial.
  </text>
  <text x="50" y="310" class="content">
    法官谴责了审判的不公正。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scales -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="20" y1="100" x2="80" y2="100" class="image" />
    <line x1="20" y1="100" x2="35" y2="80" class="image" />
    <line x1="20" y1="100" x2="35" y2="120" class="image" />
    <line x1="80" y1="100" x2="65" y2="80" class="image" />
    <line x1="80" y1="100" x2="65" y2="120" class="image" />
    <!-- Justice side -->
    <circle cx="35" cy="100" r="10" class="image" />
    <!-- Injustice side -->
    <circle cx="65" cy="100" r="10" class="image" />
    <line x1="65" y1="100" x2="65" y2="120" class="image" />
    <line x1="65" y1="120" x2="55" y2="130" class="image" />
    <line x1="65" y1="120" x2="75" y2="130" class="image" />
  </g>
</svg>