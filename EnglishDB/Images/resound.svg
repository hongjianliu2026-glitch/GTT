<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resound</text>
  <text x="50" y="120" class="subtitle">[rɪˈzaʊnd] v. 回响，回荡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sound (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山谷，声音"再次响起(re-sound)"，
    <tspan x="50" dy="25">回荡在整个山谷中，这就是resound的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The applause resounded through the hall.
  </text>
  <text x="50" y="310" class="content">
    掌声在大厅里回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 0 L200 200 Z" class="image" />
    <path d="M100 200 L200 0 L300 200 Z" class="image" />
    <path d="M200 200 L300 0 L400 200 Z" class="image" />
    <!-- Sound waves -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="40" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
  </g>
</svg>