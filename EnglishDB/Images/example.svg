<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">example</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzæmpl] n. 例子，范例</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + ample (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老师从一堆书里"拿出(ex-ample)"
    <tspan x="50" dy="25">一本书作为例子，这个例子就是example。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This is a good example of how to use the word.
  </text>
  <text x="50" y="310" class="content">
    这是一个如何使用这个词的好例子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Books -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <rect x="40" y="40" width="70" height="120" class="image" />
    <!-- Teacher -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Hand taking a book -->
    <line x1="200" y1="130" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="140" y2="60" class="image" />
    <line x1="150" y1="50" x2="160" y2="60" class="image" />
  </g>
</svg>