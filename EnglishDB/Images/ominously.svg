<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ominously</text>
  <text x="50" y="120" class="subtitle">[ˈɒmɪnəsli] adv. 不祥地，不吉利地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> omni- (所有) + -ous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑暗的夜晚，"所有(omni-)"的迹象都预示着
    <tspan x="50" dy="25">不祥(ous)的事情即将发生，这种感觉"不祥地(ominously)"笼罩着一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sky turned ominously dark before the storm.
  </text>
  <text x="50" y="310" class="content">
    暴风雨来临前，天空变得不祥地黑暗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Moon -->
    <circle cx="50" cy="50" r="20" class="image" fill="#F1C40F" />
    <!-- Clouds -->
    <ellipse cx="150" cy="50" rx="100" ry="30" class="image" fill="#7F8C8D" />
    <ellipse cx="250" cy="50" rx="100" ry="30" class="image" fill="#7F8C8D" />
    <!-- Lightning -->
    <line x1="100" y1="100" x2="200" y2="150" class="image" stroke="#F39C12" stroke-width="4" />
    <line x1="100" y1="150" x2="200" y2="100" class="image" stroke="#F39C12" stroke-width="4" />
  </g>
</svg>