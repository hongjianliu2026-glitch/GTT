<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ramble</text>
  <text x="50" y="120" class="subtitle">[ˈræmbl] v. 漫步，闲逛；n. 漫步</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ram (根) + ble (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在森林中"随意行走(ram-ble)"，
    <tspan x="50" dy="25">没有明确的目的地，只是享受漫步的乐趣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He loves to ramble through the woods on weekends.
  </text>
  <text x="50" y="310" class="content">
    他喜欢在周末漫步穿过树林。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path for walking -->
    <path d="M50 50 Q100 100 150 50 T250 100" class="image" />
    <!-- Person -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />
    <!-- Trees -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
    <line x1="120" y1="50" x2="120" y2="20" class="image" />
    <line x1="140" y1="50" x2="140" y2="20" class="image" />
  </g>
</svg>