<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loyal</text>
  <text x="50" y="120" class="subtitle">[ˈlɔɪəl] adj. 忠诚的，忠心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loy (法律，约束) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小狗，它被"法律(loy)"约束着，
    <tspan x="50" dy="25">始终忠诚地守护着它的主人，这就是"忠诚的(loyal)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a loyal friend who always stands by me.
  </text>
  <text x="50" y="310" class="content">
    她是一个忠诚的朋友，总是站在我这边。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="140" x2="20" y2="120" class="image" /> <!-- Tail -->
    <line x1="50" y1="140" x2="80" y2="120" class="image" /> <!-- Tail -->
    <!-- Chain -->
    <line x1="50" y1="100" x2="50" y2="20" class="image" />
    <circle cx="50" cy="20" r="10" class="image" />
    <!-- Owner -->
    <circle cx="150" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="150" y1="120" x2="150" y2="160" class="image" /> <!-- Body -->
    <line x1="150" y1="160" x2="130" y2="200" class="image" /> <!-- Leg -->
    <line x1="150" y1="160" x2="170" y2="200" class="image" /> <!-- Leg -->
    <line x1="150" y1="130" x2="120" y2="120" class="image" /> <!-- Arm -->
    <line x1="150" y1="130" x2="180" y2="120" class="image" /> <!-- Arm -->
  </g>
</svg>