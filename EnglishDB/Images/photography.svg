<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">photography</text>
  <text x="50" y="120" class="subtitle">[fəˈtɒɡrəfi] n. 摄影，摄影术</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> photo- (光) + graph (写) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摄影师在阳光下，"用光写下(photo-graph-y)"
    <tspan x="50" dy="25">美丽的瞬间，这些瞬间就构成了摄影(photography)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a passion for photography and loves capturing nature.
  </text>
  <text x="50" y="310" class="content">
    她对摄影充满热情，喜欢捕捉自然的美景。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <circle cx="100" cy="75" r="50" class="image" />
    <line x1="100" y1="125" x2="100" y2="150" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="75" r="30" class="image" />
    <!-- Photographer -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
  </g>
</svg>