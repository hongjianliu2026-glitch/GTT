<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neurologist</text>
  <text x="50" y="120" class="subtitle">[nʊəˈrɒlədʒɪst] n. 神经学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neuro- (神经) + logist (学者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神经学家(neurologist)在研究大脑，
    <tspan x="50" dy="25">他/她用显微镜观察神经(neuro-)的结构，</tspan>
    <tspan x="50" dy="25">试图理解大脑的奥秘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The neurologist diagnosed the patient's condition.
  </text>
  <text x="50" y="310" class="content">
    神经学家诊断了患者的病情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Microscope -->
    <rect x="180" y="50" width="100" height="100" class="image" />
    <line x1="230" y1="50" x2="230" y2="0" class="image" />
    <line x1="230" y1="0" x2="280" y2="0" class="image" />
    <line x1="280" y1="0" x2="280" y2="50" class="image" />
    <!-- Neurologist -->
    <circle cx="350" cy="100" r="15" class="image" />
    <line x1="350" y1="115" x2="350" y2="150" class="image" />
    <line x1="350" y1="150" x2="330" y2="180" class="image" />
    <line x1="350" y1="150" x2="370" y2="180" class="image" />
    <line x1="350" y1="130" x2="380" y2="120" class="image" />
  </g>
</svg>