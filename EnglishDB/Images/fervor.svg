<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fervor</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrvər] n. 热情，激情</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ferv (热) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人心中燃起熊熊烈火，"热情如火(ferv-or)"，
    <tspan x="50" dy="25">这种炽热的情感就是fervor。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His fervor for the project was contagious.
  </text>
  <text x="50" y="310" class="content">
    他对这个项目的热情具有感染力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M 50 100 C 50 50, 150 50, 150 100 C 150 150, 50 150, 50 100" class="image" />
    <!-- Flame -->
    <polygon points="100,50 120,100 140,50 160,100 180,50 150,150 100,150" class="image" />
    <!-- Flame -->
    <polygon points="100,70 120,120 140,70 160,120 180,70 150,170 100,170" class="image" />
    <!-- Flame -->
    <polygon points="100,90 120,140 140,90 160,140 180,90 150,190 100,190" class="image" />
  </g>
</svg>