<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">saucepan</text>
  <text x="50" y="120" class="subtitle">[ˈsɔːspən] n. 长柄平底锅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sauce (酱汁) + pan (锅)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，用"酱汁锅(saucepan)"
    <tspan x="50" dy="25">翻炒着美味的酱汁，香气四溢。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stirred the sauce in a saucepan over the stove.
  </text>
  <text x="50" y="310" class="content">
    她在炉子上用长柄平底锅搅拌酱汁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Saucepan -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="130" y2="180" class="image" />
    <!-- Sauce -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="120" cy="40" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="160" r="15" class="image" />
    <line x1="20" y1="175" x2="20" y2="210" class="image" />
    <line x1="20" y1="210" x2="0" y2="240" class="image" />
    <line x1="20" y1="210" x2="40" y2="240" class="image" />
    <line x1="20" y1="190" x2="50" y2="180" class="image" />
  </g>
</svg>