<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moustache</text>
  <text x="50" y="120" class="subtitle">[məˈstɑːʃ] n. 胡子，髭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> moust (嘴) + ache (疼痛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为嘴上长了胡子(moustache)，
    <tspan x="50" dy="25">结果吃饭时胡子总是碰到食物，感到"疼痛(ache)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He grew a moustache for the costume party.
  </text>
  <text x="50" y="310" class="content">
    他为了化装舞会留了胡子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Nose -->
    <path d="M100,100 Q120,120 100,140" class="image" />
    <!-- Mouth -->
    <path d="M70,150 Q100,170 130,150" class="image" />
    <!-- Moustache -->
    <path d="M50,120 Q100,100 150,120" class="image" />
    <path d="M50,130 Q100,110 150,130" class="image" />
  </g>
</svg>