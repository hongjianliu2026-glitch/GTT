<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .almond { fill: #D4AC0D; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">almond</text>
  <text x="50" y="120" class="subtitle">[ˈɑːmənd] n. 杏仁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> amygd- (杏仁) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的杏仁(amygd-)形状的星球，
    <tspan x="50" dy="25">上面长满了杏仁树，每棵树上都挂满了杏仁(almond)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to snack on almonds during her break.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在休息时吃杏仁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Almond planet -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="almond" />
    <!-- Almond trees -->
    <line x1="50" y1="200" x2="50" y2="150" class="image" />
    <line x1="100" y1="200" x2="100" y2="150" class="image" />
    <line x1="150" y1="200" x2="150" y2="150" class="image" />
    <line x1="200" y1="200" x2="200" y2="150" class="image" />
    <line x1="250" y1="200" x2="250" y2="150" class="image" />
    <!-- Almonds -->
    <ellipse cx="50" cy="140" rx="10" ry="15" class="almond" />
    <ellipse cx="100" cy="140" rx="10" ry="15" class="almond" />
    <ellipse cx="150" cy="140" rx="10" ry="15" class="almond" />
    <ellipse cx="200" cy="140" rx="10" ry="15" class="almond" />
    <ellipse cx="250" cy="140" rx="10" ry="15" class="almond" />
  </g>
</svg>