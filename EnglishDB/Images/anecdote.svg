<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anecdote</text>
  <text x="50" y="120" class="subtitle">[ˈænɪkdəʊt] n. 轶事，趣闻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (不) + ecd (出来) + ote (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个不为人知的故事("不(an)-出来(ecd)-说(ote)")，
    <tspan x="50" dy="25">突然被讲述出来，成为了一个有趣的轶事(anecdote)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He shared an amusing anecdote about his childhood.
  </text>
  <text x="50" y="310" class="content">
    他分享了一个关于他童年的有趣轶事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Speech bubble -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" />
    <path d="M250 50 L270 30 L250 10 L230 30 Z" class="image" />
    <!-- Storyteller -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Lightning bolt -->
    <path d="M50 200 L150 100 L50 150 Z" class="image" />
  </g>
</svg>