<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Audubon</text>
  <text x="50" y="120" class="subtitle">[ˈɔːdəbən] n. 奥杜邦（人名），指约翰·詹姆斯·奥杜邦，美国鸟类学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aud (听) + -on (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个名叫奥杜邦的人，他"倾听(aud)"
    <tspan x="50" dy="25">大自然的声音，尤其是鸟类的鸣叫，</tspan>
    <tspan x="50" dy="25">最终成为了一位著名的鸟类学家。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Audubon's paintings of birds are renowned worldwide.
  </text>
  <text x="50" y="310" class="content">
    奥杜邦的鸟类画作闻名世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="20" y2="130" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Ears -->
    <circle cx="30" cy="90" r="5" class="image" />
    <circle cx="70" cy="90" r="5" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Ears -->
    <circle cx="130" cy="90" r="5" class="image" />
    <circle cx="170" cy="90" r="5" class="image" />
    <!-- Connection -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
  </g>
</svg>