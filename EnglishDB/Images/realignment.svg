<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">realignment</text>
  <text x="50" y="120" class="subtitle">[ˌriːəˈlaɪnmənt] n. 重新排列，重新对齐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + align (对齐) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个混乱的拼图被"再次对齐(re-align)"，
    <tspan x="50" dy="25">每一块都回到了正确的位置，拼图变得完美无缺。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team had to undergo a realignment to improve efficiency.
  </text>
  <text x="50" y="310" class="content">
    团队必须进行重新调整以提高效率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="110" x2="170" y2="110" class="image" />
    <line x1="170" y1="110" x2="170" y2="230" class="image" />
    <line x1="170" y1="230" x2="50" y2="230" class="image" />
    <line x1="50" y1="230" x2="50" y2="110" class="image" />
    <line x1="290" y1="110" x2="410" y2="110" class="image" />
    <line x1="410" y1="110" x2="410" y2="230" class="image" />
    <line x1="410" y1="230" x2="290" y2="230" class="image" />
    <line x1="290" y1="230" x2="290" y2="110" class="image" />
    <!-- Realigned puzzle -->
    <rect x="400" y="0" width="100" height="100" class="image" />
    <rect x="520" y="0" width="100" height="100" class="image" />
    <rect x="640" y="0" width="100" height="100" class="image" />
    <rect x="400" y="120" width="100" height="100" class="image" />
    <rect x="520" y="120" width="100" height="100" class="image" />
    <rect x="640" y="120" width="100" height="100" class="image" />
  </g>
</svg>