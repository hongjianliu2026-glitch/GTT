<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diverge</text>
  <text x="50" y="120" class="subtitle">[daɪˈvɜːrdʒ] v. 分歧，偏离</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + verg (转向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两条原本平行的道路，突然"分开转向(di-verg)"，
    <tspan x="50" dy="25">它们的方向开始分歧，这就是diverge的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two paths diverge at the fork in the road.
  </text>
  <text x="50" y="310" class="content">
    两条路在岔路口分道扬镳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
    <!-- Diverging paths -->
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <line x1="250" y1="100" x2="300" y2="50" class="image" />
    <line x1="250" y1="150" x2="300" y2="200" class="image" />
    <!-- Fork in the road -->
    <circle cx="175" cy="125" r="10" class="image" />
    <circle cx="275" cy="125" r="10" class="image" />
  </g>
</svg>