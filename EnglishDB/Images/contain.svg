<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contain</text>
  <text x="50" y="120" class="subtitle">[kənˈteɪn] v. 包含，容纳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tain (保持)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的盒子，"一起保持(con-tain)"
    <tspan x="50" dy="25">着各种物品，这些物品都被盒子包含(contain)在内。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The box contains all my childhood memories.
  </text>
  <text x="50" y="310" class="content">
    这个盒子包含了我的所有童年记忆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Items inside the box -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <line x1="180" y1="30" x2="220" y2="70" class="image" />
    <line x1="220" y1="30" x2="180" y2="70" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
  </g>
</svg>