<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">duet</text>
  <text x="50" y="120" class="subtitle">[djuːˈet] n. 二重唱，二重奏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> du- (二) + et (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个音乐家在舞台上，"二重奏(du-et)"
    <tspan x="50" dy="25">他们的和谐旋律让人陶醉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They performed a beautiful duet at the concert.
  </text>
  <text x="50" y="310" class="content">
    他们在音乐会上表演了一首美妙的二重唱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Musician 1 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Musician 2 -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Music notes -->
    <path d="M200,80 Q220,60 240,80 T280,80" class="image" />
    <path d="M210,100 Q230,80 250,100 T290,100" class="image" />
    <path d="M220,120 Q240,100 260,120 T300,120" class="image" />
  </g>
</svg>