<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ta</text>
  <text x="50" y="120" class="subtitle">[tɑː] n. 他/她/它 (中文中的第三人称代词)</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，为中文中的第三人称代词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的影子，"他/她/它(ta)"
    <tspan x="50" dy="25">在黑暗中悄然出现，代表着未知的第三人称。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Ta is always there, watching silently.
  </text>
  <text x="50" y="310" class="content">
    他/她/它总是在那里，默默地注视着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shadow figure -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <!-- Eyes -->
    <circle cx="130" cy="90" r="10" class="image" />
    <circle cx="220" cy="90" r="10" class="image" />
    <!-- Mouth -->
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
  </g>
</svg>