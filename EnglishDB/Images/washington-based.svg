<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Washington-based</text>
  <text x="50" y="120" class="subtitle">[ˈwɒʃɪŋtən beɪst] adj. 位于华盛顿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Washington (华盛顿) + based (基于)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的华盛顿纪念碑，"基于(based)"
    <tspan x="50" dy="25">华盛顿的地理位置，象征着一切与华盛顿相关的事物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is Washington-based and focuses on policy research.
  </text>
  <text x="50" y="310" class="content">
    这家公司位于华盛顿，专注于政策研究。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Washington Monument -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="170" y1="20" x2="180" y2="20" class="image" />
    <line x1="170" y1="180" x2="180" y2="180" class="image" />
    <line x1="170" y1="100" x2="180" y2="100" class="image" />
    <line x1="170" y1="140" x2="180" y2="140" class="image" />
    <line x1="170" y1="60" x2="180" y2="60" class="image" />
    <line x1="170" y1="160" x2="180" y2="160" class="image" />
    <line x1="170" y1="40" x2="180" y2="40" class="image" />
    <line x1="170" y1="80" x2="180" y2="80" class="image" />
    <line x1="170" y1="120" x2="180" y2="120" class="image" />
  </g>
</svg>