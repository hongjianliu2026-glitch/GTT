<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vis-a-vis</text>
  <text x="50" y="120" class="subtitle">[ˌviːzəˈviː] prep. 面对面；adv. 面对面地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vis (看) + a (连接词) + vis (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面坐着，互相看着(vis-a-vis)，
    <tspan x="50" dy="25">这种面对面的交流方式让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They discussed the project vis-a-vis in the meeting room.
  </text>
  <text x="50" y="310" class="content">
    他们在会议室里面对面地讨论了这个项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="120" y1="100" x2="280" y2="100" class="image" />
    <!-- Table -->
    <rect x="50" y="120" width="300" height="50" class="image" />
    <!-- Eyes -->
    <circle cx="110" cy="90" r="5" class="image" />
    <circle cx="290" cy="90" r="5" class="image" />
  </g>
</svg>