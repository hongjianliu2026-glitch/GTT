<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cusp</text>
  <text x="50" y="120" class="subtitle">[kʌsp] n. 尖端，尖顶；v. 达到顶点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cus- (尖) + p (表示位置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山峰，"尖端(cus-)"
    <tspan x="50" dy="25">在阳光下闪耀，这就是尖顶(cusp)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The climber reached the cusp of the mountain.
  </text>
  <text x="50" y="310" class="content">
    登山者到达了山峰的尖顶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Sun -->
    <circle cx="225" cy="50" r="30" class="image" />
    <!-- Cusp -->
    <line x1="150" y1="0" x2="150" y2="20" class="image" />
    <line x1="140" y1="10" x2="160" y2="10" class="image" />
    <line x1="145" y1="15" x2="155" y2="15" class="image" />
  </g>
</svg>