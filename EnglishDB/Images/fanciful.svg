<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fanciful</text>
  <text x="50" y="120" class="subtitle">[ˈfænsɪfəl] adj. 富于幻想的，奇特的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fancy (幻想) + -ful (充满...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满幻想的艺术家，"充满幻想(fancy-ful)"
    <tspan x="50" dy="25">地创作出奇特的画作，这些画作充满了奇思妙想。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The writer's fanciful descriptions made the story come alive.
  </text>
  <text x="50" y="310" class="content">
    作家富于幻想的描述让故事栩栩如生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Canvas -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Imaginary elements -->
    <circle cx="100" cy="80" r="20" class="image" />
    <rect x="150" y="60" width="40" height="40" class="image" />
    <line x1="200" y1="60" x2="240" y2="100" class="image" />
    <line x1="200" y1="100" x2="240" y2="60" class="image" />
  </g>
</svg>