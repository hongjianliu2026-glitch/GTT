<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reluctantly</text>
  <text x="50" y="120" class="subtitle">[rɪˈlʌktəntli] adv. 不情愿地，勉强地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + luct (斗争) + -ant (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被拖着走，"向后斗争(re-luct)"，
    <tspan x="50" dy="25">表现出不情愿的样子，这就是reluctantly。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He reluctantly agreed to help us.
  </text>
  <text x="50" y="310" class="content">
    他勉强同意帮助我们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being dragged -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Hand pulling -->
    <line x1="100" y1="140" x2="150" y2="140" class="image" />
    <line x1="150" y1="140" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <!-- Arrows showing resistance -->
    <line x1="50" y1="100" x2="30" y2="80" class="image" />
    <line x1="50" y1="100" x2="70" y2="80" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
  </g>
</svg>