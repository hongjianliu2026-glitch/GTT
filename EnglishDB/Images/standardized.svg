<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">standardized</text>
  <text x="50" y="120" class="subtitle">[ˈstændərdaɪzd] adj. 标准化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stand (站立) + ard (名词后缀) + ize (使...) + d (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人排成一列，"站立(stand)"
    <tspan x="50" dy="25">在同一个标准(ard)下，被"使(ize)"成</tspan>
    <tspan x="50" dy="25">一致的形态，这就是"标准化的(standardized)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has standardized its production process.
  </text>
  <text x="50" y="310" class="content">
    公司已经标准化了其生产流程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People standing in a line -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <circle cx="100" cy="20" r="15" class="image" />
    <circle cx="150" cy="20" r="15" class="image" />
    <circle cx="200" cy="20" r="15" class="image" />
    <circle cx="250" cy="20" r="15" class="image" />
    <circle cx="300" cy="20" r="15" class="image" />
    <!-- Standard line -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <text x="150" y="70" class="content">Standard</text>
  </g>
</svg>