<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dairy</text>
  <text x="50" y="120" class="subtitle">[ˈdɛri] n. 乳制品，奶牛场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "dārius"，意为 "属于牛的"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个奶牛场，奶牛们正在生产牛奶，
    <tspan x="50" dy="25">这些牛奶被加工成各种乳制品，如奶酪和黄油。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She buys her dairy products from the local farm.
  </text>
  <text x="50" y="310" class="content">
    她从当地的农场购买乳制品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cow -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="50" cy="70" r="20" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="120" x2="80" y2="110" class="image" />
    <line x1="50" y1="120" x2="20" y2="110" class="image" />

    <!-- Milk -->
    <rect x="120" y="80" width="50" height="100" class="image" />
    <line x1="145" y1="80" x2="145" y2="180" class="image" />
    <line x1="120" y1="100" x2="170" y2="100" class="image" />
    <line x1="120" y1="120" x2="170" y2="120" class="image" />
    <line x1="120" y1="140" x2="170" y2="140" class="image" />
    <line x1="120" y1="160" x2="170" y2="160" class="image" />

    <!-- Cheese -->
    <rect x="200" y="100" width="50" height="50" class="image" />
    <line x1="225" y1="100" x2="225" y2="150" class="image" />
    <line x1="200" y1="125" x2="250" y2="125" class="image" />
    <line x1="200" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>