<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trample</text>
  <text x="50" y="120" class="subtitle">[ˈtræmpl] v. 践踏，踩坏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tramp (踩) + -le (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头大象在草地上"反复踩踏(tramp-le)"，
    <tspan x="50" dy="25">草地被踩得一片狼藉，这就是践踏(trample)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The elephant trampled the flowers in the garden.
  </text>
  <text x="50" y="310" class="content">
    大象践踏了花园里的花。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Elephant -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="210" class="image" />
    <line x1="100" y1="180" x2="130" y2="210" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <!-- Trample effect -->
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <line x1="50" y1="160" x2="150" y2="160" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
  </g>
</svg>