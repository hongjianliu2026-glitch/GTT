<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">credo</text>
  <text x="50" y="120" class="subtitle">[ˈkriːdoʊ] n. 信条，信念</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cred (相信) + -o (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高台上，手持一本厚重的书，书上写着"相信(cred)"，
    <tspan x="50" dy="25">这就是他的信条(credo)，他坚定不移地遵循着。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His credo is to always tell the truth.
  </text>
  <text x="50" y="310" class="content">
    他的信条是永远说实话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="140" x2="120" y2="130" class="image" />
    <line x1="175" y1="140" x2="230" y2="130" class="image" />
    <!-- Book -->
    <rect x="150" y="50" width="50" height="40" class="image" />
    <line x1="155" y1="55" x2="195" y2="55" class="image" />
    <line x1="155" y1="70" x2="195" y2="70" class="image" />
    <line x1="155" y1="85" x2="195" y2="85" class="image" />
    <!-- Text on book -->
    <text x="155" y="75" class="content" style="font-size: 12px;">cred</text>
  </g>
</svg>