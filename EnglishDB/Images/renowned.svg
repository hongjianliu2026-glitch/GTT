<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">renowned</text>
  <text x="50" y="120" class="subtitle">[rɪˈnaʊnd] adj. 著名的，有声望的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + noun (名字)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个名人，他的名字被"再次提及(re-noun)"，
    <tspan x="50" dy="25">因为他太有名了，人们总是不断提起他，</tspan>
    <tspan x="50" dy="25">这就是"著名的(renowned)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a renowned scientist in her field.
  </text>
  <text x="50" y="310" class="content">
    她是她领域内著名的科学家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="50,5 61,35 98,35 68,55 79,85 50,65 21,85 32,55 2,35 39,35" class="image" />
    <!-- Name tag -->
    <rect x="100" y="20" width="150" height="50" class="image" />
    <text x="120" y="50" class="content">John Doe</text>
    <!-- Speech bubble -->
    <path d="M200,100 Q250,100 250,150 Q200,150 200,200" class="image" />
    <text x="210" y="140" class="content">John Doe!</text>
  </g>
</svg>