<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dutifully</text>
  <text x="50" y="120" class="subtitle">[ˈduːtɪfəli] adv. 尽职地，忠实地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> duty (职责) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵在战场上，"尽职地(dutifully)"
    <tspan x="50" dy="25">执行任务，即使面对危险也毫不退缩。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She dutifully completed all her assignments on time.
  </text>
  <text x="50" y="310" class="content">
    她尽职地按时完成了所有作业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="100" x2="100" y2="80" class="image" />
    <line x1="50" y1="100" x2="0" y2="80" class="image" />
    <!-- Flag -->
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <line x1="50" y1="0" x2="30" y2="20" class="image" />
    <line x1="50" y1="0" x2="70" y2="20" class="image" />
    <!-- Danger sign -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="70" x2="150" y2="130" class="image" />
    <line x1="130" y1="100" x2="170" y2="100" class="image" />
  </g>
</svg>