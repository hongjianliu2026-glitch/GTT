<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">caper</text>
  <text x="50" y="120" class="subtitle">[ˈkeɪpər] n. 跳跃，嬉戏；v. 跳跃，嬉戏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> caper (源自拉丁语 "capere"，意为"抓住")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在房间里"抓住(caper)"机会，
    <tspan x="50" dy="25">不停地跳跃和嬉戏，充满了活力和欢乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kitten loved to caper around the house.
  </text>
  <text x="50" y="310" class="content">
    小猫喜欢在家里跳跃嬉戏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Back leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Front leg -->
    <line x1="50" y1="130" x2="30" y2="140" class="image" /> <!-- Tail -->
    <line x1="50" y1="130" x2="70" y2="140" class="image" /> <!-- Tail -->
    <!-- Jumping motion -->
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
  </g>
</svg>