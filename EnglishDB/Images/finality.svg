<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">finality</text>
  <text x="50" y="120" class="subtitle">[faɪˈnælɪti] n. 终结，结局</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fin (结束) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟表，指针指向"结束(fin)"的瞬间，
    <tspan x="50" dy="25">象征着一切的终结(finality)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The finality of his decision was clear to everyone.
  </text>
  <text x="50" y="310" class="content">
    他的决定的终结性对每个人来说都是显而易见的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="150" cy="150" r="140" class="image" />
    <!-- Clock hands -->
    <line x1="150" y1="150" x2="150" y2="30" class="image" />
    <line x1="150" y1="150" x2="270" y2="150" class="image" />
    <!-- Final moment -->
    <circle cx="150" cy="30" r="10" class="image" fill="#FF5733" />
  </g>
</svg>