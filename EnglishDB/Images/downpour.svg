<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .rain { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">downpour</text>
  <text x="50" y="120" class="subtitle">[ˈdaʊnpɔːr] n. 倾盆大雨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> down (向下) + pour (倒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象天空像一个巨大的水壶，"向下倒(down-pour)"
    <tspan x="50" dy="25">出大量的水，形成倾盆大雨(downpour)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The downpour soaked everyone at the outdoor concert.
  </text>
  <text x="50" y="310" class="content">
    倾盆大雨让户外音乐会的每个人都湿透了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Rain drops -->
    <line x1="50" y1="120" x2="50" y2="200" class="rain" />
    <line x1="100" y1="120" x2="100" y2="200" class="rain" />
    <line x1="150" y1="120" x2="150" y2="200" class="rain" />
    <line x1="200" y1="120" x2="200" y2="200" class="rain" />
    <line x1="250" y1="120" x2="250" y2="200" class="rain" />
    <line x1="300" y1="120" x2="300" y2="200" class="rain" />
  </g>
</svg>