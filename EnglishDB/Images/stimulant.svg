<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stimulant</text>
  <text x="50" y="120" class="subtitle">[ˈstɪmjələnt] n. 兴奋剂，刺激物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stimul (刺激) + -ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人喝了一杯咖啡，"刺激(stimul)"
    <tspan x="50" dy="25">他的大脑，让他变得非常兴奋，这就是一种刺激物(stimulant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Coffee is a common stimulant that helps people stay awake.
  </text>
  <text x="50" y="310" class="content">
    咖啡是一种常见的兴奋剂，帮助人们保持清醒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee cup -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <circle cx="50" cy="110" r="10" class="image" />
    <!-- Brain -->
    <circle cx="200" cy="50" r="40" class="image" />
    <line x1="180" y1="70" x2="220" y2="70" class="image" />
    <line x1="180" y1="90" x2="220" y2="90" class="image" />
    <line x1="180" y1="110" x2="220" y2="110" class="image" />
    <!-- Exclamation marks -->
    <text x="200" y="150" class="image" font-size="40" fill="#C0392B">!</text>
    <text x="220" y="150" class="image" font-size="40" fill="#C0392B">!</text>
    <text x="240" y="150" class="image" font-size="40" fill="#C0392B">!</text>
  </g>
</svg>