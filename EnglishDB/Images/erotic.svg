<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">erotic</text>
  <text x="50" y="120" class="subtitle">[ɪˈrɒtɪk] adj. 色情的，性感的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eros (爱神) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象爱神(Eros)手持弓箭，射出一支"爱之箭"，
    <tspan x="50" dy="25">这支箭带着强烈的情感和欲望，让人感到色情(erotic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was criticized for its erotic scenes.
  </text>
  <text x="50" y="310" class="content">
    这部电影因其色情场景而受到批评。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eros with bow and arrow -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <line x1="50" y1="120" x2="100" y2="120" class="image" /> <!-- Bow -->
    <line x1="100" y1="120" x2="150" y2="120" class="image" /> <!-- Arrow -->
  </g>
</svg>