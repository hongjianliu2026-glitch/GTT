<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">regain</text>
  <text x="50" y="120" class="subtitle">[rɪˈɡeɪn] v. 重新获得，恢复</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + gain (获得)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在丢失了钥匙后，"再次获得(re-gain)"
    <tspan x="50" dy="25">了钥匙，脸上露出了满意的笑容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He finally regained his confidence after the failure.
  </text>
  <text x="50" y="310" class="content">
    他在失败后终于重新找回了自信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lost key -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="70" class="image" />
    <line x1="100" y1="70" x2="50" y2="70" class="image" />
    <line x1="50" y1="70" x2="50" y2="20" class="image" />
    <line x1="75" y1="70" x2="75" y2="100" class="image" />
    <line x1="75" y1="100" x2="50" y2="120" class="image" />
    <line x1="75" y1="100" x2="100" y2="120" class="image" />

    <!-- Regained key -->
    <line x1="200" y1="20" x2="250" y2="20" class="image" />
    <line x1="250" y1="20" x2="250" y2="70" class="image" />
    <line x1="250" y1="70" x2="200" y2="70" class="image" />
    <line x1="200" y1="70" x2="200" y2="20" class="image" />
    <line x1="225" y1="70" x2="225" y2="100" class="image" />
    <line x1="225" y1="100" x2="200" y2="120" class="image" />
    <line x1="225" y1="100" x2="250" y2="120" class="image" />

    <!-- Person -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="250" class="image" />
    <line x1="150" y1="220" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="120" y2="180" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />

    <!-- Smile -->
    <path d="M140 160 Q150 165 160 160" class="image" />
  </g>
</svg>