<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">county</text>
  <text x="50" y="120" class="subtitle">[ˈkaʊnti] n. 郡，县</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> count (伯爵) + -y (表示地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的伯爵(count)统治着一个地方(-y)，
    <tspan x="50" dy="25">这个地方就是他的郡(county)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The county fair is held every year.
  </text>
  <text x="50" y="310" class="content">
    郡里的集市每年都会举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- County boundary -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Castle -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="60" y="30" width="80" height="80" class="image" />
    <rect x="70" y="40" width="60" height="60" class="image" />
    <!-- Flag -->
    <line x1="100" y1="20" x2="100" y2="0" class="image" />
    <rect x="100" y="0" width="50" height="20" class="image" />
    <!-- Fields -->
    <line x1="160" y1="120" x2="300" y2="120" class="image" />
    <line x1="160" y1="140" x2="300" y2="140" class="image" />
    <line x1="160" y1="160" x2="300" y2="160" class="image" />
    <line x1="160" y1="180" x2="300" y2="180" class="image" />
  </g>
</svg>