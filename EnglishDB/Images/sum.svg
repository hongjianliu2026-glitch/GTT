<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sum</text>
  <text x="50" y="120" class="subtitle">[sʌm] n. 总数，金额；v. 总结，合计</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sum (拉丁语，表示“总数”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“1000”被放在一个金色的宝箱里，
    <tspan x="50" dy="25">这个宝箱象征着“总数(sum)”，里面装满了财富和价值。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sum of all the numbers is 1000.
  </text>
  <text x="50" y="310" class="content">
    所有数字的总和是1000。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Golden chest -->
    <rect x="0" y="0" width="200" height="150" class="image" stroke="#D4AF37" fill="#FFD700" />
    <!-- Lock -->
    <rect x="90" y="100" width="20" height="30" class="image" stroke="#000" fill="#C0C0C0" />
    <!-- Number "1000" -->
    <text x="50" y="100" class="content" fill="#000" font-size="60">1000</text>
  </g>
</svg>