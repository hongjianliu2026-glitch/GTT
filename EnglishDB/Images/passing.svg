<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">passing</text>
  <text x="50" y="120" class="subtitle">[ˈpæsɪŋ] adj. 经过的，短暂的；n. 通过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pass (通过) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆火车"通过(pass)"一个隧道，
    <tspan x="50" dy="25">瞬间即逝，这就是"passing"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The passing train made a loud noise.
  </text>
  <text x="50" y="310" class="content">
    经过的火车发出了很大的噪音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tunnel -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Train -->
    <rect x="50" y="50" width="250" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <circle cx="190" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
  </g>
</svg>