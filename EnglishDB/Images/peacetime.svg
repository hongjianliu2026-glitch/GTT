<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peacetime</text>
  <text x="50" y="120" class="subtitle">[ˈpiːstaɪm] n. 和平时期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peace (和平) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宁静的村庄，"和平(peace)"
    <tspan x="50" dy="25">笼罩着整个"时间(time)"，人们安居乐业，</tspan>
    <tspan x="50" dy="25">这就是和平时期(peacetime)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers were trained for both wartime and peacetime duties.
  </text>
  <text x="50" y="310" class="content">
    士兵们接受了战时和和平时期任务的训练。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Peace symbol -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="100" y1="100" x2="50" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <!-- Village -->
    <rect x="200" y="50" width="150" height="100" class="image" />
    <line x1="220" y1="70" x2="220" y2="150" class="image" />
    <line x1="240" y1="70" x2="240" y2="150" class="image" />
    <line x1="260" y1="70" x2="260" y2="150" class="image" />
    <line x1="280" y1="70" x2="280" y2="150" class="image" />
    <line x1="300" y1="70" x2="300" y2="150" class="image" />
    <line x1="320" y1="70" x2="320" y2="150" class="image" />
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <line x1="70" y1="30" x2="85" y2="15" class="image" />
    <line x1="80" y1="50" x2="100" y2="50" class="image" />
    <line x1="70" y1="70" x2="85" y2="85" class="image" />
    <line x1="50" y1="80" x2="50" y2="100" class="image" />
    <line x1="30" y1="70" x2="15" y2="85" class="image" />
    <line x1="20" y1="50" x2="0" y2="50" class="image" />
    <line x1="30" y1="30" x2="15" y2="15" class="image" />
  </g>
</svg>