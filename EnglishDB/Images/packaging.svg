<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">packaging</text>
  <text x="50" y="120" class="subtitle">[ˈpækɪdʒɪŋ] n. 包装</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pack (打包) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人正在"打包(pack)"商品，
    <tspan x="50" dy="25">将它们整齐地放入盒子中，这个过程就是包装(packaging)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company focuses on eco-friendly packaging.
  </text>
  <text x="50" y="310" class="content">
    该公司专注于环保包装。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Product -->
    <circle cx="50" cy="75" r="20" class="image" />
    <!-- Worker -->
    <circle cx="150" cy="75" r="15" class="image" />
    <line x1="150" y1="90" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="105" x2="180" y2="95" class="image" />
  </g>
</svg>