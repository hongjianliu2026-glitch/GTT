<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">miscellaneous</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsəˈleɪniəs] adj. 混杂的，各种各样的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (混合) + cell (小房间) + -aneous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的仓库，里面有无数个小房间(cell)，
    <tspan x="50" dy="25">每个房间里都装满了不同种类的东西，</tspan>
    <tspan x="50" dy="25">这些房间混合在一起(mis-)，</tspan>
    <tspan x="50" dy="25">形成了一个杂乱无章的场景，</tspan>
    <tspan x="50" dy="25">这就是miscellaneous(混杂的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="320" class="content">
    <tspan class="highlight">例句:</tspan> The box contained miscellaneous items like pens, keys, and coins.
  </text>
  <text x="50" y="350" class="content">
    盒子里装着各种各样的物品，如笔、钥匙和硬币。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warehouse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Small rooms -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Items in rooms -->
    <circle cx="75" cy="45" r="10" class="image" />
    <line x1="145" y1="45" x2="165" y2="45" class="image" />
    <line x1="215" y1="45" x2="235" y2="45" class="image" />
    <line x1="285" y1="45" x2="305" y2="45" class="image" />
  </g>
</svg>