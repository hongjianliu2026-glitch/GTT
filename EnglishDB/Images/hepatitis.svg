<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hepatitis</text>
  <text x="50" y="120" class="subtitle">[ˌhɛpəˈtaɪtɪs] n. 肝炎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hepat- (肝) + -itis (炎症)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个肝脏(hepat-)因为炎症(-itis)而变得红肿，
    <tspan x="50" dy="25">就像一个被感染的肝脏在痛苦地膨胀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Hepatitis can be caused by viruses or excessive alcohol consumption.
  </text>
  <text x="50" y="310" class="content">
    肝炎可以由病毒或过量饮酒引起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Liver shape -->
    <path d="M50,50 Q100,20 150,50 T250,100 L250,150 Q200,200 150,150 T50,100 Z" class="image" fill="#F1C40F" />
    <!-- Inflamed areas -->
    <circle cx="100" cy="70" r="20" class="image" fill="#E74C3C" />
    <circle cx="200" cy="120" r="20" class="image" fill="#E74C3C" />
    <!-- Inflammation symbol -->
    <text x="100" y="200" class="content" fill="#E74C3C">Inflammation</text>
  </g>
</svg>