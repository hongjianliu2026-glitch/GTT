<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #A52A2A; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF4500; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">furnace</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrnɪs] n. 熔炉，火炉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> furn (火) + -ace (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的熔炉(furnace)，里面燃烧着熊熊烈火，
    <tspan x="50" dy="25">火光冲天，仿佛要将一切融化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The blacksmith heated the metal in the furnace.
  </text>
  <text x="50" y="310" class="content">
    铁匠在熔炉中加热金属。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Furnace -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fire -->
    <circle cx="50" cy="100" r="30" class="fire" />
    <circle cx="80" cy="120" r="25" class="fire" />
    <circle cx="60" cy="140" r="20" class="fire" />
    <circle cx="100" cy="110" r="30" class="fire" />
    <circle cx="130" cy="130" r="25" class="fire" />
    <circle cx="110" cy="150" r="20" class="fire" />
    <!-- Smoke -->
    <line x1="150" y1="20" x2="170" y2="0" class="image" />
    <line x1="160" y1="40" x2="180" y2="20" class="image" />
    <line x1="170" y1="60" x2="190" y2="40" class="image" />
  </g>
</svg>