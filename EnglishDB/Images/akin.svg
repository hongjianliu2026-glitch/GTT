<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">akin</text>
  <text x="50" y="120" class="subtitle">[əˈkɪn] adj. 类似的，同类的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (表强调) + kin (亲属)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个相似的生物，"强调(a-)"
    <tspan x="50" dy="25">它们就像"亲属(kin)"一样，有着相似的特征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two ideas are akin to each other.
  </text>
  <text x="50" y="310" class="content">
    这两个想法彼此相似。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two similar creatures -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Lines connecting them -->
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="80" y1="130" x2="120" y2="130" class="image" />
    <line x1="80" y1="70" x2="120" y2="70" class="image" />
    <!-- Text annotation -->
    <text x="100" y="180" class="content" text-anchor="middle">akin</text>
  </g>
</svg>