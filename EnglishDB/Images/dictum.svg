<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dictum</text>
  <text x="50" y="120" class="subtitle">[ˈdɪktəm] n. 格言，声明</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dict (说) + -um (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位智者站在高台上，"说出(dict)"
    <tspan x="50" dy="25">一句深刻的格言，这格言就成为了"dictum"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His dictum about hard work resonated with many.
  </text>
  <text x="50" y="310" class="content">
    他关于努力工作的格言引起了许多人的共鸣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wise man -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="150" y2="150" class="image" />
    <line x1="175" y1="120" x2="200" y2="150" class="image" />
    <line x1="175" y1="90" x2="130" y2="80" class="image" />
    <line x1="175" y1="90" x2="220" y2="80" class="image" />
    <!-- Speech bubble -->
    <path d="M175,20 Q225,20 225,70 Q225,120 175,120 Q125,120 125,70 Q125,20 175,20" class="image" />
    <!-- Dictum text -->
    <text x="175" y="80" class="content" text-anchor="middle">Dictum</text>
  </g>
</svg>