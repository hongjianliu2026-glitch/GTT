<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tone</text>
  <text x="50" y="120" class="subtitle">[toʊn] n. 音调，语气；v. 给...定调</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ton (声音) + -e (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在演奏时，"调整(tone)"
    <tspan x="50" dy="25">乐器的音调，使其和谐悦耳。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The speaker's tone was calm and reassuring.
  </text>
  <text x="50" y="310" class="content">
    演讲者的语气平静且令人安心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Music note -->
    <path d="M10 100 Q50 50 100 100 T190 100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Music instrument -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <!-- Musician -->
    <circle cx="250" cy="170" r="15" class="image" />
    <line x1="250" y1="185" x2="250" y2="220" class="image" />
    <line x1="250" y1="220" x2="230" y2="250" class="image" />
    <line x1="250" y1="220" x2="270" y2="250" class="image" />
    <line x1="250" y1="200" x2="280" y2="190" class="image" />
  </g>
</svg>