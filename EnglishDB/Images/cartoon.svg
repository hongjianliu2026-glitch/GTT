<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cartoon</text>
  <text x="50" y="120" class="subtitle">[kɑːrˈtuːn] n. 卡通，漫画</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carto- (纸) + -oon (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在纸上(carto-)
    <tspan x="50" dy="25">画出夸张的漫画人物，这些画作就是卡通(cartoon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children love watching cartoons on Saturday mornings.
  </text>
  <text x="50" y="310" class="content">
    孩子们喜欢在周六早上看卡通片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Paper -->
    <rect x="0" y="0" width="350" height="250" class="image" />
    <!-- Cartoon character -->
    <circle cx="100" cy="125" r="50" class="image" />
    <line x1="100" y1="175" x2="100" y2="225" class="image" />
    <line x1="100" y1="225" x2="50" y2="275" class="image" />
    <line x1="100" y1="225" x2="150" y2="275" class="image" />
    <line x1="100" y1="175" x2="50" y2="150" class="image" />
    <line x1="100" y1="175" x2="150" y2="150" class="image" />
    <!-- Speech bubble -->
    <path d="M200,100 Q250,100 250,150 Q200,150 200,200 Q250,200 250,250 Q200,250 200,300" class="image" />
    <text x="210" y="180" class="content">"Haha!"</text>
  </g>
</svg>