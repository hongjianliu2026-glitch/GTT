<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">necklace</text>
  <text x="50" y="120" class="subtitle">[ˈnɛklɪs] n. 项链</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neck (脖子) + lace (带子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条闪闪发光的项链，"围绕(lace)"
    <tspan x="50" dy="25">在一位优雅女士的"脖子(neck)"上，</tspan>
    <tspan x="50" dy="25">这画面让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a diamond necklace to the party.
  </text>
  <text x="50" y="310" class="content">
    她戴着一条钻石项链去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Neck -->
    <line x1="100" y1="0" x2="100" y2="100" class="image" />
    <!-- Head -->
    <circle cx="100" cy="0" r="20" class="image" />
    <!-- Necklace -->
    <path d="M 50 100 Q 100 50 150 100" class="image" />
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
  </g>
</svg>