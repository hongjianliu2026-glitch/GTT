<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">euphoria</text>
  <text x="50" y="120" class="subtitle">[juːˈfɔːriə] n. 狂喜，极度愉快</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eu- (好) + -phor (带来) + -ia (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在空中飞翔，"好(eu-)"
    <tspan x="50" dy="25">的感觉"带来(phor)"，这种状态就是狂喜(euphoria)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd experienced euphoria after the victory.
  </text>
  <text x="50" y="310" class="content">
    胜利后，人群陷入了狂喜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person flying -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="40" ry="20" class="image" />
    <ellipse cx="250" cy="70" rx="50" ry="25" class="image" />
  </g>
</svg>