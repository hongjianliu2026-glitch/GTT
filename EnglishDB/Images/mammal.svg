<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mammal</text>
  <text x="50" y="120" class="subtitle">[ˈmæməl] n. 哺乳动物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mamma (乳房) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小熊在妈妈的怀里，"哺乳(mamma)"
    <tspan x="50" dy="25">喂养，这就是哺乳动物(mammal)的特征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Whales are the largest mammals in the world.
  </text>
  <text x="50" y="310" class="content">
    鲸鱼是世界上最大的哺乳动物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mother bear -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="200" x2="50" y2="220" class="image" /> <!-- Left arm -->
    <line x1="100" y1="200" x2="150" y2="220" class="image" /> <!-- Right arm -->
    <line x1="100" y1="250" x2="50" y2="300" class="image" /> <!-- Left leg -->
    <line x1="100" y1="250" x2="150" y2="300" class="image" /> <!-- Right leg -->
    <!-- Baby bear -->
    <circle cx="150" cy="120" r="25" class="image" /> <!-- Head -->
    <line x1="150" y1="145" x2="150" y2="185" class="image" /> <!-- Body -->
    <line x1="150" y1="165" x2="130" y2="175" class="image" /> <!-- Left arm -->
    <line x1="150" y1="165" x2="170" y2="175" class="image" /> <!-- Right arm -->
    <line x1="150" y1="185" x2="130" y2="205" class="image" /> <!-- Left leg -->
    <line x1="150" y1="185" x2="170" y2="205" class="image" /> <!-- Right leg -->
    <!-- Milk drop -->
    <circle cx="120" cy="130" r="10" class="image" fill="#FFFFFF" />
  </g>
</svg>