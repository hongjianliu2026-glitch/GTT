<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bouncer</text>
  <text x="50" y="120" class="subtitle">[ˈbaʊnsər] n. 保镖，弹跳者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bounce (弹跳) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的保镖，他不仅能"弹跳(bounce)"
    <tspan x="50" dy="25">起来，还能把不受欢迎的人"弹出(bounce)"夜店。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bouncer at the club was very strict.
  </text>
  <text x="50" y="310" class="content">
    夜店的保镖非常严格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bouncer -->
    <circle cx="20" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="20" y1="130" x2="20" y2="200" class="image" /> <!-- Body -->
    <line x1="20" y1="150" x2="0" y2="180" class="image" /> <!-- Left arm -->
    <line x1="20" y1="150" x2="40" y2="180" class="image" /> <!-- Right arm -->
    <line x1="20" y1="200" x2="0" y2="230" class="image" /> <!-- Left leg -->
    <line x1="20" y1="200" x2="40" y2="230" class="image" /> <!-- Right leg -->
    <!-- Bouncing effect -->
    <line x1="20" y1="230" x2="20" y2="250" class="image" />
    <line x1="20" y1="250" x2="20" y2="230" class="image" />
    <!-- Club door -->
    <rect x="50" y="150" width="100" height="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
  </g>
</svg>