<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marriage</text>
  <text x="50" y="120" class="subtitle">[ˈmærɪdʒ] n. 婚姻，结婚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar (海) + it (走) + age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在海边，"走向(mar-it-age)"
    <tspan x="50" dy="25">彼此，最终结合成一个家庭，这就是婚姻(marriage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Their marriage lasted for 50 years.
  </text>
  <text x="50" y="310" class="content">
    他们的婚姻持续了50年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#AED6F1" />
    <!-- Couple walking -->
    <circle cx="50" cy="150" r="15" class="image" fill="#F1C40F" />
    <circle cx="100" cy="150" r="15" class="image" fill="#F1C40F" />
    <line x1="65" y1="165" x2="85" y2="165" class="image" />
    <line x1="115" y1="165" x2="135" y2="165" class="image" />
    <line x1="85" y1="165" x2="115" y2="165" class="image" />
    <!-- Heart -->
    <path d="M150,150 C140,130 160,130 150,150 C160,170 140,170 150,150 Z" class="image" fill="#E74C3C" />
  </g>
</svg>