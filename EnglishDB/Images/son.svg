<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">son</text>
  <text x="50" y="120" class="subtitle">[sʌn] n. 儿子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> son (儿子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个父亲和他的儿子在公园里玩耍，"儿子(son)"
    <tspan x="50" dy="25">是父亲生命的延续，象征着希望和未来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a proud father of two sons.
  </text>
  <text x="50" y="310" class="content">
    他是一个有两个儿子的骄傲父亲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Father -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="100" class="image" />
    <line x1="50" y1="90" x2="80" y2="100" class="image" />

    <!-- Son -->
    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="110" class="image" />
    <line x1="150" y1="110" x2="130" y2="140" class="image" />
    <line x1="150" y1="110" x2="170" y2="140" class="image" />
    <line x1="150" y1="80" x2="120" y2="90" class="image" />
    <line x1="150" y1="80" x2="180" y2="90" class="image" />

    <!-- Playground -->
    <rect x="20" y="150" width="260" height="50" class="image" />
    <line x1="30" y1="160" x2="270" y2="160" class="image" />
    <line x1="30" y1="170" x2="270" y2="170" class="image" />
    <line x1="30" y1="180" x2="270" y2="180" class="image" />
    <line x1="30" y1="190" x2="270" y2="190" class="image" />
  </g>
</svg>