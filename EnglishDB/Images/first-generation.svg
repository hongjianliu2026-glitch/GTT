<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">first-generation</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrst ˌdʒenəˈreɪʃn] n. 第一代</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> first (第一) + generation (代)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家族的"第一代(first-generation)"成员，
    <tspan x="50" dy="25">他们站在最前面，象征着家族的起源和传承。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a first-generation college student.
  </text>
  <text x="50" y="310" class="content">
    他是一名第一代大学生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family tree -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="150" y2="100" class="image" />
    <line x1="50" y1="20" x2="150" y2="180" class="image" />
    <!-- First generation -->
    <circle cx="50" cy="20" r="15" class="image" />
    <!-- Second generation -->
    <circle cx="150" cy="20" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="150" cy="180" r="15" class="image" />
    <!-- Labels -->
    <text x="40" y="15" class="content">1st</text>
    <text x="140" y="15" class="content">2nd</text>
    <text x="140" y="95" class="content">2nd</text>
    <text x="140" y="175" class="content">2nd</text>
  </g>
</svg>