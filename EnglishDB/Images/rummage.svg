<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rummage</text>
  <text x="50" y="120" class="subtitle">[ˈrʌmɪdʒ] v. 翻找，搜寻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rum (混乱) + age (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，所有的东西都被"混乱地翻找(rum-age)"
    <tspan x="50" dy="25">过，到处都是散落的物品，这就是rummage的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent hours rummaging through old boxes.
  </text>
  <text x="50" y="310" class="content">
    她花了几个小时翻找旧箱子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room with scattered items -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bed -->
    <rect x="50" y="20" width="100" height="60" class="image" />
    <!-- Drawer -->
    <rect x="170" y="20" width="80" height="40" class="image" />
    <!-- Scattered items -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="70" y1="120" x2="170" y2="120" class="image" />
    <line x1="90" y1="140" x2="190" y2="140" class="image" />
    <line x1="110" y1="160" x2="210" y2="160" class="image" />
    <!-- Person rummaging -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>