<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">removal</text>
  <text x="50" y="120" class="subtitle">[rɪˈmuːvl] n. 移除，搬迁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + mov (移动) + -al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的家具被"再次移动(re-mov)"，
    <tspan x="50" dy="25">从房间的一边搬到另一边，这就是移除(removal)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The removal of the old furniture made the room look spacious.
  </text>
  <text x="50" y="310" class="content">
    旧家具的移除让房间看起来更宽敞了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Furniture -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Moving arrow -->
    <line x1="150" y1="60" x2="300" y2="60" class="image" />
    <polygon points="300,50 320,60 300,70" class="image" />
    <!-- New position -->
    <rect x="250" y="20" width="100" height="80" class="image" />
  </g>
</svg>