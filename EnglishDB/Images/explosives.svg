<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">explosives</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsploʊsɪvz] n. 炸药</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + plos (爆裂) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的炸弹，"向外爆裂(ex-plos)"，
    <tspan x="50" dy="25">释放出巨大的能量，这就是炸药(explosives)的威力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bomb squad carefully handled the explosives.
  </text>
  <text x="50" y="310" class="content">
    炸弹小组小心地处理了炸药。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bomb -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Fuse -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Explosion -->
    <circle cx="100" cy="300" r="30" class="image" />
    <circle cx="130" cy="330" r="20" class="image" />
    <circle cx="70" cy="330" r="20" class="image" />
    <circle cx="100" cy="360" r="20" class="image" />
  </g>
</svg>