<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forth</text>
  <text x="50" y="120" class="subtitle">[fɔːrθ] adv. 向前，向外</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (向前) + -th (表示方向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在起点，"向前(for-)"
    <tspan x="50" dy="25">迈出一步，这一步就是"向外(forth)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He walked forth into the unknown.
  </text>
  <text x="50" y="310" class="content">
    他向前走入未知的世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Starting point -->
    <circle cx="50" cy="100" r="10" class="image" />
    <!-- Path -->
    <line x1="60" y1="100" x2="300" y2="100" class="image" />
    <!-- Person moving forward -->
    <circle cx="280" cy="100" r="15" class="image" />
    <line x1="280" y1="115" x2="280" y2="150" class="image" />
    <line x1="280" y1="150" x2="260" y2="180" class="image" />
    <line x1="280" y1="150" x2="300" y2="180" class="image" />
    <line x1="280" y1="130" x2="310" y2="120" class="image" />
  </g>
</svg>