<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4E8F3; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Aztec</text>
  <text x="50" y="120" class="subtitle">[ˈæzteɪk] n. 阿兹特克人；adj. 阿兹特克的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自纳瓦特尔语 "Aztecatl" (阿兹特克人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的阿兹特克战士，头戴羽毛头饰，手持长矛，
    <tspan x="50" dy="25">站在金字塔顶端，俯瞰着他的帝国。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Aztec civilization was known for its advanced architecture.
  </text>
  <text x="50" y="310" class="content">
    阿兹特克文明以其先进的建筑而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pyramid -->
    <polygon points="0,150 150,0 300,150" class="image" />
    <!-- Warrior -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <line x1="150" y1="140" x2="120" y2="160" class="image" />
    <line x1="150" y1="140" x2="180" y2="160" class="image" />
    <!-- Feather headdress -->
    <line x1="130" y1="80" x2="150" y2="60" class="image" />
    <line x1="170" y1="80" x2="150" y2="60" class="image" />
    <line x1="140" y1="70" x2="150" y2="60" class="image" />
    <line x1="160" y1="70" x2="150" y2="60" class="image" />
  </g>
</svg>