<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">volleyball</text>
  <text x="50" y="120" class="subtitle">[ˈvɒlibɔːl] n. 排球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> volley (截击) + ball (球)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在沙滩上，"截击(volley)"
    <tspan x="50" dy="25">一个飞来的球(ball)，这就是排球(volleyball)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They played volleyball at the beach all afternoon.
  </text>
  <text x="50" y="310" class="content">
    他们整个下午都在海滩上打排球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beach -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Volleyball net -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Ball -->
    <circle cx="175" cy="100" r="20" class="image" />
    <!-- Players -->
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
  </g>
</svg>