<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pedestal</text>
  <text x="50" y="120" class="subtitle">[ˈpedɪstl] n. 基座，底座</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ped- (脚) + -estal (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的雕像，它的"脚(ped-)"站在一个高高的"底座(estal)"上，
    <tspan x="50" dy="25">这个底座就是pedestal，支撑着整个雕像。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The statue was placed on a marble pedestal.
  </text>
  <text x="50" y="310" class="content">
    雕像被放置在大理石底座上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Pedestal -->
    <rect x="100" y="150" width="150" height="50" class="image" />
    <!-- Statue -->
    <circle cx="175" cy="120" r="25" class="image" />
    <line x1="175" y1="145" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="200" class="image" />
    <line x1="175" y1="150" x2="200" y2="200" class="image" />
    <line x1="175" y1="170" x2="150" y2="180" class="image" />
    <line x1="175" y1="170" x2="200" y2="180" class="image" />
  </g>
</svg>