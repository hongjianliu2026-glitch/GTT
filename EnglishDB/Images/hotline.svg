<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hotline</text>
  <text x="50" y="120" class="subtitle">[ˈhɒtlaɪn] n. 热线</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hot (热的) + line (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条"热(hot)"线，就像一条紧急电话线，
    <tspan x="50" dy="25">人们可以随时拨打，快速解决问题。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a hotline for customer complaints.
  </text>
  <text x="50" y="310" class="content">
    公司有一条客户投诉热线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Phone -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <circle cx="75" cy="100" r="50" class="image" />
    <line x1="75" y1="150" x2="75" y2="200" class="image" />
    <!-- Hotline -->
    <line x1="75" y1="0" x2="75" y2="50" class="image" />
    <line x1="75" y1="50" x2="50" y2="75" class="image" />
    <line x1="75" y1="50" x2="100" y2="75" class="image" />
    <line x1="75" y1="50" x2="75" y2="100" class="image" />
    <!-- Hot symbol -->
    <circle cx="75" cy="25" r="10" fill="#E74C3C" />
  </g>
</svg>