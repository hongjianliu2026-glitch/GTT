<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manage</text>
  <text x="50" y="120" class="subtitle">[ˈmænɪdʒ] v. 管理，处理，控制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (手) + age (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用双手"掌控(man-age)"
    <tspan x="50" dy="25">一切，就像在管理一个复杂的项目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She managed the project successfully.
  </text>
  <text x="50" y="310" class="content">
    她成功地管理了这个项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Hands -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="150" cy="50" r="30" class="image" />
    <!-- Fingers -->
    <line x1="50" y1="80" x2="30" y2="120" class="image" />
    <line x1="50" y1="80" x2="70" y2="120" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="150" y1="80" x2="130" y2="120" class="image" />
    <line x1="150" y1="80" x2="170" y2="120" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <!-- Project -->
    <rect x="20" y="150" width="160" height="50" class="image" />
    <text x="30" y="180" class="content">Project</text>
  </g>
</svg>