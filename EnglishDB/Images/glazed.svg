<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glazed</text>
  <text x="50" y="120" class="subtitle">[ɡleɪzd] adj. 上釉的，光滑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glo- (光) + -aze (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个甜甜圈，表面被"光亮地涂抹(glo-aze)"
    <tspan x="50" dy="25">上一层糖衣，变得光滑闪亮，这就是glazed甜甜圈。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doughnuts were glazed with a shiny sugar coating.
  </text>
  <text x="50" y="310" class="content">
    这些甜甜圈被涂上了一层闪亮的糖衣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doughnut -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Glaze -->
    <circle cx="100" cy="100" r="45" fill="#F7DC6F" />
    <!-- Shine effect -->
    <circle cx="80" cy="80" r="10" fill="#FFFFFF" />
    <circle cx="120" cy="80" r="10" fill="#FFFFFF" />
    <circle cx="100" cy="120" r="10" fill="#FFFFFF" />
  </g>
</svg>