<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knowledge</text>
  <text x="50" y="120" class="subtitle">[ˈnɒlɪdʒ] n. 知识，学问</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> know (知道) + ledge (边缘)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个智者在知识的海洋中，站在"知道(know)"的"边缘(ledge)"，
    <tspan x="50" dy="25">不断探索和积累，最终掌握了丰富的知识(knowledge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a vast knowledge of ancient history.
  </text>
  <text x="50" y="310" class="content">
    她对古代历史有着广博的知识。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Ledge -->
    <rect x="150" y="150" width="50" height="50" class="image" fill="#F1C40F" />
    <!-- Wise person -->
    <circle cx="175" cy="125" r="20" class="image" fill="#2C3E50" />
    <line x1="175" y1="145" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
    <line x1="175" y1="160" x2="200" y2="150" class="image" />
  </g>
</svg>