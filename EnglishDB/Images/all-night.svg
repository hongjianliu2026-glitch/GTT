<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">all-night</text>
  <text x="50" y="120" class="subtitle">[ɔːl naɪt] adj. 通宵的，整夜的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> all (全部) + night (夜晚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个派对，人们"整夜(all-night)"不眠，
    <tspan x="50" dy="25">狂欢到天明，这就是一个通宵派对(all-night party)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They had an all-night party to celebrate the graduation.
  </text>
  <text x="50" y="310" class="content">
    他们举办了一个通宵派对来庆祝毕业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" fill="#FFFFFF" />
    <circle cx="150" cy="50" r="5" class="image" fill="#FFFFFF" />
    <circle cx="200" cy="100" r="5" class="image" fill="#FFFFFF" />
    <!-- Party people -->
    <circle cx="70" cy="150" r="15" class="image" fill="#FF69B4" />
    <circle cx="130" cy="150" r="15" class="image" fill="#FF69B4" />
    <circle cx="100" cy="180" r="15" class="image" fill="#FF69B4" />
    <!-- Dance floor -->
    <rect x="50" y="200" width="100" height="50" class="image" fill="#87CEEB" />
    <!-- Sun rising -->
    <circle cx="250" cy="100" r="50" class="image" fill="#FFA500" />
    <line x1="250" y1="150" x2="250" y2="200" class="image" />
    <line x1="220" y1="170" x2="250" y2="150" class="image" />
    <line x1="280" y1="170" x2="250" y2="150" class="image" />
  </g>
</svg>