<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rig</text>
  <text x="50" y="120" class="subtitle">[rɪɡ] v. 操纵，装配；n. 钻井架，帆装</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rig (来自古英语 "hring"，意为"环"或"圈")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钻井架(rig)，它像一个巨大的金属环(ring)，
    <tspan x="50" dy="25">牢牢地固定在海底，操纵着深海的秘密。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oil rig was carefully rigged to withstand the storm.
  </text>
  <text x="50" y="310" class="content">
    这个石油钻井架被精心装配以抵御风暴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Oil rig base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Oil rig structure -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="150" y1="40" x2="200" y2="40" class="image" />
    <line x1="150" y1="60" x2="200" y2="60" class="image" />
    <line x1="150" y1="80" x2="200" y2="80" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
    <line x1="150" y1="140" x2="200" y2="140" class="image" />
    <line x1="150" y1="160" x2="200" y2="160" class="image" />
    <!-- Oil rig platform -->
    <rect x="100" y="180" width="150" height="20" class="image" />
  </g>
</svg>