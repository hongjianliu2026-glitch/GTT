<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">off-limits</text>
  <text x="50" y="120" class="subtitle">[ˌɔːfˈlɪmɪts] adj. 禁止入内的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> off (离开) + limits (界限)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色"禁止"标志，"离开(off)"
    <tspan x="50" dy="25">界限(limits)，禁止入内(off-limits)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The restricted area is marked as off-limits to visitors.
  </text>
  <text x="50" y="310" class="content">
    这个禁区被标记为禁止游客入内。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red "禁止" sign -->
    <rect x="0" y="0" width="200" height="200" class="image" fill="#E74C3C" />
    <circle cx="100" cy="100" r="90" class="image" fill="#E74C3C" />
    <line x1="50" y1="50" x2="150" y2="150" class="image" stroke="#FFFFFF" stroke-width="10" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" stroke="#FFFFFF" stroke-width="10" />
  </g>
</svg>