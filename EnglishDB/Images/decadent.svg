<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decadent</text>
  <text x="50" y="120" class="subtitle">[ˈdɛkədənt] adj. 颓废的，堕落的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + cad (落下) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个曾经辉煌的帝国，"向下坠落(de-cad-ent)"，
    <tspan x="50" dy="25">变得颓废和堕落，象征着衰败和没落。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The once-great civilization became decadent and fell into ruin.
  </text>
  <text x="50" y="310" class="content">
    这个曾经伟大的文明变得颓废，最终走向毁灭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken column -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="45" y1="200" x2="55" y2="200" class="image" />
    <line x1="45" y1="200" x2="45" y2="210" class="image" />
    <line x1="55" y1="200" x2="55" y2="210" class="image" />
    <!-- Fallen crown -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="150" y1="70" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="120" y2="160" class="image" />
    <line x1="150" y1="130" x2="180" y2="160" class="image" />
    <!-- Decaying leaves -->
    <circle cx="250" cy="150" r="20" class="image" />
    <circle cx="270" cy="140" r="15" class="image" />
    <circle cx="290" cy="160" r="10" class="image" />
  </g>
</svg>