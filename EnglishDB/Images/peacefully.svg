<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peacefully</text>
  <text x="50" y="120" class="subtitle">[ˈpiːsfəli] adv. 平静地，和平地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peace (和平) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片宁静的湖面，"充满和平(peace-ful)"
    <tspan x="50" dy="25">的氛围，湖面上只有微风轻轻拂过，一切都显得那么平静(peacefully)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The village slept peacefully under the moonlight.
  </text>
  <text x="50" y="310" class="content">
    村庄在月光下平静地沉睡着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Moon -->
    <circle cx="300" cy="50" r="20" class="image" />
    <!-- Wind -->
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <line x1="75" y1="110" x2="75" y2="130" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="125" y1="110" x2="125" y2="130" class="image" />
  </g>
</svg>