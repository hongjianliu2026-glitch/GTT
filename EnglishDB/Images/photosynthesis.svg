<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #27AE60; }
      .sun { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">photosynthesis</text>
  <text x="50" y="120" class="subtitle">[ˌfoʊtoʊsɪnˈθɛsɪs] n. 光合作用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> photo- (光) + synthesis (合成)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片叶子在阳光下，"光(photo-)"
    <tspan x="50" dy="25">和二氧化碳结合，合成(synthesis)</tspan>
    <tspan x="50" dy="25">出氧气和葡萄糖，这就是光合作用(photosynthesis)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Plants perform photosynthesis to produce energy.
  </text>
  <text x="50" y="310" class="content">
    植物进行光合作用以产生能量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="sun" />
    <!-- Leaf -->
    <path d="M100,100 Q150,50 200,100 T300,100" class="leaf" />
    <!-- Plant stem -->
    <line x1="200" y1="100" x2="200" y2="200" class="image" />
    <!-- Oxygen bubble -->
    <circle cx="200" cy="220" r="10" class="image" />
  </g>
</svg>