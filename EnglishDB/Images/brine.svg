<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brine</text>
  <text x="50" y="120" class="subtitle">[braɪn] n. 盐水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brin (盐) + e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的盐山，"盐(brin)"
    <tspan x="50" dy="25">融化成水，变成了盐水(brine)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fish was preserved in brine.
  </text>
  <text x="50" y="310" class="content">
    这条鱼是用盐水保存的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Salt mountain -->
    <polygon points="0,150 100,0 200,150" class="image" />
    <!-- Water -->
    <rect x="50" y="150" width="100" height="50" class="image" />
    <!-- Salt particles -->
    <circle cx="70" cy="170" r="5" class="image" />
    <circle cx="90" cy="170" r="5" class="image" />
    <circle cx="110" cy="170" r="5" class="image" />
    <circle cx="130" cy="170" r="5" class="image" />
    <circle cx="150" cy="170" r="5" class="image" />
  </g>
</svg>