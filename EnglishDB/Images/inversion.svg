<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inversion</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvɜːrʒən] n. 倒置，反转</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (向内) + vers (转) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师将一个杯子"向内反转(in-vers)"，
    <tspan x="50" dy="25">杯底朝上，水却没有流出来，这就是反转(inversion)的奇妙。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The inversion of the image made it look upside down.
  </text>
  <text x="50" y="310" class="content">
    图像的反转使其看起来上下颠倒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <!-- Water -->
    <rect x="10" y="10" width="80" height="130" class="image" />
    <!-- Inverted cup -->
    <rect x="120" y="0" width="100" height="150" class="image" transform="rotate(180, 170, 75)" />
    <!-- Water in inverted cup -->
    <rect x="130" y="10" width="80" height="130" class="image" transform="rotate(180, 170, 75)" />
    <!-- Magician -->
    <circle cx="300" cy="75" r="20" class="image" />
    <line x1="300" y1="95" x2="300" y2="150" class="image" />
    <line x1="300" y1="120" x2="280" y2="100" class="image" />
    <line x1="300" y1="120" x2="320" y2="100" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
  </g>
</svg>