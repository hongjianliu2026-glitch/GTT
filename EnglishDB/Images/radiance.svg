<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #FFD700; }
      .rays { stroke: #FFD700; stroke-width: 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">radiance</text>
  <text x="50" y="120" class="subtitle">[ˈreɪdiəns] n. 光辉，辐射</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> radi (光线) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个太阳放射出无数的光线，这些光线就是"光辉(radiance)"，
    <tspan x="50" dy="25">照亮了整个世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The radiance of the sun warmed the earth.
  </text>
  <text x="50" y="310" class="content">
    太阳的光辉温暖了大地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="rays" />
    <line x1="150" y1="100" x2="200" y2="100" class="rays" />
    <line x1="100" y1="150" x2="100" y2="200" class="rays" />
    <line x1="50" y1="100" x2="0" y2="100" class="rays" />
    <line x1="130" y1="70" x2="160" y2="40" class="rays" />
    <line x1="70" y1="70" x2="40" y2="40" class="rays" />
    <line x1="130" y1="130" x2="160" y2="160" class="rays" />
    <line x1="70" y1="130" x2="40" y2="160" class="rays" />
  </g>
</svg>