<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">groom</text>
  <text x="50" y="120" class="subtitle">[ɡruːm] n. 新郎；v. 打扮，照料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> groo- (成长) + m (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新郎在婚礼前，"成长(groo-)"
    <tspan x="50" dy="25">并精心打扮(groom)，准备迎接人生新阶段。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The groom was nervously grooming himself before the ceremony.
  </text>
  <text x="50" y="310" class="content">
    新郎在仪式前紧张地打扮自己。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Groom -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <!-- Comb -->
    <rect x="80" y="90" width="20" height="10" class="image" />
    <line x1="80" y1="95" x2="100" y2="95" class="image" />
    <line x1="80" y1="100" x2="100" y2="100" class="image" />
    <line x1="80" y1="105" x2="100" y2="105" class="image" />
  </g>
</svg>