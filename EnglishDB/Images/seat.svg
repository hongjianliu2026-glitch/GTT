<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seat</text>
  <text x="50" y="120" class="subtitle">[sit] n. 座位，席位；v. 使坐下</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (坐) + at (在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在椅子上，"坐在(se-at)"
    <tspan x="50" dy="25">一个特定的位置，这个位置就是他的座位(seat)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please find a seat and sit down.
  </text>
  <text x="50" y="310" class="content">
    请找个座位坐下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="50" y="150" width="100" height="50" class="image" />
    <!-- Person sitting -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
  </g>
</svg>