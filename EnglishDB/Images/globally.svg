<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">globally</text>
  <text x="50" y="120" class="subtitle">[ˈɡloʊbəli] adv. 全球地，全面地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> globe (地球) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪(globe)，上面布满了各种标记，
    <tspan x="50" dy="25">表示全球各地的信息，这就是"全球地(globally)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a globally recognized brand.
  </text>
  <text x="50" y="310" class="content">
    这家公司拥有一个全球公认的品牌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Landmarks -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="250" cy="50" r="5" class="image" />
    <circle cx="175" cy="150" r="5" class="image" />
    <circle cx="100" cy="150" r="5" class="image" />
    <circle cx="250" cy="150" r="5" class="image" />
  </g>
</svg>