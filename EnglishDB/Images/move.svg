<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">move</text>
  <text x="50" y="120" class="subtitle">[muːv] v. 移动，搬动；n. 移动，行动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mov (移动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磁铁，"移动(mov)"
    <tspan x="50" dy="25">着周围的金属物体，这些物体随着磁铁的移动而移动(move)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to move to a new city for a fresh start.
  </text>
  <text x="50" y="310" class="content">
    她决定搬到一个新城市，开始新的生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <!-- Metal objects -->
    <circle cx="150" cy="25" r="10" class="image" />
    <circle cx="180" cy="25" r="10" class="image" />
    <circle cx="210" cy="25" r="10" class="image" />
    <!-- Movement lines -->
    <line x1="100" y1="25" x2="150" y2="25" class="image" />
    <line x1="100" y1="25" x2="180" y2="25" class="image" />
    <line x1="100" y1="25" x2="210" y2="25" class="image" />
  </g>
</svg>