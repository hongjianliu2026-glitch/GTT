<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underclass</text>
  <text x="50" y="120" class="subtitle">[ˈʌndərklæs] n. 下层阶级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...下面) + class (阶级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个社会金字塔，"在阶级下面(under-class)"
    <tspan x="50" dy="25">的人们，他们构成了社会的下层阶级(underclass)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The underclass often faces economic and social challenges.
  </text>
  <text x="50" y="310" class="content">
    下层阶级常常面临经济和社会挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Pyramid -->
    <polygon points="150,0 0,200 300,200" class="image" />
    <!-- Underclass -->
    <rect x="50" y="200" width="200" height="50" class="image" />
    <text x="150" y="230" class="content" text-anchor="middle">Underclass</text>
  </g>
</svg>