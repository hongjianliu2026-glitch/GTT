<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recurrent</text>
  <text x="50" y="120" class="subtitle">[rɪˈkɜːrənt] adj. 复发的，反复出现的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + cur (跑) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个跑道上的运动员，"再次跑(re-cur)"
    <tspan x="50" dy="25">回来，反复出现(recurrent)，就像复发的疾病或反复出现的问题。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The recurrent problem of traffic congestion needs to be addressed.
  </text>
  <text x="50" y="310" class="content">
    反复出现的交通拥堵问题需要解决。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <!-- Runner -->
    <circle cx="100" cy="125" r="15" class="image" />
    <line x1="100" y1="140" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="100" y1="155" x2="130" y2="145" class="image" />
    <!-- Recurring arrow -->
    <path d="M150,125 L250,125 M250,125 L230,110 M250,125 L230,140" class="image" />
    <text x="200" y="100" class="content" text-anchor="middle">re-</text>
  </g>
</svg>