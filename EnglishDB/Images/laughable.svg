<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laughable</text>
  <text x="50" y="120" class="subtitle">[ˈlɑːfəbl] adj. 可笑的，荒谬的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> laugh (笑) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在看到一个极其荒谬的场景时，忍不住"笑出声(laugh)"，
    <tspan x="50" dy="25">这个场景就是"可笑的(laughable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His excuse was so laughable that everyone burst into laughter.
  </text>
  <text x="50" y="310" class="content">
    他的借口太可笑了，以至于所有人都忍不住大笑起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 60 120 Q 100 150 140 120" class="image" />
    <!-- Scene -->
    <rect x="180" y="50" width="200" height="100" class="image" />
    <text x="200" y="100" class="content" fill="#7F8C8D">荒谬场景</text>
  </g>
</svg>