<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reunification</text>
  <text x="50" y="120" class="subtitle">[ˌriːjuːnɪfɪˈkeɪʃn] n. 重新统一，再联合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + uni (一) + -fication (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个分裂的国家，"再次(re-)"
    <tspan x="50" dy="25">合并成一个(uni-fication)"，形成一个统一的国家。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The reunification of the two countries brought peace and prosperity.
  </text>
  <text x="50" y="310" class="content">
    两个国家的重新统一带来了和平与繁荣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two countries -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="200" y="0" width="150" height="100" class="image" />
    <!-- Bridge -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <!-- United country -->
    <rect x="0" y="150" width="350" height="100" class="image" />
    <!-- Peace symbol -->
    <circle cx="175" cy="200" r="20" class="image" />
    <line x1="175" y1="220" x2="175" y2="250" class="image" />
    <line x1="175" y1="235" x2="155" y2="225" class="image" />
    <line x1="175" y1="235" x2="195" y2="225" class="image" />
  </g>
</svg>