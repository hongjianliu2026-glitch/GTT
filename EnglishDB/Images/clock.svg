<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clock</text>
  <text x="50" y="120" class="subtitle">[klɒk] n. 时钟；v. 计时</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cloc (钟声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"钟声(cloc)"
    <tspan x="50" dy="25">响彻整个城市，提醒人们时间的流逝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She set the alarm clock for 7 AM.
  </text>
  <text x="50" y="310" class="content">
    她把闹钟设在了早上7点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="100" y1="100" x2="100" y2="30" class="image" />
    <line x1="100" y1="100" x2="170" y2="100" class="image" />
    <!-- Clock numbers -->
    <text x="70" y="40" class="content">12</text>
    <text x="160" y="110" class="content">3</text>
    <text x="90" y="180" class="content">6</text>
    <text x="20" y="110" class="content">9</text>
  </g>
</svg>