<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chairmanship</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɛərmənʃɪp] n. 主席职位，主席身份</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chair (椅子) + man (人) + ship (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个重要的人物坐在"椅子(chair)"上，
    <tspan x="50" dy="25">他掌控全局，这就是"主席职位(chairmanship)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was elected to the chairmanship of the committee.
  </text>
  <text x="50" y="310" class="content">
    他被选为委员会的主席。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="50" y="50" width="100" height="100" class="image" />
    <!-- Person -->
    <circle cx="100" cy="40" r="20" class="image" />
    <line x1="100" y1="60" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="70" x2="130" y2="60" class="image" />
  </g>
</svg>