<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bypass</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪpæs] n. 旁路，绕过；v. 绕过，避开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> by- (旁边) + pass (通过)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在高速公路上，"从旁边通过(by-pass)"
    <tspan x="50" dy="25">一条小路，绕过了拥堵的主路，这就是绕过(bypass)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We decided to bypass the city center to avoid traffic.
  </text>
  <text x="50" y="310" class="content">
    我们决定绕过市中心以避开交通拥堵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main road -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Side road -->
    <rect x="100" y="60" width="150" height="50" class="image" />
    <!-- Car on side road -->
    <rect x="120" y="70" width="30" height="30" class="image" />
    <!-- Arrow indicating bypass -->
    <line x1="135" y1="100" x2="135" y2="150" class="image" />
    <polygon points="130,150 140,150 135,160" class="image" />
  </g>
</svg>