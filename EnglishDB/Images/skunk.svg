<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skunk</text>
  <text x="50" y="120" class="subtitle">[skʌŋk] n. 臭鼬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skunk (源自美洲原住民语言，指臭鼬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只臭鼬在森林中，突然释放出它那臭名昭著的
    <tspan x="50" dy="25">臭气，周围的动物都纷纷逃离，生怕被"臭鼬(skunk)"的臭气熏到。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The skunk's spray can be very unpleasant.
  </text>
  <text x="50" y="310" class="content">
    臭鼬的喷雾非常难闻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skunk body -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <!-- Skunk head -->
    <circle cx="100" cy="70" r="20" class="image" />
    <!-- Skunk tail -->
    <rect x="140" y="80" width="20" height="40" class="image" />
    <!-- Skunk legs -->
    <line x1="70" y1="130" x2="70" y2="150" class="image" />
    <line x1="130" y1="130" x2="130" y2="150" class="image" />
    <!-- Skunk eyes -->
    <circle cx="90" cy="65" r="3" class="image" />
    <circle cx="110" cy="65" r="3" class="image" />
    <!-- Skunk spray -->
    <line x1="100" y1="70" x2="100" y2="30" class="image" />
    <line x1="95" y1="50" x2="105" y2="50" class="image" />
    <line x1="90" y1="40" x2="110" y2="40" class="image" />
  </g>
</svg>