<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impassive</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpæsɪv] adj. 冷漠的，无动于衷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + pass (感情) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在火山爆发的边缘，脸上却毫无表情，"没有感情(im-pass-ive)"，
    <tspan x="50" dy="25">仿佛一切都在他的意料之中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Despite the chaos around him, he remained impassive.
  </text>
  <text x="50" y="310" class="content">
    尽管周围一片混乱，他依然无动于衷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Volcano -->
    <polygon points="0,200 100,0 200,200" class="image" fill="#FF7F50" />
    <!-- Lava -->
    <ellipse cx="100" cy="200" rx="50" ry="20" class="image" fill="#FF4500" />
    <!-- Person -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="70" y2="170" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Expressionless face -->
    <line x1="90" y1="140" x2="110" y2="140" class="image" />
    <line x1="95" y1="145" x2="105" y2="145" class="image" />
  </g>
</svg>