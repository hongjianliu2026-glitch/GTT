<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eldest</text>
  <text x="50" y="120" class="subtitle">[ˈɛldɪst] adj. 最年长的，排行第一的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eld (老) + -est (最高级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭中，最年长的(eldest)
    <tspan x="50" dy="25">哥哥或姐姐总是站在最前面，</tspan>
    <tspan x="50" dy="25">象征着他们的领导地位和经验。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The eldest son took over the family business.
  </text>
  <text x="50" y="310" class="content">
    长子接管了家族企业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family members -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Eldest -->
    <circle cx="150" cy="100" r="15" class="image" /> <!-- Younger sibling -->
    <circle cx="250" cy="100" r="15" class="image" /> <!-- Younger sibling -->
    <!-- Eldest standing in front -->
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Younger siblings -->
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <line x1="250" y1="120" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>