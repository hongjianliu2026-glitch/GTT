<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decoration</text>
  <text x="50" y="120" class="subtitle">[ˌdekəˈreɪʃn] n. 装饰，装潢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (加强) + cor (装饰) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，"加强装饰(de-cor-ation)"
    <tspan x="50" dy="25">，挂满了彩灯、气球和彩带，整个房间变得五彩缤纷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was filled with beautiful decorations for the party.
  </text>
  <text x="50" y="310" class="content">
    房间里摆满了为派对准备的美丽装饰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Balloons -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Lights -->
    <line x1="20" y1="100" x2="330" y2="100" class="image" />
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="150" cy="100" r="5" class="image" />
    <circle cx="200" cy="100" r="5" class="image" />
    <circle cx="250" cy="100" r="5" class="image" />
    <circle cx="300" cy="100" r="5" class="image" />
    <!-- Ribbons -->
    <line x1="20" y1="150" x2="330" y2="150" class="image" />
    <line x1="20" y1="150" x2="30" y2="130" class="image" />
    <line x1="30" y1="130" x2="40" y2="150" class="image" />
    <line x1="40" y1="150" x2="50" y2="130" class="image" />
    <line x1="50" y1="130" x2="60" y2="150" class="image" />
    <line x1="60" y1="150" x2="70" y2="130" class="image" />
    <line x1="70" y1="130" x2="80" y2="150" class="image" />
    <line x1="80" y1="150" x2="90" y2="130" class="image" />
    <line x1="90" y1="130" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="110" y2="130" class="image" />
    <line x1="110" y1="130" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="130" y2="130" class="image" />
    <line x1="130" y1="130" x2="140" y2="150" class="image" />
    <line x1="140" y1="150" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="160" y2="150" class="image" />
    <line x1="160" y1="150" x2="170" y2="130" class="image" />
    <line x1="170" y1="130" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="190" y2="130" class="image" />
    <line x1="190" y1="130" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="210" y2="130" class="image" />
    <line x1="210" y1="130" x2="220" y2="150" class="image" />
    <line x1="220" y1="150" x2="230" y2="130" class="image" />
    <line x1="230" y1="130" x2="240" y2="150" class="image" />
    <line x1="240" y1="150" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="260" y2="150" class="image" />
    <line x1="260" y1="150" x2="270" y2="130" class="image" />
    <line x1="270" y1="130" x2="280" y2="150" class="image" />
    <line x1="280" y1="150" x2="290" y2="130" class="image" />
    <line x1="290" y1="130" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="310" y2="130" class="image" />
    <line x1="310" y1="130" x2="320" y2="150" class="image" />
    <line x1="320" y1="150" x2="330" y2="130" class="image" />
  </g>
</svg>