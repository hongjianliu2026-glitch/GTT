<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compel</text>
  <text x="50" y="120" class="subtitle">[kəmˈpel] v. 强迫，迫使</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + pel (推)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的力量"一起推(com-pel)"
    <tspan x="50" dy="25">一个人，迫使他做某事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heavy rain compelled us to stay indoors.
  </text>
  <text x="50" y="310" class="content">
    大雨迫使我们待在室内。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Force pushing -->
    <line x1="0" y1="0" x2="200" y2="200" class="image" />
    <line x1="0" y1="20" x2="200" y2="220" class="image" />
    <line x1="0" y1="40" x2="200" y2="240" class="image" />
    <!-- Person being pushed -->
    <circle cx="220" cy="220" r="20" class="image" />
    <line x1="220" y1="240" x2="220" y2="280" class="image" />
    <line x1="220" y1="280" x2="200" y2="320" class="image" />
    <line x1="220" y1="280" x2="240" y2="320" class="image" />
    <line x1="220" y1="260" x2="260" y2="250" class="image" />
  </g>
</svg>