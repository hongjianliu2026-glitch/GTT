<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">broach</text>
  <text x="50" y="120" class="subtitle">[broʊtʃ] v. 提出，开始讨论；n. 钻头，凿子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> broach (源自中世纪法语 broche，意为“钻头”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的人用“钻头(broach)”在会议上“提出(broach)”
    <tspan x="50" dy="25">一个大胆的想法，就像用钻头凿开一个新话题。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She broached the topic of salary increase at the meeting.
  </text>
  <text x="50" y="310" class="content">
    她在会议上提出了加薪的话题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Broach (drill) -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
  </g>
</svg>