<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">malaise</text>
  <text x="50" y="120" class="subtitle">[məˈleɪz] n. 不适，倦怠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mal- (坏) + aise (ease, 舒适)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在床上，"坏的舒适(mal-aise)"
    <tspan x="50" dy="25">让他感到全身无力，这就是不适(malaise)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt a general malaise after the long flight.
  </text>
  <text x="50" y="310" class="content">
    长途飞行后，她感到全身不适。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on bed -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Cloud of discomfort -->
    <ellipse cx="175" cy="50" rx="60" ry="30" class="image" />
    <line x1="145" y1="50" x2="115" y2="50" class="image" />
    <line x1="205" y1="50" x2="235" y2="50" class="image" />
    <line x1="175" y1="30" x2="175" y2="70" class="image" />
  </g>
</svg>