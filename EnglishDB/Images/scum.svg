<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scum</text>
  <text x="50" y="120" class="subtitle">[skʌm] n. 浮渣，渣滓；卑鄙的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scum (源自中古英语，意为“浮渣”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一锅沸腾的汤，表面漂浮着一层"浮渣(scum)"，
    <tspan x="50" dy="25">这些浮渣象征着社会中的卑鄙小人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scum of society should be punished.
  </text>
  <text x="50" y="310" class="content">
    社会的渣滓应该受到惩罚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boiling liquid -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Scum -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="60" x2="250" y2="60" class="image" />
    <line x1="70" y1="70" x2="270" y2="70" class="image" />
    <line x1="70" y1="80" x2="240" y2="80" class="image" />
    <!-- Bubbles -->
    <circle cx="100" cy="40" r="10" class="image" />
    <circle cx="150" cy="30" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="250" cy="40" r="10" class="image" />
  </g>
</svg>