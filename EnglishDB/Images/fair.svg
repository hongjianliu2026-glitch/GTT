<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fair</text>
  <text x="50" y="120" class="subtitle">[fer] adj. 公平的，美丽的；n. 集市，展览会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fair (源自拉丁语 "feria"，意为节日或集市)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热闹的集市(fair)，人们在这里公平交易，
    <tspan x="50" dy="25">每个人都带着美丽的笑容，享受着节日的欢乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fair was filled with colorful stalls and happy people.
  </text>
  <text x="50" y="310" class="content">
    集市上摆满了五颜六色的摊位和快乐的人们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fairground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stalls -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="75" cy="100" r="10" class="image" />
    <circle cx="145" cy="100" r="10" class="image" />
    <circle cx="215" cy="100" r="10" class="image" />
    <!-- Smiling faces -->
    <line x1="70" y1="105" x2="80" y2="105" class="image" />
    <line x1="140" y1="105" x2="150" y2="105" class="image" />
    <line x1="210" y1="105" x2="220" y2="105" class="image" />
    <path d="M75 110 Q80 115 85 110" class="image" />
    <path d="M145 110 Q150 115 155 110" class="image" />
    <path d="M215 110 Q220 115 225 110" class="image" />
  </g>
</svg>