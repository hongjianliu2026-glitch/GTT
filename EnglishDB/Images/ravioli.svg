<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ravioli</text>
  <text x="50" y="120" class="subtitle">[ˌræviˈoʊli] n. 意大利饺子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ravi (包裹) + oli (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小厨师在厨房里，"包裹(ravi)"
    <tspan x="50" dy="25">着美味的馅料，做成一个个小巧的饺子(oli)，</tspan>
    <tspan x="50" dy="25">这就是意大利饺子(ravioli)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made ravioli with spinach and ricotta.
  </text>
  <text x="50" y="310" class="content">
    她用菠菜和里科塔奶酪做了意大利饺子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ravioli -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="250" r="15" class="image" />
    <line x1="20" y1="265" x2="20" y2="300" class="image" />
    <line x1="20" y1="300" x2="0" y2="330" class="image" />
    <line x1="20" y1="300" x2="40" y2="330" class="image" />
    <line x1="20" y1="280" x2="50" y2="270" class="image" />
  </g>
</svg>