<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">strike</text>
  <text x="50" y="120" class="subtitle">[straɪk] v. 打击，罢工；n. 罢工，打击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + rike (击打)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群工人"站立(st-)"在工厂前，"击打(rike)"
    <tspan x="50" dy="25">他们的工具，表示他们正在罢工(strike)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The workers decided to strike for better pay.
  </text>
  <text x="50" y="310" class="content">
    工人们决定罢工以争取更好的报酬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Workers -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Tools -->
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <!-- Strike action -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
  </g>
</svg>