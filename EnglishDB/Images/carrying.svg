<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carrying</text>
  <text x="50" y="120" class="subtitle">[ˈkærɪŋ] v. 携带，运送</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> car (车) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在公路上"运送(car-ing)"货物，
    <tspan x="50" dy="25">货物堆得高高的，仿佛要撑破车顶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The truck was carrying a load of furniture.
  </text>
  <text x="50" y="310" class="content">
    卡车正在运送一车家具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Truck -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Cargo -->
    <rect x="70" y="40" width="210" height="60" class="image" />
    <!-- Overloaded cargo -->
    <rect x="90" y="20" width="170" height="20" class="image" />
    <rect x="110" y="0" width="130" height="20" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="130" r="15" class="image" />
    <circle cx="270" cy="130" r="15" class="image" />
  </g>
</svg>