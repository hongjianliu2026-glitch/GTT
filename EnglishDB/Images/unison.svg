<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unison</text>
  <text x="50" y="120" class="subtitle">[ˈjuːnɪsən] n. 一致，和谐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (一个) + son (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人同时发出"一个声音(uni-son)"，
    <tspan x="50" dy="25">他们的声音完全一致，形成和谐的共鸣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The choir sang in perfect unison.
  </text>
  <text x="50" y="310" class="content">
    合唱团以完美的和谐演唱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Sound waves -->
    <path d="M50 80 C 50 120, 150 120, 150 80" class="image" />
    <path d="M150 80 C 150 120, 250 120, 250 80" class="image" />
    <path d="M250 80 C 250 120, 350 120, 350 80" class="image" />
    <!-- Harmony -->
    <text x="150" y="150" class="content" text-anchor="middle">Harmony</text>
  </g>
</svg>