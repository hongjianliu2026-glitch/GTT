<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trauma</text>
  <text x="50" y="120" class="subtitle">[ˈtrɔːmə] n. 创伤，精神创伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> traumat- (伤害) + -a (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"伤害(traumat-)"后，
    <tspan x="50" dy="25">心灵上留下了深深的"创伤(trauma)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident left her with a deep trauma.
  </text>
  <text x="50" y="310" class="content">
    那次事故给她留下了深深的创伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart with a crack -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <!-- Broken heart -->
    <line x1="70" y1="70" x2="130" y2="130" class="image" />
    <line x1="70" y1="130" x2="130" y2="70" class="image" />
  </g>
</svg>