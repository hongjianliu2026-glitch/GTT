<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">assistive</text>
  <text x="50" y="120" class="subtitle">[əˈsɪstɪv] adj. 辅助的，帮助的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> as- (朝向) + sist (站立) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在你旁边，"朝向你站立(as-sist)"，
    <tspan x="50" dy="25">随时准备帮助你，这就是辅助的(assistive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The assistive technology helps people with disabilities.
  </text>
  <text x="50" y="310" class="content">
    辅助技术帮助了有残疾的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />

    <!-- Arrow pointing towards the person -->
    <line x1="200" y1="100" x2="70" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />

    <!-- Hand offering help -->
    <line x1="150" y1="100" x2="180" y2="100" class="image" />
    <line x1="180" y1="100" x2="170" y2="90" class="image" />
    <line x1="180" y1="100" x2="170" y2="110" class="image" />
  </g>
</svg>