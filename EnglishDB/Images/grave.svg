<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #6C3483; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grave</text>
  <text x="50" y="120" class="subtitle">[ɡreɪv] adj. 严重的，严肃的；n. 坟墓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grav (重)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个沉重的石头压在心上，"重(grav)"
    <tspan x="50" dy="25">的感觉让人感到严肃(grave)，就像站在坟墓(grave)前一样沉重。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The situation is grave; we must act quickly.
  </text>
  <text x="50" y="310" class="content">
    情况很严重，我们必须迅速行动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grave -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tombstone -->
    <rect x="100" y="20" width="150" height="100" class="image" />
    <!-- Stone -->
    <circle cx="20" cy="100" r="30" class="image" />
    <!-- Heart -->
    <path d="M200,100 C210,70 250,70 260,100" class="image" />
    <path d="M200,100 C210,130 250,130 260,100" class="image" />
    <path d="M210,100 L250,100" class="image" />
  </g>
</svg>