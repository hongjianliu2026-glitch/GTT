<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dancer</text>
  <text x="50" y="120" class="subtitle">[ˈdænsər] n. 舞者，舞蹈演员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dance (跳舞) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舞者在舞台上，"翩翩起舞(dance)"，
    <tspan x="50" dy="25">优雅的舞姿让人陶醉，这就是舞者(dancer)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a professional dancer with years of experience.
  </text>
  <text x="50" y="310" class="content">
    她是一位经验丰富的专业舞者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dancer -->
    <circle cx="175" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="175" y1="120" x2="175" y2="160" class="image" /> <!-- Body -->
    <line x1="175" y1="140" x2="150" y2="120" class="image" /> <!-- Left arm -->
    <line x1="175" y1="140" x2="200" y2="120" class="image" /> <!-- Right arm -->
    <line x1="175" y1="160" x2="150" y2="180" class="image" /> <!-- Left leg -->
    <line x1="175" y1="160" x2="200" y2="180" class="image" /> <!-- Right leg -->
  </g>
</svg>