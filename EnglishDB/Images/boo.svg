<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boo</text>
  <text x="50" y="120" class="subtitle">[buː] int. 嘘声，吓唬声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 拟声词，模仿嘘声或吓唬声
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调皮的小孩在黑暗中突然发出"嘘"(boo)声，
    <tspan x="50" dy="25">吓得周围的人一跳，这就是"boo"的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The audience booed the speaker off the stage.
  </text>
  <text x="50" y="310" class="content">
    观众对演讲者发出嘘声，让他下台。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Ghost -->
    <circle cx="175" cy="100" r="30" class="image" fill="#FFFFFF" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Boo text -->
    <text x="160" y="80" class="content" fill="#E74C3C" font-size="36">BOO!</text>
  </g>
</svg>