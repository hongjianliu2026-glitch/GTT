<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Venetian</text>
  <text x="50" y="120" class="subtitle">[vəˈniːʃən] adj. 威尼斯的，威尼斯人的；n. 威尼斯人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Veneto (威尼托地区) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着面具的威尼斯人，站在一座
    <tspan x="50" dy="25">古老的桥上，桥下是缓缓流动的运河，</tspan>
    <tspan x="50" dy="25">这就是威尼斯(Venetian)的独特风情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Venetian masks are famous for their elaborate designs.
  </text>
  <text x="50" y="310" class="content">
    威尼斯面具以其精美的设计而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bridge -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="300" y1="100" x2="300" y2="150" class="image" />
    <!-- Canal -->
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
    <!-- Mask -->
    <rect x="150" y="50" width="50" height="50" class="image" />
    <circle cx="175" cy="75" r="20" class="image" />
    <!-- Person -->
    <circle cx="175" cy="125" r="15" class="image" />
    <line x1="175" y1="140" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="210" class="image" />
    <line x1="175" y1="180" x2="195" y2="210" class="image" />
    <line x1="175" y1="160" x2="200" y2="150" class="image" />
  </g>
</svg>