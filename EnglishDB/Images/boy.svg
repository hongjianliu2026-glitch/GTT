<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boy</text>
  <text x="50" y="120" class="subtitle">[bɔɪ] n. 男孩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boi- (源自中古英语 boi, 意为“男孩”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小男孩(boy)在草地上奔跑，
    <tspan x="50" dy="25">他的笑声如同阳光般灿烂，充满了童年的快乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boy was playing with his friends in the park.
  </text>
  <text x="50" y="310" class="content">
    那个男孩正在公园里和他的朋友们玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#27AE60" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Boy -->
    <circle cx="100" cy="120" r="20" class="image" fill="#E74C3C" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="160" x2="80" y2="150" class="image" />
    <line x1="100" y1="160" x2="120" y2="150" class="image" />
  </g>
</svg>