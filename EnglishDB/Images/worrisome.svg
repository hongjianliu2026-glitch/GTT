<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">worrisome</text>
  <text x="50" y="120" class="subtitle">[ˈwʌrɪsəm] adj. 令人担忧的，令人烦恼的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> worr (担忧) + -some (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个皱着眉头的人，"担忧(worr)"
    <tspan x="50" dy="25">得眉头紧锁，这就是令人担忧的(worrisome)场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The worrisome news kept her awake all night.
  </text>
  <text x="50" y="310" class="content">
    令人担忧的消息让她彻夜难眠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Worried face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="35" y1="40" x2="45" y2="40" class="image" />
    <line x1="55" y1="40" x2="65" y2="40" class="image" />
    <path d="M30 60 Q50 80 70 60" class="image" />
    <!-- Cloud -->
    <ellipse cx="150" cy="50" rx="60" ry="30" class="image" />
    <ellipse cx="120" cy="40" rx="20" ry="10" class="image" />
    <ellipse cx="180" cy="40" rx="20" ry="10" class="image" />
    <ellipse cx="150" cy="60" rx="20" ry="10" class="image" />
    <!-- Lightning -->
    <line x1="140" y1="20" x2="160" y2="80" class="image" />
    <line x1="160" y1="80" x2="180" y2="20" class="image" />
  </g>
</svg>