<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">congratulate</text>
  <text x="50" y="120" class="subtitle">[kənˈɡrætʃəˌleɪt] v. 祝贺，恭喜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + grat (高兴) + -ulate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围在一起，"共同(con-)"分享"高兴(grat)"的时刻，
    <tspan x="50" dy="25">他们互相"祝贺(congratulate)"对方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We all congratulated him on his success.
  </text>
  <text x="50" y="310" class="content">
    我们都祝贺他的成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Hands -->
    <line x1="50" y1="70" x2="100" y2="70" class="image" />
    <line x1="150" y1="70" x2="100" y2="70" class="image" />
    <line x1="100" y1="120" x2="100" y2="70" class="image" />
    <!-- Smiling faces -->
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="140" y1="40" x2="160" y2="40" class="image" />
    <line x1="90" y1="90" x2="110" y2="90" class="image" />
    <!-- Confetti -->
    <line x1="0" y1="0" x2="200" y2="200" class="image" />
    <line x1="0" y1="200" x2="200" y2="0" class="image" />
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
  </g>
</svg>