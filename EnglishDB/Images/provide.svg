<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">provide</text>
  <text x="50" y="120" class="subtitle">[prəˈvaɪd] v. 提供，供给</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + vide (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人向前伸出双手，"提前看到(pro-vide)"
    <tspan x="50" dy="25">并提供所需的东西，这就是提供(provide)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company provides free lunch for its employees.
  </text>
  <text x="50" y="310" class="content">
    公司为员工提供免费午餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with outstretched arms -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Box being provided -->
    <rect x="120" y="120" width="60" height="60" class="image" />
    <!-- Arrow pointing to the box -->
    <line x1="100" y1="150" x2="120" y2="150" class="image" />
    <polygon points="100,150 110,145 110,155" class="image" />
  </g>
</svg>