<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">barometer</text>
  <text x="50" y="120" class="subtitle">[bəˈrɒmɪtə(r)] n. 气压计</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> baro- (压力) + meter (测量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气压计，"测量(meter)"
    <tspan x="50" dy="25">大气压力(baro)，预测天气变化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The barometer is falling, indicating an approaching storm.
  </text>
  <text x="50" y="310" class="content">
    气压计在下降，表明暴风雨即将来临。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Barometer -->
    <rect x="0" y="0" width="100" height="300" class="image" />
    <!-- Pressure indicator -->
    <line x1="50" y1="50" x2="50" y2="250" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="50" cy="250" r="10" class="image" />
    <!-- Pressure change -->
    <line x1="50" y1="250" x2="50" y2="150" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
  </g>
</svg>