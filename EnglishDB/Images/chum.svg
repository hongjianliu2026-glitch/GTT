<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chum</text>
  <text x="50" y="120" class="subtitle">[tʃʌm] n. 好友，伙伴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chum (源自中古英语 "cume"，意为“伙伴”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个好友(chum)在海边钓鱼，他们互相帮助，
    <tspan x="50" dy="25">一起分享快乐时光，这就是“chum”的真正含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He and his chum went fishing together.
  </text>
  <text x="50" y="310" class="content">
    他和他的好友一起去钓鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Friends -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Fishing rods -->
    <line x1="50" y1="130" x2="0" y2="200" class="image" />
    <line x1="150" y1="130" x2="200" y2="200" class="image" />
    <!-- Fish -->
    <path d="M0,200 Q25,175 50,200 T100,200" class="image" />
    <path d="M200,200 Q175,175 150,200 T100,200" class="image" />
  </g>
</svg>