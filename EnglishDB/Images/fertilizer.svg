<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fertilizer { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fertilizer</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrtlˌaɪzər] n. 肥料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fer (带来) + til (生长) + izer (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民在田地里撒下"带来(fer)生长(til)"的物质，
    <tspan x="50" dy="25">这些物质就是肥料(fertilizer)，帮助庄稼茁壮成长。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer applied fertilizer to the fields to boost crop growth.
  </text>
  <text x="50" y="310" class="content">
    农民给田地施了肥料以促进作物生长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fertilizer bag -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <text x="90" y="70" class="fertilizer">Fertilizer</text>
    <!-- Farmer -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Crops -->
    <line x1="280" y1="180" x2="280" y2="150" class="image" />
    <line x1="290" y1="180" x2="290" y2="140" class="image" />
    <line x1="300" y1="180" x2="300" y2="160" class="image" />
    <line x1="310" y1="180" x2="310" y2="170" class="image" />
  </g>
</svg>