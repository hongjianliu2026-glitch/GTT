<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">largemouth</text>
  <text x="50" y="120" class="subtitle">[ˈlɑːrʤmaʊθ] n. 大嘴鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> large (大) + mouth (嘴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条鱼，它的嘴大得可以吞下整个西瓜，这就是"大嘴鱼(largemouth)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The largemouth bass is a popular game fish.
  </text>
  <text x="50" y="310" class="content">
    大嘴鲈鱼是一种受欢迎的游钓鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Fish body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Fish mouth -->
    <rect x="50" y="70" width="200" height="60" class="image" />
    <!-- Fish eye -->
    <circle cx="220" cy="80" r="10" class="image" />
    <!-- Watermelon -->
    <ellipse cx="300" cy="150" rx="50" ry="30" class="image" />
    <line x1="275" y1="135" x2="325" y2="165" class="image" />
    <line x1="275" y1="165" x2="325" y2="135" class="image" />
  </g>
</svg>