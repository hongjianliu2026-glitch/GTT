<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ahh</text>
  <text x="50" y="120" class="subtitle">[ɑː] int. 啊（表示惊讶、痛苦、喜悦等）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，为拟声词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然看到一只巨大的蜘蛛，发出"啊(ahh)"的一声惊叫。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> AHH! There's a spider on the wall!
  </text>
  <text x="50" y="310" class="content">
    啊！墙上有一只蜘蛛！
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="100" class="image" />
    <line x1="50" y1="90" x2="80" y2="100" class="image" />
    <!-- Spider -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="180" y2="85" class="image" />
    <line x1="200" y1="65" x2="220" y2="85" class="image" />
    <line x1="200" y1="65" x2="190" y2="85" class="image" />
    <line x1="200" y1="65" x2="210" y2="85" class="image" />
    <line x1="200" y1="65" x2="185" y2="85" class="image" />
    <line x1="200" y1="65" x2="215" y2="85" class="image" />
    <!-- Exclamation mark -->
    <text x="100" y="100" class="highlight" font-size="60">!</text>
  </g>
</svg>