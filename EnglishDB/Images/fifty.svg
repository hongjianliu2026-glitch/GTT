<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fifty</text>
  <text x="50" y="120" class="subtitle">[ˈfɪfti] n. 五十</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fif- (五) + ty (表示数量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“50”，它像一座高耸的塔，
    <tspan x="50" dy="25">象征着五十个单位的集合，每个单位都整齐排列，</tspan>
    <tspan x="50" dy="25">形成了一个坚固的结构，代表着五十的稳固和完整。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has fifty books on her shelf.
  </text>
  <text x="50" y="310" class="content">
    她的书架上有五十本书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tower of 50 -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <text x="175" y="100" font-size="100" text-anchor="middle" fill="#34495E">50</text>
    <!-- Units -->
    <rect x="50" y="150" width="30" height="30" class="image" />
    <rect x="90" y="150" width="30" height="30" class="image" />
    <rect x="130" y="150" width="30" height="30" class="image" />
    <rect x="170" y="150" width="30" height="30" class="image" />
    <rect x="210" y="150" width="30" height="30" class="image" />
    <rect x="250" y="150" width="30" height="30" class="image" />
    <rect x="290" y="150" width="30" height="30" class="image" />
    <rect x="50" y="190" width="30" height="30" class="image" />
    <rect x="90" y="190" width="30" height="30" class="image" />
    <rect x="130" y="190" width="30" height="30" class="image" />
    <rect x="170" y="190" width="30" height="30" class="image" />
    <rect x="210" y="190" width="30" height="30" class="image" />
    <rect x="250" y="190" width="30" height="30" class="image" />
    <rect x="290" y="190" width="30" height="30" class="image" />
  </g>
</svg>