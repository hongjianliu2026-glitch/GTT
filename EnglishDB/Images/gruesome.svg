<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gruesome</text>
  <text x="50" y="120" class="subtitle">[ˈɡruːsəm] adj. 可怕的，令人毛骨悚然的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grues (恐怖) + -some (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恐怖的场景，"恐怖(grues)"
    <tspan x="50" dy="25">的氛围让人感到毛骨悚然(gruesome)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gruesome murder scene was too much for the police to handle.
  </text>
  <text x="50" y="310" class="content">
    那可怕的谋杀现场让警察难以应对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skull -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="80" y1="150" x2="120" y2="150" class="image" />
    <!-- Blood splatter -->
    <circle cx="150" cy="50" r="10" class="image" fill="#B03A2E" />
    <circle cx="180" cy="70" r="15" class="image" fill="#B03A2E" />
    <circle cx="200" cy="90" r="20" class="image" fill="#B03A2E" />
  </g>
</svg>