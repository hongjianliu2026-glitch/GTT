<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">type</text>
  <text x="50" y="120" class="subtitle">[taɪp] n. 类型，种类；v. 打字</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> typ- (种类) + -e (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的分类机，"种类(typ-)"
    <tspan x="50" dy="25">被整齐地排列在不同的格子里，每个格子代表一种类型(type)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers to type her documents on a typewriter.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢用打字机打她的文件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classification machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Shelves -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Types -->
    <rect x="70" y="40" width="50" height="30" class="image" />
    <rect x="140" y="40" width="50" height="30" class="image" />
    <rect x="210" y="40" width="50" height="30" class="image" />
    <rect x="70" y="90" width="50" height="30" class="image" />
    <rect x="140" y="90" width="50" height="30" class="image" />
    <rect x="210" y="90" width="50" height="30" class="image" />
    <!-- Labels -->
    <text x="75" y="65" class="content">Type A</text>
    <text x="145" y="65" class="content">Type B</text>
    <text x="215" y="65" class="content">Type C</text>
    <text x="75" y="115" class="content">Type D</text>
    <text x="145" y="115" class="content">Type E</text>
    <text x="215" y="115" class="content">Type F</text>
  </g>
</svg>