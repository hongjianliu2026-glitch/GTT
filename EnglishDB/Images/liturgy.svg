<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liturgy</text>
  <text x="50" y="120" class="subtitle">[ˈlɪtərdʒi] n. 礼拜仪式，圣餐仪式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lit- (光) + urg (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个教堂里，"光(lit)"照耀着正在进行"工作(urg)"的礼拜仪式(liturgy)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The priest led the liturgy with great reverence.
  </text>
  <text x="50" y="310" class="content">
    牧师以极大的敬意主持了礼拜仪式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cross -->
    <line x1="175" y1="20" x2="175" y2="100" class="image" />
    <line x1="150" y1="60" x2="200" y2="60" class="image" />
    <!-- Light rays -->
    <line x1="175" y1="20" x2="100" y2="0" class="image" />
    <line x1="175" y1="20" x2="250" y2="0" class="image" />
    <line x1="175" y1="20" x2="300" y2="50" class="image" />
    <line x1="175" y1="20" x2="50" y2="50" class="image" />
    <!-- Priest -->
    <circle cx="175" cy="150" r="15" class="image" />
    <line x1="175" y1="165" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="150" y2="220" class="image" />
    <line x1="175" y1="190" x2="200" y2="220" class="image" />
    <line x1="175" y1="175" x2="220" y2="165" class="image" />
  </g>
</svg>