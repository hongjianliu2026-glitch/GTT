<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hand-held</text>
  <text x="50" y="120" class="subtitle">[ˈhændˌhɛld] adj. 手持的，便携的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + held (持有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人手持(hand-held)一个迷你设备，
    <tspan x="50" dy="25">轻松地在手中操作，这就是手持设备(hand-held device)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The technician used a hand-held scanner to diagnose the problem.
  </text>
  <text x="50" y="310" class="content">
    技术人员使用手持扫描仪来诊断问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Hand -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />

    <!-- Device -->
    <rect x="60" y="80" width="100" height="60" class="image" />
    <line x1="80" y1="90" x2="140" y2="90" class="image" />
    <line x1="80" y1="110" x2="140" y2="110" class="image" />
    <line x1="80" y1="130" x2="140" y2="130" class="image" />
  </g>
</svg>