<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spatially</text>
  <text x="50" y="120" class="subtitle">[ˈspeɪʃəli] adv. 空间上地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spat (空间) + ial (形容词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的空间，"空间(spat)"中充满了各种形状和物体，
    <tspan x="50" dy="25">这些物体在空间中"分布(ial)"，形成了一个"空间上(ly)"的布局。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The furniture was arranged spatially to maximize the use of the room.
  </text>
  <text x="50" y="310" class="content">
    家具被空间上地布置，以最大化利用房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Space -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Objects in space -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <line x1="180" y1="40" x2="220" y2="80" class="image" />
    <line x1="180" y1="80" x2="220" y2="40" class="image" />
    <circle cx="280" cy="100" r="30" class="image" />
    <!-- Spatial distribution -->
    <line x1="20" y1="150" x2="330" y2="150" class="image" />
    <line x1="20" y1="160" x2="330" y2="160" class="image" />
    <line x1="20" y1="170" x2="330" y2="170" class="image" />
  </g>
</svg>