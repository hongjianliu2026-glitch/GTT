<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
      .grass { fill: #2ECC71; }
      .shovel { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">landscaping</text>
  <text x="50" y="120" class="subtitle">[ˈlændˌskeɪpɪŋ] n. 景观美化，园林设计</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> land (土地) + scape (景色) + ing (进行中的动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个园艺师在土地上"塑造景色(land-scape-ing)"，
    <tspan x="50" dy="25">他挥舞着铲子，种下一棵棵树，草地也随之铺展开来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The landscaping project transformed the backyard into a serene oasis.
  </text>
  <text x="50" y="310" class="content">
    景观美化项目将后院变成了一个宁静的绿洲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Grass -->
    <rect x="50" y="100" width="250" height="100" class="grass" />
    <!-- Tree -->
    <circle cx="150" cy="80" r="30" class="tree" />
    <line x1="150" y1="110" x2="150" y2="180" class="image" />
    <!-- Shovel -->
    <rect x="250" y="120" width="20" height="80" class="shovel" />
    <line x1="260" y1="120" x2="260" y2="40" class="image" />
    <line x1="260" y1="40" x2="240" y2="60" class="image" />
    <line x1="260" y1="40" x2="280" y2="60" class="image" />
  </g>
</svg>