<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">radish</text>
  <text x="50" y="120" class="subtitle">[ˈrædɪʃ] n. 萝卜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rad (根) + -ish (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的萝卜(radish)从地里"根(rad)"
    <tspan x="50" dy="25">部生长出来，它的根部像树根一样粗壮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added sliced radishes to her salad.
  </text>
  <text x="50" y="310" class="content">
    她在沙拉里加了切片的萝卜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Radish -->
    <ellipse cx="100" cy="100" rx="50" ry="80" fill="#8B4513" />
    <rect x="50" y="20" width="100" height="80" fill="#8B4513" />
    <!-- Roots -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
  </g>
</svg>