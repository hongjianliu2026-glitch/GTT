<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retardation</text>
  <text x="50" y="120" class="subtitle">[ˌriːtɑːrˈdeɪʃn] n. 延迟，阻碍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + tard (慢) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在前进的路上，突然被"向后拉(re-tard)"，
    <tspan x="50" dy="25">导致速度变慢，这就是延迟(retardation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project's progress suffered from severe retardation.
  </text>
  <text x="50" y="310" class="content">
    项目的进展受到了严重的延迟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Car -->
    <rect x="50" y="70" width="100" height="60" class="image" />
    <rect x="60" y="50" width="30" height="20" class="image" />
    <rect x="110" y="50" width="30" height="20" class="image" />
    <!-- Retardation force -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="175" y1="80" x2="175" y2="120" class="image" />
    <line x1="150" y1="100" x2="175" y2="80" class="image" />
    <line x1="200" y1="100" x2="175" y2="120" class="image" />
    <text x="160" y="140" class="content">←</text>
  </g>
</svg>