<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">worldly</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrldli] adj. 世间的，世俗的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> world (世界) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅行者在世界各地游历，"体验世间(worldly)"
    <tspan x="50" dy="25">的繁华与沧桑，他的经历让他变得世俗(worldly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His worldly wisdom helped him navigate the complexities of life.
  </text>
  <text x="50" y="310" class="content">
    他的世俗智慧帮助他应对生活的复杂性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Traveler -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Cities -->
    <rect x="100" y="20" width="15" height="15" class="image" />
    <rect x="250" y="20" width="15" height="15" class="image" />
    <rect x="100" y="180" width="15" height="15" class="image" />
    <rect x="250" y="180" width="15" height="15" class="image" />
  </g>
</svg>