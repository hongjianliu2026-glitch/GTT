<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">initiation</text>
  <text x="50" y="120" class="subtitle">[ˌɪnɪʃiˈeɪʃn] n. 开始，启蒙，入会仪式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + it (走) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的仪式，"走进(in-it)"
    <tspan x="50" dy="25">一个全新的世界，这就是启蒙(initiation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The initiation ceremony was held in a secret location.
  </text>
  <text x="50" y="310" class="content">
    入会仪式在一个秘密地点举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle representing the initiation -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Doorway -->
    <rect x="125" y="60" width="100" height="80" class="image" />
    <!-- Person entering -->
    <circle cx="175" cy="150" r="15" class="image" />
    <line x1="175" y1="165" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="180" x2="205" y2="170" class="image" />
  </g>
</svg>