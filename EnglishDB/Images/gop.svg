<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">GOP</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɒp] n. 大象，共和党</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Grand Old Party (缩写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头巨大的老象(GOP)，象征着共和党，
    <tspan x="50" dy="25">它稳重而强大，代表着保守和传统。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The GOP has a strong presence in the rural areas.
  </text>
  <text x="50" y="310" class="content">
    共和党在农村地区有很强的影响力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elephant -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" /> <!-- Body -->
    <circle cx="100" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="100" y1="80" x2="100" y2="150" class="image" /> <!-- Trunk -->
    <line x1="100" y1="150" x2="80" y2="180" class="image" /> <!-- Front leg -->
    <line x1="100" y1="150" x2="120" y2="180" class="image" /> <!-- Back leg -->
    <line x1="100" y1="100" x2="50" y2="100" class="image" /> <!-- Tail -->
  </g>
</svg>