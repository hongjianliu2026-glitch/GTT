<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sore</text>
  <text x="50" y="120" class="subtitle">[sɔːr] adj. 疼痛的，痛心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sōr- (疼痛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个受伤的脚趾，"疼痛(sōr)"
    <tspan x="50" dy="25">得让人无法忍受，这就是sore的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My feet are sore after a long hike.
  </text>
  <text x="50" y="310" class="content">
    长途徒步后，我的脚很疼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Foot with a sore toe -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Foot -->
    <circle cx="150" cy="80" r="10" class="image" fill="#C0392B" /> <!-- Sore toe -->
    <line x1="150" y1="90" x2="150" y2="120" class="image" stroke-width="4" stroke="#C0392B" /> <!-- Pain line -->
  </g>
</svg>