<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">odor</text>
  <text x="50" y="120" class="subtitle">[ˈoʊdər] n. 气味，臭味</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> od (气味) + or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的鼻子，"嗅到(od)"
    <tspan x="50" dy="25">空气中弥漫的气味(odor)，</tspan>
    <tspan x="50" dy="25">这些气味可能是香甜的，也可能是刺鼻的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The odor of fresh flowers filled the room.
  </text>
  <text x="50" y="310" class="content">
    鲜花的香味充满了房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nose -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Smell lines -->
    <line x1="100" y1="50" x2="50" y2="0" class="image" />
    <line x1="100" y1="50" x2="150" y2="0" class="image" />
    <line x1="100" y1="50" x2="0" y2="50" class="image" />
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
  </g>
</svg>