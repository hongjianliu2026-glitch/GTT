<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brutally</text>
  <text x="50" y="120" class="subtitle">[ˈbruːtəli] adv. 残酷地，野蛮地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brut- (野兽) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只野兽(brut-)在森林中，"野蛮地(brutally)"
    <tspan x="50" dy="25">咆哮着，撕咬着猎物，展现出其残酷的本性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers were brutally attacked by the enemy.
  </text>
  <text x="50" y="310" class="content">
    士兵们遭到了敌人残酷的攻击。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beast -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Forest -->
    <rect x="0" y="200" width="100" height="50" class="image" />
    <rect x="10" y="210" width="80" height="40" class="image" />
    <rect x="20" y="220" width="60" height="30" class="image" />
    <rect x="30" y="230" width="40" height="20" class="image" />
    <rect x="40" y="240" width="20" height="10" class="image" />
  </g>
</svg>