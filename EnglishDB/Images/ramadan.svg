<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5EFE6; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Ramadan</text>
  <text x="50" y="120" class="subtitle">[ˌræməˈdɑːn] n. 斋月</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Ramadan源自阿拉伯语رمضان (Ramadān)，意为“热”或“干燥”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在炎热的沙漠中，人们"忍受着热(Ramadan)"，
    <tspan x="50" dy="25">白天禁食，夜晚祈祷，这就是斋月(Ramadan)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> During Ramadan, Muslims fast from dawn until sunset.
  </text>
  <text x="50" y="310" class="content">
    在斋月期间，穆斯林从黎明到日落禁食。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F39C12" />
    <!-- Desert -->
    <rect x="0" y="150" width="350" height="150" class="image" fill="#D4AC0D" />
    <!-- Person praying -->
    <circle cx="200" cy="200" r="15" class="image" fill="#2C3E50" />
    <line x1="200" y1="215" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="180" y2="280" class="image" />
    <line x1="200" y1="250" x2="220" y2="280" class="image" />
    <line x1="200" y1="230" x2="230" y2="220" class="image" />
  </g>
</svg>