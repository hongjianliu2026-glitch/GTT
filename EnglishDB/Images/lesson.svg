<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lesson</text>
  <text x="50" y="120" class="subtitle">[ˈlɛsən] n. 课，教训</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> less (学) + -on (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在教室里，"学习(less)"
    <tspan x="50" dy="25">并从中获得教训(lesson)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She learned a valuable lesson from her mistake.
  </text>
  <text x="50" y="310" class="content">
    她从错误中学到了宝贵的教训。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Desk -->
    <rect x="50" y="100" width="250" height="80" class="image" />
    <!-- Student -->
    <circle cx="100" cy="80" r="15" class="image" />
    <line x1="100" y1="95" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="80" y2="160" class="image" />
    <line x1="100" y1="130" x2="120" y2="160" class="image" />
    <line x1="100" y1="110" x2="130" y2="100" class="image" />
    <!-- Book -->
    <rect x="150" y="110" width="80" height="60" class="image" />
    <line x1="150" y1="130" x2="230" y2="130" class="image" />
    <line x1="150" y1="150" x2="230" y2="150" class="image" />
  </g>
</svg>