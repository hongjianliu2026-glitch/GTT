<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confrontation</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnfrʌnˈteɪʃn] n. 对抗，冲突</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + front (前面) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站着，"共同面对(con-front)"
    <tspan x="50" dy="25">彼此，气氛紧张，这就是对抗(confrontation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The confrontation between the two leaders was intense.
  </text>
  <text x="50" y="310" class="content">
    两位领导人之间的对抗非常激烈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <!-- Tension lines -->
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <!-- Ground -->
    <line x1="0" y1="150" x2="300" y2="150" class="image" />
  </g>
</svg>