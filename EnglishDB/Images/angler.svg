<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">angler</text>
  <text x="50" y="120" class="subtitle">[ˈæŋɡlər] n. 钓鱼者，垂钓者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ang (角) + -ler (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个钓鱼者(angler)坐在河边，手持鱼竿，鱼线在水中形成一个"角(ang)"，
    <tspan x="50" dy="25">等待鱼儿上钩。这个"角"象征着钓鱼者的耐心和技巧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The angler patiently waited for a bite.
  </text>
  <text x="50" y="310" class="content">
    钓鱼者耐心地等待着鱼儿上钩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Angler -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Fishing rod -->
    <line x1="50" y1="115" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <!-- Fish -->
    <path d="M150,100 C160,80 180,80 190,100" class="image" />
    <path d="M150,100 C160,120 180,120 190,100" class="image" />
  </g>
</svg>