  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cut</text>
  <text x="50" y="120" class="subtitle">[kʌt] v. 切，割；n. 伤口，切口</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始印欧语 *kéus- (刺，穿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀子"刺穿(kéus-)"一块肉，
    <tspan x="50" dy="25">瞬间留下了一个深深的切口(cut)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He accidentally cut his finger while chopping vegetables.
  </text>
  <text x="50" y="310" class="content">
    他在切菜时不小心割伤了手指。
  </text>

