<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">invading</text>
  <text x="50" y="120" class="subtitle">[ɪnˈveɪdɪŋ] v. 入侵，侵略</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vad (走) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一支军队"走进(in-vad-ing)"一个国家，
    <tspan x="50" dy="25">他们正在入侵(invading)，场面紧张而激烈。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The army is invading the neighboring country.
  </text>
  <text x="50" y="310" class="content">
    军队正在入侵邻国。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Country border -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Army -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="110" x2="100" y2="110" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <!-- Soldiers -->
    <circle cx="70" cy="50" r="5" class="image" />
    <circle cx="70" cy="80" r="5" class="image" />
    <circle cx="70" cy="110" r="5" class="image" />
    <circle cx="70" cy="140" r="5" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="95" x2="150" y2="95" class="image" />
    <polygon points="150,95 145,90 145,100" class="image" />
  </g>
</svg>