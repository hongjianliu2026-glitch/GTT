<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">debt</text>
  <text x="50" y="120" class="subtitle">[dɛt] n. 债务，欠款</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + bt (给予)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人欠了钱，"离开(de-)"了原本的财富，
    <tspan x="50" dy="25">需要"给予(bt)"别人才能偿还债务(debt)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He managed to pay off his debt in two years.
  </text>
  <text x="50" y="310" class="content">
    他花了两年时间还清了债务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Money bag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Arrow pointing away -->
    <line x1="170" y1="50" x2="300" y2="50" class="image" />
    <polygon points="300,50 290,45 290,55" class="image" />
    <!-- Person -->
    <circle cx="350" cy="50" r="15" class="image" />
    <line x1="350" y1="65" x2="350" y2="100" class="image" />
    <line x1="350" y1="100" x2="330" y2="130" class="image" />
    <line x1="350" y1="100" x2="370" y2="130" class="image" />
    <line x1="350" y1="80" x2="380" y2="70" class="image" />
  </g>
</svg>