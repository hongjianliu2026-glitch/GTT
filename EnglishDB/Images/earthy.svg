<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5DC; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #A0522D; }
      .content { font: 18px sans-serif; fill: #654321; }
      .highlight { font-weight: bold; fill: #CD853F; }
      .story { font: 16px serif; fill: #D2691E; }
      .image { stroke: #8B4513; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">earthy</text>
  <text x="50" y="120" class="subtitle">[ˈɜːrθi] adj. 泥土的，朴实的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> earth (泥土) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在田地里，脚踩着"泥土(earth)"，
    <tspan x="50" dy="25">他的衣服和脸上都沾满了泥土，显得非常朴实(earthy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The earthy smell of the garden after rain is refreshing.
  </text>
  <text x="50" y="310" class="content">
    雨后花园里泥土的气息令人神清气爽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Farmer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Dirt -->
    <rect x="0" y="180" width="100" height="20" class="image" />
    <rect x="20" y="200" width="60" height="20" class="image" />
    <rect x="40" y="220" width="20" height="20" class="image" />
    <!-- Field -->
    <rect x="0" y="240" width="350" height="50" class="image" />
  </g>
</svg>