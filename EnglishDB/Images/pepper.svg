<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pepper</text>
  <text x="50" y="120" class="subtitle">[ˈpɛpər] n. 胡椒，辣椒；v. 加胡椒粉于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pep (活力) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"活力四射地(pep)"
    <tspan x="50" dy="25">撒下胡椒粉(pepper)，让菜肴更加美味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She peppered the soup with extra spices.
  </text>
  <text x="50" y="310" class="content">
    她在汤里加了额外的香料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Pepper shaker -->
    <rect x="70" y="80" width="30" height="60" class="image" />
    <line x1="85" y1="80" x2="85" y2="20" class="image" />
    <line x1="70" y1="100" x2="100" y2="100" class="image" />
    <line x1="70" y1="120" x2="100" y2="120" class="image" />
    <line x1="70" y1="140" x2="100" y2="140" class="image" />
    <!-- Pepper particles -->
    <circle cx="120" cy="90" r="5" class="image" />
    <circle cx="130" cy="100" r="5" class="image" />
    <circle cx="140" cy="110" r="5" class="image" />
    <circle cx="150" cy="120" r="5" class="image" />
  </g>
</svg>