<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">baffle</text>
  <text x="50" y="120" class="subtitle">[ˈbæfəl] v. 使困惑，难住</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> baff (阻碍) + -le (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个谜题，"反复阻碍(baff-le)"
    <tspan x="50" dy="25">你的思维，让你感到困惑(baffle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The complex problem baffled the students.
  </text>
  <text x="50" y="310" class="content">
    这个复杂的问题难住了学生们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="150" height="150" class="image" />
    <rect x="20" y="20" width="50" height="50" class="image" />
    <rect x="80" y="20" width="50" height="50" class="image" />
    <rect x="20" y="80" width="50" height="50" class="image" />
    <rect x="80" y="80" width="50" height="50" class="image" />
    <!-- Question mark -->
    <text x="180" y="100" font-size="100" fill="#7F8C8D">?</text>
  </g>
</svg>