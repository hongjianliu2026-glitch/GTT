<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spruce</text>
  <text x="50" y="120" class="subtitle">[spruːs] n. 云杉；v. 打扮，装饰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自斯堪的纳维亚语，原指云杉树
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵高大的云杉树，"打扮(spruce)"
    <tspan x="50" dy="25">得像圣诞树一样，挂满了彩灯和装饰品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spruced up her room for the party.
  </text>
  <text x="50" y="310" class="content">
    她为了派对把房间装饰了一番。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <!-- Decorations -->
    <circle cx="100" cy="50" r="10" fill="#FFD700" />
    <circle cx="75" cy="100" r="10" fill="#FFD700" />
    <circle cx="125" cy="100" r="10" fill="#FFD700" />
    <circle cx="100" cy="150" r="10" fill="#FFD700" />
  </g>
</svg>