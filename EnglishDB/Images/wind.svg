<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wind</text>
  <text x="50" y="120" class="subtitle">[wɪnd] n. 风；v. 缠绕，弯曲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wind (风)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一阵狂风(wind)吹过，树枝被吹得"弯曲(wind)"，
    <tspan x="50" dy="25">仿佛在跳舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wind blew the leaves off the trees.
  </text>
  <text x="50" y="310" class="content">
    风把树叶从树上吹落了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wind -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="20" x2="350" y2="220" class="image" />
    <line x1="0" y1="40" x2="350" y2="240" class="image" />
    <line x1="0" y1="60" x2="350" y2="260" class="image" />
    <line x1="0" y1="80" x2="350" y2="280" class="image" />
    <line x1="0" y1="100" x2="350" y2="300" class="image" />
    <line x1="0" y1="120" x2="350" y2="320" class="image" />
    <line x1="0" y1="140" x2="350" y2="340" class="image" />
    <line x1="0" y1="160" x2="350" y2="360" class="image" />
    <line x1="0" y1="180" x2="350" y2="380" class="image" />
    <line x1="0" y1="200" x2="350" y2="400" class="image" />
    <!-- Tree -->
    <rect x="150" y="100" width="20" height="200" class="image" />
    <line x1="160" y1="100" x2="140" y2="120" class="image" />
    <line x1="160" y1="100" x2="180" y2="120" class="image" />
    <line x1="160" y1="150" x2="140" y2="170" class="image" />
    <line x1="160" y1="150" x2="180" y2="170" class="image" />
    <line x1="160" y1="200" x2="140" y2="220" class="image" />
    <line x1="160" y1="200" x2="180" y2="220" class="image" />
  </g>
</svg>