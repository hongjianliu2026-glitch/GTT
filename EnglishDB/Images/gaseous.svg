<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .gas { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gaseous</text>
  <text x="50" y="120" class="subtitle">[ˈɡeɪəsəs] adj. 气体的，气态的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gas (气体) + -eous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，里面充满了"气体(gas)"，
    <tspan x="50" dy="25">它膨胀得越来越大，仿佛要冲破天际，这就是气态的(gaseous)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gaseous fumes from the volcano were toxic.
  </text>
  <text x="50" y="310" class="content">
    火山喷出的气态烟雾是有毒的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="gas" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <!-- Clouds -->
    <ellipse cx="200" cy="100" rx="40" ry="20" class="gas" />
    <ellipse cx="230" cy="110" rx="30" ry="15" class="gas" />
    <ellipse cx="170" cy="110" rx="30" ry="15" class="gas" />
  </g>
</svg>