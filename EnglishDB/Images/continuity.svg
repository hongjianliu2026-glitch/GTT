<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">continuity</text>
  <text x="50" y="120" class="subtitle">[ˌkɒntɪˈnjuːɪti] n. 连续性，持续性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tinu (保持) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，"保持(tinu)"
    <tspan x="50" dy="25">流动，没有中断，这就是连续性(continuity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The continuity of the story made it more engaging.
  </text>
  <text x="50" y="310" class="content">
    故事的连续性使其更加引人入胜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q 50 50, 100 100 T 200 100 T 300 100 T 400 100" class="image" />
    <!-- Water drops -->
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="150" cy="100" r="5" class="image" />
    <circle cx="250" cy="100" r="5" class="image" />
    <circle cx="350" cy="100" r="5" class="image" />
  </g>
</svg>