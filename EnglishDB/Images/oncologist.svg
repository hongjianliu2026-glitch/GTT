<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oncologist</text>
  <text x="50" y="120" class="subtitle">[ɒŋˈkɒlədʒɪst] n. 肿瘤学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> onco- (肿瘤) + -logist (学者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在显微镜下研究肿瘤细胞，"肿瘤学者(onco-logist)"
    <tspan x="50" dy="25">通过观察和分析，寻找治疗肿瘤的方法。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oncologist recommended a new treatment for her cancer.
  </text>
  <text x="50" y="310" class="content">
    肿瘤学家为她推荐了一种新的癌症治疗方法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microscope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Tumor cells -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="220" cy="110" r="10" class="image" />
    <circle cx="180" cy="120" r="10" class="image" />
    <circle cx="210" cy="130" r="10" class="image" />
    <!-- Doctor -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>