<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spot</text>
  <text x="50" y="120" class="subtitle">[spɒt] n. 斑点，地点；v. 认出，发现</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sp- (散开) + ot (眼睛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫在阳光下，"散开(sp-)"
    <tspan x="50" dy="25">的毛发在阳光下形成斑点(spot)，</tspan>
    <tspan x="50" dy="25">而你用眼睛(ot)发现了它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spotted a cat with black spots in the garden.
  </text>
  <text x="50" y="310" class="content">
    她在花园里发现了一只带黑斑点的猫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat with spots -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <circle cx="100" cy="120" r="10" class="image" />
    <circle cx="80" cy="120" r="10" class="image" />
    <circle cx="120" cy="120" r="10" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" />
    <!-- Person spotting -->
    <circle cx="300" cy="150" r="20" class="image" />
    <line x1="300" y1="170" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="280" y2="230" class="image" />
    <line x1="300" y1="200" x2="320" y2="230" class="image" />
    <line x1="300" y1="180" x2="330" y2="170" class="image" />
  </g>
</svg>