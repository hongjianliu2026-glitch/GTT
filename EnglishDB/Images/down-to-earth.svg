<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">down-to-earth</text>
  <text x="50" y="120" class="subtitle">[ˌdaʊntəˈɜːrθ] adj. 务实的，脚踏实地的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> down (向下) + earth (地球)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人双脚稳稳地站在地球上，"向下接地(down-to-earth)"，
    <tspan x="50" dy="25">表示这个人非常务实，不浮夸。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a down-to-earth person who always focuses on practical matters.
  </text>
  <text x="50" y="310" class="content">
    她是一个非常务实的人，总是专注于实际问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="50" class="image" fill="#2ECC71" />
    <!-- Person standing on earth -->
    <circle cx="100" cy="40" r="15" class="image" fill="#34495E" />
    <line x1="100" y1="55" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="80" y2="110" class="image" />
    <line x1="100" y1="80" x2="120" y2="110" class="image" />
    <line x1="100" y1="65" x2="70" y2="75" class="image" />
    <line x1="100" y1="65" x2="130" y2="75" class="image" />
  </g>
</svg>