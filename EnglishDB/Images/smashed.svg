<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smashed</text>
  <text x="50" y="120" class="subtitle">[smæʃt] v. 打碎，粉碎；adj. 破碎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smas (打碎) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"打碎(smas)"
    <tspan x="50" dy="25">一个玻璃瓶，玻璃碎片四处飞溅，这就是"smashed"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vase was smashed into pieces.
  </text>
  <text x="50" y="310" class="content">
    花瓶被打碎成了碎片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <line x1="0" y1="0" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="0" class="image" />
    <rect x="50" y="50" width="50" height="20" class="image" />
    <!-- Broken glass -->
    <line x1="150" y1="0" x2="200" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="0" class="image" />
    <line x1="175" y1="25" x2="175" y2="75" class="image" />
    <line x1="125" y1="25" x2="125" y2="75" class="image" />
    <line x1="225" y1="25" x2="225" y2="75" class="image" />
  </g>
</svg>