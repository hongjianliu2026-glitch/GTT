<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fun</text>
  <text x="50" y="120" class="subtitle">[fʌn] n. 乐趣，娱乐；adj. 有趣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fun (源自中古英语 fon，意为“欺骗”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满欢笑的场景，人们在一起玩乐，
    <tspan x="50" dy="25">这种“欺骗”时间的活动就是乐趣(fun)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had a lot of fun at the party last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚的聚会上我们玩得很开心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Smiling face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <circle cx="80" cy="80" r="10" class="image" fill="#000" />
    <circle cx="120" cy="80" r="10" class="image" fill="#000" />
    <path d="M 60 120 Q 100 150 140 120" class="image" fill="none" stroke="#000" stroke-width="5" />

    <!-- Party elements -->
    <rect x="160" y="50" width="50" height="100" class="image" fill="#8E44AD" />
    <rect x="220" y="50" width="50" height="100" class="image" fill="#2ECC71" />
    <rect x="280" y="50" width="50" height="100" class="image" fill="#3498DB" />
    <circle cx="185" cy="120" r="10" class="image" fill="#FFF" />
    <circle cx="245" cy="120" r="10" class="image" fill="#FFF" />
    <circle cx="305" cy="120" r="10" class="image" fill="#FFF" />
  </g>
</svg>