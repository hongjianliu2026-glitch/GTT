<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ominous</text>
  <text x="50" y="120" class="subtitle">[ˈɒmɪnəs] adj. 不祥的，不吉利的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> omni- (所有) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑暗的夜晚，"所有(omni-)"
    <tspan x="50" dy="25">的迹象都预示着不祥(ominous)，</tspan>
    <tspan x="50" dy="25">乌云密布，雷声隆隆，仿佛灾难即将来临。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ominous sky made everyone feel uneasy.
  </text>
  <text x="50" y="310" class="content">
    不祥的天空让每个人都感到不安。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Clouds -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" fill="#7F8C8D" />
    <ellipse cx="100" cy="50" rx="100" ry="30" class="image" fill="#7F8C8D" />
    <ellipse cx="250" cy="70" rx="120" ry="40" class="image" fill="#7F8C8D" />
    <!-- Lightning -->
    <line x1="175" y1="100" x2="175" y2="200" class="image" stroke="#F39C12" stroke-width="4" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" stroke="#F39C12" stroke-width="4" />
    <line x1="160" y1="120" x2="190" y2="180" class="image" stroke="#F39C12" stroke-width="4" />
  </g>
</svg>