<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conspicuously</text>
  <text x="50" y="120" class="subtitle">[kənˈspɪkjuəsli] adv. 显眼地，引人注目地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + spic (看) + -uous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色气球在人群中"共同被看到(con-spic-uous-ly)"，
    <tspan x="50" dy="25">它如此显眼，以至于每个人都能立刻注意到它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a red dress that stood out conspicuously in the crowd.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件红色的连衣裙，在人群中显得非常引人注目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large red balloon -->
    <circle cx="100" cy="100" r="50" fill="#E74C3C" />
    <!-- Crowd -->
    <rect x="0" y="150" width="200" height="50" fill="#7F8C8D" />
    <!-- People -->
    <circle cx="20" cy="175" r="5" fill="#34495E" />
    <circle cx="50" cy="175" r="5" fill="#34495E" />
    <circle cx="80" cy="175" r="5" fill="#34495E" />
    <circle cx="110" cy="175" r="5" fill="#34495E" />
    <circle cx="140" cy="175" r="5" fill="#34495E" />
    <circle cx="170" cy="175" r="5" fill="#34495E" />
  </g>
</svg>