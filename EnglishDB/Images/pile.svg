<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pile</text>
  <text x="50" y="120" class="subtitle">[paɪl] n. 堆，大量；v. 堆积</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pil (堆)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆书"堆积(pile)"在一起，形成了一个高高的书堆。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stacked the books into a pile.
  </text>
  <text x="50" y="310" class="content">
    她把书堆成了一堆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Base of the pile -->
    <rect x="0" y="0" width="200" height="20" class="image" />
    <!-- Books in the pile -->
    <rect x="20" y="20" width="160" height="40" class="image" />
    <rect x="40" y="60" width="120" height="40" class="image" />
    <rect x="60" y="100" width="80" height="40" class="image" />
    <rect x="80" y="140" width="40" height="40" class="image" />
  </g>
</svg>