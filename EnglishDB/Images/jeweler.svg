<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jeweler</text>
  <text x="50" y="120" class="subtitle">[ˈdʒuːələr] n. 珠宝商</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jewel (珠宝) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个珠宝商(jeweler)，他手中拿着一颗闪闪发光的宝石，
    <tspan x="50" dy="25">正在仔细地打磨和镶嵌，仿佛在创造一件艺术品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jeweler crafted a beautiful ring for her engagement.
  </text>
  <text x="50" y="310" class="content">
    珠宝商为她订婚制作了一枚美丽的戒指。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jeweler -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Gem -->
    <polygon points="100,50 120,100 150,100 130,130 140,170 100,150 60,170 70,130 50,100 80,100" class="image" fill="#FFD700" />
    <!-- Workbench -->
    <rect x="50" y="180" width="200" height="50" class="image" />
    <!-- Tools -->
    <line x1="70" y1="200" x2="100" y2="200" class="image" />
    <line x1="85" y1="190" x2="85" y2="210" class="image" />
    <line x1="120" y1="200" x2="150" y2="200" class="image" />
    <line x1="135" y1="190" x2="135" y2="210" class="image" />
  </g>
</svg>