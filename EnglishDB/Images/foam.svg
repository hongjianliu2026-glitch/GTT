<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .foam { fill: #BDC3C7; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foam</text>
  <text x="50" y="120" class="subtitle">[foʊm] n. 泡沫，泡沫材料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> foam (泡沫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的泡沫海洋，"泡沫(foam)"
    <tspan x="50" dy="25">覆盖了整个海面，仿佛整个世界都被泡沫包围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The waves crashed against the rocks, creating a sea of foam.
  </text>
  <text x="50" y="310" class="content">
    海浪拍打着岩石，形成了一片泡沫的海洋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Foam sea -->
    <rect x="0" y="0" width="350" height="200" class="foam" />
    <!-- Foam bubbles -->
    <circle cx="50" cy="50" r="10" class="foam" />
    <circle cx="100" cy="70" r="15" class="foam" />
    <circle cx="150" cy="90" r="20" class="foam" />
    <circle cx="200" cy="110" r="15" class="foam" />
    <circle cx="250" cy="130" r="10" class="foam" />
    <circle cx="300" cy="150" r="20" class="foam" />
  </g>
</svg>