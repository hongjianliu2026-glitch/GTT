<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lust</text>
  <text x="50" y="120" class="subtitle">[lʌst] n. 欲望，渴望；v. 渴望，贪求</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lust (光亮，闪耀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被强烈的欲望所驱使，眼中闪耀着"光亮(lust)"，
    <tspan x="50" dy="25">仿佛被欲望之火点燃，无法自拔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He had a lust for power that drove him to succeed.
  </text>
  <text x="50" y="310" class="content">
    他对权力的渴望驱使他取得成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye with a glowing light -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="40" fill="#F39C12" />
    <circle cx="100" cy="100" r="30" fill="#F1C40F" />
    <circle cx="100" cy="100" r="20" fill="#F39C12" />
    <circle cx="100" cy="100" r="10" fill="#F1C40F" />
    <!-- Eyelid -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="55" x2="150" y2="55" class="image" />
    <line x1="50" y1="60" x2="150" y2="60" class="image" />
    <line x1="50" y1="65" x2="150" y2="65" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="50" y1="75" x2="150" y2="75" class="image" />
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <line x1="50" y1="85" x2="150" y2="85" class="image" />
    <line x1="50" y1="90" x2="150" y2="90" class="image" />
    <line x1="50" y1="95" x2="150" y2="95" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="105" x2="150" y2="105" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="115" x2="150" y2="115" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="125" x2="150" y2="125" class="image" />
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
    <line x1="50" y1="135" x2="150" y2="135" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <line x1="50" y1="145" x2="150" y2="145" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
  </g>
</svg>