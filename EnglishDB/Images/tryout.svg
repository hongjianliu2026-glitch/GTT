<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tryout</text>
  <text x="50" y="120" class="subtitle">[ˈtraɪaʊt] n. 试用，试验；选拔赛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> try (尝试) + out (出去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在赛场上，"尝试(try)"
    <tspan x="50" dy="25">并"走出去(out)"展示自己的实力，这就是选拔赛(tryout)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He attended the tryout for the basketball team.
  </text>
  <text x="50" y="310" class="content">
    他参加了篮球队的选拔赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stadium -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Athlete -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Finish line -->
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <text x="255" y="190" class="content">Finish</text>
  </g>
</svg>