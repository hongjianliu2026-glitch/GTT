<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">traction</text>
  <text x="50" y="120" class="subtitle">[ˈtrækʃən] n. 牵引力，拉力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tract (拉) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆巨大的卡车，"拉(tract)"着一列火车，
    <tspan x="50" dy="25">巨大的牵引力(traction)让火车无法抗拒地前进。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new marketing strategy gained significant traction.
  </text>
  <text x="50" y="310" class="content">
    新的营销策略获得了显著的牵引力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Truck -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Train -->
    <rect x="210" y="20" width="300" height="60" class="image" />
    <!-- Traction lines -->
    <line x1="200" y1="50" x2="210" y2="50" class="image" />
    <line x1="200" y1="70" x2="210" y2="70" class="image" />
    <!-- Wheels -->
    <circle cx="30" cy="110" r="10" class="image" />
    <circle cx="70" cy="110" r="10" class="image" />
    <circle cx="110" cy="110" r="10" class="image" />
    <circle cx="230" cy="80" r="10" class="image" />
    <circle cx="270" cy="80" r="10" class="image" />
    <circle cx="310" cy="80" r="10" class="image" />
  </g>
</svg>