<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spaghetti</text>
  <text x="50" y="120" class="subtitle">[spəˈɡɛti] n. 意大利面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spaghett (意大利语，意为“小绳子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一盘意大利面像“小绳子(spaghett)”一样缠绕在一起，
    <tspan x="50" dy="25">每一根面条都细细长长，就像绳子一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat spaghetti with marinara sauce.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃意大利面配番茄酱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Spaghetti -->
    <path d="M50,20 Q100,100 150,20 Q200,100 250,20 Q300,100 350,20" class="image" />
    <path d="M50,50 Q100,130 150,50 Q200,130 250,50 Q300,130 350,50" class="image" />
    <path d="M50,80 Q100,160 150,80 Q200,160 250,80 Q300,160 350,80" class="image" />
    <!-- Fork -->
    <line x1="20" y1="100" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>