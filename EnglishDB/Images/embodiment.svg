<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">embodiment</text>
  <text x="50" y="120" class="subtitle">[ɪmˈbɒdɪmənt] n. 体现，化身</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (进入) + body (身体) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个灵魂"进入(em-)"一个"身体(body)"，
    <tspan x="50" dy="25">这个身体就成了灵魂的"化身(embodiment)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is the embodiment of kindness.
  </text>
  <text x="50" y="310" class="content">
    她是善良的化身。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Soul entering -->
    <line x1="200" y1="100" x2="100" y2="100" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Text annotations -->
    <text x="100" y="200" class="content" text-anchor="middle">Body</text>
    <text x="200" y="200" class="content" text-anchor="middle">Soul</text>
  </g>
</svg>