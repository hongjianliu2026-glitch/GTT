<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">malfunction</text>
  <text x="50" y="120" class="subtitle">[ˌmælˈfʌŋkʃən] n. 故障，失灵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mal- (坏) + function (功能)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台机器，"坏掉的功能(mal-function)"
    <tspan x="50" dy="25">导致它无法正常工作，这就是故障(malfunction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car's engine malfunctioned on the highway.
  </text>
  <text x="50" y="310" class="content">
    汽车在高速公路上发动机出了故障。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Machine body -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Broken parts -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Sparks -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="120" cy="110" r="10" class="image" />
    <circle cx="140" cy="90" r="10" class="image" />
    <!-- Smoke -->
    <ellipse cx="200" cy="150" rx="30" ry="15" class="image" />
    <ellipse cx="220" cy="160" rx="30" ry="15" class="image" />
    <ellipse cx="240" cy="140" rx="30" ry="15" class="image" />
  </g>
</svg>