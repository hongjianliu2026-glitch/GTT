<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apprehend</text>
  <text x="50" y="120" class="subtitle">[ˌæprɪˈhɛnd] v. 理解，逮捕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (向) + prehend (抓住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探"向(ap-)"前"抓住(prehend)"
    <tspan x="50" dy="25">一个嫌疑犯，这个动作既可以理解为逮捕，也可以理解为理解某事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective quickly apprehended the thief.
  </text>
  <text x="50" y="310" class="content">
    侦探迅速逮捕了小偷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Detective -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Hand reaching out -->
    <line x1="20" y1="150" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="90" y2="140" class="image" />
    <line x1="100" y1="150" x2="90" y2="160" class="image" />
    <!-- Suspect -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="170" y2="120" class="image" />
  </g>
</svg>