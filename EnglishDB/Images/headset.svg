<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">headset</text>
  <text x="50" y="120" class="subtitle">[ˈhɛdˌsɛt] n. 耳机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> head (头) + set (装置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人戴着耳机，"头上的装置(head-set)"
    <tspan x="50" dy="25">让他沉浸在音乐的世界里，完全隔绝外界的噪音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He always wears a headset while working to focus better.
  </text>
  <text x="50" y="310" class="content">
    他工作时总是戴着耳机以更好地集中注意力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Headphones -->
    <rect x="50" y="50" width="100" height="20" class="image" />
    <rect x="50" y="70" width="100" height="20" class="image" />
    <!-- Ear cups -->
    <circle cx="70" cy="80" r="20" class="image" />
    <circle cx="130" cy="80" r="20" class="image" />
  </g>
</svg>