<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .powder { fill: #FADBD8; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">powdery</text>
  <text x="50" y="120" class="subtitle">[ˈpaʊdəri] adj. 粉状的，粉末状的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> powder (粉末) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的面粉袋破裂，"粉末(powder)"
    <tspan x="50" dy="25">像雪花一样飘落，整个房间都被"粉状的(powdery)"覆盖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake was covered with a thin layer of powdery sugar.
  </text>
  <text x="50" y="310" class="content">
    蛋糕上覆盖着一层薄薄的粉状糖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Powder cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="powder" />
    <!-- Broken bag -->
    <rect x="50" y="150" width="250" height="100" class="image" />
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <line x1="50" y1="250" x2="300" y2="250" class="image" />
    <line x1="50" y1="150" x2="50" y2="250" class="image" />
    <line x1="300" y1="150" x2="300" y2="250" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <!-- Powder particles -->
    <circle cx="100" cy="100" r="5" class="powder" />
    <circle cx="200" cy="120" r="5" class="powder" />
    <circle cx="250" cy="80" r="5" class="powder" />
    <circle cx="150" cy="140" r="5" class="powder" />
    <circle cx="220" cy="110" r="5" class="powder" />
  </g>
</svg>