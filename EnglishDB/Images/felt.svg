<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">felt</text>
  <text x="50" y="120" class="subtitle">[fɛlt] n. 毛毡；v. 感觉，触摸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fel (毛) + t (表状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小羊的毛被"压实(fel-t)"成了一块柔软的毛毡，
    <tspan x="50" dy="25">这种材料既温暖又舒适，就像你触摸它时的感觉一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a hat out of felt.
  </text>
  <text x="50" y="310" class="content">
    她用毛毡做了一顶帽子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Felt material -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#D2B48C" />
    <!-- Sheep -->
    <circle cx="50" cy="100" r="30" class="image" fill="#FFFFFF" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Felt hat -->
    <path d="M200,50 Q250,20 300,50 L300,100 Q250,130 200,100 Z" class="image" fill="#D2B48C" />
  </g>
</svg>