<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discredit</text>
  <text x="50" y="120" class="subtitle">[dɪsˈkrɛdɪt] v. 使丧失信誉，使不可置信</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (否定) + credit (信任)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在法庭上，法官用锤子敲打桌子，"否定(dis-)"
    <tspan x="50" dy="25">他的"信任(credit)"，这个人瞬间失去了信誉(discredit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scandal discredited the politician.
  </text>
  <text x="50" y="310" class="content">
    丑闻使这位政客失去了信誉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Gavel -->
    <rect x="40" y="80" width="20" height="20" class="image" />
    <line x1="50" y1="80" x2="50" y2="60" class="image" />
    <!-- Defendant -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="290" y2="130" class="image" />
    <!-- Broken trust -->
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="140" y1="50" x2="160" y2="50" class="image" />
    <line x1="140" y1="150" x2="160" y2="150" class="image" />
    <line x1="140" y1="50" x2="140" y2="150" class="image" />
    <line x1="160" y1="50" x2="160" y2="150" class="image" />
  </g>
</svg>