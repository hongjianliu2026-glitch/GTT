<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crippled</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪpəld] adj. 跛的，残废的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crip- (跛) + -ple (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"跛脚(crip-)"的人，他的腿"状态(ple)"
    <tspan x="50" dy="25">不佳，走路一瘸一拐，这就是"跛的(crippled)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident left him crippled for life.
  </text>
  <text x="50" y="310" class="content">
    那次事故使他终身残疾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a cane -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="70" y1="220" x2="70" y2="240" class="image" /> <!-- Cane -->
  </g>
</svg>