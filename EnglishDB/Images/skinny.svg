<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skinny</text>
  <text x="50" y="120" class="subtitle">[ˈskɪni] adj. 瘦的，皮包骨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skin (皮肤) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人瘦得只剩下"皮肤(skin)"，
    <tspan x="50" dy="25">就像一根"皮包骨(skinny)"的树枝，风一吹就摇摇欲坠。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He looked skinny after his illness.
  </text>
  <text x="50" y="310" class="content">
    他生病后看起来很瘦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skinny person -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="50" x2="20" y2="80" class="image" />
    <line x1="50" y1="50" x2="80" y2="80" class="image" />
    <circle cx="50" cy="20" r="15" class="image" />
    <!-- Skinny tree branch -->
    <line x1="200" y1="20" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="200" class="image" />
    <line x1="200" y1="150" x2="220" y2="200" class="image" />
    <line x1="200" y1="50" x2="180" y2="80" class="image" />
    <line x1="200" y1="50" x2="220" y2="80" class="image" />
  </g>
</svg>