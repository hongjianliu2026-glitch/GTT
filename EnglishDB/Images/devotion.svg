<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">devotion</text>
  <text x="50" y="120" class="subtitle">[dɪˈvoʊʃn] n. 奉献，忠诚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + vot (发誓) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人跪在地上，双手合十，"强调发誓(de-vot)"
    <tspan x="50" dy="25">表达对某人或某事的忠诚和奉献(devotion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her devotion to her family is unwavering.
  </text>
  <text x="50" y="310" class="content">
    她对家庭的奉献是坚定不移的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person kneeling -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Hands together -->
    <line x1="40" y1="120" x2="60" y2="120" class="image" />
    <line x1="40" y1="120" x2="40" y2="140" class="image" />
    <line x1="60" y1="120" x2="60" y2="140" class="image" />
    <!-- Heart symbol -->
    <path d="M 100 100 Q 120 80 140 100 L 140 140 Q 120 160 100 140 Z" class="image" />
  </g>
</svg>