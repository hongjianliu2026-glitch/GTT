<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .walnut { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">walnut</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːlnʌt] n. 核桃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wal- (外国) + nut (坚果)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个外国(wal-)的坚果(nut)，
    <tspan x="50" dy="25">它有着坚硬的外壳和美味的果仁，这就是核桃(walnut)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added walnuts to her salad for extra crunch.
  </text>
  <text x="50" y="310" class="content">
    她在沙拉里加了核桃，增添了脆脆的口感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Walnut shell -->
    <circle cx="100" cy="100" r="60" class="image walnut" />
    <!-- Walnut kernel -->
    <circle cx="100" cy="100" r="40" class="image walnut" />
    <!-- Cracks on the shell -->
    <line x1="60" y1="80" x2="140" y2="120" class="image" />
    <line x1="60" y1="120" x2="140" y2="80" class="image" />
  </g>
</svg>