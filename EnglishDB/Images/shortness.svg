<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shortness</text>
  <text x="50" y="120" class="subtitle">[ˈʃɔːrtnəs] n. 短缺，不足</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> short (短) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个矮小的身影，"短(short)"得几乎看不见，
    <tspan x="50" dy="25">这种"不足(shortness)"让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shortness of the rope made it difficult to climb.
  </text>
  <text x="50" y="310" class="content">
    绳子太短，使得攀爬变得困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Short person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Short rope -->
    <line x1="150" y1="100" x2="180" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="120" class="image" />
    <line x1="180" y1="100" x2="180" y2="120" class="image" />
    <line x1="150" y1="120" x2="180" y2="120" class="image" />
    <!-- Arrow pointing to shortness -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,100 240,90 240,110" class="image" />
    <text x="260" y="105" class="content">shortness</text>
  </g>
</svg>