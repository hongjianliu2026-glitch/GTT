<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blank</text>
  <text x="50" y="120" class="subtitle">[blæŋk] adj. 空白的，空虚的；n. 空白，空格</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blan (白色) + k (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张巨大的白纸，上面什么都没有，"空白(blank)"
    <tspan x="50" dy="25">得让人感到空虚，这就是blank的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please fill in the blank with your name.
  </text>
  <text x="50" y="310" class="content">
    请在空白处填写你的名字。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Blank paper -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#FFFFFF" />
    <!-- Blank space -->
    <rect x="100" y="60" width="150" height="80" class="image" fill="#FFFFFF" stroke="#000000" />
    <!-- Text on the paper -->
    <text x="110" y="100" class="content" fill="#000000">Blank</text>
  </g>
</svg>