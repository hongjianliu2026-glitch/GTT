<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7D3C98; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wine</text>
  <text x="50" y="120" class="subtitle">[waɪn] n. 葡萄酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vin (葡萄)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的葡萄园，"葡萄(vin)"
    <tspan x="50" dy="25">经过时间的沉淀，变成了美味的葡萄酒(wine)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He enjoys a glass of wine after dinner.
  </text>
  <text x="50" y="310" class="content">
    他喜欢在晚餐后喝一杯葡萄酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Grapes -->
    <circle cx="50" cy="50" r="20" class="image" fill="#88C999" />
    <circle cx="80" cy="50" r="20" class="image" fill="#88C999" />
    <circle cx="110" cy="50" r="20" class="image" fill="#88C999" />
    <circle cx="65" cy="80" r="20" class="image" fill="#88C999" />
    <circle cx="95" cy="80" r="20" class="image" fill="#88C999" />

    <!-- Wine bottle -->
    <rect x="150" y="20" width="100" height="200" class="image" fill="#E5E4E2" />
    <rect x="170" y="20" width="60" height="200" class="image" fill="#D4AF37" />
    <circle cx="200" cy="220" r="20" class="image" fill="#D4AF37" />

    <!-- Wine glass -->
    <path d="M300,200 Q320,100 340,200" class="image" fill="#E5E4E2" />
    <rect x="315" y="200" width="50" height="100" class="image" fill="#E5E4E2" />
  </g>
</svg>