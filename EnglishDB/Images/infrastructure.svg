<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infrastructure</text>
  <text x="50" y="120" class="subtitle">[ˈɪnfrəˌstrʌktʃər] n. 基础设施</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> infra- (在...下面) + struct (建造) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座城市，"在下面建造(infra-struct)"
    <tspan x="50" dy="25">的基础设施，如道路、桥梁和下水道，支撑着整个城市的运作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government is investing heavily in infrastructure.
  </text>
  <text x="50" y="310" class="content">
    政府正在大力投资基础设施建设。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Bridge -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="20" class="image" />
    <line x1="300" y1="50" x2="300" y2="20" class="image" />
    <!-- Sewer -->
    <rect x="150" y="70" width="50" height="50" class="image" />
    <line x1="175" y1="70" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="150" y2="140" class="image" />
    <line x1="175" y1="120" x2="200" y2="140" class="image" />
  </g>
</svg>