<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brain</text>
  <text x="50" y="120" class="subtitle">[breɪn] n. 大脑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bran (头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的大脑，"头(bran)"
    <tspan x="50" dy="25">里装满了智慧和知识，这就是大脑(brain)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The human brain is a complex organ.
  </text>
  <text x="50" y="310" class="content">
    人脑是一个复杂的器官。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Brain outline -->
    <ellipse cx="150" cy="150" rx="100" ry="150" class="image" />
    <!-- Brain folds -->
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <line x1="50" y1="200" x2="250" y2="200" class="image" />
    <!-- Lightning bolt for intelligence -->
    <polygon points="150,50 120,100 180,100" class="image" />
  </g>
</svg>