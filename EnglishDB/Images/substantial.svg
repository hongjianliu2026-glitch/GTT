<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">substantial</text>
  <text x="50" y="120" class="subtitle">[səbˈstænʃl] adj. 大量的，实质的，重要的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + stant (站立) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的山峰，"在下面(sub-)"
    <tspan x="50" dy="25">站立(stant)着，这座山峰是如此的庞大和重要，</tspan>
    <tspan x="50" dy="25">以至于它成为了地标，这就是substantial(大量的，重要的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company made a substantial profit last year.
  </text>
  <text x="50" y="310" class="content">
    公司去年获得了巨大的利润。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="300" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="50" ry="20" class="image" />
    <ellipse cx="200" cy="70" rx="40" ry="15" class="image" />
  </g>
</svg>