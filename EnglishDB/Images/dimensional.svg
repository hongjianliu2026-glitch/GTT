<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dimensional</text>
  <text x="50" y="120" class="subtitle">[daɪˈmenʃənl] adj. 空间的，维度的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (二) + mens (测量) + -ion (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个二维的平面世界，突然被"二度测量(di-mens)"
    <tspan x="50" dy="25">成三维空间，这就是dimensional的奇妙转变。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist created a three-dimensional sculpture.
  </text>
  <text x="50" y="310" class="content">
    艺术家创作了一个三维雕塑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- 2D plane -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- 3D cube -->
    <polygon points="250,0 350,0 350,100 250,100 200,50" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="75" x2="225" y2="37.5" class="image" />
    <line x1="100" y1="75" x2="225" y2="112.5" class="image" />
    <line x1="100" y1="75" x2="275" y2="75" class="image" />
  </g>
</svg>