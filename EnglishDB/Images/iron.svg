<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">iron</text>
  <text x="50" y="120" class="subtitle">[ˈaɪərn] n. 铁；熨斗；v. 熨烫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (铁) + -on (表示物质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的铁块，"铁(ir-)"
    <tspan x="50" dy="25">被用来制作熨斗，熨烫衣物(iron)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used an iron to press her shirt.
  </text>
  <text x="50" y="310" class="content">
    她用熨斗熨烫衬衫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Iron block -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Ironing board -->
    <rect x="50" y="120" width="200" height="50" class="image" />
    <!-- Iron -->
    <rect x="100" y="80" width="100" height="40" class="image" />
    <!-- Steam -->
    <line x1="120" y1="70" x2="140" y2="50" class="image" />
    <line x1="160" y1="70" x2="180" y2="50" class="image" />
    <line x1="200" y1="70" x2="220" y2="50" class="image" />
  </g>
</svg>