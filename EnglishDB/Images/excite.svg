<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">excite</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsaɪt] v. 使兴奋，使激动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + cit (唤起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的喇叭，"唤起(cit)"
    <tspan x="50" dy="25">人们内心的激情，让他们兴奋(excite)不已。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the victory excited everyone.
  </text>
  <text x="50" y="310" class="content">
    胜利的消息让每个人都兴奋不已。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large horn -->
    <path d="M0 100 C 50 50, 150 50, 200 100 L 200 200 C 150 250, 50 250, 0 200 Z" class="image" />
    <!-- Exclamation marks -->
    <text x="220" y="150" class="image" font-size="60" fill="#E74C3C">!</text>
    <text x="260" y="150" class="image" font-size="60" fill="#E74C3C">!</text>
    <text x="300" y="150" class="image" font-size="60" fill="#E74C3C">!</text>
  </g>
</svg>