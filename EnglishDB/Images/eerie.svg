<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E9E2; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eerie</text>
  <text x="50" y="120" class="subtitle">[ˈɪəri] adj. 怪异的，阴森的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eer (源自中古英语，意为“怪异的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阴森的夜晚，月光透过云层，照亮了一座古老的废弃房屋。
    <tspan x="50" dy="25">房屋的窗户里透出微弱的光，仿佛有什么东西在窥视着你。</tspan>
    <tspan x="50" dy="25">这种感觉就是“eerie”，让人不寒而栗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The eerie silence of the forest made her feel uneasy.
  </text>
  <text x="50" y="330" class="content">
    森林中怪异的寂静让她感到不安。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="50" r="30" fill="#F1C40F" />
    <!-- Clouds -->
    <ellipse cx="50" cy="30" rx="40" ry="20" fill="#ECF0F1" />
    <ellipse cx="150" cy="40" rx="50" ry="25" fill="#ECF0F1" />
    <!-- House -->
    <rect x="70" y="100" width="150" height="100" fill="#D35400" />
    <polygon points="70,100 145,50 220,100" fill="#D35400" />
    <rect x="120" y="130" width="30" height="30" fill="#ECF0F1" />
    <!-- Shadows -->
    <line x1="70" y1="200" x2="220" y2="200" stroke="#2C3E50" stroke-width="2" />
    <line x1="70" y1="200" x2="70" y2="210" stroke="#2C3E50" stroke-width="2" />
    <line x1="220" y1="200" x2="220" y2="210" stroke="#2C3E50" stroke-width="2" />
  </g>
</svg>