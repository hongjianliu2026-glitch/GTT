<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sightseeing</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪtsiːɪŋ] n. 观光，游览</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sight (视力，景象) + see (看) + ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个游客拿着相机，"用眼睛(sight)"
    <tspan x="50" dy="25">四处"看(see)"美丽的风景，这就是"观光(sightseeing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They spent the day sightseeing in Paris.
  </text>
  <text x="50" y="310" class="content">
    他们花了一整天在巴黎观光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera -->
    <rect x="0" y="0" width="100" height="70" class="image" />
    <rect x="10" y="10" width="80" height="50" class="image" />
    <circle cx="50" cy="35" r="10" class="image" />
    <!-- Tourist -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="90" x2="180" y2="80" class="image" />
    <!-- Sight -->
    <line x1="200" y1="0" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="70" x2="230" y2="60" class="image" />
  </g>
</svg>