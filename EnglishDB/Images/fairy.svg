<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #E91E63; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C2185B; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fairy { fill: #FF80AB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fairy</text>
  <text x="50" y="120" class="subtitle">[ˈfɛri] n. 仙女，小精灵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fair (美丽的) + -y (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个美丽的(fair)小精灵(fairy)在花丛中飞舞，
    <tspan x="50" dy="25">她的翅膀闪烁着光芒，仿佛夜空中最亮的星星。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fairy danced gracefully among the flowers.
  </text>
  <text x="50" y="310" class="content">
    仙女在花丛中优雅地跳舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Fairy -->
    <circle cx="100" cy="100" r="30" class="fairy" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="50" y2="140" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <!-- Wings -->
    <path d="M70,70 Q50,50 70,30 Q90,50 70,70" class="image" />
    <path d="M130,70 Q150,50 130,30 Q110,50 130,70" class="image" />
    <!-- Flowers -->
    <circle cx="50" cy="200" r="20" class="image" />
    <circle cx="150" cy="200" r="20" class="image" />
    <circle cx="100" cy="250" r="20" class="image" />
  </g>
</svg>