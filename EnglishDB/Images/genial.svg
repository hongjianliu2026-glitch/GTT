<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">genial</text>
  <text x="50" y="120" class="subtitle">[ˈdʒiːniəl] adj. 友好的，亲切的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> geni (出生) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个出生(geni)时就带着微笑的婴儿，
    <tspan x="50" dy="25">他的友好(genial)和亲切让人感到温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The host's genial personality made everyone feel at ease.
  </text>
  <text x="50" y="310" class="content">
    主人的友好性格让每个人都感到轻松自在。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Baby -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Smile -->
    <path d="M 70 120 Q 100 140 130 120" class="image" stroke="#2C3E50" stroke-width="3" fill="none" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" fill="#2C3E50" />
    <circle cx="120" cy="90" r="5" class="image" fill="#2C3E50" />
  </g>
</svg>