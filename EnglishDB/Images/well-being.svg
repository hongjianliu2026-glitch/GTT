<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">well-being</text>
  <text x="50" y="120" class="subtitle">[ˈwɛlˈbiːɪŋ] n. 幸福，健康</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> well (好) + being (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光下，"好(well)地存在(being)"，
    <tspan x="50" dy="25">享受着幸福和健康的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Regular exercise is essential for your well-being.
  </text>
  <text x="50" y="310" class="content">
    定期锻炼对你的健康至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="150" r="20" fill="#2ECC71" />
    <line x1="200" y1="170" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="180" y2="280" class="image" />
    <line x1="200" y1="250" x2="220" y2="280" class="image" />
    <line x1="200" y1="200" x2="170" y2="190" class="image" />
    <line x1="200" y1="200" x2="230" y2="190" class="image" />
    <!-- Ground -->
    <rect x="0" y="280" width="400" height="20" fill="#2ECC71" />
  </g>
</svg>