<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elated</text>
  <text x="50" y="120" class="subtitle">[ɪˈleɪtɪd] adj. 兴高采烈的，非常高兴的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + latus (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为中了彩票而"携带(latus)"着喜悦"出来(e-)"，
    <tspan x="50" dy="25">整个人都"兴高采烈(elated)"得飘飘然。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was elated after winning the lottery.
  </text>
  <text x="50" y="310" class="content">
    她中了彩票后非常高兴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Smile -->
    <path d="M40 90 Q50 80 60 90" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="120" cy="90" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Lottery ticket -->
    <rect x="160" y="80" width="100" height="50" class="image" />
    <line x1="170" y1="90" x2="250" y2="90" class="image" />
    <line x1="170" y1="110" x2="250" y2="110" class="image" />
    <line x1="170" y1="130" x2="250" y2="130" class="image" />
  </g>
</svg>