<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dearly</text>
  <text x="50" y="120" class="subtitle">[ˈdɪrli] adv. 深深地，非常</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dear (亲爱的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人紧紧抱着他"亲爱的(dear)"
    <tspan x="50" dy="25">伴侣，表达出"非常(dearly)"深厚的感情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves her family dearly.
  </text>
  <text x="50" y="310" class="content">
    她非常爱她的家人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Person hugging -->
    <circle cx="35" cy="80" r="15" class="image" />
    <line x1="35" y1="95" x2="35" y2="130" class="image" />
    <line x1="35" y1="130" x2="20" y2="160" class="image" />
    <line x1="35" y1="130" x2="50" y2="160" class="image" />
    <line x1="35" y1="110" x2="60" y2="100" class="image" />
    <!-- Another person -->
    <circle cx="65" cy="80" r="15" class="image" />
    <line x1="65" y1="95" x2="65" y2="130" class="image" />
    <line x1="65" y1="130" x2="50" y2="160" class="image" />
    <line x1="65" y1="130" x2="80" y2="160" class="image" />
    <line x1="65" y1="110" x2="30" y2="100" class="image" />
  </g>
</svg>