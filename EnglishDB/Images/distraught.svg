<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">distraught</text>
  <text x="50" y="120" class="subtitle">[dɪˈstrɔːt] adj. 心烦意乱的，极度烦恼的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (离开) + trahere (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"拉离(dis-trahere)"了平静的状态，
    <tspan x="50" dy="25">变得极度烦恼和心烦意乱(distraught)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was distraught after hearing the bad news.
  </text>
  <text x="50" y="310" class="content">
    听到坏消息后，她变得心烦意乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <!-- Torn string -->
    <line x1="50" y1="100" x2="50" y2="50" class="image" />
    <line x1="40" y1="60" x2="60" y2="40" class="image" />
    <line x1="40" y1="40" x2="60" y2="60" class="image" />
    <!-- Torn string -->
    <line x1="50" y1="100" x2="50" y2="50" class="image" />
    <line x1="40" y1="60" x2="60" y2="40" class="image" />
    <line x1="40" y1="40" x2="60" y2="60" class="image" />
    <!-- Torn string -->
    <line x1="50" y1="100" x2="50" y2="50" class="image" />
    <line x1="40" y1="60" x2="60" y2="40" class="image" />
    <line x1="40" y1="40" x2="60" y2="60" class="image" />
  </g>
</svg>