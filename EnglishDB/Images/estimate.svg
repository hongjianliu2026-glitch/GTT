<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">estimate</text>
  <text x="50" y="120" class="subtitle">[ˈɛstɪˌmeɪt] v. 估计，估价；n. 估计，估价</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> esti- (存在) + mate (测量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个建筑师在测量一栋大楼，"存在(esti-)"
    <tspan x="50" dy="25">的物体需要被"测量(mate)"，这就是估计(estimate)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The contractor estimated the cost of the project.
  </text>
  <text x="50" y="310" class="content">
    承包商估计了项目的成本。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <rect x="40" y="40" width="70" height="120" class="image" />
    <!-- Architect -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Measuring tape -->
    <line x1="200" y1="100" x2="150" y2="0" class="image" />
    <line x1="200" y1="100" x2="150" y2="20" class="image" />
    <line x1="200" y1="100" x2="150" y2="40" class="image" />
  </g>
</svg>