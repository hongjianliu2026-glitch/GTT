<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unequal</text>
  <text x="50" y="120" class="subtitle">[ʌnˈiːkwəl] adj. 不平等的，不相等的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + equal (相等)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个大小不一的苹果，一个巨大无比，另一个却小得可怜，
    <tspan x="50" dy="25">这就是"不相等(unequal)"的最好诠释。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two teams were unequal in strength.
  </text>
  <text x="50" y="310" class="content">
    这两支队伍实力悬殊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large apple -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Small apple -->
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="280" y2="100" class="image" />
    <polygon points="280,80 300,100 280,120" class="image" />
  </g>
</svg>