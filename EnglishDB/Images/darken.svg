<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">darken</text>
  <text x="50" y="120" class="subtitle">[ˈdɑːrkən] v. 使变暗，使变黑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dark (黑暗) + -en (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔法师挥动魔杖，"使(en)"
    <tspan x="50" dy="25">周围的一切都变暗(dark)，整个世界瞬间陷入黑暗(darken)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room darkened as the lights were turned off.
  </text>
  <text x="50" y="310" class="content">
    随着灯被关掉，房间变暗了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Darkened room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dark cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Wand -->
    <line x1="20" y1="180" x2="175" y2="20" class="image" />
    <!-- Star -->
    <circle cx="175" cy="20" r="10" class="image" />
    <!-- Darkened area -->
    <rect x="50" y="50" width="250" height="100" class="image" />
  </g>
</svg>