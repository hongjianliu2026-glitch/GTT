<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">floodwaters</text>
  <text x="50" y="120" class="subtitle">[ˈflʌdˌwɔːtərz] n. 洪水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flood (洪水) + waters (水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场突如其来的洪水，"水(waters)"
    <tspan x="50" dy="25">淹没了整个城市，街道变成了河流，</tspan>
    <tspan x="50" dy="25">这就是"洪水(flood)"的威力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The floodwaters rose rapidly, forcing people to evacuate.
  </text>
  <text x="50" y="310" class="content">
    洪水迅速上涨，迫使人们撤离。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- City -->
    <rect x="50" y="150" width="50" height="30" class="image" />
    <rect x="120" y="150" width="50" height="30" class="image" />
    <rect x="190" y="150" width="50" height="30" class="image" />
    <rect x="260" y="150" width="50" height="30" class="image" />
    <!-- Waves -->
    <path d="M0 20 Q50 40, 100 20 T200 20" class="image" />
    <path d="M0 40 Q50 60, 100 40 T200 40" class="image" />
    <path d="M0 60 Q50 80, 100 60 T200 60" class="image" />
  </g>
</svg>