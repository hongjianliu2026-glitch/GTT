<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misrepresentation</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsˌreprɪzenˈteɪʃn] n. 误传，歪曲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + represent (代表) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在演讲台上，"错误地代表(mis-represent)"
    <tspan x="50" dy="25">事实，结果听众都被误导了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The politician's misrepresentation of the facts led to public outrage.
  </text>
  <text x="50" y="310" class="content">
    这位政客对事实的歪曲导致了公众的愤怒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Microphone -->
    <line x1="80" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="100" x2="150" y2="140" class="image" />
    <!-- Audience -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <!-- Misleading speech bubble -->
    <path d="M 50 80 Q 100 50 150 80" class="image" />
    <text x="160" y="85" class="content" style="font-size: 14px;">"Facts"</text>
  </g>
</svg>