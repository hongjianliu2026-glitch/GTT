<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bold</text>
  <text x="50" y="120" class="subtitle">[boʊld] adj. 大胆的，粗体的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bol (投掷) + -d (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"投掷(bol)"出大胆的想法，
    <tspan x="50" dy="25">这些想法就像粗体字一样醒目(bold)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a bold decision to quit her job and start her own business.
  </text>
  <text x="50" y="310" class="content">
    她做出了一个大胆的决定，辞去工作并开始自己的事业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bold text -->
    <text x="50" y="50" class="title" style="font-weight: bold;">BOLD</text>
    <!-- Throwing idea -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Idea bubble -->
    <path d="M250,120 Q280,100 310,120 Q280,140 250,120" class="image" />
    <text x="260" y="125" class="content" style="font-size: 14px;">Idea</text>
  </g>
</svg>