<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">legislate</text>
  <text x="50" y="120" class="subtitle">[ˈlɛdʒɪsleɪt] v. 立法，制定法律</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> legis (法律) + -late (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群议员在议会大厅里，"使法律(legis-late)"
    <tspan x="50" dy="25">生效，他们正在制定新的法律(legislate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government plans to legislate new environmental laws.
  </text>
  <text x="50" y="310" class="content">
    政府计划制定新的环境保护法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parliament building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Parliament hall -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Law books -->
    <rect x="70" y="50" width="50" height="30" class="image" />
    <rect x="130" y="50" width="50" height="30" class="image" />
    <rect x="190" y="50" width="50" height="30" class="image" />
    <!-- Parliament members -->
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="160" cy="120" r="15" class="image" />
    <circle cx="220" cy="120" r="15" class="image" />
    <!-- Gavel -->
    <line x1="100" y1="140" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="180" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />
  </g>
</svg>