<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">womb</text>
  <text x="50" y="120" class="subtitle">[wuːm] n. 子宫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始印欧语 *wēm- (子宫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的子宫，里面孕育着无数的生命，
    <tspan x="50" dy="25">每个生命都在这个温暖的"子宫(womb)"中成长。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby was safely nestled in its mother's womb.
  </text>
  <text x="50" y="310" class="content">
    宝宝安全地躺在母亲的子宫里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Womb shape -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="image" />
    <!-- Baby inside the womb -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Umbilical cord -->
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
  </g>
</svg>