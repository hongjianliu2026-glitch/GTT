<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">if</text>
  <text x="50" y="120" class="subtitle">[ɪf] conj. 如果，假如</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> if (源自拉丁语 "si"，意为“如果”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个程序员在编写代码时，"如果(if)"
    <tspan x="50" dy="25">条件满足，就会执行特定的操作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> If it rains, we will stay indoors.
  </text>
  <text x="50" y="310" class="content">
    如果下雨，我们会待在室内。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Code block -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Code lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- If statement -->
    <text x="70" y="70" class="content">if (condition) {</text>
    <text x="90" y="100" class="content">  // execute code</text>
    <text x="70" y="130" class="content">}</text>
  </g>
</svg>