<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">highway</text>
  <text x="50" y="120" class="subtitle">[ˈhaɪweɪ] n. 公路，高速公路</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + way (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条"高(high)"耸入云的"路(way)"，
    <tspan x="50" dy="25">这就是高速公路(highway)，它连接着城市与城市，</tspan>
    <tspan x="50" dy="25">让车辆快速穿梭，仿佛在云端行驶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The highway was packed with cars during rush hour.
  </text>
  <text x="50" y="310" class="content">
    高峰时段，高速公路上挤满了汽车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Cars -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="150" y="20" width="50" height="30" class="image" />
    <rect x="250" y="20" width="50" height="30" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="150" rx="80" ry="30" class="image" />
    <ellipse cx="250" cy="150" rx="80" ry="30" class="image" />
  </g>
</svg>