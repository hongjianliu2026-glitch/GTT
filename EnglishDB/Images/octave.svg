<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">octave</text>
  <text x="50" y="120" class="subtitle">[ˈɒktɪv] n. 八度音阶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oct- (八) + -ave (音阶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在钢琴前，"弹奏出八个音符(oct-ave)"
    <tspan x="50" dy="25">，这些音符跨越了一个八度音阶(octave)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The singer hit the high octave effortlessly.
  </text>
  <text x="50" y="310" class="content">
    歌手轻松地唱到了高八度音阶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Piano keys -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- White keys -->
    <rect x="70" y="50" width="30" height="100" class="image" />
    <rect x="110" y="50" width="30" height="100" class="image" />
    <rect x="150" y="50" width="30" height="100" class="image" />
    <rect x="190" y="50" width="30" height="100" class="image" />
    <rect x="230" y="50" width="30" height="100" class="image" />
    <rect x="270" y="50" width="30" height="100" class="image" />
    <rect x="310" y="50" width="30" height="100" class="image" />
    <rect x="350" y="50" width="30" height="100" class="image" />
    <!-- Black keys -->
    <rect x="95" y="50" width="20" height="60" class="image" fill="#000" />
    <rect x="135" y="50" width="20" height="60" class="image" fill="#000" />
    <rect x="215" y="50" width="20" height="60" class="image" fill="#000" />
    <rect x="255" y="50" width="20" height="60" class="image" fill="#000" />
    <rect x="295" y="50" width="20" height="60" class="image" fill="#000" />
    <!-- Musician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>