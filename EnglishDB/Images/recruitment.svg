<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recruitment</text>
  <text x="50" y="120" class="subtitle">[rɪˈkruːtmənt] n. 招募，招聘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + cruit (增长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个公司正在"再次增长(re-cruit)"，
    <tspan x="50" dy="25">他们需要招聘新员工来支持这种增长，这就是招募(recruitment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is undergoing a major recruitment drive.
  </text>
  <text x="50" y="310" class="content">
    公司正在进行大规模的招聘活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Company building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Recruitment sign -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <text x="60" y="55" class="content" fill="#FFFFFF">Hiring Now!</text>
    <!-- People -->
    <circle cx="100" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <circle cx="200" cy="120" r="15" class="image" />
    <line x1="200" y1="135" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="200" class="image" />
    <line x1="200" y1="170" x2="220" y2="200" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
  </g>
</svg>