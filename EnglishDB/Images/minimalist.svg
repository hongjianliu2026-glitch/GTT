<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9F9F9; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #666666; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #4682B4; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">minimalist</text>
  <text x="50" y="120" class="subtitle">[ˈmɪnɪməlɪst] n. 极简主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mini (小) + -al (形容词后缀) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个极简主义者，他只拥有最少的物品，
    <tspan x="50" dy="25">生活在一个只有一张床和一张桌子的房间里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a minimalist who owns only essential items.
  </text>
  <text x="50" y="310" class="content">
    她是一个只拥有必需品的极简主义者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bed -->
    <rect x="50" y="20" width="100" height="60" class="image" />
    <!-- Table -->
    <rect x="200" y="20" width="100" height="60" class="image" />
    <!-- Minimalist -->
    <circle cx="100" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
  </g>
</svg>