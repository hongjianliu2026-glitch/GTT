<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">howl</text>
  <text x="50" y="120" class="subtitle">[haʊl] v. 嚎叫，咆哮；n. 嚎叫声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> howl (源自中古英语 howlen，意为嚎叫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狼在月光下，"嚎叫(howl)"
    <tspan x="50" dy="25">出凄厉的声音，仿佛在呼唤同伴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wolf howled at the full moon.
  </text>
  <text x="50" y="310" class="content">
    狼对着满月嚎叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Wolf -->
    <circle cx="200" cy="100" r="20" class="image" fill="#7F8C8D" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <!-- Howl sound -->
    <path d="M200,100 Q250,50 300,100" class="image" />
    <path d="M200,100 Q250,150 300,100" class="image" />
  </g>
</svg>