<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #F1C40F; }
      .earth { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warming</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːrmɪŋ] n. 加热，变暖；v. 使暖和</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> warm (温暖的) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太阳在地球上方，"温暖(warm)"
    <tspan x="50" dy="25">着整个地球，地球逐渐变暖(warming)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The global warming issue is becoming more critical.
  </text>
  <text x="50" y="310" class="content">
    全球变暖问题正变得越来越严重。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Earth -->
    <circle cx="300" cy="100" r="30" class="earth" />
    <!-- Rays of the sun -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Warmth effect on earth -->
    <line x1="300" y1="130" x2="300" y2="160" class="image" />
    <line x1="280" y1="145" x2="320" y2="145" class="image" />
  </g>
</svg>