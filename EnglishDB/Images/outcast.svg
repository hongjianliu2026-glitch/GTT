<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outcast</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtkæst] n. 被遗弃者，流浪者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外面) + cast (投掷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"投掷(cast)"到"外面(out)"，
    <tspan x="50" dy="25">远离了群体，成为了被遗弃者(outcast)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outcast wandered the streets alone.
  </text>
  <text x="50" y="310" class="content">
    那个被遗弃者独自在街上徘徊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Outcast -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Group -->
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="240" cy="100" r="20" class="image" />
    <circle cx="280" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="240" y1="120" x2="240" y2="180" class="image" />
    <line x1="280" y1="120" x2="280" y2="180" class="image" />
    <!-- Distance -->
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="120" x2="180" y2="120" class="image" />
    <line x1="100" y1="140" x2="180" y2="140" class="image" />
  </g>
</svg>