<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Nazism</text>
  <text x="50" y="120" class="subtitle">[ˈneɪzɪzəm] n. 纳粹主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Naz- (纳粹) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着纳粹标志的士兵，手持旗帜，
    <tspan x="50" dy="25">象征着纳粹主义的极端和残酷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rise of Nazism in the 1930s led to World War II.
  </text>
  <text x="50" y="310" class="content">
    20世纪30年代纳粹主义的兴起导致了第二次世界大战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Swastika -->
    <rect x="70" y="80" width="60" height="60" class="image" transform="rotate(45, 100, 110)" />
    <line x1="70" y1="110" x2="130" y2="110" class="image" />
    <line x1="100" y1="80" x2="100" y2="140" class="image" />
    <!-- Flag -->
    <rect x="150" y="80" width="100" height="60" class="image" />
    <line x1="150" y1="80" x2="150" y2="140" class="image" />
    <line x1="250" y1="80" x2="250" y2="140" class="image" />
  </g>
</svg>