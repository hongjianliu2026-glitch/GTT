<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quest</text>
  <text x="50" y="120" class="subtitle">[kwest] n. 探索，寻求；v. 寻找，探索</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quest (寻求)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的骑士，手持长剑，"寻求(quest)"
    <tspan x="50" dy="25">宝藏的踪迹，他的目标是找到传说中的宝藏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The knight embarked on a quest for the lost treasure.
  </text>
  <text x="50" y="310" class="content">
    骑士踏上了寻找失落宝藏的征程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knight -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Sword -->
    <line x1="90" y1="130" x2="130" y2="90" class="image" />
    <!-- Treasure Map -->
    <rect x="150" y="80" width="150" height="100" class="image" />
    <line x1="160" y1="90" x2="290" y2="90" class="image" />
    <line x1="160" y1="110" x2="280" y2="110" class="image" />
    <line x1="160" y1="130" x2="270" y2="130" class="image" />
    <line x1="160" y1="150" x2="260" y2="150" class="image" />
  </g>
</svg>