<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preside</text>
  <text x="50" y="120" class="subtitle">[prɪˈzaɪd] v. 主持，负责</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + sid (坐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个领导坐在会议桌的"前面(pre-sid)"，
    <tspan x="50" dy="25">主持会议，掌控全局，这就是"preside"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager will preside over the meeting today.
  </text>
  <text x="50" y="310" class="content">
    经理今天将主持会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chair -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Person sitting -->
    <circle cx="75" cy="100" r="15" class="image" />
    <line x1="75" y1="115" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="60" y2="180" class="image" />
    <line x1="75" y1="150" x2="90" y2="180" class="image" />
    <line x1="75" y1="130" x2="100" y2="120" class="image" />
    <!-- Front position -->
    <line x1="150" y1="100" x2="300" y2="100" class="image" />
    <text x="225" y="90" class="highlight">Front</text>
  </g>
</svg>