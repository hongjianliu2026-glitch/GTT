<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flower { fill: #FF6F61; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">floral</text>
  <text x="50" y="120" class="subtitle">[ˈflɔːrəl] adj. 花的，植物的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flor (花) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个花园里，"花(flor)"
    <tspan x="50" dy="25">开得正艳，整个花园都充满了花的气息(floral)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a floral dress to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件花裙子去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flower -->
    <circle cx="50" cy="100" r="30" class="flower" />
    <circle cx="80" cy="100" r="30" class="flower" />
    <circle cx="110" cy="100" r="30" class="flower" />
    <circle cx="65" cy="70" r="30" class="flower" />
    <circle cx="95" cy="70" r="30" class="flower" />
    <!-- Stem -->
    <line x1="80" y1="130" x2="80" y2="180" class="image" />
    <!-- Leaves -->
    <path d="M80,180 Q60,160 80,140" class="image" />
    <path d="M80,180 Q100,160 80,140" class="image" />
  </g>
</svg>