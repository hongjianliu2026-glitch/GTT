<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monitoring</text>
  <text x="50" y="120" class="subtitle">[ˈmɒnɪtərɪŋ] n. 监控，监视</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> monit (警告) + -or (名词后缀) + -ing (动名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个超级英雄，他拥有"警告(monit)"的能力，
    <tspan x="50" dy="25">时刻监视着城市的每一个角落，确保一切安全。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The security team is responsible for monitoring the building.
  </text>
  <text x="50" y="310" class="content">
    保安团队负责监控大楼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Superhero -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- City skyline -->
    <rect x="100" y="150" width="200" height="100" class="image" />
    <rect x="120" y="130" width="30" height="120" class="image" />
    <rect x="170" y="110" width="30" height="140" class="image" />
    <rect x="220" y="140" width="30" height="110" class="image" />
    <!-- Eye -->
    <circle cx="50" cy="90" r="10" class="image" />
    <line x1="50" y1="100" x2="100" y2="150" class="image" />
  </g>
</svg>