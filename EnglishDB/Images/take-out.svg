<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">take-out</text>
  <text x="50" y="120" class="subtitle">[ˈteɪkaʊt] n. 外卖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> take (拿) + out (外面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你在一个餐厅，服务员把食物"拿(take)"到"外面(out)"，
    <tspan x="50" dy="25">装进袋子里，这就是外卖(take-out)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I ordered a pizza for take-out.
  </text>
  <text x="50" y="310" class="content">
    我点了一份披萨外卖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Restaurant -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Bag -->
    <rect x="170" y="20" width="100" height="80" class="image" />
    <!-- Hand taking food -->
    <line x1="150" y1="60" x2="170" y2="60" class="image" />
    <line x1="150" y1="60" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="170" y2="80" class="image" />
    <!-- Arrow pointing to bag -->
    <line x1="270" y1="60" x2="320" y2="60" class="image" />
    <line x1="320" y1="60" x2="310" y2="50" class="image" />
    <line x1="320" y1="60" x2="310" y2="70" class="image" />
  </g>
</svg>