<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trafficking</text>
  <text x="50" y="120" class="subtitle">[ˈtræfɪkɪŋ] n. 贩卖，非法交易</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> traffic (交通) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个繁忙的交通路口，"交通(traffic)"
    <tspan x="50" dy="25">中隐藏着非法交易(trafficking)，</tspan>
    <tspan x="50" dy="25">人们在这里秘密地进行着各种非法买卖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police are cracking down on drug trafficking.
  </text>
  <text x="50" y="310" class="content">
    警方正在打击毒品贩卖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cars -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="150" y="20" width="50" height="30" class="image" />
    <rect x="250" y="20" width="50" height="30" class="image" />
    <!-- Hidden transaction -->
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <line x1="70" y1="130" x2="250" y2="130" class="image" />
    <line x1="70" y1="160" x2="270" y2="160" class="image" />
    <line x1="70" y1="190" x2="240" y2="190" class="image" />
    <!-- Smuggler -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>