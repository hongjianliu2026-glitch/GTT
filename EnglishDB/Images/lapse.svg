<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lapse</text>
  <text x="50" y="120" class="subtitle">[læps] n. 失误，流逝；v. 失效，流逝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> laps (滑落)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟的指针突然"滑落(laps)"，
    <tspan x="50" dy="25">时间就这样悄悄流逝(lapse)，留下一片空白。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A lapse in concentration led to the accident.
  </text>
  <text x="50" y="310" class="content">
    注意力不集中导致了事故。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Falling hand -->
    <line x1="175" y1="100" x2="175" y2="200" class="image" />
    <!-- Time lapse -->
    <rect x="50" y="220" width="250" height="20" class="image" />
    <rect x="50" y="240" width="200" height="20" class="image" />
    <rect x="50" y="260" width="150" height="20" class="image" />
    <rect x="50" y="280" width="100" height="20" class="image" />
    <rect x="50" y="300" width="50" height="20" class="image" />
  </g>
</svg>