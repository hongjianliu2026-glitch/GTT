<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hanging</text>
  <text x="50" y="120" class="subtitle">[ˈhæŋɪŋ] n. 悬挂，绞刑；adj. 悬挂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hang (悬挂) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一幅画面，一个巨大的钟摆"悬挂(hang)"在空中，
    <tspan x="50" dy="25">随着时间的流逝，钟摆来回摆动，这就是"悬挂的(hanging)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hanging lanterns created a festive atmosphere.
  </text>
  <text x="50" y="310" class="content">
    悬挂的灯笼营造了节日的气氛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ceiling -->
    <line x1="0" y1="0" x2="400" y2="0" class="image" />
    <!-- Rope -->
    <line x1="200" y1="0" x2="200" y2="150" class="image" />
    <!-- Pendulum -->
    <circle cx="200" cy="150" r="20" class="image" />
    <!-- Swing -->
    <line x1="180" y1="150" x2="220" y2="150" class="image" />
    <line x1="180" y1="150" x2="180" y2="170" class="image" />
    <line x1="220" y1="150" x2="220" y2="170" class="image" />
    <line x1="180" y1="170" x2="220" y2="170" class="image" />
  </g>
</svg>