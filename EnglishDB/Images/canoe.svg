<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">canoe</text>
  <text x="50" y="120" class="subtitle">[kəˈnuː] n. 独木舟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> can (木头) + -oe (表示“船”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人用一根巨大的木头(can)，
    <tspan x="50" dy="25">挖空中间，做成了一艘独木舟(canoe)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They paddled a canoe across the lake.
  </text>
  <text x="50" y="310" class="content">
    他们划着独木舟穿过湖面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canoe -->
    <path d="M50 50 L300 50 L280 100 L70 100 Z" class="image" />
    <!-- Paddles -->
    <line x1="100" y1="120" x2="100" y2="200" class="image" />
    <line x1="100" y1="160" x2="150" y2="140" class="image" />
    <line x1="250" y1="120" x2="250" y2="200" class="image" />
    <line x1="250" y1="160" x2="200" y2="140" class="image" />
    <!-- Water -->
    <path d="M50 120 Q100 200 150 120 T250 120" class="image" />
  </g>
</svg>