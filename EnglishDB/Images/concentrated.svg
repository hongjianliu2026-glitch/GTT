<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concentrated</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːnsntreɪtɪd] adj. 集中的，浓缩的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + centr (中心) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"把所有的物质(con-)"
    <tspan x="50" dy="25">都集中到中心(centr)，形成了一个浓缩的(concentrated)溶液。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientist prepared a concentrated solution for the experiment.
  </text>
  <text x="50" y="310" class="content">
    科学家为实验准备了一种浓缩溶液。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beaker -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Liquid -->
    <rect x="20" y="20" width="160" height="260" class="image" fill="#16A085" />
    <!-- Scientist -->
    <circle cx="100" cy="320" r="20" class="image" />
    <line x1="100" y1="340" x2="100" y2="380" class="image" />
    <line x1="100" y1="380" x2="80" y2="420" class="image" />
    <line x1="100" y1="380" x2="120" y2="420" class="image" />
    <line x1="100" y1="360" x2="140" y2="350" class="image" />
  </g>
</svg>