<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">harm</text>
  <text x="50" y="120" class="subtitle">[hɑːrm] n. 伤害，损害；v. 伤害，损害</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> harm (伤害)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子砸向一个脆弱的玻璃瓶，"伤害(harm)"
    <tspan x="50" dy="25">瞬间发生，玻璃瓶破碎，象征着伤害的严重性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident caused serious harm to the driver.
  </text>
  <text x="50" y="310" class="content">
    事故对司机造成了严重伤害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="90" y2="20" class="image" />
    <line x1="90" y1="20" x2="110" y2="20" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <!-- Glass bottle -->
    <ellipse cx="200" cy="30" rx="30" ry="50" class="image" />
    <line x1="170" y1="30" x2="230" y2="30" class="image" />
    <line x1="200" y1="30" x2="200" y2="80" class="image" />
    <!-- Broken glass -->
    <line x1="180" y1="80" x2="220" y2="120" class="image" />
    <line x1="220" y1="80" x2="180" y2="120" class="image" />
  </g>
</svg>