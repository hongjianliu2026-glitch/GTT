<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .green { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">greenish</text>
  <text x="50" y="120" class="subtitle">[ˈɡriːnɪʃ] adj. 带绿色的，微绿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> green (绿色) + -ish (表示“有点...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片树叶，"有点绿(green-ish)"，
    <tspan x="50" dy="25">就像春天刚发芽的嫩叶，微微泛着绿光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sky had a greenish tint after the storm.
  </text>
  <text x="50" y="310" class="content">
    暴风雨后，天空带有一丝绿色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leaf -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image green" />
    <!-- Green tint -->
    <rect x="50" y="100" width="200" height="100" class="image green" opacity="0.5" />
    <!-- Text annotation -->
    <text x="150" y="180" class="content" text-anchor="middle">微绿</text>
  </g>
</svg>