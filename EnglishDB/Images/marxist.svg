<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #D32F2F; }
      .subtitle { font: italic 24px serif; fill: #424242; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #FF5722; }
      .story { font: 16px serif; fill: #1976D2; }
      .image { stroke: #757575; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Marxist</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrksɪst] n. 马克思主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Marx (马克思) + -ist (表示“信仰者”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着红色帽子的人，手里拿着一本厚厚的书，
    <tspan x="50" dy="25">书上写着“资本论”，这个人就是马克思主义者(Marxist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a committed Marxist who believes in social justice.
  </text>
  <text x="50" y="310" class="content">
    他是一个坚定的马克思主义者，坚信社会正义。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red hat -->
    <circle cx="50" cy="50" r="30" class="image" fill="#FF4081" />
    <!-- Book -->
    <rect x="100" y="20" width="150" height="160" class="image" fill="#FFEB3B" />
    <text x="120" y="100" class="content" fill="#000000">资本论</text>
    <!-- Person -->
    <circle cx="50" cy="150" r="20" class="image" fill="#795548" />
    <line x1="50" y1="170" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="250" class="image" />
    <line x1="50" y1="220" x2="70" y2="250" class="image" />
    <line x1="50" y1="190" x2="80" y2="180" class="image" />
  </g>
</svg>