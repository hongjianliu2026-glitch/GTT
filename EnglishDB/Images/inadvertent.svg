<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inadvertent</text>
  <text x="50" y="120" class="subtitle">[ˌɪnədˈvɜːrtnt] adj. 不经意的，疏忽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + ad- (朝向) + vert (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路时，"没有转向(in-ad-vert)"
    <tspan x="50" dy="25">某个方向，结果不小心撞到了墙上，这就是不经意的(inadvertent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His inadvertent mistake cost the company millions.
  </text>
  <text x="50" y="310" class="content">
    他不经意的错误让公司损失了数百万。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="140" y2="30" class="image" />
    <line x1="150" y1="50" x2="160" y2="30" class="image" />
    <line x1="150" y1="50" x2="140" y2="70" class="image" />
    <line x1="150" y1="50" x2="160" y2="70" class="image" />
    <!-- Wall -->
    <rect x="200" y="0" width="50" height="100" class="image" />
    <!-- Collision -->
    <circle cx="190" cy="50" r="10" class="image" />
  </g>
</svg>