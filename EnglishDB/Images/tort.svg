<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tort</text>
  <text x="50" y="120" class="subtitle">[tɔrt] n. 扭曲，歪曲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> torquere (拉丁语，意为“扭曲”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根笔直的树枝被"扭曲(tort)"成了一个奇怪的形状，
    <tspan x="50" dy="25">这个形状让人印象深刻，因为它完全违背了自然状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lawyer argued that the evidence had been tortured to fit the prosecutor's theory.
  </text>
  <text x="50" y="310" class="content">
    律师辩称，证据被扭曲以符合检察官的理论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Straight line -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Twisted line -->
    <path d="M50,50 Q100,150 150,50 T300,50" class="image" />
    <!-- Twisted shape -->
    <rect x="100" y="100" width="100" height="50" transform="rotate(45,150,125)" class="image" />
    <!-- Text annotation -->
    <text x="150" y="200" class="content" text-anchor="middle">扭曲</text>
  </g>
</svg>