<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">benevolence</text>
  <text x="50" y="120" class="subtitle">[bəˈnevələns] n. 仁慈，善行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bene- (好) + vol (意愿) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个善良的人，"心怀善意(bene-vol)"，
    <tspan x="50" dy="25">总是愿意帮助他人，这种善行(benevolence)让人感到温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her benevolence towards the homeless was truly inspiring.
  </text>
  <text x="50" y="310" class="content">
    她对无家可归者的善行真是令人鼓舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <!-- Hand giving -->
    <line x1="20" y1="40" x2="20" y2="80" class="image" />
    <line x1="20" y1="80" x2="0" y2="100" class="image" />
    <line x1="20" y1="80" x2="40" y2="100" class="image" />
    <!-- Helping hand -->
    <line x1="50" y1="40" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="30" y2="100" class="image" />
    <line x1="50" y1="80" x2="70" y2="100" class="image" />
    <!-- Sun rays -->
    <line x1="40" y1="20" x2="40" y2="10" class="image" />
    <line x1="30" y1="25" x2="20" y2="15" class="image" />
    <line x1="50" y1="25" x2="60" y2="15" class="image" />
  </g>
</svg>