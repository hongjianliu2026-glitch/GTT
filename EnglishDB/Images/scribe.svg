<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scribe</text>
  <text x="50" y="120" class="subtitle">[skraɪb] n. 抄写员，作者；v. 抄写，记录</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scrib (写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的抄写员，手持羽毛笔，"写下(scrib)"
    <tspan x="50" dy="25">每一个字，这些字就构成了书籍(scribe)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scribe carefully transcribed the ancient manuscript.
  </text>
  <text x="50" y="310" class="content">
    抄写员仔细地抄写了古代手稿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scribe -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Feather pen -->
    <line x1="20" y1="115" x2="70" y2="80" class="image" />
    <line x1="70" y1="80" x2="80" y2="70" class="image" />
    <line x1="80" y1="70" x2="90" y2="80" class="image" />
    <!-- Scroll -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <line x1="120" y1="50" x2="280" y2="50" class="image" />
    <line x1="120" y1="80" x2="250" y2="80" class="image" />
    <line x1="120" y1="110" x2="270" y2="110" class="image" />
    <line x1="120" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>