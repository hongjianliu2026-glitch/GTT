<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stunted</text>
  <text x="50" y="120" class="subtitle">[ˈstʌntɪd] adj. 发育不良的，受阻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + un- (否定) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵小树，"站立(st-)"却"没有(un-)"正常生长，
    <tspan x="50" dy="25">结果变得"发育不良(stunted)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plant was stunted due to lack of sunlight.
  </text>
  <text x="50" y="310" class="content">
    由于缺乏阳光，植物发育不良。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stunted tree -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Normal tree -->
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="250" class="image" />
    <line x1="200" y1="200" x2="220" y2="250" class="image" />
    <line x1="200" y1="150" x2="170" y2="170" class="image" />
    <line x1="200" y1="150" x2="230" y2="170" class="image" />
    <line x1="200" y1="100" x2="150" y2="120" class="image" />
    <line x1="200" y1="100" x2="250" y2="120" class="image" />
  </g>
</svg>