<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">God</text>
  <text x="50" y="120" class="subtitle">[ɡɒd] n. 神，上帝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *gudan (神)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的光芒四射的"神(God)"，
    <tspan x="50" dy="25">他坐在云端，手持闪电，掌控着天地万物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> God is often depicted as a powerful and wise being.
  </text>
  <text x="50" y="310" class="content">
    上帝通常被描绘成一个强大而智慧的存在。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cloud -->
    <ellipse cx="200" cy="100" rx="150" ry="50" class="image" />
    <!-- God -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="200" class="image" />
    <line x1="200" y1="160" x2="150" y2="140" class="image" />
    <line x1="200" y1="160" x2="250" y2="140" class="image" />
    <line x1="200" y1="200" x2="150" y2="250" class="image" />
    <line x1="200" y1="200" x2="250" y2="250" class="image" />
    <!-- Lightning -->
    <polyline points="200,100 150,50 200,0 250,50" class="image" />
  </g>
</svg>