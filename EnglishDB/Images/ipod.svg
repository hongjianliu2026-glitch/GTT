<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">iPod</text>
  <text x="50" y="120" class="subtitle">[aɪpɒd] n. 苹果公司生产的便携式音乐播放器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> i- (个人) + Pod (豆荚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的豆荚(Pod)里，装满了音乐，
    <tspan x="50" dy="25">而你(i-)可以随时随地带着这个音乐豆荚(iPod)，享受个人音乐时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used to listen to her favorite songs on her iPod.
  </text>
  <text x="50" y="310" class="content">
    她过去常常用她的iPod听她最喜欢的歌曲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pod shape -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Music notes -->
    <path d="M 50 100 Q 100 50 150 100 T 250 100" class="image" />
    <path d="M 75 120 Q 125 70 175 120 T 275 120" class="image" />
    <path d="M 100 140 Q 150 90 200 140 T 300 140" class="image" />
    <!-- Person with iPod -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- iPod -->
    <rect x="10" y="160" width="20" height="40" class="image" />
    <line x1="20" y1="180" x2="20" y2="200" class="image" />
  </g>
</svg>