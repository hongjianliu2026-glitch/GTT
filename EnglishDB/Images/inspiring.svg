<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inspiring</text>
  <text x="50" y="120" class="subtitle">[ɪnˈspaɪərɪŋ] adj. 鼓舞人心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + spir (呼吸) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人深吸一口气，"吸入(in-spir)"
    <tspan x="50" dy="25">灵感，这种感觉让人振奋，充满活力，</tspan>
    <tspan x="50" dy="25">这就是鼓舞人心的(inspiring)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The speech was truly inspiring.
  </text>
  <text x="50" y="310" class="content">
    那场演讲真的很鼓舞人心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person taking a deep breath -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="130" x2="20" y2="160" class="image" />
    <line x1="50" y1="130" x2="80" y2="160" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />
    <!-- Inspirational light bulb -->
    <circle cx="200" cy="100" r="40" class="image" />
    <line x1="200" y1="140" x2="200" y2="200" class="image" />
    <line x1="200" y1="140" x2="160" y2="170" class="image" />
    <line x1="200" y1="140" x2="240" y2="170" class="image" />
    <line x1="200" y1="200" x2="160" y2="230" class="image" />
    <line x1="200" y1="200" x2="240" y2="230" class="image" />
    <!-- Inspirational rays -->
    <line x1="200" y1="60" x2="200" y2="20" class="image" />
    <line x1="160" y1="80" x2="120" y2="40" class="image" />
    <line x1="240" y1="80" x2="280" y2="40" class="image" />
  </g>
</svg>