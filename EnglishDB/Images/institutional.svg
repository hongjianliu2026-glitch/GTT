<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">institutional</text>
  <text x="50" y="120" class="subtitle">[ˌɪnstɪˈtjuːʃənl] adj. 机构的，制度上的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> institution (机构) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机构建筑，里面有各种规章制度，
    <tspan x="50" dy="25">人们在里面遵循着这些制度，这就是"机构化的(institutional)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has an institutional culture that emphasizes teamwork.
  </text>
  <text x="50" y="310" class="content">
    公司有一种强调团队合作的机构文化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Institutional building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="40" height="40" class="image" />
    <rect x="130" y="40" width="40" height="40" class="image" />
    <rect x="190" y="40" width="40" height="40" class="image" />
    <rect x="250" y="40" width="40" height="40" class="image" />
    <!-- Door -->
    <rect x="160" y="120" width="60" height="60" class="image" />
    <!-- People -->
    <circle cx="90" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="210" cy="150" r="10" class="image" />
  </g>
</svg>