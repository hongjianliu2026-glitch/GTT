<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warrior</text>
  <text x="50" y="120" class="subtitle">[ˈwɔriər] n. 战士，勇士</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> war (战争) + -ior (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士(warrior)在战场上，手持剑和盾，
    <tspan x="50" dy="25">勇敢地面对敌人，他就是战争(war)中的勇士(-ior)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The warrior fought bravely in the battle.
  </text>
  <text x="50" y="310" class="content">
    这位战士在战斗中英勇奋战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="20" cy="100" r="15" class="image" /> <!-- Head -->
    <line x1="20" y1="115" x2="20" y2="150" class="image" /> <!-- Body -->
    <line x1="20" y1="150" x2="0" y2="180" class="image" /> <!-- Left arm -->
    <line x1="20" y1="150" x2="40" y2="180" class="image" /> <!-- Right arm -->
    <line x1="20" y1="130" x2="50" y2="120" class="image" /> <!-- Sword -->
    <rect x="10" y="150" width="20" height="30" class="image" /> <!-- Shield -->
  </g>
</svg>