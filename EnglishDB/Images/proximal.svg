<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">proximal</text>
  <text x="50" y="120" class="subtitle">[ˈprɒksɪməl] adj. 近端的，接近的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> proxi- (接近) + -mal (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手伸向一个目标，"接近(proxi-)"
    <tspan x="50" dy="25">目标的过程，这个位置就是近端的(proximal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The proximal end of the bone is connected to the wrist.
  </text>
  <text x="50" y="310" class="content">
    骨头的近端连接到手腕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand reaching out -->
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="120" y2="180" class="image" />
    <line x1="150" y1="150" x2="180" y2="180" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <!-- Target -->
    <circle cx="300" cy="150" r="30" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="150" x2="270" y2="150" class="image" />
    <polygon points="270,150 260,145 260,155" class="image" />
  </g>
</svg>