<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #641E16; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #922B21; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unabashed</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəˈbæʃt] adj. 不害羞的，不害臊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + abashed (害羞的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在众人面前跳舞，"不(un-)"
    <tspan x="50" dy="25">感到"害羞(abashed)"，这就是unabashed。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was unabashed by the attention she received.
  </text>
  <text x="50" y="310" class="content">
    她对收到的关注毫不害羞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person dancing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <!-- Audience -->
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
  </g>
</svg>