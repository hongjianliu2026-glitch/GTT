<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fund-raiser</text>
  <text x="50" y="120" class="subtitle">[ˈfʌndˌreɪzər] n. 筹款人，募捐活动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fund (资金) + raise (提升)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个筹款人站在舞台上，手里拿着一个巨大的钱袋，
    <tspan x="50" dy="25">"提升(raise)"着资金(fund)，为慈善事业筹集资金。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The school organized a fund-raiser to buy new books.
  </text>
  <text x="50" y="310" class="content">
    学校组织了一场募捐活动来购买新书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Money bag -->
    <rect x="150" y="80" width="100" height="100" class="image" />
    <line x1="150" y1="80" x2="250" y2="80" class="image" />
    <line x1="150" y1="180" x2="250" y2="180" class="image" />
    <line x1="150" y1="80" x2="150" y2="180" class="image" />
    <line x1="250" y1="80" x2="250" y2="180" class="image" />
    <!-- Money -->
    <line x1="160" y1="90" x2="170" y2="100" class="image" />
    <line x1="180" y1="90" x2="190" y2="100" class="image" />
    <line x1="200" y1="90" x2="210" y2="100" class="image" />
  </g>
</svg>