<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">detonate</text>
  <text x="50" y="120" class="subtitle">[ˈdetəˌneɪt] v. 引爆，爆炸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + ton (声音) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的炸弹，"向下发出(de-ton)"
    <tspan x="50" dy="25">震耳欲聋的声音，瞬间引爆(detonate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bomb was detonated by remote control.
  </text>
  <text x="50" y="310" class="content">
    炸弹被遥控引爆了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bomb -->
    <circle cx="100" cy="100" r="50" class="image" fill="#B03A2E" />
    <!-- Explosion -->
    <circle cx="100" cy="100" r="70" class="image" fill="none" stroke="#F1C40F" stroke-width="10" />
    <circle cx="100" cy="100" r="90" class="image" fill="none" stroke="#F1C40F" stroke-width="10" />
    <circle cx="100" cy="100" r="110" class="image" fill="none" stroke="#F1C40F" stroke-width="10" />
    <!-- Sound waves -->
    <line x1="100" y1="100" x2="100" y2="0" class="image" stroke="#2980B9" stroke-width="5" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" stroke="#2980B9" stroke-width="5" />
    <line x1="100" y1="100" x2="0" y2="100" class="image" stroke="#2980B9" stroke-width="5" />
    <line x1="100" y1="100" x2="100" y2="200" class="image" stroke="#2980B9" stroke-width="5" />
  </g>
</svg>