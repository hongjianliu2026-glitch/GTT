<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acknowledgment</text>
  <text x="50" y="120" class="subtitle">[əkˈnɒlɪdʒmənt] n. 承认，确认，感谢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + know (知道) + -ledge (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公开场合，"加强知道(ac-know)"
    <tspan x="50" dy="25">并确认(acknowledgment)某件事，比如感谢某人的贡献。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company issued an acknowledgment of the employee's hard work.
  </text>
  <text x="50" y="310" class="content">
    公司对员工的辛勤工作表示了感谢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Microphone -->
    <line x1="100" y1="80" x2="100" y2="180" class="image" />
    <rect x="90" y="70" width="20" height="10" class="image" />
    <!-- Speech bubble -->
    <path d="M120,100 Q150,90 180,100 Q210,110 240,100 Q270,90 300,100" class="image" />
    <text x="130" y="105" class="content" fill="#34495E">Thank you!</text>
  </g>
</svg>