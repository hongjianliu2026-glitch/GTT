<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unwillingness</text>
  <text x="50" y="120" class="subtitle">[ʌnˈwɪlɪŋnəs] n. 不愿意，不情愿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + will (意愿) + -ing (进行时) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被强迫做某事，脸上露出"不愿意(un-willing)"的表情，
    <tspan x="50" dy="25">这种状态就是不情愿(unwillingness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His unwillingness to help was obvious.
  </text>
  <text x="50" y="310" class="content">
    他不愿意帮忙的态度很明显。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with crossed arms -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="110" x2="20" y2="120" class="image" />
    <line x1="50" y1="110" x2="80" y2="120" class="image" />
    <!-- Crossed arms -->
    <line x1="20" y1="120" x2="80" y2="120" class="image" />
    <!-- Forceful hand -->
    <line x1="150" y1="50" x2="100" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
  </g>
</svg>