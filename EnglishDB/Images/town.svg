<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">town</text>
  <text x="50" y="120" class="subtitle">[taʊn] n. 城镇，市镇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "toun"，意为"定居点"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小村庄逐渐发展成一个热闹的"定居点(toun)"，
    <tspan x="50" dy="25">街道上人来人往，商店林立，这就是一个城镇(town)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She grew up in a small town.
  </text>
  <text x="50" y="310" class="content">
    她在小镇长大。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Town outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- Street -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- People -->
    <circle cx="70" cy="120" r="10" class="image" />
    <circle cx="140" cy="120" r="10" class="image" />
    <circle cx="210" cy="120" r="10" class="image" />
  </g>
</svg>