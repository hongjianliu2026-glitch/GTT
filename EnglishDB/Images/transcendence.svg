<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transcendence</text>
  <text x="50" y="120" class="subtitle">[trænˈsɛndəns] n. 超越，卓越</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (超越) + -scend (攀登) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在攀登一座高山，"超越(trans-)"
    <tspan x="50" dy="25">一切障碍，最终达到卓越(transcendence)的境界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her artistry reached a level of transcendence that few could match.
  </text>
  <text x="50" y="310" class="content">
    她的艺术造诣达到了几乎无人能及的卓越水平。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Climber -->
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="140" y2="180" class="image" />
    <line x1="150" y1="150" x2="160" y2="180" class="image" />
    <line x1="150" y1="130" x2="170" y2="120" class="image" />
  </g>
</svg>