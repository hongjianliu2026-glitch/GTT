<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conspirator</text>
  <text x="50" y="120" class="subtitle">[kənˈspɪrətər] n. 共谋者，阴谋者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + spir (呼吸) + -ator (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围在一起，"共同呼吸(con-spir)"
    <tspan x="50" dy="25">策划一个阴谋，这些人就是共谋者(conspirator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police arrested the conspirator who planned the robbery.
  </text>
  <text x="50" y="310" class="content">
    警察逮捕了策划抢劫的共谋者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Speech bubbles -->
    <path d="M 50 70 Q 30 90 50 110" class="image" />
    <path d="M 100 70 Q 80 90 100 110" class="image" />
    <path d="M 150 70 Q 130 90 150 110" class="image" />
    <!-- Secretive atmosphere -->
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
  </g>
</svg>