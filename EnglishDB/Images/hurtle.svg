<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hurtle</text>
  <text x="50" y="120" class="subtitle">[ˈhɜrtl] v. 猛冲，急飞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hur- (快速) + -tle (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆失控的赛车在赛道上"猛冲(hur-tle)"，
    <tspan x="50" dy="25">速度快得让人眼花缭乱，这就是hurtle的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meteor hurtled through the atmosphere.
  </text>
  <text x="50" y="310" class="content">
    流星急速穿过大气层。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Racing car -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="100" height="50" class="image" />
    <rect x="60" y="60" width="80" height="30" class="image" />
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <!-- Speed lines -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="150" y1="70" x2="200" y2="70" class="image" />
    <line x1="150" y1="90" x2="200" y2="90" class="image" />
  </g>
</svg>