<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bullshit</text>
  <text x="50" y="120" class="subtitle">[ˈbʊlʃɪt] n. 胡说，废话</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bull (公牛) + shit (粪便)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头公牛(bull)在草地上随意排泄(shit)，
    <tspan x="50" dy="25">这些排泄物毫无价值，就像人们在说废话(bullshit)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't believe everything he says; it's just bullshit.
  </text>
  <text x="50" y="310" class="content">
    别相信他说的每句话，那都是废话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bull -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Front leg -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Back leg -->
    <line x1="50" y1="130" x2="20" y2="120" class="image" /> <!-- Horn -->
    <line x1="50" y1="130" x2="80" y2="120" class="image" /> <!-- Horn -->

    <!-- Shit -->
    <circle cx="120" cy="190" r="10" class="image" />
    <circle cx="140" cy="190" r="10" class="image" />
    <circle cx="160" cy="190" r="10" class="image" />
  </g>
</svg>