<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heavy</text>
  <text x="50" y="120" class="subtitle">[ˈhɛvi] adj. 重的，沉重的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hev (拉丁语，重)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背着一个巨大的石头，"重(hev)"得几乎无法移动，这就是"heavy"的感觉。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The box was so heavy that he could hardly lift it.
  </text>
  <text x="50" y="310" class="content">
    这个箱子太重了，他几乎抬不起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Stone -->
    <rect x="80" y="150" width="100" height="50" class="image" />
    <line x1="80" y1="150" x2="180" y2="150" class="image" />
    <line x1="80" y1="200" x2="180" y2="200" class="image" />
    <line x1="80" y1="150" x2="80" y2="200" class="image" />
    <line x1="180" y1="150" x2="180" y2="200" class="image" />
  </g>
</svg>