<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">round-trip</text>
  <text x="50" y="120" class="subtitle">[ˈraʊndtrɪp] n. 往返旅行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> round (圆的) + trip (旅行)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从起点出发，绕了一个"圆(round)"，
    <tspan x="50" dy="25">最后又回到了起点，这就是一次往返旅行(round-trip)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She booked a round-trip ticket to Paris.
  </text>
  <text x="50" y="310" class="content">
    她预订了一张去巴黎的往返机票。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Start point -->
    <circle cx="50" cy="100" r="10" class="image" />
    <!-- Path -->
    <path d="M50 100 Q150 50 250 100 Q150 150 50 100" class="image" />
    <!-- End point -->
    <circle cx="50" cy="100" r="10" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>