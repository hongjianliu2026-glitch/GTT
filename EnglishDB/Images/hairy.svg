<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hairy</text>
  <text x="50" y="120" class="subtitle">[ˈherɪ] adj. 多毛的，毛茸茸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hair (毛发) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只毛茸茸的熊，全身覆盖着厚厚的毛发，
    <tspan x="50" dy="25">就像一个移动的毛球，这就是"hairy"的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bear had a hairy back.
  </text>
  <text x="50" y="310" class="content">
    这只熊的背部毛茸茸的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bear body -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Bear face -->
    <circle cx="100" cy="70" r="20" class="image" />
    <!-- Bear ears -->
    <circle cx="70" cy="50" r="15" class="image" />
    <circle cx="130" cy="50" r="15" class="image" />
    <!-- Bear eyes -->
    <circle cx="90" cy="65" r="5" class="image" />
    <circle cx="110" cy="65" r="5" class="image" />
    <!-- Bear nose -->
    <circle cx="100" cy="80" r="8" class="image" />
    <!-- Bear mouth -->
    <line x1="90" y1="90" x2="110" y2="90" class="image" />
    <!-- Bear legs -->
    <line x1="60" y1="180" x2="60" y2="220" class="image" />
    <line x1="140" y1="180" x2="140" y2="220" class="image" />
    <!-- Bear hair -->
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="120" x2="180" y2="120" class="image" />
    <line x1="20" y1="140" x2="180" y2="140" class="image" />
    <line x1="20" y1="160" x2="180" y2="160" class="image" />
    <line x1="20" y1="180" x2="180" y2="180" class="image" />
  </g>
</svg>