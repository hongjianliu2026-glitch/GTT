<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">offense</text>
  <text x="50" y="120" class="subtitle">[əˈfens] n. 冒犯，攻击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> of- (离开) + fens (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为说了不合适的话，"离开(of-)"了和谐的氛围，
    <tspan x="50" dy="25">导致了一场"打击(fens)"，这就是冒犯(offense)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His comments were seen as an offense to the community.
  </text>
  <text x="50" y="310" class="content">
    他的评论被视为对社区的冒犯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person talking -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 50 90 Q 100 80 150 90 Q 200 100 200 150 Q 150 200 100 190 Q 50 180 50 150 Z" class="image" />
    <!-- Angry face -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="290" y1="110" x2="310" y2="110" class="image" />
    <line x1="290" y1="120" x2="310" y2="120" class="image" />
    <path d="M 290 130 Q 300 140 310 130" class="image" />
  </g>
</svg>