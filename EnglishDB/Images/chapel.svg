<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chapel</text>
  <text x="50" y="120" class="subtitle">[ˈtʃæpəl] n. 小教堂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chap (头) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小教堂(chapel)，它的屋顶像一个"头(chap)"，
    <tspan x="50" dy="25">虽然小(-el)，但充满了神圣的氛围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They got married in a beautiful chapel by the sea.
  </text>
  <text x="50" y="310" class="content">
    他们在海边的一个美丽小教堂里结婚了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Chapel roof -->
    <polygon points="0,100 200,0 400,100" class="image" />
    <!-- Chapel walls -->
    <rect x="100" y="100" width="200" height="150" class="image" />
    <!-- Chapel door -->
    <rect x="180" y="200" width="40" height="50" class="image" />
    <!-- Chapel windows -->
    <rect x="120" y="120" width="50" height="50" class="image" />
    <rect x="230" y="120" width="50" height="50" class="image" />
  </g>
</svg>