<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">honesty</text>
  <text x="50" y="120" class="subtitle">[ˈɒnɪsti] n. 诚实，正直</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hon (荣誉) + -esty (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的天平上，天平的一边是"荣誉(hon)"，
    <tspan x="50" dy="25">另一边是"诚实(honesty)"，天平保持平衡，象征着诚实与荣誉的</tspan>
    <tspan x="50" dy="25">紧密联系。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His honesty is beyond question.
  </text>
  <text x="50" y="310" class="content">
    他的诚实是毋庸置疑的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
    <line x1="25" y1="100" x2="25" y2="180" class="image" />
    <line x1="75" y1="100" x2="75" y2="180" class="image" />
    <!-- Person on the scale -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />
    <!-- Honor symbol -->
    <rect x="10" y="120" width="30" height="30" class="image" />
    <text x="15" y="145" class="content">荣誉</text>
    <!-- Honesty symbol -->
    <rect x="60" y="120" width="30" height="30" class="image" />
    <text x="65" y="145" class="content">诚实</text>
  </g>
</svg>