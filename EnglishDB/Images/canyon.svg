<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">canyon</text>
  <text x="50" y="120" class="subtitle">[ˈkænjən] n. 峡谷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> can (容器) + yon (远处)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"容器(can)"，延伸到"远处(yon)"，
    <tspan x="50" dy="25">形成了深深的峡谷(canyon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Grand Canyon is one of the most famous canyons in the world.
  </text>
  <text x="50" y="310" class="content">
    大峡谷是世界上最著名的峡谷之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Canyon walls -->
    <path d="M0 200 L100 0 L700 0 L800 200 Z" class="image" />
    <!-- River at the bottom -->
    <path d="M0 200 L800 200" class="image" />
    <!-- Sun -->
    <circle cx="750" cy="50" r="30" fill="#F1C40F" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="50" ry="20" fill="#ECF0F1" />
    <ellipse cx="200" cy="70" rx="60" ry="25" fill="#ECF0F1" />
    <ellipse cx="300" cy="60" rx="40" ry="15" fill="#ECF0F1" />
  </g>
</svg>