<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laud</text>
  <text x="50" y="120" class="subtitle">[lɔːd] v. 赞美，称赞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> laud (来自拉丁语 "laudare"，意为“赞美”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的吟游诗人，手持竖琴，"高声赞美(laud)"
    <tspan x="50" dy="25">英雄的壮举，声音在空中回荡，令人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The audience lauded the performance with a standing ovation.
  </text>
  <text x="50" y="310" class="content">
    观众起立鼓掌，对表演表示赞赏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bard with harp -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Harp -->
    <path d="M 80 80 Q 100 100 120 80 Q 140 60 160 80" class="image" />
    <line x1="90" y1="80" x2="150" y2="80" class="image" />
    <line x1="95" y1="70" x2="145" y2="70" class="image" />
    <line x1="100" y1="60" x2="140" y2="60" class="image" />
    <line x1="105" y1="50" x2="135" y2="50" class="image" />
    <!-- Sound waves -->
    <path d="M 50 220 Q 70 240 90 220 Q 110 200 130 220" class="image" />
    <path d="M 50 240 Q 70 260 90 240 Q 110 220 130 240" class="image" />
    <path d="M 50 260 Q 70 280 90 260 Q 110 240 130 260" class="image" />
  </g>
</svg>