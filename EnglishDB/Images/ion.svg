<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ion</text>
  <text x="50" y="120" class="subtitle">[aɪən] n. 离子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ion (源自希腊语 -ion, 表示“动作的结果”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个实验室里，科学家正在研究带电粒子，这些粒子在电场中移动，形成了一个个"离子(ion)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ions in the solution were detected by the spectrometer.
  </text>
  <text x="50" y="310" class="content">
    溶液中的离子被光谱仪检测到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lab table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Beaker -->
    <rect x="50" y="50" width="100" height="100" class="image" />
    <!-- Ions -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="120" cy="120" r="10" class="image" />
    <circle cx="140" cy="140" r="10" class="image" />
    <circle cx="160" cy="160" r="10" class="image" />
    <!-- Electric field lines -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
  </g>
</svg>