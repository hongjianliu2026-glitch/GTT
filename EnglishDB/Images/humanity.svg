<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humanity</text>
  <text x="50" y="120" class="subtitle">[hjuːˈmænəti] n. 人性，人类，人道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> human (人) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"人(human)"形符号，象征着所有人类的共同特征和情感，
    <tspan x="50" dy="25">这个符号就是"人性(humanity)"的化身。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The act of kindness showed great humanity.
  </text>
  <text x="50" y="310" class="content">
    这个善举展现了极大的仁慈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Human figure -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="220" class="image" />
    <line x1="100" y1="180" x2="150" y2="220" class="image" />
    <!-- Heart symbol -->
    <path d="M150,100 Q175,75 200,100 Q175,125 150,100" class="image" />
    <text x="150" y="110" class="content" text-anchor="middle">❤</text>
  </g>
</svg>