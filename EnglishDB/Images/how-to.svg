<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">how-to</text>
  <text x="50" y="120" class="subtitle">[ˈhaʊ tuː] n. 指南，方法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> how (如何) + to (去做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一本"如何去做(how-to)"的书，
    <tspan x="50" dy="25">书上详细列出了每个步骤，帮助他一步步完成任务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I found a great how-to guide on baking bread.
  </text>
  <text x="50" y="310" class="content">
    我找到了一个很棒的关于烘焙面包的指南。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="250" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="140" x2="180" y2="140" class="image" />
    <line x1="20" y1="180" x2="180" y2="180" class="image" />
    <line x1="20" y1="220" x2="180" y2="220" class="image" />
    <!-- Person holding the book -->
    <circle cx="250" cy="125" r="20" class="image" />
    <line x1="250" y1="145" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="230" y2="230" class="image" />
    <line x1="250" y1="200" x2="270" y2="230" class="image" />
    <line x1="250" y1="160" x2="220" y2="150" class="image" />
    <line x1="250" y1="160" x2="280" y2="150" class="image" />
    <line x1="250" y1="200" x2="200" y2="180" class="image" />
  </g>
</svg>