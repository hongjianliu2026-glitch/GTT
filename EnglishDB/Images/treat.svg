<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">treat</text>
  <text x="50" y="120" class="subtitle">[triːt] v. 对待，治疗；n. 款待，乐事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tre- (拉丁语 "tract"，意为 "拉，拖")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生用"拖拽(tre-)"的方式治疗病人，
    <tspan x="50" dy="25">或者你用"拖拽"的方式对待朋友，给他们一个惊喜的款待。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She treated her friends to ice cream.
  </text>
  <text x="50" y="310" class="content">
    她请朋友们吃冰淇淋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doctor treating patient -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <!-- Doctor -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Patient -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Treat -->
    <rect x="300" y="50" width="50" height="50" class="image" />
    <text x="310" y="80" class="content">🍦</text>
  </g>
</svg>