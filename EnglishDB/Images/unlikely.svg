<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unlikely</text>
  <text x="50" y="120" class="subtitle">[ʌnˈlaɪkli] adj. 不太可能的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + likely (可能的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟试图"不(un-)"飞上天空，但它"可能(likely)"
    <tspan x="50" dy="25">失败了，因为它太小了，这就是"不太可能(unlikely)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It is unlikely that she will arrive on time.
  </text>
  <text x="50" y="310" class="content">
    她不太可能准时到达。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <line x1="50" y1="140" x2="70" y2="130" class="image" />
    <line x1="50" y1="160" x2="30" y2="180" class="image" />
    <line x1="50" y1="160" x2="70" y2="180" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="100" y2="200" class="image" />
    <!-- Sky -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="0" y1="20" x2="100" y2="20" class="image" />
    <line x1="0" y1="40" x2="100" y2="40" class="image" />
    <line x1="0" y1="60" x2="100" y2="60" class="image" />
    <line x1="0" y1="80" x2="100" y2="80" class="image" />
  </g>
</svg>