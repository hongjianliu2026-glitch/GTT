<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">farewell</text>
  <text x="50" y="120" class="subtitle">[ˌferˈwel] n. 告别，辞行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fare (走) + well (好)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在告别时，"走得好(fare-well)"，
    <tspan x="50" dy="25">祝愿对方一路顺风，这就是告别(farewell)的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They exchanged farewells before parting ways.
  </text>
  <text x="50" y="310" class="content">
    他们在分开前互道珍重。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="110" r="15" class="image" />
    <line x1="50" y1="125" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Person waving -->
    <circle cx="250" cy="110" r="15" class="image" />
    <line x1="250" y1="125" x2="250" y2="160" class="image" />
    <line x1="250" y1="125" x2="230" y2="100" class="image" />
    <line x1="250" y1="125" x2="270" y2="100" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>