<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">picking</text>
  <text x="50" y="120" class="subtitle">[ˈpɪkɪŋ] n. 采摘，挑选</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pick (挑选) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在果园里，"挑选(pick)"
    <tspan x="50" dy="25">成熟的苹果，这些苹果就构成了采摘(picking)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The picking of apples is a fun activity in autumn.
  </text>
  <text x="50" y="310" class="content">
    采摘苹果是秋天的一项有趣活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <circle cx="50" cy="30" r="20" class="image" />
    <circle cx="30" cy="60" r="20" class="image" />
    <circle cx="70" cy="60" r="20" class="image" />
    <circle cx="50" cy="90" r="20" class="image" />
    <!-- Farmer -->
    <circle cx="20" cy="160" r="15" class="image" />
    <line x1="20" y1="175" x2="20" y2="210" class="image" />
    <line x1="20" y1="210" x2="0" y2="240" class="image" />
    <line x1="20" y1="210" x2="40" y2="240" class="image" />
    <line x1="20" y1="190" x2="50" y2="180" class="image" />
    <!-- Apple in hand -->
    <circle cx="60" cy="180" r="10" class="image" />
  </g>
</svg>