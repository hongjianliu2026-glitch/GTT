<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accustom</text>
  <text x="50" y="120" class="subtitle">[əˈkʌstəm] v. 使习惯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (向) + custom (习惯)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人每天早上"向(ad-)"着咖啡杯走去，
    <tspan x="50" dy="25">逐渐"习惯(custom)"了喝咖啡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It took her a month to accustom herself to the new schedule.
  </text>
  <text x="50" y="310" class="content">
    她花了一个月的时间才适应了新的日程安排。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking towards coffee cup -->
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <line x1="100" y1="60" x2="120" y2="80" class="image" />
    <line x1="100" y1="60" x2="80" y2="80" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <!-- Coffee cup -->
    <rect x="150" y="70" width="50" height="50" class="image" />
    <line x1="150" y1="70" x2="125" y2="50" class="image" />
    <line x1="200" y1="70" x2="225" y2="50" class="image" />
    <line x1="175" y1="70" x2="175" y2="20" class="image" />
  </g>
</svg>