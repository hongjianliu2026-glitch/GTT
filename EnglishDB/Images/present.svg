<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">present</text>
  <text x="50" y="120" class="subtitle">[ˈprɛzənt] n. 礼物；adj. 现在的；v. 赠送，呈现</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + sent (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在你面前，"提前存在(pre-sent)"，
    <tspan x="50" dy="25">手里拿着一个礼物，这个礼物就是他呈现(present)给你的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She presented him with a gift on his birthday.
  </text>
  <text x="50" y="310" class="content">
    她在他的生日那天送给他一份礼物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="130" class="image" />
    <!-- Gift -->
    <rect x="120" y="80" width="60" height="60" class="image" />
    <line x1="120" y1="80" x2="180" y2="80" class="image" />
    <line x1="120" y1="140" x2="180" y2="140" class="image" />
    <line x1="120" y1="80" x2="120" y2="140" class="image" />
    <line x1="180" y1="80" x2="180" y2="140" class="image" />
    <!-- Bow -->
    <circle cx="150" cy="70" r="10" class="image" />
    <line x1="150" y1="70" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="140" y2="60" class="image" />
    <line x1="150" y1="50" x2="160" y2="60" class="image" />
  </g>
</svg>