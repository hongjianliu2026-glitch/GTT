<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">binge</text>
  <text x="50" y="120" class="subtitle">[bɪndʒ] n. & v. 狂欢，狂饮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bing (源自中古英语，意为“突然的行动”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然开始"狂欢(binge)"，
    <tspan x="50" dy="25">面前堆满了食物和饮料，他疯狂地吃喝，</tspan>
    <tspan x="50" dy="25">直到再也吃不下为止。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She went on a binge after the exam.
  </text>
  <text x="50" y="310" class="content">
    考试结束后，她狂欢了一番。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food and drinks -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Pizza -->
    <circle cx="100" cy="50" r="20" class="image" /> <!-- Burger -->
    <circle cx="150" cy="50" r="20" class="image" /> <!-- Soda -->
    <circle cx="200" cy="50" r="20" class="image" /> <!-- Chips -->
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Eating -->
    <line x1="20" y1="115" x2="50" y2="50" class="image" />
  </g>
</svg>