<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">five-year</text>
  <text x="50" y="120" class="subtitle">[faɪv jɪr] adj. 五年的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> five (五) + year (年)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟，上面有五个指针，每个指针代表一年，
    <tspan x="50" dy="25">五个指针一起转动，象征着五年的时间流逝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a five-year plan to expand its market.
  </text>
  <text x="50" y="310" class="content">
    公司有一个五年计划来扩展市场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="180" class="image" />
    <line x1="100" y1="100" x2="20" y2="100" class="image" />
    <line x1="100" y1="100" x2="60" y2="170" class="image" />
    <!-- Numbers -->
    <text x="90" y="30" class="content">1</text>
    <text x="170" y="105" class="content">2</text>
    <text x="90" y="185" class="content">3</text>
    <text x="10" y="105" class="content">4</text>
    <text x="60" y="175" class="content">5</text>
  </g>
</svg>