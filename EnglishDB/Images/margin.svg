<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">margin</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrdʒɪn] n. 边缘，页边空白</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> marg (边缘) + in (在...里面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本书的边缘，"在边缘(marg)里面(in)"
    <tspan x="50" dy="25">留出的空白区域，这就是页边空白(margin)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please write your notes in the margin of the book.
  </text>
  <text x="50" y="310" class="content">
    请在书的页边空白处写笔记。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Page -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Margin -->
    <rect x="50" y="20" width="20" height="160" class="image" />
    <rect x="280" y="20" width="20" height="160" class="image" />
    <rect x="50" y="20" width="250" height="20" class="image" />
    <rect x="50" y="160" width="250" height="20" class="image" />
    <!-- Notes -->
    <line x1="60" y1="50" x2="80" y2="50" class="image" />
    <line x1="60" y1="80" x2="80" y2="80" class="image" />
    <line x1="60" y1="110" x2="80" y2="110" class="image" />
    <line x1="60" y1="140" x2="80" y2="140" class="image" />
  </g>
</svg>