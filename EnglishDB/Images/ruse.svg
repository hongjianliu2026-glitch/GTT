<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ruse</text>
  <text x="50" y="120" class="subtitle">[ruːz] n. 诡计，计谋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rus- (源自拉丁语 "ruse"，意为欺骗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狡猾的狐狸，用"诡计(ruse)"
    <tspan x="50" dy="25">欺骗猎人，成功逃脱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spy used a clever ruse to escape from the enemy.
  </text>
  <text x="50" y="310" class="content">
    间谍用了一个巧妙的诡计从敌人手中逃脱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fox -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <line x1="50" y1="140" x2="70" y2="130" class="image" />
    <line x1="50" y1="160" x2="30" y2="180" class="image" />
    <line x1="50" y1="160" x2="70" y2="180" class="image" />
    <!-- Hunter -->
    <rect x="150" y="80" width="50" height="100" class="image" />
    <line x1="175" y1="180" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="155" y2="240" class="image" />
    <line x1="175" y1="220" x2="195" y2="240" class="image" />
    <line x1="175" y1="200" x2="200" y2="190" class="image" />
    <!-- Ruse -->
    <text x="250" y="150" class="image" font-size="30" fill="#A93226">?</text>
  </g>
</svg>