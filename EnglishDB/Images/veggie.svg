<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">veggie</text>
  <text x="50" y="120" class="subtitle">[ˈvɛdʒi] n. 蔬菜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> veg (vegetable的缩写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蔬菜园，里面种满了各种"蔬菜(veggie)"，
    <tspan x="50" dy="25">有胡萝卜、西红柿、黄瓜等，它们都在阳光下茁壮成长。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat fresh veggies from her garden.
  </text>
  <text x="50" y="310" class="content">
    她喜欢从她的花园里吃新鲜的蔬菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Carrot -->
    <line x1="50" y1="180" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="40" y2="110" class="image" />
    <line x1="50" y1="100" x2="60" y2="110" class="image" />
    <line x1="50" y1="100" x2="45" y2="90" class="image" />
    <line x1="50" y1="100" x2="55" y2="90" class="image" />
    <!-- Tomato -->
    <circle cx="120" cy="150" r="20" class="image" />
    <!-- Cucumber -->
    <rect x="180" y="130" width="40" height="70" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <line x1="300" y1="20" x2="300" y2="0" class="image" />
    <line x1="330" y1="50" x2="350" y2="50" class="image" />
    <line x1="270" y1="50" x2="250" y2="50" class="image" />
    <line x1="300" y1="80" x2="300" y2="100" class="image" />
  </g>
</svg>