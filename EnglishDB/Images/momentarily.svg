<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">momentarily</text>
  <text x="50" y="120" class="subtitle">[ˌmoʊmənˈtɛərəli] adv. 片刻地，瞬间地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> moment (瞬间) + -ary (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟的指针突然"瞬间(moment)"停住，
    <tspan x="50" dy="25">时间仿佛在这一刻凝固，这就是"片刻地(momentarily)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hesitated momentarily before answering the question.
  </text>
  <text x="50" y="310" class="content">
    她在回答问题前犹豫了片刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Stopped hand -->
    <line x1="175" y1="100" x2="175" y2="50" class="image" style="stroke: #E74C3C; stroke-width: 4;" />
    <!-- Time frozen -->
    <text x="150" y="220" class="content" style="fill: #E74C3C;">时间凝固</text>
  </g>
</svg>