<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alignment</text>
  <text x="50" y="120" class="subtitle">[əˈlaɪnmənt] n. 对齐，排列</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (加强) + -ign (线) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群士兵在操场上，"加强排列(al-ign-ment)"
    <tspan x="50" dy="25">成一条直线，整齐划一，这就是对齐(alignment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The text in the document needs to be in alignment.
  </text>
  <text x="50" y="310" class="content">
    文档中的文本需要对齐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldiers in a line -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <circle cx="100" cy="20" r="10" class="image" />
    <circle cx="150" cy="20" r="10" class="image" />
    <circle cx="200" cy="20" r="10" class="image" />
    <circle cx="250" cy="20" r="10" class="image" />
    <circle cx="300" cy="20" r="10" class="image" />
    <!-- Line of alignment -->
    <line x1="50" y1="40" x2="350" y2="40" class="image" />
    <text x="150" y="60" class="content">对齐线</text>
  </g>
</svg>