<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evangelical</text>
  <text x="50" y="120" class="subtitle">[ɪˌvænˈdʒɛlɪkəl] adj. 福音的，福音派的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eu- (好) + angel (天使) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天使(angel)带着好消息(eu-)，
    <tspan x="50" dy="25">传播福音(evangelical)，让人们感受到希望和喜悦。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evangelical church held a large gathering to spread their message.
  </text>
  <text x="50" y="310" class="content">
    福音派教堂举行了一次大型集会来传播他们的信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angel -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Halo -->
    <circle cx="50" cy="70" r="15" class="image" />
    <!-- Message -->
    <rect x="100" y="80" width="200" height="100" class="image" />
    <text x="120" y="130" class="content">Good News</text>
  </g>
</svg>