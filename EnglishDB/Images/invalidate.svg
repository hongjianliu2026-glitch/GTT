<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">invalidate</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvælɪˌdeɪt] v. 使无效，使作废</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + valid (有效的) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的橡皮擦，"擦掉(in-valid)"
    <tspan x="50" dy="25">所有有效的标记，让一切都变得无效(invalidate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new evidence invalidated the previous conclusion.
  </text>
  <text x="50" y="310" class="content">
    新的证据使之前的结论无效。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eraser -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Markings -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Eraser head -->
    <rect x="100" y="100" width="150" height="50" class="image" />
    <!-- Wiping effect -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="125" x2="250" y2="125" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>