<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">magnet</text>
  <text x="50" y="120" class="subtitle">[ˈmæɡnɪt] n. 磁铁，有吸引力的人或物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> magn (大) + et (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磁铁(magn-et)，它像一个"大吸盘"，
    <tspan x="50" dy="25">吸引着周围的所有金属物体，让人无法抗拒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The singer is a magnet for fans.
  </text>
  <text x="50" y="310" class="content">
    这位歌手对粉丝有着巨大的吸引力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- North and South poles -->
    <circle cx="125" cy="100" r="20" class="image" fill="#E74C3C" />
    <circle cx="225" cy="100" r="20" class="image" fill="#3498DB" />
    <!-- Attracted objects -->
    <line x1="125" y1="130" x2="225" y2="130" class="image" />
    <line x1="125" y1="160" x2="225" y2="160" class="image" />
    <line x1="125" y1="190" x2="225" y2="190" class="image" />
    <line x1="125" y1="220" x2="225" y2="220" class="image" />
    <!-- Labels -->
    <text x="115" y="90" class="content" fill="#FFFFFF">N</text>
    <text x="215" y="90" class="content" fill="#FFFFFF">S</text>
  </g>
</svg>