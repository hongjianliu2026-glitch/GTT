<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">metric</text>
  <text x="50" y="120" class="subtitle">[ˈmɛtrɪk] adj. 米制的，公制的；n. 度量标准</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> metr (测量) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的尺子(metr)，上面刻着各种测量单位，
    <tspan x="50" dy="25">这个尺子就是"度量标准(metric)"，用来衡量一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The metric system is widely used in science.
  </text>
  <text x="50" y="310" class="content">
    公制系统在科学中被广泛使用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ruler -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Measurement marks -->
    <line x1="20" y1="0" x2="20" y2="50" class="image" />
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="80" y1="0" x2="80" y2="50" class="image" />
    <line x1="110" y1="0" x2="110" y2="50" class="image" />
    <line x1="140" y1="0" x2="140" y2="50" class="image" />
    <line x1="170" y1="0" x2="170" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <line x1="230" y1="0" x2="230" y2="50" class="image" />
    <line x1="260" y1="0" x2="260" y2="50" class="image" />
    <line x1="290" y1="0" x2="290" y2="50" class="image" />
    <line x1="320" y1="0" x2="320" y2="50" class="image" />
    <!-- Text labels -->
    <text x="10" y="70" class="content">10</text>
    <text x="40" y="70" class="content">20</text>
    <text x="70" y="70" class="content">30</text>
    <text x="100" y="70" class="content">40</text>
    <text x="130" y="70" class="content">50</text>
    <text x="160" y="70" class="content">60</text>
    <text x="190" y="70" class="content">70</text>
    <text x="220" y="70" class="content">80</text>
    <text x="250" y="70" class="content">90</text>
    <text x="280" y="70" class="content">100</text>
    <text x="310" y="70" class="content">110</text>
  </g>
</svg>