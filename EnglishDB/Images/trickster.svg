<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #641E16; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #922B21; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trickster</text>
  <text x="50" y="120" class="subtitle">[ˈtrɪkstər] n. 骗子，恶作剧者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trick (诡计) + -ster (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着帽子的小丑，手里拿着一个魔术棒，
    <tspan x="50" dy="25">正在变出一个又一个的诡计(trick)，他就是那个trickster。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The trickster managed to fool everyone at the party.
  </text>
  <text x="50" y="310" class="content">
    那个骗子在派对上成功愚弄了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hat -->
    <path d="M 0 0 L 50 0 L 75 50 L 25 50 Z" class="image" />
    <!-- Face -->
    <circle cx="50" cy="70" r="20" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="65" r="5" class="image" />
    <circle cx="60" cy="65" r="5" class="image" />
    <!-- Nose -->
    <circle cx="50" cy="80" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 40 90 Q 50 95 60 90" class="image" />
    <!-- Magic wand -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <circle cx="50" cy="155" r="5" class="image" />
  </g>
</svg>