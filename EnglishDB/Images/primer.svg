<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">primer</text>
  <text x="50" y="120" class="subtitle">[ˈpraɪmər] n. 底漆，初级读本</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prim (第一) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家在画布上"第一层(prim)"涂上底漆(primer)，
    <tspan x="50" dy="25">这层底漆就像一本初级读本，为后续的绘画打下基础。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She applied a primer before painting the wall.
  </text>
  <text x="50" y="310" class="content">
    她在墙上涂了底漆后再开始绘画。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paintbrush -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="90" y2="10" class="image" />
    <line x1="100" y1="0" x2="90" y2="-10" class="image" />
    <!-- Paint can -->
    <rect x="120" y="-30" width="60" height="60" class="image" />
    <line x1="150" y1="-30" x2="150" y2="30" class="image" />
    <!-- Canvas -->
    <rect x="200" y="-50" width="150" height="100" class="image" />
    <!-- Primer layer -->
    <rect x="210" y="-40" width="130" height="80" class="image" fill="#F1C40F" />
  </g>
</svg>