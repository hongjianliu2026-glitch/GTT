<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">encouraging</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkɜːrɪdʒɪŋ] adj. 鼓励的，鼓舞人心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + cour (心) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老师在课堂上，"使(en-)"学生们"心(cour)"中充满力量，
    <tspan x="50" dy="25">这种力量就是"鼓励(encouraging)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher's encouraging words boosted the students' confidence.
  </text>
  <text x="50" y="310" class="content">
    老师鼓励的话语增强了学生的信心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teacher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Heart -->
    <path d="M 100 100 C 100 50, 150 50, 150 100 S 200 150, 150 200 S 100 250, 100 200 S 50 150, 100 100" class="image" />
    <!-- Students -->
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="280" cy="100" r="15" class="image" />
    <circle cx="310" cy="100" r="15" class="image" />
    <!-- Connection lines -->
    <line x1="50" y1="150" x2="100" y2="150" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>