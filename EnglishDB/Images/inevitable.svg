<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inevitable</text>
  <text x="50" y="120" class="subtitle">[ɪnˈɛvɪtəbl] adj. 不可避免的，必然发生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + evit (避免) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的陨石正朝地球飞来，"无法避免(in-evit-able)"
    <tspan x="50" dy="25">地撞击，这就是不可避免的(inevitable)灾难。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The collision of the two cars was inevitable.
  </text>
  <text x="50" y="310" class="content">
    两辆车的碰撞是不可避免的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meteor -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="100" x2="400" y2="400" class="image" />
    <!-- Earth -->
    <circle cx="400" cy="400" r="100" class="image" />
    <!-- Explosion -->
    <circle cx="400" cy="400" r="20" class="image" />
    <circle cx="400" cy="400" r="30" class="image" />
    <circle cx="400" cy="400" r="40" class="image" />
  </g>
</svg>