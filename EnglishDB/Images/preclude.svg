<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preclude</text>
  <text x="50" y="120" class="subtitle">[prɪˈkluːd] v. 排除，阻止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + clude (关闭)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一扇大门，"提前关闭(pre-clude)"
    <tspan x="50" dy="25">以阻止某人进入，这就是排除或阻止(preclude)的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His early arrival precluded any possibility of missing the event.
  </text>
  <text x="50" y="310" class="content">
    他提前到达，排除了错过活动的可能性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Door handle -->
    <circle cx="180" cy="150" r="10" class="image" />
    <!-- Lock -->
    <rect x="160" y="130" width="40" height="40" class="image" />
    <!-- Lock bolt -->
    <line x1="180" y1="130" x2="180" y2="50" class="image" />
    <!-- Person trying to enter -->
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="250" y1="170" x2="250" y2="250" class="image" />
    <line x1="250" y1="250" x2="230" y2="280" class="image" />
    <line x1="250" y1="250" x2="270" y2="280" class="image" />
    <line x1="250" y1="200" x2="290" y2="190" class="image" />
  </g>
</svg>