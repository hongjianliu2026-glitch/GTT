<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uprising</text>
  <text x="50" y="120" class="subtitle">[ʌpˈraɪzɪŋ] n. 起义，暴动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + rise (升起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"向上(up)"举起拳头，"升起(rise)"
    <tspan x="50" dy="25">反抗的旗帜，这就是起义(uprising)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The uprising was quickly suppressed by the government.
  </text>
  <text x="50" y="310" class="content">
    起义很快被政府镇压了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- People -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="35" y2="200" class="image" />
    <line x1="50" y1="180" x2="65" y2="200" class="image" />
    <line x1="50" y1="170" x2="70" y2="160" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="85" y2="200" class="image" />
    <line x1="100" y1="180" x2="115" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="160" class="image" />
    <!-- Fist -->
    <rect x="150" y="140" width="20" height="40" class="image" />
    <line x1="160" y1="140" x2="160" y2="180" class="image" />
    <line x1="160" y1="180" x2="145" y2="200" class="image" />
    <line x1="160" y1="180" x2="175" y2="200" class="image" />
    <line x1="160" y1="170" x2="180" y2="160" class="image" />
    <!-- Flag -->
    <rect x="200" y="100" width="20" height="80" class="image" />
    <rect x="200" y="100" width="50" height="20" class="image" />
  </g>
</svg>