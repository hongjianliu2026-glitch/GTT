<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conceptually</text>
  <text x="50" y="120" class="subtitle">[kənˈsɛptʃuəli] adv. 概念上地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + cept (拿) + -ual (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"共同拿(con-cept)"
    <tspan x="50" dy="25">出一个概念，然后一起讨论，这就是概念上地(conceptually)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The idea was conceptually sound, but needed practical adjustments.
  </text>
  <text x="50" y="310" class="content">
    这个想法在概念上是合理的，但需要实际调整。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People sitting around a table -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <rect x="20" y="120" width="260" height="20" class="image" />
    <!-- Concept bubble -->
    <circle cx="150" cy="50" r="30" class="image" />
    <text x="135" y="55" class="content" fill="#34495E">概念</text>
  </g>
</svg>