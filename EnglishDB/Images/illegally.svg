<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">illegally</text>
  <text x="50" y="120" class="subtitle">[ɪˈlɛdʒəli] adv. 非法地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> il- (不) + leg (法律) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警察在追捕一个"不遵守法律(il-leg-ally)"
    <tspan x="50" dy="25">的人，这个人正在非法地(illegally)逃跑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was arrested for driving illegally.
  </text>
  <text x="50" y="310" class="content">
    他因非法驾驶被逮捕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Police officer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <rect x="10" y="180" width="20" height="10" class="image" />
    <rect x="15" y="185" width="10" height="5" class="image" />

    <!-- Criminal running -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="180" class="image" />

    <!-- Handcuffs -->
    <rect x="140" y="180" width="20" height="10" class="image" />
    <rect x="145" y="185" width="10" height="5" class="image" />
  </g>
</svg>