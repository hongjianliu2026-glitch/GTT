<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">goddamned</text>
  <text x="50" y="120" class="subtitle">[ˈɡɒdˌdæmd] adj. 该死的，可恶的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> god (神) + damned (被诅咒的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被神诅咒的生物，"神(god)诅咒(damned)"
    <tspan x="50" dy="25">它，让它变得该死(goddamned)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I can't believe I lost my keys again, goddamned it!
  </text>
  <text x="50" y="310" class="content">
    我不敢相信我又把钥匙弄丢了，该死的！
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lightning bolt -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <!-- Damned creature -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="170" y2="210" class="image" />
    <line x1="200" y1="180" x2="230" y2="210" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
    <line x1="200" y1="150" x2="150" y2="140" class="image" />
  </g>
</svg>