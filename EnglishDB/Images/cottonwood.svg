<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
      .cotton { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cottonwood</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːtnwʊd] n. 杨树，棉白杨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cotton (棉花) + wood (木头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树，它的种子像棉花一样轻飘飘地飞舞，
    <tspan x="50" dy="25">这就是棉白杨(cottonwood)，它的种子像棉花一样柔软。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cottonwood tree's seeds filled the air like snow.
  </text>
  <text x="50" y="310" class="content">
    棉白杨的种子像雪花一样飘满了天空。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="50" y="0" width="50" height="200" class="tree" />
    <!-- Tree branches -->
    <line x1="75" y1="20" x2="125" y2="100" class="image" />
    <line x1="75" y1="40" x2="25" y2="100" class="image" />
    <line x1="75" y1="60" x2="100" y2="150" class="image" />
    <line x1="75" y1="80" x2="50" y2="150" class="image" />
    <!-- Cotton seeds -->
    <circle cx="125" cy="100" r="10" class="cotton" />
    <circle cx="25" cy="100" r="10" class="cotton" />
    <circle cx="100" cy="150" r="10" class="cotton" />
    <circle cx="50" cy="150" r="10" class="cotton" />
  </g>
</svg>