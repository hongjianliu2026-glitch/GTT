<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">funny</text>
  <text x="50" y="120" class="subtitle">[ˈfʌni] adj. 有趣的，滑稽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fun (娱乐) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小丑在舞台上，"娱乐(fun)"
    <tspan x="50" dy="25">观众，他的滑稽表演让人捧腹大笑，这就是funny。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> That joke was really funny!
  </text>
  <text x="50" y="310" class="content">
    那个笑话真的很有趣！
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clown -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="70" y2="200" class="image" />
    <line x1="100" y1="170" x2="130" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <!-- Smile -->
    <path d="M70 90 Q100 110 130 90" class="image" />
    <!-- Audience -->
    <circle cx="200" cy="120" r="10" class="image" />
    <circle cx="250" cy="120" r="10" class="image" />
    <circle cx="300" cy="120" r="10" class="image" />
  </g>
</svg>