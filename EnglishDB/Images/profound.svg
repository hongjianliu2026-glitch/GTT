<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">profound</text>
  <text x="50" y="120" class="subtitle">[prəˈfaʊnd] adj. 深刻的，深远的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + found (基础)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地面上，"向前(pro-)"
    <tspan x="50" dy="25">深入到地基(found)的深处，</tspan>
    <tspan x="50" dy="25">这种深入的感觉就是"深刻的(profound)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His speech had a profound impact on the audience.
  </text>
  <text x="50" y="310" class="content">
    他的演讲对听众产生了深远的影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Foundation -->
    <rect x="150" y="150" width="50" height="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
  </g>
</svg>