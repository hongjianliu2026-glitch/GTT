<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">corporation</text>
  <text x="50" y="120" class="subtitle">[ˌkɔːrpəˈreɪʃn] n. 公司，法人团体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> corpo- (身体) + -ration (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的身体(corpo-)，代表一个公司(corporation)，
    <tspan x="50" dy="25">这个身体由许多员工组成，共同运作，就像一个有机体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The corporation announced its new product line.
  </text>
  <text x="50" y="310" class="content">
    该公司宣布了其新产品线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body outline -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Head -->
    <circle cx="175" cy="50" r="20" class="image" />
    <!-- Arms -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <!-- Legs -->
    <line x1="150" y1="180" x2="150" y2="250" class="image" />
    <line x1="200" y1="180" x2="200" y2="250" class="image" />
    <!-- Employees -->
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="175" cy="200" r="10" class="image" />
  </g>
</svg>