<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adapt</text>
  <text x="50" y="120" class="subtitle">[əˈdæpt] v. 适应，改编</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + apt (适合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只变色龙，"朝向(ad-)"不同的环境，"适合(apt)"
    <tspan x="50" dy="25">地改变自己的颜色，这就是适应(adapt)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She quickly adapted to the new job.
  </text>
  <text x="50" y="310" class="content">
    她很快适应了新工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chameleon -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Back leg -->
    <line x1="50" y1="200" x2="20" y2="230" class="image" /> <!-- Front tail -->
    <line x1="50" y1="200" x2="80" y2="230" class="image" /> <!-- Back tail -->
    <!-- Changing colors -->
    <circle cx="50" cy="100" r="25" fill="#7F8C8D" /> <!-- Initial color -->
    <circle cx="50" cy="100" r="25" fill="#2ECC71" /> <!-- Adapted color -->
  </g>
</svg>