<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exhaust</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzɔːst] v. 耗尽，使筋疲力尽；n. 排气，废气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + haust (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车在高速公路上飞驰，"拉出(haust)"
    <tspan x="50" dy="25">所有的能量，直到完全耗尽(exhaust)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The long hike exhausted us.
  </text>
  <text x="50" y="310" class="content">
    长时间的徒步旅行让我们筋疲力尽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="100" class="image" />
    <rect x="70" y="40" width="210" height="60" class="image" />
    <!-- Exhaust pipe -->
    <line x1="175" y1="120" x2="175" y2="200" class="image" />
    <!-- Exhaust smoke -->
    <circle cx="175" cy="210" r="10" class="image" />
    <circle cx="175" cy="230" r="15" class="image" />
    <circle cx="175" cy="250" r="20" class="image" />
  </g>
</svg>