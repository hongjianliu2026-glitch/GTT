<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outer</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtər] adj. 外部的，外面的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外面) + -er (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆圈，"外面的(out-er)"
    <tspan x="50" dy="25">部分被特别标注，这就是outer的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outer layer of the cake is chocolate.
  </text>
  <text x="50" y="310" class="content">
    蛋糕的外层是巧克力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large circle -->
    <circle cx="200" cy="200" r="150" class="image" />
    <!-- Small circle inside -->
    <circle cx="200" cy="200" r="100" class="image" />
    <!-- Arrow pointing to outer part -->
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <polygon points="200,50 180,80 220,80" class="image" />
    <!-- Text label -->
    <text x="220" y="100" class="highlight" text-anchor="start">outer</text>
  </g>
</svg>