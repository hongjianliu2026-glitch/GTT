<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relaxed</text>
  <text x="50" y="120" class="subtitle">[rɪˈlækst] adj. 放松的，轻松的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + lax (放松)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在沙滩椅上，"再次放松(re-lax)"
    <tspan x="50" dy="25">自己，享受着海风的轻拂，这就是放松的状态(relaxed)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a long day at work, he felt completely relaxed.
  </text>
  <text x="50" y="310" class="content">
    经过一天的工作后，他感到完全放松了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beach chair -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Waves -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
    <line x1="0" y1="240" x2="350" y2="240" class="image" />
  </g>
</svg>