<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bombard</text>
  <text x="50" y="120" class="subtitle">[bɒmˈbɑːrd] v. 轰炸，炮击；连续提问</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bomb (炸弹) + ard (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个记者站在战场上，"投掷炸弹(bomb-ard)"
    <tspan x="50" dy="25">般地向士兵提问，问题如雨点般落下。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The journalist bombarded the politician with questions.
  </text>
  <text x="50" y="310" class="content">
    记者向政客连续提问。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bomb -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="50" y1="120" x2="100" y2="110" class="image" />

    <!-- Journalist -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />

    <!-- Speech bubbles -->
    <path d="M250,80 Q280,80 280,110 Q250,110 250,80 Z" class="image" />
    <path d="M250,120 Q280,120 280,150 Q250,150 250,120 Z" class="image" />
    <path d="M250,160 Q280,160 280,190 Q250,190 250,160 Z" class="image" />
  </g>
</svg>