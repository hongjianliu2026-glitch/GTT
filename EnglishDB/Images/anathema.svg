<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anathema</text>
  <text x="50" y="120" class="subtitle">[əˈnæθəmə] n. 诅咒，被厌恶的事物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ana- (向上) + thema (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被众人厌恶的事物，"被高高举起(ana-thema)"
    <tspan x="50" dy="25">并被公开诅咒，这个事物就成了众人眼中的诅咒(anathema)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Smoking is an anathema to health-conscious people.
  </text>
  <text x="50" y="310" class="content">
    吸烟对注重健康的人来说是令人厌恶的事物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cross -->
    <line x1="50" y1="50" x2="200" y2="50" class="image" />
    <line x1="125" y1="50" x2="125" y2="200" class="image" />
    <!-- Object on the cross -->
    <circle cx="125" cy="125" r="30" class="image" />
    <!-- Curse symbol -->
    <text x="100" y="250" class="image" font-size="48" fill="#B03A2E">☠</text>
  </g>
</svg>