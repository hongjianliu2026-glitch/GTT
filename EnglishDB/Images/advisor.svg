<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">advisor</text>
  <text x="50" y="120" class="subtitle">[ədˈvaɪzər] n. 顾问，指导者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + vis (看) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个智者站在你面前，"朝向你(ad-)"，
    <tspan x="50" dy="25">用他的智慧"看(vis)"着你，为你提供建议，</tspan>
    <tspan x="50" dy="25">这个人就是你的"顾问(advisor)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sought advice from her advisor before making the decision.
  </text>
  <text x="50" y="310" class="content">
    她在做决定前向她的顾问寻求建议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Advisor -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Student -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <!-- Dialogue bubble -->
    <path d="M 50 70 Q 100 50 150 70 Q 200 90 250 70" class="image" />
    <text x="100" y="65" class="content" text-anchor="middle">Advice</text>
  </g>
</svg>