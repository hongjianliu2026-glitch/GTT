<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comrade</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmrəd] n. 同志，伙伴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + rad (根)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人，他们的根(rad)是共同的(com-)，
    <tspan x="50" dy="25">就像树根一样紧密相连，他们就是同志(comrade)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They were comrades in the war.
  </text>
  <text x="50" y="310" class="content">
    他们在战争中是同志。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people holding hands -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <!-- Roots -->
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
  </g>
</svg>