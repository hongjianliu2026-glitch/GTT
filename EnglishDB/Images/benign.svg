<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">benign</text>
  <text x="50" y="120" class="subtitle">[bɪˈnaɪn] adj. 良性的，和蔼的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bene- (好) + -ign (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生微笑着说：“这个肿瘤是<tspan x="50" dy="25">良性的(benign)，不会对你造成伤害。”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor assured us that the tumor was benign.
  </text>
  <text x="50" y="310" class="content">
    医生向我们保证肿瘤是良性的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Doctor -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="80" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Smile -->
    <path d="M40 60 Q50 55 60 60" class="image" />
    <!-- Tumor -->
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Benign label -->
    <text x="180" y="150" class="content" fill="#27AE60">Benign</text>
  </g>
</svg>