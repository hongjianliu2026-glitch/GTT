<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">southeast</text>
  <text x="50" y="120" class="subtitle">[ˌsaʊθˈist] n. 东南方，东南部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> south (南) + east (东)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指南针，指针指向"南(south)"和"东(east)"的交界处，
    <tspan x="50" dy="25">这就是东南(southeast)的方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship sailed towards the southeast.
  </text>
  <text x="50" y="310" class="content">
    船向东南方向航行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- North -->
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <text x="90" y="15" class="content">N</text>
    <!-- South -->
    <line x1="100" y1="180" x2="100" y2="160" class="image" />
    <text x="90" y="195" class="content">S</text>
    <!-- East -->
    <line x1="180" y1="100" x2="160" y2="100" class="image" />
    <text x="190" y="105" class="content">E</text>
    <!-- West -->
    <line x1="20" y1="100" x2="40" y2="100" class="image" />
    <text x="10" y="105" class="content">W</text>
    <!-- Southeast -->
    <line x1="180" y1="180" x2="160" y2="160" class="image" />
    <text x="190" y="195" class="content">SE</text>
  </g>
</svg>