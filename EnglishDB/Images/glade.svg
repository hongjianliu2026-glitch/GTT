<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glade</text>
  <text x="50" y="120" class="subtitle">[ɡleɪd] n. 林间空地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gl- (光) + ade (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂密的森林中，阳光透过树叶的缝隙，"光(gl-)"
    <tspan x="50" dy="25">照亮了一片空地(ade)，这就是林间空地(glade)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We found a peaceful glade to have a picnic.
  </text>
  <text x="50" y="310" class="content">
    我们找到了一个宁静的林间空地野餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Sunlight -->
    <line x1="75" y1="50" x2="275" y2="50" class="image" />
    <line x1="75" y1="80" x2="275" y2="80" class="image" />
    <line x1="75" y1="110" x2="275" y2="110" class="image" />
    <line x1="75" y1="140" x2="275" y2="140" class="image" />
    <!-- Glade -->
    <rect x="100" y="100" width="150" height="80" class="image" />
  </g>
</svg>