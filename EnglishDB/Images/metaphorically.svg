<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">metaphorically</text>
  <text x="50" y="120" class="subtitle">[ˌmɛtəˈfɔrɪkli] adv. 比喻地，象征性地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meta- (超越) + phor (携带) + -ical (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在用"超越(meta-)"常规的方式"携带(phor)"信息，
    <tspan x="50" dy="25">通过比喻(metaphor)来表达，这就是比喻地(metaphorically)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke metaphorically, using the sun as a symbol of hope.
  </text>
  <text x="50" y="310" class="content">
    她用比喻的方式说话，把太阳作为希望的象征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun as a metaphor -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
    <line x1="150" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="180" class="image" />
    <line x1="50" y1="100" x2="20" y2="100" class="image" />
    <line x1="80" y1="60" x2="60" y2="80" class="image" />
    <line x1="120" y1="60" x2="140" y2="80" class="image" />
    <line x1="80" y1="140" x2="60" y2="120" class="image" />
    <line x1="120" y1="140" x2="140" y2="120" class="image" />

    <!-- Person speaking -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
    <text x="230" y="200" class="content">"太阳是希望"</text>
  </g>
</svg>