<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">radiator</text>
  <text x="50" y="120" class="subtitle">[ˈreɪdieɪtər] n. 散热器，暖气片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> radi (光线) + -ator (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"光线发射器(radiator)"，它像太阳一样
    <tspan x="50" dy="25">散发出温暖的光线，让整个房间都变得暖洋洋的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The radiator in the living room keeps us warm during winter.
  </text>
  <text x="50" y="310" class="content">
    客厅里的暖气片让我们在冬天保持温暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Radiator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Rays -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <line x1="175" y1="20" x2="150" y2="0" class="image" />
    <line x1="175" y1="20" x2="200" y2="0" class="image" />
    <line x1="175" y1="20" x2="125" y2="0" class="image" />
    <line x1="175" y1="20" x2="225" y2="0" class="image" />
    <!-- Warmth -->
    <circle cx="175" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="175" cy="80" r="10" class="image" />
    <circle cx="175" cy="120" r="10" class="image" />
  </g>
</svg>