<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evaluative</text>
  <text x="50" y="120" class="subtitle">[ɪˈvæljəˌteɪtɪv] adj. 评价的，评估的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + valu (价值) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个专家拿着放大镜，"评估(e-valu)"
    <tspan x="50" dy="25">一件艺术品的价值，这个过程就是evaluative。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evaluative process was thorough and fair.
  </text>
  <text x="50" y="310" class="content">
    评估过程是彻底且公正的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="80" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <!-- Artwork -->
    <rect x="200" y="20" width="150" height="150" class="image" />
    <line x1="210" y1="30" x2="340" y2="30" class="image" />
    <line x1="210" y1="60" x2="340" y2="60" class="image" />
    <line x1="210" y1="90" x2="340" y2="90" class="image" />
    <line x1="210" y1="120" x2="340" y2="120" class="image" />
    <!-- Expert -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="260" class="image" />
    <line x1="100" y1="260" x2="80" y2="290" class="image" />
    <line x1="100" y1="260" x2="120" y2="290" class="image" />
    <line x1="100" y1="240" x2="130" y2="230" class="image" />
  </g>
</svg>