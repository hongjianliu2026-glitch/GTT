<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">epic</text>
  <text x="50" y="120" class="subtitle">[ˈɛpɪk] n. 史诗；adj. 宏大的，史诗般的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> epi- (在...之上) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的英雄站在山巅，"在...之上(epi-)"
    <tspan x="50" dy="25">俯瞰整个世界，他的故事被传颂为史诗(epic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was an epic tale of love and war.
  </text>
  <text x="50" y="310" class="content">
    这部电影是一部关于爱情和战争的史诗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Hero -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" />
  </g>
</svg>