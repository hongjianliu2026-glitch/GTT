<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">truly</text>
  <text x="50" y="120" class="subtitle">[ˈtruːli] adv. 真实地，真正地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> true (真实的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"真实地(truly)"
    <tspan x="50" dy="25">看到自己的倒影，没有任何虚假。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She truly believes in her abilities.
  </text>
  <text x="50" y="310" class="content">
    她真的相信自己的能力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mirror -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="190" class="image" />
    <line x1="100" y1="200" x2="150" y2="190" class="image" />
    <!-- Reflection -->
    <circle cx="100" cy="150" r="30" class="image" transform="translate(0,300) scale(1,-1)" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" transform="translate(0,300) scale(1,-1)" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" transform="translate(0,300) scale(1,-1)" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" transform="translate(0,300) scale(1,-1)" />
    <line x1="100" y1="200" x2="50" y2="190" class="image" transform="translate(0,300) scale(1,-1)" />
    <line x1="100" y1="200" x2="150" y2="190" class="image" transform="translate(0,300) scale(1,-1)" />
  </g>
</svg>