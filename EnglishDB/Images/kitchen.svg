<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kitchen</text>
  <text x="50" y="120" class="subtitle">[ˈkɪtʃɪn] n. 厨房</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kit (木板) + chen (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小木屋里，"木板搭建的小空间(kit-chen)"
    <tspan x="50" dy="25">就是厨房(kitchen)，里面充满了烹饪的香气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent the afternoon cooking in the kitchen.
  </text>
  <text x="50" y="310" class="content">
    她整个下午都在厨房里做饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kitchen outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sink -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <!-- Stove -->
    <rect x="200" y="20" width="100" height="50" class="image" />
    <!-- Counter -->
    <rect x="50" y="80" width="250" height="50" class="image" />
    <!-- Pots and pans -->
    <circle cx="70" cy="110" r="10" class="image" />
    <circle cx="90" cy="110" r="10" class="image" />
    <circle cx="110" cy="110" r="10" class="image" />
    <!-- Vegetables -->
    <rect x="220" y="90" width="20" height="20" class="image" />
    <rect x="240" y="90" width="20" height="20" class="image" />
    <rect x="260" y="90" width="20" height="20" class="image" />
  </g>
</svg>