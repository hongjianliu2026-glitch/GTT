<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mishap</text>
  <text x="50" y="120" class="subtitle">[ˈmɪsˌhæp] n. 不幸的事，灾祸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + hap (运气)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路时，"错误地(mis-)"
    <tspan x="50" dy="25">踩到了香蕉皮，结果摔倒了，这就是一个不幸的事(mishap)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He had a mishap on his way to work and fell down.
  </text>
  <text x="50" y="310" class="content">
    他在上班的路上发生了不幸，摔倒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Banana peel -->
    <path d="M100,150 Q120,140 140,150" class="image" />
    <!-- Fallen person -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="230" class="image" />
    <line x1="200" y1="230" x2="180" y2="270" class="image" />
    <line x1="200" y1="230" x2="220" y2="270" class="image" />
    <line x1="200" y1="190" x2="180" y2="210" class="image" />
    <line x1="200" y1="190" x2="220" y2="210" class="image" />
  </g>
</svg>