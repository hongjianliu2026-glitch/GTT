<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anoint</text>
  <text x="50" y="120" class="subtitle">[əˈnɔɪnt] v. 涂油，任命</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (在...上) + oint (油)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位国王在加冕仪式上，"在头上涂油(an-oint)"，
    <tspan x="50" dy="25">象征着神圣的任命和权力的赋予。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The priest anointed the new king with holy oil.
  </text>
  <text x="50" y="310" class="content">
    牧师用圣油为新国王涂油。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <!-- Oil drop -->
    <circle cx="100" cy="50" r="10" class="image" fill="#F1C40F" />
    <!-- King -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="70" y2="170" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>