<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mm</text>
  <text x="50" y="120" class="subtitle">[毫米] n. 毫米</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> milli- (千分之一) + meter (米)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微小的尺子，上面刻度是"千分之一米(milli-meter)"，
    <tspan x="50" dy="25">这就是毫米(mm)的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thickness of the paper is 0.1 mm.
  </text>
  <text x="50" y="310" class="content">
    这张纸的厚度是0.1毫米。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ruler -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Millimeter marks -->
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <line x1="150" y1="0" x2="150" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <line x1="250" y1="0" x2="250" y2="50" class="image" />
    <line x1="300" y1="0" x2="300" y2="50" class="image" />
    <!-- Highlight mm -->
    <rect x="100" y="0" width="50" height="50" class="image" />
    <text x="120" y="30" class="highlight">mm</text>
  </g>
</svg>