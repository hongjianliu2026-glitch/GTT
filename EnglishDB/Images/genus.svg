<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">genus</text>
  <text x="50" y="120" class="subtitle">[ˈdʒiːnəs] n. 属，类</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen- (产生，种类)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的树，树的每个分支代表一个"种类(gen-)"，
    <tspan x="50" dy="25">这些分支共同构成了一个"属(genus)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The genus Felis includes domestic cats.
  </text>
  <text x="50" y="310" class="content">
    猫属包括家猫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="150" y="0" width="20" height="200" class="image" />
    <!-- Branches -->
    <line x1="160" y1="50" x2="250" y2="50" class="image" />
    <line x1="160" y1="100" x2="250" y2="100" class="image" />
    <line x1="160" y1="150" x2="250" y2="150" class="image" />
    <!-- Leaves -->
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
  </g>
</svg>