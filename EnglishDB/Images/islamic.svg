<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Islamic</text>
  <text x="50" y="120" class="subtitle">[ɪzˈlæmɪk] adj. 伊斯兰教的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Isla- (伊斯兰) + -mic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的清真寺，"伊斯兰(Isla-)"
    <tspan x="50" dy="25">的象征，代表着伊斯兰教的信仰和传统。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Islamic architecture is known for its intricate designs.
  </text>
  <text x="50" y="310" class="content">
    伊斯兰建筑以其复杂的设计而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mosque -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="175,20 325,180 25,180" class="image" />
    <rect x="150" y="180" width="50" height="20" class="image" />
    <!-- Crescent moon and star -->
    <circle cx="200" cy="100" r="20" class="image" />
    <path d="M180,100 A20,20 0 0,0 220,100" class="image" />
  </g>
</svg>