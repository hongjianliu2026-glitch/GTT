<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spindly</text>
  <text x="50" y="120" class="subtitle">[ˈspɪndli] adj. 细长的，瘦长的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spin (纺) + -dly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个纺纱工人在纺纱时，纺出的线非常细长，
    <tspan x="50" dy="25">就像一个"细长的(spindly)"树枝，轻轻一碰就会弯曲。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spindly legs of the chair made it look fragile.
  </text>
  <text x="50" y="310" class="content">
    椅子细长的腿让它看起来很脆弱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spindly legs -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <!-- Chair seat -->
    <rect x="30" y="200" width="180" height="20" class="image" />
    <!-- Spindle -->
    <line x1="110" y1="220" x2="110" y2="300" class="image" />
    <circle cx="110" cy="310" r="10" class="image" />
  </g>
</svg>