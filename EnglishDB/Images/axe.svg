<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">axe</text>
  <text x="50" y="120" class="subtitle">[æks] n. 斧头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ax (砍)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人手持一把巨大的斧头，"砍(ax)"
    <tspan x="50" dy="25">倒了一棵大树，这把斧头(axe)就是他的得力工具。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lumberjack swung his axe to chop down the tree.
  </text>
  <text x="50" y="310" class="content">
    伐木工人挥动斧头砍倒了那棵树。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Axe handle -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <!-- Axe blade -->
    <polygon points="50,0 0,50 100,50" class="image" />
    <!-- Lumberjack -->
    <circle cx="50" cy="180" r="20" class="image" />
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="30" y2="280" class="image" />
    <line x1="50" y1="250" x2="70" y2="280" class="image" />
    <line x1="50" y1="220" x2="80" y2="210" class="image" />
  </g>
</svg>