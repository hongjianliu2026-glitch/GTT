<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">salmonella</text>
  <text x="50" y="120" class="subtitle">[ˌsælməˈnɛlə] n. 沙门氏菌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> salmon (鲑鱼) + ella (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条小鲑鱼(salmon)在水中游动，突然它变成了一个微小的细菌(ella)，
    <tspan x="50" dy="25">这就是沙门氏菌(salmonella)，它可能让你生病！</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The food was contaminated with salmonella.
  </text>
  <text x="50" y="310" class="content">
    食物被沙门氏菌污染了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Salmon fish -->
    <path d="M50 50 C 100 20, 150 20, 200 50" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <line x1="125" y1="50" x2="125" y2="100" class="image" />
    <!-- Bacteria -->
    <circle cx="125" cy="150" r="20" class="image" />
    <line x1="125" y1="130" x2="105" y2="150" class="image" />
    <line x1="125" y1="130" x2="145" y2="150" class="image" />
    <line x1="125" y1="170" x2="105" y2="150" class="image" />
    <line x1="125" y1="170" x2="145" y2="150" class="image" />
  </g>
</svg>