<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">killer</text>
  <text x="50" y="120" class="subtitle">[ˈkɪlər] n. 杀手，凶手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kill (杀) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着黑色面具的"杀手(killer)"，
    <tspan x="50" dy="25">手持一把锋利的刀，准备执行他的任务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective is searching for the killer.
  </text>
  <text x="50" y="310" class="content">
    侦探正在寻找凶手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Killer mask -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="20" y="20" width="110" height="60" class="image" />
    <line x1="30" y1="30" x2="120" y2="30" class="image" />
    <line x1="30" y1="50" x2="120" y2="50" class="image" />
    <!-- Knife -->
    <line x1="100" y1="120" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="130" y1="100" x2="170" y2="100" class="image" />
  </g>
</svg>