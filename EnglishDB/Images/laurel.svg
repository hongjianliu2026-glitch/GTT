<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laurel</text>
  <text x="50" y="120" class="subtitle">[ˈlɒrəl] n. 月桂树，桂冠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> laur (月桂树)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代英雄，头戴"月桂树(laur)"
    <tspan x="50" dy="25">编成的桂冠，象征着胜利与荣耀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The champion was crowned with a laurel wreath.
  </text>
  <text x="50" y="310" class="content">
    冠军被戴上了一顶月桂花环。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hero -->
    <circle cx="20" cy="100" r="30" class="image" />
    <line x1="20" y1="130" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="160" x2="50" y2="150" class="image" />
    <!-- Laurel wreath -->
    <path d="M20,70 C10,70 0,80 0,90 C0,100 10,110 20,110 C30,110 40,100 40,90 C40,80 30,70 20,70" class="image" />
    <path d="M20,60 C10,60 0,70 0,80 C0,90 10,100 20,100 C30,100 40,90 40,80 C40,70 30,60 20,60" class="image" />
  </g>
</svg>