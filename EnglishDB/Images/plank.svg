<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plank</text>
  <text x="50" y="120" class="subtitle">[plæŋk] n. 厚木板，平板</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plank (源自中古英语 plank, 意为“厚木板”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的厚木板(plank)，它横跨在两个悬崖之间，
    <tspan x="50" dy="25">形成了一座天然的桥梁。人们可以安全地走在上面，</tspan>
    <tspan x="50" dy="25">因为它足够坚固，能够承受重量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a plank to bridge the gap between the two platforms.
  </text>
  <text x="50" y="310" class="content">
    他用一块厚木板搭在两个平台之间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plank -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Cliffs -->
    <rect x="0" y="50" width="100" height="150" class="image" />
    <rect x="250" y="50" width="100" height="150" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
  </g>
</svg>