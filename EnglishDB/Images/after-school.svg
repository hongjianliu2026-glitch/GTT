<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">after-school</text>
  <text x="50" y="120" class="subtitle">[ˈæftər skuːl] adj. 课后的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> after (之后) + school (学校)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群学生在放学后，"学校之后(after-school)"
    <tspan x="50" dy="25">参加各种课外活动，如足球、绘画等。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enjoys the after-school art club.
  </text>
  <text x="50" y="310" class="content">
    她喜欢课后的美术俱乐部。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- School building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Students -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Football -->
    <circle cx="250" cy="100" r="10" class="image" />
    <!-- Art supplies -->
    <line x1="70" y1="130" x2="90" y2="150" class="image" />
    <line x1="70" y1="150" x2="90" y2="130" class="image" />
    <rect x="120" y="130" width="20" height="20" class="image" />
    <rect x="160" y="130" width="20" height="20" class="image" />
  </g>
</svg>