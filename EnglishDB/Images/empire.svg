<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">empire</text>
  <text x="50" y="120" class="subtitle">[ˈɛmpaɪər] n. 帝国</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (在...之中) + -pire (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的皇冠，"统治(pire)"
    <tspan x="50" dy="25">着整个"帝国(empire)"，象征着无上的权力和统治。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Roman Empire was one of the greatest empires in history.
  </text>
  <text x="50" y="310" class="content">
    罗马帝国是历史上最伟大的帝国之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <path d="M50 50 L100 50 L125 100 L75 100 Z" class="image" />
    <path d="M50 50 L25 100 L75 100 Z" class="image" />
    <path d="M100 50 L125 100 L75 100 Z" class="image" />
    <!-- Scepter -->
    <line x1="87.5" y1="100" x2="87.5" y2="200" class="image" />
    <circle cx="87.5" cy="200" r="10" class="image" />
  </g>
</svg>