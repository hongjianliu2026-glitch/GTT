<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dribble</text>
  <text x="50" y="120" class="subtitle">[ˈdrɪbl] v. 滴下，流口水；n. 点滴，少量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drib (滴) + -le (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在吃冰淇淋，"滴下(drib)"
    <tspan x="50" dy="25">的冰淇淋和流出的口水(dribble)，</tspan>
    <tspan x="50" dy="25">形成了一幅有趣的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby dribbled milk from the corner of his mouth.
  </text>
  <text x="50" y="310" class="content">
    婴儿从嘴角滴下了牛奶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice cream -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="70" cy="30" r="20" class="image" />
    <circle cx="90" cy="50" r="25" class="image" />
    <!-- Dripping ice cream -->
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="70" y1="50" x2="70" y2="120" class="image" />
    <line x1="90" y1="75" x2="90" y2="120" class="image" />
    <!-- Baby -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Drooling -->
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="140" y2="180" class="image" />
    <line x1="150" y1="160" x2="160" y2="180" class="image" />
  </g>
</svg>