<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gill</text>
  <text x="50" y="120" class="subtitle">[ɡɪl] n. 鱼鳃，鳃盖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gill (源自中古英语 gille，意为“鳃”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条鱼在水里游动，它的"鳃(gill)"
    <tspan x="50" dy="25">像扇子一样张开，帮助它呼吸。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fish uses its gills to extract oxygen from the water.
  </text>
  <text x="50" y="310" class="content">
    鱼用它的鳃从水中提取氧气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Fish head -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Fish eye -->
    <circle cx="35" cy="90" r="5" class="image" fill="#000" />
    <!-- Fish gills -->
    <path d="M 70 80 Q 100 70 130 80" class="image" />
    <path d="M 70 120 Q 100 130 130 120" class="image" />
    <!-- Water -->
    <path d="M 0 150 Q 200 180 400 150" class="image" />
  </g>
</svg>