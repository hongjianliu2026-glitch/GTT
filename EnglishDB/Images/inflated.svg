<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inflated</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfleɪtɪd] adj. 膨胀的，夸张的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flate (吹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球被"吹入(in-flate)"了过多的空气，
    <tspan x="50" dy="25">变得膨胀(inflated)，甚至快要爆炸了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The prices of houses in the city are inflated.
  </text>
  <text x="50" y="310" class="content">
    这个城市的房价被夸大了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF6F61" />
    <!-- Inflated balloon -->
    <circle cx="250" cy="100" r="80" class="image" fill="#FF6F61" />
    <!-- String -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="250" y1="180" x2="250" y2="280" class="image" />
    <!-- Explosion symbol -->
    <circle cx="250" cy="100" r="10" class="image" fill="#F39C12" />
    <circle cx="270" cy="80" r="10" class="image" fill="#F39C12" />
    <circle cx="230" cy="80" r="10" class="image" fill="#F39C12" />
    <circle cx="250" cy="120" r="10" class="image" fill="#F39C12" />
  </g>
</svg>