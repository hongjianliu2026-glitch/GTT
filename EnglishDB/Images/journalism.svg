<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">journalism</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɜːrnəlɪzəm] n. 新闻业，新闻工作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> journal (日志) + -ism (行为或状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个记者每天都在"记录(journal)"
    <tspan x="50" dy="25">世界发生的事情，这些记录就构成了新闻业(journalism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pursued a career in journalism after graduating.
  </text>
  <text x="50" y="310" class="content">
    她毕业后从事了新闻工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Notebook -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pages -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Pen -->
    <line x1="20" y1="100" x2="20" y2="180" class="image" />
    <line x1="20" y1="180" x2="0" y2="200" class="image" />
    <line x1="20" y1="180" x2="40" y2="200" class="image" />
    <!-- News article -->
    <text x="70" y="50" class="content">Breaking News</text>
    <text x="70" y="90" class="content">Local Events</text>
    <text x="70" y="130" class="content">Global Issues</text>
  </g>
</svg>