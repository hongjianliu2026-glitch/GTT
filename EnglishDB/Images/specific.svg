<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">specific</text>
  <text x="50" y="120" class="subtitle">[spəˈsɪfɪk] adj. 具体的，特定的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> speci (种类) + -fic (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"使(fic)"
    <tspan x="50" dy="25">某种"种类(speci)"的物质发生反应，</tspan>
    <tspan x="50" dy="25">这个过程就是具体的、特定的(specific)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please provide a specific example to illustrate your point.
  </text>
  <text x="50" y="310" class="content">
    请提供一个具体的例子来说明你的观点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Beakers -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="120" cy="100" r="20" class="image" />
    <circle cx="190" cy="100" r="20" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
    <!-- Chemical reaction -->
    <line x1="70" y1="120" x2="170" y2="120" class="image" />
    <line x1="70" y1="140" x2="170" y2="140" class="image" />
    <line x1="70" y1="160" x2="170" y2="160" class="image" />
  </g>
</svg>