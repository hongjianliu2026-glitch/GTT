<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confront</text>
  <text x="50" y="120" class="subtitle">[kənˈfrʌnt] v. 面对，对抗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + front (前面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站立，"一起站在前面(con-front)"，
    <tspan x="50" dy="25">准备进行一场激烈的辩论或对抗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had to confront her fears before speaking in public.
  </text>
  <text x="50" y="310" class="content">
    她在公开演讲前不得不面对自己的恐惧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person 1 -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="130" y2="180" class="image" />
    <line x1="100" y1="200" x2="70" y2="250" class="image" />
    <line x1="100" y1="200" x2="130" y2="250" class="image" />

    <!-- Person 2 -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="200" class="image" />
    <line x1="300" y1="150" x2="270" y2="180" class="image" />
    <line x1="300" y1="150" x2="330" y2="180" class="image" />
    <line x1="300" y1="200" x2="270" y2="250" class="image" />
    <line x1="300" y1="200" x2="330" y2="250" class="image" />

    <!-- Confrontation line -->
    <line x1="130" y1="100" x2="270" y2="100" class="image" />
  </g>
</svg>