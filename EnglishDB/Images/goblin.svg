<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">goblin</text>
  <text x="50" y="120" class="subtitle">[ˈɡɒblɪn] n. 小妖精，淘气鬼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gob (嘴) + lin (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小妖精(goblin)，它有一张大嘴(gob)，
    <tspan x="50" dy="25">总是偷偷地笑，像个淘气的小鬼(lin)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The goblin hid behind the tree, waiting to scare the children.
  </text>
  <text x="50" y="310" class="content">
    小妖精躲在树后，等着吓唬孩子们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Goblin -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <rect x="40" y="130" width="20" height="40" class="image" /> <!-- Body -->
    <line x1="50" y1="170" x2="50" y2="200" class="image" /> <!-- Leg -->
    <line x1="50" y1="170" x2="30" y2="200" class="image" /> <!-- Leg -->
    <line x1="50" y1="170" x2="70" y2="200" class="image" /> <!-- Leg -->
    <line x1="50" y1="130" x2="30" y2="150" class="image" /> <!-- Arm -->
    <line x1="50" y1="130" x2="70" y2="150" class="image" /> <!-- Arm -->
    <rect x="45" y="80" width="10" height="5" class="image" /> <!-- Mouth -->
    <circle cx="40" cy="90" r="3" class="image" /> <!-- Eye -->
    <circle cx="60" cy="90" r="3" class="image" /> <!-- Eye -->
  </g>
</svg>