<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crippling</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪpəlɪŋ] adj. 使人衰弱的，使人残废的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cripple (跛子) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为严重的伤害而"跛行(cripple)"，
    <tspan x="50" dy="25">这种伤害使他变得非常虚弱，无法正常行走。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident left him with a crippling injury.
  </text>
  <text x="50" y="310" class="content">
    事故给他留下了严重的伤残。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with crutches -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <line x1="75" y1="180" x2="75" y2="220" class="image" />
    <circle cx="75" cy="150" r="20" class="image" />
    <line x1="75" y1="170" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="55" y2="230" class="image" />
    <line x1="75" y1="200" x2="95" y2="230" class="image" />
    <line x1="75" y1="190" x2="105" y2="180" class="image" />
  </g>
</svg>