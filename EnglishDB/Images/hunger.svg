<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hunger</text>
  <text x="50" y="120" class="subtitle">[ˈhʌŋɡər] n. 饥饿，渴望</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hunger (饥饿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个极度饥饿的人，"饥饿(hunger)"
    <tspan x="50" dy="25">让他眼睛发绿，盯着食物，仿佛要吞噬一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The long hike left us with a fierce hunger.
  </text>
  <text x="50" y="310" class="content">
    长时间的徒步旅行让我们感到非常饥饿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hungry person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="130" class="image" />
    <line x1="50" y1="150" x2="0" y2="130" class="image" />
    <!-- Food -->
    <rect x="150" y="80" width="100" height="50" class="image" />
    <line x1="160" y1="90" x2="240" y2="90" class="image" />
    <line x1="160" y1="110" x2="240" y2="110" class="image" />
    <line x1="160" y1="130" x2="240" y2="130" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="90" r="5" class="image" fill="#2980B9" />
    <circle cx="60" cy="90" r="5" class="image" fill="#2980B9" />
  </g>
</svg>