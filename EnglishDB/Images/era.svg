<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">era</text>
  <text x="50" y="120" class="subtitle">[ˈɪərə] n. 时代，纪元</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> er- (时间) + a (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"时间(er-)"
    <tspan x="50" dy="25">在不停地转动，每个刻度代表一个时代(era)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Renaissance was a remarkable era in history.
  </text>
  <text x="50" y="310" class="content">
    文艺复兴是历史上一个非凡的时代。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Clock hands -->
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <!-- Time marks -->
    <line x1="150" y1="50" x2="150" y2="60" class="image" />
    <line x1="200" y1="150" x2="190" y2="150" class="image" />
    <line x1="150" y1="250" x2="150" y2="240" class="image" />
    <line x1="100" y1="150" x2="110" y2="150" class="image" />
  </g>
</svg>