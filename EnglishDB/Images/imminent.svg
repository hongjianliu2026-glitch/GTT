<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imminent</text>
  <text x="50" y="120" class="subtitle">[ˈɪmɪnənt] adj. 即将发生的，迫近的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (向内) + min (突出) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的陨石"向内突出(im-min)"，
    <tspan x="50" dy="25">即将撞击地球，这种迫近的感觉就是imminent。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The imminent storm forced us to cancel the picnic.
  </text>
  <text x="50" y="310" class="content">
    即将到来的暴风雨迫使我们取消了野餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meteor -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="100" x2="400" y2="400" class="image" />
    <!-- Earth -->
    <circle cx="400" cy="400" r="100" class="image" />
    <!-- Explosion -->
    <circle cx="400" cy="400" r="20" class="image" />
    <circle cx="400" cy="400" r="30" class="image" />
    <circle cx="400" cy="400" r="40" class="image" />
  </g>
</svg>