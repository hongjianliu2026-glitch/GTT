<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cancellation</text>
  <text x="50" y="120" class="subtitle">[ˌkænsəˈleɪʃn] n. 取消，废除</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cancel (取消) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色叉叉"取消(cancel)"
    <tspan x="50" dy="25">掉了一个计划，这个动作就叫做取消(cancellation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cancellation of the event was due to bad weather.
  </text>
  <text x="50" y="310" class="content">
    活动的取消是由于恶劣天气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red cross -->
    <line x1="50" y1="50" x2="250" y2="250" class="image" />
    <line x1="50" y1="250" x2="250" y2="50" class="image" />
    <!-- Plan -->
    <rect x="100" y="100" width="100" height="50" class="image" />
    <text x="120" y="130" class="content">Plan</text>
  </g>
</svg>