<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clockwork</text>
  <text x="50" y="120" class="subtitle">[ˈklɒkwɜːrk] n. 发条装置，钟表机械</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clock (钟) + work (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟表，"钟(clock)"的内部
    <tspan x="50" dy="25">充满了精密的"工作(work)"装置，这些装置就是clockwork。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old clock's clockwork needed repair.
  </text>
  <text x="50" y="310" class="content">
    那台老钟的发条装置需要修理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="30" class="image" />
    <line x1="175" y1="100" x2="235" y2="100" class="image" />
    <!-- Clockwork gears -->
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="120" y1="150" x2="230" y2="150" class="image" />
    <line x1="100" y1="130" x2="250" y2="130" class="image" />
    <line x1="100" y1="170" x2="250" y2="170" class="image" />
  </g>
</svg>