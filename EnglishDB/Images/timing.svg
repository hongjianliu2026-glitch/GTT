<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">timing</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪmɪŋ] n. 时机，时间安排</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> time (时间) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在起跑线上，"精确计时(timing)"
    <tspan x="50" dy="25">以确保在最佳时刻起跑，这就是时机(timing)的重要性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The timing of the announcement was perfect.
  </text>
  <text x="50" y="310" class="content">
    公告的时机恰到好处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Start line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Runner -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Clock -->
    <circle cx="200" cy="50" r="30" class="image" />
    <line x1="200" y1="50" x2="200" y2="20" class="image" />
    <line x1="200" y1="50" x2="220" y2="40" class="image" />
  </g>
</svg>