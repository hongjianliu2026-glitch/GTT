<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enthusiastic</text>
  <text x="50" y="120" class="subtitle">[ɪnˌθjuːziˈæstɪk] adj. 热情的，热心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + thus (神) + -iast (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"神(thus)"的力量"充满(en)"，
    <tspan x="50" dy="25">变得无比热情，就像一个"狂热者(enthusiast)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very enthusiastic about her new job.
  </text>
  <text x="50" y="310" class="content">
    她对她的新工作非常热情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a heart -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Heart -->
    <path d="M100,100 C100,50 150,50 150,100 S200,150 150,200" class="image" />
    <path d="M100,100 C100,150 50,150 50,100 S0,50 50,0" class="image" />
    <!-- Rays of light -->
    <line x1="125" y1="50" x2="125" y2="0" class="image" />
    <line x1="150" y1="75" x2="200" y2="25" class="image" />
    <line x1="175" y1="100" x2="225" y2="50" class="image" />
    <line x1="200" y1="125" x2="250" y2="75" class="image" />
    <line x1="225" y1="150" x2="275" y2="100" class="image" />
  </g>
</svg>