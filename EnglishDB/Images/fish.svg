<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fish</text>
  <text x="50" y="120" class="subtitle">[fɪʃ] n. 鱼；v. 捕鱼，钓鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *fiskaz，意为“鱼”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个渔夫在湖边，"捕捞(fish)"
    <tspan x="50" dy="25">一条大鱼，这条鱼在水中游动，闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He went fishing in the early morning.
  </text>
  <text x="50" y="310" class="content">
    他一大早就去钓鱼了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#A9CCE3" />
    <!-- Fish -->
    <path d="M50,100 C50,50 150,50 150,100 C150,150 50,150 50,100 Z" class="image" fill="#1ABC9C" />
    <line x1="50" y1="100" x2="30" y2="80" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <!-- Fisherman -->
    <circle cx="200" cy="150" r="15" class="image" fill="#F1C40F" />
    <line x1="200" y1="165" x2="200" y2="190" class="image" />
    <line x1="200" y1="190" x2="180" y2="220" class="image" />
    <line x1="200" y1="190" x2="220" y2="220" class="image" />
    <line x1="200" y1="175" x2="230" y2="165" class="image" />
    <!-- Fishing rod -->
    <line x1="200" y1="165" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="240" y2="90" class="image" />
    <line x1="250" y1="100" x2="260" y2="90" class="image" />
  </g>
</svg>