<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">separatist</text>
  <text x="50" y="120" class="subtitle">[ˈsepərətɪst] n. 分离主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + par (准备) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"分离主义者(separatist)"，他站在两个分裂的区域之间，
    <tspan x="50" dy="25">手持旗帜，准备(par)将两个区域彻底分开(se-)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The separatist movement gained momentum in the region.
  </text>
  <text x="50" y="310" class="content">
    该地区的分离主义运动势头强劲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two separated areas -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="200" y="0" width="150" height="200" class="image" />
    <!-- Separatist with flag -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Flag -->
    <line x1="175" y1="115" x2="175" y2="20" class="image" />
    <rect x="160" y="20" width="30" height="80" class="image" />
  </g>
</svg>