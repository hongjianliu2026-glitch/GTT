<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">creature</text>
  <text x="50" y="120" class="subtitle">[ˈkriːtʃər] n. 生物，动物，人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> creat (创造) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的造物主，手中拿着一个"创造(creat)"的工具，
    <tspan x="50" dy="25">正在塑造一个"生物(creature)"，这个生物可以是任何形态，</tspan>
    <tspan x="50" dy="25">从简单的昆虫到复杂的动物，甚至是人类。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forest is home to many creatures, both big and small.
  </text>
  <text x="50" y="310" class="content">
    森林是许多生物的家园，无论大小。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Creator -->
    <circle cx="20" cy="100" r="20" class="image" />
    <line x1="20" y1="120" x2="20" y2="180" class="image" />
    <line x1="20" y1="180" x2="0" y2="220" class="image" />
    <line x1="20" y1="180" x2="40" y2="220" class="image" />
    <line x1="20" y1="150" x2="50" y2="140" class="image" />
    <!-- Creature -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Tool -->
    <line x1="20" y1="100" x2="150" y2="100" class="image" />
    <line x1="85" y1="100" x2="85" y2="50" class="image" />
    <line x1="85" y1="50" x2="70" y2="70" class="image" />
    <line x1="85" y1="50" x2="100" y2="70" class="image" />
  </g>
</svg>