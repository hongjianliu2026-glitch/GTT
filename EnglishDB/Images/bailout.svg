<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bailout</text>
  <text x="50" y="120" class="subtitle">[ˈbeɪlaʊt] n. 紧急援助，紧急救助</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bail (保释) + out (出去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被困在水中，"保释(bail)"他"出去(out)"，
    <tspan x="50" dy="25">紧急救助(bailout)让他脱离危险。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government provided a bailout for the failing bank.
  </text>
  <text x="50" y="310" class="content">
    政府为濒临倒闭的银行提供了紧急援助。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Person in water -->
    <circle cx="100" cy="100" r="20" class="image" fill="#E74C3C" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Rope -->
    <line x1="200" y1="20" x2="100" y2="100" class="image" stroke-width="4" stroke="#F1C40F" />
    <!-- Rope handle -->
    <circle cx="200" cy="20" r="10" class="image" fill="#F1C40F" />
  </g>
</svg>