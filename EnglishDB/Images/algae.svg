<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .algae { fill: #1ABC9C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">algae</text>
  <text x="50" y="120" class="subtitle">[ˈældʒi] n. 藻类</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alg (海藻) + -e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片绿色的海藻(alg)在海中漂浮，
    <tspan x="50" dy="25">它们就像一群小精灵(e)在水中嬉戏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pond was covered with algae after the hot summer.
  </text>
  <text x="50" y="310" class="content">
    炎热的夏天过后，池塘上覆盖着藻类。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Algae -->
    <circle cx="50" cy="100" r="20" class="algae" />
    <circle cx="100" cy="120" r="25" class="algae" />
    <circle cx="150" cy="140" r="30" class="algae" />
    <circle cx="200" cy="160" r="25" class="algae" />
    <circle cx="250" cy="180" r="20" class="algae" />
    <circle cx="300" cy="150" r="30" class="algae" />
  </g>
</svg>