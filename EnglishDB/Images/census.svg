<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">census</text>
  <text x="50" y="120" class="subtitle">[ˈsɛnsəs] n. 人口普查</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cense (计算) + -us (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的计数器，上面显示着"计算(cense)"
    <tspan x="50" dy="25">全国人口的数量，这就是人口普查(census)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government conducts a census every ten years.
  </text>
  <text x="50" y="310" class="content">
    政府每十年进行一次人口普查。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Display numbers -->
    <text x="50" y="50" class="content" fill="#34495E">1,234,567</text>
    <text x="50" y="80" class="content" fill="#34495E">8,901,234</text>
    <text x="50" y="110" class="content" fill="#34495E">5,678,901</text>
    <!-- Person icon -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
  </g>
</svg>