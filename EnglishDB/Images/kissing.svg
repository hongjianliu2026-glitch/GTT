<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kissing</text>
  <text x="50" y="120" class="subtitle">[ˈkɪsɪŋ] n. 接吻，亲吻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kiss (亲吻) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在月光下，轻轻地"亲吻(kiss)"，
    <tspan x="50" dy="25">他们的影子在月光下交织，形成了一个浪漫的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They shared a passionate kissing under the moonlight.
  </text>
  <text x="50" y="310" class="content">
    他们在月光下分享了一个热情的亲吻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="175" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Shadows -->
    <line x1="120" y1="150" x2="175" y2="200" class="image" />
    <line x1="230" y1="150" x2="175" y2="200" class="image" />
    <!-- Lips -->
    <path d="M150,180 Q175,160 200,180" class="image" fill="#FF69B4" />
    <path d="M150,180 Q175,200 200,180" class="image" fill="#FF69B4" />
  </g>
</svg>