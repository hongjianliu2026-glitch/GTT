<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .balloon { fill: #F1C40F; stroke: #D35400; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inflatable</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfleɪtəbl] adj. 可充气的，可膨胀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flate (吹) + -able (可...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"吹入(in-flate)"
    <tspan x="50" dy="25">空气后，它就变得可膨胀(inflatable)，</tspan>
    <tspan x="50" dy="25">可以用来玩耍或装饰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children played with an inflatable pool in the backyard.
  </text>
  <text x="50" y="310" class="content">
    孩子们在后院玩充气泳池。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <ellipse cx="100" cy="100" rx="80" ry="120" class="balloon" />
    <!-- Air pump -->
    <rect x="200" y="50" width="50" height="150" class="image" />
    <line x1="225" y1="50" x2="225" y2="200" class="image" />
    <line x1="225" y1="200" x2="180" y2="150" class="image" />
    <line x1="225" y1="200" x2="270" y2="150" class="image" />
  </g>
</svg>