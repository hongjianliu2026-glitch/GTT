<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">redhead</text>
  <text x="50" y="120" class="subtitle">[ˈrɛdˌhɛd] n. 红头发的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> red (红色) + head (头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个红头发的人，他的头发像火焰一样红，
    <tspan x="50" dy="25">走在街上就像一团移动的火焰，非常引人注目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a natural redhead with fiery locks.
  </text>
  <text x="50" y="310" class="content">
    她天生就是个红头发，头发像火焰一样。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF4500" />
    <!-- Hair -->
    <rect x="50" y="50" width="100" height="50" class="image" fill="#FF4500" />
    <!-- Face -->
    <circle cx="100" cy="100" r="30" class="image" fill="#FDFEFE" />
    <!-- Eyes -->
    <circle cx="85" cy="90" r="5" class="image" fill="#000000" />
    <circle cx="115" cy="90" r="5" class="image" fill="#000000" />
    <!-- Mouth -->
    <line x1="85" y1="115" x2="115" y2="115" class="image" />
  </g>
</svg>