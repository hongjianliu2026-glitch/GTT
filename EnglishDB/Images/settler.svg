<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">settler</text>
  <text x="50" y="120" class="subtitle">[ˈsɛtlər] n. 定居者，移民</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> set (放置) + -tle (小) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的"放置者(set-tle-r)"，
    <tspan x="50" dy="25">他带着家当，来到一片荒野，</tspan>
    <tspan x="50" dy="25">开始建立自己的家园，成为这片土地的定居者。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The settlers built a small village in the wilderness.
  </text>
  <text x="50" y="310" class="content">
    定居者在荒野中建立了一个小村庄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tent -->
    <polygon points="0,100 50,0 100,100" class="image" />
    <!-- Settler -->
    <circle cx="50" cy="120" r="15" class="image" />
    <line x1="50" y1="135" x2="50" y2="170" class="image" />
    <line x1="50" y1="170" x2="30" y2="200" class="image" />
    <line x1="50" y1="170" x2="70" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Landscape -->
    <line x1="0" y1="220" x2="100" y2="220" class="image" />
    <line x1="0" y1="220" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="40" y2="220" class="image" />
    <line x1="40" y1="220" x2="60" y2="200" class="image" />
    <line x1="60" y1="200" x2="80" y2="220" class="image" />
    <line x1="80" y1="220" x2="100" y2="200" class="image" />
  </g>
</svg>