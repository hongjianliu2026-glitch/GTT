<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paddy</text>
  <text x="50" y="120" class="subtitle">[ˈpædi] n. 稻田，稻谷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pad (平地) + -y (表示地点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的"平地(pad)"上，
    <tspan x="50" dy="25">水波荡漾，稻谷(paddy)在阳光下闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmers work in the paddy fields every day.
  </text>
  <text x="50" y="310" class="content">
    农民们每天都在稻田里劳作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paddy field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Rice plants -->
    <line x1="70" y1="50" x2="70" y2="150" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="130" y1="50" x2="130" y2="150" class="image" />
    <line x1="160" y1="50" x2="160" y2="150" class="image" />
    <line x1="190" y1="50" x2="190" y2="150" class="image" />
    <line x1="220" y1="50" x2="220" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="20" class="image" />
  </g>
</svg>