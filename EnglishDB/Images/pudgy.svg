<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pudgy</text>
  <text x="50" y="120" class="subtitle">[ˈpʌdʒi] adj. 矮胖的，圆胖的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pud (胖) + -gy (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只圆滚滚的小猪，"胖胖的(pudgy)"
    <tspan x="50" dy="25">身体让它看起来非常可爱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pudgy baby was the center of attention at the party.
  </text>
  <text x="50" y="310" class="content">
    那个胖乎乎的宝宝是派对上的焦点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pudgy pig -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Eyes -->
    <circle cx="80" cy="80" r="5" class="image" fill="#000" />
    <circle cx="120" cy="80" r="5" class="image" fill="#000" />
    <!-- Nose -->
    <circle cx="100" cy="110" r="10" class="image" fill="#F39C12" />
    <!-- Ears -->
    <ellipse cx="60" cy="60" rx="20" ry="10" class="image" fill="#F1C40F" />
    <ellipse cx="140" cy="60" rx="20" ry="10" class="image" fill="#F1C40F" />
    <!-- Legs -->
    <rect x="70" y="150" width="20" height="30" class="image" fill="#F1C40F" />
    <rect x="110" y="150" width="20" height="30" class="image" fill="#F1C40F" />
  </g>
</svg>