<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .snow { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wintry</text>
  <text x="50" y="120" class="subtitle">[ˈwɪntri] adj. 冬天的，寒冷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> winter (冬天) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的冬天，雪花纷飞，寒风刺骨，
    <tspan x="50" dy="25">整个世界都被冬天的气息所笼罩，这就是wintry的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wintry landscape was covered in snow.
  </text>
  <text x="50" y="310" class="content">
    寒冷的景色被雪覆盖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowflakes -->
    <circle cx="50" cy="50" r="10" class="snow" />
    <circle cx="100" cy="70" r="10" class="snow" />
    <circle cx="150" cy="50" r="10" class="snow" />
    <circle cx="200" cy="70" r="10" class="snow" />
    <circle cx="250" cy="50" r="10" class="snow" />
    <circle cx="300" cy="70" r="10" class="snow" />
    <!-- Cold wind -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <!-- Tree -->
    <line x1="175" y1="150" x2="175" y2="250" class="image" />
    <line x1="150" y1="200" x2="200" y2="200" class="image" />
    <line x1="160" y1="180" x2="190" y2="180" class="image" />
    <line x1="160" y1="220" x2="190" y2="220" class="image" />
  </g>
</svg>