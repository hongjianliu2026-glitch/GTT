<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gothic</text>
  <text x="50" y="120" class="subtitle">[ˈɡɒθɪk] adj. 哥特式的，中世纪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Goth (哥特人) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群哥特人(Goth)在中世纪建造了一座高耸入云的教堂，
    <tspan x="50" dy="25">这座教堂的尖塔和复杂的装饰风格就是哥特式(gothic)建筑的代表。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cathedral has a gothic architecture with pointed arches.
  </text>
  <text x="50" y="310" class="content">
    这座大教堂具有哥特式建筑风格，带有尖拱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gothic cathedral -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,20 200,20 250,100 100,100" class="image" />
    <line x1="125" y1="20" x2="125" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="50" y2="200" class="image" />
    <line x1="250" y1="100" x2="300" y2="200" class="image" />
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <!-- Pointed arches -->
    <path d="M70,120 Q100,80 130,120" class="image" />
    <path d="M150,120 Q180,80 210,120" class="image" />
    <path d="M230,120 Q260,80 290,120" class="image" />
  </g>
</svg>