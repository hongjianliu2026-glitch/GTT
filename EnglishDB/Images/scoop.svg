<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scoop</text>
  <text x="50" y="120" class="subtitle">[skuːp] n. 勺子，一勺；v. 舀取</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scop (看) + -o (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的勺子，"看(scop)"着它舀起一大堆冰淇淋，
    <tspan x="50" dy="25">这个动作就是"舀取(scoop)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a scoop to serve ice cream at the party.
  </text>
  <text x="50" y="310" class="content">
    她在派对上用勺子给大家盛冰淇淋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scoop -->
    <path d="M 0 100 Q 50 50 100 100 L 100 150 Q 50 200 0 150 Z" class="image" fill="#F39C12" />
    <!-- Ice cream -->
    <circle cx="50" cy="125" r="20" class="image" fill="#C0392B" />
    <circle cx="70" cy="110" r="15" class="image" fill="#E74C3C" />
    <circle cx="30" cy="115" r="18" class="image" fill="#D35400" />
  </g>
</svg>