<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ecumenical</text>
  <text x="50" y="120" class="subtitle">[ˌɛkjʊˈmɛnɪkl] adj. 世界范围的，普世的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oikos (家) + men (人) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球，上面有来自世界各地的"家(oikos)"
    <tspan x="50" dy="25">和"人(men)"，他们和谐共处，这就是普世(ecumenical)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ecumenical movement seeks to unite all Christian churches.
  </text>
  <text x="50" y="310" class="content">
    普世运动旨在联合所有基督教会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Houses -->
    <rect x="100" y="150" width="30" height="30" class="image" />
    <rect x="250" y="150" width="30" height="30" class="image" />
    <rect x="175" y="150" width="30" height="30" class="image" />
    <!-- People -->
    <circle cx="120" cy="180" r="10" class="image" />
    <circle cx="270" cy="180" r="10" class="image" />
    <circle cx="195" cy="180" r="10" class="image" />
  </g>
</svg>