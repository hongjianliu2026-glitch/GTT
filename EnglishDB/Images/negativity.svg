<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">negativity</text>
  <text x="50" y="120" class="subtitle">[ˌnɛɡəˈtɪvɪti] n. 消极，否定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neg- (否定) + -ative (形容词后缀) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满"否定(neg-)"情绪的人，
    <tspan x="50" dy="25">他总是看到事物的消极面，这种态度就是negativity。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her negativity towards the project was affecting the team's morale.
  </text>
  <text x="50" y="310" class="content">
    她对这个项目的消极态度影响了团队的士气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud with negative sign -->
    <circle cx="100" cy="100" r="50" class="image" />
    <text x="85" y="110" class="image" style="font: bold 48px sans-serif; fill: #B03A2E;">-</text>
    <!-- Person with frown -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="185" y1="110" x2="215" y2="110" class="image" />
    <line x1="190" y1="120" x2="210" y2="120" class="image" />
    <line x1="195" y1="130" x2="205" y2="130" class="image" />
  </g>
</svg>