<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fully</text>
  <text x="50" y="120" class="subtitle">[ˈfʊli] adv. 完全地，彻底地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> full (满的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个杯子被"完全填满(full-ly)"，一滴水都不剩，
    <tspan x="50" dy="25">这就是fully的意思，表示彻底和完全。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was fully satisfied with the results.
  </text>
  <text x="50" y="310" class="content">
    她对结果完全满意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <!-- Water -->
    <rect x="10" y="10" width="80" height="130" class="image" fill="#1ABC9C" />
    <!-- Overflowing water -->
    <rect x="10" y="10" width="80" height="10" class="image" fill="#1ABC9C" />
    <rect x="10" y="10" width="10" height="10" class="image" fill="#1ABC9C" />
    <rect x="80" y="10" width="10" height="10" class="image" fill="#1ABC9C" />
  </g>
</svg>