<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .transparent { fill: rgba(255, 255, 255, 0.5); }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transparent</text>
  <text x="50" y="120" class="subtitle">[trænsˈpærənt] adj. 透明的，明显的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (穿过) + parent (出现)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个玻璃杯，"穿过(trans-)"它可以看到另一边，
    <tspan x="50" dy="25">就像事物"出现(parent)"在你的眼前，这就是透明的(transparent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The water in the glass was so transparent that you could see the fish swimming inside.
  </text>
  <text x="50" y="310" class="content">
    玻璃杯里的水如此透明，以至于你可以看到里面的鱼在游动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="transparent" />
    <!-- Fish -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="180" class="image" />
    <line x1="150" y1="160" x2="170" y2="180" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
  </g>
</svg>