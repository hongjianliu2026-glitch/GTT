<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cross-examination</text>
  <text x="50" y="120" class="subtitle">[ˌkrɔːs ɪɡˌzæmɪˈneɪʃən] n. 盘问，交叉询问</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cross (交叉) + examination (检查)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个律师在法庭上，"交叉检查(cross-examination)"
    <tspan x="50" dy="25">证人，用尖锐的问题揭露真相。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lawyer's cross-examination was so intense that the witness broke down.
  </text>
  <text x="50" y="310" class="content">
    律师的盘问非常激烈，以至于证人崩溃了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lawyer -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="90" y2="120" class="image" />
    <!-- Witness -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="290" y2="120" class="image" />
    <!-- Cross lines -->
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
  </g>
</svg>