<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">differentiation</text>
  <text x="50" y="120" class="subtitle">[ˌdɪfəˌrenʃiˈeɪʃn] n. 区分，差异化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> differ (不同) + -ent (形容词后缀) + -iation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在舞台上，"区分(differ)"
    <tspan x="50" dy="25">两个看似相同的物体，通过魔术(ent-iation)，</tspan>
    <tspan x="50" dy="25">让观众看到它们的不同之处。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The differentiation of the two products is crucial for market success.
  </text>
  <text x="50" y="310" class="content">
    这两个产品的差异化对于市场成功至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Magician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Two objects -->
    <rect x="150" y="50" width="50" height="50" class="image" />
    <rect x="250" y="50" width="50" height="50" class="image" />
    <!-- Magic wand -->
    <line x1="50" y1="100" x2="200" y2="50" class="image" />
    <!-- Differentiation effect -->
    <circle cx="175" cy="75" r="10" class="image" />
    <circle cx="275" cy="75" r="10" class="image" />
  </g>
</svg>