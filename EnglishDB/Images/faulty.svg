<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">faulty</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːlti] adj. 有错误的，有缺点的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fault (错误) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机器人在执行任务时，突然"犯错(fault)"，
    <tspan x="50" dy="25">结果它的动作变得"有缺陷(faulty)"，无法正常工作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The machine broke down because of a faulty part.
  </text>
  <text x="50" y="310" class="content">
    机器因为一个有缺陷的零件而坏了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Faulty part -->
    <rect x="120" y="80" width="50" height="50" class="image" />
    <line x1="120" y1="80" x2="170" y2="130" class="image" />
    <line x1="170" y1="80" x2="120" y2="130" class="image" />
    <!-- Broken robot -->
    <line x1="50" y1="180" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="20" y2="300" class="image" />
    <line x1="50" y1="250" x2="80" y2="300" class="image" />
  </g>
</svg>