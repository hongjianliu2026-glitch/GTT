<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seriousness</text>
  <text x="50" y="120" class="subtitle">[ˈsɪəriəsnəs] n. 严肃，认真</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seri (连接) + ous (形容词后缀) + ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个严肃的会议室，"连接(seri)"着每个人的思想，
    <tspan x="50" dy="25">每个人都表现出"认真(ous)"的态度，这种氛围就是"严肃(seriousness)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The seriousness of the situation made everyone quiet.
  </text>
  <text x="50" y="310" class="content">
    情况的严肃性让每个人都安静了下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People -->
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="220" cy="100" r="15" class="image" />
    <!-- Serious expressions -->
    <line x1="70" y1="115" x2="90" y2="115" class="image" />
    <line x1="140" y1="115" x2="160" y2="115" class="image" />
    <line x1="210" y1="115" x2="230" y2="115" class="image" />
    <!-- Thought bubbles -->
    <circle cx="80" cy="70" r="20" class="image" />
    <circle cx="150" cy="70" r="20" class="image" />
    <circle cx="220" cy="70" r="20" class="image" />
  </g>
</svg>