<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">big-time</text>
  <text x="50" y="120" class="subtitle">[ˈbɪɡ taɪm] adv. 非常，十分；adj. 重要的，大型的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> big (大的) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"大时间(big-time)"
    <tspan x="50" dy="25">象征着重要和关键的时刻，让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made it big-time in the music industry.
  </text>
  <text x="50" y="310" class="content">
    他在音乐行业取得了巨大的成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Big clock -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Hour marks -->
    <line x1="175" y1="25" x2="175" y2="35" class="image" />
    <line x1="245" y1="100" x2="235" y2="100" class="image" />
    <line x1="175" y1="175" x2="175" y2="165" class="image" />
    <line x1="105" y1="100" x2="115" y2="100" class="image" />
  </g>
</svg>