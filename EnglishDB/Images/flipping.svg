<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flipping</text>
  <text x="50" y="120" class="subtitle">[ˈflɪpɪŋ] v. 翻转，快速翻动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flip (翻转) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个硬币在空中"翻转(flip)"，
    <tspan x="50" dy="25">它在空中快速旋转，就像在表演一场精彩的杂技。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He flipped the coin to decide who goes first.
  </text>
  <text x="50" y="310" class="content">
    他抛硬币决定谁先走。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coin -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="28" fill="#C0C0C0" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="130" class="image" />
    <!-- Hand flipping the coin -->
    <line x1="50" y1="100" x2="70" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="120" class="image" />
    <line x1="30" y1="120" x2="30" y2="140" class="image" />
  </g>
</svg>