<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">firepower</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪərˌpaʊər] n. 火力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fire (火) + power (力量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一支军队，"火力(fire)"
    <tspan x="50" dy="25">强大到足以"摧毁(power)"一切障碍。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tank's firepower was overwhelming.
  </text>
  <text x="50" y="310" class="content">
    坦克的火力非常强大。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tank -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cannon -->
    <line x1="175" y1="20" x2="175" y2="100" class="image" />
    <!-- Fire -->
    <circle cx="175" cy="110" r="20" fill="#FF4500" />
    <circle cx="175" cy="130" r="15" fill="#FF6347" />
    <circle cx="175" cy="150" r="10" fill="#FF7F50" />
  </g>
</svg>