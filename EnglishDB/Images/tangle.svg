<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tangle</text>
  <text x="50" y="120" class="subtitle">[ˈtæŋɡl] v. 缠结，纠缠；n. 缠结，混乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tang (接触) + -le (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根线不断地"接触(tang)"另一根线，
    <tspan x="50" dy="25">反复地缠绕在一起，最终形成了一个混乱的缠结(tangle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wires behind the TV were all tangled up.
  </text>
  <text x="50" y="310" class="content">
    电视后面的电线全都缠在一起了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tangled wires -->
    <path d="M50,50 C100,0 150,100 200,50 C250,0 300,100 350,50" class="image" />
    <path d="M50,100 C100,50 150,150 200,100 C250,50 300,150 350,100" class="image" />
    <path d="M50,150 C100,100 150,200 200,150 C250,100 300,200 350,150" class="image" />
    <!-- Knot -->
    <circle cx="200" cy="100" r="20" class="image" />
  </g>
</svg>