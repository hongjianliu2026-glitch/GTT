<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ridge</text>
  <text x="50" y="120" class="subtitle">[rɪdʒ] n. 山脊，屋脊；v. 使成脊状</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ridg (脊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座山，山脊(ridge)像一条巨龙蜿蜒在山峰之间，
    <tspan x="50" dy="25">仿佛在守护着整座山脉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hiker followed the ridge to reach the summit.
  </text>
  <text x="50" y="310" class="content">
    徒步者沿着山脊走向山顶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <path d="M 0 200 L 100 50 L 200 200 Z" class="image" />
    <!-- Ridge -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Clouds -->
    <circle cx="30" cy="70" r="20" class="image" />
    <circle cx="80" cy="60" r="25" class="image" />
    <circle cx="130" cy="70" r="20" class="image" />
  </g>
</svg>