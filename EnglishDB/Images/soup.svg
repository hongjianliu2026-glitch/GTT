<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soup</text>
  <text x="50" y="120" class="subtitle">[suːp] n. 汤，羹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sou- (来自古法语 soupe, 意为“汤”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的冬天，你坐在火炉旁，面前是一碗热腾腾的汤(soup)，
    <tspan x="50" dy="25">温暖从胃里蔓延到全身，驱散了所有的寒冷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a delicious chicken soup for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐做了一碗美味的鸡汤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Soup -->
    <ellipse cx="175" cy="100" rx="140" ry="60" fill="#FFD700" />
    <!-- Steam -->
    <path d="M175,30 Q175,10 195,30 T235,30" stroke="#8B4513" stroke-width="3" fill="none" />
    <path d="M175,30 Q175,10 155,30 T115,30" stroke="#8B4513" stroke-width="3" fill="none" />
    <path d="M175,30 Q175,10 135,30 T95,30" stroke="#8B4513" stroke-width="3" fill="none" />
  </g>
</svg>