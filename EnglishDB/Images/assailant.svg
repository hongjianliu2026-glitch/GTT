<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">assailant</text>
  <text x="50" y="120" class="subtitle">[əˈseɪlənt] n. 攻击者，袭击者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> as- (朝向) + sail (跳跃) + -ant (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个攻击者"朝向(as-)"你"跳跃(sail)"过来，
    <tspan x="50" dy="25">他就是那个"袭击者(assailant)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The assailant was quickly apprehended by the police.
  </text>
  <text x="50" y="310" class="content">
    袭击者很快被警察逮捕了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Attacker -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="140" class="image" /> <!-- Right arm -->
    <!-- Target -->
    <rect x="100" y="80" width="50" height="50" class="image" />
    <!-- Arrow -->
    <line x1="70" y1="100" x2="100" y2="105" class="image" />
    <polygon points="100,105 95,95 105,95" class="image" />
  </g>
</svg>