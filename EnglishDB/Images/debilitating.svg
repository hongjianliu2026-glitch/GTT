<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">debilitating</text>
  <text x="50" y="120" class="subtitle">[dɪˈbɪlɪteɪtɪŋ] adj. 使人衰弱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + bili (力量) + -ate (动词后缀) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人原本充满力量(bili)，但突然被"向下拉(de-)"，
    <tspan x="50" dy="25">力量逐渐消失，变得非常虚弱(debilitating)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The disease had a debilitating effect on his health.
  </text>
  <text x="50" y="310" class="content">
    这种疾病对他的健康产生了使人衰弱的影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with strength -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Arrow pulling down -->
    <line x1="50" y1="250" x2="50" y2="300" class="image" />
    <polygon points="45,300 55,300 50,310" class="image" />
    <!-- Weakened person -->
    <circle cx="50" cy="350" r="20" class="image" />
    <line x1="50" y1="370" x2="50" y2="420" class="image" />
    <line x1="50" y1="390" x2="20" y2="380" class="image" />
    <line x1="50" y1="390" x2="80" y2="380" class="image" />
    <line x1="50" y1="420" x2="20" y2="450" class="image" />
    <line x1="50" y1="420" x2="80" y2="450" class="image" />
  </g>
</svg>