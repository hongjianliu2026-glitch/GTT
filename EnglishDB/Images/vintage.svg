<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7D3C98; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vintage</text>
  <text x="50" y="120" class="subtitle">[ˈvɪntɪdʒ] n. 葡萄酒；老式的东西；adj. 古老的，老式的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vin (葡萄酒) + tage (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的酒窖，里面摆满了"葡萄酒(vin)"，
    <tspan x="50" dy="25">每瓶酒都代表着一段历史，这就是"老式的东西(vintage)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This vintage car is a classic piece of history.
  </text>
  <text x="50" y="310" class="content">
    这辆老式汽车是历史的经典之作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wine barrel -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Wine bottles -->
    <rect x="70" y="50" width="30" height="100" class="image" />
    <rect x="120" y="50" width="30" height="100" class="image" />
    <rect x="170" y="50" width="30" height="100" class="image" />
    <rect x="220" y="50" width="30" height="100" class="image" />
    <!-- Wine labels -->
    <text x="75" y="160" class="content">1920</text>
    <text x="125" y="160" class="content">1950</text>
    <text x="175" y="160" class="content">1980</text>
    <text x="225" y="160" class="content">2000</text>
  </g>
</svg>