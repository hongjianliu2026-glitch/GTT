<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">painted</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪntɪd] adj. 涂上油漆的，着色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> paint (绘画) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在墙上"绘画(paint)"，
    <tspan x="50" dy="25">完成后，墙变成了"涂上油漆的(painted)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The walls of the room were painted in bright colors.
  </text>
  <text x="50" y="310" class="content">
    房间的墙壁被涂上了鲜艳的颜色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Paint strokes -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" stroke="#FF5733" stroke-width="10" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" stroke="#33FF57" stroke-width="10" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" stroke="#3357FF" stroke-width="10" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" stroke="#FF33A6" stroke-width="10" />
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Paintbrush -->
    <line x1="20" y1="130" x2="70" y2="100" class="image" stroke="#000" stroke-width="5" />
  </g>
</svg>