<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aging</text>
  <text x="50" y="120" class="subtitle">[ˈeɪdʒɪŋ] n. 老化，变老；v. 使老化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> age (年龄) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老人坐在摇椅上，"随着时间的流逝(age-ing)"，
    <tspan x="50" dy="25">他的脸上布满了岁月的痕迹，这就是老化的过程(aging)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wine improves with aging.
  </text>
  <text x="50" y="310" class="content">
    这酒随着时间的推移而变得更加醇厚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old man -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="110" x2="80" y2="100" class="image" />
    <line x1="50" y1="110" x2="20" y2="100" class="image" />
    <!-- Chair -->
    <rect x="30" y="180" width="40" height="20" class="image" />
    <line x1="50" y1="200" x2="50" y2="220" class="image" />
    <line x1="30" y1="220" x2="70" y2="220" class="image" />
    <line x1="30" y1="220" x2="30" y2="240" class="image" />
    <line x1="70" y1="220" x2="70" y2="240" class="image" />
  </g>
</svg>