<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .blood { fill: #8B0000; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bloodshed</text>
  <text x="50" y="120" class="subtitle">[ˈblʌdˌʃɛd] n. 流血，杀戮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blood (血) + shed (流出)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战场，"血(blood)"从战士的伤口中"流出(shed)"，
    <tspan x="50" dy="25">形成了一片血泊，这就是流血(bloodshed)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The war resulted in massive bloodshed.
  </text>
  <text x="50" y="310" class="content">
    战争导致了大规模的流血。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bloodstain -->
    <circle cx="100" cy="100" r="50" class="blood" />
    <circle cx="150" cy="120" r="30" class="blood" />
    <circle cx="200" cy="80" r="40" class="blood" />
    <!-- Soldier -->
    <circle cx="150" cy="180" r="20" class="image" />
    <line x1="150" y1="200" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="130" y2="280" class="image" />
    <line x1="150" y1="250" x2="170" y2="280" class="image" />
    <line x1="150" y1="220" x2="120" y2="210" class="image" />
    <line x1="150" y1="220" x2="180" y2="210" class="image" />
  </g>
</svg>