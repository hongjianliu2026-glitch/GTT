<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skewer</text>
  <text x="50" y="120" class="subtitle">[ˈskjuːər] n. 烤肉叉，串肉扦；v. 用串肉扦串起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skewer (源自中古英语 skeure，意为“尖锐的木棍”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的烤肉叉，"串起(skewer)"
    <tspan x="50" dy="25">一整只巨大的烤肉，场面夸张且令人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She skewered the meat onto the stick for grilling.
  </text>
  <text x="50" y="310" class="content">
    她把肉串在棍子上准备烧烤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skewer -->
    <line x1="50" y1="20" x2="50" y2="200" class="image" />
    <!-- Meat pieces -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="50" cy="150" r="15" class="image" />
    <!-- Flame -->
    <polygon points="20,200 80,200 50,250" class="image" />
  </g>
</svg>