<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .oat { fill: #D7BDE2; }
      .bowl { fill: #FADBD8; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oatmeal</text>
  <text x="50" y="120" class="subtitle">[ˈoʊtmil] n. 燕麦片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oat (燕麦) + meal (食物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温暖的早晨，一碗热腾腾的燕麦片(oatmeal)
    <tspan x="50" dy="25">放在桌上，燕麦(oat)和食物(meal)的结合，</tspan>
    <tspan x="50" dy="25">带来了一天的能量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enjoys a bowl of oatmeal for breakfast every day.
  </text>
  <text x="50" y="310" class="content">
    她每天早餐都喜欢吃一碗燕麦片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="bowl" />
    <!-- Oats -->
    <rect x="80" y="50" width="190" height="50" class="oat" />
    <!-- Steam -->
    <line x1="120" y1="40" x2="100" y2="20" class="image" />
    <line x1="150" y1="40" x2="130" y2="20" class="image" />
    <line x1="180" y1="40" x2="160" y2="20" class="image" />
  </g>
</svg>