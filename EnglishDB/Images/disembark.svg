<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disembark</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsɪmˈbɑːrk] v. 下船，登岸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (离开) + embark (上船)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群乘客从一艘大船上"离开(dis-)"，
    <tspan x="50" dy="25">"登上(embark)"岸边，这就是下船(disembark)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a long voyage, they finally disembarked at the port.
  </text>
  <text x="50" y="310" class="content">
    经过漫长的航行，他们终于在港口下船了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boat -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />
    <!-- Shore -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- People walking to shore -->
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="80" y1="50" x2="80" y2="100" class="image" />
    <line x1="110" y1="50" x2="110" y2="100" class="image" />
  </g>
</svg>