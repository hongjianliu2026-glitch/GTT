<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">demonstration</text>
  <text x="50" y="120" class="subtitle">[ˌdemənˈstreɪʃn] n. 示范，示威</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + monstr (展示) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在街头，"强调展示(de-monstr-ation)"
    <tspan x="50" dy="25">他们的诉求，这就是一场示威(demonstration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The students held a demonstration to protest against the new policy.
  </text>
  <text x="50" y="310" class="content">
    学生们举行了一场示威活动，抗议新政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Signs -->
    <rect x="50" y="70" width="30" height="30" class="image" />
    <rect x="100" y="70" width="30" height="30" class="image" />
    <rect x="150" y="70" width="30" height="30" class="image" />
    <rect x="200" y="70" width="30" height="30" class="image" />
    <rect x="250" y="70" width="30" height="30" class="image" />
    <!-- Text on signs -->
    <text x="55" y="90" class="content" fill="#E74C3C">NO</text>
    <text x="105" y="90" class="content" fill="#E74C3C">NEW</text>
    <text x="155" y="90" class="content" fill="#E74C3C">POLICY</text>
    <text x="205" y="90" class="content" fill="#E74C3C">STOP</text>
    <text x="255" y="90" class="content" fill="#E74C3C">NOW</text>
  </g>
</svg>