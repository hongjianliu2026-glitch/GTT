<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">puff</text>
  <text x="50" y="120" class="subtitle">[pʌf] n. 一阵风，吹气；v. 喷出，膨胀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puff (源自中古英语puffen，意为吹气)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球在吹气后"膨胀(puff)"，
    <tspan x="50" dy="25">突然"砰"的一声爆裂，空气中弥漫着一阵风(puff)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She blew a puff of air to cool her coffee.
  </text>
  <text x="50" y="310" class="content">
    她吹了一口气来冷却她的咖啡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#E74C3C" />
    <!-- Explosion -->
    <circle cx="100" cy="100" r="20" class="image" fill="#F1C40F" />
    <circle cx="120" cy="80" r="15" class="image" fill="#F1C40F" />
    <circle cx="80" cy="80" r="15" class="image" fill="#F1C40F" />
    <circle cx="120" cy="120" r="15" class="image" fill="#F1C40F" />
    <circle cx="80" cy="120" r="15" class="image" fill="#F1C40F" />
    <!-- Air puff -->
    <line x1="100" y1="160" x2="100" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />
    <line x1="100" y1="160" x2="80" y2="180" class="image" />
  </g>
</svg>