<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ensuing</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsuːɪŋ] adj. 随后的，接着发生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + sue (跟随)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个事件发生后，"进入(en-)"
    <tspan x="50" dy="25">并"跟随(sue)"着发生的一系列事情，</tspan>
    <tspan x="50" dy="25">这些事情就是"随后的(ensuing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ensuing chaos made it difficult to control the situation.
  </text>
  <text x="50" y="310" class="content">
    随后的混乱使得控制局势变得困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Event -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,80 220,100 200,120" class="image" />
    <!-- Ensuing events -->
    <circle cx="250" cy="80" r="20" class="image" />
    <circle cx="250" cy="120" r="20" class="image" />
    <circle cx="250" cy="160" r="20" class="image" />
  </g>
</svg>