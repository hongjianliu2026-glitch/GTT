<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">absently</text>
  <text x="50" y="120" class="subtitle">[ˈæbsəntli] adv. 心不在焉地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + sent (感觉) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路，但他的思绪已经"离开(ab-)"了现实，
    <tspan x="50" dy="25">完全沉浸在自己的世界里，"感觉(sent)"不到周围的一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He absently replied to her question without even looking at her.
  </text>
  <text x="50" y="310" class="content">
    他心不在焉地回答了她的提问，甚至都没有看她一眼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="150" class="image" />
    <line x1="150" y1="100" x2="170" y2="150" class="image" />
    <!-- Thought bubble -->
    <circle cx="100" cy="20" r="30" class="image" />
    <line x1="100" y1="50" x2="100" y2="80" class="image" />
    <circle cx="80" cy="60" r="5" class="image" />
    <circle cx="120" cy="60" r="5" class="image" />
    <line x1="90" y1="70" x2="110" y2="70" class="image" />
  </g>
</svg>