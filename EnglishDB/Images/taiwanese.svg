<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Taiwanese</text>
  <text x="50" y="120" class="subtitle">[ˌtaɪwˈæniz] adj. 台湾的；n. 台湾人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Taiwan (台湾) + -ese (表示“...的”或“...人”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个台湾的小岛，上面住满了"台湾人(Taiwanese)"，
    <tspan x="50" dy="25">他们说着独特的语言，拥有丰富的文化和历史。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Taiwanese cuisine is famous for its diversity.
  </text>
  <text x="50" y="310" class="content">
    台湾菜以其多样性而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Island -->
    <circle cx="175" cy="100" r="70" class="image" />
    <!-- People -->
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="200" cy="80" r="10" class="image" />
    <circle cx="175" cy="120" r="10" class="image" />
    <!-- Culture symbols -->
    <rect x="130" y="150" width="90" height="30" class="image" />
    <line x1="135" y1="155" x2="215" y2="155" class="image" />
    <line x1="135" y1="175" x2="215" y2="175" class="image" />
    <line x1="135" y1="165" x2="215" y2="165" class="image" />
    <line x1="175" y1="155" x2="175" y2="175" class="image" />
  </g>
</svg>