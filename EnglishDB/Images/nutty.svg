<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nutty</text>
  <text x="50" y="120" class="subtitle">[ˈnʌti] adj. 坚果味的，古怪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nut (坚果) + -ty (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个坚果(nut)突然变得"古怪(nutty)"，
    <tspan x="50" dy="25">它开始跳舞，甚至还会说话！</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake had a nutty flavor that was quite unique.
  </text>
  <text x="50" y="310" class="content">
    这块蛋糕有一种独特的坚果味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nut -->
    <circle cx="50" cy="100" r="30" class="image" fill="#A04000" />
    <!-- Nut crack -->
    <line x1="30" y1="80" x2="70" y2="80" class="image" />
    <line x1="30" y1="90" x2="70" y2="90" class="image" />
    <line x1="30" y1="100" x2="70" y2="100" class="image" />
    <line x1="30" y1="110" x2="70" y2="110" class="image" />
    <line x1="30" y1="120" x2="70" y2="120" class="image" />
    <!-- Nutty character -->
    <circle cx="150" cy="100" r="30" class="image" fill="#A04000" />
    <circle cx="140" cy="90" r="5" class="image" fill="#000" />
    <circle cx="160" cy="90" r="5" class="image" fill="#000" />
    <path d="M140 110 Q150 120 160 110" class="image" fill="none" stroke="#000" />
    <line x1="150" y1="130" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="140" y2="170" class="image" />
    <line x1="150" y1="150" x2="160" y2="170" class="image" />
    <line x1="150" y1="140" x2="170" y2="130" class="image" />
  </g>
</svg>