<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chipped</text>
  <text x="50" y="120" class="subtitle">[tʃɪpt] adj. 有缺口的，破损的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chip (碎片) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个杯子被"敲碎(chip)"，
    <tspan x="50" dy="25">留下了一个明显的缺口，这个杯子就变成了"有缺口的(chipped)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chipped cup was still usable, but not as pretty.
  </text>
  <text x="50" y="310" class="content">
    这个有缺口的杯子还能用，但没那么漂亮了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup body -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Handle -->
    <rect x="200" y="50" width="20" height="50" class="image" />
    <!-- Chip -->
    <rect x="100" y="10" width="30" height="20" class="image" />
    <!-- Broken part -->
    <line x1="115" y1="10" x2="115" y2="30" class="image" />
    <line x1="130" y1="10" x2="130" y2="30" class="image" />
  </g>
</svg>