<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">terrace</text>
  <text x="50" y="120" class="subtitle">[ˈtɛrəs] n. 梯田，露台</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> terr (地) + -ace (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片山坡上，"地(terr)"被分割成
    <tspan x="50" dy="25">一层层的平台，这些平台就是梯田(terrace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmers built terraces on the hillside to grow crops.
  </text>
  <text x="50" y="310" class="content">
    农民们在山坡上建造了梯田来种植作物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hillside -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Terraces -->
    <rect x="50" y="20" width="250" height="30" class="image" />
    <rect x="50" y="60" width="250" height="30" class="image" />
    <rect x="50" y="100" width="250" height="30" class="image" />
    <rect x="50" y="140" width="250" height="30" class="image" />
    <!-- Plants -->
    <line x1="70" y1="35" x2="80" y2="35" class="image" />
    <line x1="70" y1="75" x2="80" y2="75" class="image" />
    <line x1="70" y1="115" x2="80" y2="115" class="image" />
    <line x1="70" y1="155" x2="80" y2="155" class="image" />
  </g>
</svg>