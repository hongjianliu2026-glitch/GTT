<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stormy</text>
  <text x="50" y="120" class="subtitle">[ˈstɔrmi] adj. 暴风雨的，激烈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> storm (风暴) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场"风暴(storm)"席卷而来，天空乌云密布，
    <tspan x="50" dy="25">雷声隆隆，这就是"暴风雨的(stormy)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting was stormy, with many heated arguments.
  </text>
  <text x="50" y="310" class="content">
    会议气氛激烈，充满了激烈的争论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Lightning -->
    <line x1="100" y1="100" x2="250" y2="200" class="image" />
    <line x1="100" y1="200" x2="250" y2="100" class="image" />
    <!-- Raindrops -->
    <line x1="50" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="100" y2="300" class="image" />
    <line x1="150" y1="250" x2="150" y2="300" class="image" />
    <line x1="200" y1="250" x2="200" y2="300" class="image" />
    <line x1="250" y1="250" x2="250" y2="300" class="image" />
  </g>
</svg>