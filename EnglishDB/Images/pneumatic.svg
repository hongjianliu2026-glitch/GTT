<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pneumatic</text>
  <text x="50" y="120" class="subtitle">[njuːˈmætɪk] adj. 气动的，充气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pneum (空气) + -atic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，里面充满了"空气(pneum)"，
    <tspan x="50" dy="25">它轻轻地飘在空中，这就是气动(pneumatic)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pneumatic drill made a loud noise.
  </text>
  <text x="50" y="310" class="content">
    气动钻机发出了很大的噪音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF5733" />
    <!-- Air -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="70" y2="170" class="image" />
    <line x1="100" y1="150" x2="130" y2="170" class="image" />
    <line x1="100" y1="150" x2="80" y2="190" class="image" />
    <line x1="100" y1="150" x2="120" y2="190" class="image" />
    <!-- Rope -->
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
  </g>
</svg>