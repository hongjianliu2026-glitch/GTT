<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anchovy</text>
  <text x="50" y="120" class="subtitle">[ˈæntʃəvi] n. 凤尾鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anch (鱼) + ovy (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条小鱼在海里游动，"小(ovy)"
    <tspan x="50" dy="25">鱼(anch)在海浪中穿梭，这就是凤尾鱼(anchovy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pizza was topped with anchovies.
  </text>
  <text x="50" y="310" class="content">
    披萨上撒了凤尾鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#A9CCE3" />
    <!-- Fish -->
    <path d="M50 100 C60 50, 100 50, 110 100 S140 150, 150 100" class="image" fill="#F1C40F" />
    <!-- Tail -->
    <path d="M150 100 L180 80 L180 120 Z" class="image" fill="#F1C40F" />
    <!-- Eye -->
    <circle cx="70" cy="90" r="5" class="image" fill="#000" />
  </g>
</svg>