<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">route</text>
  <text x="50" y="120" class="subtitle">[ruːt] n. 路线，路程；v. 按路线发送</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ro- (路) + -ute (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车沿着一条"路(ro-)"，"走(ute)"过
    <tspan x="50" dy="25">一段段风景，这条路就是它的路线(route)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The package will be routed to your address.
  </text>
  <text x="50" y="310" class="content">
    包裹将被按路线发送到你的地址。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Car -->
    <rect x="50" y="80" width="50" height="40" class="image" />
    <circle cx="70" cy="130" r="10" class="image" />
    <circle cx="110" cy="130" r="10" class="image" />
    <!-- Road signs -->
    <line x1="150" y1="80" x2="150" y2="140" class="image" />
    <rect x="140" y="60" width="20" height="20" class="image" />
    <line x1="250" y1="80" x2="250" y2="140" class="image" />
    <rect x="240" y="60" width="20" height="20" class="image" />
  </g>
</svg>