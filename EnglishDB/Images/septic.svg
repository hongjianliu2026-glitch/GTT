<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">septic</text>
  <text x="50" y="120" class="subtitle">[ˈsɛptɪk] adj. 腐败的，败血症的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sept (腐烂) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个腐烂的苹果，"腐烂(sept)"
    <tspan x="50" dy="25">的气味弥漫开来，这就是"腐败的(septic)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wound became septic after not being treated properly.
  </text>
  <text x="50" y="310" class="content">
    伤口因为没有得到适当处理而变得腐败。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rotten apple -->
    <circle cx="100" cy="100" r="50" class="image" fill="#8B4513" />
    <circle cx="110" cy="90" r="10" class="image" fill="#A52A2A" />
    <circle cx="90" cy="110" r="10" class="image" fill="#A52A2A" />
    <circle cx="120" cy="110" r="10" class="image" fill="#A52A2A" />
    <circle cx="100" cy="120" r="10" class="image" fill="#A52A2A" />
    <!-- Rotten spots -->
    <circle cx="80" cy="80" r="5" class="image" fill="#654321" />
    <circle cx="120" cy="80" r="5" class="image" fill="#654321" />
    <circle cx="100" cy="130" r="5" class="image" fill="#654321" />
  </g>
</svg>