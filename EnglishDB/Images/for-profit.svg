<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .money { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">for-profit</text>
  <text x="50" y="120" class="subtitle">[fɔːr ˈprɒfɪt] adj. 以营利为目的的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (为了) + profit (利润)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一家公司，"为了(for)"
    <tspan x="50" dy="25">赚取"利润(profit)"，</tspan>
    <tspan x="50" dy="25">它的一切行动都围绕着盈利展开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is a for-profit organization.
  </text>
  <text x="50" y="310" class="content">
    这家公司是一个以营利为目的的组织。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Company building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Money bag -->
    <circle cx="50" cy="100" r="30" class="money" />
    <text x="40" y="105" class="content">$</text>
    <!-- Arrow pointing to money -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,80 220,100 200,120" class="image" />
    <!-- Company sign -->
    <rect x="250" y="20" width="80" height="40" class="image" />
    <text x="260" y="50" class="content">PROFIT</text>
  </g>
</svg>