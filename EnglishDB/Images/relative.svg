<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relative</text>
  <text x="50" y="120" class="subtitle">[ˈrɛlətɪv] adj. 相对的；n. 亲属</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + lat (带来) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭聚会，"再次带来(re-lat)"
    <tspan x="50" dy="25">的亲人们(relative)，他们之间的关系是相对的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is my relative, but we don't see each other often.
  </text>
  <text x="50" y="310" class="content">
    她是我的亲戚，但我们不常见面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family gathering -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head of person 1 -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" /> <!-- Body of person 1 -->
    <line x1="50" y1="100" x2="30" y2="130" class="image" /> <!-- Left arm of person 1 -->
    <line x1="50" y1="100" x2="70" y2="130" class="image" /> <!-- Right arm of person 1 -->
    <line x1="50" y1="100" x2="50" y2="130" class="image" /> <!-- Legs of person 1 -->

    <circle cx="150" cy="50" r="20" class="image" /> <!-- Head of person 2 -->
    <line x1="150" y1="70" x2="150" y2="100" class="image" /> <!-- Body of person 2 -->
    <line x1="150" y1="100" x2="130" y2="130" class="image" /> <!-- Left arm of person 2 -->
    <line x1="150" y1="100" x2="170" y2="130" class="image" /> <!-- Right arm of person 2 -->
    <line x1="150" y1="100" x2="150" y2="130" class="image" /> <!-- Legs of person 2 -->

    <line x1="70" y1="80" x2="130" y2="80" class="image" /> <!-- Connection between people -->
  </g>
</svg>