<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nobility</text>
  <text x="50" y="120" class="subtitle">[noʊˈbɪlɪti] n. 贵族，高贵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nobilis (高贵的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位身穿华丽长袍的贵族，头戴皇冠，
    <tspan x="50" dy="25">手持权杖，站在高高的城堡上，俯视着他的领地。</tspan>
    <tspan x="50" dy="25">这种高贵的姿态和地位，正是"nobility"的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The nobility of the medieval era lived in grand castles.
  </text>
  <text x="50" y="330" class="content">
    中世纪的贵族居住在宏伟的城堡中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Crown -->
    <polygon points="200,20 180,50 220,50" class="image" />
    <!-- Nobleman -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Scepter -->
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <circle cx="200" cy="200" r="5" class="image" />
  </g>
</svg>