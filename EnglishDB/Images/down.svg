<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">down</text>
  <text x="50" y="120" class="subtitle">[daʊn] adv. 向下；adj. 向下的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> down (向下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体从高处"向下(down)"坠落，
    <tspan x="50" dy="25">这个动作就是"down"的直观体现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bird flew down from the tree.
  </text>
  <text x="50" y="310" class="content">
    鸟从树上飞了下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <!-- Bird -->
    <circle cx="50" cy="20" r="10" class="image" />
    <line x1="50" y1="30" x2="50" y2="100" class="image" />
    <!-- Arrow pointing down -->
    <polygon points="50,100 40,120 60,120" class="image" />
  </g>
</svg>