<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dizzy</text>
  <text x="50" y="120" class="subtitle">[ˈdɪzi] adj. 头晕的，眩晕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> diz (旋转) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在旋转木马上，"旋转(diz)"
    <tspan x="50" dy="25">得头晕目眩，感觉世界都在旋转(dizzy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roller coaster ride made her feel dizzy.
  </text>
  <text x="50" y="310" class="content">
    过山车让她感到头晕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rotating carousel -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <line x1="175" y1="100" x2="95" y2="100" class="image" />
    <line x1="175" y1="100" x2="225" y2="150" class="image" />
    <line x1="175" y1="100" x2="125" y2="150" class="image" />
    <line x1="175" y1="100" x2="225" y2="50" class="image" />
    <line x1="175" y1="100" x2="125" y2="50" class="image" />

    <!-- Dizzy person -->
    <circle cx="175" cy="250" r="20" class="image" />
    <line x1="175" y1="270" x2="175" y2="300" class="image" />
    <line x1="175" y1="300" x2="155" y2="330" class="image" />
    <line x1="175" y1="300" x2="195" y2="330" class="image" />
    <line x1="175" y1="280" x2="215" y2="270" class="image" />
    <line x1="175" y1="280" x2="135" y2="270" class="image" />
  </g>
</svg>