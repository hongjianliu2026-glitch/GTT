<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .berry { fill: #884EA0; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">berry</text>
  <text x="50" y="120" class="subtitle">[ˈbɛri] n. 浆果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> berri (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小浆果(berri)，它小巧玲珑，
    <tspan x="50" dy="25">色彩鲜艳，就像一颗颗小小的宝石，</tspan>
    <tspan x="50" dy="25">这就是浆果(berry)的魅力所在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She picked a handful of berries from the bush.
  </text>
  <text x="50" y="310" class="content">
    她从灌木丛中摘了一把浆果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Berry bush -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Berries -->
    <circle cx="50" cy="100" r="15" class="berry" />
    <circle cx="100" cy="120" r="15" class="berry" />
    <circle cx="150" cy="100" r="15" class="berry" />
    <circle cx="200" cy="120" r="15" class="berry" />
    <circle cx="250" cy="100" r="15" class="berry" />
    <!-- Leaves -->
    <path d="M30,80 Q50,60 70,80 T110,80" class="image" />
    <path d="M130,80 Q150,60 170,80 T210,80" class="image" />
  </g>
</svg>