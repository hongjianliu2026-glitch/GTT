<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">appalling</text>
  <text x="50" y="120" class="subtitle">[əˈpɔːlɪŋ] adj. 令人震惊的，骇人听闻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (加强) + pall (遮盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，"加强遮盖(ap-pall)"
    <tspan x="50" dy="25">的恐怖事件，让人感到震惊(appalling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the accident was appalling.
  </text>
  <text x="50" y="310" class="content">
    事故的消息令人震惊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Lightning bolt -->
    <line x1="100" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="100" y2="200" class="image" />
    <!-- Person reacting -->
    <circle cx="175" cy="250" r="20" class="image" />
    <line x1="175" y1="270" x2="175" y2="320" class="image" />
    <line x1="175" y1="320" x2="150" y2="350" class="image" />
    <line x1="175" y1="320" x2="200" y2="350" class="image" />
    <line x1="175" y1="290" x2="130" y2="280" class="image" />
    <line x1="175" y1="290" x2="220" y2="280" class="image" />
  </g>
</svg>