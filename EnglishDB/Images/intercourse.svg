<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intercourse</text>
  <text x="50" y="120" class="subtitle">[ˈɪntərkɔːrs] n. 交往，交流</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + course (流动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在对话，"在彼此之间流动(inter-course)"
    <tspan x="50" dy="25">的信息，这就是他们之间的交往(intercourse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company encourages open intercourse among employees.
  </text>
  <text x="50" y="310" class="content">
    公司鼓励员工之间的开放交流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people talking -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Speech bubbles -->
    <path d="M 50 80 Q 100 50 150 80" class="image" />
    <path d="M 200 80 Q 250 50 300 80" class="image" />
    <!-- Lines connecting them -->
    <line x1="70" y1="100" x2="180" y2="100" class="image" />
  </g>
</svg>