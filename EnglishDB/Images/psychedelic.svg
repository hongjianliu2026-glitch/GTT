<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF5E6; }
      .title { font: bold 48px sans-serif; fill: #FF6347; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #FF4500; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .psychedelic { fill: #FF69B4; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psychedelic</text>
  <text x="50" y="120" class="subtitle">[ˌsaɪkəˈdɛlɪk] adj. 迷幻的，引起幻觉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psyche (心灵) + del (显示) + ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在创作，"心灵(psyche)中显示(del)"
    <tspan x="50" dy="25">出五彩斑斓的幻觉，这些幻觉就构成了迷幻(psychedelic)的艺术。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The album cover was very psychedelic with swirling colors.
  </text>
  <text x="50" y="310" class="content">
    专辑封面色彩斑斓，非常迷幻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Canvas -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Psychedelic colors -->
    <circle cx="100" cy="100" r="30" class="psychedelic" />
    <circle cx="150" cy="120" r="25" class="psychedelic" />
    <circle cx="200" cy="80" r="35" class="psychedelic" />
    <circle cx="250" cy="110" r="20" class="psychedelic" />
  </g>
</svg>