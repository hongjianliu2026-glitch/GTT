<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apnea</text>
  <text x="50" y="120" class="subtitle">[æpˈniːə] n. 呼吸暂停</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (没有) + pnea (呼吸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在睡觉时，突然"没有呼吸(a-pnea)"，
    <tspan x="50" dy="25">他的胸口停止了起伏，这就是呼吸暂停(apnea)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffers from sleep apnea, which affects his daily life.
  </text>
  <text x="50" y="310" class="content">
    他患有睡眠呼吸暂停，这影响了他的日常生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person sleeping -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="130" y2="140" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- No breath -->
    <line x1="175" y1="100" x2="175" y2="130" class="image" />
    <line x1="170" y1="115" x2="180" y2="115" class="image" />
  </g>
</svg>