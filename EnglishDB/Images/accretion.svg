<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accretion</text>
  <text x="50" y="120" class="subtitle">[əˈkriːʃən] n. 增长，积累</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (向) + cre (增长) + -tion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个雪球在山坡上滚动，"向着(ac-)"
    <tspan x="50" dy="25">增长(cre)"，逐渐积累(accretion)成巨大的雪球。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accretion of wealth over time allowed him to retire early.
  </text>
  <text x="50" y="310" class="content">
    财富的逐渐积累使他能够提前退休。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowball -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="100" r="60" class="image" />
    <circle cx="210" cy="100" r="70" class="image" />
    <!-- Hill -->
    <path d="M 0 200 Q 100 150 200 200 L 200 250 L 0 250 Z" class="image" />
    <!-- Snowball rolling down -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="210" y2="100" class="image" />
  </g>
</svg>