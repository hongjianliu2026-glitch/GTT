<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">queer</text>
  <text x="50" y="120" class="subtitle">[kwɪr] adj. 奇怪的，古怪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> que (奇怪) + er (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"奇怪(que)"的生物，它有
    <tspan x="50" dy="25">三只眼睛和四条腿，走在街上，</tspan>
    <tspan x="50" dy="25">人们都惊讶地看着它，因为它太"古怪(queer)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> That movie had a queer ending that no one expected.
  </text>
  <text x="50" y="310" class="content">
    那部电影有一个没人预料到的奇怪结局。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Strange creature -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <circle cx="70" cy="80" r="10" class="image" /> <!-- Eye 1 -->
    <circle cx="130" cy="80" r="10" class="image" /> <!-- Eye 2 -->
    <circle cx="100" cy="120" r="10" class="image" /> <!-- Eye 3 -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="30" y2="200" class="image" /> <!-- Leg 1 -->
    <line x1="150" y1="150" x2="170" y2="200" class="image" /> <!-- Leg 2 -->
    <line x1="50" y1="150" x2="30" y2="250" class="image" /> <!-- Leg 3 -->
    <line x1="150" y1="150" x2="170" y2="250" class="image" /> <!-- Leg 4 -->
  </g>
</svg>