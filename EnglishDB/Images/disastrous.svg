<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disastrous</text>
  <text x="50" y="120" class="subtitle">[dɪˈzæstrəs] adj. 灾难性的，极坏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不，相反) + astro (星) + ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗星星(astro)突然"不(dis-)"再闪耀，
    <tspan x="50" dy="25">整个天空陷入黑暗，这就是灾难性的(disastrous)场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hurricane caused disastrous damage to the city.
  </text>
  <text x="50" y="310" class="content">
    飓风给城市造成了灾难性的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Star -->
    <circle cx="175" cy="100" r="20" class="image" fill="#ECF0F1" />
    <!-- Broken star -->
    <line x1="155" y1="80" x2="195" y2="120" class="image" stroke="#E74C3C" stroke-width="4" />
    <line x1="155" y1="120" x2="195" y2="80" class="image" stroke="#E74C3C" stroke-width="4" />
    <!-- Dark clouds -->
    <ellipse cx="100" cy="50" rx="80" ry="30" class="image" fill="#34495E" />
    <ellipse cx="250" cy="50" rx="80" ry="30" class="image" fill="#34495E" />
  </g>
</svg>