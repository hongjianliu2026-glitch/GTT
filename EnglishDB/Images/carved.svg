<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carved</text>
  <text x="50" y="120" class="subtitle">[kɑːrvd] adj. 雕刻的，刻成的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carv (雕刻) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家用刀在木头上"雕刻(carv)"出
    <tspan x="50" dy="25">一个精美的图案，木头上留下了深深的痕迹，</tspan>
    <tspan x="50" dy="25">这就是"雕刻的(carved)"作品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wooden door was beautifully carved with intricate patterns.
  </text>
  <text x="50" y="310" class="content">
    木门上雕刻着精美的复杂图案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wood block -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Carved pattern -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="250" y2="80" class="image" />
    <line x1="50" y1="110" x2="270" y2="110" class="image" />
    <line x1="50" y1="140" x2="240" y2="140" class="image" />
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Carving tool -->
    <line x1="20" y1="130" x2="70" y2="100" class="image" />
  </g>
</svg>