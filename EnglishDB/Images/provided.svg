<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">provided</text>
  <text x="50" y="120" class="subtitle">[prəˈvaɪdɪd] v. 提供，供给</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + vid (看) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人向前看(pro-vid)，发现需要的东西，然后提供(provided)给需要的人。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The school provided all the necessary materials for the students.
  </text>
  <text x="50" y="310" class="content">
    学校为学生们提供了所有必要的材料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person looking forward -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Arrow pointing forward -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <polygon points="150,50 140,45 140,55" class="image" />
    <!-- Box with materials -->
    <rect x="200" y="30" width="100" height="40" class="image" />
    <line x1="210" y1="40" x2="290" y2="40" class="image" />
    <line x1="210" y1="50" x2="290" y2="50" class="image" />
    <line x1="210" y1="60" x2="290" y2="60" class="image" />
  </g>
</svg>