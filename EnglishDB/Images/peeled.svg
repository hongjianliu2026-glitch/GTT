<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peeled</text>
  <text x="50" y="120" class="subtitle">[piːld] adj. 去皮的，剥皮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peel (剥皮) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的香蕉，"剥皮(peel)"后露出
    <tspan x="50" dy="25">光滑的果肉，这就是"去皮的(peeled)"香蕉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers to eat her bananas peeled.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃去皮的香蕉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Banana -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" />
    <path d="M50 50 Q100 80 150 50 T250 50" class="image" />
    <!-- Peel -->
    <path d="M50 50 L50 100 Q100 120 150 100 T250 100" class="image" />
    <path d="M50 100 L50 150 Q100 170 150 150 T250 150" class="image" />
    <!-- Peeled banana -->
    <path d="M50 150 Q100 120 150 150 T250 150" class="image" />
    <path d="M50 150 Q100 180 150 150 T250 150" class="image" />
  </g>
</svg>