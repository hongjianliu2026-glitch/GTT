<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">restraining</text>
  <text x="50" y="120" class="subtitle">[rɪˈstreɪnɪŋ] adj. 抑制的，限制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + strain (拉紧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"再次拉紧(re-strain)"的绳子束缚住，
    <tspan x="50" dy="25">无法自由行动，这种状态就是"抑制的(restraining)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The restraining order prevented him from contacting her.
  </text>
  <text x="50" y="310" class="content">
    限制令阻止了他与她联系。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rope -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="70" x2="300" y2="70" class="image" />
    <line x1="50" y1="90" x2="300" y2="90" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="140" x2="70" y2="160" class="image" />
    <line x1="100" y1="140" x2="130" y2="160" class="image" />
    <!-- Restraining rope -->
    <line x1="100" y1="120" x2="50" y2="100" class="image" />
    <line x1="100" y1="120" x2="150" y2="100" class="image" />
  </g>
</svg>