      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crescendo</text>
  <text x="50" y="120" class="subtitle">[krəˈʃɛndoʊ] n. 渐强；v. 渐强</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crescere (生长) + -endo (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在演奏时，声音逐渐"生长(crescere)"
    <tspan x="50" dy="25">变大，直到达到高潮，这就是渐强(crescendo)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The orchestra played a crescendo that filled the hall.
  </text>
  <text x="50" y="310" class="content">
    管弦乐队演奏了一段渐强，充满了整个大厅。
  </text>

