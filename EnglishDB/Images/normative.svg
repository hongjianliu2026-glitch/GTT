<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">normative</text>
  <text x="50" y="120" class="subtitle">[ˈnɔːrmətɪv] adj. 规范的，标准的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> norm (标准) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的尺子(norm)，上面刻着各种标准，
    <tspan x="50" dy="25">人们必须按照这些标准(normative)来行事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The normative behavior in this society is to be polite.
  </text>
  <text x="50" y="310" class="content">
    在这个社会中，礼貌是规范的行为。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ruler -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Marks on the ruler -->
    <line x1="20" y1="0" x2="20" y2="50" class="image" />
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="80" y1="0" x2="80" y2="50" class="image" />
    <line x1="110" y1="0" x2="110" y2="50" class="image" />
    <line x1="140" y1="0" x2="140" y2="50" class="image" />
    <line x1="170" y1="0" x2="170" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <line x1="230" y1="0" x2="230" y2="50" class="image" />
    <line x1="260" y1="0" x2="260" y2="50" class="image" />
    <line x1="290" y1="0" x2="290" y2="50" class="image" />
    <line x1="320" y1="0" x2="320" y2="50" class="image" />
    <!-- Person following the ruler -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
  </g>
</svg>