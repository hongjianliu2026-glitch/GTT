<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monastic</text>
  <text x="50" y="120" class="subtitle">[məˈnæstɪk] adj. 修道院的，修道士的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mon (单独) + -astic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个修道士独自在修道院中，"单独(mon)"
    <tspan x="50" dy="25">过着简朴的生活，这就是修道院(monastic)的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The monastic life is characterized by simplicity and solitude.
  </text>
  <text x="50" y="310" class="content">
    修道院生活以简朴和独居为特征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monastery -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Monk -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Monastery walls -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <line x1="120" y1="40" x2="280" y2="40" class="image" />
    <line x1="120" y1="70" x2="250" y2="70" class="image" />
    <line x1="120" y1="100" x2="270" y2="100" class="image" />
    <line x1="120" y1="130" x2="240" y2="130" class="image" />
  </g>
</svg>