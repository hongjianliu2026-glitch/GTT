<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">casualty</text>
  <text x="50" y="120" class="subtitle">[ˈkæʒuəlti] n. 伤亡，受害者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cas (落下) + ual (形容词后缀) + ty (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场战争中，"落下(cas)"的士兵成为了"伤亡(casualty)"，
    <tspan x="50" dy="25">他们是无辜的受害者。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The battle resulted in many casualties.
  </text>
  <text x="50" y="310" class="content">
    这场战斗造成了许多伤亡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soldier falling -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Soldier body -->
    <circle cx="50" cy="180" r="15" class="image" />
    <line x1="50" y1="195" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="240" class="image" />
    <line x1="50" y1="220" x2="70" y2="240" class="image" />
    <line x1="50" y1="210" x2="80" y2="200" class="image" />
  </g>
</svg>