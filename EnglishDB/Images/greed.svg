<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">greed</text>
  <text x="50" y="120" class="subtitle">[ɡriːd] n. 贪婪，贪心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gree (渴望)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个贪婪的人，"渴望(gree)"
    <tspan x="50" dy="25">得到更多的财富，眼睛都变成了金币的形状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His greed for money led him to illegal activities.
  </text>
  <text x="50" y="310" class="content">
    他对金钱的贪婪使他走上了非法的道路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Greedy person -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="50" cy="50" r="25" fill="#F1C40F" />
    <!-- Eyes -->
    <circle cx="35" cy="40" r="5" fill="#000" />
    <circle cx="65" cy="40" r="5" fill="#000" />
    <!-- Mouth -->
    <path d="M 30 70 Q 50 80 70 70" stroke="#000" stroke-width="2" fill="none" />
    <!-- Gold coins -->
    <circle cx="100" cy="50" r="15" fill="#D4AC0D" />
    <circle cx="130" cy="50" r="15" fill="#D4AC0D" />
    <circle cx="160" cy="50" r="15" fill="#D4AC0D" />
    <!-- Hand reaching for coins -->
    <line x1="50" y1="80" x2="100" y2="60" class="image" />
    <line x1="50" y1="80" x2="130" y2="60" class="image" />
  </g>
</svg>