<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .gold { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">treasury</text>
  <text x="50" y="120" class="subtitle">[ˈtrɛʒəri] n. 国库，金库；宝库</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> treas (财富) + -ury (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金库(treasury)，里面堆满了金币和珠宝，
    <tspan x="50" dy="25">这些财富(treas)被安全地保管着，就像一个国家的宝库。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government's treasury is filled with gold reserves.
  </text>
  <text x="50" y="310" class="content">
    政府的金库中充满了黄金储备。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vault -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gold bars -->
    <rect x="50" y="20" width="50" height="160" class="gold" />
    <rect x="120" y="20" width="50" height="160" class="gold" />
    <rect x="190" y="20" width="50" height="160" class="gold" />
    <rect x="260" y="20" width="50" height="160" class="gold" />
    <!-- Treasure chest -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="20" x2="50" y2="120" class="image" />
    <line x1="300" y1="20" x2="300" y2="120" class="image" />
    <!-- Gold coins -->
    <circle cx="100" cy="70" r="10" class="gold" />
    <circle cx="150" cy="70" r="10" class="gold" />
    <circle cx="200" cy="70" r="10" class="gold" />
    <circle cx="250" cy="70" r="10" class="gold" />
  </g>
</svg>