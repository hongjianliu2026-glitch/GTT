<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">puzzlement</text>
  <text x="50" y="120" class="subtitle">[ˈpʌzlmənt] n. 困惑，迷惑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puzzl (困惑) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面对一堆拼图碎片，"困惑(puzzl)"
    <tspan x="50" dy="25">得不知所措，这就是puzzlement(困惑)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His puzzlement was evident as he tried to solve the riddle.
  </text>
  <text x="50" y="310" class="content">
    他试图解开谜题时的困惑显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Person -->
    <circle cx="180" cy="250" r="20" class="image" />
    <line x1="180" y1="270" x2="180" y2="320" class="image" />
    <line x1="180" y1="320" x2="160" y2="350" class="image" />
    <line x1="180" y1="320" x2="200" y2="350" class="image" />
    <line x1="180" y1="290" x2="150" y2="280" class="image" />
    <line x1="180" y1="290" x2="210" y2="280" class="image" />
    <!-- Question marks -->
    <text x="160" y="240" class="image" font-size="30">?</text>
    <text x="190" y="240" class="image" font-size="30">?</text>
    <text x="220" y="240" class="image" font-size="30">?</text>
  </g>
</svg>