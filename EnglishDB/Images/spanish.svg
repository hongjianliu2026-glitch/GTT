<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Spanish</text>
  <text x="50" y="120" class="subtitle">[ˈspænɪʃ] adj. 西班牙的；n. 西班牙语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Span (西班牙) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满热情的西班牙舞者，在阳光下跳着弗拉明戈舞，
    <tspan x="50" dy="25">周围是西班牙的标志性建筑，如高迪的圣家堂。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent Spanish and loves Spanish culture.
  </text>
  <text x="50" y="310" class="content">
    她能说流利的西班牙语，并且热爱西班牙文化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flamenco dancer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Sagrada Familia -->
    <rect x="100" y="20" width="150" height="200" class="image" />
    <line x1="120" y1="40" x2="140" y2="40" class="image" />
    <line x1="120" y1="60" x2="140" y2="60" class="image" />
    <line x1="120" y1="80" x2="140" y2="80" class="image" />
    <line x1="120" y1="100" x2="140" y2="100" class="image" />
    <line x1="120" y1="120" x2="140" y2="120" class="image" />
    <line x1="120" y1="140" x2="140" y2="140" class="image" />
    <line x1="120" y1="160" x2="140" y2="160" class="image" />
    <line x1="120" y1="180" x2="140" y2="180" class="image" />
    <line x1="120" y1="200" x2="140" y2="200" class="image" />
  </g>
</svg>