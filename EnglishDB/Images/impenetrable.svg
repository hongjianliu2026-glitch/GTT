<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impenetrable</text>
  <text x="50" y="120" class="subtitle">[ˌɪmpəˈnɛtrəbl] adj. 不能穿透的，不可理解的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + penetr (穿透) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头墙，"无法穿透(im-penetr-able)"，
    <tspan x="50" dy="25">任何东西都无法通过，就像某些复杂的概念一样难以理解。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fortress was impenetrable, even to the most skilled warriors.
  </text>
  <text x="50" y="310" class="content">
    这座堡垒坚不可摧，即使是技艺最精湛的战士也无法攻破。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="100" y="40" width="150" height="120" class="image" />
    <rect x="150" y="60" width="50" height="80" class="image" />
    <!-- Attempt to penetrate -->
    <line x1="20" y1="100" x2="330" y2="100" class="image" />
    <line x1="20" y1="100" x2="20" y2="200" class="image" />
    <line x1="330" y1="100" x2="330" y2="200" class="image" />
    <line x1="20" y1="200" x2="330" y2="200" class="image" />
    <!-- Warrior -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>