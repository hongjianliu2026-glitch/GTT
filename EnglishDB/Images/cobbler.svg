<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cobbler</text>
  <text x="50" y="120" class="subtitle">[ˈkɒblə(r)] n. 补鞋匠，水果馅饼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cob (鞋) + bler (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个补鞋匠(cobbler)，他不仅修补鞋子，
    <tspan x="50" dy="25">还用水果制作美味的馅饼，"做(bler)"出各种美味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cobbler fixed my shoes and made a delicious fruit cobbler.
  </text>
  <text x="50" y="310" class="content">
    补鞋匠修好了我的鞋子，还做了一个美味的水果馅饼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shoe -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Cobbler -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="100" x2="240" y2="90" class="image" />
    <!-- Pie -->
    <rect x="300" y="0" width="150" height="100" class="image" />
    <circle cx="330" cy="50" r="10" class="image" />
    <circle cx="360" cy="50" r="10" class="image" />
    <circle cx="390" cy="50" r="10" class="image" />
  </g>
</svg>