<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">appalled</text>
  <text x="50" y="120" class="subtitle">[əˈpɔːld] adj. 惊骇的，震惊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (加强) + pall (遮盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到恐怖的场景，"被遮盖(pall)"
    <tspan x="50" dy="25">住心灵，感到极度震惊(appalled)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The audience was appalled by the gruesome scene.
  </text>
  <text x="50" y="310" class="content">
    观众被那血腥的场面吓坏了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Shocked face -->
    <circle cx="20" cy="90" r="5" class="image" />
    <circle cx="30" cy="90" r="5" class="image" />
    <line x1="15" y1="110" x2="35" y2="110" class="image" />
    <!-- Covering eyes -->
    <line x1="10" y1="80" x2="30" y2="80" class="image" />
    <line x1="10" y1="80" x2="10" y2="90" class="image" />
    <line x1="30" y1="80" x2="30" y2="90" class="image" />
  </g>
</svg>