<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">visitor</text>
  <text x="50" y="120" class="subtitle">[ˈvɪzɪtər] n. 访问者，游客</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> visit (访问) + -or (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个游客(visitor)站在门口，准备"访问(visit)"
    <tspan x="50" dy="25">一个新的地方，手里拿着地图，脸上带着好奇的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The museum had many visitors from around the world.
  </text>
  <text x="50" y="310" class="content">
    博物馆有很多来自世界各地的游客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Visitor -->
    <circle cx="75" cy="100" r="20" class="image" />
    <line x1="75" y1="120" x2="75" y2="180" class="image" />
    <line x1="75" y1="180" x2="50" y2="220" class="image" />
    <line x1="75" y1="180" x2="100" y2="220" class="image" />
    <line x1="75" y1="140" x2="120" y2="120" class="image" />
    <!-- Map -->
    <rect x="160" y="80" width="100" height="60" class="image" />
    <line x1="170" y1="90" x2="250" y2="90" class="image" />
    <line x1="170" y1="110" x2="240" y2="110" class="image" />
    <line x1="170" y1="130" x2="230" y2="130" class="image" />
  </g>
</svg>