<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shunt</text>
  <text x="50" y="120" class="subtitle">[ʃʌnt] v. 转移，分路；n. 转移，分路器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shunt (源自中古英语 shunten，意为“推开”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆火车在轨道上行驶，突然需要"推开(shunt)"
    <tspan x="50" dy="25">另一条轨道上的火车，以便自己通过。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The train was shunted to another track to make way for the express.
  </text>
  <text x="50" y="310" class="content">
    火车被转移到另一条轨道上，为快车让路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Train tracks -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <!-- Train -->
    <rect x="50" y="10" width="100" height="30" class="image" />
    <rect x="160" y="10" width="100" height="30" class="image" />
    <!-- Shunting -->
    <line x1="270" y1="10" x2="350" y2="50" class="image" />
    <line x1="270" y1="40" x2="350" y2="80" class="image" />
    <!-- Another track -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <!-- Shunted train -->
    <rect x="50" y="110" width="100" height="30" class="image" />
  </g>
</svg>