<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intersection</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈsekʃn] n. 交叉点，十字路口</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + sect (切割)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两条道路在中间"切割(sect)"，形成了一个"交叉点(intersection)"，
    <tspan x="50" dy="25">就像一个巨大的十字路口，车辆和行人在这里交汇。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident happened at the busy intersection.
  </text>
  <text x="50" y="310" class="content">
    事故发生在繁忙的十字路口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road lines -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Intersection -->
    <rect x="165" y="90" width="20" height="20" class="image" />
    <!-- Cars -->
    <rect x="50" y="85" width="30" height="10" class="image" />
    <rect x="270" y="85" width="30" height="10" class="image" />
    <rect x="160" y="50" width="10" height="30" class="image" />
    <rect x="160" y="120" width="10" height="30" class="image" />
  </g>
</svg>