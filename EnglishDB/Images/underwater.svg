<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underwater</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈwɔːtər] adj. 水下的，水中的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...下面) + water (水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条鱼在水中游动，"在水的下面(under-water)"，
    <tspan x="50" dy="25">它在水下世界自由穿梭，这就是水下的世界(underwater)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The divers explored the underwater caves.
  </text>
  <text x="50" y="310" class="content">
    潜水员探索了水下的洞穴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water surface -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Fish -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="50" x2="70" y2="30" class="image" />
    <line x1="50" y1="50" x2="70" y2="70" class="image" />
    <!-- Underwater -->
    <rect x="0" y="10" width="350" height="200" class="image" />
    <!-- Bubbles -->
    <circle cx="100" cy="30" r="5" class="image" />
    <circle cx="120" cy="40" r="5" class="image" />
    <circle cx="140" cy="50" r="5" class="image" />
  </g>
</svg>