<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yearn</text>
  <text x="50" y="120" class="subtitle">[jɜːrn] v. 渴望，向往</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yearn (源自中古英语 yernen, 意为渴望)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在海边，望着远方的地平线，心中充满了对未知的渴望。
    <tspan x="50" dy="25">这种强烈的向往和渴望，就是yearn的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She yearned for a life of adventure and freedom.
  </text>
  <text x="50" y="310" class="content">
    她渴望一种充满冒险和自由的生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person looking at the horizon -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Horizon line -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="150" r="30" class="image" />
    <!-- Waves -->
    <line x1="0" y1="210" x2="350" y2="210" class="image" />
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
    <line x1="0" y1="230" x2="350" y2="230" class="image" />
  </g>
</svg>