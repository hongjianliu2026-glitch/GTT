<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mansion</text>
  <text x="50" y="120" class="subtitle">[ˈmænʃən] n. 大厦，宅邸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (手) + -sion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宅邸，"用手(man)"
    <tspan x="50" dy="25">建造的宏伟建筑，这就是mansion(大厦)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They live in a beautiful mansion by the lake.
  </text>
  <text x="50" y="310" class="content">
    他们住在湖边的一座美丽的大厦里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mansion -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="70" y="40" width="210" height="120" class="image" />
    <rect x="90" y="60" width="170" height="80" class="image" />
    <!-- Windows -->
    <rect x="100" y="70" width="30" height="20" class="image" />
    <rect x="150" y="70" width="30" height="20" class="image" />
    <rect x="200" y="70" width="30" height="20" class="image" />
    <!-- Door -->
    <rect x="170" y="120" width="60" height="40" class="image" />
    <!-- Hands -->
    <line x1="20" y1="100" x2="40" y2="120" class="image" />
    <line x1="20" y1="120" x2="40" y2="100" class="image" />
    <line x1="330" y1="100" x2="350" y2="120" class="image" />
    <line x1="330" y1="120" x2="350" y2="100" class="image" />
  </g>
</svg>