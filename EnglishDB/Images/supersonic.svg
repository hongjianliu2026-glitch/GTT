<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supersonic</text>
  <text x="50" y="120" class="subtitle">[ˌsuːpərˈsɒnɪk] adj. 超音速的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (超过) + sonic (声音的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机以"超过(super)声音(sonic)"的速度飞行，
    <tspan x="50" dy="25">留下一道音爆云，这就是超音速(supersonic)的壮观景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jet flew at supersonic speeds across the sky.
  </text>
  <text x="50" y="310" class="content">
    喷气式飞机以超音速在天空中飞行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jet plane -->
    <polygon points="0,100 100,50 100,150" class="image" />
    <!-- Sonic boom cloud -->
    <ellipse cx="150" cy="100" rx="50" ry="25" class="image" />
    <!-- Speed lines -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="90" x2="240" y2="90" class="image" />
    <line x1="200" y1="110" x2="260" y2="110" class="image" />
  </g>
</svg>