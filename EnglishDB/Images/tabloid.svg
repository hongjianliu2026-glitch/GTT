<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tabloid</text>
  <text x="50" y="120" class="subtitle">[ˈtæbˌlɔɪd] n. 小报</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tabl (平板) + oid (类似)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张"平板(tabl)"形状的报纸，
    <tspan x="50" dy="25">它比普通报纸小，内容更夸张，这就是小报(tabloid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tabloid published a sensational story about the celebrity.
  </text>
  <text x="50" y="310" class="content">
    小报刊登了一篇关于这位名人的耸人听闻的故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Newspaper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Headline -->
    <text x="50" y="50" class="image" style="font: bold 24px sans-serif; fill: #C0392B;">BREAKING NEWS</text>
    <!-- Exaggerated image -->
    <circle cx="200" cy="120" r="50" class="image" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="200" x2="150" y2="190" class="image" />
    <line x1="200" y1="200" x2="250" y2="190" class="image" />
  </g>
</svg>