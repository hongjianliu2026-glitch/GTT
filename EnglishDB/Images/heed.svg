<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heed</text>
  <text x="50" y="120" class="subtitle">[hid] v. 注意，留心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hede (注意)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在繁忙的街道上，突然听到一个声音，他立刻"注意(heed)"
    <tspan x="50" dy="25">并停下脚步，仔细聆听。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Heed the warning signs and stay safe.
  </text>
  <text x="50" y="310" class="content">
    注意警告标志，确保安全。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Street -->
    <line x1="0" y1="200" x2="400" y2="200" class="image" />
    <line x1="0" y1="210" x2="400" y2="210" class="image" />
    <line x1="0" y1="220" x2="400" y2="220" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
    <line x1="100" y1="200" x2="120" y2="220" class="image" />
    <line x1="100" y1="180" x2="140" y2="170" class="image" />
    <!-- Sound waves -->
    <circle cx="200" cy="150" r="10" class="image" />
    <circle cx="220" cy="150" r="15" class="image" />
    <circle cx="240" cy="150" r="20" class="image" />
    <circle cx="260" cy="150" r="25" class="image" />
  </g>
</svg>