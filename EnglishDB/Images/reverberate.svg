<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reverberate</text>
  <text x="50" y="120" class="subtitle">[rɪˈvɜːrbəreɪt] v. 回响，回荡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + verb (说) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山谷，你大声喊出"回(re-)"，
    <tspan x="50" dy="25">声音在山谷中"说(verb)"了无数次，回荡(reverberate)不止。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thunder reverberated across the valley.
  </text>
  <text x="50" y="310" class="content">
    雷声在山谷中回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 50 L200 200 Z" class="image" />
    <path d="M100 200 L200 100 L300 200 Z" class="image" />
    <!-- Sound waves -->
    <circle cx="150" cy="150" r="20" class="image" />
    <circle cx="150" cy="150" r="40" class="image" />
    <circle cx="150" cy="150" r="60" class="image" />
    <circle cx="150" cy="150" r="80" class="image" />
    <!-- Person shouting -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
  </g>
</svg>