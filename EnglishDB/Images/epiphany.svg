<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">epiphany</text>
  <text x="50" y="120" class="subtitle">[ɪˈpɪfəni] n. 顿悟，突然的领悟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> epi- (在...之上) + phan (显示)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考问题，突然"在上面显示(epi-phan)"
    <tspan x="50" dy="25">出一个答案，这就是顿悟(epiphany)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The solution came to her in an epiphany.
  </text>
  <text x="50" y="310" class="content">
    解决方案突然出现在她的脑海中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person thinking -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />

    <!-- Light bulb -->
    <circle cx="200" cy="100" r="40" class="image" />
    <line x1="200" y1="140" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="240" class="image" />
    <line x1="200" y1="200" x2="220" y2="240" class="image" />
    <line x1="200" y1="160" x2="170" y2="150" class="image" />
    <line x1="200" y1="160" x2="230" y2="150" class="image" />

    <!-- Connection line -->
    <line x1="80" y1="100" x2="170" y2="100" class="image" />
  </g>
</svg>