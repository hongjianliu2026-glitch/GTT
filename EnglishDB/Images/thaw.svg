<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ice { fill: #AED6F1; }
      .water { fill: #2E86C1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thaw</text>
  <text x="50" y="120" class="subtitle">[θɔː] v. 融化，解冻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thal- (温暖) + -w (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块冰在温暖的阳光下，"温暖(thal-)"
    <tspan x="50" dy="25">的力量让它开始"融化(thaw)"，变成水。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ice began to thaw as the sun rose higher.
  </text>
  <text x="50" y="310" class="content">
    随着太阳升得更高，冰开始融化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice block -->
    <rect x="0" y="0" width="150" height="150" class="ice" />
    <!-- Water droplets -->
    <circle cx="200" cy="50" r="20" class="water" />
    <circle cx="220" cy="80" r="20" class="water" />
    <circle cx="240" cy="110" r="20" class="water" />
    <circle cx="260" cy="140" r="20" class="water" />
    <!-- Sun -->
    <circle cx="350" cy="75" r="50" class="image" fill="#F1C40F" />
    <!-- Sun rays -->
    <line x1="350" y1="25" x2="350" y2="0" class="image" />
    <line x1="400" y1="75" x2="450" y2="75" class="image" />
    <line x1="350" y1="125" x2="350" y2="150" class="image" />
    <line x1="300" y1="75" x2="250" y2="75" class="image" />
  </g>
</svg>