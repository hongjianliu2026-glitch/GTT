<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">strap</text>
  <text x="50" y="120" class="subtitle">[stræp] n. 带子，皮带；v. 用带子捆扎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> str- (拉，拉紧) + ap (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅行者用"拉紧的工具(str-ap)"
    <tspan x="50" dy="25">将行李牢牢地捆扎在背上，这个工具就是带子(strap)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a strap to secure her bag on her shoulder.
  </text>
  <text x="50" y="310" class="content">
    她用一条带子将包固定在肩上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bag -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Strap -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Traveler -->
    <circle cx="100" cy="270" r="20" class="image" />
    <line x1="100" y1="290" x2="100" y2="350" class="image" />
    <line x1="100" y1="350" x2="80" y2="380" class="image" />
    <line x1="100" y1="350" x2="120" y2="380" class="image" />
    <line x1="100" y1="320" x2="140" y2="310" class="image" />
  </g>
</svg>