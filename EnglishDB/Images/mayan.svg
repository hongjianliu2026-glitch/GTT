<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Mayan</text>
  <text x="50" y="120" class="subtitle">[ˈmaɪən] adj. 玛雅的；n. 玛雅人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Mayan (源自玛雅文明)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的玛雅金字塔，"玛雅人(Mayan)"
    <tspan x="50" dy="25">在金字塔前举行神秘的仪式，象征着他们的文化和历史。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Mayan civilization is famous for its advanced architecture.
  </text>
  <text x="50" y="310" class="content">
    玛雅文明以其先进的建筑而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pyramid -->
    <polygon points="100,0 200,0 150,100" class="image" />
    <polygon points="110,20 190,20 150,120" class="image" />
    <polygon points="120,40 180,40 150,140" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="150" r="30" class="image" />
    <!-- People -->
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="200" cy="180" r="10" class="image" />
    <line x1="100" y1="190" x2="100" y2="220" class="image" />
    <line x1="200" y1="190" x2="200" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
  </g>
</svg>