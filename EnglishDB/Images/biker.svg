<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">biker</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪkər] n. 骑自行车的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bike (自行车) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骑自行车的人(biker)，他骑着自行车在山路上飞驰，
    <tspan x="50" dy="25">风吹过他的脸庞，他享受着自由和速度的快感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The biker rode through the forest with ease.
  </text>
  <text x="50" y="310" class="content">
    那个骑自行车的人轻松地穿过了森林。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="80" y2="20" class="image" />
    <line x1="100" y1="50" x2="120" y2="20" class="image" />
    <!-- Biker -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="70" y2="170" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>