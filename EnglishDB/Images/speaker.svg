<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">speaker</text>
  <text x="50" y="120" class="subtitle">[ˈspiːkər] n. 演讲者，扬声器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> speak (说话) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的扬声器，"说话者(speaker)"站在前面，
    <tspan x="50" dy="25">声音从扬声器中传出，震撼全场。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The speaker's voice was amplified by the microphone.
  </text>
  <text x="50" y="310" class="content">
    演讲者的声音通过麦克风放大了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Speaker -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Mouth -->
    <circle cx="75" cy="100" r="20" class="image" />
    <!-- Sound waves -->
    <line x1="75" y1="120" x2="75" y2="180" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <line x1="40" y1="160" x2="110" y2="160" class="image" />
    <line x1="30" y1="180" x2="120" y2="180" class="image" />
  </g>
</svg>