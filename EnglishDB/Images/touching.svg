<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">touching</text>
  <text x="50" y="120" class="subtitle">[ˈtʌtʃɪŋ] adj. 感人的，动人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> touch (接触) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人轻轻地"接触(touch)"你的心，
    <tspan x="50" dy="25">这种温柔的触碰让你感动(touching)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie had a touching ending.
  </text>
  <text x="50" y="310" class="content">
    这部电影有一个感人的结局。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 C10 10 30 10 30 30 S50 50 30 70 S10 50 10 30" class="image" />
    <!-- Hand touching heart -->
    <line x1="60" y1="40" x2="30" y2="50" class="image" />
    <line x1="60" y1="40" x2="60" y2="60" class="image" />
    <line x1="60" y1="60" x2="50" y2="70" class="image" />
    <line x1="60" y1="60" x2="70" y2="70" class="image" />
  </g>
</svg>