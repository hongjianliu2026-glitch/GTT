<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">balloon</text>
  <text x="50" y="120" class="subtitle">[bəˈluːn] n. 气球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ball (球) + -oon (表示“大”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的球(ball)在天空中飘浮，
    <tspan x="50" dy="25">这个球变得越来越大(balloon)，直到它变成了一个气球。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were delighted by the colorful balloons at the party.
  </text>
  <text x="50" y="310" class="content">
    孩子们对派对上五颜六色的气球感到非常高兴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" fill="#FF5733" />
    <!-- String -->
    <line x1="100" y1="150" x2="100" y2="250" stroke="#34495E" stroke-width="2" />
    <!-- Air inside -->
    <circle cx="100" cy="100" r="40" fill="#FFC300" opacity="0.5" />
  </g>
</svg>