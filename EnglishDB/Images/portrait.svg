<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">portrait</text>
  <text x="50" y="120" class="subtitle">[ˈpɔːrtrət] n. 肖像，画像</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> port (携带) + -rait (拉丁语“写”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位艺术家在画布上“携带(port)”着一个人的形象，
    <tspan x="50" dy="25">这个形象就是一幅肖像(portrait)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She commissioned a portrait of her family.
  </text>
  <text x="50" y="310" class="content">
    她委托画了一幅她家人的肖像。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Canvas -->
    <rect x="0" y="0" width="300" height="400" class="image" />
    <!-- Face -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Eyes -->
    <circle cx="110" cy="120" r="15" class="image" />
    <circle cx="190" cy="120" r="15" class="image" />
    <!-- Nose -->
    <line x1="150" y1="140" x2="150" y2="200" class="image" />
    <!-- Mouth -->
    <path d="M110,230 Q150,250 190,230" class="image" />
  </g>
</svg>