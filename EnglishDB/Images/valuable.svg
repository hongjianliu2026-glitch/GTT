<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">valuable</text>
  <text x="50" y="120" class="subtitle">[ˈvæljuəbl] adj. 有价值的，贵重的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> valu (价值) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宝箱，里面装满了闪闪发光的宝石和金币，
    <tspan x="50" dy="25">"价值(valu)"非凡，让人无法忽视，这就是"有价值的(valuable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The antique vase is a valuable piece of art.
  </text>
  <text x="50" y="310" class="content">
    这个古董花瓶是一件有价值的艺术品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Gems -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="120" r="25" class="image" />
    <circle cx="200" cy="80" r="30" class="image" />
    <!-- Coins -->
    <circle cx="250" cy="150" r="15" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
  </g>
</svg>