<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Yiddish</text>
  <text x="50" y="120" class="subtitle">[ˈjɪdɪʃ] n. 意第绪语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Yid (犹太人) + -ish (表示语言)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个犹太人(Yid)在用一种独特的语言(-ish)
    <tspan x="50" dy="25">交流，这种语言就是意第绪语(Yiddish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent Yiddish with her grandparents.
  </text>
  <text x="50" y="310" class="content">
    她能用流利的意第绪语和祖父母交流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star of David -->
    <polygon points="100,20 130,90 200,100 150,150 160,220 100,180 40,220 50,150 0,100 70,90" class="image" />
    <!-- Speech bubble -->
    <path d="M 150 50 Q 250 50 250 150 Q 250 250 150 250 Q 100 250 100 200 L 50 200" class="image" />
    <!-- Text in speech bubble -->
    <text x="160" y="120" class="content">Yiddish</text>
  </g>
</svg>