<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sloping</text>
  <text x="50" y="120" class="subtitle">[ˈsloʊpɪŋ] adj. 倾斜的，有坡度的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slop (滑) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的滑梯，"滑(slop)"
    <tspan x="50" dy="25">下来的时候，整个滑梯都是倾斜的(sloping)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roof of the house has a sloping design.
  </text>
  <text x="50" y="310" class="content">
    房子的屋顶设计成倾斜的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sloping roof -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="350" y1="0" x2="350" y2="200" class="image" />
    <!-- House base -->
    <rect x="100" y="200" width="150" height="100" class="image" />
    <!-- Window -->
    <rect x="130" y="230" width="50" height="40" class="image" />
    <!-- Door -->
    <rect x="190" y="230" width="30" height="70" class="image" />
  </g>
</svg>