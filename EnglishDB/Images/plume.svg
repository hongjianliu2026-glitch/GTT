<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plume</text>
  <text x="50" y="120" class="subtitle">[pluːm] n. 羽毛，羽饰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plu- (羽毛) + me (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只孔雀展开它那华丽的尾巴，"羽毛(plu-)"
    <tspan x="50" dy="25">在阳光下闪闪发光，就像一件精美的羽饰(plume)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a hat adorned with a large plume.
  </text>
  <text x="50" y="310" class="content">
    她戴了一顶装饰着大羽毛的帽子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Feather -->
    <path d="M50,50 C60,20 140,20 150,50 S240,80 250,50' class="image" />
    <path d='M50,50 L150,50 L250,50' class="image" />
    <path d='M50,50 L100,100 L150,50' class="image" />
    <path d='M150,50 L200,100 L250,50' class="image" />
    <!-- Peacock -->
    <circle cx="150" cy="150" r="30" class="image" />
    <line x1="150" y1="180" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="120" y2="300" class="image" />
    <line x1="150" y1="250" x2="180" y2="300" class="image" />
    <line x1="150" y1="200" x2="100" y2="220" class="image" />
    <line x1="150" y1="200" x2="200" y2="220" class="image" />
  </g>
</svg>