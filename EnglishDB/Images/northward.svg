<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">northward</text>
  <text x="50" y="120" class="subtitle">[ˈnɔːrθwərd] adv. 向北；adj. 向北的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> north (北) + -ward (向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地球上，面朝北方，"向北(north-ward)"
    <tspan x="50" dy="25">走去，他的方向就是向北的(northward)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship sailed northward to reach the Arctic.
  </text>
  <text x="50" y="310" class="content">
    船向北航行，到达了北极。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- North arrow -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <polygon points="175,20 165,40 185,40" class="image" />
    <!-- Person -->
    <circle cx="175" cy="180" r="15" class="image" />
    <line x1="175" y1="195" x2="175" y2="230" class="image" />
    <line x1="175" y1="230" x2="155" y2="260" class="image" />
    <line x1="175" y1="230" x2="195" y2="260" class="image" />
    <line x1="175" y1="210" x2="205" y2="200" class="image" />
  </g>
</svg>