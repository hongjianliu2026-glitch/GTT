<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .burrito { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">burrito</text>
  <text x="50" y="120" class="subtitle">[bəˈriːtoʊ] n. 墨西哥卷饼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自西班牙语 "burrito"，意为“小驴”，
    <tspan x="50" dy="25">因为卷饼形状像驴子背上的包裹。</tspan>
  </text>

  <!-- Story -->
  <text x="50" y="230" class="story">
    想象一头小驴(burrito)背上驮着一个巨大的墨西哥卷饼，
    <tspan x="50" dy="25">卷饼里塞满了各种美味的馅料，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> I had a delicious chicken burrito for lunch.
  </text>
  <text x="50" y="330" class="content">
    我午餐吃了一个美味的鸡肉墨西哥卷饼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Burrito -->
    <rect x="0" y="0" width="300" height="100" class="burrito" />
    <!-- Filling -->
    <rect x="20" y="20" width="260" height="60" class="burrito" />
    <!-- Little donkey -->
    <circle cx="20" cy="150" r="20" class="image" />
    <line x1="20" y1="170" x2="20" y2="220" class="image" />
    <line x1="20" y1="220" x2="0" y2="250" class="image" />
    <line x1="20" y1="220" x2="40" y2="250" class="image" />
    <line x1="20" y1="200" x2="50" y2="190" class="image" />
    <!-- Burrito on donkey -->
    <rect x="0" y="120" width="100" height="30" class="burrito" />
  </g>
</svg>