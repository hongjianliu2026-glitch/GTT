<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crew</text>
  <text x="50" y="120" class="subtitle">[kruː] n. 全体船员，全体工作人员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cre- (生长) + w (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船上，"生长(cre-)"
    <tspan x="50" dy="25">出各种工作人员，他们共同"工作(w)"</tspan>
    <tspan x="50" dy="25">构成了一个团队(crew)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crew worked together to navigate the ship through the storm.
  </text>
  <text x="50" y="310" class="content">
    船员们齐心协力，驾驶船只穿越风暴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 175,200 75,200" class="image" />
    <!-- Crew members -->
    <circle cx="70" cy="150" r="15" class="image" />
    <line x1="70" y1="165" x2="70" y2="190" class="image" />
    <line x1="70" y1="190" x2="55" y2="210" class="image" />
    <line x1="70" y1="190" x2="85" y2="210" class="image" />
    <line x1="70" y1="175" x2="100" y2="165" class="image" />

    <circle cx="120" cy="150" r="15" class="image" />
    <line x1="120" y1="165" x2="120" y2="190" class="image" />
    <line x1="120" y1="190" x2="105" y2="210" class="image" />
    <line x1="120" y1="190" x2="135" y2="210" class="image" />
    <line x1="120" y1="175" x2="150" y2="165" class="image" />

    <circle cx="170" cy="150" r="15" class="image" />
    <line x1="170" y1="165" x2="170" y2="190" class="image" />
    <line x1="170" y1="190" x2="155" y2="210" class="image" />
    <line x1="170" y1="190" x2="185" y2="210" class="image" />
    <line x1="170" y1="175" x2="200" y2="165" class="image" />
  </g>
</svg>