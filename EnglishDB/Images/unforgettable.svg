<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unforgettable</text>
  <text x="50" y="120" class="subtitle">[ˌʌn fərˈɡet ə bəl] adj. 难忘的，不可磨灭的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + forget (忘记) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个记忆大师，他手中拿着一个巨大的锁链，锁链上挂满了闪闪发光的记忆宝石。
    <tspan x="50" dy="25">这些宝石代表着那些"不可忘记(un-forget-able)"的瞬间，它们永远闪耀在他的记忆中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concert was an unforgettable experience.
  </text>
  <text x="50" y="310" class="content">
    那场音乐会是一次难忘的经历。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Memory master -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Chain -->
    <line x1="20" y1="150" x2="200" y2="150" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="80" cy="150" r="10" class="image" />
    <circle cx="110" cy="150" r="10" class="image" />
    <circle cx="140" cy="150" r="10" class="image" />
    <circle cx="170" cy="150" r="10" class="image" />
    <!-- Glowing gems -->
    <circle cx="50" cy="150" r="8" fill="#FFD700" />
    <circle cx="80" cy="150" r="8" fill="#FFD700" />
    <circle cx="110" cy="150" r="8" fill="#FFD700" />
    <circle cx="140" cy="150" r="8" fill="#FFD700" />
    <circle cx="170" cy="150" r="8" fill="#FFD700" />
  </g>
</svg>