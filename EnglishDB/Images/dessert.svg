<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .dessert { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dessert</text>
  <text x="50" y="120" class="subtitle">[dɪˈzɜːrt] n. 甜点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + sert (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一顿丰盛的晚餐后，"离开(de-)"
    <tspan x="50" dy="25">主菜，"放置(sert)"上甜美的甜点(dessert)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ordered a chocolate cake for dessert.
  </text>
  <text x="50" y="310" class="content">
    她点了一份巧克力蛋糕作为甜点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dessert -->
    <circle cx="175" cy="100" r="50" class="dessert" />
    <!-- Fork -->
    <line x1="250" y1="100" x2="300" y2="100" class="image" />
    <line x1="275" y1="80" x2="275" y2="120" class="image" />
    <!-- Spoon -->
    <line x1="320" y1="100" x2="370" y2="100" class="image" />
    <circle cx="345" cy="100" r="10" class="image" />
  </g>
</svg>