<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sleeping</text>
  <text x="50" y="120" class="subtitle">[ˈsliːpɪŋ] adj. 睡着的，睡眠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sleep (睡眠) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的人躺在床上，"进入睡眠(sleep)"
    <tspan x="50" dy="25">的状态，这就是sleeping(睡着的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby is sleeping peacefully in the crib.
  </text>
  <text x="50" y="310" class="content">
    宝宝在婴儿床里安静地睡着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pillow -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Blanket -->
    <rect x="50" y="70" width="250" height="130" class="image" />
    <!-- Person -->
    <circle cx="175" cy="120" r="30" class="image" />
    <line x1="175" y1="150" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <line x1="175" y1="160" x2="140" y2="150" class="image" />
    <line x1="175" y1="160" x2="210" y2="150" class="image" />
  </g>
</svg>