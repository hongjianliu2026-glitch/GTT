<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shiver</text>
  <text x="50" y="120" class="subtitle">[ˈʃɪvər] v. 颤抖，哆嗦；n. 颤抖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shiv (颤抖) + -er (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在寒冷的冬天，"颤抖(shiv-er)"
    <tspan x="50" dy="25">得像一片树叶在风中摇摆。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt a shiver run down her spine when she heard the strange noise.
  </text>
  <text x="50" y="310" class="content">
    当她听到那个奇怪的声音时，她感到脊背发凉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person shivering -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left arm -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Shivering effect -->
    <line x1="50" y1="120" x2="45" y2="115" class="image" />
    <line x1="50" y1="120" x2="55" y2="115" class="image" />
    <line x1="50" y1="160" x2="45" y2="155" class="image" />
    <line x1="50" y1="160" x2="55" y2="155" class="image" />
  </g>
</svg>