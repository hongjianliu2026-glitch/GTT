<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rebuttal</text>
  <text x="50" y="120" class="subtitle">[rɪˈbʌtl] n. 反驳，辩驳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (反) + but (推) + -al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在法庭上，"反推(re-but)"
    <tspan x="50" dy="25">对方的论点，这就是反驳(rebuttal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His rebuttal was so convincing that the jury changed their minds.
  </text>
  <text x="50" y="310" class="content">
    他的反驳如此有说服力，以至于陪审团改变了主意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />
    <!-- Lawyer -->
    <circle cx="250" cy="50" r="15" class="image" />
    <line x1="250" y1="65" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <line x1="250" y1="80" x2="220" y2="70" class="image" />
    <!-- Speech bubble -->
    <path d="M 220 30 Q 200 10 180 30 Q 160 50 180 70 Q 200 90 220 70 Z" class="image" />
    <text x="190" y="55" class="content" text-anchor="middle">反驳</text>
  </g>
</svg>