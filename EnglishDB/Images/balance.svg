<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">balance</text>
  <text x="50" y="120" class="subtitle">[ˈbæləns] n. 平衡；v. 使平衡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bal (重量) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一根细线上，努力保持"重量(bal)"的"平衡(ance)"，
    <tspan x="50" dy="25">就像在走钢丝一样，这就是balance的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She managed to balance her work and family life.
  </text>
  <text x="50" y="310" class="content">
    她设法平衡了工作和家庭生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance beam -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person on the beam -->
    <circle cx="175" cy="20" r="15" class="image" />
    <line x1="175" y1="35" x2="175" y2="70" class="image" />
    <line x1="175" y1="70" x2="155" y2="100" class="image" />
    <line x1="175" y1="70" x2="195" y2="100" class="image" />
    <line x1="175" y1="50" x2="205" y2="40" class="image" />
  </g>
</svg>