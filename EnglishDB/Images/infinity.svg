<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infinity</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfɪnəti] n. 无限，无穷大</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + fin (结束) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个无尽的宇宙，"不结束(in-fin)"
    <tspan x="50" dy="25">的旅程，象征着无限(infinity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The universe is believed to be infinite.
  </text>
  <text x="50" y="310" class="content">
    人们认为宇宙是无限的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Infinity symbol -->
    <path d="M 0 100 C 50 0, 150 0, 200 100 C 250 200, 350 200, 400 100" class="image" />
    <path d="M 200 100 C 250 0, 350 0, 400 100" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="150" cy="150" r="5" class="image" />
    <circle cx="300" cy="50" r="5" class="image" />
    <circle cx="350" cy="150" r="5" class="image" />
  </g>
</svg>