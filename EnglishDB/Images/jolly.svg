<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jolly</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɒli] adj. 愉快的，快活的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jol (欢乐) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满欢乐(jol)的场景，人们脸上洋溢着笑容，
    <tspan x="50" dy="25">整个氛围都充满了愉快的气息(jolly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The party was so jolly that everyone left with a smile.
  </text>
  <text x="50" y="310" class="content">
    派对非常愉快，每个人都带着笑容离开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Happy face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <circle cx="80" cy="80" r="10" class="image" fill="#2C3E50" />
    <circle cx="120" cy="80" r="10" class="image" fill="#2C3E50" />
    <path d="M80 120 Q100 140 120 120" class="image" fill="none" stroke="#2C3E50" stroke-width="5" />

    <!-- People -->
    <circle cx="200" cy="100" r="20" class="image" fill="#2ECC71" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="140" x2="180" y2="120" class="image" />
    <line x1="200" y1="140" x2="220" y2="120" class="image" />
    <line x1="200" y1="160" x2="180" y2="180" class="image" />
    <line x1="200" y1="160" x2="220" y2="180" class="image" />

    <circle cx="250" cy="100" r="20" class="image" fill="#2ECC71" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="140" x2="230" y2="120" class="image" />
    <line x1="250" y1="140" x2="270" y2="120" class="image" />
    <line x1="250" y1="160" x2="230" y2="180" class="image" />
    <line x1="250" y1="160" x2="270" y2="180" class="image" />
  </g>
</svg>