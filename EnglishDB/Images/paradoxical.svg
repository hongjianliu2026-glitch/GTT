<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paradoxical</text>
  <text x="50" y="120" class="subtitle">[ˌpærəˈdɒksɪkl] adj. 自相矛盾的，似是而非的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (旁边) + dox (观点) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两个对立的观点旁边，"旁边(para-)"
    <tspan x="50" dy="25">有两个完全相反的"观点(dox)"，这就是自相矛盾的(paradoxical)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His paradoxical statements left everyone confused.
  </text>
  <text x="50" y="310" class="content">
    他自相矛盾的言论让所有人都感到困惑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two opposing signs -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="120" height="160" class="image" />
    <rect x="200" y="20" width="120" height="160" class="image" />
    <!-- Text on signs -->
    <text x="70" y="100" class="content" text-anchor="middle">YES</text>
    <text x="220" y="100" class="content" text-anchor="middle">NO</text>
    <!-- Person standing between -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>