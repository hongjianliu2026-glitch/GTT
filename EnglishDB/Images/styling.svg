<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">styling</text>
  <text x="50" y="120" class="subtitle">[ˈstaɪlɪŋ] n. 样式，风格化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> style (风格) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个设计师在为一件衣服"进行风格化(styling)"，
    <tspan x="50" dy="25">她用各种装饰和设计元素，让衣服变得独特而有风格。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stylist added some accessories to complete the styling.
  </text>
  <text x="50" y="310" class="content">
    造型师添加了一些配饰来完成造型。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dress form -->
    <rect x="0" y="0" width="150" height="300" class="image" />
    <!-- Accessories -->
    <circle cx="75" cy="50" r="20" class="image" />
    <rect x="50" y="100" width="50" height="50" class="image" />
    <rect x="30" y="180" width="90" height="20" class="image" />
    <!-- Designer -->
    <circle cx="200" cy="150" r="30" class="image" />
    <line x1="200" y1="180" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="170" y2="300" class="image" />
    <line x1="200" y1="250" x2="230" y2="300" class="image" />
    <line x1="200" y1="200" x2="250" y2="180" class="image" />
  </g>
</svg>