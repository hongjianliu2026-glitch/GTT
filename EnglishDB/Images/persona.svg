<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">persona</text>
  <text x="50" y="120" class="subtitle">[pərˈsoʊnə] n. 人物角色，人格面具</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (通过) + son (声音) + -a (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演员在舞台上，"通过声音(per-son)"
    <tspan x="50" dy="25">和表演塑造出一个角色(persona)，这个角色就是他的人格面具。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The actor created a memorable persona for his character.
  </text>
  <text x="50" y="310" class="content">
    这位演员为他扮演的角色创造了一个令人难忘的人物形象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actor -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="140" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
    <line x1="175" y1="180" x2="145" y2="200" class="image" />
    <line x1="175" y1="180" x2="205" y2="200" class="image" />
    <!-- Mask -->
    <rect x="145" y="70" width="60" height="30" class="image" />
    <line x1="145" y1="85" x2="205" y2="85" class="image" />
    <line x1="145" y1="100" x2="205" y2="100" class="image" />
  </g>
</svg>