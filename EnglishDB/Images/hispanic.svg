<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Hispanic</text>
  <text x="50" y="120" class="subtitle">[hɪˈspænɪk] adj. 西班牙的，西班牙语的；n. 西班牙裔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hispa (西班牙) + -nic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个西班牙人(hispa)，他穿着传统的西班牙服装，
    <tspan x="50" dy="25">戴着宽边帽，手里拿着吉他，正在热情地弹奏弗拉门戈音乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Hispanic community celebrates their culture with vibrant festivals.
  </text>
  <text x="50" y="310" class="content">
    西班牙裔社区通过充满活力的节日庆祝他们的文化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spanish hat -->
    <path d="M50 20 L90 20 Q100 0 110 20 L150 20" class="image" />
    <!-- Face -->
    <circle cx="100" cy="50" r="20" class="image" />
    <!-- Body -->
    <line x1="100" y1="70" x2="100" y2="120" class="image" />
    <!-- Guitar -->
    <rect x="70" y="120" width="60" height="30" class="image" />
    <line x1="75" y1="125" x2="125" y2="125" class="image" />
    <line x1="75" y1="130" x2="125" y2="130" class="image" />
    <line x1="75" y1="135" x2="125" y2="135" class="image" />
    <line x1="75" y1="140" x2="125" y2="140" class="image" />
  </g>
</svg>