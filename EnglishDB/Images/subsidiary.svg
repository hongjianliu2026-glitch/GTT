<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subsidiary</text>
  <text x="50" y="120" class="subtitle">[səbˈsɪdiəri] adj. 辅助的，附属的；n. 子公司</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + sid (坐) + -iary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大公司下面"坐着(sub-sid)"一个小公司，这个小公司就是大公司的
    <tspan x="50" dy="25">附属(subsidiary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The subsidiary company operates independently.
  </text>
  <text x="50" y="310" class="content">
    这家子公司独立运营。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main company -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <text x="20" y="30" class="content">Main Co.</text>
    <!-- Subsidiary company -->
    <rect x="50" y="100" width="100" height="50" class="image" />
    <text x="60" y="130" class="content">Sub Co.</text>
    <!-- Arrow -->
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <polygon points="95,50 105,50 100,40" class="image" />
  </g>
</svg>