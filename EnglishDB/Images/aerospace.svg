<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aerospace</text>
  <text x="50" y="120" class="subtitle">[ˈɛroʊspeɪs] n. 航空航天</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aero- (空气) + space (空间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机在广阔的"空气空间(aero-space)"中翱翔，
    <tspan x="50" dy="25">探索未知的领域，这就是航空航天(aerospace)的壮丽景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aerospace industry is rapidly advancing.
  </text>
  <text x="50" y="310" class="content">
    航空航天工业正在迅速发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="70" y2="30" class="image" />
    <line x1="50" y1="50" x2="70" y2="70" class="image" />
    <line x1="150" y1="50" x2="130" y2="30" class="image" />
    <line x1="150" y1="50" x2="130" y2="70" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <ellipse cx="250" cy="120" rx="60" ry="35" class="image" />
  </g>
</svg>