<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">generously</text>
  <text x="50" y="120" class="subtitle">[ˈdʒenərəsli] adv. 慷慨地，大方地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen (产生) + er (人) + ous (形容词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"产生(gen)"财富的人，"慷慨地(generously)"
    <tspan x="50" dy="25">将财富分给他人，就像一个慷慨的国王。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He donated money generously to the charity.
  </text>
  <text x="50" y="310" class="content">
    他慷慨地向慈善机构捐款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- King -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Crown -->
    <polygon points="30,80 70,80 50,50" class="image" />
    <!-- Money -->
    <rect x="100" y="100" width="50" height="30" class="image" />
    <rect x="160" y="100" width="50" height="30" class="image" />
    <rect x="220" y="100" width="50" height="30" class="image" />
    <!-- Hand giving money -->
    <line x1="50" y1="200" x2="125" y2="115" class="image" />
  </g>
</svg>