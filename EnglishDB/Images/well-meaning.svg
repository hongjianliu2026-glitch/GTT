<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">well-meaning</text>
  <text x="50" y="120" class="subtitle">[ˌwɛlˈminɪŋ] adj. 善意的，好心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> well (好) + meaning (意图)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个好心人(well)，他的意图(meaning)总是善良的，
    <tspan x="50" dy="25">即使有时他的行为可能不那么完美。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her well-meaning advice sometimes comes across as intrusive.
  </text>
  <text x="50" y="310" class="content">
    她善意的建议有时显得有些冒犯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <!-- Smiling face -->
    <circle cx="40" cy="50" r="15" class="image" />
    <circle cx="30" cy="45" r="2" class="image" />
    <circle cx="50" cy="45" r="2" class="image" />
    <path d="M30 60 Q40 70 50 60" class="image" />
  </g>
</svg>