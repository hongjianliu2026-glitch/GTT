<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">precariously</text>
  <text x="50" y="120" class="subtitle">[prɪˈkɛəriəsli] adv. 不稳定地，危险地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (前面) + car (车) + -i- + -ous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在悬崖边上，"前面(pre-)"就是深渊，
    <tspan x="50" dy="25">这辆车"不稳定地(precariously)"行驶，随时可能坠落。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vase was placed precariously on the edge of the table.
  </text>
  <text x="50" y="310" class="content">
    花瓶被危险地放在桌子的边缘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="150" y="100" width="50" height="30" class="image" />
    <!-- Wheels -->
    <circle cx="160" cy="130" r="5" class="image" />
    <circle cx="190" cy="130" r="5" class="image" />
    <!-- Cliff edge -->
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
    <!-- Drop shadow -->
    <line x1="150" y1="150" x2="175" y2="175" class="image" />
    <line x1="200" y1="150" x2="175" y2="175" class="image" />
  </g>
</svg>