<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">project</text>
  <text x="50" y="120" class="subtitle">[ˈprɒdʒɛkt] n. 项目，计划；v. 投射，规划</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + ject (投掷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个建筑师在规划一个大型项目，"向前投掷(pro-ject)"
    <tspan x="50" dy="25">他的想法，这些想法就构成了一个项目(project)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They are working on a new project to build a bridge.
  </text>
  <text x="50" y="310" class="content">
    他们正在为一个建造桥梁的新项目工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blueprint -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Architect -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Projector -->
    <line x1="200" y1="10" x2="200" y2="190" class="image" />
    <line x1="200" y1="10" x2="180" y2="30" class="image" />
    <line x1="200" y1="10" x2="220" y2="30" class="image" />
    <line x1="200" y1="190" x2="180" y2="170" class="image" />
    <line x1="200" y1="190" x2="220" y2="170" class="image" />
  </g>
</svg>