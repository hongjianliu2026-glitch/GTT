<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eclipse</text>
  <text x="50" y="120" class="subtitle">[ɪˈklɪps] n. 日食，月食；v. 使黯然失色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + clipeus (盾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的盾牌("clipeus")从天而降，"遮蔽(e-clipse)"
    <tspan x="50" dy="25">了太阳，形成了日食(eclipse)的壮观景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The eclipse was a breathtaking natural phenomenon.
  </text>
  <text x="50" y="310" class="content">
    日食是一种令人叹为观止的自然现象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Shield -->
    <rect x="50" y="50" width="100" height="100" class="image" fill="#8B4513" />
    <!-- Moon -->
    <circle cx="100" cy="100" r="30" class="image" fill="#D3D3D3" />
    <!-- Shadow -->
    <rect x="50" y="50" width="100" height="100" class="image" fill="#000000" opacity="0.5" />
  </g>
</svg>