<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preen</text>
  <text x="50" y="120" class="subtitle">[priːn] v. 整理羽毛，打扮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鸟在"提前(pre-)"
    <tspan x="50" dy="25">整理(en)自己的羽毛，</tspan>
    <tspan x="50" dy="25">它正在精心打扮(preen)自己。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The peacock preened its feathers to attract a mate.
  </text>
  <text x="50" y="310" class="content">
    孔雀整理羽毛以吸引配偶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bird -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="180" class="image" />
    <line x1="100" y1="180" x2="150" y2="180" class="image" />
    <!-- Beak -->
    <polygon points="100,100 80,80 120,80" class="image" />
    <!-- Preening action -->
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="150" y2="140" class="image" />
    <line x1="150" y1="140" x2="130" y2="140" class="image" />
  </g>
</svg>