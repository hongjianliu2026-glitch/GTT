<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ice { fill: #AED6F1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glacial</text>
  <text x="50" y="120" class="subtitle">[ˈɡleɪʃl] adj. 冰的，冰川的；极冷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glac- (冰) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的冰川(glac-)，它缓慢地移动，
    <tspan x="50" dy="25">周围的一切都被冰冷的气息所包围，这就是glacial的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The glacial winds made it impossible to stay outside.
  </text>
  <text x="50" y="310" class="content">
    冰冷的寒风让人无法待在户外。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Iceberg -->
    <polygon points="0,150 100,50 200,150" class="ice" />
    <polygon points="100,50 150,0 200,50" class="ice" />
    <!-- Ice shards -->
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="100" y1="150" x2="120" y2="130" class="image" />
    <line x1="150" y1="150" x2="170" y2="130" class="image" />
    <!-- Cold wind -->
    <line x1="0" y1="150" x2="0" y2="100" class="image" />
    <line x1="200" y1="150" x2="200" y2="100" class="image" />
  </g>
</svg>