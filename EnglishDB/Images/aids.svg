<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">AIDS</text>
  <text x="50" y="120" class="subtitle">[eɪdz] n. 艾滋病</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Acquired Immune Deficiency Syndrome
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在实验室里，面对一个象征性的"免疫系统"盾牌，
    <tspan x="50" dy="25">盾牌上有一个大大的裂痕，象征着"免疫缺陷(Deficiency)"。</tspan>
    <tspan x="50" dy="25">这个裂痕是由"获得性(Acquired)"病毒造成的，</tspan>
    <tspan x="50" dy="25">最终导致了一个"综合症(Syndrome)"，即艾滋病(AIDS)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="320" class="content">
    <tspan class="highlight">例句:</tspan> AIDS is a serious global health issue.
  </text>
  <text x="50" y="350" class="content">
    艾滋病是一个严重的全球健康问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Shield -->
    <path d="M50 50 L150 50 L200 100 L150 150 L50 150 Z" class="image" />
    <!-- Crack on shield -->
    <line x1="70" y1="70" x2="180" y2="130" class="image" />
    <!-- Virus -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="120" cy="120" r="15" class="image" />
    <circle cx="80" cy="120" r="15" class="image" />
    <!-- Doctor -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>