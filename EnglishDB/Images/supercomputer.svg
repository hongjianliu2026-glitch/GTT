<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supercomputer</text>
  <text x="50" y="120" class="subtitle">[ˈsuːpərkəmpjuːtər] n. 超级计算机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (超级) + computer (计算机)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台巨大的计算机，"超级(super)"
    <tspan x="50" dy="25">强大到可以处理任何任务，这就是超级计算机(supercomputer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The supercomputer was used to simulate complex weather patterns.
  </text>
  <text x="50" y="310" class="content">
    这台超级计算机被用来模拟复杂的天气模式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Supercomputer -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- CPU -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cooling fans -->
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="160" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="240" cy="100" r="15" class="image" />
    <!-- Lightning bolt -->
    <polygon points="300,20 320,60 280,60 320,100 300,140" class="image" />
  </g>
</svg>