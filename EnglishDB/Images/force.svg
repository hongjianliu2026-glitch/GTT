<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">force</text>
  <text x="50" y="120" class="subtitle">[fɔːrs] n. 力量，武力；v. 强迫，迫使</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (向前) + ce (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用尽全力"向前推(for-ce)"，
    <tspan x="50" dy="25">迫使物体移动，这就是力量的体现(force)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police had to use force to control the crowd.
  </text>
  <text x="50" y="310" class="content">
    警察不得不使用武力来控制人群。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person pushing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Object being pushed -->
    <rect x="100" y="120" width="80" height="60" class="image" />
    <line x1="100" y1="120" x2="180" y2="120" class="image" />
    <line x1="100" y1="180" x2="180" y2="180" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="180" y1="120" x2="180" y2="180" class="image" />
  </g>
</svg>