<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turret</text>
  <text x="50" y="120" class="subtitle">[ˈtʊrɪt] n. 炮塔，塔楼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turr (塔) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座城堡上有一个小小的塔楼(turret)，
    <tspan x="50" dy="25">塔楼上有一个炮手在守护着城堡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tank's turret rotated to face the enemy.
  </text>
  <text x="50" y="310" class="content">
    坦克的炮塔旋转以面对敌人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Castle base -->
    <rect x="0" y="150" width="350" height="100" class="image" />
    <!-- Turret -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <!-- Cannon -->
    <line x1="175" y1="50" x2="175" y2="20" class="image" />
    <line x1="175" y1="20" x2="150" y2="10" class="image" />
    <line x1="175" y1="20" x2="200" y2="10" class="image" />
    <!-- Guard -->
    <circle cx="175" cy="130" r="15" class="image" />
    <line x1="175" y1="145" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="160" x2="200" y2="150" class="image" />
  </g>
</svg>