<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">iteration</text>
  <text x="50" y="120" class="subtitle">[ˌɪtəˈreɪʃn] n. 迭代，重复</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> iter (路，行走) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个程序员在电脑前，"反复行走(iter-ation)"
    <tspan x="50" dy="25">在代码中，每次修改都是一次迭代(iteration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project went through several iterations before reaching its final version.
  </text>
  <text x="50" y="310" class="content">
    这个项目经历了几次迭代才达到最终版本。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Computer screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Code lines -->
    <line x1="50" y1="30" x2="300" y2="30" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="90" x2="300" y2="90" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <!-- Iteration arrows -->
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <polygon points="200,150 190,145 190,155" class="image" />
    <line x1="200" y1="150" x2="250" y2="150" class="image" />
    <polygon points="250,150 240,145 240,155" class="image" />
    <!-- Programmer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>