<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ginger { fill: #D35400; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ginger</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɪndʒər] n. 姜，生姜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "zingiberi"，意为"姜"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，手里拿着一块"姜(ginger)"，
    <tspan x="50" dy="25">准备用它来为菜肴增添独特的辛辣味道。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added ginger to the soup to give it a spicy kick.
  </text>
  <text x="50" y="310" class="content">
    她在汤里加了姜，让它更辛辣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Ginger -->
    <rect x="70" y="90" width="30" height="50" class="ginger" />
    <rect x="80" y="80" width="10" height="10" class="ginger" />
    <rect x="80" y="140" width="10" height="10" class="ginger" />
    <rect x="60" y="110" width="10" height="10" class="ginger" />
    <rect x="90" y="110" width="10" height="10" class="ginger" />
  </g>
</svg>