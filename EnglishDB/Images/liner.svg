<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liner</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪnər] n. 班轮，邮轮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> line (线) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘巨大的邮轮，沿着"线(line)"航行，
    <tspan x="50" dy="25">它就是"liner"，载着乘客穿越海洋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The luxury liner offers a variety of entertainment options.
  </text>
  <text x="50" y="310" class="content">
    这艘豪华邮轮提供了多种娱乐选择。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship body -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Ship deck -->
    <rect x="50" y="20" width="250" height="60" class="image" />
    <!-- Ship windows -->
    <rect x="70" y="40" width="30" height="20" class="image" />
    <rect x="120" y="40" width="30" height="20" class="image" />
    <rect x="170" y="40" width="30" height="20" class="image" />
    <rect x="220" y="40" width="30" height="20" class="image" />
    <!-- Ship mast -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <!-- Ship flag -->
    <line x1="175" y1="0" x2="150" y2="10" class="image" />
    <line x1="175" y1="0" x2="200" y2="10" class="image" />
  </g>
</svg>