<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defendant</text>
  <text x="50" y="120" class="subtitle">[dɪˈfɛndənt] n. 被告</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + fend (打击) + -ant (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法庭场景，"被告(defendant)"站在被告席上，
    <tspan x="50" dy="25">面对指控，他需要"向下打击(de-fend)"这些指控。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The defendant was found not guilty.
  </text>
  <text x="50" y="310" class="content">
    被告被判无罪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Defendant -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Judge -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="110" class="image" />
    <line x1="250" y1="110" x2="230" y2="140" class="image" />
    <line x1="250" y1="110" x2="270" y2="140" class="image" />
    <line x1="250" y1="90" x2="280" y2="80" class="image" />
    <!-- Gavel -->
    <rect x="240" y="30" width="20" height="20" class="image" />
    <line x1="250" y1="30" x2="250" y2="10" class="image" />
  </g>
</svg>