<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">debate</text>
  <text x="50" y="120" class="subtitle">[dɪˈbeɪt] n. 辩论，争论；v. 辩论，争论</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (加强) + bat (打)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在激烈地"打(bat)"嘴仗，
    <tspan x="50" dy="25">他们的话语像子弹一样飞来飞去，这就是辩论(debate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They had a long debate about the new policy.
  </text>
  <text x="50" y="310" class="content">
    他们就新政策进行了长时间的辩论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Debate stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two debaters -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Speech bubbles -->
    <path d="M 50 80 Q 100 50 150 80 Q 100 110 50 80" class="image" />
    <path d="M 300 80 Q 250 50 200 80 Q 250 110 300 80" class="image" />
    <!-- Arrows -->
    <line x1="150" y1="80" x2="200" y2="80" class="image" />
    <line x1="200" y1="80" x2="150" y2="80" class="image" />
  </g>
</svg>