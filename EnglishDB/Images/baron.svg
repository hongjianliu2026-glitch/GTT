<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">baron</text>
  <text x="50" y="120" class="subtitle">[ˈbɛərən] n. 男爵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> baro- (力量) + -on (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拥有强大力量(baro-)的男爵(-on)，
    <tspan x="50" dy="25">他坐在一个巨大的宝座上，周围环绕着他的领地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baron ruled his estate with an iron fist.
  </text>
  <text x="50" y="310" class="content">
    男爵用铁腕统治他的领地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Baron -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="140" x2="125" y2="130" class="image" />
    <line x1="175" y1="140" x2="225" y2="130" class="image" />
  </g>
</svg>