<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lubricant { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lubricant</text>
  <text x="50" y="120" class="subtitle">[ˈluːbrɪkənt] n. 润滑剂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lube (润滑) + -ant (表示物质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆生锈的自行车，"润滑(lube)"
    <tspan x="50" dy="25">剂(ant)被喷洒在链条上，瞬间变得顺畅无比。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Apply lubricant to the gears to reduce friction.
  </text>
  <text x="50" y="310" class="content">
    在齿轮上涂抹润滑剂以减少摩擦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="150" y2="20" class="image" />
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <!-- Lubricant spray -->
    <rect x="200" y="80" width="50" height="40" class="image" />
    <line x1="225" y1="80" x2="225" y2="40" class="image" />
    <line x1="225" y1="40" x2="200" y2="20" class="image" />
    <line x1="225" y1="40" x2="250" y2="20" class="image" />
    <circle cx="225" cy="40" r="10" class="lubricant" />
  </g>
</svg>