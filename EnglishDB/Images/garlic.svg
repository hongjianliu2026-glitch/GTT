<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #873600; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #B03A2E; }
      .story { font: 16px serif; fill: #1A5276; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">garlic</text>
  <text x="50" y="120" class="subtitle">[ˈɡɑrlɪk] n. 大蒜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gar (矛) + lic (黏着)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士用"矛(gar)"刺穿了一颗大蒜，
    <tspan x="50" dy="25">大蒜的强烈气味"黏着(lic)"在他的武器上，</tspan>
    <tspan x="50" dy="25">这就是大蒜(garlic)的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added garlic to the soup to enhance the flavor.
  </text>
  <text x="50" y="310" class="content">
    她在汤里加了大蒜以增强味道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garlic clove -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <ellipse cx="150" cy="100" rx="50" ry="30" class="image" />
    <ellipse cx="200" cy="100" rx="50" ry="30" class="image" />
    <!-- Spear -->
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <line x1="250" y1="50" x2="230" y2="30" class="image" />
    <line x1="250" y1="50" x2="270" y2="30" class="image" />
    <!-- Garlic pierced by spear -->
    <line x1="250" y1="100" x2="150" y2="100" class="image" />
  </g>
</svg>