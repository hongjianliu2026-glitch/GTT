<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hatred</text>
  <text x="50" y="120" class="subtitle">[ˈheɪtrɪd] n. 憎恨，仇恨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hatr (恨) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人心中充满了"恨(hatr)"，这种强烈的情感让他眼中只有"憎恨(hatred)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His hatred for the dictator grew stronger every day.
  </text>
  <text x="50" y="310" class="content">
    他对独裁者的仇恨与日俱增。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart with a dagger -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <!-- Dagger -->
    <line x1="100" y1="100" x2="100" y2="200" class="image" />
    <line x1="80" y1="180" x2="120" y2="180" class="image" />
    <line x1="90" y1="190" x2="110" y2="190" class="image" />
    <line x1="100" y1="200" x2="100" y2="210" class="image" />
  </g>
</svg>