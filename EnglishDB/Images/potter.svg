<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">potter</text>
  <text x="50" y="120" class="subtitle">[ˈpɒtə(r)] n. 陶工；v. 闲逛，漫不经心地做事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pot (壶) + -ter (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个陶工在工作室里，"用手塑造(pot-ter)"
    <tspan x="50" dy="25">各种陶器，他的动作缓慢而随意，就像在闲逛一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The potter was pottering around his workshop.
  </text>
  <text x="50" y="310" class="content">
    陶工在他的工作室里闲逛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pottery wheel -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Pottery -->
    <ellipse cx="100" cy="180" rx="40" ry="20" class="image" />
    <!-- Potter -->
    <circle cx="100" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="140" y2="70" class="image" />
  </g>
</svg>