<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deepest</text>
  <text x="50" y="120" class="subtitle">[ˈdiːpɪst] adj. 最深的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> deep (深) + -est (最高级后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个潜水员潜入海洋的最深处，"最深(deepest)"
    <tspan x="50" dy="25">的地方，那里充满了神秘和未知。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The deepest part of the ocean is called the Mariana Trench.
  </text>
  <text x="50" y="310" class="content">
    海洋最深处被称为马里亚纳海沟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#16A085" />
    <!-- Diver -->
    <circle cx="175" cy="150" r="15" class="image" fill="#E74C3C" />
    <line x1="175" y1="165" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="160" y2="210" class="image" />
    <line x1="175" y1="190" x2="190" y2="210" class="image" />
    <line x1="175" y1="175" x2="200" y2="165" class="image" />
    <!-- Depth -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="48" y1="20" x2="52" y2="20" class="image" />
    <line x1="48" y1="100" x2="52" y2="100" class="image" />
    <line x1="48" y1="180" x2="52" y2="180" class="image" />
    <text x="20" y="100" class="content" text-anchor="end">deepest</text>
  </g>
</svg>