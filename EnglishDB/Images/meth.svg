<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meth</text>
  <text x="50" y="120" class="subtitle">[mɛθ] n. 甲基苯丙胺，冰毒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meth- (甲基)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学实验室里，"甲基(meth-)"
    <tspan x="50" dy="25">被用来制造一种危险的毒品，这种毒品就是甲基苯丙胺(meth)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The use of meth has serious health consequences.
  </text>
  <text x="50" y="310" class="content">
    使用甲基苯丙胺会对健康造成严重后果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chemical flask -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Methyl group -->
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="140" class="image" />
    <line x1="150" y1="140" x2="130" y2="160" class="image" />
    <line x1="150" y1="140" x2="170" y2="160" class="image" />
    <!-- Danger sign -->
    <polygon points="250,100 230,150 270,150" class="image" />
    <text x="240" y="140" class="highlight">!</text>
  </g>
</svg>