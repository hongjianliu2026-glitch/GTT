<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gigantic</text>
  <text x="50" y="120" class="subtitle">[dʒaɪˈɡæntɪk] adj. 巨大的，庞大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gigant (巨人) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨人(gigant)站在城市中，他的身影遮天蔽日，
    <tspan x="50" dy="25">他的存在让一切都显得渺小，这就是gigantic(巨大的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gigantic wave swept away everything in its path.
  </text>
  <text x="50" y="310" class="content">
    巨大的海浪席卷了它路径上的一切。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant -->
    <circle cx="100" cy="100" r="80" class="image" /> <!-- Head -->
    <line x1="100" y1="180" x2="100" y2="300" class="image" /> <!-- Body -->
    <line x1="100" y1="220" x2="20" y2="200" class="image" /> <!-- Left arm -->
    <line x1="100" y1="220" x2="180" y2="200" class="image" /> <!-- Right arm -->
    <line x1="100" y1="300" x2="50" y2="380" class="image" /> <!-- Left leg -->
    <line x1="100" y1="300" x2="150" y2="380" class="image" /> <!-- Right leg -->
    <!-- City skyline -->
    <rect x="0" y="380" width="200" height="20" class="image" />
    <rect x="20" y="360" width="30" height="40" class="image" />
    <rect x="70" y="340" width="30" height="60" class="image" />
    <rect x="120" y="360" width="30" height="40" class="image" />
    <rect x="170" y="340" width="30" height="60" class="image" />
  </g>
</svg>