<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">biopsy</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪɒpsi] n. 活组织检查</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bio- (生命) + -opsy (观察)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位医生拿着显微镜，"观察(opsy)"
    <tspan x="50" dy="25">一小块"生命(bio)"组织，这就是活组织检查(biopsy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor recommended a biopsy to determine the cause of the lump.
  </text>
  <text x="50" y="310" class="content">
    医生建议进行活组织检查以确定肿块的原因。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doctor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Microscope -->
    <rect x="50" y="80" width="100" height="50" class="image" />
    <line x1="100" y1="80" x2="100" y2="30" class="image" />
    <line x1="100" y1="30" x2="120" y2="30" class="image" />
    <line x1="120" y1="30" x2="120" y2="80" class="image" />
    <!-- Tissue sample -->
    <rect x="150" y="90" width="30" height="30" class="image" />
    <line x1="150" y1="90" x2="180" y2="90" class="image" />
    <line x1="150" y1="120" x2="180" y2="120" class="image" />
    <line x1="150" y1="90" x2="150" y2="120" class="image" />
    <line x1="180" y1="90" x2="180" y2="120" class="image" />
  </g>
</svg>