<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">simplistic</text>
  <text x="50" y="120" class="subtitle">[sɪmˈplɪstɪk] adj. 过分简单化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> simpl (简单) + -istic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个复杂的迷宫被简化为一条直线，"过分简单化(simplistic)"
    <tspan x="50" dy="25">的解决方案虽然容易理解，但忽略了问题的复杂性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The article's simplistic view of the issue oversimplified the problem.
  </text>
  <text x="50" y="310" class="content">
    这篇文章对问题的过分简单化观点忽略了问题的复杂性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Complex maze -->
    <path d="M50,50 L100,50 L100,100 L150,100 L150,150 L200,150 L200,200 L250,200 L250,250 L300,250 L300,300 L350,300 L350,350 L400,350 L400,400 L450,400 L450,450 L500,450 L500,500 L550,500 L550,550 L600,550 L600,600" class="image" />
    <!-- Simplified path -->
    <line x1="50" y1="50" x2="600" y2="600" class="image" />
    <!-- Arrow -->
    <polygon points="600,600 580,580 580,620" class="image" />
  </g>
</svg>