<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stark</text>
  <text x="50" y="120" class="subtitle">[stɑrk] adj. 完全的，荒凉的，严酷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sta- (站立) + rk (坚硬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"站立(sta-)"在"坚硬(rk)"的荒凉土地上的人，
    <tspan x="50" dy="25">面对着一片毫无生机的景象，这就是stark的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The landscape was stark and barren.
  </text>
  <text x="50" y="310" class="content">
    这片土地荒凉而贫瘠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person standing -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Barren landscape -->
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <line x1="100" y1="130" x2="300" y2="130" class="image" />
    <line x1="100" y1="160" x2="300" y2="160" class="image" />
  </g>
</svg>