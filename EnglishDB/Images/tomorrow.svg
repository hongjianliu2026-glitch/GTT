<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tomorrow</text>
  <text x="50" y="120" class="subtitle">[təˈmɒroʊ] n. 明天</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> to- (朝向) + morrow (早晨)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在今天，"朝向(to)"
    <tspan x="50" dy="25">明天的"早晨(morrow)"，期待着新的一天。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I will start my new job tomorrow.
  </text>
  <text x="50" y="310" class="content">
    我明天将开始我的新工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person facing forward -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <line x1="50" y1="140" x2="20" y2="130" class="image" />
    <!-- Arrow pointing to the right -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
    <!-- Sun rising -->
    <circle cx="250" cy="100" r="30" class="image" fill="#F1C40F" />
    <line x1="250" y1="70" x2="250" y2="40" class="image" />
    <line x1="270" y1="80" x2="290" y2="60" class="image" />
    <line x1="280" y1="100" x2="300" y2="100" class="image" />
    <line x1="270" y1="120" x2="290" y2="140" class="image" />
    <line x1="250" y1="130" x2="250" y2="160" class="image" />
    <line x1="230" y1="120" x2="210" y2="140" class="image" />
    <line x1="220" y1="100" x2="200" y2="100" class="image" />
    <line x1="230" y1="80" x2="210" y2="60" class="image" />
  </g>
</svg>