<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laden</text>
  <text x="50" y="120" class="subtitle">[ˈleɪdn] adj. 装满的，负重的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lād (负荷) + -en (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的背包，"负荷(lād)"
    <tspan x="50" dy="25">被"使成为(en)"装满的状态，</tspan>
    <tspan x="50" dy="25">这个背包就是"laden"的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The donkey was laden with heavy sacks of grain.
  </text>
  <text x="50" y="310" class="content">
    驴子驮着沉重的谷袋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Backpack -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Loads -->
    <rect x="20" y="20" width="160" height="30" class="image" />
    <rect x="20" y="60" width="160" height="30" class="image" />
    <rect x="20" y="100" width="160" height="30" class="image" />
    <!-- Straps -->
    <line x1="0" y1="0" x2="0" y2="150" class="image" />
    <line x1="200" y1="0" x2="200" y2="150" class="image" />
  </g>
</svg>