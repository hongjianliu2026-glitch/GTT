<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wholesome</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊlsəm] adj. 有益健康的，健康的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whole (完整的) + some (具有...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完整的(whole)苹果，它充满了营养，
    <tspan x="50" dy="25">让人感到健康(some)，这就是wholesome的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Eating wholesome food is essential for a healthy lifestyle.
  </text>
  <text x="50" y="310" class="content">
    吃有益健康的食物对健康的生活方式至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apple -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF4500" />
    <!-- Leaf -->
    <path d="M 100 50 Q 120 30 140 50" class="image" fill="#228B22" />
    <!-- Stem -->
    <line x1="100" y1="50" x2="100" y2="70" class="image" />
  </g>
</svg>