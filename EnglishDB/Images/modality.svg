<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">modality</text>
  <text x="50" y="120" class="subtitle">[moʊˈdælɪti] n. 方式，模式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mod (方式) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个多模式的世界，"方式(mod)"
    <tspan x="50" dy="25">和"模式(modality)"交织在一起，</tspan>
    <tspan x="50" dy="25">形成了一个丰富多彩的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The modality of communication has evolved over time.
  </text>
  <text x="50" y="310" class="content">
    沟通方式随着时间的推移而演变。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Multiple modes -->
    <circle cx="50" cy="50" r="30" class="image" />
    <rect x="100" y="20" width="60" height="60" class="image" />
    <polygon points="200,50 180,20 220,20" class="image" />
    <line x1="280" y1="20" x2="320" y2="60" class="image" />
    <line x1="280" y1="60" x2="320" y2="20" class="image" />
    <!-- Connecting lines -->
    <line x1="80" y1="50" x2="130" y2="50" class="image" />
    <line x1="160" y1="50" x2="210" y2="50" class="image" />
    <line x1="240" y1="50" x2="280" y2="50" class="image" />
  </g>
</svg>