<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">menu</text>
  <text x="50" y="120" class="subtitle">[ˈmenjuː] n. 菜单</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> men- (手) + u (连接字母)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个服务员手里拿着一张"手(men-)"写的菜单，
    <tspan x="50" dy="25">上面列满了各种美食，这就是菜单(menu)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Let's look at the menu before we order.
  </text>
  <text x="50" y="310" class="content">
    我们先看看菜单再点菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Menu -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hand holding the menu -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <line x1="50" y1="160" x2="90" y2="150" class="image" />
    <!-- Menu items -->
    <text x="70" y="50" class="content">Appetizers</text>
    <text x="70" y="80" class="content">Main Course</text>
    <text x="70" y="110" class="content">Desserts</text>
    <text x="70" y="140" class="content">Drinks</text>
  </g>
</svg>