<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outweigh</text>
  <text x="50" y="120" class="subtitle">[ˌaʊtˈweɪ] v. 比...更重要，比...更有价值</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (超过) + weigh (称重)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，一边放着"重要的事情"，另一边放着"不重要的事情"，
    <tspan x="50" dy="25">"重要的事情"超过了(out-) "不重要的事情"的重量(weigh)，</tspan>
    <tspan x="50" dy="25">所以它更重要(outweigh)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The benefits of the new system outweigh its costs.
  </text>
  <text x="50" y="310" class="content">
    新系统的益处超过了它的成本。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="100" y1="50" x2="300" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <!-- Weights -->
    <rect x="120" y="160" width="60" height="60" class="image" />
    <rect x="220" y="160" width="60" height="60" class="image" />
    <!-- Important vs. unimportant -->
    <text x="130" y="200" class="content">重要</text>
    <text x="230" y="200" class="content">不重要</text>
    <!-- Outweigh -->
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <line x1="250" y1="150" x2="250" y2="250" class="image" />
    <text x="190" y="270" class="content">outweigh</text>
  </g>
</svg>