<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nineteenth-century</text>
  <text x="50" y="120" class="subtitle">[ˌnaɪnˈtiːnθ ˈsentʃəri] adj. 19世纪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nineteen (十九) + century (世纪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的钟表，指针指向19世纪，
    <tspan x="50" dy="25">周围是维多利亚时代的建筑和蒸汽火车，</tspan>
    <tspan x="50" dy="25">这就是19世纪的场景(nineteenth-century)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nineteenth-century architecture is still well-preserved.
  </text>
  <text x="50" y="310" class="content">
    19世纪的建筑仍然保存完好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Victorian building -->
    <rect x="200" y="20" width="150" height="160" class="image" />
    <rect x="220" y="40" width="30" height="120" class="image" />
    <rect x="270" y="40" width="30" height="120" class="image" />
    <rect x="320" y="40" width="30" height="120" class="image" />
    <!-- Steam train -->
    <rect x="50" y="200" width="200" height="50" class="image" />
    <rect x="70" y="180" width="160" height="20" class="image" />
    <circle cx="80" cy="250" r="10" class="image" />
    <circle cx="150" cy="250" r="10" class="image" />
    <circle cx="220" cy="250" r="10" class="image" />
  </g>
</svg>