<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arson</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrsən] n. 纵火，放火</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ars (火) + -on (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶作剧者，手持火把，"点燃(ars)"
    <tspan x="50" dy="25">一座房子，这就是纵火(arson)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The suspect was charged with arson.
  </text>
  <text x="50" y="310" class="content">
    嫌疑人被指控犯有纵火罪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="50" y="20" width="200" height="150" class="image" />
    <rect x="100" y="80" width="100" height="90" class="image" />
    <!-- Roof -->
    <polygon points="50,20 250,20 150,0" class="image" />
    <!-- Fire -->
    <circle cx="150" cy="100" r="20" class="fire" />
    <circle cx="160" cy="120" r="15" class="fire" />
    <circle cx="140" cy="120" r="15" class="fire" />
    <!-- Arsonist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Torch -->
    <line x1="20" y1="115" x2="0" y2="100" class="image" />
    <circle cx="0" cy="100" r="5" class="fire" />
  </g>
</svg>