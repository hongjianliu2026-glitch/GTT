<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contractor</text>
  <text x="50" y="120" class="subtitle">[kənˈtræktər] n. 承包商，订约人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + tract (拉) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个承包商在工地上，"共同拉(con-tract)"
    <tspan x="50" dy="25">着各种材料和工具，完成一个大项目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The contractor was hired to build the new bridge.
  </text>
  <text x="50" y="310" class="content">
    承包商被雇佣来建造新桥。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Construction site -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Contractor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Materials -->
    <rect x="70" y="20" width="50" height="50" class="image" />
    <rect x="140" y="20" width="50" height="50" class="image" />
    <rect x="210" y="20" width="50" height="50" class="image" />
    <!-- Tools -->
    <line x1="70" y1="100" x2="120" y2="100" class="image" />
    <line x1="70" y1="100" x2="70" y2="150" class="image" />
    <line x1="140" y1="100" x2="190" y2="100" class="image" />
    <line x1="140" y1="100" x2="140" y2="150" class="image" />
    <line x1="210" y1="100" x2="260" y2="100" class="image" />
    <line x1="210" y1="100" x2="210" y2="150" class="image" />
  </g>
</svg>