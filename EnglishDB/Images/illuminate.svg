<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">illuminate</text>
  <text x="50" y="120" class="subtitle">[ɪˈluːmɪneɪt] v. 照亮，阐明</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> il- (向内) + lumin (光) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一盏灯"向内发光(il-lumin)"，照亮了整个房间，
    <tspan x="50" dy="25">同时也照亮了你的思维，让你理解了复杂的概念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher's explanation illuminated the difficult concept.
  </text>
  <text x="50" y="310" class="content">
    老师的解释阐明了那个难懂的概念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light bulb -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="350" class="image" />
    <line x1="100" y1="250" x2="150" y2="350" class="image" />
    <!-- Rays of light -->
    <line x1="100" y1="50" x2="50" y2="0" class="image" />
    <line x1="100" y1="50" x2="150" y2="0" class="image" />
    <line x1="100" y1="50" x2="0" y2="50" class="image" />
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <!-- Room -->
    <rect x="0" y="250" width="200" height="100" class="image" />
    <!-- Person -->
    <circle cx="150" cy="300" r="15" class="image" />
    <line x1="150" y1="315" x2="150" y2="350" class="image" />
    <line x1="150" y1="350" x2="130" y2="380" class="image" />
    <line x1="150" y1="350" x2="170" y2="380" class="image" />
    <line x1="150" y1="330" x2="180" y2="320" class="image" />
  </g>
</svg>