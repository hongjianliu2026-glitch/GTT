<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">amplify</text>
  <text x="50" y="120" class="subtitle">[ˈæmplɪfaɪ] v. 放大，增强</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ampli- (大) + -fy (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个声音被"放大(ampli-fy)"，从一个微小的声音变成一个巨大的声波，
    <tspan x="50" dy="25">就像一个扩音器将声音放大到整个房间都能听到。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sound engineer amplified the singer's voice.
  </text>
  <text x="50" y="310" class="content">
    音响工程师放大了歌手的声音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small sound wave -->
    <path d="M0,100 Q50,50 100,100 T200,100" class="image" />
    <!-- Large sound wave -->
    <path d="M0,200 Q100,100 200,200 T400,200" class="image" />
    <!-- Amplifier -->
    <rect x="250" y="150" width="100" height="100" class="image" />
    <line x1="300" y1="150" x2="300" y2="50" class="image" />
    <line x1="350" y1="150" x2="350" y2="50" class="image" />
    <!-- Connection lines -->
    <line x1="100" y1="100" x2="250" y2="150" class="image" />
    <line x1="200" y1="200" x2="250" y2="200" class="image" />
  </g>
</svg>