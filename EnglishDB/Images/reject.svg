<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reject</text>
  <text x="50" y="120" class="subtitle">[rɪˈdʒekt] v. 拒绝，排斥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + ject (投掷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在你面前，手里拿着一个礼物，你却"向后投掷(re-ject)"
    <tspan x="50" dy="25">它，表示你拒绝了这份礼物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She rejected his proposal of marriage.
  </text>
  <text x="50" y="310" class="content">
    她拒绝了他的求婚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Gift -->
    <rect x="100" y="90" width="40" height="30" class="image" />
    <line x1="120" y1="120" x2="120" y2="180" class="image" />
    <line x1="120" y1="150" x2="100" y2="130" class="image" />
    <line x1="120" y1="150" x2="140" y2="130" class="image" />
    <line x1="120" y1="180" x2="100" y2="210" class="image" />
    <line x1="120" y1="180" x2="140" y2="210" class="image" />

    <!-- Rejection motion -->
    <line x1="120" y1="120" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="180" y2="30" class="image" />
    <line x1="200" y1="50" x2="220" y2="30" class="image" />
  </g>
</svg>