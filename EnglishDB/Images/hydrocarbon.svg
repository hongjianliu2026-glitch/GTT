<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hydrocarbon</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪdrəʊˈkɑːrbən] n. 碳氢化合物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hydro- (水) + carbon (碳)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水滴(hydro-)，里面充满了闪闪发光的碳(carbon)，
    <tspan x="50" dy="25">这些碳粒子紧密结合，形成了一种神奇的物质——碳氢化合物(hydrocarbon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Petroleum is a complex mixture of hydrocarbons.
  </text>
  <text x="50" y="310" class="content">
    石油是碳氢化合物的复杂混合物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water droplet -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="image" />
    <!-- Carbon atoms -->
    <circle cx="75" cy="100" r="20" class="image" />
    <circle cx="175" cy="50" r="20" class="image" />
    <circle cx="275" cy="100" r="20" class="image" />
    <circle cx="175" cy="150" r="20" class="image" />
    <!-- Bonds -->
    <line x1="95" y1="100" x2="155" y2="100" class="image" />
    <line x1="195" y1="50" x2="255" y2="50" class="image" />
    <line x1="195" y1="150" x2="255" y2="150" class="image" />
    <line x1="175" y1="70" x2="175" y2="130" class="image" />
  </g>
</svg>