<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-contained</text>
  <text x="50" y="120" class="subtitle">[ˌself kənˈteɪnd] adj. 自给自足的，独立的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + contain (包含)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房子，"自己包含(self-contain)"
    <tspan x="50" dy="25">了所有必需品，不需要外界帮助，这就是自给自足(self-contained)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cabin was self-contained, with its own water supply and electricity.
  </text>
  <text x="50" y="310" class="content">
    这个小屋是自给自足的，有自己的水源和电力供应。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Roof -->
    <polygon points="0,0 200,0 100,50" class="image" />
    <!-- Windows -->
    <rect x="30" y="30" width="50" height="50" class="image" />
    <rect x="120" y="30" width="50" height="50" class="image" />
    <!-- Door -->
    <rect x="85" y="80" width="30" height="70" class="image" />
    <!-- Water supply -->
    <circle cx="150" cy="120" r="10" class="image" />
    <line x1="150" y1="130" x2="150" y2="150" class="image" />
    <!-- Electricity -->
    <line x1="10" y1="10" x2="10" y2="150" class="image" />
    <circle cx="10" cy="10" r="5" class="image" />
  </g>
</svg>