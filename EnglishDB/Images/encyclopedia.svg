<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">encyclopedia</text>
  <text x="50" y="120" class="subtitle">[ˌɪŋsaɪkləˈpiːdiə] n. 百科全书</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (在...里面) + cyclo- (圆圈) + paedia (教育)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆圈，里面装满了各种知识，就像一个"圆圈里的教育(cyclo-paedia)"，
    <tspan x="50" dy="25">这就是百科全书(encyclopedia)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found the answer in the encyclopedia.
  </text>
  <text x="50" y="310" class="content">
    她在百科全书中找到了答案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle representing the encyclopedia -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Books -->
    <rect x="100" y="20" width="150" height="160" class="image" />
    <rect x="110" y="30" width="130" height="140" class="image" />
    <rect x="120" y="40" width="110" height="120" class="image" />
    <!-- Knowledge symbols -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
  </g>
</svg>