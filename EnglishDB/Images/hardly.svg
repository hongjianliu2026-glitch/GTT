<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hardly</text>
  <text x="50" y="120" class="subtitle">[ˈhɑrdli] adv. 几乎不，几乎没有</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hard (困难的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在攀登一座极其陡峭的山峰，"几乎无法(hardly)"
    <tspan x="50" dy="25">前进，因为山峰太困难(hard)了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He could hardly walk after the marathon.
  </text>
  <text x="50" y="310" class="content">
    马拉松之后，他几乎走不动了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Person -->
    <circle cx="150" cy="180" r="15" class="image" />
    <line x1="150" y1="195" x2="150" y2="230" class="image" />
    <line x1="150" y1="230" x2="130" y2="260" class="image" />
    <line x1="150" y1="230" x2="170" y2="260" class="image" />
    <line x1="150" y1="210" x2="180" y2="200" class="image" />
  </g>
</svg>