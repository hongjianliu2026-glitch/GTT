<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flier</text>
  <text x="50" y="120" class="subtitle">[ˈflaɪər] n. 飞行物，传单</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fly (飞) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张传单(flier)在空中"飞翔(fly)"，
    <tspan x="50" dy="25">它轻盈地飘落，传递着信息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She handed out fliers to promote the event.
  </text>
  <text x="50" y="310" class="content">
    她分发传单来宣传活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paper plane -->
    <polygon points="50,150 150,150 100,50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <!-- Flier -->
    <rect x="200" y="100" width="150" height="100" class="image" />
    <line x1="220" y1="120" x2="330" y2="120" class="image" />
    <line x1="220" y1="140" x2="330" y2="140" class="image" />
    <line x1="220" y1="160" x2="330" y2="160" class="image" />
    <line x1="220" y1="180" x2="330" y2="180" class="image" />
  </g>
</svg>