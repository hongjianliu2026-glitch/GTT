<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inclusion</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkluːʒn] n. 包含，纳入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + clud (关闭) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的盒子，"把东西关进(in-clud)"
    <tspan x="50" dy="25">去，这个动作就是包含(inclusion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company promotes the inclusion of all employees.
  </text>
  <text x="50" y="310" class="content">
    公司提倡所有员工的包容性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Items inside the box -->
    <circle cx="50" cy="100" r="20" class="image" />
    <rect x="100" y="80" width="40" height="40" class="image" />
    <line x1="180" y1="80" x2="220" y2="120" class="image" />
    <line x1="220" y1="120" x2="180" y2="160" class="image" />
    <line x1="180" y1="160" x2="220" y2="200" class="image" />
    <!-- Arrow pointing to the box -->
    <line x1="300" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,100 240,95 240,105" class="image" />
  </g>
</svg>