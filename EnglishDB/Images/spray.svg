<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spray</text>
  <text x="50" y="120" class="subtitle">[spreɪ] n. 喷雾，喷洒；v. 喷射，喷洒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sp- (散开) + ray (光线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个喷雾器，"散开(sp-)"
    <tspan x="50" dy="25">的光线(ray)，就像喷雾(spray)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sprayed the perfume on her wrists.
  </text>
  <text x="50" y="310" class="content">
    她在手腕上喷了香水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spray bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <!-- Spray lines -->
    <line x1="50" y1="20" x2="30" y2="0" class="image" />
    <line x1="50" y1="20" x2="70" y2="0" class="image" />
    <line x1="50" y1="40" x2="30" y2="20" class="image" />
    <line x1="50" y1="40" x2="70" y2="20" class="image" />
    <line x1="50" y1="60" x2="30" y2="40" class="image" />
    <line x1="50" y1="60" x2="70" y2="40" class="image" />
    <line x1="50" y1="80" x2="30" y2="60" class="image" />
    <line x1="50" y1="80" x2="70" y2="60" class="image" />
    <line x1="50" y1="100" x2="30" y2="80" class="image" />
    <line x1="50" y1="100" x2="70" y2="80" class="image" />
    <line x1="50" y1="120" x2="30" y2="100" class="image" />
    <line x1="50" y1="120" x2="70" y2="100" class="image" />
    <line x1="50" y1="140" x2="30" y2="120" class="image" />
    <line x1="50" y1="140" x2="70" y2="120" class="image" />
    <line x1="50" y1="160" x2="30" y2="140" class="image" />
    <line x1="50" y1="160" x2="70" y2="140" class="image" />
  </g>
</svg>