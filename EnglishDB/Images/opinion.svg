<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">opinion</text>
  <text x="50" y="120" class="subtitle">[əˈpɪnjən] n. 意见，看法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> op- (对面) + inio (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，"互相看着(op-inio)"
    <tspan x="50" dy="25">对方的观点，这就是意见(opinion)的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> What's your opinion on this matter?
  </text>
  <text x="50" y="310" class="content">
    你对这件事有什么看法？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <!-- Speech bubbles -->
    <path d="M50 130 Q30 150 50 170 Q70 150 50 130" class="image" />
    <path d="M250 130 Q230 150 250 170 Q270 150 250 130" class="image" />
    <!-- Text in speech bubbles -->
    <text x="40" y="160" class="content">观点1</text>
    <text x="240" y="160" class="content">观点2</text>
  </g>
</svg>