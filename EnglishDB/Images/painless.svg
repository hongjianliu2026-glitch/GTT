<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">painless</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪnlɪs] adj. 无痛的，无痛苦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pain (痛苦) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生拿着一个"无痛(painless)"的注射器，
    <tspan x="50" dy="25">病人脸上露出轻松的笑容，完全没有痛苦的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dentist used a painless technique to remove the tooth.
  </text>
  <text x="50" y="310" class="content">
    牙医用了一种无痛的技术来拔牙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doctor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Syringe -->
    <rect x="50" y="90" width="20" height="60" class="image" />
    <rect x="55" y="85" width="10" height="10" class="image" />
    <!-- Patient -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="170" y2="120" class="image" />
    <!-- Smile -->
    <path d="M110,110 Q120,105 130,110" class="image" />
    <path d="M110,115 Q120,120 130,115" class="image" />
  </g>
</svg>