<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suspiciously</text>
  <text x="50" y="120" class="subtitle">[səˈspɪʃəsli] adv. 可疑地，怀疑地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sus- (在下面) + pic (看) + -ious (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人偷偷摸摸地"在下面看(sus-pic)"，
    <tspan x="50" dy="25">他的行为让人感到非常可疑(suspiciously)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He looked at me suspiciously when I entered the room.
  </text>
  <text x="50" y="310" class="content">
    当我进入房间时，他怀疑地看着我。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person looking suspiciously -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="90" x2="30" y2="80" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="70" y2="80" class="image" /> <!-- Right arm -->
    <line x1="50" y1="120" x2="30" y2="150" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="150" class="image" /> <!-- Right leg -->
    <!-- Eyes -->
    <circle cx="40" cy="45" r="3" class="image" />
    <circle cx="60" cy="45" r="3" class="image" />
    <!-- Suspicious look -->
    <line x1="30" y1="30" x2="70" y2="30" class="image" />
    <line x1="30" y1="30" x2="40" y2="20" class="image" />
    <line x1="70" y1="30" x2="60" y2="20" class="image" />
  </g>
</svg>