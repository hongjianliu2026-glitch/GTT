<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">baffling</text>
  <text x="50" y="120" class="subtitle">[ˈbæfəlɪŋ] adj. 令人困惑的，费解的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> baff (阻碍) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个迷宫，"阻碍(baff)"了你的前进，
    <tspan x="50" dy="25">你感到困惑和费解(baffling)，无法找到出口。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructions were so baffling that no one could follow them.
  </text>
  <text x="50" y="310" class="content">
    这些指示如此令人困惑，以至于没有人能理解它们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Maze -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="150" y="20" width="50" height="160" class="image" />
    <rect x="250" y="20" width="50" height="160" class="image" />
    <rect x="100" y="20" width="50" height="160" class="image" />
    <rect x="200" y="20" width="50" height="160" class="image" />
    <rect x="100" y="20" width="150" height="50" class="image" />
    <rect x="100" y="130" width="150" height="50" class="image" />
    <!-- Person -->
    <circle cx="75" cy="70" r="15" class="image" />
    <line x1="75" y1="85" x2="75" y2="120" class="image" />
    <line x1="75" y1="120" x2="60" y2="150" class="image" />
    <line x1="75" y1="120" x2="90" y2="150" class="image" />
    <line x1="75" y1="100" x2="100" y2="90" class="image" />
  </g>
</svg>