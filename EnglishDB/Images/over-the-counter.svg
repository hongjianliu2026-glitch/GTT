<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">over-the-counter</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərðəˈkaʊntər] adj. 非处方的，柜台上的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over (在...之上) + counter (柜台)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个顾客在药店柜台前，"在柜台上(over-the-counter)"
    <tspan x="50" dy="25">直接购买药品，无需处方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You can buy painkillers over-the-counter at any pharmacy.
  </text>
  <text x="50" y="310" class="content">
    你可以在任何药店直接购买止痛药。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Counter -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Customer -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />
    <!-- Medicine -->
    <rect x="200" y="20" width="50" height="60" class="image" />
    <rect x="260" y="20" width="50" height="60" class="image" />
    <rect x="320" y="20" width="50" height="60" class="image" />
  </g>
</svg>