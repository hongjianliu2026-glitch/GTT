<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">column</text>
  <text x="50" y="120" class="subtitle">[ˈkɒləm] n. 柱子，专栏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (共同) + umn (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"共同弯曲(col-umn)"身体，形成了一根柱子(column)，
    <tspan x="50" dy="25">或者在报纸上，一个专栏作者"共同弯曲"笔尖，写出一篇专栏文章。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient temple was supported by massive columns.
  </text>
  <text x="50" y="310" class="content">
    这座古老的寺庙由巨大的柱子支撑着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Column -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- People bending -->
    <circle cx="50" cy="220" r="15" class="image" />
    <line x1="50" y1="235" x2="50" y2="270" class="image" />
    <line x1="50" y1="270" x2="30" y2="300" class="image" />
    <line x1="50" y1="270" x2="70" y2="300" class="image" />
    <line x1="50" y1="250" x2="80" y2="240" class="image" />
  </g>
</svg>