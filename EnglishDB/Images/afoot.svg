<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">afoot</text>
  <text x="50" y="120" class="subtitle">[əˈfʊt] adv. 在进行中，在进行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (在) + foot (脚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人正在"脚上(a-foot)"行走，
    <tspan x="50" dy="25">表示某事正在进行中(afoot)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project is already afoot.
  </text>
  <text x="50" y="310" class="content">
    这个项目已经在进行中了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="140" class="image" /> <!-- Right arm -->
  </g>
</svg>