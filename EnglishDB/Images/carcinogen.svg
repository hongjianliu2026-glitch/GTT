<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carcinogen</text>
  <text x="50" y="120" class="subtitle">[kɑːrˈsɪnədʒən] n. 致癌物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carci- (癌) + -gen (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"癌(carci-)"细胞，它是由某种"产生(gen)"
    <tspan x="50" dy="25">的物质(carcinogen)引发的，这种物质就是致癌物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Smoking is a well-known carcinogen.
  </text>
  <text x="50" y="310" class="content">
    吸烟是一种众所周知的致癌物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cancer cell -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="80" cy="120" r="10" class="image" />
    <circle cx="130" cy="130" r="10" class="image" />
    <circle cx="70" cy="70" r="10" class="image" />
    <!-- Carcinogen -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <text x="220" y="110" class="content" fill="#7F8C8D">carcinogen</text>
    <!-- Arrow -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
  </g>
</svg>