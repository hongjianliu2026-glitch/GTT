<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">genitals</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɛnɪtlz] n. 生殖器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> genit- (生殖) + -als (名词复数后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夸张的画面：一个巨大的生殖器(genitals)
    <tspan x="50" dy="25">像一棵树一样生长，树上挂满了象征生命的果实。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor examined his genitals carefully.
  </text>
  <text x="50" y="310" class="content">
    医生仔细检查了他的生殖器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="150" y="0" width="20" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="160" y1="50" x2="200" y2="20" class="image" />
    <line x1="160" y1="100" x2="220" y2="70" class="image" />
    <line x1="160" y1="150" x2="240" y2="120" class="image" />
    <!-- Fruits -->
    <circle cx="200" cy="20" r="10" class="image" />
    <circle cx="220" cy="70" r="10" class="image" />
    <circle cx="240" cy="120" r="10" class="image" />
    <!-- Genitals -->
    <circle cx="160" cy="220" r="30" class="image" />
    <line x1="160" y1="250" x2="160" y2="300" class="image" />
    <line x1="160" y1="270" x2="130" y2="280" class="image" />
    <line x1="160" y1="270" x2="190" y2="280" class="image" />
  </g>
</svg>