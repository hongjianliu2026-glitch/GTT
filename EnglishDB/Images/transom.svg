<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transom</text>
  <text x="50" y="120" class="subtitle">[ˈtrænzəm] n. 窗顶过梁，横梁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (横跨) + om (梁)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一扇窗户上方，"横跨(trans-)"着一根"梁(om)"，
    <tspan x="50" dy="25">这根梁就是窗顶过梁(transom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The transom above the door allows light to enter the room.
  </text>
  <text x="50" y="310" class="content">
    门上的窗顶过梁让光线进入房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Window frame -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Transom -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <!-- Window panes -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <!-- Light rays -->
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
  </g>
</svg>