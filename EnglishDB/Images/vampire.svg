<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vampire</text>
  <text x="50" y="120" class="subtitle">[ˈvæmpaɪər] n. 吸血鬼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vamp (吸) + ire (行为者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个吸血鬼在夜晚，"吸(vamp)"
    <tspan x="50" dy="25">取血液，这个行为者就是吸血鬼(vampire)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vampire emerged from the coffin at midnight.
  </text>
  <text x="50" y="310" class="content">
    吸血鬼在午夜从棺材中出现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="200" cy="100" r="50" fill="#F1C40F" />
    <!-- Vampire -->
    <circle cx="200" cy="200" r="30" fill="#8E44AD" />
    <line x1="200" y1="230" x2="200" y2="300" class="image" />
    <line x1="200" y1="250" x2="170" y2="280" class="image" />
    <line x1="200" y1="250" x2="230" y2="280" class="image" />
    <line x1="200" y1="300" x2="170" y2="330" class="image" />
    <line x1="200" y1="300" x2="230" y2="330" class="image" />
    <!-- Fangs -->
    <polygon points="190,190 210,190 200,180" fill="#C0392B" />
    <polygon points="200,180 210,190 220,180" fill="#C0392B" />
  </g>
</svg>