<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fourteenth</text>
  <text x="50" y="120" class="subtitle">[ˌfɔːrˈtiːnθ] adj. 第十四的，十四分之一的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> four (四) + teen (十) + th (第...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“14”，它像一座山一样高耸入云，
    <tspan x="50" dy="25">而你正站在它的“第十四(fourteenth)”层，俯瞰着下面的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was the fourteenth person to arrive at the party.
  </text>
  <text x="50" y="310" class="content">
    她是第十四个到达派对的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number "14" -->
    <text x="0" y="100" font-size="200" class="image">14</text>
    <!-- Person standing on the "14" -->
    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />
  </g>
</svg>