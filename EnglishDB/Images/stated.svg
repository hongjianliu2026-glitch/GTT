<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stated</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪtɪd] adj. 陈述的，明确的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> state (状态，陈述) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在讲台上，"陈述(state)"
    <tspan x="50" dy="25">他的观点，他的话是"明确的(stated)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The professor's stated opinion was clear and concise.
  </text>
  <text x="50" y="310" class="content">
    教授陈述的观点清晰而简洁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lectern -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lectern top -->
    <rect x="50" y="20" width="250" height="30" class="image" />
    <!-- Lectern legs -->
    <rect x="70" y="50" width="20" height="150" class="image" />
    <rect x="210" y="50" width="20" height="150" class="image" />
    <!-- Lectern base -->
    <rect x="50" y="200" width="250" height="10" class="image" />
    <!-- Professor -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M200,50 Q250,50 250,100 Q200,100 200,50 Z" class="image" />
    <text x="210" y="80" class="content">观点</text>
  </g>
</svg>