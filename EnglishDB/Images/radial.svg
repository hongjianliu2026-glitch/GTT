<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">radial</text>
  <text x="50" y="120" class="subtitle">[ˈreɪdiəl] adj. 放射状的，半径的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> radia (光线) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个太阳，它的光芒从中心向四周"放射(radia)"，
    <tspan x="50" dy="25">形成了一个放射状的图案，这就是radial的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spider's web was arranged in a radial pattern.
  </text>
  <text x="50" y="310" class="content">
    蜘蛛网呈放射状排列。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="175" cy="100" r="50" class="image" fill="#F39C12" />
    <!-- Rays -->
    <line x1="175" y1="50" x2="175" y2="0" class="image" />
    <line x1="225" y1="50" x2="275" y2="0" class="image" />
    <line x1="225" y1="100" x2="275" y2="100" class="image" />
    <line x1="225" y1="150" x2="275" y2="200" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="125" y1="150" x2="75" y2="200" class="image" />
    <line x1="125" y1="100" x2="75" y2="100" class="image" />
    <line x1="125" y1="50" x2="75" y2="0" class="image" />
  </g>
</svg>