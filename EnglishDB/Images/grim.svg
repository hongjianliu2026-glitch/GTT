<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8B0000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grim</text>
  <text x="50" y="120" class="subtitle">[ɡrɪm] adj. 冷酷的，可怕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gr- (表示“粗糙”或“可怕”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冷酷的(grim)战士，脸上布满
    <tspan x="50" dy="25">粗糙(gr-)的伤痕，眼神冷酷无情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The battlefield was a grim sight, with bodies strewn everywhere.
  </text>
  <text x="50" y="310" class="content">
    战场上一片冷酷的景象，到处都是尸体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grim warrior -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <line x1="50" y1="150" x2="0" y2="140" class="image" />
    <!-- Scars -->
    <line x1="30" y1="90" x2="70" y2="90" class="image" />
    <line x1="30" y1="110" x2="70" y2="110" class="image" />
    <line x1="30" y1="130" x2="70" y2="130" class="image" />
  </g>
</svg>