<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rectify</text>
  <text x="50" y="120" class="subtitle">[ˈrɛktɪˌfaɪ] v. 纠正，改正</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rect- (直) + -ify (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠在调整一个弯曲的木板，"使(ify)"
    <tspan x="50" dy="25">它变直(rect-)，这就是纠正(rectify)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher helped him rectify his mistakes.
  </text>
  <text x="50" y="310" class="content">
    老师帮助他纠正了错误。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bent wood -->
    <path d="M50 50 Q100 150 150 50" class="image" />
    <!-- Straight wood -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <!-- Hammer -->
    <line x1="160" y1="40" x2="180" y2="60" class="image" />
    <line x1="180" y1="60" x2="170" y2="70" class="image" />
    <!-- Craftsman -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>