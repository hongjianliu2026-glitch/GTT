<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">botch</text>
  <text x="50" y="120" class="subtitle">[bɒtʃ] v. 笨拙地做，搞砸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> botch (笨拙)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠在修理一个精美的花瓶，但他笨拙地
    <tspan x="50" dy="25">一不小心把花瓶摔碎了，这就是"搞砸(botch)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He botched the presentation and lost the contract.
  </text>
  <text x="50" y="310" class="content">
    他把演示搞砸了，失去了合同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken vase -->
    <path d="M50 20 L70 100 L30 100 Z" class="image" />
    <path d="M50 20 L90 100 L70 100 Z" class="image" />
    <path d="M50 20 L110 100 L90 100 Z" class="image" />
    <path d="M50 20 L130 100 L110 100 Z" class="image" />
    <!-- Craftsman -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Broken pieces -->
    <line x1="70" y1="100" x2="30" y2="150" class="image" />
    <line x1="90" y1="100" x2="110" y2="150" class="image" />
  </g>
</svg>