<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rafter</text>
  <text x="50" y="120" class="subtitle">[ˈræftər] n. 椽子，横梁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> raft (筏) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的木筏(raft)漂浮在水面上，
    <tspan x="50" dy="25">筏上的横梁(rafter)支撑着整个结构，</tspan>
    <tspan x="50" dy="25">就像房子里的椽子一样重要。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rafters of the old barn were rotting.
  </text>
  <text x="50" y="310" class="content">
    旧谷仓的椽子正在腐烂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Raft -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rafters -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Water -->
    <rect x="0" y="180" width="350" height="20" class="image" />
  </g>
</svg>