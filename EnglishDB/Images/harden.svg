<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">harden</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrdn] v. 使变硬，使坚强</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hard (硬) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块柔软的橡皮泥，经过"使变硬(hard-en)"
    <tspan x="50" dy="25">的过程，变成了坚硬的石头。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The metal hardens when it is cooled.
  </text>
  <text x="50" y="310" class="content">
    金属冷却时会变硬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soft clay -->
    <circle cx="50" cy="100" r="30" class="image" />
    <text x="40" y="110" class="content" fill="#D35400">软</text>
    <!-- Hard stone -->
    <rect x="150" y="70" width="60" height="60" class="image" />
    <text x="160" y="110" class="content" fill="#2C3E50">硬</text>
    <!-- Arrow -->
    <line x1="100" y1="100" x2="140" y2="100" class="image" />
    <polygon points="140,95 145,100 140,105" class="image" />
  </g>
</svg>