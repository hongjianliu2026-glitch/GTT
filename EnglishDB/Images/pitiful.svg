<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pitiful</text>
  <text x="50" y="120" class="subtitle">[ˈpɪtɪfəl] adj. 可怜的，令人同情的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pity (同情) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"充满同情(pity-ful)"的小狗，
    <tspan x="50" dy="25">它看着一只受伤的小鸟，眼中充满了怜悯。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The homeless man's plight was pitiful.
  </text>
  <text x="50" y="310" class="content">
    那个无家可归者的困境令人同情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="90" x2="30" y2="100" class="image" />
    <line x1="50" y1="90" x2="70" y2="100" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <!-- Bird -->
    <circle cx="150" cy="50" r="10" class="image" />
    <line x1="150" y1="60" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="140" y2="100" class="image" />
    <line x1="150" y1="80" x2="160" y2="100" class="image" />
    <!-- Broken wing -->
    <line x1="150" y1="60" x2="130" y2="40" class="image" />
    <line x1="150" y1="60" x2="170" y2="40" class="image" />
    <!-- Heart -->
    <path d="M200,50 C200,20 240,20 240,50 S280,80 280,50" class="image" />
  </g>
</svg>