<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dawn</text>
  <text x="50" y="120" class="subtitle">[dɔːn] n. 黎明，拂晓；v. 破晓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> daw (day) + -n (表示时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宁静的早晨，"一天(daw)"的开始，
    <tspan x="50" dy="25">太阳缓缓升起，照亮了整个世界，这就是黎明(dawn)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We woke up at dawn to watch the sunrise.
  </text>
  <text x="50" y="310" class="content">
    我们在黎明时分醒来，观看日出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="150" cy="150" r="50" fill="#FFD700" />
    <!-- Horizon line -->
    <line x1="0" y1="300" x2="300" y2="300" class="image" />
    <!-- Sun rays -->
    <line x1="150" y1="100" x2="150" y2="0" class="image" />
    <line x1="100" y1="150" x2="0" y2="150" class="image" />
    <line x1="200" y1="150" x2="300" y2="150" class="image" />
    <line x1="150" y1="200" x2="150" y2="300" class="image" />
    <!-- Ground -->
    <rect x="0" y="300" width="300" height="100" fill="#8B4513" />
  </g>
</svg>