<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">saturated</text>
  <text x="50" y="120" class="subtitle">[ˈsætʃəreɪtɪd] adj. 饱和的，浸透的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> satur (充满) + -ate (使) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个杯子，"充满(satur)"了水，水已经"使(ate)"杯子"饱和(saturated)"，
    <tspan x="50" dy="25">再也无法装下更多水了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The market for smartphones is saturated.
  </text>
  <text x="50" y="310" class="content">
    智能手机市场已经饱和。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Water -->
    <rect x="10" y="10" width="130" height="180" class="image" fill="#3498DB" />
    <!-- Overflowing water -->
    <rect x="10" y="190" width="130" height="10" class="image" fill="#3498DB" />
    <rect x="10" y="200" width="130" height="10" class="image" fill="#3498DB" />
    <rect x="10" y="210" width="130" height="10" class="image" fill="#3498DB" />
  </g>
</svg>