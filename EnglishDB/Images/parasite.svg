<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parasite</text>
  <text x="50" y="120" class="subtitle">[ˈpærəsaɪt] n. 寄生虫，食客</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (旁边) + site (坐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小虫子"坐在(site)"另一只动物的"旁边(para)"，
    <tspan x="50" dy="25">依靠它生活，这就是寄生虫(parasite)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tapeworm is a parasite that lives in the intestines.
  </text>
  <text x="50" y="310" class="content">
    绦虫是一种生活在肠道中的寄生虫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Host animal -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Parasite -->
    <circle cx="150" cy="100" r="10" class="image" />
    <!-- Connection line -->
    <line x1="150" y1="100" x2="100" y2="100" class="image" />
    <!-- Parasite label -->
    <text x="155" y="105" class="content" fill="#2980B9">parasite</text>
  </g>
</svg>