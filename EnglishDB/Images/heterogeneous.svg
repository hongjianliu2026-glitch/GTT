<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heterogeneous</text>
  <text x="50" y="120" class="subtitle">[ˌhetərəˈdʒiːniəs] adj. 异质的，不同种类的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hetero- (不同的) + gen (产生) + -eous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图，每个拼图块都来自不同的世界，
    <tspan x="50" dy="25">"不同的(hetero-)" 元素 "产生(gen)" 了一个 "异质的(heterogeneous)" 组合。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden is a heterogeneous mix of plants from various climates.
  </text>
  <text x="50" y="310" class="content">
    这个花园是来自各种气候的植物的异质混合。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Different patterns -->
    <circle cx="50" cy="50" r="40" class="image" />
    <rect x="170" y="10" width="80" height="80" class="image" />
    <line x1="260" y1="10" x2="320" y2="90" class="image" />
    <line x1="260" y1="90" x2="320" y2="10" class="image" />
    <rect x="50" y="170" width="80" height="80" class="image" />
    <circle cx="170" cy="170" r="40" class="image" />
    <line x1="260" y1="130" x2="320" y2="210" class="image" />
    <line x1="260" y1="210" x2="320" y2="130" class="image" />
  </g>
</svg>