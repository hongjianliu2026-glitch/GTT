<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">squawk</text>
  <text x="50" y="120" class="subtitle">[skwɔːk] v. 发出尖锐刺耳的声音，嘎嘎叫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> squa- (尖锐) + wk (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鸟在树枝上，突然被吓到，"尖锐地发出(squa-wk)"
    <tspan x="50" dy="25">一声刺耳的叫声，这就是squawk。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The parrot squawked loudly when it saw the cat.
  </text>
  <text x="50" y="310" class="content">
    鹦鹉看到猫时大声嘎嘎叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Bird -->
    <circle cx="175" cy="0" r="20" class="image" />
    <line x1="175" y1="20" x2="175" y2="50" class="image" />
    <line x1="175" y1="50" x2="155" y2="80" class="image" />
    <line x1="175" y1="50" x2="195" y2="80" class="image" />
    <line x1="175" y1="30" x2="145" y2="40" class="image" />
    <line x1="175" y1="30" x2="205" y2="40" class="image" />
    <!-- Sound waves -->
    <circle cx="220" cy="0" r="10" class="image" />
    <circle cx="250" cy="0" r="15" class="image" />
    <circle cx="280" cy="0" r="20" class="image" />
  </g>
</svg>