<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tarmac</text>
  <text x="50" y="120" class="subtitle">[ˈtɑːrmæk] n. 柏油碎石路</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tar (柏油) + macadam (碎石)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆飞机在"柏油碎石路(tarmac)"上滑行，
    <tspan x="50" dy="25">柏油(tar)和碎石(macadam)混合的路面让它平稳起飞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plane taxied on the tarmac before taking off.
  </text>
  <text x="50" y="310" class="content">
    飞机在起飞前在柏油碎石路上滑行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tarmac surface -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#333333" />
    <!-- Tar spots -->
    <circle cx="50" cy="50" r="10" class="image" fill="#000000" />
    <circle cx="100" cy="70" r="10" class="image" fill="#000000" />
    <circle cx="150" cy="90" r="10" class="image" fill="#000000" />
    <!-- Macadam stones -->
    <rect x="200" y="20" width="10" height="10" class="image" fill="#8B4513" />
    <rect x="220" y="40" width="10" height="10" class="image" fill="#8B4513" />
    <rect x="240" y="60" width="10" height="10" class="image" fill="#8B4513" />
    <!-- Airplane -->
    <line x1="280" y1="100" x2="320" y2="100" class="image" />
    <line x1="300" y1="80" x2="300" y2="120" class="image" />
    <line x1="290" y1="90" x2="310" y2="90" class="image" />
    <line x1="290" y1="110" x2="310" y2="110" class="image" />
  </g>
</svg>