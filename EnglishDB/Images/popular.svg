<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">popular</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːpjələr] adj. 流行的，受欢迎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pop (人民) + -ular (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的舞台，"人民(pop)"
    <tspan x="50" dy="25">聚集在一起，欢呼着他们喜爱的明星，</tspan>
    <tspan x="50" dy="25">这就是"受欢迎的(popular)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The song became popular overnight.
  </text>
  <text x="50" y="310" class="content">
    这首歌一夜之间变得流行起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Crowd -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="80" cy="110" r="10" class="image" />
    <circle cx="110" cy="90" r="10" class="image" />
    <circle cx="140" cy="105" r="10" class="image" />
    <circle cx="170" cy="120" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="230" cy="110" r="10" class="image" />
    <circle cx="260" cy="90" r="10" class="image" />
    <circle cx="290" cy="105" r="10" class="image" />
    <circle cx="320" cy="120" r="10" class="image" />
    <!-- Star -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="100" class="image" />
    <line x1="175" y1="70" x2="155" y2="90" class="image" />
    <line x1="175" y1="70" x2="195" y2="90" class="image" />
    <line x1="175" y1="100" x2="155" y2="120" class="image" />
    <line x1="175" y1="100" x2="195" y2="120" class="image" />
  </g>
</svg>