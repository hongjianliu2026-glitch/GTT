<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">camaraderie</text>
  <text x="50" y="120" class="subtitle">[ˌkæməˈrɑːdəri] n. 同志情谊，友情</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> camarade (同志) + -erie (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群士兵在战场上，"同志们(camarade)"
    <tspan x="50" dy="25">互相扶持，共同面对困难，这种深厚的友情(camaraderie)令人难忘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team's camaraderie was evident in their victory celebration.
  </text>
  <text x="50" y="310" class="content">
    团队在胜利庆祝中展现了他们的同志情谊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldiers -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Arms linked -->
    <line x1="70" y1="70" x2="90" y2="70" class="image" />
    <line x1="120" y1="70" x2="140" y2="70" class="image" />
    <!-- Background -->
    <rect x="0" y="0" width="200" height="100" class="image" />
  </g>
</svg>