<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">untie</text>
  <text x="50" y="120" class="subtitle">[ʌnˈtaɪ] v. 解开，松开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + tie (系，绑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在解开(untie)一个巨大的蝴蝶结，
    <tspan x="50" dy="25">这个蝴蝶结原本紧紧地绑着(tie)，现在被松开了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She untied the ribbon from the present.
  </text>
  <text x="50" y="310" class="content">
    她解开了礼物上的丝带。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knot -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <!-- Hands untying -->
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="100" y2="120" class="image" />
    <line x1="150" y1="165" x2="100" y2="120" class="image" />
  </g>
</svg>