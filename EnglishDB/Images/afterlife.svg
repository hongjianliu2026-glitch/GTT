<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">afterlife</text>
  <text x="50" y="120" class="subtitle">[ˈæftərlaɪf] n. 来世，死后生活</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> after- (在...之后) + life (生命)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在地球上度过一生后，"在生命之后(after-life)"
    <tspan x="50" dy="25">进入了一个神秘的世界，那里是他的来世(afterlife)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many religions believe in an afterlife.
  </text>
  <text x="50" y="310" class="content">
    许多宗教相信来世。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Person on Earth -->
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Path to Afterlife -->
    <line x1="100" y1="150" x2="300" y2="150" class="image" />
    <!-- Afterlife World -->
    <rect x="300" y="50" width="200" height="100" class="image" />
    <!-- Person in Afterlife -->
    <circle cx="400" cy="100" r="10" class="image" />
  </g>
</svg>