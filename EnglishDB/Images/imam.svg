<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imam</text>
  <text x="50" y="120" class="subtitle">[ɪˈmɑːm] n. 伊玛目（伊斯兰教领袖）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> imam (源自阿拉伯语，意为“领袖”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个庄严的伊玛目站在清真寺前，
    <tspan x="50" dy="25">他身穿长袍，头戴白色头巾，</tspan>
    <tspan x="50" dy="25">引领着信徒们进行祈祷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The imam led the Friday prayer at the mosque.
  </text>
  <text x="50" y="310" class="content">
    伊玛目在清真寺带领周五的祈祷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mosque -->
    <rect x="0" y="100" width="300" height="150" class="image" />
    <!-- Imam -->
    <circle cx="150" cy="80" r="20" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="120" x2="120" y2="110" class="image" />
    <line x1="150" y1="120" x2="180" y2="110" class="image" />
    <!-- Headscarf -->
    <rect x="130" y="60" width="40" height="20" class="image" />
  </g>
</svg>