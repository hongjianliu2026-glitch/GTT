<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gargantuan</text>
  <text x="50" y="120" class="subtitle">[ɡɑːrˈɡæn.tʃu.ən] adj. 巨大的，庞大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gargantua (巨大的怪物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的怪物"加尔甘图阿(Gargantua)"，
    <tspan x="50" dy="25">它的体型如此庞大，以至于它的一步就能跨越整个城市。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gargantuan whale breached the surface of the ocean.
  </text>
  <text x="50" y="310" class="content">
    那只巨大的鲸鱼跃出了海面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gargantuan monster -->
    <circle cx="100" cy="100" r="80" class="image" /> <!-- Head -->
    <line x1="100" y1="180" x2="100" y2="300" class="image" /> <!-- Body -->
    <line x1="100" y1="220" x2="50" y2="250" class="image" /> <!-- Left arm -->
    <line x1="100" y1="220" x2="150" y2="250" class="image" /> <!-- Right arm -->
    <line x1="100" y1="300" x2="50" y2="350" class="image" /> <!-- Left leg -->
    <line x1="100" y1="300" x2="150" y2="350" class="image" /> <!-- Right leg -->
    <!-- City skyline -->
    <rect x="0" y="350" width="200" height="50" class="image" />
    <rect x="20" y="300" width="30" height="100" class="image" />
    <rect x="70" y="250" width="30" height="150" class="image" />
    <rect x="120" y="300" width="30" height="100" class="image" />
    <rect x="170" y="250" width="30" height="150" class="image" />
  </g>
</svg>