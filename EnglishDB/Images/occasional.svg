<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">occasional</text>
  <text x="50" y="120" class="subtitle">[əˈkeɪʒənl] adj. 偶尔的，间或发生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oc- (向) + cas (落下) + -ion (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"偶尔(occasional)"
    <tspan x="50" dy="25">会有一个苹果从天而降(oc-cas)，</tspan>
    <tspan x="50" dy="25">象征着偶尔发生的事件。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He visits his grandparents on occasional weekends.
  </text>
  <text x="50" y="310" class="content">
    他偶尔在周末去看望祖父母。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="150" cy="150" r="100" class="image" />
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
    <line x1="150" y1="150" x2="230" y2="150" class="image" />
    <!-- Apple falling -->
    <circle cx="230" cy="150" r="20" class="image" />
    <line x1="230" y1="150" x2="230" y2="250" class="image" />
  </g>
</svg>