<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">size</text>
  <text x="50" y="120" class="subtitle">[saɪz] n. 大小，尺寸；v. 按大小排列</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> siz (来自拉丁语 "esse"，意为“是”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的尺子，"测量(siz)"
    <tspan x="50" dy="25">一切物体的大小，从微小的蚂蚁到庞大的大象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The size of the room is perfect for our meeting.
  </text>
  <text x="50" y="310" class="content">
    这个房间的大小非常适合我们的会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ruler -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <line x1="20" y1="25" x2="330" y2="25" class="image" />
    <line x1="20" y1="10" x2="20" y2="40" class="image" />
    <line x1="100" y1="10" x2="100" y2="40" class="image" />
    <line x1="180" y1="10" x2="180" y2="40" class="image" />
    <line x1="260" y1="10" x2="260" y2="40" class="image" />
    <line x1="330" y1="10" x2="330" y2="40" class="image" />
    <!-- Ant -->
    <circle cx="50" cy="80" r="10" class="image" />
    <line x1="50" y1="90" x2="50" y2="110" class="image" />
    <line x1="50" y1="110" x2="40" y2="130" class="image" />
    <line x1="50" y1="110" x2="60" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="90" class="image" />
    <!-- Elephant -->
    <circle cx="250" cy="80" r="30" class="image" />
    <line x1="250" y1="110" x2="250" y2="170" class="image" />
    <line x1="250" y1="170" x2="220" y2="210" class="image" />
    <line x1="250" y1="170" x2="280" y2="210" class="image" />
    <line x1="250" y1="140" x2="310" y2="120" class="image" />
  </g>
</svg>