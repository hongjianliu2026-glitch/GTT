<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accomplice</text>
  <text x="50" y="120" class="subtitle">[əˈkɒmplɪs] n. 同谋，帮凶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + com- (共同) + pli (充满) + -ce (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在密谋，"共同充满(com-pli)"
    <tspan x="50" dy="25">恶意的行为，他们就是同谋(accomplice)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police arrested the thief and his accomplice.
  </text>
  <text x="50" y="310" class="content">
    警察逮捕了小偷和他的同谋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people whispering -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="70" y1="100" x2="70" y2="150" class="image" />
    <line x1="130" y1="100" x2="130" y2="150" class="image" />
    <line x1="70" y1="150" x2="130" y2="150" class="image" />
    <!-- Whispering bubble -->
    <path d="M 70 80 Q 100 70 130 80" class="image" />
    <path d="M 130 80 Q 100 90 70 80" class="image" />
  </g>
</svg>