<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">roaring</text>
  <text x="50" y="120" class="subtitle">[ˈrɔːrɪŋ] adj. 咆哮的，轰鸣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roar (咆哮) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头巨大的狮子在森林中"咆哮(roar)"，
    <tspan x="50" dy="25">声音震耳欲聋，整个森林都在颤抖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The engine made a roaring sound as it started.
  </text>
  <text x="50" y="310" class="content">
    引擎启动时发出轰鸣声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion's head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Lion's mane -->
    <circle cx="50" cy="80" r="20" class="image" />
    <circle cx="150" cy="80" r="20" class="image" />
    <circle cx="70" cy="50" r="15" class="image" />
    <circle cx="130" cy="50" r="15" class="image" />
    <!-- Lion's mouth -->
    <path d="M 80 120 Q 100 150 120 120" class="image" />
    <!-- Roaring sound waves -->
    <path d="M 100 200 Q 150 250 200 200" class="image" />
    <path d="M 100 220 Q 150 270 200 220" class="image" />
    <path d="M 100 240 Q 150 290 200 240" class="image" />
  </g>
</svg>