<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cobalt { fill: #0047AB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cobalt</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊbɔːlt] n. 钴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自德语Kobold，意为“小妖精”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小妖精(Kobold)在矿山中，
    <tspan x="50" dy="25">发现了一种闪闪发光的蓝色金属，</tspan>
    <tspan x="50" dy="25">这种金属就是钴(cobalt)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Cobalt is used in making strong magnets.
  </text>
  <text x="50" y="310" class="content">
    钴用于制造强力磁铁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cobalt ore -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="cobalt" />
    <circle cx="120" cy="100" r="30" class="cobalt" />
    <circle cx="190" cy="100" r="30" class="cobalt" />
    <circle cx="260" cy="100" r="30" class="cobalt" />
    <!-- Kobold -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="190" class="image" />
    <line x1="300" y1="160" x2="320" y2="190" class="image" />
    <line x1="300" y1="140" x2="330" y2="130" class="image" />
  </g>
</svg>