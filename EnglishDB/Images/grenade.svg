<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grenade</text>
  <text x="50" y="120" class="subtitle">[ɡrəˈneɪd] n. 手榴弹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gran (谷物) + ade (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵手持一个"谷物(gran)"形状的物体，
    <tspan x="50" dy="25">这个物体突然爆炸，就像一个手榴弹(grenade)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldier threw a grenade into the enemy's trench.
  </text>
  <text x="50" y="310" class="content">
    士兵把手榴弹扔进了敌人的战壕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grenade shape -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="130" class="image" />
    <!-- Pin -->
    <line x1="100" y1="70" x2="100" y2="40" class="image" />
    <circle cx="100" cy="35" r="5" class="image" />
    <!-- Explosion -->
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="180" cy="80" r="20" class="image" />
    <circle cx="120" cy="80" r="20" class="image" />
  </g>
</svg>