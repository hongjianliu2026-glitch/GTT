<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maternal</text>
  <text x="50" y="120" class="subtitle">[məˈtɜːrnl] adj. 母亲的，母性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mater (母亲) + -n- + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个母亲(mater)温柔地抱着她的孩子，
    <tspan x="50" dy="25">这种母性的(maternal)关怀让人感到无比温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a maternal instinct that guides her parenting.
  </text>
  <text x="50" y="310" class="content">
    她有一种母性的本能指导她的育儿方式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />
    <!-- Child -->
    <circle cx="120" cy="120" r="20" class="image" />
    <line x1="120" y1="140" x2="120" y2="170" class="image" />
    <line x1="120" y1="170" x2="100" y2="200" class="image" />
    <line x1="120" y1="170" x2="140" y2="200" class="image" />
    <line x1="120" y1="150" x2="150" y2="140" class="image" />
    <!-- Heart -->
    <path d="M180,100 C180,80 220,80 220,100 C220,120 180,120 180,100 Z" class="image" />
  </g>
</svg>