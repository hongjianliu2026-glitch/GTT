<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evaporate</text>
  <text x="50" y="120" class="subtitle">[ɪˈvæpəreɪt] v. 蒸发，消失</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + vapor (蒸汽) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯水放在阳光下，"水蒸气(vapor)"
    <tspan x="50" dy="25">从水中"出来(e-)"，逐渐消失(evaporate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The water in the pan evaporated quickly.
  </text>
  <text x="50" y="310" class="content">
    锅里的水很快蒸发了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" fill="#F1C40F" />
    <!-- Water -->
    <rect x="150" y="200" width="100" height="50" fill="#3498DB" />
    <!-- Vapor -->
    <line x1="170" y1="180" x2="170" y2="100" class="image" />
    <line x1="200" y1="180" x2="200" y2="100" class="image" />
    <line x1="230" y1="180" x2="230" y2="100" class="image" />
  </g>
</svg>