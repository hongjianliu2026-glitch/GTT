<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neither</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪðər] adv. 两者都不</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nei- (不) + ther (两者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人站在你面前，你摇摇头说"不(nei-)"，
    <tspan x="50" dy="25">表示"两者(ther)"都不选。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Neither of the options was satisfactory.
  </text>
  <text x="50" y="310" class="content">
    两个选项都不令人满意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="20" y2="130" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />

    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />

    <!-- Head shaking -->
    <path d="M200,100 Q250,50 300,100" class="image" />
    <path d="M200,100 Q250,150 300,100" class="image" />
  </g>
</svg>