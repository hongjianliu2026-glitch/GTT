<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mainframe</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪnfreɪm] n. 主机，大型机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> main (主要的) + frame (框架)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的计算机框架，"主要的框架(main-frame)"
    <tspan x="50" dy="25">支撑着整个系统的运行，这就是主机(mainframe)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's mainframe handles all the critical data processing.
  </text>
  <text x="50" y="310" class="content">
    公司的大型机处理所有关键的数据处理任务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mainframe -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Computer screen -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Circuit lines -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Mainframe structure -->
    <rect x="100" y="10" width="150" height="180" class="image" />
    <line x1="100" y1="10" x2="250" y2="10" class="image" />
    <line x1="100" y1="190" x2="250" y2="190" class="image" />
    <line x1="100" y1="10" x2="100" y2="190" class="image" />
    <line x1="250" y1="10" x2="250" y2="190" class="image" />
  </g>
</svg>