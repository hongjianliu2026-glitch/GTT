<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shawl</text>
  <text x="50" y="120" class="subtitle">[ʃɔːl] n. 披肩，围巾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shaw (来自古英语 sceaga，意为“小树林”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的森林(shaw)中，一位优雅的女士披着一条柔软的披肩(shawl)，
    <tspan x="50" dy="25">仿佛披肩是由森林的柔软枝叶编织而成。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wrapped herself in a warm shawl during the chilly evening.
  </text>
  <text x="50" y="310" class="content">
    她在寒冷的夜晚用温暖的披肩裹住自己。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="50" class="image" />
    <line x1="300" y1="50" x2="350" y2="100" class="image" />

    <!-- Lady with shawl -->
    <circle cx="175" cy="120" r="20" class="image" />
    <line x1="175" y1="140" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="160" x2="140" y2="150" class="image" />
    <line x1="175" y1="160" x2="210" y2="150" class="image" />

    <!-- Shawl -->
    <path d="M150,120 Q175,80 200,120" class="image" />
    <path d="M150,120 Q175,160 200,120" class="image" />
  </g>
</svg>