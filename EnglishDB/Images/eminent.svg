<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eminent</text>
  <text x="50" y="120" class="subtitle">[ˈɛmɪnənt] adj. 杰出的，显赫的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + min (突出) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山峰"突出(min)"于群山之上，
    <tspan x="50" dy="25">这个山峰就是"杰出的(eminent)"存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The eminent scientist received the Nobel Prize.
  </text>
  <text x="50" y="310" class="content">
    这位杰出的科学家获得了诺贝尔奖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain range -->
    <path d="M0 200 L100 100 L200 200 L300 150 L400 200" class="image" />
    <!-- Eminent mountain -->
    <path d="M200 200 L250 50 L300 200" class="image" />
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Clouds -->
    <path d="M0 50 Q50 20 100 50 T200 50" class="image" />
    <path d="M150 30 Q200 10 250 30 T350 30" class="image" />
  </g>
</svg>