<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carousel</text>
  <text x="50" y="120" class="subtitle">[ˌkærəˈsel] n. 旋转木马</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> caro- (马) + -sel (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的旋转木马，"小马(caro-sel)"
    <tspan x="50" dy="25">在欢乐的音乐中旋转，孩子们欢笑着骑在上面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were excited to ride the carousel at the fair.
  </text>
  <text x="50" y="310" class="content">
    孩子们对在集市上骑旋转木马感到非常兴奋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Carousel base -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Horses -->
    <line x1="120" y1="100" x2="280" y2="100" class="image" />
    <line x1="120" y1="100" x2="120" y2="50" class="image" />
    <line x1="280" y1="100" x2="280" y2="50" class="image" />
    <line x1="120" y1="50" x2="140" y2="30" class="image" />
    <line x1="280" y1="50" x2="260" y2="30" class="image" />
    <line x1="140" y1="30" x2="160" y2="50" class="image" />
    <line x1="260" y1="30" x2="240" y2="50" class="image" />
    <!-- Children -->
    <circle cx="120" cy="40" r="10" class="image" />
    <circle cx="280" cy="40" r="10" class="image" />
  </g>
</svg>