<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cam</text>
  <text x="50" y="120" class="subtitle">[kæm] n. 凸轮，凸轮轴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cam (凸轮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机械装置中，一个"凸轮(cam)"
    <tspan x="50" dy="25">像一个旋转的圆盘，推动其他部件运动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cam in the engine controls the valve timing.
  </text>
  <text x="50" y="310" class="content">
    发动机中的凸轮控制着气门正时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cam -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Shaft -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Connecting rod -->
    <line x1="100" y1="150" x2="200" y2="200" class="image" />
    <!-- Piston -->
    <rect x="180" y="180" width="40" height="40" class="image" />
  </g>
</svg>