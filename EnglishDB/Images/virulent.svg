<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">virulent</text>
  <text x="50" y="120" class="subtitle">[ˈvɪrələnt] adj. 剧毒的，恶毒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vir (毒) + -ulent (充满的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满剧毒(virulent)的蛇，它的毒液(vir)
    <tspan x="50" dy="25">充满了(ulent)整个区域，任何接触到它的生物都会立即倒下。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The virus was extremely virulent, causing widespread panic.
  </text>
  <text x="50" y="310" class="content">
    这种病毒极具毒性，引发了广泛的恐慌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snake -->
    <path d="M50 50 C 100 0, 150 0, 200 50 S 300 100, 350 50" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <line x1="200" y1="60" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="120" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
    <!-- Poison droplet -->
    <circle cx="250" cy="150" r="20" class="image" fill="#8E44AD" />
    <line x1="250" y1="170" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="230" y2="220" class="image" />
    <line x1="250" y1="200" x2="270" y2="220" class="image" />
  </g>
</svg>