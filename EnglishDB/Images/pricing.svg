<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pricing</text>
  <text x="50" y="120" class="subtitle">[ˈpraɪsɪŋ] n. 定价</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> price (价格) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人站在一堆商品前，"定价(pricing)"
    <tspan x="50" dy="25">每个商品，确保它们都能卖出好价钱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is reviewing its pricing strategy.
  </text>
  <text x="50" y="310" class="content">
    公司正在审查其定价策略。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Merchant -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Products -->
    <rect x="70" y="80" width="50" height="50" class="image" />
    <rect x="140" y="80" width="50" height="50" class="image" />
    <rect x="210" y="80" width="50" height="50" class="image" />
    <!-- Price tags -->
    <line x1="70" y1="70" x2="120" y2="70" class="image" />
    <line x1="140" y1="70" x2="190" y2="70" class="image" />
    <line x1="210" y1="70" x2="260" y2="70" class="image" />
    <text x="125" y="65" class="content">$10</text>
    <text x="195" y="65" class="content">$20</text>
    <text x="265" y="65" class="content">$30</text>
  </g>
</svg>