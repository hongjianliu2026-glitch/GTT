<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">windfall</text>
  <text x="50" y="120" class="subtitle">[ˈwɪndfɔːl] n. 意外之财，横财</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wind (风) + fall (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一阵大风刮来，"风(wind)把财富吹落(fall)"
    <tspan x="50" dy="25">到你的脚下，这就是意外之财(windfall)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Winning the lottery was a windfall for her.
  </text>
  <text x="50" y="310" class="content">
    赢得彩票对她来说是一笔意外之财。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wind blowing -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="0" y1="20" x2="120" y2="120" class="image" />
    <line x1="0" y1="40" x2="140" y2="140" class="image" />
    <line x1="0" y1="60" x2="160" y2="160" class="image" />
    <!-- Money falling -->
    <rect x="150" y="50" width="50" height="20" class="image" />
    <rect x="170" y="70" width="50" height="20" class="image" />
    <rect x="190" y="90" width="50" height="20" class="image" />
    <rect x="210" y="110" width="50" height="20" class="image" />
    <!-- Person receiving -->
    <circle cx="300" cy="150" r="20" class="image" />
    <line x1="300" y1="170" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="280" y2="230" class="image" />
    <line x1="300" y1="200" x2="320" y2="230" class="image" />
    <line x1="300" y1="180" x2="340" y2="170" class="image" />
  </g>
</svg>