<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perk</text>
  <text x="50" y="120" class="subtitle">[pɜːrk] v. 振作，活跃；n. 额外津贴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + k (快速动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在喝了一杯咖啡后，"完全快速地(per-k)"
    <tspan x="50" dy="25">振作起来，精神焕发，这就是perk的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coffee really perked him up.
  </text>
  <text x="50" y="310" class="content">
    咖啡真的让他精神焕发。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee cup -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <circle cx="50" cy="50" r="40" class="image" />
    <!-- Steam -->
    <line x1="50" y1="0" x2="50" y2="20" class="image" />
    <line x1="40" y1="0" x2="40" y2="15" class="image" />
    <line x1="60" y1="0" x2="60" y2="15" class="image" />
    <!-- Person -->
    <circle cx="200" cy="50" r="30" class="image" />
    <line x1="200" y1="80" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="170" y2="200" class="image" />
    <line x1="200" y1="150" x2="230" y2="200" class="image" />
    <line x1="200" y1="120" x2="250" y2="110" class="image" />
    <!-- Smiling face -->
    <circle cx="200" cy="40" r="5" class="image" />
    <circle cx="220" cy="40" r="5" class="image" />
    <path d="M190,60 Q200,80 210,60" class="image" />
  </g>
</svg>