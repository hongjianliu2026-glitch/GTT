<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hearsay</text>
  <text x="50" y="120" class="subtitle">[ˈhɪrseɪ] n. 传闻，道听途说</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hear (听) + say (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在街上听到别人说的话，然后又传给另一个人，
    <tspan x="50" dy="25">这种"听到的说(hear-say)"就是传闻(hearsay)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't believe everything you hear; much of it is hearsay.
  </text>
  <text x="50" y="310" class="content">
    不要相信你听到的一切；其中很多都是传闻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person 1 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M 90 90 Q 150 90 150 130 Q 150 170 90 170 Q 50 170 50 130 Z" class="image" />
    <text x="100" y="120" class="content">说</text>

    <!-- Person 2 -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="290" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M 290 90 Q 350 90 350 130 Q 350 170 290 170 Q 250 170 250 130 Z" class="image" />
    <text x="300" y="120" class="content">听</text>

    <!-- Arrow -->
    <line x1="150" y1="120" x2="240" y2="120" class="image" />
    <polygon points="240,120 230,115 230,125" class="image" />
  </g>
</svg>