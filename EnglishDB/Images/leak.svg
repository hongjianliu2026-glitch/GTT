<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leak</text>
  <text x="50" y="120" class="subtitle">[liːk] v. 泄漏，渗漏；n. 漏洞，泄漏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leak (源自中古英语 leken，意为“渗漏”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个水桶底部有一个小洞，水正从洞里"渗漏(leak)"出来，
    <tspan x="50" dy="25">水滴不断滴落，形成一个小水洼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the scandal began to leak out.
  </text>
  <text x="50" y="310" class="content">
    丑闻的消息开始泄露出去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bucket -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Leak -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <circle cx="100" cy="250" r="10" class="image" />
    <!-- Water droplets -->
    <circle cx="100" cy="270" r="5" class="image" />
    <circle cx="100" cy="290" r="5" class="image" />
    <circle cx="100" cy="310" r="5" class="image" />
  </g>
</svg>