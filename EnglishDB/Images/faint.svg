<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">faint</text>
  <text x="50" y="120" class="subtitle">[feɪnt] v. 昏厥，变得微弱；adj. 微弱的，模糊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fane (消失) + -t (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在烈日下跑步，突然感到"消失(fane)"了力气，
    <tspan x="50" dy="25">眼前一黑，就昏厥(faint)了过去。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt faint after standing in the sun for too long.
  </text>
  <text x="50" y="310" class="content">
    她在太阳下站得太久，感到昏厥。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="150" r="20" class="image" fill="#2C3E50" />
    <line x1="200" y1="170" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="180" y2="280" class="image" />
    <line x1="200" y1="250" x2="220" y2="280" class="image" />
    <line x1="200" y1="200" x2="150" y2="190" class="image" />
    <line x1="200" y1="200" x2="250" y2="190" class="image" />
    <!-- Faint line -->
    <line x1="200" y1="250" x2="200" y2="300" class="image" stroke-dasharray="5,5" />
  </g>
</svg>