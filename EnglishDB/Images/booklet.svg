<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">booklet</text>
  <text x="50" y="120" class="subtitle">[ˈbʊklɪt] n. 小册子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> book (书) + -let (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本小书(book)被缩小成一个小册子(booklet)，
    <tspan x="50" dy="25">就像一本迷你书，方便携带和阅读。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The museum handed out booklets about the history of art.
  </text>
  <text x="50" y="310" class="content">
    博物馆分发了关于艺术史的小册子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Booklet -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="110" x2="180" y2="110" class="image" />
    <!-- Cover -->
    <rect x="0" y="0" width="20" height="150" class="image" />
    <rect x="180" y="0" width="20" height="150" class="image" />
  </g>
</svg>