<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">caretaker</text>
  <text x="50" y="120" class="subtitle">[ˈkɛrˌteɪkər] n. 看管人，管理人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> care (照顾) + take (拿) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钥匙(key)被一个"照顾者(caretaker)"
    <tspan x="50" dy="25">拿着，他负责保管和管理一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The caretaker is responsible for the maintenance of the building.
  </text>
  <text x="50" y="310" class="content">
    看管人负责建筑物的维护。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Key -->
    <rect x="0" y="0" width="200" height="50" class="image" />
    <line x1="10" y1="25" x2="190" y2="25" class="image" />
    <line x1="10" y1="25" x2="10" y2="50" class="image" />
    <line x1="190" y1="25" x2="190" y2="50" class="image" />
    <!-- Caretaker -->
    <circle cx="250" cy="25" r="20" class="image" />
    <line x1="250" y1="45" x2="250" y2="80" class="image" />
    <line x1="250" y1="80" x2="230" y2="110" class="image" />
    <line x1="250" y1="80" x2="270" y2="110" class="image" />
    <line x1="250" y1="60" x2="280" y2="50" class="image" />
    <!-- Holding the key -->
    <line x1="250" y1="50" x2="100" y2="25" class="image" />
  </g>
</svg>