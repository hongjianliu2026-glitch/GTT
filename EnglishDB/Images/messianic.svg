<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">messianic</text>
  <text x="50" y="120" class="subtitle">[ˌmɛsɪˈænɪk] adj. 救世主的，弥赛亚的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> messi (救世主) + -anic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个救世主(messi)降临，光芒四射，
    <tspan x="50" dy="25">他的形象和行为都充满了救世主的特质(messianic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The preacher spoke with a messianic fervor.
  </text>
  <text x="50" y="310" class="content">
    传教士以救世主般的热情演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Halo -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Face -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Eyes -->
    <circle cx="85" cy="90" r="5" class="image" />
    <circle cx="115" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <line x1="85" y1="115" x2="115" y2="115" class="image" />
    <!-- Arms -->
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
    <!-- Legs -->
    <line x1="90" y1="160" x2="90" y2="200" class="image" />
    <line x1="110" y1="160" x2="110" y2="200" class="image" />
  </g>
</svg>