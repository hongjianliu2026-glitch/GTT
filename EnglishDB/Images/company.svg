<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">company</text>
  <text x="50" y="120" class="subtitle">[ˈkʌmpəni] n. 公司，陪伴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + pan (面包)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"共同分享(com-pan)"
    <tspan x="50" dy="25">面包，这种共享的氛围就构成了一个公司(company)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She works for a tech company in Silicon Valley.
  </text>
  <text x="50" y="310" class="content">
    她在硅谷的一家科技公司工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bread -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- People -->
    <circle cx="70" cy="100" r="15" class="image" />
    <line x1="70" y1="115" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="70" y1="130" x2="100" y2="120" class="image" />

    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />

    <circle cx="230" cy="100" r="15" class="image" />
    <line x1="230" y1="115" x2="230" y2="150" class="image" />
    <line x1="230" y1="150" x2="210" y2="180" class="image" />
    <line x1="230" y1="150" x2="250" y2="180" class="image" />
    <line x1="230" y1="130" x2="260" y2="120" class="image" />
  </g>
</svg>