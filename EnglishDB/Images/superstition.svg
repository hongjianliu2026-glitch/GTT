<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">superstition</text>
  <text x="50" y="120" class="subtitle">[ˌsuːpərˈstɪʃn] n. 迷信</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (在上面) + stit (站立) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高处，"高高在上(super-)"，
    <tspan x="50" dy="25">却因为害怕而"站立(stit)"不动，这就是迷信(superstition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She avoided walking under ladders due to superstition.
  </text>
  <text x="50" y="310" class="content">
    她因为迷信而避免从梯子下走过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing on a high place -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="175" y1="20" x2="175" y2="150" class="image" />
    <circle cx="175" cy="170" r="15" class="image" />
    <line x1="175" y1="185" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="155" y2="250" class="image" />
    <line x1="175" y1="220" x2="195" y2="250" class="image" />
    <line x1="175" y1="200" x2="145" y2="190" class="image" />
    <line x1="175" y1="200" x2="205" y2="190" class="image" />
    <!-- Fear expression -->
    <circle cx="165" cy="160" r="5" class="image" />
    <circle cx="185" cy="160" r="5" class="image" />
    <line x1="165" y1="180" x2="185" y2="180" class="image" />
  </g>
</svg>