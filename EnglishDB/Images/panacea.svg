<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">panacea</text>
  <text x="50" y="120" class="subtitle">[ˌpænəˈsiːə] n. 万灵药，万能药</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pan- (全部) + -acea (治疗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神奇的药瓶，里面装着"全部治疗(pan-acea)"
    <tspan x="50" dy="25">所有疾病的万能药，无论什么病都能治愈。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Scientists are searching for a panacea for all diseases.
  </text>
  <text x="50" y="310" class="content">
    科学家们正在寻找一种能治愈所有疾病的万能药。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <!-- Liquid inside -->
    <rect x="25" y="25" width="50" height="150" fill="#16A085" />
    <!-- Label -->
    <text x="40" y="190" class="content" fill="#FFFFFF">Panacea</text>
  </g>
</svg>