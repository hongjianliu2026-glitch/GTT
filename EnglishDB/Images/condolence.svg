<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">condolence</text>
  <text x="50" y="120" class="subtitle">[kənˈdoʊləns] n. 哀悼，慰问</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + dol (悲伤) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围在一起，"共同(con-)"
    <tspan x="50" dy="25">感受悲伤(dol)"，表达慰问(condolence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sent her condolences to the family.
  </text>
  <text x="50" y="310" class="content">
    她向那家人表达了慰问。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Sad faces -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="90" y1="90" x2="110" y2="90" class="image" />
    <line x1="140" y1="90" x2="160" y2="90" class="image" />
    <line x1="50" y1="110" x2="50" y2="130" class="image" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="150" y1="110" x2="150" y2="130" class="image" />
    <!-- Heart -->
    <path d="M100,150 C90,130 70,130 60,150 C50,170 70,190 100,210 C130,190 150,170 140,150 C130,130 110,130 100,150" class="image" />
  </g>
</svg>