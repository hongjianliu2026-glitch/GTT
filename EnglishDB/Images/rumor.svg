<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rumor</text>
  <text x="50" y="120" class="subtitle">[ˈruːmər] n. 谣言，传闻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rum (流言) + or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在窃窃私语，"流言(rum)"
    <tspan x="50" dy="25">像风一样传播开来，形成了谣言(rumor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rumor spread quickly through the office.
  </text>
  <text x="50" y="310" class="content">
    谣言在办公室里迅速传播开来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People whispering -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="60" y1="70" x2="90" y2="70" class="image" />
    <line x1="110" y1="70" x2="140" y2="70" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="80" y1="90" x2="120" y2="90" class="image" />
    <!-- Speech bubbles -->
    <path d="M50,100 Q70,120 90,100 Q110,80 130,100" class="image" />
    <path d="M60,110 Q80,130 100,110 Q120,90 140,110" class="image" />
  </g>
</svg>