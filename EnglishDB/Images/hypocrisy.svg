<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hypocrisy</text>
  <text x="50" y="120" class="subtitle">[hɪˈpɑkrəsi] n. 伪善，虚伪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hypo- (在下面) + cracy (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人表面上"统治(cracy)"着道德高地，
    <tspan x="50" dy="25">但实际上"在下面(hypo-)"隐藏着真实的、不道德的行为，</tspan>
    <tspan x="50" dy="25">这就是伪善(hypocrisy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His hypocrisy was exposed when his secret was revealed.
  </text>
  <text x="50" y="310" class="content">
    当他的秘密被揭露时，他的伪善暴露无遗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mask -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Face -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Smile -->
    <path d="M140,120 Q175,140 210,120" class="image" />
    <!-- Eyes -->
    <circle cx="150" cy="90" r="5" class="image" />
    <circle cx="200" cy="90" r="5" class="image" />
    <!-- Hidden behavior -->
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="220" class="image" />
    <line x1="175" y1="200" x2="200" y2="220" class="image" />
    <line x1="175" y1="180" x2="125" y2="170" class="image" />
    <line x1="175" y1="180" x2="225" y2="170" class="image" />
  </g>
</svg>