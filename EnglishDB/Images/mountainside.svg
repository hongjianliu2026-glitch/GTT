<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mountainside</text>
  <text x="50" y="120" class="subtitle">[ˈmaʊntənˌsaɪd] n. 山腰，山坡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mountain (山) + side (边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的山，"山的一边(mountain-side)"
    <tspan x="50" dy="25">就是山腰(mountainside)，那里可能有茂密的森林和陡峭的斜坡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The climbers set up their camp on the mountainside.
  </text>
  <text x="50" y="310" class="content">
    登山者在山腰上搭起了帐篷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <polygon points="0,200 200,0 400,200" style="fill:#8E44AD;stroke:#7F8C8D;stroke-width:2" />
    <!-- Trees on the mountainside -->
    <g transform="translate(100,150)">
      <polygon points="0,50 25,0 50,50" style="fill:#27AE60;stroke:#7F8C8D;stroke-width:1" />
      <polygon points="10,60 35,10 60,60" style="fill:#27AE60;stroke:#7F8C8D;stroke-width:1" />
      <polygon points="20,70 45,20 70,70" style="fill:#27AE60;stroke:#7F8C8D;stroke-width:1" />
    </g>
    <!-- Mountainside label -->
    <text x="200" y="150" class="highlight" text-anchor="middle">Mountainside</text>
  </g>
</svg>