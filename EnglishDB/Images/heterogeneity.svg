<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heterogeneity</text>
  <text x="50" y="120" class="subtitle">[ˌhetərədʒəˈniːəti] n. 异质性，多样性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hetero- (不同的) + gen (产生) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图，每个拼图块都代表不同的"产生(gen)"，
    <tspan x="50" dy="25">而这些拼图块的"不同(hetero)"构成了整体的"异质性(heterogeneity)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project team's heterogeneity contributed to its success.
  </text>
  <text x="50" y="310" class="content">
    项目团队的多样性促成了它的成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Different shapes -->
    <circle cx="50" cy="50" r="30" class="image" />
    <rect x="170" y="20" width="60" height="60" class="image" />
    <polygon points="290,20 340,70 290,120 240,70" class="image" />
    <rect x="50" y="170" width="60" height="60" class="image" />
    <circle cx="170" cy="170" r="30" class="image" />
    <polygon points="290,170 340,220 290,270 240,220" class="image" />
  </g>
</svg>