<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F57F17; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yellow</text>
  <text x="50" y="120" class="subtitle">[ˈjɛloʊ] adj. 黄色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yell (叫喊) + -ow (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在树上，"叫喊(yell)"着，
    <tspan x="50" dy="25">它的羽毛是黄色的(yellow)，像太阳一样明亮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sun painted the sky yellow at dawn.
  </text>
  <text x="50" y="310" class="content">
    太阳在黎明时分将天空染成了黄色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#FFEB3B" stroke="#F57F17" stroke-width="3" />
    <!-- Bird -->
    <circle cx="200" cy="100" r="20" fill="#FFEB3B" stroke="#F57F17" stroke-width="2" />
    <line x1="200" y1="120" x2="200" y2="160" stroke="#F57F17" stroke-width="2" />
    <line x1="200" y1="160" x2="180" y2="180" stroke="#F57F17" stroke-width="2" />
    <line x1="200" y1="160" x2="220" y2="180" stroke="#F57F17" stroke-width="2" />
    <line x1="200" y1="140" x2="230" y2="130" stroke="#F57F17" stroke-width="2" />
  </g>
</svg>