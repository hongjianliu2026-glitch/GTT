<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cross-country</text>
  <text x="50" y="120" class="subtitle">[ˈkrɔːs ˈkʌntri] adj. 越野的；横贯全国的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cross (穿过) + country (国家)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆越野车"穿过(cross)"整个"国家(country)"，
    <tspan x="50" dy="25">从东海岸到西海岸，这就是"横贯全国的(cross-country)"旅行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to take a cross-country road trip.
  </text>
  <text x="50" y="310" class="content">
    他们决定进行一次横贯全国的公路旅行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Car -->
    <rect x="150" y="70" width="50" height="30" class="image" />
    <circle cx="165" cy="100" r="5" class="image" />
    <circle cx="205" cy="100" r="5" class="image" />
    <!-- Mountains -->
    <polyline points="0,100 50,50 100,100 150,50 200,100 250,50 300,100 350,50" class="image" />
  </g>
</svg>