<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">touring</text>
  <text x="50" y="120" class="subtitle">[ˈtʊrɪŋ] v. 旅行，巡回演出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tour (旅行) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个乐队在世界各地"旅行(tour)"，
    <tspan x="50" dy="25">他们正在进行巡回演出(touring)，</tspan>
    <tspan x="50" dy="25">每个城市都留下了他们的音乐足迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The band is touring Europe this summer.
  </text>
  <text x="50" y="310" class="content">
    乐队今年夏天将在欧洲巡回演出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- World map -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Band members -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <!-- Instruments -->
    <line x1="50" y1="60" x2="50" y2="80" class="image" />
    <line x1="150" y1="60" x2="150" y2="80" class="image" />
    <line x1="100" y1="160" x2="100" y2="180" class="image" />
    <!-- Tour route -->
    <path d="M50,80 Q100,180 150,80" class="image" />
  </g>
</svg>