<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alternating</text>
  <text x="50" y="120" class="subtitle">[ˈɔːltərˌneɪtɪŋ] adj. 交替的，轮流的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alter (改变) + -nating (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舞台上有两个演员，他们"交替(alter)"
    <tspan x="50" dy="25">表演，一个接一个，这就是交替(alternating)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lights in the room were alternating between red and blue.
  </text>
  <text x="50" y="310" class="content">
    房间里的灯光在红色和蓝色之间交替变换。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actor 1 -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="50" y2="140" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <!-- Actor 2 -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="220" y2="220" class="image" />
    <line x1="250" y1="180" x2="280" y2="220" class="image" />
    <line x1="250" y1="150" x2="200" y2="140" class="image" />
    <line x1="250" y1="150" x2="300" y2="140" class="image" />
    <!-- Alternating lines -->
    <line x1="100" y1="20" x2="250" y2="20" class="image" />
    <line x1="100" y1="40" x2="250" y2="40" class="image" />
    <line x1="100" y1="60" x2="250" y2="60" class="image" />
    <line x1="100" y1="80" x2="250" y2="80" class="image" />
  </g>
</svg>