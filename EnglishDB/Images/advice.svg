<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">advice</text>
  <text x="50" y="120" class="subtitle">[ədˈvaɪs] n. 建议，忠告</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + vis (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在寻求建议，"朝向(ad-)"
    <tspan x="50" dy="25">一个智者，智者"看(vis)"着他，</tspan>
    <tspan x="50" dy="25">给出宝贵的建议(advice)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave me some good advice on how to improve my presentation.
  </text>
  <text x="50" y="310" class="content">
    她给了我一些关于如何改进我的演讲的好建议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person seeking advice -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <!-- Wise person giving advice -->
    <circle cx="250" cy="100" r="25" class="image" />
    <line x1="250" y1="125" x2="250" y2="170" class="image" />
    <line x1="250" y1="170" x2="230" y2="210" class="image" />
    <line x1="250" y1="170" x2="270" y2="210" class="image" />
    <line x1="250" y1="150" x2="290" y2="140" class="image" />

    <!-- Speech bubble -->
    <path d="M250,80 Q300,60 350,80 Q300,100 250,80" class="image" />
    <text x="260" y="85" class="content">Advice</text>
  </g>
</svg>