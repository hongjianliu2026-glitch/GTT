<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undeterred</text>
  <text x="50" y="120" class="subtitle">[ˌʌndɪˈtɜːrd] adj. 不气馁的，不屈不挠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + deter (阻止) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面对重重障碍，"不被阻止(un-deterred)"，
    <tspan x="50" dy="25">依然坚定前行，展现出无比的毅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Despite the setbacks, she remained undeterred in her pursuit of the goal.
  </text>
  <text x="50" y="310" class="content">
    尽管遭遇挫折，她依然不屈不挠地追求目标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Obstacles -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="120" y="50" width="100" height="150" class="image" />
    <rect x="240" y="100" width="100" height="100" class="image" />
    <!-- Person -->
    <circle cx="350" cy="150" r="20" class="image" />
    <line x1="350" y1="170" x2="350" y2="250" class="image" />
    <line x1="350" y1="250" x2="330" y2="300" class="image" />
    <line x1="350" y1="250" x2="370" y2="300" class="image" />
    <line x1="350" y1="200" x2="300" y2="180" class="image" />
    <line x1="350" y1="200" x2="400" y2="180" class="image" />
    <!-- Path -->
    <line x1="50" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>