<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #641E16; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #922B21; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bran</text>
  <text x="50" y="120" class="subtitle">[bræn] n. 麸皮，糠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bran (源自中古英语，意为“麸皮”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在磨坊里，"剥离(bran)"
    <tspan x="50" dy="25">小麦的外壳，露出里面的麸皮(bran)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bread is made with whole wheat, including the bran.
  </text>
  <text x="50" y="310" class="content">
    这种面包是用全麦制作的，包括麸皮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mill -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wheat -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="75" y1="20" x2="75" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <!-- Bran -->
    <line x1="120" y1="20" x2="170" y2="20" class="image" />
    <line x1="145" y1="20" x2="145" y2="100" class="image" />
    <line x1="120" y1="100" x2="170" y2="100" class="image" />
    <!-- Farmer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>