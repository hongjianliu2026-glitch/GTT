<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">demote</text>
  <text x="50" y="120" class="subtitle">[diːˈmoʊt] v. 降级，降职</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + mot (移动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个员工从高高的职位上被"向下移动(de-mot)"，
    <tspan x="50" dy="25">就像从梯子上被推下来一样，这就是降级(demote)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was demoted for poor performance.
  </text>
  <text x="50" y="310" class="content">
    他因表现不佳被降职。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ladder -->
    <line x1="50" y1="20" x2="50" y2="200" class="image" />
    <line x1="70" y1="20" x2="70" y2="200" class="image" />
    <line x1="50" y1="40" x2="70" y2="40" class="image" />
    <line x1="50" y1="80" x2="70" y2="80" class="image" />
    <line x1="50" y1="120" x2="70" y2="120" class="image" />
    <line x1="50" y1="160" x2="70" y2="160" class="image" />
    <!-- Person falling -->
    <circle cx="60" cy="100" r="15" class="image" />
    <line x1="60" y1="115" x2="60" y2="150" class="image" />
    <line x1="60" y1="150" x2="40" y2="180" class="image" />
    <line x1="60" y1="150" x2="80" y2="180" class="image" />
    <line x1="60" y1="130" x2="90" y2="120" class="image" />
    <!-- Arrow down -->
    <polygon points="100,100 120,120 100,140 80,120" class="image" />
  </g>
</svg>