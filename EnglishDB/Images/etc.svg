<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">etc</text>
  <text x="50" y="120" class="subtitle">[ˈɛtsə] adv. 等等</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> et cetera (拉丁语，意为“等等”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个无尽的清单，上面列满了各种物品，
    <tspan x="50" dy="25">最后用“等等(etc)”来表示还有很多未列出的东西。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We need to buy milk, bread, eggs, etc.
  </text>
  <text x="50" y="310" class="content">
    我们需要买牛奶、面包、鸡蛋等等。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- List items -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="70" y2="20" class="image" />
    <line x1="50" y1="60" x2="70" y2="60" class="image" />
    <line x1="50" y1="100" x2="70" y2="100" class="image" />
    <line x1="50" y1="140" x2="70" y2="140" class="image" />
    <line x1="50" y1="180" x2="70" y2="180" class="image" />
    <!-- Dots for "etc" -->
    <circle cx="90" cy="160" r="5" class="image" />
    <circle cx="110" cy="160" r="5" class="image" />
    <circle cx="130" cy="160" r="5" class="image" />
  </g>
</svg>