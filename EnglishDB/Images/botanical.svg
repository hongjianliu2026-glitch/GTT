<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #27AE60; }
      .flower { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">botanical</text>
  <text x="50" y="120" class="subtitle">[bəˈtænɪkl] adj. 植物学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> botano- (植物) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个植物学家在花园里，"研究(botano-)"
    <tspan x="50" dy="25">各种植物，这些植物就构成了一个植物学(botanical)的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The botanical garden is home to many rare plants.
  </text>
  <text x="50" y="310" class="content">
    这个植物园里有许多珍稀植物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Plants -->
    <circle cx="50" cy="100" r="20" class="leaf" />
    <circle cx="100" cy="100" r="20" class="leaf" />
    <circle cx="150" cy="100" r="20" class="leaf" />
    <circle cx="200" cy="100" r="20" class="leaf" />
    <circle cx="250" cy="100" r="20" class="leaf" />
    <!-- Flowers -->
    <circle cx="75" cy="70" r="10" class="flower" />
    <circle cx="125" cy="70" r="10" class="flower" />
    <circle cx="175" cy="70" r="10" class="flower" />
    <circle cx="225" cy="70" r="10" class="flower" />
    <circle cx="275" cy="70" r="10" class="flower" />
    <!-- Botanist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>