<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">redistribute</text>
  <text x="50" y="120" class="subtitle">[ˌriːdɪˈstrɪbjuːt] v. 重新分配，再分配</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + distribute (分配)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天平，"再次分配(re-distribute)"
    <tspan x="50" dy="25">资源，确保每个人都能公平地获得所需。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government decided to redistribute the wealth among the citizens.
  </text>
  <text x="50" y="310" class="content">
    政府决定在公民之间重新分配财富。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="100" y1="50" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <!-- Resources -->
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="50" cy="170" r="10" class="image" />
    <circle cx="150" cy="170" r="10" class="image" />
    <circle cx="50" cy="190" r="10" class="image" />
    <circle cx="150" cy="190" r="10" class="image" />
  </g>
</svg>