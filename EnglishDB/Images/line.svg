<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">line</text>
  <text x="50" y="120" class="subtitle">[laɪn] n. 线，线条；v. 排队</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lin (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条笔直的线，"拉直(lin)"
    <tspan x="50" dy="25">就像人们在排队一样，每个人都站成一条直线(line)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The students lined up in front of the school.
  </text>
  <text x="50" y="310" class="content">
    学生们在校门前排成一队。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Straight line -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <!-- People in line -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
  </g>
</svg>