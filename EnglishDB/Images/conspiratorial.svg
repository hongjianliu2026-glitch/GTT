<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conspiratorial</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnspɪrəˈtɔːriəl] adj. 阴谋的，阴谋论的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + spir (呼吸) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一个秘密房间里，"一起呼吸(con-spir)"
    <tspan x="50" dy="25">策划着某个阴谋，这种氛围就是阴谋的(conspiratorial)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie's plot was filled with conspiratorial intrigue.
  </text>
  <text x="50" y="310" class="content">
    这部电影的情节充满了阴谋的悬念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Secret room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Whispering -->
    <line x1="50" y1="70" x2="100" y2="70" class="image" />
    <line x1="100" y1="70" x2="150" y2="70" class="image" />
    <!-- Secret documents -->
    <rect x="200" y="20" width="100" height="160" class="image" />
    <line x1="220" y1="50" x2="280" y2="50" class="image" />
    <line x1="220" y1="80" x2="280" y2="80" class="image" />
    <line x1="220" y1="110" x2="280" y2="110" class="image" />
    <line x1="220" y1="140" x2="280" y2="140" class="image" />
  </g>
</svg>