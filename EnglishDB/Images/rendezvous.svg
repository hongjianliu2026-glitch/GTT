<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rendezvous</text>
  <text x="50" y="120" class="subtitle">[ˈrɒndɪvuː] n. 约会，会合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + de- (向下) + vous (来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在公园里，"再次向下(re-de-vous)"
    <tspan x="50" dy="25">走到一起，他们的约会(rendezvous)即将开始。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They arranged a rendezvous at the café.
  </text>
  <text x="50" y="310" class="content">
    他们在咖啡馆安排了一次约会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park bench -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <!-- Two people -->
    <circle cx="100" cy="75" r="15" class="image" />
    <line x1="100" y1="90" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="150" class="image" />
    <circle cx="250" cy="75" r="15" class="image" />
    <line x1="250" y1="90" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <!-- Path -->
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>