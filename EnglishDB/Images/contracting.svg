<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contracting</text>
  <text x="50" y="120" class="subtitle">[kənˈtræktɪŋ] v. 收缩，签订合同</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tract (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人握手，"一起拉近(con-tract)"
    <tspan x="50" dy="25">彼此的距离，签订了一份合同(contracting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is contracting with a new supplier.
  </text>
  <text x="50" y="310" class="content">
    公司正在与一个新的供应商签订合同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two hands shaking -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="70" y1="100" x2="70" y2="150" class="image" />
    <line x1="130" y1="100" x2="130" y2="150" class="image" />
    <line x1="70" y1="150" x2="130" y2="150" class="image" />
    <!-- Contract paper -->
    <rect x="50" y="160" width="100" height="50" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
  </g>
</svg>