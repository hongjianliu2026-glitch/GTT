<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">high-rise</text>
  <text x="50" y="120" class="subtitle">[ˈhaɪˌraɪz] adj. 高层的；n. 高层建筑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + rise (上升)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高耸入云的摩天大楼，"高高升起(high-rise)"，
    <tspan x="50" dy="25">仿佛要触摸到天空，这就是高层建筑(high-rise)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city is filled with high-rise buildings.
  </text>
  <text x="50" y="310" class="content">
    这座城市到处都是高层建筑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High-rise building -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="180" class="image" />
    <rect x="40" y="40" width="20" height="160" class="image" />
    <rect x="60" y="60" width="20" height="140" class="image" />
    <rect x="80" y="80" width="20" height="120" class="image" />
    <rect x="100" y="100" width="20" height="100" class="image" />
    <rect x="120" y="120" width="20" height="80" class="image" />
    <rect x="140" y="140" width="20" height="60" class="image" />
    <rect x="160" y="160" width="20" height="40" class="image" />
    <rect x="180" y="180" width="20" height="20" class="image" />
  </g>
</svg>