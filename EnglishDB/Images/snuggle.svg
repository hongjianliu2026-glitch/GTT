<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snuggle</text>
  <text x="50" y="120" class="subtitle">[ˈsnʌɡəl] v. 依偎，紧靠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snug (舒适的) + -gle (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在温暖的毯子里，"舒适地依偎(snug-gle)"
    <tspan x="50" dy="25">在一起，享受着温暖的时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby likes to snuggle up to his mother.
  </text>
  <text x="50" y="310" class="content">
    宝宝喜欢依偎在妈妈身边。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blanket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cat -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="170" class="image" />
    <line x1="100" y1="150" x2="130" y2="170" class="image" />
    <line x1="100" y1="180" x2="70" y2="200" class="image" />
    <line x1="100" y1="180" x2="130" y2="200" class="image" />
    <!-- Text -->
    <text x="150" y="120" class="content">小猫依偎在毯子里</text>
  </g>
</svg>