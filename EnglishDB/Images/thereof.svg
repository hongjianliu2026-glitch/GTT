<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thereof</text>
  <text x="50" y="120" class="subtitle">[ðɛrˈʌv] adv. 由此，因此</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> there (那里) + of (的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，"那里(there)"有一棵树，"的(of)"
    <tspan x="50" dy="25">果实掉下来，"由此(thereof)"我们得到了美味的水果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The contract and all documents thereof are binding.
  </text>
  <text x="50" y="310" class="content">
    合同及其所有相关文件均具有约束力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="20" y2="100" class="image" />
    <line x1="50" y1="50" x2="80" y2="100" class="image" />
    <line x1="50" y1="50" x2="30" y2="70" class="image" />
    <line x1="50" y1="50" x2="70" y2="70" class="image" />
    <!-- Fruit -->
    <circle cx="40" cy="80" r="10" class="image" />
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="50" cy="60" r="10" class="image" />
    <!-- Falling fruit -->
    <circle cx="50" cy="120" r="10" class="image" />
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
  </g>
</svg>