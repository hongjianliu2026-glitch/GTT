<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contending</text>
  <text x="50" y="120" class="subtitle">[kənˈtendɪŋ] v. 竞争，争论</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tend (伸展)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在赛场上，"一起伸展(con-tend)"
    <tspan x="50" dy="25">他们的手臂，争夺胜利，这就是竞争(contending)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two teams are contending for the championship.
  </text>
  <text x="50" y="310" class="content">
    两支队伍正在争夺冠军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arena -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two people -->
    <circle cx="70" cy="100" r="15" class="image" />
    <line x1="70" y1="115" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="70" y1="130" x2="100" y2="120" class="image" />

    <circle cx="280" cy="100" r="15" class="image" />
    <line x1="280" y1="115" x2="280" y2="150" class="image" />
    <line x1="280" y1="150" x2="260" y2="180" class="image" />
    <line x1="280" y1="150" x2="300" y2="180" class="image" />
    <line x1="280" y1="130" x2="310" y2="120" class="image" />

    <!-- Arms stretching -->
    <line x1="70" y1="130" x2="280" y2="130" class="image" />
  </g>
</svg>