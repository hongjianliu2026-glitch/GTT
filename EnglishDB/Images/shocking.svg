<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shocking</text>
  <text x="50" y="120" class="subtitle">[ˈʃɒkɪŋ] adj. 令人震惊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shock (冲击) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"冲击(shock)"到，表情惊愕，
    <tspan x="50" dy="25">这种强烈的情感体验就是"令人震惊的(shocking)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the accident was shocking.
  </text>
  <text x="50" y="310" class="content">
    事故的消息令人震惊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shocked face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="80" cy="80" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <line x1="100" y1="140" x2="100" y2="150" class="image" />
    <line x1="90" y1="145" x2="100" y2="140" class="image" />
    <line x1="110" y1="145" x2="100" y2="140" class="image" />
  </g>
</svg>