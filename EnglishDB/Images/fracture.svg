<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fracture</text>
  <text x="50" y="120" class="subtitle">[ˈfræktʃər] n. 骨折，断裂；v. 使断裂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fract (打破) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根骨头被"打破(fract)"成两半，
    <tspan x="50" dy="25">这就是骨折(fracture)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffered a fracture in his leg during the accident.
  </text>
  <text x="50" y="310" class="content">
    他在事故中腿部骨折。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bone -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Fracture -->
    <line x1="175" y1="30" x2="175" y2="70" class="image" />
    <line x1="170" y1="40" x2="180" y2="60" class="image" />
    <line x1="180" y1="40" x2="170" y2="60" class="image" />
    <!-- Broken parts -->
    <line x1="50" y1="50" x2="175" y2="50" class="image" />
    <line x1="175" y1="50" x2="300" y2="50" class="image" />
  </g>
</svg>