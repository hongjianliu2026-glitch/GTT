<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rancid</text>
  <text x="50" y="120" class="subtitle">[ˈrænsɪd] adj. 腐臭的，变质的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ranc (腐烂) + id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块腐烂的肉，"腐烂(ranc)"
    <tspan x="50" dy="25">到极致，散发出令人作呕的臭味，这就是rancid(腐臭的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The milk had turned rancid after sitting out all day.
  </text>
  <text x="50" y="310" class="content">
    牛奶在外面放了一整天后变质了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rotten meat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="100" cy="100" r="50" class="image" fill="#8B4513" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" stroke="#A52A2A" stroke-width="5" />
    <line x1="100" y1="70" x2="100" y2="130" class="image" stroke="#A52A2A" stroke-width="5" />
    <line x1="85" y1="85" x2="115" y2="115" class="image" stroke="#A52A2A" stroke-width="5" />
    <line x1="85" y1="115" x2="115" y2="85" class="image" stroke="#A52A2A" stroke-width="5" />
    <!-- Smell lines -->
    <line x1="150" y1="80" x2="200" y2="50" class="image" stroke="#000000" stroke-width="2" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" stroke="#000000" stroke-width="2" />
    <line x1="150" y1="120" x2="200" y2="150" class="image" stroke="#000000" stroke-width="2" />
  </g>
</svg>