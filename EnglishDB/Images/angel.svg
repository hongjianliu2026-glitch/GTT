<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">angel</text>
  <text x="50" y="120" class="subtitle">[ˈeɪndʒl] n. 天使</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> angel (源自希腊语 "angelos"，意为“使者”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天使(angel)从天而降，带着光芒和和平，
    <tspan x="50" dy="25">传递着上帝的讯息，守护着人间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She believes her guardian angel is always watching over her.
  </text>
  <text x="50" y="310" class="content">
    她相信她的守护天使一直在守护着她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angel body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Angel wings -->
    <path d="M 50 100 Q 0 50 50 0 L 150 0 Q 200 50 150 100 Z" class="image" />
    <!-- Halo -->
    <circle cx="100" cy="50" r="20" class="image" />
    <!-- Light rays -->
    <line x1="100" y1="70" x2="100" y2="20" class="image" />
    <line x1="80" y1="60" x2="60" y2="40" class="image" />
    <line x1="120" y1="60" x2="140" y2="40" class="image" />
  </g>
</svg>