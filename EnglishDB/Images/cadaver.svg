<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E9E2; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #6D4C41; }
      .content { font: 18px sans-serif; fill: #4E342E; }
      .highlight { font-weight: bold; fill: #B71C1C; }
      .story { font: 16px serif; fill: #3E2723; }
      .image { stroke: #795548; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cadaver</text>
  <text x="50" y="120" class="subtitle">[kəˈdeɪvər] n. 尸体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cadaver (尸体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法医在解剖室里，面对着一具"尸体(cadaver)"，
    <tspan x="50" dy="25">他正在仔细检查每一个细节，试图找出死因。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forensic scientist examined the cadaver for clues.
  </text>
  <text x="50" y="310" class="content">
    法医科学家检查尸体以寻找线索。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cadaver -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Forensic scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Tools -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>