<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intravenous</text>
  <text x="50" y="120" class="subtitle">[ˌɪntrəˈviːnəs] adj. 静脉内的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intra- (在内) + ven (静脉) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生正在给病人进行静脉注射，"将药物直接送入(intra-ven)"
    <tspan x="50" dy="25">静脉(ven)，这种注射方式就是静脉内的(intravenous)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor administered the medication intravenously.
  </text>
  <text x="50" y="310" class="content">
    医生通过静脉注射给药。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arm with vein -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="80" x2="250" y2="80" class="image" />
    <line x1="50" y1="110" x2="250" y2="110" class="image" />
    <line x1="50" y1="140" x2="250" y2="140" class="image" />
    <!-- Syringe -->
    <rect x="150" y="20" width="50" height="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <line x1="175" y1="120" x2="175" y2="140" class="image" />
    <!-- Blood drop -->
    <circle cx="200" cy="160" r="10" class="image" />
  </g>
</svg>