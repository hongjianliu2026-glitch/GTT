<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compliant</text>
  <text x="50" y="120" class="subtitle">[kəmˈplaɪənt] adj. 顺从的，服从的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + pli (折叠) + ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对权威时，"共同折叠(com-pli)"
    <tspan x="50" dy="25">自己的意愿，完全顺从(compliant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was always compliant with her boss's orders.
  </text>
  <text x="50" y="310" class="content">
    她总是顺从老板的命令。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Folded arms -->
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <!-- Authority figure -->
    <circle cx="200" cy="100" r="25" class="image" />
    <line x1="200" y1="125" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="210" class="image" />
    <line x1="200" y1="170" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
    <!-- Order arrow -->
    <line x1="200" y1="125" x2="50" y2="125" class="image" />
    <polygon points="45,125 50,120 55,125" class="image" />
  </g>
</svg>