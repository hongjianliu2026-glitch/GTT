<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crumple</text>
  <text x="50" y="120" class="subtitle">[ˈkrʌmpl] v. 弄皱，压皱；n. 皱褶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crum (压) + ple (折叠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张纸被"压(crum)"和"折叠(ple)"，
    <tspan x="50" dy="25">最终变成了皱巴巴的(crumple)样子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She crumpled the letter and threw it away.
  </text>
  <text x="50" y="310" class="content">
    她把信揉成一团，然后扔掉了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Crumpled paper -->
    <path d="M50,20 Q70,50 100,20 T150,20 T200,20 T250,20 T300,20 T350,20" class="image" />
    <path d="M50,50 Q70,80 100,50 T150,50 T200,50 T250,50 T300,50 T350,50" class="image" />
    <path d="M50,80 Q70,110 100,80 T150,80 T200,80 T250,80 T300,80 T350,80" class="image" />
    <path d="M50,110 Q70,140 100,110 T150,110 T200,110 T250,110 T300,110 T350,110" class="image" />
    <path d="M50,140 Q70,170 100,140 T150,140 T200,140 T250,140 T300,140 T350,140" class="image" />
  </g>
</svg>