<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mammoth</text>
  <text x="50" y="120" class="subtitle">[ˈmæməθ] n. 猛犸象；adj. 巨大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mamm (乳房) + -oth (表示“大”的后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的猛犸象，它的乳房(mamm)
    <tspan x="50" dy="25">巨大到可以喂养整个象群，这就是“mammoth”的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The construction project was a mammoth undertaking.
  </text>
  <text x="50" y="310" class="content">
    这个建筑项目是一个巨大的工程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mammoth body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Head -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Tusks -->
    <line x1="30" y1="90" x2="0" y2="60" class="image" />
    <line x1="70" y1="90" x2="100" y2="60" class="image" />
    <!-- Body -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Legs -->
    <line x1="120" y1="150" x2="120" y2="200" class="image" />
    <line x1="230" y1="150" x2="230" y2="200" class="image" />
    <!-- Tail -->
    <line x1="250" y1="100" x2="300" y2="120" class="image" />
  </g>
</svg>