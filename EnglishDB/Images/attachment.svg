<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">attachment</text>
  <text x="50" y="120" class="subtitle">[əˈtætʃmənt] n. 附件，依恋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> at- (向) + tach (钉) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把心"钉向(at-tach)"某人或某物，
    <tspan x="50" dy="25">这种强烈的情感连接就形成了依恋(attachment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a strong attachment to her childhood home.
  </text>
  <text x="50" y="310" class="content">
    她对童年的家有着强烈的依恋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart -->
    <path d="M50,50 C50,25 90,25 90,50 S130,75 130,50" class="image" />
    <!-- Nail -->
    <line x1="80" y1="50" x2="80" y2="100" class="image" />
    <line x1="75" y1="95" x2="85" y2="95" class="image" />
    <!-- Person -->
    <circle cx="150" cy="75" r="20" class="image" />
    <line x1="150" y1="95" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="130" y2="160" class="image" />
    <line x1="150" y1="130" x2="170" y2="160" class="image" />
    <line x1="150" y1="110" x2="180" y2="100" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="75" x2="100" y2="50" class="image" />
    <polygon points="100,50 95,45 95,55" class="image" />
  </g>
</svg>