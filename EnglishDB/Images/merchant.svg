<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">merchant</text>
  <text x="50" y="120" class="subtitle">[ˈmɜːrtʃənt] n. 商人，批发商</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> merc (贸易) + -ant (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人(merchant)在市场上，"贸易(merc)"
    <tspan x="50" dy="25">和交换商品，他就是一个商人(merchant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The merchant sold his goods at the market.
  </text>
  <text x="50" y="310" class="content">
    商人在市场上出售他的商品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Merchant -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Goods -->
    <rect x="100" y="50" width="50" height="50" class="image" />
    <rect x="160" y="50" width="50" height="50" class="image" />
    <rect x="220" y="50" width="50" height="50" class="image" />
    <!-- Market sign -->
    <line x1="20" y1="20" x2="330" y2="20" class="image" />
    <text x="150" y="40" class="content" fill="#7F8C8D">Market</text>
  </g>
</svg>