<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clatter</text>
  <text x="50" y="120" class="subtitle">[ˈklætər] v. 发出哗啦声，喧闹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clat (发出声音) + -ter (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨房里，锅碗瓢盆"哗啦哗啦(clat-ter)"地掉在地上，
    <tspan x="50" dy="25">发出连续的响声，这就是clatter的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dishes clattered as they fell off the shelf.
  </text>
  <text x="50" y="310" class="content">
    盘子从架子上掉下来，发出哗啦声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kitchen scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Falling dishes -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="70" r="20" class="image" />
    <circle cx="150" cy="90" r="20" class="image" />
    <circle cx="200" cy="110" r="20" class="image" />
    <!-- Ground -->
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
    <!-- Sound waves -->
    <line x1="50" y1="50" x2="30" y2="30" class="image" />
    <line x1="50" y1="50" x2="70" y2="30" class="image" />
    <line x1="100" y1="70" x2="80" y2="50" class="image" />
    <line x1="100" y1="70" x2="120" y2="50" class="image" />
    <line x1="150" y1="90" x2="130" y2="70" class="image" />
    <line x1="150" y1="90" x2="170" y2="70" class="image" />
    <line x1="200" y1="110" x2="180" y2="90" class="image" />
    <line x1="200" y1="110" x2="220" y2="90" class="image" />
  </g>
</svg>