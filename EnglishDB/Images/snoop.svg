<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snoop</text>
  <text x="50" y="120" class="subtitle">[snuːp] v. 窥探，探听</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sno- (鼻子) + op (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小狗用鼻子"嗅探(sno-op)"
    <tspan x="50" dy="25">周围的一切，试图发现隐藏的秘密。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to snoop around her neighbor's garden.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在邻居的花园里四处窥探。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Leg 1 -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Leg 2 -->
    <line x1="50" y1="140" x2="20" y2="130" class="image" /> <!-- Ear 1 -->
    <line x1="50" y1="140" x2="80" y2="130" class="image" /> <!-- Ear 2 -->
    <!-- Nose -->
    <circle cx="50" cy="120" r="5" class="image" />
    <!-- Sniffing action -->
    <line x1="50" y1="125" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="170" class="image" />
    <line x1="50" y1="150" x2="70" y2="170" class="image" />
  </g>
</svg>