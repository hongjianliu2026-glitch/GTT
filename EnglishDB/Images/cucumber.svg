<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cucumber</text>
  <text x="50" y="120" class="subtitle">[ˈkjuːkʌmbə(r)] n. 黄瓜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cucum- (黄瓜) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的黄瓜(cucumber)从天而降，
    <tspan x="50" dy="25">砸在了一个菜园里，所有的蔬菜都惊呆了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sliced the cucumber for the salad.
  </text>
  <text x="50" y="310" class="content">
    她为沙拉切了黄瓜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant cucumber -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Garden -->
    <rect x="50" y="180" width="250" height="100" class="image" />
    <!-- Vegetables -->
    <circle cx="100" cy="230" r="10" class="image" />
    <circle cx="150" cy="230" r="10" class="image" />
    <circle cx="200" cy="230" r="10" class="image" />
    <circle cx="250" cy="230" r="10" class="image" />
  </g>
</svg>