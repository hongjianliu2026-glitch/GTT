<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">embarrass</text>
  <text x="50" y="120" class="subtitle">[ɪmˈbærəs] v. 使尴尬，使为难</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (进入) + bar (障碍) + ass (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公共场合突然被"推进(em-)"一个"障碍(bar)"中，
    <tspan x="50" dy="25">感到非常"尴尬(embarrass)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was embarrassed when she tripped in front of everyone.
  </text>
  <text x="50" y="310" class="content">
    她在大家面前摔倒时感到很尴尬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Barrier -->
    <rect x="100" y="80" width="50" height="100" class="image" />
    <!-- Arrow -->
    <line x1="20" y1="100" x2="90" y2="100" class="image" />
    <polygon points="90,100 80,95 80,105" class="image" />
  </g>
</svg>