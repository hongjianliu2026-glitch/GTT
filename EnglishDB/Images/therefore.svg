<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">therefore</text>
  <text x="50" y="120" class="subtitle">[ˈðɛərˈfɔːr] adv. 因此，所以</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ther- (那里) + fore (前面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个地方，"那里(ther)"
    <tspan x="50" dy="25">前面(fore)发生了某件事，所以他"因此(therefore)"做出了反应。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was tired, therefore he went to bed early.
  </text>
  <text x="50" y="310" class="content">
    他很累，所以他早早就上床睡觉了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,100 140,95 140,105" class="image" />
    <!-- Event -->
    <rect x="160" y="80" width="50" height="40" class="image" />
    <text x="170" y="105" class="content">Event</text>
    <!-- Reaction -->
    <rect x="220" y="80" width="50" height="40" class="image" />
    <text x="230" y="105" class="content">Reaction</text>
  </g>
</svg>