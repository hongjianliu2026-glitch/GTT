<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">strengthening</text>
  <text x="50" y="120" class="subtitle">[ˈstrɛŋθənɪŋ] n. 加强，强化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strength (力量) + -en (使) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大力士在健身房里，"使(en)"
    <tspan x="50" dy="25">自己的力量(strength)不断增强，这就是加强(strengthening)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Regular exercise is a great way to strengthen your muscles.
  </text>
  <text x="50" y="310" class="content">
    定期锻炼是增强肌肉的好方法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gym -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dumbbell -->
    <rect x="50" y="50" width="50" height="100" class="image" />
    <rect x="100" y="50" width="50" height="100" class="image" />
    <!-- Weight plates -->
    <circle cx="75" cy="160" r="15" class="image" />
    <circle cx="125" cy="160" r="15" class="image" />
    <!-- Bodybuilder -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <line x1="200" y1="140" x2="160" y2="130" class="image" />
  </g>
</svg>