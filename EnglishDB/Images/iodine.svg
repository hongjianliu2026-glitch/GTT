<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .iodine { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">iodine</text>
  <text x="50" y="120" class="subtitle">[ˈaɪədiːn] n. 碘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> iodo- (碘) + -ine (表示物质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学实验室里，一瓶"碘(iodo-)"溶液，
    <tspan x="50" dy="25">它的颜色深沉如夜，象征着碘的神秘与重要性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Iodine is essential for the production of thyroid hormones.
  </text>
  <text x="50" y="310" class="content">
    碘是甲状腺激素生产的关键。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flask -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Iodine solution -->
    <rect x="20" y="20" width="110" height="160" class="iodine" />
    <!-- Label -->
    <text x="40" y="190" class="content">Iodine</text>
  </g>
</svg>