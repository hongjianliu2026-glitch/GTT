<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">honk</text>
  <text x="50" y="120" class="subtitle">[hɒŋk] v. 按喇叭，发出喇叭声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> honk (源自拟声词，模仿喇叭声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在路上，司机按下喇叭，发出"轰轰(honk)"的声音，
    <tspan x="50" dy="25">提醒行人注意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The driver honked his horn to warn the pedestrians.
  </text>
  <text x="50" y="310" class="content">
    司机按喇叭提醒行人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="100" class="image" />
    <rect x="70" y="40" width="210" height="60" class="image" />
    <!-- Wheels -->
    <circle cx="100" cy="140" r="20" class="image" />
    <circle cx="250" cy="140" r="20" class="image" />
    <!-- Horn -->
    <line x1="150" y1="20" x2="150" y2="0" class="image" />
    <circle cx="150" cy="0" r="10" class="image" />
  </g>
</svg>