<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">season</text>
  <text x="50" y="120" class="subtitle">[ˈsiːzn] n. 季节，时节；v. 调味，使适应</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + as (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象大自然"分开生长(se-as)"的四个季节，
    <tspan x="50" dy="25">每个季节都有独特的风景和味道，这就是季节(season)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Spring is my favorite season because of the blooming flowers.
  </text>
  <text x="50" y="310" class="content">
    春天是我最喜欢的季节，因为到处都是盛开的花朵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spring -->
    <circle cx="50" cy="50" r="30" class="image" fill="#2ECC71" />
    <text x="40" y="55" class="content" fill="#FFFFFF">春</text>
    <!-- Summer -->
    <rect x="100" y="20" width="60" height="60" class="image" fill="#F39C12" />
    <text x="110" y="55" class="content" fill="#FFFFFF">夏</text>
    <!-- Autumn -->
    <ellipse cx="220" cy="50" rx="35" ry="20" class="image" fill="#D35400" />
    <text x="205" y="55" class="content" fill="#FFFFFF">秋</text>
    <!-- Winter -->
    <polygon points="280,20 310,80 250,80" class="image" fill="#3498DB" />
    <text x="270" y="55" class="content" fill="#FFFFFF">冬</text>
  </g>
</svg>