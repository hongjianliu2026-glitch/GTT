<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parochial</text>
  <text x="50" y="120" class="subtitle">[pəˈroʊkiəl] adj. 教区的，狭隘的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (旁边) + ochi (眼睛) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人只用"旁边(para)"的"眼睛(ochi)"看世界，
    <tspan x="50" dy="25">他的视野就变得非常狭隘(parochial)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His parochial views prevented him from understanding global issues.
  </text>
  <text x="50" y="310" class="content">
    他狭隘的观点使他无法理解全球性问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="image" fill="#2C3E50" />
    <!-- Narrow vision -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <!-- World -->
    <circle cx="250" cy="100" r="70" class="image" />
    <line x1="250" y1="30" x2="250" y2="170" class="image" />
    <line x1="180" y1="100" x2="320" y2="100" class="image" />
    <line x1="250" y1="30" x2="180" y2="100" class="image" />
    <line x1="250" y1="30" x2="320" y2="100" class="image" />
    <line x1="250" y1="170" x2="180" y2="100" class="image" />
    <line x1="250" y1="170" x2="320" y2="100" class="image" />
  </g>
</svg>