<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ascending</text>
  <text x="50" y="120" class="subtitle">[əˈsendɪŋ] adj. 上升的，升序的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (向上) + scend (爬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小蚂蚁在努力"向上爬(a-scend)"，
    <tspan x="50" dy="25">它的努力就像数字按升序排列一样，不断上升(ascending)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The numbers are arranged in ascending order.
  </text>
  <text x="50" y="310" class="content">
    这些数字按升序排列。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ant climbing up -->
    <line x1="50" y1="180" x2="50" y2="50" class="image" />
    <circle cx="50" cy="180" r="10" class="image" />
    <line x1="50" y1="170" x2="40" y2="160" class="image" />
    <line x1="50" y1="170" x2="60" y2="160" class="image" />
    <line x1="50" y1="170" x2="45" y2="150" class="image" />
    <line x1="50" y1="170" x2="55" y2="150" class="image" />
    <line x1="50" y1="170" x2="50" y2="140" class="image" />
    <line x1="50" y1="140" x2="50" y2="110" class="image" />
    <line x1="50" y1="110" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="50" y2="50" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <line x1="50" y1="40" x2="40" y2="30" class="image" />
    <line x1="50" y1="40" x2="60" y2="30" class="image" />
    <line x1="50" y1="40" x2="45" y2="20" class="image" />
    <line x1="50" y1="40" x2="55" y2="20" class="image" />
    <line x1="50" y1="40" x2="50" y2="10" class="image" />
  </g>
</svg>