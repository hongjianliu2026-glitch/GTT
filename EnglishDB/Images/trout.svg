<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trout</text>
  <text x="50" y="120" class="subtitle">[traʊt] n. 鳟鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "troute"，意为“鳟鱼”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条鳟鱼在清澈的溪流中游动，它的身体闪烁着银色的光芒，仿佛在水中跳跃的精灵。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fisherman caught a large trout in the river.
  </text>
  <text x="50" y="310" class="content">
    渔夫在河里钓到了一条大鳟鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Trout -->
    <path d="M50,100 C60,80 100,80 110,100 S140,120 130,140" class="image" fill="#FFD700" />
    <circle cx="80" cy="120" r="10" class="image" fill="#000000" />
    <line x1="50" y1="100" x2="40" y2="90" class="image" />
    <line x1="50" y1="100" x2="40" y2="110" class="image" />
    <line x1="130" y1="140" x2="140" y2="130" class="image" />
    <line x1="130" y1="140" x2="140" y2="150" class="image" />
  </g>
</svg>