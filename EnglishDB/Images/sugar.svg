<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sugar { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sugar</text>
  <text x="50" y="120" class="subtitle">[ˈʃʊɡər] n. 糖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> su- (甜) + gar (糖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的糖块，"甜甜的(su-)"
    <tspan x="50" dy="25">糖块(gar)，让人忍不住想舔一口。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added a spoonful of sugar to her tea.
  </text>
  <text x="50" y="310" class="content">
    她在茶里加了一勺糖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sugar cube -->
    <rect x="0" y="0" width="100" height="100" class="sugar" />
    <rect x="20" y="20" width="100" height="100" class="sugar" />
    <rect x="40" y="40" width="100" height="100" class="sugar" />
    <!-- Tongue -->
    <path d="M150,50 Q180,20 210,50" class="image" />
    <circle cx="210" cy="50" r="10" class="image" />
  </g>
</svg>