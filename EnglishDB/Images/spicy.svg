<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #E67E22; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .pepper { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spicy</text>
  <text x="50" y="120" class="subtitle">[ˈspaɪsi] adj. 辛辣的，有风味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spi (来自拉丁语 spica, 穗) + -cy (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一串辣椒，"穗状(spi)"的辣椒，
    <tspan x="50" dy="25">每一颗都充满了"辛辣(spicy)"的味道。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The curry was too spicy for me.
  </text>
  <text x="50" y="310" class="content">
    这咖喱对我来说太辣了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pepper plant -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <!-- Peppers -->
    <circle cx="50" cy="50" r="20" class="pepper" />
    <circle cx="50" cy="100" r="25" class="pepper" />
    <circle cx="50" cy="150" r="30" class="pepper" />
  </g>
</svg>