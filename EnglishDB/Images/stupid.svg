<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stupid</text>
  <text x="50" y="120" class="subtitle">[ˈstjuːpɪd] adj. 愚蠢的，笨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stu- (笨) + pid (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考时，"笨笨地(stu-pid)"
    <tspan x="50" dy="25">挠头，完全不知道该怎么做，这就是愚蠢(stupid)的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was stupid of him to forget his keys.
  </text>
  <text x="50" y="310" class="content">
    他忘记带钥匙真是太愚蠢了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="10" class="image" />
    <circle cx="120" cy="85" r="10" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Hand scratching head -->
    <line x1="150" y1="100" x2="180" y2="80" class="image" />
    <line x1="180" y1="80" x2="180" y2="120" class="image" />
  </g>
</svg>