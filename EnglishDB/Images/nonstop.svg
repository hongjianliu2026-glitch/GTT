<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nonstop</text>
  <text x="50" y="120" class="subtitle">[ˈnɒnˌstɒp] adj. 不停的，不断的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> non- (不) + stop (停止)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆火车在轨道上"不停(non-stop)"地行驶，
    <tspan x="50" dy="25">没有停靠站，一直前进，这就是"nonstop"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flight from New York to London is nonstop.
  </text>
  <text x="50" y="310" class="content">
    从纽约到伦敦的航班是直飞的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Train track -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Train -->
    <rect x="50" y="80" width="100" height="40" class="image" />
    <rect x="150" y="80" width="50" height="40" class="image" />
    <rect x="200" y="80" width="100" height="40" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="120" r="10" class="image" />
    <circle cx="120" cy="120" r="10" class="image" />
    <circle cx="220" cy="120" r="10" class="image" />
    <circle cx="270" cy="120" r="10" class="image" />
  </g>
</svg>