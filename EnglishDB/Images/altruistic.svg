<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">altruistic</text>
  <text x="50" y="120" class="subtitle">[ˌæltruˈɪstɪk] adj. 利他的，无私的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> altru- (他人) + -istic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把心形气球送给别人，"为他人(altru-)"
    <tspan x="50" dy="25">着想，这种无私的行为就是利他的(altruistic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She showed an altruistic attitude by volunteering at the shelter.
  </text>
  <text x="50" y="310" class="content">
    她在收容所做志愿者，展现了无私的态度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person giving heart balloon -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <!-- Heart balloon -->
    <path d="M100,100 C110,80 130,80 140,100 L140,120 C130,140 110,140 100,120 Z" class="image" fill="#E74C3C" />
    <line x1="120" y1="120" x2="120" y2="180" class="image" />
    <line x1="120" y1="150" x2="100" y2="130" class="image" />
    <line x1="120" y1="150" x2="140" y2="130" class="image" />
    <line x1="120" y1="180" x2="100" y2="210" class="image" />
    <line x1="120" y1="180" x2="140" y2="210" class="image" />
  </g>
</svg>