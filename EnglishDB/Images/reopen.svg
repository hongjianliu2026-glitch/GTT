<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reopen</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈoʊpən] v. 重新开放</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + open (打开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个关闭的门，"再次打开(re-open)"，
    <tspan x="50" dy="25">象征着重新开放(reopen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store decided to reopen after the renovation.
  </text>
  <text x="50" y="310" class="content">
    商店在装修后决定重新开放。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Closed door -->
    <rect x="0" y="0" width="150" height="250" class="image" />
    <line x1="75" y1="0" x2="75" y2="250" class="image" />
    <!-- Opened door -->
    <rect x="160" y="0" width="150" height="250" class="image" />
    <line x1="160" y1="0" x2="310" y2="125" class="image" />
    <line x1="310" y1="125" x2="160" y2="250" class="image" />
  </g>
</svg>