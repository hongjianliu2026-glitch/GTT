<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .stone { fill: #D5DBDB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">limestone</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪmstoʊn] n. 石灰石</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lime (石灰) + stone (石头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片巨大的石灰石(limestone)山脉，
    <tspan x="50" dy="25">石灰(lime)与石头(stone)的结合，形成了坚硬的石灰石。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient building was constructed with limestone.
  </text>
  <text x="50" y="310" class="content">
    这座古老的建筑是用石灰石建造的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Limestone mountain -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="stone" />
    <rect x="70" y="40" width="210" height="140" class="stone" />
    <rect x="90" y="60" width="170" height="120" class="stone" />
    <rect x="110" y="80" width="130" height="100" class="stone" />
    <rect x="130" y="100" width="90" height="80" class="stone" />
    <rect x="150" y="120" width="50" height="60" class="stone" />
  </g>
</svg>