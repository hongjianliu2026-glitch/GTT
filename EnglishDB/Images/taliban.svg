<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Taliban</text>
  <text x="50" y="120" class="subtitle">[tælɪ'bæn] n. 塔利班</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自普什图语，意为“学生”或“宗教学生”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群“学生(Taliban)”在阿富汗的山脉中，
    <tspan x="50" dy="25">他们手持武器，象征着他们的军事力量和宗教信仰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Taliban regained control of Afghanistan in 2021.
  </text>
  <text x="50" y="310" class="content">
    塔利班在2021年重新控制了阿富汗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountains -->
    <path d="M0 200 L100 100 L200 200 L300 100 L400 200" class="image" />
    <!-- Students -->
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <!-- Weapons -->
    <line x1="50" y1="165" x2="50" y2="200" class="image" />
    <line x1="150" y1="165" x2="150" y2="200" class="image" />
    <line x1="250" y1="165" x2="250" y2="200" class="image" />
  </g>
</svg>