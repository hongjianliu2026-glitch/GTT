<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adjourn</text>
  <text x="50" y="120" class="subtitle">[əˈdʒɜːrn] v. 休会，延期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + journ (日)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个会议室里，"朝向(ad-)"
    <tspan x="50" dy="25">新的一天(journ)，会议被延期(adjourn)了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting was adjourned until next Monday.
  </text>
  <text x="50" y="310" class="content">
    会议被延期到下周一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Chairs -->
    <line x1="70" y1="180" x2="70" y2="200" class="image" />
    <line x1="120" y1="180" x2="120" y2="200" class="image" />
    <line x1="170" y1="180" x2="170" y2="200" class="image" />
    <line x1="220" y1="180" x2="220" y2="200" class="image" />
    <!-- Clock -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="100" x2="300" y2="70" class="image" />
    <line x1="300" y1="100" x2="330" y2="100" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="20" r="20" class="image" />
    <line x1="300" y1="20" x2="300" y2="0" class="image" />
    <line x1="300" y1="20" x2="320" y2="20" class="image" />
    <line x1="300" y1="20" x2="280" y2="20" class="image" />
  </g>
</svg>