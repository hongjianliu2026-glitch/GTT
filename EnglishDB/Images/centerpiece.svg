<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">centerpiece</text>
  <text x="50" y="120" class="subtitle">[ˈsɛntərpiːs] n. 中心装饰品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> center (中心) + piece (部分)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的餐桌，"中心(center)"
    <tspan x="50" dy="25">摆放着一个闪闪发光的"部分(piece)"，</tspan>
    <tspan x="50" dy="25">它就是整个餐桌的焦点——中心装饰品(centerpiece)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The centerpiece of the dinner table was a beautiful floral arrangement.
  </text>
  <text x="50" y="310" class="content">
    餐桌的中心装饰品是一束美丽的花艺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Centerpiece -->
    <circle cx="175" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Flowers -->
    <line x1="150" y1="50" x2="175" y2="75" class="image" />
    <line x1="200" y1="50" x2="175" y2="75" class="image" />
    <line x1="140" y1="70" x2="175" y2="75" class="image" />
    <line x1="210" y1="70" x2="175" y2="75" class="image" />
    <line x1="160" y1="90" x2="175" y2="75" class="image" />
    <line x1="190" y1="90" x2="175" y2="75" class="image" />
  </g>
</svg>