<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ashore</text>
  <text x="50" y="120" class="subtitle">[əˈʃɔːr] adv. 在岸上，上岸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (向) + shore (岸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘小船在海上漂浮，突然"向岸(a-shore)"
    <tspan x="50" dy="25">驶去，最终停靠在岸边。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sailors went ashore to explore the island.
  </text>
  <text x="50" y="310" class="content">
    水手们上岸去探索岛屿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Boat -->
    <polygon points="100,150 150,100 200,150" class="image" fill="#F39C12" />
    <!-- Shore -->
    <rect x="0" y="180" width="350" height="20" class="image" fill="#2ECC71" />
    <!-- Direction arrow -->
    <line x1="150" y1="150" x2="150" y2="180" class="image" />
    <polygon points="145,175 150,180 155,175" class="image" fill="#E74C3C" />
  </g>
</svg>