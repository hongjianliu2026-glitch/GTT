<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">necktie</text>
  <text x="50" y="120" class="subtitle">[ˈnɛktaɪ] n. 领带</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neck (脖子) + tie (系)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"系(tie)"
    <tspan x="50" dy="25">着一条"脖子(neck)"上的领带(necktie)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a red necktie to the interview.
  </text>
  <text x="50" y="310" class="content">
    他戴着一条红色领带去面试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Neck -->
    <line x1="100" y1="0" x2="100" y2="100" class="image" />
    <!-- Head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Tie -->
    <rect x="80" y="100" width="40" height="100" class="image" />
    <polygon points="80,100 120,100 100,150" class="image" />
  </g>
</svg>