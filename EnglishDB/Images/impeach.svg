<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impeach</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpiːtʃ] v. 弹劾，控告</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + peach (接近)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法庭场景，"进入(im-)"
    <tspan x="50" dy="25">并"接近(peach)"法官，控告某人不当行为，</tspan>
    <tspan x="50" dy="25">这就是弹劾(impeach)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The committee decided to impeach the mayor.
  </text>
  <text x="50" y="310" class="content">
    委员会决定弹劾市长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Judge -->
    <circle cx="100" cy="45" r="15" class="image" />
    <line x1="100" y1="60" x2="100" y2="90" class="image" />
    <line x1="100" y1="70" x2="80" y2="60" class="image" />
    <line x1="100" y1="70" x2="120" y2="60" class="image" />
    <!-- Accuser -->
    <circle cx="200" cy="120" r="15" class="image" />
    <line x1="200" y1="135" x2="200" y2="160" class="image" />
    <line x1="200" y1="145" x2="180" y2="135" class="image" />
    <line x1="200" y1="145" x2="220" y2="135" class="image" />
    <!-- Gavel -->
    <rect x="100" y="90" width="30" height="20" class="image" />
  </g>
</svg>