<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hurdle</text>
  <text x="50" y="120" class="subtitle">[ˈhɜːrdl] n. 障碍，跨栏；v. 克服障碍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hurd (篱笆) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在赛道上，"跨过(hurdle)"
    <tspan x="50" dy="25">一个个小篱笆(hurd-le)，这些篱笆就是障碍(hurdle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She managed to hurdle the obstacles in her path.
  </text>
  <text x="50" y="310" class="content">
    她设法克服了路上的障碍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hurdles -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Athlete -->
    <circle cx="30" cy="100" r="15" class="image" />
    <line x1="30" y1="115" x2="30" y2="150" class="image" />
    <line x1="30" y1="150" x2="10" y2="180" class="image" />
    <line x1="30" y1="150" x2="50" y2="180" class="image" />
    <line x1="30" y1="130" x2="60" y2="120" class="image" />
  </g>
</svg>