<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sheriff</text>
  <text x="50" y="120" class="subtitle">[ˈʃerɪf] n. 郡长，警长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shire (郡) + reeve (管理者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的郡(shire)，有一位管理者(reeve)，
    <tspan x="50" dy="25">他负责维护治安，这位管理者就是郡长(sheriff)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sheriff arrested the suspect in the bank robbery.
  </text>
  <text x="50" y="310" class="content">
    警长逮捕了银行抢劫案的嫌疑人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sheriff's badge -->
    <circle cx="100" cy="100" r="50" class="image" />
    <text x="75" y="110" class="content" fill="#E74C3C">S</text>
    <!-- Sheriff's hat -->
    <rect x="70" y="30" width="60" height="20" class="image" />
    <!-- Sheriff's face -->
    <circle cx="100" cy="80" r="15" class="image" />
    <!-- Sheriff's body -->
    <line x1="100" y1="95" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="120" x2="130" y2="110" class="image" />
  </g>
</svg>