<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mafia</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːfiə] n. 黑手党，秘密犯罪组织</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自意大利语 "mafioso" (黑手党成员)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群穿着黑色西装的"黑手党(mafia)"成员，
    <tspan x="50" dy="25">戴着墨镜，手持武器，秘密策划犯罪活动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mafia controls many businesses in the city.
  </text>
  <text x="50" y="310" class="content">
    黑手党控制着城市里的许多企业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Suit -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="10" y="10" width="80" height="180" class="image" />
    <!-- Sunglasses -->
    <rect x="20" y="20" width="60" height="20" class="image" />
    <!-- Gun -->
    <rect x="40" y="100" width="20" height="80" class="image" />
    <line x1="50" y1="100" x2="50" y2="180" class="image" />
  </g>
</svg>