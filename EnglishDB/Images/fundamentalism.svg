<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fundamentalism</text>
  <text x="50" y="120" class="subtitle">[ˌfʌndəˈmɛntəlɪzəm] n. 原教旨主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fund (基础) + -ment (名词后缀) + -al (形容词后缀) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围绕着一本古老的<tspan x="50" dy="25">"基础(fund)"</tspan>
    <tspan x="50" dy="25">圣经，坚定地相信其中的每一个字都是绝对真理，</tspan>
    <tspan x="50" dy="25">这就是原教旨主义(fundamentalism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rise of fundamentalism has sparked debates worldwide.
  </text>
  <text x="50" y="310" class="content">
    原教旨主义的兴起引发了全球范围内的辩论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancient book -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People around the book -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Lines connecting people -->
    <line x1="100" y1="115" x2="200" y2="115" class="image" />
    <line x1="200" y1="115" x2="300" y2="115" class="image" />
    <!-- Book pages -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>