<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">citizenship</text>
  <text x="50" y="120" class="subtitle">[ˈsɪtɪznʃɪp] n. 公民身份，公民权</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> citizen (公民) + -ship (状态或性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个公民(citizen)手持护照，站在国旗下，
    <tspan x="50" dy="25">象征着他的公民身份(citizenship)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gained her citizenship after living in the country for five years.
  </text>
  <text x="50" y="310" class="content">
    她在该国居住五年后获得了公民身份。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Citizen -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Passport -->
    <rect x="100" y="80" width="100" height="60" class="image" />
    <line x1="120" y1="90" x2="180" y2="90" class="image" />
    <line x1="120" y1="110" x2="180" y2="110" class="image" />
    <line x1="120" y1="130" x2="180" y2="130" class="image" />
    <!-- Flag -->
    <rect x="220" y="80" width="20" height="100" class="image" />
    <polygon points="220,80 240,80 230,60" class="image" />
  </g>
</svg>