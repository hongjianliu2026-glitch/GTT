<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">agile</text>
  <text x="50" y="120" class="subtitle">[ˈædʒəl] adj. 敏捷的，灵活的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ag (做) + -ile (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫在房间里"做(ag)"各种灵活的动作，
    <tspan x="50" dy="25">就像一个敏捷的(agile)运动员一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The agile cat jumped over the fence effortlessly.
  </text>
  <text x="50" y="310" class="content">
    那只敏捷的猫轻松地跳过了篱笆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Front leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Back leg -->
    <line x1="50" y1="130" x2="30" y2="140" class="image" /> <!-- Front paw -->
    <line x1="50" y1="130" x2="70" y2="140" class="image" /> <!-- Back paw -->
    <line x1="50" y1="120" x2="30" y2="110" class="image" /> <!-- Ear -->
    <line x1="50" y1="120" x2="70" y2="110" class="image" /> <!-- Ear -->
    <line x1="50" y1="120" x2="50" y2="130" class="image" /> <!-- Tail -->
    <line x1="50" y1="130" x2="70" y2="150" class="image" /> <!-- Tail curve -->
    <line x1="70" y1="150" x2="80" y2="140" class="image" /> <!-- Tail end -->

    <!-- Fence -->
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <line x1="150" y1="200" x2="200" y2="200" class="image" />
  </g>
</svg>