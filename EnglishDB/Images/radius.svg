<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">radius</text>
  <text x="50" y="120" class="subtitle">[ˈreɪdiəs] n. 半径</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> radi- (光线) + -us (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太阳，它的光线(radi-)
    <tspan x="50" dy="25">从中心向四周辐射，每一条光线都是半径(radius)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The radius of the circle is 5 cm.
  </text>
  <text x="50" y="310" class="content">
    这个圆的半径是5厘米。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Radius lines -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="100" y1="100" x2="0" y2="100" class="image" />
    <line x1="100" y1="100" x2="50" y2="50" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <!-- Radius label -->
    <text x="150" y="110" class="content">radius</text>
  </g>
</svg>