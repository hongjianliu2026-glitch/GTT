<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">midway</text>
  <text x="50" y="120" class="subtitle">[ˈmɪdweɪ] n. 中途，中间；adj. 中途的，中间的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mid- (中间) + way (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条长长的路，一个人站在"中间(mid)"的"路(way)"上，
    <tspan x="50" dy="25">这就是中途(midway)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We stopped at a midway point to rest.
  </text>
  <text x="50" y="310" class="content">
    我们在中途停下来休息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Midway point -->
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Person -->
    <circle cx="175" cy="80" r="15" class="image" />
    <line x1="175" y1="95" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="160" y2="140" class="image" />
    <line x1="175" y1="120" x2="190" y2="140" class="image" />
    <line x1="175" y1="105" x2="200" y2="95" class="image" />
  </g>
</svg>