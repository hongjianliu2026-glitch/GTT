<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">merging</text>
  <text x="50" y="120" class="subtitle">[ˈmɜːrdʒɪŋ] v. 合并，融合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> merge (合并) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两条河流"合并(merge)"成一条，水流"融合(merging)"在一起，形成更大的河流。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two companies are merging to form a stronger entity.
  </text>
  <text x="50" y="310" class="content">
    这两家公司正在合并，以形成一个更强大的实体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- River 1 -->
    <path d="M0 100 Q50 50, 100 100 L100 200" class="image" />
    <!-- River 2 -->
    <path d="M0 200 Q50 150, 100 200 L100 100" class="image" />
    <!-- Merged River -->
    <path d="M100 150 Q150 150, 200 150 L200 250" class="image" />
    <!-- Water drops -->
    <circle cx="50" cy="150" r="5" class="image" />
    <circle cx="75" cy="175" r="5" class="image" />
    <circle cx="125" cy="125" r="5" class="image" />
    <circle cx="150" cy="150" r="5" class="image" />
  </g>
</svg>