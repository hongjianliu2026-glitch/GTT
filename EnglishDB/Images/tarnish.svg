<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tarnish</text>
  <text x="50" y="120" class="subtitle">[ˈtɑːrnɪʃ] v. 使失去光泽，玷污</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tarn (失去光泽) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块闪亮的银器，突然被"失去光泽(tarn-ish)"，
    <tspan x="50" dy="25">变得暗淡无光，就像被玷污了一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scandal tarnished his reputation.
  </text>
  <text x="50" y="310" class="content">
    丑闻玷污了他的名声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shiny silver object -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="45" fill="#C0C0C0" />
    <!-- Tarnished area -->
    <circle cx="100" cy="100" r="30" fill="#808080" />
    <!-- Spots of tarnish -->
    <circle cx="80" cy="80" r="5" fill="#404040" />
    <circle cx="120" cy="80" r="5" fill="#404040" />
    <circle cx="100" cy="120" r="5" fill="#404040" />
  </g>
</svg>