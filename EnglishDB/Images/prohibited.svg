<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sign { font: bold 60px sans-serif; fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prohibited</text>
  <text x="50" y="120" class="subtitle">[prəˈhɪbɪtɪd] adj. 被禁止的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + hibit (持有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色"禁止"标志，"向前持有(pro-hibit)"
    <tspan x="50" dy="25">住一切行动，这就是被禁止的(prohibited)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Smoking is prohibited in this area.
  </text>
  <text x="50" y="310" class="content">
    这个区域禁止吸烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red circle -->
    <circle cx="100" cy="100" r="80" class="image" fill="#E74C3C" />
    <!-- White line -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" stroke="#FFFFFF" stroke-width="10" />
    <!-- Sign text -->
    <text x="60" y="120" class="sign">!</text>
  </g>
</svg>