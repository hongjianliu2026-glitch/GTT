<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Chechen</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɛtʃən] n. 车臣人，车臣语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自车臣语中的“Nokhchi”，意为“车臣人”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个车臣战士，手持传统武器，站在高山上，
    <tspan x="50" dy="25">守护着他的家园和民族。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Chechen people have a rich cultural heritage.
  </text>
  <text x="50" y="310" class="content">
    车臣人民有着丰富的文化遗产。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,200 L100,0 L200,200 Z" class="image" />
    <!-- Warrior -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
    <!-- Weapon -->
    <line x1="100" y1="165" x2="150" y2="120" class="image" />
  </g>
</svg>