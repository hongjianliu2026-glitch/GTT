<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interim</text>
  <text x="50" y="120" class="subtitle">[ˈɪntərɪm] adj. 临时的，间歇的；n. 过渡时期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + im (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两个时间点之间，"在时间之间(inter-im)"，
    <tspan x="50" dy="25">这个位置就是临时的(interim)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The interim report will be presented next week.
  </text>
  <text x="50" y="310" class="content">
    临时报告将在下周提交。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Time points -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <!-- Person in between -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>