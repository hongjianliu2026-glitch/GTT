<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confrontational</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnfrʌnˈteɪʃənl] adj. 对抗性的，挑衅的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + front (前面) + -ational (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站着，"共同站在前面(con-front)"，
    <tspan x="50" dy="25">他们的表情和姿态充满了对抗性(confrontational)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The debate became confrontational when both sides refused to compromise.
  </text>
  <text x="50" y="310" class="content">
    当双方都不愿意妥协时，辩论变得具有对抗性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="20" y2="130" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />

    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="170" y2="130" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />

    <!-- Arrows indicating confrontation -->
    <line x1="70" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,100 170,90 170,110" class="image" />
    <line x1="180" y1="100" x2="70" y2="100" class="image" />
    <polygon points="70,100 80,90 80,110" class="image" />
  </g>
</svg>