<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brewer</text>
  <text x="50" y="120" class="subtitle">[ˈbruːər] n. 酿酒师，啤酒制造者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brew (酿造) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个酿酒师在巨大的酿造桶前，"酿造(brew)"
    <tspan x="50" dy="25">出美味的啤酒，他就是酿酒师(brewer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The brewer carefully monitored the fermentation process.
  </text>
  <text x="50" y="310" class="content">
    酿酒师仔细监控发酵过程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brewing barrel -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Brewer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Beer -->
    <ellipse cx="250" cy="150" rx="50" ry="30" class="image" />
    <line x1="250" y1="150" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="200" class="image" />
    <line x1="250" y1="180" x2="270" y2="200" class="image" />
  </g>
</svg>