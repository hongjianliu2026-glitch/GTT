<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contented</text>
  <text x="50" y="120" class="subtitle">[kənˈtentɪd] adj. 满足的，满意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (完全) + tent (保持) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人完全保持(con-tent)在一个满足的状态，
    <tspan x="50" dy="25">脸上洋溢着幸福的笑容，这就是contented(满足的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked contented after finishing her book.
  </text>
  <text x="50" y="310" class="content">
    她读完书后看起来很满足。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Happy face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#2ECC71" />
    <circle cx="80" cy="80" r="10" class="image" fill="#2C3E50" />
    <circle cx="120" cy="80" r="10" class="image" fill="#2C3E50" />
    <path d="M80 120 Q100 140 120 120" class="image" fill="none" stroke="#2C3E50" stroke-width="5" />
  </g>
</svg>