<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">high-level</text>
  <text x="50" y="120" class="subtitle">[ˈhaɪˈlevəl] adj. 高级的，高层的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + level (水平)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个高层建筑的顶层，"高(high)"
    <tspan x="50" dy="25">处代表着"高级(level)"的决策和视野。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The CEO made a high-level decision to expand the company.
  </text>
  <text x="50" y="310" class="content">
    首席执行官做出了一个高层决策，决定扩展公司。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skyscraper -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <rect x="40" y="40" width="70" height="120" class="image" />
    <rect x="60" y="60" width="30" height="80" class="image" />
    <!-- Sun -->
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Clouds -->
    <ellipse cx="250" cy="100" rx="50" ry="20" class="image" />
    <ellipse cx="300" cy="70" rx="40" ry="15" class="image" />
  </g>
</svg>