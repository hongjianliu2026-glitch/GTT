<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twitch</text>
  <text x="50" y="120" class="subtitle">[twɪtʃ] v. 抽搐，抽动；n. 抽搐，抽动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twitch (源自中古英语 twicchen，意为“快速移动”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在玩耍时，尾巴突然"快速抽动(twitch)"，
    <tspan x="50" dy="25">仿佛在表达它的兴奋和好奇。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His eye twitched nervously as he waited for the results.
  </text>
  <text x="50" y="310" class="content">
    他在等待结果时，眼睛紧张地抽动着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="140" x2="20" y2="160" class="image" /> <!-- Ear -->
    <line x1="50" y1="140" x2="80" y2="160" class="image" /> <!-- Ear -->
    <!-- Tail -->
    <path d="M 50 180 Q 100 200 150 180" class="image" />
    <!-- Twitching Tail -->
    <path d="M 150 180 Q 170 190 150 200" class="image" />
  </g>
</svg>