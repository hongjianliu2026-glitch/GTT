<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">could</text>
  <text x="50" y="120" class="subtitle">[kʊd] aux. v. 能够，可能</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> could 是 can 的过去式，表示能力或可能性
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在学习骑自行车，"能够(could)"
    <tspan x="50" dy="25">骑车后，他兴奋地骑着车在公园里飞驰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She could ride a bike when she was five.
  </text>
  <text x="50" y="310" class="content">
    她五岁时就能骑自行车了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="70" y2="50" class="image" />
    <line x1="100" y1="50" x2="130" y2="50" class="image" />
    <!-- Child -->
    <circle cx="100" cy="30" r="15" class="image" />
    <line x1="100" y1="45" x2="100" y2="70" class="image" />
    <line x1="100" y1="70" x2="80" y2="100" class="image" />
    <line x1="100" y1="70" x2="120" y2="100" class="image" />
    <line x1="100" y1="55" x2="130" y2="40" class="image" />
  </g>
</svg>