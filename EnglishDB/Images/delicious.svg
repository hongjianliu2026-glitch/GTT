<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F57F17; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .food { fill: #FFEB3B; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delicious</text>
  <text x="50" y="120" class="subtitle">[dɪˈlɪʃəs] adj. 美味的，可口的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + lic (引诱) + ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一道美食，"强烈引诱(de-lic)"
    <tspan x="50" dy="25">你的味蕾，让你无法抗拒，这就是美味的(delicious)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake was so delicious that I ate the whole piece.
  </text>
  <text x="50" y="310" class="content">
    蛋糕太美味了，我全吃完了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="50" class="food" />
    <circle cx="200" cy="100" r="50" class="food" />
    <circle cx="300" cy="100" r="50" class="food" />
    <!-- Fork -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
    <line x1="150" y1="50" x2="130" y2="70" class="image" />
  </g>
</svg>