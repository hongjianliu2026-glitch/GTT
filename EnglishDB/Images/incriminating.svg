<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incriminating</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkrɪmɪneɪtɪŋ] adj. 牵连的，归罪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + crimin (罪行) + -ate (动词后缀) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个无辜的人被"牵连进(in-crimin-ate)"
    <tspan x="50" dy="25">一个罪行中，他的行为变得"归罪(incriminating)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evidence was incriminating and led to his arrest.
  </text>
  <text x="50" y="310" class="content">
    证据是牵连的，导致他被逮捕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Handcuffs -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <rect x="10" y="10" width="80" height="30" class="image" />
    <line x1="20" y1="40" x2="80" y2="40" class="image" />
    <!-- Person -->
    <circle cx="60" cy="100" r="15" class="image" />
    <line x1="60" y1="115" x2="60" y2="150" class="image" />
    <line x1="60" y1="150" x2="40" y2="180" class="image" />
    <line x1="60" y1="150" x2="80" y2="180" class="image" />
    <line x1="60" y1="130" x2="90" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M100,80 Q150,80 150,120 Q100,120 100,80 Z" class="image" />
    <text x="110" y="110" class="content">Why me?</text>
  </g>
</svg>