<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">postpone</text>
  <text x="50" y="120" class="subtitle">[poʊstˈpoʊn] v. 推迟，延期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> post- (在后面) + pone (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把一个重要的会议"放在后面(post-pone)"，
    <tspan x="50" dy="25">决定推迟到明天再开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting was postponed due to the bad weather.
  </text>
  <text x="50" y="310" class="content">
    由于恶劣天气，会议被推迟了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Dates -->
    <text x="70" y="50" class="content">10</text>
    <text x="120" y="50" class="content">11</text>
    <text x="170" y="50" class="content">12</text>
    <text x="220" y="50" class="content">13</text>
    <text x="270" y="50" class="content">14</text>
    <!-- Postponed date -->
    <text x="70" y="80" class="highlight">15</text>
    <!-- Arrow -->
    <line x1="100" y1="110" x2="200" y2="110" class="image" />
    <polygon points="200,110 190,105 190,115" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>