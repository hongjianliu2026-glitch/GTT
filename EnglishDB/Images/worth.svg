<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">worth</text>
  <text x="50" y="120" class="subtitle">[wɜːrθ] adj. 值钱的，有价值的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> worth (价值)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金币堆，"价值(worth)"
    <tspan x="50" dy="25">连城，闪闪发光，象征着财富和重要性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old painting is worth a fortune.
  </text>
  <text x="50" y="310" class="content">
    这幅古画价值连城。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Coin pile -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="100" r="50" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
    <circle cx="125" cy="150" r="50" class="image" />
    <circle cx="175" cy="150" r="50" class="image" />
    <circle cx="150" cy="200" r="50" class="image" />
    <!-- Shine effect -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="125" y1="25" x2="175" y2="25" class="image" />
    <line x1="150" y1="0" x2="200" y2="0" class="image" />
  </g>
</svg>