<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ire</text>
  <text x="50" y="120" class="subtitle">[aɪər] n. 愤怒，怒火</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (愤怒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"愤怒(ir-)"的火焰包围，
    <tspan x="50" dy="25">他的脸因为怒火而扭曲，这就是"ire"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His ire was evident in his clenched fists.
  </text>
  <text x="50" y="310" class="content">
    他紧握的拳头显露出他的愤怒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <line x1="70" y1="140" x2="130" y2="140" class="image" />
    <line x1="70" y1="140" x2="60" y2="130" class="image" />
    <line x1="130" y1="140" x2="140" y2="130" class="image" />
    <!-- Flames -->
    <polygon points="100,20 60,60 140,60" class="image" />
    <polygon points="100,40 50,80 150,80" class="image" />
    <polygon points="100,60 40,100 160,100" class="image" />
  </g>
</svg>