<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vertical</text>
  <text x="50" y="120" class="subtitle">[ˈvɜːrtɪkl] adj. 垂直的，竖直的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vert (转) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旋转的陀螺，"转(vert)"成了
    <tspan x="50" dy="25">竖直(vertical)的状态，就像一根笔直的柱子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tower is perfectly vertical.
  </text>
  <text x="50" y="310" class="content">
    这座塔非常垂直。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vertical line -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Top circle -->
    <circle cx="175" cy="20" r="10" class="image" />
    <!-- Bottom circle -->
    <circle cx="175" cy="180" r="10" class="image" />
    <!-- Rotating arrow -->
    <line x1="175" y1="100" x2="225" y2="100" class="image" />
    <polygon points="225,100 215,95 215,105" class="image" />
  </g>
</svg>