<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mannequin</text>
  <text x="50" y="120" class="subtitle">[ˈmænɪkɪn] n. 人体模型，时装模特</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (手) + nequin (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"小手(man-nequin)"模型，
    <tspan x="50" dy="25">它被用来展示服装，就像一个迷你的时装模特。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store used a mannequin to display the new dress.
  </text>
  <text x="50" y="310" class="content">
    商店用一个人体模型来展示新裙子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mannequin body -->
    <rect x="50" y="50" width="100" height="150" class="image" />
    <!-- Head -->
    <circle cx="100" cy="30" r="20" class="image" />
    <!-- Arms -->
    <line x1="50" y1="80" x2="20" y2="100" class="image" />
    <line x1="150" y1="80" x2="180" y2="100" class="image" />
    <!-- Legs -->
    <line x1="80" y1="200" x2="80" y2="250" class="image" />
    <line x1="120" y1="200" x2="120" y2="250" class="image" />
  </g>
</svg>