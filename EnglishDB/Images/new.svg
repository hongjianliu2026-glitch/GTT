<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">new</text>
  <text x="50" y="120" class="subtitle">[njuː] adj. 新的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ne- (新的) + -w (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个全新的开始，"新的(ne-w)"
    <tspan x="50" dy="25">事物在阳光下闪闪发光，象征着新的希望和机会。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a new car last week.
  </text>
  <text x="50" y="310" class="content">
    她上周买了一辆新车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- New thing -->
    <rect x="150" y="50" width="100" height="100" class="image" fill="#3498DB" />
    <!-- Shine effect -->
    <line x1="150" y1="50" x2="100" y2="0" class="image" stroke-width="1" />
    <line x1="250" y1="50" x2="300" y2="0" class="image" stroke-width="1" />
    <line x1="150" y1="150" x2="100" y2="200" class="image" stroke-width="1" />
    <line x1="250" y1="150" x2="300" y2="200" class="image" stroke-width="1" />
  </g>
</svg>