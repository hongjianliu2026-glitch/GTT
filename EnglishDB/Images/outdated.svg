<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outdated</text>
  <text x="50" y="120" class="subtitle">[aʊtˈdeɪtɪd] adj. 过时的，陈旧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外面) + date (日期)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老旧的日历，"日期(date)"已经"在外面(out)"很久了，
    <tspan x="50" dy="25">它已经过时(outdated)了，不再被使用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The technology she used was outdated and inefficient.
  </text>
  <text x="50" y="310" class="content">
    她使用的技术已经过时且效率低下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Dates -->
    <text x="70" y="50" class="content">1990</text>
    <text x="70" y="80" class="content">1991</text>
    <text x="70" y="110" class="content">1992</text>
    <text x="70" y="140" class="content">1993</text>
    <!-- Torn edge -->
    <line x1="300" y1="20" x2="350" y2="70" class="image" />
    <line x1="300" y1="180" x2="350" y2="130" class="image" />
    <!-- Dust -->
    <circle cx="20" cy="100" r="10" class="image" />
    <circle cx="40" cy="120" r="10" class="image" />
    <circle cx="60" cy="140" r="10" class="image" />
  </g>
</svg>