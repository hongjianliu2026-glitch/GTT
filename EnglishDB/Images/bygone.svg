<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bygone</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪɡɒn] adj. 过去的，逝去的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> by- (旁边) + gone (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的钟表，指针已经"离开(gone)"了原来的位置，
    <tspan x="50" dy="25">旁边(by)的时间已经成为了"过去的(bygone)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Let's not dwell on bygone days, but focus on the future.
  </text>
  <text x="50" y="310" class="content">
    我们不要沉溺于过去的日子，而要专注于未来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Clock hands -->
    <line x1="100" y1="100" x2="100" y2="40" class="image" />
    <line x1="100" y1="100" x2="160" y2="100" class="image" />
    <!-- Fading effect -->
    <rect x="0" y="0" width="200" height="200" fill="url(#fade)" />
    <defs>
      <radialGradient id="fade" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
        <stop offset="0%" style="stop-color:white;stop-opacity:1" />
        <stop offset="100%" style="stop-color:white;stop-opacity:0" />
      </radialGradient>
    </defs>
  </g>
</svg>