<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polyester</text>
  <text x="50" y="120" class="subtitle">[ˌpɒlɪˈɛstə] n. 聚酯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poly- (多) + ester (酯)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的化学实验室，里面有无数的试管和烧杯，
    <tspan x="50" dy="25">"多(poly)"种化学物质混合在一起，形成了"酯(ester)"，</tspan>
    <tspan x="50" dy="25">最终变成了聚酯(polyester)，一种常见的合成纤维。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dress is made of polyester, which is easy to care for.
  </text>
  <text x="50" y="310" class="content">
    这条裙子是用聚酯纤维制成的，很容易打理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chemical lab -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Test tubes -->
    <rect x="50" y="20" width="20" height="100" class="image" />
    <rect x="80" y="20" width="20" height="100" class="image" />
    <rect x="110" y="20" width="20" height="100" class="image" />
    <rect x="140" y="20" width="20" height="100" class="image" />
    <!-- Chemical reaction -->
    <circle cx="200" cy="70" r="20" class="image" />
    <circle cx="230" cy="70" r="20" class="image" />
    <line x1="200" y1="90" x2="230" y2="90" class="image" />
    <!-- Polyester fiber -->
    <line x1="250" y1="20" x2="250" y2="120" class="image" />
    <line x1="260" y1="20" x2="260" y2="120" class="image" />
    <line x1="270" y1="20" x2="270" y2="120" class="image" />
    <line x1="280" y1="20" x2="280" y2="120" class="image" />
  </g>
</svg>