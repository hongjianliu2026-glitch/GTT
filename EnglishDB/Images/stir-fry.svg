<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stir-fry</text>
  <text x="50" y="120" class="subtitle">[stɜːr fraɪ] v. 炒，翻炒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stir (搅拌) + fry (油炸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"搅拌(stir)"
    <tspan x="50" dy="25">并"油炸(fry)"食材，这就是炒菜(stir-fry)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to stir-fry vegetables with garlic.
  </text>
  <text x="50" y="310" class="content">
    她喜欢用大蒜炒蔬菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wok -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Vegetables -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="120" cy="90" r="10" class="image" />
    <circle cx="90" cy="120" r="10" class="image" />
    <!-- Stirring stick -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="175" y1="80" x2="175" y2="120" class="image" />
  </g>
</svg>