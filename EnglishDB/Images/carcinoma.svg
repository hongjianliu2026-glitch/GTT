<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carcinoma</text>
  <text x="50" y="120" class="subtitle">[ˌkɑːrsɪˈnoʊmə] n. 癌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carci- (螃蟹) + -noma (肿块)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在检查一个病人的身体，发现了一个像螃蟹(carci-)一样
    <tspan x="50" dy="25">的肿块(-noma)，这个肿块就是癌症(carcinoma)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor diagnosed the patient with carcinoma.
  </text>
  <text x="50" y="310" class="content">
    医生诊断病人患有癌症。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doctor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Patient -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <!-- Cancerous lump -->
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Crab-like shape -->
    <line x1="170" y1="70" x2="230" y2="70" class="image" />
    <line x1="170" y1="130" x2="230" y2="130" class="image" />
    <line x1="170" y1="70" x2="170" y2="130" class="image" />
    <line x1="230" y1="70" x2="230" y2="130" class="image" />
  </g>
</svg>