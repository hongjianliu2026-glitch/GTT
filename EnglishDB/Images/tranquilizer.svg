<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tranquilizer</text>
  <text x="50" y="120" class="subtitle">[ˈtræŋkwəlaɪzər] n. 镇静剂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tranquill (平静的) + -izer (使...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生拿着一瓶"镇静剂(tranquilizer)"，
    <tspan x="50" dy="25">轻轻地滴在一只躁动的小猫身上，小猫立刻变得平静(tranquil)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vet gave the cat a tranquilizer to calm it down.
  </text>
  <text x="50" y="310" class="content">
    兽医给猫注射了镇静剂以使其平静下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doctor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Bottle -->
    <rect x="70" y="80" width="50" height="100" class="image" />
    <line x1="95" y1="80" x2="95" y2="60" class="image" />
    <!-- Cat -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Calm expression -->
    <line x1="140" y1="90" x2="160" y2="90" class="image" />
    <line x1="145" y1="85" x2="155" y2="85" class="image" />
  </g>
</svg>