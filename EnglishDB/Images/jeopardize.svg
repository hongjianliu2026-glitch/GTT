<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jeopardize</text>
  <text x="50" y="120" class="subtitle">[ˈdʒepərdaɪz] v. 危及，使受危害</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jeop- (危险) + ard (来自拉丁语 ardere, 燃烧) + -ize (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"危险地燃烧(jeop-ard-ize)"
    <tspan x="50" dy="25">自己的未来，这种行为就是在危及(jeopardize)一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His reckless behavior could jeopardize his career.
  </text>
  <text x="50" y="310" class="content">
    他的鲁莽行为可能会危及他的职业生涯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on the edge -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Fire -->
    <line x1="250" y1="120" x2="270" y2="100" class="image" />
    <line x1="270" y1="100" x2="290" y2="120" class="image" />
    <line x1="290" y1="120" x2="310" y2="100" class="image" />
    <line x1="310" y1="100" x2="330" y2="120" class="image" />
  </g>
</svg>