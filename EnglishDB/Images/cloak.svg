<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cloak</text>
  <text x="50" y="120" class="subtitle">[kləʊk] n. 斗篷，覆盖物；v. 掩盖，掩饰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> claustrum (关闭)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的间谍，穿着一件"关闭(claustrum)"
    <tspan x="50" dy="25">的斗篷(cloak)，隐藏自己的身份。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cloaked her true intentions during the negotiation.
  </text>
  <text x="50" y="310" class="content">
    她在谈判中掩盖了自己的真实意图。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cloak -->
    <path d="M50 100 Q100 50 150 100 T250 100" class="image" />
    <path d="M50 100 L50 150 Q100 200 150 150 T250 150 L250 100" class="image" />
    <!-- Spy -->
    <circle cx="150" cy="125" r="20" class="image" />
    <line x1="150" y1="145" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="210" class="image" />
    <line x1="150" y1="180" x2="170" y2="210" class="image" />
    <line x1="150" y1="160" x2="120" y2="150" class="image" />
    <line x1="150" y1="160" x2="180" y2="150" class="image" />
  </g>
</svg>