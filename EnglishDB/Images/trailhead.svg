<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trailhead</text>
  <text x="50" y="120" class="subtitle">[ˈtreɪlˌhɛd] n. 小径起点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trail (小径) + head (起点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群徒步者在山脚下，"小径的起点(trailhead)"
    <tspan x="50" dy="25">是他们冒险旅程的开始，每个人都充满期待。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We gathered at the trailhead before starting our hike.
  </text>
  <text x="50" y="310" class="content">
    我们在徒步旅行的起点集合。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 0 L200 200 Z" class="image" />
    <!-- Trail -->
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <!-- Hikers -->
    <circle cx="70" cy="190" r="10" class="image" />
    <circle cx="100" cy="190" r="10" class="image" />
    <circle cx="130" cy="190" r="10" class="image" />
    <!-- Trailhead sign -->
    <rect x="30" y="170" width="40" height="20" class="image" />
    <text x="35" y="185" class="content" fill="#000">TH</text>
  </g>
</svg>