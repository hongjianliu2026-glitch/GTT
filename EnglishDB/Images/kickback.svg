<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kickback</text>
  <text x="50" y="120" class="subtitle">[ˈkɪkˌbæk] n. 回扣，反弹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kick (踢) + back (回)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人踢了一脚，结果力量太大，脚反弹回来，
    <tspan x="50" dy="25">就像在交易中收到的回扣(kickback)一样，突然又回到了自己手中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The contractor was accused of taking kickbacks from suppliers.
  </text>
  <text x="50" y="310" class="content">
    承包商被指控从供应商那里收取回扣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Foot kicking -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="200" class="image" />
    <!-- Arrow showing the kickback -->
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <polygon points="50,250 70,240 70,260" class="image" />
    <!-- Money bag -->
    <rect x="200" y="100" width="100" height="70" class="image" />
    <line x1="220" y1="120" x2="280" y2="120" class="image" />
    <line x1="220" y1="140" x2="280" y2="140" class="image" />
    <line x1="220" y1="160" x2="280" y2="160" class="image" />
  </g>
</svg>