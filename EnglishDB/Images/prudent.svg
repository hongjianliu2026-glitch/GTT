<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prudent</text>
  <text x="50" y="120" class="subtitle">[ˈpruːdənt] adj. 谨慎的，明智的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + vid (看) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在做出决定前，"提前看(pro-vid)"
    <tspan x="50" dy="25">清楚所有可能的后果，这种谨慎的态度就是prudent。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A prudent investor always researches before making a purchase.
  </text>
  <text x="50" y="310" class="content">
    一个谨慎的投资者总是在购买前进行研究。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person thinking -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="100" cy="80" rx="60" ry="40" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="200" class="image" />
    <!-- Lightbulb -->
    <circle cx="100" cy="80" r="10" class="image" />
    <line x1="100" y1="90" x2="100" y2="110" class="image" />
    <line x1="90" y1="100" x2="110" y2="100" class="image" />
  </g>
</svg>