<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cream { fill: #FFF9C4; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cream</text>
  <text x="50" y="120" class="subtitle">[kriːm] n. 奶油，乳霜；v. 提取精华</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cre- (生长) + -am (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头奶牛在草地上悠闲地吃草，"生长(cre-)"
    <tspan x="50" dy="25">出丰富的牛奶，从中提取出的精华就是奶油(cream)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spread some cream on her toast.
  </text>
  <text x="50" y="310" class="content">
    她在吐司上涂了一些奶油。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cow -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <line x1="50" y1="120" x2="20" y2="140" class="image" />
    <line x1="50" y1="120" x2="80" y2="140" class="image" />

    <!-- Milk -->
    <rect x="120" y="30" width="50" height="70" class="image" />
    <line x1="120" y1="30" x2="170" y2="30" class="image" />
    <line x1="120" y1="65" x2="170" y2="65" class="image" />
    <line x1="120" y1="100" x2="170" y2="100" class="image" />

    <!-- Cream -->
    <rect x="200" y="50" width="50" height="50" class="cream" />
    <line x1="200" y1="50" x2="250" y2="50" class="image" />
    <line x1="200" y1="75" x2="250" y2="75" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
  </g>
</svg>