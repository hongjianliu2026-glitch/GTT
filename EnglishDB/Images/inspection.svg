<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inspection</text>
  <text x="50" y="120" class="subtitle">[ɪnˈspekʃn] n. 检查，视察</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + spect (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位工程师"进入(in-)"工厂，"仔细查看(spect)"
    <tspan x="50" dy="25">每一个细节，确保一切正常，这就是检查(inspection)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The quality control team conducted an inspection of the production line.
  </text>
  <text x="50" y="310" class="content">
    质量控制团队对生产线进行了检查。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Engineer -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Magnifying glass -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="250" y2="110" class="image" />
    <line x1="250" y1="110" x2="240" y2="120" class="image" />
  </g>
</svg>