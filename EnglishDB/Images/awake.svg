<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">awake</text>
  <text x="50" y="120" class="subtitle">[əˈweɪk] v. 唤醒，醒来；adj. 醒着的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + wake (醒来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个沉睡的巨人被"加强的醒来(a-wake)"，
    <tspan x="50" dy="25">他的眼睛猛然睁开，整个世界都被他的觉醒所震撼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The alarm clock finally awoke me from my deep sleep.
  </text>
  <text x="50" y="310" class="content">
    闹钟终于把我从沉睡中唤醒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant's head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Giant's eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Giant's mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" />
    <!-- Rays of the sun -->
    <line x1="250" y1="20" x2="250" y2="0" class="image" />
    <line x1="280" y1="50" x2="300" y2="50" class="image" />
    <line x1="220" y1="50" x2="200" y2="50" class="image" />
    <line x1="250" y1="80" x2="250" y2="100" class="image" />
  </g>
</svg>