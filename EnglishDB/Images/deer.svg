<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deer</text>
  <text x="50" y="120" class="subtitle">[dɪər] n. 鹿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *dēr (鹿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只优雅的鹿在森林中跳跃，它的角像树枝一样分叉，
    <tspan x="50" dy="25">象征着自然与生命的美丽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The deer gracefully leaped over the stream.
  </text>
  <text x="50" y="310" class="content">
    那只鹿优雅地跃过了小溪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Deer body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Deer head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Deer legs -->
    <line x1="70" y1="150" x2="70" y2="200" class="image" />
    <line x1="130" y1="150" x2="130" y2="200" class="image" />
    <line x1="80" y1="150" x2="80" y2="200" class="image" />
    <line x1="120" y1="150" x2="120" y2="200" class="image" />
    <!-- Deer antlers -->
    <line x1="50" y1="50" x2="30" y2="30" class="image" />
    <line x1="150" y1="50" x2="170" y2="30" class="image" />
    <line x1="50" y1="50" x2="30" y2="70" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
  </g>
</svg>