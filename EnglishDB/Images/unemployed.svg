<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unemployed</text>
  <text x="50" y="120" class="subtitle">[ˌʌnɪmˈplɔɪd] adj. 失业的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + employ (雇佣) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有被雇佣的人，"不被雇佣(un-employ-ed)"
    <tspan x="50" dy="25">坐在公园的长椅上，手里拿着简历，四处张望，</tspan>
    <tspan x="50" dy="25">希望能找到一份工作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many people became unemployed during the recession.
  </text>
  <text x="50" y="310" class="content">
    许多人在经济衰退期间失业了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park bench -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Person sitting on bench -->
    <circle cx="50" cy="30" r="15" class="image" />
    <line x1="50" y1="45" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="30" y2="110" class="image" />
    <line x1="50" y1="80" x2="70" y2="110" class="image" />
    <line x1="50" y1="60" x2="80" y2="50" class="image" />
    <!-- Resume -->
    <rect x="100" y="20" width="150" height="30" class="image" />
    <line x1="110" y1="30" x2="240" y2="30" class="image" />
    <line x1="110" y1="40" x2="240" y2="40" class="image" />
    <line x1="110" y1="50" x2="240" y2="50" class="image" />
  </g>
</svg>