<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">breadwinner</text>
  <text x="50" y="120" class="subtitle">[ˈbrɛdwɪnər] n. 养家糊口的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bread (面包) + winner (赢得者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭，"赢得面包(bread-winner)"的人
    <tspan x="50" dy="25">是家里的顶梁柱，负责养家糊口。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is the breadwinner of the family.
  </text>
  <text x="50" y="310" class="content">
    他是家里的顶梁柱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bread -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <text x="10" y="30" class="content">Bread</text>
    <!-- Person -->
    <circle cx="150" cy="25" r="20" class="image" />
    <line x1="150" y1="45" x2="150" y2="80" class="image" />
    <line x1="150" y1="60" x2="130" y2="50" class="image" />
    <line x1="150" y1="60" x2="170" y2="50" class="image" />
    <line x1="150" y1="80" x2="130" y2="100" class="image" />
    <line x1="150" y1="80" x2="170" y2="100" class="image" />
    <text x="140" y="120" class="content">Winner</text>
  </g>
</svg>