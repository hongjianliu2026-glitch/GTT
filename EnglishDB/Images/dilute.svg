<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dilute</text>
  <text x="50" y="120" class="subtitle">[daɪˈluːt] v. 稀释，冲淡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + lute (洗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个实验室里，科学家将一瓶浓稠的液体"分开(di-)"，
    <tspan x="50" dy="25">然后"洗(lute)"入大量的水，液体逐渐变得稀薄，这就是稀释(dilute)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She diluted the concentrated juice with water.
  </text>
  <text x="50" y="310" class="content">
    她用水稀释了浓缩果汁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beaker with concentrated liquid -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="10" y="10" width="80" height="130" class="image" fill="#FF6F61" />
    <!-- Water pouring in -->
    <line x1="120" y1="50" x2="100" y2="100" class="image" />
    <line x1="120" y1="60" x2="100" y2="110" class="image" />
    <line x1="120" y1="70" x2="100" y2="120" class="image" />
    <line x1="120" y1="80" x2="100" y2="130" class="image" />
    <!-- Beaker with diluted liquid -->
    <rect x="150" y="0" width="100" height="150" class="image" />
    <rect x="160" y="10" width="80" height="130" class="image" fill="#87CEEB" />
  </g>
</svg>