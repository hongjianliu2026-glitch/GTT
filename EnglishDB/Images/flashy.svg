<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flashy</text>
  <text x="50" y="120" class="subtitle">[ˈflæʃi] adj. 浮华的，炫耀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flash (闪光) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车，车身上装满了闪光灯，"闪光(flash)"
    <tspan x="50" dy="25">不停，吸引所有人的目光，这就是"浮华的(flashy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a flashy suit to the party.
  </text>
  <text x="50" y="310" class="content">
    他穿着一件浮华的西装去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car lights -->
    <circle cx="50" cy="50" r="15" class="image" fill="#F1C40F" />
    <circle cx="100" cy="50" r="15" class="image" fill="#F1C40F" />
    <circle cx="150" cy="50" r="15" class="image" fill="#F1C40F" />
    <circle cx="200" cy="50" r="15" class="image" fill="#F1C40F" />
    <circle cx="250" cy="50" r="15" class="image" fill="#F1C40F" />
    <circle cx="300" cy="50" r="15" class="image" fill="#F1C40F" />
    <!-- Car windows -->
    <rect x="50" y="80" width="250" height="60" class="image" />
    <!-- Car wheels -->
    <circle cx="70" cy="180" r="20" class="image" fill="#2C3E50" />
    <circle cx="280" cy="180" r="20" class="image" fill="#2C3E50" />
  </g>
</svg>