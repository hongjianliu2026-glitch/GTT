<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perverse</text>
  <text x="50" y="120" class="subtitle">[pərˈvɜrs] adj. 反常的，固执的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + verse (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人完全"转(verse)"向了错误的方向，
    <tspan x="50" dy="25">固执地坚持自己的反常行为，这就是"perverse"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His perverse behavior shocked everyone.
  </text>
  <text x="50" y="310" class="content">
    他反常的行为震惊了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person turning the wrong way -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="120" class="image" />
    <line x1="50" y1="100" x2="100" y2="120" class="image" />
    <!-- Arrow pointing the wrong way -->
    <line x1="150" y1="50" x2="250" y2="50" class="image" />
    <polygon points="250,50 240,40 240,60" class="image" />
  </g>
</svg>