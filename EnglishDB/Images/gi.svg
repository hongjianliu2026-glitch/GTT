<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">GI</text>
  <text x="50" y="120" class="subtitle">[dʒiːˈaɪ] n. 胃肠，消化系统</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Gastro- (胃) + Intestinal (肠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的胃和肠子组成的迷宫，"胃(Gastro)"和"肠(Intestinal)"
    <tspan x="50" dy="25">一起构成了一个复杂的消化系统(GI)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor recommended a GI test to check the digestive system.
  </text>
  <text x="50" y="310" class="content">
    医生建议进行胃肠检查以检查消化系统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stomach -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <text x="100" y="100" text-anchor="middle" class="content">胃</text>
    <!-- Intestines -->
    <path d="M 200 100 Q 250 50 300 100 T 400 100" class="image" />
    <text x="300" y="120" text-anchor="middle" class="content">肠</text>
  </g>
</svg>