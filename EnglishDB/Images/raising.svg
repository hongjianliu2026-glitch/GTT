<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">raising</text>
  <text x="50" y="120" class="subtitle">[ˈreɪzɪŋ] n. 提升，举起；v. 提高，养育</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> raise (举起) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大力士正在"举起(raise)"一座巨大的山，
    <tspan x="50" dy="25">这个动作就是"raising"，象征着提升和养育的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The raising of funds for the new school was a success.
  </text>
  <text x="50" y="310" class="content">
    为新学校筹集资金的活动取得了成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Strongman -->
    <circle cx="150" cy="150" r="30" class="image" />
    <line x1="150" y1="180" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="120" y2="300" class="image" />
    <line x1="150" y1="250" x2="180" y2="300" class="image" />
    <line x1="150" y1="220" x2="100" y2="200" class="image" />
    <line x1="150" y1="220" x2="200" y2="200" class="image" />
    <!-- Raising action -->
    <line x1="150" y1="180" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="100" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
  </g>
</svg>