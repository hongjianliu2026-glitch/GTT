<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cooler { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cooler</text>
  <text x="50" y="120" class="subtitle">[ˈkuːlər] n. 冷却器，冷却装置</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cool (凉爽) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的冰块在炎热的夏天，"冷却(cool)"
    <tspan x="50" dy="25">周围的一切，这个冰块就是一个冷却器(cooler)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We brought a cooler to keep the drinks cold during the picnic.
  </text>
  <text x="50" y="310" class="content">
    我们带了一个冷却器，在野餐时保持饮料凉爽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice block -->
    <rect x="0" y="0" width="200" height="200" class="image cooler" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="40" class="image" fill="#F1C40F" />
    <!-- Sun rays -->
    <line x1="250" y1="90" x2="250" y2="150" class="image" stroke-width="3" />
    <line x1="220" y1="120" x2="180" y2="180" class="image" stroke-width="3" />
    <line x1="280" y1="120" x2="320" y2="180" class="image" stroke-width="3" />
  </g>
</svg>