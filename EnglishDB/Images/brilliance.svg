<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brilliance</text>
  <text x="50" y="120" class="subtitle">[ˈbrɪliəns] n. 光辉，才华</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brilli (闪耀) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天才艺术家在舞台上，"闪耀(brilli)"
    <tspan x="50" dy="25">出无与伦比的光芒，这就是他的才华(brilliance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her brilliance in mathematics is unparalleled.
  </text>
  <text x="50" y="310" class="content">
    她在数学方面的才华是无与伦比的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spotlight -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="125" y2="300" class="image" />
    <line x1="175" y1="250" x2="225" y2="300" class="image" />
    <!-- Artist -->
    <circle cx="175" cy="200" r="20" class="image" />
    <line x1="175" y1="220" x2="175" y2="260" class="image" />
    <line x1="175" y1="260" x2="155" y2="300" class="image" />
    <line x1="175" y1="260" x2="195" y2="300" class="image" />
    <line x1="175" y1="240" x2="215" y2="230" class="image" />
  </g>
</svg>