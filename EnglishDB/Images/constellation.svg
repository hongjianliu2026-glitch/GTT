<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">constellation</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnstəˈleɪʃn] n. 星座</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + stell (星星) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群星星"聚集在一起(con-stell)"，
    <tspan x="50" dy="25">形成了一个独特的图案，这就是星座(constellation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Big Dipper is a well-known constellation.
  </text>
  <text x="50" y="310" class="content">
    北斗七星是一个众所周知的星座。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stars -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="80" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <!-- Connecting lines -->
    <line x1="50" y1="50" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="80" class="image" />
    <line x1="200" y1="80" x2="250" y2="50" class="image" />
  </g>
</svg>