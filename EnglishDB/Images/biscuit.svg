<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .biscuit { fill: #F4D03F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">biscuit</text>
  <text x="50" y="120" class="subtitle">[ˈbɪskɪt] n. 饼干</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bis- (两次) + cuit (烤)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块饼干被"烤了两次(bis-cuit)"，
    <tspan x="50" dy="25">这样它就变得又脆又香，成为了美味的饼干(biscuit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to have a biscuit with her tea.
  </text>
  <text x="50" y="310" class="content">
    她喜欢喝茶时吃一块饼干。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Biscuit -->
    <rect x="0" y="0" width="150" height="100" class="biscuit" />
    <rect x="20" y="20" width="110" height="60" class="biscuit" />
    <rect x="40" y="40" width="70" height="20" class="biscuit" />
    <!-- Oven -->
    <rect x="180" y="0" width="150" height="100" class="image" />
    <line x1="200" y1="20" x2="320" y2="20" class="image" />
    <line x1="200" y1="40" x2="320" y2="40" class="image" />
    <line x1="200" y1="60" x2="320" y2="60" class="image" />
    <line x1="200" y1="80" x2="320" y2="80" class="image" />
  </g>
</svg>