<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hangar</text>
  <text x="50" y="120" class="subtitle">[ˈhæŋɡər] n. 飞机库，棚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hang (悬挂) + -ar (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的飞机库，里面悬挂着(hang)
    <tspan x="50" dy="25">各种飞机，就像一个巨大的棚子(hangar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The airplane was parked in the hangar overnight.
  </text>
  <text x="50" y="310" class="content">
    飞机在飞机库中过夜停放。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hangar structure -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hangar door -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Airplane -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="200" y1="100" x2="200" y2="50" class="image" />
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="20" class="image" />
    <!-- Wings -->
    <line x1="80" y1="70" x2="120" y2="70" class="image" />
    <line x1="180" y1="70" x2="220" y2="70" class="image" />
  </g>
</svg>