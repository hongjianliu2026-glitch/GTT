<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">improvised</text>
  <text x="50" y="120" class="subtitle">[ˈɪmprəvaɪzd] adj. 即兴的，临时准备的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + provis (准备) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在舞台上，"进入(im-)"
    <tspan x="50" dy="25">没有提前准备(provis)，即兴演奏(improvised)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The band played an improvised melody that captivated the audience.
  </text>
  <text x="50" y="310" class="content">
    乐队演奏了一段即兴的旋律，吸引了观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Musician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Musical instrument -->
    <rect x="100" y="80" width="150" height="40" class="image" />
    <line x1="120" y1="80" x2="120" y2="120" class="image" />
    <line x1="140" y1="80" x2="140" y2="120" class="image" />
    <line x1="160" y1="80" x2="160" y2="120" class="image" />
    <line x1="180" y1="80" x2="180" y2="120" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <line x1="220" y1="80" x2="220" y2="120" class="image" />
  </g>
</svg>