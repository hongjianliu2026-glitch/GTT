<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">well-documented</text>
  <text x="50" y="120" class="subtitle">[ˌwɛl ˈdɑkjəməntɪd] adj. 有充分文件证明的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> well (好) + document (文件) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个图书馆里，"好(well)"多"文件(document)"
    <tspan x="50" dy="25">堆在一起，形成了一个"有充分文件证明的(well-documented)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was well-documented, making it easy to understand.
  </text>
  <text x="50" y="310" class="content">
    这个项目有充分的文件证明，很容易理解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Library shelves -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Books -->
    <rect x="70" y="40" width="40" height="120" class="image" />
    <rect x="130" y="40" width="40" height="120" class="image" />
    <rect x="190" y="40" width="40" height="120" class="image" />
    <rect x="250" y="40" width="40" height="120" class="image" />
    <!-- Document icon -->
    <rect x="150" y="100" width="20" height="20" class="image" />
    <line x1="150" y1="100" x2="170" y2="100" class="image" />
    <line x1="150" y1="120" x2="170" y2="120" class="image" />
    <line x1="150" y1="100" x2="150" y2="120" class="image" />
    <line x1="170" y1="100" x2="170" y2="120" class="image" />
  </g>
</svg>