<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">envision</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvɪʒən] v. 想象，展望</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + vis (看) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闭上眼睛，"进入(en-)"
    <tspan x="50" dy="25">一个充满可能性的世界，"看(vis)"</tspan>
    <tspan x="50" dy="25">到未来的景象，这就是"展望(envision)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She envisions a world where everyone is treated equally.
  </text>
  <text x="50" y="310" class="content">
    她想象一个每个人都受到平等对待的世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="image" fill="#7F8C8D" />
    <!-- Imaginary world -->
    <rect x="160" y="50" width="200" height="100" class="image" />
    <line x1="180" y1="70" x2="340" y2="70" class="image" />
    <line x1="180" y1="90" x2="340" y2="90" class="image" />
    <line x1="180" y1="110" x2="340" y2="110" class="image" />
    <line x1="180" y1="130" x2="340" y2="130" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
  </g>
</svg>