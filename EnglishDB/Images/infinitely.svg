<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infinitely</text>
  <text x="50" y="120" class="subtitle">[ˈɪnfɪnɪtli] adv. 无限地，无穷地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + fin (界限) + -ite (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有界限的宇宙，"无限(in-fin-ite)"
    <tspan x="50" dy="25">延伸到无穷远处，这就是"无限地(infinitely)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The universe is infinitely large.
  </text>
  <text x="50" y="310" class="content">
    宇宙是无限大的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Infinite loop -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="100" x2="180" y2="20" class="image" />
    <line x1="100" y1="100" x2="20" y2="180" class="image" />
    <line x1="100" y1="100" x2="180" y2="180" class="image" />
    <line x1="100" y1="100" x2="20" y2="20" class="image" />
    <!-- Infinity symbol -->
    <path d="M200,100 C220,60 280,60 300,100 C320,140 260,140 240,100" class="image" />
  </g>
</svg>