<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">not-for-profit</text>
  <text x="50" y="120" class="subtitle">[ˌnɒt fɔːr ˈprɒfɪt] adj. 非营利的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> not (不) + for (为了) + profit (利润)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个组织，它的目标不是为了赚钱，而是为了帮助他人。
    <tspan x="50" dy="25">这个组织就是非营利(not-for-profit)的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The charity is a not-for-profit organization.
  </text>
  <text x="50" y="310" class="content">
    这个慈善机构是一个非营利组织。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart symbol -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Dollar sign crossed out -->
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <text x="75" y="75" class="image" style="font: bold 48px sans-serif; fill: #E74C3C;">$</text>
  </g>
</svg>