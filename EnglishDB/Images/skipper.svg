<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skipper</text>
  <text x="50" y="120" class="subtitle">[ˈskɪpər] n. 船长，队长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skip (跳跃) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个船长在船上"跳跃(skip)"，指挥着船员，
    <tspan x="50" dy="25">他就是船上的"跳跃者(skipper)"，掌控全局。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The skipper navigated the ship through the storm.
  </text>
  <text x="50" y="310" class="content">
    船长在暴风雨中驾驶着船。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 175,150" class="image" />
    <!-- Waves -->
    <line x1="50" y1="190" x2="350" y2="190" class="image" />
    <line x1="50" y1="200" x2="350" y2="200" class="image" />
    <line x1="50" y1="210" x2="350" y2="210" class="image" />
    <!-- Skipper -->
    <circle cx="125" cy="140" r="15" class="image" />
    <line x1="125" y1="155" x2="125" y2="180" class="image" />
    <line x1="125" y1="180" x2="110" y2="200" class="image" />
    <line x1="125" y1="180" x2="140" y2="200" class="image" />
    <line x1="125" y1="165" x2="150" y2="155" class="image" />
  </g>
</svg>