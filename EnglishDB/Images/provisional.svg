<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">provisional</text>
  <text x="50" y="120" class="subtitle">[prəˈvɪʒənl] adj. 临时的，暂时的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + vis (看) + -ion (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个建筑工地上，工人们正在搭建一个"临时的(provisional)"
    <tspan x="50" dy="25">脚手架，他们"向前看(pro-vis)"，准备随时调整和改进。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government issued a provisional budget for the next fiscal year.
  </text>
  <text x="50" y="310" class="content">
    政府发布了下一财年的临时预算。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Construction site -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Scaffolding -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <!-- Worker -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
  </g>
</svg>