<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">user-friendly</text>
  <text x="50" y="120" class="subtitle">[ˈjuːzər ˈfrendli] adj. 用户友好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> user (用户) + friendly (友好的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微笑的用户，轻松地使用一个设计得非常友好的界面，
    <tspan x="50" dy="25">就像和一个友善的朋友交流一样简单。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new software is very user-friendly.
  </text>
  <text x="50" y="310" class="content">
    这款新软件非常用户友好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- User -->
    <circle cx="50" cy="100" r="30" class="image" fill="#F1C40F" />
    <circle cx="50" cy="80" r="10" class="image" fill="#000" />
    <circle cx="70" cy="80" r="10" class="image" fill="#000" />
    <path d="M40 110 Q50 130 60 110" class="image" fill="none" stroke="#000" stroke-width="2" />
    <!-- Friendly Interface -->
    <rect x="100" y="50" width="200" height="100" class="image" fill="#3498DB" />
    <text x="150" y="100" class="content" fill="#FFF">Friendly Interface</text>
  </g>
</svg>