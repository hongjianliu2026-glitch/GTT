<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grope</text>
  <text x="50" y="120" class="subtitle">[ɡroʊp] v. 摸索，探索</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grop (抓)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在黑暗中，"抓(grop)"
    <tspan x="50" dy="25">来抓去，试图找到方向，这就是摸索(grope)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She groped in the dark for her keys.
  </text>
  <text x="50" y="310" class="content">
    她在黑暗中摸索着找钥匙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person groping -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="130" class="image" />
    <line x1="100" y1="150" x2="130" y2="130" class="image" />
    <line x1="100" y1="180" x2="70" y2="200" class="image" />
    <line x1="100" y1="180" x2="130" y2="200" class="image" />
    <!-- Hand groping -->
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="170" y2="140" class="image" />
    <line x1="170" y1="140" x2="190" y2="160" class="image" />
  </g>
</svg>