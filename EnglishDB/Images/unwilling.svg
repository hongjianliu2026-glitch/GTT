<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unwilling</text>
  <text x="50" y="120" class="subtitle">[ʌnˈwɪlɪŋ] adj. 不愿意的，不情愿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + will (意愿) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被强迫做某事，脸上露出"不愿意(unwilling)"的表情，
    <tspan x="50" dy="25">双手交叉在胸前，表示强烈的抗拒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was unwilling to help with the chores.
  </text>
  <text x="50" y="310" class="content">
    他不愿意帮忙做家务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Crossed arms -->
    <line x1="20" y1="140" x2="80" y2="140" class="image" />
    <!-- Unhappy face -->
    <line x1="35" y1="90" x2="65" y2="90" class="image" />
    <line x1="45" y1="80" x2="55" y2="80" class="image" />
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
  </g>
</svg>