<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decency</text>
  <text x="50" y="120" class="subtitle">[ˈdiːsnsi] n. 正派，得体，礼貌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dec- (来自拉丁语 decens, 意为“合适的”) + -ency (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着得体的人，"合适(dec-)"
    <tspan x="50" dy="25">地出现在正式场合，举止优雅，这就是正派(decency)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His behavior showed a lack of decency.
  </text>
  <text x="50" y="310" class="content">
    他的行为显示出不正派。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Formal attire -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <rect x="290" y="20" width="50" height="160" class="image" />
    <!-- Tie -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="100" y1="20" x2="150" y2="20" class="image" />
    <line x1="100" y1="180" x2="150" y2="180" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>