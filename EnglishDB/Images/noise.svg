<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">noise</text>
  <text x="50" y="120" class="subtitle">[nɔɪz] n. 噪音，喧闹声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> noi (声音) + -se (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个喧闹的市场，各种声音"混杂(noi-se)"在一起，
    <tspan x="50" dy="25">形成了一片嘈杂的噪音(noise)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The noise from the construction site was unbearable.
  </text>
  <text x="50" y="310" class="content">
    建筑工地的噪音让人难以忍受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Sound waves -->
    <path d="M50 100 Q75 75, 100 100 T150 100" class="image" />
    <path d="M100 120 Q125 95, 150 120 T200 120" class="image" />
    <path d="M150 140 Q175 115, 200 140 T250 140" class="image" />
    <!-- Noise label -->
    <text x="175" y="180" class="highlight">Noise</text>
  </g>
</svg>