<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lemon { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lemon</text>
  <text x="50" y="120" class="subtitle">[ˈlɛmən] n. 柠檬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "lemoun"，来自古法语 "limon"，
    <tspan x="50" dy="25">最终源自拉丁语 "limon" (柠檬)。</tspan>
  </text>

  <!-- Story -->
  <text x="50" y="230" class="story">
    想象一个巨大的柠檬从天而降，"砸"在了一个人的头上，
    <tspan x="50" dy="25">这个人被酸得直皱眉头，这就是柠檬(lemon)的威力！</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> She squeezed a lemon into her tea for extra flavor.
  </text>
  <text x="50" y="330" class="content">
    她把柠檬挤进茶里，增加风味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lemon -->
    <circle cx="100" cy="100" r="60" class="lemon" />
    <!-- Face -->
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <line x1="100" y1="120" x2="140" y2="120" class="image" />
    <!-- Drop shadow -->
    <ellipse cx="100" cy="160" rx="70" ry="10" class="image" />
  </g>
</svg>