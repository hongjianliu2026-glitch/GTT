<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrinkled</text>
  <text x="50" y="120" class="subtitle">[ˈrɪŋkəld] adj. 有皱纹的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wrinkle (皱纹) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老奶奶的脸，"皱纹(wrinkle)"
    <tspan x="50" dy="25">遍布，就像一张被岁月揉皱的纸。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her face was wrinkled from years of sun exposure.
  </text>
  <text x="50" y="310" class="content">
    她的脸因多年的日晒而布满皱纹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face outline -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Wrinkles -->
    <line x1="40" y1="60" x2="160" y2="60" class="image" />
    <line x1="40" y1="80" x2="160" y2="80" class="image" />
    <line x1="40" y1="100" x2="160" y2="100" class="image" />
    <line x1="40" y1="120" x2="160" y2="120" class="image" />
    <line x1="40" y1="140" x2="160" y2="140" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="90" r="10" class="image" />
    <circle cx="130" cy="90" r="10" class="image" />
    <!-- Mouth -->
    <line x1="70" y1="130" x2="130" y2="130" class="image" />
  </g>
</svg>