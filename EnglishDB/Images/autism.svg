<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">autism</text>
  <text x="50" y="120" class="subtitle">[ˈɔːtɪzəm] n. 自闭症</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auto- (自己) + ism (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子独自坐在房间里，"自己(auto-)"
    <tspan x="50" dy="25">沉浸在自己的世界中，这种状态就是自闭症(autism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Early diagnosis of autism can greatly improve the quality of life for the child.
  </text>
  <text x="50" y="310" class="content">
    早期诊断自闭症可以极大地改善孩子的生活质量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Child -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Isolated world -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="200" y1="150" x2="200" y2="190" class="image" />
    <line x1="200" y1="190" x2="180" y2="220" class="image" />
    <line x1="200" y1="190" x2="220" y2="220" class="image" />
    <line x1="200" y1="170" x2="230" y2="160" class="image" />
  </g>
</svg>