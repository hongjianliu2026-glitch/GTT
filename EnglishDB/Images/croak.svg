<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">croak</text>
  <text x="50" y="120" class="subtitle">[kroʊk] v. 发出蛙叫声，沙哑地说</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拟声词，模仿蛙叫声
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只青蛙在夜晚的池塘边，"呱呱(croak)"
    <tspan x="50" dy="25">地叫着，声音沙哑而响亮，仿佛在诉说着什么。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man croaked out his last words.
  </text>
  <text x="50" y="310" class="content">
    老人沙哑地说出了他的遗言。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pond -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Frog -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="110" cy="80" r="10" class="image" />
    <circle cx="90" cy="80" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <!-- Croaking sound -->
    <text x="150" y="120" class="content" style="font-size: 36px;">"Croak!"</text>
  </g>
</svg>