<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inherent</text>
  <text x="50" y="120" class="subtitle">[ɪnˈhɪərənt] adj. 内在的，固有的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (在内) + her (粘附) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宝石，它"内在地粘附(in-her-ent)"
    <tspan x="50" dy="25">在石头中，无法分离，这就是它固有的美丽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beauty of the diamond is inherent in its structure.
  </text>
  <text x="50" y="310" class="content">
    钻石的美丽是其结构中固有的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gemstone -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Rock -->
    <rect x="50" y="50" width="100" height="100" class="image" fill="#8B4513" />
    <!-- Adhesion -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="150" y2="100" class="image" />
  </g>
</svg>