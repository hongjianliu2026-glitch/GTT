<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">individualized</text>
  <text x="50" y="120" class="subtitle">[ˌɪndɪˈvɪdʒuəlaɪzd] adj. 个性化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + divid (分开) + -ual (形容词后缀) + -ize (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图，每块拼图都被"分开(divid)"，
    <tspan x="50" dy="25">然后根据每个人的喜好"个性化(individualized)"地重新组合。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher offered an individualized learning plan for each student.
  </text>
  <text x="50" y="310" class="content">
    老师为每个学生提供了一个个性化的学习计划。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Individualized arrangement -->
    <line x1="50" y1="100" x2="170" y2="20" class="image" />
    <line x1="170" y1="20" x2="290" y2="100" class="image" />
    <line x1="50" y1="220" x2="170" y2="140" class="image" />
    <line x1="170" y1="140" x2="290" y2="220" class="image" />
  </g>
</svg>