<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">daddy</text>
  <text x="50" y="120" class="subtitle">[ˈdædi] n. 爸爸，爹地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dad (爸爸) + -y (表示亲昵)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在玩耍时，突然摔倒了，他立刻喊道："Daddy!"
    <tspan x="50" dy="25">爸爸听到后，立刻跑过来抱起他，安慰他。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Daddy always reads me a bedtime story.
  </text>
  <text x="50" y="310" class="content">
    爸爸总是给我读睡前故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Daddy -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Child -->
    <circle cx="150" cy="120" r="20" class="image" /> <!-- Head -->
    <line x1="150" y1="140" x2="150" y2="180" class="image" /> <!-- Body -->
    <line x1="150" y1="160" x2="130" y2="150" class="image" /> <!-- Left arm -->
    <line x1="150" y1="160" x2="170" y2="150" class="image" /> <!-- Right arm -->
    <line x1="150" y1="180" x2="140" y2="210" class="image" /> <!-- Left leg -->
    <line x1="150" y1="180" x2="160" y2="210" class="image" /> <!-- Right leg -->
    <!-- Daddy holding child -->
    <line x1="50" y1="150" x2="150" y2="160" class="image" />
  </g>
</svg>