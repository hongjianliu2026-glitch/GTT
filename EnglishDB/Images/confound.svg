<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confound</text>
  <text x="50" y="120" class="subtitle">[kənˈfaʊnd] v. 使困惑，使混淆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + found (基础)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一堆混乱的积木前，"把基础(found)"
    <tspan x="50" dy="25">和混乱(con)结合在一起，让人感到困惑(confound)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The complex instructions confounded the students.
  </text>
  <text x="50" y="310" class="content">
    复杂的指令让学生们感到困惑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Confused person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Confusion -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Confusion symbol -->
    <circle cx="150" cy="90" r="20" class="image" />
    <line x1="130" y1="70" x2="170" y2="110" class="image" />
    <line x1="130" y1="110" x2="170" y2="70" class="image" />
  </g>
</svg>