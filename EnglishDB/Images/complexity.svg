<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">complexity</text>
  <text x="50" y="120" class="subtitle">[kəmˈpleksəti] n. 复杂性，复杂的事物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + plex (折叠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的迷宫，"所有东西都折叠在一起(com-plex)"，
    <tspan x="50" dy="25">形成了一个极其复杂的结构，这就是复杂性(complexity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The complexity of the problem baffled the experts.
  </text>
  <text x="50" y="310" class="content">
    问题的复杂性让专家们感到困惑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Maze -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <line x1="50" y1="20" x2="50" y2="170" class="image" />
    <line x1="100" y1="20" x2="100" y2="170" class="image" />
    <line x1="150" y1="20" x2="150" y2="170" class="image" />
    <line x1="200" y1="20" x2="200" y2="170" class="image" />
    <line x1="250" y1="20" x2="250" y2="170" class="image" />
    <line x1="300" y1="20" x2="300" y2="170" class="image" />
    <!-- Path -->
    <path d="M50,20 L100,20 L100,50 L150,50 L150,80 L200,80 L200,110 L250,110 L250,140 L300,140" class="image" />
  </g>
</svg>