<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8B0000; }
      .subtitle { font: italic 24px serif; fill: #4B0082; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wartime</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːrtaɪm] n. 战时</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> war (战争) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟被炸弹包围，"战争(war)的时间(time)"
    <tspan x="50" dy="25">就是战时(wartime)，紧张而危险。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> During wartime, people often have to make sacrifices.
  </text>
  <text x="50" y="310" class="content">
    在战时，人们常常不得不做出牺牲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="100" x2="130" y2="100" class="image" />
    <!-- Bombs -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
  </g>
</svg>