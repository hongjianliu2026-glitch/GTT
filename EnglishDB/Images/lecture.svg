<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lecture</text>
  <text x="50" y="120" class="subtitle">[ˈlɛktʃər] n. 演讲，讲座；v. 讲课，训斥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lect (选择) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位教授站在讲台上，"选择(lect)"
    <tspan x="50" dy="25">并传授知识，这就是一场讲座(lecture)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The professor gave an engaging lecture on quantum physics.
  </text>
  <text x="50" y="310" class="content">
    教授做了一场关于量子物理的引人入胜的讲座。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lecturer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Lectern -->
    <rect x="0" y="150" width="100" height="50" class="image" />
    <!-- Students -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="180" cy="100" r="10" class="image" />
    <circle cx="210" cy="100" r="10" class="image" />
    <!-- Chalkboard -->
    <rect x="120" y="20" width="150" height="120" class="image" />
    <line x1="130" y1="40" x2="260" y2="40" class="image" />
    <line x1="130" y1="70" x2="260" y2="70" class="image" />
    <line x1="130" y1="100" x2="260" y2="100" class="image" />
  </g>
</svg>