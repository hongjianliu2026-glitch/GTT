<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">miraculously</text>
  <text x="50" y="120" class="subtitle">[mɪˈrækjələsli] adv. 奇迹般地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mir (奇迹) + -aculous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通人突然"奇迹般地(miraculously)"
    <tspan x="50" dy="25">变成了超级英雄，拯救了整个城市。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He escaped the accident miraculously.
  </text>
  <text x="50" y="310" class="content">
    他奇迹般地逃脱了事故。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Miracle -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Superhero -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- City -->
    <rect x="0" y="180" width="200" height="50" class="image" />
    <rect x="20" y="190" width="30" height="40" class="image" />
    <rect x="70" y="190" width="30" height="40" class="image" />
    <rect x="120" y="190" width="30" height="40" class="image" />
  </g>
</svg>