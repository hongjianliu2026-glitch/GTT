<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relaxation</text>
  <text x="50" y="120" class="subtitle">[ˌriːlækˈseɪʃn] n. 放松，休息</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + lax (放松) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在沙滩上，"再次放松(re-lax)"
    <tspan x="50" dy="25">身体，享受着海风的轻拂，这就是放松(relaxation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a long day at work, she enjoyed some relaxation at the beach.
  </text>
  <text x="50" y="310" class="content">
    工作了一整天后，她在海滩上享受了一些放松的时光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beach -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" fill="#F1C40F" />
    <!-- Person relaxing -->
    <circle cx="100" cy="150" r="20" fill="#2ECC71" />
    <line x1="100" y1="170" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="70" y2="170" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Waves -->
    <path d="M0 200 Q50 180, 100 200 T200 200" stroke="#3498DB" stroke-width="3" fill="none" />
    <path d="M0 210 Q50 190, 100 210 T200 210" stroke="#3498DB" stroke-width="3" fill="none" />
  </g>
</svg>