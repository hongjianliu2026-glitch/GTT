<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prosecutor</text>
  <text x="50" y="120" class="subtitle">[ˈprɒsɪkjutə(r)] n. 检察官，起诉人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + secut (跟随) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个检察官在法庭上，"向前跟随(pro-secut)"
    <tspan x="50" dy="25">法律的脚步，追查犯罪，这个人就是检察官(prosecutor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The prosecutor presented strong evidence against the defendant.
  </text>
  <text x="50" y="310" class="content">
    检察官向被告提出了强有力的证据。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Prosecutor -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Gavel -->
    <rect x="200" y="30" width="30" height="20" class="image" />
    <line x1="215" y1="50" x2="215" y2="70" class="image" />
  </g>
</svg>