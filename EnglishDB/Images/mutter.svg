<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mutter</text>
  <text x="50" y="120" class="subtitle">[ˈmʌtər] v. 喃喃自语，咕哝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mut (改变) + -ter (反复)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在低声"改变(mut)"着说话，"反复(ter)"地喃喃自语，
    <tspan x="50" dy="25">就像是在咕哝(mutter)着什么。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He muttered something under his breath.
  </text>
  <text x="50" y="310" class="content">
    他低声咕哝着什么。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Mouth -->
    <line x1="30" y1="60" x2="70" y2="60" class="image" />
    <!-- Speech bubble -->
    <path d="M 80 40 Q 150 30 150 80 Q 150 130 80 120 Z" class="image" />
    <!-- Muttering text -->
    <text x="90" y="90" class="content" font-size="14">
      ...mumble...
    </text>
  </g>
</svg>