<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">minority</text>
  <text x="50" y="120" class="subtitle">[maɪˈnɔːrəti] n. 少数，少数派</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> minor (较小的) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在一个巨大的会议室里，"较小的(minor)"
    <tspan x="50" dy="25">一群人站在角落，他们就是少数派(minority)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The minority group was given special attention.
  </text>
  <text x="50" y="310" class="content">
    少数群体得到了特别关注。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Small group -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="110" cy="100" r="15" class="image" />
    <!-- Large group -->
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="230" cy="100" r="15" class="image" />
    <circle cx="260" cy="100" r="15" class="image" />
    <circle cx="290" cy="100" r="15" class="image" />
    <circle cx="320" cy="100" r="15" class="image" />
    <!-- Arrows -->
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,100 175,95 175,105" class="image" />
  </g>
</svg>