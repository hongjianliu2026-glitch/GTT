<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laundering</text>
  <text x="50" y="120" class="subtitle">[ˈlɔːndərɪŋ] n. 洗钱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> launder (洗) + -ing (进行中的动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的房间里，一台洗衣机正在"洗(launder)"
    <tspan x="50" dy="25">脏钱，试图将它们变得干净，这就是洗钱(laundering)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The authorities are investigating the company for money laundering.
  </text>
  <text x="50" y="310" class="content">
    当局正在调查该公司是否涉嫌洗钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Washing machine -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <rect x="20" y="20" width="160" height="160" class="image" />
    <!-- Dirty money -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="90" cy="100" r="10" class="image" />
    <!-- Clean money -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="170" cy="100" r="10" class="image" />
    <circle cx="190" cy="100" r="10" class="image" />
    <!-- Water -->
    <line x1="20" y1="180" x2="180" y2="180" class="image" />
    <line x1="20" y1="190" x2="180" y2="190" class="image" />
    <line x1="20" y1="200" x2="180" y2="200" class="image" />
  </g>
</svg>