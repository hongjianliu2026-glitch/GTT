<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">influenza</text>
  <text x="50" y="120" class="subtitle">[ˌɪnfluˈɛnzə] n. 流感</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flu (流动) + -enza (疾病)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象病毒像"流动(flu)"的液体一样"进入(in)"人体，
    <tspan x="50" dy="25">引发了一场"疾病(enza)"，这就是流感(influenza)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She caught influenza during the winter season.
  </text>
  <text x="50" y="310" class="content">
    她在冬季感染了流感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Virus -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="80" cy="80" r="20" class="image" />
    <circle cx="110" cy="50" r="20" class="image" />
    <line x1="50" y1="50" x2="110" y2="50" class="image" />
    <line x1="80" y1="80" x2="80" y2="110" class="image" />
    <!-- Human body -->
    <rect x="150" y="20" width="100" height="160" class="image" />
    <circle cx="200" cy="20" r="10" class="image" />
    <line x1="200" y1="30" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="160" x2="150" y2="200" class="image" />
    <line x1="225" y1="160" x2="250" y2="200" class="image" />
    <!-- Fluids flowing -->
    <line x1="50" y1="50" x2="150" y2="20" class="image" />
    <line x1="80" y1="80" x2="175" y2="50" class="image" />
    <line x1="110" y1="50" x2="200" y2="20" class="image" />
  </g>
</svg>