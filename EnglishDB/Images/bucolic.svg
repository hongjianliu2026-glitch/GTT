<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bucolic</text>
  <text x="50" y="120" class="subtitle">[bjuːˈkɒlɪk] adj. 田园的，乡村的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bucol (牧羊人) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个牧羊人在绿草如茵的田野上，"牧羊人(bucol)"
    <tspan x="50" dy="25">守护着羊群，周围是宁静的乡村风光，这就是田园的(bucolic)景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bucolic scenery of the countryside always soothes my soul.
  </text>
  <text x="50" y="310" class="content">
    乡村的田园风光总能抚慰我的心灵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2ECC71" />
    <!-- Shepherd -->
    <circle cx="50" cy="100" r="20" class="image" fill="#F1C40F" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Sheep -->
    <circle cx="150" cy="100" r="15" class="image" fill="#FFFFFF" stroke="#000000" />
    <circle cx="170" cy="100" r="15" class="image" fill="#FFFFFF" stroke="#000000" />
    <circle cx="190" cy="100" r="15" class="image" fill="#FFFFFF" stroke="#000000" />
    <circle cx="210" cy="100" r="15" class="image" fill="#FFFFFF" stroke="#000000" />
    <circle cx="230" cy="100" r="15" class="image" fill="#FFFFFF" stroke="#000000" />
    <!-- Trees -->
    <polygon points="280,20 320,20 300,60" class="image" fill="#27AE60" />
    <polygon points="290,40 330,40 310,80" class="image" fill="#27AE60" />
  </g>
</svg>