<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inherited</text>
  <text x="50" y="120" class="subtitle">[ɪnˈherɪtɪd] adj. 继承的，遗传的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + her (继承) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子从父母那里"继承(her)"
    <tspan x="50" dy="25">了一笔财富，这笔财富是"进入(in)"他的生活的，</tspan>
    <tspan x="50" dy="25">这就是"继承的(inherited)"财富。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She inherited her mother's beautiful eyes.
  </text>
  <text x="50" y="310" class="content">
    她遗传了她母亲美丽的眼睛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parent -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />

    <!-- Child -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="300" y2="130" class="image" />

    <!-- Arrow -->
    <line x1="100" y1="100" x2="230" y2="100" class="image" />
    <polygon points="230,100 220,90 220,110" class="image" />

    <!-- Inheritance -->
    <rect x="150" y="50" width="50" height="50" class="image" />
    <text x="160" y="80" class="content">财富</text>
  </g>
</svg>