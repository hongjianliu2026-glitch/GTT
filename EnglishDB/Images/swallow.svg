<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swallow</text>
  <text x="50" y="120" class="subtitle">[ˈswɒloʊ] v. 吞咽，忍受；n. 燕子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (加强) + wall (墙) + -ow (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只燕子(swallow)在空中飞翔，突然它"吞咽(swallow)"
    <tspan x="50" dy="25">了一只巨大的虫子，虫子大到像一堵墙(wall)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She swallowed the pill with a glass of water.
  </text>
  <text x="50" y="310" class="content">
    她用一杯水吞下了药丸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Swallow bird -->
    <path d="M0 0 C 50 50, 100 50, 150 0" class="image" />
    <path d="M150 0 C 200 50, 250 50, 300 0" class="image" />
    <!-- Big worm -->
    <rect x="100" y="50" width="100" height="20" class="image" />
    <rect x="120" y="70" width="60" height="20" class="image" />
    <rect x="140" y="90" width="20" height="20" class="image" />
    <!-- Swallowing action -->
    <line x1="150" y1="0" x2="150" y2="110" class="image" />
    <line x1="150" y1="110" x2="200" y2="110" class="image" />
  </g>
</svg>