<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Navajo</text>
  <text x="50" y="120" class="subtitle">[ˈnævəhoʊ] n. 纳瓦霍人，纳瓦霍语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自纳瓦霍语 "Navahu"，意为“大平原”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群纳瓦霍人在广阔的平原上，"大平原(Navahu)"
    <tspan x="50" dy="25">上生活，他们的语言和文化深深扎根于此。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Navajo tribe has a rich cultural heritage.
  </text>
  <text x="50" y="310" class="content">
    纳瓦霍部落拥有丰富的文化遗产。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plains -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Mountains -->
    <polyline points="50,200 100,100 150,200 200,100 250,200 300,100 350,200" class="image" />
    <!-- People -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
  </g>
</svg>