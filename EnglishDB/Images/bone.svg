<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bone</text>
  <text x="50" y="120" class="subtitle">[boʊn] n. 骨头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bon (骨头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小狗在啃一根巨大的骨头，骨头(bone)
    <tspan x="50" dy="25">的形状清晰可见，小狗啃得津津有味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog chewed on a bone for hours.
  </text>
  <text x="50" y="310" class="content">
    这只狗啃骨头啃了好几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bone -->
    <rect x="0" y="0" width="300" height="50" rx="25" ry="25" class="image" />
    <!-- Dog -->
    <circle cx="350" cy="25" r="20" class="image" />
    <line x1="350" y1="45" x2="350" y2="80" class="image" />
    <line x1="350" y1="60" x2="330" y2="70" class="image" />
    <line x1="350" y1="60" x2="370" y2="70" class="image" />
    <line x1="350" y1="80" x2="330" y2="100" class="image" />
    <line x1="350" y1="80" x2="370" y2="100" class="image" />
    <!-- Dog chewing -->
    <line x1="350" y1="45" x2="300" y2="25" class="image" />
  </g>
</svg>