<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">predator</text>
  <text x="50" y="120" class="subtitle">[ˈpredətər] n. 捕食者，掠夺者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + dat (给予) + or (人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猛兽在森林中潜伏，"提前给予(pre-dat)"
    <tspan x="50" dy="25">致命一击，它就是捕食者(predator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion is a top predator in the African savannah.
  </text>
  <text x="50" y="310" class="content">
    狮子是非洲大草原上的顶级捕食者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Predator -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Claws -->
    <line x1="20" y1="140" x2="15" y2="135" class="image" />
    <line x1="20" y1="140" x2="25" y2="135" class="image" />
    <line x1="80" y1="140" x2="75" y2="135" class="image" />
    <line x1="80" y1="140" x2="85" y2="135" class="image" />
    <!-- Prey -->
    <circle cx="200" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="200" y1="120" x2="200" y2="160" class="image" /> <!-- Body -->
    <line x1="200" y1="140" x2="180" y2="130" class="image" /> <!-- Left arm -->
    <line x1="200" y1="140" x2="220" y2="130" class="image" /> <!-- Right arm -->
    <line x1="200" y1="160" x2="190" y2="200" class="image" /> <!-- Left leg -->
    <line x1="200" y1="160" x2="210" y2="200" class="image" /> <!-- Right leg -->
    <!-- Predator attacking -->
    <line x1="50" y1="130" x2="200" y2="120" class="image" />
  </g>
</svg>