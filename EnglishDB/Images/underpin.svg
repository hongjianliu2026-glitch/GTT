<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underpin</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈpɪn] v. 支撑，巩固</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在下面) + pin (钉子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钉子(pin)被钉在地面下(under)，
    <tspan x="50" dy="25">支撑着整个建筑，这就是"underpin"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The foundation underpins the entire structure.
  </text>
  <text x="50" y="310" class="content">
    地基支撑着整个建筑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="50" y="0" width="200" height="150" class="image" />
    <!-- Foundation -->
    <rect x="70" y="150" width="160" height="30" class="image" />
    <!-- Pin -->
    <line x1="150" y1="150" x2="150" y2="180" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
  </g>
</svg>