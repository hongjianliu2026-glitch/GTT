<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">envelope</text>
  <text x="50" y="120" class="subtitle">[ˈɛnvəˌloʊp] n. 信封，包裹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + velop (覆盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个信封，"进入覆盖(en-velop)"
    <tspan x="50" dy="25">的状态，保护着里面的信件或物品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sealed the letter in an envelope.
  </text>
  <text x="50" y="310" class="content">
    她把信装进信封并封好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Envelope -->
    <polygon points="0,0 150,0 120,100 30,100" class="image" />
    <!-- Letter inside -->
    <rect x="20" y="20" width="110" height="60" class="image" />
    <!-- Stamp -->
    <circle cx="120" cy="20" r="10" class="image" />
    <!-- Address -->
    <text x="25" y="50" class="content">To: John Doe</text>
  </g>
</svg>