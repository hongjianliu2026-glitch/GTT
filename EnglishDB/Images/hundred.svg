<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hundred</text>
  <text x="50" y="120" class="subtitle">[ˈhʌndrəd] n. 一百</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hund (一百) + red (表示数量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“100”漂浮在空中，
    <tspan x="50" dy="25">周围环绕着无数的小星星，象征着“一百”这个庞大的数量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are a hundred reasons to celebrate.
  </text>
  <text x="50" y="310" class="content">
    有一百个理由来庆祝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number "100" -->
    <text x="50" y="100" font-size="150" fill="#E74C3C">100</text>
    <!-- Stars -->
    <circle cx="50" cy="200" r="10" fill="#F1C40F" />
    <circle cx="150" cy="220" r="10" fill="#F1C40F" />
    <circle cx="250" cy="180" r="10" fill="#F1C40F" />
    <circle cx="350" cy="200" r="10" fill="#F1C40F" />
    <circle cx="450" cy="220" r="10" fill="#F1C40F" />
    <circle cx="550" cy="180" r="10" fill="#F1C40F" />
  </g>
</svg>