<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aimlessly</text>
  <text x="50" y="120" class="subtitle">[ˈeɪmlɪsli] adv. 漫无目的地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aim (目标) + -less (没有) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在迷雾中行走，"没有目标(aim-less)"，
    <tspan x="50" dy="25">漫无目的地(aimlessly)徘徊，不知道该往哪里去。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wandered aimlessly through the city streets.
  </text>
  <text x="50" y="310" class="content">
    他在城市街道上漫无目的地游荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fog -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#D6DBDF" />
    <!-- Person -->
    <circle cx="175" cy="100" r="15" class="image" fill="#2C3E50" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Question mark -->
    <text x="220" y="120" class="image" font-size="48" fill="#E74C3C">?</text>
  </g>
</svg>