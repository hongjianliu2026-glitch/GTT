<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">junta</text>
  <text x="50" y="120" class="subtitle">[ˈhʊntə] n. 政变后成立的军政府</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jun (年轻) + ta (集合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群年轻的军官"集合(jun-ta)"在一起，
    <tspan x="50" dy="25">发动了一场政变，成立了军政府(junta)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The junta took control of the country after the coup.
  </text>
  <text x="50" y="310" class="content">
    政变后，军政府控制了国家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldiers -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />

    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="90" x2="180" y2="80" class="image" />

    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <line x1="250" y1="90" x2="280" y2="80" class="image" />

    <!-- Meeting table -->
    <rect x="30" y="160" width="240" height="50" class="image" />
    <line x1="50" y1="185" x2="230" y2="185" class="image" />
    <line x1="50" y1="210" x2="230" y2="210" class="image" />
  </g>
</svg>