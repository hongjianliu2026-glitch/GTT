<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diligent</text>
  <text x="50" y="120" class="subtitle">[ˈdɪlɪdʒənt] adj. 勤奋的，努力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + lig (选择) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勤奋的学生，"分开选择(di-lig)"
    <tspan x="50" dy="25">每一项任务，专注且努力地完成，这就是勤奋(diligent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a diligent student who always completes her homework on time.
  </text>
  <text x="50" y="310" class="content">
    她是一个勤奋的学生，总是按时完成作业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Student -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Desk -->
    <rect x="50" y="100" width="200" height="100" class="image" />
    <!-- Books -->
    <rect x="60" y="110" width="40" height="80" class="image" />
    <rect x="110" y="110" width="40" height="80" class="image" />
    <rect x="160" y="110" width="40" height="80" class="image" />
    <!-- Pen -->
    <line x1="220" y1="150" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="240" y2="140" class="image" />
    <line x1="250" y1="150" x2="240" y2="160" class="image" />
  </g>
</svg>