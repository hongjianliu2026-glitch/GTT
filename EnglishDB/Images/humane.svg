<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humane</text>
  <text x="50" y="120" class="subtitle">[hjuˈmeɪn] adj. 人道的，仁慈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hum (地) + -ane (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地球上，"接地气(hum)"
    <tspan x="50" dy="25">并表现出仁慈和关怀，这就是人道(humane)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The humane society rescues stray animals.
  </text>
  <text x="50" y="310" class="content">
    人道协会救助流浪动物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Person -->
    <circle cx="100" cy="20" r="15" class="image" />
    <line x1="100" y1="35" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="80" y2="120" class="image" />
    <line x1="100" y1="80" x2="120" y2="120" class="image" />
    <line x1="100" y1="50" x2="130" y2="40" class="image" />
    <!-- Heart -->
    <path d="M150,100 C150,80 170,80 170,100 C170,120 150,120 150,100 Z" class="image" />
  </g>
</svg>