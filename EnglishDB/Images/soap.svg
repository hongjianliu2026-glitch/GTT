<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soap</text>
  <text x="50" y="120" class="subtitle">[soʊp] n. 肥皂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sapo (拉丁语，肥皂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的肥皂泡泡，里面有一个小人正在洗澡，
    <tspan x="50" dy="25">肥皂泡泡(soap)把小人包裹得严严实实，洗得干干净净。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She uses a bar of soap to wash her hands.
  </text>
  <text x="50" y="310" class="content">
    她用一块肥皂洗手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soap bar -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Bubbles -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="30" r="25" class="image" />
    <circle cx="150" cy="60" r="30" class="image" />
    <!-- Person in bubble -->
    <circle cx="100" cy="50" r="10" class="image" />
    <line x1="100" y1="60" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="90" y2="100" class="image" />
    <line x1="100" y1="80" x2="110" y2="100" class="image" />
    <line x1="100" y1="70" x2="80" y2="60" class="image" />
    <line x1="100" y1="70" x2="120" y2="60" class="image" />
  </g>
</svg>