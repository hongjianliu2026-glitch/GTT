<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unconditionally</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˌkɒndɪˈʃənəli] adv. 无条件地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + condition (条件) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的"无条件"标志下，
    <tspan x="50" dy="25">周围没有任何限制或条件，完全自由。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She accepted the offer unconditionally.
  </text>
  <text x="50" y="310" class="content">
    她无条件地接受了这个提议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- No condition sign -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <text x="50" y="100" class="title" style="font-size: 60px; fill: #E74C3C;">无条件</text>
    <!-- Person -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="170" y2="180" class="image" />
    <line x1="200" y1="190" x2="230" y2="180" class="image" />
  </g>
</svg>