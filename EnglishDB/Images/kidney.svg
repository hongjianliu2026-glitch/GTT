<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kidney</text>
  <text x="50" y="120" class="subtitle">[ˈkɪdni] n. 肾，腰子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "renes"，意为“肾”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的肾脏形状的气球，"漂浮在空中(kidney)"，
    <tspan x="50" dy="25">它的形状和颜色让人一眼就能记住它的功能和位置。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He had a kidney transplant last year.
  </text>
  <text x="50" y="310" class="content">
    他去年进行了肾移植手术。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kidney shape -->
    <path d="M50,50 Q100,20 150,50 T250,50 Q200,80 150,50 T50,50" class="image" />
    <!-- Balloon string -->
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <!-- Airplane -->
    <path d="M100,250 L150,200 L200,250" class="image" />
    <circle cx="150" cy="200" r="10" class="image" />
  </g>
</svg>