<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mallet</text>
  <text x="50" y="120" class="subtitle">[ˈmælɪt] n. 木槌，槌棒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mal- (锤击) + let (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小木槌(mallet)，"锤击(mal-)"
    <tspan x="50" dy="25">的声音在耳边回响，它虽小却有力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The carpenter used a mallet to drive the nails.
  </text>
  <text x="50" y="310" class="content">
    木匠用木槌敲打钉子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mallet -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <circle cx="50" cy="190" r="15" class="image" />
    <line x1="50" y1="205" x2="50" y2="230" class="image" />
    <line x1="50" y1="230" x2="35" y2="250" class="image" />
    <line x1="50" y1="230" x2="65" y2="250" class="image" />
  </g>
</svg>