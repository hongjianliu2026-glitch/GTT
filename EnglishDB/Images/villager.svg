<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">villager</text>
  <text x="50" y="120" class="subtitle">[ˈvɪlɪdʒər] n. 村民</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vill (村庄) + age (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个村庄(vill)里的人(age)，
    <tspan x="50" dy="25">他们每天都在田间劳作，过着简单而充实的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The villager greeted us warmly with a basket of fresh vegetables.
  </text>
  <text x="50" y="310" class="content">
    村民热情地用一篮子新鲜蔬菜迎接我们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- House -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Door -->
    <rect x="90" y="60" width="20" height="40" class="image" />
    <!-- Window -->
    <rect x="70" y="40" width="20" height="20" class="image" />
    <rect x="110" y="40" width="20" height="20" class="image" />
    <!-- Field -->
    <rect x="180" y="20" width="150" height="80" class="image" />
    <!-- Villager -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Basket -->
    <rect x="250" y="60" width="30" height="30" class="image" />
    <!-- Vegetables -->
    <circle cx="265" cy="75" r="5" class="image" />
    <circle cx="275" cy="75" r="5" class="image" />
    <circle cx="265" cy="85" r="5" class="image" />
    <circle cx="275" cy="85" r="5" class="image" />
  </g>
</svg>