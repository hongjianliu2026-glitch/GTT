<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">throbbing</text>
  <text x="50" y="120" class="subtitle">[ˈθrɒbɪŋ] adj. 跳动的，悸动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> throb (跳动) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗心脏在胸腔中"跳动(throb)"，
    <tspan x="50" dy="25">每一次跳动都带来强烈的悸动感，这就是throbbing。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The throbbing pain in his leg made it hard to walk.
  </text>
  <text x="50" y="310" class="content">
    他腿上的跳痛让他很难走路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart -->
    <circle cx="100" cy="100" r="50" class="image" />
    <path d="M100,150 L50,100 A50,50 0 0,1 150,100 Z" class="image" />
    <!-- Arteries -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <!-- Pulse -->
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="25" class="image" />
  </g>
</svg>