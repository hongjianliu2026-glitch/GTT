<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">top-ranked</text>
  <text x="50" y="120" class="subtitle">[tɒp-ræŋkt] adj. 顶尖的，排名最高的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> top (顶部) + rank (等级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的排行榜，"顶部(top)"
    <tspan x="50" dy="25">的位置被一个闪闪发光的"等级(rank)"标志占据，</tspan>
    <tspan x="50" dy="25">这就是顶尖的(top-ranked)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a top-ranked student in her class.
  </text>
  <text x="50" y="310" class="content">
    她是班上顶尖的学生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ranking board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Top position -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Shining star -->
    <circle cx="175" cy="45" r="15" class="image" />
    <line x1="175" y1="45" x2="175" y2="65" class="image" />
    <line x1="175" y1="65" x2="160" y2="80" class="image" />
    <line x1="175" y1="65" x2="190" y2="80" class="image" />
    <line x1="175" y1="65" x2="175" y2="80" class="image" />
  </g>
</svg>