<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fifteen</text>
  <text x="50" y="120" class="subtitle">[ˌfɪfˈtiːn] n. 十五</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fif- (五) + teen (十)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，时针指向"五(fif)"，分针指向"十(teen)"，
    <tspan x="50" dy="25">这个时刻正好是十五(fifteen)分钟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She arrived at the meeting fifteen minutes late.
  </text>
  <text x="50" y="310" class="content">
    她开会迟到了十五分钟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Hour hand -->
    <line x1="175" y1="100" x2="175" y2="40" class="image" />
    <!-- Minute hand -->
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Numbers -->
    <text x="175" y="30" class="content" text-anchor="middle">12</text>
    <text x="255" y="100" class="content" text-anchor="middle">3</text>
    <text x="175" y="170" class="content" text-anchor="middle">6</text>
    <text x="95" y="100" class="content" text-anchor="middle">9</text>
  </g>
</svg>