<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">precedence</text>
  <text x="50" y="120" class="subtitle">[ˈpresɪdəns] n. 优先，优先权</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + ced (走) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在排队，"走在前面(pre-ced)"
    <tspan x="50" dy="25">的人优先获得服务，这就是优先权(precedence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The emergency vehicle has precedence over other traffic.
  </text>
  <text x="50" y="310" class="content">
    紧急车辆在交通中享有优先权。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Queue -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="30" x2="350" y2="30" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="90" x2="350" y2="90" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- People -->
    <circle cx="50" cy="15" r="10" class="image" />
    <circle cx="100" cy="45" r="10" class="image" />
    <circle cx="150" cy="75" r="10" class="image" />
    <circle cx="200" cy="105" r="10" class="image" />
    <circle cx="250" cy="135" r="10" class="image" />
    <!-- Emergency vehicle -->
    <rect x="300" y="-20" width="50" height="40" class="image" />
    <line x1="325" y1="-20" x2="325" y2="20" class="image" />
    <line x1="325" y1="20" x2="300" y2="40" class="image" />
    <line x1="325" y1="20" x2="350" y2="40" class="image" />
  </g>
</svg>