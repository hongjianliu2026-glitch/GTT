<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shredded</text>
  <text x="50" y="120" class="subtitle">[ˈʃrɛdɪd] adj. 撕碎的，切碎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shred (撕碎) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张纸被"撕碎(shred)"成无数小片，
    <tspan x="50" dy="25">这些小片散落在地上，形成了一片"撕碎的(shredded)"景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The document was shredded before it was thrown away.
  </text>
  <text x="50" y="310" class="content">
    文件在丢弃前被撕碎了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shredded paper -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="40" x2="110" y2="40" class="image" />
    <line x1="50" y1="60" x2="120" y2="60" class="image" />
    <line x1="50" y1="80" x2="130" y2="80" class="image" />
    <line x1="50" y1="100" x2="140" y2="100" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="140" x2="160" y2="140" class="image" />
    <line x1="50" y1="160" x2="170" y2="160" class="image" />
    <line x1="50" y1="180" x2="180" y2="180" class="image" />
    <line x1="50" y1="200" x2="190" y2="200" class="image" />
    <line x1="50" y1="220" x2="200" y2="220" class="image" />
    <line x1="50" y1="240" x2="210" y2="240" class="image" />
    <line x1="50" y1="260" x2="220" y2="260" class="image" />
    <line x1="50" y1="280" x2="230" y2="280" class="image" />
    <line x1="50" y1="300" x2="240" y2="300" class="image" />
    <line x1="50" y1="320" x2="250" y2="320" class="image" />
    <line x1="50" y1="340" x2="260" y2="340" class="image" />
    <line x1="50" y1="360" x2="270" y2="360" class="image" />
    <line x1="50" y1="380" x2="280" y2="380" class="image" />
    <line x1="50" y1="400" x2="290" y2="400" class="image" />
    <line x1="50" y1="420" x2="300" y2="420" class="image" />
    <line x1="50" y1="440" x2="310" y2="440" class="image" />
    <line x1="50" y1="460" x2="320" y2="460" class="image" />
    <line x1="50" y1="480" x2="330" y2="480" class="image" />
    <line x1="50" y1="500" x2="340" y2="500" class="image" />
    <line x1="50" y1="520" x2="350" y2="520" class="image" />
    <line x1="50" y1="540" x2="360" y2="540" class="image" />
    <line x1="50" y1="560" x2="370" y2="560" class="image" />
    <line x1="50" y1="580" x2="380" y2="580" class="image" />
    <line x1="50" y1="600" x2="390" y2="600" class="image" />
  </g>
</svg>