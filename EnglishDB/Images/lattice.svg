<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lattice</text>
  <text x="50" y="120" class="subtitle">[ˈlætɪs] n. 格子，栅格</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lat (宽) + -tice (结构)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"宽(lat)"结构，由无数的线条交织成一个复杂的"格子(lattice)"，
    <tspan x="50" dy="25">就像一个巨大的蜘蛛网，覆盖在整个城市上空。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was enclosed by a wooden lattice.
  </text>
  <text x="50" y="310" class="content">
    花园被一个木制的格子围了起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lattice structure -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="60" x2="350" y2="60" class="image" />
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <line x1="50" y1="140" x2="350" y2="140" class="image" />
    <line x1="50" y1="180" x2="350" y2="180" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="350" y1="20" x2="350" y2="180" class="image" />
  </g>
</svg>