<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liver</text>
  <text x="50" y="120" class="subtitle">[ˈlɪvər] n. 肝脏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> live (生活) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的肝脏，"生活(live)"
    <tspan x="50" dy="25">在人体内默默工作，维持着生命的运转。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The liver is a vital organ that detoxifies the blood.
  </text>
  <text x="50" y="310" class="content">
    肝脏是一个重要的器官，负责解毒血液。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Liver shape -->
    <path d="M50 50 Q100 20 150 50 T250 50 Q250 100 200 150 T100 150 Q50 100 50 50 Z" class="image" fill="#8E44AD" />
    <!-- Blood vessels -->
    <line x1="100" y1="70" x2="150" y2="70" class="image" />
    <line x1="125" y1="70" x2="125" y2="130" class="image" />
    <line x1="125" y1="130" x2="100" y2="130" class="image" />
    <line x1="125" y1="130" x2="150" y2="130" class="image" />
    <!-- Text label -->
    <text x="100" y="180" class="content" fill="#2C3E50">Liver</text>
  </g>
</svg>