<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thinker</text>
  <text x="50" y="120" class="subtitle">[ˈθɪŋkər] n. 思想家，思考者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> think (思考) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个深思熟虑的人，"思考(think)"
    <tspan x="50" dy="25">着复杂的问题，他就是一位思想家(thinker)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a deep thinker and often ponders philosophical questions.
  </text>
  <text x="50" y="310" class="content">
    他是一个深思熟虑的人，经常思考哲学问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Brain -->
    <rect x="70" y="50" width="60" height="60" class="image" />
    <!-- Thought bubbles -->
    <circle cx="180" cy="80" r="20" class="image" />
    <circle cx="210" cy="110" r="25" class="image" />
    <circle cx="190" cy="140" r="30" class="image" />
  </g>
</svg>