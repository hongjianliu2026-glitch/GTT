<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reassure</text>
  <text x="50" y="120" class="subtitle">[ˌriːəˈʃʊə(r)] v. 使放心，使安心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + as- (朝向) + sure (确信)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为担心而皱眉，另一个人走过来，"再次朝向(re-as-sure)"
    <tspan x="50" dy="25">他，用温暖的话语让他确信一切都会好起来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She reassured him that everything would be fine.
  </text>
  <text x="50" y="310" class="content">
    她让他放心，一切都会好起来的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Worried person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Reassuring person -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="150" x2="170" y2="140" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
    <!-- Heart symbol -->
    <path d="M125,150 C110,120 140,120 125,150 Z" class="image" />
    <path d="M175,150 C190,120 160,120 175,150 Z" class="image" />
    <line x1="125" y1="150" x2="175" y2="150" class="image" />
  </g>
</svg>