<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dim</text>
  <text x="50" y="120" class="subtitle">[dɪm] adj. 昏暗的，模糊的；v. 使暗淡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + m (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，灯光被"分开(di-)"成微弱的光线，
    <tspan x="50" dy="25">整个房间变得昏暗(dim)，几乎看不清任何东西。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was dim, making it hard to read.
  </text>
  <text x="50" y="310" class="content">
    房间很昏暗，很难阅读。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Light source -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Dim light rays -->
    <line x1="50" y1="70" x2="100" y2="150" class="image" />
    <line x1="50" y1="70" x2="200" y2="150" class="image" />
    <line x1="50" y1="70" x2="300" y2="150" class="image" />
    <!-- Dark area -->
    <rect x="100" y="100" width="200" height="100" class="image" />
  </g>
</svg>