<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">economist</text>
  <text x="50" y="120" class="subtitle">[ɪˈkɑːnəmɪst] n. 经济学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eco- (家) + nom (管理) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"管理家庭(eco-nom)"的人，
    <tspan x="50" dy="25">他精通经济，被称为经济学家(economist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The economist predicted a rise in inflation.
  </text>
  <text x="50" y="310" class="content">
    这位经济学家预测了通货膨胀的上升。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="100" x2="130" y2="100" class="image" />
    <line x1="75" y1="0" x2="75" y2="100" class="image" />
    <!-- Person -->
    <circle cx="75" cy="120" r="15" class="image" />
    <line x1="75" y1="135" x2="75" y2="170" class="image" />
    <line x1="75" y1="170" x2="60" y2="200" class="image" />
    <line x1="75" y1="170" x2="90" y2="200" class="image" />
    <line x1="75" y1="150" x2="100" y2="140" class="image" />
    <!-- Money -->
    <rect x="160" y="20" width="50" height="30" class="image" />
    <line x1="160" y1="35" x2="210" y2="35" class="image" />
    <line x1="160" y1="50" x2="210" y2="50" class="image" />
    <line x1="160" y1="65" x2="210" y2="65" class="image" />
  </g>
</svg>