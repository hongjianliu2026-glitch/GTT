<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resounding</text>
  <text x="50" y="120" class="subtitle">[rɪˈzaʊndɪŋ] adj. 响亮的，回响的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sound (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟声在山谷中回荡，"再次发出(re-sound)"
    <tspan x="50" dy="25">响亮的声音，整个山谷都充满了回响(resounding)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The applause was resounding after the performance.
  </text>
  <text x="50" y="310" class="content">
    表演结束后，掌声响彻云霄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 50 L200 200 Z" class="image" />
    <path d="M100 200 L200 100 L300 200 Z" class="image" />
    <path d="M200 200 L300 150 L400 200 Z" class="image" />
    <!-- Sound waves -->
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="40" class="image" />
    <circle cx="200" cy="100" r="60" class="image" />
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Bell -->
    <rect x="180" y="50" width="40" height="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="0" class="image" />
  </g>
</svg>