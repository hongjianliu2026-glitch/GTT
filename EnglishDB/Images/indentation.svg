<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indentation</text>
  <text x="50" y="120" class="subtitle">[ˌɪndenˈteɪʃn] n. 缩进，凹进</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (向内) + dent (牙齿) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个程序员在编写代码时，为了让代码更清晰，
    <tspan x="50" dy="25">将每一行代码"向内咬(in-dent)"了一部分，这就是缩进(indentation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Proper indentation is crucial for readability in programming.
  </text>
  <text x="50" y="310" class="content">
    适当的缩进对于编程的可读性至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Code lines -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="70" y1="80" x2="350" y2="80" class="image" />
    <line x1="90" y1="110" x2="350" y2="110" class="image" />
    <line x1="110" y1="140" x2="350" y2="140" class="image" />
    <!-- Indentation markers -->
    <line x1="50" y1="50" x2="50" y2="140" class="image" />
    <line x1="70" y1="80" x2="70" y2="140" class="image" />
    <line x1="90" y1="110" x2="90" y2="140" class="image" />
    <line x1="110" y1="140" x2="110" y2="140" class="image" />
    <!-- Teeth -->
    <rect x="30" y="160" width="20" height="20" class="image" />
    <rect x="50" y="160" width="20" height="20" class="image" />
    <rect x="70" y="160" width="20" height="20" class="image" />
    <rect x="90" y="160" width="20" height="20" class="image" />
  </g>
</svg>