<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFC107; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">light</text>
  <text x="50" y="120" class="subtitle">[laɪt] n. 光，灯；adj. 轻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lig (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的灯泡在天空中闪耀，"发出光(lig)"
    <tspan x="50" dy="25">芒，照亮了整个世界，这就是光(light)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The light from the lamp illuminated the room.
  </text>
  <text x="50" y="310" class="content">
    灯的光照亮了房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light bulb -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFEB3B" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="70" y1="250" x2="130" y2="250" class="image" />
    <!-- Rays of light -->
    <line x1="100" y1="50" x2="50" y2="0" class="image" />
    <line x1="100" y1="50" x2="150" y2="0" class="image" />
    <line x1="100" y1="50" x2="0" y2="50" class="image" />
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <line x1="100" y1="50" x2="50" y2="100" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
  </g>
</svg>