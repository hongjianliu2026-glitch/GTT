<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ventilator</text>
  <text x="50" y="120" class="subtitle">[ˈvɛntəˌleɪtər] n. 通风设备，呼吸机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vent (风) + il (小) + ator (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小风车在房间里旋转，"小风(vent-il)"
    <tspan x="50" dy="25">吹进来，让空气流通，这就是通风设备(ventilator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hospital has several ventilators for patients with respiratory issues.
  </text>
  <text x="50" y="310" class="content">
    医院有几台呼吸机供呼吸问题的患者使用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ventilator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fan blades -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="200" y1="100" x2="150" y2="50" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="200" y1="100" x2="150" y2="150" class="image" />
    <!-- Air flow -->
    <line x1="250" y1="100" x2="300" y2="100" class="image" />
    <line x1="250" y1="100" x2="275" y2="75" class="image" />
    <line x1="250" y1="100" x2="275" y2="125" class="image" />
  </g>
</svg>