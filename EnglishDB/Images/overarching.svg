<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overarching</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈɑːrtʃɪŋ] adj. 包罗万象的，全面的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + arch (拱形) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拱形结构"覆盖(over-arch)"
    <tspan x="50" dy="25">整个城市，这个拱形结构象征着包罗万象的(overarching)计划。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The overarching goal of the project is to improve public health.
  </text>
  <text x="50" y="310" class="content">
    这个项目的总体目标是改善公共健康。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arch structure -->
    <path d="M 0 100 Q 100 200 200 100 Q 300 0 400 100" class="image" />
    <!-- City -->
    <rect x="50" y="120" width="300" height="100" class="image" />
    <rect x="70" y="140" width="50" height="60" class="image" />
    <rect x="140" y="140" width="50" height="60" class="image" />
    <rect x="210" y="140" width="50" height="60" class="image" />
    <rect x="280" y="140" width="50" height="60" class="image" />
  </g>
</svg>