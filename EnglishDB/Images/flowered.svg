<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
      .flower { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flowered</text>
  <text x="50" y="120" class="subtitle">[ˈflaʊəd] adj. 有花的，开花的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flower (花) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件衣服上"开满了(flowered)"
    <tspan x="50" dy="25">五颜六色的花朵，这件衣服就是有花的(flowered)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a flowered dress to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件有花的裙子去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dress -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flowers -->
    <circle cx="50" cy="50" r="20" class="flower" />
    <circle cx="100" cy="70" r="20" class="flower" />
    <circle cx="150" cy="50" r="20" class="flower" />
    <circle cx="200" cy="70" r="20" class="flower" />
    <circle cx="250" cy="50" r="20" class="flower" />
    <circle cx="300" cy="70" r="20" class="flower" />
  </g>
</svg>