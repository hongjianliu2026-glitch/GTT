<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">borrower</text>
  <text x="50" y="120" class="subtitle">[ˈbɑːroʊər] n. 借款人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> borr (借) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在银行柜台前，手里拿着一张借据，"借(borr)"
    <tspan x="50" dy="25">钱的人(borrower)，就是借款人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The borrower must repay the loan within a year.
  </text>
  <text x="50" y="310" class="content">
    借款人必须在一年内偿还贷款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bank counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Bank counter -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <!-- Loan document -->
    <rect x="120" y="50" width="160" height="100" class="image" />
    <line x1="130" y1="60" x2="270" y2="60" class="image" />
    <line x1="130" y1="80" x2="250" y2="80" class="image" />
    <line x1="130" y1="100" x2="270" y2="100" class="image" />
    <line x1="130" y1="120" x2="240" y2="120" class="image" />
  </g>
</svg>