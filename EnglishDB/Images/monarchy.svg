<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monarchy</text>
  <text x="50" y="120" class="subtitle">[ˈmɒnəki] n. 君主制，君主国</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mon- (单一) + arch (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国王独自坐在宝座上，"单一统治(mon-arch)"
    <tspan x="50" dy="25">整个国家，这就是君主制(monarchy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The United Kingdom is a constitutional monarchy.
  </text>
  <text x="50" y="310" class="content">
    英国是一个君主立宪制国家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- King -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="120" y2="140" class="image" />
    <line x1="175" y1="150" x2="230" y2="140" class="image" />
    <!-- Crown -->
    <polygon points="155,70 195,70 205,90 175,100 145,90" class="image" />
  </g>
</svg>