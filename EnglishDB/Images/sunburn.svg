<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunburn</text>
  <text x="50" y="120" class="subtitle">[ˈsʌnˌbɜrn] n. 晒伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + burn (烧伤)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在沙滩上，被太阳"晒伤(sun-burn)"，
    <tspan x="50" dy="25">皮肤变得红红的，就像被火烧过一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She got a severe sunburn after a day at the beach.
  </text>
  <text x="50" y="310" class="content">
    她在海滩上待了一天后，严重晒伤了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="250" cy="100" r="20" fill="#E74C3C" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="150" x2="220" y2="130" class="image" />
    <line x1="250" y1="150" x2="280" y2="130" class="image" />
    <line x1="250" y1="180" x2="220" y2="210" class="image" />
    <line x1="250" y1="180" x2="280" y2="210" class="image" />
    <!-- Sunburn effect -->
    <rect x="220" y="80" width="60" height="20" fill="#E74C3C" />
  </g>
</svg>