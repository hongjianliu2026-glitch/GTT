<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tighten</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪtn] v. 使变紧，加固</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tight (紧的) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人正在"使(en)"螺丝"变紧(tight)"，
    <tspan x="50" dy="25">他用力拧紧螺丝，确保结构稳固。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He tightened the screws on the chair to make it more stable.
  </text>
  <text x="50" y="310" class="content">
    他拧紧了椅子上的螺丝，使其更加稳固。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Worker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Screw -->
    <rect x="70" y="80" width="30" height="60" class="image" />
    <line x1="85" y1="80" x2="85" y2="20" class="image" />
    <line x1="70" y1="100" x2="100" y2="100" class="image" />
    <line x1="70" y1="120" x2="100" y2="120" class="image" />
    <line x1="70" y1="140" x2="100" y2="140" class="image" />
    <!-- Wrench -->
    <rect x="110" y="90" width="50" height="10" class="image" />
    <rect x="110" y="110" width="50" height="10" class="image" />
    <rect x="110" y="130" width="50" height="10" class="image" />
  </g>
</svg>