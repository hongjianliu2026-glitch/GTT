<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">potent</text>
  <text x="50" y="120" class="subtitle">[ˈpoʊtnt] adj. 强有力的，有效的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pot- (能力) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的力量之源，"能力(pot-)"
    <tspan x="50" dy="25">源源不断地涌出，这种力量是如此强大(potent)，</tspan>
    <tspan x="50" dy="25">以至于任何阻挡它的东西都会被摧毁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new medicine is highly potent against the virus.
  </text>
  <text x="50" y="310" class="content">
    这种新药对病毒非常有效。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Power source -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Energy lines -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <line x1="75" y1="175" x2="125" y2="225" class="image" />
    <line x1="75" y1="225" x2="125" y2="175" class="image" />
    <!-- Destruction -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <line x1="200" y1="50" x2="300" y2="150" class="image" />
    <line x1="300" y1="50" x2="200" y2="150" class="image" />
  </g>
</svg>