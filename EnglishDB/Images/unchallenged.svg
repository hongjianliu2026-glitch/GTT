<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unchallenged</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˈtʃælɪndʒd] adj. 未受到挑战的，无可置疑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + challenge (挑战) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个无敌的战士，"未被挑战(unchallenged)"
    <tspan x="50" dy="25">地站在战场上，无人敢上前挑战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His authority remained unchallenged throughout his reign.
  </text>
  <text x="50" y="310" class="content">
    他的权威在他统治期间始终未受到挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="30" y2="250" class="image" />
    <line x1="50" y1="200" x2="70" y2="250" class="image" />
    <!-- Shield -->
    <rect x="30" y="180" width="40" height="40" class="image" />
    <!-- Sword -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="30" y2="280" class="image" />
    <!-- No challenge -->
    <text x="100" y="220" class="content" style="font-size: 36px; fill: #E74C3C;">✗</text>
  </g>
</svg>