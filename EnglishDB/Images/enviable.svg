<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enviable</text>
  <text x="50" y="120" class="subtitle">[ˈɛnvɪəbl] adj. 令人羡慕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + vi (看) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个闪闪发光的奖杯，"使人们(en-)"
    <tspan x="50" dy="25">忍不住"看(vi)"，因为它太"令人羡慕(enviable)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her enviable success in the competition made everyone admire her.
  </text>
  <text x="50" y="310" class="content">
    她在比赛中令人羡慕的成功让每个人都钦佩她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Trophy -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="30" class="image" />
    <line x1="50" y1="20" x2="50" y2="220" class="image" />
    <!-- Eyes -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Mouth -->
    <path d="M150 130 Q175 150 200 130" class="image" />
    <!-- Admiration -->
    <text x="150" y="180" class="content" text-anchor="middle">羡慕</text>
  </g>
</svg>