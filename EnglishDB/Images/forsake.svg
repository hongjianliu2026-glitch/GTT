<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forsake</text>
  <text x="50" y="120" class="subtitle">[fərˈseɪk] v. 放弃，抛弃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (离开) + sake (缘故)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为某种"缘故(sake)"而"离开(for)"
    <tspan x="50" dy="25">他的家园，这种行为就是"放弃(forsake)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He decided to forsake his old life and start anew.
  </text>
  <text x="50" y="310" class="content">
    他决定放弃旧生活，重新开始。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="100" x2="130" y2="100" class="image" />
    <line x1="75" y1="50" x2="75" y2="100" class="image" />
    <!-- Person leaving -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="200" y2="100" class="image" />
    <line x1="200" y1="80" x2="180" y2="90" class="image" />
    <line x1="200" y1="80" x2="220" y2="90" class="image" />
    <line x1="200" y1="100" x2="180" y2="120" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
    <!-- Arrow -->
    <line x1="200" y1="120" x2="250" y2="170" class="image" />
    <polygon points="250,170 240,160 240,180" class="image" />
  </g>
</svg>