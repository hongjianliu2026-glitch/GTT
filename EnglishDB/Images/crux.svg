<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crux</text>
  <text x="50" y="120" class="subtitle">[krʌks] n. 关键，核心，难点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crux (十字架)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的十字架，象征着问题的"核心(crux)"，
    <tspan x="50" dy="25">所有解决问题的线索都汇聚于此。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crux of the matter is how to reduce costs.
  </text>
  <text x="50" y="310" class="content">
    问题的关键在于如何降低成本。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large cross -->
    <line x1="50" y1="50" x2="300" y2="300" class="image" />
    <line x1="50" y1="300" x2="300" y2="50" class="image" />
    <!-- Small crosses representing key points -->
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
    <line x1="200" y1="200" x2="250" y2="250" class="image" />
    <line x1="200" y1="250" x2="250" y2="200" class="image" />
  </g>
</svg>