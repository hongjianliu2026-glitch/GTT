<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">backyard</text>
  <text x="50" y="120" class="subtitle">[ˈbækˌjɑrd] n. 后院</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> back (后面) + yard (院子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房子后面有一个小院子，孩子们在"后面(back)"的"院子(yard)"里玩耍。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were playing in the backyard.
  </text>
  <text x="50" y="310" class="content">
    孩子们在后院玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Backyard -->
    <rect x="0" y="150" width="200" height="100" class="image" />
    <!-- Children -->
    <circle cx="50" cy="200" r="15" class="image" />
    <circle cx="100" cy="200" r="15" class="image" />
    <circle cx="150" cy="200" r="15" class="image" />
    <!-- Playground -->
    <line x1="30" y1="230" x2="170" y2="230" class="image" />
    <line x1="30" y1="230" x2="30" y2="250" class="image" />
    <line x1="170" y1="230" x2="170" y2="250" class="image" />
  </g>
</svg>