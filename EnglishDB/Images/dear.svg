<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dear</text>
  <text x="50" y="120" class="subtitle">[dɪr] adj. 亲爱的，昂贵的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + ar (表状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个珍贵的宝石，"强调(de-)"
    <tspan x="50" dy="25">它的价值和重要性，就像我们对"亲爱的(dear)"</tspan>
    <tspan x="50" dy="25">人或物所赋予的情感和价值。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received a dear gift from her friend.
  </text>
  <text x="50" y="310" class="content">
    她收到了朋友送的一份珍贵的礼物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gemstone -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Heart -->
    <path d="M150,100 C150,50 200,50 200,100 C200,150 150,150 150,100 Z" class="image" />
    <!-- Arrow -->
    <line x1="220" y1="100" x2="280" y2="100" class="image" />
    <polygon points="280,85 280,115 300,100" class="image" />
  </g>
</svg>