<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clarification</text>
  <text x="50" y="120" class="subtitle">[ˌklærɪfɪˈkeɪʃn] n. 澄清，阐明</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clar (清楚) + -ify (使) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个模糊的画面，突然被"使清楚(clar-ify)"
    <tspan x="50" dy="25">的光线照亮，画面变得清晰，这就是澄清(clarification)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher's clarification helped the students understand the concept better.
  </text>
  <text x="50" y="310" class="content">
    老师的澄清帮助学生们更好地理解了这个概念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloudy image -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="120" r="40" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Light beam -->
    <line x1="250" y1="0" x2="250" y2="200" class="image" />
    <!-- Clear image -->
    <rect x="260" y="0" width="350" height="200" class="image" />
    <circle cx="360" cy="100" r="50" class="image" />
    <circle cx="410" cy="120" r="40" class="image" />
    <circle cx="460" cy="100" r="30" class="image" />
  </g>
</svg>