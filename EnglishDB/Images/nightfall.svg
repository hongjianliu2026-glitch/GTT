<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nightfall</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪtfɔːl] n. 黄昏，傍晚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> night (夜晚) + fall (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳"落下(fall)"，天空逐渐变暗，进入"夜晚(night)"，
    <tspan x="50" dy="25">这就是黄昏(nightfall)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We arrived at the campsite just before nightfall.
  </text>
  <text x="50" y="310" class="content">
    我们在黄昏前到达了露营地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Sun rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="300" height="200" class="image" fill="#87CEEB" />
    <!-- Ground -->
    <rect x="0" y="200" width="300" height="100" class="image" fill="#2E8B57" />
    <!-- Sun setting -->
    <line x1="100" y1="100" x2="100" y2="200" class="image" />
  </g>
</svg>