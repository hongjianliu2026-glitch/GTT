<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">house</text>
  <text x="50" y="120" class="subtitle">[haʊs] n. 房子，住宅；v. 给...房子住</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> house (源自拉丁语 "hospes"，意为"客人"或"主人")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，"主人(hospes)"
    <tspan x="50" dy="25">热情地邀请客人进入他的"房子(house)"，</tspan>
    <tspan x="50" dy="25">这个房子不仅是居住的地方，也是温暖的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They built a new house in the countryside.
  </text>
  <text x="50" y="310" class="content">
    他们在乡下建了一座新房子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,100 200,0 350,100" class="image" />
    <rect x="100" y="100" width="150" height="100" class="image" />
    <!-- Door -->
    <rect x="160" y="160" width="30" height="40" class="image" />
    <!-- Windows -->
    <rect x="120" y="120" width="30" height="30" class="image" />
    <rect x="200" y="120" width="30" height="30" class="image" />
  </g>
</svg>