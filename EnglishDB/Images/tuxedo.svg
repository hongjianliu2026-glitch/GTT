<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tuxedo</text>
  <text x="50" y="120" class="subtitle">[tʌkˈsiːdoʊ] n. 无尾礼服</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tux (源自tuxedo park, 美国纽约州的一个地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个绅士穿着一件无尾礼服，"tuxedo"这个词源自纽约州的Tuxedo Park，
    <tspan x="50" dy="25">那里是这种礼服首次流行的地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a tuxedo to the black-tie event.
  </text>
  <text x="50" y="310" class="content">
    他穿了一件无尾礼服去参加正式晚宴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tuxedo -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Jacket -->
    <rect x="20" y="20" width="160" height="100" class="image" />
    <!-- Shirt -->
    <rect x="40" y="140" width="120" height="100" class="image" />
    <!-- Bow tie -->
    <rect x="70" y="260" width="60" height="20" class="image" />
    <!-- Buttons -->
    <circle cx="60" cy="100" r="5" class="image" />
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="140" cy="100" r="5" class="image" />
  </g>
</svg>