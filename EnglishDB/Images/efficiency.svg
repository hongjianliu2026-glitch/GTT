<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">efficiency</text>
  <text x="50" y="120" class="subtitle">[ɪˈfɪʃənsi] n. 效率，效能</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ef- (出) + fic (做) + -iency (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人，他"做出(fic)"的东西总是"超出(ef)"预期，
    <tspan x="50" dy="25">他的工作效率(efficiency)非常高，总能提前完成任务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new machine increased our efficiency by 50%.
  </text>
  <text x="50" y="310" class="content">
    新机器使我们的效率提高了50%。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Worker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Product -->
    <rect x="70" y="80" width="50" height="50" class="image" />
    <line x1="70" y1="80" x2="120" y2="80" class="image" />
    <line x1="70" y1="130" x2="120" y2="130" class="image" />
    <line x1="70" y1="80" x2="70" y2="130" class="image" />
    <line x1="120" y1="80" x2="120" y2="130" class="image" />
    <!-- Efficiency arrow -->
    <line x1="150" y1="105" x2="200" y2="105" class="image" />
    <polygon points="200,105 190,95 190,115" class="image" />
    <text x="160" y="90" class="content" fill="#2980B9">Efficiency</text>
  </g>
</svg>