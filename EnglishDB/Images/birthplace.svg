<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">birthplace</text>
  <text x="50" y="120" class="subtitle">[ˈbɜːrθpleɪs] n. 出生地，发源地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> birth (出生) + place (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个婴儿从"出生地(birthplace)"的摇篮中诞生，
    <tspan x="50" dy="25">这个地方不仅是他生命的起点，也是他故事的开始。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her birthplace is a small village in the mountains.
  </text>
  <text x="50" y="310" class="content">
    她的出生地是山里的一个小村庄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cradle -->
    <rect x="50" y="100" width="200" height="50" class="image" />
    <line x1="70" y1="100" x2="70" y2="50" class="image" />
    <line x1="230" y1="100" x2="230" y2="50" class="image" />
    <line x1="70" y1="50" x2="230" y2="50" class="image" />
    <!-- Baby -->
    <circle cx="150" cy="75" r="20" class="image" />
    <line x1="150" y1="95" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="105" x2="180" y2="95" class="image" />
  </g>
</svg>