<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sliced</text>
  <text x="50" y="120" class="subtitle">[slaɪst] adj. 切成薄片的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slice (切) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师用刀将一个大西瓜"切成薄片(slice)"，
    <tspan x="50" dy="25">每一片都薄如蝉翼，这就是sliced的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She served the salad with sliced tomatoes.
  </text>
  <text x="50" y="310" class="content">
    她在沙拉里加了切成薄片的西红柿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Watermelon -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Sliced lines -->
    <line x1="25" y1="100" x2="325" y2="100" class="image" />
    <line x1="25" y1="130" x2="325" y2="130" class="image" />
    <line x1="25" y1="160" x2="325" y2="160" class="image" />
    <line x1="25" y1="190" x2="325" y2="190" class="image" />
    <!-- Knife -->
    <line x1="350" y1="80" x2="370" y2="120" class="image" />
    <line x1="370" y1="120" x2="350" y2="160" class="image" />
  </g>
</svg>