<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crucifix</text>
  <text x="50" y="120" class="subtitle">[ˈkruːsɪfɪks] n. 十字架，耶稣受难像</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cruci- (十字) + fix (固定)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的十字架，"十字(cruci-)"
    <tspan x="50" dy="25">上固定(fix)着耶稣受难像，这就是crucifix。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The church had a large crucifix above the altar.
  </text>
  <text x="50" y="310" class="content">
    教堂的祭坛上方有一个巨大的十字架。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cross -->
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <line x1="200" y1="100" x2="200" y2="300" class="image" />
    <!-- Jesus figure -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="150" y2="300" class="image" />
    <line x1="200" y1="250" x2="250" y2="300" class="image" />
    <line x1="200" y1="200" x2="150" y2="220" class="image" />
    <line x1="200" y1="200" x2="250" y2="220" class="image" />
  </g>
</svg>