<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">captivity</text>
  <text x="50" y="120" class="subtitle">[kæpˈtɪvɪti] n. 囚禁，被俘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> capt (抓) + iv (形容词后缀) + ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟被"抓住(capt)"，关在一个小笼子里，
    <tspan x="50" dy="25">这就是"囚禁(captivity)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion was kept in captivity for years.
  </text>
  <text x="50" y="310" class="content">
    这只狮子被囚禁了好几年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />

    <!-- Bird -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="130" x2="225" y2="120" class="image" />
  </g>
</svg>