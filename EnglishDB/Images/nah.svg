<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nah</text>
  <text x="50" y="120" class="subtitle">[næ] adv. 不，不要</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自口语，表示否定
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在说"nah"时，头摇得像拨浪鼓，
    <tspan x="50" dy="25">双手交叉在胸前，表示强烈的拒绝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He asked if I wanted to go, but I said "nah."
  </text>
  <text x="50" y="310" class="content">
    他问我是否想去，但我回答说"不"。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head shaking -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <!-- Crossed arms -->
    <line x1="20" y1="180" x2="80" y2="180" class="image" />
    <line x1="20" y1="180" x2="80" y2="220" class="image" />
    <line x1="80" y1="180" x2="20" y2="220" class="image" />
  </g>
</svg>