<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abundance</text>
  <text x="50" y="120" class="subtitle">[əˈbʌndəns] n. 丰富，充裕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (从) + und (波浪) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片海洋，"波浪(und)"从四面八方涌来，
    <tspan x="50" dy="25">带来了无尽的"丰富(ab-und-ance)"，象征着充裕和富足。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The abundance of fruits in the market amazed us.
  </text>
  <text x="50" y="310" class="content">
    市场上水果的丰富程度让我们惊叹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean waves -->
    <path d="M0 0 C50 50, 150 50, 200 0 S350 50, 400 0" class="image" />
    <path d="M0 50 C50 100, 150 100, 200 50 S350 100, 400 50" class="image" />
    <path d="M0 100 C50 150, 150 150, 200 100 S350 150, 400 100" class="image" />
    <!-- Fish -->
    <circle cx="100" cy="75" r="10" class="image" />
    <line x1="100" y1="75" x2="120" y2="65" class="image" />
    <line x1="100" y1="75" x2="120" y2="85" class="image" />
    <line x1="120" y1="65" x2="130" y2="75" class="image" />
    <line x1="120" y1="85" x2="130" y2="75" class="image" />
    <!-- Fish -->
    <circle cx="250" cy="125" r="10" class="image" />
    <line x1="250" y1="125" x2="270" y2="115" class="image" />
    <line x1="250" y1="125" x2="270" y2="135" class="image" />
    <line x1="270" y1="115" x2="280" y2="125" class="image" />
    <line x1="270" y1="135" x2="280" y2="125" class="image" />
  </g>
</svg>