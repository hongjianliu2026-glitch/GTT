<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">repugnant</text>
  <text x="50" y="120" class="subtitle">[rɪˈpʌɡnənt] adj. 令人厌恶的，反感的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (反) + pugn (战斗) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面对着一堆令人作呕的食物，"反(re-)"
    <tspan x="50" dy="25">而战斗(pugn)，这种感觉就是令人厌恶的(repugnant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smell of rotten eggs is repugnant to most people.
  </text>
  <text x="50" y="310" class="content">
    大多数人对腐烂鸡蛋的气味感到厌恶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face with disgusted expression -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="30" y1="40" x2="70" y2="40" class="image" />
    <line x1="30" y1="60" x2="70" y2="60" class="image" />
    <line x1="40" y1="70" x2="60" y2="70" class="image" />
    <line x1="45" y1="80" x2="55" y2="80" class="image" />
    <line x1="50" y1="90" x2="50" y2="90" class="image" />
    <!-- Rotten food -->
    <rect x="100" y="20" width="150" height="100" class="image" />
    <line x1="120" y1="40" x2="230" y2="40" class="image" />
    <line x1="120" y1="60" x2="230" y2="60" class="image" />
    <line x1="120" y1="80" x2="230" y2="80" class="image" />
    <line x1="120" y1="100" x2="230" y2="100" class="image" />
  </g>
</svg>