<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">articulated</text>
  <text x="50" y="120" class="subtitle">[ɑːrˈtɪkjuleɪtɪd] adj. 铰接的，表达清晰的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arti- (关节) + -cul- (小) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆卡车，它的每个部分都通过"关节(arti-)"连接在一起，
    <tspan x="50" dy="25">就像一个表达清晰的人，每个词都恰到好处地连接起来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The articulated truck can navigate tight corners easily.
  </text>
  <text x="50" y="310" class="content">
    这辆铰接式卡车可以轻松地通过狭窄的弯道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Articulated truck -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="170" y="20" width="100" height="100" class="image" />
    <line x1="150" y1="70" x2="170" y2="70" class="image" />
    <!-- Wheels -->
    <circle cx="75" cy="130" r="15" class="image" />
    <circle cx="225" cy="130" r="15" class="image" />
  </g>
</svg>