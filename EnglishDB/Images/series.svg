<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">series</text>
  <text x="50" y="120" class="subtitle">[ˈsɪəriːz] n. 系列，连续</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seri (连接) + -es (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一串珍珠项链，每一颗珍珠都"连接(seri)"在一起，
    <tspan x="50" dy="25">形成了一个完整的"系列(series)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The TV show is a series of detective stories.
  </text>
  <text x="50" y="310" class="content">
    这部电视剧是一系列侦探故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pearl necklace -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Connecting lines -->
    <line x1="65" y1="100" x2="85" y2="100" class="image" />
    <line x1="115" y1="100" x2="135" y2="100" class="image" />
    <line x1="165" y1="100" x2="185" y2="100" class="image" />
    <line x1="215" y1="100" x2="235" y2="100" class="image" />
    <line x1="265" y1="100" x2="285" y2="100" class="image" />
  </g>
</svg>