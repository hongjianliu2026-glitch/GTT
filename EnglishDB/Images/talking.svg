<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">talking</text>
  <text x="50" y="120" class="subtitle">[ˈtɔːkɪŋ] adj. 健谈的，多话的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> talk (说话) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个健谈的人，嘴巴不停地"说话(talk)"，
    <tspan x="50" dy="25">就像一个永不停歇的广播站，这就是"talking"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a very talking person, always sharing her thoughts.
  </text>
  <text x="50" y="310" class="content">
    她是一个非常健谈的人，总是分享她的想法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M 150 70 Q 250 70 250 150 L 200 150 Q 200 100 150 70" class="image" />
    <text x="160" y="120" class="content">"Talking"</text>
  </g>
</svg>