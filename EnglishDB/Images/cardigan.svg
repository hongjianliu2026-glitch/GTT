<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cardigan</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrdɪɡən] n. 开襟羊毛衫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cardi- (心脏) + gan (羊毛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位老绅士穿着一件开襟羊毛衫，"心脏(cardi-)"
    <tspan x="50" dy="25">温暖如羊毛(gan)般柔软，这件羊毛衫就是卡迪根(cardigan)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a cozy cardigan on the chilly evening.
  </text>
  <text x="50" y="310" class="content">
    她在寒冷的夜晚穿了一件舒适的卡迪根羊毛衫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cardigan -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Heart symbol -->
    <path d="M100,100 C100,50 150,50 150,100 C150,150 100,150 100,100 Z" class="image" />
    <!-- Wool symbol -->
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="220" y1="50" x2="220" y2="150" class="image" />
    <line x1="240" y1="50" x2="240" y2="150" class="image" />
    <line x1="260" y1="50" x2="260" y2="150" class="image" />
    <line x1="280" y1="50" x2="280" y2="150" class="image" />
  </g>
</svg>