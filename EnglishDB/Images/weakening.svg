<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weakening</text>
  <text x="50" y="120" class="subtitle">[ˈwiːkənɪŋ] n. 削弱，减弱；v. 使变弱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> weak (弱) + -en (使) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根原本坚固的柱子，"逐渐变弱(weak-en-ing)"，
    <tspan x="50" dy="25">最终支撑不住，倒塌了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm caused the weakening of the building's structure.
  </text>
  <text x="50" y="310" class="content">
    风暴导致建筑结构削弱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Strong pillar -->
    <rect x="0" y="0" width="50" height="200" class="image" />
    <!-- Weakening pillar -->
    <rect x="70" y="0" width="30" height="150" class="image" />
    <rect x="110" y="0" width="10" height="100" class="image" />
    <!-- Collapsed pillar -->
    <rect x="140" y="100" width="50" height="20" class="image" />
    <!-- Arrow -->
    <line x1="25" y1="210" x2="165" y2="210" class="image" />
    <polygon points="165,210 160,205 160,215" class="image" />
  </g>
</svg>