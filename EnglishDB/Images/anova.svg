<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ANOVA</text>
  <text x="50" y="120" class="subtitle">[əˈnoʊvə] n. 方差分析</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ANalysis (分析) + Of (的) + VAriance (方差)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个统计学家在分析数据，"分析(ANalysis)不同组之间的方差(VAriance)"
    <tspan x="50" dy="25">来确定它们是否显著不同，这就是方差分析(ANOVA)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ANOVA test showed significant differences between the groups.
  </text>
  <text x="50" y="310" class="content">
    方差分析测试显示各组之间存在显著差异。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Data points -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="90" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
    <!-- Group lines -->
    <line x1="50" y1="50" x2="250" y2="130" class="image" />
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="130" x2="250" y2="130" class="image" />
    <!-- Statistician -->
    <circle cx="300" cy="90" r="15" class="image" />
    <line x1="300" y1="105" x2="300" y2="140" class="image" />
    <line x1="300" y1="140" x2="280" y2="170" class="image" />
    <line x1="300" y1="140" x2="320" y2="170" class="image" />
    <line x1="300" y1="120" x2="350" y2="110" class="image" />
  </g>
</svg>