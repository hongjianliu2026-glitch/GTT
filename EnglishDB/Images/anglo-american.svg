<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Anglo-American</text>
  <text x="50" y="120" class="subtitle">[ˌæŋɡloʊəˈmɛrɪkən] adj. 英美的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Anglo- (英国的) + American (美国的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个英国人和一个美国人手拉手，"英美(Anglo-American)"
    <tspan x="50" dy="25">两国人民友好合作，共同创造美好未来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Anglo-American relationship is crucial for global stability.
  </text>
  <text x="50" y="310" class="content">
    英美关系对全球稳定至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- British flag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="0" y1="0" x2="150" y2="100" class="image" />
    <line x1="0" y1="100" x2="150" y2="0" class="image" />
    <line x1="0" y1="50" x2="150" y2="50" class="image" />
    <line x1="75" y1="0" x2="75" y2="100" class="image" />

    <!-- American flag -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <line x1="200" y1="0" x2="350" y2="100" class="image" />
    <line x1="200" y1="100" x2="350" y2="0" class="image" />
    <line x1="200" y1="50" x2="350" y2="50" class="image" />
    <line x1="275" y1="0" x2="275" y2="100" class="image" />

    <!-- Handshake -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
  </g>
</svg>