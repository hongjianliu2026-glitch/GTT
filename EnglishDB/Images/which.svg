<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">which</text>
  <text x="50" y="120" class="subtitle">[wɪtʃ] pron. 哪一个，哪一些</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wh- (表示疑问) + -ich (表示“哪一个”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你在超市里，面对无数的商品，你指着其中一个问：“这是哪一个(which)？”
    <tspan x="50" dy="25">这个疑问词帮助你选择特定的物品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Which book do you prefer, the red one or the blue one?
  </text>
  <text x="50" y="310" class="content">
    你更喜欢哪本书，红色的还是蓝色的？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Supermarket shelves -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Products -->
    <rect x="60" y="30" width="80" height="50" class="image" />
    <rect x="160" y="30" width="80" height="50" class="image" />
    <rect x="260" y="30" width="80" height="50" class="image" />
    <!-- Finger pointing -->
    <line x1="30" y1="100" x2="100" y2="100" class="image" />
    <polygon points="30,100 20,95 20,105" class="image" />
  </g>
</svg>