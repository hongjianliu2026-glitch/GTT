<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polyp</text>
  <text x="50" y="120" class="subtitle">[ˈpɒlɪp] n. 息肉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poly- (多) + -p (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海洋生物，身上长满了许多小触手，
    <tspan x="50" dy="25">这些触手就像"多(poly)"个小"点(p)"，构成了一个海葵(polyp)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor found a polyp in his colon during the examination.
  </text>
  <text x="50" y="310" class="content">
    医生在检查时在他的结肠中发现了一个息肉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea anemone -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Tentacles -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="75" y1="175" x2="25" y2="250" class="image" />
    <line x1="125" y1="175" x2="175" y2="250" class="image" />
    <line x1="50" y1="200" x2="0" y2="250" class="image" />
    <line x1="150" y1="200" x2="200" y2="250" class="image" />
    <line x1="25" y1="225" x2="0" y2="250" class="image" />
    <line x1="175" y1="225" x2="200" y2="250" class="image" />
  </g>
</svg>