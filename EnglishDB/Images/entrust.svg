<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entrust</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtrʌst] v. 委托，托付</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + trust (信任)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人将一个重要的盒子"托付(entrust)"给另一个人，
    <tspan x="50" dy="25">因为完全信任对方，盒子象征着重要的任务或责任。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She entrusted her child to her neighbor while she was at work.
  </text>
  <text x="50" y="310" class="content">
    她上班时把孩子托付给了邻居。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Person handing over the box -->
    <circle cx="20" cy="60" r="15" class="image" />
    <line x1="20" y1="75" x2="20" y2="110" class="image" />
    <line x1="20" y1="110" x2="0" y2="140" class="image" />
    <line x1="20" y1="110" x2="40" y2="140" class="image" />
    <line x1="20" y1="90" x2="50" y2="80" class="image" />
    <!-- Person receiving the box -->
    <circle cx="180" cy="60" r="15" class="image" />
    <line x1="180" y1="75" x2="180" y2="110" class="image" />
    <line x1="180" y1="110" x2="160" y2="140" class="image" />
    <line x1="180" y1="110" x2="200" y2="140" class="image" />
    <line x1="180" y1="90" x2="210" y2="80" class="image" />
    <!-- Handing over action -->
    <line x1="70" y1="60" x2="160" y2="60" class="image" />
  </g>
</svg>