<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hate</text>
  <text x="50" y="120" class="subtitle">[heɪt] v. 憎恨，厌恶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> haet (恨)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到一只蜘蛛，"恨(haet)"
    <tspan x="50" dy="25">得咬牙切齿，满脸厌恶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hates spiders with a passion.
  </text>
  <text x="50" y="310" class="content">
    她对蜘蛛深恶痛绝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <!-- Spider -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
    <line x1="230" y1="90" x2="270" y2="90" class="image" />
    <line x1="230" y1="110" x2="270" y2="110" class="image" />
    <line x1="240" y1="70" x2="260" y2="70" class="image" />
    <line x1="240" y1="130" x2="260" y2="130" class="image" />
  </g>
</svg>