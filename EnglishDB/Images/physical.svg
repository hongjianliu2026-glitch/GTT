<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">physical</text>
  <text x="50" y="120" class="subtitle">[ˈfɪzɪkl] adj. 身体的，物理的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> phys (自然) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"自然地(phys)"
    <tspan x="50" dy="25">研究物质和能量，这些研究就是物理(physical)的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Regular exercise is important for physical health.
  </text>
  <text x="50" y="310" class="content">
    定期锻炼对身体健康很重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Lab coat -->
    <line x1="20" y1="115" x2="20" y2="80" class="image" />
    <line x1="20" y1="80" x2="0" y2="70" class="image" />
    <line x1="20" y1="80" x2="40" y2="70" class="image" />
    <!-- Beaker -->
    <rect x="70" y="80" width="50" height="80" class="image" />
    <line x1="70" y1="120" x2="120" y2="120" class="image" />
    <line x1="70" y1="160" x2="120" y2="160" class="image" />
    <!-- Flask -->
    <rect x="150" y="80" width="50" height="100" class="image" />
    <line x1="150" y1="130" x2="200" y2="130" class="image" />
    <line x1="150" y1="180" x2="200" y2="180" class="image" />
  </g>
</svg>