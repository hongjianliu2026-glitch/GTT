<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">write</text>
  <text x="50" y="120" class="subtitle">[raɪt] v. 写，书写</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wr- (手) + ite (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手(wr-)在纸上"做(ite)"动作，
    <tspan x="50" dy="25">这个动作就是书写(write)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She writes a letter to her friend every week.
  </text>
  <text x="50" y="310" class="content">
    她每周给朋友写一封信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,220)">
    <!-- Hand -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="90" x2="30" y2="100" class="image" />
    <line x1="50" y1="90" x2="70" y2="100" class="image" />
    <line x1="50" y1="120" x2="30" y2="140" class="image" />
    <line x1="50" y1="120" x2="70" y2="140" class="image" />

    <!-- Paper -->
    <rect x="100" y="20" width="200" height="160" class="image" />

    <!-- Writing -->
    <line x1="120" y1="50" x2="280" y2="50" class="image" />
    <line x1="120" y1="80" x2="250" y2="80" class="image" />
    <line x1="120" y1="110" x2="270" y2="110" class="image" />
    <line x1="120" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>