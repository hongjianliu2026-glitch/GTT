<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .olive { fill: #808B96; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">olive</text>
  <text x="50" y="120" class="subtitle">[ˈɒlɪv] n. 橄榄，橄榄树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oliv (橄榄)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵橄榄树，树上挂满了"橄榄(oliv)"，
    <tspan x="50" dy="25">这些橄榄象征着和平与健康。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The olive branch is a symbol of peace.
  </text>
  <text x="50" y="310" class="content">
    橄榄枝是和平的象征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Olive tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <circle cx="175" cy="50" r="20" class="olive" />
    <circle cx="150" cy="80" r="20" class="olive" />
    <circle cx="200" cy="80" r="20" class="olive" />
    <circle cx="175" cy="110" r="20" class="olive" />
    <circle cx="150" cy="140" r="20" class="olive" />
    <circle cx="200" cy="140" r="20" class="olive" />
  </g>
</svg>