<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sneakers</text>
  <text x="50" y="120" class="subtitle">[ˈsniːkərz] n. 运动鞋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sneak (偷偷地走) + -ers (表示物品)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一双运动鞋，让你可以"偷偷地走(sneak)"，
    <tspan x="50" dy="25">悄无声息地移动，就像忍者一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought a pair of new sneakers for his morning runs.
  </text>
  <text x="50" y="310" class="content">
    他为晨跑买了一双新运动鞋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sneaker outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sneaker body -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Sneaker laces -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Sneaker sole -->
    <rect x="50" y="180" width="250" height="20" class="image" />
    <!-- Ninja symbol -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>