<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heretofore</text>
  <text x="50" y="120" class="subtitle">[ˌhɪrərtˈɔːrfər] adv. 迄今为止，到目前为止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> here (这里) + to (到) + fore (前面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时间轴，"从这里(here)到前面(to fore)"
    <tspan x="50" dy="25">的所有时间，就是迄今为止(heretofore)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Heretofore, we have only used traditional methods.
  </text>
  <text x="50" y="310" class="content">
    迄今为止，我们只使用了传统方法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Timeline -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Here -->
    <circle cx="50" cy="0" r="10" class="image" />
    <text x="40" y="-20" class="content">Here</text>
    <!-- To Fore -->
    <line x1="50" y1="0" x2="300" y2="0" class="image" />
    <text x="310" y="-20" class="content">To Fore</text>
  </g>
</svg>