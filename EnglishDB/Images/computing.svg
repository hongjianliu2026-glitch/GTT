<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">computing</text>
  <text x="50" y="120" class="subtitle">[kəmˈpjuːtɪŋ] n. 计算，计算机科学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + put (思考) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群科学家围坐在一台巨大的计算机前，"共同思考(com-put-ing)"
    <tspan x="50" dy="25">复杂的数学问题，这就是计算(computing)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The field of computing has advanced rapidly in recent years.
  </text>
  <text x="50" y="310" class="content">
    计算机科学领域近年来发展迅速。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Computer screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Code lines -->
    <line x1="50" y1="30" x2="300" y2="30" class="image" />
    <line x1="50" y1="60" x2="270" y2="60" class="image" />
    <line x1="50" y1="90" x2="290" y2="90" class="image" />
    <line x1="50" y1="120" x2="260" y2="120" class="image" />
    <!-- Scientists -->
    <circle cx="30" cy="150" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="170" cy="150" r="15" class="image" />
    <line x1="30" y1="165" x2="30" y2="190" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="170" y1="165" x2="170" y2="190" class="image" />
    <line x1="30" y1="190" x2="10" y2="220" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="170" y1="190" x2="150" y2="220" class="image" />
    <line x1="30" y1="190" x2="50" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="170" y1="190" x2="190" y2="220" class="image" />
  </g>
</svg>