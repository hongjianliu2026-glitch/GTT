<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">duplex</text>
  <text x="50" y="120" class="subtitle">[ˈduːpleks] adj. 双重的，双倍的；n. 双工系统</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> du- (二) + plex (折叠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座房子，"两层折叠(du-plex)"在一起，
    <tspan x="50" dy="25">每一层都有自己的空间，这就是双重的(duplex)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The duplex apartment has two separate living areas.
  </text>
  <text x="50" y="310" class="content">
    这套复式公寓有两个独立的居住区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- First floor -->
    <rect x="50" y="20" width="250" height="80" class="image" />
    <!-- Second floor -->
    <rect x="50" y="120" width="250" height="80" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="40" height="40" class="image" />
    <rect x="130" y="40" width="40" height="40" class="image" />
    <rect x="190" y="40" width="40" height="40" class="image" />
    <rect x="70" y="140" width="40" height="40" class="image" />
    <rect x="130" y="140" width="40" height="40" class="image" />
    <rect x="190" y="140" width="40" height="40" class="image" />
    <!-- Roof -->
    <polygon points="50,20 300,20 225,0" class="image" />
    <polygon points="50,120 300,120 225,100" class="image" />
  </g>
</svg>