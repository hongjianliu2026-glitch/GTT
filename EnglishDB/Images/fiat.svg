<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fiat</text>
  <text x="50" y="120" class="subtitle">[ˈfiːæt] n. 命令，许可</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fiat (来自拉丁语，意为“让它成为”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位权威人士站在高台上，手持权杖，
    <tspan x="50" dy="25">大声宣布：“让它成为(fiat)！”</tspan>
    <tspan x="50" dy="25">这一命令立即生效，世界因此改变。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was approved by fiat.
  </text>
  <text x="50" y="310" class="content">
    这个项目被命令批准了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Authority figure -->
    <circle cx="175" cy="80" r="30" class="image" />
    <line x1="175" y1="110" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="145" y2="200" class="image" />
    <line x1="175" y1="160" x2="205" y2="200" class="image" />
    <line x1="175" y1="130" x2="220" y2="120" class="image" />
    <!-- Scepter -->
    <line x1="175" y1="80" x2="175" y2="30" class="image" />
    <line x1="175" y1="30" x2="150" y2="10" class="image" />
    <line x1="175" y1="30" x2="200" y2="10" class="image" />
    <!-- Speech bubble -->
    <path d="M250,50 Q300,50 300,100 Q250,100 250,50 Z" class="image" />
    <text x="260" y="80" class="content">Fiat!</text>
  </g>
</svg>