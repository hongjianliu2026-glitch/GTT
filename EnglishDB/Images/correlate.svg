<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">correlate</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrəˌleɪt] v. 使相互关联，相关联</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cor- (共同) + relate (关联)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人站在一条线上，"共同关联(cor-relate)"
    <tspan x="50" dy="25">他们的动作和想法，就像在跳双人舞一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Researchers found a strong correlation between exercise and health.
  </text>
  <text x="50" y="310" class="content">
    研究人员发现运动与健康之间有很强的关联。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Line -->
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <!-- Person 1 -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="200" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Person 2 -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="200" class="image" />
    <line x1="300" y1="160" x2="320" y2="200" class="image" />
    <line x1="300" y1="140" x2="260" y2="130" class="image" />
    <!-- Connecting line -->
    <line x1="120" y1="120" x2="280" y2="120" class="image" />
  </g>
</svg>