<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stun</text>
  <text x="50" y="120" class="subtitle">[stʌn] v. 使震惊，使目瞪口呆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + un (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然被"震惊(stun)"，
    <tspan x="50" dy="25">他的身体僵硬地"站立(st-)"，无法动弹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news stunned everyone in the room.
  </text>
  <text x="50" y="310" class="content">
    这个消息让房间里的每个人都震惊了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="160" class="image" />
    <line x1="50" y1="120" x2="70" y2="160" class="image" />
    <line x1="50" y1="90" x2="30" y2="100" class="image" />
    <line x1="50" y1="90" x2="70" y2="100" class="image" />
    <!-- Lightning bolt -->
    <polyline points="100,30 120,50 100,70 120,90 100,110" class="image" />
    <polyline points="120,50 140,30 120,70 140,90 120,110" class="image" />
  </g>
</svg>