<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mini</text>
  <text x="50" y="120" class="subtitle">[ˈmɪni] adj. 极小的，微型的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> min (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手掌上，"小(min)"
    <tspan x="50" dy="25">到几乎看不见的物体，这就是mini(极小的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a mini car for city driving.
  </text>
  <text x="50" y="310" class="content">
    她买了一辆微型车用于城市驾驶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant hand -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mini object -->
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Hand -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
  </g>
</svg>