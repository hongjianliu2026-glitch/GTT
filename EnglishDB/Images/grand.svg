<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grand</text>
  <text x="50" y="120" class="subtitle">[ɡrænd] adj. 宏伟的，壮丽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grand (大，伟大)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的城堡，"宏伟(grand)"
    <tspan x="50" dy="25">的城墙和塔楼，给人一种庄严和壮丽的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The grand palace was a sight to behold.
  </text>
  <text x="50" y="310" class="content">
    这座宏伟的宫殿令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="70" y="40" width="210" height="120" class="image" />
    <rect x="90" y="60" width="170" height="80" class="image" />
    <rect x="110" y="80" width="130" height="40" class="image" />
    <!-- Towers -->
    <rect x="50" y="20" width="20" height="160" class="image" />
    <rect x="280" y="20" width="20" height="160" class="image" />
    <!-- Flags -->
    <line x1="60" y1="20" x2="60" y2="0" class="image" />
    <line x1="290" y1="20" x2="290" y2="0" class="image" />
    <rect x="55" y="0" width="10" height="20" class="image" />
    <rect x="285" y="0" width="10" height="20" class="image" />
  </g>
</svg>