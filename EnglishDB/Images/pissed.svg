<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pissed</text>
  <text x="50" y="120" class="subtitle">[pɪst] adj. 生气的，愤怒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> piss (小便) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为被泼了一身尿而"气得(pissed)"
    <tspan x="50" dy="25">满脸通红，这种夸张的画面让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was so pissed off that he left the party early.
  </text>
  <text x="50" y="310" class="content">
    他气得早早离开了派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Pissed off expression -->
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <line x1="90" y1="135" x2="110" y2="135" class="image" />
    <line x1="90" y1="140" x2="110" y2="140" class="image" />
    <!-- Piss splash -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="170" y2="90" class="image" />
    <line x1="150" y1="70" x2="130" y2="90" class="image" />
    <line x1="150" y1="70" x2="160" y2="110" class="image" />
    <line x1="150" y1="70" x2="140" y2="110" class="image" />
  </g>
</svg>