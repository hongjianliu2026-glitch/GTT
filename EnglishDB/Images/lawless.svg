<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lawless</text>
  <text x="50" y="120" class="subtitle">[ˈlɔːləs] adj. 无法无天的，不受法律约束的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> law (法律) + -less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有法律(law)的世界，人们肆意妄为，
    <tspan x="50" dy="25">到处都是混乱和无序，这就是lawless(无法无天的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The town became lawless after the police left.
  </text>
  <text x="50" y="310" class="content">
    警察离开后，小镇变得无法无天。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken law symbol -->
    <line x1="50" y1="20" x2="300" y2="200" class="image" />
    <line x1="50" y1="200" x2="300" y2="20" class="image" />
    <!-- Chaos symbols -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="150" cy="150" r="30" class="image" />
    <!-- People symbols -->
    <circle cx="70" cy="70" r="10" class="image" />
    <circle cx="230" cy="70" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
  </g>
</svg>