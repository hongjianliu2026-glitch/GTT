<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">book</text>
  <text x="50" y="120" class="subtitle">[bʊk] n. 书，书籍；v. 预订，登记</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boo- (源自拉丁语 "volumen"，意为卷轴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的卷轴(boo-)，被展开成一本书(book)，
    <tspan x="50" dy="25">书页上写满了智慧和故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to read books about history.
  </text>
  <text x="50" y="310" class="content">
    她喜欢读关于历史的书籍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="20" y2="280" class="image" />
    <line x1="40" y1="20" x2="40" y2="280" class="image" />
    <line x1="60" y1="20" x2="60" y2="280" class="image" />
    <line x1="80" y1="20" x2="80" y2="280" class="image" />
    <line x1="100" y1="20" x2="100" y2="280" class="image" />
    <line x1="120" y1="20" x2="120" y2="280" class="image" />
    <line x1="140" y1="20" x2="140" y2="280" class="image" />
    <line x1="160" y1="20" x2="160" y2="280" class="image" />
    <line x1="180" y1="20" x2="180" y2="280" class="image" />
    <!-- Title on the book -->
    <text x="30" y="40" class="content" style="font-size: 24px;">BOOK</text>
  </g>
</svg>