<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">syndicate</text>
  <text x="50" y="120" class="subtitle">[ˈsɪnɪdɪkət] n. 辛迪加，企业联合组织；v. 联合，组成辛迪加</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syn- (共同) + dic (说) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群商人围坐在一张大桌子旁，"共同商议(syn-dic)"
    <tspan x="50" dy="25">如何合作，最终组成了一个辛迪加(syndicate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The companies decided to syndicate to increase their market share.
  </text>
  <text x="50" y="310" class="content">
    这些公司决定联合起来以增加市场份额。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Businessmen -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Hands shaking -->
    <line x1="60" y1="70" x2="140" y2="70" class="image" />
    <line x1="160" y1="70" x2="240" y2="70" class="image" />
    <!-- Speech bubbles -->
    <ellipse cx="50" cy="30" rx="20" ry="10" class="image" />
    <ellipse cx="150" cy="30" rx="20" ry="10" class="image" />
    <ellipse cx="250" cy="30" rx="20" ry="10" class="image" />
  </g>
</svg>