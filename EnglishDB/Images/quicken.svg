<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quicken</text>
  <text x="50" y="120" class="subtitle">[ˈkwɪkən] v. 加快，加速</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quick (快的) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只乌龟在赛道上，突然被施了魔法，"使(en)"
    <tspan x="50" dy="25">它变得"快(quick)"起来，瞬间加速冲向终点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coach tried to quicken the pace of the training.
  </text>
  <text x="50" y="310" class="content">
    教练试图加快训练的节奏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Race track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <!-- Turtle -->
    <circle cx="70" cy="110" r="15" class="image" />
    <line x1="70" y1="125" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="55" y2="170" class="image" />
    <line x1="70" y1="150" x2="85" y2="170" class="image" />
    <!-- Magic effect -->
    <circle cx="150" cy="110" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="110" r="10" class="image" />
  </g>
</svg>