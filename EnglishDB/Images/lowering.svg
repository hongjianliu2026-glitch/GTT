<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lowering</text>
  <text x="50" y="120" class="subtitle">[ˈloʊərɪŋ] n. 降低，减少</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> low (低) + -er (表示动作) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球正在缓缓"降低(low-er-ing)"，
    <tspan x="50" dy="25">从天空慢慢下降到地面，这个过程就是lowering。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lowering of the temperature made the room more comfortable.
  </text>
  <text x="50" y="310" class="content">
    温度的降低使房间更加舒适。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="50" r="30" class="image" />
    <line x1="100" y1="80" x2="100" y2="200" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <!-- Arrow pointing down -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="90" y2="140" class="image" />
    <line x1="100" y1="150" x2="110" y2="140" class="image" />
  </g>
</svg>