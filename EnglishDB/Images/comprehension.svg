<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comprehension</text>
  <text x="50" y="120" class="subtitle">[ˌkɒmprɪˈhenʃn] n. 理解，领悟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (完全) + prehend (抓住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人完全"抓住(com-prehend)"了
    <tspan x="50" dy="25">一个复杂的概念，这就是理解(comprehension)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His comprehension of the subject was remarkable.
  </text>
  <text x="50" y="310" class="content">
    他对这个主题的理解非常出色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Hand grasping the brain -->
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="150" y2="200" class="image" />
    <line x1="200" y1="150" x2="250" y2="200" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>