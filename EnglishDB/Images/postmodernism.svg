<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">postmodernism</text>
  <text x="50" y="120" class="subtitle">[ˌpoʊstˈmɒdərnɪzəm] n. 后现代主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> post- (后) + modern (现代) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家站在一个破碎的时钟前，时钟的指针指向"后现代(post-modern)"，
    <tspan x="50" dy="25">象征着对传统现代主义的颠覆和重新定义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His work is a perfect example of postmodernism.
  </text>
  <text x="50" y="310" class="content">
    他的作品是后现代主义的完美典范。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <!-- Artist -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="300" y2="120" class="image" />
  </g>
</svg>