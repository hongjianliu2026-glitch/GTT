<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pacify</text>
  <text x="50" y="120" class="subtitle">[ˈpæsɪfaɪ] v. 安抚，使平静</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pac (和平) + -ify (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个哭泣的孩子，被妈妈用"和平(pac)"的方式"使(ify)"
    <tspan x="50" dy="25">平静下来，这就是安抚(pacify)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tried to pacify the crying baby with a lullaby.
  </text>
  <text x="50" y="310" class="content">
    她试图用摇篮曲安抚哭泣的婴儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crying baby -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="45" y1="110" x2="55" y2="110" class="image" />
    <line x1="50" y1="120" x2="50" y2="130" class="image" />
    <line x1="40" y1="130" x2="60" y2="130" class="image" />
    <!-- Pacifying mom -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="190" y1="90" x2="210" y2="90" class="image" />
    <line x1="195" y1="110" x2="205" y2="110" class="image" />
    <line x1="200" y1="120" x2="200" y2="130" class="image" />
    <line x1="190" y1="130" x2="210" y2="130" class="image" />
    <line x1="200" y1="130" x2="50" y2="130" class="image" />
    <!-- Lullaby -->
    <path d="M200,150 Q250,100 300,150" class="image" />
    <path d="M200,160 Q250,110 300,160" class="image" />
    <path d="M200,170 Q250,120 300,170" class="image" />
  </g>
</svg>