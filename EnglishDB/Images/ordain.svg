<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ordain</text>
  <text x="50" y="120" class="subtitle">[ɔːrˈdeɪn] v. 任命，规定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> or- (神) + -dain (命令)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位神圣的牧师在祭坛前，"神(or-)"
    <tspan x="50" dy="25">下达命令(dain)，任命某人为圣职。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bishop ordained him as a priest.
  </text>
  <text x="50" y="310" class="content">
    主教任命他为牧师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Altar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Priest -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Holy book -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <line x1="120" y1="70" x2="230" y2="70" class="image" />
    <line x1="120" y1="90" x2="230" y2="90" class="image" />
    <line x1="120" y1="110" x2="230" y2="110" class="image" />
    <!-- Command -->
    <text x="120" y="140" class="content" style="font-size: 24px; fill: #A93226;">ORDAIN</text>
  </g>
</svg>