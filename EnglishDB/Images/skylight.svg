<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skylight</text>
  <text x="50" y="120" class="subtitle">[ˈskaɪlaɪt] n. 天窗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sky (天空) + light (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天窗(skylight)，"天空(sky)"的光(light)
    <tspan x="50" dy="25">透过它洒进房间，照亮了整个空间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The skylight in the living room lets in plenty of natural light.
  </text>
  <text x="50" y="310" class="content">
    客厅的天窗让大量的自然光透进来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skylight -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Sun rays -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <line x1="150" y1="30" x2="130" y2="10" class="image" />
    <line x1="200" y1="30" x2="220" y2="10" class="image" />
    <line x1="125" y1="50" x2="100" y2="30" class="image" />
    <line x1="225" y1="50" x2="250" y2="30" class="image" />
    <!-- Room -->
    <rect x="50" y="180" width="250" height="100" class="image" />
    <line x1="70" y1="200" x2="280" y2="200" class="image" />
    <line x1="70" y1="220" x2="280" y2="220" class="image" />
    <line x1="70" y1="240" x2="280" y2="240" class="image" />
    <line x1="70" y1="260" x2="280" y2="260" class="image" />
  </g>
</svg>