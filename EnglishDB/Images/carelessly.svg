<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carelessly</text>
  <text x="50" y="120" class="subtitle">[ˈkerləsli] adv. 粗心地，漫不经心地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> care (关心) + less (没有) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路时，"没有关心(care-less)"
    <tspan x="50" dy="25">地踢到了石头，结果摔倒了，这就是粗心(carelessly)的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He carelessly left his keys on the table.
  </text>
  <text x="50" y="310" class="content">
    他粗心地把钥匙留在了桌子上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="130" y2="80" class="image" />
    <line x1="150" y1="50" x2="170" y2="80" class="image" />
    <line x1="50" y1="50" x2="30" y2="80" class="image" />
    <line x1="50" y1="50" x2="70" y2="80" class="image" />
    <!-- Stone -->
    <rect x="120" y="70" width="20" height="10" class="image" />
    <!-- Person falling -->
    <line x1="130" y1="80" x2="130" y2="120" class="image" />
    <line x1="130" y1="120" x2="110" y2="150" class="image" />
    <line x1="130" y1="120" x2="150" y2="150" class="image" />
  </g>
</svg>