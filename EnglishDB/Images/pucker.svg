<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pucker</text>
  <text x="50" y="120" class="subtitle">[ˈpʌkər] v. 起皱，皱缩；n. 皱褶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puck (皱) + -er (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张纸被"皱起(puck-er)"，形成了一个夸张的皱褶，
    <tspan x="50" dy="25">这个皱褶就像是一个小山丘，让人忍不住想去抚平它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man's face was full of pucker from years of worry.
  </text>
  <text x="50" y="310" class="content">
    老人的脸上满是因多年忧虑而起的皱纹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wrinkled paper -->
    <path d="M50,20 Q100,80 150,20 T250,20" class="image" />
    <path d="M50,60 Q100,120 150,60 T250,60" class="image" />
    <path d="M50,100 Q100,160 150,100 T250,100" class="image" />
    <path d="M50,140 Q100,200 150,140 T250,140" class="image" />
    <!-- Mountain -->
    <path d="M150,180 Q200,120 250,180" class="image" />
  </g>
</svg>