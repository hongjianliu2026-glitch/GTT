<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fish { fill: #FFD700; }
      .rock { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rockfish</text>
  <text x="50" y="120" class="subtitle">[ˈrɒkfɪʃ] n. 岩鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rock (岩石) + fish (鱼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条鱼在岩石间穿梭，"岩石(rock)"
    <tspan x="50" dy="25">和"鱼(fish)"的结合，就是岩鱼(rockfish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rockfish is a common species in the Pacific Ocean.
  </text>
  <text x="50" y="310" class="content">
    岩鱼是太平洋中常见的物种。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rock -->
    <rect x="0" y="0" width="350" height="200" class="rock" />
    <!-- Fish -->
    <ellipse cx="175" cy="100" rx="50" ry="30" class="fish" />
    <line x1="175" y1="100" x2="225" y2="100" class="image" />
    <line x1="175" y1="100" x2="150" y2="80" class="image" />
    <line x1="175" y1="100" x2="150" y2="120" class="image" />
    <!-- Eye -->
    <circle cx="160" cy="90" r="5" class="image" />
  </g>
</svg>