<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aback</text>
  <text x="50" y="120" class="subtitle">[əˈbæk] adv. 向后，退后</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (向) + back (后面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然被吓到，"向后(a-back)"
    <tspan x="50" dy="25">退了几步，脸上露出惊恐的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stepped aback when she saw the snake.
  </text>
  <text x="50" y="310" class="content">
    她看到蛇时向后退了几步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Snake -->
    <path d="M150,100 C150,50 250,50 250,100" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <line x1="250" y1="110" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="200" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="90" y2="240" class="image" />
    <line x1="100" y1="250" x2="110" y2="240" class="image" />
  </g>
</svg>