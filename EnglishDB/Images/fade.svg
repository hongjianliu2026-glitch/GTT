<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fade</text>
  <text x="50" y="120" class="subtitle">[feɪd] v. 逐渐消失，褪色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> f- (表示“离开”) + ade (表示“动作”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一幅画，颜色"离开(f-)"画面，逐渐"消失(ade)"，
    <tspan x="50" dy="25">最终画面变得模糊不清，这就是"褪色(fade)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The colors of the sunset began to fade as the night approached.
  </text>
  <text x="50" y="310" class="content">
    随着夜幕降临，夕阳的颜色开始逐渐消失。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Fading effect -->
    <circle cx="100" cy="100" r="40" class="image" fill="#F39C12" />
    <circle cx="100" cy="100" r="30" class="image" fill="#E67E22" />
    <circle cx="100" cy="100" r="20" class="image" fill="#D35400" />
    <circle cx="100" cy="100" r="10" class="image" fill="#B03A2E" />
    <!-- Night sky -->
    <rect x="0" y="0" width="200" height="200" class="image" fill="#2C3E50" />
    <!-- Stars -->
    <circle cx="20" cy="20" r="2" class="image" fill="#ECF0F1" />
    <circle cx="180" cy="20" r="2" class="image" fill="#ECF0F1" />
    <circle cx="100" cy="180" r="2" class="image" fill="#ECF0F1" />
    <circle cx="150" cy="150" r="2" class="image" fill="#ECF0F1" />
  </g>
</svg>