<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">explode</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsploʊd] v. 爆炸，爆发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + plod (膨胀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球，"向外膨胀(ex-plod)"
    <tspan x="50" dy="25">到极限后突然爆炸(explode)，碎片四溅。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The firecracker exploded with a loud bang.
  </text>
  <text x="50" y="310" class="content">
    鞭炮砰的一声爆炸了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Explosion -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="100" y1="100" x2="50" y2="50" class="image" />
    <!-- Shards -->
    <line x1="100" y1="100" x2="180" y2="120" class="image" />
    <line x1="100" y1="100" x2="120" y2="180" class="image" />
    <line x1="100" y1="100" x2="20" y2="120" class="image" />
    <line x1="100" y1="100" x2="80" y2="20" class="image" />
  </g>
</svg>