<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ring</text>
  <text x="50" y="120" class="subtitle">[rɪŋ] n. 戒指，环；v. 响铃，打电话</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ring (环)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的戒指(ring)，它不仅是一个装饰品，还能发出响亮的铃声(ring)，
    <tspan x="50" dy="25">甚至可以用来打电话(ring)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a diamond ring on her finger.
  </text>
  <text x="50" y="310" class="content">
    她手指上戴着一枚钻石戒指。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ring -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Bell -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="70" x2="250" y2="30" class="image" />
    <line x1="230" y1="50" x2="270" y2="50" class="image" />
    <!-- Phone -->
    <rect x="350" y="50" width="100" height="100" class="image" />
    <line x1="400" y1="150" x2="400" y2="200" class="image" />
  </g>
</svg>