<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">haze</text>
  <text x="50" y="120" class="subtitle">[heɪz] n. 薄雾，迷糊；v. 使模糊，使迷糊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ha- (来自古英语hǣg, 意为“雾”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个清晨，太阳刚刚升起，空气中弥漫着一层薄薄的"雾(ha-)"，
    <tspan x="50" dy="25">这层雾让远处的景色变得模糊不清，这就是"haze"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mountains were barely visible through the haze.
  </text>
  <text x="50" y="310" class="content">
    薄雾中，山脉几乎看不见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" fill="#F1C40F" />
    <!-- Haze -->
    <rect x="0" y="150" width="400" height="100" fill="#ECF0F1" opacity="0.5" />
    <!-- Mountains -->
    <polygon points="50,150 200,50 350,150" fill="#7F8C8D" />
    <polygon points="100,150 250,75 400,150" fill="#95A5A6" />
  </g>
</svg>