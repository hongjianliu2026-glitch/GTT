<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sprinkle</text>
  <text x="50" y="120" class="subtitle">[ˈsprɪŋkl] v. 撒，洒；n. 少量，洒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sp- (散开) + ring (小环) + -le (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调皮的小精灵，"散开(sp-)"
    <tspan x="50" dy="25">小环(ring)形状的魔法粉末，反复(le)洒在</tspan>
    <tspan x="50" dy="25">蛋糕上，就像在撒糖霜一样(sprinkle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sprinkled some sugar on the cake.
  </text>
  <text x="50" y="310" class="content">
    她在蛋糕上撒了一些糖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Sugar sprinkles -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="120" cy="70" r="5" class="image" />
    <circle cx="140" cy="90" r="5" class="image" />
    <circle cx="160" cy="110" r="5" class="image" />
    <circle cx="180" cy="130" r="5" class="image" />
    <circle cx="200" cy="150" r="5" class="image" />
    <circle cx="220" cy="170" r="5" class="image" />
    <circle cx="240" cy="190" r="5" class="image" />
    <!-- Little fairy -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="330" y2="120" class="image" />
  </g>
</svg>