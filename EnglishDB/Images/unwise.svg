<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unwise</text>
  <text x="50" y="120" class="subtitle">[ʌnˈwaɪz] adj. 不明智的，愚蠢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + wise (明智)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在悬崖边上跳舞，"不明智(un-wise)"
    <tspan x="50" dy="25">的行为让人为他捏一把汗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was unwise to invest all your money in one stock.
  </text>
  <text x="50" y="310" class="content">
    把所有钱都投资在一只股票上是不明智的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person dancing on the edge -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <line x1="175" y1="130" x2="145" y2="120" class="image" />
    <!-- Danger sign -->
    <text x="250" y="150" class="highlight" font-size="48">!</text>
  </g>
</svg>