<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intermission</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈmɪʃn] n. 间歇，休息</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + miss (送出) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场电影中，"在(inter-)" 两个场景 "之间(inter-)"，
    <tspan x="50" dy="25">送出(miss)一段休息时间，这就是间歇(intermission)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The audience took a short intermission during the play.
  </text>
  <text x="50" y="310" class="content">
    观众在演出中短暂休息了一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Movie screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- First scene -->
    <rect x="50" y="20" width="120" height="160" class="image" />
    <!-- Second scene -->
    <rect x="180" y="20" width="120" height="160" class="image" />
    <!-- Intermission sign -->
    <text x="125" y="110" class="image" font-size="30" fill="#7F8C8D" text-anchor="middle">Intermission</text>
  </g>
</svg>