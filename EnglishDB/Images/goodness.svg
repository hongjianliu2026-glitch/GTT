<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">goodness</text>
  <text x="50" y="120" class="subtitle">[ˈɡʊdnəs] n. 善良，美德</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> good (好的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天使在空中，"散发着(good)"
    <tspan x="50" dy="25">善良的光芒，这种光芒就是美德(goodness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her goodness touched everyone around her.
  </text>
  <text x="50" y="310" class="content">
    她的善良感动了身边的每一个人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angel -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="200" x2="50" y2="220" class="image" />
    <line x1="100" y1="200" x2="150" y2="220" class="image" />
    <line x1="100" y1="170" x2="50" y2="150" class="image" />
    <line x1="100" y1="170" x2="150" y2="150" class="image" />
    <!-- Halo -->
    <circle cx="100" cy="70" r="20" class="image" />
    <!-- Light rays -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
    <line x1="100" y1="50" x2="50" y2="20" class="image" />
    <line x1="100" y1="50" x2="150" y2="20" class="image" />
    <line x1="100" y1="50" x2="75" y2="0" class="image" />
    <line x1="100" y1="50" x2="125" y2="0" class="image" />
  </g>
</svg>