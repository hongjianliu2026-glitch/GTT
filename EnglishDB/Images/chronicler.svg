<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chronicler</text>
  <text x="50" y="120" class="subtitle">[ˈkrɒnɪklə(r)] n. 编年史作者，记录者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chron (时间) + icler (记录者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个编年史作者，手持羽毛笔，"记录(icler)"
    <tspan x="50" dy="25">着时间的流逝(chron)，将历史事件一一记载。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chronicler meticulously documented the events of the war.
  </text>
  <text x="50" y="310" class="content">
    编年史作者一丝不苟地记录了战争的事件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Quill pen -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="20" x2="30" y2="50" class="image" />
    <line x1="50" y1="20" x2="70" y2="50" class="image" />
    <line x1="50" y1="20" x2="60" y2="30" class="image" />
    <!-- Scroll -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <line x1="120" y1="40" x2="280" y2="40" class="image" />
    <line x1="120" y1="70" x2="250" y2="70" class="image" />
    <line x1="120" y1="100" x2="270" y2="100" class="image" />
    <line x1="120" y1="130" x2="240" y2="130" class="image" />
    <!-- Chronicler -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>