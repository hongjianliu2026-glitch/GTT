<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #795548; }
      .subtitle { font: italic 24px serif; fill: #5D4037; }
      .content { font: 18px sans-serif; fill: #4E342E; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #6D4C41; }
      .image { stroke: #795548; stroke-width: 2; fill: none; }
      .chocolate { fill: #7B3F00; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chocolate</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɒklət] n. 巧克力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> choco (源自Nahuatl语言的“chocolatl”，意为“热饮”) + late (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的阿兹特克人，用可可豆制作了一种“热饮(choco)”，
    <tspan x="50" dy="25">这种饮品后来演变成了我们今天所熟知的巧克力(chocolate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat chocolate every day.
  </text>
  <text x="50" y="310" class="content">
    她每天都喜欢吃巧克力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chocolate bar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="chocolate" />
    <!-- Chocolate squares -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="50" y1="70" x2="300" y2="70" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
  </g>
</svg>