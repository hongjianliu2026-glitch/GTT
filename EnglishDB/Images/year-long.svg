<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">year-long</text>
  <text x="50" y="120" class="subtitle">[ˈjɪər lɒŋ] adj. 持续一年的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> year (年) + long (长的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的日历，上面有一个"长长的(long)"
    <tspan x="50" dy="25">年份(year)，代表着持续一整年的事件。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She completed a year-long project last month.
  </text>
  <text x="50" y="310" class="content">
    她上个月完成了一个持续一年的项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Year -->
    <text x="50" y="100" class="content" style="font-size: 48px;">2023</text>
    <!-- Months -->
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <line x1="50" y1="220" x2="300" y2="220" class="image" />
    <line x1="50" y1="240" x2="300" y2="240" class="image" />
    <line x1="50" y1="260" x2="300" y2="260" class="image" />
    <line x1="50" y1="280" x2="300" y2="280" class="image" />
    <line x1="50" y1="300" x2="300" y2="300" class="image" />
    <line x1="50" y1="320" x2="300" y2="320" class="image" />
    <line x1="50" y1="340" x2="300" y2="340" class="image" />
  </g>
</svg>