<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .nightmare { fill: #8E44AD; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nightmare</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪtmɛər] n. 噩梦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> night (夜晚) + mare (恶魔)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶魔(mare)在夜晚(night)
    <tspan x="50" dy="25">潜入你的梦境，制造出可怕的噩梦(nightmare)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a nightmare about being chased by a monster.
  </text>
  <text x="50" y="310" class="content">
    她梦见被一个怪物追赶，做了个噩梦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Moon -->
    <circle cx="300" cy="50" r="20" class="image" fill="#ECF0F1" />
    <!-- Stars -->
    <circle cx="50" cy="30" r="2" class="image" fill="#ECF0F1" />
    <circle cx="100" cy="60" r="2" class="image" fill="#ECF0F1" />
    <circle cx="150" cy="40" r="2" class="image" fill="#ECF0F1" />
    <circle cx="200" cy="70" r="2" class="image" fill="#ECF0F1" />
    <circle cx="250" cy="30" r="2" class="image" fill="#ECF0F1" />
    <!-- Bed -->
    <rect x="100" y="120" width="150" height="60" class="image" fill="#D35400" />
    <!-- Person in bed -->
    <circle cx="175" cy="150" r="15" class="image" fill="#F39C12" />
    <line x1="175" y1="165" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="160" y2="210" class="image" />
    <line x1="175" y1="190" x2="190" y2="210" class="image" />
    <line x1="175" y1="175" x2="200" y2="165" class="image" />
    <!-- Nightmare demon -->
    <circle cx="50" cy="100" r="20" class="image" fill="#8E44AD" />
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="35" y2="170" class="image" />
    <line x1="50" y1="150" x2="65" y2="170" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <line x1="50" y1="130" x2="20" y2="120" class="image" />
  </g>
</svg>