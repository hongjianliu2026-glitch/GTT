<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alien</text>
  <text x="50" y="120" class="subtitle">[ˈeɪliən] n. 外星人，外国人；adj. 外国的，陌生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (其他) + ien (来自)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个外星人(alien)从遥远的星球来到地球，
    <tspan x="50" dy="25">他看起来完全不同于我们，因为他来自其他(al-)地方(ien)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie features an alien invasion.
  </text>
  <text x="50" y="310" class="content">
    这部电影讲述了一个外星人入侵的故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Alien head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="80" r="10" class="image" />
    <circle cx="125" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <line x1="75" y1="120" x2="125" y2="120" class="image" />
    <!-- Antenna -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
    <circle cx="100" cy="15" r="5" class="image" />
    <!-- Spaceship -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="20" class="image" />
    <line x1="250" y1="50" x2="200" y2="20" class="image" />
  </g>
</svg>