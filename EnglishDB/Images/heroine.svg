<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heroine</text>
  <text x="50" y="120" class="subtitle">[ˈherəʊɪn] n. 女英雄，女主角</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hero (英雄) + -ine (表示女性)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的"女英雄(heroine)"，她站在高山上，
    <tspan x="50" dy="25">手持剑和盾，保护着她的王国。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was hailed as a heroine for saving the children from the fire.
  </text>
  <text x="50" y="310" class="content">
    她因从火灾中救出孩子们而被誉为女英雄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,200 L150,0 L300,200 Z" class="image" />
    <!-- Heroine -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="120" y2="170" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
    <!-- Sword and Shield -->
    <line x1="150" y1="150" x2="150" y2="100" class="image" />
    <rect x="140" y="100" width="20" height="30" class="image" />
    <rect x="130" y="170" width="40" height="20" class="image" />
  </g>
</svg>