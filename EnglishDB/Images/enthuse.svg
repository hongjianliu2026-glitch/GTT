<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enthuse</text>
  <text x="50" y="120" class="subtitle">[ɪnˈθjuːz] v. 使充满热情，使热心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + thus (神)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"注入(en-)"了"神(thus)"的力量，
    <tspan x="50" dy="25">瞬间变得充满热情，仿佛被神灵附体一般。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His enthusiasm enthused the entire team.
  </text>
  <text x="50" y="310" class="content">
    他的热情感染了整个团队。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="30" y2="250" class="image" />
    <line x1="50" y1="200" x2="70" y2="250" class="image" />
    <!-- Lightning bolt -->
    <polyline points="10,50 50,10 90,50" class="image" />
    <polyline points="50,10 50,100" class="image" />
    <!-- Exclamation marks -->
    <text x="30" y="280" class="image" font-size="40">!</text>
    <text x="60" y="280" class="image" font-size="40">!</text>
    <text x="90" y="280" class="image" font-size="40">!</text>
  </g>
</svg>