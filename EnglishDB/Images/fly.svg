<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fly</text>
  <text x="50" y="120" class="subtitle">[flaɪ] v. 飞，飞行；n. 苍蝇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fly (飞)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在蓝天中自由"飞翔(fly)"，
    <tspan x="50" dy="25">它的翅膀轻轻拍打，仿佛在诉说着自由的故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bird flies high in the sky.
  </text>
  <text x="50" y="310" class="content">
    鸟儿在天空中高高飞翔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Bird -->
    <circle cx="50" cy="100" r="15" class="image" fill="#D3D3D3" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="130" x2="20" y2="120" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
  </g>
</svg>