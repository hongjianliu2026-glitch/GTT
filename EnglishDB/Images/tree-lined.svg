<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tree-lined</text>
  <text x="50" y="120" class="subtitle">[ˈtriːˌlaɪnd] adj. 两侧有树的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tree (树) + lined (排列的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条道路，两侧整齐排列着高大的树木，
    <tspan x="50" dy="25">这些树木就像卫士一样守护着道路，这就是tree-lined。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The street was tree-lined, providing shade on a hot day.
  </text>
  <text x="50" y="310" class="content">
    这条街道两侧有树，在炎热的日子里提供了阴凉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Road -->
    <rect x="0" y="100" width="350" height="20" class="image" />
    <!-- Trees -->
    <line x1="50" y1="0" x2="50" y2="100" class="image" />
    <line x1="100" y1="0" x2="100" y2="100" class="image" />
    <line x1="150" y1="0" x2="150" y2="100" class="image" />
    <line x1="200" y1="0" x2="200" y2="100" class="image" />
    <line x1="250" y1="0" x2="250" y2="100" class="image" />
    <line x1="300" y1="0" x2="300" y2="100" class="image" />
    <!-- Tree tops -->
    <circle cx="50" cy="0" r="20" class="image" />
    <circle cx="100" cy="0" r="20" class="image" />
    <circle cx="150" cy="0" r="20" class="image" />
    <circle cx="200" cy="0" r="20" class="image" />
    <circle cx="250" cy="0" r="20" class="image" />
    <circle cx="300" cy="0" r="20" class="image" />
  </g>
</svg>