<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .carrot { fill: #FFA500; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carrot</text>
  <text x="50" y="120" class="subtitle">[ˈkærət] n. 胡萝卜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "carota"，意为胡萝卜
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的胡萝卜，"卡罗特(carrot)"
    <tspan x="50" dy="25">从地里冒出来，顶着一片绿叶，</tspan>
    <tspan x="50" dy="25">就像一个橙色的巨人站在田野中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat carrots with hummus.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃胡萝卜配鹰嘴豆泥。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Carrot -->
    <path d="M 0 100 Q 50 50 100 100 T 200 100" class="carrot" />
    <rect x="90" y="100" width="20" height="100" class="carrot" />
    <!-- Leaves -->
    <path d="M 100 100 Q 80 50 100 0 T 120 50" class="image" />
    <path d="M 110 100 Q 90 50 110 0 T 130 50" class="image" />
  </g>
</svg>