<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commanding</text>
  <text x="50" y="120" class="subtitle">[kəˈmændɪŋ] adj. 指挥的，有权威的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (加强) + mand (命令)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位将军站在高台上，"加强命令(com-mand)"
    <tspan x="50" dy="25">的声音响彻整个战场，他的姿态和声音都充满了权威(commanding)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The commanding officer led the troops into battle.
  </text>
  <text x="50" y="310" class="content">
    指挥官带领部队投入战斗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- General -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="150" y2="130" class="image" />
    <line x1="200" y1="140" x2="250" y2="130" class="image" />
    <!-- Voice -->
    <path d="M200,120 Q250,80 300,120" class="image" />
    <path d="M200,120 Q150,80 100,120" class="image" />
  </g>
</svg>