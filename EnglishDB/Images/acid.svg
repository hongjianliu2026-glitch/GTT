<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acid</text>
  <text x="50" y="120" class="subtitle">[ˈæsɪd] n. 酸，酸性物质</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (尖锐) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个实验室里，一瓶"尖锐(ac-)"的液体，
    <tspan x="50" dy="25">它具有强烈的腐蚀性，这就是酸(acid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The acid burned a hole in the metal.
  </text>
  <text x="50" y="310" class="content">
    酸在金属上烧出了一个洞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flask -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Acid liquid -->
    <rect x="20" y="20" width="110" height="160" class="image" fill="#FF6347" />
    <!-- Corrosion effect -->
    <line x1="30" y1="50" x2="120" y2="50" class="image" />
    <line x1="30" y1="80" x2="100" y2="80" class="image" />
    <line x1="30" y1="110" x2="110" y2="110" class="image" />
    <line x1="30" y1="140" x2="90" y2="140" class="image" />
    <!-- Metal surface -->
    <rect x="180" y="100" width="150" height="50" class="image" />
    <!-- Hole in metal -->
    <circle cx="255" cy="125" r="20" class="image" fill="#C0392B" />
  </g>
</svg>