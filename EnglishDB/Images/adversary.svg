<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adversary</text>
  <text x="50" y="120" class="subtitle">[ˈædvərsəri] n. 对手，敌人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + vers (转) + -ary (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在擂台上，"朝向(ad-)"对方"转身(vers)"，
    <tspan x="50" dy="25">准备战斗，他们就是彼此的"对手(adversary)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chess player faced his adversary with confidence.
  </text>
  <text x="50" y="310" class="content">
    这位棋手自信地面对他的对手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ring -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- First fighter -->
    <circle cx="120" cy="100" r="20" class="image" />
    <line x1="120" y1="120" x2="120" y2="160" class="image" />
    <line x1="120" y1="160" x2="100" y2="190" class="image" />
    <line x1="120" y1="160" x2="140" y2="190" class="image" />
    <line x1="120" y1="140" x2="90" y2="130" class="image" />
    <!-- Second fighter -->
    <circle cx="230" cy="100" r="20" class="image" />
    <line x1="230" y1="120" x2="230" y2="160" class="image" />
    <line x1="230" y1="160" x2="210" y2="190" class="image" />
    <line x1="230" y1="160" x2="250" y2="190" class="image" />
    <line x1="230" y1="140" x2="260" y2="130" class="image" />
  </g>
</svg>