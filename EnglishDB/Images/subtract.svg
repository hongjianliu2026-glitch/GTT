<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subtract</text>
  <text x="50" y="120" class="subtitle">[səbˈtrækt] v. 减去，扣除</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + tract (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师从一堆硬币中"拉下(tract)"
    <tspan x="50" dy="25">一些硬币，这些硬币就从总数中"减去(subtract)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please subtract 5 from 10.
  </text>
  <text x="50" y="310" class="content">
    请从10中减去5。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coins -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Magician -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="280" y2="210" class="image" />
    <line x1="300" y1="180" x2="320" y2="210" class="image" />
    <line x1="300" y1="150" x2="350" y2="140" class="image" />
    <!-- Hand pulling coins -->
    <line x1="300" y1="130" x2="200" y2="80" class="image" />
    <line x1="200" y1="80" x2="180" y2="80" class="image" />
    <line x1="200" y1="80" x2="220" y2="80" class="image" />
  </g>
</svg>