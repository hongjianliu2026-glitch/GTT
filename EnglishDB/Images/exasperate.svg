<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exasperate</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzæspəreɪt] v. 激怒，使恼怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + asper (粗糙) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被粗糙的沙砾"逼出(ex-asper)"
    <tspan x="50" dy="25">愤怒的情绪，这种情绪让他变得非常恼怒(exasperate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His constant interruptions exasperated her.
  </text>
  <text x="50" y="310" class="content">
    他不断的打断让她非常恼怒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="80" y1="80" x2="120" y2="80" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <line x1="100" y1="140" x2="100" y2="150" class="image" />
    <!-- Sand -->
    <rect x="0" y="160" width="200" height="50" class="image" />
    <line x1="20" y1="180" x2="180" y2="180" class="image" />
    <line x1="20" y1="200" x2="180" y2="200" class="image" />
    <line x1="20" y1="220" x2="180" y2="220" class="image" />
  </g>
</svg>