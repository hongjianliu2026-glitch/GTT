<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">importance</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpɔːrtns] n. 重要性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + port (携带) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人带着"重要(im-port)"的东西进入会议室，
    <tspan x="50" dy="25">这个东西的重要性(importance)不言而喻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The importance of this project cannot be overstated.
  </text>
  <text x="50" y="310" class="content">
    这个项目的重要性怎么强调都不为过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person carrying a briefcase -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Briefcase -->
    <rect x="80" y="100" width="50" height="30" class="image" />
    <!-- Meeting table -->
    <rect x="150" y="50" width="150" height="100" class="image" />
    <!-- Chairs -->
    <rect x="160" y="150" width="30" height="30" class="image" />
    <rect x="220" y="150" width="30" height="30" class="image" />
    <rect x="280" y="150" width="30" height="30" class="image" />
  </g>
</svg>