<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surveillance</text>
  <text x="50" y="120" class="subtitle">[sɜːrˈveɪləns] n. 监视，监控</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (在上面) + veill (看) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的眼睛在空中"俯视(sur-veill)"
    <tspan x="50" dy="25">着一切，这就是监视(surveillance)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The security cameras provide constant surveillance.
  </text>
  <text x="50" y="310" class="content">
    监控摄像头提供持续的监视。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="image" fill="#7F8C8D" />
    <!-- Eyelid -->
    <path d="M 50 50 Q 100 20 150 50" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <!-- Ground -->
    <rect x="0" y="150" width="200" height="50" class="image" fill="#2ECC71" />
    <!-- Person -->
    <circle cx="150" cy="180" r="15" class="image" />
    <line x1="150" y1="195" x2="150" y2="230" class="image" />
    <line x1="150" y1="230" x2="130" y2="260" class="image" />
    <line x1="150" y1="230" x2="170" y2="260" class="image" />
    <line x1="150" y1="210" x2="120" y2="200" class="image" />
    <line x1="150" y1="210" x2="180" y2="200" class="image" />
  </g>
</svg>