<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inorganic</text>
  <text x="50" y="120" class="subtitle">[ˌɪnɔːrˈɡænɪk] adj. 无机的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + organ (器官) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个实验室里，"没有器官(in-organ-ic)"
    <tspan x="50" dy="25">的物质，这些物质就是无机物(inorganic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soil contains both organic and inorganic materials.
  </text>
  <text x="50" y="310" class="content">
    土壤中含有有机和无机物质。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Beaker -->
    <ellipse cx="100" cy="100" rx="50" ry="70" class="image" />
    <!-- Chemical symbols -->
    <text x="100" y="100" class="content" text-anchor="middle">H₂O</text>
    <!-- Lab equipment -->
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="200" y1="20" x2="250" y2="20" class="image" />
    <line x1="200" y1="180" x2="250" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Scientist -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="350" y2="120" class="image" />
  </g>
</svg>