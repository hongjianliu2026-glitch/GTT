<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crusade</text>
  <text x="50" y="120" class="subtitle">[kruːˈseɪd] n. 十字军东征；v. 参加十字军；投身正义运动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crus (十字) + ade (行动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群勇士，胸前佩戴着巨大的十字架，"十字行动(crus-ade)"
    <tspan x="50" dy="25">他们为了正义和信仰，踏上了东征的征程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She joined the crusade to end child labor.
  </text>
  <text x="50" y="310" class="content">
    她加入了结束童工运动的正义行动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cross -->
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <!-- Warrior -->
    <circle cx="150" cy="200" r="20" class="image" />
    <line x1="150" y1="220" x2="150" y2="280" class="image" />
    <line x1="150" y1="280" x2="120" y2="320" class="image" />
    <line x1="150" y1="280" x2="180" y2="320" class="image" />
    <line x1="150" y1="250" x2="100" y2="240" class="image" />
    <line x1="150" y1="250" x2="200" y2="240" class="image" />
    <!-- Shield -->
    <rect x="120" y="220" width="60" height="60" class="image" />
    <!-- Sword -->
    <line x1="150" y1="220" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="120" y2="150" class="image" />
  </g>
</svg>