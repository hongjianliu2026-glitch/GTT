<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clump</text>
  <text x="50" y="120" class="subtitle">[klʌmp] n. 块，丛；v. 使成块，使成群</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clum- (粘在一起) + -p (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆泥巴"粘在一起(clum-p)"，形成了一个大块(clump)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soil was full of clumps that needed to be broken apart.
  </text>
  <text x="50" y="310" class="content">
    土壤里有很多需要打碎的土块。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Clump of mud -->
    <circle cx="100" cy="100" r="50" class="image" fill="#8B4513" />
    <circle cx="150" cy="100" r="40" class="image" fill="#8B4513" />
    <circle cx="200" cy="100" r="30" class="image" fill="#8B4513" />
    <circle cx="250" cy="100" r="20" class="image" fill="#8B4513" />
    <circle cx="300" cy="100" r="10" class="image" fill="#8B4513" />
  </g>
</svg>