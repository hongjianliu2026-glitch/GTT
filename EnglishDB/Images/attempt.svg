<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">attempt</text>
  <text x="50" y="120" class="subtitle">[əˈtempt] n. 尝试，企图；v. 试图，尝试</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> at- (向) + tempt (尝试)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高墙前，"向(at-)"
    <tspan x="50" dy="25">高墙"尝试(tempt)"攀爬，这就是一次尝试(attempt)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made an attempt to climb the mountain.
  </text>
  <text x="50" y="310" class="content">
    他试图攀登那座山。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Climber -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="30" y2="220" class="image" />
    <line x1="50" y1="190" x2="70" y2="220" class="image" />
    <line x1="50" y1="175" x2="80" y2="165" class="image" />
    <!-- Handholds -->
    <circle cx="100" cy="120" r="5" class="image" />
    <circle cx="150" cy="90" r="5" class="image" />
    <circle cx="200" cy="60" r="5" class="image" />
    <circle cx="250" cy="30" r="5" class="image" />
  </g>
</svg>