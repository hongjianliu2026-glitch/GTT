<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .dragon { fill: #FFD700; stroke: #8B4513; stroke-width: 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dragon</text>
  <text x="50" y="120" class="subtitle">[ˈdræɡən] n. 龙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> draco (拉丁语，龙)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的龙，"喷火(draco)"
    <tspan x="50" dy="25">在天空中翱翔，它的身影让人心生敬畏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dragon in the story breathed fire and protected the treasure.
  </text>
  <text x="50" y="310" class="content">
    故事中的龙喷火并守护着宝藏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dragon body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="dragon" />
    <!-- Dragon head -->
    <circle cx="250" cy="100" r="30" class="dragon" />
    <!-- Dragon wings -->
    <path d="M 50 100 Q 100 50 150 100 T 250 100" class="dragon" />
    <path d="M 50 100 Q 100 150 150 100 T 250 100" class="dragon" />
    <!-- Dragon tail -->
    <path d="M 50 100 Q 0 150 50 200" class="dragon" />
    <!-- Dragon fire -->
    <path d="M 280 100 Q 300 50 320 100" class="dragon" fill="#FF4500" />
    <path d="M 280 100 Q 300 150 320 100" class="dragon" fill="#FF4500" />
  </g>
</svg>