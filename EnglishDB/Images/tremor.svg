<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tremor</text>
  <text x="50" y="120" class="subtitle">[ˈtrɛmər] n. 震颤，颤抖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trem (颤抖) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为害怕而全身"颤抖(trem)"，
    <tspan x="50" dy="25">这种颤抖的感觉就是tremor。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The earthquake caused a tremor that was felt across the city.
  </text>
  <text x="50" y="310" class="content">
    地震引发了一场震颤，整个城市都能感受到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="20" y2="130" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Trembling effect -->
    <line x1="50" y1="120" x2="45" y2="115" class="image" />
    <line x1="50" y1="120" x2="55" y2="115" class="image" />
    <line x1="50" y1="160" x2="45" y2="155" class="image" />
    <line x1="50" y1="160" x2="55" y2="155" class="image" />
    <line x1="50" y1="140" x2="45" y2="135" class="image" />
    <line x1="50" y1="140" x2="55" y2="135" class="image" />
  </g>
</svg>