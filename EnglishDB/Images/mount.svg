<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mount</text>
  <text x="50" y="120" class="subtitle">[maʊnt] v. 登上，安装；n. 山</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mount (源自拉丁语 "mont-, moun-"，意为山)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人正在"登上(mount)"一座高山，
    <tspan x="50" dy="25">他的目标是征服这座山峰，就像安装(mount)一个设备一样，</tspan>
    <tspan x="50" dy="25">他需要一步步地攀登。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He mounted the bicycle and rode away.
  </text>
  <text x="50" y="310" class="content">
    他骑上自行车，骑走了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Person climbing -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="190" class="image" />
    <line x1="150" y1="190" x2="130" y2="220" class="image" />
    <line x1="150" y1="190" x2="170" y2="220" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
  </g>
</svg>