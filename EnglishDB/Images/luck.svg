<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">luck</text>
  <text x="50" y="120" class="subtitle">[lʌk] n. 运气，好运</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> luck (源自中古英语，意为“好运”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幸运的人，"突然间(luck)"
    <tspan x="50" dy="25">捡到了一枚闪闪发光的金币，这就是他的好运(luck)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had the luck to find a rare book at the flea market.
  </text>
  <text x="50" y="310" class="content">
    她在跳蚤市场上幸运地找到了一本稀有书籍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Coin -->
    <circle cx="150" cy="100" r="15" class="image" fill="#FFD700" />
    <text x="145" y="105" class="content" fill="#000">💰</text>
  </g>
</svg>