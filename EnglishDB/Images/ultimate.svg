<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ultimate</text>
  <text x="50" y="120" class="subtitle">[ˈʌltɪmət] adj. 最终的，极限的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ultim (最后的) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个登山者在攀登一座"最后的(ultim)"
    <tspan x="50" dy="25">山峰，到达顶峰时，他感受到了极限(ultimate)的成就感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Winning the championship was the ultimate goal of the team.
  </text>
  <text x="50" y="310" class="content">
    赢得冠军是这个团队的最终目标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Climber -->
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="140" y2="180" class="image" />
    <line x1="150" y1="150" x2="160" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Flag at the top -->
    <line x1="150" y1="20" x2="150" y2="0" class="image" />
    <rect x="140" y="0" width="20" height="10" class="image" />
  </g>
</svg>