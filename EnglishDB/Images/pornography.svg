<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pornography</text>
  <text x="50" y="120" class="subtitle">[pɔːrˈnɒɡrəfi] n. 色情作品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> porne (妓女) + graph (写) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的妓女(porne)在纸上"写下(graph)"
    <tspan x="50" dy="25">她的故事，这些故事后来变成了色情作品(pornography)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The film was criticized for its pornographic content.
  </text>
  <text x="50" y="310" class="content">
    这部电影因其色情内容而受到批评。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Woman -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Pen -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="140" y2="90" class="image" />
    <line x1="150" y1="100" x2="140" y2="110" class="image" />
    <!-- Text on paper -->
    <text x="180" y="120" class="content" fill="#000">PORNE</text>
    <text x="180" y="150" class="content" fill="#000">GRAPH</text>
  </g>
</svg>