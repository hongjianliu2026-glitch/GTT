<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">silt</text>
  <text x="50" y="120" class="subtitle">[sɪlt] n. 淤泥，泥沙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> silt (源自中古英语，意为“淤泥”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，水流缓慢，河底积满了细腻的淤泥(silt)，
    <tspan x="50" dy="25">这些淤泥随着水流轻轻晃动，仿佛在诉说着河流的故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The riverbed was covered with silt after the flood.
  </text>
  <text x="50" y="310" class="content">
    洪水过后，河床上覆盖着淤泥。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Riverbed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Silt -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#D7DBDD" />
    <!-- Water lines -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- River -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#AED6F1" />
  </g>
</svg>