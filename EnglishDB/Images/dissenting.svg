<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dissenting</text>
  <text x="50" y="120" class="subtitle">[dɪˈsentɪŋ] adj. 持异议的，不同意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + sent (感觉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在讨论，其中一个人"感觉不同(dis-sent)"，
    <tspan x="50" dy="25">他站起来大声表达自己的异议(dissenting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge wrote a dissenting opinion in the case.
  </text>
  <text x="50" y="310" class="content">
    法官在案件中写了一份持异议的意见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Dissenting person -->
    <circle cx="350" cy="100" r="20" class="image" />
    <line x1="350" y1="120" x2="350" y2="180" class="image" />
    <line x1="350" y1="180" x2="330" y2="210" class="image" />
    <line x1="350" y1="180" x2="370" y2="210" class="image" />
    <line x1="350" y1="150" x2="390" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M390,140 Q450,120 450,180 Q450,240 390,220 Z" class="image" />
    <text x="400" y="190" class="content" text-anchor="middle">异议</text>
  </g>
</svg>