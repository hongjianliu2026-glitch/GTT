<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">watering</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːtərɪŋ] v. 浇水，灌溉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> water (水) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个园丁正在花园里，"用水(water)"
    <tspan x="50" dy="25">浇灌(watering)花草，让它们茁壮成长。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spends her mornings watering the plants in her garden.
  </text>
  <text x="50" y="310" class="content">
    她每天早上都在花园里给植物浇水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flower pot -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <!-- Flower -->
    <circle cx="100" cy="70" r="20" class="image" />
    <line x1="100" y1="90" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="150" class="image" />
    <!-- Watering can -->
    <rect x="200" y="20" width="100" height="100" class="image" />
    <line x1="250" y1="20" x2="250" y2="0" class="image" />
    <line x1="250" y1="20" x2="270" y2="40" class="image" />
    <line x1="250" y1="20" x2="230" y2="40" class="image" />
    <!-- Water drops -->
    <circle cx="250" cy="100" r="5" class="image" />
    <circle cx="260" cy="110" r="5" class="image" />
    <circle cx="240" cy="110" r="5" class="image" />
  </g>
</svg>