<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">high-tech</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪ ˈtɛk] adj. 高科技的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + tech (技术)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机器人，"高高在上(high)"，
    <tspan x="50" dy="25">操控着最先进的技术(tech)，这就是高科技(high-tech)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company specializes in high-tech solutions.
  </text>
  <text x="50" y="310" class="content">
    这家公司专门从事高科技解决方案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="50" r="40" class="image" /> <!-- Head -->
    <rect x="135" y="90" width="80" height="100" class="image" /> <!-- Body -->
    <line x1="135" y1="110" x2="50" y2="50" class="image" /> <!-- Left arm -->
    <line x1="215" y1="110" x2="290" y2="50" class="image" /> <!-- Right arm -->
    <line x1="155" y1="190" x2="155" y2="250" class="image" /> <!-- Left leg -->
    <line x1="195" y1="190" x2="195" y2="250" class="image" /> <!-- Right leg -->
    <!-- High-tech elements -->
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <line x1="100" y1="160" x2="250" y2="160" class="image" />
    <line x1="100" y1="170" x2="250" y2="170" class="image" />
  </g>
</svg>