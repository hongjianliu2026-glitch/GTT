<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">severity</text>
  <text x="50" y="120" class="subtitle">[sɪˈvɛrɪti] n. 严重性，严肃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sever (切断) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把巨大的刀"切断(sever)"了一棵树，
    <tspan x="50" dy="25">树倒下的瞬间，展现出事件的"严重性(severity)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The severity of the storm caused widespread damage.
  </text>
  <text x="50" y="310" class="content">
    风暴的严重性造成了广泛的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Broken tree -->
    <line x1="50" y1="200" x2="50" y2="300" class="image" />
    <line x1="50" y1="300" x2="0" y2="350" class="image" />
    <line x1="50" y1="300" x2="100" y2="350" class="image" />
    <!-- Knife -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="200" y2="50" class="image" />
    <line x1="250" y1="100" x2="200" y2="150" class="image" />
  </g>
</svg>