<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">effective</text>
  <text x="50" y="120" class="subtitle">[ɪˈfektɪv] adj. 有效的，生效的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ef- (出) + fect (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔法师挥动魔杖，"做出(fect)"
    <tspan x="50" dy="25">魔法效果(ef-fect)，让一切变得有效(effective)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy has been effective in reducing crime.
  </text>
  <text x="50" y="310" class="content">
    新政策在减少犯罪方面是有效的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic wand -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <circle cx="50" cy="20" r="10" class="image" />
    <!-- Magic effect -->
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <circle cx="350" cy="100" r="30" class="image" />
    <!-- Magic words -->
    <text x="150" y="150" class="content" fill="#E74C3C">Ef-fect</text>
  </g>
</svg>