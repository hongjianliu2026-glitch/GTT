<svg xmlns="http://www.w33org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">youthful</text>
  <text x="50" y="120" class="subtitle">[ˈjuːθfəl] adj. 年轻的，有青春活力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> youth (年轻) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满活力的年轻人，"充满(ful)"
    <tspan x="50" dy="25">青春(youth)的气息，展现出青春(youthful)的活力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a youthful appearance despite her age.
  </text>
  <text x="50" y="310" class="content">
    尽管年纪不小，她看起来依然很年轻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Youthful person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="20" class="image" fill="#F1C40F" />
    <line x1="150" y1="30" x2="150" y2="10" class="image" />
    <line x1="150" y1="70" x2="150" y2="90" class="image" />
    <line x1="130" y1="50" x2="110" y2="50" class="image" />
    <line x1="170" y1="50" x2="190" y2="50" class="image" />
    <line x1="140" y1="40" x2="120" y2="30" class="image" />
    <line x1="160" y1="40" x2="180" y2="30" class="image" />
    <line x1="140" y1="60" x2="120" y2="70" class="image" />
    <line x1="160" y1="60" x2="180" y2="70" class="image" />
  </g>
</svg>