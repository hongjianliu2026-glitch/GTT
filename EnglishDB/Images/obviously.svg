<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obviously</text>
  <text x="50" y="120" class="subtitle">[ˈɒbviəsli] adv. 明显地，显然地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (朝向) + vi (道路) + -ous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一条宽阔的道路(vi)上，
    <tspan x="50" dy="25">朝向(ob-)一个巨大的箭头，箭头指向的方向</tspan>
    <tspan x="50" dy="25">非常明显(obvious)，让人一眼就能看到。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was obviously a mistake to trust him.
  </text>
  <text x="50" y="310" class="content">
    显然信任他是个错误。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Road -->
    <line x1="0" y1="100" x2="400" y2="100" class="image" />
    <!-- Arrow -->
    <polygon points="350,80 350,120 400,100" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>