<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defunct</text>
  <text x="50" y="120" class="subtitle">[dɪˈfʌŋkt] adj. 已废止的，不再使用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + funct (执行)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的机器，"离开执行(de-funct)"
    <tspan x="50" dy="25">状态，静静地躺在角落，不再工作，象征着已废止的事物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The defunct company's building now stands empty.
  </text>
  <text x="50" y="310" class="content">
    那家已废止的公司的建筑现在空无一人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Broken parts -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Dust -->
    <circle cx="20" cy="100" r="15" class="image" />
    <circle cx="50" cy="120" r="10" class="image" />
    <circle cx="80" cy="140" r="12" class="image" />
    <circle cx="110" cy="160" r="8" class="image" />
  </g>
</svg>