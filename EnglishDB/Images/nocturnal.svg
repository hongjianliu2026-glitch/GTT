<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nocturnal</text>
  <text x="50" y="120" class="subtitle">[nɒkˈtɜːrnl] adj. 夜间的，夜间活动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> noct- (夜) + -urnal (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫头鹰在夜晚的森林中，"夜(noct-)"
    <tspan x="50" dy="25">间活动(urnal)，它就是典型的夜间生物(nocturnal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Owls are nocturnal creatures that hunt at night.
  </text>
  <text x="50" y="310" class="content">
    猫头鹰是夜间活动的生物，它们在夜间捕猎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Moon -->
    <circle cx="150" cy="100" r="50" fill="#F1C40F" />
    <!-- Forest -->
    <rect x="0" y="150" width="300" height="100" fill="#2ECC71" />
    <!-- Owl -->
    <circle cx="150" cy="120" r="20" fill="#7F8C8D" />
    <line x1="150" y1="140" x2="150" y2="180" class="image" />
    <line x1="150" y1="160" x2="130" y2="150" class="image" />
    <line x1="150" y1="160" x2="170" y2="150" class="image" />
    <line x1="150" y1="180" x2="130" y2="200" class="image" />
    <line x1="150" y1="180" x2="170" y2="200" class="image" />
  </g>
</svg>