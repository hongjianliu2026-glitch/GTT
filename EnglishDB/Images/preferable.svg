<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preferable</text>
  <text x="50" y="120" class="subtitle">[ˈprefrəbl] adj. 更好的，更可取的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + fer (拿，带来) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在选择，其中一个人"提前拿(pre-fer)"
    <tspan x="50" dy="25">到了更好的东西，这个选择显然更可取(preferable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A quiet environment is preferable for studying.
  </text>
  <text x="50" y="310" class="content">
    安静的环境更适合学习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Better choice -->
    <rect x="50" y="130" width="40" height="40" class="image" />
    <rect x="200" y="130" width="40" height="40" class="image" />
    <line x1="70" y1="150" x2="180" y2="150" class="image" />
    <line x1="70" y1="170" x2="180" y2="170" class="image" />
    <line x1="70" y1="190" x2="180" y2="190" class="image" />
    <!-- Arrow pointing to better choice -->
    <line x1="120" y1="200" x2="120" y2="250" class="image" />
    <polygon points="115,250 125,250 120,260" class="image" />
  </g>
</svg>