<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inspired</text>
  <text x="50" y="120" class="subtitle">[ɪnˈspaɪərd] adj. 受启发的，有灵感的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + spir (呼吸) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人深吸一口气，"吸入(in-spir)"
    <tspan x="50" dy="25">灵感，瞬间变得充满创意和活力，这就是"受启发的(inspired)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist's work was inspired by nature.
  </text>
  <text x="50" y="310" class="content">
    这位艺术家的作品受到了自然的启发。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person taking a deep breath -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="130" x2="20" y2="160" class="image" />
    <line x1="50" y1="130" x2="80" y2="160" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />
    <!-- Inspiration light bulb -->
    <circle cx="200" cy="100" r="40" class="image" />
    <line x1="200" y1="140" x2="200" y2="200" class="image" />
    <line x1="200" y1="140" x2="180" y2="160" class="image" />
    <line x1="200" y1="140" x2="220" y2="160" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <!-- Connection between person and inspiration -->
    <line x1="80" y1="100" x2="170" y2="100" class="image" />
  </g>
</svg>