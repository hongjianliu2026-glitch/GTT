<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tasting</text>
  <text x="50" y="120" class="subtitle">[ˈteɪstɪŋ] n. 品尝，试味</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> taste (味道) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在品尝美食，"尝(taste)"
    <tspan x="50" dy="25">到美味的食物，脸上露出满足的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef invited us to a tasting of his new dishes.
  </text>
  <text x="50" y="310" class="content">
    厨师邀请我们品尝他的新菜肴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="30" class="image" />
    <rect x="150" y="70" width="50" height="60" class="image" />
    <rect x="220" y="80" width="40" height="50" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Smiley face -->
    <circle cx="50" cy="140" r="5" class="image" />
    <circle cx="60" cy="140" r="5" class="image" />
    <path d="M45 155 Q50 160 55 155" class="image" />
  </g>
</svg>