<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drench</text>
  <text x="50" y="120" class="subtitle">[drɛntʃ] v. 使湿透，浸透</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drench (源自中古英语 drench, 意为“淹没”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被倾盆大雨“淹没(drench)”，
    <tspan x="50" dy="25">从头到脚都湿透了，就像被水淹没一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sudden downpour drenched us to the skin.
  </text>
  <text x="50" y="310" class="content">
    突如其来的大雨把我们淋得浑身湿透。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Raindrops -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="90" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
    <!-- Person -->
    <circle cx="200" cy="200" r="30" class="image" />
    <line x1="200" y1="230" x2="200" y2="300" class="image" />
    <line x1="200" y1="300" x2="170" y2="350" class="image" />
    <line x1="200" y1="300" x2="230" y2="350" class="image" />
    <line x1="200" y1="250" x2="150" y2="240" class="image" />
    <line x1="200" y1="250" x2="250" y2="240" class="image" />
    <!-- Water splashes -->
    <circle cx="180" cy="360" r="15" class="image" />
    <circle cx="220" cy="360" r="15" class="image" />
  </g>
</svg>