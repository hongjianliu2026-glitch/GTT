<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">troublemaker</text>
  <text x="50" y="120" class="subtitle">[ˈtrʌblmeɪkər] n. 惹麻烦的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trouble (麻烦) + maker (制造者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调皮的小孩，总是"制造麻烦(trouble-maker)"，
    <tspan x="50" dy="25">把家里弄得一团糟，他就是那个惹麻烦的人(troublemaker)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher had to deal with the troublemaker in the class.
  </text>
  <text x="50" y="310" class="content">
    老师不得不处理班上的那个惹麻烦的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kid -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Mess -->
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="100" y1="120" x2="150" y2="170" class="image" />
    <line x1="100" y1="140" x2="150" y2="190" class="image" />
    <line x1="100" y1="160" x2="150" y2="210" class="image" />
    <!-- Speech bubble -->
    <path d="M 10 50 Q 50 20 100 50 T 150 50" class="image" />
    <text x="20" y="55" class="content">"Oops!"</text>
  </g>
</svg>