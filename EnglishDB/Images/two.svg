<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">two</text>
  <text x="50" y="120" class="subtitle">[tuː] num. 二</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tw- (表示“二”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，两只小鸟在树枝上"成双成对(tw-o)"，
    <tspan x="50" dy="25">它们互相依偎，形成了一个温馨的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has two cats at home.
  </text>
  <text x="50" y="310" class="content">
    她家里有两只猫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Two birds -->
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Birds' beaks -->
    <line x1="80" y1="50" x2="100" y2="30" class="image" />
    <line x1="230" y1="50" x2="250" y2="30" class="image" />
    <!-- Birds' wings -->
    <line x1="100" y1="70" x2="130" y2="50" class="image" />
    <line x1="250" y1="70" x2="280" y2="50" class="image" />
  </g>
</svg>