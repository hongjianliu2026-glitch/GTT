<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sheath</text>
  <text x="50" y="120" class="subtitle">[ʃiːθ] n. 鞘，套</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sheat (来自古英语 scēat, 意为“覆盖物”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把剑被“覆盖(sheat)”在一个保护套里，
    <tspan x="50" dy="25">这个保护套就是剑鞘(sheath)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sword was placed back into its sheath.
  </text>
  <text x="50" y="310" class="content">
    剑被放回了它的剑鞘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sheath -->
    <rect x="50" y="20" width="100" height="200" class="image" />
    <!-- Sword -->
    <line x1="100" y1="20" x2="100" y2="220" class="image" />
    <line x1="75" y1="20" x2="125" y2="20" class="image" />
    <line x1="75" y1="220" x2="125" y2="220" class="image" />
    <!-- Handle -->
    <rect x="75" y="220" width="50" height="30" class="image" />
  </g>
</svg>