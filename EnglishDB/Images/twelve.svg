<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twelve</text>
  <text x="50" y="120" class="subtitle">[twɛlv] n. 十二</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twen (二) + two (二)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的钟表，"两个二(twen-two)"
    <tspan x="50" dy="25">组合在一起，形成了十二(twelve)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are twelve months in a year.
  </text>
  <text x="50" y="310" class="content">
    一年有十二个月。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="245" y2="100" class="image" />
    <!-- Numbers -->
    <text x="175" y="30" text-anchor="middle" class="content">12</text>
    <text x="245" y="105" text-anchor="middle" class="content">3</text>
    <text x="175" y="180" text-anchor="middle" class="content">6</text>
    <text x="105" y="105" text-anchor="middle" class="content">9</text>
  </g>
</svg>