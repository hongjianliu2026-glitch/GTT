<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contradictory</text>
  <text x="50" y="120" class="subtitle">[ˌkɒntrəˈdɪktəri] adj. 矛盾的，对立的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> contra- (相反) + dict (说) + -ory (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，一个人说"是"，另一个人立刻说"不"，
    <tspan x="50" dy="25">他们的说法完全相反，这就是矛盾的(contradictory)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Their statements were contradictory, making it hard to understand the truth.
  </text>
  <text x="50" y="310" class="content">
    他们的陈述相互矛盾，让人难以理解真相。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Arrows pointing opposite directions -->
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <line x1="230" y1="100" x2="210" y2="80" class="image" />
    <line x1="230" y1="100" x2="210" y2="120" class="image" />
    <line x1="70" y1="100" x2="90" y2="80" class="image" />
    <line x1="70" y1="100" x2="90" y2="120" class="image" />
    <!-- Speech bubbles -->
    <rect x="20" y="50" width="60" height="30" class="image" />
    <rect x="220" y="50" width="60" height="30" class="image" />
    <!-- Text in speech bubbles -->
    <text x="35" y="70" class="content">Yes</text>
    <text x="235" y="70" class="content">No</text>
  </g>
</svg>