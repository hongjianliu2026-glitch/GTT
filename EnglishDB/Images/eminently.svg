<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eminently</text>
  <text x="50" y="120" class="subtitle">[ˈɛmɪnəntli] adv. 显著地，突出地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + min (突出) + -ent (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头从人群中"突出(emin-)"，
    <tspan x="50" dy="25">指向一个"显著(ent)"的人物，这个人物"显著地(eminently)"引人注目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was eminently qualified for the job.
  </text>
  <text x="50" y="310" class="content">
    她非常胜任这份工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow pointing up -->
    <line x1="175" y1="200" x2="175" y2="50" class="image" />
    <polygon points="175,50 160,70 190,70" class="image" />
    <!-- Person -->
    <circle cx="175" cy="200" r="20" class="image" />
    <line x1="175" y1="220" x2="175" y2="260" class="image" />
    <line x1="175" y1="260" x2="155" y2="300" class="image" />
    <line x1="175" y1="260" x2="195" y2="300" class="image" />
    <line x1="175" y1="240" x2="145" y2="230" class="image" />
    <line x1="175" y1="240" x2="205" y2="230" class="image" />
  </g>
</svg>