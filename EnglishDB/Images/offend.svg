<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">offend</text>
  <text x="50" y="120" class="subtitle">[əˈfend] v. 冒犯，得罪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> of- (离开) + fend (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人不小心"离开(of-)"了安全区域，"打击(fend)"了别人，
    <tspan x="50" dy="25">结果冒犯(offend)了对方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His rude comment offended many people.
  </text>
  <text x="50" y="310" class="content">
    他粗鲁的评论冒犯了许多人的感情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />

    <!-- Offended person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />

    <!-- Arrow -->
    <line x1="80" y1="110" x2="170" y2="110" class="image" />
    <polygon points="170,110 160,105 160,115" class="image" />

    <!-- Speech bubble -->
    <path d="M220,80 Q250,80 250,100 Q250,120 220,120 Q200,120 200,100 Q200,80 220,80" class="image" />
    <text x="225" y="105" class="content" text-anchor="middle">Ouch!</text>
  </g>
</svg>