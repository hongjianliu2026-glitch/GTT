<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scented</text>
  <text x="50" y="120" class="subtitle">[ˈsentɪd] adj. 有香味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scent (香味) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个花园里，"香味(scent)"
    <tspan x="50" dy="25">弥漫在空气中，整个花园都变得"有香味的(scented)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was filled with scented candles.
  </text>
  <text x="50" y="310" class="content">
    房间里充满了香薰蜡烛的香味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flower -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Scent -->
    <line x1="50" y1="130" x2="30" y2="180" class="image" />
    <line x1="100" y1="130" x2="80" y2="180" class="image" />
    <line x1="150" y1="130" x2="130" y2="180" class="image" />
    <line x1="200" y1="130" x2="180" y2="180" class="image" />
  </g>
</svg>