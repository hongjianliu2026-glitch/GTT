<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tainted</text>
  <text x="50" y="120" class="subtitle">[ˈteɪntɪd] adj. 被污染的，被玷污的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tain (握住) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块原本纯净的布料，"被握住(tain)"
    <tspan x="50" dy="25">并染上了污渍，变得不再纯净，这就是被玷污(tainted)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The water was tainted with chemicals from the factory.
  </text>
  <text x="50" y="310" class="content">
    水被工厂的化学物质污染了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloth -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stain -->
    <circle cx="100" cy="100" r="50" fill="#800000" />
    <circle cx="200" cy="150" r="40" fill="#800000" />
    <circle cx="280" cy="80" r="30" fill="#800000" />
    <!-- Hand -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="180" x2="30" y2="170" class="image" />
    <line x1="50" y1="180" x2="70" y2="170" class="image" />
    <line x1="50" y1="200" x2="30" y2="220" class="image" />
    <line x1="50" y1="200" x2="70" y2="220" class="image" />
  </g>
</svg>