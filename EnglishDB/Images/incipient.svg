<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incipient</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsɪpiənt] adj. 初期的，开始的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + -cip (拿) + -ient (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个种子刚刚"进入(in-)"土壤，"拿(cip)"住生长的机会，
    <tspan x="50" dy="25">这就是初期的(incipient)状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The incipient stages of the project were the most challenging.
  </text>
  <text x="50" y="310" class="content">
    项目的初期阶段是最具挑战性的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soil -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Seed -->
    <circle cx="175" cy="100" r="15" class="image" />
    <!-- Sprout -->
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="130" x2="160" y2="120" class="image" />
    <line x1="175" y1="130" x2="190" y2="120" class="image" />
  </g>
</svg>