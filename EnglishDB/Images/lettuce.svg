<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lettuce { fill: #7FCE4B; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lettuce</text>
  <text x="50" y="120" class="subtitle">[ˈlɛtɪs] n. 生菜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> let (允许) + tuce (触摸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片生菜田，"允许(let)"
    <tspan x="50" dy="25">你触摸(tuce)那片绿油油的叶子，</tspan>
    <tspan x="50" dy="25">这就是生菜(lettuce)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added some lettuce to her salad.
  </text>
  <text x="50" y="310" class="content">
    她在沙拉里加了一些生菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lettuce leaves -->
    <path d="M0 0 C50 50, 100 50, 150 0" class="lettuce" />
    <path d="M0 20 C50 70, 100 70, 150 20" class="lettuce" />
    <path d="M0 40 C50 90, 100 90, 150 40" class="lettuce" />
    <path d="M0 60 C50 110, 100 110, 150 60" class="lettuce" />
    <path d="M0 80 C50 130, 100 130, 150 80" class="lettuce" />
    <path d="M0 100 C50 150, 100 150, 150 100" class="lettuce" />
  </g>
</svg>