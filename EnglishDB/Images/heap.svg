<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heap</text>
  <text x="50" y="120" class="subtitle">[hiːp] n. 堆，大量；v. 堆积</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hea- (堆)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"堆(hea-p)"，里面堆满了各种东西，
    <tspan x="50" dy="25">从书本到玩具，甚至还有金币，形成了一个夸张的堆。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a heap of old books in the attic.
  </text>
  <text x="50" y="310" class="content">
    她在阁楼里发现了一大堆旧书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Base of the heap -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="50" height="70" class="image" />
    <rect x="110" y="20" width="50" height="70" class="image" />
    <rect x="170" y="20" width="50" height="70" class="image" />
    <!-- Toys -->
    <circle cx="250" cy="55" r="20" class="image" />
    <rect x="230" y="80" width="40" height="40" class="image" />
    <!-- Gold coins -->
    <circle cx="300" cy="55" r="15" class="image" />
    <circle cx="320" cy="55" r="15" class="image" />
    <circle cx="340" cy="55" r="15" class="image" />
  </g>
</svg>