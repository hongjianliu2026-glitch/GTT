<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adequately</text>
  <text x="50" y="120" class="subtitle">[ˈædɪkwətli] adv. 足够地，适当地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (加强) + equ (平等) + -ate (使) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在天平上，天平两端"平等(equ)"，
    <tspan x="50" dy="25">表示他"足够地(adequately)"平衡，一切都恰到好处。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prepared adequately for the exam.
  </text>
  <text x="50" y="310" class="content">
    她为考试做了充分的准备。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="100" y1="50" x2="300" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
    <line x1="100" y1="150" x2="300" y2="150" class="image" />
    <!-- Person on the scale -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>