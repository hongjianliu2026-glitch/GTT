<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spatial</text>
  <text x="50" y="120" class="subtitle">[ˈspeɪʃl] adj. 空间的，与空间有关的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spat (空间) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宇宙，"空间(spat)"中充满了星星和行星，
    <tspan x="50" dy="25">这些星星和行星的分布就是"空间的(spatial)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spatial arrangement of the furniture made the room feel spacious.
  </text>
  <text x="50" y="310" class="content">
    家具的空间布局使房间显得宽敞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Space background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="100" cy="30" r="5" class="image" />
    <circle cx="150" cy="70" r="5" class="image" />
    <circle cx="200" cy="40" r="5" class="image" />
    <circle cx="250" cy="60" r="5" class="image" />
    <circle cx="300" cy="20" r="5" class="image" />
    <!-- Planets -->
    <circle cx="70" cy="100" r="15" class="image" />
    <circle cx="180" cy="120" r="20" class="image" />
    <circle cx="280" cy="90" r="10" class="image" />
  </g>
</svg>