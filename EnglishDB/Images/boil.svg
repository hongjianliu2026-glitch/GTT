<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boil</text>
  <text x="50" y="120" class="subtitle">[bɔɪl] v. 煮沸，沸腾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boi- (沸腾) + -l (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一锅水在火上，"沸腾(boi-l)"
    <tspan x="50" dy="25">冒出大量气泡，水开始剧烈翻滚。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She boiled the water before making tea.
  </text>
  <text x="50" y="310" class="content">
    她在泡茶前先把水煮沸了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Bubbles -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="70" r="15" class="image" />
    <circle cx="200" cy="90" r="12" class="image" />
    <circle cx="250" cy="110" r="14" class="image" />
    <!-- Fire -->
    <line x1="50" y1="180" x2="70" y2="160" class="image" />
    <line x1="70" y1="160" x2="90" y2="180" class="image" />
    <line x1="90" y1="180" x2="110" y2="160" class="image" />
    <line x1="110" y1="160" x2="130" y2="180" class="image" />
    <line x1="130" y1="180" x2="150" y2="160" class="image" />
  </g>
</svg>