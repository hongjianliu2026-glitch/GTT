<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sprig</text>
  <text x="50" y="120" class="subtitle">[sprɪɡ] n. 小枝，嫩枝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sprig (小枝)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树上，"小枝(sprig)"
    <tspan x="50" dy="25">从主干上延伸出来，就像树的手指一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She picked a sprig of lavender from the garden.
  </text>
  <text x="50" y="310" class="content">
    她从花园里摘了一小枝薰衣草。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="150" y="0" width="20" height="200" class="image" />
    <!-- Sprig -->
    <line x1="160" y1="50" x2="200" y2="100" class="image" />
    <line x1="160" y1="70" x2="220" y2="120" class="image" />
    <line x1="160" y1="90" x2="240" y2="140" class="image" />
    <!-- Leaves -->
    <circle cx="200" cy="100" r="10" class="leaf" />
    <circle cx="220" cy="120" r="10" class="leaf" />
    <circle cx="240" cy="140" r="10" class="leaf" />
  </g>
</svg>