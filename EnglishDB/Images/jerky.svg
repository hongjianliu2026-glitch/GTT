<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jerky</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɜːrki] adj. 急动的，不平稳的；n. 肉干</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jerk (急拉) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆老旧的汽车在崎岖的山路上行驶，"急拉(jerk)"
    <tspan x="50" dy="25">着前进，车身颠簸得像是在跳动，这就是jerky的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old car moved in a jerky manner down the hill.
  </text>
  <text x="50" y="310" class="content">
    那辆旧车在下山时以一种急动的方式行驶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
    <!-- Car -->
    <rect x="150" y="150" width="50" height="30" class="image" />
    <circle cx="160" cy="185" r="5" class="image" />
    <circle cx="200" cy="185" r="5" class="image" />
    <!-- Jerky movement -->
    <line x1="175" y1="150" x2="175" y2="140" class="image" />
    <line x1="175" y1="140" x2="185" y2="130" class="image" />
    <line x1="185" y1="130" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="165" y2="130" class="image" />
    <line x1="165" y1="130" x2="175" y2="140" class="image" />
  </g>
</svg>