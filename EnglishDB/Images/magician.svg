<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">magician</text>
  <text x="50" y="120" class="subtitle">[məˈdʒɪʃn] n. 魔术师，巫师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mag (魔法) + -ician (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着斗篷的魔术师，手持魔杖，"施展魔法(mag)"
    <tspan x="50" dy="25">变出一只兔子，他就是那个"魔法之人(magician)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician amazed the audience with his tricks.
  </text>
  <text x="50" y="310" class="content">
    魔术师用他的魔术让观众惊叹不已。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
    <rect x="30" y="70" width="40" height="30" class="image" /> <!-- Hat -->
    <line x1="50" y1="150" x2="50" y2="120" class="image" /> <!-- Wand -->
    <circle cx="50" cy="120" r="5" class="image" /> <!-- Wand tip -->
    <circle cx="100" cy="100" r="15" class="image" /> <!-- Rabbit -->
  </g>
</svg>