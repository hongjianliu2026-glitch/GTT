<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rise</text>
  <text x="50" y="120" class="subtitle">[raɪz] v. 上升，升起；n. 增加，上升</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ris (上升)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个太阳从地平线"上升(rise)"，
    <tspan x="50" dy="25">照亮了整个世界，象征着新的开始和希望。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sun rises in the east.
  </text>
  <text x="50" y="310" class="content">
    太阳从东方升起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Horizon line -->
    <line x1="0" y1="150" x2="400" y2="150" class="image" />
    <!-- Sun -->
    <circle cx="50" cy="100" r="30" class="image" fill="#F1C40F" />
    <!-- Rays of the sun -->
    <line x1="50" y1="70" x2="50" y2="20" class="image" />
    <line x1="70" y1="80" x2="100" y2="50" class="image" />
    <line x1="80" y1="100" x2="110" y2="100" class="image" />
    <line x1="70" y1="120" x2="100" y2="150" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="30" y1="120" x2="0" y2="150" class="image" />
    <line x1="20" y1="100" x2="0" y2="100" class="image" />
    <line x1="30" y1="80" x2="0" y2="50" class="image" />
  </g>
</svg>