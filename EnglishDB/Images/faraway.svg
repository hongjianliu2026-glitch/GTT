<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">faraway</text>
  <text x="50" y="120" class="subtitle">[ˈfɑːrəweɪ] adj. 遥远的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> far (远) + away (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地球的一端，望着遥远的(faraway)
    <tspan x="50" dy="25">另一端，仿佛在寻找什么遥不可及的东西。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stars in the faraway galaxy are mesmerizing.
  </text>
  <text x="50" y="310" class="content">
    遥远星系中的星星令人着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="150" cy="100" r="80" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Horizon -->
    <line x1="0" y1="200" x2="300" y2="200" class="image" />
    <!-- Far away point -->
    <circle cx="250" cy="100" r="10" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
  </g>
</svg>