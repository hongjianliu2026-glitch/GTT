<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disregard</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsrɪˈɡɑːrd] v. 忽视，不理会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + regard (注意)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在繁忙的街道上，"不注意(dis-regard)"
    <tspan x="50" dy="25">周围的一切，完全沉浸在自己的世界里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He completely disregarded the traffic lights and crossed the street.
  </text>
  <text x="50" y="310" class="content">
    他完全忽视了红绿灯，直接穿过了马路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Traffic lights -->
    <rect x="250" y="20" width="50" height="160" class="image" />
    <circle cx="275" cy="50" r="10" class="image" fill="#E74C3C" />
    <circle cx="275" cy="100" r="10" class="image" fill="#F1C40F" />
    <circle cx="275" cy="150" r="10" class="image" fill="#2ECC71" />
    <!-- Person ignoring traffic lights -->
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>