<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feeding</text>
  <text x="50" y="120" class="subtitle">[ˈfiːdɪŋ] n. 喂养，进食</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feed (喂养) + -ing (动作进行)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在鸟巢中，鸟妈妈正在"喂养(feed)"
    <tspan x="50" dy="25">它，这个动作就是喂养(feeding)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mother bird is busy with the feeding of her chicks.
  </text>
  <text x="50" y="310" class="content">
    鸟妈妈正忙着喂养她的雏鸟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird's nest -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Bird -->
    <circle cx="100" cy="100" r="15" class="image" />
    <!-- Beak -->
    <line x1="115" y1="95" x2="130" y2="95" class="image" />
    <!-- Food -->
    <circle cx="150" cy="100" r="5" class="image" />
    <!-- Feeding action -->
    <line x1="130" y1="95" x2="150" y2="100" class="image" />
  </g>
</svg>