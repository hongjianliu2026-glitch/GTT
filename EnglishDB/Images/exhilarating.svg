<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exhilarating</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzɪləreɪtɪŋ] adj. 令人振奋的，使人高兴的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + hilar (高兴) + -ate (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在山顶上，"从内心深处(ex-)"
    <tspan x="50" dy="25">感受到无比的"高兴(hilar)"，这种感觉让人"振奋(exhilarating)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The exhilarating view from the mountain top made her feel alive.
  </text>
  <text x="50" y="310" class="content">
    山顶上令人振奋的景色让她感到充满活力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Person -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="120" y2="170" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Smile -->
    <path d="M140,160 Q150,180 160,160" class="image" />
  </g>
</svg>