<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ATM</text>
  <text x="50" y="120" class="subtitle">[ˈeɪtiːˈem] n. 自动取款机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Automated Teller Machine
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机器，像一个"自动银行柜员(Automated Teller Machine)"，
    <tspan x="50" dy="25">人们可以随时从中取出钱，就像从魔术盒里变出钞票一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I withdrew cash from the ATM near the supermarket.
  </text>
  <text x="50" y="310" class="content">
    我从超市附近的自动取款机取了现金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- ATM Machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Screen -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Card slot -->
    <rect x="100" y="180" width="150" height="10" class="image" />
    <!-- Money slot -->
    <rect x="150" y="200" width="50" height="10" class="image" />
    <!-- Keypad -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="90" cy="100" r="10" class="image" />
    <circle cx="110" cy="100" r="10" class="image" />
    <circle cx="70" cy="120" r="10" class="image" />
    <circle cx="90" cy="120" r="10" class="image" />
    <circle cx="110" cy="120" r="10" class="image" />
    <circle cx="70" cy="140" r="10" class="image" />
    <circle cx="90" cy="140" r="10" class="image" />
    <circle cx="110" cy="140" r="10" class="image" />
  </g>
</svg>