<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glove</text>
  <text x="50" y="120" class="subtitle">[ɡlʌv] n. 手套</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glo- (手) + ve (覆盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手被"覆盖(ve)"上了一层"手套(glove)"，
    <tspan x="50" dy="25">就像给手穿上了一件温暖的外衣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a pair of gloves to keep her hands warm.
  </text>
  <text x="50" y="310" class="content">
    她戴了一副手套来保暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hand -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="220" class="image" />
    <line x1="100" y1="200" x2="150" y2="220" class="image" />

    <!-- Glove -->
    <rect x="50" y="150" width="100" height="100" class="image" />
    <line x1="75" y1="150" x2="75" y2="250" class="image" />
    <line x1="125" y1="150" x2="125" y2="250" class="image" />
    <line x1="50" y1="175" x2="150" y2="175" class="image" />
    <line x1="50" y1="225" x2="150" y2="225" class="image" />
  </g>
</svg>