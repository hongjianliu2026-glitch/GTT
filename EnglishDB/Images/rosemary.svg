<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .plant { fill: #228B22; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rosemary</text>
  <text x="50" y="120" class="subtitle">[ˈroʊzməri] n. 迷迭香</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ros (露水) + mar (海) + y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片迷迭香(rosemary)生长在海边，
    <tspan x="50" dy="25">清晨的露水(ros)在叶片上闪烁，</tspan>
    <tspan x="50" dy="25">仿佛大海(mar)的气息滋养着它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added rosemary to the roast lamb.
  </text>
  <text x="50" y="310" class="content">
    她在烤羊肉中加入了迷迭香。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sea -->
    <rect x="0" y="150" width="350" height="100" class="image" fill="#4682B4" />
    <!-- Dew drops -->
    <circle cx="50" cy="100" r="5" class="image" fill="#B0E0E6" />
    <circle cx="70" cy="90" r="5" class="image" fill="#B0E0E6" />
    <circle cx="90" cy="80" r="5" class="image" fill="#B0E0E6" />
    <!-- Rosemary plant -->
    <rect x="100" y="100" width="50" height="50" class="plant" />
    <line x1="125" y1="100" x2="125" y2="50" class="image" />
    <line x1="125" y1="50" x2="100" y2="70" class="image" />
    <line x1="125" y1="50" x2="150" y2="70" class="image" />
    <line x1="125" y1="50" x2="115" y2="30" class="image" />
    <line x1="125" y1="50" x2="135" y2="30" class="image" />
  </g>
</svg>