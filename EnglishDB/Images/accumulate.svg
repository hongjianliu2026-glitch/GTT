<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accumulate</text>
  <text x="50" y="120" class="subtitle">[əˈkjuːmjəleɪt] v. 积累，积聚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + cumul (堆积) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山丘，"不断堆积(ac-cumul)"
    <tspan x="50" dy="25">成山，这就是积累(accumulate)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She accumulated a large fortune over the years.
  </text>
  <text x="50" y="310" class="content">
    她多年来积累了一大笔财富。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Small piles -->
    <rect x="50" y="150" width="30" height="30" class="image" />
    <rect x="90" y="120" width="30" height="60" class="image" />
    <rect x="130" y="90" width="30" height="90" class="image" />
    <rect x="170" y="60" width="30" height="120" class="image" />
    <rect x="210" y="30" width="30" height="150" class="image" />
    <!-- Large pile -->
    <rect x="250" y="0" width="30" height="180" class="image" />
  </g>
</svg>