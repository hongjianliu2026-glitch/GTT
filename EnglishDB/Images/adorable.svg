<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #F06292; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adorable</text>
  <text x="50" y="120" class="subtitle">[əˈdɔːrəbl] adj. 可爱的，讨人喜欢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + ora (嘴) + -ble (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫，它的每一个动作都让人忍不住"朝向(ad-)"它，
    <tspan x="50" dy="25">用"嘴(ora)"发出"哇"的声音，因为它实在是太"可爱(adorable)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The puppy was so adorable that everyone wanted to pet it.
  </text>
  <text x="50" y="310" class="content">
    这只小狗太可爱了，每个人都想摸摸它。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat face -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 80 120 Q 100 140 120 120" class="image" />
    <!-- Whiskers -->
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="110" x2="20" y2="120" class="image" />
    <line x1="150" y1="100" x2="180" y2="90" class="image" />
    <line x1="150" y1="110" x2="180" y2="120" class="image" />
  </g>
</svg>