<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prospective</text>
  <text x="50" y="120" class="subtitle">[prəˈspektɪv] adj. 预期的，未来的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + spect (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在未来，"向前看(pro-spect)"，
    <tspan x="50" dy="25">他看到的景象就是"预期的(prospective)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is looking for prospective employees.
  </text>
  <text x="50" y="310" class="content">
    公司正在寻找未来的员工。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person looking forward -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Arrow pointing forward -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
    <!-- Future landscape -->
    <rect x="220" y="80" width="100" height="40" class="image" />
    <rect x="240" y="60" width="60" height="40" class="image" />
    <rect x="260" y="40" width="20" height="40" class="image" />
  </g>
</svg>