<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">theology</text>
  <text x="50" y="120" class="subtitle">[θiˈɒlədʒi] n. 神学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> theo- (神) + -logy (学)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位学者在研究"神(theo)"的学问，
    <tspan x="50" dy="25">他深入探讨各种宗教信仰，这就是神学(theology)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She majored in theology at university.
  </text>
  <text x="50" y="310" class="content">
    她在大学主修神学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="40" x2="180" y2="40" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="120" x2="180" y2="120" class="image" />
    <!-- Scholar -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="230" y2="160" class="image" />
    <line x1="250" y1="130" x2="270" y2="160" class="image" />
    <line x1="250" y1="110" x2="280" y2="100" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="320" cy="50" rx="50" ry="30" class="image" />
    <line x1="320" y1="50" x2="320" y2="20" class="image" />
    <line x1="320" y1="20" x2="300" y2="10" class="image" />
    <line x1="320" y1="20" x2="340" y2="10" class="image" />
  </g>
</svg>