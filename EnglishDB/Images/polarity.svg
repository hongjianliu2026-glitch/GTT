<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polarity</text>
  <text x="50" y="120" class="subtitle">[poʊˈlærɪti] n. 极性，对立</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pol- (极) + -arity (性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个磁铁，两端分别是"北极(pol-)"和"南极(pol-)"，
    <tspan x="50" dy="25">它们之间的对立关系就是极性(polarity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The polarity of the magnet can be reversed.
  </text>
  <text x="50" y="310" class="content">
    磁铁的极性可以反转。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Magnet -->
    <rect x="0" y="0" width="300" height="100" class="image" />
    <!-- North Pole -->
    <circle cx="50" cy="50" r="20" class="image" />
    <text x="40" y="60" class="content" fill="#2980B9">N</text>
    <!-- South Pole -->
    <circle cx="250" cy="50" r="20" class="image" />
    <text x="240" y="60" class="content" fill="#E74C3C">S</text>
    <!-- Arrows -->
    <line x1="80" y1="50" x2="220" y2="50" class="image" />
    <polygon points="220,40 220,60 240,50" class="image" />
  </g>
</svg>