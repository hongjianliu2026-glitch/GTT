<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overriding</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈraɪdɪŋ] adj. 最重要的，压倒一切的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + ride (骑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人骑在另一人头上，"骑在上面(over-ride)"
    <tspan x="50" dy="25">，表示他的地位或重要性压倒一切(overriding)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The overriding concern was the safety of the passengers.
  </text>
  <text x="50" y="310" class="content">
    最重要的考虑是乘客的安全。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person on top -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="100" class="image" />
    <line x1="50" y1="90" x2="80" y2="100" class="image" />

    <!-- Person being ridden -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="120" y2="150" class="image" />
    <line x1="150" y1="140" x2="180" y2="150" class="image" />

    <!-- Arrow indicating the overriding -->
    <line x1="70" y1="70" x2="130" y2="120" class="image" />
    <polygon points="70,70 60,60 60,80" class="image" />
  </g>
</svg>