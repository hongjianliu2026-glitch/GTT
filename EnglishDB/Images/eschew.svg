<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eschew</text>
  <text x="50" y="120" class="subtitle">[ɪsˈtʃuː] v. 避开，回避</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> es- (出) + chew (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对一堆选择时，"选择性地避开(es-chew)"
    <tspan x="50" dy="25">那些不想要的选项，只留下自己真正需要的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always eschews junk food for healthier options.
  </text>
  <text x="50" y="310" class="content">
    她总是避开垃圾食品，选择更健康的选项。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person avoiding -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Choices -->
    <rect x="70" y="80" width="50" height="50" class="image" />
    <rect x="140" y="80" width="50" height="50" class="image" />
    <rect x="210" y="80" width="50" height="50" class="image" />
    <!-- Arrow avoiding -->
    <line x1="20" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="90" y2="90" class="image" />
    <line x1="100" y1="100" x2="90" y2="110" class="image" />
  </g>
</svg>