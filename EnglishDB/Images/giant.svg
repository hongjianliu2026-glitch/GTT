<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">giant</text>
  <text x="50" y="120" class="subtitle">[ˈdʒaɪənt] n. 巨人，巨大的东西</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gigas (巨人) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨人(gigas)站在城市中，他的身影遮天蔽日，
    <tspan x="50" dy="25">人们只能仰望他，这就是巨人(giant)的震撼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The giant oak tree stood tall in the forest.
  </text>
  <text x="50" y="310" class="content">
    那棵巨大的橡树在森林中高高耸立。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="250" x2="50" y2="350" class="image" /> <!-- Left leg -->
    <line x1="100" y1="250" x2="150" y2="350" class="image" /> <!-- Right leg -->
    <line x1="100" y1="180" x2="50" y2="220" class="image" /> <!-- Left arm -->
    <line x1="100" y1="180" x2="150" y2="220" class="image" /> <!-- Right arm -->
    <!-- City skyline -->
    <rect x="0" y="350" width="200" height="50" class="image" />
    <rect x="20" y="300" width="30" height="100" class="image" />
    <rect x="70" y="250" width="30" height="150" class="image" />
    <rect x="120" y="300" width="30" height="100" class="image" />
    <rect x="170" y="250" width="30" height="150" class="image" />
  </g>
</svg>