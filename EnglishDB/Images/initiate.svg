<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">initiate</text>
  <text x="50" y="120" class="subtitle">[ɪˈnɪʃieɪt] v. 开始，发起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + it (走) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走进(in-)一个房间，开始(initiate)
    <tspan x="50" dy="25">一个新的项目，就像点燃(it)了一根导火线。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company initiated a new marketing campaign.
  </text>
  <text x="50" y="310" class="content">
    公司发起了一项新的营销活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person entering -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Project -->
    <rect x="150" y="50" width="150" height="100" class="image" />
    <line x1="160" y1="60" x2="290" y2="60" class="image" />
    <line x1="160" y1="80" x2="280" y2="80" class="image" />
    <line x1="160" y1="100" x2="270" y2="100" class="image" />
    <line x1="160" y1="120" x2="260" y2="120" class="image" />
    <!-- Fuse -->
    <line x1="220" y1="150" x2="220" y2="180" class="image" />
    <line x1="220" y1="180" x2="240" y2="200" class="image" />
    <line x1="220" y1="180" x2="200" y2="200" class="image" />
  </g>
</svg>