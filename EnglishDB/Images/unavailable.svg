<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unavailable</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəˈveɪləbl] adj. 不可用的，无法获得的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + available (可用的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商店里，所有的商品都被"否定(un-)"了可用性，
    <tspan x="50" dy="25">贴上了"不可用(unavailable)"的标签，顾客只能失望离开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The product is currently unavailable due to high demand.
  </text>
  <text x="50" y="310" class="content">
    由于需求量大，该产品目前不可用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Store shelf -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Unavailable sign -->
    <text x="175" y="100" class="image" font-size="48" text-anchor="middle" fill="#C0392B">X</text>
    <!-- Products -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Customer -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
  </g>
</svg>