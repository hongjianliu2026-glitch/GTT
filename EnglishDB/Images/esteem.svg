<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">esteem</text>
  <text x="50" y="120" class="subtitle">[ɪˈstiːm] n. 尊重，尊敬；v. 尊重，尊敬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> est (存在) + eem (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在众人面前，"拿出(eem)"
    <tspan x="50" dy="25">自己的存在感，赢得了大家的尊重(esteem)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is held in high esteem by her colleagues.
  </text>
  <text x="50" y="310" class="content">
    她受到同事们的高度尊重。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Crowd -->
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />

    <!-- Respect symbols -->
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />

    <!-- Heart symbol -->
    <path d="M50,220 C50,250 100,250 100,220 C100,190 50,190 50,220 Z" class="image" />
  </g>
</svg>