<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheer</text>
  <text x="50" y="120" class="subtitle">[tʃɪər] v. 欢呼，喝彩；n. 欢呼，愉快</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cheer (来自古英语 cēar，意为“脸，表情”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在体育场上，"脸上(cheer)"洋溢着喜悦，
    <tspan x="50" dy="25">他们高声欢呼(cheer)，为运动员加油助威。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd cheered loudly when the winner was announced.
  </text>
  <text x="50" y="310" class="content">
    当获胜者被宣布时，人群大声欢呼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stadium -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Crowd -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="110" cy="55" r="10" class="image" />
    <circle cx="140" cy="65" r="10" class="image" />
    <circle cx="170" cy="50" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <circle cx="230" cy="55" r="10" class="image" />
    <circle cx="260" cy="65" r="10" class="image" />
    <!-- Cheering -->
    <line x1="50" y1="70" x2="50" y2="90" class="image" />
    <line x1="80" y1="80" x2="80" y2="100" class="image" />
    <line x1="110" y1="75" x2="110" y2="95" class="image" />
    <line x1="140" y1="85" x2="140" y2="105" class="image" />
    <line x1="170" y1="70" x2="170" y2="90" class="image" />
    <line x1="200" y1="80" x2="200" y2="100" class="image" />
    <line x1="230" y1="75" x2="230" y2="95" class="image" />
    <line x1="260" y1="85" x2="260" y2="105" class="image" />
  </g>
</svg>