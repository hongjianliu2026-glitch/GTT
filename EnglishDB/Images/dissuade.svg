<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dissuade</text>
  <text x="50" y="120" class="subtitle">[dɪˈsweɪd] v. 劝阻，阻止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (离开) + suade (劝告)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图"劝告(suade)"另一个人离开(dis-)
    <tspan x="50" dy="25">危险的行动，这就是劝阻(dissuade)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His parents tried to dissuade him from quitting school.
  </text>
  <text x="50" y="310" class="content">
    他的父母试图劝阻他不要退学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person trying to leave -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Person trying to dissuade -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Arrows showing dissuasion -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,100 145,95 145,105" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 195,95 195,105" class="image" />
  </g>
</svg>