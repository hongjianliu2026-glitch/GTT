<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entrant</text>
  <text x="50" y="120" class="subtitle">[ˈentrənt] n. 参赛者，新来者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> enter- (进入) + -ant (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新来者(entrant)，他"进入(enter)"
    <tspan x="50" dy="25">了一个全新的领域，准备大展身手。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The entrant in the race was a surprise winner.
  </text>
  <text x="50" y="310" class="content">
    比赛中的新参赛者出人意料地获胜了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="75" y1="0" x2="75" y2="200" class="image" />
    <!-- Person entering -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="190" y2="100" class="image" />
    <polygon points="190,90 200,100 190,110" class="image" />
  </g>
</svg>