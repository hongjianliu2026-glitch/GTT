<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">falling</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːlɪŋ] adj. 下降的，落下的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fall (落下) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苹果从树上"落下(fall)"，
    <tspan x="50" dy="25">它在空中"进行(ing)"着自由落体运动，</tspan>
    <tspan x="50" dy="25">这就是"falling"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The price of oil has been falling for months.
  </text>
  <text x="50" y="310" class="content">
    油价已经连续几个月下跌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="50" y1="50" x2="20" y2="100" class="image" />
    <line x1="50" y1="50" x2="80" y2="100" class="image" />
    <line x1="50" y1="100" x2="20" y2="150" class="image" />
    <line x1="50" y1="100" x2="80" y2="150" class="image" />
    <!-- Apple -->
    <circle cx="50" cy="50" r="15" class="image" fill="#E74C3C" />
    <!-- Falling path -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="100" y2="200" class="image" />
  </g>
</svg>