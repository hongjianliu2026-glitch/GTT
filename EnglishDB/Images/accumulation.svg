<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accumulation</text>
  <text x="50" y="120" class="subtitle">[əˌkjuːmjuˈleɪʃn] n. 积累，积聚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + cumul (堆积) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山丘，"不断堆积(ac-cumul)"
    <tspan x="50" dy="25">成山，这就是积累(accumulation)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accumulation of wealth over time is a common goal.
  </text>
  <text x="50" y="310" class="content">
    随着时间的推移积累财富是一个常见的目标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mountain -->
    <polygon points="175,20 100,150 250,150" class="image" fill="#A0A0A0" />
    <!-- Accumulation -->
    <rect x="150" y="150" width="50" height="30" class="image" fill="#808080" />
    <rect x="140" y="180" width="70" height="30" class="image" fill="#808080" />
    <rect x="130" y="210" width="90" height="30" class="image" fill="#808080" />
    <!-- Text -->
    <text x="175" y="250" class="content" text-anchor="middle">堆积成山</text>
  </g>
</svg>