<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rodeo</text>
  <text x="50" y="120" class="subtitle">[roʊˈdeɪoʊ] n. 牛仔竞技表演</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rode (骑马) + -o (表示“活动”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群牛仔骑着马，"骑马(rode)"
    <tspan x="50" dy="25">在竞技场上表演各种特技，这就是牛仔竞技表演(rodeo)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rodeo attracted thousands of spectators.
  </text>
  <text x="50" y="310" class="content">
    牛仔竞技表演吸引了成千上万的观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arena -->
    <circle cx="175" cy="100" r="100" class="image" />
    <!-- Cowboy -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="150" y2="120" class="image" />
    <!-- Horse -->
    <rect x="130" y="150" width="50" height="30" class="image" />
    <line x1="155" y1="150" x2="155" y2="120" class="image" />
    <line x1="155" y1="120" x2="145" y2="100" class="image" />
    <line x1="155" y1="120" x2="165" y2="100" class="image" />
  </g>
</svg>