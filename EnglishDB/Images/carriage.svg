<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carriage</text>
  <text x="50" y="120" class="subtitle">[ˈkærɪdʒ] n. 马车，车厢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carr (携带) + -iage (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆古老的马车，"携带(carr)"着乘客穿越
    <tspan x="50" dy="25">乡村，这就是马车(carriage)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old carriage creaked as it moved down the cobblestone road.
  </text>
  <text x="50" y="310" class="content">
    那辆旧马车在鹅卵石路上嘎吱作响地移动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Carriage body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="160" r="30" class="image" />
    <circle cx="300" cy="160" r="30" class="image" />
    <!-- Horse -->
    <rect x="350" y="50" width="50" height="100" class="image" />
    <circle cx="375" cy="30" r="20" class="image" />
    <line x1="375" y1="50" x2="375" y2="100" class="image" />
    <line x1="375" y1="100" x2="350" y2="130" class="image" />
    <line x1="375" y1="100" x2="400" y2="130" class="image" />
    <line x1="375" y1="70" x2="420" y2="60" class="image" />
  </g>
</svg>