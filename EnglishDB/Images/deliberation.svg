<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deliberation</text>
  <text x="50" y="120" class="subtitle">[dɪˌlɪbəˈreɪʃn] n. 深思熟虑，审议</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + liber (自由) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在会议室里，"强调自由地(de-liber)"
    <tspan x="50" dy="25">讨论问题，每个人都在深思熟虑(deliberation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The committee's deliberation lasted for hours.
  </text>
  <text x="50" y="310" class="content">
    委员会的审议持续了几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Meeting room -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People -->
    <circle cx="80" cy="60" r="15" class="image" />
    <circle cx="150" cy="60" r="15" class="image" />
    <circle cx="220" cy="60" r="15" class="image" />
    <!-- Discussion -->
    <line x1="80" y1="80" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="220" y2="80" class="image" />
    <line x1="220" y1="80" x2="80" y2="80" class="image" />
    <!-- Thought bubbles -->
    <circle cx="80" cy="40" r="10" class="image" />
    <circle cx="150" cy="40" r="10" class="image" />
    <circle cx="220" cy="40" r="10" class="image" />
  </g>
</svg>