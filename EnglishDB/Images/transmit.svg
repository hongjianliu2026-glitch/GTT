<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transmit</text>
  <text x="50" y="120" class="subtitle">[trænsˈmɪt] v. 传输，传送</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + mit (发送)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个信号塔，"跨越(trans-)"
    <tspan x="50" dy="25">空间将信息"发送(mit)"到远方，这就是传输(transmit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The satellite can transmit data across the globe.
  </text>
  <text x="50" y="310" class="content">
    这颗卫星可以全球传输数据。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Signal tower -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Signal lines -->
    <line x1="50" y1="200" x2="200" y2="50" class="image" />
    <line x1="50" y1="200" x2="300" y2="100" class="image" />
    <line x1="50" y1="200" x2="400" y2="150" class="image" />
    <!-- Receiver -->
    <circle cx="400" cy="150" r="20" class="image" />
  </g>
</svg>