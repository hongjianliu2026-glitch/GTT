<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">godmother</text>
  <text x="50" y="120" class="subtitle">[ˈɡɒdmʌðə] n. 教母</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> god- (神) + mother (母亲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神圣的母亲(god-mother)，她像神一样
    <tspan x="50" dy="25">保护和照顾着孩子，这就是教母(godmother)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was named as the godmother of her niece.
  </text>
  <text x="50" y="310" class="content">
    她被指定为她侄女的教母。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Halo -->
    <circle cx="100" cy="100" r="50" class="image" stroke-dasharray="5,5" />
    <!-- Woman -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="150" x2="60" y2="140" class="image" />
    <line x1="100" y1="150" x2="140" y2="140" class="image" />
    <!-- Child -->
    <circle cx="180" cy="120" r="20" class="image" />
    <line x1="180" y1="140" x2="180" y2="170" class="image" />
    <line x1="180" y1="170" x2="160" y2="200" class="image" />
    <line x1="180" y1="170" x2="200" y2="200" class="image" />
    <line x1="180" y1="150" x2="140" y2="140" class="image" />
    <line x1="180" y1="150" x2="220" y2="140" class="image" />
  </g>
</svg>