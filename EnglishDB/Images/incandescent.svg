<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .light { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incandescent</text>
  <text x="50" y="120" class="subtitle">[ˌɪnˌkænˈdesnt] adj. 白炽的，明亮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + cand (发光) + -escent (开始)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个灯泡"进入(in-)"发光状态，"开始(escent)"
    <tspan x="50" dy="25">发出明亮的光芒，这就是白炽的(incandescent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The incandescent light bulb was a major invention.
  </text>
  <text x="50" y="310" class="content">
    白炽灯泡是一项重大发明。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light bulb -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="75" y1="250" x2="125" y2="250" class="image" />
    <line x1="75" y1="250" x2="50" y2="300" class="image" />
    <line x1="125" y1="250" x2="150" y2="300" class="image" />
    <!-- Light rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image light" />
    <line x1="100" y1="50" x2="50" y2="0" class="image light" />
    <line x1="100" y1="50" x2="150" y2="0" class="image light" />
    <line x1="100" y1="50" x2="0" y2="50" class="image light" />
    <line x1="100" y1="50" x2="200" y2="50" class="image light" />
  </g>
</svg>