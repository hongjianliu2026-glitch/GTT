<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">optional</text>
  <text x="50" y="120" class="subtitle">[ˈɑːpʃənl] adj. 可选择的，非强制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> opt (选择) + -ional (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个菜单上有一个大大的"可选(opt)"标志，
    <tspan x="50" dy="25">旁边有一个笑脸，表示你可以自由选择(optional)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dessert is optional, you can choose to have it or not.
  </text>
  <text x="50" y="310" class="content">
    甜点是可选的，你可以选择吃或不吃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Menu -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Optional sign -->
    <text x="50" y="50" class="image" font-size="48" fill="#E74C3C">可选</text>
    <!-- Smiley face -->
    <circle cx="200" cy="100" r="30" class="image" fill="#F1C40F" />
    <circle cx="185" cy="85" r="5" class="image" fill="#000" />
    <circle cx="215" cy="85" r="5" class="image" fill="#000" />
    <path d="M185 115 Q200 130 215 115" class="image" fill="none" stroke="#000" stroke-width="3" />
  </g>
</svg>