<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrinkle</text>
  <text x="50" y="120" class="subtitle">[ˈrɪŋkl] n. 皱纹；v. 起皱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wrin (扭曲) + kle (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老奶奶的脸上，"扭曲的小(wrin-kle)"
    <tspan x="50" dy="25">线条形成了皱纹(wrinkle)，记录着岁月的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tried to iron out the wrinkles in her dress.
  </text>
  <text x="50" y="310" class="content">
    她试图熨平裙子上的皱纹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Wrinkles -->
    <line x1="40" y1="60" x2="160" y2="60" class="image" />
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <line x1="60" y1="100" x2="140" y2="100" class="image" />
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <line x1="80" y1="140" x2="120" y2="140" class="image" />
  </g>
</svg>