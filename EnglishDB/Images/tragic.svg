<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #7E5109; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tragic</text>
  <text x="50" y="120" class="subtitle">[ˈtrædʒɪk] adj. 悲剧的，悲惨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trag- (山羊) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只山羊(trag-)在舞台上表演，结果却发生了
    <tspan x="50" dy="25">悲惨的(tragic)事故，整个场景变得非常悲剧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tragic accident left many families devastated.
  </text>
  <text x="50" y="310" class="content">
    这场悲惨的事故让许多家庭陷入了绝望。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Goat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Tragic accident -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="200" class="image" />
    <line x1="150" y1="150" x2="200" y2="200" class="image" />
    <!-- Tears -->
    <circle cx="250" cy="120" r="10" class="image" />
    <circle cx="270" cy="120" r="10" class="image" />
    <circle cx="290" cy="120" r="10" class="image" />
  </g>
</svg>