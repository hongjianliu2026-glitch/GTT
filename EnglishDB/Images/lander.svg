<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lander</text>
  <text x="50" y="120" class="subtitle">[ˈlændər] n. 着陆器，登陆者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> land (陆地) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太空船，"降落在(land)"
    <tspan x="50" dy="25">地球上，这个太空船就是着陆器(lander)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lander successfully touched down on Mars.
  </text>
  <text x="50" y="310" class="content">
    着陆器成功降落在火星上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spacecraft -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Parachute -->
    <polyline points="100,20 150,100 200,20" class="image" />
    <polyline points="150,100 200,180 250,100" class="image" />
    <!-- Earth -->
    <circle cx="300" cy="150" r="50" class="image" />
    <!-- Lander -->
    <rect x="150" y="120" width="100" height="60" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <line x1="150" y1="180" x2="250" y2="180" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
  </g>
</svg>