<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">high-pitched</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪˈpɪtʃt] adj. 高音调的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + pitch (音调)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在高空中尖叫，"高(high)"
    <tspan x="50" dy="25">音调(pitch)的声音刺破云霄，这就是高音调(high-pitched)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby's high-pitched cry woke everyone up.
  </text>
  <text x="50" y="310" class="content">
    婴儿的高音调哭声把大家都吵醒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="50" y1="80" x2="30" y2="70" class="image" />
    <line x1="50" y1="80" x2="70" y2="70" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <!-- High pitch sound waves -->
    <path d="M100,50 Q150,20 200,50 T300,50" class="image" />
    <path d="M100,70 Q150,40 200,70 T300,70" class="image" />
    <path d="M100,90 Q150,60 200,90 T300,90" class="image" />
  </g>
</svg>