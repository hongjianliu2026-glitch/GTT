<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bland</text>
  <text x="50" y="120" class="subtitle">[blænd] adj. 平淡的，乏味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bland (来自拉丁语 blandus，意为“温和的，讨好的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一碗没有任何调料的"平淡(bland)"汤，
    <tspan x="50" dy="25">它没有任何味道，让人感到乏味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The food was so bland that I couldn't finish it.
  </text>
  <text x="50" y="310" class="content">
    食物太乏味了，我吃不完。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Soup -->
    <ellipse cx="175" cy="110" rx="130" ry="50" class="image" fill="#F5DEB3" />
    <!-- Spoon -->
    <line x1="20" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="80" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
  </g>
</svg>