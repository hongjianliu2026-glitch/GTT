<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dated</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪtɪd] adj. 过时的，陈旧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> date (日期) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老式电话机，上面贴着一张"过时的(dated)"
    <tspan x="50" dy="25">日期标签，暗示着它已经不再被使用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fashion of the 90s now looks dated.
  </text>
  <text x="50" y="310" class="content">
    90年代的时尚现在看起来已经过时了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old telephone -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <circle cx="100" cy="75" r="50" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <!-- Date label -->
    <rect x="120" y="20" width="60" height="30" class="image" />
    <text x="125" y="40" class="content">1990</text>
  </g>
</svg>