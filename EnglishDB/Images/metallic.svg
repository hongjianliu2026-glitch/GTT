<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .metal { fill: #C0C0C0; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">metallic</text>
  <text x="50" y="120" class="subtitle">[məˈtælɪk] adj. 金属的，金属制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> metall (金属) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金属球，表面闪闪发光，"金属(metall)"
    <tspan x="50" dy="25">的质感让人忍不住想去触摸，这就是金属的(metallic)魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The metallic sound of the bell echoed through the hall.
  </text>
  <text x="50" y="310" class="content">
    铃铛的金属声在大厅里回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Metal ball -->
    <circle cx="100" cy="100" r="80" class="metal" />
    <!-- Reflection -->
    <circle cx="120" cy="80" r="10" class="metal" />
    <circle cx="80" cy="120" r="15" class="metal" />
    <circle cx="140" cy="140" r="20" class="metal" />
  </g>
</svg>