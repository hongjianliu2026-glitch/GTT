<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">develop</text>
  <text x="50" y="120" class="subtitle">[dɪˈvɛləp] v. 发展，开发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + velop (覆盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个种子从地面"向下覆盖(de-velop)"，
    <tspan x="50" dy="25">逐渐成长为一棵大树，这就是发展的过程(develop)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is developing a new product.
  </text>
  <text x="50" y="310" class="content">
    公司正在开发一种新产品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seed -->
    <circle cx="50" cy="100" r="10" class="image" />
    <!-- Growing plant -->
    <line x1="50" y1="110" x2="50" y2="150" class="image" />
    <line x1="50" y1="130" x2="30" y2="120" class="image" />
    <line x1="50" y1="130" x2="70" y2="120" class="image" />
    <line x1="50" y1="150" x2="30" y2="170" class="image" />
    <line x1="50" y1="150" x2="70" y2="170" class="image" />
    <!-- Tree -->
    <rect x="20" y="180" width="60" height="100" class="image" />
    <line x1="50" y1="180" x2="20" y2="150" class="image" />
    <line x1="50" y1="180" x2="80" y2="150" class="image" />
    <line x1="50" y1="200" x2="20" y2="170" class="image" />
    <line x1="50" y1="200" x2="80" y2="170" class="image" />
  </g>
</svg>