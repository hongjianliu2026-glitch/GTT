<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #FF4500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .star { fill: #FFFF00; }
      .explosion { fill: #FF4500; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supernova</text>
  <text x="50" y="120" class="subtitle">[ˌsuːpərˈnoʊvə] n. 超新星</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (超级) + nova (新星)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗巨大的恒星，"超级(super)"
    <tspan x="50" dy="25">爆发成一颗"新星(nova)"，</tspan>
    <tspan x="50" dy="25">释放出无比耀眼的光芒，这就是超新星(supernova)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The astronomer discovered a supernova in the Andromeda galaxy.
  </text>
  <text x="50" y="310" class="content">
    这位天文学家在仙女座星系中发现了一颗超新星。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <circle cx="100" cy="100" r="50" class="star" />
    <!-- Explosion -->
    <circle cx="100" cy="100" r="20" class="explosion" />
    <circle cx="130" cy="70" r="15" class="explosion" />
    <circle cx="150" cy="100" r="15" class="explosion" />
    <circle cx="130" cy="130" r="15" class="explosion" />
    <circle cx="70" cy="130" r="15" class="explosion" />
    <circle cx="50" cy="100" r="15" class="explosion" />
    <circle cx="70" cy="70" r="15" class="explosion" />
  </g>
</svg>