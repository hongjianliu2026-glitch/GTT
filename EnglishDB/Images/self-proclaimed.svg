<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-proclaimed</text>
  <text x="50" y="120" class="subtitle">[ˌself prəˈkleɪmd] adj. 自称的，自封的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + pro- (在前面) + claim (声称)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"自己(self-)"
    <tspan x="50" dy="25">在前面(pro-)大声宣称(claim)"自己是专家，</tspan>
    <tspan x="50" dy="25">这就是自称的(self-proclaimed)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a self-proclaimed expert in ancient history.
  </text>
  <text x="50" y="310" class="content">
    他自称是古代历史专家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M 150 80 Q 250 80 250 120 Q 250 160 150 160 Q 100 160 100 120 Z" class="image" />
    <text x="170" y="110" class="content">I am an expert!</text>
  </g>
</svg>