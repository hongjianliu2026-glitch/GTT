<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8B0000; }
      .subtitle { font: italic 24px serif; fill: #4B0082; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">desolate</text>
  <text x="50" y="120" class="subtitle">[ˈdesələt] adj. 荒凉的，孤独的；v. 使荒凉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + sol (孤独) + -ate (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片荒凉的沙漠，"向下(de-)"
    <tspan x="50" dy="25">孤独(sol)地延伸，没有生命的迹象，这就是荒凉(desolate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The village was desolate after the war.
  </text>
  <text x="50" y="310" class="content">
    战争后，村庄变得荒凉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert landscape -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" fill="#FFD700" />
    <!-- Sand dunes -->
    <path d="M50,180 Q100,100 150,180 T250,180" class="image" />
    <path d="M100,180 Q150,100 200,180 T300,180" class="image" />
    <!-- Lonely cactus -->
    <rect x="150" y="150" width="20" height="50" class="image" />
    <line x1="160" y1="150" x2="160" y2="130" class="image" />
    <line x1="140" y1="140" x2="170" y2="140" class="image" />
    <line x1="145" y1="130" x2="165" y2="130" class="image" />
  </g>
</svg>