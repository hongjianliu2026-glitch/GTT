<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bridge</text>
  <text x="50" y="120" class="subtitle">[brɪdʒ] n. 桥；v. 架桥，连接</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brig (桥) + -e (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的桥，"连接(bridge)"
    <tspan x="50" dy="25">两岸，让人们可以轻松跨越河流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new bridge connects the two cities.
  </text>
  <text x="50" y="310" class="content">
    这座新桥连接了两座城市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <rect x="0" y="100" width="350" height="50" class="image" fill="#3498DB" />
    <!-- Bridge -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" stroke-width="10" />
    <line x1="50" y1="100" x2="50" y2="50" class="image" />
    <line x1="300" y1="100" x2="300" y2="50" class="image" />
    <!-- Pillars -->
    <line x1="100" y1="100" x2="100" y2="0" class="image" />
    <line x1="250" y1="100" x2="250" y2="0" class="image" />
  </g>
</svg>