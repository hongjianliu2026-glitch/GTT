<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">denunciation</text>
  <text x="50" y="120" class="subtitle">[ˌdiːnʌnsiˈeɪʃn] n. 公开谴责，告发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + nunci (说) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高台上，"向下大声说(de-nunci-ation)"
    <tspan x="50" dy="25">出对某人的谴责，声音响彻整个广场。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The politician's denunciation of corruption was widely applauded.
  </text>
  <text x="50" y="310" class="content">
    这位政治家对腐败的公开谴责受到了广泛赞扬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on the platform -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="100" x2="220" y2="90" class="image" />
    <!-- Loudspeaker -->
    <rect x="230" y="30" width="100" height="40" class="image" />
    <line x1="280" y1="50" x2="330" y2="50" class="image" />
    <line x1="280" y1="70" x2="330" y2="70" class="image" />
    <line x1="280" y1="90" x2="330" y2="90" class="image" />
  </g>
</svg>