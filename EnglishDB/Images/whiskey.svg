<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .whiskey { fill: #D2691E; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whiskey</text>
  <text x="50" y="120" class="subtitle">[ˈwɪski] n. 威士忌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自爱尔兰语和苏格兰盖尔语的“uisce beatha”，意为“生命之水”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的酿酒师，在月光下，用神秘的配方酿造出“生命之水(whiskey)”，
    <tspan x="50" dy="25">每一滴都充满了力量和故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He enjoys a glass of whiskey after a long day.
  </text>
  <text x="50" y="310" class="content">
    他喜欢在漫长的一天后喝一杯威士忌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Whiskey bottle -->
    <rect x="0" y="0" width="100" height="300" class="image" />
    <rect x="10" y="10" width="80" height="280" class="whiskey" />
    <!-- Whiskey glass -->
    <rect x="120" y="150" width="100" height="100" class="image" />
    <rect x="130" y="160" width="80" height="80" class="whiskey" />
    <!-- Moon -->
    <circle cx="250" cy="100" r="50" class="image" />
    <!-- Old distiller -->
    <circle cx="250" cy="250" r="20" class="image" />
    <line x1="250" y1="270" x2="250" y2="320" class="image" />
    <line x1="250" y1="320" x2="230" y2="350" class="image" />
    <line x1="250" y1="320" x2="270" y2="350" class="image" />
    <line x1="250" y1="290" x2="220" y2="280" class="image" />
    <line x1="250" y1="290" x2="280" y2="280" class="image" />
  </g>
</svg>