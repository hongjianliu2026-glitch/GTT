<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">waive</text>
  <text x="50" y="120" class="subtitle">[weɪv] v. 放弃，免除</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wav (wave, 波浪) + e (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在海边，面对着汹涌的波浪，
    <tspan x="50" dy="25">他轻轻挥手，"放弃(waive)"了抵抗，任由波浪冲刷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to waive her right to a trial.
  </text>
  <text x="50" y="310" class="content">
    她决定放弃她的审判权。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Waves -->
    <path d="M50 50 Q100 20 150 50 T250 50 T300 20 T350 50" class="image" />
    <path d="M50 80 Q100 50 150 80 T250 80 T300 50 T350 80" class="image" />
    <path d="M50 110 Q100 80 150 110 T250 110 T300 80 T350 110" class="image" />
    <!-- Person waving -->
    <circle cx="200" cy="150" r="15" class="image" fill="#F1C40F" />
    <line x1="200" y1="165" x2="200" y2="190" class="image" />
    <line x1="200" y1="190" x2="180" y2="220" class="image" />
    <line x1="200" y1="190" x2="220" y2="220" class="image" />
    <line x1="200" y1="175" x2="230" y2="165" class="image" />
  </g>
</svg>