<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ore</text>
  <text x="50" y="120" class="subtitle">[ɔːr] n. 矿石，矿砂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> or- (矿石)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个矿工在地下深处，挖掘出一块块闪闪发光的"矿石(ore)"，
    <tspan x="50" dy="25">这些矿石是提炼金属的宝贵资源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mine produces a variety of ores.
  </text>
  <text x="50" y="310" class="content">
    这个矿山出产多种矿石。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mine shaft -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ore -->
    <circle cx="50" cy="100" r="20" class="image" fill="#D35400" />
    <circle cx="100" cy="120" r="25" class="image" fill="#D35400" />
    <circle cx="150" cy="100" r="30" class="image" fill="#D35400" />
    <!-- Miner -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
  </g>
</svg>