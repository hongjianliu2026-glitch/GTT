<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">treachery</text>
  <text x="50" y="120" class="subtitle">[ˈtrɛtʃəri] n. 背叛，背信弃义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> treach (陷阱) + -ery (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在背后挖了一个"陷阱(treach)"，
    <tspan x="50" dy="25">然后背叛了他的朋友，这就是"背信弃义(treachery)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His treachery led to the downfall of the entire team.
  </text>
  <text x="50" y="310" class="content">
    他的背叛导致了整个团队的垮台。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trap -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Friend -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="350" y2="120" class="image" />
    <!-- Arrow -->
    <line x1="20" y1="100" x2="300" y2="100" class="image" />
    <polygon points="290,90 300,100 290,110" class="image" />
  </g>
</svg>