<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">awash</text>
  <text x="50" y="120" class="subtitle">[əˈwɒʃ] adj. 被水覆盖的，泛滥的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (在...上) + wash (洗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片土地被水"洗(wash)"过，完全"在...上(a-)"
    <tspan x="50" dy="25">覆盖了，这就是"awash"的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The streets were awash with floodwater after the storm.
  </text>
  <text x="50" y="310" class="content">
    暴风雨过后，街道被洪水淹没。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Land -->
    <rect x="50" y="100" width="250" height="100" class="image" fill="#D35400" />
    <!-- Waves -->
    <line x1="70" y1="20" x2="280" y2="20" class="image" />
    <line x1="70" y1="40" x2="250" y2="40" class="image" />
    <line x1="70" y1="60" x2="270" y2="60" class="image" />
    <line x1="70" y1="80" x2="240" y2="80" class="image" />
    <!-- Water covering land -->
    <line x1="70" y1="120" x2="280" y2="120" class="image" />
    <line x1="70" y1="140" x2="250" y2="140" class="image" />
    <line x1="70" y1="160" x2="270" y2="160" class="image" />
    <line x1="70" y1="180" x2="240" y2="180" class="image" />
  </g>
</svg>