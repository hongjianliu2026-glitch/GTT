<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">astronomical</text>
  <text x="50" y="120" class="subtitle">[ˌæstrəˈnɑːmɪkl] adj. 天文学的，极大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> astro- (星) + nom (法则) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的望远镜指向星空，"星辰法则(astro-nom)"
    <tspan x="50" dy="25">揭示了宇宙的奥秘，这个过程就是天文学的(astronomical)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cost of the project was astronomical.
  </text>
  <text x="50" y="310" class="content">
    这个项目的成本极其高昂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Telescope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="250" y2="20" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <circle cx="150" cy="180" r="20" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="200" cy="70" r="5" class="image" />
    <circle cx="250" cy="100" r="5" class="image" />
    <circle cx="120" cy="130" r="5" class="image" />
    <circle cx="220" cy="150" r="5" class="image" />
  </g>
</svg>