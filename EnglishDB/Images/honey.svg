<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFC107; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .honey { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">honey</text>
  <text x="50" y="120" class="subtitle">[ˈhʌni] n. 蜂蜜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hon (甜) + ey (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蜜蜂在花丛中忙碌，采集花蜜，
    <tspan x="50" dy="25">最终酿成甜美的蜂蜜(honey)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added a spoonful of honey to her tea.
  </text>
  <text x="50" y="310" class="content">
    她在茶里加了一勺蜂蜜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Honey jar -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="10" y="10" width="130" height="180" class="honey" />
    <!-- Bee -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <line x1="200" y1="140" x2="170" y2="130" class="image" />
    <!-- Flower -->
    <circle cx="250" cy="100" r="30" class="image" />
    <circle cx="270" cy="100" r="30" class="image" />
    <circle cx="260" cy="80" r="30" class="image" />
    <circle cx="260" cy="120" r="30" class="image" />
  </g>
</svg>