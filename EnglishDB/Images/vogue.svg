<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vogue</text>
  <text x="50" y="120" class="subtitle">[voʊɡ] n. 时尚，流行；adj. 流行的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vog (走) + e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群时尚达人走在T台上，"走(vog)"
    <tspan x="50" dy="25">出潮流，引领时尚(vogue)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This hairstyle is the latest vogue.
  </text>
  <text x="50" y="310" class="content">
    这种发型是最新的时尚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Runway -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fashion models -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Models -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Clothes -->
    <rect x="90" y="80" width="30" height="40" class="image" />
    <rect x="140" y="80" width="30" height="40" class="image" />
    <rect x="190" y="80" width="30" height="40" class="image" />
    <rect x="240" y="80" width="30" height="40" class="image" />
  </g>
</svg>