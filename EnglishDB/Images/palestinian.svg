<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Palestinian</text>
  <text x="50" y="120" class="subtitle">[ˌpæləˈstainiən] n. 巴勒斯坦人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Pal(e) (古) + stin (站) + -ian (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群古代(Pal)站在(stin)土地上的人，他们就是巴勒斯坦人(Palestinian)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Palestinian people have a rich cultural heritage.
  </text>
  <text x="50" y="310" class="content">
    巴勒斯坦人民有着丰富的文化遗产。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ancient figure -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Land -->
    <rect x="0" y="150" width="150" height="50" class="image" />
    <!-- People standing -->
    <circle cx="100" cy="50" r="20" class="image" />
    <line x1="100" y1="70" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="150" class="image" />
    <line x1="100" y1="90" x2="130" y2="80" class="image" />
  </g>
</svg>