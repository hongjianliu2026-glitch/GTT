<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">squeeze</text>
  <text x="50" y="120" class="subtitle">[skwiːz] v. 挤压，压榨；n. 挤压，紧握</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> squ- (挤压) + eeze (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手紧紧地"挤压(squeeze)"一个橙子，
    <tspan x="50" dy="25">橙汁从指缝中流出，这就是挤压的动作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave him a tight squeeze.
  </text>
  <text x="50" y="310" class="content">
    她紧紧地抱了他一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand squeezing orange -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Orange -->
    <path d="M 50 100 Q 75 50 100 100 Q 125 150 150 100" class="image" /> <!-- Hand -->
    <line x1="75" y1="100" x2="125" y2="100" class="image" /> <!-- Squeezing line -->
    <line x1="100" y1="50" x2="100" y2="150" class="image" /> <!-- Squeezing line -->
  </g>
</svg>