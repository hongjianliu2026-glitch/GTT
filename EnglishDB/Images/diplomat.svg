<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diplomat</text>
  <text x="50" y="120" class="subtitle">[ˈdɪpləmæt] n. 外交官，有外交手腕的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> diplo- (双) + -mat (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个外交官在谈判桌上，"双边(diplo-)"
    <tspan x="50" dy="25">协商，展现出高超的外交手腕(diplomat)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The diplomat successfully mediated the conflict.
  </text>
  <text x="50" y="310" class="content">
    这位外交官成功地调解了冲突。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Diplomat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Negotiation -->
    <line x1="150" y1="50" x2="300" y2="50" class="image" />
    <line x1="150" y1="80" x2="300" y2="80" class="image" />
    <line x1="150" y1="110" x2="300" y2="110" class="image" />
    <line x1="150" y1="140" x2="300" y2="140" class="image" />
    <!-- Other party -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="280" y2="220" class="image" />
    <line x1="300" y1="180" x2="320" y2="220" class="image" />
    <line x1="300" y1="140" x2="340" y2="130" class="image" />
  </g>
</svg>