<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">messenger</text>
  <text x="50" y="120" class="subtitle">[ˈmesɪndʒər] n. 信使，送信人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mes- (中间) + -seng (发送) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个信使骑着飞马，"在中间(mes-)"
    <tspan x="50" dy="25">穿梭于城市之间，传递着重要的信息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The messenger delivered the letter promptly.
  </text>
  <text x="50" y="310" class="content">
    信使迅速地递送了信件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Messenger -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Flying horse -->
    <rect x="100" y="80" width="100" height="60" class="image" />
    <line x1="120" y1="80" x2="120" y2="20" class="image" />
    <line x1="180" y1="80" x2="180" y2="20" class="image" />
    <line x1="120" y1="20" x2="180" y2="20" class="image" />
    <line x1="150" y1="20" x2="150" y2="0" class="image" />
    <line x1="150" y1="0" x2="130" y2="10" class="image" />
    <line x1="150" y1="0" x2="170" y2="10" class="image" />
    <!-- Message -->
    <rect x="220" y="90" width="60" height="40" class="image" />
    <line x1="230" y1="100" x2="270" y2="100" class="image" />
    <line x1="230" y1="120" x2="270" y2="120" class="image" />
    <line x1="230" y1="140" x2="270" y2="140" class="image" />
  </g>
</svg>