<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">covet</text>
  <text x="50" y="120" class="subtitle">[ˈkʌvɪt] v. 渴望，贪求</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (一起) + vet (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"一起看着(co-vet)"
    <tspan x="50" dy="25">某样东西，眼中充满了渴望，</tspan>
    <tspan x="50" dy="25">这种强烈的欲望就是"covet"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She coveted her friend's new car.
  </text>
  <text x="50" y="310" class="content">
    她渴望得到她朋友的新车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person looking at an object -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Object -->
    <rect x="100" y="80" width="100" height="50" class="image" />
    <!-- Eyes -->
    <circle cx="30" cy="95" r="5" class="image" />
    <circle cx="40" cy="95" r="5" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="100" x2="90" y2="100" class="image" />
    <polygon points="90,100 85,95 85,105" class="image" />
  </g>
</svg>