<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .milk { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">milky</text>
  <text x="50" y="120" class="subtitle">[ˈmɪlki] adj. 牛奶的，乳白色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> milk (牛奶) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的牛奶瓶，瓶子里装满了"牛奶(milk)"，
    <tspan x="50" dy="25">整个瓶子都被牛奶染成了乳白色(milky)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sky turned milky after the storm.
  </text>
  <text x="50" y="310" class="content">
    暴风雨过后，天空变成了乳白色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Milk bottle -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="milk" />
    <!-- Milk splash -->
    <circle cx="85" cy="180" r="20" class="milk" />
    <circle cx="100" cy="160" r="15" class="milk" />
    <circle cx="70" cy="160" r="15" class="milk" />
  </g>
</svg>