<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9C4; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">banana</text>
  <text x="50" y="120" class="subtitle">[bəˈnɑːnə] n. 香蕉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> banan (香蕉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的香蕉树，树上挂满了金黄色的香蕉，
    <tspan x="50" dy="25">每一根香蕉都像是一个小小的月亮，照亮了整个果园。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat bananas for breakfast.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在早餐时吃香蕉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Banana tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <!-- Bananas -->
    <ellipse cx="175" cy="50" rx="50" ry="20" class="image" />
    <ellipse cx="175" cy="90" rx="50" ry="20" class="image" />
    <ellipse cx="175" cy="130" rx="50" ry="20" class="image" />
  </g>
</svg>