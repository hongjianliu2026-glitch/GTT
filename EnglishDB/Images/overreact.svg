<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overreact</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərɪˈækt] v. 反应过度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (过度) + react (反应)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到一只小虫子，却"过度反应(over-react)"
    <tspan x="50" dy="25">得像看到了怪兽一样，跳起来大喊大叫。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She overreacted to the news and burst into tears.
  </text>
  <text x="50" y="310" class="content">
    她对那个消息反应过度，突然哭了起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person overreacting -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Exclamation mark -->
    <text x="60" y="90" class="image" font-size="40">!</text>
    <!-- Small insect -->
    <circle cx="150" cy="100" r="5" class="image" />
    <line x1="150" y1="105" x2="150" y2="115" class="image" />
    <line x1="150" y1="110" x2="140" y2="105" class="image" />
    <line x1="150" y1="110" x2="160" y2="105" class="image" />
  </g>
</svg>