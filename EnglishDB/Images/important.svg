<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">important</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpɔːrtnt] adj. 重要的，重大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + port (携带) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的包裹被"带入(im-port)"会议室，
    <tspan x="50" dy="25">这个包裹里装满了决定公司未来的"重要(important)"文件。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It is important to finish this project on time.
  </text>
  <text x="50" y="310" class="content">
    按时完成这个项目很重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Important package -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Label on package -->
    <text x="120" y="100" class="content" fill="#2C3E50">Important</text>
    <!-- People -->
    <circle cx="70" cy="150" r="15" class="image" />
    <circle cx="280" cy="150" r="15" class="image" />
    <line x1="70" y1="165" x2="70" y2="190" class="image" />
    <line x1="280" y1="165" x2="280" y2="190" class="image" />
    <line x1="70" y1="190" x2="50" y2="220" class="image" />
    <line x1="70" y1="190" x2="90" y2="220" class="image" />
    <line x1="280" y1="190" x2="260" y2="220" class="image" />
    <line x1="280" y1="190" x2="300" y2="220" class="image" />
  </g>
</svg>