<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #641E16; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">charcoal</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɑːrkəʊl] n. 木炭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> char (烧焦) + coal (煤)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块木头被"烧焦(char)"成了"煤(coal)"，
    <tspan x="50" dy="25">变成了黑色的木炭(charcoal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used charcoal to draw a portrait.
  </text>
  <text x="50" y="310" class="content">
    她用木炭画了一幅肖像。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Charred wood -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Charcoal -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Fire -->
    <circle cx="200" cy="150" r="20" class="image" />
    <circle cx="180" cy="130" r="15" class="image" />
    <circle cx="220" cy="130" r="15" class="image" />
    <circle cx="190" cy="110" r="10" class="image" />
    <circle cx="210" cy="110" r="10" class="image" />
  </g>
</svg>