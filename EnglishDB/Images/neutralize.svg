<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neutralize</text>
  <text x="50" y="120" class="subtitle">[ˈnjuːtrəlaɪz] v. 中和，使无效</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neuter (中性) + -ize (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学家在实验室里，"使(ize)"
    <tspan x="50" dy="25">两种化学物质"中性(neuter)"，</tspan>
    <tspan x="50" dy="25">从而中和(neutralize)它们的反应。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The antidote can neutralize the poison.
  </text>
  <text x="50" y="310" class="content">
    解毒剂可以中和毒药。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beaker -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Chemicals -->
    <circle cx="30" cy="50" r="20" class="image" />
    <circle cx="120" cy="50" r="20" class="image" />
    <!-- Neutralization -->
    <line x1="30" y1="80" x2="120" y2="80" class="image" />
    <line x1="75" y1="80" x2="75" y2="150" class="image" />
    <!-- Scientist -->
    <circle cx="75" cy="220" r="15" class="image" />
    <line x1="75" y1="235" x2="75" y2="270" class="image" />
    <line x1="75" y1="270" x2="60" y2="300" class="image" />
    <line x1="75" y1="270" x2="90" y2="300" class="image" />
    <line x1="75" y1="250" x2="100" y2="240" class="image" />
  </g>
</svg>