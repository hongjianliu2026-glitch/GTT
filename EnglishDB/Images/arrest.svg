<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arrest</text>
  <text x="50" y="120" class="subtitle">[əˈrest] v. 逮捕，阻止；n. 逮捕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ar- (加强) + rest (停留)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警察"加强停留(ar-rest)"在一个犯罪分子身上，
    <tspan x="50" dy="25">将他牢牢控制住，这就是逮捕(arrest)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police arrested the suspect at the scene.
  </text>
  <text x="50" y="310" class="content">
    警察在案发现场逮捕了嫌疑人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Police officer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Handcuffs -->
    <line x1="50" y1="180" x2="120" y2="180" class="image" />
    <circle cx="120" cy="180" r="10" class="image" />
    <!-- Suspect -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <line x1="150" y1="150" x2="190" y2="140" class="image" />
  </g>
</svg>