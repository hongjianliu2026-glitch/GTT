<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .dollar { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">multimillion-dollar</text>
  <text x="50" y="120" class="subtitle">[ˌmʌltiˈmɪljənˈdɑlər] adj. 数百万美元的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> multi- (多) + million (百万) + dollar (美元)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金库，里面堆满了"数百万(multi-million)"
    <tspan x="50" dy="25">美元的钞票，每一叠都闪闪发光，象征着巨额财富。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company secured a multimillion-dollar contract.
  </text>
  <text x="50" y="310" class="content">
    该公司获得了一份数百万美元的合同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vault -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dollar stacks -->
    <rect x="50" y="20" width="50" height="160" class="dollar" />
    <rect x="120" y="20" width="50" height="160" class="dollar" />
    <rect x="190" y="20" width="50" height="160" class="dollar" />
    <rect x="260" y="20" width="50" height="160" class="dollar" />
    <!-- Dollar signs -->
    <text x="55" y="110" class="dollar">$</text>
    <text x="125" y="110" class="dollar">$</text>
    <text x="195" y="110" class="dollar">$</text>
    <text x="265" y="110" class="dollar">$</text>
  </g>
</svg>