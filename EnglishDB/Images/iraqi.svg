<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Iraqi</text>
  <text x="50" y="120" class="subtitle">[ɪˈrɑːki] adj. 伊拉克的；n. 伊拉克人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自阿拉伯语 "عراقي" (ʿIrāqī)，意为“伊拉克的”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个身穿传统服饰的伊拉克人，站在古老的巴比伦遗址前，
    <tspan x="50" dy="25">他的服饰和背景都充满了伊拉克的文化特色。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Iraqi ambassador spoke about the rich history of his country.
  </text>
  <text x="50" y="310" class="content">
    伊拉克大使谈到了他国家的丰富历史。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional Iraqi clothing -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Head -->
    <circle cx="75" cy="30" r="20" class="image" />
    <!-- Arms -->
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Legs -->
    <line x1="50" y1="180" x2="50" y2="220" class="image" />
    <line x1="100" y1="180" x2="100" y2="220" class="image" />
    <!-- Babylonian ruins -->
    <rect x="180" y="0" width="200" height="200" class="image" />
    <rect x="200" y="20" width="160" height="160" class="image" />
    <line x1="220" y1="40" x2="340" y2="40" class="image" />
    <line x1="220" y1="80" x2="340" y2="80" class="image" />
    <line x1="220" y1="120" x2="340" y2="120" class="image" />
    <line x1="220" y1="160" x2="340" y2="160" class="image" />
  </g>
</svg>