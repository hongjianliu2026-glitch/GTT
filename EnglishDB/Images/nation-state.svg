<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nation-state</text>
  <text x="50" y="120" class="subtitle">[ˈneɪʃn steɪt] n. 民族国家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nation (民族) + state (国家)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪上，一个民族(nation)
    <tspan x="50" dy="25">的象征图案与一个国家的边界(state)完美融合，</tspan>
    <tspan x="50" dy="25">形成了一个独特的民族国家(nation-state)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concept of the nation-state has evolved over centuries.
  </text>
  <text x="50" y="310" class="content">
    民族国家的概念历经数个世纪的演变。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Nation symbol -->
    <rect x="125" y="50" width="100" height="100" class="image" />
    <!-- State boundary -->
    <line x1="95" y1="100" x2="255" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="125" y1="70" x2="225" y2="70" class="image" />
    <line x1="125" y1="130" x2="225" y2="130" class="image" />
  </g>
</svg>