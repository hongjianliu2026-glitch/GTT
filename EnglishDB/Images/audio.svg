<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">audio</text>
  <text x="50" y="120" class="subtitle">[ˈɔːdiəʊ] n. 音频，声音</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aud- (听) + -io (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的耳朵，"听(aud-)"
    <tspan x="50" dy="25">到了来自四面八方的声音，这些声音汇聚成音频(audio)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The audio quality of the recording was excellent.
  </text>
  <text x="50" y="310" class="content">
    录音的音质非常好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large ear -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="image" />
    <!-- Sound waves -->
    <line x1="25" y1="100" x2="325" y2="100" class="image" />
    <line x1="25" y1="80" x2="325" y2="80" class="image" />
    <line x1="25" y1="120" x2="325" y2="120" class="image" />
    <line x1="25" y1="60" x2="325" y2="60" class="image" />
    <line x1="25" y1="140" x2="325" y2="140" class="image" />
  </g>
</svg>