<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">musically</text>
  <text x="50" y="120" class="subtitle">[ˈmjuːzɪkəli] adv. 音乐地，和谐地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> music (音乐) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在舞台上，"音乐地(musically)"
    <tspan x="50" dy="25">演奏着美妙的旋律，整个场景充满了和谐与美感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She performed musically on the piano.
  </text>
  <text x="50" y="310" class="content">
    她在钢琴上和谐地演奏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Music notes -->
    <path d="M50 50 Q70 30 90 50 T130 50" class="image" />
    <path d="M50 80 Q70 60 90 80 T130 80" class="image" />
    <path d="M50 110 Q70 90 90 110 T130 110" class="image" />
    <!-- Musician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Piano -->
    <rect x="150" y="20" width="200" height="160" class="image" />
    <line x1="170" y1="40" x2="330" y2="40" class="image" />
    <line x1="170" y1="70" x2="330" y2="70" class="image" />
    <line x1="170" y1="100" x2="330" y2="100" class="image" />
    <line x1="170" y1="130" x2="330" y2="130" class="image" />
  </g>
</svg>