<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bagel { fill: #D4AC0D; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bagel</text>
  <text x="50" y="120" class="subtitle">[ˈbeɪɡəl] n. 百吉饼（一种面包圈）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自意第绪语 beygel，可能源自波兰语 bajgiel。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的百吉饼(bagel)，它像一个甜甜圈一样，
    <tspan x="50" dy="25">中间有一个洞，表面撒满了芝麻，散发着诱人的香气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a bagel with cream cheese for breakfast.
  </text>
  <text x="50" y="310" class="content">
    她早餐买了一个带奶油奶酪的百吉饼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bagel -->
    <circle cx="100" cy="100" r="60" class="bagel" />
    <circle cx="100" cy="100" r="50" class="bagel" />
    <circle cx="100" cy="100" r="40" class="bagel" />
    <circle cx="100" cy="100" r="30" class="bagel" />
    <circle cx="100" cy="100" r="20" class="bagel" />
    <circle cx="100" cy="100" r="10" class="bagel" />
    <!-- Hole in the bagel -->
    <circle cx="100" cy="100" r="5" class="bagel" />
    <!-- Sesame seeds -->
    <circle cx="70" cy="80" r="3" class="bagel" />
    <circle cx="130" cy="90" r="3" class="bagel" />
    <circle cx="90" cy="120" r="3" class="bagel" />
    <circle cx="110" cy="130" r="3" class="bagel" />
    <circle cx="140" cy="110" r="3" class="bagel" />
  </g>
</svg>