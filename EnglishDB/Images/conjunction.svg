<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conjunction</text>
  <text x="50" y="120" class="subtitle">[kənˈdʒʌŋkʃən] n. 连词，结合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + junct (连接) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个巨大的字母"A"和"B"被一条闪亮的链条"连接(junct)"在一起，
    <tspan x="50" dy="25">形成了一个"结合(conjunction)"的画面，象征着连词的作用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The conjunction "and" connects the two sentences.
  </text>
  <text x="50" y="310" class="content">
    连词"and"连接了这两个句子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two letters connected by a chain -->
    <text x="0" y="0" font-size="100" class="image">A</text>
    <text x="150" y="0" font-size="100" class="image">B</text>
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
  </g>
</svg>