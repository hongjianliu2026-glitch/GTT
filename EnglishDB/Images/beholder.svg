<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beholder</text>
  <text x="50" y="120" class="subtitle">[bɪˈhoʊldər] n. 旁观者，观看者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + hold (持有) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的眼睛，"持有(hold)"着整个世界，
    <tspan x="50" dy="25">这个眼睛的主人就是旁观者(beholder)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Beauty is in the eye of the beholder.
  </text>
  <text x="50" y="310" class="content">
    美是旁观者眼中的美。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="image" fill="#2C3E50" />
    <!-- World -->
    <circle cx="100" cy="100" r="150" class="image" stroke-dasharray="10,5" />
    <!-- Land -->
    <rect x="20" y="150" width="160" height="50" class="image" fill="#2ECC71" />
    <!-- Water -->
    <rect x="20" y="200" width="160" height="50" class="image" fill="#3498DB" />
  </g>
</svg>