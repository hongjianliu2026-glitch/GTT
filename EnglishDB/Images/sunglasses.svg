<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunglasses</text>
  <text x="50" y="120" class="subtitle">[ˈsʌnˌɡlæsɪz] n. 太阳镜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + glass (玻璃) + -es (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个炎热的夏日，太阳(sun)高照，
    <tspan x="50" dy="25">你戴上用玻璃(glass)制成的太阳镜(sunglasses)，</tspan>
    <tspan x="50" dy="25">瞬间感觉世界变得清凉而清晰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore her sunglasses to protect her eyes from the bright sun.
  </text>
  <text x="50" y="310" class="content">
    她戴上太阳镜以保护眼睛免受强光的伤害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#FDB813" />
    <!-- Sunglasses -->
    <rect x="50" y="150" width="100" height="20" fill="#000" />
    <rect x="40" y="150" width="120" height="50" fill="#000" />
    <rect x="50" y="150" width="100" height="50" fill="#FFF" />
    <!-- Person -->
    <circle cx="100" cy="250" r="30" fill="#FFD1DC" />
    <line x1="100" y1="280" x2="100" y2="350" stroke="#FFD1DC" stroke-width="10" />
    <line x1="100" y1="350" x2="70" y2="400" stroke="#FFD1DC" stroke-width="10" />
    <line x1="100" y1="350" x2="130" y2="400" stroke="#FFD1DC" stroke-width="10" />
    <line x1="100" y1="300" x2="50" y2="320" stroke="#FFD1DC" stroke-width="10" />
    <line x1="100" y1="300" x2="150" y2="320" stroke="#FFD1DC" stroke-width="10" />
  </g>
</svg>