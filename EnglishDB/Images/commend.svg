<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commend</text>
  <text x="50" y="120" class="subtitle">[kəˈmend] v. 表扬，推荐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (加强) + mend (委托)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在会议上，"加强委托(com-mend)"
    <tspan x="50" dy="25">某人，表示对其工作的认可和推荐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher commended her for her hard work.
  </text>
  <text x="50" y="310" class="content">
    老师表扬了她的努力工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person speaking -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M100,100 Q150,80 200,100 Q150,120 100,100" class="image" />
    <text x="120" y="110" class="content" text-anchor="middle">Good job!</text>
  </g>
</svg>