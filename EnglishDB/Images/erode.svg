<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">erode</text>
  <text x="50" y="120" class="subtitle">[ɪˈroʊd] v. 侵蚀，腐蚀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (向外) + rod (咬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块岩石，"向外咬(e-rod)"
    <tspan x="50" dy="25">出一个个小洞，这些小洞逐渐扩大，</tspan>
    <tspan x="50" dy="25">最终导致岩石被侵蚀(erode)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coastline is slowly eroding due to the strong waves.
  </text>
  <text x="50" y="310" class="content">
    由于强浪，海岸线正在慢慢被侵蚀。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rock -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Eroded holes -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="120" r="25" class="image" />
    <circle cx="250" cy="80" r="30" class="image" />
    <!-- Water waves -->
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <line x1="0" y1="190" x2="350" y2="190" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>