<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jockey</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɒki] n. 骑师；v. 操纵，耍手段</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> joc (游戏) + key (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骑师在赛马场上，"游戏(joc)中的人(key)"
    <tspan x="50" dy="25">，他通过巧妙的操纵(jockey)来赢得比赛。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jockey skillfully maneuvered his horse to win the race.
  </text>
  <text x="50" y="310" class="content">
    骑师巧妙地操纵他的马赢得了比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Horse head -->
    <line x1="80" y1="100" x2="150" y2="100" class="image" /> <!-- Horse neck -->
    <line x1="150" y1="100" x2="200" y2="50" class="image" /> <!-- Horse back -->
    <line x1="200" y1="50" x2="250" y2="100" class="image" /> <!-- Horse rear -->
    <line x1="250" y1="100" x2="300" y2="100" class="image" /> <!-- Horse tail -->
    <!-- Jockey -->
    <circle cx="120" cy="80" r="15" class="image" /> <!-- Jockey head -->
    <line x1="120" y1="95" x2="120" y2="130" class="image" /> <!-- Jockey body -->
    <line x1="120" y1="130" x2="100" y2="160" class="image" /> <!-- Jockey left leg -->
    <line x1="120" y1="130" x2="140" y2="160" class="image" /> <!-- Jockey right leg -->
    <line x1="120" y1="110" x2="150" y2="100" class="image" /> <!-- Jockey arm -->
  </g>
</svg>