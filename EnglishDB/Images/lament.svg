<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lament</text>
  <text x="50" y="120" class="subtitle">[ləˈment] v. 哀悼，悲叹；n. 哀歌，挽歌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> la- (离开) + ment (心)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为失去亲人而"心离开(la-ment)"，
    <tspan x="50" dy="25">他悲痛欲绝，唱着哀歌(lament)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She lamented the loss of her beloved pet.
  </text>
  <text x="50" y="310" class="content">
    她为失去心爱的宠物而悲叹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Heart -->
    <path d="M70,100 C70,50 120,50 120,100 C120,150 70,150 70,100 Z" class="image" />
    <!-- Broken heart -->
    <line x1="70" y1="100" x2="120" y2="100" class="image" />
    <!-- Tears -->
    <circle cx="20" cy="90" r="5" class="image" />
    <circle cx="25" cy="85" r="5" class="image" />
    <circle cx="30" cy="80" r="5" class="image" />
  </g>
</svg>