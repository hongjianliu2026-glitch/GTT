<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">giving</text>
  <text x="50" y="120" class="subtitle">[ˈɡɪvɪŋ] n. 给予，赠送；adj. 慷慨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> give (给予) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人双手捧着礼物，"正在给予(giving)"
    <tspan x="50" dy="25">的动作，这个动作充满了慷慨和善意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her giving nature made her popular among friends.
  </text>
  <text x="50" y="310" class="content">
    她慷慨的性格使她在朋友中很受欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with gift -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left arm -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="20" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="80" y2="180" class="image" /> <!-- Right leg -->
    <!-- Gift box -->
    <rect x="70" y="120" width="40" height="30" class="image" />
    <line x1="70" y1="135" x2="110" y2="135" class="image" />
  </g>
</svg>