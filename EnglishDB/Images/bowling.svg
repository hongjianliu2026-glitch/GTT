<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bowling</text>
  <text x="50" y="120" class="subtitle">[ˈboʊlɪŋ] n. 保龄球运动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bowl (碗) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的碗(bowl)，里面滚动着保龄球，
    <tspan x="50" dy="25">人们正在玩保龄球运动(bowling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They went bowling on Saturday night.
  </text>
  <text x="50" y="310" class="content">
    他们周六晚上去打保龄球了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowling alley -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bowling pins -->
    <polygon points="50,20 70,20 80,40 60,40" class="image" />
    <polygon points="90,20 110,20 120,40 100,40" class="image" />
    <polygon points="70,40 90,40 100,60 80,60" class="image" />
    <polygon points="110,40 130,40 140,60 120,60" class="image" />
    <!-- Bowling ball -->
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Person -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>