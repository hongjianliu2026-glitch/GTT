<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peninsula</text>
  <text x="50" y="120" class="subtitle">[pəˈnɪnsələ] n. 半岛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pen- (几乎) + insula (岛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"几乎(pen-)"是一个"岛(insula)"的地方，
    <tspan x="50" dy="25">它被水包围，但仍然与大陆相连，这就是半岛(peninsula)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Italy is a peninsula surrounded by the Mediterranean Sea.
  </text>
  <text x="50" y="310" class="content">
    意大利是一个被地中海包围的半岛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#3498DB" />
    <!-- Peninsula -->
    <rect x="150" y="20" width="150" height="160" class="image" fill="#F1C40F" />
    <!-- Connection to main land -->
    <line x1="150" y1="180" x2="150" y2="200" class="image" />
  </g>
</svg>