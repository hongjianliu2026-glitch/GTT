<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mascara</text>
  <text x="50" y="120" class="subtitle">[mæˈskɑːrə] n. 睫毛膏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> masque (面具) + ara (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女人戴着面具(masque)，用睫毛膏(mascara)
    <tspan x="50" dy="25">刷出浓密的眼睫毛，就像面具上的装饰一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She applied mascara to her lashes before the party.
  </text>
  <text x="50" y="310" class="content">
    她在派对前给睫毛涂上了睫毛膏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mascara tube -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <!-- Brush -->
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <line x1="40" y1="10" x2="60" y2="10" class="image" />
    <line x1="40" y1="30" x2="60" y2="30" class="image" />
    <line x1="40" y1="50" x2="60" y2="50" class="image" />
    <!-- Eye with lashes -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="160" y1="80" x2="240" y2="80" class="image" />
    <line x1="170" y1="60" x2="230" y2="60" class="image" />
    <line x1="180" y1="40" x2="220" y2="40" class="image" />
  </g>
</svg>