<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .snowflake { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snowfall</text>
  <text x="50" y="120" class="subtitle">[ˈsnoʊfɔːl] n. 降雪，雪量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snow (雪) + fall (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片雪花从天空中"落下(fall)"，
    <tspan x="50" dy="25">无数的雪花一起落下，形成了降雪(snowfall)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snowfall last night was the heaviest in years.
  </text>
  <text x="50" y="310" class="content">
    昨晚的降雪是多年来最严重的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Snowflakes -->
    <circle cx="50" cy="50" r="10" class="snowflake" />
    <circle cx="100" cy="70" r="10" class="snowflake" />
    <circle cx="150" cy="90" r="10" class="snowflake" />
    <circle cx="200" cy="110" r="10" class="snowflake" />
    <circle cx="250" cy="130" r="10" class="snowflake" />
    <circle cx="300" cy="150" r="10" class="snowflake" />
    <!-- Snow on ground -->
    <rect x="0" y="180" width="350" height="20" class="image" fill="#E0E0E0" />
  </g>
</svg>