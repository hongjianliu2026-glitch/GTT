<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">howling</text>
  <text x="50" y="120" class="subtitle">[ˈhaʊlɪŋ] adj. 嚎叫的，咆哮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> howl (嚎叫) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狼在夜晚的森林中，"嚎叫(howl)"
    <tspan x="50" dy="25">的声音回荡在整个山谷，这就是"嚎叫的(howling)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wind made a howling sound through the trees.
  </text>
  <text x="50" y="310" class="content">
    风在树间发出了嚎叫般的声音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="175" cy="100" r="50" fill="#F1C40F" />
    <!-- Forest -->
    <rect x="0" y="200" width="350" height="100" fill="#2C3E50" />
    <!-- Wolf -->
    <circle cx="175" cy="180" r="20" fill="#7F8C8D" />
    <line x1="175" y1="200" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="150" y2="280" class="image" />
    <line x1="175" y1="250" x2="200" y2="280" class="image" />
    <line x1="175" y1="230" x2="130" y2="220" class="image" />
    <line x1="175" y1="230" x2="220" y2="220" class="image" />
    <!-- Howling sound waves -->
    <path d="M175 150 Q175 100 225 150" stroke="#E74C3C" stroke-width="3" fill="none" />
    <path d="M175 150 Q175 100 125 150" stroke="#E74C3C" stroke-width="3" fill="none" />
    <path d="M175 150 Q175 100 275 150" stroke="#E74C3C" stroke-width="3" fill="none" />
    <path d="M175 150 Q175 100 75 150" stroke="#E74C3C" stroke-width="3" fill="none" />
  </g>
</svg>