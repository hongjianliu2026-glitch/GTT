<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entomologist</text>
  <text x="50" y="120" class="subtitle">[ˌɛntəˈmɒlədʒɪst] n. 昆虫学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ento- (内部) + -mology (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个昆虫学家，深入研究(ento-)昆虫的内部结构和行为，
    <tspan x="50" dy="25">就像一个探险家深入丛林，探索未知的领域。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The entomologist studied the life cycle of butterflies.
  </text>
  <text x="50" y="310" class="content">
    这位昆虫学家研究了蝴蝶的生命周期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microscope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="130" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <!-- Insect -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="200" y2="150" class="image" />
    <line x1="190" y1="120" x2="210" y2="120" class="image" />
    <line x1="190" y1="140" x2="210" y2="140" class="image" />
    <!-- Entomologist -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>