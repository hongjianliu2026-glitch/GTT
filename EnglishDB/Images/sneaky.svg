<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sneaky</text>
  <text x="50" y="120" class="subtitle">[ˈsniːki] adj. 偷偷摸摸的，鬼鬼祟祟的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sneak (偷偷地走) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在黑暗中"偷偷地走(sneak)"，
    <tspan x="50" dy="25">它的动作如此轻巧，以至于你几乎察觉不到它的存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sneaky thief stole the jewels without anyone noticing.
  </text>
  <text x="50" y="310" class="content">
    那个鬼鬼祟祟的小偷在无人察觉的情况下偷走了珠宝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cat silhouette -->
    <path d="M50 100 C50 50, 100 50, 100 100 S150 150, 200 100" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="90" r="5" class="image" />
    <circle cx="130" cy="90" r="5" class="image" />
    <!-- Tail -->
    <path d="M200 100 Q250 150, 300 100" class="image" />
  </g>
</svg>