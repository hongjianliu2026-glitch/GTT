<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laughter</text>
  <text x="50" y="120" class="subtitle">[ˈlɑːftər] n. 笑声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> laugh (笑) + -ter (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一个巨大的笑声泡泡中，"笑(laugh)"
    <tspan x="50" dy="25">声不断回荡，形成了一片欢乐的海洋(laughter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was filled with laughter after the comedian's joke.
  </text>
  <text x="50" y="310" class="content">
    喜剧演员的笑话让房间里充满了笑声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bubble -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Faces -->
    <circle cx="120" cy="80" r="20" class="image" />
    <circle cx="230" cy="80" r="20" class="image" />
    <!-- Mouths -->
    <path d="M100,120 Q120,140 140,120" class="image" />
    <path d="M210,120 Q230,140 250,120" class="image" />
    <!-- Eyes -->
    <circle cx="110" cy="70" r="5" class="image" />
    <circle cx="220" cy="70" r="5" class="image" />
  </g>
</svg>