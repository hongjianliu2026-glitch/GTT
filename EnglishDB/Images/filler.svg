<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">filler</text>
  <text x="50" y="120" class="subtitle">[ˈfɪlər] n. 填充物，填充剂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fill (填充) + -er (名词后缀，表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的空洞，"填充物(filler)"
    <tspan x="50" dy="25">被用来填补这个空洞，使其变得充实。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pillow needs more filler to be comfortable.
  </text>
  <text x="50" y="310" class="content">
    这个枕头需要更多的填充物才能舒适。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hole -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Filler -->
    <rect x="50" y="50" width="200" height="200" class="image" />
    <!-- Filler inside the hole -->
    <rect x="75" y="75" width="150" height="150" class="image" />
  </g>
</svg>