<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">methadone</text>
  <text x="50" y="120" class="subtitle">[ˈmɛθəˌdoʊn] n. 美沙酮（一种镇痛药）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> metha- (来自希腊语metha，意为“中间”) + done (完成)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在中间(metha-)阶段，完成(done)
    <tspan x="50" dy="25">治疗病人的疼痛，这个药物就是美沙酮(methadone)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Methadone is often used in the treatment of opioid addiction.
  </text>
  <text x="50" y="310" class="content">
    美沙酮常用于治疗阿片类药物成瘾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pill bottle -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Pills -->
    <circle cx="30" cy="50" r="10" class="image" />
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />
    <circle cx="30" cy="90" r="10" class="image" />
    <circle cx="70" cy="90" r="10" class="image" />
    <circle cx="110" cy="90" r="10" class="image" />
    <!-- Doctor -->
    <circle cx="75" cy="150" r="20" class="image" />
    <line x1="75" y1="170" x2="75" y2="200" class="image" />
    <line x1="75" y1="170" x2="55" y2="190" class="image" />
    <line x1="75" y1="170" x2="95" y2="190" class="image" />
    <line x1="75" y1="200" x2="55" y2="220" class="image" />
    <line x1="75" y1="200" x2="95" y2="220" class="image" />
  </g>
</svg>