<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">owl</text>
  <text x="50" y="120" class="subtitle">[aʊl] n. 猫头鹰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "uwl"，与古英语 "uhu" 相关，意为猫头鹰。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫头鹰在夜晚的森林中，"瞪大眼睛(owl)"
    <tspan x="50" dy="25">捕捉猎物，它的眼睛如同夜空中的星星，闪烁着智慧的光芒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The owl hooted softly in the moonlight.
  </text>
  <text x="50" y="310" class="content">
    猫头鹰在月光下轻轻地叫着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Owl body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Owl head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Owl eyes -->
    <circle cx="80" cy="40" r="10" class="image" />
    <circle cx="120" cy="40" r="10" class="image" />
    <!-- Owl beak -->
    <polygon points="90,60 110,60 100,70" class="image" />
    <!-- Owl wings -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
  </g>
</svg>