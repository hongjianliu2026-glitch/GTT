<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vest</text>
  <text x="50" y="120" class="subtitle">[vɛst] n. 背心，马甲；v. 授予，赋予</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vest (衣服)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着背心(vest)的人，背心紧紧贴在身上，
    <tspan x="50" dy="25">仿佛它"赋予(vest)"了这个人一种特别的风格和自信。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a black vest over his shirt.
  </text>
  <text x="50" y="310" class="content">
    他在衬衫外面穿了一件黑色背心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Vest -->
    <rect x="50" y="50" width="200" height="100" class="image" />
    <!-- Sleeves -->
    <line x1="70" y1="50" x2="70" y2="150" class="image" />
    <line x1="230" y1="50" x2="230" y2="150" class="image" />
    <!-- Buttons -->
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="130" cy="100" r="5" class="image" />
    <circle cx="160" cy="100" r="5" class="image" />
    <circle cx="190" cy="100" r="5" class="image" />
    <!-- Person -->
    <circle cx="150" cy="200" r="30" class="image" />
    <line x1="150" y1="230" x2="150" y2="300" class="image" />
    <line x1="150" y1="300" x2="120" y2="350" class="image" />
    <line x1="150" y1="300" x2="180" y2="350" class="image" />
    <line x1="150" y1="250" x2="100" y2="280" class="image" />
    <line x1="150" y1="250" x2="200" y2="280" class="image" />
  </g>
</svg>