<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contemporary</text>
  <text x="50" y="120" class="subtitle">[kənˈtempərəri] adj. 当代的，同时代的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + tempor (时间) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人站在一个巨大的时钟前，"共同(con-)"
    <tspan x="50" dy="25">分享着"时间(tempor)"，他们就是"当代的(contemporary)"人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Contemporary art often challenges traditional norms.
  </text>
  <text x="50" y="310" class="content">
    当代艺术常常挑战传统规范。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- People -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="175" cy="180" r="15" class="image" />
    <!-- Lines connecting people -->
    <line x1="115" y1="100" x2="235" y2="100" class="image" />
    <line x1="175" y1="115" x2="175" y2="165" class="image" />
  </g>
</svg>