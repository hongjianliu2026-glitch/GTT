<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cosmos</text>
  <text x="50" y="120" class="subtitle">[ˈkɒzmɒs] n. 宇宙，秩序</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cosmo- (宇宙) + -s (表示复数或集合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宇宙，"宇宙(cosmo-)"中充满了无数的星系和行星，
    <tspan x="50" dy="25">它们共同构成了一个有序的"宇宙(cosmos)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cosmos is full of mysteries waiting to be discovered.
  </text>
  <text x="50" y="310" class="content">
    宇宙充满了等待被发现的奥秘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cosmic background -->
    <circle cx="175" cy="100" r="150" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="250" cy="80" r="5" class="image" />
    <circle cx="150" cy="150" r="5" class="image" />
    <circle cx="200" cy="120" r="5" class="image" />
    <!-- Planets -->
    <circle cx="75" cy="100" r="20" class="image" />
    <circle cx="225" cy="100" r="25" class="image" />
    <!-- Orbit lines -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <ellipse cx="175" cy="100" rx="130" ry="65" class="image" />
  </g>
</svg>