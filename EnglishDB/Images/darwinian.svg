<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Darwinian</text>
  <text x="50" y="120" class="subtitle">[dɑːrˈwɪniən] adj. 达尔文主义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Darwin (达尔文) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的进化树，树干上写着"达尔文(Darwin)"，
    <tspan x="50" dy="25">树枝上长满了各种生物，象征着达尔文主义的进化论。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Darwinian theory of evolution is widely accepted.
  </text>
  <text x="50" y="310" class="content">
    达尔文主义的进化论被广泛接受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Evolution tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="175" y1="60" x2="125" y2="100" class="image" />
    <line x1="175" y1="60" x2="225" y2="100" class="image" />
    <line x1="125" y1="100" x2="75" y2="140" class="image" />
    <line x1="125" y1="100" x2="175" y2="140" class="image" />
    <line x1="225" y1="100" x2="175" y2="140" class="image" />
    <line x1="225" y1="100" x2="275" y2="140" class="image" />
    <!-- Darwin label -->
    <text x="150" y="40" class="content" text-anchor="middle">Darwin</text>
    <!-- Animals -->
    <circle cx="75" cy="140" r="10" class="image" />
    <circle cx="175" cy="140" r="10" class="image" />
    <circle cx="275" cy="140" r="10" class="image" />
  </g>
</svg>