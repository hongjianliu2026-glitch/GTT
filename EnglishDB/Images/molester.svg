<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">molester</text>
  <text x="50" y="120" class="subtitle">[məˈlestər] n. 骚扰者，滋扰者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> moles (骚扰) + -ter (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"骚扰者(molester)"在街上，不停地"骚扰(moles)"
    <tspan x="50" dy="25">行人，让人感到不安和困扰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The molester was arrested by the police.
  </text>
  <text x="50" y="310" class="content">
    那个骚扰者被警察逮捕了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Molester -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Hand reaching out -->
    <line x1="200" y1="120" x2="50" y2="120" class="image" />
  </g>
</svg>