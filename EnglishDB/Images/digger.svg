<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">digger</text>
  <text x="50" y="120" class="subtitle">[ˈdɪɡər] n. 挖掘者，挖掘机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dig (挖) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的挖掘机在工地上，"挖(dig)"
    <tspan x="50" dy="25">掘泥土，这个挖掘机就是digger。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The digger was used to excavate the foundation.
  </text>
  <text x="50" y="310" class="content">
    挖掘机被用来挖掘地基。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Digger -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bucket -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Arm -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="200" y2="20" class="image" />
    <!-- Body -->
    <rect x="150" y="120" width="100" height="60" class="image" />
    <!-- Wheels -->
    <circle cx="170" cy="190" r="20" class="image" />
    <circle cx="230" cy="190" r="20" class="image" />
  </g>
</svg>