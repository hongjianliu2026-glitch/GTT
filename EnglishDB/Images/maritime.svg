<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maritime</text>
  <text x="50" y="120" class="subtitle">[ˈmærɪtaɪm] adj. 海事的，海运的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar (海) + -itime (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的海洋(mar)，上面漂浮着一艘巨大的船只，
    <tspan x="50" dy="25">船上装满了货物，这就是海事(maritime)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company specializes in maritime logistics.
  </text>
  <text x="50" y="310" class="content">
    这家公司专门从事海运物流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#4CAF50" />
    <!-- Ship -->
    <rect x="100" y="50" width="150" height="50" class="image" fill="#FFC107" />
    <rect x="120" y="30" width="30" height="20" class="image" fill="#FF5722" />
    <rect x="170" y="30" width="30" height="20" class="image" fill="#FF5722" />
    <rect x="220" y="30" width="30" height="20" class="image" fill="#FF5722" />
    <!-- Waves -->
    <path d="M0 100 Q50 150 100 100 T200 100" class="image" stroke="#2196F3" stroke-width="3" fill="none" />
    <path d="M0 120 Q50 170 100 120 T200 120" class="image" stroke="#2196F3" stroke-width="3" fill="none" />
    <path d="M0 140 Q50 190 100 140 T200 140" class="image" stroke="#2196F3" stroke-width="3" fill="none" />
  </g>
</svg>