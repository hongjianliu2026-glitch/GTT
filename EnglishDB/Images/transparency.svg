<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transparency</text>
  <text x="50" y="120" class="subtitle">[trænsˈpærənsi] n. 透明，透明度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (穿过) + pare (出现) + -ency (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个玻璃窗，光线"穿过(trans-)"它，"出现(pare)"在外面，
    <tspan x="50" dy="25">这种"透明(transparency)"让人一目了然。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's financial transparency is crucial for investor trust.
  </text>
  <text x="50" y="310" class="content">
    公司的财务透明度对投资者信任至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass window -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Light rays -->
    <line x1="175" y1="20" x2="175" y2="200" class="image" />
    <line x1="125" y1="20" x2="125" y2="200" class="image" />
    <line x1="225" y1="20" x2="225" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="100" r="30" class="image" />
  </g>
</svg>