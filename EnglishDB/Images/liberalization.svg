<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liberalization</text>
  <text x="50" y="120" class="subtitle">[ˌlɪbərələˈzeɪʃən] n. 自由化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liber (自由) + -al (形容词后缀) + -ization (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被束缚的人突然获得自由，"解放(liber-al-ization)"
    <tspan x="50" dy="25">他的双手，象征着自由化的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government's policy of economic liberalization has boosted the market.
  </text>
  <text x="50" y="310" class="content">
    政府的经济自由化政策促进了市场的发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chains -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <!-- Hands -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Broken chains -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <!-- Free hands -->
    <line x1="50" y1="100" x2="0" y2="130" class="image" />
    <line x1="50" y1="100" x2="100" y2="130" class="image" />
    <line x1="100" y1="100" x2="50" y2="130" class="image" />
    <line x1="100" y1="100" x2="150" y2="130" class="image" />
    <line x1="150" y1="100" x2="100" y2="130" class="image" />
    <line x1="150" y1="100" x2="200" y2="130" class="image" />
  </g>
</svg>