<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .chimney { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chimney</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɪmni] n. 烟囱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chin (下巴) + -ey (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个烟囱像一个巨大的"下巴(chin)"，
    <tspan x="50" dy="25">吐出滚滚浓烟，就像在说话一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chimney on the roof was emitting smoke.
  </text>
  <text x="50" y="310" class="content">
    屋顶上的烟囱正在冒烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Chimney -->
    <rect x="0" y="0" width="100" height="200" class="chimney" />
    <!-- Smoke -->
    <circle cx="50" cy="20" r="20" class="image" />
    <circle cx="50" cy="50" r="25" class="image" />
    <circle cx="50" cy="80" r="30" class="image" />
    <circle cx="50" cy="110" r="35" class="image" />
  </g>
</svg>