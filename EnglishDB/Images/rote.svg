<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rote</text>
  <text x="50" y="120" class="subtitle">[roʊt] n. 死记硬背</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rote (源自拉丁语 rota，意为“轮子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生像轮子一样不停地转动，"死记硬背(rote)"
    <tspan x="50" dy="25">课本上的内容，直到滚瓜烂熟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She learned the poem by rote.
  </text>
  <text x="50" y="310" class="content">
    她通过死记硬背学会了这首诗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wheel -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Student -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Book -->
    <rect x="250" y="80" width="50" height="40" class="image" />
    <line x1="260" y1="85" x2="260" y2="115" class="image" />
    <line x1="270" y1="85" x2="270" y2="115" class="image" />
    <line x1="280" y1="85" x2="280" y2="115" class="image" />
  </g>
</svg>