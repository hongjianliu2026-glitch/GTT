<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lowly</text>
  <text x="50" y="120" class="subtitle">[ˈloʊli] adj. 卑微的，低下的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> low (低) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"低(low)"到尘埃里的人，他的地位"卑微(lowly)"，
    <tspan x="50" dy="25">仿佛被世界遗忘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was born into a lowly family but achieved great success.
  </text>
  <text x="50" y="310" class="content">
    他出身卑微，但取得了巨大的成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Person -->
    <circle cx="175" cy="160" r="15" class="image" />
    <line x1="175" y1="175" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="160" y2="210" class="image" />
    <line x1="175" y1="190" x2="190" y2="210" class="image" />
    <line x1="175" y1="180" x2="150" y2="170" class="image" />
    <line x1="175" y1="180" x2="200" y2="170" class="image" />
    <!-- Dust -->
    <circle cx="175" cy="165" r="5" class="image" />
    <circle cx="165" cy="165" r="5" class="image" />
    <circle cx="185" cy="165" r="5" class="image" />
  </g>
</svg>