<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soiled</text>
  <text x="50" y="120" class="subtitle">[sɔɪld] adj. 弄脏的，污秽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soil (泥土) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在泥地里打滚，"泥土(soil)"
    <tspan x="50" dy="25">沾满了它的毛发，变得"弄脏的(soiled)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The white shirt was soiled after playing in the garden.
  </text>
  <text x="50" y="310" class="content">
    在花园里玩耍后，白衬衫被弄脏了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mud puddle -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#8B4513" />
    <!-- Cat -->
    <circle cx="100" cy="100" r="30" class="image" fill="#000000" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="140" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <line x1="100" y1="180" x2="70" y2="200" class="image" />
    <line x1="100" y1="180" x2="130" y2="200" class="image" />
    <!-- Dirt spots -->
    <circle cx="150" cy="80" r="10" class="image" fill="#8B4513" />
    <circle cx="180" cy="120" r="10" class="image" fill="#8B4513" />
    <circle cx="200" cy="90" r="10" class="image" fill="#8B4513" />
  </g>
</svg>