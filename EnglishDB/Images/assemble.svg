<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">assemble</text>
  <text x="50" y="120" class="subtitle">[əˈsembl] v. 集合，装配</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> as- (朝向) + semble (一起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群零件"朝向(as-)"一起"semble"，
    <tspan x="50" dy="25">它们被装配成一个完整的机器。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The workers assembled the car in just two hours.
  </text>
  <text x="50" y="310" class="content">
    工人们仅用两个小时就组装好了汽车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parts -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <rect x="160" y="40" width="30" height="30" class="image" />
    <rect x="220" y="35" width="35" height="35" class="image" />
    <!-- Assembled machine -->
    <rect x="50" y="100" width="200" height="100" class="image" />
    <line x1="70" y1="120" x2="230" y2="120" class="image" />
    <line x1="70" y1="140" x2="230" y2="140" class="image" />
    <line x1="70" y1="160" x2="230" y2="160" class="image" />
    <line x1="70" y1="180" x2="230" y2="180" class="image" />
  </g>
</svg>