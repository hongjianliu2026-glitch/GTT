<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uproar</text>
  <text x="50" y="120" class="subtitle">[ˈʌprɔːr] n. 喧嚣，骚动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + roar (吼叫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在街头，"向上吼叫(up-roar)"，
    <tspan x="50" dy="25">声音震天，场面一片混乱，这就是喧嚣(uproar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd's uproar was deafening after the goal.
  </text>
  <text x="50" y="310" class="content">
    进球后人群的喧嚣震耳欲聋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Roaring mouths -->
    <rect x="40" y="60" width="20" height="10" class="image" />
    <rect x="90" y="60" width="20" height="10" class="image" />
    <rect x="140" y="60" width="20" height="10" class="image" />
    <rect x="190" y="60" width="20" height="10" class="image" />
    <rect x="240" y="60" width="20" height="10" class="image" />
    <!-- Sound waves -->
    <line x1="50" y1="80" x2="50" y2="100" class="image" />
    <line x1="100" y1="80" x2="100" y2="100" class="image" />
    <line x1="150" y1="80" x2="150" y2="100" class="image" />
    <line x1="200" y1="80" x2="200" y2="100" class="image" />
    <line x1="250" y1="80" x2="250" y2="100" class="image" />
  </g>
</svg>