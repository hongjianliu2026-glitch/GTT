<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">statute</text>
  <text x="50" y="120" class="subtitle">[ˈstætʃuːt] n. 法令，法规</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stat (站立) + -ute (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石碑"站立(stat)"在广场上，上面刻满了法律条文，
    <tspan x="50" dy="25">这些条文就是"法令(statute)"，每个人都必须遵守。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new statute prohibits smoking in public places.
  </text>
  <text x="50" y="310" class="content">
    新的法令禁止在公共场所吸烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone tablet -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Law text -->
    <text x="50" y="50" class="content">Law</text>
    <text x="50" y="80" class="content">Law</text>
    <text x="50" y="110" class="content">Law</text>
    <text x="50" y="140" class="content">Law</text>
    <!-- Stone texture -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="0" class="image" />
  </g>
</svg>