<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">economics</text>
  <text x="50" y="120" class="subtitle">[ˌiːkəˈnɒmɪks] n. 经济学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eco- (家) + nom (管理) + -ics (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个经济学家在管理一个"家庭(eco-)"的资源，
    <tspan x="50" dy="25">通过精明的"管理(nom)"，确保家庭的繁荣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She majored in economics at university.
  </text>
  <text x="50" y="310" class="content">
    她在大学主修经济学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <line x1="100" y1="20" x2="100" y2="0" class="image" />
    <line x1="20" y1="20" x2="100" y2="0" class="image" />
    <line x1="180" y1="20" x2="100" y2="0" class="image" />
    <!-- Economist -->
    <circle cx="100" cy="180" r="15" class="image" />
    <line x1="100" y1="195" x2="100" y2="230" class="image" />
    <line x1="100" y1="230" x2="80" y2="260" class="image" />
    <line x1="100" y1="230" x2="120" y2="260" class="image" />
    <line x1="100" y1="210" x2="130" y2="200" class="image" />
    <!-- Money -->
    <rect x="150" y="10" width="30" height="20" class="image" />
    <rect x="150" y="40" width="30" height="20" class="image" />
    <rect x="150" y="70" width="30" height="20" class="image" />
  </g>
</svg>