<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stalemate</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪlmeɪt] n. 僵局，和棋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stale (陈旧的) + mate (伙伴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个棋手在棋盘前，"陈旧的伙伴(stale-mate)"
    <tspan x="50" dy="25">无法再进一步，陷入了僵局(stalemate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The negotiations reached a stalemate.
  </text>
  <text x="50" y="310" class="content">
    谈判陷入了僵局。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chessboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Chess pieces -->
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <!-- Chessboard squares -->
    <rect x="70" y="40" width="30" height="30" class="image" />
    <rect x="110" y="40" width="30" height="30" class="image" />
    <rect x="150" y="40" width="30" height="30" class="image" />
    <rect x="190" y="40" width="30" height="30" class="image" />
    <rect x="230" y="40" width="30" height="30" class="image" />
    <rect x="70" y="80" width="30" height="30" class="image" />
    <rect x="110" y="80" width="30" height="30" class="image" />
    <rect x="150" y="80" width="30" height="30" class="image" />
    <rect x="190" y="80" width="30" height="30" class="image" />
    <rect x="230" y="80" width="30" height="30" class="image" />
    <rect x="70" y="120" width="30" height="30" class="image" />
    <rect x="110" y="120" width="30" height="30" class="image" />
    <rect x="150" y="120" width="30" height="30" class="image" />
    <rect x="190" y="120" width="30" height="30" class="image" />
    <rect x="230" y="120" width="30" height="30" class="image" />
    <rect x="70" y="160" width="30" height="30" class="image" />
    <rect x="110" y="160" width="30" height="30" class="image" />
    <rect x="150" y="160" width="30" height="30" class="image" />
    <rect x="190" y="160" width="30" height="30" class="image" />
    <rect x="230" y="160" width="30" height="30" class="image" />
  </g>
</svg>