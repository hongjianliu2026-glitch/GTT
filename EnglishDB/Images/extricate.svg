<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extricate</text>
  <text x="50" y="120" class="subtitle">[ˈɛkstrɪˌkeɪt] v. 解救，解脱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + tricae (纠缠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"纠缠(tricae)"在蜘蛛网中，
    <tspan x="50" dy="25">他奋力"挣脱(ex-)"出来，成功"解救(extricate)"了自己。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It took hours to extricate the car from the mud.
  </text>
  <text x="50" y="310" class="content">
    花了好几个小时才把车从泥里解救出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spider web -->
    <path d="M50,50 Q100,25 150,50 T250,50" class="image" />
    <path d="M50,100 Q100,75 150,100 T250,100" class="image" />
    <path d="M50,150 Q100,125 150,150 T250,150" class="image" />
    <path d="M50,200 Q100,175 150,200 T250,200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="125" r="20" class="image" />
    <line x1="100" y1="145" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="160" x2="130" y2="150" class="image" />
    <!-- Extricating -->
    <line x1="100" y1="145" x2="150" y2="100" class="image" />
    <line x1="100" y1="145" x2="150" y2="150" class="image" />
  </g>
</svg>