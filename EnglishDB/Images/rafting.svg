<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rafting</text>
  <text x="50" y="120" class="subtitle">[ˈræftɪŋ] n. 漂流，筏运</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> raft (筏) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人坐在一个巨大的筏子上，"筏子(raft)"
    <tspan x="50" dy="25">在湍急的河流中"漂流(rafting)"，水花四溅，</tspan>
    <tspan x="50" dy="25">他们兴奋地尖叫着，享受着刺激的冒险。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They went rafting on the Colorado River last weekend.
  </text>
  <text x="50" y="310" class="content">
    他们上周末在科罗拉多河上进行了漂流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Raft -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <!-- People on raft -->
    <circle cx="170" cy="75" r="10" class="image" />
    <circle cx="200" cy="75" r="10" class="image" />
    <circle cx="230" cy="75" r="10" class="image" />
    <!-- Water splashes -->
    <line x1="150" y1="100" x2="140" y2="110" class="image" />
    <line x1="170" y1="100" x2="160" y2="110" class="image" />
    <line x1="190" y1="100" x2="180" y2="110" class="image" />
    <line x1="210" y1="100" x2="200" y2="110" class="image" />
    <line x1="230" y1="100" x2="220" y2="110" class="image" />
  </g>
</svg>