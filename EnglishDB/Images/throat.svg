<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">throat</text>
  <text x="50" y="120" class="subtitle">[θroʊt] n. 喉咙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gutt- (喉咙)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人张大嘴巴，露出"喉咙(gutt-)"，
    <tspan x="50" dy="25">仿佛在发出巨大的声音，这就是"throat"的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cleared her throat before speaking.
  </text>
  <text x="50" y="310" class="content">
    她在说话前清了清喉咙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Mouth -->
    <rect x="50" y="120" width="100" height="30" class="image" />
    <!-- Throat -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="80" y1="175" x2="120" y2="175" class="image" />
    <line x1="90" y1="190" x2="110" y2="190" class="image" />
  </g>
</svg>