<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFC107; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bee { fill: #FFC107; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bee</text>
  <text x="50" y="120" class="subtitle">[biː] n. 蜜蜂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "bē"，意为蜜蜂。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只勤劳的蜜蜂在花丛中飞舞，采集花蜜，
    <tspan x="50" dy="25">最终酿成甜美的蜂蜜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bee collected nectar from the flowers.
  </text>
  <text x="50" y="310" class="content">
    蜜蜂从花朵中采集花蜜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bee -->
    <circle cx="50" cy="50" r="20" class="bee" />
    <line x1="50" y1="30" x2="50" y2="10" class="image" />
    <line x1="50" y1="70" x2="50" y2="90" class="image" />
    <line x1="30" y1="50" x2="10" y2="50" class="image" />
    <line x1="70" y1="50" x2="90" y2="50" class="image" />
    <!-- Flower -->
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="170" cy="50" r="15" class="image" />
    <circle cx="160" cy="35" r="15" class="image" />
    <circle cx="160" cy="65" r="15" class="image" />
    <line x1="160" y1="50" x2="160" y2="80" class="image" />
  </g>
</svg>