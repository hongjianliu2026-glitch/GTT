<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">English-speaking</text>
  <text x="50" y="120" class="subtitle">[ˈɪŋɡlɪʃ ˈspiːkɪŋ] adj. 说英语的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> English (英语) + speak (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的嘴巴，里面有一个英国国旗，
    <tspan x="50" dy="25">嘴巴正在"说(speak)"英语，这就是"说英语的(English-speaking)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is an English-speaking teacher.
  </text>
  <text x="50" y="310" class="content">
    她是一位说英语的老师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <path d="M50 50 Q100 100 150 50 Q200 0 250 50" class="image" />
    <!-- British flag -->
    <rect x="100" y="20" width="50" height="30" class="image" />
    <line x1="100" y1="20" x2="150" y2="50" class="image" />
    <line x1="150" y1="20" x2="100" y2="50" class="image" />
    <line x1="125" y1="20" x2="125" y2="50" class="image" />
    <line x1="100" y1="35" x2="150" y2="35" class="image" />
  </g>
</svg>