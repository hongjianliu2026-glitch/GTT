<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subside</text>
  <text x="50" y="120" class="subtitle">[səbˈsaɪd] v. 下沉，减退，平息</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + side (坐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的波浪，"坐在下面(sub-side)"，
    <tspan x="50" dy="25">逐渐平息，最终消失在海面上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm finally subsided after three days.
  </text>
  <text x="50" y="310" class="content">
    风暴在持续了三天后终于平息了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wave -->
    <path d="M0 100 C100 200, 300 200, 400 100" class="image" />
    <path d="M0 100 C100 0, 300 0, 400 100" class="image" />
    <!-- Sun -->
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Sea -->
    <rect x="0" y="100" width="400" height="100" class="image" />
  </g>
</svg>