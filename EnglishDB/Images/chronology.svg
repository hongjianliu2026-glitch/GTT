<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chronology</text>
  <text x="50" y="120" class="subtitle">[krəˈnɒlədʒi] n. 年代学，年表</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chrono- (时间) + -logy (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"时间(chrono)"
    <tspan x="50" dy="25">在不断转动，记录着历史的每一个瞬间，</tspan>
    <tspan x="50" dy="25">这些瞬间被整理成一个"学科(logy)"，</tspan>
    <tspan x="50" dy="25">这就是年代学(chronology)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The historian meticulously compiled the chronology of ancient events.
  </text>
  <text x="50" y="330" class="content">
    这位历史学家精心编纂了古代事件的年表。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Clock -->
    <circle cx="150" cy="150" r="100" class="image" />
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
    <line x1="150" y1="150" x2="230" y2="150" class="image" />
    <!-- Timeline -->
    <line x1="50" y1="300" x2="350" y2="300" class="image" />
    <circle cx="100" cy="300" r="10" class="image" />
    <circle cx="200" cy="300" r="10" class="image" />
    <circle cx="300" cy="300" r="10" class="image" />
    <!-- Events -->
    <text x="100" y="280" class="content">Event 1</text>
    <text x="200" y="280" class="content">Event 2</text>
    <text x="300" y="280" class="content">Event 3</text>
  </g>
</svg>