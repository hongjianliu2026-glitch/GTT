<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">charming</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɑrmɪŋ] adj. 迷人的，有魅力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> charm (魅力) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满魅力的人，"散发着(charm-ing)"
    <tspan x="50" dy="25">光芒，吸引着周围所有人的目光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a charming woman with a great sense of humor.
  </text>
  <text x="50" y="310" class="content">
    她是一个幽默感十足的迷人女性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Sparkles -->
    <circle cx="30" cy="20" r="5" class="image" />
    <circle cx="50" cy="20" r="5" class="image" />
    <circle cx="40" cy="10" r="5" class="image" />
    <!-- Person -->
    <circle cx="40" cy="50" r="15" class="image" />
    <line x1="40" y1="65" x2="40" y2="90" class="image" />
    <line x1="40" y1="75" x2="25" y2="70" class="image" />
    <line x1="40" y1="75" x2="55" y2="70" class="image" />
    <line x1="40" y1="90" x2="25" y2="105" class="image" />
    <line x1="40" y1="90" x2="55" y2="105" class="image" />
  </g>
</svg>