<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ranch</text>
  <text x="50" y="120" class="subtitle">[ræntʃ] n. 大牧场，大农场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ran (跑) + ch (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大牧场，"跑(ran)"
    <tspan x="50" dy="25">的地方(ch)，牛羊自由奔跑，这就是牧场(ranch)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They own a large ranch in Texas.
  </text>
  <text x="50" y="310" class="content">
    他们在德克萨斯州拥有一个大牧场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ranch house -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fence -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <!-- Cow -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="140" x2="80" y2="130" class="image" />
    <line x1="100" y1="140" x2="120" y2="130" class="image" />
    <line x1="100" y1="160" x2="80" y2="180" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />
    <!-- Horse -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="140" x2="180" y2="130" class="image" />
    <line x1="200" y1="140" x2="220" y2="130" class="image" />
    <line x1="200" y1="160" x2="180" y2="180" class="image" />
    <line x1="200" y1="160" x2="220" y2="180" class="image" />
  </g>
</svg>