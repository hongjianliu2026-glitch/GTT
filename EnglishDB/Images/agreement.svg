<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">agreement</text>
  <text x="50" y="120" class="subtitle">[əˈɡriːmənt] n. 协议，同意</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> agree (同意) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，互相点头表示"同意(agree)"，
    <tspan x="50" dy="25">这个动作就形成了一个"协议(agreement)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They reached an agreement after long negotiations.
  </text>
  <text x="50" y="310" class="content">
    经过长时间的谈判，他们达成了协议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Hands shaking -->
    <line x1="70" y1="120" x2="180" y2="120" class="image" />
    <!-- Agreement symbol -->
    <text x="120" y="150" class="image" font-size="40" fill="#2980B9">✓</text>
  </g>
</svg>