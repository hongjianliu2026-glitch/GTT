<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crotch</text>
  <text x="50" y="120" class="subtitle">[krɒtʃ] n. 胯部，裆部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cro- (交叉) + tch (表示部位)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在那里，双腿交叉，形成一个"交叉的部位(cro-tch)"，
    <tspan x="50" dy="25">这个部位就是胯部(crotch)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He felt a sharp pain in his crotch after the fall.
  </text>
  <text x="50" y="310" class="content">
    他摔倒后感到胯部剧痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Legs crossing -->
    <line x1="50" y1="0" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="200" class="image" />
    <!-- Body -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Crotch area -->
    <rect x="30" y="80" width="40" height="20" class="image" />
    <text x="50" y="100" class="highlight" text-anchor="middle">crotch</text>
  </g>
</svg>