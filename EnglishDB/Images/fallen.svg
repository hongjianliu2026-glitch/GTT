<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fallen</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːlən] adj. 倒下的，落下的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fall (落下) + -en (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树被风吹倒，"落下(fall)"在地，
    <tspan x="50" dy="25">变成了"倒下的(fallen)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fallen tree blocked the road.
  </text>
  <text x="50" y="310" class="content">
    倒下的大树挡住了道路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Tree trunk -->
    <line x1="150" y1="180" x2="150" y2="20" class="image" />
    <!-- Branches -->
    <line x1="150" y1="50" x2="100" y2="100" class="image" />
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="150" y1="50" x2="125" y2="120" class="image" />
    <line x1="150" y1="50" x2="175" y2="120" class="image" />
    <!-- Fallen tree -->
    <line x1="150" y1="180" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="275" y2="160" class="image" />
    <line x1="300" y1="180" x2="325" y2="160" class="image" />
  </g>
</svg>