<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .doll { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">doll</text>
  <text x="50" y="120" class="subtitle">[dɒl] n. 玩偶，玩具娃娃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语“dol”，意为“愚蠢的”，
    <tspan x="50" dy="25">后演变为指代“玩偶”，因其常被视为无生命的“愚蠢”之物。</tspan>
  </text>

  <!-- Story -->
  <text x="50" y="240" class="story">
    想象一个巨大的玩偶(doll)在房间里跳舞，
    <tspan x="50" dy="25">它的动作夸张而滑稽，仿佛在嘲笑自己的“愚蠢”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="310" class="content">
    <tspan class="highlight">例句:</tspan> She received a beautiful doll as a birthday gift.
  </text>
  <text x="50" y="340" class="content">
    她收到了一个漂亮的玩偶作为生日礼物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doll head -->
    <circle cx="100" cy="100" r="50" class="doll" />
    <!-- Doll body -->
    <rect x="75" y="150" width="50" height="100" class="doll" />
    <!-- Doll arms -->
    <line x1="50" y1="170" x2="20" y2="150" class="image" />
    <line x1="150" y1="170" x2="180" y2="150" class="image" />
    <!-- Doll legs -->
    <line x1="85" y1="250" x2="60" y2="300" class="image" />
    <line x1="115" y1="250" x2="140" y2="300" class="image" />
    <!-- Dancing motion -->
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="100" y1="100" x2="50" y2="50" class="image" />
  </g>
</svg>