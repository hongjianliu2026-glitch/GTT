<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">malady</text>
  <text x="50" y="120" class="subtitle">[ˈmælədi] n. 疾病，弊病</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mal- (坏) + -ady (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个病人躺在床上，"坏(mal-)"
    <tspan x="50" dy="25">的状态持续着，这就是一种疾病(malady)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new drug is effective against many maladies.
  </text>
  <text x="50" y="310" class="content">
    这种新药对许多疾病都很有效。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Patient -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="140" y2="140" class="image" />
    <line x1="175" y1="150" x2="210" y2="140" class="image" />
    <!-- Pill -->
    <rect x="250" y="50" width="30" height="10" class="image" />
    <line x1="250" y1="50" x2="280" y2="50" class="image" />
    <line x1="250" y1="60" x2="280" y2="60" class="image" />
  </g>
</svg>