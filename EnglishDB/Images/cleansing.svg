<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cleansing</text>
  <text x="50" y="120" class="subtitle">[ˈklenzɪŋ] n. 清洁，净化；v. 清洗，净化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clean (清洁) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海绵在"清洁(clean)"
    <tspan x="50" dy="25">整个城市，将所有的污垢都"净化(cleansing)"掉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cleansing ritual helped her feel refreshed.
  </text>
  <text x="50" y="310" class="content">
    清洁仪式让她感到焕然一新。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sponge -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Dirt -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="70" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Water droplets -->
    <line x1="20" y1="100" x2="30" y2="110" class="image" />
    <line x1="40" y1="100" x2="50" y2="110" class="image" />
    <line x1="60" y1="100" x2="70" y2="110" class="image" />
  </g>
</svg>