<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bloodless</text>
  <text x="50" y="120" class="subtitle">[ˈblʌdlɪs] adj. 无血的，苍白的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blood (血) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有血色的脸庞，"无血(bloodless)"
    <tspan x="50" dy="25">的脸色苍白如纸，仿佛失去了生命的活力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The patient's face was bloodless after the accident.
  </text>
  <text x="50" y="310" class="content">
    事故后，病人的脸色苍白如纸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="85" r="5" class="image" />
    <circle cx="125" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Bloodless effect -->
    <rect x="50" y="50" width="100" height="100" class="image" fill="#F9EBEA" />
  </g>
</svg>