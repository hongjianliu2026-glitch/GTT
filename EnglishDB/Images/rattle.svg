<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rattle</text>
  <text x="50" y="120" class="subtitle">[ˈrætl] v. 发出嘎嘎声，使慌乱；n. 嘎嘎声，拨浪鼓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ratt (嘎嘎声) + -le (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拨浪鼓(rattle)在手中摇晃，"嘎嘎作响(ratt-le)"，
    <tspan x="50" dy="25">声音清脆，让人忍不住跟着节奏摇摆。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby was fascinated by the rattle.
  </text>
  <text x="50" y="310" class="content">
    宝宝对拨浪鼓非常着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rattle -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="20" r="15" class="image" />
    <circle cx="50" cy="60" r="15" class="image" />
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="50" cy="140" r="15" class="image" />
    <!-- Baby -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="170" y2="220" class="image" />
    <line x1="200" y1="180" x2="230" y2="220" class="image" />
    <line x1="200" y1="150" x2="150" y2="140" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
    <!-- Rattle sound -->
    <line x1="50" y1="150" x2="200" y2="100" class="image" />
    <line x1="50" y1="150" x2="200" y2="120" class="image" />
    <line x1="50" y1="150" x2="200" y2="140" class="image" />
  </g>
</svg>