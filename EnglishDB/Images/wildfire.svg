<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wildfire</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪldfaɪər] n. 野火</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wild (野生的) + fire (火)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林中，"野生的火(wild-fire)"
    <tspan x="50" dy="25">迅速蔓延，像一条火龙吞噬一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wildfire spread rapidly due to strong winds.
  </text>
  <text x="50" y="310" class="content">
    由于强风，野火迅速蔓延。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="70" class="image" />
    <line x1="150" y1="150" x2="150" y2="60" class="image" />
    <line x1="200" y1="150" x2="200" y2="80" class="image" />
    <line x1="250" y1="150" x2="250" y2="50" class="image" />
    <!-- Fire -->
    <polygon points="100,50 120,70 80,70" class="fire" />
    <polygon points="150,60 170,80 130,80" class="fire" />
    <polygon points="200,80 220,100 180,100" class="fire" />
    <polygon points="250,50 270,70 230,70" class="fire" />
  </g>
</svg>