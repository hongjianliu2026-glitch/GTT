<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">salon</text>
  <text x="50" y="120" class="subtitle">[səˈlɒn] n. 沙龙，客厅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sal (盐) + -on (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的客厅(salon)，里面摆满了盐罐(sal)，
    <tspan x="50" dy="25">因为盐在古代是珍贵的，所以这个客厅也是高贵和优雅的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hosted a literary salon at her home.
  </text>
  <text x="50" y="310" class="content">
    她在家里举办了一个文学沙龙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Salon room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sofa -->
    <rect x="50" y="20" width="250" height="80" class="image" />
    <!-- Table -->
    <rect x="120" y="110" width="100" height="50" class="image" />
    <!-- Salt shakers -->
    <circle cx="140" cy="130" r="10" class="image" />
    <circle cx="160" cy="130" r="10" class="image" />
    <circle cx="180" cy="130" r="10" class="image" />
    <!-- People -->
    <circle cx="80" cy="60" r="15" class="image" />
    <circle cx="200" cy="60" r="15" class="image" />
    <line x1="80" y1="75" x2="80" y2="100" class="image" />
    <line x1="200" y1="75" x2="200" y2="100" class="image" />
    <line x1="80" y1="100" x2="60" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="80" y1="85" x2="100" y2="75" class="image" />
    <line x1="200" y1="85" x2="180" y2="75" class="image" />
  </g>
</svg>