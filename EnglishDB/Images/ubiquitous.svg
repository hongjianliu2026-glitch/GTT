<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ubiquitous</text>
  <text x="50" y="120" class="subtitle">[juːˈbɪkwɪtəs] adj. 无所不在的，普遍存在的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ubi (哪里) + quit (存在) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体，无论你走到哪里，"哪里(ubi)都存在(quit)"，
    <tspan x="50" dy="25">这就是无所不在(ubiquitous)的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Wi-Fi is now ubiquitous in most urban areas.
  </text>
  <text x="50" y="310" class="content">
    现在Wi-Fi在大多数城市地区无处不在。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Wi-Fi symbol -->
    <path d="M100,100 C120,80 150,80 170,100" class="image" />
    <path d="M100,120 C120,140 150,140 170,120" class="image" />
    <path d="M100,140 C120,160 150,160 170,140" class="image" />
    <!-- Wi-Fi signal -->
    <line x1="175" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="100" x2="250" y2="150" class="image" />
    <line x1="175" y1="100" x2="250" y2="50" class="image" />
  </g>
</svg>