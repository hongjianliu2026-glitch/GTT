<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">astonishing</text>
  <text x="50" y="120" class="subtitle">[əˈstɑːnɪʃɪŋ] adj. 令人惊讶的，惊人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + ston (站立) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"加强站立(a-ston)"的景象惊呆了，
    <tspan x="50" dy="25">仿佛时间都停止了，这就是令人惊讶的(astonishing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's tricks were astonishing.
  </text>
  <text x="50" y="310" class="content">
    魔术师的把戏令人惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing in shock -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="90" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Shocked expression -->
    <circle cx="40" cy="45" r="2" class="image" /> <!-- Left eye -->
    <circle cx="60" cy="45" r="2" class="image" /> <!-- Right eye -->
    <line x1="45" y1="60" x2="55" y2="60" class="image" /> <!-- Mouth -->
    <!-- Lightning bolt -->
    <polyline points="100,20 120,40 100,60 120,80 100,100" class="image" />
  </g>
</svg>