<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">basic</text>
  <text x="50" y="120" class="subtitle">[ˈbeɪsɪk] adj. 基本的，基础的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bas (基础) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个建筑工人正在用"基础(bas)"
    <tspan x="50" dy="25">材料建造一座房子，这些材料就是最基本的(basic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The basic principles of physics are essential for understanding advanced topics.
  </text>
  <text x="50" y="310" class="content">
    物理学的基本原理对于理解高级主题至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Foundation -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bricks -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="110" y="20" width="50" height="30" class="image" />
    <rect x="170" y="20" width="50" height="30" class="image" />
    <rect x="230" y="20" width="50" height="30" class="image" />
    <rect x="290" y="20" width="50" height="30" class="image" />
    <!-- Worker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>