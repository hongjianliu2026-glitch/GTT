<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">geographical</text>
  <text x="50" y="120" class="subtitle">[ˌdʒiːəˈɡræfɪkl] adj. 地理的，地理学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> geo- (地球) + graph (写) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在地球上，"写下(graph)"
    <tspan x="50" dy="25">关于地球(geo)的详细信息，这些信息就构成了地理学(geographical)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The geographical features of the region are fascinating.
  </text>
  <text x="50" y="310" class="content">
    该地区的地理特征非常迷人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="70" class="image" />
    <!-- Landmasses -->
    <path d="M100,100 L150,50 L200,100 L250,150 L200,200 L150,150 Z" class="image" />
    <!-- Explorer -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Notebook -->
    <rect x="250" y="50" width="100" height="100" class="image" />
    <!-- Pen -->
    <line x1="300" y1="150" x2="350" y2="150" class="image" />
    <line x1="350" y1="150" x2="340" y2="140" class="image" />
  </g>
</svg>