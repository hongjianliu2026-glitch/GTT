<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">invade</text>
  <text x="50" y="120" class="subtitle">[ɪnˈveɪd] v. 侵入，侵略</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vad (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一支军队"走进(in-vad)"一个国家，
    <tspan x="50" dy="25">他们毫不留情地侵入(invade)，占领每一寸土地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enemy troops invaded the border town.
  </text>
  <text x="50" y="310" class="content">
    敌军侵入了边境小镇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Border -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Invading army -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="110" x2="100" y2="110" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <!-- Soldiers -->
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="70" cy="110" r="10" class="image" />
    <circle cx="70" cy="140" r="10" class="image" />
    <!-- Marching direction -->
    <line x1="100" y1="95" x2="150" y2="95" class="image" />
    <line x1="150" y1="95" x2="140" y2="85" class="image" />
    <line x1="150" y1="95" x2="140" y2="105" class="image" />
  </g>
</svg>