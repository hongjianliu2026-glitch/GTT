<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jam</text>
  <text x="50" y="120" class="subtitle">[dʒæm] n. 果酱；v. 堵塞，拥挤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jam (源自中古英语，原意为“压紧”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车被“压紧(jam)”在交通堵塞中，
    <tspan x="50" dy="25">车流如“果酱(jam)”般粘稠，动弹不得。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The traffic jam made us late for the meeting.
  </text>
  <text x="50" y="310" class="content">
    交通堵塞让我们开会迟到了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traffic jam -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car 1 -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <circle cx="60" cy="50" r="5" class="image" />
    <circle cx="90" cy="50" r="5" class="image" />
    <!-- Car 2 -->
    <rect x="120" y="20" width="50" height="30" class="image" />
    <circle cx="130" cy="50" r="5" class="image" />
    <circle cx="160" cy="50" r="5" class="image" />
    <!-- Car 3 -->
    <rect x="190" y="20" width="50" height="30" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <circle cx="230" cy="50" r="5" class="image" />
    <!-- Jam jar -->
    <rect x="260" y="20" width="50" height="100" class="image" />
    <line x1="285" y1="120" x2="285" y2="200" class="image" />
    <line x1="260" y1="120" x2="310" y2="120" class="image" />
    <!-- Jam inside the jar -->
    <rect x="265" y="25" width="40" height="90" class="image" fill="#FF6347" />
  </g>
</svg>