<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nothingness</text>
  <text x="50" y="120" class="subtitle">[ˈnʌθɪŋnəs] n. 虚无，不存在</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> no- (没有) + thing (事物) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的黑洞，"吞噬(no-thing)"
    <tspan x="50" dy="25">一切事物，只剩下虚无(nothingness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The void felt like a deep nothingness.
  </text>
  <text x="50" y="310" class="content">
    那空虚感就像深不可测的虚无。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Black hole -->
    <circle cx="175" cy="100" r="70" class="image" fill="#000000" />
    <!-- Stars disappearing -->
    <line x1="100" y1="50" x2="175" y2="100" class="image" stroke-dasharray="5,5" />
    <line x1="250" y1="50" x2="175" y2="100" class="image" stroke-dasharray="5,5" />
    <line x1="100" y1="150" x2="175" y2="100" class="image" stroke-dasharray="5,5" />
    <line x1="250" y1="150" x2="175" y2="100" class="image" stroke-dasharray="5,5" />
  </g>
</svg>