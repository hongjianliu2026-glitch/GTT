<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foolishness</text>
  <text x="50" y="120" class="subtitle">[ˈfuːlɪʃnəs] n. 愚蠢，愚笨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fool (傻子) + -ish (形容词后缀) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个傻子(fool)在街上做出各种滑稽的动作，
    <tspan x="50" dy="25">这些行为让人忍俊不禁，这就是foolishness(愚蠢)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His foolishness made everyone laugh.
  </text>
  <text x="50" y="310" class="content">
    他的愚蠢行为让大家都笑了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fool -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Foolish actions -->
    <line x1="50" y1="200" x2="100" y2="250" class="image" />
    <line x1="50" y1="200" x2="0" y2="250" class="image" />
    <line x1="50" y1="250" x2="100" y2="300" class="image" />
    <line x1="50" y1="250" x2="0" y2="300" class="image" />
  </g>
</svg>