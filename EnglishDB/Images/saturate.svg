<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">saturate</text>
  <text x="50" y="120" class="subtitle">[ˈsætʃəreɪt] v. 使饱和，浸透</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> satur (满) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块海绵被"充满(satur)"了水，完全"浸透(saturate)"了。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rain saturated the ground.
  </text>
  <text x="50" y="310" class="content">
    雨水浸透了地面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sponge -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Water drops -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="90" r="10" class="image" />
    <circle cx="70" cy="110" r="10" class="image" />
    <circle cx="120" cy="130" r="10" class="image" />
  </g>
</svg>