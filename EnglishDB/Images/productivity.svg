<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">productivity</text>
  <text x="50" y="120" class="subtitle">[ˌprɒdʌkˈtɪvɪti] n. 生产力，生产率</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + duct (引导) + -ivity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂里，工人们"向前引导(pro-duct)"
    <tspan x="50" dy="25">原材料，快速生产出大量产品，这就是生产力(productivity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new machinery increased our productivity by 30%.
  </text>
  <text x="50" y="310" class="content">
    新机器使我们的生产率提高了30%。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Conveyor belt -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="70" x2="300" y2="70" class="image" />
    <line x1="50" y1="90" x2="300" y2="90" class="image" />
    <!-- Products -->
    <circle cx="70" cy="60" r="10" class="image" />
    <circle cx="100" cy="60" r="10" class="image" />
    <circle cx="130" cy="60" r="10" class="image" />
    <circle cx="160" cy="60" r="10" class="image" />
    <circle cx="190" cy="60" r="10" class="image" />
    <circle cx="220" cy="60" r="10" class="image" />
    <circle cx="250" cy="60" r="10" class="image" />
    <circle cx="280" cy="60" r="10" class="image" />
    <!-- Workers -->
    <circle cx="50" cy="120" r="15" class="image" />
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <circle cx="200" cy="120" r="15" class="image" />
    <circle cx="250" cy="120" r="15" class="image" />
    <circle cx="300" cy="120" r="15" class="image" />
  </g>
</svg>