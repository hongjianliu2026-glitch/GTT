<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unconstitutional</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˌkɒnstɪˈtjuːʃənl] adj. 违反宪法的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + constitution (宪法) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色"X"标记在一个法律文件上，表示这个文件是"不(un-)"符合"宪法(constitution)"的，因此是"违反宪法的(unconstitutional)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The court ruled that the new law was unconstitutional.
  </text>
  <text x="50" y="310" class="content">
    法院裁定新法律违反宪法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Legal document -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Red X -->
    <line x1="50" y1="50" x2="300" y2="200" class="image" style="stroke: #E74C3C; stroke-width: 5;" />
    <line x1="50" y1="200" x2="300" y2="50" class="image" style="stroke: #E74C3C; stroke-width: 5;" />
    <!-- Constitution book -->
    <rect x="100" y="100" width="150" height="80" class="image" />
    <text x="120" y="140" class="content" style="fill: #34495E;">宪法</text>
  </g>
</svg>