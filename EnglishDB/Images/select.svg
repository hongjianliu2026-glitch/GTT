<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">select</text>
  <text x="50" y="120" class="subtitle">[sɪˈlekt] v. 选择，挑选；adj. 精选的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + lect (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个挑剔的美食家，"分开(se-)"
    <tspan x="50" dy="25">挑选(lect)出最好的食材，这些食材就是精选的(select)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully selected the best apples from the basket.
  </text>
  <text x="50" y="310" class="content">
    她仔细地从篮子里挑选出最好的苹果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Apples -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Selected apple -->
    <circle cx="300" cy="100" r="25" class="image" fill="#FFD700" />
    <!-- Hand -->
    <line x1="300" y1="125" x2="350" y2="175" class="image" />
    <line x1="350" y1="175" x2="370" y2="155" class="image" />
  </g>
</svg>