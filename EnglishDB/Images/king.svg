<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">king</text>
  <text x="50" y="120" class="subtitle">[kɪŋ] n. 国王，君主</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kin (家族) + g (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家族的领袖，"统治(g)"
    <tspan x="50" dy="25">整个家族，他就是国王(king)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The king ruled his kingdom with wisdom and justice.
  </text>
  <text x="50" y="310" class="content">
    国王以智慧和公正统治他的王国。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <path d="M50 50 L70 20 L90 50 L110 20 L130 50 L110 80 L90 50 L70 80 Z" class="image" />
    <!-- Head -->
    <circle cx="90" cy="100" r="30" class="image" />
    <!-- Body -->
    <rect x="60" y="130" width="60" height="100" class="image" />
    <!-- Arms -->
    <line x1="60" y1="150" x2="20" y2="150" class="image" />
    <line x1="120" y1="150" x2="160" y2="150" class="image" />
    <!-- Legs -->
    <line x1="75" y1="230" x2="75" y2="280" class="image" />
    <line x1="105" y1="230" x2="105" y2="280" class="image" />
  </g>
</svg>