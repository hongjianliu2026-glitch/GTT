<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">affiliate</text>
  <text x="50" y="120" class="subtitle">[əˈfɪliət] v. 使隶属于，使加入；n. 附属机构</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> af- (加强) + fili (儿子) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个公司"加强(af-)"与另一个公司"儿子(fili)"的关系，
    <tspan x="50" dy="25">使它们成为"附属(affiliate)"关系。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The university affiliates with several research institutions.
  </text>
  <text x="50" y="310" class="content">
    这所大学隶属于几家研究机构。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main company -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <text x="20" y="50" class="content">Main</text>
    <!-- Subsidiary company -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <text x="220" y="50" class="content">Subsidiary</text>
    <!-- Connection line -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <!-- Arrow -->
    <polygon points="190,45 195,55 185,55" class="image" />
  </g>
</svg>