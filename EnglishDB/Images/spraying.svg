<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spraying</text>
  <text x="50" y="120" class="subtitle">[ˈspreɪɪŋ] v. 喷洒，喷射</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spra (喷) + ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个园丁拿着喷壶，"喷洒(spra)"
    <tspan x="50" dy="25">水雾，水滴像细雨一样散开，这就是喷洒(spraying)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gardener was spraying water on the flowers.
  </text>
  <text x="50" y="310" class="content">
    园丁正在给花喷水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sprayer -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water droplets -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="60" r="8" class="image" />
    <circle cx="110" cy="70" r="6" class="image" />
    <circle cx="140" cy="80" r="4" class="image" />
    <circle cx="170" cy="90" r="2" class="image" />
    <!-- Sprayer bottle -->
    <rect x="200" y="20" width="100" height="160" class="image" />
    <line x1="250" y1="20" x2="250" y2="0" class="image" />
    <!-- Gardener -->
    <circle cx="250" cy="180" r="15" class="image" />
    <line x1="250" y1="195" x2="250" y2="230" class="image" />
    <line x1="250" y1="230" x2="230" y2="260" class="image" />
    <line x1="250" y1="230" x2="270" y2="260" class="image" />
    <line x1="250" y1="210" x2="280" y2="200" class="image" />
  </g>
</svg>