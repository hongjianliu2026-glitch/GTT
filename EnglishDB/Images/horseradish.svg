<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">horseradish</text>
  <text x="50" y="120" class="subtitle">[ˈhɔːrsˌrædɪʃ] n. 辣根</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> horse (马) + radish (萝卜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一匹马(horse)在吃一种特别辣的萝卜(radish)，
    <tspan x="50" dy="25">这种萝卜就是辣根(horseradish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added horseradish to her sandwich for extra spice.
  </text>
  <text x="50" y="310" class="content">
    她在三明治里加了辣根以增加辣味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Horse head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Horse body -->
    <line x1="50" y1="160" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="160" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="200" x2="20" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="200" x2="80" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="130" x2="20" y2="110" class="image" /> <!-- Ear -->
    <line x1="50" y1="130" x2="80" y2="110" class="image" /> <!-- Ear -->

    <!-- Radish -->
    <rect x="150" y="100" width="50" height="80" class="image" />
    <circle cx="175" cy="90" r="10" class="image" />
    <circle cx="160" cy="80" r="10" class="image" />
    <circle cx="190" cy="80" r="10" class="image" />
  </g>
</svg>