<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boater</text>
  <text x="50" y="120" class="subtitle">[ˈboʊtər] n. 平顶硬草帽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boat (船) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着平顶硬草帽的人，"船上的人(boater)"
    <tspan x="50" dy="25">在阳光下航行，帽子保护他免受阳光直射。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a boater to protect himself from the sun.
  </text>
  <text x="50" y="310" class="content">
    他戴着一顶平顶硬草帽来保护自己免受阳光照射。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 125,100" class="image" fill="#8E44AD" />
    <!-- Person -->
    <circle cx="125" cy="80" r="15" class="image" fill="#2C3E50" />
    <line x1="125" y1="95" x2="125" y2="130" class="image" />
    <line x1="125" y1="130" x2="110" y2="160" class="image" />
    <line x1="125" y1="130" x2="140" y2="160" class="image" />
    <line x1="125" y1="110" x2="150" y2="100" class="image" />
    <!-- Hat -->
    <rect x="100" y="60" width="50" height="10" class="image" fill="#F39C12" />
  </g>
</svg>