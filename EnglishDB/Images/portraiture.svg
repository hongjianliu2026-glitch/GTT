<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">portraiture</text>
  <text x="50" y="120" class="subtitle">[ˈpɔːtrətʃər] n. 肖像画法，肖像画</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> portra (画) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位艺术家在画布上"描绘(portra)"
    <tspan x="50" dy="25">一个人的形象，这就是肖像画法(portraiture)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She excels in portraiture, capturing the essence of her subjects.
  </text>
  <text x="50" y="310" class="content">
    她擅长肖像画，能捕捉到人物的精髓。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="300" class="image" />
    <!-- Face outline -->
    <circle cx="175" cy="150" r="100" class="image" />
    <!-- Eyes -->
    <circle cx="130" cy="120" r="15" class="image" />
    <circle cx="220" cy="120" r="15" class="image" />
    <!-- Nose -->
    <line x1="175" y1="140" x2="175" y2="180" class="image" />
    <!-- Mouth -->
    <path d="M130,200 Q175,220 220,200" class="image" />
    <!-- Artist -->
    <circle cx="50" cy="350" r="20" class="image" />
    <line x1="50" y1="370" x2="50" y2="400" class="image" />
    <line x1="50" y1="400" x2="30" y2="430" class="image" />
    <line x1="50" y1="400" x2="70" y2="430" class="image" />
    <line x1="50" y1="380" x2="80" y2="370" class="image" />
  </g>
</svg>