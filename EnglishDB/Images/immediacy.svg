<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">immediacy</text>
  <text x="50" y="120" class="subtitle">[ɪˈmiːdiəsi] n. 立即，直接</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + medi (中间) + -acy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个消息从发送者直接"进入(im-)"接收者的"中间(medi)"，
    <tspan x="50" dy="25">没有经过任何延迟，这就是立即性(immediacy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The immediacy of the news shocked everyone.
  </text>
  <text x="50" y="310" class="content">
    新闻的即时性震惊了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sender -->
    <circle cx="50" cy="100" r="20" class="image" />
    <text x="40" y="110" class="content">Sender</text>
    <!-- Receiver -->
    <circle cx="300" cy="100" r="20" class="image" />
    <text x="290" y="110" class="content">Receiver</text>
    <!-- Arrow -->
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <polygon points="280,90 280,110 300,100" class="image" />
    <!-- Message bubble -->
    <rect x="80" y="70" width="150" height="60" class="image" />
    <text x="90" y="100" class="content">Message</text>
  </g>
</svg>