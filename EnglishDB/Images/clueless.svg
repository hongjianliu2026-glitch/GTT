<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clueless</text>
  <text x="50" y="120" class="subtitle">[ˈkluːləs] adj. 无知的，一无所知的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clue (线索) + less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在迷宫的入口，"没有线索(clue-less)"，
    <tspan x="50" dy="25">完全不知道该往哪里走，这就是"clueless"的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was completely clueless about the new project.
  </text>
  <text x="50" y="310" class="content">
    他对这个新项目完全一无所知。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Maze entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Question marks -->
    <text x="100" y="120" class="content" font-size="48">???</text>
  </g>
</svg>