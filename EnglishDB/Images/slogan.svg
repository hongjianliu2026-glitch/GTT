<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slogan</text>
  <text x="50" y="120" class="subtitle">[ˈsloʊɡən] n. 标语，口号</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (强调) + log (说) + -an (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个广告牌上，"强调地说(s-log-an)"
    <tspan x="50" dy="25">出一句简短有力的口号，这就是slogan。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's new slogan is "Innovate and Inspire."
  </text>
  <text x="50" y="310" class="content">
    公司的新口号是“创新与激励”。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Billboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Slogan text -->
    <text x="50" y="100" class="content" style="font-size: 36px; fill: #E74C3C;">"Innovate and Inspire"</text>
    <!-- Lightning bolt -->
    <polyline points="250,50 300,100 250,150" class="image" style="stroke: #F39C12; stroke-width: 4;" />
  </g>
</svg>