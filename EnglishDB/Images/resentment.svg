<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resentment</text>
  <text x="50" y="120" class="subtitle">[rɪˈzentmənt] n. 怨恨，不满</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sent (感觉) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被冤枉后，"再次感受到(re-sent)"
    <tspan x="50" dy="25">内心的痛苦，这种持续的不满就变成了怨恨(resentment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt a deep resentment towards her boss for not giving her a promotion.
  </text>
  <text x="50" y="310" class="content">
    她对老板没有给她升职感到深深的怨恨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a broken heart -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Broken heart -->
    <path d="M30,100 Q20,80 30,60 Q20,40 30,20 Q40,40 30,60 Q40,80 30,100" class="image" />
    <path d="M70,100 Q80,80 70,60 Q80,40 70,20 Q60,40 70,60 Q60,80 70,100" class="image" />
    <line x1="30" y1="60" x2="70" y2="60" class="image" />
  </g>
</svg>