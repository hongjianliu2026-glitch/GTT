<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nay</text>
  <text x="50" y="120" class="subtitle">[neɪ] adv. 不，否</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "nay"，意为否定。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在会议上，面对提议，他坚定地摇头，嘴里说着"nay"，
    <tspan x="50" dy="25">表示强烈的否定。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The committee voted nay on the proposal.
  </text>
  <text x="50" y="310" class="content">
    委员会对提案投了反对票。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Person shaking head -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Mouth saying "nay" -->
    <path d="M 40 70 Q 50 60 60 70" class="image" />
  </g>
</svg>