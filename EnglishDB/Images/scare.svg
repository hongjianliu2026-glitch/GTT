<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scare</text>
  <text x="50" y="120" class="subtitle">[skɛər] v. 惊吓，使害怕；n. 惊恐，恐慌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (加强意义) + care (关心，注意)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的怪物突然出现在你面前，"加强了你的注意(s-care)"，
    <tspan x="50" dy="25">让你感到极度惊恐(scare)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loud noise scared the children.
  </text>
  <text x="50" y="310" class="content">
    巨大的噪音吓坏了孩子们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <line x1="50" y1="150" x2="0" y2="140" class="image" />
    <!-- Eyes -->
    <circle cx="35" cy="90" r="5" class="image" fill="#000" />
    <circle cx="65" cy="90" r="5" class="image" fill="#000" />
    <!-- Mouth -->
    <path d="M30,110 Q50,120 70,110" class="image" fill="none" />

    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Eyes -->
    <circle cx="190" cy="95" r="3" class="image" fill="#000" />
    <circle cx="210" cy="95" r="3" class="image" fill="#000" />
    <!-- Mouth -->
    <path d="M185,110 Q200,115 215,110" class="image" fill="none" />
  </g>
</svg>