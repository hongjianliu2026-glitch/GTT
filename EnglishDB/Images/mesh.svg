<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mesh</text>
  <text x="50" y="120" class="subtitle">[mɛʃ] n. 网眼，网状物；v. 使成网状</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mes- (网)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张巨大的网，"网(mes)"住了整个世界，
    <tspan x="50" dy="25">每个网眼(mesh)都紧密相连，形成了一个复杂的网络。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fish was caught in the mesh of the net.
  </text>
  <text x="50" y="310" class="content">
    那条鱼被网眼困住了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mesh grid -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="0" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <line x1="300" y1="0" x2="300" y2="200" class="image" />
    <!-- Fish caught in the mesh -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="200" class="image" />
    <line x1="150" y1="180" x2="170" y2="200" class="image" />
    <line x1="150" y1="150" x2="190" y2="140" class="image" />
  </g>
</svg>