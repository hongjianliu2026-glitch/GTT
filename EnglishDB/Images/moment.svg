<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moment</text>
  <text x="50" y="120" class="subtitle">[ˈmoʊmənt] n. 片刻，瞬间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mo- (移动) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟的指针在移动，"移动的瞬间(mo-ment)"
    <tspan x="50" dy="25">就是时间流逝的片刻(moment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She paused for a moment before answering.
  </text>
  <text x="50" y="310" class="content">
    她在回答之前停顿了一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="100" y1="100" x2="100" y2="30" class="image" />
    <line x1="100" y1="100" x2="160" y2="100" class="image" />
    <!-- Moving hand -->
    <line x1="100" y1="100" x2="140" y2="60" class="image" />
    <!-- Dots for time -->
    <circle cx="100" cy="20" r="5" class="image" />
    <circle cx="160" cy="100" r="5" class="image" />
    <circle cx="100" cy="180" r="5" class="image" />
    <circle cx="40" cy="100" r="5" class="image" />
  </g>
</svg>