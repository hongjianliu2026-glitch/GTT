<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hereditary</text>
  <text x="50" y="120" class="subtitle">[həˈredɪtəri] adj. 遗传的，世袭的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hered (继承) + -itary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家族的基因链，"继承(hered)"
    <tspan x="50" dy="25">下来的特征，代代相传，这就是遗传(hereditary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He has a hereditary disease that runs in his family.
  </text>
  <text x="50" y="310" class="content">
    他有一种家族遗传病。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gene chain -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <!-- Family tree -->
    <circle cx="50" cy="120" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <circle cx="250" cy="120" r="15" class="image" />
    <line x1="50" y1="135" x2="150" y2="135" class="image" />
    <line x1="150" y1="135" x2="250" y2="135" class="image" />
    <line x1="100" y1="155" x2="100" y2="180" class="image" />
    <line x1="200" y1="155" x2="200" y2="180" class="image" />
    <circle cx="100" cy="195" r="15" class="image" />
    <circle cx="200" cy="195" r="15" class="image" />
  </g>
</svg>