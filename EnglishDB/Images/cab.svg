<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cab</text>
  <text x="50" y="120" class="subtitle">[kæb] n. 出租车，驾驶室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cab (源自拉丁语 "cappa"，意为“斗篷”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆出租车(cab)，司机穿着一件大斗篷(cappa)，
    <tspan x="50" dy="25">驾驶着车在城市中穿梭，带你去任何你想去的地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He hailed a cab to get to the airport.
  </text>
  <text x="50" y="310" class="content">
    他叫了一辆出租车去机场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Taxi body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Taxi roof -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Taxi windows -->
    <rect x="70" y="40" width="80" height="30" class="image" />
    <rect x="170" y="40" width="80" height="30" class="image" />
    <!-- Taxi wheels -->
    <circle cx="80" cy="130" r="20" class="image" />
    <circle cx="270" cy="130" r="20" class="image" />
    <!-- Driver with cape -->
    <circle cx="200" cy="80" r="15" class="image" />
    <line x1="200" y1="95" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="140" class="image" />
    <line x1="200" y1="120" x2="220" y2="140" class="image" />
    <line x1="200" y1="105" x2="240" y2="95" class="image" />
    <line x1="200" y1="105" x2="160" y2="95" class="image" />
  </g>
</svg>