<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mainstream</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪnstriːm] n. 主流</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> main (主要的) + stream (流)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条宽阔的河流，"主要的流(main-stream)"
    <tspan x="50" dy="25">代表着主流思想或文化，大家都顺着这条河走。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His ideas were accepted into the mainstream.
  </text>
  <text x="50" y="310" class="content">
    他的想法被主流所接受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- People -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="200" cy="140" r="10" class="image" />
    <circle cx="250" cy="160" r="10" class="image" />
    <circle cx="300" cy="180" r="10" class="image" />
  </g>
</svg>