<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fraternal</text>
  <text x="50" y="120" class="subtitle">[frəˈtɜːrnl] adj. 兄弟的，兄弟般的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frater (兄弟) + -n- + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个兄弟(frater)，他们之间有着深厚的感情，
    <tspan x="50" dy="25">这种感情就像兄弟般的(fraternal)友谊，让人感到温暖和亲切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Their fraternal bond was evident in their shared laughter.
  </text>
  <text x="50" y="310" class="content">
    他们兄弟般的情谊在他们的共同笑声中显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two brothers -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Arms around each other -->
    <line x1="80" y1="130" x2="120" y2="130" class="image" />
    <line x1="80" y1="130" x2="50" y2="160" class="image" />
    <line x1="120" y1="130" x2="150" y2="160" class="image" />
    <!-- Hearts -->
    <path d="M50,180 Q70,160 90,180 T130,180" class="image" />
    <path d="M150,180 Q170,160 190,180 T230,180" class="image" />
  </g>
</svg>