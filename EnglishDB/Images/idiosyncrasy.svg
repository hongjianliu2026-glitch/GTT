<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">idiosyncrasy</text>
  <text x="50" y="120" class="subtitle">[ˌɪdiəˈsɪŋkrəsi] n. 特质，习性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> idio- (个人的) + syn- (共同) + crasy (混合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人，他的"个人混合(idio-syn-crasy)"
    <tspan x="50" dy="25">特质与众不同，形成了独特的习性(idiosyncrasy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her idiosyncrasy of always wearing mismatched socks made her stand out.
  </text>
  <text x="50" y="310" class="content">
    她总是穿不搭配的袜子，这一特质让她与众不同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Mismatched socks -->
    <rect x="20" y="250" width="20" height="30" class="image" />
    <rect x="60" y="250" width="20" height="30" class="image" />
    <rect x="20" y="280" width="20" height="10" class="image" />
    <rect x="60" y="280" width="20" height="10" class="image" />
    <rect x="20" y="290" width="20" height="10" class="image" />
    <rect x="60" y="290" width="20" height="10" class="image" />
  </g>
</svg>