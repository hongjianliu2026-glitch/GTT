<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Thanksgiving</text>
  <text x="50" y="120" class="subtitle">[ˌθæŋksˈɡɪvɪŋ] n. 感恩节</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thanks (感谢) + giving (给予)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一家人围坐在餐桌前，"感谢(thanks)"
    <tspan x="50" dy="25">并"给予(giving)"彼此祝福，这就是感恩节(Thanksgiving)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We celebrate Thanksgiving with a big family dinner.
  </text>
  <text x="50" y="310" class="content">
    我们用一顿丰盛的家庭晚餐来庆祝感恩节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Family members -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <!-- Food -->
    <rect x="50" y="80" width="250" height="100" class="image" />
    <!-- Turkey -->
    <line x1="70" y1="100" x2="90" y2="120" class="image" />
    <line x1="90" y1="120" x2="110" y2="100" class="image" />
    <line x1="110" y1="100" x2="130" y2="120" class="image" />
    <line x1="130" y1="120" x2="150" y2="100" class="image" />
    <!-- Blessing -->
    <text x="100" y="180" class="content">Blessings</text>
  </g>
</svg>