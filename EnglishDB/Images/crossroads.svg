<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crossroads</text>
  <text x="50" y="120" class="subtitle">[ˈkrɔːsˌroʊdz] n. 十字路口，岔路口</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cross (交叉) + roads (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的十字路口，四条道路"交叉(cross)"在一起，
    <tspan x="50" dy="25">形成了一个"岔路口(crossroads)"，人们在这里做出选择。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She reached the crossroads and had to decide which way to go.
  </text>
  <text x="50" y="310" class="content">
    她到达了十字路口，不得不决定走哪条路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Crossroads -->
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <!-- Roads -->
    <line x1="100" y1="100" x2="100" y2="300" class="image" />
    <line x1="300" y1="100" x2="300" y2="300" class="image" />
    <line x1="200" y1="0" x2="200" y2="-200" class="image" />
    <line x1="200" y1="200" x2="200" y2="400" class="image" />
    <!-- Car -->
    <rect x="180" y="80" width="40" height="20" class="image" />
    <circle cx="190" cy="105" r="5" class="image" />
    <circle cx="230" cy="105" r="5" class="image" />
  </g>
</svg>