<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kettle</text>
  <text x="50" y="120" class="subtitle">[ˈkɛtl] n. 水壶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kett- (水壶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水壶(kettle)，里面装满了沸腾的水，
    <tspan x="50" dy="25">蒸汽从壶嘴喷出，形成了一片云雾，仿佛水壶在天上飞翔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She put the kettle on the stove to boil.
  </text>
  <text x="50" y="310" class="content">
    她把水壶放在炉子上烧水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kettle body -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Kettle handle -->
    <line x1="200" y1="50" x2="250" y2="25" class="image" />
    <line x1="200" y1="100" x2="250" y2="125" class="image" />
    <!-- Kettle spout -->
    <path d="M200,150 Q250,150 250,100" class="image" />
    <!-- Steam -->
    <path d="M250,100 Q270,80 290,100" class="image" />
    <path d="M250,100 Q270,60 290,80" class="image" />
    <path d="M250,100 Q270,40 290,60" class="image" />
  </g>
</svg>