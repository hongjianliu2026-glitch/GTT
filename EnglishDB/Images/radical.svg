<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">radical</text>
  <text x="50" y="120" class="subtitle">[ˈrædɪkl] adj. 根本的，激进的；n. 激进分子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> radic (根) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树，"根(radic)"是它的基础，
    <tspan x="50" dy="25">而"根本的(radical)"变化就像从根部开始改变，</tspan>
    <tspan x="50" dy="25">这种改变往往是"激进的"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy introduced by the government is quite radical.
  </text>
  <text x="50" y="310" class="content">
    政府新推出的政策非常激进。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="100" y="0" width="20" height="200" class="image" />
    <!-- Roots -->
    <line x1="100" y1="200" x2="80" y2="250" class="image" />
    <line x1="120" y1="200" x2="140" y2="250" class="image" />
    <line x1="110" y1="200" x2="110" y2="250" class="image" />
    <!-- Radical change symbol -->
    <circle cx="110" cy="100" r="30" class="image" />
    <line x1="110" y1="70" x2="110" y2="130" class="image" />
    <line x1="80" y1="100" x2="140" y2="100" class="image" />
  </g>
</svg>