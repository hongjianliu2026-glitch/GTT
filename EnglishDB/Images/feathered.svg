<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .feather { fill: #FFFFFF; stroke: #000000; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feathered</text>
  <text x="50" y="120" class="subtitle">[ˈfɛðərd] adj. 有羽毛的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feather (羽毛) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鸟，全身覆盖着"羽毛(feather)"，
    <tspan x="50" dy="25">它飞翔在蓝天中，羽毛随风飘动，这就是"有羽毛的(feathered)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bird's wings were feathered and graceful.
  </text>
  <text x="50" y="310" class="content">
    这只鸟的翅膀有羽毛，非常优雅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Bird head -->
    <circle cx="150" cy="80" r="20" class="image" />
    <!-- Bird beak -->
    <polygon points="170,80 180,70 180,90" class="image" />
    <!-- Bird wings -->
    <path d="M 50 100 Q 0 50 50 0 L 100 50 Z" class="image" />
    <path d="M 150 100 Q 200 50 150 0 L 100 50 Z" class="image" />
    <!-- Feathers -->
    <polygon points="100,100 80,120 120,120" class="feather" />
    <polygon points="100,100 70,130 130,130" class="feather" />
    <polygon points="100,100 60,140 140,140" class="feather" />
  </g>
</svg>