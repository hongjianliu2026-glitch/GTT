<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">derivative</text>
  <text x="50" y="120" class="subtitle">[dɪˈrɪvətɪv] n. 派生物，衍生物；adj. 派生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + riv (河流) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流(riv)，向下(de-)流淌，最终形成了
    <tspan x="50" dy="25">它的支流(derivative)，这些支流就是河流的派生物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The derivative of a function is its rate of change.
  </text>
  <text x="50" y="310" class="content">
    函数的导数是它的变化率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q100 50 200 100 T400 100" class="image" />
    <!-- Derivative streams -->
    <path d="M100 100 Q120 120 140 100" class="image" />
    <path d="M200 100 Q220 120 240 100" class="image" />
    <path d="M300 100 Q320 120 340 100" class="image" />
    <!-- Labels -->
    <text x="100" y="130" class="content">派生物</text>
    <text x="200" y="130" class="content">派生物</text>
    <text x="300" y="130" class="content">派生物</text>
  </g>
</svg>