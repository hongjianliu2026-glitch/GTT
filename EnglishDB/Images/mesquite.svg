<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mesquite</text>
  <text x="50" y="120" class="subtitle">[məˈskit] n. 牧豆树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mes- (中间) + quite (安静)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片沙漠中，"中间(mes-)"有一棵"安静(quite)"的牧豆树(mesquite)，
    <tspan x="50" dy="25">它静静地伫立在沙丘之间，为沙漠带来一丝绿意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mesquite tree provided shade in the scorching desert.
  </text>
  <text x="50" y="310" class="content">
    牧豆树在酷热的沙漠中提供了阴凉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert sand -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mesquite tree -->
    <line x1="175" y1="20" x2="175" y2="100" class="image" />
    <line x1="150" y1="60" x2="200" y2="60" class="image" />
    <line x1="160" y1="40" x2="190" y2="40" class="image" />
    <line x1="165" y1="80" x2="185" y2="80" class="image" />
    <!-- Leaves -->
    <circle cx="175" cy="30" r="10" class="image" />
    <circle cx="160" cy="50" r="10" class="image" />
    <circle cx="190" cy="50" r="10" class="image" />
    <circle cx="175" cy="70" r="10" class="image" />
  </g>
</svg>