<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Finn</text>
  <text x="50" y="120" class="subtitle">[fɪn] n. 芬恩（人名）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自爱尔兰语，意为“白色”或“公平”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个名叫Finn的男孩，他有着一头雪白的头发，
    <tspan x="50" dy="25">就像冬天的雪花一样纯洁无瑕。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Finn is a kind and fair-minded person.
  </text>
  <text x="50" y="310" class="content">
    芬恩是一个善良且公正的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Boy with white hair -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="200" class="image" />
    <line x1="100" y1="180" x2="150" y2="200" class="image" />
    <!-- White hair -->
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <line x1="80" y1="40" x2="120" y2="40" class="image" />
    <line x1="90" y1="30" x2="110" y2="30" class="image" />
    <line x1="100" y1="20" x2="100" y2="10" class="image" />
  </g>
</svg>