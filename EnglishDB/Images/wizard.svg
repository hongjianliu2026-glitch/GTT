<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wizard</text>
  <text x="50" y="120" class="subtitle">[ˈwɪzərd] n. 巫师，奇才</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wiz (知道) + -ard (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"知道(wiz)"一切的"人(-ard)"，
    <tspan x="50" dy="25">他挥舞着魔杖，变出各种神奇的东西，</tspan>
    <tspan x="50" dy="25">这就是我们所说的巫师(wizard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Harry Potter is a famous wizard in the magical world.
  </text>
  <text x="50" y="310" class="content">
    哈利·波特是魔法世界中著名的巫师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wizard's hat -->
    <path d="M 0 0 L 50 0 L 75 50 L 25 100 L -25 50 Z" class="image" />
    <!-- Wizard's face -->
    <circle cx="25" cy="120" r="20" class="image" />
    <!-- Wizard's robe -->
    <rect x="0" y="140" width="50" height="100" class="image" />
    <!-- Wizard's wand -->
    <line x1="25" y1="240" x2="25" y2="300" class="image" />
    <!-- Magic sparkles -->
    <circle cx="25" cy="270" r="5" class="image" />
    <circle cx="20" cy="260" r="5" class="image" />
    <circle cx="30" cy="260" r="5" class="image" />
  </g>
</svg>