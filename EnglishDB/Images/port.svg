<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">port</text>
  <text x="50" y="120" class="subtitle">[pɔːrt] n. 港口，端口；v. 搬运，携带</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> port (搬运)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的港口，"搬运(port)"
    <tspan x="50" dy="25">着无数的货物，这些货物通过港口进出，</tspan>
    <tspan x="50" dy="25">就像数据通过端口传输一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship will dock at the port tomorrow.
  </text>
  <text x="50" y="310" class="content">
    这艘船明天将在港口停靠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Port -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ship -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cargo -->
    <rect x="70" y="50" width="50" height="50" class="image" />
    <rect x="140" y="50" width="50" height="50" class="image" />
    <rect x="210" y="50" width="50" height="50" class="image" />
    <!-- Crane -->
    <line x1="20" y1="100" x2="20" y2="150" class="image" />
    <line x1="20" y1="100" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="150" class="image" />
    <!-- Water -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>