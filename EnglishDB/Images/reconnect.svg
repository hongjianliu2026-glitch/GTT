<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reconnect</text>
  <text x="50" y="120" class="subtitle">[ˌriːkəˈnekt] v. 重新连接，恢复联系</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + connect (连接)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人曾经失去联系，现在他们"再次连接(re-connect)"
    <tspan x="50" dy="25">在一起，重新建立了友谊。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After years of separation, they finally reconnected.
  </text>
  <text x="50" y="310" class="content">
    经过多年的分离，他们终于重新联系上了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Broken connection -->
    <line x1="70" y1="100" x2="230" y2="100" class="image" stroke-dasharray="10,5" />
    <!-- Reconnected connection -->
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <!-- Handshake -->
    <line x1="150" y1="100" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="130" y2="150" class="image" />
    <line x1="150" y1="130" x2="170" y2="150" class="image" />
  </g>
</svg>