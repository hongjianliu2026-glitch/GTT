<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eagerly</text>
  <text x="50" y="120" class="subtitle">[ˈiːɡərli] adv. 渴望地，急切地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eag (渴望) + -er (表程度) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人眼睛瞪得大大的，"渴望地(eag-er-ly)"
    <tspan x="50" dy="25">盯着前方，仿佛看到了梦寐以求的东西。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She eagerly awaited the arrival of her new book.
  </text>
  <text x="50" y="310" class="content">
    她急切地等待着新书的到来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eyes -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Pupils -->
    <circle cx="100" cy="100" r="15" fill="#000" />
    <circle cx="200" cy="100" r="15" fill="#000" />
    <!-- Eyebrows -->
    <line x1="70" y1="70" x2="130" y2="70" class="image" />
    <line x1="170" y1="70" x2="230" y2="70" class="image" />
    <!-- Mouth -->
    <path d="M100,150 Q150,180 200,150" class="image" />
  </g>
</svg>