<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">starkly</text>
  <text x="50" y="120" class="subtitle">[ˈstɑːrkli] adv. 完全地，明显地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stark (完全的，明显的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的黑白对比画面，"完全地(stark)"
    <tspan x="50" dy="25">展示出事物的本质，没有任何模糊之处。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The difference between the two designs was starkly apparent.
  </text>
  <text x="50" y="310" class="content">
    两种设计之间的差异非常明显。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Black and white contrast -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="150" height="160" class="image" fill="#000" />
    <rect x="200" y="20" width="150" height="160" class="image" fill="#FFF" />
    <!-- Arrow pointing to the contrast -->
    <line x1="125" y1="180" x2="225" y2="180" class="image" />
    <polygon points="225,180 215,170 215,190" class="image" />
  </g>
</svg>