<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7D3C98; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Victorian</text>
  <text x="50" y="120" class="subtitle">[vɪkˈtɔːriən] adj. 维多利亚时代的；n. 维多利亚时代的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> victori (胜利) + -an (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着高帽、穿着维多利亚时代服装的人，站在一个巨大的胜利(victori)拱门下，
    <tspan x="50" dy="25">象征着那个时代的繁荣与胜利。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Victorian era was known for its elaborate architecture.
  </text>
  <text x="50" y="310" class="content">
    维多利亚时代以其精美的建筑而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Victorian person -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <rect x="40" y="80" width="20" height="10" class="image" /> <!-- Hat -->
    <!-- Victory arch -->
    <path d="M10,250 Q50,200 90,250" class="image" />
    <path d="M10,250 Q50,300 90,250" class="image" />
    <line x1="10" y1="250" x2="90" y2="250" class="image" />
  </g>
</svg>