<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seaside</text>
  <text x="50" y="120" class="subtitle">[ˈsiːsaɪd] n. 海边，海滨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sea (海) + side (边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你站在海边，海浪轻轻拍打着沙滩，
    <tspan x="50" dy="25">海风拂面，阳光洒在身上，这就是"海边的(seaside)"景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We spent our summer vacation at the seaside.
  </text>
  <text x="50" y="310" class="content">
    我们在海边度过了暑假。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" fill="#4CAF50" />
    <!-- Beach -->
    <rect x="0" y="150" width="350" height="50" fill="#F4D03F" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" fill="#FFEB3B" />
    <!-- Waves -->
    <path d="M0 100 Q50 120, 100 100 T200 100 T300 100 T350 100" stroke="#2196F3" stroke-width="5" fill="none" />
    <!-- Person -->
    <circle cx="100" cy="180" r="15" fill="#FF5722" />
    <line x1="100" y1="195" x2="100" y2="230" stroke="#FF5722" stroke-width="2" />
    <line x1="100" y1="230" x2="80" y2="260" stroke="#FF5722" stroke-width="2" />
    <line x1="100" y1="230" x2="120" y2="260" stroke="#FF5722" stroke-width="2" />
    <line x1="100" y1="210" x2="130" y2="200" stroke="#FF5722" stroke-width="2" />
  </g>
</svg>