<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acrid</text>
  <text x="50" y="120" class="subtitle">[ˈækrɪd] adj. 辛辣的，刺激性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> acri- (尖锐) + -d (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的辣椒，"尖锐(acri-)"
    <tspan x="50" dy="25">的味道刺激着你的味蕾，让你感到辛辣(acrid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The acrid smell of burning plastic filled the room.
  </text>
  <text x="50" y="310" class="content">
    燃烧塑料的辛辣气味充满了房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large chili pepper -->
    <path d="M 0 0 L 100 0 L 150 100 L 100 200 L 0 200 Z" class="image" fill="#FF6347" />
    <!-- Spicy effect -->
    <line x1="50" y1="50" x2="70" y2="70" class="image" stroke="#FF4500" />
    <line x1="50" y1="70" x2="70" y2="50" class="image" stroke="#FF4500" />
    <line x1="50" y1="90" x2="70" y2="110" class="image" stroke="#FF4500" />
    <line x1="50" y1="110" x2="70" y2="90" class="image" stroke="#FF4500" />
    <line x1="50" y1="130" x2="70" y2="150" class="image" stroke="#FF4500" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" stroke="#FF4500" />
  </g>
</svg>