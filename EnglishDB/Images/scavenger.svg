<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scavenger</text>
  <text x="50" y="120" class="subtitle">[ˈskævɪndʒər] n. 清道夫，食腐动物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scav (清理) + -enger (人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只秃鹫在荒野中，"清理(scav)"
    <tspan x="50" dy="25">地上的腐肉，它就是自然界的清道夫(scavenger)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Vultures are natural scavengers that help clean up the environment.
  </text>
  <text x="50" y="310" class="content">
    秃鹫是自然界的清道夫，有助于清理环境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vulture -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Dead animal -->
    <rect x="120" y="150" width="100" height="50" class="image" />
    <line x1="120" y1="150" x2="220" y2="150" class="image" />
    <line x1="120" y1="200" x2="220" y2="200" class="image" />
    <line x1="120" y1="150" x2="120" y2="200" class="image" />
    <line x1="220" y1="150" x2="220" y2="200" class="image" />
  </g>
</svg>