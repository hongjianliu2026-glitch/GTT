<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ecologically</text>
  <text x="50" y="120" class="subtitle">[ˌiːkəˈlɒdʒɪkli] adv. 生态地，生态学地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eco- (生态) + logy (学科) + -ical (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个生态学家在森林中，"生态地(eco-logy-ical-ly)"
    <tspan x="50" dy="25">观察和研究自然环境，确保生态平衡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We should act ecologically to protect our planet.
  </text>
  <text x="50" y="310" class="content">
    我们应该生态地行动以保护我们的星球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
    <!-- Ecologist -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Binoculars -->
    <line x1="200" y1="80" x2="220" y2="80" class="image" />
    <line x1="200" y1="85" x2="220" y2="85" class="image" />
  </g>
</svg>