<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cosmetics</text>
  <text x="50" y="120" class="subtitle">[kɑzˈmetɪks] n. 化妆品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cosmo- (宇宙) + tic (与...有关的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化妆师在宇宙飞船上，"用宇宙级的(cosmo-)"
    <tspan x="50" dy="25">化妆品(cosmetics)打造完美妆容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a variety of cosmetics at the store.
  </text>
  <text x="50" y="310" class="content">
    她在商店里买了各种各样的化妆品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Makeup kit -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lipstick -->
    <rect x="50" y="20" width="20" height="160" class="image" />
    <circle cx="60" cy="180" r="10" class="image" />
    <!-- Eye shadow -->
    <rect x="100" y="20" width="20" height="160" class="image" />
    <circle cx="110" cy="180" r="10" class="image" />
    <!-- Foundation -->
    <rect x="150" y="20" width="20" height="160" class="image" />
    <circle cx="160" cy="180" r="10" class="image" />
    <!-- Mascara -->
    <rect x="200" y="20" width="20" height="160" class="image" />
    <circle cx="210" cy="180" r="10" class="image" />
    <!-- Blush -->
    <rect x="250" y="20" width="20" height="160" class="image" />
    <circle cx="260" cy="180" r="10" class="image" />
    <!-- Makeup artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>