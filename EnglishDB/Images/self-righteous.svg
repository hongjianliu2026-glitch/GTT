<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-righteous</text>
  <text x="50" y="120" class="subtitle">[ˌsɛlfˈraɪtʃəs] adj. 自以为是的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + right (正确) + -eous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高台上，"自以为(self-)"
    <tspan x="50" dy="25">自己永远是对的(right-eous)，</tspan>
    <tspan x="50" dy="25">俯视众人，显得非常自大。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He always acts self-righteous, thinking he's always right.
  </text>
  <text x="50" y="310" class="content">
    他总是表现得自以为是，认为自己永远是对的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on the platform -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="140" x2="120" y2="130" class="image" />
    <line x1="175" y1="140" x2="230" y2="130" class="image" />
    <!-- Halo above the head -->
    <circle cx="175" cy="80" r="15" class="image" />
  </g>
</svg>