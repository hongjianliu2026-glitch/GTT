<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smallmouth</text>
  <text x="50" y="120" class="subtitle">[ˈsmɔːlmaʊθ] n. 小嘴鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> small (小) + mouth (嘴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条鱼，它的嘴巴非常小，就像一个小小的"小嘴(small-mouth)"，
    <tspan x="50" dy="25">这种鱼就叫做小嘴鱼(smallmouth)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smallmouth bass is a popular game fish.
  </text>
  <text x="50" y="310" class="content">
    小嘴鲈鱼是一种受欢迎的游钓鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Fish tail -->
    <polygon points="250,100 280,80 280,120" class="image" />
    <!-- Fish eye -->
    <circle cx="100" cy="90" r="10" class="image" />
    <!-- Fish mouth -->
    <line x1="120" y1="110" x2="140" y2="110" class="image" />
    <!-- Small mouth annotation -->
    <text x="120" y="130" class="highlight">小嘴</text>
  </g>
</svg>