<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knight</text>
  <text x="50" y="120" class="subtitle">[naɪt] n. 骑士，武士</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cniht (男孩，年轻人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个年轻的男孩(cniht)，经过训练和磨砺，
    <tspan x="50" dy="25">最终成为一名英勇的骑士(knight)，骑着战马，</tspan>
    <tspan x="50" dy="25">手持长剑，守护着他的王国。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The knight fought bravely in the battle.
  </text>
  <text x="50" y="310" class="content">
    骑士在战斗中英勇奋战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Knight -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="20" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="80" y2="160" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="120" x2="50" y2="140" class="image" /> <!-- Sword -->
    <!-- Horse -->
    <circle cx="150" cy="180" r="30" class="image" /> <!-- Horse body -->
    <line x1="150" y1="180" x2="150" y2="220" class="image" /> <!-- Horse neck -->
    <line x1="150" y1="220" x2="120" y2="240" class="image" /> <!-- Horse front leg -->
    <line x1="150" y1="220" x2="180" y2="240" class="image" /> <!-- Horse back leg -->
    <line x1="150" y1="180" x2="120" y2="160" class="image" /> <!-- Horse front leg -->
    <line x1="150" y1="180" x2="180" y2="160" class="image" /> <!-- Horse back leg -->
    <!-- Knight on horse -->
    <line x1="50" y1="180" x2="150" y2="180" class="image" /> <!-- Knight on horse -->
  </g>
</svg>