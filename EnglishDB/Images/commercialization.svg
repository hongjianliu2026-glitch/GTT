<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commercialization</text>
  <text x="50" y="120" class="subtitle">[kəˌmɜːrʃələˈzeɪʃn] n. 商业化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + merc (商业) + -ial (形容词后缀) + -ize (动词后缀) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个发明家把他的发明"共同(com-)"推向市场，"商业(merc)"
    <tspan x="50" dy="25">化(ial-ize-ation)"，让每个人都能买到这个产品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The commercialization of the new technology was a huge success.
  </text>
  <text x="50" y="310" class="content">
    这项新技术的商业化取得了巨大的成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Product -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Money -->
    <rect x="100" y="80" width="50" height="40" class="image" />
    <line x1="100" y1="80" x2="150" y2="120" class="image" />
    <line x1="150" y1="80" x2="100" y2="120" class="image" />
    <!-- People -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>