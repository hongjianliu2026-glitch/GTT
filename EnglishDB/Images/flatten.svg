<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flatten</text>
  <text x="50" y="120" class="subtitle">[ˈflætn] v. 使变平，压平</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flat (平的) + -en (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的铁锤，"使(en)"
    <tspan x="50" dy="25">一个凸起的山丘"变平(flat)"，</tspan>
    <tspan x="50" dy="25">整个过程就像压平(flatten)一张纸一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road crew flattened the gravel to make it smooth.
  </text>
  <text x="50" y="310" class="content">
    道路施工队把碎石压平，使其变得平滑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <rect x="0" y="0" width="100" height="20" class="image" />
    <rect x="40" y="20" width="20" height="100" class="image" />
    <!-- Hill -->
    <path d="M 150 120 Q 200 20 250 120" class="image" />
    <!-- Flattened hill -->
    <rect x="150" y="120" width="100" height="20" class="image" />
  </g>
</svg>