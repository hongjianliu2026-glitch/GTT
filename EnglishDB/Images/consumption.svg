<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consumption</text>
  <text x="50" y="120" class="subtitle">[kənˈsʌmpʃən] n. 消费，消耗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + sumpt (拿) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围在一起，"一起拿(con-sumpt)"
    <tspan x="50" dy="25">食物，然后吃掉，这就是消费(consumption)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The consumption of electricity has increased significantly.
  </text>
  <text x="50" y="310" class="content">
    电力的消耗显著增加。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Food -->
    <rect x="100" y="50" width="100" height="50" class="image" />
    <!-- Eating action -->
    <line x1="70" y1="120" x2="150" y2="70" class="image" />
    <line x1="170" y1="120" x2="150" y2="70" class="image" />
    <line x1="270" y1="120" x2="200" y2="70" class="image" />
  </g>
</svg>