<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monument</text>
  <text x="50" y="120" class="subtitle">[ˈmɒnjumənt] n. 纪念碑，纪念物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> monu (提醒) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头纪念碑，"提醒(monu)"
    <tspan x="50" dy="25">人们记住历史上的重要事件或人物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The monument commemorates the soldiers who died in the war.
  </text>
  <text x="50" y="310" class="content">
    这座纪念碑是为了纪念在战争中牺牲的士兵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Monument base -->
    <rect x="0" y="150" width="200" height="50" class="image" />
    <!-- Monument pillar -->
    <rect x="80" y="0" width="40" height="150" class="image" />
    <!-- Top of the monument -->
    <polygon points="60,0 100,0 120,30 80,30" class="image" />
    <!-- Text on the monument -->
    <text x="85" y="20" class="content" style="font-size: 12px;">纪念</text>
  </g>
</svg>