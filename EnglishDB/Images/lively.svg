<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lively</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪvli] adj. 活泼的，生动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> live (生活) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满活力的场景，"生活(live)"
    <tspan x="50" dy="25">中充满了欢笑和活力，这就是lively(活泼的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The party was lively with music and dancing.
  </text>
  <text x="50" y="310" class="content">
    派对在音乐和舞蹈中充满了活力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Happy face -->
    <circle cx="50" cy="50" r="40" class="image" fill="#2ECC71" />
    <circle cx="35" cy="40" r="5" class="image" fill="#000" />
    <circle cx="65" cy="40" r="5" class="image" fill="#000" />
    <path d="M35 60 Q50 80 65 60" class="image" fill="#000" />

    <!-- Dancing figure -->
    <circle cx="150" cy="50" r="15" class="image" fill="#E74C3C" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="80" x2="130" y2="70" class="image" />
    <line x1="150" y1="80" x2="170" y2="70" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />

    <!-- Music notes -->
    <path d="M200 50 Q210 30 220 50 T240 50" class="image" fill="none" stroke="#3498DB" stroke-width="3" />
    <path d="M220 60 Q230 40 240 60 T260 60" class="image" fill="none" stroke="#3498DB" stroke-width="3" />
  </g>
</svg>