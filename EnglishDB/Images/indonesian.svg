<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Indonesian</text>
  <text x="50" y="120" class="subtitle">[ˌɪndəˈniːziən] adj. 印度尼西亚的；n. 印度尼西亚人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Indo- (印度) + nesia (岛屿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个印度尼西亚人站在一个巨大的岛屿上，
    <tspan x="50" dy="25">"印度(Indo-)"和"岛屿(nesia)"的结合，</tspan>
    <tspan x="50" dy="25">形成了"印度尼西亚(Indonesian)"这个国家。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is an Indonesian who speaks fluent Bahasa.
  </text>
  <text x="50" y="310" class="content">
    她是一位能说流利巴哈萨语的印度尼西亚人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Island -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Person -->
    <circle cx="175" cy="80" r="15" class="image" />
    <line x1="175" y1="95" x2="175" y2="130" class="image" />
    <line x1="175" y1="130" x2="155" y2="160" class="image" />
    <line x1="175" y1="130" x2="195" y2="160" class="image" />
    <line x1="175" y1="110" x2="145" y2="100" class="image" />
    <line x1="175" y1="110" x2="205" y2="100" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <line x1="300" y1="80" x2="300" y2="120" class="image" />
    <line x1="280" y1="100" x2="320" y2="100" class="image" />
    <line x1="290" y1="70" x2="310" y2="90" class="image" />
    <line x1="290" y1="90" x2="310" y2="70" class="image" />
  </g>
</svg>