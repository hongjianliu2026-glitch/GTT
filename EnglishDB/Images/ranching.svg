<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ranching</text>
  <text x="50" y="120" class="subtitle">[ˈræntʃɪŋ] n. 牧场经营，放牧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ranch (牧场) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个广阔的牧场，"牧场经营(ranching)"
    <tspan x="50" dy="25">中，牛群在草原上自由奔跑，牧场主忙碌地管理着一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He decided to pursue a career in ranching after college.
  </text>
  <text x="50" y="310" class="content">
    他决定大学毕业后从事牧场经营。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ranch -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Grass -->
    <rect x="50" y="150" width="250" height="50" class="image" />
    <!-- Cow -->
    <circle cx="100" cy="120" r="20" class="image" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="160" x2="80" y2="150" class="image" />
    <line x1="100" y1="160" x2="120" y2="150" class="image" />
    <line x1="100" y1="180" x2="80" y2="200" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
    <!-- Ranch owner -->
    <circle cx="250" cy="120" r="15" class="image" />
    <line x1="250" y1="135" x2="250" y2="170" class="image" />
    <line x1="250" y1="170" x2="230" y2="200" class="image" />
    <line x1="250" y1="170" x2="270" y2="200" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />
  </g>
</svg>