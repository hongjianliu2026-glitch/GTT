<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tireless</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪərləs] adj. 不知疲倦的，不屈不挠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tire (疲倦) + less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个超人，他"没有疲倦(tire-less)"，
    <tspan x="50" dy="25">永远在奔跑，永不停止，这就是不知疲倦的(tireless)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a tireless worker, always putting in extra hours.
  </text>
  <text x="50" y="310" class="content">
    她是一个不知疲倦的工人，总是加班加点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Superhero -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Running path -->
    <line x1="100" y1="250" x2="300" y2="250" class="image" />
    <line x1="300" y1="250" x2="350" y2="200" class="image" />
    <line x1="350" y1="200" x2="400" y2="250" class="image" />
    <line x1="400" y1="250" x2="600" y2="250" class="image" />
    <!-- Superhero running -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="200" class="image" />
    <line x1="150" y1="150" x2="120" y2="180" class="image" />
    <line x1="150" y1="150" x2="180" y2="180" class="image" />
    <line x1="150" y1="200" x2="120" y2="250" class="image" />
    <line x1="150" y1="200" x2="180" y2="250" class="image" />
  </g>
</svg>