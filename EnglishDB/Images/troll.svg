<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">troll</text>
  <text x="50" y="120" class="subtitle">[troʊl] n. 巨魔，网络喷子；v. 钓鱼，挑衅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> troll (源自挪威语，意为“巨魔”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨魔(troll)在网络上四处游荡，
    <tspan x="50" dy="25">用恶毒的言论"钓鱼(troll)"，挑衅他人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was banned from the forum for trolling.
  </text>
  <text x="50" y="310" class="content">
    他因在论坛上挑衅而被封禁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Troll -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Computer screen -->
    <rect x="100" y="20" width="250" height="160" class="image" />
    <!-- Speech bubble -->
    <path d="M120,50 Q150,30 180,50 T240,50" class="image" />
    <text x="130" y="60" class="content">恶毒言论</text>
  </g>
</svg>