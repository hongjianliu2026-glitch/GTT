<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marvelous</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrvələs] adj. 极好的，非凡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> marvel (奇迹) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满奇迹(marvel)的世界，
    <tspan x="50" dy="25">每一个角落都充满了令人惊叹的景象，</tspan>
    <tspan x="50" dy="25">这就是marvelous(极好的)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The performance was simply marvelous.
  </text>
  <text x="50" y="310" class="content">
    这场表演简直太棒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Background for visual -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Star -->
    <polygon points="175,20 210,100 280,100 225,150 250,220 175,180 100,220 125,150 70,100 140,100" class="image" />
    <!-- Rainbow -->
    <path d="M50,150 C100,50 250,50 300,150" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="40" ry="20" class="image" />
    <ellipse cx="200" cy="70" rx="50" ry="30" class="image" />
  </g>
</svg>