<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">since</text>
  <text x="50" y="120" class="subtitle">[sɪns] prep. 自从；conj. 因为</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (表示加强) + ince (来自拉丁语 'in'，表示在...里面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在时间的长河中，"自从(since)"
    <tspan x="50" dy="25">某个时刻开始，他就一直在那里，从未离开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I have been working here since 2010.
  </text>
  <text x="50" y="310" class="content">
    我从2010年开始就在这里工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Time river -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Person in the river -->
    <circle cx="175" cy="50" r="15" class="image" />
    <line x1="175" y1="65" x2="175" y2="100" class="image" />
    <line x1="175" y1="100" x2="155" y2="130" class="image" />
    <line x1="175" y1="100" x2="195" y2="130" class="image" />
    <line x1="175" y1="80" x2="205" y2="70" class="image" />
  </g>
</svg>