<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hairdresser</text>
  <text x="50" y="120" class="subtitle">[ˈheədresə(r)] n. 理发师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hair (头发) + dress (打扮) + er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个理发师在给顾客"打扮(dress)"
    <tspan x="50" dy="25">头发(hair)，他就是个理发师(hairdresser)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She went to the hairdresser to get a new hairstyle.
  </text>
  <text x="50" y="310" class="content">
    她去理发店换个新发型。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hairdresser -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Customer -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="200" y2="120" class="image" />
    <!-- Hair -->
    <path d="M140,80 Q150,50 160,80" class="image" />
    <path d="M135,85 Q150,60 165,85" class="image" />
    <path d="M130,90 Q150,70 170,90" class="image" />
    <!-- Scissors -->
    <line x1="20" y1="100" x2="50" y2="70" class="image" />
    <line x1="20" y1="100" x2="50" y2="130" class="image" />
  </g>
</svg>