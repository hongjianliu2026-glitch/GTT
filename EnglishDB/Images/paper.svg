<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paper</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪpər] n. 纸，报纸；v. 用纸包装</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pap (纸) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张巨大的纸(pap-er)，上面写满了各种信息，
    <tspan x="50" dy="25">就像一份报纸，承载着世界的动态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wrote her essay on a piece of paper.
  </text>
  <text x="50" y="310" class="content">
    她在一张纸上写下了她的论文。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Paper -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Lines on the paper -->
    <line x1="20" y1="30" x2="280" y2="30" class="image" />
    <line x1="20" y1="60" x2="280" y2="60" class="image" />
    <line x1="20" y1="90" x2="280" y2="90" class="image" />
    <line x1="20" y1="120" x2="280" y2="120" class="image" />
    <line x1="20" y1="150" x2="280" y2="150" class="image" />
    <!-- Pen writing on the paper -->
    <line x1="20" y1="30" x2="20" y2="150" class="image" />
    <circle cx="20" cy="160" r="5" class="image" />
  </g>
</svg>