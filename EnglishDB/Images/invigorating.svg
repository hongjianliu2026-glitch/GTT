<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">invigorating</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvɪɡəreɪtɪŋ] adj. 使人精力充沛的，令人振奋的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vigor (活力) + -ate (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人喝了一杯"充满活力(vigor)"的饮料，
    <tspan x="50" dy="25">瞬间"进入(in)"了充满能量的状态，整个人都"振奋(invigorating)"了起来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fresh mountain air was invigorating.
  </text>
  <text x="50" y="310" class="content">
    新鲜的山区空气令人精神振奋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Drink -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="160" r="10" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="170" y2="250" class="image" />
    <line x1="200" y1="200" x2="230" y2="250" class="image" />
    <line x1="200" y1="150" x2="150" y2="140" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
    <!-- Energy lines -->
    <line x1="200" y1="100" x2="150" y2="50" class="image" />
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
    <line x1="200" y1="100" x2="100" y2="100" class="image" />
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
  </g>
</svg>