<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .heart { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heart</text>
  <text x="50" y="120" class="subtitle">[hɑːrt] n. 心脏，心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 hert，意为“心脏”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗跳动的心脏，"心(heart)"
    <tspan x="50" dy="25">是生命的源泉，象征着爱与情感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wears her heart on her sleeve.
  </text>
  <text x="50" y="310" class="content">
    她毫不掩饰自己的感情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10,30 A20,20,0,0,1,50,30 A20,20,0,0,1,90,30 Q90,60,50,90 Q10,60,10,30 Z" class="heart" />
    <!-- Arrows -->
    <line x1="50" y1="90" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="40" y2="110" class="image" />
    <line x1="50" y1="120" x2="60" y2="110" class="image" />
  </g>
</svg>