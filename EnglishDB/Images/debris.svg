<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">debris</text>
  <text x="50" y="120" class="subtitle">[dəˈbriː] n. 碎片，残骸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + bris (打破)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场灾难后，"向下打破(de-bris)"
    <tspan x="50" dy="25">的物体散落一地，这些碎片(debris)就是灾难的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cleanup crew worked to clear the debris from the accident site.
  </text>
  <text x="50" y="310" class="content">
    清理人员努力清理事故现场的碎片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken objects -->
    <line x1="50" y1="20" x2="100" y2="70" class="image" />
    <line x1="50" y1="70" x2="100" y2="20" class="image" />
    <line x1="150" y1="20" x2="200" y2="70" class="image" />
    <line x1="150" y1="70" x2="200" y2="20" class="image" />
    <line x1="250" y1="20" x2="300" y2="70" class="image" />
    <line x1="250" y1="70" x2="300" y2="20" class="image" />
    <!-- Ground -->
    <rect x="0" y="100" width="350" height="20" class="image" />
  </g>
</svg>