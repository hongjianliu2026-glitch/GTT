<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">versatility</text>
  <text x="50" y="120" class="subtitle">[ˌvɜːrsəˈtɪləti] n. 多功能性，多才多艺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vers (转) + -at (表动词) + -ility (表名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人能够"转动(vers)"成各种角色，从音乐家到画家，再到运动员，
    <tspan x="50" dy="25">这种多才多艺的能力就是多功能性(versatility)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her versatility as an actress makes her a sought-after talent.
  </text>
  <text x="50" y="310" class="content">
    她作为演员的多才多艺使她成为备受追捧的人才。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />

    <!-- Instruments -->
    <rect x="100" y="80" width="40" height="120" class="image" /> <!-- Guitar -->
    <rect x="160" y="80" width="40" height="120" class="image" /> <!-- Paintbrush -->
    <rect x="220" y="80" width="40" height="120" class="image" /> <!-- Tennis racket -->

    <!-- Connecting lines -->
    <line x1="70" y1="100" x2="120" y2="140" class="image" />
    <line x1="70" y1="100" x2="180" y2="140" class="image" />
    <line x1="70" y1="100" x2="240" y2="140" class="image" />
  </g>
</svg>