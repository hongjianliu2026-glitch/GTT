<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">penicillin</text>
  <text x="50" y="120" class="subtitle">[ˌpɛnɪˈsɪlɪn] n. 青霉素</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> penicill (小刷子) + -in (表示物质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家用"小刷子(penicill)"
    <tspan x="50" dy="25">在培养皿上刷出了一种神奇的物质，</tspan>
    <tspan x="50" dy="25">这种物质就是青霉素(penicillin)，</tspan>
    <tspan x="50" dy="25">它能够杀死细菌，拯救生命。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> Penicillin was discovered by Alexander Fleming in 1928.
  </text>
  <text x="50" y="330" class="content">
    青霉素是由亚历山大·弗莱明在1928年发现的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Petri dish -->
    <ellipse cx="200" cy="100" rx="150" ry="70" class="image" />
    <!-- Penicillium mold -->
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="170" cy="90" r="10" class="image" />
    <circle cx="190" cy="70" r="10" class="image" />
    <circle cx="210" cy="85" r="10" class="image" />
    <circle cx="230" cy="75" r="10" class="image" />
    <!-- Scientist -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Brush -->
    <line x1="50" y1="115" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="120" y2="90" class="image" />
  </g>
</svg>