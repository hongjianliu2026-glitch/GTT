<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">promotion</text>
  <text x="50" y="120" class="subtitle">[prəˈmoʊʃn] n. 提升，晋升；促销</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + mot (移动) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个员工在公司里，"向前移动(pro-mot)"
    <tspan x="50" dy="25">到更高的职位，这就是晋升(promotion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He got a promotion to the position of manager.
  </text>
  <text x="50" y="310" class="content">
    他获得了晋升，成为了经理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ladder -->
    <line x1="50" y1="20" x2="50" y2="200" class="image" />
    <line x1="40" y1="30" x2="60" y2="30" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="40" y1="120" x2="60" y2="120" class="image" />
    <line x1="40" y1="150" x2="60" y2="150" class="image" />
    <line x1="40" y1="180" x2="60" y2="180" class="image" />
    <!-- Employee climbing the ladder -->
    <circle cx="50" cy="10" r="15" class="image" />
    <line x1="50" y1="25" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="40" y2="70" class="image" />
    <line x1="50" y1="50" x2="60" y2="70" class="image" />
    <line x1="50" y1="40" x2="70" y2="30" class="image" />
  </g>
</svg>