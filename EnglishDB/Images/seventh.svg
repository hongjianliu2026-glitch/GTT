<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seventh</text>
  <text x="50" y="120" class="subtitle">[ˈsɛvənθ] adj. 第七的；n. 第七</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seven (七) + th (序数词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“7”，它站在一排数字的最前面，
    <tspan x="50" dy="25">骄傲地宣称自己是“第七(seventh)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She finished seventh in the race.
  </text>
  <text x="50" y="310" class="content">
    她在比赛中获得了第七名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large number 7 -->
    <text x="0" y="100" font-size="200" fill="#E74C3C">7</text>
    <!-- Smaller number 1-6 -->
    <text x="-50" y="250" font-size="50" fill="#34495E">1</text>
    <text x="0" y="250" font-size="50" fill="#34495E">2</text>
    <text x="50" y="250" font-size="50" fill="#34495E">3</text>
    <text x="100" y="250" font-size="50" fill="#34495E">4</text>
    <text x="150" y="250" font-size="50" fill="#34495E">5</text>
    <text x="200" y="250" font-size="50" fill="#34495E">6</text>
  </g>
</svg>