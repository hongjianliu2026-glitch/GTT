<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mean-spirited</text>
  <text x="50" y="120" class="subtitle">[ˌmiːnˈspɪrɪtɪd] adj. 心胸狭窄的，恶意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mean (卑鄙的) + spirit (精神)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人，他的心胸像被"卑鄙的(mean)"
    <tspan x="50" dy="25">精神(spirit)所占据，整个人都变得心胸狭窄、恶意满满。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His mean-spirited comments hurt everyone's feelings.
  </text>
  <text x="50" y="310" class="content">
    他心胸狭窄的评论伤害了大家的感情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Narrow-minded person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Narrow heart -->
    <rect x="30" y="230" width="40" height="20" class="image" />
    <line x1="30" y1="240" x2="70" y2="240" class="image" />
    <line x1="30" y1="250" x2="70" y2="250" class="image" />
    <line x1="30" y1="260" x2="70" y2="260" class="image" />
  </g>
</svg>