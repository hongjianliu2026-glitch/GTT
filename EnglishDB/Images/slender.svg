<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slender</text>
  <text x="50" y="120" class="subtitle">[ˈslendər] adj. 苗条的，纤细的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (表示“分开”) + l- (表示“长”) + end (表示“末端”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根细长的树枝，"分开(s-)"成两段，"长(l-)"到末端(end)，
    <tspan x="50" dy="25">就像一个苗条(slender)的人，身材纤细。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a slender figure and looks graceful.
  </text>
  <text x="50" y="310" class="content">
    她身材苗条，看起来很优雅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Slender figure -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="50" x2="20" y2="80" class="image" /> <!-- Left arm -->
    <line x1="50" y1="50" x2="80" y2="80" class="image" /> <!-- Right arm -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right leg -->
    <!-- Head -->
    <circle cx="50" cy="10" r="10" class="image" />
  </g>
</svg>