<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leach</text>
  <text x="50" y="120" class="subtitle">[liːtʃ] v. 过滤，渗滤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leach (源自中古英语 lechen，意为“过滤”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的漏斗，"过滤(leach)"
    <tspan x="50" dy="25">液体从上层慢慢渗入下层，就像水通过土壤一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rainwater leached the minerals from the soil.
  </text>
  <text x="50" y="310" class="content">
    雨水将矿物质从土壤中过滤出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Funnel -->
    <path d="M 0 0 L 100 0 L 150 100 L 50 100 Z" class="image" />
    <!-- Liquid -->
    <rect x="50" y="100" width="100" height="50" class="image" />
    <!-- Dripping liquid -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <!-- Soil -->
    <rect x="0" y="250" width="200" height="50" class="image" />
  </g>
</svg>