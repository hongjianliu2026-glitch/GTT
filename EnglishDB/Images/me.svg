<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">me</text>
  <text x="50" y="120" class="subtitle">[miː] pron. 我</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，简单代词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个镜子前，"我(me)"
    <tspan x="50" dy="25">在镜子中看到自己的倒影，这就是"我"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's important to be kind to me.
  </text>
  <text x="50" y="310" class="content">
    对自己好一点很重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="130" class="image" />
    <line x1="175" y1="150" x2="205" y2="130" class="image" />
    <line x1="175" y1="180" x2="145" y2="210" class="image" />
    <line x1="175" y1="180" x2="205" y2="210" class="image" />
  </g>
</svg>