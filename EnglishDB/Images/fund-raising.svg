<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fund-raising</text>
  <text x="50" y="120" class="subtitle">[ˈfʌndˌreɪzɪŋ] n. 筹款，募捐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fund (资金) + raise (提高)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围在一起，"提高(raise)"
    <tspan x="50" dy="25">他们的手，手里拿着钱，这些钱就构成了"资金(fund)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The charity organized a successful fund-raising event.
  </text>
  <text x="50" y="310" class="content">
    这个慈善机构组织了一次成功的筹款活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People raising hands -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="90" y2="70" class="image" />

    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="190" y2="70" class="image" />

    <circle cx="250" cy="50" r="15" class="image" />
    <line x1="250" y1="65" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <line x1="250" y1="80" x2="290" y2="70" class="image" />

    <!-- Money -->
    <rect x="100" y="150" width="50" height="20" class="image" />
    <rect x="160" y="150" width="50" height="20" class="image" />
    <rect x="220" y="150" width="50" height="20" class="image" />
  </g>
</svg>