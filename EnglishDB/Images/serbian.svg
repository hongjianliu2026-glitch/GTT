<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Serbian</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrbiən] adj. 塞尔维亚的；n. 塞尔维亚人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Serb (塞尔维亚人) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个塞尔维亚人(Serb)站在一片广阔的草原上，
    <tspan x="50" dy="25">他的身后是壮丽的山脉和古老的城堡，这就是塞尔维亚(Serbian)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Serbian language is rich in history and culture.
  </text>
  <text x="50" y="310" class="content">
    塞尔维亚语充满了历史和文化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Mountains -->
    <polyline points="100,200 150,100 200,200" class="image" />
    <polyline points="150,200 200,100 250,200" class="image" />
    <!-- Castle -->
    <rect x="220" y="120" width="60" height="80" class="image" />
    <line x1="230" y1="130" x2="280" y2="130" class="image" />
    <line x1="230" y1="150" x2="280" y2="150" class="image" />
    <line x1="230" y1="170" x2="280" y2="170" class="image" />
  </g>
</svg>