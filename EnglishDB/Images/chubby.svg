<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chubby</text>
  <text x="50" y="120" class="subtitle">[ˈtʃʌbi] adj. 圆胖的，丰满的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chub (圆胖) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个圆滚滚的小熊，"圆胖(chub)"得像个小球，
    <tspan x="50" dy="25">走起路来摇摇晃晃，可爱极了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby has chubby cheeks.
  </text>
  <text x="50" y="310" class="content">
    这个宝宝有着圆胖的脸颊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chubby bear -->
    <circle cx="100" cy="100" r="60" class="image" fill="#F1C40F" />
    <!-- Eyes -->
    <circle cx="75" cy="80" r="10" class="image" fill="#000" />
    <circle cx="125" cy="80" r="10" class="image" fill="#000" />
    <!-- Nose -->
    <circle cx="100" cy="110" r="15" class="image" fill="#E74C3C" />
    <!-- Mouth -->
    <path d="M 70 130 Q 100 150 130 130" class="image" fill="none" stroke="#000" stroke-width="3" />
    <!-- Body -->
    <ellipse cx="100" cy="180" rx="70" ry="40" class="image" fill="#F1C40F" />
    <!-- Arms -->
    <line x1="30" y1="150" x2="70" y2="170" class="image" />
    <line x1="170" y1="150" x2="130" y2="170" class="image" />
    <!-- Legs -->
    <line x1="70" y1="220" x2="70" y2="260" class="image" />
    <line x1="130" y1="220" x2="130" y2="260" class="image" />
  </g>
</svg>