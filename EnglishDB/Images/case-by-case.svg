<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">case-by-case</text>
  <text x="50" y="120" class="subtitle">[ˈkeɪs baɪ ˈkeɪs] adj. 逐案的，逐个的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> case (情况) + by (通过) + case (情况)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，"逐个(case-by-case)"
    <tspan x="50" dy="25">审理每个案件，每个案件都有其独特的情况。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The decision was made on a case-by-case basis.
  </text>
  <text x="50" y="310" class="content">
    决定是逐案做出的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Court -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cases -->
    <rect x="70" y="50" width="50" height="50" class="image" />
    <rect x="140" y="50" width="50" height="50" class="image" />
    <rect x="210" y="50" width="50" height="50" class="image" />
    <!-- Arrows -->
    <line x1="95" y1="100" x2="120" y2="100" class="image" />
    <line x1="165" y1="100" x2="190" y2="100" class="image" />
    <line x1="235" y1="100" x2="260" y2="100" class="image" />
    <polygon points="120,100 115,95 115,105" class="image" />
    <polygon points="190,100 185,95 185,105" class="image" />
    <polygon points="260,100 255,95 255,105" class="image" />
  </g>
</svg>