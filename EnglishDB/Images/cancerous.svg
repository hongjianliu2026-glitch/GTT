<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cancerous</text>
  <text x="50" y="120" class="subtitle">[ˈkænsərəs] adj. 癌的，致癌的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cancer (癌症) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个细胞在体内疯狂分裂，"癌变(cancer)"
    <tspan x="50" dy="25">成无数个，这些细胞就构成了癌(cancerous)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor warned him about the cancerous cells in his body.
  </text>
  <text x="50" y="310" class="content">
    医生警告他体内有癌细胞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cancer cell -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="80" cy="120" r="20" class="image" />
    <circle cx="110" cy="100" r="25" class="image" />
    <circle cx="140" cy="120" r="15" class="image" />
    <circle cx="170" cy="100" r="20" class="image" />
    <!-- Nucleus -->
    <circle cx="50" cy="100" r="10" fill="#E74C3C" />
    <circle cx="80" cy="120" r="8" fill="#E74C3C" />
    <circle cx="110" cy="100" r="9" fill="#E74C3C" />
    <circle cx="140" cy="120" r="7" fill="#E74C3C" />
    <circle cx="170" cy="100" r="8" fill="#E74C3C" />
  </g>
</svg>