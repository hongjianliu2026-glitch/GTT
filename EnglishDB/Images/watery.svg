<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">watery</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːtəri] adj. 水的，含水的，水汪汪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> water (水) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片水汪汪的田野，"水(water)"
    <tspan x="50" dy="25">覆盖了整个地面，形成了一片"水汪汪的(watery)"景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fields were left watery after the heavy rain.
  </text>
  <text x="50" y="310" class="content">
    大雨过后，田野变得水汪汪的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Watery field -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Water drops -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="90" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
  </g>
</svg>