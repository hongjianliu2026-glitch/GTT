<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">state-sponsored</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪt spɑnzərd] adj. 国家资助的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> state (国家) + sponsor (资助)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的国家标志（如国徽），上面有一个金色的钱袋，象征着国家资助。
    <tspan x="50" dy="25">这个钱袋正在向下滴钱，资助着各种项目和活动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event was a state-sponsored initiative to promote cultural exchange.
  </text>
  <text x="50" y="310" class="content">
    这个活动是国家资助的，旨在促进文化交流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- National emblem -->
    <circle cx="100" cy="100" r="50" class="image" />
    <text x="85" y="110" class="content" fill="#2C3E50">国徽</text>
    <!-- Money bag -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <text x="160" y="110" class="content" fill="#2C3E50">钱袋</text>
    <!-- Money drops -->
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="190" y2="220" class="image" />
    <line x1="200" y1="200" x2="210" y2="220" class="image" />
    <text x="185" y="230" class="content" fill="#2C3E50">滴钱</text>
  </g>
</svg>