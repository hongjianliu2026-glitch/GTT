<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warped</text>
  <text x="50" y="120" class="subtitle">[wɔːrpt] adj. 扭曲的，变形的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> war- (扭曲) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张原本平整的纸，被"扭曲(war-)"成了一个
    <tspan x="50" dy="25">夸张的形状，这就是"warped"的样子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mirror was so warped that it was impossible to see a clear reflection.
  </text>
  <text x="50" y="310" class="content">
    镜子扭曲得厉害，根本无法看到清晰的影像。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warped paper -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" />
    <path d="M50 100 Q100 130 150 100 T250 100" class="image" />
    <path d="M50 150 Q100 180 150 150 T250 150" class="image" />
    <!-- Warped lines -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>