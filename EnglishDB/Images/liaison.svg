<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liaison</text>
  <text x="50" y="120" class="subtitle">[liˈeɪzən] n. 联络，联系；联络人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> li- (连接) + -ais- (走) + -on (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个联络员在两个团队之间"来回走动(li-ais-on)"，
    <tspan x="50" dy="25">确保信息畅通无阻，这就是联络(liaison)的作用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She acts as a liaison between the marketing and sales departments.
  </text>
  <text x="50" y="310" class="content">
    她在市场部和销售部之间担任联络员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two teams -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="200" y="0" width="150" height="200" class="image" />
    <!-- Liaison -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="225" y2="120" class="image" />
    <line x1="175" y1="130" x2="125" y2="120" class="image" />
  </g>
</svg>