<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #FF4500; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fruit { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">citrus</text>
  <text x="50" y="120" class="subtitle">[ˈsɪtrəs] n. 柑橘类水果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> citr (柠檬) + -us (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的柠檬(citr)，它像太阳一样闪耀，
    <tspan x="50" dy="25">照亮了整个果园，这就是柑橘类水果(citrus)的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat citrus fruits in the morning.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在早上吃柑橘类水果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lemon -->
    <circle cx="100" cy="100" r="60" class="fruit" />
    <circle cx="120" cy="80" r="10" class="fruit" />
    <circle cx="80" cy="90" r="10" class="fruit" />
    <circle cx="110" cy="120" r="10" class="fruit" />
    <circle cx="90" cy="110" r="10" class="fruit" />
    <!-- Sun rays -->
    <line x1="100" y1="40" x2="100" y2="20" class="image" />
    <line x1="140" y1="60" x2="160" y2="40" class="image" />
    <line x1="140" y1="140" x2="160" y2="160" class="image" />
    <line x1="60" y1="60" x2="40" y2="40" class="image" />
    <line x1="60" y1="140" x2="40" y2="160" class="image" />
  </g>
</svg>