<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recess</text>
  <text x="50" y="120" class="subtitle">[rɪˈsɛs] n. 休息，休会；v. 使休息，使休会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + cess (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群学生在教室里，"向后走(re-cess)"
    <tspan x="50" dy="25">到教室的角落休息，这就是课间休息(recess)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher called for a recess after the long lecture.
  </text>
  <text x="50" y="310" class="content">
    老师在长时间的讲座后宣布休息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Students -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Teacher -->
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Recess area -->
    <rect x="200" y="150" width="100" height="30" class="image" />
    <text x="210" y="170" class="content">Recess</text>
  </g>
</svg>