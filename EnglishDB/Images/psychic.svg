<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psychic</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪkɪk] adj. 精神的，心灵的；n. 通灵的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psyche (心灵) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个通灵者，她的心灵(psyche)
    <tspan x="50" dy="25">能够感知到常人无法触及的领域，这就是她的通灵能力(psychic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The psychic claimed to know the future.
  </text>
  <text x="50" y="310" class="content">
    那个通灵者声称自己能预知未来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Psychic figure -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Energy waves -->
    <path d="M50,70 Q70,50 90,70 T130,70" class="image" />
    <path d="M50,80 Q70,60 90,80 T130,80" class="image" />
    <path d="M50,90 Q70,70 90,90 T130,90" class="image" />
  </g>
</svg>