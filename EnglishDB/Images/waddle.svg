<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">waddle</text>
  <text x="50" y="120" class="subtitle">[ˈwɒd(ə)l] v. 摇摇摆摆地走，蹒跚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wadd- (摇摆) + -le (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸭子，"摇摆(wadd-)"着走路，
    <tspan x="50" dy="25">每一步都显得笨拙而可爱，这就是"蹒跚(waddle)"的样子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby penguin waddled across the ice.
  </text>
  <text x="50" y="310" class="content">
    小企鹅摇摇摆摆地穿过冰面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Duck body -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <!-- Duck head -->
    <circle cx="150" cy="80" r="20" class="image" />
    <!-- Duck beak -->
    <polygon points="170,80 180,70 180,90" class="image" />
    <!-- Duck legs -->
    <line x1="80" y1="130" x2="80" y2="160" class="image" />
    <line x1="120" y1="130" x2="120" y2="160" class="image" />
    <!-- Waddle motion -->
    <line x1="80" y1="160" x2="60" y2="180" class="image" />
    <line x1="120" y1="160" x2="140" y2="180" class="image" />
  </g>
</svg>