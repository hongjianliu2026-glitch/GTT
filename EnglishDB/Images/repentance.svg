<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">repentance</text>
  <text x="50" y="120" class="subtitle">[rɪˈpɛntəns] n. 悔恨，悔改</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + pent (悔恨)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在教堂里，"再次悔恨(re-pent)"
    <tspan x="50" dy="25">自己的过错，脸上充满了悔恨的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His repentance was sincere after he realized his mistake.
  </text>
  <text x="50" y="310" class="content">
    意识到自己的错误后，他的悔恨是真诚的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Tears -->
    <circle cx="90" cy="90" r="5" class="image" />
    <circle cx="110" cy="90" r="5" class="image" />
    <!-- Cross -->
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
  </g>
</svg>