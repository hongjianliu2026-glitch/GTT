<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">low</text>
  <text x="50" y="120" class="subtitle">[loʊ] adj. 低的，矮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *lūhā (平坦的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山峰，突然间"低(low)"了下来，
    <tspan x="50" dy="25">变成了一个小山丘，这就是"低(low)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The temperature dropped to a low of 5 degrees Celsius.
  </text>
  <text x="50" y="310" class="content">
    温度降到了5摄氏度的低点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M 0 150 L 50 50 L 100 150 Z" class="image" />
    <!-- Lowered mountain -->
    <path d="M 150 150 L 200 100 L 250 150 Z" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <polygon points="125,140 100,150 125,160" class="image" />
    <!-- Text -->
    <text x="125" y="180" class="content" text-anchor="middle">low</text>
  </g>
</svg>