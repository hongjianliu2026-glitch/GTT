<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conspire</text>
  <text x="50" y="120" class="subtitle">[kənˈspaɪər] v. 密谋，共谋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + spire (呼吸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围在一起，"共同呼吸(con-spire)"，
    <tspan x="50" dy="25">低声密谋着什么阴谋(conspire)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two men were arrested for conspiring to commit a crime.
  </text>
  <text x="50" y="310" class="content">
    这两个人因密谋犯罪而被捕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle representing the group -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- People -->
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="230" cy="100" r="15" class="image" />
    <circle cx="175" cy="150" r="15" class="image" />
    <!-- Whispering lines -->
    <line x1="120" y1="120" x2="175" y2="120" class="image" />
    <line x1="230" y1="120" x2="175" y2="120" class="image" />
    <line x1="175" y1="170" x2="175" y2="120" class="image" />
  </g>
</svg>