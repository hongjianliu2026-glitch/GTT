<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">archbishop</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrtʃˌbɪʃəp] n. 大主教</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arch- (主要的) + bishop (主教)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"主要的(arch-)"主教(bishop)，
    <tspan x="50" dy="25">他站在高高的讲台上，手持权杖，</tspan>
    <tspan x="50" dy="25">象征着他的权威和地位。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The archbishop presided over the ceremony.
  </text>
  <text x="50" y="310" class="content">
    大主教主持了仪式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bishop's mitre -->
    <path d="M50 50 L70 20 L90 50 Z" class="image" />
    <!-- Bishop's staff -->
    <line x1="70" y1="50" x2="70" y2="200" class="image" />
    <!-- Bishop's robe -->
    <rect x="40" y="200" width="60" height="100" class="image" />
    <!-- Bishop's face -->
    <circle cx="70" cy="180" r="15" class="image" />
    <!-- Bishop's hands -->
    <line x1="60" y1="220" x2="40" y2="240" class="image" />
    <line x1="80" y1="220" x2="100" y2="240" class="image" />
  </g>
</svg>