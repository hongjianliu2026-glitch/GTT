<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dogged</text>
  <text x="50" y="120" class="subtitle">[ˈdɔɡɪd] adj. 顽强的，坚持不懈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dog (狗) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狗(dog)紧紧咬住(dogged)骨头不放，
    <tspan x="50" dy="25">无论怎么拉扯都不松口，这种顽强的精神就是dogged。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Despite the difficulties, she remained dogged in her pursuit of the truth.
  </text>
  <text x="50" y="310" class="content">
    尽管困难重重，她依然坚持不懈地追求真相。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="160" x2="80" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="200" x2="20" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="200" x2="80" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="110" x2="80" y2="120" class="image" /> <!-- Tail -->
    <!-- Bone -->
    <rect x="150" y="100" width="100" height="20" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <line x1="150" y1="110" x2="150" y2="110" class="image" />
    <line x1="250" y1="110" x2="250" y2="110" class="image" />
    <!-- Dog biting bone -->
    <line x1="80" y1="120" x2="150" y2="110" class="image" />
  </g>
</svg>