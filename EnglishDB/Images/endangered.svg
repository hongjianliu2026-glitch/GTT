<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">endangered</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdeɪndʒərd] adj. 濒危的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + danger (危险)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小动物被"使(en-)入危险(danger)"的境地，
    <tspan x="50" dy="25">它的生存受到了威胁，这就是濒危(endangered)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The giant panda is an endangered species.
  </text>
  <text x="50" y="310" class="content">
    大熊猫是一种濒危物种。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Danger sign -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="30" x2="100" y2="170" class="image" />
    <line x1="100" y1="30" x2="60" y2="70" class="image" />
    <line x1="100" y1="30" x2="140" y2="70" class="image" />
    <line x1="100" y1="170" x2="60" y2="130" class="image" />
    <line x1="100" y1="170" x2="140" y2="130" class="image" />
    <!-- Animal -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="270" y2="220" class="image" />
    <line x1="300" y1="180" x2="330" y2="220" class="image" />
    <line x1="300" y1="150" x2="350" y2="140" class="image" />
    <line x1="300" y1="150" x2="250" y2="140" class="image" />
  </g>
</svg>