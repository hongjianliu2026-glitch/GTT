<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">redden</text>
  <text x="50" y="120" class="subtitle">[ˈrɛdən] v. 使变红，变红</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> red (红色) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个害羞的人，脸颊因为尴尬而"变红(red-en)"，
    <tspan x="50" dy="25">整个脸都红透了，就像熟透的苹果一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her cheeks reddened when she realized her mistake.
  </text>
  <text x="50" y="310" class="content">
    当她意识到自己的错误时，她的脸颊变红了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Red Cheeks -->
    <circle cx="60" cy="120" r="20" class="image" fill="#FF6347" />
    <circle cx="140" cy="120" r="20" class="image" fill="#FF6347" />
    <!-- Eyes -->
    <circle cx="80" cy="80" r="10" class="image" fill="#000" />
    <circle cx="120" cy="80" r="10" class="image" fill="#000" />
    <!-- Mouth -->
    <path d="M 70 140 Q 100 160 130 140" class="image" fill="none" stroke="#000" stroke-width="3" />
  </g>
</svg>