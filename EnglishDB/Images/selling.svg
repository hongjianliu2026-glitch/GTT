<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">selling</text>
  <text x="50" y="120" class="subtitle">[ˈsɛlɪŋ] n. 销售，出售；adj. 畅销的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sell (卖) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人站在街头，"卖(sell)"
    <tspan x="50" dy="25">着各种商品，人们纷纷购买，场面热闹非凡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new product has been a big selling success.
  </text>
  <text x="50" y="310" class="content">
    这款新产品取得了巨大的销售成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Merchant -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Goods -->
    <rect x="100" y="80" width="50" height="50" class="image" />
    <rect x="160" y="80" width="50" height="50" class="image" />
    <rect x="220" y="80" width="50" height="50" class="image" />
    <!-- Customers -->
    <circle cx="120" cy="150" r="15" class="image" />
    <circle cx="180" cy="150" r="15" class="image" />
    <circle cx="240" cy="150" r="15" class="image" />
  </g>
</svg>