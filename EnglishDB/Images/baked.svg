<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">baked</text>
  <text x="50" y="120" class="subtitle">[beɪkt] adj. 烘焙的，烤过的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bake (烘焙) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个烤箱里，"烘焙(bake)"
    <tspan x="50" dy="25">的面包变得金黄酥脆，这就是"烤过的(baked)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake was baked to perfection.
  </text>
  <text x="50" y="310" class="content">
    蛋糕烤得恰到好处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Oven -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Baked bread -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#F4D03F" />
    <!-- Crust -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" stroke="#D4AC0D" stroke-width="5" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" stroke="#D4AC0D" stroke-width="5" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" stroke="#D4AC0D" stroke-width="5" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" stroke="#D4AC0D" stroke-width="5" />
  </g>
</svg>