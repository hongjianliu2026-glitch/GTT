<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mind-boggling</text>
  <text x="50" y="120" class="subtitle">[ˈmaɪndˌbɒɡlɪŋ] adj. 令人难以置信的，令人困惑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mind (头脑) + boggle (困惑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的问号("?")压在一个人头上，
    <tspan x="50" dy="25">他的头脑("mind")被这个问号压得"困惑(boggle)"，</tspan>
    <tspan x="50" dy="25">这就是"mind-boggling"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The complexity of the problem was mind-boggling.
  </text>
  <text x="50" y="310" class="content">
    问题的复杂性令人难以置信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Question mark -->
    <path d="M 150 50 Q 170 70 150 90 Q 130 70 150 50 Z M 150 110 V 150" class="image" />
  </g>
</svg>