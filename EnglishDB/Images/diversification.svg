<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diversification</text>
  <text x="50" y="120" class="subtitle">[ˌdaɪvərˌsɪfɪˈkeɪʃən] n. 多样化，分散投资</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + vers (转向) + -ification (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个投资者将资金"分开转向(di-vers-ification)"
    <tspan x="50" dy="25">不同的投资项目，以降低风险，这就是多样化(diversification)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's strategy includes diversification into new markets.
  </text>
  <text x="50" y="310" class="content">
    公司的策略包括向新市场多样化发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diversified investments -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="350" cy="100" r="20" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="350" y2="120" class="image" />
    <line x1="350" y1="120" x2="450" y2="120" class="image" />
    <!-- Labels -->
    <text x="50" y="150" class="content">Stock</text>
    <text x="150" y="150" class="content">Bonds</text>
    <text x="250" y="150" class="content">Real Estate</text>
    <text x="350" y="150" class="content">Commodities</text>
  </g>
</svg>