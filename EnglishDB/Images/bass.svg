<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bass</text>
  <text x="50" y="120" class="subtitle">[bæs] n. 低音，鲈鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bas (低)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的鲈鱼(bass)在水中游动，它的低音(bass)震动着整个水域，
    <tspan x="50" dy="25">仿佛整个世界都在它的掌控之中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bass guitar added a deep, resonant sound to the music.
  </text>
  <text x="50" y="310" class="content">
    低音吉他为音乐增添了深沉、共鸣的声音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish -->
    <path d="M50 100 C50 50 150 50 150 100 S250 150 150 200 S50 250 50 200 Z" class="image" fill="#1ABC9C" />
    <!-- Waves -->
    <path d="M50 200 Q100 150 150 200 T250 200" class="image" stroke-dasharray="5,5" />
    <path d="M50 220 Q100 170 150 220 T250 220" class="image" stroke-dasharray="5,5" />
    <path d="M50 240 Q100 190 150 240 T250 240" class="image" stroke-dasharray="5,5" />
    <!-- Bass symbol -->
    <text x="100" y="150" class="content" font-size="48" fill="#E74C3C">♪</text>
  </g>
</svg>