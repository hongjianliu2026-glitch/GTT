<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fine-tuning</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪnˈtuːnɪŋ] n. 微调</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fine (精细) + tune (调整)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工程师在调整一台复杂的机器，"精细地调整(fine-tune)"
    <tspan x="50" dy="25">每一个参数，直到机器运行得完美无瑕。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The model was fine-tuned on a specific dataset.
  </text>
  <text x="50" y="310" class="content">
    该模型在特定数据集上进行了微调。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Engineer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Machine -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Gears -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="80" x2="200" y2="80" class="image" />
    <line x1="100" y1="120" x2="200" y2="120" class="image" />
    <!-- Wrench -->
    <line x1="250" y1="50" x2="280" y2="80" class="image" />
    <line x1="250" y1="80" x2="280" y2="50" class="image" />
  </g>
</svg>