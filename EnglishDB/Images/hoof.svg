<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hoof</text>
  <text x="50" y="120" class="subtitle">[huːf] n. 蹄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hoof (源自中古英语 hof, 意为蹄)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一匹马在草原上奔跑，它的"蹄(hoof)"
    <tspan x="50" dy="25">在地上留下深深的印记，蹄声回荡在空气中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The horse's hoof made a loud sound on the hard ground.
  </text>
  <text x="50" y="310" class="content">
    马的蹄子在坚硬的地面上发出响亮的声音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse hoof -->
    <path d="M50,50 C60,20 100,20 110,50 L110,100 C100,130 60,130 50,100 Z" class="image" fill="#D35400" />
    <!-- Grass -->
    <line x1="0" y1="150" x2="200" y2="150" class="image" stroke-width="5" stroke="#27AE60" />
    <line x1="0" y1="160" x2="200" y2="160" class="image" stroke-width="5" stroke="#27AE60" />
    <line x1="0" y1="170" x2="200" y2="170" class="image" stroke-width="5" stroke="#27AE60" />
  </g>
</svg>