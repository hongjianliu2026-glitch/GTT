<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grading</text>
  <text x="50" y="120" class="subtitle">[ˈɡreɪdɪŋ] n. 评分，分级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grad (走) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老师在教室里，"走动(grad)"
    <tspan x="50" dy="25">给每个学生的作业打分，这就是评分(grading)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher is grading the exams.
  </text>
  <text x="50" y="310" class="content">
    老师正在给考试评分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Teacher -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Student desks -->
    <rect x="100" y="50" width="50" height="30" class="image" />
    <rect x="170" y="50" width="50" height="30" class="image" />
    <rect x="240" y="50" width="50" height="30" class="image" />
    <!-- Papers -->
    <line x1="110" y1="60" x2="140" y2="60" class="image" />
    <line x1="180" y1="60" x2="210" y2="60" class="image" />
    <line x1="250" y1="60" x2="280" y2="60" class="image" />
  </g>
</svg>