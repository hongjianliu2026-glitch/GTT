<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">regeneration</text>
  <text x="50" y="120" class="subtitle">[ˌriːdʒəˈneɪʃn] n. 再生，重生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + gener (产生) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵枯萎的树，"再次产生(re-gener)"
    <tspan x="50" dy="25">新的生命，重新焕发生机，这就是再生(regeneration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forest's regeneration after the fire was remarkable.
  </text>
  <text x="50" y="310" class="content">
    火灾后森林的再生令人瞩目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dead tree -->
    <line x1="50" y1="100" x2="50" y2="180" class="image" />
    <line x1="50" y1="140" x2="30" y2="120" class="image" />
    <line x1="50" y1="140" x2="70" y2="120" class="image" />
    <line x1="50" y1="140" x2="40" y2="160" class="image" />
    <line x1="50" y1="140" x2="60" y2="160" class="image" />

    <!-- New growth -->
    <line x1="50" y1="100" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="30" y2="60" class="image" />
    <line x1="50" y1="80" x2="70" y2="60" class="image" />
    <line x1="50" y1="80" x2="40" y2="40" class="image" />
    <line x1="50" y1="80" x2="60" y2="40" class="image" />

    <!-- Sun -->
    <circle cx="100" cy="50" r="20" class="image" />
    <line x1="100" y1="30" x2="100" y2="10" class="image" />
    <line x1="100" y1="70" x2="100" y2="90" class="image" />
    <line x1="80" y1="50" x2="60" y2="50" class="image" />
    <line x1="120" y1="50" x2="140" y2="50" class="image" />
  </g>
</svg>