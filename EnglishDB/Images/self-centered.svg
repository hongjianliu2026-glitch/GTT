<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-centered</text>
  <text x="50" y="120" class="subtitle">[ˌsɛlfˈsɛntərd] adj. 自我中心的，自私的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + center (中心)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的圆圈中心，"以自己为中心(self-center)"，
    <tspan x="50" dy="25">周围的人都围绕着他转，这就是自我中心(self-centered)的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is so self-centered that he never considers others' feelings.
  </text>
  <text x="50" y="310" class="content">
    他太自我中心了，从不考虑别人的感受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Person at the center -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Arrows around the circle -->
    <line x1="175" y1="20" x2="175" y2="40" class="image" />
    <line x1="175" y1="20" x2="160" y2="30" class="image" />
    <line x1="175" y1="20" x2="190" y2="30" class="image" />
    <line x1="255" y1="100" x2="235" y2="100" class="image" />
    <line x1="255" y1="100" x2="245" y2="85" class="image" />
    <line x1="255" y1="100" x2="245" y2="115" class="image" />
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <line x1="175" y1="180" x2="160" y2="170" class="image" />
    <line x1="175" y1="180" x2="190" y2="170" class="image" />
    <line x1="95" y1="100" x2="115" y2="100" class="image" />
    <line x1="95" y1="100" x2="105" y2="85" class="image" />
    <line x1="95" y1="100" x2="105" y2="115" class="image" />
  </g>
</svg>