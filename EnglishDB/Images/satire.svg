<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">satire</text>
  <text x="50" y="120" class="subtitle">[ˈsætaɪər] n. 讽刺，讽刺作品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> satir (讽刺) + -e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个作家在纸上"讽刺(satir)"
    <tspan x="50" dy="25">社会现象，用夸张的手法揭示问题，这就是讽刺作品(satire)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The play was a biting satire on modern politics.
  </text>
  <text x="50" y="310" class="content">
    这部戏剧是对现代政治的尖锐讽刺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Writer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Pen -->
    <line x1="50" y1="120" x2="80" y2="90" class="image" />
    <!-- Exaggerated image -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="170" y2="210" class="image" />
    <line x1="200" y1="180" x2="230" y2="210" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M250,70 Q300,70 300,100 Q250,100 250,70 Z" class="image" />
    <text x="260" y="90" class="content">"讽刺"</text>
  </g>
</svg>