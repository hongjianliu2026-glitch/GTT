<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forester</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrɪstər] n. 林务员，森林居民</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (前面) + ster (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个林务员站在森林前，"前面的人(fore-ster)"
    <tspan x="50" dy="25">守护着这片森林，他就是森林的守护者(forester)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forester carefully monitored the health of the trees.
  </text>
  <text x="50" y="310" class="content">
    林务员仔细监测树木的健康状况。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="180" x2="50" y2="100" class="image" />
    <line x1="100" y1="180" x2="100" y2="120" class="image" />
    <line x1="150" y1="180" x2="150" y2="140" class="image" />
    <line x1="200" y1="180" x2="200" y2="160" class="image" />
    <line x1="250" y1="180" x2="250" y2="180" class="image" />
    <!-- Forester -->
    <circle cx="30" cy="150" r="15" class="image" />
    <line x1="30" y1="165" x2="30" y2="190" class="image" />
    <line x1="30" y1="190" x2="10" y2="220" class="image" />
    <line x1="30" y1="190" x2="50" y2="220" class="image" />
    <line x1="30" y1="180" x2="60" y2="170" class="image" />
  </g>
</svg>