<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scavenge</text>
  <text x="50" y="120" class="subtitle">[ˈskævɪndʒ] v. 搜寻，捡破烂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scav- (搜寻) + -enge (行动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只饥饿的狗在垃圾堆里"搜寻(scav-)"
    <tspan x="50" dy="25">食物，它不停地翻找，最终找到了一块骨头(scavenge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog loves to scavenge for food in the trash.
  </text>
  <text x="50" y="310" class="content">
    这只狗喜欢在垃圾堆里找食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trash can -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Trash items -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Dog -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Bone -->
    <line x1="200" y1="100" x2="230" y2="100" class="image" />
    <line x1="215" y1="85" x2="215" y2="115" class="image" />
  </g>
</svg>