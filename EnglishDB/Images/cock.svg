<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cock</text>
  <text x="50" y="120" class="subtitle">[kɒk] n. 公鸡，雄鸟；v. 竖起，翘起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "coc"，意为公鸡
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只公鸡(cock)站在篱笆上，"翘起(cock)"
    <tspan x="50" dy="25">它的尾巴，昂首挺胸，准备迎接新的一天。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cock crowed at dawn.
  </text>
  <text x="50" y="310" class="content">
    公鸡在黎明时分啼叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cock -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Left wing -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Right wing -->
    <line x1="50" y1="50" x2="50" y2="20" class="image" /> <!-- Comb -->
    <line x1="50" y1="20" x2="40" y2="10" class="image" /> <!-- Left comb -->
    <line x1="50" y1="20" x2="60" y2="10" class="image" /> <!-- Right comb -->
  </g>
</svg>