<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sought-after</text>
  <text x="50" y="120" class="subtitle">[sɔːt-æftər] adj. 受欢迎的，抢手的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sought (seek的过去式) + after (在...之后)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物品被众人追逐，"在后面寻找(sought-after)"，
    <tspan x="50" dy="25">因为它非常受欢迎，大家都想要得到它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sought-after designer bag sold out within hours.
  </text>
  <text x="50" y="310" class="content">
    那个抢手的设计师包包在几小时内就售罄了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bag -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- People -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <circle cx="180" cy="100" r="15" class="image" />
    <line x1="180" y1="115" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="160" y2="180" class="image" />
    <line x1="180" y1="150" x2="200" y2="180" class="image" />
    <line x1="180" y1="130" x2="210" y2="120" class="image" />
    <!-- Arrows -->
    <line x1="70" y1="60" x2="150" y2="60" class="image" />
    <line x1="150" y1="60" x2="140" y2="50" class="image" />
    <line x1="150" y1="60" x2="140" y2="70" class="image" />
    <line x1="200" y1="60" x2="280" y2="60" class="image" />
    <line x1="280" y1="60" x2="270" y2="50" class="image" />
    <line x1="280" y1="60" x2="270" y2="70" class="image" />
  </g>
</svg>