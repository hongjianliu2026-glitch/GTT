<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">squirt</text>
  <text x="50" y="120" class="subtitle">[skwɜːrt] v. 喷射，喷出；n. 喷射物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> squirt (源自中古英语，意为“喷射”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子拿着水枪，"噗噗噗(squirt)"
    <tspan x="50" dy="25">地喷水，水花四溅，这就是喷射(squirt)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clown squirted water from a flower.
  </text>
  <text x="50" y="310" class="content">
    小丑从一朵花里喷出了水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water gun -->
    <rect x="0" y="0" width="100" height="30" class="image" />
    <rect x="10" y="10" width="80" height="10" class="image" />
    <rect x="45" y="10" width="10" height="20" class="image" />
    <!-- Water squirt -->
    <line x1="50" y1="30" x2="50" y2="60" class="image" />
    <line x1="50" y1="60" x2="40" y2="80" class="image" />
    <line x1="50" y1="60" x2="60" y2="80" class="image" />
    <line x1="50" y1="60" x2="50" y2="80" class="image" />
    <!-- Child -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>