<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parasitic</text>
  <text x="50" y="120" class="subtitle">[ˌpærəˈsɪtɪk] adj. 寄生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (旁边) + sit (坐) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小虫子"坐在(sit)"另一只动物的"旁边(para)"，
    <tspan x="50" dy="25">依靠它生存，这就是寄生(parasitic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leech is a parasitic creature that attaches to its host.
  </text>
  <text x="50" y="310" class="content">
    水蛭是一种寄生生物，会附着在宿主身上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Host animal -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Parasite -->
    <circle cx="180" cy="100" r="20" class="image" />
    <line x1="180" y1="120" x2="100" y2="180" class="image" />
    <!-- Text annotations -->
    <text x="80" y="220" class="content">Host</text>
    <text x="170" y="80" class="content">Parasite</text>
  </g>
</svg>