<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nonverbal</text>
  <text x="50" y="120" class="subtitle">[nɑnˈvɜːrb(ə)l] adj. 非言语的，不用语言的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> non- (不) + verb (言语)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在用肢体语言和表情来表达自己，
    <tspan x="50" dy="25">"不使用言语(non-verb)"，这就是非言语(nonverbal)的交流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The actor used nonverbal cues to convey emotion.
  </text>
  <text x="50" y="310" class="content">
    演员用非言语的暗示来传达情感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with gestures -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
    <!-- Mouth covered -->
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <!-- Gestures -->
    <circle cx="100" cy="80" r="10" class="image" /> <!-- Eye -->
    <circle cx="120" cy="80" r="10" class="image" /> <!-- Eye -->
    <line x1="110" y1="100" x2="110" y2="120" class="image" /> <!-- Nose -->
    <line x1="100" y1="130" x2="120" y2="130" class="image" /> <!-- Mouth -->
    <line x1="110" y1="130" x2="110" y2="150" class="image" /> <!-- Body -->
    <line x1="110" y1="150" x2="90" y2="120" class="image" /> <!-- Left arm -->
    <line x1="110" y1="150" x2="130" y2="120" class="image" /> <!-- Right arm -->
    <line x1="110" y1="150" x2="90" y2="180" class="image" /> <!-- Left leg -->
    <line x1="110" y1="150" x2="130" y2="180" class="image" /> <!-- Right leg -->
  </g>
</svg>