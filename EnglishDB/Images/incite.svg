<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incite</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsaɪt] v. 煽动，激起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + cit (唤起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者站在台上，"进入(in)"
    <tspan x="50" dy="25">听众的心灵，唤起(cit)他们的激情，</tspan>
    <tspan x="50" dy="25">激起(incite)他们的行动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The speaker's words incited the crowd to protest.
  </text>
  <text x="50" y="310" class="content">
    演讲者的话激起了人群的抗议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Crowd -->
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
    <circle cx="250" cy="120" r="10" class="image" />
    <circle cx="300" cy="120" r="10" class="image" />
    <!-- Fire -->
    <line x1="150" y1="140" x2="160" y2="150" class="image" />
    <line x1="160" y1="150" x2="150" y2="160" class="image" />
    <line x1="200" y1="140" x2="210" y2="150" class="image" />
    <line x1="210" y1="150" x2="200" y2="160" class="image" />
    <line x1="250" y1="140" x2="260" y2="150" class="image" />
    <line x1="260" y1="150" x2="250" y2="160" class="image" />
    <line x1="300" y1="140" x2="310" y2="150" class="image" />
    <line x1="310" y1="150" x2="300" y2="160" class="image" />
  </g>
</svg>