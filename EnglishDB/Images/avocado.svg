<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .avocado { fill: #5D8933; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">avocado</text>
  <text x="50" y="120" class="subtitle">[ˌævəˈkɑːdoʊ] n. 鳄梨，牛油果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a-(不) + voc-(声音) + -ado (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个鳄梨(avocado)，它"不发出声音(a-voc-)"，
    <tspan x="50" dy="25">静静地挂在树上，等待成熟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added avocado to her salad for extra creaminess.
  </text>
  <text x="50" y="310" class="content">
    她在沙拉中加入了鳄梨，增添了额外的奶油感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Avocado -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="avocado" />
    <!-- Seed -->
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Tree -->
    <line x1="100" y1="150" x2="100" y2="300" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <line x1="75" y1="250" x2="125" y2="250" class="image" />
  </g>
</svg>