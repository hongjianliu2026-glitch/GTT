<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">walk-in</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːkɪn] n. 未经预约的顾客，步入式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> walk (走) + in (进入)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个顾客"走进(walk-in)"商店，没有预约，直接购买商品。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store welcomes walk-in customers.
  </text>
  <text x="50" y="310" class="content">
    这家商店欢迎未经预约的顾客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Store -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Door -->
    <rect x="120" y="100" width="60" height="100" class="image" />
    <!-- Person walking in -->
    <circle cx="150" cy="80" r="15" class="image" />
    <line x1="150" y1="95" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="105" x2="180" y2="95" class="image" />
  </g>
</svg>