<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delivery</text>
  <text x="50" y="120" class="subtitle">[dɪˈlɪvəri] n. 递送，交付</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + liv (释放) + -ery (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个快递员骑着自行车，"向下释放(de-liv)"
    <tspan x="50" dy="25">包裹到你家门口，这就是递送(delivery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The delivery of the package was delayed due to bad weather.
  </text>
  <text x="50" y="310" class="content">
    由于恶劣天气，包裹的递送被延迟了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="80" y2="20" class="image" />
    <line x1="80" y1="20" x2="80" y2="40" class="image" />
    <line x1="80" y1="40" x2="120" y2="40" class="image" />
    <line x1="120" y1="40" x2="120" y2="20" class="image" />
    <line x1="120" y1="20" x2="100" y2="20" class="image" />
    <circle cx="20" cy="20" r="20" class="image" />
    <circle cx="180" cy="20" r="20" class="image" />
    <!-- Package -->
    <rect x="140" y="50" width="40" height="30" class="image" />
    <!-- House -->
    <rect x="200" y="50" width="60" height="40" class="image" />
    <line x1="220" y1="50" x2="220" y2="30" class="image" />
    <line x1="240" y1="50" x2="240" y2="30" class="image" />
    <line x1="200" y1="70" x2="260" y2="70" class="image" />
  </g>
</svg>