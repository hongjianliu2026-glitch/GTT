<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">den</text>
  <text x="50" y="120" class="subtitle">[den] n. 兽穴，私室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> den (来自古英语 denu，意为“山谷”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的熊在山谷(den)中挖了一个洞，这个洞就是它的兽穴(den)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bear made its den in the forest.
  </text>
  <text x="50" y="310" class="content">
    这只熊在森林里建了它的兽穴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <path d="M0,200 L100,0 L200,200 Z" class="image" />
    <!-- Den -->
    <rect x="70" y="150" width="60" height="50" class="image" />
    <!-- Bear -->
    <circle cx="100" cy="180" r="20" class="image" />
    <line x1="100" y1="200" x2="100" y2="230" class="image" />
    <line x1="100" y1="230" x2="80" y2="260" class="image" />
    <line x1="100" y1="230" x2="120" y2="260" class="image" />
    <line x1="100" y1="210" x2="130" y2="200" class="image" />
  </g>
</svg>