<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">famine</text>
  <text x="50" y="120" class="subtitle">[ˈfæmɪn] n. 饥荒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fam (饥饿) + ine (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个村庄，"饥饿(fam)"
    <tspan x="50" dy="25">的状态(ine)蔓延，人们面黄肌瘦，</tspan>
    <tspan x="50" dy="25">这就是饥荒(famine)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The famine caused many people to starve.
  </text>
  <text x="50" y="310" class="content">
    饥荒导致许多人饿死。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="75" cy="100" r="15" class="image" />
    <line x1="75" y1="115" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="60" y2="180" class="image" />
    <line x1="75" y1="150" x2="90" y2="180" class="image" />
    <line x1="75" y1="130" x2="100" y2="120" class="image" />
    <circle cx="145" cy="100" r="15" class="image" />
    <line x1="145" y1="115" x2="145" y2="150" class="image" />
    <line x1="145" y1="150" x2="130" y2="180" class="image" />
    <line x1="145" y1="150" x2="160" y2="180" class="image" />
    <line x1="145" y1="130" x2="170" y2="120" class="image" />
    <circle cx="215" cy="100" r="15" class="image" />
    <line x1="215" y1="115" x2="215" y2="150" class="image" />
    <line x1="215" y1="150" x2="200" y2="180" class="image" />
    <line x1="215" y1="150" x2="230" y2="180" class="image" />
    <line x1="215" y1="130" x2="240" y2="120" class="image" />
    <!-- Skulls -->
    <circle cx="75" cy="180" r="10" class="image" />
    <circle cx="145" cy="180" r="10" class="image" />
    <circle cx="215" cy="180" r="10" class="image" />
  </g>
</svg>