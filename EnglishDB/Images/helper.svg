<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">helper</text>
  <text x="50" y="120" class="subtitle">[ˈhɛlpər] n. 助手，帮手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> help (帮助) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工具箱，里面装满了各种工具。
    <tspan x="50" dy="25">突然，一个"帮手(helper)"从工具箱里跳出来，</tspan>
    <tspan x="50" dy="25">开始帮助你修理一切需要修理的东西。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hired a helper to assist her with the housework.
  </text>
  <text x="50" y="310" class="content">
    她雇了一个帮手来协助她做家务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toolbox -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tools -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="110" x2="100" y2="110" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <!-- Helper -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>