<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">national</text>
  <text x="50" y="120" class="subtitle">[ˈnæʃnəl] adj. 国家的，民族的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nation (国家) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，上面插满了各个国家的旗帜，
    <tspan x="50" dy="25">每个旗帜都代表着不同的民族和文化，这就是"national"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The national anthem was played at the beginning of the ceremony.
  </text>
  <text x="50" y="310" class="content">
    仪式开始时演奏了国歌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Flags -->
    <rect x="100" y="20" width="30" height="50" class="image" />
    <rect x="250" y="20" width="30" height="50" class="image" />
    <rect x="175" y="150" width="30" height="50" class="image" />
    <rect x="50" y="100" width="30" height="50" class="image" />
    <rect x="300" y="100" width="30" height="50" class="image" />
  </g>
</svg>