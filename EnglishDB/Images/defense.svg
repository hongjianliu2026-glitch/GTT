<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defense</text>
  <text x="50" y="120" class="subtitle">[dɪˈfens] n. 防御，防卫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + fens (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士在战场上，"向下打击(de-fens)"
    <tspan x="50" dy="25">敌人，保护自己和队友，这就是防御(defense)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The castle's defense system was very strong.
  </text>
  <text x="50" y="310" class="content">
    城堡的防御系统非常强大。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="0,0 100,0 150,50 100,100 0,100" class="image" />
    <!-- Sword -->
    <line x1="120" y1="50" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="160" y2="10" class="image" />
    <line x1="200" y1="50" x2="160" y2="90" class="image" />
    <!-- Warrior -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <line x1="250" y1="90" x2="280" y2="80" class="image" />
  </g>
</svg>