<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dashing</text>
  <text x="50" y="120" class="subtitle">[ˈdæʃɪŋ] adj. 英俊的，潇洒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dash (冲) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个英俊的男子，"冲(dash)"进舞会，
    <tspan x="50" dy="25">瞬间吸引了所有人的目光，他就是"潇洒的(dashing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He looked dashing in his new suit.
  </text>
  <text x="50" y="310" class="content">
    他穿着新西装看起来很潇洒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dashing man -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="150" class="image" /> <!-- Right arm -->
    <!-- Party scene -->
    <rect x="100" y="50" width="200" height="150" class="image" /> <!-- Party background -->
    <circle cx="150" cy="100" r="10" class="image" /> <!-- Party guest 1 -->
    <circle cx="200" cy="100" r="10" class="image" /> <!-- Party guest 2 -->
    <circle cx="250" cy="100" r="10" class="image" /> <!-- Party guest 3 -->
    <!-- Dashing effect -->
    <line x1="50" y1="100" x2="100" y2="50" class="image" /> <!-- Dash line 1 -->
    <line x1="50" y1="100" x2="100" y2="150" class="image" /> <!-- Dash line 2 -->
  </g>
</svg>