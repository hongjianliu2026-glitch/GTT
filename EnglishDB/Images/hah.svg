<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hah</text>
  <text x="50" y="120" class="subtitle">[hɑː] int. 哈哈（表示笑声）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hah (模拟笑声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然听到一个超级搞笑的笑话，忍不住发出"哈哈(hah)"的大笑声。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He burst out "hah" when he heard the joke.
  </text>
  <text x="50" y="310" class="content">
    他听到那个笑话时忍不住"哈哈"大笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mouth -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Teeth -->
    <rect x="70" y="80" width="60" height="20" class="image" />
    <!-- Tongue -->
    <rect x="80" y="100" width="40" height="30" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="60" r="10" class="image" />
    <circle cx="130" cy="60" r="10" class="image" />
    <!-- Laugh lines -->
    <line x1="50" y1="50" x2="30" y2="40" class="image" />
    <line x1="150" y1="50" x2="170" y2="40" class="image" />
  </g>
</svg>