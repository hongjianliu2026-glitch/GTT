<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concealment</text>
  <text x="50" y="120" class="subtitle">[kənˈsiːlmənt] n. 隐藏，隐蔽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (加强) + ceal (隐藏) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的宝藏被"加强隐藏(con-ceal-ment)"在一个巨大的石头后面，
    <tspan x="50" dy="25">只有找到隐藏的线索才能发现它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concealment of the truth was intentional.
  </text>
  <text x="50" y="310" class="content">
    真相的隐藏是故意的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large stone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Treasure chest -->
    <rect x="150" y="100" width="50" height="30" class="image" />
    <!-- Hidden clue -->
    <line x1="175" y1="115" x2="200" y2="115" class="image" />
    <line x1="175" y1="125" x2="200" y2="125" class="image" />
    <line x1="175" y1="135" x2="200" y2="135" class="image" />
    <!-- Arrows -->
    <line x1="200" y1="115" x2="220" y2="100" class="image" />
    <line x1="200" y1="125" x2="220" y2="110" class="image" />
    <line x1="200" y1="135" x2="220" y2="120" class="image" />
  </g>
</svg>