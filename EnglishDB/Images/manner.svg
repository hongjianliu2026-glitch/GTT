<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manner</text>
  <text x="50" y="120" class="subtitle">[ˈmænər] n. 方式，举止；风度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> manu (手) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用"手(manu)"优雅地"做(er)"某事，
    <tspan x="50" dy="25">这种优雅的方式就是他的"manner"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She greeted everyone with a polite manner.
  </text>
  <text x="50" y="310" class="content">
    她以礼貌的方式向每个人打招呼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hand -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <line x1="50" y1="130" x2="30" y2="150" class="image" />
    <line x1="50" y1="130" x2="70" y2="150" class="image" />

    <!-- Elegant action -->
    <rect x="100" y="50" width="100" height="100" class="image" />
    <line x1="120" y1="70" x2="180" y2="70" class="image" />
    <line x1="120" y1="90" x2="180" y2="90" class="image" />
    <line x1="120" y1="110" x2="180" y2="110" class="image" />
    <line x1="120" y1="130" x2="180" y2="130" class="image" />
  </g>
</svg>