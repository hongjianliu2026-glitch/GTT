<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yank</text>
  <text x="50" y="120" class="subtitle">[jæŋk] v. 猛拉，拽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yank (源自中古英语，意为“猛拉”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在拔河比赛中，"猛拉(yank)"绳子，
    <tspan x="50" dy="25">绳子被拉得笔直，仿佛要断裂一般。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He yanked the door open in a hurry.
  </text>
  <text x="50" y="310" class="content">
    他急忙猛拉开门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rope -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Person pulling -->
    <circle cx="30" cy="50" r="15" class="image" />
    <line x1="30" y1="65" x2="30" y2="100" class="image" />
    <line x1="30" y1="100" x2="10" y2="130" class="image" />
    <line x1="30" y1="100" x2="50" y2="130" class="image" />
    <line x1="30" y1="80" x2="70" y2="70" class="image" />
    <!-- Rope tension -->
    <line x1="100" y1="50" x2="100" y2="70" class="image" />
    <line x1="150" y1="50" x2="150" y2="70" class="image" />
    <line x1="200" y1="50" x2="200" y2="70" class="image" />
    <line x1="250" y1="50" x2="250" y2="70" class="image" />
  </g>
</svg>