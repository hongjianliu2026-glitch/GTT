<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">legion</text>
  <text x="50" y="120" class="subtitle">[ˈliːdʒən] n. 军团，大批</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leg (选择) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代将军在战场上，"选择(leg)"
    <tspan x="50" dy="25">并集结了一大批士兵，形成了一个军团(legion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Roman legions were known for their discipline.
  </text>
  <text x="50" y="310" class="content">
    罗马军团以其纪律严明而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- General -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Soldiers -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="90" y2="150" class="image" />
    <line x1="100" y1="130" x2="110" y2="150" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <line x1="130" y1="110" x2="130" y2="130" class="image" />
    <line x1="130" y1="130" x2="120" y2="150" class="image" />
    <line x1="130" y1="130" x2="140" y2="150" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <line x1="160" y1="110" x2="160" y2="130" class="image" />
    <line x1="160" y1="130" x2="150" y2="150" class="image" />
    <line x1="160" y1="130" x2="170" y2="150" class="image" />
    <!-- More soldiers -->
    <circle cx="100" cy="150" r="10" class="image" />
    <line x1="100" y1="160" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="90" y2="200" class="image" />
    <line x1="100" y1="180" x2="110" y2="200" class="image" />
    <circle cx="130" cy="150" r="10" class="image" />
    <line x1="130" y1="160" x2="130" y2="180" class="image" />
    <line x1="130" y1="180" x2="120" y2="200" class="image" />
    <line x1="130" y1="180" x2="140" y2="200" class="image" />
    <circle cx="160" cy="150" r="10" class="image" />
    <line x1="160" y1="160" x2="160" y2="180" class="image" />
    <line x1="160" y1="180" x2="150" y2="200" class="image" />
    <line x1="160" y1="180" x2="170" y2="200" class="image" />
  </g>
</svg>