<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">epithet</text>
  <text x="50" y="120" class="subtitle">[ˈɛpɪθɛt] n. 称号，绰号</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> epi- (在...之上) + thet (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人头上"放置(thet)"着一个"称号(epi-)"，
    <tspan x="50" dy="25">这个称号就像一个标签，让人一眼就能认出他。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was given the epithet "The Great" after his victory.
  </text>
  <text x="50" y="310" class="content">
    他在胜利后被赋予了“伟大”的称号。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Epithet label -->
    <rect x="50" y="20" width="100" height="30" class="image" />
    <text x="75" y="40" class="content" fill="#FFFFFF">The Great</text>
    <!-- Arrow pointing to the head -->
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
  </g>
</svg>