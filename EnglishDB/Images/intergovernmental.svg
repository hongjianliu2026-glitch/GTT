<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intergovernmental</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərɡʌvərnˈmɛntl] adj. 政府间的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + government (政府) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个政府代表在会议室里，"在政府之间(inter-government)"
    <tspan x="50" dy="25">讨论重要事务，这种关系就是政府间的(intergovernmental)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The agreement was reached through intergovernmental negotiations.
  </text>
  <text x="50" y="310" class="content">
    该协议是通过政府间谈判达成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Chairs -->
    <line x1="70" y1="160" x2="70" y2="200" class="image" />
    <line x1="120" y1="160" x2="120" y2="200" class="image" />
    <line x1="170" y1="160" x2="170" y2="200" class="image" />
    <line x1="220" y1="160" x2="220" y2="200" class="image" />
    <!-- Government representatives -->
    <circle cx="90" cy="130" r="15" class="image" />
    <circle cx="190" cy="130" r="15" class="image" />
    <line x1="90" y1="145" x2="90" y2="180" class="image" />
    <line x1="190" y1="145" x2="190" y2="180" class="image" />
    <line x1="90" y1="180" x2="70" y2="200" class="image" />
    <line x1="190" y1="180" x2="210" y2="200" class="image" />
    <line x1="90" y1="160" x2="110" y2="150" class="image" />
    <line x1="190" y1="160" x2="170" y2="150" class="image" />
  </g>
</svg>