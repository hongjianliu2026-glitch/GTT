<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elegantly</text>
  <text x="50" y="120" class="subtitle">[ˈɛləɡəntli] adv. 优雅地，高雅地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + leg (选择) + -ant (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位女士穿着华丽的礼服，"从众多选择中脱颖而出(e-leg-ant-ly)"，
    <tspan x="50" dy="25">她的每一个动作都显得格外优雅(elegantly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She danced elegantly at the ball.
  </text>
  <text x="50" y="310" class="content">
    她在舞会上优雅地跳舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elegant lady -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
    <!-- Dress -->
    <path d="M20,200 Q50,150 80,200" class="image" />
    <!-- High heels -->
    <rect x="25" y="250" width="10" height="20" class="image" />
    <rect x="65" y="250" width="10" height="20" class="image" />
  </g>
</svg>