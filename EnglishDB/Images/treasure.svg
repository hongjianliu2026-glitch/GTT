<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">treasure</text>
  <text x="50" y="120" class="subtitle">[ˈtrɛʒər] n. 宝藏，珍宝；v. 珍视，珍藏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> treas (财富) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个海盗在沙滩上，"挖掘(treas)"
    <tspan x="50" dy="25">出埋藏的宝藏(treasure)，珍视(treasure)这些财富。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The archaeologists discovered a treasure trove of ancient artifacts.
  </text>
  <text x="50" y="310" class="content">
    考古学家们发现了一批古代文物的宝藏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sand -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Treasure chest -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <line x1="100" y1="50" x2="250" y2="50" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
    <!-- Pirate -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
  </g>
</svg>