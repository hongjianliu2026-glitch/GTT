<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chaos</text>
  <text x="50" y="120" class="subtitle">[ˈkeɪɒs] n. 混乱，混沌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chaos (源自希腊语，原意为“空洞”或“虚无”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，所有的东西都被随意扔在地上，
    <tspan x="50" dy="25">没有任何秩序，这就是“chaos”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was in complete chaos after the party.
  </text>
  <text x="50" y="310" class="content">
    派对结束后，房间里一片混乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Random objects -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="60" class="image" />
    <line x1="180" y1="20" x2="220" y2="80" class="image" />
    <line x1="220" y1="20" x2="180" y2="80" class="image" />
    <rect x="250" y="40" width="30" height="30" class="image" />
    <circle cx="300" cy="70" r="15" class="image" />
    <line x1="50" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="120" x2="50" y2="160" class="image" />
    <rect x="150" y="130" width="50" height="30" class="image" />
    <circle cx="250" cy="150" r="25" class="image" />
    <line x1="300" y1="120" x2="350" y2="160" class="image" />
    <line x1="350" y1="120" x2="300" y2="160" class="image" />
  </g>
</svg>