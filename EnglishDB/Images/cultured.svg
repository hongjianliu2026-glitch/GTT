<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cultured</text>
  <text x="50" y="120" class="subtitle">[ˈkʌltʃərd] adj. 有教养的，有文化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cult (培养) + -ure (名词后缀) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被"培养(cult)"得非常有教养的人，
    <tspan x="50" dy="25">他/她不仅知识渊博，还举止优雅，这就是"有教养的(cultured)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a cultured woman who enjoys classical music.
  </text>
  <text x="50" y="310" class="content">
    她是一个有教养的女人，喜欢古典音乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Book -->
    <rect x="100" y="80" width="100" height="140" class="image" />
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="120" y1="120" x2="180" y2="120" class="image" />
    <line x1="120" y1="140" x2="180" y2="140" class="image" />
    <line x1="120" y1="160" x2="180" y2="160" class="image" />
    <!-- Music note -->
    <path d="M250 100 C260 80, 280 80, 290 100 S320 120, 330 100" class="image" />
    <path d="M250 120 C260 100, 280 100, 290 120 S320 140, 330 120" class="image" />
  </g>
</svg>