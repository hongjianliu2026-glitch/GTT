<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ancestral</text>
  <text x="50" y="120" class="subtitle">[ænˈsestrəl] adj. 祖先的，祖传的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (向上) + cest (行走) + -ral (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家族树，"向上行走(an-cest)"
    <tspan x="50" dy="25">追溯到祖先，这些祖先的遗产就是祖传的(ancestral)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The family gathered to honor their ancestral heritage.
  </text>
  <text x="50" y="310" class="content">
    家族成员聚集在一起，以纪念他们的祖传遗产。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family tree -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="50" y1="60" x2="150" y2="60" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <circle cx="100" cy="20" r="15" class="image" />
    <circle cx="50" cy="60" r="15" class="image" />
    <circle cx="150" cy="60" r="15" class="image" />
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="50" cy="140" r="15" class="image" />
    <circle cx="150" cy="140" r="15" class="image" />
    <!-- Ancestor -->
    <text x="100" y="20" text-anchor="middle" class="content">祖先</text>
  </g>
</svg>