<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">posse</text>
  <text x="50" y="120" class="subtitle">[ˈpɒsi] n. 一群人，一伙人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pos (放置) + se (自己)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人聚集在一起，"放置(pos)"
    <tspan x="50" dy="25">自己(se)在一个地方，形成了一伙人(posse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The posse quickly surrounded the suspect.
  </text>
  <text x="50" y="310" class="content">
    那伙人迅速包围了嫌疑人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Lines connecting them -->
    <line x1="50" y1="70" x2="250" y2="70" class="image" />
    <line x1="50" y1="90" x2="250" y2="90" class="image" />
    <line x1="50" y1="110" x2="250" y2="110" class="image" />
    <line x1="50" y1="130" x2="250" y2="130" class="image" />
  </g>
</svg>