<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interview</text>
  <text x="50" y="120" class="subtitle">[ˈɪntərvjuː] n. 面试；v. 采访</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + view (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面坐着，"在彼此之间(inter-)"
    <tspan x="50" dy="25">互相观察(view)，这就是面试(interview)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He had an interview with the company yesterday.
  </text>
  <text x="50" y="310" class="content">
    他昨天参加了公司的面试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two chairs -->
    <rect x="50" y="50" width="50" height="100" class="image" />
    <rect x="250" y="50" width="50" height="100" class="image" />
    <!-- Two people -->
    <circle cx="75" cy="40" r="15" class="image" />
    <circle cx="275" cy="40" r="15" class="image" />
    <!-- Eyes -->
    <circle cx="65" cy="35" r="5" class="image" />
    <circle cx="85" cy="35" r="5" class="image" />
    <circle cx="265" cy="35" r="5" class="image" />
    <circle cx="285" cy="35" r="5" class="image" />
    <!-- Mouths -->
    <line x1="70" y1="50" x2="80" y2="50" class="image" />
    <line x1="270" y1="50" x2="280" y2="50" class="image" />
  </g>
</svg>