<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">superstar</text>
  <text x="50" y="120" class="subtitle">[ˈsuːpərstɑːr] n. 超级明星，巨星</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (超级) + star (星星)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个超级明星(superstar)，他/她就像一颗
    <tspan x="50" dy="25">超级明亮的星星(super-star)，在舞台上闪耀，</tspan>
    <tspan x="50" dy="25">吸引了所有人的目光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She became a superstar overnight.
  </text>
  <text x="50" y="310" class="content">
    她一夜之间成为了超级明星。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="0,100 50,0 100,100 0,50 100,50" class="image" />
    <!-- Super star -->
    <circle cx="50" cy="50" r="40" class="image" />
    <!-- Spotlight -->
    <ellipse cx="50" cy="150" rx="100" ry="50" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="35" y2="180" class="image" />
    <line x1="50" y1="150" x2="65" y2="180" class="image" />
    <line x1="50" y1="130" x2="20" y2="120" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>