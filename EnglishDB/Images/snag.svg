<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snag</text>
  <text x="50" y="120" class="subtitle">[snæɡ] n. 障碍，意外困难；v. 绊住，钩住</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sn- (钩住) + -ag (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在玩耍时，"钩住(sn-ag)"
    <tspan x="50" dy="25">了窗帘，结果被绊住了，这就是一个意外的困难(snag)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We hit a snag in our plans when the car broke down.
  </text>
  <text x="50" y="310" class="content">
    我们的计划遇到了意外困难，因为车坏了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <line x1="50" y1="140" x2="70" y2="130" class="image" />
    <line x1="50" y1="160" x2="30" y2="180" class="image" />
    <line x1="50" y1="160" x2="70" y2="180" class="image" />
    <!-- Curtain -->
    <rect x="100" y="50" width="100" height="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="200" class="image" />
    <!-- Hook -->
    <line x1="150" y1="50" x2="130" y2="30" class="image" />
    <line x1="150" y1="50" x2="170" y2="30" class="image" />
    <line x1="150" y1="50" x2="150" y2="30" class="image" />
    <!-- Cat's paw -->
    <line x1="50" y1="120" x2="150" y2="100" class="image" />
  </g>
</svg>