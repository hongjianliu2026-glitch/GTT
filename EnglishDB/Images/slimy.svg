<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .slimy { fill: #87CEEB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slimy</text>
  <text x="50" y="120" class="subtitle">[ˈslaɪmi] adj. 黏滑的，卑鄙的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slime (黏液) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只青蛙在雨后的池塘边，身上覆盖着"黏滑的(slimy)"
    <tspan x="50" dy="25">黏液，这种感觉让人联想到卑鄙的行为。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The slimy substance on the rock was difficult to remove.
  </text>
  <text x="50" y="310" class="content">
    岩石上黏滑的物质很难去除。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pond -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Frog -->
    <circle cx="100" cy="100" r="30" class="slimy" />
    <!-- Slime -->
    <ellipse cx="100" cy="130" rx="40" ry="10" class="slimy" />
    <ellipse cx="120" cy="140" rx="30" ry="10" class="slimy" />
    <ellipse cx="80" cy="140" rx="30" ry="10" class="slimy" />
    <!-- Rain drops -->
    <circle cx="50" cy="50" r="5" class="slimy" />
    <circle cx="70" cy="60" r="5" class="slimy" />
    <circle cx="90" cy="70" r="5" class="slimy" />
  </g>
</svg>