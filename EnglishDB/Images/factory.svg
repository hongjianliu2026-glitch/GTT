<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">factory</text>
  <text x="50" y="120" class="subtitle">[ˈfæktri] n. 工厂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fact (做) + -ory (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工厂，"做(fact)"
    <tspan x="50" dy="25">各种产品的场所(-ory)，这就是工厂(factory)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory produces cars in large quantities.
  </text>
  <text x="50" y="310" class="content">
    这家工厂大量生产汽车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="-50" width="50" height="50" class="image" />
    <!-- Smoke -->
    <line x1="175" y1="0" x2="175" y2="-30" class="image" />
    <line x1="175" y1="0" x2="160" y2="-20" class="image" />
    <line x1="175" y1="0" x2="190" y2="-20" class="image" />
    <!-- Factory door -->
    <rect x="120" y="150" width="110" height="50" class="image" />
    <!-- Factory windows -->
    <rect x="50" y="50" width="50" height="50" class="image" />
    <rect x="150" y="50" width="50" height="50" class="image" />
    <rect x="250" y="50" width="50" height="50" class="image" />
  </g>
</svg>