<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unbutton</text>
  <text x="50" y="120" class="subtitle">[ʌnˈbʌtn] v. 解开纽扣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + button (纽扣)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在炎热的夏天，"解开(un-)"
    <tspan x="50" dy="25">衬衫上的"纽扣(button)"，让自己凉快一些。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He unbuttoned his shirt to cool down.
  </text>
  <text x="50" y="310" class="content">
    他解开衬衫纽扣来凉快一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shirt -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Button -->
    <circle cx="100" cy="100" r="15" class="image" />
    <!-- Unbuttoned button -->
    <line x1="85" y1="100" x2="115" y2="100" class="image" />
    <!-- Shirt collar -->
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="40" class="image" />
    <line x1="150" y1="20" x2="150" y2="40" class="image" />
    <!-- Shirt body -->
    <line x1="50" y1="40" x2="150" y2="40" class="image" />
    <line x1="50" y1="40" x2="50" y2="180" class="image" />
    <line x1="150" y1="40" x2="150" y2="180" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
  </g>
</svg>