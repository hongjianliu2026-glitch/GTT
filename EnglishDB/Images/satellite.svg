<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">satellite</text>
  <text x="50" y="120" class="subtitle">[ˈsætəlaɪt] n. 卫星</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sat- (坐) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小东西"坐在(sat-)"地球的周围，
    <tspan x="50" dy="25">就像一个小卫星(satellite)围绕着地球旋转。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The satellite orbits the Earth every 90 minutes.
  </text>
  <text x="50" y="310" class="content">
    这颗卫星每90分钟绕地球一圈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="50" class="image" fill="#2980B9" />
    <!-- Satellite -->
    <circle cx="200" cy="100" r="10" class="image" fill="#E74C3C" />
    <!-- Orbit -->
    <ellipse cx="100" cy="100" rx="100" ry="50" class="image" />
    <!-- Satellite path -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
  </g>
</svg>