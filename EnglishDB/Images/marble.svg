<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marble</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrbl] n. 大理石，弹珠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar (海) + ble (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海洋(mar)中，漂浮着无数闪闪发光的小球(ble)，
    <tspan x="50" dy="25">这些小球就是大理石(marble)，它们在阳光下闪耀着光芒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The floor was made of polished marble.
  </text>
  <text x="50" y="310" class="content">
    地板是由抛光的大理石制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#A9CCE3" />
    <!-- Marbles -->
    <circle cx="50" cy="100" r="15" class="image" fill="#F1C40F" />
    <circle cx="100" cy="120" r="15" class="image" fill="#F1C40F" />
    <circle cx="150" cy="80" r="15" class="image" fill="#F1C40F" />
    <circle cx="200" cy="140" r="15" class="image" fill="#F1C40F" />
    <circle cx="250" cy="100" r="15" class="image" fill="#F1C40F" />
    <circle cx="300" cy="120" r="15" class="image" fill="#F1C40F" />
  </g>
</svg>