<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">microbiologist</text>
  <text x="50" y="120" class="subtitle">[ˌmaɪkrəʊbaɪˈɒlədʒɪst] n. 微生物学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> micro- (小) + bio (生命) + -logist (学者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微生物学家在显微镜下，"研究微小的(micro-)"
    <tspan x="50" dy="25">生命(bio)，这些生命构成了微生物学(microbiology)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The microbiologist discovered a new strain of bacteria.
  </text>
  <text x="50" y="310" class="content">
    这位微生物学家发现了一种新的细菌菌株。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microscope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="0" y2="250" class="image" />
    <line x1="50" y1="200" x2="100" y2="250" class="image" />
    <!-- Bacteria -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="220" cy="120" r="10" class="image" />
    <circle cx="180" cy="120" r="10" class="image" />
    <circle cx="200" cy="140" r="10" class="image" />
    <!-- Microbiologist -->
    <circle cx="100" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="130" y2="70" class="image" />
  </g>
</svg>