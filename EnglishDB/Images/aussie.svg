<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Aussie</text>
  <text x="50" y="120" class="subtitle">[ˈɒzi] n. 澳大利亚人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Aus- (Australia) + -ie (diminutive suffix)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个澳大利亚人(Aussie)戴着一顶标志性的
    <tspan x="50" dy="25">宽边帽，站在阳光明媚的悉尼歌剧院前，</tspan>
    <tspan x="50" dy="25">手里拿着一只袋鼠玩偶，脸上洋溢着笑容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Aussie tourists were fascinated by the Great Barrier Reef.
  </text>
  <text x="50" y="310" class="content">
    这些澳大利亚游客对大堡礁非常着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" fill="#F1C40F" />
    <!-- Sydney Opera House -->
    <polygon points="150,200 200,100 250,200" fill="#E74C3C" />
    <polygon points="160,180 200,120 240,180" fill="#E74C3C" />
    <polygon points="170,160 200,140 230,160" fill="#E74C3C" />
    <!-- Aussie -->
    <circle cx="200" cy="250" r="30" fill="#3498DB" />
    <line x1="200" y1="280" x2="200" y2="350" class="image" />
    <line x1="200" y1="350" x2="170" y2="400" class="image" />
    <line x1="200" y1="350" x2="230" y2="400" class="image" />
    <line x1="200" y1="300" x2="150" y2="320" class="image" />
    <line x1="200" y1="300" x2="250" y2="320" class="image" />
    <!-- Hat -->
    <rect x="160" y="210" width="80" height="20" fill="#D35400" />
    <rect x="170" y="230" width="60" height="20" fill="#D35400" />
    <!-- Kangaroo -->
    <circle cx="300" cy="250" r="20" fill="#2ECC71" />
    <line x1="300" y1="270" x2="300" y2="320" class="image" />
    <line x1="300" y1="320" x2="280" y2="350" class="image" />
    <line x1="300" y1="320" x2="320" y2="350" class="image" />
    <line x1="300" y1="290" x2="270" y2="300" class="image" />
    <line x1="300" y1="290" x2="330" y2="300" class="image" />
  </g>
</svg>