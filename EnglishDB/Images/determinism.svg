<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">determinism</text>
  <text x="50" y="120" class="subtitle">[dɪˈtɜːrmɪnɪzəm] n. 决定论</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + termin (界限) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的命运之轮，"向下划定界限(de-termin)"，
    <tspan x="50" dy="25">一切都被预先决定，这就是决定论(determinism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concept of determinism suggests that all events are predetermined.
  </text>
  <text x="50" y="310" class="content">
    决定论的概念表明，所有事件都是预先决定的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fate wheel -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="95" y1="100" x2="255" y2="100" class="image" />
    <line x1="175" y1="100" x2="255" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="180" class="image" />
    <line x1="175" y1="100" x2="95" y2="20" class="image" />
    <line x1="175" y1="100" x2="95" y2="180" class="image" />
    <!-- Boundary line -->
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <text x="150" y="220" class="content" text-anchor="middle">界限</text>
  </g>
</svg>