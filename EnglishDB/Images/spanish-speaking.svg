<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Spanish-speaking</text>
  <text x="50" y="120" class="subtitle">[ˈspænɪʃ ˈspiːkɪŋ] adj. 说西班牙语的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Spanish (西班牙语) + speak (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热情的西班牙人，站在阳光下，
    <tspan x="50" dy="25">用流利的西班牙语(Spanish)与人交谈(speaking)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Spanish-speaking community is very vibrant.
  </text>
  <text x="50" y="310" class="content">
    说西班牙语的社区非常活跃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" class="image" fill="#E74C3C" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="70" y2="180" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
    <!-- Speech bubble -->
    <path d="M 150 130 Q 200 130 200 180 Q 150 180 150 230" class="image" fill="#ECF0F1" />
    <text x="160" y="170" class="content" fill="#34495E">¡Hola!</text>
  </g>
</svg>