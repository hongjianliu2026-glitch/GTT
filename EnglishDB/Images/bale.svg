<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bale</text>
  <text x="50" y="120" class="subtitle">[beɪl] n. 大包，大捆；v. 打包</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bal- (捆绑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民正在将稻草"捆绑(bal-)"成一个大包(bale)，
    <tspan x="50" dy="25">这个大包可以用来储存或运输。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer stacked the bales of hay in the barn.
  </text>
  <text x="50" y="310" class="content">
    农民把干草捆堆放在谷仓里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bale of hay -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <rect x="40" y="40" width="120" height="70" class="image" />
    <!-- Farmer -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="230" y2="160" class="image" />
    <line x1="250" y1="130" x2="270" y2="160" class="image" />
    <line x1="250" y1="110" x2="280" y2="100" class="image" />
  </g>
</svg>