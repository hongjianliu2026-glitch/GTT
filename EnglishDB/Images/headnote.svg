<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Headnote</text>
  <text x="50" y="120" class="subtitle">[ˈhɛdnəʊt] n. 前言，引言</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> head (头) + note (笔记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本书的"头部(head)"，作者在"笔记(note)"中
    <tspan x="50" dy="25">写下引言，引导读者进入故事的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The headnote at the beginning of the chapter provided a brief overview.
  </text>
  <text x="50" y="310" class="content">
    章节开头的前言提供了简要概述。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Book -->
    <rect x="0" y="0" width="300" height="400" class="image" />
    <!-- Headnote -->
    <rect x="20" y="20" width="260" height="100" class="image" />
    <!-- Text in headnote -->
    <text x="30" y="70" class="content" style="font-size: 24px;">Headnote</text>
    <!-- Arrow -->
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <polygon points="145,150 155,150 150,160" class="image" />
    <!-- Book content -->
    <line x1="20" y1="180" x2="280" y2="180" class="image" />
    <line x1="20" y1="210" x2="280" y2="210" class="image" />
    <line x1="20" y1="240" x2="280" y2="240" class="image" />
    <line x1="20" y1="270" x2="280" y2="270" class="image" />
    <line x1="20" y1="300" x2="280" y2="300" class="image" />
    <line x1="20" y1="330" x2="280" y2="330" class="image" />
    <line x1="20" y1="360" x2="280" y2="360" class="image" />
    <line x1="20" y1="390" x2="280" y2="390" class="image" />
    <line x1="20" y1="420" x2="280" y2="420" class="image" />
  </g>
</svg>