<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">picturesque</text>
  <text x="50" y="120" class="subtitle">[ˌpɪktʃəˈresk] adj. 如画的，美丽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> picture (画) + -esque (如...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家在画布上描绘出"如画(picture-esque)"
    <tspan x="50" dy="25">的风景，每一笔都让景色更加美丽动人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The village is so picturesque that it looks like a postcard.
  </text>
  <text x="50" y="310" class="content">
    这个村庄美得如画，看起来就像一张明信片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Landscape -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Sun -->
    <line x1="100" y1="180" x2="300" y2="180" class="image" /> <!-- Ground -->
    <line x1="150" y1="180" x2="150" y2="100" class="image" /> <!-- Tree trunk -->
    <polyline points="130,100 150,80 170,100" class="image" /> <!-- Tree leaves -->
    <polyline points="130,90 150,70 170,90" class="image" /> <!-- Tree leaves -->
    <polyline points="130,80 150,60 170,80" class="image" /> <!-- Tree leaves -->
    <rect x="200" y="140" width="50" height="40" class="image" /> <!-- House -->
    <line x1="225" y1="140" x2="225" y2="120" class="image" /> <!-- House roof -->
    <line x1="200" y1="140" x2="250" y2="140" class="image" /> <!-- House roof -->
    <line x1="225" y1="120" x2="200" y2="140" class="image" /> <!-- House roof -->
    <line x1="225" y1="120" x2="250" y2="140" class="image" /> <!-- House roof -->
  </g>
</svg>