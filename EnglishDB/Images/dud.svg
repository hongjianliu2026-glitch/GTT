<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dud</text>
  <text x="50" y="120" class="subtitle">[dʌd] n. 哑弹，无用的人或物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语“dudde”，意为“无用的东西”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵在战场上，发现一枚炸弹没有爆炸，
    <tspan x="50" dy="25">这枚炸弹就是个“哑弹(dud)”，毫无用处。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bomb turned out to be a dud and didn't explode.
  </text>
  <text x="50" y="310" class="content">
    那枚炸弹原来是哑弹，没有爆炸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Bomb -->
    <rect x="100" y="80" width="50" height="50" class="image" />
    <line x1="125" y1="80" x2="125" y2="30" class="image" />
    <line x1="125" y1="30" x2="100" y2="10" class="image" />
    <line x1="125" y1="30" x2="150" y2="10" class="image" />
    <!-- Cross indicating dud -->
    <line x1="100" y1="80" x2="150" y2="130" class="image" />
    <line x1="150" y1="80" x2="100" y2="130" class="image" />
  </g>
</svg>