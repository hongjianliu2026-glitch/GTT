<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">downgrade</text>
  <text x="50" y="120" class="subtitle">[ˈdaʊnɡreɪd] v. 降级，降低</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> down- (向下) + grade (等级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个员工被"向下(down)"降级到"更低等级(grade)"，
    <tspan x="50" dy="25">他的职位从高处滑落到低处，这就是降级(downgrade)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to downgrade his position due to poor performance.
  </text>
  <text x="50" y="310" class="content">
    由于表现不佳，公司决定降低他的职位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High position -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <text x="20" y="30" class="content">High</text>
    <!-- Low position -->
    <rect x="0" y="150" width="100" height="50" class="image" />
    <text x="20" y="180" class="content">Low</text>
    <!-- Arrow -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <polygon points="45,145 50,150 55,145" class="image" />
    <!-- Employee -->
    <circle cx="50" cy="25" r="15" class="image" />
    <line x1="50" y1="40" x2="50" y2="165" class="image" />
    <line x1="50" y1="165" x2="35" y2="195" class="image" />
    <line x1="50" y1="165" x2="65" y2="195" class="image" />
  </g>
</svg>