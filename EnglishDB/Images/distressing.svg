<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">distressing</text>
  <text x="50" y="120" class="subtitle">[dɪˈstrɛsɪŋ] adj. 令人痛苦的，使人苦恼的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + stress (压力)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"分开(dis-)"成两半，承受着巨大的"压力(stress)"，
    <tspan x="50" dy="25">这种情景让人感到极度痛苦和苦恼(distressing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the accident was very distressing.
  </text>
  <text x="50" y="310" class="content">
    事故的消息非常令人痛苦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being split -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <line x1="350" y1="50" x2="350" y2="200" class="image" />
    <!-- Stress lines -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <line x1="150" y1="140" x2="250" y2="140" class="image" />
    <!-- Distress face -->
    <circle cx="200" cy="150" r="30" class="image" />
    <line x1="185" y1="160" x2="215" y2="160" class="image" />
    <line x1="195" y1="170" x2="205" y2="170" class="image" />
    <line x1="190" y1="180" x2="210" y2="180" class="image" />
  </g>
</svg>