<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">formidable</text>
  <text x="50" y="120" class="subtitle">[fɔːrˈmɪdəbl] adj. 可怕的，令人敬畏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> form (形式) + id (走) + able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的怪兽，"以可怕的形式(form-id-able)"
    <tspan x="50" dy="25">走过来，令人心生敬畏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The exam was formidable, with questions that were difficult to answer.
  </text>
  <text x="50" y="310" class="content">
    考试非常可怕，题目很难回答。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="200" x2="50" y2="150" class="image" /> <!-- Left arm -->
    <line x1="100" y1="200" x2="150" y2="150" class="image" /> <!-- Right arm -->
    <line x1="100" y1="250" x2="50" y2="300" class="image" /> <!-- Left leg -->
    <line x1="100" y1="250" x2="150" y2="300" class="image" /> <!-- Right leg -->
    <!-- Eyes -->
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
  </g>
</svg>