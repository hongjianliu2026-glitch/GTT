<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diving</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪvɪŋ] n. 潜水，跳水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> div (分开) + ing (进行中的动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从高处"分开(div)"空气，
    <tspan x="50" dy="25">直冲入水中，这就是跳水(diving)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves diving into the deep sea.
  </text>
  <text x="50" y="310" class="content">
    她喜欢潜入深海。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water surface -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Diver -->
    <circle cx="100" cy="140" r="15" class="image" />
    <line x1="100" y1="155" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="165" x2="130" y2="155" class="image" />
    <!-- Splash -->
    <line x1="100" y1="150" x2="80" y2="130" class="image" />
    <line x1="100" y1="150" x2="120" y2="130" class="image" />
    <line x1="100" y1="150" x2="100" y2="130" class="image" />
  </g>
</svg>