<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mushy</text>
  <text x="50" y="120" class="subtitle">[ˈmʌʃi] adj. 糊状的，软烂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mush (糊状物) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一碗煮得过久的粥，变成了"糊状(mush)"，
    <tspan x="50" dy="25">软烂到无法用勺子舀起，这就是mushy。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The potatoes were so mushy that they fell apart when I touched them.
  </text>
  <text x="50" y="310" class="content">
    土豆煮得太软烂，一碰就散了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Mushy substance -->
    <ellipse cx="175" cy="100" rx="120" ry="50" class="image" fill="#F5CBA7" />
    <!-- Spoon -->
    <line x1="20" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="80" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
  </g>
</svg>