<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">porch</text>
  <text x="50" y="120" class="subtitle">[pɔːrtʃ] n. 门廊，走廊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> por- (门) + -ch (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的房屋，门前有一个宽敞的"门廊(porch)"，
    <tspan x="50" dy="25">人们在那里休息、聊天，享受着门前的宁静。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They sat on the porch, enjoying the evening breeze.
  </text>
  <text x="50" y="310" class="content">
    他们坐在门廊上，享受着晚风。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- House -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Door -->
    <rect x="120" y="100" width="60" height="100" class="image" />
    <!-- Porch -->
    <rect x="50" y="150" width="200" height="50" class="image" />
    <!-- People -->
    <circle cx="80" cy="175" r="10" class="image" />
    <circle cx="120" cy="175" r="10" class="image" />
    <circle cx="160" cy="175" r="10" class="image" />
  </g>
</svg>