<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .hair { fill: #FF5733; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">red-haired</text>
  <text x="50" y="120" class="subtitle">[ˌrɛd ˈhɛrd] adj. 红头发的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> red (红色) + hair (头发)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个红头发的人，头发像火焰一样燃烧，
    <tspan x="50" dy="25">仿佛整个脑袋都被红色的火焰包围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The red-haired girl was easily recognizable in the crowd.
  </text>
  <text x="50" y="310" class="content">
    那个红头发的女孩在人群中很容易被认出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Red hair -->
    <path d="M50,100 Q25,50 50,0 Q75,50 50,100 Z" class="hair" />
    <path d="M150,100 Q175,50 150,0 Q125,50 150,100 Z" class="hair" />
    <path d="M75,100 Q100,50 75,0 Q50,50 75,100 Z" class="hair" />
    <path d="M125,100 Q100,50 125,0 Q150,50 125,100 Z" class="hair" />
  </g>
</svg>