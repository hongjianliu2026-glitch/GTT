<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">GNP</text>
  <text x="50" y="120" class="subtitle">[Gross National Product] n. 国民生产总值</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Gross (总的) + National (国家的) + Product (产品)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金库，里面堆满了各种"产品(Product)"，
    <tspan x="50" dy="25">这些产品代表了整个"国家(National)"的经济产出，</tspan>
    <tspan x="50" dy="25">总和起来就是"国民生产总值(GNP)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The GNP of the country increased by 5% last year.
  </text>
  <text x="50" y="310" class="content">
    该国的国民生产总值去年增长了5%。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vault -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gold bars -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- National flag -->
    <rect x="30" y="180" width="30" height="20" class="image" />
    <line x1="45" y1="180" x2="45" y2="200" class="image" />
  </g>
</svg>