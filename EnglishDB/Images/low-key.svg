<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B7D7D; }
      .content { font: 18px sans-serif; fill: #566573; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">low-key</text>
  <text x="50" y="120" class="subtitle">[ˌloʊˈkiː] adj. 低调的，不张扬的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> low (低) + key (关键)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在聚会上，"低调地(low)"
    <tspan x="50" dy="25">站在角落，不引人注目，这就是低调(low-key)的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers a low-key approach to life.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢低调的生活方式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Party scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <!-- Low-key person -->
    <circle cx="300" cy="150" r="15" class="image" />
    <line x1="300" y1="165" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="285" y2="200" class="image" />
    <line x1="300" y1="180" x2="315" y2="200" class="image" />
    <line x1="300" y1="170" x2="320" y2="160" class="image" />
    <!-- Speech bubbles -->
    <rect x="50" y="20" width="30" height="20" class="image" />
    <rect x="100" y="20" width="30" height="20" class="image" />
    <rect x="150" y="20" width="30" height="20" class="image" />
    <rect x="200" y="20" width="30" height="20" class="image" />
    <!-- Low-key person's silence -->
    <line x1="300" y1="130" x2="300" y2="140" class="image" />
  </g>
</svg>