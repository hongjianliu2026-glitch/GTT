<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heroic</text>
  <text x="50" y="120" class="subtitle">[hɪˈroʊɪk] adj. 英雄的，英勇的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hero (英雄) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个英雄(hero)站在山顶，面对风暴，
    <tspan x="50" dy="25">他的身影在风中显得格外英勇(heroic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The firefighters showed heroic bravery in the face of danger.
  </text>
  <text x="50" y="310" class="content">
    消防员在危险面前展现了英勇的勇气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,200 L400,200 L200,0 Z" class="image" />
    <!-- Hero -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="170" y2="170" class="image" />
    <line x1="200" y1="180" x2="230" y2="170" class="image" />
    <!-- Storm -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="50" y1="70" x2="350" y2="70" class="image" />
    <line x1="50" y1="90" x2="350" y2="90" class="image" />
  </g>
</svg>