<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #7B1FA2; }
      .subtitle { font: italic 24px serif; fill: #4A148C; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lavender { fill: #E6E6FA; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lavender</text>
  <text x="50" y="120" class="subtitle">[ˈlævəndər] n. 薰衣草</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> laven (洗) + der (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片薰衣草田，微风吹过，"洗去(laven)"
    <tspan x="50" dy="25">所有的烦恼，只留下宁静与芬芳。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The air was filled with the scent of lavender.
  </text>
  <text x="50" y="310" class="content">
    空气中弥漫着薰衣草的香气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lavender field -->
    <rect x="0" y="0" width="350" height="200" class="lavender" />
    <!-- Lavender flowers -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="120" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="120" r="15" class="image" />
    <!-- Wind -->
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <line x1="0" y1="170" x2="350" y2="170" class="image" />
  </g>
</svg>