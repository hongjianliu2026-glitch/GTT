<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">emblematic</text>
  <text x="50" y="120" class="subtitle">[ˌɛmbləˈmætɪk] adj. 象征的，标志性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (进入) + blem (标记) + -atic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的标志(blem)被"嵌入(em-)"
    <tspan x="50" dy="25">一个城市的中心，这个标志成为了这个城市的象征(emblematic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Statue of Liberty is emblematic of freedom.
  </text>
  <text x="50" y="310" class="content">
    自由女神像象征着自由。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="40" x2="100" y2="160" class="image" />
    <line x1="150" y1="60" x2="150" y2="140" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <line x1="250" y1="100" x2="250" y2="100" class="image" />
    <!-- Emblem -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="70" x2="175" y2="130" class="image" />
    <line x1="155" y1="100" x2="195" y2="100" class="image" />
  </g>
</svg>