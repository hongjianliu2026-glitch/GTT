<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">privilege</text>
  <text x="50" y="120" class="subtitle">[ˈprɪvəlɪdʒ] n. 特权，特别待遇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> privi- (个人) + leg (法律)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在法庭上，"个人法律(privi-leg)"
    <tspan x="50" dy="25">赋予他特殊的权利，这就是特权(privilege)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enjoyed the privilege of traveling first class.
  </text>
  <text x="50" y="310" class="content">
    她享受了头等舱旅行的特权。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Gavel -->
    <rect x="190" y="70" width="20" height="10" class="image" />
    <line x1="200" y1="70" x2="200" y2="60" class="image" />
  </g>
</svg>