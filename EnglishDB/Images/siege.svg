<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">siege</text>
  <text x="50" y="120" class="subtitle">[siːdʒ] n. 围攻，包围</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seige (来自古法语，意为“围攻”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座城堡被敌人"包围(siege)"，
    <tspan x="50" dy="25">城墙外是密密麻麻的敌军，城内的人紧张地防守。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city was under siege for three months.
  </text>
  <text x="50" y="310" class="content">
    这座城市被围攻了三个月。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Walls -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Enemies -->
    <circle cx="20" cy="100" r="15" class="image" />
    <circle cx="60" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="140" cy="100" r="15" class="image" />
    <circle cx="180" cy="100" r="15" class="image" />
    <circle cx="220" cy="100" r="15" class="image" />
    <circle cx="260" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
  </g>
</svg>