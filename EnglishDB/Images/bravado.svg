<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bravado</text>
  <text x="50" y="120" class="subtitle">[brəˈvɑːdoʊ] n. 虚张声势，炫耀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brav (勇敢) + -ado (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高台上，"勇敢地(brav)"
    <tspan x="50" dy="25">挥舞着旗帜，但实际上内心却很害怕，这就是虚张声势(bravado)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His bravado in the face of danger was just an act.
  </text>
  <text x="50" y="310" class="content">
    他在危险面前的虚张声势只是一种表演。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Flag -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <rect x="165" y="20" width="20" height="60" class="image" />
    <line x1="165" y1="20" x2="185" y2="20" class="image" />
    <line x1="165" y1="50" x2="185" y2="50" class="image" />
    <line x1="165" y1="80" x2="185" y2="80" class="image" />
  </g>
</svg>