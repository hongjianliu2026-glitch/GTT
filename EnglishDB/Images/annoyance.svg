<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">annoyance</text>
  <text x="50" y="120" class="subtitle">[əˈnɔɪəns] n. 烦恼，恼怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (加强) + noy (烦恼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫不停地"加强(an-)"挠你，让你感到"烦恼(noy)"，
    <tspan x="50" dy="25">这种持续的挠痒就是annoyance。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The constant noise was a great annoyance to the residents.
  </text>
  <text x="50" y="310" class="content">
    持续的噪音让居民们非常烦恼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Annoying cat -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Cat head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Cat body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Cat leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Cat leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Cat tail -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Cat tail -->
    <!-- Scratching effect -->
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="100" y1="120" x2="150" y2="170" class="image" />
    <line x1="100" y1="140" x2="150" y2="190" class="image" />
  </g>
</svg>