<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fetal</text>
  <text x="50" y="120" class="subtitle">[ˈfiːtl] adj. 胎儿的，胎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fet- (胎儿) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的子宫，里面有一个小小的"胎儿(fet-)"，
    <tspan x="50" dy="25">它正在安静地成长，这个状态就是"胎儿的(fetal)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ultrasound showed the fetal heartbeat.
  </text>
  <text x="50" y="310" class="content">
    超声波显示了胎儿的心跳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Uterus -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="image" />
    <!-- Fetus -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="150" y2="190" class="image" />
    <line x1="175" y1="160" x2="200" y2="190" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
  </g>
</svg>