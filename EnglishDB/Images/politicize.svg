<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">politicize</text>
  <text x="50" y="120" class="subtitle">[pəˈlɪtɪsaɪz] v. 使政治化，使具有政治性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poli- (国家) + -tic (与...有关的) + -ize (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通人被"国家化(poli-)"，变成了一个政治人物，
    <tspan x="50" dy="25">他的行为和言论都变得"与政治有关(tic)"，这就是"使政治化(politicize)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The issue was politicized by both parties.
  </text>
  <text x="50" y="310" class="content">
    这个问题被双方政治化了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M100,80 Q150,80 150,120 Q100,120 100,80 Z" class="image" />
    <text x="110" y="110" class="content">政治言论</text>
    <!-- Flag -->
    <rect x="200" y="80" width="50" height="100" class="image" />
    <line x1="200" y1="80" x2="250" y2="80" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="120" x2="250" y2="120" class="image" />
    <line x1="200" y1="140" x2="250" y2="140" class="image" />
    <line x1="200" y1="160" x2="250" y2="160" class="image" />
    <text x="210" y="190" class="content">国家</text>
  </g>
</svg>