<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defend</text>
  <text x="50" y="120" class="subtitle">[dɪˈfend] v. 保卫，辩护</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + fend (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇士手持盾牌，"向下打击(de-fend)"
    <tspan x="50" dy="25">敌人，保护自己和同伴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bravely defended his country against the invaders.
  </text>
  <text x="50" y="310" class="content">
    他勇敢地保卫自己的国家免受入侵者的侵害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <rect x="50" y="20" width="150" height="200" class="image" />
    <!-- Warrior -->
    <circle cx="125" cy="250" r="20" class="image" />
    <line x1="125" y1="270" x2="125" y2="320" class="image" />
    <line x1="125" y1="320" x2="100" y2="360" class="image" />
    <line x1="125" y1="320" x2="150" y2="360" class="image" />
    <line x1="125" y1="290" x2="170" y2="280" class="image" />
    <!-- Enemy -->
    <circle cx="250" cy="250" r="20" class="image" />
    <line x1="250" y1="270" x2="250" y2="320" class="image" />
    <line x1="250" y1="320" x2="225" y2="360" class="image" />
    <line x1="250" y1="320" x2="275" y2="360" class="image" />
    <line x1="250" y1="290" x2="290" y2="280" class="image" />
  </g>
</svg>