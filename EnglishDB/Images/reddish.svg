<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reddish</text>
  <text x="50" y="120" class="subtitle">[ˈrɛdɪʃ] adj. 微红的，略带红色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> red (红色) + -ish (略带...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苹果，它的表面微微泛红，"略带红色(red-ish)"，
    <tspan x="50" dy="25">就像夕阳下的苹果，给人一种温暖的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sky turned a reddish hue as the sun set.
  </text>
  <text x="50" y="310" class="content">
    太阳落山时，天空变成了微红色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apple -->
    <circle cx="100" cy="100" r="80" fill="#FF6347" />
    <!-- Highlight -->
    <circle cx="140" cy="60" r="20" fill="#FF4500" />
    <!-- Stem -->
    <rect x="90" y="20" width="20" height="40" fill="#8B4513" />
  </g>
</svg>