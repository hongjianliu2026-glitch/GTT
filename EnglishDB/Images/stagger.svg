<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stagger</text>
  <text x="50" y="120" class="subtitle">[ˈstæɡər] v. 蹒跚，摇晃；n. 蹒跚，摇晃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sta- (站立) + gger (摇晃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人喝醉了酒，"站立不稳(sta-gger)"，
    <tspan x="50" dy="25">摇摇晃晃地走在路上，这就是蹒跚(stagger)的样子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He staggered to his feet after the punch.
  </text>
  <text x="50" y="310" class="content">
    他被击中后摇摇晃晃地站了起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Drunk person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Path -->
    <path d="M30 220 Q50 250 70 220" class="image" />
  </g>
</svg>