<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">numbered</text>
  <text x="50" y="120" class="subtitle">[ˈnʌmbərd] adj. 编号的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> number (数字) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字"1"被贴在一个物体上，
    <tspan x="50" dy="25">这个物体就被"编号(numbered)"了，</tspan>
    <tspan x="50" dy="25">就像超市里的商品一样，每个都有独特的编号。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The seats in the theater are numbered from 1 to 100.
  </text>
  <text x="50" y="310" class="content">
    剧院里的座位从1到100编号。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Number "1" -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <text x="20" y="100" class="image" font-size="100" fill="#E74C3C">1</text>
    <!-- Object with number -->
    <rect x="120" y="50" width="150" height="100" class="image" />
    <text x="140" y="110" class="image" font-size="50" fill="#2980B9">1</text>
  </g>
</svg>