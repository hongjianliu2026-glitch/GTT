<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">libel</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪbl] n. 诽谤，中伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> libel (源自拉丁语 libellus，意为“小书”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在写一本“小书(libellus)”，
    <tspan x="50" dy="25">书中的内容充满了诽谤和中伤，</tspan>
    <tspan x="50" dy="25">这就是“libel”的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was sued for libel after publishing false accusations.
  </text>
  <text x="50" y="310" class="content">
    他在发表虚假指控后被起诉诽谤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="110" x2="180" y2="110" class="image" />
    <!-- Pen -->
    <line x1="220" y1="75" x2="250" y2="75" class="image" />
    <line x1="250" y1="75" x2="235" y2="50" class="image" />
    <line x1="250" y1="75" x2="235" y2="100" class="image" />
    <!-- Speech Bubble -->
    <path d="M260,10 Q300,10 300,50 Q300,90 260,90 Q220,90 220,50 Q220,10 260,10 Z" class="image" />
    <text x="270" y="60" class="content" text-anchor="middle">诽谤</text>
  </g>
</svg>