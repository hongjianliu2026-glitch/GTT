<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vivid</text>
  <text x="50" y="120" class="subtitle">[ˈvɪvɪd] adj. 生动的，鲜明的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> viv (生命) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一幅画，画中的色彩"充满生命力(viv)"，
    <tspan x="50" dy="25">每一笔都如此鲜明，仿佛要从画布上跳出来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a vivid imagination and could see the world in a different light.
  </text>
  <text x="50" y="310" class="content">
    她有着生动的想象力，能够以不同的眼光看待世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Colors -->
    <circle cx="50" cy="50" r="20" fill="#FF5733" />
    <circle cx="100" cy="50" r="20" fill="#33FF57" />
    <circle cx="150" cy="50" r="20" fill="#3357FF" />
    <circle cx="200" cy="50" r="20" fill="#FF33A6" />
    <circle cx="250" cy="50" r="20" fill="#A633FF" />
    <!-- Brush strokes -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="130" x2="300" y2="130" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="190" x2="300" y2="190" class="image" />
  </g>
</svg>