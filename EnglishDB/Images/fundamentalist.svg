<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fundamentalist</text>
  <text x="50" y="120" class="subtitle">[ˌfʌndəˈmentəlɪst] n. 原教旨主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fund (基础) + ment (心智) + al (形容词后缀) + ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"基础心智(fund-ment-al-ist)"的人，
    <tspan x="50" dy="25">他坚信最原始的教义，就像一个原教旨主义者(fundamentalist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fundamentalist refused to accept any modern interpretations of the scripture.
  </text>
  <text x="50" y="310" class="content">
    这位原教旨主义者拒绝接受任何对经文的现代解读。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="110" x2="180" y2="110" class="image" />
    <!-- Person -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="260" class="image" />
    <line x1="100" y1="260" x2="80" y2="300" class="image" />
    <line x1="100" y1="260" x2="120" y2="300" class="image" />
    <line x1="100" y1="240" x2="140" y2="230" class="image" />
    <!-- Shield -->
    <polygon points="150,180 190,220 150,260 110,220" class="image" />
    <text x="130" y="225" class="content" fill="#2C3E50">基础</text>
  </g>
</svg>