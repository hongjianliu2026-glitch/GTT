<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arise</text>
  <text x="50" y="120" class="subtitle">[əˈraɪz] v. 出现，上升</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + rise (上升)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个太阳从地平线"加强上升(a-rise)"，
    <tspan x="50" dy="25">照亮了整个世界，象征着新事物的出现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A new problem arose during the meeting.
  </text>
  <text x="50" y="310" class="content">
    会议期间出现了一个新问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="150" cy="150" r="50" class="image" fill="#F39C12" />
    <!-- Horizon line -->
    <line x1="0" y1="300" x2="300" y2="300" class="image" />
    <!-- Sun rays -->
    <line x1="150" y1="100" x2="150" y2="0" class="image" />
    <line x1="100" y1="150" x2="0" y2="150" class="image" />
    <line x1="200" y1="150" x2="300" y2="150" class="image" />
    <line x1="150" y1="200" x2="150" y2="300" class="image" />
    <!-- Ground -->
    <rect x="0" y="300" width="300" height="50" class="image" fill="#2ECC71" />
  </g>
</svg>