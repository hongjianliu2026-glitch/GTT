<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infatuation</text>
  <text x="50" y="120" class="subtitle">[ˌɪnfætʃuˈeɪʃn] n. 迷恋，痴情</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + fatu (愚蠢) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"陷入(in-)"了一种"愚蠢(fatu)"的状态，
    <tspan x="50" dy="25">完全被某人或某物迷住了，这就是"痴情(infatuation)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her infatuation with the pop star lasted only a few weeks.
  </text>
  <text x="50" y="310" class="content">
    她对那位流行歌星的迷恋只持续了几个星期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 315 C10 315, 20 290, 50 300 C80 310, 90 340, 100 330 C110 320, 120 300, 150 310 C180 320, 190 350, 200 340" class="image" />
    <!-- Person -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="280" class="image" />
    <line x1="100" y1="240" x2="80" y2="260" class="image" />
    <line x1="100" y1="240" x2="120" y2="260" class="image" />
    <line x1="100" y1="280" x2="80" y2="310" class="image" />
    <line x1="100" y1="280" x2="120" y2="310" class="image" />
    <!-- Stars -->
    <circle cx="150" cy="180" r="5" class="image" />
    <circle cx="160" cy="190" r="5" class="image" />
    <circle cx="170" cy="170" r="5" class="image" />
  </g>
</svg>