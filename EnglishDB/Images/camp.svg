<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">camp</text>
  <text x="50" y="120" class="subtitle">[kæmp] n. 营地，野营；v. 扎营，露营</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> camp (田野)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一片开阔的田野(camp)上，
    <tspan x="50" dy="25">搭起帐篷，生起篝火，享受野营的乐趣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We went camping in the mountains last weekend.
  </text>
  <text x="50" y="310" class="content">
    我们上周末去山里露营了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Tent -->
    <polygon points="100,150 175,100 250,150" class="image" />
    <!-- Campfire -->
    <circle cx="200" cy="180" r="20" class="image" />
    <line x1="190" y1="180" x2="210" y2="180" class="image" />
    <line x1="195" y1="170" x2="205" y2="170" class="image" />
    <line x1="200" y1="160" x2="200" y2="170" class="image" />
    <!-- People -->
    <circle cx="120" cy="130" r="10" class="image" />
    <line x1="120" y1="140" x2="120" y2="160" class="image" />
    <line x1="120" y1="160" x2="110" y2="180" class="image" />
    <line x1="120" y1="160" x2="130" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="140" class="image" />
  </g>
</svg>