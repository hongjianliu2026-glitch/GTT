<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">condensation</text>
  <text x="50" y="120" class="subtitle">[ˌkɒndenˈseɪʃn] n. 冷凝，浓缩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + dense (密集) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯热水放在寒冷的空气中，水蒸气"一起密集(con-dense)"
    <tspan x="50" dy="25">变成小水滴，这就是冷凝(condensation)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The condensation on the window made it hard to see outside.
  </text>
  <text x="50" y="310" class="content">
    窗户上的冷凝水使得外面很难看清。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hot water -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <circle cx="50" cy="50" r="40" fill="#FFA07A" />
    <!-- Cold air -->
    <rect x="120" y="0" width="100" height="100" class="image" />
    <line x1="130" y1="10" x2="210" y2="10" class="image" />
    <line x1="130" y1="30" x2="210" y2="30" class="image" />
    <line x1="130" y1="50" x2="210" y2="50" class="image" />
    <line x1="130" y1="70" x2="210" y2="70" class="image" />
    <line x1="130" y1="90" x2="210" y2="90" class="image" />
    <!-- Condensation -->
    <circle cx="160" cy="50" r="5" fill="#87CEEB" />
    <circle cx="170" cy="40" r="5" fill="#87CEEB" />
    <circle cx="180" cy="60" r="5" fill="#87CEEB" />
    <circle cx="190" cy="50" r="5" fill="#87CEEB" />
    <circle cx="200" cy="40" r="5" fill="#87CEEB" />
  </g>
</svg>