<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">announce</text>
  <text x="50" y="120" class="subtitle">[əˈnaʊns] v. 宣布，通告</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (加强) + nounce (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高台上，"加强地说(an-nounce)"
    <tspan x="50" dy="25">出重要的消息，让所有人都能听到。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The president announced a new policy today.
  </text>
  <text x="50" y="310" class="content">
    总统今天宣布了一项新政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on stage -->
    <circle cx="175" cy="80" r="20" class="image" />
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="120" x2="220" y2="110" class="image" />
    <!-- Microphone -->
    <line x1="175" y1="100" x2="175" y2="130" class="image" />
    <rect x="165" y="130" width="20" height="30" class="image" />
    <!-- Speech bubble -->
    <path d="M175,50 Q225,50 225,20 Q225,50 275,50 Q225,50 225,80 Q175,80 175,50" class="image" />
    <text x="190" y="55" class="content" fill="#34495E">Announcement</text>
  </g>
</svg>