<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">poverty</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːvərti] n. 贫穷，贫困</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pov (贫穷) + -erty (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个衣衫褴褛的人，"贫穷(pov)"
    <tspan x="50" dy="25">到连衣服都破烂不堪，这就是贫困(poverty)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The charity aims to alleviate poverty in the region.
  </text>
  <text x="50" y="310" class="content">
    该慈善机构旨在缓解该地区的贫困。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Poor person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <!-- Torn clothes -->
    <line x1="20" y1="140" x2="80" y2="140" class="image" />
    <line x1="20" y1="150" x2="80" y2="150" class="image" />
    <line x1="20" y1="160" x2="80" y2="160" class="image" />
    <line x1="20" y1="170" x2="80" y2="170" class="image" />
    <line x1="20" y1="180" x2="80" y2="180" class="image" />
  </g>
</svg>