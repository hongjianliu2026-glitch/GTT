<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bucket</text>
  <text x="50" y="120" class="subtitle">[ˈbʌkɪt] n. 桶，水桶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> buck (公鹿) + et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鹿(buck-et)用它的角顶着一个桶，
    <tspan x="50" dy="25">这个桶装满了水，小鹿正努力地运水。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He filled the bucket with water from the well.
  </text>
  <text x="50" y="310" class="content">
    他从井里打满了水桶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bucket -->
    <path d="M50 100 L300 100 Q320 100 320 120 L320 200 Q320 220 300 220 L50 220 Q30 220 30 200 L30 120 Q30 100 50 100 Z" class="image" fill="#D35400" />
    <!-- Water -->
    <path d="M60 110 L290 110 Q310 110 310 130 L310 190 Q310 210 290 210 L60 210 Q40 210 40 190 L40 130 Q40 110 60 110 Z" class="image" fill="#1ABC9C" />
    <!-- Deer -->
    <circle cx="100" cy="300" r="30" class="image" fill="#8E44AD" />
    <line x1="100" y1="330" x2="100" y2="380" class="image" />
    <line x1="100" y1="380" x2="80" y2="410" class="image" />
    <line x1="100" y1="380" x2="120" y2="410" class="image" />
    <line x1="100" y1="350" x2="140" y2="340" class="image" />
    <line x1="100" y1="350" x2="60" y2="340" class="image" />
    <!-- Bucket handle -->
    <line x1="185" y1="100" x2="185" y2="50" class="image" />
    <line x1="185" y1="50" x2="215" y2="50" class="image" />
    <line x1="215" y1="50" x2="215" y2="100" class="image" />
  </g>
</svg>