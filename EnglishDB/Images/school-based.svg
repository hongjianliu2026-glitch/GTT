<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">school-based</text>
  <text x="50" y="120" class="subtitle">[ˈskuːlˌbeɪst] adj. 基于学校的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> school (学校) + based (基于)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的学校建筑，"基于(based)"
    <tspan x="50" dy="25">这个学校，所有的活动和决策都围绕它展开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The program is school-based, focusing on student needs.
  </text>
  <text x="50" y="310" class="content">
    这个项目是基于学校的，专注于学生的需求。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- School building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="30" height="30" class="image" />
    <rect x="120" y="40" width="30" height="30" class="image" />
    <rect x="170" y="40" width="30" height="30" class="image" />
    <rect x="220" y="40" width="30" height="30" class="image" />
    <rect x="70" y="90" width="30" height="30" class="image" />
    <rect x="120" y="90" width="30" height="30" class="image" />
    <rect x="170" y="90" width="30" height="30" class="image" />
    <rect x="220" y="90" width="30" height="30" class="image" />
    <!-- Roof -->
    <polygon points="50,20 300,20 275,0 75,0" class="image" />
  </g>
</svg>