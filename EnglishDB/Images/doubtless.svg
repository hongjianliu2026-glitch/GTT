<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">doubtless</text>
  <text x="50" y="120" class="subtitle">[ˈdaʊtləs] adv. 无疑地，肯定地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> doubt (怀疑) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的问号前，但他的脸上没有一丝怀疑的表情，
    <tspan x="50" dy="25">因为他"无疑地(doubtless)"相信自己所看到的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is doubtless the best candidate for the job.
  </text>
  <text x="50" y="310" class="content">
    她无疑是这份工作的最佳候选人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large question mark -->
    <path d="M50,50 Q100,100 150,50 T250,50" class="image" />
    <circle cx="270" cy="50" r="10" class="image" />
    <!-- Person with no doubt -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="250" class="image" />
    <line x1="150" y1="220" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="120" y2="180" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />
    <!-- No doubt expression -->
    <circle cx="140" cy="140" r="5" class="image" />
    <circle cx="160" cy="140" r="5" class="image" />
    <path d="M140,160 Q150,170 160,160" class="image" />
  </g>
</svg>