<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rabbi</text>
  <text x="50" y="120" class="subtitle">[ˈræbaɪ] n. 拉比（犹太教教士）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rab (大师) + bi (我的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个犹太教教士，他是一位"大师(rab)"，
    <tspan x="50" dy="25">人们尊敬地称他为"我的大师(rabbi)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rabbi led the congregation in prayer.
  </text>
  <text x="50" y="310" class="content">
    拉比带领会众祈祷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rabbi -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="80" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="80" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Tallit (prayer shawl) -->
    <rect x="30" y="70" width="40" height="50" class="image" />
    <!-- Kippah (skullcap) -->
    <circle cx="50" cy="40" r="10" class="image" />
  </g>
</svg>