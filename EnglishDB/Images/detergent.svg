<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bottle { fill: #F39C12; }
      .liquid { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">detergent</text>
  <text x="50" y="120" class="subtitle">[dɪˈtɜːrdʒənt] n. 清洁剂，洗涤剂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (去除) + tergere (擦拭)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海绵，"去除(de-)"
    <tspan x="50" dy="25">污渍并"擦拭(tergere)"，这就是洗涤剂(detergent)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a strong detergent to clean the stubborn stains.
  </text>
  <text x="50" y="310" class="content">
    她用强力洗涤剂清洗顽固的污渍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Detergent bottle -->
    <rect x="0" y="0" width="150" height="200" class="bottle" />
    <rect x="10" y="10" width="130" height="180" class="image" />
    <!-- Liquid inside the bottle -->
    <rect x="20" y="20" width="110" height="160" class="liquid" />
    <!-- Sponge -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <rect x="210" y="60" width="80" height="80" class="image" />
    <rect x="220" y="70" width="60" height="60" class="image" />
    <rect x="230" y="80" width="40" height="40" class="image" />
  </g>
</svg>