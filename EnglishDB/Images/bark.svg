<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bark</text>
  <text x="50" y="120" class="subtitle">[bɑːrk] n. 树皮；v. 吠叫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bar- (木头) + -k (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狗在树下，"用木头(bar-)"
    <tspan x="50" dy="25">做的项圈让它发出"吠叫(bark)"的声音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog barked loudly at the stranger.
  </text>
  <text x="50" y="310" class="content">
    那只狗对着陌生人狂吠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Bark -->
    <line x1="10" y1="20" x2="90" y2="20" class="image" />
    <line x1="10" y1="40" x2="90" y2="40" class="image" />
    <line x1="10" y1="60" x2="90" y2="60" class="image" />
    <line x1="10" y1="80" x2="90" y2="80" class="image" />
    <line x1="10" y1="100" x2="90" y2="100" class="image" />
    <line x1="10" y1="120" x2="90" y2="120" class="image" />
    <line x1="10" y1="140" x2="90" y2="140" class="image" />
    <line x1="10" y1="160" x2="90" y2="160" class="image" />
    <line x1="10" y1="180" x2="90" y2="180" class="image" />
    <!-- Dog -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Barking sound -->
    <path d="M180,80 Q200,70 220,80" class="image" />
    <path d="M180,90 Q200,80 220,90" class="image" />
    <path d="M180,100 Q200,90 220,100" class="image" />
  </g>
</svg>