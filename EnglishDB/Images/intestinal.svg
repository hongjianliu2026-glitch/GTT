<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intestinal</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtestɪnl] adj. 肠的，肠道的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intestin (肠) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的肠道，"肠(intestin)"
    <tspan x="50" dy="25">道里充满了各种食物和微生物，这就是肠道的世界(intestinal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor examined his intestinal health.
  </text>
  <text x="50" y="310" class="content">
    医生检查了他的肠道健康。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Intestine -->
    <path d="M50,50 Q100,20 150,50 T250,50 T350,50 T450,50 T550,50 T650,50" class="image" />
    <path d="M50,100 Q100,130 150,100 T250,100 T350,100 T450,100 T550,100 T650,100" class="image" />
    <path d="M50,150 Q100,180 150,150 T250,150 T350,150 T450,150 T550,150 T650,150" class="image" />
    <!-- Food particles -->
    <circle cx="100" cy="75" r="10" class="image" />
    <circle cx="200" cy="75" r="10" class="image" />
    <circle cx="300" cy="75" r="10" class="image" />
    <circle cx="400" cy="75" r="10" class="image" />
    <circle cx="500" cy="75" r="10" class="image" />
    <circle cx="600" cy="75" r="10" class="image" />
  </g>
</svg>