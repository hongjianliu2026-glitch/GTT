<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grad</text>
  <text x="50" y="120" class="subtitle">[ɡræd] n. 步，级；v. 逐渐变化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grad (步，级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个登山者，每走一步(grad)，
    <tspan x="50" dy="25">他都在逐渐接近山顶，每一步都是一个新的高度。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The temperature drops by several degrees at each grad.
  </text>
  <text x="50" y="310" class="content">
    温度每升高一级都会下降几度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polyline points="0,200 50,150 100,200 150,100 200,200 250,50 300,200" class="image" />
    <!-- Steps -->
    <line x1="50" y1="150" x2="100" y2="200" class="image" />
    <line x1="150" y1="100" x2="200" y2="200" class="image" />
    <line x1="250" y1="50" x2="300" y2="200" class="image" />
    <!-- Climber -->
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="140" y2="150" class="image" />
    <line x1="150" y1="130" x2="160" y2="150" class="image" />
  </g>
</svg>