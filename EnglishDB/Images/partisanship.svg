<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">partisanship</text>
  <text x="50" y="120" class="subtitle">[ˌpɑːrtɪˈzænʃɪp] n. 党派性，党派偏见</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> parti (部分) + -ship (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个政治辩论中，两派人马激烈争论，"部分(parti)"
    <tspan x="50" dy="25">的人坚持自己的立场，形成了党派性(partisanship)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The media should avoid partisanship and report objectively.
  </text>
  <text x="50" y="310" class="content">
    媒体应避免党派偏见，客观报道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two groups of people arguing -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="50" y1="80" x2="30" y2="90" class="image" />
    <line x1="50" y1="80" x2="70" y2="90" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />

    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="150" y1="80" x2="130" y2="90" class="image" />
    <line x1="150" y1="80" x2="170" y2="90" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />

    <!-- Arrows representing arguments -->
    <line x1="70" y1="60" x2="130" y2="60" class="image" />
    <polygon points="130,60 120,50 120,70" class="image" />
    <line x1="130" y1="70" x2="70" y2="70" class="image" />
    <polygon points="70,70 80,60 80,80" class="image" />
  </g>
</svg>