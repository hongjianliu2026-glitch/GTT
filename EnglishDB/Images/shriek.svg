<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shriek</text>
  <text x="50" y="120" class="subtitle">[ʃriːk] v. 尖叫，发出尖锐刺耳的声音</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shri- (尖锐) + ek (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在黑暗中突然看到一只巨大的蜘蛛，"尖锐地发出(shri-ek)"
    <tspan x="50" dy="25">一声刺耳的尖叫，声音在空旷的房间里回荡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The woman shrieked when she saw the mouse.
  </text>
  <text x="50" y="310" class="content">
    那个女人看到老鼠时尖叫起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Spider -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="120" x2="180" y2="140" class="image" />
    <line x1="200" y1="120" x2="220" y2="140" class="image" />
    <line x1="200" y1="160" x2="180" y2="180" class="image" />
    <line x1="200" y1="160" x2="220" y2="180" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Sound waves -->
    <path d="M50 110 Q70 90 90 110" class="image" />
    <path d="M50 120 Q70 100 90 120" class="image" />
    <path d="M50 130 Q70 110 90 130" class="image" />
  </g>
</svg>