<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">barbecue</text>
  <text x="50" y="120" class="subtitle">[ˈbɑːrbɪkjuː] n. 烧烤，烤肉；v. 烧烤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> barba (胡子) + cue (烤)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个满脸胡子的厨师，"用胡子(barba)烤(cue)"
    <tspan x="50" dy="25">肉，这种夸张的画面让人印象深刻，记住了烧烤(barbecue)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had a barbecue in the backyard last weekend.
  </text>
  <text x="50" y="310" class="content">
    我们上周末在后院举行了烧烤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grill -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Meat -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Chef with beard -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Beard -->
    <path d="M20,80 Q30,70 40,80 T60,80" class="image" />
    <path d="M20,85 Q30,75 40,85 T60,85" class="image" />
    <path d="M20,90 Q30,80 40,90 T60,90" class="image" />
  </g>
</svg>