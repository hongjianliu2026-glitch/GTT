<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-efficacy</text>
  <text x="50" y="120" class="subtitle">[ˌsɛlf ɪˈfɪsənsi] n. 自我效能感</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + efficacy (效力)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，自信满满地对自己说："我有能力(efficacy)完成任何任务！"
    <tspan x="50" dy="25">这种内在的自信就是自我效能感(self-efficacy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> High self-efficacy leads to better performance in challenging tasks.
  </text>
  <text x="50" y="310" class="content">
    高自我效能感能带来在挑战性任务中的更好表现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="130" y2="140" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Reflection -->
    <circle cx="175" cy="250" r="30" class="image" />
    <line x1="175" y1="280" x2="175" y2="330" class="image" />
    <line x1="175" y1="330" x2="150" y2="370" class="image" />
    <line x1="175" y1="330" x2="200" y2="370" class="image" />
    <line x1="175" y1="300" x2="130" y2="290" class="image" />
    <line x1="175" y1="300" x2="220" y2="290" class="image" />
    <!-- Confidence bubble -->
    <path d="M175,70 Q200,50 225,70 T275,120" class="image" />
    <text x="185" y="90" class="content" fill="#2980B9">我有能力！</text>
  </g>
</svg>