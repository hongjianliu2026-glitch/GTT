<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recoup</text>
  <text x="50" y="120" class="subtitle">[rɪˈkuːp] v. 弥补，收回</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + coup (打)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在打拳击，"打回去(re-coup)"
    <tspan x="50" dy="25">以弥补之前的损失，这就是收回(recoup)的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He managed to recoup his losses by working overtime.
  </text>
  <text x="50" y="310" class="content">
    他通过加班成功弥补了损失。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boxing ring -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boxer -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="180" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Punching motion -->
    <line x1="100" y1="120" x2="180" y2="120" class="image" />
    <line x1="180" y1="120" x2="160" y2="100" class="image" />
    <line x1="180" y1="120" x2="160" y2="140" class="image" />
  </g>
</svg>