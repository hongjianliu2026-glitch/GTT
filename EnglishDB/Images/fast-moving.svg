<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fast-moving</text>
  <text x="50" y="120" class="subtitle">[ˈfɑːst ˈmuːvɪŋ] adj. 快速移动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fast (快速的) + moving (移动的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆赛车在赛道上"快速移动(fast-moving)"，
    <tspan x="50" dy="25">风驰电掣，留下一道道残影。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fast-moving train left the station in a flash.
  </text>
  <text x="50" y="310" class="content">
    那辆快速移动的火车一闪而过，离开了车站。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Race car -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="100" height="50" class="image" />
    <rect x="150" y="50" width="100" height="50" class="image" />
    <rect x="250" y="50" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="75" cy="110" r="15" class="image" />
    <circle cx="175" cy="110" r="15" class="image" />
    <circle cx="275" cy="110" r="15" class="image" />
    <!-- Speed lines -->
    <line x1="50" y1="150" x2="350" y2="150" class="image" />
    <line x1="50" y1="160" x2="350" y2="160" class="image" />
    <line x1="50" y1="170" x2="350" y2="170" class="image" />
  </g>
</svg>