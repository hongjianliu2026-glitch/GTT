<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">poodle</text>
  <text x="50" y="120" class="subtitle">[ˈpuːdl] n. 贵宾犬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pood (来自德语 Pudel，意为“泼水”) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小贵宾犬(poodle)在花园里"泼水(pood)"，
    <tspan x="50" dy="25">它的毛发蓬松，像一朵朵云彩，可爱极了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The poodle was groomed to perfection.
  </text>
  <text x="50" y="310" class="content">
    这只贵宾犬被梳理得完美无瑕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Poodle body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Poodle head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Poodle ears -->
    <ellipse cx="80" cy="40" rx="15" ry="20" class="image" />
    <ellipse cx="120" cy="40" rx="15" ry="20" class="image" />
    <!-- Poodle eyes -->
    <circle cx="90" cy="45" r="5" class="image" />
    <circle cx="110" cy="45" r="5" class="image" />
    <!-- Poodle nose -->
    <circle cx="100" cy="60" r="5" class="image" />
    <!-- Poodle tail -->
    <line x1="100" y1="150" x2="100" y2="180" class="image" />
    <circle cx="100" cy="180" r="10" class="image" />
  </g>
</svg>