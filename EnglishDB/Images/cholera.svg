<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cholera</text>
  <text x="50" y="120" class="subtitle">[ˈkɒlərə] n. 霍乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chol- (胆汁) + -era (疾病)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个病人因为胆汁(chol-)异常而引发的疾病(-era)，
    <tspan x="50" dy="25">这种疾病就是霍乱(cholera)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outbreak of cholera was caused by contaminated water.
  </text>
  <text x="50" y="310" class="content">
    霍乱的爆发是由受污染的水引起的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Patient -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Bile -->
    <rect x="100" y="80" width="100" height="40" class="image" />
    <text x="120" y="105" class="content" fill="#8E44AD">Bile</text>
    <!-- Disease -->
    <rect x="220" y="80" width="100" height="40" class="image" />
    <text x="230" y="105" class="content" fill="#8E44AD">Disease</text>
  </g>
</svg>