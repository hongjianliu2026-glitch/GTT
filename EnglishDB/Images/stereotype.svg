<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stereotype</text>
  <text x="50" y="120" class="subtitle">[ˈsteriətaɪp] n. 刻板印象，老套</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stereo- (固体，立体) + type (类型)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个固化的(stereo-)类型(type)，就像一个僵硬的模具，
    <tspan x="50" dy="25">每个人都被套在这个模具里，无法摆脱刻板印象(stereotype)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's important to avoid stereotyping people based on their appearance.
  </text>
  <text x="50" y="310" class="content">
    重要的是不要根据外表对人产生刻板印象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mold -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Solid shape -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person in the mold -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="125" y2="140" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
  </g>
</svg>