<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tidy</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪdi] adj. 整洁的，整齐的；v. 使整洁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tid (时间) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时间(tid)管理大师，他的房间总是"整齐(tidy)"
    <tspan x="50" dy="25">有序，因为他知道时间就是金钱，不能浪费在找东西上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always keeps her room tidy.
  </text>
  <text x="50" y="310" class="content">
    她总是保持房间整洁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bed -->
    <rect x="50" y="20" width="250" height="80" class="image" />
    <!-- Desk -->
    <rect x="70" y="120" width="200" height="60" class="image" />
    <!-- Chair -->
    <rect x="20" y="120" width="40" height="60" class="image" />
    <!-- Bookshelf -->
    <rect x="280" y="20" width="50" height="160" class="image" />
    <!-- Books -->
    <line x1="290" y1="30" x2="320" y2="30" class="image" />
    <line x1="290" y1="50" x2="320" y2="50" class="image" />
    <line x1="290" y1="70" x2="320" y2="70" class="image" />
    <line x1="290" y1="90" x2="320" y2="90" class="image" />
    <line x1="290" y1="110" x2="320" y2="110" class="image" />
    <line x1="290" y1="130" x2="320" y2="130" class="image" />
    <line x1="290" y1="150" x2="320" y2="150" class="image" />
  </g>
</svg>