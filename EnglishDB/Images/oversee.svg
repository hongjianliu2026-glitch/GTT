<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oversee</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈsiː] v. 监督，监视</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + see (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个监工站在高处，"从上面看(over-see)"
    <tspan x="50" dy="25">着工人们的工作，确保一切顺利进行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project manager will oversee the construction process.
  </text>
  <text x="50" y="310" class="content">
    项目经理将监督施工过程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Supervisor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Workers -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="90" y2="150" class="image" />
    <line x1="100" y1="130" x2="110" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="110" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="140" y2="150" class="image" />
    <line x1="150" y1="130" x2="160" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="110" class="image" />
    <!-- Overseeing -->
    <line x1="20" y1="100" x2="125" y2="100" class="image" />
  </g>
</svg>