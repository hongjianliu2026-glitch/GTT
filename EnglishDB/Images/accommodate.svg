<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accommodate</text>
  <text x="50" y="120" class="subtitle">[əˈkɑːmədeɪt] v. 容纳，适应，提供住宿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + com- (共同) + mod (模式) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的房间，"加强共同的模式(ac-com-mod-ate)"
    <tspan x="50" dy="25">以容纳更多的人，这个房间就像一个旅馆，提供住宿(accommodate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hotel can accommodate up to 500 guests.
  </text>
  <text x="50" y="310" class="content">
    这家酒店可以容纳多达500位客人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Beds -->
    <rect x="50" y="20" width="100" height="60" class="image" />
    <rect x="200" y="20" width="100" height="60" class="image" />
    <!-- People -->
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="230" cy="60" r="10" class="image" />
    <!-- Door -->
    <rect x="150" y="150" width="50" height="50" class="image" />
  </g>
</svg>