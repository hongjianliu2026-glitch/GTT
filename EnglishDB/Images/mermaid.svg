<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mermaid</text>
  <text x="50" y="120" class="subtitle">[ˈmɜːrmeɪd] n. 美人鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mer- (海) + maid (少女)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个美丽的少女(maid)，她下半身是鱼尾，
    <tspan x="50" dy="25">生活在海洋(mer-)中，这就是美人鱼(mermaid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The legend of the mermaid has fascinated people for centuries.
  </text>
  <text x="50" y="310" class="content">
    美人鱼的传说几个世纪以来一直吸引着人们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#48C9B0" />
    <!-- Mermaid -->
    <circle cx="175" cy="100" r="30" class="image" fill="#F1C40F" /> <!-- Head -->
    <line x1="175" y1="130" x2="175" y2="180" class="image" /> <!-- Body -->
    <line x1="175" y1="150" x2="150" y2="130" class="image" /> <!-- Left arm -->
    <line x1="175" y1="150" x2="200" y2="130" class="image" /> <!-- Right arm -->
    <path d="M175,180 Q150,220 125,180 Q100,140 125,100 Q150,60 175,100 Q200,140 225,100 Q250,60 275,100 Q300,140 275,180 Q250,220 225,180" class="image" fill="#1ABC9C" /> <!-- Tail -->
  </g>
</svg>