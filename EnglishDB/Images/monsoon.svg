<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monsoon</text>
  <text x="50" y="120" class="subtitle">[mɒnˈsuːn] n. 季风，雨季</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mon- (月) + soon (季节)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"月亮(mon-)"在天空中，
    <tspan x="50" dy="25">它带来的"季节(soon)"变化引发了季风(monsoon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The monsoon season brings heavy rains to the region.
  </text>
  <text x="50" y="310" class="content">
    雨季给这个地区带来了大量的降雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Raindrops -->
    <line x1="50" y1="150" x2="50" y2="250" class="image" />
    <line x1="70" y1="150" x2="70" y2="250" class="image" />
    <line x1="90" y1="150" x2="90" y2="250" class="image" />
    <line x1="110" y1="150" x2="110" y2="250" class="image" />
    <line x1="130" y1="150" x2="130" y2="250" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <!-- Ground -->
    <rect x="0" y="250" width="200" height="50" class="image" fill="#2ECC71" />
  </g>
</svg>