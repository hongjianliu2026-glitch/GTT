<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">socialize</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊʃəlaɪz] v. 社交，交往</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soci (社会) + -alize (使...化)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一个热闹的派对上，"使(alize)"
    <tspan x="50" dy="25">自己融入(soci)社会，这就是社交(socialize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to socialize with friends at parties.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在派对上与朋友们社交。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Party scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Conversations -->
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
    <line x1="250" y1="120" x2="300" y2="120" class="image" />
    <!-- Party decorations -->
    <circle cx="300" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
  </g>
</svg>