<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gurney</text>
  <text x="50" y="120" class="subtitle">[ˈɡɜːrni] n. 轮床，担架车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "gurney"，原指一种小型的手推车。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医院里，医生推着一辆"轮床(gurney)"，
    <tspan x="50" dy="25">上面躺着一个病人，轮床的轮子在地板上滚动，发出轻微的声响。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paramedics quickly transferred the patient to a gurney.
  </text>
  <text x="50" y="310" class="content">
    急救人员迅速将病人转移到轮床上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gurney -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Patient -->
    <rect x="50" y="20" width="250" height="60" class="image" />
    <!-- Doctor -->
    <circle cx="20" cy="60" r="15" class="image" />
    <line x1="20" y1="75" x2="20" y2="100" class="image" />
    <line x1="20" y1="100" x2="0" y2="130" class="image" />
    <line x1="20" y1="100" x2="40" y2="130" class="image" />
    <line x1="20" y1="85" x2="50" y2="75" class="image" />
  </g>
</svg>