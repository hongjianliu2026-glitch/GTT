<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unregulated</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˈrɛɡjəˌleɪtɪd] adj. 未受管制的，无规则的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + regulate (调节)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个混乱的市场，"没有调节(un-regulated)"
    <tspan x="50" dy="25">的摊位随意摆放，商品乱七八糟，这就是无规则的(unregulated)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unregulated market led to chaos.
  </text>
  <text x="50" y="310" class="content">
    未受管制的市场导致了混乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stalls -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="40" width="50" height="50" class="image" />
    <rect x="190" y="60" width="50" height="50" class="image" />
    <rect x="260" y="80" width="50" height="50" class="image" />
    <!-- Messy items -->
    <line x1="60" y1="30" x2="110" y2="70" class="image" />
    <line x1="130" y1="50" x2="180" y2="90" class="image" />
    <line x1="200" y1="70" x2="250" y2="110" class="image" />
    <line x1="270" y1="90" x2="320" y2="130" class="image" />
  </g>
</svg>