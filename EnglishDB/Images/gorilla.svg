<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gorilla</text>
  <text x="50" y="120" class="subtitle">[ɡəˈrɪlə] n. 大猩猩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自西班牙语 "gorila"，可能来自非洲土著语言
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的大猩猩(gorilla)在森林中咆哮，
    <tspan x="50" dy="25">它的力量和威严让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gorilla is the largest primate in the world.
  </text>
  <text x="50" y="310" class="content">
    大猩猩是世界上最大的灵长类动物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Gorilla body -->
    <circle cx="150" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="150" y1="150" x2="150" y2="250" class="image" /> <!-- Body -->
    <line x1="150" y1="250" x2="100" y2="350" class="image" /> <!-- Left arm -->
    <line x1="150" y1="250" x2="200" y2="350" class="image" /> <!-- Right arm -->
    <line x1="150" y1="250" x2="100" y2="400" class="image" /> <!-- Left leg -->
    <line x1="150" y1="250" x2="200" y2="400" class="image" /> <!-- Right leg -->
    <!-- Facial features -->
    <circle cx="130" cy="90" r="5" class="image" /> <!-- Left eye -->
    <circle cx="170" cy="90" r="5" class="image" /> <!-- Right eye -->
    <line x1="140" y1="110" x2="160" y2="110" class="image" /> <!-- Mouth -->
  </g>
</svg>