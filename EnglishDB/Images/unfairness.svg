<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfairness</text>
  <text x="50" y="120" class="subtitle">[ʌnˈfɛrnəs] n. 不公平，不公正</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + fair (公平) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，一边是满满的金币，另一边却只有几枚硬币，
    <tspan x="50" dy="25">这就是"不公平(unfairness)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unfairness of the situation made everyone upset.
  </text>
  <text x="50" y="310" class="content">
    这种情况的不公平让每个人都感到不安。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="20" x2="100" y2="50" class="image" />
    <line x1="50" y1="20" x2="0" y2="50" class="image" />
    <!-- Coins on one side -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="140" cy="100" r="15" class="image" />
    <!-- Few coins on the other side -->
    <circle cx="20" cy="100" r="15" class="image" />
    <circle cx="40" cy="100" r="15" class="image" />
  </g>
</svg>