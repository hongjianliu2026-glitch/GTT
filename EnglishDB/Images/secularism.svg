<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">secularism</text>
  <text x="50" y="120" class="subtitle">[ˈsɛkjələˌrɪzəm] n. 世俗主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> secular (世俗的) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世界，宗教的符号被世俗的符号取代，
    <tspan x="50" dy="25">十字架变成了书本，教堂变成了图书馆，</tspan>
    <tspan x="50" dy="25">这就是世俗主义(secularism)的夸张画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rise of secularism has led to a decline in religious practices.
  </text>
  <text x="50" y="310" class="content">
    世俗主义的兴起导致了宗教实践的减少。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cross replaced by book -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <line x1="150" y1="75" x2="200" y2="75" class="image" />
    <!-- Church replaced by library -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Books -->
    <rect x="70" y="50" width="30" height="100" class="image" />
    <rect x="110" y="50" width="30" height="100" class="image" />
    <rect x="150" y="50" width="30" height="100" class="image" />
    <rect x="190" y="50" width="30" height="100" class="image" />
    <rect x="230" y="50" width="30" height="100" class="image" />
  </g>
</svg>