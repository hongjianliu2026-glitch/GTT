<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entity</text>
  <text x="50" y="120" class="subtitle">[ˈɛntɪti] n. 实体，存在</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ent- (存在) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"存在(ent-)"，它是一个"实体(entity)"，
    <tspan x="50" dy="25">它站在那里，无所不在，象征着一切存在的本质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is a separate legal entity from its owners.
  </text>
  <text x="50" y="310" class="content">
    公司是与其所有者分开的独立法人实体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Entity -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Symbol of existence -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="60" y1="60" x2="140" y2="140" class="image" />
    <line x1="60" y1="140" x2="140" y2="60" class="image" />
    <!-- Existence label -->
    <text x="80" y="220" class="content">存在</text>
  </g>
</svg>