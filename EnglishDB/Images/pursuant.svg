<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pursuant</text>
  <text x="50" y="120" class="subtitle">[pərˈsuːənt] adj. 依照的，遵循的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pur- (向前) + suant (跟随)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在追逐(pursue)目标，"向前跟随(pur-suant)"
    <tspan x="50" dy="25">着计划，坚定不移地执行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He acted pursuant to the company's policy.
  </text>
  <text x="50" y="310" class="content">
    他依照公司的政策行事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path -->
    <path d="M0 100 Q 100 50 200 100 T 400 100" class="image" />
    <!-- Person following the path -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Target -->
    <circle cx="400" cy="100" r="20" class="image" />
    <line x1="390" y1="90" x2="410" y2="110" class="image" />
    <line x1="390" y1="110" x2="410" y2="90" class="image" />
  </g>
</svg>