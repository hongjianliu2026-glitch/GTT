<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flute</text>
  <text x="50" y="120" class="subtitle">[fluːt] n. 长笛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flu (流动) + te (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家吹奏长笛，"流动的音乐(flu)"
    <tspan x="50" dy="25">从长笛中传出，形成美妙的旋律。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She played a beautiful melody on her flute.
  </text>
  <text x="50" y="310" class="content">
    她用长笛演奏了一首美妙的旋律。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flute -->
    <rect x="0" y="0" width="300" height="50" class="image" />
    <rect x="20" y="10" width="260" height="30" class="image" />
    <circle cx="30" cy="25" r="5" class="image" />
    <circle cx="70" cy="25" r="5" class="image" />
    <circle cx="110" cy="25" r="5" class="image" />
    <circle cx="150" cy="25" r="5" class="image" />
    <circle cx="190" cy="25" r="5" class="image" />
    <circle cx="230" cy="25" r="5" class="image" />
    <circle cx="270" cy="25" r="5" class="image" />
    <!-- Music notes -->
    <path d="M50 70 Q70 50 90 70 T130 70" class="image" />
    <path d="M100 70 Q120 50 140 70 T180 70" class="image" />
    <path d="M150 70 Q170 50 190 70 T230 70" class="image" />
  </g>
</svg>