<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hilly</text>
  <text x="50" y="120" class="subtitle">[ˈhɪli] adj. 多山的，丘陵的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hill (山) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片区域，到处都是"山(hill)"，
    <tspan x="50" dy="25">就像一个巨大的"山丘(hill)"王国，这就是"多山的(hilly)"地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The countryside is very hilly, making it difficult to drive.
  </text>
  <text x="50" y="310" class="content">
    乡村地区多山，开车很困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hills -->
    <path d="M0,150 Q50,50 100,150 T200,150 T300,150 T400,150" class="image" />
    <path d="M0,150 Q50,75 100,150 T200,150 T300,150 T400,150" class="image" />
    <path d="M0,150 Q50,100 100,150 T200,150 T300,150 T400,150" class="image" />
    <!-- Sun -->
    <circle cx="350" cy="50" r="30" fill="#F1C40F" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="40" ry="20" fill="#ECF0F1" />
    <ellipse cx="150" cy="60" rx="30" ry="15" fill="#ECF0F1" />
    <ellipse cx="200" cy="50" rx="40" ry="20" fill="#ECF0F1" />
  </g>
</svg>