<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weevil</text>
  <text x="50" y="120" class="subtitle">[ˈwiːvl] n. 象鼻虫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> weev- (小虫) + -il (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小象鼻虫(weevil)，它"小巧(weev-il)"
    <tspan x="50" dy="25">的身体在谷物中穿梭，留下小小的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weevil infested the entire grain storage.
  </text>
  <text x="50" y="310" class="content">
    象鼻虫侵袭了整个谷物储存区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grain storage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Grain -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Weevil -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="190" y2="180" class="image" />
    <line x1="200" y1="150" x2="210" y2="180" class="image" />
    <line x1="200" y1="130" x2="220" y2="120" class="image" />
  </g>
</svg>