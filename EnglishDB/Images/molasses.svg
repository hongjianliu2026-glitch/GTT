<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .molasses { fill: #4A235A; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">molasses</text>
  <text x="50" y="120" class="subtitle">[məˈlæsɪz] n. 糖蜜，糖浆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mola (磨) + -asses (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磨石(mola)在磨碎甘蔗，
    <tspan x="50" dy="25">流出黏稠的糖浆(molasses)，覆盖了整个地面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pancakes were topped with a drizzle of molasses.
  </text>
  <text x="50" y="310" class="content">
    煎饼上淋了一层糖蜜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Molasses pool -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="molasses" />
    <!-- Sugar cane -->
    <line x1="70" y1="50" x2="70" y2="180" class="image" />
    <line x1="100" y1="50" x2="100" y2="180" class="image" />
    <line x1="130" y1="50" x2="130" y2="180" class="image" />
    <line x1="160" y1="50" x2="160" y2="180" class="image" />
    <line x1="190" y1="50" x2="190" y2="180" class="image" />
    <!-- Grinding stone -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
  </g>
</svg>