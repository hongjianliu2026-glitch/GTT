<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">million</text>
  <text x="50" y="120" class="subtitle">[ˈmɪljən] n. 百万</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> milli- (千) + -on (表示“大”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“1000”(milli-)，
    <tspan x="50" dy="25">它被放大(on)成“百万”(million)，</tspan>
    <tspan x="50" dy="25">就像一个巨大的数字气球在空中飘浮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He won a million dollars in the lottery.
  </text>
  <text x="50" y="310" class="content">
    他在彩票中赢得了一百万美元。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number 1000 -->
    <text x="0" y="0" font-size="100" class="image">1000</text>
    <!-- Balloon -->
    <circle cx="150" cy="100" r="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <!-- String -->
    <line x1="150" y1="250" x2="130" y2="300" class="image" />
    <line x1="150" y1="250" x2="170" y2="300" class="image" />
    <!-- Magnifying glass -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="350" y2="180" class="image" />
  </g>
</svg>