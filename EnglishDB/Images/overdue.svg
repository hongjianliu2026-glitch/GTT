<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overdue</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈduː] adj. 过期的，延误的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (超过) + due (到期)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个图书馆的书，"超过(over)"了"到期(due)"时间，
    <tspan x="50" dy="25">变成了过期(overdue)的书，需要支付罚款。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The library book was overdue by two weeks.
  </text>
  <text x="50" y="310" class="content">
    图书馆的书已经过期两周了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="10" y1="10" x2="140" y2="10" class="image" />
    <line x1="10" y1="50" x2="140" y2="50" class="image" />
    <line x1="10" y1="90" x2="140" y2="90" class="image" />
    <line x1="10" y1="130" x2="140" y2="130" class="image" />
    <line x1="10" y1="170" x2="140" y2="170" class="image" />
    <!-- Overdue stamp -->
    <rect x="20" y="100" width="110" height="50" class="image" />
    <text x="25" y="130" class="content" fill="#C0392B" font-size="24">OVERDUE</text>
  </g>
</svg>