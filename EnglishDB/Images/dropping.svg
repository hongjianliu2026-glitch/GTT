<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dropping</text>
  <text x="50" y="120" class="subtitle">[ˈdrɒpɪŋ] n. 滴下，掉落；v. 掉下，滴下</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drop (滴下) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一滴水从高处"滴下(drop)"，
    <tspan x="50" dy="25">形成一个小水坑，这就是"dropping"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rain was dropping from the roof.
  </text>
  <text x="50" y="310" class="content">
    雨水从屋顶滴下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water drop -->
    <circle cx="50" cy="50" r="20" class="image" fill="#3498DB" />
    <!-- Ground -->
    <rect x="0" y="100" width="100" height="20" class="image" fill="#7F8C8D" />
    <!-- Dropping line -->
    <line x1="50" y1="50" x2="50" y2="90" class="image" stroke="#3498DB" stroke-width="4" />
  </g>
</svg>