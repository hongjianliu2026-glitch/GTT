<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">multivariate</text>
  <text x="50" y="120" class="subtitle">[ˌmʌltiˈvɛəriət] adj. 多变量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> multi- (多) + vari (变化) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个复杂的系统，"多重变化(multi-vari)"
    <tspan x="50" dy="25">交织在一起，形成了一个多变量的(multivariate)模型。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The study used multivariate analysis to understand the complex interactions.
  </text>
  <text x="50" y="310" class="content">
    该研究使用多变量分析来理解复杂的相互作用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Multiple variables -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <circle cx="50" cy="150" r="20" class="image" />
    <circle cx="150" cy="150" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <!-- Interconnected lines -->
    <line x1="70" y1="70" x2="130" y2="70" class="image" />
    <line x1="170" y1="70" x2="230" y2="70" class="image" />
    <line x1="70" y1="170" x2="130" y2="170" class="image" />
    <line x1="170" y1="170" x2="230" y2="170" class="image" />
    <line x1="100" y1="70" x2="100" y2="130" class="image" />
    <line x1="200" y1="70" x2="200" y2="130" class="image" />
  </g>
</svg>