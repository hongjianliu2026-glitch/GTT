<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">persistent</text>
  <text x="50" y="120" class="subtitle">[pərˈsɪstənt] adj. 坚持不懈的，持续的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (贯穿) + sist (站立) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在时间的河流中，"贯穿(per-)"
    <tspan x="50" dy="25">始终"站立(sist)"，永不放弃，这就是坚持不懈(persistent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Despite numerous failures, his persistent efforts finally paid off.
  </text>
  <text x="50" y="310" class="content">
    尽管遭遇多次失败，他坚持不懈的努力最终得到了回报。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q 100 50 200 100 T 400 100" class="image" />
    <path d="M0 120 Q 100 170 200 120 T 400 120" class="image" />
    <!-- Person standing in the river -->
    <circle cx="200" cy="90" r="15" class="image" />
    <line x1="200" y1="105" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>