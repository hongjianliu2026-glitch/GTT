<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">democracy</text>
  <text x="50" y="120" class="subtitle">[dɪˈmɒkrəsi] n. 民主</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> demo- (人民) + -cracy (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人民(demo-)在一个广场上，每个人都在参与讨论和决策，
    <tspan x="50" dy="25">这种由人民统治(-cracy)的方式就是民主(democracy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The country is known for its strong democracy.
  </text>
  <text x="50" y="310" class="content">
    这个国家以其强大的民主制度而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Discussion -->
    <line x1="50" y1="70" x2="100" y2="70" class="image" />
    <line x1="100" y1="70" x2="150" y2="70" class="image" />
    <line x1="150" y1="70" x2="200" y2="70" class="image" />
    <line x1="200" y1="70" x2="250" y2="70" class="image" />
    <!-- Decision -->
    <rect x="50" y="100" width="200" height="50" class="image" />
    <text x="100" y="130" class="content" fill="#2C3E50">Decision</text>
  </g>
</svg>