<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stalled</text>
  <text x="50" y="120" class="subtitle">[stɔːld] v. 停止，停滞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stall (停止)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在高速公路上突然"停止(stall)"，
    <tspan x="50" dy="25">引擎熄火，车轮不再转动，整个交通都停滞了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project stalled due to lack of funding.
  </text>
  <text x="50" y="310" class="content">
    由于缺乏资金，项目停滞了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="170" cy="110" r="15" class="image" />
    <circle cx="280" cy="110" r="15" class="image" />
    <!-- Stop sign -->
    <rect x="100" y="100" width="30" height="30" class="image" />
    <text x="105" y="125" class="content">STOP</text>
  </g>
</svg>