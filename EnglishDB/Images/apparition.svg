<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apparition</text>
  <text x="50" y="120" class="subtitle">[ˌæpəˈrɪʃn] n. 幽灵，幻影</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (加强) + par (出现) + -ition (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幽灵突然"加强出现(ap-par-ition)"，
    <tspan x="50" dy="25">在黑暗的房间里，吓得你心跳加速。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The apparition of the old man in the hallway startled everyone.
  </text>
  <text x="50" y="310" class="content">
    老人在走廊里的幽灵幻影吓坏了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ghost -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="160" class="image" />
    <line x1="175" y1="150" x2="200" y2="160" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Light effect -->
    <line x1="175" y1="70" x2="175" y2="50" class="image" />
    <line x1="160" y1="70" x2="140" y2="50" class="image" />
    <line x1="190" y1="70" x2="210" y2="50" class="image" />
  </g>
</svg>