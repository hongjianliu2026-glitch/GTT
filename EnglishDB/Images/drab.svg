<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #8B4513; }
      .image { stroke: #A9A9A9; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drab</text>
  <text x="50" y="120" class="subtitle">[dræb] adj. 单调的，无生气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drab (源自中古英语，意为“土褐色”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个灰色的世界，到处都是单调的土褐色，
    <tspan x="50" dy="25">没有一丝生气，这就是“drab”的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was painted in drab colors, making it feel lifeless.
  </text>
  <text x="50" y="310" class="content">
    房间被涂成了单调的颜色，显得毫无生气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Drab background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#808080" />
    <!-- Drab objects -->
    <rect x="50" y="20" width="50" height="50" class="image" fill="#A9A9A9" />
    <rect x="150" y="20" width="50" height="50" class="image" fill="#A9A9A9" />
    <rect x="250" y="20" width="50" height="50" class="image" fill="#A9A9A9" />
    <!-- Lifeless figure -->
    <circle cx="175" cy="120" r="30" class="image" fill="#A9A9A9" />
    <line x1="175" y1="150" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="160" x2="140" y2="150" class="image" />
    <line x1="175" y1="160" x2="210" y2="150" class="image" />
  </g>
</svg>