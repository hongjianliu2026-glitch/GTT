<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conversation</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnvəˈseɪʃn] n. 对话，交谈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + vers (转) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在咖啡馆里，"一起转动(con-vers)"
    <tspan x="50" dy="25">思想，进行着一场生动的对话(conversation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They had a long conversation about their future plans.
  </text>
  <text x="50" y="310" class="content">
    他们就未来的计划进行了一次长时间的交谈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee shop -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Two people -->
    <circle cx="80" cy="100" r="15" class="image" />
    <line x1="80" y1="115" x2="80" y2="150" class="image" />
    <line x1="80" y1="150" x2="60" y2="180" class="image" />
    <line x1="80" y1="150" x2="100" y2="180" class="image" />
    <line x1="80" y1="130" x2="110" y2="120" class="image" />

    <circle cx="220" cy="100" r="15" class="image" />
    <line x1="220" y1="115" x2="220" y2="150" class="image" />
    <line x1="220" y1="150" x2="200" y2="180" class="image" />
    <line x1="220" y1="150" x2="240" y2="180" class="image" />
    <line x1="220" y1="130" x2="250" y2="120" class="image" />

    <!-- Speech bubbles -->
    <path d="M 70 70 Q 100 50 130 70 L 130 100 Q 100 120 70 100 Z" class="image" />
    <path d="M 210 70 Q 240 50 270 70 L 270 100 Q 240 120 210 100 Z" class="image" />
  </g>
</svg>