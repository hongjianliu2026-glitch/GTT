<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">able</text>
  <text x="50" y="120" class="subtitle">[ˈeɪbl] adj. 能够的，有能力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (从) + -le (表示可能)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在起跑线上，"从(ab-)"
    <tspan x="50" dy="25">开始，他有能力(able)跑完全程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is able to finish the marathon.
  </text>
  <text x="50" y="310" class="content">
    她能够完成马拉松。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Start line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person -->
    <circle cx="20" cy="20" r="15" class="image" />
    <line x1="20" y1="35" x2="20" y2="70" class="image" />
    <line x1="20" y1="70" x2="0" y2="100" class="image" />
    <line x1="20" y1="70" x2="40" y2="100" class="image" />
    <line x1="20" y1="50" x2="50" y2="40" class="image" />
    <!-- Finish line -->
    <line x1="300" y1="0" x2="350" y2="0" class="image" />
    <line x1="300" y1="10" x2="350" y2="10" class="image" />
  </g>
</svg>