<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">offshoot</text>
  <text x="50" y="120" class="subtitle">[ˈɔːfʃuːt] n. 分支，旁支</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> off- (离开) + shoot (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树，"离开主干(off-)"
    <tspan x="50" dy="25">生长出(shoot)一个分支(offshoot)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's offshoot in Asia has been very successful.
  </text>
  <text x="50" y="310" class="content">
    公司在亚洲的分支非常成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main tree -->
    <line x1="50" y1="200" x2="50" y2="50" class="image" />
    <!-- Offshoot branch -->
    <line x1="50" y1="100" x2="150" y2="150" class="image" />
    <!-- Leaves on the offshoot -->
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="160" cy="140" r="10" class="image" />
    <circle cx="140" cy="140" r="10" class="image" />
  </g>
</svg>