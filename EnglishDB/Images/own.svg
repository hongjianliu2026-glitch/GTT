<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">own</text>
  <text x="50" y="120" class="subtitle">[oʊn] v. 拥有，占有；adj. 自己的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> own (源自原始日耳曼语 *awwan，意为“拥有”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一座房子前，自豪地宣称：“这是我的(own)！”
    <tspan x="50" dy="25">房子上挂着一块牌子，写着“我的(own)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She owns a beautiful house by the lake.
  </text>
  <text x="50" y="310" class="content">
    她在湖边拥有一座美丽的房子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <polygon points="0,150 100,100 200,150" class="image" />
    <!-- Door -->
    <rect x="80" y="100" width="40" height="50" class="image" />
    <!-- Person -->
    <circle cx="100" cy="80" r="15" class="image" />
    <line x1="100" y1="95" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="140" class="image" />
    <line x1="100" y1="120" x2="120" y2="140" class="image" />
    <line x1="100" y1="105" x2="130" y2="95" class="image" />
    <!-- Sign -->
    <rect x="150" y="50" width="40" height="20" class="image" />
    <text x="155" y="65" class="content" fill="#34495E">own</text>
  </g>
</svg>