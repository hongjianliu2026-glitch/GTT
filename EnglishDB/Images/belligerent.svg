<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">belligerent</text>
  <text x="50" y="120" class="subtitle">[bəˈlɪdʒərənt] adj. 好战的，交战的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> belli- (战争) + gerent (进行)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵在战场上，"进行(gerent)"
    <tspan x="50" dy="25">战争(belli-)，表现出好战的态度(belligerent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The belligerent nation declared war on its neighbor.
  </text>
  <text x="50" y="310" class="content">
    那个好战的国家向邻国宣战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Sword -->
    <line x1="20" y1="115" x2="70" y2="80" class="image" />
    <line x1="70" y1="80" x2="70" y2="100" class="image" />
    <!-- Shield -->
    <rect x="0" y="150" width="40" height="30" class="image" />
    <!-- Battlefield -->
    <line x1="0" y1="200" x2="100" y2="200" class="image" />
    <line x1="0" y1="210" x2="100" y2="210" class="image" />
    <line x1="0" y1="220" x2="100" y2="220" class="image" />
  </g>
</svg>