<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mega</text>
  <text x="50" y="120" class="subtitle">[ˈmɛɡə] adj. 巨大的，极大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mega- (大，巨大)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的(mega)气球，它大到可以装下整个城市，
    <tspan x="50" dy="25">这样的夸张画面让人印象深刻，记住了mega的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company launched a mega marketing campaign.
  </text>
  <text x="50" y="310" class="content">
    公司发起了一场大规模的营销活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Huge balloon -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- City inside the balloon -->
    <rect x="50" y="40" width="250" height="120" class="image" />
    <line x1="70" y1="60" x2="280" y2="60" class="image" />
    <line x1="70" y1="90" x2="250" y2="90" class="image" />
    <line x1="70" y1="120" x2="270" y2="120" class="image" />
    <line x1="70" y1="150" x2="240" y2="150" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="20" rx="30" ry="15" class="image" />
    <ellipse cx="250" cy="30" rx="40" ry="20" class="image" />
  </g>
</svg>