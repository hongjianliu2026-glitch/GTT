<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .pistachio { fill: #87CEEB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pistachio</text>
  <text x="50" y="120" class="subtitle">[pɪˈstæʃioʊ] n. 开心果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pist- (来自波斯语，意为“坚果”) + -achio (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的波斯市场，"坚果(pist-)"
    <tspan x="50" dy="25">摊位上摆满了开心果(pistachio)，人们开心地挑选着。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to snack on pistachios while watching TV.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在看电视时吃开心果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pistachio nuts -->
    <circle cx="50" cy="100" r="20" class="pistachio" />
    <circle cx="100" cy="100" r="20" class="pistachio" />
    <circle cx="150" cy="100" r="20" class="pistachio" />
    <circle cx="200" cy="100" r="20" class="pistachio" />
    <circle cx="250" cy="100" r="20" class="pistachio" />
    <!-- Person picking nuts -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="270" y2="120" class="image" />
  </g>
</svg>