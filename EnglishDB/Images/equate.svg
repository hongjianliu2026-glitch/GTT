<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">equate</text>
  <text x="50" y="120" class="subtitle">[ɪˈkweɪt] v. 使相等，等同</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> equ (相等) + ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，两边的重量完全相等，"使相等(equ-ate)"
    <tspan x="50" dy="25">就是让两边达到平衡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You can't equate success with money.
  </text>
  <text x="50" y="310" class="content">
    你不能把成功等同于金钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
    <circle cx="25" cy="120" r="20" class="image" />
    <circle cx="75" cy="120" r="20" class="image" />
    <!-- Equal sign -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
  </g>
</svg>