<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spare</text>
  <text x="50" y="120" class="subtitle">[sper] adj. 多余的，备用的；v. 节省，抽出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sper (希望) + e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个备用的轮胎，"希望(sper)"
    <tspan x="50" dy="25">永远用不上，但它总是"多余(spare)"地存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He always carries a spare tire in his car.
  </text>
  <text x="50" y="310" class="content">
    他总是带着一个备用轮胎在他的车里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spare tire -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Car -->
    <rect x="200" y="50" width="150" height="100" class="image" />
    <rect x="220" y="70" width="110" height="60" class="image" />
    <circle cx="230" cy="150" r="20" class="image" />
    <circle cx="320" cy="150" r="20" class="image" />
  </g>
</svg>