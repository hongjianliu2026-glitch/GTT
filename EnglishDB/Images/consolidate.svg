<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consolidate</text>
  <text x="50" y="120" class="subtitle">[kənˈsɑːlɪdeɪt] v. 巩固，合并</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + solid (坚固) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人将各自的砖块"一起(con-)"堆叠，
    <tspan x="50" dy="25">形成一个坚固(solid)的墙，这就是"巩固(consolidate)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to consolidate its branches into one central office.
  </text>
  <text x="50" y="310" class="content">
    公司决定将其分支机构合并到一个中央办公室。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bricks -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="110" y="20" width="50" height="30" class="image" />
    <rect x="170" y="20" width="50" height="30" class="image" />
    <rect x="230" y="20" width="50" height="30" class="image" />
    <rect x="50" y="60" width="50" height="30" class="image" />
    <rect x="110" y="60" width="50" height="30" class="image" />
    <rect x="170" y="60" width="50" height="30" class="image" />
    <rect x="230" y="60" width="50" height="30" class="image" />
    <rect x="50" y="100" width="50" height="30" class="image" />
    <rect x="110" y="100" width="50" height="30" class="image" />
    <rect x="170" y="100" width="50" height="30" class="image" />
    <rect x="230" y="100" width="50" height="30" class="image" />
    <!-- People -->
    <circle cx="75" cy="150" r="15" class="image" />
    <circle cx="135" cy="150" r="15" class="image" />
    <circle cx="195" cy="150" r="15" class="image" />
    <circle cx="255" cy="150" r="15" class="image" />
    <!-- Arms -->
    <line x1="75" y1="165" x2="50" y2="140" class="image" />
    <line x1="135" y1="165" x2="110" y2="140" class="image" />
    <line x1="195" y1="165" x2="170" y2="140" class="image" />
    <line x1="255" y1="165" x2="230" y2="140" class="image" />
  </g>
</svg>