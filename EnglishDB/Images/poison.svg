<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .poison { fill: #8E44AD; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">poison</text>
  <text x="50" y="120" class="subtitle">[ˈpɔɪzn] n. 毒药，毒物；v. 毒害</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pois (毒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个邪恶的巫师，手持一瓶"毒(pois)"药，
    <tspan x="50" dy="25">准备用来毒害无辜的村民。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The king was poisoned by his jealous brother.
  </text>
  <text x="50" y="310" class="content">
    国王被他嫉妒的兄弟毒害了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Poison bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image poison" />
    <!-- Evil wizard -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="120" y2="220" class="image" />
    <line x1="150" y1="180" x2="180" y2="220" class="image" />
    <line x1="150" y1="150" x2="200" y2="140" class="image" />
    <!-- Villagers -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="300" y2="130" class="image" />
  </g>
</svg>