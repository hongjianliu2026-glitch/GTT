<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inherit</text>
  <text x="50" y="120" class="subtitle">[ɪnˈherɪt] v. 继承</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + her (继承) + -it (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子从父母那里"进入(in-)"
    <tspan x="50" dy="25">继承(her-it)了家族的财富和智慧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She inherited a large fortune from her grandmother.
  </text>
  <text x="50" y="310" class="content">
    她从祖母那里继承了一大笔财富。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parent -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />

    <!-- Child -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />

    <!-- Arrow -->
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,100 170,90 170,110" class="image" />

    <!-- Treasure -->
    <rect x="250" y="80" width="50" height="40" class="image" />
    <line x1="250" y1="80" x2="300" y2="80" class="image" />
    <line x1="250" y1="120" x2="300" y2="120" class="image" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
    <line x1="300" y1="80" x2="300" y2="120" class="image" />
  </g>
</svg>