<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cancer</text>
  <text x="50" y="120" class="subtitle">[ˈkænsər] n. 癌症，巨蟹座</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> can (狗) + cer (角)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狗(can)头上长出了角(cer)，
    <tspan x="50" dy="25">这个角象征着癌症(cancer)的恶性生长。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Early detection of cancer can save lives.
  </text>
  <text x="50" y="310" class="content">
    癌症的早期检测可以挽救生命。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Tail -->
    <!-- Horn -->
    <line x1="50" y1="70" x2="50" y2="40" class="image" />
    <line x1="50" y1="40" x2="30" y2="20" class="image" />
    <line x1="50" y1="40" x2="70" y2="20" class="image" />
  </g>
</svg>