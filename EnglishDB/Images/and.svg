<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">and</text>
  <text x="50" y="120" class="subtitle">[ænd] conj. 和，与</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，简单连接词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人手拉手，"和(and)"在一起，象征着连接与结合。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought apples and oranges at the market.
  </text>
  <text x="50" y="310" class="content">
    她在市场上买了苹果和橙子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people holding hands -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <!-- Arms -->
    <line x1="50" y1="70" x2="30" y2="100" class="image" />
    <line x1="150" y1="70" x2="170" y2="100" class="image" />
  </g>
</svg>