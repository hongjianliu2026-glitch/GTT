<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">droop</text>
  <text x="50" y="120" class="subtitle">[druːp] v. 下垂，低垂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drop (滴落) + -o (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵花因为缺水而"滴落(drop)"，
    <tspan x="50" dy="25">花瓣低垂(droop)，仿佛在哀求雨水的滋润。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flowers drooped after a week without rain.
  </text>
  <text x="50" y="310" class="content">
    一周没有下雨后，花儿都低垂了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Flower pot -->
    <rect x="0" y="100" width="150" height="50" class="image" />
    <!-- Flower stem -->
    <line x1="75" y1="100" x2="75" y2="20" class="image" />
    <!-- Drooping flower -->
    <circle cx="75" cy="20" r="15" class="image" />
    <line x1="75" y1="35" x2="60" y2="60" class="image" />
    <line x1="75" y1="35" x2="90" y2="60" class="image" />
    <line x1="75" y1="35" x2="75" y2="60" class="image" />
    <!-- Drooping leaves -->
    <line x1="75" y1="70" x2="60" y2="90" class="image" />
    <line x1="75" y1="70" x2="90" y2="90" class="image" />
  </g>
</svg>