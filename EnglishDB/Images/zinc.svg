<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">zinc</text>
  <text x="50" y="120" class="subtitle">[zɪŋk] n. 锌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自德语 Zink，意为“锌”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锌块，闪闪发光，
    <tspan x="50" dy="25">它被用来制造各种金属制品，坚固耐用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roof of the building was coated with zinc to prevent rust.
  </text>
  <text x="50" y="310" class="content">
    建筑物的屋顶涂上了锌以防止生锈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Zinc block -->
    <rect x="0" y="0" width="200" height="150" class="image" fill="#C0C0C0" />
    <!-- Shine effect -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" stroke-width="4" stroke="#FFFFFF" />
    <line x1="20" y1="40" x2="160" y2="40" class="image" stroke-width="4" stroke="#FFFFFF" />
    <line x1="20" y1="60" x2="140" y2="60" class="image" stroke-width="4" stroke="#FFFFFF" />
    <line x1="20" y1="80" x2="120" y2="80" class="image" stroke-width="4" stroke="#FFFFFF" />
    <line x1="20" y1="100" x2="100" y2="100" class="image" stroke-width="4" stroke="#FFFFFF" />
  </g>
</svg>