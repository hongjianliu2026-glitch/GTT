<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chemistry</text>
  <text x="50" y="120" class="subtitle">[ˈkɛmɪstri] n. 化学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chem- (化学) + -istry (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"混合(chem-)"
    <tspan x="50" dy="25">各种化学物质，研究它们的反应，这就是化学(chemistry)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a strong interest in chemistry.
  </text>
  <text x="50" y="310" class="content">
    她对化学有浓厚的兴趣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flask -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <!-- Bubbles -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="70" cy="120" r="8" class="image" />
    <circle cx="30" cy="130" r="6" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="220" r="15" class="image" />
    <line x1="20" y1="235" x2="20" y2="270" class="image" />
    <line x1="20" y1="270" x2="0" y2="300" class="image" />
    <line x1="20" y1="270" x2="40" y2="300" class="image" />
    <line x1="20" y1="250" x2="50" y2="240" class="image" />
  </g>
</svg>