<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">strut</text>
  <text x="50" y="120" class="subtitle">[strʌt] v. 大摇大摆地走，支撑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> str- (拉紧) + ut (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只骄傲的孔雀，"拉紧(str-)"
    <tspan x="50" dy="25">身体，大摇大摆地走(ut)，展示它的美丽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The peacock strutted across the yard, showing off its feathers.
  </text>
  <text x="50" y="310" class="content">
    孔雀在院子里大摇大摆地走着，展示它的羽毛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Peacock body -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Peacock head -->
    <circle cx="150" cy="80" r="15" class="image" />
    <!-- Peacock tail -->
    <path d="M 100 130 Q 150 180 200 130" class="image" />
    <path d="M 100 130 Q 150 200 200 130" class="image" />
    <path d="M 100 130 Q 150 220 200 130" class="image" />
    <!-- Peacock legs -->
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <line x1="120" y1="130" x2="120" y2="200" class="image" />
  </g>
</svg>