<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ha</text>
  <text x="50" y="120" class="subtitle">[hɑː] int. 哈（笑声）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，拟声词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然发出"哈(ha)"的一声大笑，
    <tspan x="50" dy="25">声音回荡在整个房间，让人忍俊不禁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He couldn't help but say "Ha!" when he heard the joke.
  </text>
  <text x="50" y="310" class="content">
    听到那个笑话时，他忍不住笑出声来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mouth -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Teeth -->
    <rect x="70" y="80" width="60" height="20" class="image" />
    <!-- Tongue -->
    <rect x="85" y="100" width="30" height="30" class="image" />
    <!-- Sound waves -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="110" x2="250" y2="110" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <line x1="150" y1="130" x2="250" y2="130" class="image" />
    <line x1="150" y1="140" x2="250" y2="140" class="image" />
  </g>
</svg>