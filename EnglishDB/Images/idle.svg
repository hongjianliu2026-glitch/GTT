<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">idle</text>
  <text x="50" y="120" class="subtitle">[ˈaɪdl] adj. 空闲的，懒散的；v. 虚度，闲散</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> id- (无) + le (动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在椅子上，"无所事事(id-le)"，
    <tspan x="50" dy="25">手里拿着一杯咖啡，眼神空洞，这就是idle的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spent the whole afternoon idling away.
  </text>
  <text x="50" y="310" class="content">
    他整个下午都在无所事事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Person sitting -->
    <circle cx="75" cy="50" r="20" class="image" />
    <line x1="75" y1="70" x2="75" y2="100" class="image" />
    <line x1="75" y1="100" x2="50" y2="130" class="image" />
    <line x1="75" y1="100" x2="100" y2="130" class="image" />
    <!-- Coffee cup -->
    <rect x="120" y="40" width="30" height="20" class="image" />
    <line x1="135" y1="60" x2="135" y2="80" class="image" />
  </g>
</svg>