<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">draconian</text>
  <text x="50" y="120" class="subtitle">[drəˈkoʊniən] adj. 极其严厉的，严酷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drako (龙) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的龙(drako)，它的眼神冷酷无情，
    <tspan x="50" dy="25">它的规则极其严厉(draconian)，任何违反者都会受到严厉的惩罚。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new laws were so draconian that many people protested.
  </text>
  <text x="50" y="310" class="content">
    新法律极其严厉，以至于许多人抗议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dragon head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="80" y1="120" x2="70" y2="110" class="image" />
    <line x1="120" y1="120" x2="130" y2="110" class="image" />
  </g>
</svg>