<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .blood { fill: #8B0000; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gory</text>
  <text x="50" y="120" class="subtitle">[ˈɡɔːri] adj. 血淋淋的，残酷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gor (血) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战场，"血淋淋的(gory)"
    <tspan x="50" dy="25">场景，到处都是鲜血(gor)，令人毛骨悚然。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was too gory for my taste.
  </text>
  <text x="50" y="310" class="content">
    这部电影对我来说太血腥了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blood splatter -->
    <circle cx="50" cy="50" r="20" class="blood" />
    <circle cx="100" cy="70" r="15" class="blood" />
    <circle cx="150" cy="50" r="25" class="blood" />
    <circle cx="200" cy="70" r="18" class="blood" />
    <circle cx="250" cy="50" r="22" class="blood" />
    <!-- Blood drops -->
    <line x1="50" y1="50" x2="40" y2="40" class="image blood" />
    <line x1="100" y1="70" x2="90" y2="60" class="image blood" />
    <line x1="150" y1="50" x2="140" y2="40" class="image blood" />
    <line x1="200" y1="70" x2="190" y2="60" class="image blood" />
    <line x1="250" y1="50" x2="240" y2="40" class="image blood" />
  </g>
</svg>