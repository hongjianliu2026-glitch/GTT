<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chick</text>
  <text x="50" y="120" class="subtitle">[tʃɪk] n. 小鸡，小鸟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "chike"，意为小鸟
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只毛茸茸的小鸡(chick)，
    <tspan x="50" dy="25">它刚刚破壳而出，好奇地四处张望。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer found a tiny chick in the barn.
  </text>
  <text x="50" y="310" class="content">
    农夫在谷仓里发现了一只小鸡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Egg -->
    <ellipse cx="100" cy="100" rx="60" ry="80" class="image" />
    <!-- Chick -->
    <circle cx="100" cy="100" r="30" fill="#FFD700" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="130" class="image" />
    <line x1="100" y1="150" x2="130" y2="130" class="image" />
    <line x1="100" y1="180" x2="70" y2="210" class="image" />
    <line x1="100" y1="180" x2="130" y2="210" class="image" />
  </g>
</svg>