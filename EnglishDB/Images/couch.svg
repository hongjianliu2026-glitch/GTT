<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">couch</text>
  <text x="50" y="120" class="subtitle">[kaʊtʃ] n. 长沙发；v. 表达，隐含</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cou- (来自古法语 "couche"，意为"躺下")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在长沙发上，"躺下(cou-)"
    <tspan x="50" dy="25">休息，这个长沙发就是couch。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent the afternoon lounging on the couch.
  </text>
  <text x="50" y="310" class="content">
    她整个下午都懒洋洋地躺在长沙发上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Couch -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <rect x="20" y="20" width="310" height="110" class="image" />
    <!-- Person -->
    <circle cx="100" cy="80" r="15" class="image" />
    <line x1="100" y1="95" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="140" class="image" />
    <line x1="100" y1="120" x2="120" y2="140" class="image" />
    <line x1="100" y1="105" x2="130" y2="95" class="image" />
  </g>
</svg>