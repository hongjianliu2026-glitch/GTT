<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twofold</text>
  <text x="50" y="120" class="subtitle">[ˈtuːfəʊld] adj. 双重的，两倍的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> two- (二) + fold (倍)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师变出两个一模一样的兔子，"二倍(two-fold)"
    <tspan x="50" dy="25">的惊喜，这就是双重的(twofold)效果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The benefits of the new system are twofold: increased efficiency and reduced costs.
  </text>
  <text x="50" y="310" class="content">
    新系统的优势是双重的：提高了效率并降低了成本。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two rabbits -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Ears -->
    <line x1="30" y1="60" x2="50" y2="80" class="image" />
    <line x1="70" y1="60" x2="50" y2="80" class="image" />
    <line x1="130" y1="60" x2="150" y2="80" class="image" />
    <line x1="170" y1="60" x2="150" y2="80" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <circle cx="140" cy="90" r="5" class="image" />
    <circle cx="160" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <path d="M45 110 Q50 120 55 110" class="image" />
    <path d="M145 110 Q150 120 155 110" class="image" />
  </g>
</svg>