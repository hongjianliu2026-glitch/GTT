<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #F1C40F; }
      .panel { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">photovoltaic</text>
  <text x="50" y="120" class="subtitle">[ˌfoʊtoʊvɒlˈteɪɪk] adj. 光电的，光生伏打的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> photo- (光) + voltaic (伏打)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太阳(photo-)照射在一块电池板上，
    <tspan x="50" dy="25">电池板吸收光线并产生电流(voltaic)，这就是光电效应(photovoltaic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The photovoltaic system powers the entire house.
  </text>
  <text x="50" y="310" class="content">
    光电系统为整个房子供电。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Solar panel -->
    <rect x="200" y="50" width="200" height="100" class="panel" />
    <!-- Arrows -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 220,90 220,110" class="image" />
    <line x1="300" y1="100" x2="350" y2="100" class="image" />
    <polygon points="350,100 330,90 330,110" class="image" />
    <!-- Electricity -->
    <line x1="300" y1="150" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="280" y2="220" class="image" />
    <line x1="300" y1="200" x2="320" y2="220" class="image" />
  </g>
</svg>