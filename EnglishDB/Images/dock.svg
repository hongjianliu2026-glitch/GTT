<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dock</text>
  <text x="50" y="120" class="subtitle">[dɒk] n. 码头，船坞；v. 使靠码头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> doc (来自拉丁语 docere, 意为“教”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在码头(dock)上，船长正在"教导(doc)"
    <tspan x="50" dy="25">船员们如何安全地靠岸。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship docked at the port this morning.
  </text>
  <text x="50" y="310" class="content">
    这艘船今天早上停靠在港口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dock -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water -->
    <rect x="0" y="150" width="350" height="50" fill="#3498DB" />
    <!-- Ship -->
    <rect x="100" y="100" width="150" height="50" class="image" />
    <rect x="120" y="80" width="110" height="20" class="image" />
    <!-- Captain -->
    <circle cx="175" cy="70" r="10" class="image" />
    <line x1="175" y1="80" x2="175" y2="100" class="image" />
    <line x1="175" y1="100" x2="165" y2="120" class="image" />
    <line x1="175" y1="100" x2="185" y2="120" class="image" />
    <line x1="175" y1="90" x2="200" y2="80" class="image" />
  </g>
</svg>