<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pester</text>
  <text x="50" y="120" class="subtitle">[ˈpɛstər] v. 纠缠，烦扰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pest (害虫) + -er (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小虫子(pest)不停地在你身边飞来飞去，
    <tspan x="50" dy="25">像害虫一样"纠缠(pester)"你，让你无法专心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child pestered his parents for a new toy.
  </text>
  <text x="50" y="310" class="content">
    孩子缠着父母要新玩具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />

    <!-- Pest (insect) -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="180" y2="130" class="image" />
    <line x1="200" y1="110" x2="220" y2="130" class="image" />
    <line x1="200" y1="110" x2="190" y2="140" class="image" />
    <line x1="200" y1="110" x2="210" y2="140" class="image" />

    <!-- Pest flying around -->
    <path d="M200,100 C220,80 240,120 200,140" class="image" />
    <path d="M200,140 C180,160 160,120 200,100" class="image" />
  </g>
</svg>