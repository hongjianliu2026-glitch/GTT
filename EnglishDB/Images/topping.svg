<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">topping</text>
  <text x="50" y="120" class="subtitle">[ˈtɒpɪŋ] n. 顶端覆盖物，配料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> top (顶部) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的冰淇淋，"顶部(top)"
    <tspan x="50" dy="25">覆盖着各种美味的"配料(ing)"，</tspan>
    <tspan x="50" dy="25">这就是topping的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added chocolate chips as a topping to her ice cream.
  </text>
  <text x="50" y="310" class="content">
    她在冰淇淋上加了一些巧克力碎片作为配料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice cream cone -->
    <polygon points="0,150 50,0 100,150" class="image" />
    <!-- Ice cream scoop -->
    <circle cx="50" cy="130" r="30" class="image" />
    <!-- Toppings -->
    <circle cx="35" cy="115" r="5" class="image" />
    <circle cx="65" cy="115" r="5" class="image" />
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="40" cy="125" r="5" class="image" />
    <circle cx="60" cy="125" r="5" class="image" />
  </g>
</svg>