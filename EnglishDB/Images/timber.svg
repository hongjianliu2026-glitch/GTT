<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">timber</text>
  <text x="50" y="120" class="subtitle">[ˈtɪmbər] n. 木材，木料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> timb (木头) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林中，"木头(timb)"被砍伐下来，
    <tspan x="50" dy="25">经过加工后变成了建筑用的"木材(timber)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The house was built with high-quality timber.
  </text>
  <text x="50" y="310" class="content">
    这房子是用高质量的木材建造的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="20" r="30" class="image" />
    <!-- Axe -->
    <line x1="120" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="140" y2="160" class="image" />
    <!-- Timber -->
    <rect x="180" y="50" width="150" height="50" class="image" />
    <rect x="180" y="120" width="150" height="50" class="image" />
  </g>
</svg>