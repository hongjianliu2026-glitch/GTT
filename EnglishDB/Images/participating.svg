<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">participating</text>
  <text x="50" y="120" class="subtitle">[pɑːrˌtɪsəˈpeɪtɪŋ] v. 参与，参加</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> part (部分) + -i- + cip (拿) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围成一个圆圈，每个人都"拿(cip)"着一部分(part)，
    <tspan x="50" dy="25">共同参与(participating)一个活动，形成一个完整的整体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She actively participates in community events.
  </text>
  <text x="50" y="310" class="content">
    她积极参与社区活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle of people -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- People -->
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <!-- Hands -->
    <line x1="100" y1="65" x2="250" y2="65" class="image" />
    <line x1="65" y1="100" x2="315" y2="100" class="image" />
    <line x1="100" y1="135" x2="250" y2="135" class="image" />
  </g>
</svg>