<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smite</text>
  <text x="50" y="120" class="subtitle">[smaɪt] v. 重击，惩罚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smit (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨人手持巨锤，"重重地打击(smit)"
    <tspan x="50" dy="25">地面，发出震耳欲聋的声音，这就是smite的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thunder smites the ground with a loud crash.
  </text>
  <text x="50" y="310" class="content">
    雷声轰隆隆地击打着地面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="160" x2="100" y2="140" class="image" />
    <!-- Hammer -->
    <rect x="110" y="80" width="80" height="150" class="image" />
    <line x1="150" y1="80" x2="150" y2="20" class="image" />
    <line x1="150" y1="20" x2="130" y2="0" class="image" />
    <line x1="150" y1="20" x2="170" y2="0" class="image" />
    <!-- Ground -->
    <line x1="0" y1="260" x2="200" y2="260" class="image" />
    <line x1="50" y1="260" x2="50" y2="240" class="image" />
    <line x1="100" y1="260" x2="100" y2="240" class="image" />
    <line x1="150" y1="260" x2="150" y2="240" class="image" />
  </g>
</svg>