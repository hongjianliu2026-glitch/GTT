<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nonexistent</text>
  <text x="50" y="120" class="subtitle">[ˌnɒnɪɡˈzɪstənt] adj. 不存在的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> non- (不) + exist (存在) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幽灵在空荡荡的房间里飘荡，"不存在(non-existent)"
    <tspan x="50" dy="25">的东西就像这个幽灵一样，看不见也摸不着。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unicorn is a nonexistent creature in reality.
  </text>
  <text x="50" y="310" class="content">
    独角兽在现实中是不存在的生物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ghost -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="140" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <line x1="100" y1="180" x2="70" y2="200" class="image" />
    <line x1="100" y1="180" x2="130" y2="200" class="image" />
    <!-- Empty room -->
    <rect x="50" y="50" width="150" height="150" class="image" />
    <line x1="50" y1="100" x2="200" y2="100" class="image" />
    <line x1="50" y1="150" x2="200" y2="150" class="image" />
    <line x1="100" y1="50" x2="100" y2="200" class="image" />
    <line x1="150" y1="50" x2="150" y2="200" class="image" />
  </g>
</svg>