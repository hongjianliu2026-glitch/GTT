<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">satisfying</text>
  <text x="50" y="120" class="subtitle">[ˈsætɪsfaɪɪŋ] adj. 令人满意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> satis- (足够) + -fy (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人吃了一顿丰盛的晚餐，"足够(satis-)"
    <tspan x="50" dy="25">满足了他们的胃口，这种感觉就是令人满意的(satisfying)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meal was so satisfying that I didn't need dessert.
  </text>
  <text x="50" y="310" class="content">
    这顿饭非常令人满意，我都不需要甜点了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="50" class="image" />
    <rect x="170" y="50" width="100" height="100" class="image" />
    <polygon points="290,100 340,50 340,150" class="image" />
    <!-- Smiley face -->
    <circle cx="200" cy="150" r="30" class="image" />
    <line x1="185" y1="140" x2="215" y2="140" class="image" />
    <path d="M190,160 Q200,170 210,160" class="image" />
  </g>
</svg>