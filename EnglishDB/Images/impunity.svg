<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impunity</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpjuːnɪti] n. 不受惩罚，免罪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + pun (惩罚) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个罪犯在法庭上，"不受惩罚(in-pun-ity)"
    <tspan x="50" dy="25">地大摇大摆走出法庭，因为他有免罪(impunity)的特权。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The criminal escaped with impunity.
  </text>
  <text x="50" y="310" class="content">
    罪犯逃脱了惩罚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Criminal -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="240" y2="170" class="image" />
    <!-- Escaping -->
    <line x1="200" y1="230" x2="250" y2="280" class="image" />
    <line x1="250" y1="280" x2="300" y2="230" class="image" />
    <line x1="300" y1="230" x2="350" y2="280" class="image" />
  </g>
</svg>