<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disappear</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈpɪr] v. 消失，不见</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不，消失) + appear (出现)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在舞台上，"不出现(dis-appear)"
    <tspan x="50" dy="25">他的助手，助手突然消失在空气中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician made the rabbit disappear in a flash.
  </text>
  <text x="50" y="310" class="content">
    魔术师一瞬间就让兔子消失了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Magician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Disappearing effect -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <line x1="150" y1="140" x2="250" y2="140" class="image" />
    <line x1="150" y1="160" x2="250" y2="160" class="image" />
    <line x1="150" y1="180" x2="250" y2="180" class="image" />
    <!-- Disappearing assistant -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Disappearing effect -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="120" x2="250" y2="120" class="image" />
    <line x1="200" y1="140" x2="250" y2="140" class="image" />
    <line x1="200" y1="160" x2="250" y2="160" class="image" />
    <line x1="200" y1="180" x2="250" y2="180" class="image" />
  </g>
</svg>