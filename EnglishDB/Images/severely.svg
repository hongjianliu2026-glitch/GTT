<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">severely</text>
  <text x="50" y="120" class="subtitle">[sɪˈvɪrli] adv. 严重地，严厉地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sever (严重) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，"严厉地(sever-ly)"
    <tspan x="50" dy="25">宣判一个罪犯，他的表情和语气都非常严肃。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge severely punished the criminal.
  </text>
  <text x="50" y="310" class="content">
    法官严厉地惩罚了罪犯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Gavel -->
    <rect x="0" y="180" width="40" height="20" class="image" />
    <line x1="20" y1="200" x2="20" y2="220" class="image" />
    <!-- Courtroom -->
    <rect x="50" y="20" width="300" height="200" class="image" />
    <line x1="70" y1="50" x2="320" y2="50" class="image" />
    <line x1="70" y1="80" x2="320" y2="80" class="image" />
    <line x1="70" y1="110" x2="320" y2="110" class="image" />
    <line x1="70" y1="140" x2="320" y2="140" class="image" />
  </g>
</svg>