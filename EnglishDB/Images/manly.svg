<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manly</text>
  <text x="50" y="120" class="subtitle">[ˈmænli] adj. 男子气概的，勇敢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (男人) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的男人(man)，他勇敢地(ly)
    <tspan x="50" dy="25">面对挑战，展现出男子气概(manly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He showed a very manly attitude during the competition.
  </text>
  <text x="50" y="310" class="content">
    他在比赛中展现了非常男子气概的态度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Strong man -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <!-- Shield -->
    <rect x="100" y="80" width="100" height="100" class="image" />
    <line x1="150" y1="80" x2="150" y2="180" class="image" />
    <!-- Sword -->
    <line x1="220" y1="130" x2="320" y2="130" class="image" />
    <line x1="320" y1="130" x2="300" y2="110" class="image" />
    <line x1="320" y1="130" x2="300" y2="150" class="image" />
  </g>
</svg>