<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">influential</text>
  <text x="50" y="120" class="subtitle">[ˌɪnfluˈenʃl] adj. 有影响力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flu (流动) + ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的瀑布，水流(flu)涌入(in)
    <tspan x="50" dy="25">一个湖泊，形成强大的影响力(influential)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is an influential figure in the political arena.
  </text>
  <text x="50" y="310" class="content">
    他是政界有影响力的人物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Waterfall -->
    <path d="M0 100 L50 0 L100 100 Z" class="image" />
    <path d="M50 100 L100 0 L150 100 Z" class="image" />
    <path d="M100 100 L150 0 L200 100 Z" class="image" />
    <!-- Lake -->
    <rect x="0" y="100" width="200" height="100" class="image" />
    <!-- Water flow -->
    <line x1="50" y1="0" x2="50" y2="100" class="image" />
    <line x1="100" y1="0" x2="100" y2="100" class="image" />
    <line x1="150" y1="0" x2="150" y2="100" class="image" />
  </g>
</svg>