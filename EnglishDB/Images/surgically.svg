<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surgically</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrdʒɪkli] adv. 外科手术地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> surg (上升) + -ical (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个外科医生在手术台上，"上升(surg)"
    <tspan x="50" dy="25">到手术的高度，精确地进行手术操作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tumor was removed surgically.
  </text>
  <text x="50" y="310" class="content">
    肿瘤被外科手术切除。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Surgical table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Surgeon -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Surgical tools -->
    <line x1="120" y1="100" x2="150" y2="100" class="image" />
    <line x1="135" y1="80" x2="135" y2="120" class="image" />
    <line x1="180" y1="100" x2="210" y2="100" class="image" />
    <line x1="195" y1="80" x2="195" y2="120" class="image" />
    <!-- Patient -->
    <rect x="250" y="80" width="80" height="40" class="image" />
    <line x1="290" y1="120" x2="290" y2="160" class="image" />
    <line x1="290" y1="160" x2="270" y2="200" class="image" />
    <line x1="290" y1="160" x2="310" y2="200" class="image" />
  </g>
</svg>