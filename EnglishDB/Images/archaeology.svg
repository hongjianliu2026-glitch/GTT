<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">archaeology</text>
  <text x="50" y="120" class="subtitle">[ˌɑːrkiˈɒlədʒi] n. 考古学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> archaeo- (古代) + -logy (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位考古学家在挖掘古代遗址，"研究古代(archaeo-logy)"
    <tspan x="50" dy="25">的遗迹，揭示历史的秘密。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is passionate about archaeology and ancient civilizations.
  </text>
  <text x="50" y="310" class="content">
    她对考古学和古代文明充满热情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Archaeologist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Excavation site -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Ancient artifact -->
    <rect x="100" y="60" width="50" height="50" class="image" />
    <line x1="100" y1="60" x2="150" y2="110" class="image" />
    <line x1="150" y1="60" x2="100" y2="110" class="image" />
  </g>
</svg>