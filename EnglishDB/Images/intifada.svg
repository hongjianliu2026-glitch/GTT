<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intifada</text>
  <text x="50" y="120" class="subtitle">[ˌɪntɪˈfɑːdə] n. 起义，暴动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inti- (向内) + fada (摇动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"向内摇动(inti-fada)"旗帜，
    <tspan x="50" dy="25">表达他们的不满和反抗，这就是起义(intifada)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The intifada in the region lasted for years.
  </text>
  <text x="50" y="310" class="content">
    该地区的起义持续了多年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Flag -->
    <rect x="70" y="20" width="60" height="60" class="image" />
    <line x1="100" y1="20" x2="100" y2="80" class="image" />
    <!-- Shaking motion -->
    <line x1="100" y1="20" x2="120" y2="30" class="image" />
    <line x1="100" y1="30" x2="80" y2="40" class="image" />
    <line x1="100" y1="40" x2="120" y2="50" class="image" />
    <line x1="100" y1="50" x2="80" y2="60" class="image" />
  </g>
</svg>