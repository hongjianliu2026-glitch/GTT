<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bridal</text>
  <text x="50" y="120" class="subtitle">[ˈbraɪdl] adj. 新娘的，婚礼的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bride (新娘) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个美丽的新娘(bride)，穿着华丽的婚纱，
    <tspan x="50" dy="25">她的婚礼(bridal)充满了幸福和喜悦。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bridal gown was a stunning creation.
  </text>
  <text x="50" y="310" class="content">
    这件新娘礼服是一件令人惊艳的作品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bride -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="130" y2="180" class="image" />
    <line x1="100" y1="200" x2="70" y2="250" class="image" />
    <line x1="100" y1="200" x2="130" y2="250" class="image" />
    <!-- Wedding dress -->
    <path d="M100,200 Q150,220 100,250 Q50,220 100,200" class="image" />
    <!-- Veil -->
    <path d="M100,130 Q120,100 100,70 Q80,100 100,130" class="image" />
  </g>
</svg>