<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fatal</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪtl] adj. 致命的，灾难性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fat (说) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个预言家在预言中"说出(fat)"
    <tspan x="50" dy="25">一个灾难性的(fatal)事件，这个事件将带来致命的后果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident was fatal; no one survived.
  </text>
  <text x="50" y="310" class="content">
    这场事故是致命的，无人幸存。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crystal ball -->
    <circle cx="175" cy="100" r="75" class="image" />
    <!-- Lightning bolt -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="175" y2="175" class="image" />
    <line x1="175" y1="175" x2="250" y2="100" class="image" />
    <!-- Skull -->
    <circle cx="175" cy="250" r="50" class="image" />
    <line x1="150" y1="270" x2="200" y2="270" class="image" />
    <line x1="150" y1="270" x2="150" y2="300" class="image" />
    <line x1="200" y1="270" x2="200" y2="300" class="image" />
    <line x1="150" y1="300" x2="200" y2="300" class="image" />
  </g>
</svg>