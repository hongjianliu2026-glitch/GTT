<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exacerbate</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzæsərbeɪt] v. 使恶化，使加剧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + acerb (苦) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苦涩的药丸被"挤出(ex-)"瓶子，
    <tspan x="50" dy="25">结果让病人的病情"恶化(acerbate)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bad weather exacerbated the traffic congestion.
  </text>
  <text x="50" y="310" class="content">
    糟糕的天气加剧了交通拥堵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <!-- Pill -->
    <circle cx="50" cy="170" r="15" class="image" />
    <!-- Patient -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <!-- Exclamation mark -->
    <line x1="200" y1="80" x2="200" y2="60" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
  </g>
</svg>