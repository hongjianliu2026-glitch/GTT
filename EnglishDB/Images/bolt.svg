<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bolt</text>
  <text x="50" y="120" class="subtitle">[boʊlt] n. 螺栓，闪电；v. 逃跑，急忙离开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bol (投掷) + -t (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一道闪电"投掷(bol-t)"下来，击中地面，发出巨大的声响。
    <tspan x="50" dy="25">或者一个螺栓被"投掷"进木头里，固定住两个物体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thief bolted out of the store when the alarm went off.
  </text>
  <text x="50" y="310" class="content">
    警报响起时，小偷急忙逃离了商店。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lightning bolt -->
    <polyline points="0,100 50,50 100,100 150,50 200,100" class="image" />
    <!-- Bolt in wood -->
    <rect x="250" y="50" width="100" height="50" class="image" />
    <line x1="270" y1="50" x2="270" y2="100" class="image" />
    <line x1="280" y1="50" x2="280" y2="100" class="image" />
    <line x1="290" y1="50" x2="290" y2="100" class="image" />
    <line x1="300" y1="50" x2="300" y2="100" class="image" />
    <line x1="310" y1="50" x2="310" y2="100" class="image" />
    <line x1="320" y1="50" x2="320" y2="100" class="image" />
    <line x1="330" y1="50" x2="330" y2="100" class="image" />
    <line x1="340" y1="50" x2="340" y2="100" class="image" />
    <line x1="350" y1="50" x2="350" y2="100" class="image" />
  </g>
</svg>