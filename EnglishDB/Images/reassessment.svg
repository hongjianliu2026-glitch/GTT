<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reassessment</text>
  <text x="50" y="120" class="subtitle">[ˌriːəˈsɛsmənt] n. 重新评估</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + assess (评估) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着放大镜，"再次评估(re-assess)"
    <tspan x="50" dy="25">一个物体，仔细检查每一个细节，确保没有遗漏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to reassess its marketing strategy.
  </text>
  <text x="50" y="310" class="content">
    公司决定重新评估其营销策略。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="80" y1="100" x2="150" y2="100" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <!-- Object being assessed -->
    <rect x="200" y="80" width="100" height="40" class="image" />
    <!-- Person -->
    <circle cx="350" cy="100" r="20" class="image" />
    <line x1="350" y1="120" x2="350" y2="160" class="image" />
    <line x1="350" y1="160" x2="330" y2="190" class="image" />
    <line x1="350" y1="160" x2="370" y2="190" class="image" />
    <line x1="350" y1="140" x2="380" y2="130" class="image" />
  </g>
</svg>