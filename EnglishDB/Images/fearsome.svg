<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fearsome</text>
  <text x="50" y="120" class="subtitle">[ˈfɪrsəm] adj. 可怕的，吓人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fear (害怕) + -some (有...性质的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的怪兽，"害怕(fear)"
    <tspan x="50" dy="25">的气息弥漫四周，让人感到"有...性质的(some)"</tspan>
    <tspan x="50" dy="25">可怕(fearsome)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion's roar was so fearsome that it made everyone tremble.
  </text>
  <text x="50" y="310" class="content">
    狮子的吼声如此可怕，以至于每个人都颤抖了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="200" x2="50" y2="150" class="image" /> <!-- Left arm -->
    <line x1="100" y1="200" x2="150" y2="150" class="image" /> <!-- Right arm -->
    <line x1="100" y1="250" x2="50" y2="300" class="image" /> <!-- Left leg -->
    <line x1="100" y1="250" x2="150" y2="300" class="image" /> <!-- Right leg -->
    <!-- Fearful face -->
    <circle cx="80" cy="80" r="5" class="image" /> <!-- Left eye -->
    <circle cx="120" cy="80" r="5" class="image" /> <!-- Right eye -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" /> <!-- Mouth -->
  </g>
</svg>