<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spectacle</text>
  <text x="50" y="120" class="subtitle">[ˈspektəkl] n. 奇观，景象；眼镜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spect (看) + -acle (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"看(spect)"舞台，上面有各种奇异的表演，
    <tspan x="50" dy="25">观众们戴着"眼镜(spectacle)"，目不转睛地观看这场"奇观(spectacle)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fireworks display was a spectacular.
  </text>
  <text x="50" y="310" class="content">
    烟火表演是一场壮观的景象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Spectators -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Glasses -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="90" y1="90" x2="110" y2="90" class="image" />
    <line x1="140" y1="90" x2="160" y2="90" class="image" />
    <line x1="190" y1="90" x2="210" y2="90" class="image" />
    <line x1="240" y1="90" x2="260" y2="90" class="image" />
    <!-- Performance -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="100" class="image" />
    <line x1="175" y1="80" x2="150" y2="70" class="image" />
    <line x1="175" y1="80" x2="200" y2="70" class="image" />
    <line x1="175" y1="100" x2="150" y2="120" class="image" />
    <line x1="175" y1="100" x2="200" y2="120" class="image" />
  </g>
</svg>