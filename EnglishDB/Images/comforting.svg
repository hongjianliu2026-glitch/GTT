<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comforting</text>
  <text x="50" y="120" class="subtitle">[ˈkʌmfərtɪŋ] adj. 安慰的，令人欣慰的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + fort (强壮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温暖的拥抱，"一起变得强壮(com-fort)"
    <tspan x="50" dy="25">和安慰，这种感觉就是令人欣慰的(comforting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comforting words from her friend made her feel better.
  </text>
  <text x="50" y="310" class="content">
    朋友安慰的话语让她感觉好多了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warm hug -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <line x1="100" y1="200" x2="200" y2="200" class="image" />
    <!-- Heart -->
    <path d="M150,250 C130,280 170,280 150,310" class="image" />
    <path d="M150,250 C170,280 130,280 150,310" class="image" />
  </g>
</svg>