<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">routinely</text>
  <text x="50" y="120" class="subtitle">[ruːˈtiːnli] adv. 例行公事地，常规地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> route (路线) + -ine (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个上班族每天沿着固定的"路线(route)"
    <tspan x="50" dy="25">走，做着同样的事情，这就是例行公事(routinely)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She checks her email routinely every morning.
  </text>
  <text x="50" y="310" class="content">
    她每天早上都会例行检查邮件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path representing the route -->
    <path d="M50 50 L150 50 L150 150 L50 150 Z" class="image" />
    <!-- Person walking -->
    <circle cx="60" cy="60" r="10" class="image" />
    <line x1="60" y1="70" x2="60" y2="100" class="image" />
    <line x1="60" y1="80" x2="50" y2="90" class="image" />
    <line x1="60" y1="80" x2="70" y2="90" class="image" />
    <line x1="60" y1="100" x2="50" y2="110" class="image" />
    <line x1="60" y1="100" x2="70" y2="110" class="image" />
    <!-- Clock -->
    <circle cx="180" cy="100" r="20" class="image" />
    <line x1="180" y1="100" x2="180" y2="80" class="image" />
    <line x1="180" y1="100" x2="195" y2="105" class="image" />
  </g>
</svg>