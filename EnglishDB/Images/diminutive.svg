<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diminutive</text>
  <text x="50" y="120" class="subtitle">[ˌdɪmɪˈnjuːtɪv] adj. 极小的，小型的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (向下) + min (小) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的巨人，他低下头(di-)，
    <tspan x="50" dy="25">看到一个微小(min)的生物，这个生物就是diminutive的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The toy car was diminutive in size compared to the real one.
  </text>
  <text x="50" y="310" class="content">
    这辆玩具车与真车相比尺寸极小。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant -->
    <circle cx="200" cy="100" r="80" class="image" />
    <line x1="200" y1="180" x2="200" y2="300" class="image" />
    <line x1="200" y1="300" x2="120" y2="400" class="image" />
    <line x1="200" y1="300" x2="280" y2="400" class="image" />
    <line x1="200" y1="220" x2="150" y2="250" class="image" />
    <line x1="200" y1="220" x2="250" y2="250" class="image" />

    <!-- Diminutive creature -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="190" y2="150" class="image" />
    <line x1="200" y1="130" x2="210" y2="150" class="image" />
    <line x1="200" y1="120" x2="180" y2="115" class="image" />
    <line x1="200" y1="120" x2="220" y2="115" class="image" />
  </g>
</svg>