<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marrow</text>
  <text x="50" y="120" class="subtitle">[ˈmæroʊ] n. 骨髓，精华</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar (海) + row (行)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在海上航行，"海(mar)"中的"行(row)"，
    <tspan x="50" dy="25">象征着生命的精华(marrow)，就像骨髓一样滋养着生命。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The marrow of the bone is essential for blood production.
  </text>
  <text x="50" y="310" class="content">
    骨髓对血液的生成至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boat -->
    <polygon points="50,150 150,150 100,50" class="image" />
    <!-- Marrow -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="200" class="image" />
    <line x1="250" y1="180" x2="270" y2="200" class="image" />
    <line x1="250" y1="150" x2="200" y2="140" class="image" />
  </g>
</svg>