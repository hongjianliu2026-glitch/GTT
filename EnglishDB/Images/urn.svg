<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">urn</text>
  <text x="50" y="120" class="subtitle">[ɜːrn] n. 瓮，骨灰盒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> urn (源自拉丁语 "urna"，意为“瓮”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的瓮(urn)，里面装满了珍贵的骨灰，
    <tspan x="50" dy="25">象征着对逝者的尊重和纪念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The family placed the ashes in an urn.
  </text>
  <text x="50" y="310" class="content">
    家人将骨灰放入了一个瓮中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Urn shape -->
    <path d="M50 200 Q100 100 150 200 L150 300 Q100 400 50 300 Z" class="image" fill="#D35400" />
    <!-- Handle -->
    <path d="M70 200 Q80 150 90 200" class="image" fill="#D35400" />
    <path d="M110 200 Q120 150 130 200" class="image" fill="#D35400" />
    <!-- Ashes -->
    <path d="M60 250 Q100 230 140 250" class="image" fill="#8E44AD" />
    <path d="M60 270 Q100 250 140 270" class="image" fill="#8E44AD" />
    <path d="M60 290 Q100 270 140 290" class="image" fill="#8E44AD" />
  </g>
</svg>