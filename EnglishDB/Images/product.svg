<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">product</text>
  <text x="50" y="120" class="subtitle">[ˈprɒdʌkt] n. 产品，产物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + duct (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂里，"向前引导(pro-duct)"
    <tspan x="50" dy="25">原材料，经过一系列工序，最终变成了一个产品(product)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company launched a new product last month.
  </text>
  <text x="50" y="310" class="content">
    公司上个月推出了一款新产品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Conveyor belt -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <!-- Raw material -->
    <circle cx="70" cy="65" r="10" class="image" />
    <circle cx="100" cy="65" r="10" class="image" />
    <circle cx="130" cy="65" r="10" class="image" />
    <!-- Product -->
    <rect x="250" y="40" width="30" height="50" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="65" x2="240" y2="65" class="image" />
    <polygon points="240,60 250,65 240,70" class="image" />
  </g>
</svg>