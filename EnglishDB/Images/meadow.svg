<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .grass { fill: #2ECC71; }
      .flower { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meadow</text>
  <text x="50" y="120" class="subtitle">[ˈmedoʊ] n. 草地，牧场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> med (草地) + -ow (表示地点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的草地(meadow)，上面长满了青草(med)，
    <tspan x="50" dy="25">还有几朵黄色的花朵点缀其中，仿佛是大自然的画布。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cows grazed peacefully in the meadow.
  </text>
  <text x="50" y="310" class="content">
    牛群在草地上平静地吃草。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="0" width="350" height="200" class="grass" />
    <!-- Flowers -->
    <circle cx="50" cy="50" r="10" class="flower" />
    <circle cx="100" cy="70" r="10" class="flower" />
    <circle cx="150" cy="90" r="10" class="flower" />
    <circle cx="200" cy="110" r="10" class="flower" />
    <circle cx="250" cy="130" r="10" class="flower" />
    <circle cx="300" cy="150" r="10" class="flower" />
  </g>
</svg>