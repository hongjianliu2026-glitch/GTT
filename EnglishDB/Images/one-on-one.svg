<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">one-on-one</text>
  <text x="50" y="120" class="subtitle">[ˌwʌn ən ˈwʌn] adj. 一对一的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> one (一个) + on (在...上) + one (一个)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，"一对一(one-on-one)"
    <tspan x="50" dy="25">地交流，这种直接的互动让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They had a one-on-one meeting to discuss the project.
  </text>
  <text x="50" y="310" class="content">
    他们进行了一次一对一的会议来讨论项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="180" y2="100" class="image" />
    <line x1="70" y1="100" x2="70" y2="150" class="image" />
    <line x1="180" y1="100" x2="180" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="180" y1="150" x2="160" y2="180" class="image" />
    <line x1="180" y1="150" x2="200" y2="180" class="image" />
  </g>
</svg>