<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unjust</text>
  <text x="50" y="120" class="subtitle">[ʌnˈdʒʌst] adj. 不公正的，不公平的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + just (公正)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，"否定(un-)"
    <tspan x="50" dy="25">公正(just)的判决，这就是不公正(unjust)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The verdict was deemed unjust by many people.
  </text>
  <text x="50" y="310" class="content">
    许多人认为这个判决是不公正的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Gavel -->
    <rect x="10" y="80" width="20" height="30" class="image" />
    <line x1="20" y1="80" x2="20" y2="50" class="image" />
    <!-- Scales -->
    <line x1="50" y1="100" x2="70" y2="100" class="image" />
    <line x1="60" y1="100" x2="60" y2="130" class="image" />
    <circle cx="55" cy="130" r="5" class="image" />
    <circle cx="65" cy="130" r="5" class="image" />
    <!-- Crossed out -->
    <line x1="40" y1="80" x2="80" y2="120" class="image" />
    <line x1="40" y1="120" x2="80" y2="80" class="image" />
  </g>
</svg>