<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prime</text>
  <text x="50" y="120" class="subtitle">[praɪm] adj. 主要的，最初的；n. 初期，青春</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prim (第一，首要)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字"1"，它是所有数字的"第一(prim)"，
    <tspan x="50" dy="25">象征着最初的、最重要的状态，这就是prime的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The prime minister made an important speech.
  </text>
  <text x="50" y="310" class="content">
    首相发表了重要的演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large number "1" -->
    <line x1="100" y1="50" x2="100" y2="250" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="250" x2="150" y2="200" class="image" />
    <!-- Annotation -->
    <text x="120" y="300" class="content">
      <tspan class="highlight">第一</tspan>
    </text>
  </g>
</svg>