<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fast-growing</text>
  <text x="50" y="120" class="subtitle">[ˈfɑːst ˈɡroʊɪŋ] adj. 快速增长的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fast (快速的) + grow (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树在短时间内迅速"生长(grow)"，
    <tspan x="50" dy="25">它的枝叶以惊人的速度扩展，这就是"快速增长的(fast-growing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is a fast-growing startup in the tech industry.
  </text>
  <text x="50" y="310" class="content">
    这家公司是科技行业中快速增长的初创企业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="100" y1="50" x2="50" y2="100" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <!-- Fast growth -->
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="300" x2="50" y2="350" class="image" />
    <line x1="100" y1="300" x2="150" y2="350" class="image" />
  </g>
</svg>