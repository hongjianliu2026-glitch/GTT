<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">short-lived</text>
  <text x="50" y="120" class="subtitle">[ˌʃɔːrtˈlaɪvd] adj. 短暂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> short (短的) + lived (live的过去分词，生活)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶，它的生命非常短暂，"短命(short-lived)"
    <tspan x="50" dy="25">的它只能享受片刻的飞翔，然后就消失在花丛中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The excitement was short-lived; it quickly faded away.
  </text>
  <text x="50" y="310" class="content">
    兴奋感是短暂的；它很快就消失了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly -->
    <path d="M50 50 C 70 20, 130 20, 150 50" class="image" />
    <path d="M50 50 C 30 80, 70 120, 100 100" class="image" />
    <path d="M150 50 C 170 80, 130 120, 100 100" class="image" />
    <!-- Flower -->
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="80" cy="130" r="15" class="image" />
    <circle cx="120" cy="130" r="15" class="image" />
    <circle cx="100" cy="110" r="10" class="image" />
    <!-- Vanishing effect -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
  </g>
</svg>