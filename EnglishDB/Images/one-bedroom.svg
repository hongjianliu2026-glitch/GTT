<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">one-bedroom</text>
  <text x="50" y="120" class="subtitle">[ˈwʌn ˈbɛdˌrum] n. 一居室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> one (一) + bedroom (卧室)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个只有一间卧室的公寓，"一(one)"
    <tspan x="50" dy="25">间卧室(bedroom)"，简单而温馨。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She lives in a cozy one-bedroom apartment.
  </text>
  <text x="50" y="310" class="content">
    她住在一个舒适的一居室公寓里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apartment outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bedroom -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Living room -->
    <rect x="170" y="20" width="100" height="80" class="image" />
    <!-- Kitchen -->
    <rect x="50" y="120" width="100" height="60" class="image" />
    <!-- Bathroom -->
    <rect x="170" y="120" width="100" height="60" class="image" />
    <!-- Bed in the bedroom -->
    <rect x="60" y="30" width="80" height="60" class="image" />
    <!-- Sofa in the living room -->
    <rect x="180" y="30" width="80" height="60" class="image" />
    <!-- Sink in the kitchen -->
    <rect x="60" y="130" width="80" height="40" class="image" />
    <!-- Toilet in the bathroom -->
    <rect x="180" y="130" width="80" height="40" class="image" />
  </g>
</svg>