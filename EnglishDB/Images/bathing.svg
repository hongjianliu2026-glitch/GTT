<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bathing</text>
  <text x="50" y="120" class="subtitle">[ˈbeɪðɪŋ] n. 沐浴，游泳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bath (沐浴) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在海边，"沐浴(bath)"
    <tspan x="50" dy="25">在阳光下，享受着海水的清凉，这就是沐浴(bathing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They enjoy bathing in the sea during summer.
  </text>
  <text x="50" y="310" class="content">
    他们夏天喜欢在海里游泳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="200" cy="50" r="40" fill="#F39C12" />
    <!-- Sea -->
    <rect x="0" y="100" width="400" height="150" fill="#3498DB" />
    <!-- Person -->
    <circle cx="200" cy="150" r="20" fill="#2ECC71" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="170" y2="180" class="image" />
    <line x1="200" y1="190" x2="230" y2="180" class="image" />
  </g>
</svg>