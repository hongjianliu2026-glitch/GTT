<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turtle</text>
  <text x="50" y="120" class="subtitle">[ˈtɜːrtl] n. 海龟，龟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "turtle"，意为“龟”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只缓慢爬行的海龟，它的壳就像一座移动的岛屿，
    <tspan x="50" dy="25">在海洋中悠然自得地漂浮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The turtle slowly swam towards the coral reef.
  </text>
  <text x="50" y="310" class="content">
    海龟慢慢地游向珊瑚礁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Turtle shell -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Turtle head -->
    <circle cx="40" cy="100" r="20" class="image" />
    <!-- Turtle legs -->
    <line x1="100" y1="160" x2="130" y2="200" class="image" />
    <line x1="100" y1="160" x2="70" y2="200" class="image" />
    <line x1="100" y1="160" x2="160" y2="200" class="image" />
    <line x1="100" y1="160" x2="40" y2="200" class="image" />
    <!-- Turtle tail -->
    <line x1="100" y1="160" x2="100" y2="220" class="image" />
  </g>
</svg>