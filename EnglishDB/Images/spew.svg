<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spew</text>
  <text x="50" y="120" class="subtitle">[spjuː] v. 喷出，涌出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sp- (喷出) + ew (出)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个火山口，"喷出(sp-ew)"
    <tspan x="50" dy="25">熔岩和烟雾，场面壮观且令人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pipe spewed black smoke into the sky.
  </text>
  <text x="50" y="310" class="content">
    管道向天空喷出黑烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Volcano -->
    <path d="M 0 150 Q 50 100 100 150 Q 150 200 200 150 Q 250 100 300 150" class="image" />
    <!-- Lava -->
    <path d="M 100 150 Q 120 170 140 150 Q 160 130 180 150 Q 200 170 220 150" class="image" />
    <!-- Smoke -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="170" cy="80" r="15" class="image" />
    <circle cx="190" cy="60" r="10" class="image" />
  </g>
</svg>