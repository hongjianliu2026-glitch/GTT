<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bliss</text>
  <text x="50" y="120" class="subtitle">[blɪs] n. 极乐，幸福</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bliss (源自中古英语，意为幸福)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光下，脸上洋溢着幸福的笑容，
    <tspan x="50" dy="25">仿佛置身于极乐世界(bliss)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt an overwhelming sense of bliss when she saw her newborn baby.
  </text>
  <text x="50" y="310" class="content">
    当她看到她的新生儿时，她感到一种难以言喻的幸福。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Happy face -->
    <circle cx="200" cy="100" r="30" fill="#F39C12" />
    <circle cx="185" cy="90" r="5" fill="#000" />
    <circle cx="215" cy="90" r="5" fill="#000" />
    <path d="M185 110 Q200 120 215 110" stroke="#000" stroke-width="2" fill="none" />
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" fill="#2ECC71" />
  </g>
</svg>