<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sprinkler</text>
  <text x="50" y="120" class="subtitle">[ˈsprɪŋklər] n. 洒水器，喷水装置</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spink (洒水) + ler (装置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的洒水器(sprinkler)在花园里，
    <tspan x="50" dy="25">"洒水(spink)"出无数的水滴，滋润着花草。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sprinkler system keeps the lawn green.
  </text>
  <text x="50" y="310" class="content">
    洒水系统让草坪保持绿色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sprinkler -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Water drops -->
    <circle cx="50" cy="50" r="5" class="image" fill="#16A085" />
    <circle cx="150" cy="50" r="5" class="image" fill="#16A085" />
    <circle cx="50" cy="150" r="5" class="image" fill="#16A085" />
    <circle cx="150" cy="150" r="5" class="image" fill="#16A085" />
  </g>
</svg>