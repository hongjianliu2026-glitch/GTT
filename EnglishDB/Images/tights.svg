<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tights</text>
  <text x="50" y="120" class="subtitle">[taɪts] n. 紧身裤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tight (紧的) + -s (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舞者在舞台上，穿着"紧贴(tight)"身体的紧身裤(tights)，
    <tspan x="50" dy="25">展现出优美的舞姿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore tights for her ballet performance.
  </text>
  <text x="50" y="310" class="content">
    她为芭蕾表演穿上了紧身裤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Legs -->
    <line x1="50" y1="100" x2="50" y2="200" class="image" />
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <!-- Tights -->
    <rect x="40" y="100" width="20" height="100" class="image" />
    <rect x="140" y="100" width="20" height="100" class="image" />
    <!-- Feet -->
    <circle cx="50" cy="210" r="10" class="image" />
    <circle cx="150" cy="210" r="10" class="image" />
  </g>
</svg>