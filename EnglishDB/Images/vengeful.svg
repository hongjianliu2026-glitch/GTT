<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vengeful</text>
  <text x="50" y="120" class="subtitle">[ˈvɛndʒfəl] adj. 报复性的，怀恨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> venge (报复) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满愤怒的人，心中"充满报复(venge-ful)"的火焰，
    <tspan x="50" dy="25">时刻准备着对伤害他的人进行报复。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was vengeful after being betrayed by his friend.
  </text>
  <text x="50" y="310" class="content">
    他被朋友背叛后变得怀恨在心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <line x1="100" y1="140" x2="100" y2="140" class="image" />
    <!-- Flame -->
    <polygon points="150,50 180,100 120,100" class="image" />
    <polygon points="150,70 170,120 130,120" class="image" />
    <polygon points="150,90 160,140 140,140" class="image" />
  </g>
</svg>