<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">president</text>
  <text x="50" y="120" class="subtitle">[ˈprɛzɪdənt] n. 总统，总裁，校长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + sid (坐) + -ent (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"坐在前面(pre-sid-ent)"的人，
    <tspan x="50" dy="25">他坐在高高的椅子上，象征着领导地位，</tspan>
    <tspan x="50" dy="25">这个人就是总统(president)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The president delivered a speech at the ceremony.
  </text>
  <text x="50" y="310" class="content">
    总统在典礼上发表了演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="50" y="20" width="200" height="150" class="image" />
    <rect x="100" y="170" width="100" height="50" class="image" />
    <!-- Person sitting -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
  </g>
</svg>