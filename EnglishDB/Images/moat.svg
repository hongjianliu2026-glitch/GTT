<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moat</text>
  <text x="50" y="120" class="subtitle">[moʊt] n. 护城河</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mot (移动) + -at (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座城堡周围有一条宽阔的"移动(mot)"水道，
    <tspan x="50" dy="25">这条水道就是护城河(moat)，保护城堡不受敌人侵袭。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The castle was surrounded by a deep moat.
  </text>
  <text x="50" y="310" class="content">
    城堡被一条深深的护城河环绕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="50" y="20" width="200" height="150" class="image" />
    <!-- Moat -->
    <rect x="0" y="170" width="300" height="30" class="image" />
    <!-- Water waves -->
    <line x1="10" y1="185" x2="30" y2="185" class="image" />
    <line x1="20" y1="180" x2="20" y2="190" class="image" />
    <line x1="40" y1="185" x2="60" y2="185" class="image" />
    <line x1="50" y1="180" x2="50" y2="190" class="image" />
    <line x1="70" y1="185" x2="90" y2="185" class="image" />
    <line x1="80" y1="180" x2="80" y2="190" class="image" />
  </g>
</svg>