<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bulk</text>
  <text x="50" y="120" class="subtitle">[bʌlk] n. 体积，大批；v. 显得大，堆积</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bul (膨胀) + -k (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球在膨胀，"膨胀(bul)"
    <tspan x="50" dy="25">成一个巨大的体积(bulk)，占据了整个房间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bulk of the cargo was shipped by sea.
  </text>
  <text x="50" y="310" class="content">
    大部分货物是通过海运的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Room -->
    <rect x="0" y="180" width="350" height="100" class="image" />
    <!-- Floor -->
    <line x1="0" y1="280" x2="350" y2="280" class="image" />
    <!-- Walls -->
    <line x1="0" y1="180" x2="0" y2="280" class="image" />
    <line x1="350" y1="180" x2="350" y2="280" class="image" />
  </g>
</svg>