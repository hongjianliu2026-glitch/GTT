<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orgy</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrdʒi] n. 狂欢，放荡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> org- (能量，活动) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一个房间里，"释放能量(org-)"
    <tspan x="50" dy="25">进行各种放纵的活动，这就是一场狂欢(orgy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The party turned into an orgy after midnight.
  </text>
  <text x="50" y="310" class="content">
    午夜过后，派对变成了狂欢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Room -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People -->
    <circle cx="80" cy="60" r="15" class="image" />
    <circle cx="120" cy="60" r="15" class="image" />
    <circle cx="160" cy="60" r="15" class="image" />
    <circle cx="200" cy="60" r="15" class="image" />
    <circle cx="240" cy="60" r="15" class="image" />
    <!-- Dancing -->
    <line x1="80" y1="80" x2="120" y2="100" class="image" />
    <line x1="120" y1="80" x2="80" y2="100" class="image" />
    <line x1="160" y1="80" x2="200" y2="100" class="image" />
    <line x1="200" y1="80" x2="160" y2="100" class="image" />
    <line x1="240" y1="80" x2="280" y2="100" class="image" />
    <line x1="280" y1="80" x2="240" y2="100" class="image" />
  </g>
</svg>