<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stocky</text>
  <text x="50" y="120" class="subtitle">[ˈstɒki] adj. 矮壮的，结实的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stock (树桩) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个矮壮的人，像"树桩(stock)"一样结实，
    <tspan x="50" dy="25">稳稳地站在地上，给人一种坚固的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a stocky man with broad shoulders.
  </text>
  <text x="50" y="310" class="content">
    他是一个肩膀宽阔的矮壮男人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree stump -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <!-- Stocky man -->
    <circle cx="50" cy="150" r="30" class="image" />
    <line x1="50" y1="180" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="20" y2="300" class="image" />
    <line x1="50" y1="250" x2="80" y2="300" class="image" />
    <line x1="50" y1="200" x2="20" y2="220" class="image" />
    <line x1="50" y1="200" x2="80" y2="220" class="image" />
  </g>
</svg>