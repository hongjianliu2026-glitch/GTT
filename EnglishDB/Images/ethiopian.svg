<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Ethiopian</text>
  <text x="50" y="120" class="subtitle">[ˌiːθiˈoʊpiən] adj. 埃塞俄比亚的；n. 埃塞俄比亚人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Ethio- (埃塞俄比亚) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着传统服饰的埃塞俄比亚人，站在壮丽的非洲大地上，
    <tspan x="50" dy="25">背景是雄伟的火山和广袤的草原，这就是"埃塞俄比亚的(Ethiopian)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Ethiopian coffee ceremony is a cultural highlight.
  </text>
  <text x="50" y="310" class="content">
    埃塞俄比亚的咖啡仪式是文化中的亮点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- African landscape -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Volcano -->
    <polygon points="175,20 150,100 200,100" class="image" />
    <!-- Grassland -->
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <line x1="0" y1="190" x2="350" y2="190" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <!-- Ethiopian person -->
    <circle cx="100" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="145" x2="130" y2="135" class="image" />
  </g>
</svg>