<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incense</text>
  <text x="50" y="120" class="subtitle">[ˈɪnsens] n. 香，熏香；v. 激怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + cense (燃烧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一缕香烟"进入(in)"空气中，"燃烧(cense)"
    <tspan x="50" dy="25">的香气让人心旷神怡，但如果燃烧得太猛烈，</tspan>
    <tspan x="50" dy="25">可能会"激怒(incense)"周围的人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smell of incense filled the temple.
  </text>
  <text x="50" y="310" class="content">
    寺庙里充满了熏香的气味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Incense burner -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <!-- Smoke -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="50" y1="150" x2="40" y2="200" class="image" />
    <line x1="50" y1="150" x2="60" y2="200" class="image" />
    <!-- Angry face -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="185" y1="110" x2="215" y2="110" class="image" />
    <line x1="185" y1="130" x2="215" y2="130" class="image" />
    <line x1="190" y1="140" x2="210" y2="140" class="image" />
    <line x1="190" y1="140" x2="185" y2="135" class="image" />
    <line x1="210" y1="140" x2="215" y2="135" class="image" />
  </g>
</svg>