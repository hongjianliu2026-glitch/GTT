<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hospitality</text>
  <text x="50" y="120" class="subtitle">[ˌhɒspɪˈtæləti] n. 好客，款待</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hospit (客人) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热情的主人，"接待(hospit)"
    <tspan x="50" dy="25">客人时，展现出无比的友好和慷慨，这就是好客(hospitality)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hotel is known for its exceptional hospitality.
  </text>
  <text x="50" y="310" class="content">
    这家酒店以其卓越的好客之道而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Windows -->
    <rect x="50" y="50" width="50" height="50" class="image" />
    <rect x="250" y="50" width="50" height="50" class="image" />
    <!-- Host and Guest -->
    <circle cx="100" cy="150" r="15" class="image" /> <!-- Host -->
    <circle cx="200" cy="150" r="15" class="image" /> <!-- Guest -->
    <line x1="100" y1="165" x2="200" y2="165" class="image" /> <!-- Handshake -->
  </g>
</svg>