<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">microphone</text>
  <text x="50" y="120" class="subtitle">[ˈmaɪkrəfoʊn] n. 麦克风</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> micro- (小) + phone (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小小的麦克风(micro-phone)，
    <tspan x="50" dy="25">它能够捕捉到微小的声音，并将其放大。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spoke into the microphone at the conference.
  </text>
  <text x="50" y="310" class="content">
    他在会议上对着麦克风讲话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microphone -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="25" y="20" width="50" height="160" class="image" />
    <circle cx="50" cy="180" r="20" class="image" />
    <!-- Sound waves -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="40" y1="210" x2="60" y2="240" class="image" />
    <line x1="30" y1="220" x2="70" y2="230" class="image" />
    <line x1="20" y1="230" x2="80" y2="220" class="image" />
  </g>
</svg>