<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marinate</text>
  <text x="50" y="120" class="subtitle">[ˈmærəˌneɪt] v. 腌泡，浸泡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar (海) + in (在...里面) + ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块肉被"浸泡在海水中(mar-in-ate)"，
    <tspan x="50" dy="25">吸收了海水的咸味，变得美味可口。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Marinate the chicken in soy sauce for an hour before cooking.
  </text>
  <text x="50" y="310" class="content">
    烹饪前将鸡肉在酱油中腌泡一小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Meat -->
    <rect x="75" y="50" width="200" height="100" class="image" />
    <!-- Sea -->
    <ellipse cx="175" cy="150" rx="150" ry="50" class="image" />
    <!-- Sea waves -->
    <line x1="25" y1="150" x2="325" y2="150" class="image" />
    <line x1="25" y1="140" x2="325" y2="140" class="image" />
    <line x1="25" y1="160" x2="325" y2="160" class="image" />
  </g>
</svg>