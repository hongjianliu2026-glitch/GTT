<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stem</text>
  <text x="50" y="120" class="subtitle">[stɛm] n. 茎，干；v. 起源于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + -em (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树，"站立(st-)"在地面上，
    <tspan x="50" dy="25">它的主干(stem)支撑着整个树冠。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stem of the rose is covered with thorns.
  </text>
  <text x="50" y="310" class="content">
    玫瑰的茎上布满了刺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="50" y1="20" x2="20" y2="60" class="image" />
    <line x1="50" y1="20" x2="80" y2="60" class="image" />
    <line x1="50" y1="60" x2="20" y2="100" class="image" />
    <line x1="50" y1="60" x2="80" y2="100" class="image" />
    <line x1="50" y1="100" x2="20" y2="140" class="image" />
    <line x1="50" y1="100" x2="80" y2="140" class="image" />
    <!-- Leaves -->
    <circle cx="20" cy="60" r="10" class="image" />
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="20" cy="100" r="10" class="image" />
    <circle cx="80" cy="100" r="10" class="image" />
    <circle cx="20" cy="140" r="10" class="image" />
    <circle cx="80" cy="140" r="10" class="image" />
  </g>
</svg>