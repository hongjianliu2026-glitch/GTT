<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">judgment</text>
  <text x="50" y="120" class="subtitle">[ˈdʒʌdʒmənt] n. 判断，判决</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> judic (判断) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官坐在高高的椅子上，手持法槌，
    <tspan x="50" dy="25">"判断(judic)"</tspan>
    <tspan x="50" dy="25">案件的是非曲直，这就是"判决(judgment)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The court's judgment was in favor of the plaintiff.
  </text>
  <text x="50" y="310" class="content">
    法庭的判决有利于原告。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge's chair -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="150" y="20" width="50" height="160" class="image" />
    <!-- Judge -->
    <circle cx="175" cy="60" r="20" class="image" />
    <line x1="175" y1="80" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="150" y2="150" class="image" />
    <line x1="175" y1="120" x2="200" y2="150" class="image" />
    <line x1="175" y1="100" x2="220" y2="90" class="image" />
    <!-- Gavel -->
    <rect x="165" y="40" width="20" height="10" class="image" />
    <line x1="175" y1="40" x2="175" y2="30" class="image" />
  </g>
</svg>