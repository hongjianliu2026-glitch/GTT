<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">awkwardly</text>
  <text x="50" y="120" class="subtitle">[ˈɔːkwərdli] adv. 笨拙地，尴尬地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> awk (笨拙) + ward (方向) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在舞会上，"笨拙地(awkwardly)"
    <tspan x="50" dy="25">踩到了自己的脚，尴尬地四处张望(ward)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He walked awkwardly across the room, trying not to trip.
  </text>
  <text x="50" y="310" class="content">
    他笨拙地走过房间，尽量不让自己摔倒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Foot -->
    <rect x="30" y="200" width="40" height="10" class="image" />
    <!-- Dance floor -->
    <rect x="0" y="220" width="150" height="50" class="image" />
    <!-- Dance partner -->
    <circle cx="120" cy="100" r="20" class="image" />
    <line x1="120" y1="120" x2="120" y2="160" class="image" />
    <line x1="120" y1="160" x2="100" y2="200" class="image" />
    <line x1="120" y1="160" x2="140" y2="200" class="image" />
    <line x1="120" y1="140" x2="150" y2="130" class="image" />
    <!-- Foot -->
    <rect x="100" y="200" width="40" height="10" class="image" />
  </g>
</svg>