<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">regalia</text>
  <text x="50" y="120" class="subtitle">[rɪˈɡeɪliə] n. 徽章，礼服，盛装</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (强调) + gal (装饰) + ia (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位国王穿着"强调装饰(re-gal-ia)"的华丽礼服，
    <tspan x="50" dy="25">头戴王冠，手持权杖，这就是他的盛装(regalia)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coronation ceremony featured the royal regalia.
  </text>
  <text x="50" y="310" class="content">
    加冕典礼上展示了皇室的盛装。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <polygon points="100,20 150,100 50,100" class="image" />
    <!-- Robe -->
    <rect x="50" y="100" width="100" height="150" class="image" />
    <!-- Scepter -->
    <line x1="100" y1="250" x2="100" y2="400" class="image" />
    <circle cx="100" cy="240" r="10" class="image" />
  </g>
</svg>