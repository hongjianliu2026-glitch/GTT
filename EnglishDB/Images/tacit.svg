<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tacit</text>
  <text x="50" y="120" class="subtitle">[ˈtæsɪt] adj. 不言而喻的，心照不宣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tac- (安静) + -it (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在咖啡馆里，虽然"安静(tac-)"地坐着，
    <tspan x="50" dy="25">但他们之间的默契(tacit)已经不言而喻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Their agreement was tacit, not written down.
  </text>
  <text x="50" y="310" class="content">
    他们的协议是心照不宣的，没有写下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Coffee shop -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Two people -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Thought bubbles -->
    <ellipse cx="100" cy="50" rx="30" ry="20" class="image" />
    <ellipse cx="250" cy="50" rx="30" ry="20" class="image" />
    <!-- Silence symbol -->
    <line x1="175" y1="120" x2="175" y2="150" class="image" />
    <line x1="165" y1="140" x2="185" y2="140" class="image" />
  </g>
</svg>