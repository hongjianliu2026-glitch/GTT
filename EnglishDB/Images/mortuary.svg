<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E9E2; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #6D4C41; }
      .content { font: 18px sans-serif; fill: #5D4037; }
      .highlight { font-weight: bold; fill: #B71C1C; }
      .story { font: 16px serif; fill: #4E342E; }
      .image { stroke: #795548; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mortuary</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrtʃəri] n. 太平间，停尸房</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mort- (死亡) + -uary (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阴森的房间，"死亡(mort-)"
    <tspan x="50" dy="25">的气息弥漫，这里就是停尸房(mortuary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The body was taken to the mortuary for an autopsy.
  </text>
  <text x="50" y="310" class="content">
    尸体被送到太平间进行尸检。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mortuary building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Cross symbol -->
    <line x1="175" y1="50" x2="175" y2="80" class="image" />
    <line x1="160" y1="65" x2="190" y2="65" class="image" />
    <!-- Dead body -->
    <rect x="50" y="120" width="100" height="50" class="image" />
    <!-- Head -->
    <circle cx="100" cy="110" r="10" class="image" />
    <!-- Feet -->
    <line x1="50" y1="170" x2="150" y2="170" class="image" />
  </g>
</svg>