<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">juror</text>
  <text x="50" y="120" class="subtitle">[ˈdʒʊərər] n. 陪审员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jur- (法律) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法庭上，"法律之人(jur-or)"
    <tspan x="50" dy="25">坐在陪审席上，认真听取案件，这就是陪审员(juror)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The juror was asked to leave the courtroom during the recess.
  </text>
  <text x="50" y="310" class="content">
    陪审员在休庭期间被要求离开法庭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Juror's seat -->
    <rect x="100" y="90" width="150" height="80" class="image" />
    <!-- Juror -->
    <circle cx="175" cy="130" r="15" class="image" />
    <line x1="175" y1="145" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="160" y2="200" class="image" />
    <line x1="175" y1="180" x2="190" y2="200" class="image" />
    <line x1="175" y1="160" x2="200" y2="150" class="image" />
  </g>
</svg>