<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overpower</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈpaʊər] v. 压倒，制服</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + power (力量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨人站在一个小人上面，"用巨大的力量(over-power)"
    <tspan x="50" dy="25">压倒(overpower)了小人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm overpowered the small boat.
  </text>
  <text x="50" y="310" class="content">
    风暴压倒了小船。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="180" class="image" />
    <line x1="100" y1="200" x2="150" y2="180" class="image" />

    <!-- Small person -->
    <circle cx="300" cy="200" r="20" class="image" />
    <line x1="300" y1="220" x2="300" y2="260" class="image" />
    <line x1="300" y1="260" x2="280" y2="280" class="image" />
    <line x1="300" y1="260" x2="320" y2="280" class="image" />
    <line x1="300" y1="240" x2="280" y2="230" class="image" />
    <line x1="300" y1="240" x2="320" y2="230" class="image" />

    <!-- Arrow -->
    <line x1="150" y1="150" x2="280" y2="200" class="image" />
    <polygon points="280,200 270,190 270,210" class="image" />
  </g>
</svg>