<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anatomy</text>
  <text x="50" y="120" class="subtitle">[əˈnætəmi] n. 解剖学，人体结构</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ana- (向上) + tomy (切)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在手术台上，"向上切开(ana-tomy)"
    <tspan x="50" dy="25">人体，研究其内部结构，这就是解剖学(anatomy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The anatomy class was both fascinating and challenging.
  </text>
  <text x="50" y="310" class="content">
    解剖学课程既有趣又具挑战性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Operating table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Human body -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <!-- Surgeon -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="150" y2="170" class="image" />
    <!-- Scalpel -->
    <line x1="150" y1="170" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="220" y2="140" class="image" />
  </g>
</svg>