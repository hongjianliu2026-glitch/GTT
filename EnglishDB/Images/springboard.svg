<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">springboard</text>
  <text x="50" y="120" class="subtitle">[ˈsprɪŋbɔːrd] n. 跳板，出发点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spring (跳跃) + board (板)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员站在跳板上，"跳跃(spring)"
    <tspan x="50" dy="25">准备起飞，这个跳板就是他的出发点(springboard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The internship served as a springboard for his career.
  </text>
  <text x="50" y="310" class="content">
    实习成为他职业生涯的跳板。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Springboard -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Athlete -->
    <circle cx="20" cy="30" r="15" class="image" />
    <line x1="20" y1="45" x2="20" y2="80" class="image" />
    <line x1="20" y1="60" x2="0" y2="90" class="image" />
    <line x1="20" y1="60" x2="40" y2="90" class="image" />
    <line x1="20" y1="70" x2="50" y2="60" class="image" />
  </g>
</svg>