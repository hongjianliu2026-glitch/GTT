<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Armenian</text>
  <text x="50" y="120" class="subtitle">[ɑːrˈmiːniən] adj. 亚美尼亚的；n. 亚美尼亚人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Armen (亚美尼亚) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个身穿传统服饰的亚美尼亚人，站在亚美尼亚的标志性建筑前，
    <tspan x="50" dy="25">这个画面让人立刻联想到亚美尼亚的文化和历史。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Armenian church is one of the oldest in the world.
  </text>
  <text x="50" y="310" class="content">
    亚美尼亚教堂是世界上最古老的教堂之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional Armenian clothing -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="50" x2="130" y2="50" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <line x1="20" y1="110" x2="130" y2="110" class="image" />
    <line x1="20" y1="140" x2="130" y2="140" class="image" />
    <line x1="20" y1="170" x2="130" y2="170" class="image" />
    <!-- Armenian church -->
    <rect x="170" y="0" width="200" height="200" class="image" />
    <line x1="190" y1="20" x2="350" y2="20" class="image" />
    <line x1="190" y1="50" x2="350" y2="50" class="image" />
    <line x1="190" y1="80" x2="350" y2="80" class="image" />
    <line x1="190" y1="110" x2="350" y2="110" class="image" />
    <line x1="190" y1="140" x2="350" y2="140" class="image" />
    <line x1="190" y1="170" x2="350" y2="170" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
  </g>
</svg>