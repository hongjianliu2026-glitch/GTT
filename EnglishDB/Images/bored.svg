<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bored</text>
  <text x="50" y="120" class="subtitle">[bɔːrd] adj. 无聊的，厌烦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bor- (来自古英语 "borian"，意为“忍受”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在椅子上，"忍受(bor-)"着无聊的会议，
    <tspan x="50" dy="25">他的眼睛无神，表情呆滞，这就是"无聊的(bored)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt bored during the long lecture.
  </text>
  <text x="50" y="310" class="content">
    她在漫长的讲座中感到无聊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Person sitting -->
    <circle cx="75" cy="50" r="20" class="image" />
    <line x1="75" y1="70" x2="75" y2="100" class="image" />
    <line x1="75" y1="100" x2="50" y2="130" class="image" />
    <line x1="75" y1="100" x2="100" y2="130" class="image" />
    <!-- Bored expression -->
    <line x1="60" y1="45" x2="70" y2="45" class="image" />
    <line x1="80" y1="45" x2="90" y2="45" class="image" />
    <line x1="65" y1="55" x2="85" y2="55" class="image" />
  </g>
</svg>