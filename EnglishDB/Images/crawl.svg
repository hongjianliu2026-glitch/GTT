<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crawl</text>
  <text x="50" y="120" class="subtitle">[krɔːl] v. 爬行，缓慢移动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crawl (源自中古英语 crawlen，意为爬行)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小虫子在地板上"爬行(crawl)"，
    <tspan x="50" dy="25">它的每一步都显得非常缓慢，仿佛时间都变慢了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby crawled across the room to reach the toy.
  </text>
  <text x="50" y="310" class="content">
    宝宝爬过房间去拿玩具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Crawling insect -->
    <circle cx="50" cy="100" r="10" class="image" />
    <line x1="50" y1="110" x2="50" y2="130" class="image" />
    <line x1="50" y1="130" x2="40" y2="150" class="image" />
    <line x1="50" y1="130" x2="60" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="110" class="image" />
  </g>
</svg>