<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">graze</text>
  <text x="50" y="120" class="subtitle">[ɡreɪz] v. 吃草，擦伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> graz (吃草)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只羊在草地上"吃草(graze)"，
    <tspan x="50" dy="25">它的嘴巴轻轻地擦过草地，这就是graze的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cows were grazing in the field.
  </text>
  <text x="50" y="310" class="content">
    牛群在田野里吃草。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#27AE60" />
    <!-- Sheep -->
    <circle cx="100" cy="120" r="30" class="image" fill="#F1C40F" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="170" x2="70" y2="160" class="image" />
    <line x1="100" y1="170" x2="130" y2="160" class="image" />
    <!-- Mouth grazing grass -->
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <line x1="100" y1="130" x2="100" y2="140" class="image" />
  </g>
</svg>