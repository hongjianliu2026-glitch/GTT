<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unkempt</text>
  <text x="50" y="120" class="subtitle">[ʌnˈkempt] adj. 不整洁的，蓬乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + kempt (梳理)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人，头发"没有梳理(un-kempt)"，
    <tspan x="50" dy="25">乱糟糟的，就像被风吹乱的草地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His unkempt hair made him look disheveled.
  </text>
  <text x="50" y="310" class="content">
    他蓬乱的头发让他看起来很邋遢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Hair -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="40" y1="60" x2="160" y2="60" class="image" />
    <line x1="30" y1="70" x2="170" y2="70" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="10" y1="90" x2="190" y2="90" class="image" />
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
    <line x1="10" y1="110" x2="190" y2="110" class="image" />
    <line x1="20" y1="120" x2="180" y2="120" class="image" />
    <line x1="30" y1="130" x2="170" y2="130" class="image" />
    <line x1="40" y1="140" x2="160" y2="140" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
  </g>
</svg>