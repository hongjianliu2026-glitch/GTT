<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tortoise</text>
  <text x="50" y="120" class="subtitle">[ˈtɔːrtəs] n. 乌龟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tor- (旋转) + -t- (连接字母) + -oise (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只乌龟在缓慢地旋转，"旋转(tor-)"
    <tspan x="50" dy="25">着它的壳，就像一个缓慢的陀螺，这就是乌龟(tortoise)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tortoise slowly crawled across the road.
  </text>
  <text x="50" y="310" class="content">
    乌龟慢慢地爬过了马路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tortoise shell -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Tortoise head -->
    <circle cx="100" cy="50" r="15" class="image" />
    <!-- Tortoise legs -->
    <line x1="60" y1="120" x2="40" y2="140" class="image" />
    <line x1="140" y1="120" x2="160" y2="140" class="image" />
    <line x1="60" y1="160" x2="40" y2="180" class="image" />
    <line x1="140" y1="160" x2="160" y2="180" class="image" />
    <!-- Tortoise tail -->
    <line x1="100" y1="160" x2="100" y2="180" class="image" />
  </g>
</svg>