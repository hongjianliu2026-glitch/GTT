<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elite</text>
  <text x="50" y="120" class="subtitle">[ɪˈliːt] n. 精英，杰出人物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + lit (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人中，"被选出(e-lit)"
    <tspan x="50" dy="25">的杰出人物，他们就是精英(elite)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is run by a group of elite managers.
  </text>
  <text x="50" y="310" class="content">
    这家公司由一群精英经理管理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <!-- Selected elite -->
    <circle cx="100" cy="150" r="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="220" x2="150" y2="200" class="image" />
    <line x1="100" y1="220" x2="50" y2="200" class="image" />
    <!-- Crown on elite -->
    <polygon points="85,130 115,130 100,100" class="image" />
  </g>
</svg>