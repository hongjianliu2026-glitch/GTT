<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">centrally</text>
  <text x="50" y="120" class="subtitle">[ˈsɛntrəli] adv. 中心地，中央地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> centr (中心) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的城市，所有的道路都汇聚到"中心(centr)"，
    <tspan x="50" dy="25">人们从四面八方"中心地(centrally)"来到这里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting was held centrally in the city hall.
  </text>
  <text x="50" y="310" class="content">
    会议在市政厅中心地举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Central point -->
    <circle cx="175" cy="100" r="20" class="image" fill="#E74C3C" />
    <!-- Roads -->
    <line x1="175" y1="100" x2="0" y2="100" class="image" />
    <line x1="175" y1="100" x2="350" y2="100" class="image" />
    <line x1="175" y1="100" x2="175" y2="0" class="image" />
    <line x1="175" y1="100" x2="175" y2="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="5" class="image" fill="#2980B9" />
    <circle cx="300" cy="100" r="5" class="image" fill="#2980B9" />
    <circle cx="175" cy="20" r="5" class="image" fill="#2980B9" />
    <circle cx="175" cy="180" r="5" class="image" fill="#2980B9" />
  </g>
</svg>