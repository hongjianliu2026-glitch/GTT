<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">notebook</text>
  <text x="50" y="120" class="subtitle">[ˈnoʊtbʊk] n. 笔记本</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> note (笔记) + book (书)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在课堂上，"记下(note)"
    <tspan x="50" dy="25">重要的知识点，这些笔记就构成了一个笔记本(notebook)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always carries a notebook to jot down ideas.
  </text>
  <text x="50" y="310" class="content">
    她总是带着笔记本记下想法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Notebook cover -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Notebook pages -->
    <rect x="10" y="10" width="280" height="180" class="image" />
    <!-- Pen -->
    <line x1="320" y1="100" x2="380" y2="100" class="image" />
    <line x1="380" y1="100" x2="370" y2="90" class="image" />
    <line x1="380" y1="100" x2="370" y2="110" class="image" />
  </g>
</svg>