<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">governmental</text>
  <text x="50" y="120" class="subtitle">[ˌɡʌvərnˈmɛntl] adj. 政府的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> govern (统治) + -ment (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的政府大楼，"统治(govern)"着整个城市，
    <tspan x="50" dy="25">大楼的每一层都代表着政府的不同部门，这就是政府的(governmental)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The governmental policies have a significant impact on the economy.
  </text>
  <text x="50" y="310" class="content">
    政府的政策对经济有重大影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Government building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="30" height="30" class="image" />
    <rect x="120" y="40" width="30" height="30" class="image" />
    <rect x="170" y="40" width="30" height="30" class="image" />
    <rect x="220" y="40" width="30" height="30" class="image" />
    <rect x="70" y="90" width="30" height="30" class="image" />
    <rect x="120" y="90" width="30" height="30" class="image" />
    <rect x="170" y="90" width="30" height="30" class="image" />
    <rect x="220" y="90" width="30" height="30" class="image" />
    <rect x="70" y="140" width="30" height="30" class="image" />
    <rect x="120" y="140" width="30" height="30" class="image" />
    <rect x="170" y="140" width="30" height="30" class="image" />
    <rect x="220" y="140" width="30" height="30" class="image" />
    <!-- Flag -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <rect x="175" y="0" width="50" height="20" class="image" />
  </g>
</svg>