<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">notable</text>
  <text x="50" y="120" class="subtitle">[ˈnoʊtəbl] adj. 显著的，值得注意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> not (标记) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的公告板上，"标记(not)"
    <tspan x="50" dy="25">着许多重要的事件，这些事件都是值得注意的(notable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His achievements are notable in the field of science.
  </text>
  <text x="50" y="310" class="content">
    他在科学领域的成就是显著的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Notice board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Notable events -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="150" r="15" class="image" />
    <!-- Pins -->
    <line x1="50" y1="50" x2="50" y2="60" class="image" />
    <line x1="100" y1="100" x2="100" y2="110" class="image" />
    <line x1="150" y1="150" x2="150" y2="160" class="image" />
    <line x1="200" y1="50" x2="200" y2="60" class="image" />
    <line x1="250" y1="100" x2="250" y2="110" class="image" />
    <line x1="300" y1="150" x2="300" y2="160" class="image" />
  </g>
</svg>