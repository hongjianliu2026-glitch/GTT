<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oscillate</text>
  <text x="50" y="120" class="subtitle">[ˈɒsɪleɪt] v. 振荡，摆动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oscill (摆动) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟摆，"摆动(oscill)"
    <tspan x="50" dy="25">在空中，来回不停，这就是振荡(oscillate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pendulum oscillates back and forth.
  </text>
  <text x="50" y="310" class="content">
    钟摆来回摆动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pendulum -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <circle cx="175" cy="20" r="10" class="image" />
    <rect x="165" y="20" width="20" height="180" class="image" />
    <circle cx="175" cy="200" r="20" class="image" />
    <!-- Swing motion -->
    <line x1="175" y1="20" x2="100" y2="100" class="image" />
    <line x1="175" y1="20" x2="250" y2="100" class="image" />
  </g>
</svg>