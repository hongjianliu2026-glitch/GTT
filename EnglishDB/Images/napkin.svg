<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">napkin</text>
  <text x="50" y="120" class="subtitle">[ˈnæp.kɪn] n. 餐巾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nap (布) + -kin (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小布片(nap-kin)，在餐桌上用来擦嘴，
    <tspan x="50" dy="25">这个小布片就是餐巾(napkin)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed a napkin on her lap before eating.
  </text>
  <text x="50" y="310" class="content">
    她在吃饭前把餐巾放在腿上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Napkin -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Folds -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="40" x2="180" y2="40" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <!-- Table -->
    <rect x="0" y="120" width="200" height="50" class="image" />
    <!-- Plate -->
    <circle cx="100" cy="145" r="25" class="image" />
  </g>
</svg>