<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">campaign</text>
  <text x="50" y="120" class="subtitle">[kæmˈpeɪn] n. 运动，战役；v. 参加运动，竞选</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> camp (田野) + -aign (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在广阔的田野(camp)上，
    <tspan x="50" dy="25">举着旗帜，高喊口号，进行一场声势浩大的运动(campaign)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She successfully campaigned for the new policy.
  </text>
  <text x="50" y="310" class="content">
    她成功地为新政策进行了宣传活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Banner -->
    <rect x="100" y="50" width="150" height="30" class="image" />
    <text x="110" y="70" class="content" fill="#FFFFFF">Campaign</text>
    <!-- Arms -->
    <line x1="50" y1="115" x2="30" y2="135" class="image" />
    <line x1="50" y1="115" x2="70" y2="135" class="image" />
    <line x1="100" y1="115" x2="80" y2="135" class="image" />
    <line x1="100" y1="115" x2="120" y2="135" class="image" />
    <line x1="150" y1="115" x2="130" y2="135" class="image" />
    <line x1="150" y1="115" x2="170" y2="135" class="image" />
    <line x1="200" y1="115" x2="180" y2="135" class="image" />
    <line x1="200" y1="115" x2="220" y2="135" class="image" />
    <line x1="250" y1="115" x2="230" y2="135" class="image" />
    <line x1="250" y1="115" x2="270" y2="135" class="image" />
  </g>
</svg>