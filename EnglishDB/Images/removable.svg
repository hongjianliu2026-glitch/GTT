<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">removable</text>
  <text x="50" y="120" class="subtitle">[rɪˈmuːvəbl] adj. 可移动的，可拆卸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + move (移动) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图，每块拼图都可以"再次移动(re-move)"，
    <tspan x="50" dy="25">因为它们都是可拆卸的(removable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The furniture in the room is all removable for easy cleaning.
  </text>
  <text x="50" y="310" class="content">
    房间里的家具都是可移动的，方便清洁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Arrows indicating movement -->
    <line x1="50" y1="110" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="180" class="image" />
    <line x1="50" y1="200" x2="70" y2="180" class="image" />
    <line x1="170" y1="110" x2="170" y2="200" class="image" />
    <line x1="170" y1="200" x2="150" y2="180" class="image" />
    <line x1="170" y1="200" x2="190" y2="180" class="image" />
  </g>
</svg>