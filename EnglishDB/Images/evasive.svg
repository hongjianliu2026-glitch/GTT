<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evasive</text>
  <text x="50" y="120" class="subtitle">[ɪˈveɪsɪv] adj. 逃避的，推诿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + vas (走) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对问题时，"走出(e-vas)"
    <tspan x="50" dy="25">去逃避，不愿正面回答，这就是evasive。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His evasive answers made it clear he was hiding something.
  </text>
  <text x="50" y="310" class="content">
    他含糊其辞的回答表明他有所隐瞒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person avoiding -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Question mark -->
    <text x="120" y="150" class="image" font-size="60">?</text>
    <!-- Arrow pointing away -->
    <line x1="50" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
  </g>
</svg>