<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">geyser</text>
  <text x="50" y="120" class="subtitle">[ˈɡaɪzər] n. 间歇泉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> geysir (冰岛语，意为“喷发”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的间歇泉，"喷发(geysir)"
    <tspan x="50" dy="25">出滚烫的水柱，直冲云霄，壮观无比。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The geyser erupted with a loud roar.
  </text>
  <text x="50" y="310" class="content">
    间歇泉伴随着巨大的轰鸣声喷发。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Geyser base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water column -->
    <line x1="175" y1="0" x2="175" y2="150" class="image" />
    <!-- Water droplets -->
    <circle cx="175" cy="150" r="10" class="image" />
    <circle cx="160" cy="130" r="8" class="image" />
    <circle cx="190" cy="130" r="8" class="image" />
    <circle cx="150" cy="110" r="6" class="image" />
    <circle cx="200" cy="110" r="6" class="image" />
    <!-- Steam -->
    <line x1="175" y1="0" x2="150" y2="20" class="image" />
    <line x1="175" y1="0" x2="200" y2="20" class="image" />
    <line x1="175" y1="0" x2="160" y2="40" class="image" />
    <line x1="175" y1="0" x2="190" y2="40" class="image" />
  </g>
</svg>