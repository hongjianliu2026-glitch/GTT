<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bewilderment</text>
  <text x="50" y="120" class="subtitle">[bɪˈwɪldərmənt] n. 困惑，迷惑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + wild (野生的) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"使(be-)"得像"野生的(wild)"动物一样迷失方向，
    <tspan x="50" dy="25">完全不知所措，这就是困惑(bewilderment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The complex instructions left me in a state of bewilderment.
  </text>
  <text x="50" y="310" class="content">
    复杂的指令让我感到困惑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with question marks -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Question marks -->
    <text x="30" y="80" class="image" font-size="40">?</text>
    <text x="70" y="80" class="image" font-size="40">?</text>
    <text x="50" y="110" class="image" font-size="40">?</text>
  </g>
</svg>