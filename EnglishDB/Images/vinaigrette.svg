<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vinaigrette</text>
  <text x="50" y="120" class="subtitle">[ˌvɪnəˈɡrɛt] n. 醋油沙司</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vin (葡萄酒) + aigre (酸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，用葡萄酒醋(vin-aigre)
    <tspan x="50" dy="25">和橄榄油混合，制作出美味的醋油沙司(vinaigrette)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a vinaigrette to drizzle over the salad.
  </text>
  <text x="50" y="310" class="content">
    她做了一份醋油沙司，淋在沙拉上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle of vinegar -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="20" class="image" />
    <!-- Olive oil -->
    <rect x="120" y="0" width="100" height="200" class="image" />
    <circle cx="170" cy="220" r="20" class="image" />
    <!-- Mixing bowl -->
    <circle cx="270" cy="100" r="50" class="image" />
    <!-- Chef -->
    <circle cx="300" cy="200" r="15" class="image" />
    <line x1="300" y1="215" x2="300" y2="250" class="image" />
    <line x1="300" y1="250" x2="280" y2="280" class="image" />
    <line x1="300" y1="250" x2="320" y2="280" class="image" />
    <line x1="300" y1="230" x2="350" y2="220" class="image" />
  </g>
</svg>