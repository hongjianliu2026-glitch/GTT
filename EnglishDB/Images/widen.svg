<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">widen</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪdən] v. 加宽，扩大</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wid (宽) + -en (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师挥动魔杖，"使(en)"
    <tspan x="50" dy="25">原本狭窄的道路"变宽(wid)"，</tspan>
    <tspan x="50" dy="25">瞬间变成了宽敞的大道。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to widen the road to reduce traffic congestion.
  </text>
  <text x="50" y="310" class="content">
    他们决定拓宽道路以减少交通拥堵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Narrow road -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <!-- Wide road -->
    <rect x="0" y="70" width="200" height="50" class="image" />
    <!-- Magician -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <line x1="250" y1="80" x2="280" y2="70" class="image" />
    <!-- Wand -->
    <line x1="250" y1="70" x2="200" y2="50" class="image" />
  </g>
</svg>