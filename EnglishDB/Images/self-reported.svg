<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-reported</text>
  <text x="50" y="120" class="subtitle">[ˌself rɪˈpɔːrtɪd] adj. 自我报告的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + report (报告) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"自己(self)"
    <tspan x="50" dy="25">对着镜子里的自己"报告(report)"自己的情况，</tspan>
    <tspan x="50" dy="25">这就是自我报告(self-reported)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The survey results were self-reported by the participants.
  </text>
  <text x="50" y="310" class="content">
    调查结果是由参与者自我报告的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="170" class="image" />
    <line x1="100" y1="150" x2="130" y2="170" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <!-- Mirror reflection -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="150" x2="220" y2="170" class="image" />
    <line x1="250" y1="150" x2="280" y2="170" class="image" />
    <line x1="250" y1="180" x2="230" y2="210" class="image" />
    <line x1="250" y1="180" x2="270" y2="210" class="image" />
    <!-- Speech bubble -->
    <path d="M150,50 Q200,20 250,50 Q200,80 150,50" class="image" />
    <text x="170" y="60" class="content">Report</text>
  </g>
</svg>