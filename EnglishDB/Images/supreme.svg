<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Supreme</text>
  <text x="50" y="120" class="subtitle">[suːˈpriːm] adj. 最高的，至上的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (在上面) + em (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国王站在高高的王座上，"在上面(super-)"
    <tspan x="50" dy="25">俯视着他的王国，他就是至高无上的(supreme)统治者。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Supreme Court made a historic decision.
  </text>
  <text x="50" y="310" class="content">
    最高法院做出了一个历史性的决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- King -->
    <circle cx="175" cy="80" r="30" class="image" />
    <line x1="175" y1="110" x2="175" y2="180" class="image" />
    <line x1="175" y1="140" x2="140" y2="120" class="image" />
    <line x1="175" y1="140" x2="210" y2="120" class="image" />
    <line x1="175" y1="180" x2="140" y2="200" class="image" />
    <line x1="175" y1="180" x2="210" y2="200" class="image" />
    <!-- Crown -->
    <polyline points="155,50 175,30 195,50" class="image" />
    <line x1="155" y1="50" x2="195" y2="50" class="image" />
  </g>
</svg>