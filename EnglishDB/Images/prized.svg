<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prized</text>
  <text x="50" y="120" class="subtitle">[praɪzd] adj. 珍贵的，宝贵的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pri- (价值) + -zed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宝箱，里面装满了"价值连城(pri-zed)"
    <tspan x="50" dy="25">的珠宝，每一件都闪闪发光，无比珍贵。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The painting was his most prized possession.
  </text>
  <text x="50" y="310" class="content">
    这幅画是他最珍贵的财产。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Jewels -->
    <circle cx="100" cy="100" r="20" class="image" fill="#FFD700" />
    <circle cx="150" cy="120" r="15" class="image" fill="#C0C0C0" />
    <circle cx="200" cy="80" r="25" class="image" fill="#A0522D" />
    <!-- Light reflection -->
    <line x1="90" y1="90" x2="110" y2="110" class="image" stroke-width="1" stroke="#FFFFFF" />
    <line x1="140" y1="110" x2="160" y2="130" class="image" stroke-width="1" stroke="#FFFFFF" />
    <line x1="190" y1="70" x2="210" y2="90" class="image" stroke-width="1" stroke="#FFFFFF" />
  </g>
</svg>