<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">doorbell</text>
  <text x="50" y="120" class="subtitle">[ˈdɔːrbel] n. 门铃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> door (门) + bell (铃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门铃(doorbell)挂在门上，每当有人按下，
    <tspan x="50" dy="25">铃声响彻整个街区，仿佛在宣告："有人来了！"</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She heard the doorbell ring and went to open the door.
  </text>
  <text x="50" y="310" class="content">
    她听到门铃响了，就去开门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Doorbell -->
    <circle cx="175" cy="100" r="20" class="image" />
    <!-- Bell -->
    <rect x="165" y="80" width="20" height="40" class="image" />
    <!-- Ringing effect -->
    <line x1="175" y1="120" x2="175" y2="150" class="image" />
    <line x1="160" y1="135" x2="190" y2="135" class="image" />
  </g>
</svg>