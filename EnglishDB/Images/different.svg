<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">different</text>
  <text x="50" y="120" class="subtitle">[ˈdɪfərənt] adj. 不同的，有区别的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dif- (分开) + fer (带来) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人，一个拿着苹果，一个拿着橙子，"分开带来(dif-fer)"
    <tspan x="50" dy="25">不同的水果，这就是不同的(different)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two solutions are quite different.
  </text>
  <text x="50" y="310" class="content">
    这两个解决方案有很大的不同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person 1 with apple -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <circle cx="100" cy="130" r="15" class="image" fill="#FF6347" />

    <!-- Person 2 with orange -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="290" y2="130" class="image" />
    <circle cx="300" cy="130" r="15" class="image" fill="#FFA500" />

    <!-- Arrow indicating difference -->
    <line x1="120" y1="130" x2="230" y2="130" class="image" />
    <polygon points="230,120 240,130 230,140" class="image" />
  </g>
</svg>