<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">no-brainer</text>
  <text x="50" y="120" class="subtitle">[ˈnoʊˌbreɪnər] n. 显而易见的选择，无需思考的事情</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> no- (没有) + brain (大脑) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面对一个简单到"不需要大脑(no-brainer)"
    <tspan x="50" dy="25">就能解决的问题，这种问题显然是显而易见的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Choosing between pizza and salad for dinner is a no-brainer.
  </text>
  <text x="50" y="310" class="content">
    晚餐选择披萨还是沙拉是显而易见的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Cross out the brain -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <!-- Question mark -->
    <text x="200" y="120" font-size="100" fill="#7F8C8D">?</text>
  </g>
</svg>