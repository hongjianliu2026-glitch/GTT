<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bemused</text>
  <text x="50" y="120" class="subtitle">[bɪˈmjuːzd] adj. 困惑的，茫然的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + muse (沉思)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"使(be-)"得"沉思(muse)"过度，
    <tspan x="50" dy="25">以至于他的表情变得困惑和茫然(bemused)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He looked bemused as he tried to understand the complex instructions.
  </text>
  <text x="50" y="310" class="content">
    他试图理解复杂的指令时，显得很困惑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Eyes -->
    <circle cx="35" cy="40" r="5" class="image" />
    <circle cx="65" cy="40" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 30 70 Q 50 80 70 70" class="image" />
    <!-- Thought bubble -->
    <path d="M 90 30 Q 120 10 150 30 T 210 30 Q 210 50 180 70 T 120 70 Q 90 50 90 30" class="image" />
    <!-- Question marks in thought bubble -->
    <text x="110" y="50" class="content">?</text>
    <text x="140" y="50" class="content">?</text>
    <text x="170" y="50" class="content">?</text>
  </g>
</svg>