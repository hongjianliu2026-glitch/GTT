<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfair</text>
  <text x="50" y="120" class="subtitle">[ʌnˈfɛər] adj. 不公平的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + fair (公平)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，一边是满满的金币，另一边是空空如也。
    <tspan x="50" dy="25">这就是"不公平(unfair)"的画面，一边重一边轻，完全失衡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's unfair that she got the promotion and I didn't.
  </text>
  <text x="50" y="310" class="content">
    她得到了晋升而我没有，这很不公平。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="20" y1="100" x2="80" y2="100" class="image" />
    <line x1="20" y1="100" x2="20" y2="180" class="image" />
    <line x1="80" y1="100" x2="80" y2="180" class="image" />
    <!-- Gold coins on one side -->
    <circle cx="30" cy="150" r="10" class="image" />
    <circle cx="40" cy="160" r="10" class="image" />
    <circle cx="50" cy="170" r="10" class="image" />
    <!-- Empty side -->
    <line x1="70" y1="100" x2="70" y2="180" class="image" />
  </g>
</svg>