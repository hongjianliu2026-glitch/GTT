<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flux</text>
  <text x="50" y="120" class="subtitle">[flʌks] n. 流动，变迁；v. 使熔化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flu (流动) + -x (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，水流不断"流动(flu)"，
    <tspan x="50" dy="25">象征着时间的变迁和事物的变化，这就是"flux"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flux of people in the city is increasing.
  </text>
  <text x="50" y="310" class="content">
    城市中人口的流动正在增加。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q100 50 200 100 T400 100" class="image" />
    <path d="M0 120 Q100 70 200 120 T400 120" class="image" />
    <path d="M0 140 Q100 90 200 140 T400 140" class="image" />
    <!-- Water drops -->
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="150" cy="120" r="5" class="image" />
    <circle cx="250" cy="140" r="5" class="image" />
    <circle cx="350" cy="100" r="5" class="image" />
  </g>
</svg>