<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prank</text>
  <text x="50" y="120" class="subtitle">[præŋk] n. 恶作剧，玩笑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prank (源自中古英语 prancke，意为“炫耀”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调皮的小孩在街上，"炫耀(prank)"
    <tspan x="50" dy="25">他的新恶作剧，把一只假蜘蛛放在朋友的书包里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He played a harmless prank on his sister.
  </text>
  <text x="50" y="310" class="content">
    他对妹妹开了一个无伤大雅的玩笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Child -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Spider -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="200" y2="140" class="image" />
    <line x1="200" y1="125" x2="180" y2="115" class="image" />
    <line x1="200" y1="125" x2="220" y2="115" class="image" />
    <line x1="200" y1="140" x2="180" y2="150" class="image" />
    <line x1="200" y1="140" x2="220" y2="150" class="image" />
  </g>
</svg>