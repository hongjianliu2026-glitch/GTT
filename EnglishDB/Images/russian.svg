<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Russian</text>
  <text x="50" y="120" class="subtitle">[ˈrʌʃən] adj. 俄罗斯的；n. 俄罗斯人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Russ (俄罗斯) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个身穿传统俄罗斯服装的人，站在莫斯科红场前，
    <tspan x="50" dy="25">周围是壮丽的圣巴西尔大教堂，这就是"俄罗斯的(Russian)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent Russian.
  </text>
  <text x="50" y="310" class="content">
    她俄语说得很流利。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional Russian clothing -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <line x1="30" y1="50" x2="130" y2="50" class="image" />
    <line x1="30" y1="80" x2="120" y2="80" class="image" />
    <line x1="30" y1="110" x2="130" y2="110" class="image" />
    <line x1="30" y1="140" x2="120" y2="140" class="image" />
    <!-- Person -->
    <circle cx="75" cy="220" r="15" class="image" />
    <line x1="75" y1="235" x2="75" y2="270" class="image" />
    <line x1="75" y1="270" x2="60" y2="300" class="image" />
    <line x1="75" y1="270" x2="90" y2="300" class="image" />
    <line x1="75" y1="250" x2="100" y2="240" class="image" />
    <!-- St. Basil's Cathedral -->
    <rect x="200" y="0" width="150" height="200" class="image" />
    <rect x="220" y="20" width="110" height="160" class="image" />
    <line x1="230" y1="50" x2="330" y2="50" class="image" />
    <line x1="230" y1="80" x2="320" y2="80" class="image" />
    <line x1="230" y1="110" x2="330" y2="110" class="image" />
    <line x1="230" y1="140" x2="320" y2="140" class="image" />
  </g>
</svg>