<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pacifist</text>
  <text x="50" y="120" class="subtitle">[ˈpæsɪfɪst] n. 和平主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pacif- (和平) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个和平主义者(pacifist)，他手持白鸽，
    <tspan x="50" dy="25">象征着和平(pacif-)，拒绝任何形式的暴力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pacifist refused to join the army.
  </text>
  <text x="50" y="310" class="content">
    这位和平主义者拒绝参军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Peace symbol -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="100" y1="100" x2="50" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <!-- Dove -->
    <path d="M 150 100 Q 200 50 250 100" class="image" />
    <path d="M 250 100 Q 200 150 150 100" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Pacifist -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>