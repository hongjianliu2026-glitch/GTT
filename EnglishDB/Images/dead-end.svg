<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dead-end</text>
  <text x="50" y="120" class="subtitle">[ˈdɛdˌɛnd] n. 死胡同，绝境</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dead (死) + end (尽头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车驶入一条"死(dead)"胡同，前方是"尽头(end)"，
    <tspan x="50" dy="25">无法继续前进，这就是"死胡同(dead-end)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project hit a dead-end when the funding was cut.
  </text>
  <text x="50" y="310" class="content">
    项目在资金被削减后陷入了绝境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="350" y1="100" x2="350" y2="200" class="image" />
    <!-- Car -->
    <rect x="300" y="80" width="40" height="20" class="image" />
    <circle cx="310" cy="100" r="5" class="image" />
    <circle cx="330" cy="100" r="5" class="image" />
    <!-- Dead end sign -->
    <rect x="350" y="100" width="20" height="100" class="image" />
    <text x="355" y="150" class="content" style="font-size: 20px;">X</text>
  </g>
</svg>