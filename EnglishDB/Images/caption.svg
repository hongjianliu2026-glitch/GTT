<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">caption</text>
  <text x="50" y="120" class="subtitle">[ˈkæpʃən] n. 标题，字幕；v. 加标题，加字幕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cap (头) + tion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个电影画面，"头(cap)"上方的文字就是"标题(caption)"，
    <tspan x="50" dy="25">它引导观众理解画面内容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The photo was captioned "A Moment of Joy."
  </text>
  <text x="50" y="310" class="content">
    这张照片的标题是“欢乐时刻”。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Movie screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Caption text -->
    <text x="50" y="50" class="content" style="font-size: 24px; fill: #E74C3C;">A Moment of Joy</text>
    <!-- Movie frame -->
    <rect x="50" y="80" width="250" height="100" class="image" />
    <!-- Happy face -->
    <circle cx="175" cy="130" r="20" class="image" />
    <line x1="165" y1="125" x2="170" y2="125" class="image" />
    <line x1="180" y1="125" x2="185" y2="125" class="image" />
    <line x1="170" y1="135" x2="180" y2="135" class="image" />
  </g>
</svg>