<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">horrendous</text>
  <text x="50" y="120" class="subtitle">[həˈrendəs] adj. 可怕的，极坏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> horr- (恐怖) + -endous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的怪物，"恐怖(horr-)"
    <tspan x="50" dy="25">到令人发指，这就是"可怕的(horrendous)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie had a horrendous ending.
  </text>
  <text x="50" y="310" class="content">
    这部电影的结局非常糟糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="150" class="image" />
    <line x1="100" y1="180" x2="150" y2="150" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="80" r="10" class="image" fill="#000" />
    <circle cx="120" cy="80" r="10" class="image" fill="#000" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" fill="none" stroke="#000" stroke-width="5" />
  </g>
</svg>