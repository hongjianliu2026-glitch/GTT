<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">destine</text>
  <text x="50" y="120" class="subtitle">[ˈdɛstɪn] v. 注定，预定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + stin (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在命运的十字路口，"向下站立(de-stin)"
    <tspan x="50" dy="25">在命运的安排下，注定要走向某个方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He felt that his career was destined to be in the arts.
  </text>
  <text x="50" y="310" class="content">
    他觉得自己的职业生涯注定会在艺术领域。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crossroads -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Arrow -->
    <line x1="175" y1="150" x2="250" y2="150" class="image" />
    <polygon points="250,150 240,145 240,155" class="image" />
  </g>
</svg>