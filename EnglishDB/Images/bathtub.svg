<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bathtub</text>
  <text x="50" y="120" class="subtitle">[ˈbæθtʌb] n. 浴缸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bath (洗澡) + tub (桶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的桶(tub)里装满了水，你可以在里面尽情地洗澡(bath)，
    <tspan x="50" dy="25">这就是一个浴缸(bathtub)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She filled the bathtub with warm water and bubbles.
  </text>
  <text x="50" y="310" class="content">
    她在浴缸里放满了温水和泡泡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bathtub -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Water -->
    <rect x="20" y="20" width="260" height="160" fill="#A5D6D9" />
    <!-- Bubbles -->
    <circle cx="50" cy="50" r="10" fill="#FFFFFF" />
    <circle cx="80" cy="70" r="10" fill="#FFFFFF" />
    <circle cx="110" cy="90" r="10" fill="#FFFFFF" />
    <circle cx="140" cy="110" r="10" fill="#FFFFFF" />
    <circle cx="170" cy="130" r="10" fill="#FFFFFF" />
    <circle cx="200" cy="150" r="10" fill="#FFFFFF" />
  </g>
</svg>