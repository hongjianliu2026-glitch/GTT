<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pitch</text>
  <text x="50" y="120" class="subtitle">[pɪtʃ] n. 投掷，音高；v. 投掷，搭帐篷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pit (投掷) + -ch (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棒球手在球场上，"投掷(pit)"
    <tspan x="50" dy="25">一个球，这个动作就是投掷(pitch)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pitcher threw a fastball with a high pitch.
  </text>
  <text x="50" y="310" class="content">
    投手投出了一个高音高的快球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baseball field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pitcher -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Ball -->
    <circle cx="100" cy="120" r="10" class="image" />
    <!-- Throwing motion -->
    <line x1="50" y1="150" x2="100" y2="120" class="image" />
  </g>
</svg>