<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">income</text>
  <text x="50" y="120" class="subtitle">[ˈɪnkʌm] n. 收入，收益</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + come (来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装满金币的袋子，"进入(in-)"
    <tspan x="50" dy="25">你的口袋，这些金币就是你的收入(income)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His income increased after getting a promotion.
  </text>
  <text x="50" y="310" class="content">
    他升职后收入增加了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bag -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Coins -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="80" cy="50" r="15" class="image" />
    <circle cx="110" cy="50" r="15" class="image" />
    <circle cx="140" cy="50" r="15" class="image" />
    <circle cx="170" cy="50" r="15" class="image" />
    <!-- Pocket -->
    <rect x="220" y="50" width="50" height="50" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="100" x2="220" y2="75" class="image" />
    <polygon points="220,75 210,65 210,85" class="image" />
  </g>
</svg>