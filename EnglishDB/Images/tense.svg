<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tense</text>
  <text x="50" y="120" class="subtitle">[tens] adj. 紧张的，拉紧的；v. 使紧张，拉紧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tens (拉紧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在拉紧(tens)一根橡皮筋，橡皮筋变得紧绷(tense)，
    <tspan x="50" dy="25">仿佛随时会断裂。这种紧张感就是tense的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The atmosphere in the room was tense as everyone waited for the results.
  </text>
  <text x="50" y="310" class="content">
    房间里的气氛紧张，大家都在等待结果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rubber band -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="300" y1="50" x2="250" y2="100" class="image" />
    <!-- Person pulling -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />
  </g>
</svg>