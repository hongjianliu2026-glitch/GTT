<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cartridge</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrtrɪdʒ] n. 弹药筒，墨盒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cart (车) + ridge (脊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆小车(cart)载着一排排的"脊梁(ridge)"，
    <tspan x="50" dy="25">这些脊梁其实是弹药筒(cartridge)，准备发射！</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He loaded the cartridge into the gun.
  </text>
  <text x="50" y="310" class="content">
    他把弹药筒装进了枪里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cartridge -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Cart -->
    <rect x="20" y="150" width="300" height="50" class="image" />
    <line x1="20" y1="150" x2="20" y2="200" class="image" />
    <line x1="320" y1="150" x2="320" y2="200" class="image" />
    <line x1="20" y1="200" x2="320" y2="200" class="image" />
    <!-- Cartridge on cart -->
    <rect x="50" y="160" width="50" height="30" class="image" />
    <rect x="120" y="160" width="50" height="30" class="image" />
    <rect x="190" y="160" width="50" height="30" class="image" />
    <rect x="260" y="160" width="50" height="30" class="image" />
  </g>
</svg>