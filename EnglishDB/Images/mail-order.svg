<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mail-order</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪlˌɔrdər] n. 邮购</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mail (邮件) + order (订购)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在家里，通过"邮件(mail)"
    <tspan x="50" dy="25">订购(order)商品，商品随后通过邮寄送达。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers to buy clothes through mail-order.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢通过邮购购买衣服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Envelope -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <polygon points="0,0 200,0 180,150 20,150" class="image" />
    <!-- Stamp -->
    <circle cx="160" cy="20" r="15" class="image" />
    <text x="150" y="30" class="content" fill="#E74C3C">邮</text>
    <!-- Person -->
    <circle cx="50" cy="200" r="20" class="image" />
    <line x1="50" y1="220" x2="50" y2="260" class="image" />
    <line x1="50" y1="260" x2="30" y2="300" class="image" />
    <line x1="50" y1="260" x2="70" y2="300" class="image" />
    <line x1="50" y1="240" x2="80" y2="230" class="image" />
    <!-- Box -->
    <rect x="100" y="180" width="100" height="80" class="image" />
    <line x1="120" y1="200" x2="180" y2="200" class="image" />
    <line x1="120" y1="220" x2="180" y2="220" class="image" />
    <line x1="120" y1="240" x2="180" y2="240" class="image" />
  </g>
</svg>