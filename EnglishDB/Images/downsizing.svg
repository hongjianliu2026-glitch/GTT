<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">downsizing</text>
  <text x="50" y="120" class="subtitle">[ˈdaʊnˌsaɪzɪŋ] n. 缩小规模，裁员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> down- (向下) + size (尺寸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个公司正在"缩小(down)"其"规模(size)"，
    <tspan x="50" dy="25">员工们一个个被裁掉，办公室变得越来越空旷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company announced a downsizing plan to cut costs.
  </text>
  <text x="50" y="310" class="content">
    公司宣布了一项裁员计划以削减成本。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Empty desks -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Employee leaving -->
    <line x1="50" y1="80" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="250" y2="80" class="image" />
    <line x1="250" y1="80" x2="300" y2="120" class="image" />
    <!-- Down arrow -->
    <polygon points="175,150 150,180 200,180" class="image" />
  </g>
</svg>