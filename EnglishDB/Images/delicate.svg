<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delicate</text>
  <text x="50" y="120" class="subtitle">[ˈdɛlɪkɪt] adj. 精致的，脆弱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + lic (诱惑) + ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个精致的玻璃花瓶，"诱惑(lic)"
    <tspan x="50" dy="25">人们去欣赏它的美丽，但同时也要小心，因为它非常脆弱(delicate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She handled the delicate vase with great care.
  </text>
  <text x="50" y="310" class="content">
    她非常小心地处理那个精致的玻璃花瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass vase -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <line x1="125" y1="50" x2="125" y2="150" class="image" />
    <line x1="225" y1="50" x2="225" y2="150" class="image" />
    <!-- Flowers -->
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="70" r="10" class="image" />
    <circle cx="200" cy="70" r="10" class="image" />
    <circle cx="250" cy="70" r="10" class="image" />
    <!-- Fragile warning -->
    <text x="150" y="180" class="content" fill="#E74C3C">Fragile</text>
  </g>
</svg>