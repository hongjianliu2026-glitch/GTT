<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lease</text>
  <text x="50" y="120" class="subtitle">[liːs] n. 租约，租契；v. 出租，租得</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lē- (拿) + -ā- (长) + -s (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着(lē-)一份长长的(-ā-)合同，这份合同就是租约(lease)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He signed a lease for the apartment.
  </text>
  <text x="50" y="310" class="content">
    他为这套公寓签了租约。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person holding a long contract -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <rect x="70" y="140" width="200" height="20" class="image" /> <!-- Contract -->
    <line x1="70" y1="150" x2="270" y2="150" class="image" /> <!-- Contract line -->
    <line x1="70" y1="160" x2="270" y2="160" class="image" /> <!-- Contract line -->
    <line x1="70" y1="170" x2="270" y2="170" class="image" /> <!-- Contract line -->
  </g>
</svg>