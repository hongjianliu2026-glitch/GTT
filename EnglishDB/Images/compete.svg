<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compete</text>
  <text x="50" y="120" class="subtitle">[kəmˈpiːt] v. 竞争，比赛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + pete (追求)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在赛跑，"共同追求(com-pete)"
    <tspan x="50" dy="25">同一个目标，这就是竞争(compete)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They competed fiercely for the championship.
  </text>
  <text x="50" y="310" class="content">
    他们为冠军激烈竞争。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Runners -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Finish line -->
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="310" y1="20" x2="310" y2="180" class="image" />
    <!-- Arrows -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <line x1="70" y1="100" x2="60" y2="90" class="image" />
    <line x1="70" y1="100" x2="60" y2="110" class="image" />
    <line x1="170" y1="100" x2="160" y2="90" class="image" />
    <line x1="170" y1="100" x2="160" y2="110" class="image" />
  </g>
</svg>