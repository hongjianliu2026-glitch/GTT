<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heavy-handed</text>
  <text x="50" y="120" class="subtitle">[ˈhɛviˈhændɪd] adj. 笨拙的，粗暴的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heavy (重的) + hand (手) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用"沉重的手(heavy-hand)"去拿一个
    <tspan x="50" dy="25">易碎的玻璃杯，结果杯子被捏碎了，这就是"笨拙的(heavy-handed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His heavy-handed approach to the problem only made things worse.
  </text>
  <text x="50" y="310" class="content">
    他对问题的粗暴处理方式只会让事情变得更糟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />

    <!-- Broken glass -->
    <polyline points="120,100 150,130 180,100" class="image" />
    <polyline points="120,130 150,160 180,130" class="image" />
    <polyline points="120,160 150,190 180,160" class="image" />
  </g>
</svg>