<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foyer</text>
  <text x="50" y="120" class="subtitle">[ˈfɔɪeɪ] n. 门厅，休息室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> foi (门) + yer (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门(foi)，后面是一个宽敞的休息室(yer)，
    <tspan x="50" dy="25">人们在这里等待、交流，这就是foyer。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The guests gathered in the foyer before the concert.
  </text>
  <text x="50" y="310" class="content">
    客人们在音乐会前聚集在门厅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="300" class="image" />
    <line x1="75" y1="0" x2="75" y2="300" class="image" />
    <!-- Foyer -->
    <rect x="160" y="0" width="350" height="300" class="image" />
    <!-- People -->
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <circle cx="350" cy="100" r="15" class="image" />
    <!-- Chairs -->
    <rect x="200" y="150" width="50" height="50" class="image" />
    <rect x="270" y="150" width="50" height="50" class="image" />
    <rect x="340" y="150" width="50" height="50" class="image" />
  </g>
</svg>