<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">solitude</text>
  <text x="50" y="120" class="subtitle">[ˈsɒlɪtjuːd] n. 孤独，独处</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soli- (单独) + -tude (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人独自站在山顶，"单独(soli-)"
    <tspan x="50" dy="25">享受着"状态(tude)"，这就是孤独(solitude)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found solace in solitude after the loss of her pet.
  </text>
  <text x="50" y="310" class="content">
    她在失去宠物后在孤独中找到了慰藉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <path d="M0,200 L200,0 L400,200 Z" class="image" />
    <!-- Person -->
    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="230" y2="170" class="image" />
  </g>
</svg>