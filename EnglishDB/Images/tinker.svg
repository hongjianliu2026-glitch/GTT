<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tinker</text>
  <text x="50" y="120" class="subtitle">[ˈtɪŋkər] v. 修补，胡乱摆弄；n. 修补匠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tink (叮当声) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个修补匠在敲打金属，发出"叮当(tink)"声，
    <tspan x="50" dy="25">他正在修补各种东西，这就是"修补匠(tinker)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spent the afternoon tinkering with his old radio.
  </text>
  <text x="50" y="310" class="content">
    他整个下午都在摆弄他的旧收音机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Anvil -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hammer -->
    <line x1="50" y1="20" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <!-- Metal piece -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <!-- Tinker -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>