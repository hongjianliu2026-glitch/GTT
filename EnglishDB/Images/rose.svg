<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flower { fill: #FF6F61; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rose</text>
  <text x="50" y="120" class="subtitle">[roʊz] n. 玫瑰，蔷薇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ros (玫瑰)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵美丽的玫瑰花，"玫瑰(ros)"
    <tspan x="50" dy="25">在阳光下绽放，散发出迷人的香气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received a bouquet of roses on her birthday.
  </text>
  <text x="50" y="310" class="content">
    她生日时收到了一束玫瑰花。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rose flower -->
    <circle cx="50" cy="50" r="40" class="flower" />
    <circle cx="80" cy="50" r="40" class="flower" />
    <circle cx="65" cy="20" r="40" class="flower" />
    <circle cx="50" cy="80" r="40" class="flower" />
    <circle cx="80" cy="80" r="40" class="flower" />
    <!-- Stem -->
    <line x1="65" y1="120" x2="65" y2="200" class="image" />
    <!-- Leaves -->
    <path d="M65,150 Q50,140 65,130 Q80,140 65,150" class="image" />
    <path d="M65,180 Q50,170 65,160 Q80,170 65,180" class="image" />
  </g>
</svg>