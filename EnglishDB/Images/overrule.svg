<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overrule</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈruːl] v. 否决，驳回</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + rule (规则)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官站在高处，"在规则之上(over-rule)"
    <tspan x="50" dy="25">否决了一个不合理的判决，这个动作就是overrule。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The higher court overruled the decision of the lower court.
  </text>
  <text x="50" y="310" class="content">
    上级法院否决了下级法院的判决。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Gavel -->
    <rect x="10" y="80" width="20" height="30" class="image" />
    <!-- Rule book -->
    <rect x="50" y="80" width="50" height="70" class="image" />
    <!-- Over rule -->
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <!-- Over rule line -->
    <line x1="50" y1="160" x2="100" y2="160" class="image" />
  </g>
</svg>