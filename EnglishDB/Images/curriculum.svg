<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">curriculum</text>
  <text x="50" y="120" class="subtitle">[kəˈrɪkjələm] n. 课程，全部课程</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cur (跑) + riculum (小东西)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在校园里"跑(cur)"来"跑(cur)"去，
    <tspan x="50" dy="25">手里拿着一本小册子(riculum)，上面列满了各种课程(curriculum)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The school offers a diverse curriculum.
  </text>
  <text x="50" y="310" class="content">
    这所学校提供多样化的课程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Student running -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />

    <!-- Curriculum booklet -->
    <rect x="120" y="80" width="100" height="140" class="image" />
    <line x1="130" y1="100" x2="210" y2="100" class="image" />
    <line x1="130" y1="120" x2="210" y2="120" class="image" />
    <line x1="130" y1="140" x2="210" y2="140" class="image" />
    <line x1="130" y1="160" x2="210" y2="160" class="image" />
    <line x1="130" y1="180" x2="210" y2="180" class="image" />
  </g>
</svg>