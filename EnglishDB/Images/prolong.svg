<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prolong</text>
  <text x="50" y="120" class="subtitle">[prəˈlɒŋ] v. 延长，拖延</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + long (长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一条长长的路上，"向前延长(pro-long)"
    <tspan x="50" dy="25">这条路，让它变得更长，这就是prolong的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to prolong their vacation by a week.
  </text>
  <text x="50" y="310" class="content">
    他们决定将假期延长一周。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Person -->
    <circle cx="50" cy="120" r="15" class="image" />
    <line x1="50" y1="135" x2="50" y2="170" class="image" />
    <line x1="50" y1="170" x2="30" y2="200" class="image" />
    <line x1="50" y1="170" x2="70" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Arrow extending the road -->
    <line x1="350" y1="120" x2="400" y2="120" class="image" />
    <polygon points="400,120 390,115 390,125" class="image" />
  </g>
</svg>