<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">semifinal</text>
  <text x="50" y="120" class="subtitle">[ˌsemɪˈfaɪnl] n. 半决赛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> semi- (半) + final (最终的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场激烈的足球比赛，"半场(semi-)"
    <tspan x="50" dy="25">的"最终(final)"对决，这就是半决赛(semifinal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team advanced to the semifinals after a hard-fought match.
  </text>
  <text x="50" y="310" class="content">
    经过一场艰苦的比赛，球队晋级了半决赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Football field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Goal posts -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Ball -->
    <circle cx="175" cy="100" r="15" class="image" />
    <!-- Players -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Semi-final banner -->
    <rect x="100" y="150" width="150" height="30" class="image" />
    <text x="120" y="170" class="content">Semi-Final</text>
  </g>
</svg>