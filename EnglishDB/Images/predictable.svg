<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">predictable</text>
  <text x="50" y="120" class="subtitle">[prɪˈdɪktəbl] adj. 可预言的，可预料的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + dict (说) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天气预报员站在屏幕前，"提前说出(pre-dict)"
    <tspan x="50" dy="25">明天的天气，结果每次都准确无误，这就是可预言的(predictable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His behavior is so predictable that we can guess what he will do next.
  </text>
  <text x="50" y="310" class="content">
    他的行为如此可预料，以至于我们可以猜到他接下来会做什么。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Weather forecast screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <text x="50" y="50" class="content" fill="#34495E">Weather Forecast</text>
    <text x="50" y="80" class="content" fill="#34495E">Sunny</text>
    <text x="50" y="110" class="content" fill="#34495E">25°C</text>
    <!-- Weather forecaster -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 50 50 Q 100 20 150 50 L 150 100 Q 100 130 50 100 Z" class="image" fill="#E8F6F3" />
    <text x="70" y="80" class="content" fill="#34495E">Sunny</text>
  </g>
</svg>