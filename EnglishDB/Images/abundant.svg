<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abundant</text>
  <text x="50" y="120" class="subtitle">[əˈbʌndənt] adj. 丰富的，大量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (加强) + und (波浪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片海洋，波浪(und)翻滚，"加强(ab-)"
    <tspan x="50" dy="25">着涌向岸边，象征着丰富的资源和大量的存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The region is abundant in natural resources.
  </text>
  <text x="50" y="310" class="content">
    该地区自然资源丰富。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean waves -->
    <path d="M0 0 C 50 50, 150 50, 200 0 S 300 -50, 350 0" class="image" />
    <path d="M0 50 C 50 100, 150 100, 200 50 S 300 0, 350 50" class="image" />
    <path d="M0 100 C 50 150, 150 150, 200 100 S 300 50, 350 100" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Fish -->
    <path d="M50 150 Q 100 100, 150 150 T 250 150" class="image" />
    <path d="M100 150 Q 150 100, 200 150 T 300 150" class="image" />
  </g>
</svg>