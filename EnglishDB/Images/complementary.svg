<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">complementary</text>
  <text x="50" y="120" class="subtitle">[ˌkɒmplɪˈment(ə)ri] adj. 补充的，互补的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + ple (填满) + ment (名词后缀) + ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两块拼图，一块是蓝色的天空，另一块是绿色的草地，
    <tspan x="50" dy="25">它们"一起填满(com-ple-ment)"了整个画面，完美地互补(complementary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The blue and green colors are complementary to each other.
  </text>
  <text x="50" y="310" class="content">
    蓝色和绿色相互补充。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <path d="M50 50 L150 50 L150 150 L50 150 Z" class="image" fill="#4CAF50" />
    <path d="M200 50 L300 50 L300 150 L200 150 Z" class="image" fill="#2196F3" />
    <!-- Connecting lines -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <!-- Text annotations -->
    <text x="100" y="200" class="content" text-anchor="middle">Blue Sky</text>
    <text x="250" y="200" class="content" text-anchor="middle">Green Grass</text>
  </g>
</svg>