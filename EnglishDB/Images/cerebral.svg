<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cerebral</text>
  <text x="50" y="120" class="subtitle">[ˈsɛrəbrəl] adj. 大脑的，理智的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cerebr (大脑) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的大脑悬浮在空中，"大脑(cerebr)"
    <tspan x="50" dy="25">控制着一切，这个画面让人联想到理智和智慧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His cerebral approach to problem-solving impressed everyone.
  </text>
  <text x="50" y="310" class="content">
    他用理智的方法解决问题，给大家留下了深刻印象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="image" />
    <!-- Brain folds -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="100" y1="50" x2="250" y2="150" class="image" />
    <line x1="150" y1="50" x2="200" y2="150" class="image" />
    <line x1="200" y1="50" x2="150" y2="150" class="image" />
    <line x1="250" y1="50" x2="100" y2="150" class="image" />
    <!-- Floating effect -->
    <line x1="175" y1="0" x2="175" y2="50" class="image" />
  </g>
</svg>