<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">widely</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪdli] adv. 广泛地，普遍地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wide (宽的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆圈，"宽广地(wide)"
    <tspan x="50" dy="25">覆盖了整个地球，这就是广泛(widely)的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news was widely reported in the media.
  </text>
  <text x="50" y="310" class="content">
    这条新闻在媒体上被广泛报道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wide circle -->
    <circle cx="200" cy="100" r="100" class="image" />
    <!-- Globe -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Landmasses -->
    <path d="M120,100 L180,60 L220,100 L180,140 Z" class="image" />
    <path d="M220,100 L260,60 L300,100 L260,140 Z" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
  </g>
</svg>