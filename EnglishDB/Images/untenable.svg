<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">untenable</text>
  <text x="50" y="120" class="subtitle">[ʌnˈtɛnəbl] adj. 站不住脚的，无法维持的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + ten (持有) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摇摇欲坠的塔，"无法持有(un-ten-able)"
    <tspan x="50" dy="25">在风中，随时可能倒塌，这就是站不住脚的(untenable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His argument was untenable and quickly dismissed.
  </text>
  <text x="50" y="310" class="content">
    他的论点站不住脚，很快就被驳回了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tower -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <rect x="40" y="40" width="20" height="120" class="image" />
    <!-- Wind -->
    <line x1="120" y1="20" x2="150" y2="50" class="image" />
    <line x1="120" y1="40" x2="150" y2="70" class="image" />
    <line x1="120" y1="60" x2="150" y2="90" class="image" />
    <line x1="120" y1="80" x2="150" y2="110" class="image" />
    <line x1="120" y1="100" x2="150" y2="130" class="image" />
    <line x1="120" y1="120" x2="150" y2="150" class="image" />
    <line x1="120" y1="140" x2="150" y2="170" class="image" />
    <line x1="120" y1="160" x2="150" y2="190" class="image" />
    <line x1="120" y1="180" x2="150" y2="210" class="image" />
  </g>
</svg>