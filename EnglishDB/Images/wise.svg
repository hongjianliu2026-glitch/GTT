<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wise</text>
  <text x="50" y="120" class="subtitle">[waɪz] adj. 聪明的，明智的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wis (知道)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个智者，他"知道(wis)"
    <tspan x="50" dy="25">一切，他的智慧(wise)让人敬仰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave a wise decision after careful consideration.
  </text>
  <text x="50" y="310" class="content">
    她在仔细考虑后做出了一个明智的决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Wise man -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Light bulb -->
    <circle cx="50" cy="20" r="15" class="image" />
    <line x1="50" y1="35" x2="50" y2="50" class="image" />
  </g>
</svg>