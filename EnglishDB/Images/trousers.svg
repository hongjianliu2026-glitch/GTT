<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trousers</text>
  <text x="50" y="120" class="subtitle">[ˈtraʊzəz] n. 裤子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trous (腿) + -ers (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着两条"腿(trous)"，每条腿上都有一条裤子(trousers)，
    <tspan x="50" dy="25">就像两条腿被裤子包裹着一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought a new pair of trousers for the party.
  </text>
  <text x="50" y="310" class="content">
    他为派对买了一条新裤子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trousers -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="200" y="0" width="150" height="200" class="image" />
    <!-- Legs -->
    <line x1="75" y1="200" x2="75" y2="300" class="image" />
    <line x1="275" y1="200" x2="275" y2="300" class="image" />
    <!-- Feet -->
    <circle cx="75" cy="310" r="10" class="image" />
    <circle cx="275" cy="310" r="10" class="image" />
  </g>
</svg>