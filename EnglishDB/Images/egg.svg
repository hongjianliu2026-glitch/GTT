<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9C4; }
      .title { font: bold 48px sans-serif; fill: #F44336; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">egg</text>
  <text x="50" y="120" class="subtitle">[ɛɡ] n. 蛋，卵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "egge"，古英语 "ēa"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋，"蛋(egg)"
    <tspan x="50" dy="25">从天而降，砸在地上，蛋壳裂开，露出里面的小鸡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She boiled an egg for breakfast.
  </text>
  <text x="50" y="310" class="content">
    她煮了一个鸡蛋当早餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Egg -->
    <ellipse cx="175" cy="100" rx="100" ry="70" fill="#FFEB3B" stroke="#7F8C8D" stroke-width="2" />
    <!-- Cracked shell -->
    <line x1="75" y1="100" x2="275" y2="100" stroke="#7F8C8D" stroke-width="2" />
    <line x1="175" y1="30" x2="175" y2="170" stroke="#7F8C8D" stroke-width="2" />
    <!-- Chick -->
    <circle cx="175" cy="120" r="20" fill="#FFC107" stroke="#7F8C8D" stroke-width="2" />
    <line x1="175" y1="140" x2="175" y2="180" stroke="#7F8C8D" stroke-width="2" />
    <line x1="175" y1="160" x2="155" y2="140" stroke="#7F8C8D" stroke-width="2" />
    <line x1="175" y1="160" x2="195" y2="140" stroke="#7F8C8D" stroke-width="2" />
  </g>
</svg>