<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bronze { fill: #CD7F32; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bronze</text>
  <text x="50" y="120" class="subtitle">[brɒnz] n. 青铜，青铜制品；adj. 青铜色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bronz (青铜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的工匠，用"青铜(bronz)"
    <tspan x="50" dy="25">铸造出一个巨大的雕像，这个雕像在阳光下闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The statue was made of bronze and stood tall in the square.
  </text>
  <text x="50" y="310" class="content">
    这座雕像是用青铜制成的，矗立在广场上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bronze statue -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="50" class="bronze" />
    <line x1="175" y1="150" x2="175" y2="200" class="bronze" />
    <line x1="175" y1="175" x2="125" y2="175" class="bronze" />
    <line x1="175" y1="175" x2="225" y2="175" class="bronze" />
    <line x1="175" y1="200" x2="125" y2="250" class="bronze" />
    <line x1="175" y1="200" x2="225" y2="250" class="bronze" />
  </g>
</svg>