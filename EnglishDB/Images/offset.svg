<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">offset</text>
  <text x="50" y="120" class="subtitle">[ˈɒfset] v. 抵消，补偿；n. 偏移量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> off- (离开) + set (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，一边放着"离开(off)"的物品，另一边放着"放置(set)"的物品，
    <tspan x="50" dy="25">两者相互抵消，达到平衡。这就是"offset"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gains offset the losses, resulting in a balanced budget.
  </text>
  <text x="50" y="310" class="content">
    收益抵消了损失，最终实现了预算平衡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
    <!-- Left side -->
    <rect x="10" y="110" width="30" height="50" class="image" />
    <text x="20" y="150" class="content" text-anchor="middle">off</text>
    <!-- Right side -->
    <rect x="60" y="110" width="30" height="50" class="image" />
    <text x="70" y="150" class="content" text-anchor="middle">set</text>
  </g>
</svg>