<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">teacup</text>
  <text x="50" y="120" class="subtitle">[ˈtiːkʌp] n. 茶杯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tea (茶) + cup (杯子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个精致的茶杯，里面装满了清香的茶水，
    <tspan x="50" dy="25">茶杯(teacup)是享受悠闲时光的完美伴侣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sipped her tea from a delicate teacup.
  </text>
  <text x="50" y="310" class="content">
    她用精致的茶杯啜饮着茶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teacup -->
    <circle cx="100" cy="100" r="50" class="image" />
    <rect x="50" y="100" width="100" height="50" class="image" />
    <!-- Tea inside -->
    <rect x="60" y="110" width="80" height="30" fill="#D2B48C" />
    <!-- Handle -->
    <path d="M 140 120 Q 160 110 180 120" class="image" />
  </g>
</svg>