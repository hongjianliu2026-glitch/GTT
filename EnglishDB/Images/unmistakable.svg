<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unmistakable</text>
  <text x="50" y="120" class="subtitle">[ˌʌnmɪˈsteɪkəbl] adj. 不会弄错的，明显的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + mistake (错误) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色箭头，"不会(un-)被错误(mistake)"
    <tspan x="50" dy="25">地指向某个目标，这个目标就是明显的(unmistakable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unmistakable scent of roses filled the room.
  </text>
  <text x="50" y="310" class="content">
    玫瑰的香味弥漫了整个房间，非常明显。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red arrow -->
    <polygon points="0,0 100,0 100,150 150,150 75,200 0,150" style="fill:red;stroke:black;stroke-width:2" />
    <!-- Target -->
    <circle cx="200" cy="100" r="50" style="fill:none;stroke:black;stroke-width:2" />
    <circle cx="200" cy="100" r="25" style="fill:none;stroke:black;stroke-width:2" />
    <line x1="200" y1="50" x2="200" y2="150" style="stroke:black;stroke-width:2" />
    <line x1="150" y1="100" x2="250" y2="100" style="stroke:black;stroke-width:2" />
  </g>
</svg>