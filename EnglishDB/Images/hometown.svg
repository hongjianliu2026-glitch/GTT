<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hometown</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊmtaʊn] n. 家乡，故乡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> home (家) + town (城镇)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温馨的小镇，"家(home)"
    <tspan x="50" dy="25">所在的"城镇(town)"，那就是你的家乡(hometown)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always visits her hometown during the holidays.
  </text>
  <text x="50" y="310" class="content">
    她总是在假期回老家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- House -->
    <rect x="50" y="50" width="100" height="80" class="image" />
    <polygon points="50,50 100,20 150,50" class="image" />
    <!-- Town -->
    <rect x="20" y="150" width="160" height="50" class="image" />
    <rect x="200" y="150" width="160" height="50" class="image" />
    <rect x="380" y="150" width="160" height="50" class="image" />
    <!-- Road -->
    <line x1="0" y1="200" x2="600" y2="200" class="image" />
    <line x1="0" y1="205" x2="600" y2="205" class="image" />
    <line x1="0" y1="210" x2="600" y2="210" class="image" />
  </g>
</svg>