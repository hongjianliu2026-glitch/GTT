<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .steam { fill: #F5CBA7; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">steaming</text>
  <text x="50" y="120" class="subtitle">[ˈstiːmɪŋ] adj. 冒热气的，蒸腾的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> steam (蒸汽) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蒸汽锅，"蒸汽(steam)"
    <tspan x="50" dy="25">不断冒出，整个锅都在"冒热气(steaming)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soup was steaming hot when it arrived.
  </text>
  <text x="50" y="310" class="content">
    汤送来时还冒着热气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Steam -->
    <ellipse cx="175" cy="50" rx="100" ry="50" class="steam" />
    <ellipse cx="175" cy="20" rx="80" ry="40" class="steam" />
    <ellipse cx="175" cy="0" rx="60" ry="30" class="steam" />
    <!-- Pot lid -->
    <rect x="50" y="20" width="250" height="30" class="image" />
    <!-- Pot body -->
    <rect x="70" y="50" width="210" height="150" class="image" />
  </g>
</svg>