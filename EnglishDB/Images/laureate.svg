<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laureate</text>
  <text x="50" y="120" class="subtitle">[ˈlɔːriət] n. 桂冠诗人；adj. 戴桂冠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> laurel (月桂树) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个诗人头上戴着"月桂树(laurel)"编成的桂冠，
    <tspan x="50" dy="25">象征着荣誉和成就，这就是"戴桂冠的(laureate)"诗人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The poet was crowned laureate for his masterpiece.
  </text>
  <text x="50" y="310" class="content">
    这位诗人因其杰作而被授予桂冠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Laureate head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Laurel wreath -->
    <path d="M 50 80 Q 100 50 150 80 T 200 80" class="image" />
    <path d="M 50 90 Q 100 60 150 90 T 200 90" class="image" />
    <path d="M 50 100 Q 100 70 150 100 T 200 100" class="image" />
    <path d="M 50 110 Q 100 80 150 110 T 200 110" class="image" />
    <path d="M 50 120 Q 100 90 150 120 T 200 120" class="image" />
  </g>
</svg>