<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indictment</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdaɪtmənt] n. 起诉，控告</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + dict (说) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法庭场景，检察官"进入(in-)"法庭，"说(dict)"出对被告的指控，
    <tspan x="50" dy="25">这个过程就是"起诉(indictment)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The grand jury issued an indictment against the suspect.
  </text>
  <text x="50" y="310" class="content">
    大陪审团对嫌疑人发出了起诉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Judge -->
    <circle cx="100" cy="45" r="15" class="image" />
    <line x1="100" y1="60" x2="100" y2="90" class="image" />
    <line x1="100" y1="70" x2="80" y2="60" class="image" />
    <line x1="100" y1="70" x2="120" y2="60" class="image" />
    <!-- Prosecutor -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="140" class="image" />
    <line x1="200" y1="125" x2="180" y2="115" class="image" />
    <line x1="200" y1="125" x2="220" y2="115" class="image" />
    <!-- Speech bubble -->
    <path d="M220,90 Q250,90 250,120 Q220,120 220,90 Z" class="image" />
    <text x="225" y="110" class="content">Indict!</text>
  </g>
</svg>