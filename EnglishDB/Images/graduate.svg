<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">graduate</text>
  <text x="50" y="120" class="subtitle">[ˈɡrædʒuˌeɪt] v. 毕业；n. 毕业生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grad (走) + -uate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生"走(grad)"过一系列的学业阶段，最终"完成(uate)"学业，成为一名毕业生(graduate)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She graduated from Harvard last year.
  </text>
  <text x="50" y="310" class="content">
    她去年从哈佛大学毕业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Graduation cap -->
    <path d="M50 50 L70 30 L90 50 Z" class="image" />
    <line x1="60" y1="50" x2="60" y2="100" class="image" />
    <!-- Student walking -->
    <circle cx="60" cy="120" r="15" class="image" />
    <line x1="60" y1="135" x2="60" y2="170" class="image" />
    <line x1="60" y1="170" x2="40" y2="200" class="image" />
    <line x1="60" y1="170" x2="80" y2="200" class="image" />
    <line x1="60" y1="150" x2="100" y2="140" class="image" />
    <!-- Stage -->
    <rect x="0" y="200" width="120" height="20" class="image" />
  </g>
</svg>