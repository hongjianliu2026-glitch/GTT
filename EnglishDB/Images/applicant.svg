<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">applicant</text>
  <text x="50" y="120" class="subtitle">[ˈæplɪkənt] n. 申请人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (向) + plic (折叠) + -ant (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"向(ap-)"某个地方"折叠(plic)"自己的申请材料，
    <tspan x="50" dy="25">这个人就是申请人(applicant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The applicant submitted his resume and cover letter.
  </text>
  <text x="50" y="310" class="content">
    申请人提交了他的简历和求职信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Envelope -->
    <rect x="70" y="80" width="100" height="70" class="image" />
    <line x1="70" y1="80" x2="170" y2="80" class="image" />
    <line x1="70" y1="150" x2="170" y2="150" class="image" />
    <line x1="70" y1="80" x2="70" y2="150" class="image" />
    <line x1="170" y1="80" x2="170" y2="150" class="image" />
    <!-- Paper -->
    <rect x="80" y="90" width="80" height="50" class="image" />
    <line x1="80" y1="90" x2="160" y2="90" class="image" />
    <line x1="80" y1="140" x2="160" y2="140" class="image" />
    <line x1="80" y1="90" x2="80" y2="140" class="image" />
    <line x1="160" y1="90" x2="160" y2="140" class="image" />
  </g>
</svg>