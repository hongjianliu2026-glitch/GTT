<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clip</text>
  <text x="50" y="120" class="subtitle">[klɪp] n. 夹子，剪辑；v. 夹住，剪下</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cl- (表示“关闭”) + -ip (表示“工具”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的夹子，"关闭(cl-)"
    <tspan x="50" dy="25">并夹住了一堆纸张，这个工具就是夹子(clip)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a clip to hold her papers together.
  </text>
  <text x="50" y="310" class="content">
    她用一个夹子把她的文件夹在一起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clip -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <rect x="10" y="10" width="80" height="30" class="image" />
    <!-- Papers -->
    <rect x="120" y="0" width="100" height="50" class="image" />
    <rect x="130" y="10" width="80" height="30" class="image" />
    <rect x="140" y="20" width="60" height="10" class="image" />
    <!-- Clipping action -->
    <line x1="50" y1="50" x2="170" y2="50" class="image" />
  </g>
</svg>