<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diminishing</text>
  <text x="50" y="120" class="subtitle">[dɪˈmɪnɪʃɪŋ] adj. 逐渐减少的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + min (小) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕被"分开(di-)"成越来越"小(min)"的部分，
    <tspan x="50" dy="25">每一块都比前一块更小，这就是diminishing的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The effect of the drug is diminishing over time.
  </text>
  <text x="50" y="310" class="content">
    这种药物的效果随着时间的推移逐渐减弱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large cake -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Smaller cake -->
    <rect x="50" y="120" width="150" height="75" class="image" />
    <!-- Even smaller cake -->
    <rect x="100" y="210" width="100" height="50" class="image" />
    <!-- Diminishing effect -->
    <line x1="0" y1="100" x2="50" y2="120" class="image" />
    <line x1="50" y1="195" x2="100" y2="210" class="image" />
  </g>
</svg>