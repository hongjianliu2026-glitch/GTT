<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dig</text>
  <text x="50" y="120" class="subtitle">[dɪɡ] v. 挖，掘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dig (直接源自中古英语的diggen，意为“挖”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在田地里，用锄头"挖(dig)"
    <tspan x="50" dy="25">出一个深深的洞，准备种下新的希望。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The archaeologists had to dig deep to find the ancient artifacts.
  </text>
  <text x="50" y="310" class="content">
    考古学家们不得不深挖以找到古代文物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hole -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <!-- Shovel -->
    <line x1="175" y1="50" x2="175" y2="20" class="image" />
    <line x1="175" y1="20" x2="150" y2="0" class="image" />
    <line x1="175" y1="20" x2="200" y2="0" class="image" />
    <!-- Farmer -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
  </g>
</svg>