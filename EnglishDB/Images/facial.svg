<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">facial</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪʃl] adj. 面部的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fac (脸) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在做面部护理，"脸(fac)"
    <tspan x="50" dy="25">上涂满了各种护肤品，这就是面部的(facial)护理。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She regularly gets a facial treatment to keep her skin healthy.
  </text>
  <text x="50" y="310" class="content">
    她定期做面部护理以保持皮肤健康。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Face outline -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Eyes -->
    <circle cx="100" cy="130" r="15" class="image" />
    <circle cx="200" cy="130" r="15" class="image" />
    <!-- Mouth -->
    <path d="M100,200 Q150,220 200,200" class="image" />
    <!-- Facial treatment -->
    <circle cx="150" cy="150" r="50" class="image" fill="#F1C40F" />
    <text x="130" y="160" class="content" fill="#34495E">护肤</text>
  </g>
</svg>