<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trillion</text>
  <text x="50" y="120" class="subtitle">[ˈtrɪljən] n. 万亿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tri- (三) + -llion (表示大量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字"三(tri)"，后面跟着无数个零，
    <tspan x="50" dy="25">这些零的数量多到让人眼花缭乱，这就是"万亿(trillion)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The national debt is now in the trillions.
  </text>
  <text x="50" y="310" class="content">
    国家债务现在已经达到了数万亿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number "3" -->
    <text x="0" y="0" font-size="200" class="image">3</text>
    <!-- Lots of zeros -->
    <text x="100" y="0" font-size="100" class="image">0</text>
    <text x="150" y="0" font-size="100" class="image">0</text>
    <text x="200" y="0" font-size="100" class="image">0</text>
    <text x="250" y="0" font-size="100" class="image">0</text>
    <text x="300" y="0" font-size="100" class="image">0</text>
    <text x="350" y="0" font-size="100" class="image">0</text>
    <text x="400" y="0" font-size="100" class="image">0</text>
    <text x="450" y="0" font-size="100" class="image">0</text>
    <text x="500" y="0" font-size="100" class="image">0</text>
    <text x="550" y="0" font-size="100" class="image">0</text>
    <text x="600" y="0" font-size="100" class="image">0</text>
    <text x="650" y="0" font-size="100" class="image">0</text>
    <text x="700" y="0" font-size="100" class="image">0</text>
    <text x="750" y="0" font-size="100" class="image">0</text>
  </g>
</svg>