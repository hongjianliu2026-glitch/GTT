<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">others</text>
  <text x="50" y="120" class="subtitle">[ˈʌðərz] n. 其他人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> other (其他的) + -s (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，你站在中间，周围是"其他人(others)"，
    <tspan x="50" dy="25">他们都在做不同的事情，形成了一个多元的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The others in the group had already left.
  </text>
  <text x="50" y="310" class="content">
    小组里的其他人已经离开了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- You in the middle -->
    <circle cx="175" cy="100" r="20" class="image" />
    <!-- Others around you -->
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <!-- Activities -->
    <line x1="100" y1="65" x2="80" y2="85" class="image" />
    <line x1="250" y1="65" x2="270" y2="85" class="image" />
    <line x1="50" y1="115" x2="30" y2="135" class="image" />
    <line x1="300" y1="115" x2="320" y2="135" class="image" />
    <line x1="100" y1="165" x2="80" y2="185" class="image" />
    <line x1="250" y1="165" x2="270" y2="185" class="image" />
  </g>
</svg>