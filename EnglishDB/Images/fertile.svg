<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .land { fill: #27AE60; }
      .plant { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fertile</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrtaɪl] adj. 肥沃的，多产的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fer (带来) + -ile (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片肥沃的土地，"带来(fer)"
    <tspan x="50" dy="25">丰富的作物，这就是肥沃(fertile)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer's field is very fertile.
  </text>
  <text x="50" y="310" class="content">
    农夫的田地非常肥沃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fertile land -->
    <rect x="0" y="0" width="350" height="200" class="land" />
    <!-- Plants -->
    <circle cx="50" cy="100" r="20" class="plant" />
    <circle cx="120" cy="120" r="25" class="plant" />
    <circle cx="200" cy="80" r="30" class="plant" />
    <circle cx="280" cy="110" r="25" class="plant" />
  </g>
</svg>