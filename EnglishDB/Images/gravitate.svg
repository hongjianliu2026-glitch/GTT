<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gravitate</text>
  <text x="50" y="120" class="subtitle">[ˈɡrævɪteɪt] v. 受引力作用，被吸引</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grav (重) + -itate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磁铁，"重力(grav)"
    <tspan x="50" dy="25">吸引着周围的物体，它们不由自主地向磁铁移动，</tspan>
    <tspan x="50" dy="25">这就是"受引力作用(gravitate)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> People tend to gravitate towards those who are kind and generous.
  </text>
  <text x="50" y="310" class="content">
    人们往往会被善良和慷慨的人所吸引。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <!-- Objects being attracted -->
    <circle cx="150" cy="25" r="10" class="image" />
    <circle cx="200" cy="25" r="10" class="image" />
    <circle cx="250" cy="25" r="10" class="image" />
    <!-- Arrows -->
    <line x1="110" y1="25" x2="140" y2="25" class="image" />
    <line x1="160" y1="25" x2="190" y2="25" class="image" />
    <line x1="210" y1="25" x2="240" y2="25" class="image" />
    <line x1="260" y1="25" x2="290" y2="25" class="image" />
    <line x1="110" y1="25" x2="110" y2="15" class="image" />
    <line x1="160" y1="25" x2="160" y2="15" class="image" />
    <line x1="210" y1="25" x2="210" y2="15" class="image" />
    <line x1="260" y1="25" x2="260" y2="15" class="image" />
  </g>
</svg>