<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfulfilled</text>
  <text x="50" y="120" class="subtitle">[ˌʌnfʊlˈfɪld] adj. 未实现的，未满足的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + fulfill (实现) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的空洞前，"未实现(unfulfilled)"
    <tspan x="50" dy="25">的梦想就像这个空洞，充满了未被填满的渴望。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her unfulfilled dreams haunted her for years.
  </text>
  <text x="50" y="310" class="content">
    她未实现的梦想困扰了她多年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Empty hole -->
    <circle cx="150" cy="100" r="80" class="image" />
    <!-- Person -->
    <circle cx="150" cy="250" r="20" class="image" />
    <line x1="150" y1="270" x2="150" y2="320" class="image" />
    <line x1="150" y1="320" x2="130" y2="350" class="image" />
    <line x1="150" y1="320" x2="170" y2="350" class="image" />
    <line x1="150" y1="290" x2="120" y2="280" class="image" />
    <line x1="150" y1="290" x2="180" y2="280" class="image" />
    <!-- Arrow pointing to the hole -->
    <line x1="150" y1="250" x2="150" y2="180" class="image" />
    <polygon points="150,180 140,190 160,190" class="image" />
  </g>
</svg>