<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">councilman</text>
  <text x="50" y="120" class="subtitle">[ˈkaʊnsəlmən] n. 议员，理事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> council (会议) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装的"会议人(council-man)"，
    <tspan x="50" dy="25">坐在会议桌前，认真讨论着社区事务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The councilman proposed a new policy to improve public transportation.
  </text>
  <text x="50" y="310" class="content">
    这位议员提出了一项改善公共交通的新政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Councilman -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Suit -->
    <rect x="40" y="120" width="20" height="60" class="image" />
    <rect x="60" y="120" width="20" height="60" class="image" />
    <!-- Table -->
    <rect x="100" y="150" width="200" height="50" class="image" />
    <!-- Chair -->
    <rect x="120" y="100" width="40" height="50" class="image" />
    <rect x="140" y="100" width="40" height="50" class="image" />
    <rect x="160" y="100" width="40" height="50" class="image" />
  </g>
</svg>