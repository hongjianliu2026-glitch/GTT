<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Australian</text>
  <text x="50" y="120" class="subtitle">[ɒˈstreɪliən] adj. 澳大利亚的；n. 澳大利亚人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Austral (南方) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在南半球，"南方(Austral)"
    <tspan x="50" dy="25">的澳大利亚(Australian)，那里有独特的动植物和美丽的风景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Australian outback is famous for its vast landscapes.
  </text>
  <text x="50" y="310" class="content">
    澳大利亚的内陆地区以其广阔的景观而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Southern Hemisphere -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Australia -->
    <path d="M100,100 L150,50 L200,100 L150,150 Z" class="image" />
    <!-- Kangaroo -->
    <circle cx="175" cy="150" r="15" class="image" />
    <line x1="175" y1="165" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="180" x2="205" y2="170" class="image" />
  </g>
</svg>