<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conscript</text>
  <text x="50" y="120" class="subtitle">[kənˈskrɪpt] v. 征召；n. 应征士兵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + script (写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人被"共同写下(con-script)"在征兵名单上，
    <tspan x="50" dy="25">他们被迫成为应征士兵(conscript)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was conscripted into the army during the war.
  </text>
  <text x="50" y="310" class="content">
    他在战争期间被征召入伍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- List -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Names on the list -->
    <line x1="50" y1="30" x2="300" y2="30" class="image" />
    <line x1="50" y1="60" x2="250" y2="60" class="image" />
    <line x1="50" y1="90" x2="270" y2="90" class="image" />
    <line x1="50" y1="120" x2="240" y2="120" class="image" />
    <!-- Soldier -->
    <rect x="150" y="150" width="50" height="50" class="image" />
    <line x1="175" y1="200" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="150" y2="280" class="image" />
    <line x1="175" y1="250" x2="200" y2="280" class="image" />
    <line x1="175" y1="230" x2="225" y2="220" class="image" />
  </g>
</svg>