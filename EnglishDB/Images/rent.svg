<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rent</text>
  <text x="50" y="120" class="subtitle">[rent] n. 租金；v. 租用，出租</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再) + nt (需要)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房东在收取租金，"再次需要(re-nt)"
    <tspan x="50" dy="25">支付的费用，这就是租金(rent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He pays $1000 in rent every month.
  </text>
  <text x="50" y="310" class="content">
    他每个月支付1000美元的租金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <line x1="40" y1="40" x2="160" y2="40" class="image" />
    <line x1="40" y1="70" x2="160" y2="70" class="image" />
    <line x1="40" y1="100" x2="160" y2="100" class="image" />
    <!-- Money -->
    <rect x="220" y="50" width="100" height="50" class="image" />
    <line x1="230" y1="60" x2="310" y2="60" class="image" />
    <line x1="230" y1="80" x2="310" y2="80" class="image" />
    <line x1="230" y1="100" x2="310" y2="100" class="image" />
    <!-- Arrow -->
    <line x1="200" y1="75" x2="220" y2="75" class="image" />
    <polygon points="200,75 190,70 190,80" class="image" />
  </g>
</svg>