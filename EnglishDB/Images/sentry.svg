<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sentry</text>
  <text x="50" y="120" class="subtitle">[ˈsentri] n. 哨兵，警卫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sent (感觉) + ry (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个哨兵站在高处，"感觉(sent)"
    <tspan x="50" dy="25">周围的一切动静，时刻保持警惕。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sentry stood guard at the gate all night.
  </text>
  <text x="50" y="310" class="content">
    哨兵整夜在门口站岗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Guard tower -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Guard -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Tower -->
    <rect x="100" y="20" width="150" height="180" class="image" />
    <!-- Window -->
    <rect x="120" y="40" width="30" height="30" class="image" />
    <rect x="170" y="40" width="30" height="30" class="image" />
    <rect x="220" y="40" width="30" height="30" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>