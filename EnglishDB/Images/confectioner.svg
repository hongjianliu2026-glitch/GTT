<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cake { fill: #F1C40F; }
      .chef { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confectioner</text>
  <text x="50" y="120" class="subtitle">[kənˈfekʃənər] n. 糖果制造者，糕点师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + fect (做) + -ion (名词后缀) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个糕点师在厨房里，"一起做(con-fect)"
    <tspan x="50" dy="25">各种美味的糖果和糕点，他就是个糖果制造者(confectioner)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The confectioner made a beautiful wedding cake.
  </text>
  <text x="50" y="310" class="content">
    糕点师做了一个漂亮的婚礼蛋糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="50" cy="100" r="20" class="chef" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Cake -->
    <rect x="100" y="80" width="150" height="100" class="cake" />
    <line x1="100" y1="80" x2="250" y2="80" class="image" />
    <line x1="100" y1="130" x2="250" y2="130" class="image" />
    <line x1="100" y1="180" x2="250" y2="180" class="image" />
    <!-- Decoration -->
    <circle cx="120" cy="130" r="10" class="cake" />
    <circle cx="150" cy="130" r="10" class="cake" />
    <circle cx="180" cy="130" r="10" class="cake" />
  </g>
</svg>