<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">duck</text>
  <text x="50" y="120" class="subtitle">[dʌk] n. 鸭子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语“dukke”，意为“鸭子”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸭子在湖面上悠闲地游动，它的羽毛在阳光下闪闪发光，仿佛在说：“我是湖上的小明星！”
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The duck quacked loudly as it swam across the pond.
  </text>
  <text x="50" y="310" class="content">
    鸭子嘎嘎叫着游过池塘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Pond -->
    <rect x="0" y="150" width="350" height="100" class="image" fill="#A9CCE3" />
    <!-- Duck -->
    <circle cx="100" cy="120" r="30" class="image" fill="#F4D03F" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="170" x2="70" y2="160" class="image" />
    <line x1="100" y1="170" x2="130" y2="160" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
    <line x1="100" y1="200" x2="120" y2="220" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="40" class="image" fill="#F1C40F" />
  </g>
</svg>