<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">legend</text>
  <text x="50" y="120" class="subtitle">[ˈlɛdʒənd] n. 传说，传奇人物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leg (说) + end (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的石碑上，"说(leg)"
    <tspan x="50" dy="25">着一段传奇故事，这就是传说(legend)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a living legend in the world of sports.
  </text>
  <text x="50" y="310" class="content">
    她是体育界的传奇人物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancient stone tablet -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Inscription -->
    <text x="50" y="100" class="content" style="font-family: serif; font-size: 24px; fill: #2C3E50;">
      "Once upon a time..."
    </text>
    <!-- Hero figure -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
  </g>
</svg>