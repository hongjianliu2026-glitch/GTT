<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">auditory</text>
  <text x="50" y="120" class="subtitle">[ˈɔːdətɔːri] adj. 听觉的，听觉器官的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aud (听) + itory (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的耳朵，"听(aud)"
    <tspan x="50" dy="25">着周围的一切声音，这就是听觉(auditory)的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The auditory system is crucial for understanding speech.
  </text>
  <text x="50" y="310" class="content">
    听觉系统对于理解语言至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large ear -->
    <path d="M50,50 C100,0 150,0 200,50 C250,100 250,150 200,200 C150,250 100,250 50,200 C0,150 0,100 50,50 Z" class="image" />
    <!-- Sound waves -->
    <path d="M100,100 Q150,50 200,100" class="image" />
    <path d="M100,120 Q150,70 200,120" class="image" />
    <path d="M100,140 Q150,90 200,140" class="image" />
    <path d="M100,160 Q150,110 200,160" class="image" />
  </g>
</svg>