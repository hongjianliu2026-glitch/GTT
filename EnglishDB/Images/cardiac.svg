<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cardiac</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrdiæk] adj. 心脏的，心脏病的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> card (心脏) + -iac (与...有关的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗巨大的心脏(card)在跳动，"与心脏有关的(card-iac)"
    <tspan x="50" dy="25">症状和疾病都被称为心脏病的(cardiac)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was diagnosed with a cardiac condition.
  </text>
  <text x="50" y="310" class="content">
    他被诊断出患有心脏病。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 40 C10 10, 40 10, 40 40 S70 70, 100 40" class="image" />
    <!-- Arteries -->
    <line x1="50" y1="40" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <!-- Blood flow -->
    <circle cx="50" cy="50" r="5" fill="#E74C3C" />
    <circle cx="50" cy="60" r="5" fill="#E74C3C" />
    <circle cx="50" cy="70" r="5" fill="#E74C3C" />
  </g>
</svg>