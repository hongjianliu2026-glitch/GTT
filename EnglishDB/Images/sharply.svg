<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sharply</text>
  <text x="50" y="120" class="subtitle">[ˈʃɑːrpli] adv. 锐利地，急剧地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sharp (锐利的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀子，"锐利地(sharply)"
    <tspan x="50" dy="25">切开一块柔软的黄油，刀刃与黄油接触的瞬间，</tspan>
    <tspan x="50" dy="25">黄油被迅速而干净地切开，这就是"sharply"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stock market fell sharply after the news.
  </text>
  <text x="50" y="310" class="content">
    消息传出后，股市急剧下跌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knife -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <line x1="100" y1="40" x2="80" y2="40" class="image" />
    <line x1="80" y1="40" x2="80" y2="180" class="image" />
    <!-- Butter -->
    <rect x="120" y="100" width="150" height="50" class="image" />
    <!-- Cut line -->
    <line x1="120" y1="125" x2="270" y2="125" class="image" />
  </g>
</svg>