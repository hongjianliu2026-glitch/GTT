<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pinnacle</text>
  <text x="50" y="120" class="subtitle">[ˈpɪnəkl] n. 顶峰，顶点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pinn (峰) + -acle (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在山峰的"小顶点(pinn-acle)"上，
    <tspan x="50" dy="25">俯瞰整个世界，感受到无比的成就感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Reaching the pinnacle of his career, he felt a sense of fulfillment.
  </text>
  <text x="50" y="310" class="content">
    达到职业生涯的顶峰，他感到一种成就感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Pinnacle -->
    <polygon points="130,20 170,20 150,0" class="image" />
    <!-- Person -->
    <circle cx="150" cy="40" r="10" class="image" />
    <line x1="150" y1="50" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="130" y2="110" class="image" />
    <line x1="150" y1="80" x2="170" y2="110" class="image" />
    <line x1="150" y1="60" x2="120" y2="50" class="image" />
    <line x1="150" y1="60" x2="180" y2="50" class="image" />
  </g>
</svg>