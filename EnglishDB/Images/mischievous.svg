<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mischievous</text>
  <text x="50" y="120" class="subtitle">[ˈmɪstʃɪvəs] adj. 恶作剧的，淘气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + chief (头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小鬼头(chief)，总是做些"错误(mis-)"
    <tspan x="50" dy="25">的恶作剧，让人哭笑不得。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mischievous boy hid his sister's shoes.
  </text>
  <text x="50" y="310" class="content">
    那个淘气的男孩藏起了他姐姐的鞋子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mischievous boy -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Shoes -->
    <rect x="120" y="140" width="30" height="10" class="image" />
    <rect x="160" y="140" width="30" height="10" class="image" />
    <!-- Hidden shoes -->
    <rect x="120" y="160" width="30" height="10" class="image" />
    <rect x="160" y="160" width="30" height="10" class="image" />
    <line x1="120" y1="160" x2="150" y2="160" class="image" />
    <line x1="160" y1="160" x2="190" y2="160" class="image" />
  </g>
</svg>