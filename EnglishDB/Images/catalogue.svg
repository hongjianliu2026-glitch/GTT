<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">catalogue</text>
  <text x="50" y="120" class="subtitle">[ˈkætəlɔɡ] n. 目录，一览表</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cata- (向下) + log (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的书架，"向下说出(cata-log)"
    <tspan x="50" dy="25">每一本书的名字，这些名字就构成了一个目录(catalogue)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store sent us a catalogue of their latest products.
  </text>
  <text x="50" y="310" class="content">
    商店给我们寄来了他们最新产品的目录。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bookshelf -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- Titles -->
    <text x="55" y="50" class="content">Book 1</text>
    <text x="125" y="50" class="content">Book 2</text>
    <text x="195" y="50" class="content">Book 3</text>
    <text x="265" y="50" class="content">Book 4</text>
  </g>
</svg>