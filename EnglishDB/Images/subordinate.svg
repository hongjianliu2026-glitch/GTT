<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subordinate</text>
  <text x="50" y="120" class="subtitle">[səˈbɔːrdɪnət] adj. 下级的，从属的；n. 下属</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + ordin (顺序) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个下属站在上司的"下方(sub-)"，
    <tspan x="50" dy="25">按照"顺序(ordin)"排列，表示从属关系。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is always respectful to his subordinates.
  </text>
  <text x="50" y="310" class="content">
    他对下属总是很尊重。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boss -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />

    <!-- Subordinate -->
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="250" y1="170" x2="250" y2="210" class="image" />
    <line x1="250" y1="210" x2="220" y2="250" class="image" />
    <line x1="250" y1="210" x2="280" y2="250" class="image" />
    <line x1="250" y1="190" x2="300" y2="180" class="image" />

    <!-- Arrow -->
    <line x1="130" y1="130" x2="220" y2="160" class="image" />
    <polygon points="220,160 210,150 210,170" class="image" />
  </g>
</svg>