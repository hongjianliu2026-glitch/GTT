<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">storeroom</text>
  <text x="50" y="120" class="subtitle">[ˈstɔːrruːm] n. 储藏室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> store (储存) + room (房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的房间，里面堆满了各种物品，
    <tspan x="50" dy="25">就像一个"储存(store)"宝藏的"房间(room)"，这就是储藏室(storeroom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storeroom is filled with old furniture and boxes.
  </text>
  <text x="50" y="310" class="content">
    储藏室里堆满了旧家具和箱子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Storeroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boxes -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <rect x="170" y="20" width="100" height="80" class="image" />
    <rect x="50" y="120" width="100" height="80" class="image" />
    <rect x="170" y="120" width="100" height="80" class="image" />
    <!-- Furniture -->
    <rect x="290" y="20" width="50" height="180" class="image" />
    <rect x="300" y="30" width="30" height="160" class="image" />
  </g>
</svg>