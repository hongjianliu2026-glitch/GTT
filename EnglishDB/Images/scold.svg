<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scold</text>
  <text x="50" y="120" class="subtitle">[skoʊld] v. 责骂，训斥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sc- (尖锐) + old (老)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个严厉的老人，"尖锐地(sc-)"
    <tspan x="50" dy="25">责骂(scold)一个做错事的孩子，声音刺耳。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher scolded the student for not doing his homework.
  </text>
  <text x="50" y="310" class="content">
    老师因为学生没做作业而训斥了他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Mouth -->
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <!-- Child -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="240" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 50 80 Q 100 50 150 80 Q 200 110 150 140 Q 100 170 50 140 Z" class="image" />
    <text x="80" y="110" class="content" text-anchor="middle">Scold!</text>
  </g>
</svg>