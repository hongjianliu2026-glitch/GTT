<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">occur</text>
  <text x="50" y="120" class="subtitle">[əˈkɜːr] v. 发生，出现</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oc- (朝向) + cur (跑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个事件突然"朝你跑来(oc-cur)"，
    <tspan x="50" dy="25">就像一个意外的惊喜或惊吓，这就是"发生(occur)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident occurred during the rush hour.
  </text>
  <text x="50" y="310" class="content">
    事故发生在交通高峰期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Event bubble -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <polygon points="90,240 100,250 110,240" class="image" />
    <!-- Person -->
    <circle cx="200" cy="200" r="20" class="image" />
    <line x1="200" y1="220" x2="200" y2="260" class="image" />
    <line x1="200" y1="260" x2="180" y2="300" class="image" />
    <line x1="200" y1="260" x2="220" y2="300" class="image" />
    <line x1="200" y1="240" x2="240" y2="230" class="image" />
  </g>
</svg>