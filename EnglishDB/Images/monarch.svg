<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monarch</text>
  <text x="50" y="120" class="subtitle">[ˈmɒnək] n. 君主，帝王</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mon- (单一) + arch (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"单一的统治者(mon-arch)"，
    <tspan x="50" dy="25">他坐在宝座上，统治着整个王国。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The monarch ruled the kingdom with wisdom and justice.
  </text>
  <text x="50" y="310" class="content">
    这位君主以智慧和公正统治着王国。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Crown -->
    <circle cx="175" cy="30" r="20" class="image" />
    <line x1="165" y1="30" x2="185" y2="30" class="image" />
    <line x1="175" y1="10" x2="175" y2="50" class="image" />
    <!-- Monarch -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>