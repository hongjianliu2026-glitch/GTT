<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coincide</text>
  <text x="50" y="120" class="subtitle">[ˌkoʊɪnˈsaɪd] v. 同时发生，一致</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (一起) + in- (在) + cid (落下) + -e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两颗流星同时"一起落下(co-in-cid-e)"，
    <tspan x="50" dy="25">它们的路径完全一致，这就是coincide的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His vacation coincides with the conference.
  </text>
  <text x="50" y="310" class="content">
    他的假期与会议时间一致。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two meteors -->
    <line x1="50" y1="50" x2="200" y2="200" class="image" />
    <line x1="70" y1="50" x2="220" y2="200" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="70" cy="50" r="10" class="image" />
    <!-- Paths -->
    <path d="M50,50 Q125,125 200,200" class="image" />
    <path d="M70,50 Q145,125 220,200" class="image" />
  </g>
</svg>