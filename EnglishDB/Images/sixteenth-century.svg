<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sixteenth-century</text>
  <text x="50" y="120" class="subtitle">[ˌsɪksˈtiːnθ ˈsɛntʃəri] n. 十六世纪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> six (六) + teen (十) + th (第...) + century (世纪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的钟表，指针指向"第六个十年的世纪(sixteenth-century)"，
    <tspan x="50" dy="25">代表着1501年到1600年的历史时期。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The painting was created in the sixteenth-century.
  </text>
  <text x="50" y="310" class="content">
    这幅画创作于十六世纪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Roman numerals -->
    <text x="175" y="30" class="content" text-anchor="middle">XII</text>
    <text x="255" y="105" class="content" text-anchor="middle">III</text>
    <text x="175" y="180" class="content" text-anchor="middle">VI</text>
    <text x="95" y="105" class="content" text-anchor="middle">IX</text>
  </g>
</svg>