<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boredom</text>
  <text x="50" y="120" class="subtitle">[ˈbɔːrdəm] n. 无聊，厌倦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bore (使厌烦) + -dom (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在一个巨大的时钟前，时钟的指针缓慢地移动，
    <tspan x="50" dy="25">他的脸上写满了"厌烦(bore)"，这就是"无聊(boredom)"的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The long lecture caused a feeling of boredom.
  </text>
  <text x="50" y="310" class="content">
    长时间的讲座让人感到无聊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Person -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Bored expression -->
    <circle cx="240" cy="90" r="5" class="image" />
    <circle cx="260" cy="90" r="5" class="image" />
    <line x1="240" y1="110" x2="260" y2="110" class="image" />
  </g>
</svg>