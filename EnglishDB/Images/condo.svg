<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">condo</text>
  <text x="50" y="120" class="subtitle">[ˈkɒndəʊ] n. 公寓，分户出售的公寓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + do (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人共同(con-)建造(do)一个大楼，
    <tspan x="50" dy="25">每个人拥有自己的小空间，这就是公寓(condo)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She lives in a luxury condo downtown.
  </text>
  <text x="50" y="310" class="content">
    她住在市中心的一套豪华公寓里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Windows -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <rect x="50" y="90" width="50" height="50" class="image" />
    <rect x="120" y="90" width="50" height="50" class="image" />
    <rect x="190" y="90" width="50" height="50" class="image" />
    <rect x="260" y="90" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="70" cy="40" r="10" class="image" />
    <circle cx="140" cy="40" r="10" class="image" />
    <circle cx="210" cy="40" r="10" class="image" />
    <circle cx="280" cy="40" r="10" class="image" />
    <circle cx="70" cy="110" r="10" class="image" />
    <circle cx="140" cy="110" r="10" class="image" />
    <circle cx="210" cy="110" r="10" class="image" />
    <circle cx="280" cy="110" r="10" class="image" />
  </g>
</svg>