<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">counterpart</text>
  <text x="50" y="120" class="subtitle">[ˈkaʊntərpɑːrt] n. 对应的人或物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> counter- (相对) + part (部分)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站立，"相对的部分(counter-part)"
    <tspan x="50" dy="25">就像镜像一样，他们就是彼此的对应物(counterpart)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The U.S. President met with his Chinese counterpart.
  </text>
  <text x="50" y="310" class="content">
    美国总统会见了中国国家主席。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />

    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="270" y2="220" class="image" />
    <line x1="300" y1="180" x2="330" y2="220" class="image" />
    <line x1="300" y1="150" x2="350" y2="140" class="image" />

    <!-- Mirror line -->
    <line x1="200" y1="0" x2="200" y2="250" class="image" />
  </g>
</svg>