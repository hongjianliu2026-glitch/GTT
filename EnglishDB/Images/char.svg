<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">char</text>
  <text x="50" y="120" class="subtitle">[tʃɑːr] n. 炭，木炭；v. 烧焦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> char (来自古英语ceor, 意为“烧焦”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的森林，火焰"烧焦(char)"了树木，
    <tspan x="50" dy="25">留下了一堆堆黑色的木炭(char)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fire charred the wooden fence.
  </text>
  <text x="50" y="310" class="content">
    火把木栅栏烧焦了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="50" r="30" class="image" fill="#F39C12" />
    <circle cx="70" cy="70" r="25" class="image" fill="#E67E22" />
    <circle cx="90" cy="50" r="20" class="image" fill="#D35400" />
    <!-- Charred wood -->
    <rect x="150" y="20" width="100" height="100" class="image" fill="#34495E" />
    <line x1="160" y1="30" x2="240" y2="30" class="image" />
    <line x1="160" y1="50" x2="240" y2="50" class="image" />
    <line x1="160" y1="70" x2="240" y2="70" class="image" />
    <line x1="160" y1="90" x2="240" y2="90" class="image" />
  </g>
</svg>