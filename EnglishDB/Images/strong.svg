<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">strong</text>
  <text x="50" y="120" class="subtitle">[strɔːŋ] adj. 强壮的，强大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> str- (拉，拉紧) + -ong (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大力士，"拉紧(str-)"
    <tspan x="50" dy="25">肌肉，展现出强大的力量(strong)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a strong man who can lift heavy weights.
  </text>
  <text x="50" y="310" class="content">
    他是一个强壮的人，能举起重物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="350" class="image" />
    <line x1="100" y1="250" x2="150" y2="350" class="image" />
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <!-- Muscles -->
    <line x1="100" y1="150" x2="70" y2="200" class="image" />
    <line x1="100" y1="150" x2="130" y2="200" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
  </g>
</svg>