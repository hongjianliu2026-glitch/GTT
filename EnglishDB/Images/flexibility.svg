<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flexibility</text>
  <text x="50" y="120" class="subtitle">[ˌflɛksɪˈbɪlɪti] n. 灵活性，柔韧性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flex (弯曲) + -ibility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瑜伽大师，能够"弯曲(flex)"身体到任何角度，
    <tspan x="50" dy="25">这种能力就是灵活性(flexibility)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flexibility of the schedule allowed us to make changes easily.
  </text>
  <text x="50" y="310" class="content">
    日程安排的灵活性使我们能够轻松地进行更改。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Yoga pose -->
    <line x1="50" y1="20" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="250" y2="20" class="image" />
    <line x1="150" y1="200" x2="150" y2="300" class="image" />
    <line x1="150" y1="300" x2="100" y2="350" class="image" />
    <line x1="150" y1="300" x2="200" y2="350" class="image" />
    <line x1="150" y1="250" x2="100" y2="200" class="image" />
    <line x1="150" y1="250" x2="200" y2="200" class="image" />
    <!-- Flexibility text -->
    <text x="100" y="400" class="content">Flexibility</text>
  </g>
</svg>