<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #8B4513; stroke-width: 2; fill: none; }
      .mud { fill: #8B7355; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">muddy</text>
  <text x="50" y="120" class="subtitle">[ˈmʌdi] adj. 泥泞的，浑浊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mud (泥) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头大象在泥潭中打滚，"泥(mud)"
    <tspan x="50" dy="25">巴满身，变得"泥泞(muddy)"不堪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road was muddy after the heavy rain.
  </text>
  <text x="50" y="310" class="content">
    大雨过后，道路变得泥泞不堪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Muddy ground -->
    <rect x="0" y="0" width="350" height="200" class="mud" />
    <!-- Elephant -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="210" class="image" />
    <line x1="100" y1="180" x2="130" y2="210" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <line x1="100" y1="150" x2="50" y2="140" class="image" />
    <!-- Mud splashes -->
    <circle cx="150" cy="150" r="10" class="mud" />
    <circle cx="180" cy="130" r="10" class="mud" />
    <circle cx="200" cy="160" r="10" class="mud" />
  </g>
</svg>