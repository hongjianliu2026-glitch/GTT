<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unseen</text>
  <text x="50" y="120" class="subtitle">[ʌnˈsiːn] adj. 看不见的，未被发现的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + seen (看见)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的幽灵，"看不见(un-seen)"
    <tspan x="50" dy="25">在黑暗中飘荡，无人察觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hidden treasure remained unseen for centuries.
  </text>
  <text x="50" y="310" class="content">
    那隐藏的宝藏几个世纪以来一直未被发现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Ghost -->
    <circle cx="175" cy="100" r="30" class="image" fill="#ECF0F1" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="160" class="image" />
    <line x1="175" y1="150" x2="205" y2="160" class="image" />
    <line x1="175" y1="180" x2="145" y2="200" class="image" />
    <line x1="175" y1="180" x2="205" y2="200" class="image" />
    <!-- Eyes -->
    <circle cx="160" cy="90" r="5" class="image" fill="#000" />
    <circle cx="190" cy="90" r="5" class="image" fill="#000" />
  </g>
</svg>