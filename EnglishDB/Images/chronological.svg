<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chronological</text>
  <text x="50" y="120" class="subtitle">[ˌkrɒnəˈlɒdʒɪkl] adj. 按时间顺序的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chrono- (时间) + logical (逻辑的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"时间(chrono)"
    <tspan x="50" dy="25">在逻辑(logical)的指引下，</tspan>
    <tspan x="50" dy="25">按顺序排列事件，</tspan>
    <tspan x="50" dy="25">这就是按时间顺序的(chronological)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The book is written in chronological order.
  </text>
  <text x="50" y="330" class="content">
    这本书是按时间顺序写的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Events -->
    <rect x="200" y="20" width="150" height="30" class="image" />
    <rect x="200" y="70" width="150" height="30" class="image" />
    <rect x="200" y="120" width="150" height="30" class="image" />
    <rect x="200" y="170" width="150" height="30" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="100" x2="200" y2="35" class="image" />
    <line x1="100" y1="100" x2="200" y2="85" class="image" />
    <line x1="100" y1="100" x2="200" y2="135" class="image" />
    <line x1="100" y1="100" x2="200" y2="185" class="image" />
  </g>
</svg>