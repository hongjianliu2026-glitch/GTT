<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ambiguity</text>
  <text x="50" y="120" class="subtitle">[ˌæmbɪˈɡjuːɪti] n. 含糊，不明确</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ambi- (两边) + -igu (走) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在两条路之间徘徊，"两边走(ambi-igu)"，
    <tspan x="50" dy="25">不知道该选择哪一条，这种犹豫不决就是含糊(ambiguity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ambiguity of the instructions caused confusion.
  </text>
  <text x="50" y="310" class="content">
    指令的含糊不清导致了混乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two paths -->
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <line x1="0" y1="150" x2="150" y2="0" class="image" />
    <!-- Person in the middle -->
    <circle cx="75" cy="75" r="15" class="image" />
    <line x1="75" y1="90" x2="75" y2="120" class="image" />
    <line x1="75" y1="120" x2="60" y2="140" class="image" />
    <line x1="75" y1="120" x2="90" y2="140" class="image" />
    <line x1="75" y1="100" x2="50" y2="90" class="image" />
    <line x1="75" y1="100" x2="100" y2="90" class="image" />
  </g>
</svg>