<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mental health</text>
  <text x="50" y="120" class="subtitle">[ˈmɛntl hɛlθ] n. 心理健康</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ment (心智) + health (健康)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心智(ment)像一棵树，树根(health)
    <tspan x="50" dy="25">深深扎在土壤中，吸收养分，保持健康(mental health)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Regular exercise is good for both physical and mental health.
  </text>
  <text x="50" y="310" class="content">
    定期锻炼对身体健康和心理健康都有好处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree -->
    <line x1="150" y1="200" x2="150" y2="50" class="image" />
    <line x1="150" y1="100" x2="120" y2="150" class="image" />
    <line x1="150" y1="100" x2="180" y2="150" class="image" />
    <line x1="150" y1="150" x2="120" y2="200" class="image" />
    <line x1="150" y1="150" x2="180" y2="200" class="image" />
    <!-- Roots -->
    <line x1="140" y1="200" x2="120" y2="250" class="image" />
    <line x1="160" y1="200" x2="180" y2="250" class="image" />
    <line x1="150" y1="200" x2="150" y2="250" class="image" />
    <!-- Soil -->
    <rect x="100" y="250" width="100" height="50" class="image" />
  </g>
</svg>