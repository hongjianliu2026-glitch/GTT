<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blaze</text>
  <text x="50" y="120" class="subtitle">[bleɪz] n. 火焰，光辉；v. 燃烧，发光</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blaz (火焰)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林中，"火焰(blaze)"
    <tspan x="50" dy="25">熊熊燃烧，火光冲天，照亮了整个夜空。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fire blazed brightly in the fireplace.
  </text>
  <text x="50" y="310" class="content">
    火在壁炉里熊熊燃烧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <polygon points="0,0 50,0 25,50" class="fire" />
    <polygon points="25,50 75,50 50,100" class="fire" />
    <polygon points="50,100 100,100 75,150" class="fire" />
    <polygon points="75,150 125,150 100,200" class="fire" />
    <polygon points="100,200 150,200 125,250" class="fire" />
    <polygon points="125,250 175,250 150,300" class="fire" />
    <polygon points="150,300 200,300 175,350" class="fire" />
    <polygon points="175,350 225,350 200,400" class="fire" />
    <polygon points="200,400 250,400 225,450" class="fire" />
    <polygon points="225,450 275,450 250,500" class="fire" />
    <polygon points="250,500 300,500 275,550" class="fire" />
    <polygon points="275,550 325,550 300,600" class="fire" />
  </g>
</svg>