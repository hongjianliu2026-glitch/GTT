<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twinge</text>
  <text x="50" y="120" class="subtitle">[twɪndʒ] n. 刺痛，剧痛；v. 感到刺痛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tw- (扭) + inge (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根针突然"扭动(tw-)"并"刺入(inge)"你的皮肤，
    <tspan x="50" dy="25">那种瞬间的刺痛感就是twinge。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt a sharp twinge in her back after lifting the heavy box.
  </text>
  <text x="50" y="310" class="content">
    她在搬起重箱子后感到背部一阵剧痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Needle -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <circle cx="50" cy="50" r="5" class="image" />
    <!-- Skin -->
    <rect x="0" y="150" width="100" height="50" class="image" />
    <!-- Twinge effect -->
    <line x1="50" y1="150" x2="70" y2="170" class="image" />
    <line x1="50" y1="150" x2="30" y2="170" class="image" />
    <line x1="50" y1="150" x2="50" y2="190" class="image" />
  </g>
</svg>