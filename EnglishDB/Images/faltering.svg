<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">faltering</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːltərɪŋ] adj. 蹒跚的，犹豫的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> falter (蹒跚，犹豫) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在黑暗中行走，"蹒跚(falter)"
    <tspan x="50" dy="25">不前，每一步都显得犹豫不决。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The faltering economy is causing many businesses to close.
  </text>
  <text x="50" y="310" class="content">
    经济的不稳定导致许多企业倒闭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark path -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person faltering -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Another step -->
    <circle cx="100" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
  </g>
</svg>