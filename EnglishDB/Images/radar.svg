<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">radar</text>
  <text x="50" y="120" class="subtitle">[ˈreɪdɑːr] n. 雷达</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> radio (无线电) + detection (探测) + ranging (测距)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的雷达天线在旋转，"无线电波(radio)"
    <tspan x="50" dy="25">从天线发射出去，探测(detection)并测距(ranging)目标，</tspan>
    <tspan x="50" dy="25">这就是雷达(radar)的工作原理。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The radar detected an incoming aircraft.
  </text>
  <text x="50" y="310" class="content">
    雷达探测到一架正在接近的飞机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Radar dish -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="20" x2="155" y2="50" class="image" />
    <line x1="175" y1="20" x2="195" y2="50" class="image" />
    <!-- Waves -->
    <circle cx="175" cy="100" r="100" class="image" />
    <circle cx="175" cy="100" r="120" class="image" />
    <circle cx="175" cy="100" r="140" class="image" />
    <!-- Target -->
    <circle cx="300" cy="100" r="10" class="image" />
  </g>
</svg>