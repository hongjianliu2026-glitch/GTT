<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">watershed</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːtərʃed] n. 分水岭，转折点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> water (水) + shed (分开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流在山脉中流淌，"水分开(water-shed)"
    <tspan x="50" dy="25">的地方形成了分水岭，标志着河流的分界线。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The invention of the internet was a watershed moment in history.
  </text>
  <text x="50" y="310" class="content">
    互联网的发明是历史上的一个转折点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,100 L100,0 L200,100 Z" class="image" />
    <!-- River -->
    <path d="M50,100 Q100,50 150,100" class="image" />
    <!-- Watershed line -->
    <line x1="100" y1="0" x2="100" y2="100" class="image" />
    <!-- Water drops -->
    <circle cx="75" cy="80" r="5" class="image" />
    <circle cx="125" cy="80" r="5" class="image" />
    <circle cx="100" cy="50" r="5" class="image" />
  </g>
</svg>