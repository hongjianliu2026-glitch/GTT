<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">judge</text>
  <text x="50" y="120" class="subtitle">[dʒʌdʒ] v. 判断，审判；n. 法官</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jud (法律) + -ge (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官坐在法庭上，手持法槌，"依法(jud)"
    <tspan x="50" dy="25">做出公正的"行为(-ge)"，这就是判断(judge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge made a fair decision in the case.
  </text>
  <text x="50" y="310" class="content">
    法官在案件中做出了公正的判决。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge's bench -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Gavel -->
    <rect x="100" y="120" width="50" height="20" class="image" />
    <line x1="125" y1="140" x2="125" y2="180" class="image" />
    <!-- Courtroom -->
    <rect x="180" y="100" width="150" height="100" class="image" />
    <line x1="200" y1="120" x2="320" y2="120" class="image" />
    <line x1="200" y1="140" x2="320" y2="140" class="image" />
    <line x1="200" y1="160" x2="320" y2="160" class="image" />
  </g>
</svg>