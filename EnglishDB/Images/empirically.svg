<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">empirically</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpɪrɪkli] adv. 以经验为主地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (进入) + pir (尝试) + -ical (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"通过尝试(pir)"
    <tspan x="50" dy="25">和实验来验证理论，这种基于经验(em-pir-ical-ly)的方法</tspan>
    <tspan x="50" dy="25">就是以经验为主地(empirically)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The results were confirmed empirically through numerous experiments.
  </text>
  <text x="50" y="310" class="content">
    结果通过多次实验得到了经验上的证实。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Laboratory -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Beakers -->
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <circle cx="160" cy="60" r="10" class="image" />
    <!-- Flames -->
    <polyline points="90,80 100,90 90,100" class="image" />
    <polyline points="130,80 140,90 130,100" class="image" />
    <polyline points="170,80 180,90 170,100" class="image" />
  </g>
</svg>