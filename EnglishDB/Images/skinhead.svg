<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skinhead</text>
  <text x="50" y="120" class="subtitle">[ˈskɪnhed] n. 光头党</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skin (皮肤) + head (头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个光头党成员，"皮肤(skin)"直接暴露在"头(head)"上，
    <tspan x="50" dy="25">没有头发的遮挡，显得格外醒目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The skinhead was easily recognizable due to his bald head.
  </text>
  <text x="50" y="310" class="content">
    那个光头党成员因为他的秃头很容易被认出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="130" x2="120" y2="130" class="image" />
    <!-- Baldness -->
    <rect x="40" y="40" width="120" height="60" class="image" />
  </g>
</svg>