<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #E67E22; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .glow { fill: #F1C40F; stroke: #F39C12; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">firefly</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪərˌflaɪ] n. 萤火虫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fire (火) + fly (飞)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只萤火虫在夜空中飞舞，"火(fire)"
    <tspan x="50" dy="25">光闪烁，就像一只会飞的火焰(firefly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fireflies lit up the night sky like tiny stars.
  </text>
  <text x="50" y="310" class="content">
    萤火虫像小星星一样点亮了夜空。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Firefly body -->
    <circle cx="100" cy="100" r="20" class="glow" />
    <!-- Firefly wings -->
    <line x1="80" y1="90" x2="60" y2="70" class="image" />
    <line x1="120" y1="90" x2="140" y2="70" class="image" />
    <line x1="80" y1="110" x2="60" y2="130" class="image" />
    <line x1="120" y1="110" x2="140" y2="130" class="image" />
    <!-- Firefly glow -->
    <circle cx="100" cy="100" r="10" class="glow" />
  </g>
</svg>