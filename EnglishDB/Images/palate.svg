<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">palate</text>
  <text x="50" y="120" class="subtitle">[ˈpælət] n. 上颚，味觉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> palat (上颚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个美食家在品尝美食时，"上颚(palat)"
    <tspan x="50" dy="25">感受到的美妙滋味，这就是他的味觉(palate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a refined palate for fine wines.
  </text>
  <text x="50" y="310" class="content">
    她对美酒有着敏锐的味觉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Upper palate -->
    <rect x="50" y="20" width="250" height="80" class="image" />
    <!-- Tongue -->
    <rect x="50" y="100" width="250" height="80" class="image" />
    <!-- Food -->
    <circle cx="150" cy="60" r="20" class="image" />
    <circle cx="200" cy="60" r="20" class="image" />
    <circle cx="250" cy="60" r="20" class="image" />
    <!-- Smiley face -->
    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="190" y1="145" x2="210" y2="145" class="image" />
    <line x1="190" y1="155" x2="210" y2="155" class="image" />
    <line x1="190" y1="165" x2="210" y2="165" class="image" />
  </g>
</svg>