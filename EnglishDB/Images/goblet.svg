<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">goblet</text>
  <text x="50" y="120" class="subtitle">[ˈɡɒblɪt] n. 高脚杯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gob (嘴) + let (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的嘴巴(gob)，里面放着一个精致的小杯子(let)，
    <tspan x="50" dy="25">这个杯子就是高脚杯(goblet)，用来盛放美酒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She held the goblet with both hands, savoring the wine.
  </text>
  <text x="50" y="310" class="content">
    她双手捧着高脚杯，细细品味着美酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Goblet -->
    <rect x="50" y="20" width="100" height="150" class="image" />
    <rect x="75" y="20" width="50" height="150" class="image" />
    <rect x="90" y="20" width="20" height="150" class="image" />
    <!-- Mouth -->
    <circle cx="100" cy="200" r="50" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
  </g>
</svg>