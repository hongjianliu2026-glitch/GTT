<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impact</text>
  <text x="50" y="120" class="subtitle">[ˈɪmpækt] n. 影响，冲击；v. 对…产生影响</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + pact (压)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的陨石"压入(im-pact)"地球，
    <tspan x="50" dy="25">产生了巨大的冲击和影响(impact)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The impact of the new policy was significant.
  </text>
  <text x="50" y="310" class="content">
    新政策的影响是显著的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meteor -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Earth -->
    <ellipse cx="300" cy="100" rx="100" ry="50" class="image" />
    <!-- Impact line -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <!-- Impact effect -->
    <circle cx="250" cy="100" r="20" class="image" />
  </g>
</svg>