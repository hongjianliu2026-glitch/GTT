<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crowded</text>
  <text x="50" y="120" class="subtitle">[ˈkraʊdɪd] adj. 拥挤的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crowd (人群) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狭窄的街道上，"人群(crowd)"
    <tspan x="50" dy="25">挤满了每一个角落，街道变得"拥挤(crowded)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The subway was so crowded that I could hardly move.
  </text>
  <text x="50" y="310" class="content">
    地铁非常拥挤，我几乎无法移动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="110" cy="55" r="10" class="image" />
    <circle cx="140" cy="65" r="10" class="image" />
    <circle cx="170" cy="50" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <circle cx="230" cy="55" r="10" class="image" />
    <circle cx="260" cy="65" r="10" class="image" />
    <circle cx="290" cy="50" r="10" class="image" />
    <circle cx="320" cy="60" r="10" class="image" />
    <circle cx="350" cy="55" r="10" class="image" />
    <circle cx="380" cy="65" r="10" class="image" />
  </g>
</svg>