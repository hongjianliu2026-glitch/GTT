<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pathology</text>
  <text x="50" y="120" class="subtitle">[pəˈθɑːlədʒi] n. 病理学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> patho- (疾病) + -logy (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在显微镜下研究"疾病(patho)"的"学科(logy)"，
    <tspan x="50" dy="25">这就是病理学(pathology)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pathology report confirmed the diagnosis.
  </text>
  <text x="50" y="310" class="content">
    病理报告证实了诊断。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microscope -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="150" class="image" />
    <!-- Slide with disease cells -->
    <rect x="120" y="80" width="150" height="100" class="image" />
    <circle cx="150" cy="130" r="10" class="image" />
    <circle cx="180" cy="130" r="10" class="image" />
    <circle cx="210" cy="130" r="10" class="image" />
    <!-- Doctor -->
    <circle cx="20" cy="250" r="15" class="image" />
    <line x1="20" y1="265" x2="20" y2="300" class="image" />
    <line x1="20" y1="300" x2="0" y2="330" class="image" />
    <line x1="20" y1="300" x2="40" y2="330" class="image" />
    <line x1="20" y1="280" x2="50" y2="270" class="image" />
  </g>
</svg>