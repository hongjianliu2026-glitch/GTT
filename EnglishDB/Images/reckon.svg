<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reckon</text>
  <text x="50" y="120" class="subtitle">[ˈrɛkən] v. 计算，认为，估计</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + -ckon (计算)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个会计师在反复计算(re-ckon)账目，
    <tspan x="50" dy="25">确保每一笔账都准确无误。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I reckon it will take about two hours to finish this task.
  </text>
  <text x="50" y="310" class="content">
    我估计完成这项任务大约需要两个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Accountant -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Calculator -->
    <rect x="50" y="20" width="150" height="100" class="image" />
    <line x1="70" y1="50" x2="200" y2="50" class="image" />
    <line x1="70" y1="80" x2="200" y2="80" class="image" />
    <line x1="70" y1="110" x2="200" y2="110" class="image" />
    <!-- Numbers -->
    <text x="80" y="70" class="content">1</text>
    <text x="110" y="70" class="content">2</text>
    <text x="140" y="70" class="content">3</text>
    <text x="80" y="100" class="content">4</text>
    <text x="110" y="100" class="content">5</text>
    <text x="140" y="100" class="content">6</text>
    <text x="80" y="130" class="content">7</text>
    <text x="110" y="130" class="content">8</text>
    <text x="140" y="130" class="content">9</text>
    <text x="170" y="100" class="content">0</text>
  </g>
</svg>