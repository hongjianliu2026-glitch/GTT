<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">material</text>
  <text x="50" y="120" class="subtitle">[məˈtɪəriəl] n. 材料，物质；adj. 物质的，实质性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> materi (母亲) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"母亲(materi)"，她身上覆盖着各种"材料(material)"，
    <tspan x="50" dy="25">这些材料构成了我们周围的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The architect chose sustainable materials for the new building.
  </text>
  <text x="50" y="310" class="content">
    建筑师为新建筑选择了可持续材料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mother figure -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="200" class="image" />
    <line x1="100" y1="180" x2="150" y2="200" class="image" />

    <!-- Materials -->
    <rect x="20" y="320" width="30" height="30" class="image" />
    <rect x="70" y="320" width="30" height="30" class="image" />
    <rect x="120" y="320" width="30" height="30" class="image" />
    <rect x="170" y="320" width="30" height="30" class="image" />
    <rect x="220" y="320" width="30" height="30" class="image" />
  </g>
</svg>