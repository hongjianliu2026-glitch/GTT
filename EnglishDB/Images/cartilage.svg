<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cartilage</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrtɪlɪdʒ] n. 软骨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cartil- (软骨) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的软骨(cartilage)桥，连接着两座山峰，
    <tspan x="50" dy="25">人们在上面行走，感受着它的柔软与弹性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor examined the cartilage in his knee.
  </text>
  <text x="50" y="310" class="content">
    医生检查了他膝盖中的软骨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cartilage bridge -->
    <path d="M0 100 Q 100 50 200 100 T 400 100" class="image" />
    <path d="M0 120 Q 100 170 200 120 T 400 120" class="image" />
    <!-- Mountains -->
    <polygon points="0,100 50,50 100,100" class="image" />
    <polygon points="300,100 350,50 400,100" class="image" />
    <!-- People walking -->
    <circle cx="50" cy="110" r="5" class="image" />
    <circle cx="100" cy="110" r="5" class="image" />
    <circle cx="150" cy="110" r="5" class="image" />
    <circle cx="200" cy="110" r="5" class="image" />
    <circle cx="250" cy="110" r="5" class="image" />
    <circle cx="300" cy="110" r="5" class="image" />
    <circle cx="350" cy="110" r="5" class="image" />
  </g>
</svg>