<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .scarlet { fill: #FF2400; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scarlet</text>
  <text x="50" y="120" class="subtitle">[ˈskɑːrlət] adj. 猩红色的，鲜红色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scarlat- (猩红色)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着猩红色(scarlet)斗篷的骑士，
    <tspan x="50" dy="25">他的斗篷在阳光下闪耀，仿佛燃烧的火焰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a beautiful dress in scarlet.
  </text>
  <text x="50" y="310" class="content">
    她穿了一件猩红色的漂亮裙子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Knight -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="160" class="image" />
    <line x1="50" y1="120" x2="70" y2="160" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Scarlet Cape -->
    <path d="M 50 70 Q 100 30 150 70 L 150 120 Q 100 160 50 120 Z" class="scarlet" />
  </g>
</svg>