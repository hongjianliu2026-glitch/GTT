<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eyebrow</text>
  <text x="50" y="120" class="subtitle">[ˈaɪbraʊ] n. 眉毛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eye (眼睛) + brow (眉毛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在镜子前，用眉笔"画出(brow)"
    <tspan x="50" dy="25">两条眉毛(eyebrow)，就像在眼睛(eye)上画了两条线。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully shaped her eyebrows before going out.
  </text>
  <text x="50" y="310" class="content">
    她出门前仔细地修整了眉毛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="15" class="image" />
    <circle cx="140" cy="80" r="15" class="image" />
    <!-- Eyebrows -->
    <line x1="30" y1="50" x2="90" y2="50" class="image" />
    <line x1="110" y1="50" x2="170" y2="50" class="image" />
  </g>
</svg>