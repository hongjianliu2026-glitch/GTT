<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fuzzy</text>
  <text x="50" y="120" class="subtitle">[ˈfʌzi] adj. 模糊的，绒毛状的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fuzz (绒毛) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫，全身覆盖着"绒毛(fuzz)"，
    <tspan x="50" dy="25">看起来毛茸茸的，非常"模糊(fuzzy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The edges of the photo were fuzzy.
  </text>
  <text x="50" y="310" class="content">
    照片的边缘是模糊的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Cat head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Cat ears -->
    <polygon points="80,30 70,10 90,10" class="image" />
    <polygon points="120,30 110,10 130,10" class="image" />
    <!-- Cat eyes -->
    <circle cx="90" cy="50" r="5" class="image" />
    <circle cx="110" cy="50" r="5" class="image" />
    <!-- Cat nose -->
    <circle cx="100" cy="60" r="3" class="image" />
    <!-- Cat whiskers -->
    <line x1="70" y1="60" x2="50" y2="60" class="image" />
    <line x1="130" y1="60" x2="150" y2="60" class="image" />
    <line x1="70" y1="70" x2="50" y2="75" class="image" />
    <line x1="130" y1="70" x2="150" y2="75" class="image" />
    <!-- Fuzzy effect -->
    <circle cx="100" cy="100" r="55" class="image" stroke-dasharray="5,5" />
    <circle cx="100" cy="50" r="35" class="image" stroke-dasharray="5,5" />
  </g>
</svg>