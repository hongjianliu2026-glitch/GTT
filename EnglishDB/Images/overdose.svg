<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overdose</text>
  <text x="50" y="120" class="subtitle">[ˈoʊvərdoʊs] n. 过量用药；v. 用药过量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (超过) + dose (剂量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着药瓶，"超过(over)"
    <tspan x="50" dy="25">正常剂量(dose)，结果不小心用药过量(overdose)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He accidentally overdosed on painkillers.
  </text>
  <text x="50" y="310" class="content">
    他不小心服用了过量的止痛药。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <!-- Pills -->
    <circle cx="20" cy="20" r="10" class="image" />
    <circle cx="50" cy="20" r="10" class="image" />
    <circle cx="80" cy="20" r="10" class="image" />
    <circle cx="20" cy="50" r="10" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="20" cy="80" r="10" class="image" />
    <circle cx="50" cy="80" r="10" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Overdose symbol -->
    <text x="120" y="250" class="highlight" font-size="48">!</text>
  </g>
</svg>