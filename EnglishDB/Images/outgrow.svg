<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outgrow</text>
  <text x="50" y="120" class="subtitle">[ˌaʊtˈɡroʊ] v. 长大得使...不再适用，超过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (超过) + grow (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子迅速长大，"超过(out-)"
    <tspan x="50" dy="25">了他曾经穿过的衣服，这些衣服对他来说已经不再适用(outgrow)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has outgrown her old bicycle.
  </text>
  <text x="50" y="310" class="content">
    她已经长得超过了她旧自行车的尺寸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small child -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />

    <!-- Big child -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="190" class="image" />
    <line x1="250" y1="190" x2="220" y2="240" class="image" />
    <line x1="250" y1="190" x2="280" y2="240" class="image" />
    <line x1="250" y1="160" x2="300" y2="150" class="image" />

    <!-- Clothes -->
    <rect x="30" y="160" width="40" height="40" class="image" />
    <rect x="220" y="190" width="60" height="60" class="image" />

    <!-- Arrows -->
    <line x1="90" y1="120" x2="210" y2="120" class="image" />
    <polygon points="210,120 200,110 200,130" class="image" />
  </g>
</svg>