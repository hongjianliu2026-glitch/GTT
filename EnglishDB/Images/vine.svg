<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vine</text>
  <text x="50" y="120" class="subtitle">[vaɪn] n. 藤，蔓；葡萄树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vin- (葡萄)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片葡萄园，葡萄藤(vine)
    <tspan x="50" dy="25">蜿蜒生长，结满了紫色的葡萄。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vineyard was filled with vines.
  </text>
  <text x="50" y="310" class="content">
    葡萄园里长满了葡萄藤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Vine -->
    <path d="M0,100 C50,50 150,50 200,100 S300,150 350,100" class="image" />
    <!-- Grapes -->
    <circle cx="100" cy="100" r="10" fill="#8E44AD" />
    <circle cx="150" cy="120" r="10" fill="#8E44AD" />
    <circle cx="200" cy="100" r="10" fill="#8E44AD" />
    <circle cx="250" cy="120" r="10" fill="#8E44AD" />
    <circle cx="300" cy="100" r="10" fill="#8E44AD" />
  </g>
</svg>