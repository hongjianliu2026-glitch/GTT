<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snuff</text>
  <text x="50" y="120" class="subtitle">[snʌf] n. 鼻烟；v. 掐灭，熄灭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sn- (鼻子) + -uff (烟)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在吸鼻烟，"鼻子吸入(sn-uff)"
    <tspan x="50" dy="25">烟雾，这种烟雾就是鼻烟(snuff)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He took a pinch of snuff from his tin.
  </text>
  <text x="50" y="310" class="content">
    他从罐子里取了一撮鼻烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nose -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Smoke -->
    <line x1="80" y1="80" x2="120" y2="40" class="image" />
    <line x1="80" y1="80" x2="140" y2="60" class="image" />
    <line x1="80" y1="80" x2="160" y2="80" class="image" />
    <!-- Snuff tin -->
    <rect x="180" y="80" width="80" height="60" class="image" />
    <!-- Snuff -->
    <line x1="200" y1="100" x2="220" y2="100" class="image" />
    <line x1="200" y1="120" x2="220" y2="120" class="image" />
    <line x1="200" y1="140" x2="220" y2="140" class="image" />
  </g>
</svg>