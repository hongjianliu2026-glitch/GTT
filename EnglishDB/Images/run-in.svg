<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">run-in</text>
  <text x="50" y="120" class="subtitle">[ˈrʌn ɪn] n. 冲突，争吵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> run (跑) + in (进入)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在街上"跑进(run-in)"彼此，结果发生了激烈的争吵。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They had a run-in with the neighbors over the fence.
  </text>
  <text x="50" y="310" class="content">
    他们因为篱笆和邻居发生了争吵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Street -->
    <rect x="0" y="100" width="350" height="50" class="image" />
    <!-- Person 1 running -->
    <circle cx="50" cy="90" r="15" class="image" />
    <line x1="50" y1="105" x2="50" y2="140" class="image" />
    <line x1="50" y1="140" x2="30" y2="170" class="image" />
    <line x1="50" y1="140" x2="70" y2="170" class="image" />
    <line x1="50" y1="120" x2="80" y2="110" class="image" />
    <!-- Person 2 running -->
    <circle cx="300" cy="90" r="15" class="image" />
    <line x1="300" y1="105" x2="300" y2="140" class="image" />
    <line x1="300" y1="140" x2="280" y2="170" class="image" />
    <line x1="300" y1="140" x2="320" y2="170" class="image" />
    <line x1="300" y1="120" x2="270" y2="110" class="image" />
    <!-- Collision -->
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <circle cx="175" cy="150" r="10" class="image" />
  </g>
</svg>