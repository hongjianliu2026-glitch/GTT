<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ideal</text>
  <text x="50" y="120" class="subtitle">[aɪˈdiːəl] n. 理想；adj. 理想的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ide (思想) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完美的世界，"思想(ide)"中的一切都是"理想的(ideal)"。
    <tspan x="50" dy="25">在这个世界里，每个人都能实现自己的梦想。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has high ideals and always strives for perfection.
  </text>
  <text x="50" y="310" class="content">
    她有很高的理想，总是追求完美。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Perfect world -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Sun -->
    <circle cx="175" cy="50" r="20" class="image" />
    <!-- Mountains -->
    <polyline points="50,180 100,120 150,180" class="image" />
    <polyline points="100,180 150,120 200,180" class="image" />
    <polyline points="150,180 200,120 250,180" class="image" />
    <!-- River -->
    <line x1="50" y1="200" x2="250" y2="200" class="image" />
    <!-- Trees -->
    <line x1="70" y1="180" x2="70" y2="150" class="image" />
    <line x1="80" y1="180" x2="80" y2="140" class="image" />
    <line x1="90" y1="180" x2="90" y2="160" class="image" />
    <line x1="210" y1="180" x2="210" y2="150" class="image" />
    <line x1="220" y1="180" x2="220" y2="140" class="image" />
    <line x1="230" y1="180" x2="230" y2="160" class="image" />
  </g>
</svg>