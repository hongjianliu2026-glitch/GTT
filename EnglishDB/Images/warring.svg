<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warring</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːrɪŋ] adj. 交战的，敌对的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> war (战争) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个国家在激烈地"交战(warring)"，
    <tspan x="50" dy="25">战火纷飞，士兵们手持武器，紧张对峙。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two nations have been warring for decades.
  </text>
  <text x="50" y="310" class="content">
    这两个国家已经交战了几十年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soldiers -->
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="250" y1="50" x2="300" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="50" class="image" />
    <!-- Explosions -->
    <circle cx="150" cy="75" r="20" class="image" />
    <circle cx="200" cy="75" r="20" class="image" />
    <!-- Smoke -->
    <path d="M100,150 Q150,100 200,150 T300,150" class="image" />
  </g>
</svg>