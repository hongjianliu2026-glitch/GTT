<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forensic</text>
  <text x="50" y="120" class="subtitle">[fəˈrɛnsɪk] adj. 法庭的，法医的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (前面) + nsic (知道)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法医在法庭上，"提前知道(fore-nsic)"
    <tspan x="50" dy="25">案件的真相，用科学的方法揭示证据。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forensic expert analyzed the bloodstains at the crime scene.
  </text>
  <text x="50" y="310" class="content">
    法医专家分析了犯罪现场的血迹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Forensic expert -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Microscope -->
    <rect x="100" y="100" width="50" height="30" class="image" />
    <line x1="125" y1="130" x2="125" y2="150" class="image" />
    <line x1="125" y1="150" x2="100" y2="170" class="image" />
    <line x1="125" y1="150" x2="150" y2="170" class="image" />
  </g>
</svg>