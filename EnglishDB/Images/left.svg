<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">left</text>
  <text x="50" y="120" class="subtitle">[left] adj. 左边的；n. 左边</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> left (来自古英语 "lyft"，意为"弱"或"无力")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用右手（强壮的手）写字，而左手（left）
    <tspan x="50" dy="25">则显得"弱"或"无力"，因此"left"就成了左边的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please move to the left side of the road.
  </text>
  <text x="50" y="310" class="content">
    请移到路的左边。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Left side -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <text x="60" y="120" class="content">left</text>
    <!-- Right side -->
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
    <text x="250" y="120" class="content">right</text>
  </g>
</svg>