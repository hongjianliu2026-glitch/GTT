<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ever-increasing</text>
  <text x="50" y="120" class="subtitle">[ˈɛvər ɪnˈkriːsɪŋ] adj. 不断增长的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ever- (总是) + increase (增加)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球，"总是(ever)"在"增加(increase)"
    <tspan x="50" dy="25">体积，变得越来越膨胀，这就是不断增长的(ever-increasing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The demand for renewable energy is ever-increasing.
  </text>
  <text x="50" y="310" class="content">
    对可再生能源的需求不断增长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="60" class="image" />
    <circle cx="100" cy="100" r="70" class="image" />
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- String -->
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
  </g>
</svg>