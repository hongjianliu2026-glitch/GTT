<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quake</text>
  <text x="50" y="120" class="subtitle">[kweɪk] v. 震动，颤抖；n. 地震</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quake (源自中古英语，意为震动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场强烈的地震，地面"震动(quake)"得像果冻一样，
    <tspan x="50" dy="25">建筑物摇摇欲坠，人们惊慌失措。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ground quaked beneath their feet.
  </text>
  <text x="50" y="310" class="content">
    地面在他们脚下震动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Buildings -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="40" width="50" height="80" class="image" />
    <rect x="190" y="60" width="50" height="60" class="image" />
    <!-- Quaking effect -->
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <!-- People -->
    <circle cx="70" cy="180" r="10" class="image" />
    <circle cx="140" cy="160" r="10" class="image" />
    <circle cx="210" cy="140" r="10" class="image" />
  </g>
</svg>