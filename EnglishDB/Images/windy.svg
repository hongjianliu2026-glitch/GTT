<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">windy</text>
  <text x="50" y="120" class="subtitle">[ˈwɪndi] adj. 多风的，风大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wind (风) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个风大的日子，"风(wind)"
    <tspan x="50" dy="25">吹得树叶四处飘散，整个场景都充满了风的气息(windy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was a windy day, and the trees were swaying.
  </text>
  <text x="50" y="310" class="content">
    那天风很大，树都在摇摆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Windy scene -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="20" x2="350" y2="220" class="image" />
    <line x1="0" y1="40" x2="350" y2="240" class="image" />
    <line x1="0" y1="60" x2="350" y2="260" class="image" />
    <line x1="0" y1="80" x2="350" y2="280" class="image" />
    <line x1="0" y1="100" x2="350" y2="300" class="image" />
    <line x1="0" y1="120" x2="350" y2="320" class="image" />
    <line x1="0" y1="140" x2="350" y2="340" class="image" />
    <line x1="0" y1="160" x2="350" y2="360" class="image" />
    <line x1="0" y1="180" x2="350" y2="380" class="image" />
    <line x1="0" y1="200" x2="350" y2="400" class="image" />
    <!-- Leaves -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="90" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
  </g>
</svg>