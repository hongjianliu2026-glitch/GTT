<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">freely</text>
  <text x="50" y="120" class="subtitle">[ˈfriːli] adv. 自由地，随意地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> free (自由) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在天空中"自由地(free-ly)"飞翔，
    <tspan x="50" dy="25">没有任何束缚，尽情享受自由的快乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke freely about her experiences.
  </text>
  <text x="50" y="310" class="content">
    她随意地谈论了她的经历。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bird -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="80" x2="30" y2="70" class="image" />
    <line x1="50" y1="80" x2="70" y2="70" class="image" />
    <line x1="50" y1="100" x2="30" y2="110" class="image" />
    <line x1="50" y1="100" x2="70" y2="110" class="image" />
    <!-- Clouds -->
    <ellipse cx="200" cy="30" rx="50" ry="20" class="image" />
    <ellipse cx="250" cy="60" rx="40" ry="15" class="image" />
  </g>
</svg>