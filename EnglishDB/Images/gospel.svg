<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gospel</text>
  <text x="50" y="120" class="subtitle">[ˈɡɒspəl] n. 福音，真理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gos- (说) + pel (传送)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个传教士在教堂里，"传送(pel)"
    <tspan x="50" dy="25">上帝的"话语(gos)"，这就是福音(gospel)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The preacher delivered the gospel to the congregation.
  </text>
  <text x="50" y="310" class="content">
    传教士向会众传讲福音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cross -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <!-- Preacher -->
    <circle cx="175" cy="120" r="15" class="image" />
    <line x1="175" y1="135" x2="175" y2="170" class="image" />
    <line x1="175" y1="170" x2="155" y2="200" class="image" />
    <line x1="175" y1="170" x2="195" y2="200" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M220,100 Q250,90 250,120 Q220,110 220,100" class="image" />
    <text x="230" y="115" class="content" style="font-size: 14px;">Gospel</text>
  </g>
</svg>