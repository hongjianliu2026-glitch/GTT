<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">widespread</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪdspred] adj. 普遍的，广泛的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wide (宽的) + spread (传播)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张巨大的网，"宽广地传播(wide-spread)"
    <tspan x="50" dy="25">开来，覆盖了整个区域，这就是普遍的(widespread)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flu is widespread during winter.
  </text>
  <text x="50" y="310" class="content">
    流感在冬季很普遍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wide spread -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
    <line x1="0" y1="240" x2="350" y2="240" class="image" />
    <line x1="0" y1="260" x2="350" y2="260" class="image" />
    <line x1="0" y1="280" x2="350" y2="280" class="image" />
    <line x1="0" y1="300" x2="350" y2="300" class="image" />
    <line x1="0" y1="320" x2="350" y2="320" class="image" />
    <line x1="0" y1="340" x2="350" y2="340" class="image" />
    <line x1="0" y1="360" x2="350" y2="360" class="image" />
    <line x1="0" y1="380" x2="350" y2="380" class="image" />
    <line x1="0" y1="400" x2="350" y2="400" class="image" />
    <line x1="0" y1="420" x2="350" y2="420" class="image" />
    <line x1="0" y1="440" x2="350" y2="440" class="image" />
    <line x1="0" y1="460" x2="350" y2="460" class="image" />
    <line x1="0" y1="480" x2="350" y2="480" class="image" />
    <line x1="0" y1="500" x2="350" y2="500" class="image" />
    <line x1="0" y1="520" x2="350" y2="520" class="image" />
    <line x1="0" y1="540" x2="350" y2="540" class="image" />
    <line x1="0" y1="560" x2="350" y2="560" class="image" />
    <line x1="0" y1="580" x2="350" y2="580" class="image" />
    <line x1="0" y1="600" x2="350" y2="600" class="image" />
  </g>
</svg>