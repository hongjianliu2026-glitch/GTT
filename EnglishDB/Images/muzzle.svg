<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">muzzle</text>
  <text x="50" y="120" class="subtitle">[ˈmʌzl] n. 口套，枪口；v. 给...戴口套，限制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> muzz (嘴) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小狗被戴上了一个"小嘴套(muzz-le)"，
    <tspan x="50" dy="25">它再也不能乱叫了，这就是muzzle的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog was given a muzzle to prevent it from barking.
  </text>
  <text x="50" y="310" class="content">
    为了防止狗叫，给它戴上了口套。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Muzzle -->
    <rect x="70" y="80" width="60" height="20" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Nose -->
    <circle cx="100" cy="110" r="8" class="image" />
  </g>
</svg>