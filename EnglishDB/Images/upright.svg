<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">upright</text>
  <text x="50" y="120" class="subtitle">[ˈʌpraɪt] adj. 直立的，正直的；adv. 笔直地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + right (直的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"向上(up)"挺直"直的(right)"身体，
    <tspan x="50" dy="25">就像一棵笔直的树，这就是upright的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stood upright, facing the challenge head-on.
  </text>
  <text x="50" y="310" class="content">
    她笔直地站着，直面挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Upright person -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="50" x2="30" y2="80" class="image" /> <!-- Left arm -->
    <line x1="50" y1="50" x2="70" y2="80" class="image" /> <!-- Right arm -->
    <line x1="50" y1="150" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <circle cx="50" cy="10" r="10" class="image" /> <!-- Head -->
  </g>
</svg>