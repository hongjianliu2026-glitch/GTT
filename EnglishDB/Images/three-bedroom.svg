<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-bedroom</text>
  <text x="50" y="120" class="subtitle">[θriːˈbɛdˌrum] n. 三居室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + bedroom (卧室)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房子里有三个卧室，每个卧室都有一张床，
    <tspan x="50" dy="25">这就是一个典型的三居室(three-bedroom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They bought a three-bedroom house last year.
  </text>
  <text x="50" y="310" class="content">
    他们去年买了一套三居室的房子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Three bedrooms -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <rect x="170" y="20" width="100" height="80" class="image" />
    <rect x="290" y="20" width="100" height="80" class="image" />
    <!-- Beds in each bedroom -->
    <line x1="60" y1="40" x2="140" y2="40" class="image" />
    <line x1="60" y1="60" x2="140" y2="60" class="image" />
    <line x1="180" y1="40" x2="260" y2="40" class="image" />
    <line x1="180" y1="60" x2="260" y2="60" class="image" />
    <line x1="300" y1="40" x2="380" y2="40" class="image" />
    <line x1="300" y1="60" x2="380" y2="60" class="image" />
  </g>
</svg>