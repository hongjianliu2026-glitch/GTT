<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inefficiency</text>
  <text x="50" y="120" class="subtitle">[ˌɪnɪˈfɪʃənsi] n. 无效率，效率低下</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + ef- (出) + fic (做) + -iency (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人试图"做出(fic)"东西，但因为"不(in)"能"有效(ef)"地工作，
    <tspan x="50" dy="25">结果东西做得很慢，这就是"无效率(inefficiency)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's inefficiency led to significant financial losses.
  </text>
  <text x="50" y="310" class="content">
    公司的效率低下导致了严重的财务损失。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Worker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Slow progress -->
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <line x1="70" y1="130" x2="250" y2="130" class="image" />
    <line x1="70" y1="160" x2="270" y2="160" class="image" />
    <line x1="70" y1="190" x2="240" y2="190" class="image" />
    <!-- Slow clock -->
    <circle cx="350" cy="100" r="30" class="image" />
    <line x1="350" y1="100" x2="350" y2="70" class="image" />
    <line x1="350" y1="100" x2="370" y2="100" class="image" />
  </g>
</svg>