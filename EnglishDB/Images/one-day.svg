<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">one-day</text>
  <text x="50" y="120" class="subtitle">[ˈwʌn deɪ] adj. 一天的，一日的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> one (一) + day (天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的日历，上面只有"一天(one-day)"
    <tspan x="50" dy="25">被高亮显示，这一天充满了特别的活动和记忆。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had a one-day trip to the beach.
  </text>
  <text x="50" y="310" class="content">
    我们进行了一次一日海滩游。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Day 1 -->
    <rect x="50" y="20" width="50" height="50" class="image" fill="#F1C40F" />
    <text x="75" y="50" class="content" text-anchor="middle">1</text>
    <!-- Special day -->
    <circle cx="75" cy="45" r="10" class="image" fill="#E74C3C" />
    <!-- Activities -->
    <line x1="100" y1="30" x2="150" y2="30" class="image" />
    <line x1="100" y1="40" x2="150" y2="40" class="image" />
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="60" x2="150" y2="60" class="image" />
    <line x1="100" y1="70" x2="150" y2="70" class="image" />
  </g>
</svg>