<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ticker</text>
  <text x="50" y="120" class="subtitle">[ˈtɪkər] n. 股票行情显示器，滴答声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tick (滴答声) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个股票交易大厅，"滴答声(tick)"
    <tspan x="50" dy="25">不断传来，显示器(ticker)上实时滚动着股票价格。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ticker on the wall showed the latest stock prices.
  </text>
  <text x="50" y="310" class="content">
    墙上的股票行情显示器显示了最新的股票价格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ticker machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Screen -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Moving text -->
    <text x="60" y="100" class="content" style="animation: scroll 10s linear infinite;">
      <tspan>AAPL: $150.25</tspan>
      <tspan x="60" dy="25">GOOG: $2800.50</tspan>
      <tspan x="60" dy="25">TSLA: $750.75</tspan>
    </text>
    <!-- Ticker sound -->
    <circle cx="20" cy="180" r="10" class="image" />
    <circle cx="40" cy="180" r="10" class="image" />
    <circle cx="60" cy="180" r="10" class="image" />
  </g>
</svg>