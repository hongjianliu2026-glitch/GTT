<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hypertension</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪpərˈtenʃn] n. 高血压</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hyper- (过度) + tens (拉紧) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球被"过度拉紧(hyper-tens)"，
    <tspan x="50" dy="25">结果气球内部的压力急剧上升，这就是高血压(hypertension)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was diagnosed with hypertension after a routine check-up.
  </text>
  <text x="50" y="310" class="content">
    在一次常规体检后，他被诊断出患有高血压。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Pressure gauge -->
    <rect x="160" y="50" width="100" height="100" class="image" />
    <line x1="180" y1="50" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="260" y2="150" class="image" />
    <line x1="260" y1="150" x2="260" y2="50" class="image" />
    <line x1="260" y1="50" x2="180" y2="50" class="image" />
    <!-- High pressure indicator -->
    <line x1="220" y1="50" x2="220" y2="100" class="image" />
    <line x1="220" y1="100" x2="240" y2="100" class="image" />
    <line x1="240" y1="100" x2="240" y2="50" class="image" />
    <line x1="240" y1="50" x2="220" y2="50" class="image" />
  </g>
</svg>