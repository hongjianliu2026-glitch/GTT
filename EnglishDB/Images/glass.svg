<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glass</text>
  <text x="50" y="120" class="subtitle">[ɡlæs] n. 玻璃，玻璃杯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gl- (光) + ass (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个透明的玻璃杯，"光(gl-)"
    <tspan x="50" dy="25">穿过它，映射出美丽的色彩，这就是玻璃(glass)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She drank water from a glass.
  </text>
  <text x="50" y="310" class="content">
    她用玻璃杯喝水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Glass -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="25" y="25" width="100" height="150" class="image" />
    <!-- Water -->
    <rect x="30" y="30" width="90" height="140" fill="#85C1E9" />
    <!-- Light reflection -->
    <line x1="30" y1="30" x2="120" y2="170" class="image" />
    <line x1="30" y1="170" x2="120" y2="30" class="image" />
  </g>
</svg>