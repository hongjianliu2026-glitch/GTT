<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meeting</text>
  <text x="50" y="120" class="subtitle">[ˈmiːtɪŋ] n. 会议，会面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meet (遇见) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一个房间里，"遇见(meet)"
    <tspan x="50" dy="25">并讨论事情，这就是一个会议(meeting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We have a meeting scheduled for 3 PM.
  </text>
  <text x="50" y="310" class="content">
    我们安排了一个下午3点的会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- People -->
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="220" cy="100" r="15" class="image" />
    <circle cx="290" cy="100" r="15" class="image" />
    <!-- Chairs -->
    <line x1="70" y1="120" x2="90" y2="160" class="image" />
    <line x1="140" y1="120" x2="160" y2="160" class="image" />
    <line x1="210" y1="120" x2="230" y2="160" class="image" />
    <line x1="280" y1="120" x2="300" y2="160" class="image" />
  </g>
</svg>