<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">devote</text>
  <text x="50" y="120" class="subtitle">[dɪˈvoʊt] v. 奉献，致力于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + vote (发誓)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在祭坛前，"强调发誓(de-vote)"
    <tspan x="50" dy="25">将自己的一生奉献给某个事业或目标。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She devoted her life to helping the poor.
  </text>
  <text x="50" y="310" class="content">
    她一生致力于帮助穷人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Altar -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Vow -->
    <text x="100" y="50" class="content" style="font-size: 24px; fill: #E74C3C;">I swear</text>
  </g>
</svg>