<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sink</text>
  <text x="50" y="120" class="subtitle">[sɪŋk] v. 下沉，沉没；n. 水槽，洗涤槽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sin- (下沉) + k (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在海上，"下沉(sin-k)"
    <tspan x="50" dy="25">到海底，这个动作就是sink。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship began to sink after hitting the iceberg.
  </text>
  <text x="50" y="310" class="content">
    船在撞上冰山后开始下沉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#4CAF50" />
    <!-- Ship -->
    <rect x="150" y="50" width="100" height="30" class="image" fill="#34495E" />
    <rect x="170" y="30" width="60" height="20" class="image" fill="#2C3E50" />
    <!-- Water line -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" stroke-width="4" stroke="#2980B9" />
    <!-- Sunken part of the ship -->
    <rect x="150" y="100" width="100" height="50" class="image" fill="#34495E" />
  </g>
</svg>