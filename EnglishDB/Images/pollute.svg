<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .pollution { fill: #808B96; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pollute</text>
  <text x="50" y="120" class="subtitle">[pəˈlut] v. 污染</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pol- (放置) + -lute (冲洗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂排放废气，"放置(pol-)"
    <tspan x="50" dy="25">有害物质到空气中，空气被"冲洗(lute)"得不再纯净，</tspan>
    <tspan x="50" dy="25">这就是污染(pollute)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory's emissions pollute the air.
  </text>
  <text x="50" y="310" class="content">
    工厂的排放物污染了空气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Smoke -->
    <circle cx="150" cy="30" r="20" class="pollution" />
    <circle cx="170" cy="20" r="25" class="pollution" />
    <circle cx="190" cy="10" r="30" class="pollution" />
    <!-- Factory chimney -->
    <line x1="150" y1="20" x2="150" y2="0" class="image" />
    <line x1="170" y1="20" x2="170" y2="0" class="image" />
    <line x1="190" y1="20" x2="190" y2="0" class="image" />
  </g>
</svg>