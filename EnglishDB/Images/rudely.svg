<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rudely</text>
  <text x="50" y="120" class="subtitle">[ˈruːdli] adv. 粗鲁地，无礼地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rude (粗鲁的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公共场合大声喧哗，"粗鲁地(rude)"
    <tspan x="50" dy="25">打断别人的谈话，这种行为就是"无礼地(rudely)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spoke rudely to the customer service representative.
  </text>
  <text x="50" y="310" class="content">
    他对客服代表说话很粗鲁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person shouting -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Sound waves -->
    <path d="M50 120 Q70 110, 90 120 T130 120" class="image" />
    <path d="M50 130 Q70 120, 90 130 T130 130" class="image" />
    <path d="M50 140 Q70 130, 90 140 T130 140" class="image" />
  </g>
</svg>