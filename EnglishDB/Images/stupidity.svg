<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stupidity</text>
  <text x="50" y="120" class="subtitle">[stjuːˈpɪdɪti] n. 愚蠢，愚笨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stu- (笨) + -pid (笨) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考时，脑袋里全是"笨笨的(stu-pid)"
    <tspan x="50" dy="25">想法，这些想法就构成了愚蠢(stupidity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His stupidity led to the failure of the project.
  </text>
  <text x="50" y="310" class="content">
    他的愚蠢导致了项目的失败。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Brain -->
    <rect x="70" y="50" width="60" height="80" class="image" />
    <!-- Dumb thoughts -->
    <line x1="75" y1="60" x2="125" y2="60" class="image" />
    <line x1="75" y1="80" x2="125" y2="80" class="image" />
    <line x1="75" y1="100" x2="125" y2="100" class="image" />
    <line x1="75" y1="120" x2="125" y2="120" class="image" />
    <!-- Dumbbell -->
    <rect x="150" y="70" width="20" height="60" class="image" />
    <rect x="140" y="90" width="40" height="20" class="image" />
  </g>
</svg>