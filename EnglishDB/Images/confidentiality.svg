<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lock { fill: #34495E; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confidentiality</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnfɪˌdɛnʃiˈælɪti] n. 机密性，保密</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + fid (信任) + -ential (形容词后缀) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机密文件被锁在保险箱里，"共同信任(con-fid)"
    <tspan x="50" dy="25">的保密性(confidentiality)确保了信息的安全。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company takes confidentiality very seriously.
  </text>
  <text x="50" y="310" class="content">
    公司对保密性非常重视。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Safe -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lock -->
    <rect x="150" y="50" width="50" height="100" class="lock" />
    <circle cx="175" cy="160" r="10" class="lock" />
    <!-- Document -->
    <rect x="70" y="70" width="200" height="100" class="image" />
    <line x1="80" y1="80" x2="270" y2="80" class="image" />
    <line x1="80" y1="100" x2="250" y2="100" class="image" />
    <line x1="80" y1="120" x2="270" y2="120" class="image" />
    <line x1="80" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>