<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intercollegiate</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˌkɒlɪˈdʒiːt] adj. 学院间的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + collegiate (学院的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两所学院的学生在操场上进行激烈的"学院间(inter-collegiate)"
    <tspan x="50" dy="25">比赛，他们互相竞争，展现出学院间的友谊和竞争精神。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The intercollegiate basketball tournament was a huge success.
  </text>
  <text x="50" y="310" class="content">
    学院间的篮球锦标赛非常成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two colleges -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="200" y="0" width="150" height="100" class="image" />
    <!-- Students -->
    <circle cx="50" cy="60" r="15" class="image" />
    <circle cx="250" cy="60" r="15" class="image" />
    <!-- Ball -->
    <circle cx="150" cy="60" r="10" class="image" />
    <!-- Ground -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Competition -->
    <line x1="50" y1="60" x2="250" y2="60" class="image" />
  </g>
</svg>