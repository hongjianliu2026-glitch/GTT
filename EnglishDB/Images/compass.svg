<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compass</text>
  <text x="50" y="120" class="subtitle">[ˈkʌmpəs] n. 指南针，罗盘；v. 包围，围绕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + pass (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在荒野中，手持"一起走(com-pass)"的指南针，
    <tspan x="50" dy="25">它帮助他找到方向，不被迷失。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The compass guided the hiker through the dense forest.
  </text>
  <text x="50" y="310" class="content">
    指南针引导徒步旅行者穿过茂密的森林。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="95" y1="100" x2="255" y2="100" class="image" />
    <!-- North arrow -->
    <polygon points="175,20 165,40 185,40" class="image" />
    <!-- Labels -->
    <text x="175" y="60" text-anchor="middle" class="content">N</text>
    <text x="135" y="100" text-anchor="middle" class="content">W</text>
    <text x="215" y="100" text-anchor="middle" class="content">E</text>
    <text x="175" y="140" text-anchor="middle" class="content">S</text>
    <!-- Explorer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>