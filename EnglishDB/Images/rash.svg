<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rash</text>
  <text x="50" y="120" class="subtitle">[ræʃ] adj. 鲁莽的，轻率的；n. 皮疹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rash (突然的，迅速的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为吃了太多辣椒，"突然(rash)"
    <tspan x="50" dy="25">脸上长满了红红的皮疹(rash)，这就是鲁莽(rash)的后果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a rash decision to quit her job without a backup plan.
  </text>
  <text x="50" y="310" class="content">
    她鲁莽地决定在没有备选计划的情况下辞职。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Rash -->
    <circle cx="70" cy="70" r="5" class="image" />
    <circle cx="130" cy="70" r="5" class="image" />
    <circle cx="90" cy="110" r="5" class="image" />
    <circle cx="110" cy="110" r="5" class="image" />
    <circle cx="100" cy="80" r="5" class="image" />
  </g>
</svg>