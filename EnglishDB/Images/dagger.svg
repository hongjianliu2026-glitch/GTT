<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dagger</text>
  <text x="50" y="120" class="subtitle">[ˈdæɡər] n. 匕首，短剑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dag (刺) + ger (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个刺客手持一把"刺(dag)"的"工具(ger)"，
    <tspan x="50" dy="25">这把工具就是一把匕首(dagger)，准备进行暗杀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The assassin concealed a dagger in his boot.
  </text>
  <text x="50" y="310" class="content">
    刺客把匕首藏在靴子里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dagger -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <line x1="50" y1="50" x2="70" y2="20" class="image" />
    <line x1="50" y1="50" x2="30" y2="20" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <!-- Handle -->
    <rect x="40" y="230" width="20" height="30" class="image" />
  </g>
</svg>