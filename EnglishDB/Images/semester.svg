<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">semester</text>
  <text x="50" y="120" class="subtitle">[sɪˈmɛstər] n. 学期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seme- (六) + -ster (表示时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学期(semester)就像一个六个月(seme-)的旅程，
    <tspan x="50" dy="25">每个学期都有自己的开始和结束，就像一个循环。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new semester starts next week.
  </text>
  <text x="50" y="310" class="content">
    新学期下周开始。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Semester cycle -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Start and end points -->
    <circle cx="100" cy="20" r="10" class="image" fill="#E74C3C" />
    <circle cx="100" cy="180" r="10" class="image" fill="#E74C3C" />
    <!-- Arrows -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <polygon points="100,20 90,30 110,30" class="image" fill="#7F8C8D" />
    <polygon points="100,180 90,170 110,170" class="image" fill="#7F8C8D" />
    <!-- Text annotations -->
    <text x="80" y="120" class="content" text-anchor="middle">Start</text>
    <text x="120" y="120" class="content" text-anchor="middle">End</text>
  </g>
</svg>