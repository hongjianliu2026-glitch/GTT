<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #E74C3C; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">red</text>
  <text x="50" y="120" class="subtitle">[rɛd] adj. 红色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (强调) + d (颜色)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个红色的苹果，"强调(re-)"
    <tspan x="50" dy="25">它的颜色是如此鲜艳，让人一眼就能认出它是红色的(red)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The red apple was the sweetest one in the basket.
  </text>
  <text x="50" y="310" class="content">
    这个红色的苹果是篮子里最甜的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red apple -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Leaf -->
    <path d="M100,40 Q120,20 140,40" class="image" />
    <!-- Stem -->
    <line x1="100" y1="40" x2="100" y2="60" class="image" />
  </g>
</svg>