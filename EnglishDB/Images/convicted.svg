<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">convicted</text>
  <text x="50" y="120" class="subtitle">[kənˈvɪktɪd] adj. 被判有罪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (加强) + vict (征服)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，"加强征服(con-vict)"
    <tspan x="50" dy="25">被告的罪行，最终被告被判有罪(convicted)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was convicted of fraud and sentenced to five years in prison.
  </text>
  <text x="50" y="310" class="content">
    他被判犯有欺诈罪，并被判处五年监禁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Gavel -->
    <rect x="10" y="80" width="20" height="30" class="image" />
    <line x1="20" y1="80" x2="20" y2="50" class="image" />
    <!-- Prison bars -->
    <rect x="50" y="20" width="250" height="200" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <line x1="70" y1="150" x2="280" y2="150" class="image" />
    <!-- Convicted person -->
    <circle cx="150" cy="120" r="15" class="image" />
    <line x1="150" y1="135" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="150" x2="200" y2="140" class="image" />
  </g>
</svg>