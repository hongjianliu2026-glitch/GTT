<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swipe</text>
  <text x="50" y="120" class="subtitle">[swaɪp] v. 刷，挥动；n. 刷动，挥动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sw- (表示移动) + -ipe (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手在空中"挥动(sw-ipe)"，就像在刷卡或挥手告别。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She swiped her card to enter the building.
  </text>
  <text x="50" y="310" class="content">
    她刷卡进入大楼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hand -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <line x1="50" y1="100" x2="50" y2="120" class="image" />
    <!-- Card -->
    <rect x="100" y="100" width="100" height="60" class="image" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="130" x2="200" y2="130" class="image" />
    <line x1="100" y1="160" x2="200" y2="160" class="image" />
  </g>
</svg>