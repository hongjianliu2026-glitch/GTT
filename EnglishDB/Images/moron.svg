<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moron</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrɒn] n. 笨蛋，傻瓜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> moro- (愚蠢) + -on (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"愚蠢的(moro-)"人，他总是做出一些让人哭笑不得的事情，
    <tspan x="50" dy="25">大家都叫他"笨蛋(moron)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't be such a moron, you forgot your keys again!
  </text>
  <text x="50" y="310" class="content">
    别再当笨蛋了，你又忘了带钥匙！
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="80" r="10" class="image" />
    <circle cx="125" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <line x1="75" y1="130" x2="125" y2="130" class="image" />
    <!-- Dumbbell -->
    <rect x="150" y="50" width="100" height="20" class="image" />
    <rect x="190" y="50" width="20" height="100" class="image" />
    <rect x="150" y="130" width="100" height="20" class="image" />
    <!-- Dropping dumbbell -->
    <line x1="200" y1="150" x2="200" y2="250" class="image" />
  </g>
</svg>