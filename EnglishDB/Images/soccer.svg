<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soccer</text>
  <text x="50" y="120" class="subtitle">[ˈsɒkə(r)] n. 足球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soc (源自拉丁语 "soccus"，意为 "软底鞋")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群穿着软底鞋(soc)的球员在草地上奔跑，
    <tspan x="50" dy="25">追逐着一个圆形的球，这就是足球(soccer)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He plays soccer every weekend with his friends.
  </text>
  <text x="50" y="310" class="content">
    他每个周末都和朋友一起踢足球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soccer field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soccer ball -->
    <circle cx="175" cy="100" r="20" class="image" />
    <!-- Players -->
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="175" cy="150" r="15" class="image" />
    <!-- Shoes -->
    <rect x="85" y="65" width="30" height="10" class="image" />
    <rect x="235" y="65" width="30" height="10" class="image" />
    <rect x="160" y="165" width="30" height="10" class="image" />
  </g>
</svg>