<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dislocate</text>
  <text x="50" y="120" class="subtitle">[ˈdɪsloʊkeɪt] v. 使脱臼，使混乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + loc (地方) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在打篮球时，"分开(dis-)"了原本"在地方(loc)"的关节，
    <tspan x="50" dy="25">导致脱臼(dislocate)，场面一片混乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He dislocated his shoulder during the game.
  </text>
  <text x="50" y="310" class="content">
    他在比赛中肩膀脱臼了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basketball court -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Basketball hoop -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <circle cx="50" cy="15" r="10" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="140" x2="100" y2="120" class="image" />
    <line x1="150" y1="140" x2="200" y2="120" class="image" />
    <line x1="150" y1="180" x2="100" y2="200" class="image" />
    <line x1="150" y1="180" x2="200" y2="200" class="image" />
    <!-- Dislocated shoulder -->
    <line x1="150" y1="140" x2="250" y2="120" class="image" />
    <circle cx="250" cy="120" r="10" class="image" />
  </g>
</svg>