<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ethnicity</text>
  <text x="50" y="120" class="subtitle">[ˌɛθˈnɪsɪti] n. 种族，民族</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ethno- (种族) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个多元文化的世界，"种族(ethno-)"
    <tspan x="50" dy="25">和"民族(ethnicity)"在这里和谐共存，</tspan>
    <tspan x="50" dy="25">每个人都能自豪地展示自己的文化背景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Understanding ethnicity is key to promoting diversity.
  </text>
  <text x="50" y="310" class="content">
    理解种族是促进多样性的关键。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Continents -->
    <path d="M175,20 L255,100 L175,180 L95,100 Z" class="image" />
    <!-- Flags -->
    <rect x="50" y="20" width="30" height="50" class="image" />
    <rect x="100" y="20" width="30" height="50" class="image" />
    <rect x="150" y="20" width="30" height="50" class="image" />
    <rect x="200" y="20" width="30" height="50" class="image" />
    <rect x="250" y="20" width="30" height="50" class="image" />
  </g>
</svg>