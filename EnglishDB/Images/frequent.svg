<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frequent</text>
  <text x="50" y="120" class="subtitle">[ˈfriːkwənt] adj. 频繁的，经常的；v. 常到，常去</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fre- (自由) + quent (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个自由的鸟儿，"自由地存在(fre-quent)"
    <tspan x="50" dy="25">在天空，频繁地飞翔，这就是频繁(frequent)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a frequent visitor to the library.
  </text>
  <text x="50" y="310" class="content">
    他是图书馆的常客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bird -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="80" x2="30" y2="70" class="image" />
    <line x1="50" y1="80" x2="70" y2="70" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <!-- Another bird -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="130" x2="130" y2="120" class="image" />
    <line x1="150" y1="130" x2="170" y2="120" class="image" />
    <line x1="150" y1="150" x2="130" y2="170" class="image" />
    <line x1="150" y1="150" x2="170" y2="170" class="image" />
  </g>
</svg>