<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">potato</text>
  <text x="50" y="120" class="subtitle">[pəˈteɪtoʊ] n. 土豆，马铃薯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pota (来自西班牙语patata，源自泰诺语batata，意为“甜薯”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的土豆从地里冒出来，"甜薯(pota)"
    <tspan x="50" dy="25">变成了一个巨大的"土豆(potato)"，占据了整个田野。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She baked a delicious potato casserole for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐烤了一道美味的土豆砂锅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Potato -->
    <ellipse cx="175" cy="100" rx="100" ry="60" class="image" fill="#D7DBDD" />
    <!-- Ground -->
    <rect x="50" y="160" width="250" height="40" class="image" fill="#85929E" />
    <!-- Stem -->
    <line x1="175" y1="40" x2="175" y2="160" class="image" />
    <!-- Leaves -->
    <polyline points="150,40 175,20 200,40" class="image" />
    <polyline points="150,60 175,40 200,60" class="image" />
  </g>
</svg>