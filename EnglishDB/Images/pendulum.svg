<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pendulum</text>
  <text x="50" y="120" class="subtitle">[ˈpɛndʒələm] n. 钟摆，摆锤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pend (悬挂) + -ulum (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟摆，悬挂在空中，来回摆动，"悬挂的小东西(pend-ulum)"
    <tspan x="50" dy="25">在时间的流逝中摇摆不定，这就是钟摆(pendulum)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pendulum of the clock swung back and forth.
  </text>
  <text x="50" y="310" class="content">
    钟的钟摆来回摆动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ceiling -->
    <line x1="0" y1="0" x2="400" y2="0" class="image" />
    <!-- Pendulum -->
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <circle cx="200" cy="200" r="20" class="image" />
    <!-- Swing arc -->
    <path d="M200,200 A100,100 0 0,1 300,100" class="image" />
    <path d="M200,200 A100,100 0 0,0 100,100" class="image" />
  </g>
</svg>