<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .filter { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">purification</text>
  <text x="50" y="120" class="subtitle">[ˌpjʊrɪfɪˈkeɪʃn] n. 净化，提纯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puri- (纯净) + -fication (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的过滤器，"使(fication)"
    <tspan x="50" dy="25">水变得"纯净(puri-)"，这就是净化(purification)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The purification of the water is essential for drinking.
  </text>
  <text x="50" y="310" class="content">
    水的净化对于饮用是至关重要的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Filter -->
    <rect x="150" y="50" width="50" height="100" class="filter" />
    <!-- Water flow -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <!-- Clean water -->
    <rect x="250" y="0" width="100" height="200" class="water" />
  </g>
</svg>