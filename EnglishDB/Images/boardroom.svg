<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boardroom</text>
  <text x="50" y="120" class="subtitle">[ˈbɔːrdruːm] n. 会议室，董事会议室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> board (董事会) + room (房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个高级会议室，里面坐着一群西装革履的董事，他们正在讨论公司的未来。
    <tspan x="50" dy="25">这个房间就是他们的"董事会房间(boardroom)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boardroom was filled with tension as the CEO presented the new strategy.
  </text>
  <text x="50" y="310" class="content">
    当CEO介绍新战略时，会议室里充满了紧张气氛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boardroom table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Chairs -->
    <line x1="70" y1="50" x2="70" y2="180" class="image" />
    <line x1="120" y1="50" x2="120" y2="180" class="image" />
    <line x1="170" y1="50" x2="170" y2="180" class="image" />
    <line x1="220" y1="50" x2="220" y2="180" class="image" />
    <line x1="270" y1="50" x2="270" y2="180" class="image" />
    <!-- People -->
    <circle cx="85" cy="30" r="15" class="image" />
    <circle cx="135" cy="30" r="15" class="image" />
    <circle cx="185" cy="30" r="15" class="image" />
    <circle cx="235" cy="30" r="15" class="image" />
    <circle cx="285" cy="30" r="15" class="image" />
  </g>
</svg>