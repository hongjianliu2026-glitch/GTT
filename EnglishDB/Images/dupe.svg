<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dupe</text>
  <text x="50" y="120" class="subtitle">[djuːp] n. 骗子，易受骗的人；v. 欺骗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dup (双) + -e (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骗子拿着两张相同的牌，"双(dup)"
    <tspan x="50" dy="25">欺骗(dupe)一个易受骗的人，让他以为自己赢了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was duped by the con artist into giving away his savings.
  </text>
  <text x="50" y="310" class="content">
    他被骗子骗走了所有的积蓄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two cards -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="120" y="0" width="100" height="150" class="image" />
    <!-- Trickster -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="230" y2="160" class="image" />
    <line x1="250" y1="130" x2="270" y2="160" class="image" />
    <line x1="250" y1="110" x2="290" y2="100" class="image" />
    <!-- Victim -->
    <circle cx="350" cy="75" r="20" class="image" />
    <line x1="350" y1="95" x2="350" y2="130" class="image" />
    <line x1="350" y1="130" x2="330" y2="160" class="image" />
    <line x1="350" y1="130" x2="370" y2="160" class="image" />
    <line x1="350" y1="110" x2="390" y2="100" class="image" />
    <!-- Money -->
    <rect x="330" y="160" width="40" height="20" class="image" />
    <rect x="330" y="185" width="40" height="20" class="image" />
  </g>
</svg>