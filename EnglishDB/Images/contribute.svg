<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contribute</text>
  <text x="50" y="120" class="subtitle">[kənˈtrɪbjuːt] v. 贡献，捐献</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tribute (给予)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人一起"给予(con-tribute)"
    <tspan x="50" dy="25">他们的力量和资源，共同建设一个更美好的社区。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She contributed her ideas to the project.
  </text>
  <text x="50" y="310" class="content">
    她为这个项目贡献了自己的想法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Resources -->
    <rect x="30" y="80" width="30" height="30" class="image" />
    <rect x="130" y="80" width="30" height="30" class="image" />
    <rect x="230" y="80" width="30" height="30" class="image" />
    <!-- Community -->
    <rect x="0" y="120" width="300" height="100" class="image" />
    <line x1="50" y1="140" x2="250" y2="140" class="image" />
    <line x1="50" y1="160" x2="250" y2="160" class="image" />
    <line x1="50" y1="180" x2="250" y2="180" class="image" />
  </g>
</svg>