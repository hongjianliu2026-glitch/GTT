<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meteorite</text>
  <text x="50" y="120" class="subtitle">[ˈmiːtiəraɪt] n. 陨石</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meteor (流星) + -ite (表示“石头”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗流星(meteor)从天而降，
    <tspan x="50" dy="25">最终变成了一块石头(meteorite)，落在了地球上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meteorite was found in the desert.
  </text>
  <text x="50" y="310" class="content">
    这块陨石是在沙漠中被发现的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Meteor -->
    <line x1="50" y1="20" x2="250" y2="180" class="image" />
    <!-- Meteorite -->
    <circle cx="250" cy="180" r="15" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>