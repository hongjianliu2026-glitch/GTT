<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grove</text>
  <text x="50" y="120" class="subtitle">[ɡroʊv] n. 小树林，树丛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grov (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片小树林(grove)，树木"生长(grov)"得茂密，
    <tspan x="50" dy="25">形成了一个幽静的小天地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We found a quiet spot in the grove to have a picnic.
  </text>
  <text x="50" y="310" class="content">
    我们在小树林里找到了一个安静的地方野餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ground -->
    <rect x="0" y="150" width="400" height="50" class="image" />
    <!-- Trees -->
    <circle cx="50" cy="100" r="30" class="tree" />
    <circle cx="150" cy="100" r="30" class="tree" />
    <circle cx="250" cy="100" r="30" class="tree" />
    <circle cx="350" cy="100" r="30" class="tree" />
    <!-- Trunks -->
    <rect x="35" y="100" width="30" height="50" class="image" />
    <rect x="135" y="100" width="30" height="50" class="image" />
    <rect x="235" y="100" width="30" height="50" class="image" />
    <rect x="335" y="100" width="30" height="50" class="image" />
  </g>
</svg>