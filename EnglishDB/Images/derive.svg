<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">derive</text>
  <text x="50" y="120" class="subtitle">[dɪˈraɪv] v. 源自，导出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + riv (河流)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流从源头"向下(de-)"流淌，
    <tspan x="50" dy="25">最终汇聚成一条大河，这就是"导出(derive)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The word "derive" is derived from Latin.
  </text>
  <text x="50" y="310" class="content">
    "derive"这个词源自拉丁语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- River source -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- River flow -->
    <line x1="70" y1="50" x2="350" y2="50" class="image" />
    <line x1="350" y1="50" x2="350" y2="200" class="image" />
    <!-- River -->
    <rect x="340" y="200" width="20" height="100" class="image" />
    <!-- Water drops -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="150" cy="50" r="5" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <circle cx="250" cy="50" r="5" class="image" />
    <circle cx="300" cy="50" r="5" class="image" />
  </g>
</svg>