<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exit</text>
  <text x="50" y="120" class="subtitle">[ˈɛksɪt] n. 出口，退出；v. 离开，退出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + it (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人急匆匆地"走出(ex-it)"房间，寻找出口(exit)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made a quick exit when he saw his ex-girlfriend.
  </text>
  <text x="50" y="310" class="content">
    他一看到前女友就迅速离开了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="250" class="image" />
    <!-- Exit sign -->
    <text x="50" y="20" class="image" style="font: bold 36px sans-serif; fill: #E74C3C;">EXIT</text>
    <!-- Person -->
    <circle cx="75" cy="280" r="15" class="image" />
    <line x1="75" y1="295" x2="75" y2="330" class="image" />
    <line x1="75" y1="330" x2="60" y2="360" class="image" />
    <line x1="75" y1="330" x2="90" y2="360" class="image" />
    <line x1="75" y1="310" x2="100" y2="300" class="image" />
  </g>
</svg>