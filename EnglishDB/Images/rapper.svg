<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rapper</text>
  <text x="50" y="120" class="subtitle">[ˈræpər] n. 说唱歌手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rap (说唱) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着大金链子的说唱歌手，"快速说唱(rap)"
    <tspan x="50" dy="25">，用他的节奏和韵律征服舞台，他就是rapper。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rapper performed his new song at the concert.
  </text>
  <text x="50" y="310" class="content">
    这位说唱歌手在音乐会上表演了他的新歌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microphone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="250" class="image" />
    <line x1="175" y1="200" x2="200" y2="250" class="image" />
    <!-- Rapper -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="200" x2="140" y2="190" class="image" />
    <!-- Gold chain -->
    <line x1="100" y1="160" x2="140" y2="160" class="image" />
    <line x1="140" y1="160" x2="140" y2="170" class="image" />
    <line x1="140" y1="170" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="140" y2="180" class="image" />
  </g>
</svg>