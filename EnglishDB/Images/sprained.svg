<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sprained</text>
  <text x="50" y="120" class="subtitle">[spreɪnd] v. 扭伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sprain (扭伤)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在跑步时，突然"扭伤(sprain)"了脚踝，
    <tspan x="50" dy="25">痛苦地倒在地上，脚踝肿得像气球一样大。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He sprained his ankle while playing basketball.
  </text>
  <text x="50" y="310" class="content">
    他在打篮球时扭伤了脚踝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="230" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="230" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="150" class="image" /> <!-- Right arm -->
    <!-- Ankle -->
    <circle cx="70" cy="230" r="15" class="image" />
    <!-- Swollen ankle -->
    <circle cx="70" cy="230" r="25" class="image" stroke-dasharray="5,5" />
  </g>
</svg>