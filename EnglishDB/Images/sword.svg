<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sword</text>
  <text x="50" y="120" class="subtitle">[sɔːrd] n. 剑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swor (切割)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的剑，"切割(swor)"
    <tspan x="50" dy="25">一切阻挡在前的东西，这就是剑(sword)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The knight wielded his sword with great skill.
  </text>
  <text x="50" y="310" class="content">
    骑士用他的剑展现出了高超的技艺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sword handle -->
    <rect x="150" y="50" width="50" height="150" class="image" />
    <!-- Sword blade -->
    <polygon points="175,50 250,0 250,200 175,150" class="image" />
    <!-- Guard -->
    <rect x="140" y="40" width="70" height="10" class="image" />
  </g>
</svg>