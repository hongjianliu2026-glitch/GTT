<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unto</text>
  <text x="50" y="120" class="subtitle">[ˈʌntu] prep. 直到，向</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (向) + to (到)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在起点，"向(un-)"着目标"到(to)"达，
    <tspan x="50" dy="25">这个过程就是unto(unto)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He walked unto the end of the road.
  </text>
  <text x="50" y="310" class="content">
    他一直走到路的尽头。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Start point -->
    <circle cx="50" cy="100" r="15" class="image" />
    <!-- End point -->
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Path -->
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <!-- Person walking -->
    <circle cx="70" cy="100" r="10" class="image" />
    <line x1="70" y1="110" x2="70" y2="140" class="image" />
    <line x1="70" y1="140" x2="60" y2="170" class="image" />
    <line x1="70" y1="140" x2="80" y2="170" class="image" />
    <line x1="70" y1="120" x2="90" y2="110" class="image" />
  </g>
</svg>