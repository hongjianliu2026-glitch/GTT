<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">habitation</text>
  <text x="50" y="120" class="subtitle">[ˌhæbɪˈteɪʃən] n. 居住，住所</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> habit (居住) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭在一个温馨的房子里，"居住(habit)"
    <tspan x="50" dy="25">并享受着他们的"住所(habitation)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house has been their habitation for decades.
  </text>
  <text x="50" y="310" class="content">
    这栋老房子已经成为了他们几十年的住所。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,20 300,20 350,70 350,200 50,200" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="80" class="image" />
    <!-- Windows -->
    <rect x="80" y="50" width="40" height="40" class="image" />
    <rect x="230" y="50" width="40" height="40" class="image" />
    <!-- Family -->
    <circle cx="100" cy="160" r="10" class="image" />
    <circle cx="120" cy="160" r="10" class="image" />
    <circle cx="110" cy="140" r="10" class="image" />
  </g>
</svg>