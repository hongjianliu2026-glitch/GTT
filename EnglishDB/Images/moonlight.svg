<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moonlight</text>
  <text x="50" y="120" class="subtitle">[ˈmuːnlaɪt] n. 月光；v. 兼职</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> moon (月亮) + light (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在月光下，"借助月光(moon-light)"
    <tspan x="50" dy="25">工作，这就是他的兼职(moonlight)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He moonlights as a musician after his day job.
  </text>
  <text x="50" y="310" class="content">
    他白天工作后兼职做音乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Light rays -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <line x1="25" y1="225" x2="175" y2="225" class="image" />
    <!-- Person -->
    <circle cx="300" cy="150" r="20" class="image" fill="#2C3E50" />
    <line x1="300" y1="170" x2="300" y2="220" class="image" />
    <line x1="300" y1="220" x2="280" y2="250" class="image" />
    <line x1="300" y1="220" x2="320" y2="250" class="image" />
    <line x1="300" y1="190" x2="340" y2="180" class="image" />
    <!-- Music instrument -->
    <rect x="350" y="130" width="50" height="50" class="image" fill="#8E44AD" />
  </g>
</svg>