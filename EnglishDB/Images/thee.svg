<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thee</text>
  <text x="50" y="120" class="subtitle">[ðiː] pron. 你（古英语中的宾格形式）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自中古英语，是thou的宾格形式。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的骑士对"你(thee)"说：
    <tspan x="50" dy="25">"我愿意为你(thee)而战！"</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The knight vowed to protect thee.
  </text>
  <text x="50" y="310" class="content">
    骑士发誓要保护你。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Knight -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="150" class="image" />
    <line x1="50" y1="100" x2="70" y2="150" class="image" />
    <line x1="50" y1="20" x2="30" y2="70" class="image" />
    <line x1="50" y1="20" x2="70" y2="70" class="image" />
    <!-- Shield -->
    <rect x="120" y="50" width="80" height="80" class="image" />
    <!-- Sword -->
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
    <!-- Speech bubble -->
    <path d="M250,50 Q300,20 350,50 Q300,80 250,50" class="image" />
    <text x="260" y="60" class="content">"thee"</text>
  </g>
</svg>