<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nude</text>
  <text x="50" y="120" class="subtitle">[njuːd] adj. 裸体的，无装饰的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nud (裸露)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在大自然中，"裸露(nud)"
    <tspan x="50" dy="25">全身，感受自然的纯粹与自由。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist painted a nude model.
  </text>
  <text x="50" y="310" class="content">
    艺术家画了一个裸体模特。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="70" y2="250" class="image" />
    <line x1="100" y1="200" x2="130" y2="250" class="image" />
    <line x1="100" y1="150" x2="50" y2="180" class="image" />
    <line x1="100" y1="150" x2="150" y2="180" class="image" />
    <!-- Nature background -->
    <rect x="0" y="250" width="200" height="50" class="image" />
    <line x1="0" y1="250" x2="200" y2="250" class="image" />
    <line x1="0" y1="300" x2="200" y2="300" class="image" />
  </g>
</svg>