<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pale</text>
  <text x="50" y="120" class="subtitle">[peɪl] adj. 苍白的，暗淡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pal- (苍白)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为恐惧而脸色"苍白(pale)"，
    <tspan x="50" dy="25">就像一张白纸一样，毫无血色。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She turned pale when she heard the news.
  </text>
  <text x="50" y="310" class="content">
    她听到这个消息时脸色变得苍白。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F9EBEA" />
    <!-- Eyes -->
    <circle cx="75" cy="85" r="10" class="image" fill="#FFFFFF" />
    <circle cx="125" cy="85" r="10" class="image" fill="#FFFFFF" />
    <!-- Mouth -->
    <line x1="75" y1="120" x2="125" y2="120" class="image" />
    <!-- Label -->
    <text x="100" y="180" class="content" text-anchor="middle">苍白的脸</text>
  </g>
</svg>