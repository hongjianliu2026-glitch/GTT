<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">safely</text>
  <text x="50" y="120" class="subtitle">[ˈseɪfli] adv. 安全地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> safe (安全的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子在父母的保护下，"安全地(safely)"
    <tspan x="50" dy="25">走在回家的路上，周围是坚固的盾牌和温暖的灯光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children crossed the street safely with their parents.
  </text>
  <text x="50" y="310" class="content">
    孩子们在父母的陪同下安全地穿过了街道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <polygon points="75,0 150,100 75,200 0,100" class="image" />
    <!-- Child -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Light -->
    <circle cx="300" cy="50" r="30" class="image" />
    <line x1="300" y1="80" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="270" y2="200" class="image" />
    <line x1="300" y1="150" x2="330" y2="200" class="image" />
  </g>
</svg>