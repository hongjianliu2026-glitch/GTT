<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arthritis</text>
  <text x="50" y="120" class="subtitle">[ɑːrˈθraɪtɪs] n. 关节炎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arthr- (关节) + -itis (炎症)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个关节(arthr-)因为炎症(-itis)而肿胀，
    <tspan x="50" dy="25">疼痛难忍，这就是关节炎(arthritis)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffers from arthritis in his knees.
  </text>
  <text x="50" y="310" class="content">
    他患有膝关节炎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Joint -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Inflammation -->
    <circle cx="100" cy="100" r="60" class="image" stroke-dasharray="5,5" />
    <!-- Pain -->
    <line x1="100" y1="160" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
    <line x1="100" y1="200" x2="120" y2="220" class="image" />
  </g>
</svg>