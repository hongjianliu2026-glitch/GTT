<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rhubarb</text>
  <text x="50" y="120" class="subtitle">[ˈruːbɑːrb] n. 大黄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rhubarb (源自中古英语，意为“大黄”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片田野里，"大黄(rhubarb)"
    <tspan x="50" dy="25">的叶子像巨大的绿色手掌，茎部鲜红如血，</tspan>
    <tspan x="50" dy="25">这就是我们熟悉的大黄(rhubarb)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a rhubarb pie for dessert.
  </text>
  <text x="50" y="310" class="content">
    她为甜点做了一个大黄派。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rhubarb plant -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Leaves -->
    <polygon points="50,20 100,20 75,70" class="image" />
    <polygon points="120,20 170,20 145,70" class="image" />
    <polygon points="190,20 240,20 215,70" class="image" />
    <!-- Stalks -->
    <rect x="75" y="70" width="20" height="100" class="image" />
    <rect x="145" y="70" width="20" height="100" class="image" />
    <rect x="215" y="70" width="20" height="100" class="image" />
    <!-- Red color for stalks -->
    <rect x="75" y="70" width="20" height="100" fill="#E74C3C" />
    <rect x="145" y="70" width="20" height="100" fill="#E74C3C" />
    <rect x="215" y="70" width="20" height="100" fill="#E74C3C" />
  </g>
</svg>