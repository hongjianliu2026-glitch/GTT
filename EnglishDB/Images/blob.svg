<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blob</text>
  <text x="50" y="120" class="subtitle">[blɒb] n. 斑点，块状物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blob (源自拟声词，形容液体滴落的声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"斑点(blob)"从天而降，
    <tspan x="50" dy="25">它像果冻一样颤动，占据了整个房间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The blob of paint on the wall was hard to remove.
  </text>
  <text x="50" y="310" class="content">
    墙上的油漆斑点很难去除。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blob shape -->
    <ellipse cx="175" cy="100" rx="100" ry="70" class="image" />
    <!-- Droplets -->
    <circle cx="120" cy="150" r="10" class="image" />
    <circle cx="230" cy="150" r="10" class="image" />
    <circle cx="175" cy="180" r="10" class="image" />
  </g>
</svg>