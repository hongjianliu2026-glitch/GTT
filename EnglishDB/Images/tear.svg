<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tear</text>
  <text x="50" y="120" class="subtitle">[tɪər] n. 眼泪；v. 撕裂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tear (撕裂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为悲伤而流下眼泪(tear)，
    <tspan x="50" dy="25">同时他的心也被撕裂(tear)了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She couldn't hold back her tears when she heard the news.
  </text>
  <text x="50" y="310" class="content">
    当她听到这个消息时，她忍不住流下了眼泪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tear drop -->
    <ellipse cx="50" cy="50" rx="30" ry="40" class="image" />
    <!-- Heart -->
    <path d="M100,50 C100,0 150,0 150,50 S200,100 150,150 S100,100 100,50" class="image" />
    <!-- Tear lines -->
    <line x1="125" y1="50" x2="125" y2="150" class="image" />
    <line x1="125" y1="150" x2="100" y2="125" class="image" />
    <line x1="125" y1="150" x2="150" y2="125" class="image" />
  </g>
</svg>