<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paradise</text>
  <text x="50" y="120" class="subtitle">[ˈpærədaɪs] n. 天堂，乐园</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (旁边) + -dise (牧场)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个美丽的牧场(para-dise)，旁边有一条清澈的小河，
    <tspan x="50" dy="25">河边有茂密的树木和盛开的花朵，这就是人们心中的天堂(paradise)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This island is a paradise for surfers.
  </text>
  <text x="50" y="310" class="content">
    这个岛屿是冲浪者的天堂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <!-- Trees -->
    <line x1="50" y1="40" x2="50" y2="100" class="image" />
    <line x1="100" y1="40" x2="100" y2="100" class="image" />
    <line x1="150" y1="40" x2="150" y2="100" class="image" />
    <!-- Flowers -->
    <circle cx="70" cy="120" r="10" class="image" />
    <circle cx="120" cy="120" r="10" class="image" />
    <circle cx="170" cy="120" r="10" class="image" />
  </g>
</svg>