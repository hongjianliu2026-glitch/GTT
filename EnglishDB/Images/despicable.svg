<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">despicable</text>
  <text x="50" y="120" class="subtitle">[dɪˈspɪkəbl] adj. 可鄙的，卑劣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + spic (看) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人做了坏事，"向下看(de-spic)"
    <tspan x="50" dy="25">自己都觉得羞愧，这种行为就是可鄙的(despicable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His despicable actions were condemned by everyone.
  </text>
  <text x="50" y="310" class="content">
    他的卑劣行为受到了所有人的谴责。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person looking down in shame -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="120" x2="20" y2="110" class="image" />
    <line x1="50" y1="120" x2="80" y2="110" class="image" />
    <!-- Arrow pointing down -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <polygon points="45,250 50,260 55,250" class="image" />
    <!-- Speech bubble -->
    <path d="M100,50 Q150,20 200,50 T250,100" class="image" />
    <text x="120" y="80" class="content">Shame!</text>
  </g>
</svg>