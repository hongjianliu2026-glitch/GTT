<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">immerse</text>
  <text x="50" y="120" class="subtitle">[ɪˈmɜːrs] v. 沉浸，使陷入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + mers (沉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人完全"进入(im-)"水中，"沉(mers)"
    <tspan x="50" dy="25">入其中，仿佛被水包围，这就是沉浸(immerse)的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She immersed herself in the novel and forgot about time.
  </text>
  <text x="50" y="310" class="content">
    她沉浸在小说中，忘记了时间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person immersed in water -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Water waves -->
    <path d="M50,20 Q100,40 150,20 T250,20" class="image" />
    <path d="M50,40 Q100,60 150,40 T250,40" class="image" />
    <path d="M50,60 Q100,80 150,60 T250,60" class="image" />
  </g>
</svg>