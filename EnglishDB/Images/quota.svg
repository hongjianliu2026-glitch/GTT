<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quota</text>
  <text x="50" y="120" class="subtitle">[ˈkwəʊtə] n. 配额，限额</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quot (多少) + -a (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂里，工人们正在努力工作，但每个人都被分配了"多少(quot)"
    <tspan x="50" dy="25">任务，这些任务的总量就是他们的配额(quota)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has reached its sales quota for the month.
  </text>
  <text x="50" y="310" class="content">
    公司已经达到了本月的销售配额。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Workers -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Tasks -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="100" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <!-- Quota -->
    <text x="200" y="80" class="content" fill="#2980B9">Quota</text>
    <line x1="200" y1="90" x2="250" y2="90" class="image" />
    <line x1="200" y1="110" x2="250" y2="110" class="image" />
    <line x1="200" y1="130" x2="250" y2="130" class="image" />
  </g>
</svg>