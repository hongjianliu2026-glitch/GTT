<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">geopolitical</text>
  <text x="50" y="120" class="subtitle">[ˌdʒiːoʊpəˈlɪtɪkl] adj. 地缘政治的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> geo- (地球) + polit (政治) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，上面布满了各种国家的边界和政治符号，
    <tspan x="50" dy="25">这些符号代表着不同国家的政治策略和影响力，这就是地缘政治(geopolitical)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The geopolitical situation in the Middle East is complex.
  </text>
  <text x="50" y="310" class="content">
    中东的地缘政治局势很复杂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Country borders -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="150" x2="250" y2="50" class="image" />
    <!-- Political symbols -->
    <rect x="120" y="60" width="30" height="30" class="image" />
    <rect x="200" y="120" width="30" height="30" class="image" />
    <rect x="150" y="150" width="30" height="30" class="image" />
  </g>
</svg>