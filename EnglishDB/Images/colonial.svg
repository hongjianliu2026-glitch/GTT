<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">colonial</text>
  <text x="50" y="120" class="subtitle">[kəˈloʊniəl] adj. 殖民地的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> colo (耕种) + -nial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群殖民者在一片荒地上，"耕种(colo)"
    <tspan x="50" dy="25">并建立新的家园，这片土地就成了殖民地(colonial)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The colonial architecture is unique in this region.
  </text>
  <text x="50" y="310" class="content">
    这个地区的殖民地建筑风格独特。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Settlers -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Farming tools -->
    <line x1="70" y1="120" x2="70" y2="150" class="image" />
    <line x1="120" y1="120" x2="120" y2="150" class="image" />
    <line x1="170" y1="120" x2="170" y2="150" class="image" />
    <!-- House -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <line x1="250" y1="50" x2="250" y2="0" class="image" />
  </g>
</svg>