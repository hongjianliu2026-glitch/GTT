<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lighthouse</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪtˌhaʊs] n. 灯塔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> light (光) + house (房子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的灯塔，"光(light)"从"房子(house)"里射出，
    <tspan x="50" dy="25">照亮了黑暗的海面，指引船只安全航行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lighthouse guided the ship safely to the harbor.
  </text>
  <text x="50" y="310" class="content">
    灯塔引导船只安全抵达港口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lighthouse base -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Lighthouse top -->
    <rect x="50" y="0" width="50" height="50" class="image" />
    <!-- Light beam -->
    <line x1="75" y1="50" x2="75" y2="250" class="image" />
    <!-- Waves -->
    <line x1="0" y1="220" x2="150" y2="220" class="image" />
    <line x1="0" y1="240" x2="150" y2="240" class="image" />
    <line x1="0" y1="260" x2="150" y2="260" class="image" />
  </g>
</svg>