<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gradual</text>
  <text x="50" y="120" class="subtitle">[ˈɡrædʒuəl] adj. 逐渐的，逐步的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grad (走) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在山坡上"一步步(grad)"地走，
    <tspan x="50" dy="25">每一步都很小，但最终到达了山顶，这就是"逐渐的(gradual)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The change in temperature was gradual.
  </text>
  <text x="50" y="310" class="content">
    温度的变化是逐渐的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,200 L100,100 L200,200" class="image" />
    <!-- Steps -->
    <line x1="20" y1="180" x2="40" y2="160" class="image" />
    <line x1="40" y1="160" x2="60" y2="140" class="image" />
    <line x1="60" y1="140" x2="80" y2="120" class="image" />
    <line x1="80" y1="120" x2="100" y2="100" class="image" />
    <!-- Person -->
    <circle cx="20" cy="180" r="10" class="image" />
    <line x1="20" y1="190" x2="20" y2="210" class="image" />
    <line x1="20" y1="210" x2="10" y2="230" class="image" />
    <line x1="20" y1="210" x2="30" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="190" class="image" />
  </g>
</svg>