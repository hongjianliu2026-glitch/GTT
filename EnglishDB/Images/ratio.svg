<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ratio</text>
  <text x="50" y="120" class="subtitle">[ˈreɪʃioʊ] n. 比率，比例</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ratio (计算，比率)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个数学家在计算两个数的比率，"计算(ratio)"
    <tspan x="50" dy="25">这两个数的比例，结果就是一个比率(ratio)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ratio of boys to girls in the class is 3:2.
  </text>
  <text x="50" y="310" class="content">
    班上男生与女生的比例是3:2。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calculator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Display screen -->
    <rect x="50" y="20" width="250" height="60" class="image" />
    <!-- Buttons -->
    <circle cx="80" cy="120" r="20" class="image" />
    <circle cx="140" cy="120" r="20" class="image" />
    <circle cx="200" cy="120" r="20" class="image" />
    <circle cx="260" cy="120" r="20" class="image" />
    <!-- Math symbols -->
    <text x="85" y="130" class="content">1</text>
    <text x="145" y="130" class="content">2</text>
    <text x="205" y="130" class="content">:</text>
    <text x="265" y="130" class="content">3</text>
    <!-- Result -->
    <text x="100" y="50" class="content">3:2</text>
  </g>
</svg>