<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crass</text>
  <text x="50" y="120" class="subtitle">[kræs] adj. 愚钝的，粗俗的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crassus (拉丁语，意为“厚的，粗的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头人，"厚实(crassus)"
    <tspan x="50" dy="25">的身体和愚钝的头脑，这就是crass的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His crass comments offended everyone in the room.
  </text>
  <text x="50" y="310" class="content">
    他粗俗的评论冒犯了房间里的每一个人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone giant -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="180" x2="175" y2="280" class="image" />
    <line x1="175" y1="280" x2="100" y2="350" class="image" />
    <line x1="175" y1="280" x2="250" y2="350" class="image" />
    <line x1="175" y1="200" x2="100" y2="250" class="image" />
    <line x1="175" y1="200" x2="250" y2="250" class="image" />
  </g>
</svg>