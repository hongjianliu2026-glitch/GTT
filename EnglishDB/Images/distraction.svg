<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">distraction</text>
  <text x="50" y="120" class="subtitle">[dɪˈstrækʃn] n. 分心，分散注意力的事物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + tract (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人正在专心工作，突然一只巨大的<tspan x="50" dy="25">手从天而降，"拉开(tract)"他的注意力，</tspan>
    <tspan x="50" dy="25">让他无法集中精神，这就是"分心(distraction)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loud music was a distraction during the exam.
  </text>
  <text x="50" y="310" class="content">
    考试时，大声的音乐让人分心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Giant hand -->
    <line x1="200" y1="0" x2="150" y2="100" class="image" />
    <line x1="200" y1="0" x2="250" y2="100" class="image" />
    <line x1="200" y1="0" x2="200" y2="100" class="image" />
    <line x1="200" y1="0" x2="175" y2="50" class="image" />
    <line x1="200" y1="0" x2="225" y2="50" class="image" />
  </g>
</svg>