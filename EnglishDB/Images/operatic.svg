<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">operatic</text>
  <text x="50" y="120" class="subtitle">[ˌɒpəˈrætɪk] adj. 歌剧的，歌剧般的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> opera (歌剧) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的歌剧院，"歌剧(opera)"
    <tspan x="50" dy="25">舞台上的演员们穿着华丽的服装，</tspan>
    <tspan x="50" dy="25">他们的表演充满了戏剧性和激情，</tspan>
    <tspan x="50" dy="25">这就是"歌剧般的(operatic)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The movie had an operatic climax with dramatic music and intense emotions.
  </text>
  <text x="50" y="330" class="content">
    这部电影的高潮部分有着歌剧般的戏剧性音乐和强烈的情感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Opera House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stage -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Actors -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Costumes -->
    <line x1="90" y1="115" x2="110" y2="115" class="image" />
    <line x1="140" y1="115" x2="160" y2="115" class="image" />
    <line x1="190" y1="115" x2="210" y2="115" class="image" />
    <!-- Curtains -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
  </g>
</svg>