<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">guy</text>
  <text x="50" y="120" class="subtitle">[ɡaɪ] n. 家伙，人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自法语“guise”，意为“服装”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着奇特服装的“家伙(guy)”，
    <tspan x="50" dy="25">他的服装(guise)如此独特，让人一眼就能认出他。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> That guy over there is really funny.
  </text>
  <text x="50" y="310" class="content">
    那边那个家伙真有趣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Guy with unique clothing -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <!-- Unique clothing -->
    <rect x="20" y="130" width="60" height="70" class="image" /> <!-- Shirt -->
    <line x1="20" y1="130" x2="80" y2="130" class="image" /> <!-- Shirt collar -->
    <line x1="50" y1="130" x2="50" y2="150" class="image" /> <!-- Shirt button -->
    <rect x="30" y="200" width="40" height="50" class="image" /> <!-- Pants -->
    <line x1="30" y1="200" x2="70" y2="200" class="image" /> <!-- Pants waist -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" /> <!-- Pants zipper -->
  </g>
</svg>