<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rigidity</text>
  <text x="50" y="120" class="subtitle">[rɪˈdʒɪdəti] n. 刚性，僵硬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rigid (刚硬的) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个僵硬的机器人，"刚硬(rigid)"得无法弯曲，
    <tspan x="50" dy="25">就像一块石头一样，这就是刚性(rigidity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rigidity of the metal frame made it difficult to bend.
  </text>
  <text x="50" y="310" class="content">
    金属框架的刚性使得它很难弯曲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot body -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Robot head -->
    <circle cx="75" cy="50" r="30" class="image" />
    <!-- Robot arms -->
    <line x1="20" y1="100" x2="0" y2="150" class="image" />
    <line x1="130" y1="100" x2="150" y2="150" class="image" />
    <!-- Robot legs -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <!-- Stone -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <text x="220" y="110" class="content">Stone</text>
  </g>
</svg>