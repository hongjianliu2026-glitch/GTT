<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">powdered</text>
  <text x="50" y="120" class="subtitle">[ˈpaʊdərd] adj. 粉状的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> powd (粉) + -er (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的粉碎机，将一切"粉碎成粉末(powd-er)"，
    <tspan x="50" dy="25">这些粉末在空中飘散，形成了一片粉状的景象(powdered)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sprinkled powdered sugar on the cake.
  </text>
  <text x="50" y="310" class="content">
    她在蛋糕上撒了糖粉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crusher -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Powder -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Powder particles -->
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="150" cy="120" r="5" class="image" />
    <circle cx="200" cy="140" r="5" class="image" />
    <circle cx="250" cy="160" r="5" class="image" />
    <!-- Crusher handle -->
    <line x1="20" y1="20" x2="20" y2="180" class="image" />
    <line x1="20" y1="20" x2="40" y2="20" class="image" />
    <line x1="20" y1="180" x2="40" y2="180" class="image" />
  </g>
</svg>