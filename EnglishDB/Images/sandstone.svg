<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sandstone</text>
  <text x="50" y="120" class="subtitle">[ˈsændstoʊn] n. 砂岩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sand (沙) + stone (石头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片沙滩上，"沙(sand)"和"石头(stone)"
    <tspan x="50" dy="25">结合在一起，形成了坚硬的砂岩(sandstone)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient building was made of sandstone.
  </text>
  <text x="50" y="310" class="content">
    这座古老的建筑是用砂岩建造的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sand -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#F4D03F" />
    <!-- Stone -->
    <rect x="150" y="50" width="100" height="100" class="image" fill="#A9CCE3" />
    <!-- Sandstone -->
    <rect x="100" y="100" width="150" height="50" class="image" fill="#D4AC0D" />
    <!-- Sand particles -->
    <circle cx="50" cy="150" r="5" class="image" fill="#F4D03F" />
    <circle cx="70" cy="140" r="5" class="image" fill="#F4D03F" />
    <circle cx="90" cy="160" r="5" class="image" fill="#F4D03F" />
    <circle cx="110" cy="130" r="5" class="image" fill="#F4D03F" />
    <circle cx="130" cy="150" r="5" class="image" fill="#F4D03F" />
  </g>
</svg>