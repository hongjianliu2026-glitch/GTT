<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDE3A7; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inferno</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfɜːrnoʊ] n. 地狱，火海</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + fer (带来) + -no (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你被"带入(in-fer)"一个充满火焰的"地狱(no)"，
    <tspan x="50" dy="25">周围全是熊熊燃烧的火焰，这就是"火海(inferno)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forest fire created an inferno that was impossible to control.
  </text>
  <text x="50" y="310" class="content">
    森林火灾形成了一个无法控制的火海。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="50" r="40" class="fire" />
    <circle cx="100" cy="70" r="30" class="fire" />
    <circle cx="150" cy="50" r="40" class="fire" />
    <circle cx="200" cy="70" r="30" class="fire" />
    <circle cx="250" cy="50" r="40" class="fire" />
    <!-- Ground -->
    <rect x="0" y="100" width="300" height="20" class="image" />
  </g>
</svg>