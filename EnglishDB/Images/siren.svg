<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">siren</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪrən] n. 汽笛，警报器；海妖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sire (警报) + -n (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警报器(siren)在夜晚发出刺耳的声音，
    <tspan x="50" dy="25">吸引着人们的注意，就像海妖(siren)用歌声迷惑水手一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The siren of the ambulance was blaring loudly.
  </text>
  <text x="50" y="310" class="content">
    救护车的警报器大声响着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Siren -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="70" x2="50" y2="130" class="image" />
    <line x1="30" y1="100" x2="70" y2="100" class="image" />
    <!-- Sound waves -->
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="80" y1="90" x2="110" y2="90" class="image" />
    <line x1="80" y1="110" x2="110" y2="110" class="image" />
    <!-- Sea -->
    <rect x="150" y="80" width="200" height="40" class="image" />
    <!-- Sea creature -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>