<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delusion</text>
  <text x="50" y="120" class="subtitle">[dɪˈluːʒən] n. 错觉，妄想</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + lus (玩耍) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在玩弄(lus)现实，结果完全迷失(de-)了方向，
    <tspan x="50" dy="25">产生了错觉(delusion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's tricks created a delusional world for the audience.
  </text>
  <text x="50" y="310" class="content">
    魔术师的把戏为观众创造了一个错觉的世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Cloud -->
    <ellipse cx="150" cy="80" rx="60" ry="30" class="image" />
    <ellipse cx="120" cy="60" rx="30" ry="20" class="image" />
    <ellipse cx="180" cy="60" rx="30" ry="20" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="100" x2="150" y2="80" class="image" />
    <polygon points="150,80 140,70 140,90" class="image" />
    <!-- Text in cloud -->
    <text x="130" y="85" class="content" style="font-size: 14px;">错觉</text>
  </g>
</svg>