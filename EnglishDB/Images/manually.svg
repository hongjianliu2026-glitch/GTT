<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manually</text>
  <text x="50" y="120" class="subtitle">[ˈmænjuəli] adv. 用手地，手工地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> manu- (手) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人正在用双手"手动(manu-ally)"操作一台古老的打字机，
    <tspan x="50" dy="25">每一个字母都是通过手指的敲击完成的，这就是手工操作的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old machine still needs to be operated manually.
  </text>
  <text x="50" y="310" class="content">
    这台老机器仍然需要手工操作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Typewriter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Keys -->
    <rect x="70" y="50" width="20" height="20" class="image" />
    <rect x="100" y="50" width="20" height="20" class="image" />
    <rect x="130" y="50" width="20" height="20" class="image" />
    <rect x="160" y="50" width="20" height="20" class="image" />
    <rect x="190" y="50" width="20" height="20" class="image" />
    <rect x="220" y="50" width="20" height="20" class="image" />
    <rect x="250" y="50" width="20" height="20" class="image" />
    <!-- Person's hand -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>