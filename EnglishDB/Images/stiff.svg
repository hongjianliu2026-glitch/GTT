<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stiff</text>
  <text x="50" y="120" class="subtitle">[stɪf] adj. 僵硬的，呆板的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + ift (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站立(st-)得非常僵硬(ift)，
    <tspan x="50" dy="25">就像一根木头一样，一动不动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He woke up with a stiff neck.
  </text>
  <text x="50" y="310" class="content">
    他醒来时脖子僵硬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing stiff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="175" y1="70" x2="175" y2="150" class="image" /> <!-- Body -->
    <line x1="175" y1="150" x2="150" y2="200" class="image" /> <!-- Left leg -->
    <line x1="175" y1="150" x2="200" y2="200" class="image" /> <!-- Right leg -->
    <line x1="175" y1="90" x2="150" y2="130" class="image" /> <!-- Left arm -->
    <line x1="175" y1="90" x2="200" y2="130" class="image" /> <!-- Right arm -->
  </g>
</svg>