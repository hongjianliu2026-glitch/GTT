<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heinous</text>
  <text x="50" y="120" class="subtitle">[ˈheɪnəs] adj. 极邪恶的，极可憎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hein (憎恨) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个邪恶的巫师，他的行为让人"憎恨(hein)"
    <tspan x="50" dy="25">到极点，这种极度的邪恶就是heinous。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heinous crime shocked the entire community.
  </text>
  <text x="50" y="310" class="content">
    这个极邪恶的罪行震惊了整个社区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Evil wizard -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Hat -->
    <path d="M20,70 L80,70 Q50,40 20,70 Z" class="image" />
    <!-- Evil aura -->
    <circle cx="50" cy="100" r="50" class="image" stroke-dasharray="5,5" />
  </g>
</svg>