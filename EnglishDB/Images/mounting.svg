<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mounting</text>
  <text x="50" y="120" class="subtitle">[ˈmaʊntɪŋ] v. 安装，增加</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mount (山，上升) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工程师正在"上升(mount)"
    <tspan x="50" dy="25">一个巨大的设备，随着设备的安装，他的工作量也在不断增加(mounting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mounting pressure from the project deadlines made everyone anxious.
  </text>
  <text x="50" y="310" class="content">
    项目截止日期的压力不断增加，让每个人都感到焦虑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Engineer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Equipment -->
    <rect x="70" y="20" width="250" height="160" class="image" />
    <!-- Ladder -->
    <line x1="350" y1="20" x2="350" y2="180" class="image" />
    <line x1="340" y1="40" x2="360" y2="40" class="image" />
    <line x1="340" y1="60" x2="360" y2="60" class="image" />
    <line x1="340" y1="80" x2="360" y2="80" class="image" />
    <line x1="340" y1="100" x2="360" y2="100" class="image" />
    <line x1="340" y1="120" x2="360" y2="120" class="image" />
    <line x1="340" y1="140" x2="360" y2="140" class="image" />
    <line x1="340" y1="160" x2="360" y2="160" class="image" />
    <!-- Engineer climbing -->
    <circle cx="350" cy="160" r="10" class="image" />
    <line x1="350" y1="170" x2="350" y2="190" class="image" />
    <line x1="350" y1="190" x2="340" y2="210" class="image" />
    <line x1="350" y1="190" x2="360" y2="210" class="image" />
    <line x1="350" y1="180" x2="370" y2="170" class="image" />
  </g>
</svg>