<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">attest</text>
  <text x="50" y="120" class="subtitle">[əˈtest] v. 证明，证实</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> at- (加强) + test (证据)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在法庭上，"加强证据(at-test)"，
    <tspan x="50" dy="25">用有力的言辞证明事实的真实性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The witness attested to the defendant's innocence.
  </text>
  <text x="50" y="310" class="content">
    证人证实了被告的无辜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Witness stand -->
    <rect x="100" y="100" width="150" height="80" class="image" />
    <!-- Witness -->
    <circle cx="175" cy="140" r="15" class="image" />
    <line x1="175" y1="155" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="160" y2="200" class="image" />
    <line x1="175" y1="180" x2="190" y2="200" class="image" />
    <line x1="175" y1="165" x2="200" y2="155" class="image" />
    <!-- Gavel -->
    <rect x="220" y="30" width="20" height="30" class="image" />
    <line x1="230" y1="30" x2="230" y2="10" class="image" />
  </g>
</svg>