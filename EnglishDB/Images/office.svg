<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">office</text>
  <text x="50" y="120" class="subtitle">[ˈɒfɪs] n. 办公室，职务，事务</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> of- (离开) + fice (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个职员在办公室里，"离开家去做(of-fice)"
    <tspan x="50" dy="25">工作，这个空间就是他的办公室(office)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spends most of his day in the office.
  </text>
  <text x="50" y="310" class="content">
    他大部分时间都在办公室里度过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Office desk -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Computer -->
    <rect x="70" y="40" width="100" height="80" class="image" />
    <!-- Chair -->
    <rect x="180" y="100" width="50" height="60" class="image" />
    <!-- Person -->
    <circle cx="200" cy="80" r="15" class="image" />
    <line x1="200" y1="95" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="180" y2="160" class="image" />
    <line x1="200" y1="130" x2="220" y2="160" class="image" />
    <line x1="200" y1="110" x2="230" y2="100" class="image" />
  </g>
</svg>