<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">traitor</text>
  <text x="50" y="120" class="subtitle">[ˈtreɪtər] n. 叛徒，卖国贼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trai- (背叛) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着斗篷的人，"背叛(trai-)"
    <tspan x="50" dy="25">了他的同伴，偷偷溜走，成为了一个叛徒(traitor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The general was branded a traitor after he defected to the enemy.
  </text>
  <text x="50" y="310" class="content">
    将军叛逃到敌人那边后，被视为叛徒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloaked figure -->
    <path d="M50 50 L100 20 L150 50 L150 150 L50 150 Z" class="image" />
    <!-- Shadow -->
    <ellipse cx="100" cy="160" rx="50" ry="10" class="image" />
    <!-- Sneaking path -->
    <line x1="150" y1="50" x2="300" y2="200" class="image" />
    <!-- Arrow indicating betrayal -->
    <path d="M300 200 L250 250 L350 250 Z" class="image" />
  </g>
</svg>