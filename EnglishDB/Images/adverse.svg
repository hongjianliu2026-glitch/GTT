<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adverse</text>
  <text x="50" y="120" class="subtitle">[ˈædvɜːrs] adj. 不利的，相反的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + verse (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路，突然"转向(verse)"了
    <tspan x="50" dy="25">相反的方向，遇到了"不利(adverse)"的情况。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The adverse weather conditions made the journey difficult.
  </text>
  <text x="50" y="310" class="content">
    不利的天气条件使得旅程变得困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Arrow turning -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="140" y2="90" class="image" />
    <line x1="150" y1="100" x2="140" y2="110" class="image" />
    <!-- Adverse situation -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="240" y2="90" class="image" />
    <line x1="250" y1="100" x2="240" y2="110" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
  </g>
</svg>