<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">substantially</text>
  <text x="50" y="120" class="subtitle">[səbˈstænʃəli] adv. 大量地，实质上</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + stant (站立) + -ial (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地面上，"在下面(sub-)"
    <tspan x="50" dy="25">支撑着(stant)，这个支撑是"实质上(substantial)"的，</tspan>
    <tspan x="50" dy="25">所以"大量地(substantially)"表示非常多的支撑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was substantially completed by the deadline.
  </text>
  <text x="50" y="310" class="content">
    这个项目在截止日期前基本上完成了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Person standing -->
    <circle cx="175" cy="160" r="15" class="image" />
    <line x1="175" y1="175" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="190" x2="205" y2="180" class="image" />
    <!-- Support lines -->
    <line x1="100" y1="180" x2="250" y2="180" class="image" />
    <line x1="100" y1="170" x2="250" y2="170" class="image" />
    <line x1="100" y1="160" x2="250" y2="160" class="image" />
  </g>
</svg>