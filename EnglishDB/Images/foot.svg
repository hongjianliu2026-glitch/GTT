<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foot</text>
  <text x="50" y="120" class="subtitle">[fʊt] n. 脚，英尺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> foot (脚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地上，"脚(foot)"
    <tspan x="50" dy="25">支撑着整个身体，就像英尺(foot)一样，</tspan>
    <tspan x="50" dy="25">用来测量长度。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hurt her foot while playing soccer.
  </text>
  <text x="50" y="310" class="content">
    她在踢足球时伤了脚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Foot -->
    <path d="M50,100 Q100,50 150,100 T250,100" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <!-- Person -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="100" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
  </g>
</svg>