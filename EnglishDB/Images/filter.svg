<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">filter</text>
  <text x="50" y="120" class="subtitle">[ˈfɪltər] n. 过滤器；v. 过滤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> filt (过滤) + -er (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的漏斗，"过滤(filt)"
    <tspan x="50" dy="25">掉杂质，只留下纯净的水。这个漏斗就是过滤器(filter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a filter to remove the impurities from the water.
  </text>
  <text x="50" y="310" class="content">
    她用过滤器去除了水中的杂质。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Funnel -->
    <path d="M 0 0 L 100 0 L 150 100 L 50 100 Z" class="image" />
    <!-- Water droplets -->
    <circle cx="100" cy="120" r="10" class="image" />
    <circle cx="120" cy="130" r="10" class="image" />
    <circle cx="80" cy="140" r="10" class="image" />
    <!-- Impurities -->
    <circle cx="70" cy="50" r="5" class="image" />
    <circle cx="130" cy="60" r="5" class="image" />
    <circle cx="90" cy="70" r="5" class="image" />
  </g>
</svg>