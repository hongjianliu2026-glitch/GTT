<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inadequate</text>
  <text x="50" y="120" class="subtitle">[ˌɪnˈædɪkwət] adj. 不充分的，不适当的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + ad- (朝向) + equ (相等) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图用一个小杯子"朝向(ad-)"大海，
    <tspan x="50" dy="25">但杯子太小，无法装满水，这就是"不充分(inadequate)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The funding was inadequate to complete the project.
  </text>
  <text x="50" y="310" class="content">
    资金不足以完成这个项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small cup -->
    <rect x="50" y="20" width="50" height="80" class="image" />
    <!-- Ocean -->
    <rect x="0" y="100" width="350" height="100" class="image" />
    <!-- Person trying to fill the cup -->
    <circle cx="75" cy="150" r="15" class="image" />
    <line x1="75" y1="165" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="60" y2="230" class="image" />
    <line x1="75" y1="200" x2="90" y2="230" class="image" />
    <line x1="75" y1="180" x2="100" y2="170" class="image" />
  </g>
</svg>