<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fence</text>
  <text x="50" y="120" class="subtitle">[fens] n. 栅栏，围栏；v. 击剑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fen- (来自拉丁语 "fendere"，意为 "打击")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫用木板"打击(fen-)"地面，
    <tspan x="50" dy="25">竖起一道栅栏(fence)来保护他的田地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fence around the garden keeps the animals out.
  </text>
  <text x="50" y="310" class="content">
    花园周围的栅栏防止动物进入。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fence -->
    <line x1="0" y1="0" x2="0" y2="200" class="image" />
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <line x1="0" y1="50" x2="200" y2="50" class="image" />
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
    <line x1="0" y1="150" x2="200" y2="150" class="image" />
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
  </g>
</svg>