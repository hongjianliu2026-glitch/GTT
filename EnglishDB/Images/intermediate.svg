<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intermediate</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈmiːdiət] adj. 中间的，中级的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + medi (中间) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在学习过程中，"在两个阶段之间(inter-mediate)"
    <tspan x="50" dy="25">，从一个初级水平过渡到高级水平，这就是中级的(intermediate)状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is taking an intermediate French course.
  </text>
  <text x="50" y="310" class="content">
    她正在上中级法语课程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road with stages -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="150" y1="0" x2="150" y2="50" class="image" />
    <line x1="250" y1="0" x2="250" y2="50" class="image" />
    <!-- Student at intermediate stage -->
    <circle cx="150" cy="70" r="15" class="image" />
    <line x1="150" y1="85" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="100" x2="180" y2="90" class="image" />
  </g>
</svg>