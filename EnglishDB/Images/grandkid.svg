<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grandkid</text>
  <text x="50" y="120" class="subtitle">[ˈɡrændkɪd] n. 孙子，孙女</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grand- (大的) + kid (小孩)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的(grand-)小孩(kid)，
    <tspan x="50" dy="25">他/她就是你的孙子/孙女(grandkid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves playing with her grandkids.
  </text>
  <text x="50" y="310" class="content">
    她喜欢和她的孙子孙女们玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large child -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Grandparent -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="270" y2="250" class="image" />
    <line x1="300" y1="200" x2="330" y2="250" class="image" />
    <line x1="300" y1="150" x2="270" y2="140" class="image" />
    <line x1="300" y1="150" x2="330" y2="140" class="image" />
    <!-- Connection -->
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>