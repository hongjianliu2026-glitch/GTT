<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">repellent</text>
  <text x="50" y="120" class="subtitle">[rɪˈpelənt] adj. 排斥的，令人厌恶的；n. 驱虫剂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + pel (推) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一瓶驱虫剂，"向后推(re-pel)"
    <tspan x="50" dy="25">所有的虫子，虫子们纷纷逃离，这就是repellent的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smell of the repellent was so strong that it made me nauseous.
  </text>
  <text x="50" y="310" class="content">
    驱虫剂的味道太浓了，让我感到恶心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Spray -->
    <line x1="50" y1="0" x2="50" y2="20" class="image" />
    <line x1="40" y1="20" x2="60" y2="20" class="image" />
    <line x1="30" y1="40" x2="70" y2="40" class="image" />
    <line x1="20" y1="60" x2="80" y2="60" class="image" />
    <!-- Bugs -->
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="170" cy="70" r="10" class="image" />
    <circle cx="190" cy="90" r="10" class="image" />
    <line x1="150" y1="60" x2="140" y2="80" class="image" />
    <line x1="170" y1="80" x2="160" y2="100" class="image" />
    <line x1="190" y1="100" x2="180" y2="120" class="image" />
  </g>
</svg>