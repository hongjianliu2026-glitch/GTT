<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infamous</text>
  <text x="50" y="120" class="subtitle">[ˈɪnfəməs] adj. 声名狼藉的，臭名昭著的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + fam (名声) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"没有名声(in-fam-ous)"的人，
    <tspan x="50" dy="25">他的名声坏到极点，人人都知道他是个坏蛋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The infamous criminal was finally caught by the police.
  </text>
  <text x="50" y="310" class="content">
    那个臭名昭著的罪犯最终被警察抓获。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Badge -->
    <circle cx="50" cy="50" r="40" class="image" />
    <text x="35" y="60" class="content" fill="#B03A2E" font-size="36">!</text>
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M200,80 Q250,80 250,120 Q200,120 200,80 Z" class="image" />
    <text x="210" y="110" class="content" fill="#34495E">Bad!</text>
  </g>
</svg>