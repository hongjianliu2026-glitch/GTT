<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nomadic</text>
  <text x="50" y="120" class="subtitle">[noʊˈmædɪk] adj. 游牧的，流浪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nomad (游牧民) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群游牧民骑着骆驼，"四处漂泊(nomad)"，
    <tspan x="50" dy="25">他们的生活方式就是游牧的(nomadic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nomadic tribes of the desert follow the seasonal rains.
  </text>
  <text x="50" y="310" class="content">
    沙漠中的游牧部落随着季节性降雨而迁徙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camel -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Person on camel -->
    <circle cx="50" cy="80" r="10" class="image" />
    <line x1="50" y1="90" x2="50" y2="110" class="image" />
    <line x1="50" y1="110" x2="40" y2="120" class="image" />
    <line x1="50" y1="110" x2="60" y2="120" class="image" />
    <!-- Desert -->
    <line x1="0" y1="220" x2="400" y2="220" class="image" />
    <line x1="0" y1="240" x2="400" y2="240" class="image" />
    <line x1="0" y1="260" x2="400" y2="260" class="image" />
  </g>
</svg>