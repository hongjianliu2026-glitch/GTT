<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lopsided</text>
  <text x="50" y="120" class="subtitle">[ˌlɒpˈsaɪdɪd] adj. 不平衡的，倾斜的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lop (砍) + side (边) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树被"砍掉一边(lop-side)"，结果变得倾斜，
    <tspan x="50" dy="25">就像一个不平衡的跷跷板，这就是lopsided的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lopsided distribution of wealth is a major issue.
  </text>
  <text x="50" y="310" class="content">
    财富分配不均是一个主要问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="20" x2="50" y2="200" class="image" />
    <line x1="50" y1="20" x2="20" y2="50" class="image" />
    <line x1="50" y1="20" x2="80" y2="50" class="image" />
    <line x1="50" y1="20" x2="30" y2="70" class="image" />
    <line x1="50" y1="20" x2="70" y2="70" class="image" />
    <!-- Cut -->
    <line x1="40" y1="100" x2="60" y2="100" class="image" />
    <!-- Lopsided effect -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
  </g>
</svg>