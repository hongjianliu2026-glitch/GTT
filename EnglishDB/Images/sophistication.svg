<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sophistication</text>
  <text x="50" y="120" class="subtitle">[səˌfɪstɪˈkeɪʃən] n. 复杂，精致，老练</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soph (智慧) + istic (形容词后缀) + ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满智慧(soph)的老人，他穿着精致的西装，
    <tspan x="50" dy="25">手持一杯红酒，在高级餐厅里优雅地用餐，这就是老练(sophistication)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new smartphone is a marvel of engineering sophistication.
  </text>
  <text x="50" y="310" class="content">
    这款新智能手机是工程复杂性的杰作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old man -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Suit -->
    <rect x="30" y="120" width="40" height="60" class="image" />
    <!-- Wine glass -->
    <rect x="90" y="50" width="10" height="50" class="image" />
    <circle cx="95" cy="45" r="10" class="image" />
    <!-- Restaurant -->
    <rect x="0" y="180" width="150" height="100" class="image" />
    <line x1="20" y1="190" x2="130" y2="190" class="image" />
    <line x1="20" y1="210" x2="130" y2="210" class="image" />
    <line x1="20" y1="230" x2="130" y2="230" class="image" />
  </g>
</svg>