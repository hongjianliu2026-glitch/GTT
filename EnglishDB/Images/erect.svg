<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">erect</text>
  <text x="50" y="120" class="subtitle">[ɪˈrekt] v. 建立，竖立；adj. 直立的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + rect (直)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在那里，"伸出(e-)"
    <tspan x="50" dy="25">直立的身体(rect)，就像竖立(erect)的雕像一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They erected a monument in the park.
  </text>
  <text x="50" y="310" class="content">
    他们在公园里竖立了一座纪念碑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing upright -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="70" y2="120" class="image" /> <!-- Right arm -->

    <!-- Monument -->
    <rect x="100" y="20" width="50" height="180" class="image" />
    <line x1="100" y1="20" x2="150" y2="20" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="180" x2="150" y2="180" class="image" />
  </g>
</svg>