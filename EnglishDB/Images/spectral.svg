<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spectral</text>
  <text x="50" y="120" class="subtitle">[ˈspɛktrəl] adj. 光谱的，幽灵般的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spect (看) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幽灵在夜晚的森林中飘荡，它的身影在月光下显得"光谱般(spectral)"
    <tspan x="50" dy="25">模糊而神秘，仿佛是从另一个世界"看(spect)"过来的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spectral figure of the ghost haunted the old mansion.
  </text>
  <text x="50" y="310" class="content">
    幽灵的幽灵般的身影在老宅中徘徊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Moon -->
    <circle cx="200" cy="100" r="50" fill="#F1C40F" />
    <!-- Forest -->
    <rect x="0" y="200" width="400" height="100" fill="#2C3E50" />
    <!-- Ghost -->
    <circle cx="200" cy="150" r="20" fill="#ECF0F1" />
    <line x1="200" y1="170" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="180" y2="280" class="image" />
    <line x1="200" y1="250" x2="220" y2="280" class="image" />
    <line x1="200" y1="200" x2="170" y2="190" class="image" />
    <line x1="200" y1="200" x2="230" y2="190" class="image" />
  </g>
</svg>