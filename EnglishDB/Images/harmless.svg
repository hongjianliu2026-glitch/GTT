<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">harmless</text>
  <text x="50" y="120" class="subtitle">[ˈhɑrmləs] adj. 无害的，无恶意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> harm (伤害) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小兔子，它轻轻地跳过草地，"无伤害(harm-less)"
    <tspan x="50" dy="25">地与其他动物玩耍，展现出它的无害(harmless)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snake was harmless and did not bite.
  </text>
  <text x="50" y="310" class="content">
    这条蛇是无害的，没有咬人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#27AE60" />
    <!-- Rabbit -->
    <circle cx="100" cy="120" r="30" class="image" fill="#FFFFFF" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="170" x2="70" y2="160" class="image" />
    <line x1="100" y1="170" x2="130" y2="160" class="image" />
    <line x1="100" y1="200" x2="70" y2="230" class="image" />
    <line x1="100" y1="200" x2="130" y2="230" class="image" />
    <!-- Heart -->
    <path d="M200,120 C200,100 220,80 240,100 C260,80 280,100 280,120" class="image" fill="#E74C3C" />
  </g>
</svg>