<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spring</text>
  <text x="50" y="120" class="subtitle">[sprɪŋ] n. 春天，弹簧；v. 跳跃，弹起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spring (跳跃，弹起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小兔子在草地上"跳跃(spring)"，
    <tspan x="50" dy="25">突然被一个弹簧(spring)弹起，飞向空中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flowers start to bloom in spring.
  </text>
  <text x="50" y="310" class="content">
    春天，花儿开始绽放。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="180" width="350" height="20" class="image" fill="#27AE60" />
    <!-- Rabbit -->
    <circle cx="100" cy="160" r="20" class="image" fill="#F1C40F" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
    <line x1="100" y1="200" x2="120" y2="220" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
    <!-- Spring -->
    <rect x="200" y="150" width="20" height="50" class="image" fill="#8E44AD" />
    <line x1="210" y1="150" x2="210" y2="100" class="image" />
    <line x1="210" y1="100" x2="180" y2="120" class="image" />
    <line x1="210" y1="100" x2="240" y2="120" class="image" />
  </g>
</svg>