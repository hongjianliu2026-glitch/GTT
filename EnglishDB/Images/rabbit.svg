<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rabbit</text>
  <text x="50" y="120" class="subtitle">[ˈræbɪt] n. 兔子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rab (快速移动) + bit (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小兔子("小(bit)")在草地上快速("快速移动(rab)")
    <tspan x="50" dy="25">跳跃，它的速度快得让人眼花缭乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rabbit hopped quickly through the meadow.
  </text>
  <text x="50" y="310" class="content">
    兔子在草地上快速跳跃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rabbit -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="20" y2="90" class="image" /> <!-- Left ear -->
    <line x1="50" y1="100" x2="80" y2="90" class="image" /> <!-- Right ear -->
    <!-- Meadow -->
    <rect x="0" y="200" width="350" height="50" class="image" />
  </g>
</svg>