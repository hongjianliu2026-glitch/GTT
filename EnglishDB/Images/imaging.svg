<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imaging</text>
  <text x="50" y="120" class="subtitle">[ˈɪmɪdʒɪŋ] n. 成像，图像处理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + age (图像) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摄影师在拍摄照片，"进入(im-)"
    <tspan x="50" dy="25">图像(age)的世界，进行(ing)图像处理(imaging)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Advanced imaging techniques are used in medical diagnostics.
  </text>
  <text x="50" y="310" class="content">
    先进的成像技术用于医学诊断。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <circle cx="75" cy="50" r="30" class="image" />
    <!-- Lens -->
    <circle cx="75" cy="50" r="20" class="image" fill="#D35400" />
    <!-- Photographer -->
    <circle cx="20" cy="120" r="15" class="image" />
    <line x1="20" y1="135" x2="20" y2="170" class="image" />
    <line x1="20" y1="170" x2="0" y2="200" class="image" />
    <line x1="20" y1="170" x2="40" y2="200" class="image" />
    <line x1="20" y1="150" x2="50" y2="140" class="image" />
  </g>
</svg>