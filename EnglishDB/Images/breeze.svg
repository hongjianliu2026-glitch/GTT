<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">breeze</text>
  <text x="50" y="120" class="subtitle">[briːz] n. 微风，轻而易举的事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brev- (短) + -ez (轻)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一阵微风(breeze)轻轻地吹过，"短促而轻柔(brev-ez)"，
    <tspan x="50" dy="25">仿佛一切都在瞬间变得轻松愉快。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The task was a breeze for her.
  </text>
  <text x="50" y="310" class="content">
    这项任务对她来说轻而易举。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wind lines -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="50" y1="90" x2="150" y2="90" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
    <!-- Leaves -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="120" cy="70" r="10" class="image" />
    <circle cx="140" cy="90" r="10" class="image" />
    <circle cx="160" cy="110" r="10" class="image" />
    <circle cx="180" cy="130" r="10" class="image" />
  </g>
</svg>