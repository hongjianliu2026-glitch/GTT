<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drumming</text>
  <text x="50" y="120" class="subtitle">[ˈdrʌmɪŋ] n. 打鼓，敲击声；v. 打鼓，敲击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drum (鼓) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个鼓手在舞台上，"咚咚咚(drumming)"
    <tspan x="50" dy="25">地敲打着鼓，整个舞台都充满了节奏感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The drummer's drumming added excitement to the performance.
  </text>
  <text x="50" y="310" class="content">
    鼓手的打鼓声为表演增添了兴奋感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Drum -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <!-- Drummer -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Drumsticks -->
    <line x1="80" y1="100" x2="50" y2="70" class="image" />
    <line x1="120" y1="100" x2="150" y2="70" class="image" />
  </g>
</svg>