<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">raging</text>
  <text x="50" y="120" class="subtitle">[ˈreɪdʒɪŋ] adj. 狂怒的，猛烈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rage (愤怒) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头愤怒的狮子在咆哮，"愤怒(rage)"
    <tspan x="50" dy="25">的火焰在它眼中燃烧，这就是"狂怒的(raging)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The raging storm caused widespread damage.
  </text>
  <text x="50" y="310" class="content">
    猛烈的暴风雨造成了广泛的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion's head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 60 120 Q 100 150 140 120" class="image" />
    <!-- Fire in eyes -->
    <line x1="50" y1="70" x2="70" y2="90" class="image" />
    <line x1="130" y1="70" x2="150" y2="90" class="image" />
    <!-- Raging flames -->
    <path d="M 100 200 Q 50 250 100 300 Q 150 250 100 200" class="image" />
  </g>
</svg>