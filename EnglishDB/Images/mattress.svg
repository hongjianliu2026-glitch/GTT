<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .mattress { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mattress</text>
  <text x="50" y="120" class="subtitle">[ˈmætrɪs] n. 床垫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mat (垫子) + tress (加强)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的垫子(mat)，上面堆满了柔软的填充物，
    <tspan x="50" dy="25">形成了一个厚厚的床垫(mattress)，让你每晚都能舒适地入睡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a new mattress for her bedroom.
  </text>
  <text x="50" y="310" class="content">
    她为她的卧室买了一个新床垫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mattress -->
    <rect x="0" y="0" width="350" height="200" class="mattress" />
    <!-- Pillow -->
    <rect x="120" y="20" width="100" height="60" class="mattress" />
    <!-- Person sleeping -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="190" x2="230" y2="180" class="image" />
  </g>
</svg>