<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">throttle</text>
  <text x="50" y="120" class="subtitle">[ˈθrɒtl] v. 节流，减速；n. 节流阀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> throt (喉咙) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆赛车手在比赛中，"通过控制喉咙(throt-le)"
    <tspan x="50" dy="25">来减速，就像调节节流阀一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The driver had to throttle back to avoid a collision.
  </text>
  <text x="50" y="310" class="content">
    司机不得不减速以避免碰撞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throttle handle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Car -->
    <rect x="150" y="100" width="200" height="100" class="image" />
    <rect x="170" y="80" width="40" height="20" class="image" />
    <rect x="230" y="80" width="40" height="20" class="image" />
    <rect x="170" y="180" width="40" height="20" class="image" />
    <rect x="230" y="180" width="40" height="20" class="image" />
    <!-- Driver -->
    <circle cx="200" cy="60" r="15" class="image" />
    <line x1="200" y1="75" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="120" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
    <line x1="200" y1="85" x2="230" y2="75" class="image" />
  </g>
</svg>