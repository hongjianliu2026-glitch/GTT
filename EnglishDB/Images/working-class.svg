<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">working-class</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrkɪŋ klæs] n. 工人阶级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> work (工作) + class (阶级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群工人，他们每天辛勤工作，
    <tspan x="50" dy="25">构成了社会的"工作阶级(working-class)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy aims to benefit the working-class families.
  </text>
  <text x="50" y="310" class="content">
    新政策旨在惠及工人阶级家庭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Worker 1 -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />

    <!-- Worker 2 -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />

    <!-- Worker 3 -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />

    <!-- Tools -->
    <rect x="30" y="180" width="20" height="40" class="image" />
    <rect x="130" y="180" width="20" height="40" class="image" />
    <rect x="230" y="180" width="20" height="40" class="image" />
  </g>
</svg>