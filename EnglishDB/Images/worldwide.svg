<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">worldwide</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrldwaɪd] adj. 全世界的，全球的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> world (世界) + wide (广泛的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，上面布满了各种颜色的线条，
    <tspan x="50" dy="25">这些线条连接着世界各地，象征着"全球范围(worldwide)"的影响。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a worldwide presence.
  </text>
  <text x="50" y="310" class="content">
    这家公司在全世界都有业务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Globe -->
    <circle cx="200" cy="200" r="150" class="image" />
    <!-- Lines connecting continents -->
    <line x1="50" y1="50" x2="350" y2="350" class="image" />
    <line x1="50" y1="350" x2="350" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="350" class="image" />
    <line x1="50" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>