<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accordance</text>
  <text x="50" y="120" class="subtitle">[əˈkɔːrdns] n. 一致，符合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + cord (心) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人，他们的"心(cord)"紧紧相连，
    <tspan x="50" dy="25">就像两颗心被一根线(ac-)紧紧绑在一起，</tspan>
    <tspan x="50" dy="25">这种紧密的连接就是"一致(accordance)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His actions were in accordance with his words.
  </text>
  <text x="50" y="310" class="content">
    他的行为与他的言辞一致。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two hearts connected -->
    <path d="M50,50 C60,20 100,20 110,50 C120,80 100,110 80,110 C60,110 40,80 50,50" class="image" />
    <path d="M150,50 C160,20 200,20 210,50 C220,80 200,110 180,110 C160,110 140,80 150,50" class="image" />
    <line x1="110" y1="80" x2="150" y2="80" class="image" />
    <!-- Line connecting the hearts -->
    <line x1="80" y1="110" x2="180" y2="110" class="image" />
  </g>
</svg>