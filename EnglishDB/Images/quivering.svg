<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quivering</text>
  <text x="50" y="120" class="subtitle">[ˈkwɪvərɪŋ] adj. 颤抖的，抖动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quiv (颤抖) + -er (表示反复动作) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在寒风中"颤抖(quiv-er-ing)"，
    <tspan x="50" dy="25">它的羽毛都在微微抖动，仿佛随时都会被风吹走。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leaves were quivering in the breeze.
  </text>
  <text x="50" y="310" class="content">
    树叶在微风中颤抖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Quivering effect -->
    <line x1="50" y1="100" x2="45" y2="95" class="image" />
    <line x1="50" y1="100" x2="55" y2="95" class="image" />
    <line x1="50" y1="120" x2="45" y2="115" class="image" />
    <line x1="50" y1="120" x2="55" y2="115" class="image" />
    <line x1="50" y1="140" x2="45" y2="135" class="image" />
    <line x1="50" y1="140" x2="55" y2="135" class="image" />
  </g>
</svg>