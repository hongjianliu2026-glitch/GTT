<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">five-day</text>
  <text x="50" y="120" class="subtitle">[faɪv deɪ] adj. 五天的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> five (五) + day (天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个日历上，"五天(five-day)"
    <tspan x="50" dy="25">被高亮显示，表示一个为期五天的活动或计划。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The conference lasted for a five-day period.
  </text>
  <text x="50" y="310" class="content">
    会议持续了五天。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Days -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="110" y="20" width="50" height="50" class="image" />
    <rect x="170" y="20" width="50" height="50" class="image" />
    <rect x="230" y="20" width="50" height="50" class="image" />
    <rect x="290" y="20" width="50" height="50" class="image" />
    <!-- Highlighted days -->
    <rect x="50" y="20" width="250" height="50" fill="#FFD700" opacity="0.5" />
    <!-- Day numbers -->
    <text x="75" y="55" class="content">1</text>
    <text x="135" y="55" class="content">2</text>
    <text x="195" y="55" class="content">3</text>
    <text x="255" y="55" class="content">4</text>
    <text x="315" y="55" class="content">5</text>
  </g>
</svg>