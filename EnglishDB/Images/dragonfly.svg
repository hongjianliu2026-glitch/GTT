<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dragonfly</text>
  <text x="50" y="120" class="subtitle">[ˈdræɡənflaɪ] n. 蜻蜓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dragon (龙) + fly (飞)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蜻蜓，它的翅膀像龙的翅膀一样，"飞翔(fly)"
    <tspan x="50" dy="25">在空中，仿佛一条小龙在空中翱翔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dragonfly hovered above the pond.
  </text>
  <text x="50" y="310" class="content">
    蜻蜓在池塘上方盘旋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dragonfly body -->
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <!-- Dragonfly wings -->
    <polyline points="150,100 100,70 150,100 200,70" class="image" />
    <polyline points="150,100 100,130 150,100 200,130" class="image" />
    <!-- Dragon head -->
    <circle cx="150" cy="90" r="10" class="image" />
    <!-- Dragon eyes -->
    <circle cx="145" cy="85" r="2" class="image" />
    <circle cx="155" cy="85" r="2" class="image" />
  </g>
</svg>