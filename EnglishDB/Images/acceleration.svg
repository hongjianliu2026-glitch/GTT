<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acceleration</text>
  <text x="50" y="120" class="subtitle">[əkˌsɛləˈreɪʃən] n. 加速，加速度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + celer (快速) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆赛车在赛道上，"加强快速(ac-celer)"
    <tspan x="50" dy="25">行驶，速度越来越快，这就是加速度(acceleration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car's acceleration was impressive.
  </text>
  <text x="50" y="310" class="content">
    这辆车的加速性能令人印象深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Race car -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Car body -->
    <rect x="100" y="60" width="150" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="120" cy="120" r="20" class="image" />
    <circle cx="230" cy="120" r="20" class="image" />
    <!-- Speed lines -->
    <line x1="100" y1="40" x2="80" y2="20" class="image" />
    <line x1="150" y1="40" x2="130" y2="20" class="image" />
    <line x1="200" y1="40" x2="180" y2="20" class="image" />
    <line x1="250" y1="40" x2="230" y2="20" class="image" />
  </g>
</svg>