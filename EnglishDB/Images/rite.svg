<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rite</text>
  <text x="50" y="120" class="subtitle">[raɪt] n. 仪式，典礼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rit (仪式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的仪式，一群人围成一圈，
    <tspan x="50" dy="25">手持火把，进行着神秘的"仪式(rite)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wedding was a beautiful rite.
  </text>
  <text x="50" y="310" class="content">
    婚礼是一个美丽的仪式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Circle of people -->
    <circle cx="200" cy="200" r="150" class="image" />
    <!-- Torches -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="350" y1="50" x2="350" y2="150" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <!-- Fire -->
    <circle cx="50" cy="40" r="10" class="image" fill="#FFA500" />
    <circle cx="350" cy="40" r="10" class="image" fill="#FFA500" />
    <circle cx="200" cy="40" r="10" class="image" fill="#FFA500" />
  </g>
</svg>