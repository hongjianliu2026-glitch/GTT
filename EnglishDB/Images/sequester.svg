<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sequester</text>
  <text x="50" y="120" class="subtitle">[sɪˈkwestər] v. 使隔离，使隐退</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + quest (寻求) + -er (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"分开(se-)"到一个孤岛上，"寻求(quest)"
    <tspan x="50" dy="25">内心的平静，这就是"隔离(sequester)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jury was sequestered during the trial.
  </text>
  <text x="50" y="310" class="content">
    陪审团在审判期间被隔离。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Island -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Water -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="210" x2="350" y2="210" class="image" />
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
    <line x1="0" y1="230" x2="350" y2="230" class="image" />
  </g>
</svg>