<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diaspora</text>
  <text x="50" y="120" class="subtitle">[daɪˈæspərə] n. 离散，散居</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dia- (通过) + spere (散布)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人被"通过(dia-)"不同的路径"散布(spere)"到世界各地，
    <tspan x="50" dy="25">形成了离散的群体(diaspora)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Jewish diaspora spread across Europe.
  </text>
  <text x="50" y="310" class="content">
    犹太人散居在欧洲各地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Paths -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="20" y1="100" x2="330" y2="100" class="image" />
    <line x1="100" y1="20" x2="250" y2="180" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <circle cx="175" cy="20" r="10" class="image" />
    <circle cx="175" cy="180" r="10" class="image" />
    <circle cx="100" cy="20" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
  </g>
</svg>