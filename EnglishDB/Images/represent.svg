<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">represent</text>
  <text x="50" y="120" class="subtitle">[ˌreprɪˈzent] v. 代表，表现，象征</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + present (出现)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者站在舞台上，"再次出现(re-present)"
    <tspan x="50" dy="25">在观众面前，代表某个群体或观点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lawyer represented the defendant in court.
  </text>
  <text x="50" y="310" class="content">
    律师在法庭上代表被告。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
    <line x1="175" y1="140" x2="140" y2="130" class="image" />
    <line x1="175" y1="140" x2="210" y2="130" class="image" />
    <!-- Audience -->
    <circle cx="75" cy="150" r="10" class="image" />
    <circle cx="125" cy="150" r="10" class="image" />
    <circle cx="225" cy="150" r="10" class="image" />
    <circle cx="275" cy="150" r="10" class="image" />
  </g>
</svg>