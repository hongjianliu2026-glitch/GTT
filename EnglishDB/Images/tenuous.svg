<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tenuous</text>
  <text x="50" y="120" class="subtitle">[ˈtɛnjuəs] adj. 纤细的，脆弱的，稀薄的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tenu (细，薄) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根细如发丝的线，"细薄(tenu-ous)"
    <tspan x="50" dy="25">到几乎看不见，轻轻一碰就会断掉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The connection between the two theories is tenuous at best.
  </text>
  <text x="50" y="310" class="content">
    这两个理论之间的联系非常薄弱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thin line -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Broken line -->
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="270" y2="120" class="image" />
    <line x1="270" y1="120" x2="290" y2="100" class="image" />
    <!-- Finger touching the line -->
    <circle cx="320" cy="100" r="10" class="image" />
    <line x1="320" y1="110" x2="320" y2="150" class="image" />
    <line x1="320" y1="150" x2="300" y2="180" class="image" />
    <line x1="320" y1="150" x2="340" y2="180" class="image" />
  </g>
</svg>