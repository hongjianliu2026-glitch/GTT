<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E6FF; }
      .title { font: bold 48px sans-serif; fill: #6A1B9A; }
      .subtitle { font: italic 24px serif; fill: #4A148C; }
      .content { font: 18px sans-serif; fill: #311B92; }
      .highlight { font-weight: bold; fill: #D500F9; }
      .story { font: 16px serif; fill: #7C4DFF; }
      .image { stroke: #9575CD; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">violet</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪələt] n. 紫罗兰，紫色；adj. 紫色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> viol (紫色) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小紫罗兰(viol-et)在阳光下绽放，
    <tspan x="50" dy="25">它的紫色花瓣在微风中轻轻摇曳，散发出淡淡的香气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a dress the color of a deep violet.
  </text>
  <text x="50" y="310" class="content">
    她穿了一件深紫色的连衣裙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Violet flower -->
    <circle cx="100" cy="100" r="50" fill="#9C27B0" />
    <circle cx="120" cy="80" r="30" fill="#9C27B0" />
    <circle cx="80" cy="80" r="30" fill="#9C27B0" />
    <circle cx="100" cy="60" r="30" fill="#9C27B0" />
    <circle cx="120" cy="120" r="30" fill="#9C27B0" />
    <circle cx="80" cy="120" r="30" fill="#9C27B0" />
    <!-- Stem -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Leaves -->
    <path d="M100,250 Q150,200 100,150" class="image" fill="#4CAF50" />
    <path d="M100,250 Q50,200 100,150" class="image" fill="#4CAF50" />
  </g>
</svg>