<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">masonry</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪsənri] n. 砖石建筑，石工术</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mason (石匠) + -ry (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个石匠(mason)在砌墙，他用石头和砖块
    <tspan x="50" dy="25">精心堆砌，最终完成了一座坚固的砖石建筑(masonry)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient temple was built using intricate masonry techniques.
  </text>
  <text x="50" y="310" class="content">
    这座古老的寺庙是用复杂的石工技术建造的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bricks -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="110" y="20" width="50" height="30" class="image" />
    <rect x="170" y="20" width="50" height="30" class="image" />
    <rect x="230" y="20" width="50" height="30" class="image" />
    <rect x="50" y="60" width="50" height="30" class="image" />
    <rect x="110" y="60" width="50" height="30" class="image" />
    <rect x="170" y="60" width="50" height="30" class="image" />
    <rect x="230" y="60" width="50" height="30" class="image" />
    <rect x="50" y="100" width="50" height="30" class="image" />
    <rect x="110" y="100" width="50" height="30" class="image" />
    <rect x="170" y="100" width="50" height="30" class="image" />
    <rect x="230" y="100" width="50" height="30" class="image" />
    <!-- Mason -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>