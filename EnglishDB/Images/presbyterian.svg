<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Presbyterian</text>
  <text x="50" y="120" class="subtitle">[ˌprezbɪˈtɪəriən] n. 长老会教徒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> presby- (长老) + -terian (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位长老(presby-)坐在教堂里，周围都是他的追随者(terian)，
    <tspan x="50" dy="25">他们共同构成了长老会(Presbyterian)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a devout Presbyterian who attends church regularly.
  </text>
  <text x="50" y="310" class="content">
    他是一位虔诚的长老会教徒，经常去教堂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Elder -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Followers -->
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="180" cy="100" r="15" class="image" />
    <circle cx="240" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="180" y1="115" x2="180" y2="150" class="image" />
    <line x1="240" y1="115" x2="240" y2="150" class="image" />
  </g>
</svg>