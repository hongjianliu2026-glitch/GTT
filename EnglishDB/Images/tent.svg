<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tent</text>
  <text x="50" y="120" class="subtitle">[tent] n. 帐篷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tent (来自拉丁语 "tenta"，意为“张开”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的帐篷，"张开(tent)"
    <tspan x="50" dy="25">它的帆布，像一个巨人的手臂，覆盖着整个露营地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They pitched a tent by the lake.
  </text>
  <text x="50" y="310" class="content">
    他们在湖边搭了一个帐篷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tent -->
    <polygon points="0,150 150,0 300,150" class="image" />
    <line x1="0" y1="150" x2="300" y2="150" class="image" />
    <line x1="150" y1="0" x2="150" y2="150" class="image" />
    <!-- Ground -->
    <line x1="0" y1="150" x2="300" y2="150" class="image" />
    <!-- Pegs -->
    <line x1="0" y1="150" x2="0" y2="170" class="image" />
    <line x1="300" y1="150" x2="300" y2="170" class="image" />
    <!-- Ropes -->
    <line x1="0" y1="150" x2="150" y2="100" class="image" />
    <line x1="300" y1="150" x2="150" y2="100" class="image" />
  </g>
</svg>