<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aristocratic</text>
  <text x="50" y="120" class="subtitle">[ˌærɪstəˈkrætɪk] adj. 贵族的，贵族式的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aristo- (最好的) + -cracy (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群穿着华丽服饰的贵族，他们自认为是"最好的(aristo-)"
    <tspan x="50" dy="25">统治者(cracy)，他们的举止和生活方式都显得非常高贵和优雅。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has an aristocratic bearing, with her elegant manners and refined speech.
  </text>
  <text x="50" y="310" class="content">
    她有着贵族的气质，举止优雅，谈吐文雅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <circle cx="100" cy="50" r="30" class="image" />
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <line x1="85" y1="20" x2="115" y2="20" class="image" />
    <line x1="85" y1="20" x2="70" y2="50" class="image" />
    <line x1="115" y1="20" x2="130" y2="50" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="260" class="image" />
    <line x1="100" y1="220" x2="120" y2="260" class="image" />
    <line x1="100" y1="190" x2="70" y2="180" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
    <!-- Robe -->
    <path d="M80,260 Q100,240 120,260" class="image" />
    <path d="M80,260 Q100,280 120,260" class="image" />
  </g>
</svg>