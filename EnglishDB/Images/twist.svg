<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twist</text>
  <text x="50" y="120" class="subtitle">[twɪst] v. 扭曲，缠绕；n. 扭曲，转折</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twi- (二) + st (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根绳子被"两端站立(twi-st)"，
    <tspan x="50" dy="25">结果绳子被扭曲成了一个复杂的结。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plot of the movie has a surprising twist.
  </text>
  <text x="50" y="310" class="content">
    这部电影的情节有一个出人意料的转折。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rope -->
    <path d="M50 50 Q100 100 150 50 T250 50" class="image" />
    <path d="M50 100 Q100 150 150 100 T250 100" class="image" />
    <path d="M50 150 Q100 200 150 150 T250 150" class="image" />
    <!-- Knot -->
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Hands -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
  </g>
</svg>