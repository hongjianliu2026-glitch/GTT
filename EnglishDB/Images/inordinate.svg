<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inordinate</text>
  <text x="50" y="120" class="subtitle">[ɪˈnɔːrdɪnət] adj. 过度的，过分的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + ordin (顺序) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为"没有顺序(in-ordin)"而过度(inordinate)
    <tspan x="50" dy="25">地吃东西，结果肚子胀得像气球一样大。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His inordinate spending habits led to bankruptcy.
  </text>
  <text x="50" y="310" class="content">
    他过度的消费习惯导致破产。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Over-eating -->
    <rect x="30" y="180" width="40" height="40" class="image" />
    <circle cx="50" cy="200" r="20" class="image" />
    <circle cx="50" cy="220" r="25" class="image" />
    <circle cx="50" cy="240" r="30" class="image" />
    <circle cx="50" cy="260" r="35" class="image" />
    <circle cx="50" cy="280" r="40" class="image" />
  </g>
</svg>