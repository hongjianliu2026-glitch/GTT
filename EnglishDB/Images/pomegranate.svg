<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fruit { fill: #D35400; }
      .seeds { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pomegranate</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːmɪɡrænɪt] n. 石榴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pome (苹果) + gran (谷物) + ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"苹果(pome)"，里面装满了无数的"谷物(gran)"，
    <tspan x="50" dy="25">这些谷物就是石榴的种子，整个画面就像一个石榴(pomegranate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat pomegranate seeds.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃石榴籽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pomegranate -->
    <circle cx="100" cy="100" r="80" class="fruit" />
    <!-- Seeds -->
    <circle cx="60" cy="60" r="10" class="seeds" />
    <circle cx="140" cy="60" r="10" class="seeds" />
    <circle cx="100" cy="140" r="10" class="seeds" />
    <circle cx="70" cy="120" r="10" class="seeds" />
    <circle cx="130" cy="120" r="10" class="seeds" />
    <circle cx="85" cy="85" r="10" class="seeds" />
    <circle cx="115" cy="85" r="10" class="seeds" />
    <circle cx="100" cy="110" r="10" class="seeds" />
  </g>
</svg>