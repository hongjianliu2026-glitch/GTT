<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mutilation</text>
  <text x="50" y="120" class="subtitle">[ˌmjuːtɪˈleɪʃn] n. 残害，毁伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> muti (切断) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手被"切断(muti)"，血淋淋的场景，这就是残害(mutilation)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The animal suffered severe mutilation in the accident.
  </text>
  <text x="50" y="310" class="content">
    这只动物在事故中遭受了严重的残害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hand -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="50" y1="100" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Blood -->
    <circle cx="50" cy="150" r="10" fill="#E74C3C" />
    <circle cx="70" cy="130" r="8" fill="#E74C3C" />
    <circle cx="30" cy="130" r="8" fill="#E74C3C" />
  </g>
</svg>