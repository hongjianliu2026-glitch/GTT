<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">remove</text>
  <text x="50" y="120" class="subtitle">[rɪˈmuːv] v. 移除，去掉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + move (移动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用力"向后移动(re-move)"
    <tspan x="50" dy="25">一个物体，这个动作就是移除(remove)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please remove your shoes before entering the house.
  </text>
  <text x="50" y="310" class="content">
    请在进屋前脱掉鞋子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person pulling object -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Object being pulled -->
    <rect x="100" y="150" width="50" height="30" class="image" />
    <line x1="125" y1="150" x2="50" y2="140" class="image" /> <!-- Rope -->
  </g>
</svg>