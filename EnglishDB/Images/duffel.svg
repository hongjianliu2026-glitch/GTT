<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">duffel</text>
  <text x="50" y="120" class="subtitle">[ˈdʌfəl] n. 粗呢包，旅行袋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自荷兰地名 Duffel，以生产粗呢布料闻名
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅行者背着一只巨大的"Duffel"包，
    <tspan x="50" dy="25">包里装满了从Duffel镇买来的粗呢布料，</tspan>
    <tspan x="50" dy="25">准备带回家做各种实用的物品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He packed his duffel bag for the weekend trip.
  </text>
  <text x="50" y="310" class="content">
    他为周末旅行打包了他的粗呢包。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Duffel bag -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Strap -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <!-- Handle -->
    <rect x="75" y="10" width="50" height="10" class="image" />
    <!-- Contents -->
    <rect x="20" y="30" width="160" height="100" class="image" />
    <!-- Fabric texture -->
    <line x1="20" y1="30" x2="180" y2="130" class="image" />
    <line x1="20" y1="130" x2="180" y2="30" class="image" />
    <!-- Traveler -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="120" x2="280" y2="110" class="image" />
  </g>
</svg>