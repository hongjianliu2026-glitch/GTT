<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">normalcy</text>
  <text x="50" y="120" class="subtitle">[ˈnɔːrməlsi] n. 正常状态，常态</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> norm (标准) + -al (形容词后缀) + -cy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世界，每个人都在按照"标准(norm)"
    <tspan x="50" dy="25">生活，一切都井然有序，这就是常态(normalcy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the storm, the town returned to normalcy.
  </text>
  <text x="50" y="310" class="content">
    风暴过后，小镇恢复了正常状态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- World map -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Standard lines -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <!-- People -->
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="230" cy="80" r="10" class="image" />
    <circle cx="175" cy="40" r="10" class="image" />
    <circle cx="175" cy="160" r="10" class="image" />
  </g>
</svg>