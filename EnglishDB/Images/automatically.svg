<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">automatically</text>
  <text x="50" y="120" class="subtitle">[ˌɔːtəˈmætɪkli] adv. 自动地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auto- (自动) + mat (移动) + -ic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台机器，"自动移动(auto-mat)"
    <tspan x="50" dy="25">无需人工干预，完全自动地完成任务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The system automatically updates itself every night.
  </text>
  <text x="50" y="310" class="content">
    系统每晚自动更新。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gear -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="70" x2="50" y2="130" class="image" />
    <line x1="35" y1="85" x2="65" y2="115" class="image" />
    <line x1="35" y1="115" x2="65" y2="85" class="image" />
    <!-- Moving parts -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
  </g>
</svg>