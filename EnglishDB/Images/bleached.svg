<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bleached</text>
  <text x="50" y="120" class="subtitle">[blitʃt] adj. 漂白的，褪色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bleach (漂白) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件白色的衣服被太阳晒得"漂白(bleach)"，
    <tspan x="50" dy="25">颜色完全褪去，变成了"漂白的(bleached)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old curtains were bleached by the sun.
  </text>
  <text x="50" y="310" class="content">
    旧窗帘被太阳晒得褪色了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Clothes line -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <!-- Bleached clothes -->
    <rect x="20" y="150" width="30" height="50" class="image" fill="#FFFFFF" />
    <rect x="70" y="150" width="30" height="50" class="image" fill="#FFFFFF" />
    <rect x="120" y="150" width="30" height="50" class="image" fill="#FFFFFF" />
  </g>
</svg>