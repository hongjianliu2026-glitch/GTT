<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dilution</text>
  <text x="50" y="120" class="subtitle">[daɪˈluːʃn] n. 稀释，冲淡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + lut (洗) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯浓咖啡被"分开(di-)"并"洗(lut)"入大量的水中，
    <tspan x="50" dy="25">咖啡的味道被冲淡了，这就是稀释(dilution)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dilution of the stock made its value drop significantly.
  </text>
  <text x="50" y="310" class="content">
    股票的稀释使其价值大幅下降。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup of coffee -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <!-- Water pouring -->
    <line x1="120" y1="50" x2="200" y2="50" class="image" />
    <line x1="120" y1="80" x2="200" y2="80" class="image" />
    <line x1="120" y1="110" x2="200" y2="110" class="image" />
    <line x1="120" y1="140" x2="200" y2="140" class="image" />
    <!-- Diluted coffee -->
    <rect x="220" y="0" width="100" height="150" class="image" />
    <!-- Water -->
    <line x1="240" y1="20" x2="280" y2="20" class="image" />
    <line x1="240" y1="50" x2="280" y2="50" class="image" />
    <line x1="240" y1="80" x2="280" y2="80" class="image" />
    <line x1="240" y1="110" x2="280" y2="110" class="image" />
    <line x1="240" y1="140" x2="280" y2="140" class="image" />
  </g>
</svg>