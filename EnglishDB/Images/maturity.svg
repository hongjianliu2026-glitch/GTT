<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maturity</text>
  <text x="50" y="120" class="subtitle">[məˈtʃʊrɪti] n. 成熟，到期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> matur (成熟) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苹果从青涩到成熟，"成熟(matur)"
    <tspan x="50" dy="25">的过程就是maturity，象征着成长和完成。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The maturity of the project was evident in its flawless execution.
  </text>
  <text x="50" y="310" class="content">
    项目的成熟在它的完美执行中显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Apple tree -->
    <line x1="50" y1="200" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="50" y1="50" x2="0" y2="100" class="image" />
    <!-- Green apple -->
    <circle cx="30" cy="150" r="20" fill="#7F8C8D" />
    <!-- Red apple -->
    <circle cx="70" cy="150" r="20" fill="#E74C3C" />
    <!-- Text annotations -->
    <text x="20" y="190" class="content" fill="#7F8C8D">青涩</text>
    <text x="60" y="190" class="content" fill="#E74C3C">成熟</text>
  </g>
</svg>