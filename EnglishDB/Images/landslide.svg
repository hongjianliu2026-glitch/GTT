<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">landslide</text>
  <text x="50" y="120" class="subtitle">[ˈlændslaɪd] n. 山体滑坡，压倒性胜利</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> land (土地) + slide (滑动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场暴雨过后，"土地(land)"开始"滑动(slide)"，
    <tspan x="50" dy="25">巨大的岩石和泥土像瀑布一样倾泻而下，这就是山体滑坡(landslide)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heavy rain caused a landslide that blocked the road.
  </text>
  <text x="50" y="310" class="content">
    大雨引发的山体滑坡堵塞了道路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,0 150,0 75,150" class="image" />
    <!-- Slide path -->
    <polyline points="75,150 75,250 150,250" class="image" />
    <!-- Rocks and dirt -->
    <circle cx="100" cy="200" r="10" class="image" />
    <circle cx="120" cy="220" r="15" class="image" />
    <circle cx="80" cy="230" r="12" class="image" />
    <circle cx="110" cy="240" r="8" class="image" />
    <!-- Rain -->
    <line x1="50" y1="0" x2="50" y2="10" class="image" />
    <line x1="60" y1="0" x2="60" y2="10" class="image" />
    <line x1="70" y1="0" x2="70" y2="10" class="image" />
    <line x1="80" y1="0" x2="80" y2="10" class="image" />
    <line x1="90" y1="0" x2="90" y2="10" class="image" />
  </g>
</svg>