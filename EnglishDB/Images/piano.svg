<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">piano</text>
  <text x="50" y="120" class="subtitle">[piˈænoʊ] n. 钢琴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pian (来自意大利语，意为“轻柔的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在演奏钢琴，"轻柔地(pian)"
    <tspan x="50" dy="25">弹奏出美妙的旋律，这就是钢琴(piano)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She plays the piano beautifully.
  </text>
  <text x="50" y="310" class="content">
    她钢琴弹得非常美妙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Piano -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <rect x="20" y="20" width="310" height="60" class="image" />
    <!-- Keys -->
    <rect x="30" y="25" width="20" height="50" class="image" />
    <rect x="60" y="25" width="20" height="50" class="image" />
    <rect x="90" y="25" width="20" height="50" class="image" />
    <rect x="120" y="25" width="20" height="50" class="image" />
    <rect x="150" y="25" width="20" height="50" class="image" />
    <rect x="180" y="25" width="20" height="50" class="image" />
    <rect x="210" y="25" width="20" height="50" class="image" />
    <rect x="240" y="25" width="20" height="50" class="image" />
    <rect x="270" y="25" width="20" height="50" class="image" />
    <rect x="300" y="25" width="20" height="50" class="image" />
    <!-- Musician -->
    <circle cx="20" cy="120" r="15" class="image" />
    <line x1="20" y1="135" x2="20" y2="170" class="image" />
    <line x1="20" y1="170" x2="0" y2="200" class="image" />
    <line x1="20" y1="170" x2="40" y2="200" class="image" />
    <line x1="20" y1="150" x2="50" y2="140" class="image" />
  </g>
</svg>