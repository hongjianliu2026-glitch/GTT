<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bench</text>
  <text x="50" y="120" class="subtitle">[bentʃ] n. 长凳，工作台；v. 坐在长凳上</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> benc (长凳)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个公园里，人们坐在长凳(bench)上，
    <tspan x="50" dy="25">享受着阳光和微风，长凳成为了他们休息的地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They sat on the bench in the park, chatting and laughing.
  </text>
  <text x="50" y="310" class="content">
    他们坐在公园的长凳上，聊天和欢笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bench -->
    <rect x="0" y="0" width="300" height="50" class="image" />
    <line x1="0" y1="0" x2="0" y2="100" class="image" />
    <line x1="300" y1="0" x2="300" y2="100" class="image" />
    <!-- People sitting on the bench -->
    <circle cx="50" cy="120" r="15" class="image" />
    <line x1="50" y1="135" x2="50" y2="170" class="image" />
    <line x1="50" y1="170" x2="30" y2="200" class="image" />
    <line x1="50" y1="170" x2="70" y2="200" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />

    <circle cx="150" cy="120" r="15" class="image" />
    <line x1="150" y1="135" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="150" x2="200" y2="140" class="image" />
  </g>
</svg>