<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sock { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stocking</text>
  <text x="50" y="120" class="subtitle">[ˈstɒkɪŋ] n. 长筒袜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stock (树干) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的长筒袜，"像树干(stock)"一样
    <tspan x="50" dy="25">从地面延伸到天空，里面装满了礼物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore red stockings for the holiday party.
  </text>
  <text x="50" y="310" class="content">
    她为节日派对穿上了红色长筒袜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stocking -->
    <path d="M 0 0 L 0 200 Q 50 250 100 200 L 100 0 Z" class="sock" />
    <!-- Gift inside -->
    <rect x="20" y="50" width="60" height="40" class="image" />
    <rect x="20" y="100" width="60" height="40" class="image" />
    <rect x="20" y="150" width="60" height="40" class="image" />
  </g>
</svg>