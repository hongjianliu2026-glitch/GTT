<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">phosphate</text>
  <text x="50" y="120" class="subtitle">[ˈfɒsfeɪt] n. 磷酸盐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> phosphor (光) + -ate (表示化合物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个发光的磷(phosphor)，它与酸结合形成磷酸盐(phosphate)，
    <tspan x="50" dy="25">这种化合物在黑暗中闪闪发光，就像夜空中的星星。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plant needs phosphate to grow strong.
  </text>
  <text x="50" y="310" class="content">
    植物需要磷酸盐才能茁壮成长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Phosphorus symbol -->
    <circle cx="50" cy="100" r="30" class="image" />
    <text x="40" y="110" class="content" fill="#E74C3C">P</text>
    <!-- Acid symbol -->
    <rect x="100" y="80" width="60" height="40" class="image" />
    <text x="110" y="110" class="content" fill="#2980B9">H</text>
    <!-- Resulting compound -->
    <rect x="180" y="80" width="60" height="40" class="image" />
    <text x="190" y="110" class="content" fill="#16A085">PO₄</text>
    <!-- Star effect -->
    <line x1="210" y1="100" x2="230" y2="120" class="image" />
    <line x1="210" y1="100" x2="230" y2="80" class="image" />
    <line x1="210" y1="100" x2="190" y2="120" class="image" />
    <line x1="210" y1="100" x2="190" y2="80" class="image" />
  </g>
</svg>