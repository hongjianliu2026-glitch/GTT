<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">valley</text>
  <text x="50" y="120" class="subtitle">[ˈvæli] n. 山谷，流域</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> val (山谷) + ley (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山谷，两旁是高耸的山峰，
    <tspan x="50" dy="25">中间是一条蜿蜒的河流，这就是一个典型的山谷(valley)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The river flows through the beautiful valley.
  </text>
  <text x="50" y="310" class="content">
    这条河流穿过美丽的山谷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountains -->
    <path d="M0 200 L100 50 L200 200 Z" class="image" />
    <path d="M150 200 L250 50 L350 200 Z" class="image" />
    <!-- River -->
    <path d="M100 200 Q175 150 250 200" class="image" fill="none" stroke="#3498DB" stroke-width="5" />
    <!-- Trees -->
    <circle cx="50" cy="180" r="10" class="image" fill="#27AE60" />
    <circle cx="150" cy="180" r="10" class="image" fill="#27AE60" />
    <circle cx="250" cy="180" r="10" class="image" fill="#27AE60" />
  </g>
</svg>