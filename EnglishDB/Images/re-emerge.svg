<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">re-emerge</text>
  <text x="50" y="120" class="subtitle">[ˌriːɪˈmɜːrdʒ] v. 重新出现</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + emerge (出现)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只沉睡的巨龙，"再次(re-)"从山洞中"出现(emerge)"，
    <tspan x="50" dy="25">它的身影在阳光下重新显现，震撼人心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After years of absence, the old tradition re-emerged in the village.
  </text>
  <text x="50" y="310" class="content">
    经过多年的消失，这个古老的传统在村庄里重新出现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 0 L200 200 Z" class="image" />
    <!-- Dragon -->
    <circle cx="100" cy="150" r="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="220" x2="50" y2="200" class="image" />
    <line x1="100" y1="220" x2="150" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="20" class="image" fill="#F1C40F" />
  </g>
</svg>