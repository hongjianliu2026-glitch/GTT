<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smoker</text>
  <text x="50" y="120" class="subtitle">[ˈsmoʊkər] n. 吸烟者，吸烟室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smok (烟) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在吸烟室里，嘴里吐出浓烟，这个人就是"吸烟者(smoker)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a heavy smoker and often goes to the smoking room.
  </text>
  <text x="50" y="310" class="content">
    他是个烟瘾很大的人，经常去吸烟室。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Smoking room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Smoke -->
    <path d="M100,100 Q120,80 140,100 Q160,120 180,100" class="image" />
    <path d="M100,120 Q120,100 140,120 Q160,140 180,120" class="image" />
    <path d="M100,140 Q120,120 140,140 Q160,160 180,140" class="image" />
  </g>
</svg>