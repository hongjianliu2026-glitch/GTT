<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interval</text>
  <text x="50" y="120" class="subtitle">[ˈɪntərvəl] n. 间隔，间距</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + val (墙)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两堵墙之间有一个"间隔(inter-val)"，
    <tspan x="50" dy="25">这个间隔就像音乐中的休止符，给旋律带来了节奏感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The interval between the two performances was 15 minutes.
  </text>
  <text x="50" y="310" class="content">
    两场演出之间的间隔是15分钟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Walls -->
    <rect x="0" y="0" width="50" height="200" class="image" />
    <rect x="150" y="0" width="50" height="200" class="image" />
    <!-- Interval -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <line x1="50" y1="160" x2="150" y2="160" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <!-- Music note -->
    <circle cx="100" cy="50" r="10" class="image" />
    <line x1="100" y1="60" x2="100" y2="100" class="image" />
    <line x1="100" y1="80" x2="80" y2="70" class="image" />
    <line x1="100" y1="80" x2="120" y2="70" class="image" />
  </g>
</svg>