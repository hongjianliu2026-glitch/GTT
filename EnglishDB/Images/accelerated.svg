<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accelerated</text>
  <text x="50" y="120" class="subtitle">[əkˈsɛləˌreɪtɪd] adj. 加速的，加快的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + celer (快速) + -ate (动词后缀) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆赛车在赛道上，"加强快速(ac-celer-ate-ed)"
    <tspan x="50" dy="25">地飞驰，速度快得让人眼花缭乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's growth has been accelerated by recent investments.
  </text>
  <text x="50" y="310" class="content">
    最近的投资使公司的增长速度加快了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Race track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="80" width="100" height="40" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <circle cx="60" cy="120" r="10" class="image" />
    <circle cx="140" cy="120" r="10" class="image" />
    <!-- Speed lines -->
    <line x1="160" y1="80" x2="200" y2="80" class="image" />
    <line x1="160" y1="100" x2="200" y2="100" class="image" />
    <line x1="160" y1="120" x2="200" y2="120" class="image" />
    <line x1="160" y1="140" x2="200" y2="140" class="image" />
  </g>
</svg>