<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stop</text>
  <text x="50" y="120" class="subtitle">[stɒp] v. 停止，阻止；n. 停止，车站</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + -op (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆飞驰的汽车突然"站立(st-)"在路中间，
    <tspan x="50" dy="25">就像被施了魔法一样，瞬间停止(stop)了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The train will stop at the next station.
  </text>
  <text x="50" y="310" class="content">
    火车将在下一站停靠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="170" cy="100" r="10" class="image" />
    <circle cx="230" cy="100" r="10" class="image" />
    <!-- Stop sign -->
    <rect x="270" y="20" width="50" height="50" class="image" />
    <text x="280" y="50" class="content" style="font-size: 24px; fill: #FFFFFF;">STOP</text>
  </g>
</svg>