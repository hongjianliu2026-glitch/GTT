<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defensive</text>
  <text x="50" y="120" class="subtitle">[dɪˈfensɪv] adj. 防御的，自卫的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + fens (打击) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对攻击时，"向下打击(de-fens)"
    <tspan x="50" dy="25">以保护自己，这种行为就是防御的(defensive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He adopted a defensive posture during the argument.
  </text>
  <text x="50" y="310" class="content">
    他在争论中采取了防御的姿态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="0,0 100,0 150,50 100,100 0,100" class="image" />
    <!-- Person -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="90" x2="240" y2="80" class="image" />
    <!-- Attack arrow -->
    <line x1="300" y1="50" x2="220" y2="50" class="image" />
    <polygon points="300,50 290,45 290,55" class="image" />
  </g>
</svg>