<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hardship</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrdʃɪp] n. 艰难，困苦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hard (艰难) + ship (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在"艰难(hard)"的环境中挣扎，
    <tspan x="50" dy="25">这种状态(ship)就是困苦(hardship)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She endured many hardships during the war.
  </text>
  <text x="50" y="310" class="content">
    她在战争期间经历了许多艰难困苦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,100 L100,0 L200,100 Z" class="image" />
    <!-- Person struggling -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Arrow pointing up -->
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <polygon points="90,50 110,50 100,30" class="image" />
  </g>
</svg>