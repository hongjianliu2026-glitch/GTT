<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">memorable</text>
  <text x="50" y="120" class="subtitle">[ˈmɛmərəbl] adj. 值得纪念的，难忘的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> memor (记忆) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的记忆宫殿，里面装满了"值得记忆(memor-able)"
    <tspan x="50" dy="25">的珍贵瞬间，这些瞬间让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concert was a memorable experience for everyone.
  </text>
  <text x="50" y="310" class="content">
    这场音乐会对每个人来说都是一次难忘的经历。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Memory palace -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Memory bubbles -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="80" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="80" r="20" class="image" />
    <!-- Text in bubbles -->
    <text x="40" y="55" class="content">1</text>
    <text x="90" y="85" class="content">2</text>
    <text x="190" y="55" class="content">3</text>
    <text x="240" y="85" class="content">4</text>
  </g>
</svg>