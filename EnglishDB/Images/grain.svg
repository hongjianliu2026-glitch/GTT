<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grain</text>
  <text x="50" y="120" class="subtitle">[ɡreɪn] n. 谷物，颗粒；v. 使成粒状</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gran (谷物，颗粒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的谷仓，里面堆满了金黄色的谷物(gran)，
    <tspan x="50" dy="25">每一粒谷物都像是一个小小的世界，这就是"谷物(grain)"的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She grinds the grain into flour for baking bread.
  </text>
  <text x="50" y="310" class="content">
    她把谷物磨成面粉用来烤面包。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Barn -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Grain -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="80" cy="120" r="10" class="image" />
    <circle cx="110" cy="90" r="10" class="image" />
    <circle cx="140" cy="110" r="10" class="image" />
    <circle cx="170" cy="80" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="230" cy="120" r="10" class="image" />
    <circle cx="260" cy="90" r="10" class="image" />
    <circle cx="290" cy="110" r="10" class="image" />
    <circle cx="320" cy="80" r="10" class="image" />
  </g>
</svg>