<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ballpark</text>
  <text x="50" y="120" class="subtitle">[ˈbɔːlpɑːrk] n. 棒球场；adj. 大致的，粗略的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ball (球) + park (场地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的棒球场，"球(ball)"在"场地(park)"上飞舞，
    <tspan x="50" dy="25">观众们欢呼雀跃，这就是一个"大致的(ballpark)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Can you give me a ballpark figure for the cost?
  </text>
  <text x="50" y="310" class="content">
    你能给我一个大致的费用估算吗？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baseball field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Baseball diamond -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Home plate -->
    <rect x="170" y="160" width="10" height="10" class="image" />
    <!-- Bases -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="170" cy="100" r="10" class="image" />
    <circle cx="270" cy="100" r="10" class="image" />
    <!-- Baseball -->
    <circle cx="170" cy="50" r="15" class="image" />
    <!-- Crowd -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
  </g>
</svg>