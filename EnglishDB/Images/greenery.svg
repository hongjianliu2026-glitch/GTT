<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .green { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">greenery</text>
  <text x="50" y="120" class="subtitle">[ˈɡriːnəri] n. 绿叶，绿色植物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> green (绿色) + -ery (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片郁郁葱葱的绿色植物，"绿色(green)"
    <tspan x="50" dy="25">覆盖了整个区域，这就是绿叶(greenery)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The park is full of greenery, providing a peaceful environment.
  </text>
  <text x="50" y="310" class="content">
    公园里满是绿叶，提供了一个宁静的环境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Green leaves -->
    <circle cx="50" cy="50" r="40" class="green" />
    <circle cx="120" cy="50" r="40" class="green" />
    <circle cx="85" cy="100" r="40" class="green" />
    <circle cx="155" cy="100" r="40" class="green" />
    <circle cx="120" cy="150" r="40" class="green" />
    <circle cx="50" cy="150" r="40" class="green" />
    <circle cx="85" cy="200" r="40" class="green" />
    <circle cx="155" cy="200" r="40" class="green" />
  </g>
</svg>