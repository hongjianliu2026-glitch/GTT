<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E9E2; }
      .title { font: bold 48px sans-serif; fill: #8C3D3D; }
      .subtitle { font: italic 24px serif; fill: #5D4037; }
      .content { font: 18px sans-serif; fill: #4E342E; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #795548; }
      .image { stroke: #6D4C41; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mournful</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrnfəl] adj. 悲伤的，哀痛的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mourn (哀悼) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在雨中，"充满哀悼(mourn-ful)"
    <tspan x="50" dy="25">的心情，雨水和泪水交织在一起，形成一幅悲伤的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mournful melody of the violin made everyone feel sad.
  </text>
  <text x="50" y="310" class="content">
    小提琴悲伤的旋律让每个人都感到难过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rain -->
    <line x1="50" y1="20" x2="50" y2="40" class="image" />
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <line x1="150" y1="20" x2="150" y2="40" class="image" />
    <line x1="200" y1="20" x2="200" y2="40" class="image" />
    <line x1="250" y1="20" x2="250" y2="40" class="image" />
    <line x1="300" y1="20" x2="300" y2="40" class="image" />
    <line x1="350" y1="20" x2="350" y2="40" class="image" />
    <line x1="400" y1="20" x2="400" y2="40" class="image" />
    <line x1="450" y1="20" x2="450" y2="40" class="image" />
    <line x1="500" y1="20" x2="500" y2="40" class="image" />
    <line x1="550" y1="20" x2="550" y2="40" class="image" />
    <line x1="600" y1="20" x2="600" y2="40" class="image" />
    <line x1="650" y1="20" x2="650" y2="40" class="image" />
    <line x1="700" y1="20" x2="700" y2="40" class="image" />
    <line x1="750" y1="20" x2="750" y2="40" class="image" />
    <line x1="800" y1="20" x2="800" y2="40" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="160" y2="160" class="image" />
    <line x1="200" y1="140" x2="240" y2="160" class="image" />
    <!-- Tears -->
    <circle cx="190" cy="90" r="5" class="image" />
    <circle cx="210" cy="90" r="5" class="image" />
  </g>
</svg>