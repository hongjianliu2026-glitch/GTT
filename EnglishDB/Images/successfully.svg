<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">successfully</text>
  <text x="50" y="120" class="subtitle">[səkˈsɛsfəli] adv. 成功地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> suc- (下面) + cess (走) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走下坡路时，"充满(ful)"
    <tspan x="50" dy="25">能量，顺利地(ly)走到了终点，这就是成功地(successfully)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She successfully completed the marathon.
  </text>
  <text x="50" y="310" class="content">
    她成功地完成了马拉松。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path representing the downhill -->
    <path d="M0 200 Q100 100 200 200 T400 200" class="image" />
    <!-- Person walking downhill -->
    <circle cx="50" cy="180" r="15" class="image" />
    <line x1="50" y1="195" x2="50" y2="230" class="image" />
    <line x1="50" y1="230" x2="30" y2="260" class="image" />
    <line x1="50" y1="230" x2="70" y2="260" class="image" />
    <line x1="50" y1="210" x2="80" y2="200" class="image" />
    <!-- Flag at the end -->
    <line x1="400" y1="200" x2="400" y2="150" class="image" />
    <polygon points="390,150 410,150 400,130" class="image" />
  </g>
</svg>