<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rebirth</text>
  <text x="50" y="120" class="subtitle">[ˌriˈbɜːrθ] n. 重生，再生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + birth (出生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只凤凰在火焰中燃烧，然后从灰烬中"再次出生(re-birth)"，
    <tspan x="50" dy="25">象征着重生(rebirth)的奇迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company experienced a rebirth after the new CEO took over.
  </text>
  <text x="50" y="310" class="content">
    新CEO上任后，公司经历了一次重生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Phoenix -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="200" x2="50" y2="150" class="image" />
    <line x1="100" y1="200" x2="150" y2="150" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Flames -->
    <polygon points="100,50 70,100 130,100" class="image" />
    <polygon points="100,70 60,120 140,120" class="image" />
    <polygon points="100,90 50,140 150,140" class="image" />
  </g>
</svg>