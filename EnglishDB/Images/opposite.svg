<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">opposite</text>
  <text x="50" y="120" class="subtitle">[ˈɒpəzɪt] adj. 相对的，相反的；n. 对立面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> op- (对面) + pos (放置) + -ite (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站着，"对面放置(op-pos-ite)"
    <tspan x="50" dy="25">的位置，他们就是彼此的对立面(opposite)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The library is on the opposite side of the street.
  </text>
  <text x="50" y="310" class="content">
    图书馆在街道的对面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <!-- Arrows indicating opposite direction -->
    <line x1="100" y1="80" x2="150" y2="30" class="image" />
    <line x1="150" y1="30" x2="200" y2="80" class="image" />
    <line x1="250" y1="80" x2="200" y2="30" class="image" />
    <line x1="200" y1="30" x2="150" y2="80" class="image" />
  </g>
</svg>