<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trading</text>
  <text x="50" y="120" class="subtitle">[ˈtreɪdɪŋ] n. 交易，贸易</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trade (交易) + -ing (进行中的动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个繁忙的市场，人们正在"进行交易(trade-ing)"，
    <tspan x="50" dy="25">买卖各种商品，这就是贸易(trading)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is involved in international trading.
  </text>
  <text x="50" y="310" class="content">
    这家公司从事国际贸易。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Goods -->
    <rect x="50" y="80" width="30" height="30" class="image" />
    <rect x="100" y="80" width="30" height="30" class="image" />
    <rect x="150" y="80" width="30" height="30" class="image" />
    <!-- Money -->
    <line x1="50" y1="120" x2="80" y2="120" class="image" />
    <line x1="100" y1="120" x2="130" y2="120" class="image" />
    <line x1="150" y1="120" x2="180" y2="120" class="image" />
  </g>
</svg>