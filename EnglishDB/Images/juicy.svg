<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">juicy</text>
  <text x="50" y="120" class="subtitle">[ˈdʒuːsi] adj. 多汁的，多水分的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> juc (juice, 汁液) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个多汁的橙子，"汁液(juice)"
    <tspan x="50" dy="25">从果肉中溢出，这就是"多汁的(juicy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The watermelon was so juicy that it dripped down my chin.
  </text>
  <text x="50" y="310" class="content">
    西瓜非常多汁，汁水都滴到了我的下巴上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Orange -->
    <circle cx="100" cy="100" r="60" fill="#FFA500" />
    <!-- Juice dripping -->
    <path d="M 100 160 Q 100 200 150 200" stroke="#FF6347" stroke-width="5" fill="none" />
    <path d="M 100 160 Q 100 200 50 200" stroke="#FF6347" stroke-width="5" fill="none" />
    <!-- Droplets -->
    <circle cx="150" cy="210" r="5" fill="#FF6347" />
    <circle cx="50" cy="210" r="5" fill="#FF6347" />
  </g>
</svg>