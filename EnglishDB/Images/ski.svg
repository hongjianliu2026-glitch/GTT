<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ski</text>
  <text x="50" y="120" class="subtitle">[skiː] n. 滑雪板；v. 滑雪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ski (源自挪威语，意为“雪橇”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在滑雪板上，"滑行(ski)"
    <tspan x="50" dy="25">在雪白的山坡上，享受速度与激情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He loves to ski in the Alps during winter.
  </text>
  <text x="50" y="310" class="content">
    他喜欢在冬天去阿尔卑斯山滑雪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ski -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <!-- Skier -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
  </g>
</svg>