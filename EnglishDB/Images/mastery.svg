<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mastery</text>
  <text x="50" y="120" class="subtitle">[ˈmæstəri] n. 精通，掌握</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> master (主人) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大师(master)站在高高的山巅，
    <tspan x="50" dy="25">手中握着象征精通(mastery)的权杖，</tspan>
    <tspan x="50" dy="25">俯视着脚下的世界，展现出无与伦比的掌控力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His mastery of the violin is unparalleled.
  </text>
  <text x="50" y="310" class="content">
    他对小提琴的精通无人能及。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Master -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Scepter -->
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <circle cx="150" cy="40" r="10" class="image" />
  </g>
</svg>