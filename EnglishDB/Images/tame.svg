<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tame</text>
  <text x="50" y="120" class="subtitle">[teɪm] adj. 驯服的，温顺的；v. 驯服</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tam (来自拉丁语 tam, 意为“温和的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只原本凶猛的狮子，被驯服后变得"温和(tam)"
    <tspan x="50" dy="25">而温顺，就像一只大猫一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion was tamed by the experienced trainer.
  </text>
  <text x="50" y="310" class="content">
    狮子被经验丰富的驯兽师驯服了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="140" x2="20" y2="160" class="image" /> <!-- Front paw -->
    <line x1="50" y1="140" x2="80" y2="160" class="image" /> <!-- Back paw -->
    <line x1="30" y1="110" x2="70" y2="110" class="image" /> <!-- Mouth -->
    <line x1="40" y1="90" x2="50" y2="100" class="image" /> <!-- Left eye -->
    <line x1="60" y1="90" x2="50" y2="100" class="image" /> <!-- Right eye -->
    <!-- Trainer -->
    <circle cx="200" cy="100" r="15" class="image" /> <!-- Head -->
    <line x1="200" y1="115" x2="200" y2="150" class="image" /> <!-- Body -->
    <line x1="200" y1="150" x2="180" y2="180" class="image" /> <!-- Left arm -->
    <line x1="200" y1="150" x2="220" y2="180" class="image" /> <!-- Right arm -->
    <line x1="200" y1="150" x2="170" y2="200" class="image" /> <!-- Left leg -->
    <line x1="200" y1="150" x2="230" y2="200" class="image" /> <!-- Right leg -->
    <line x1="190" y1="125" x2="210" y2="125" class="image" /> <!-- Smile -->
    <line x1="195" y1="110" x2="200" y2="115" class="image" /> <!-- Left eye -->
    <line x1="205" y1="110" x2="200" y2="115" class="image" /> <!-- Right eye -->
    <!-- Leash -->
    <line x1="220" y1="150" x2="80" y2="150" class="image" />
  </g>
</svg>