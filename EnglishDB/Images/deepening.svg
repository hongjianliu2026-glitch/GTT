<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deepening</text>
  <text x="50" y="120" class="subtitle">[ˈdiːpənɪŋ] n. 加深，深化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> deep (深) + -en (使动) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个洞穴，随着时间的推移，"使(en)"
    <tspan x="50" dy="25">变得更深(deep)，这就是加深(deepening)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The deepening of the river caused flooding.
  </text>
  <text x="50" y="310" class="content">
    河流的加深导致了洪水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cave entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Deepening cave -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Deeper cave -->
    <rect x="100" y="40" width="150" height="120" class="image" />
    <!-- Even deeper cave -->
    <rect x="150" y="60" width="50" height="80" class="image" />
    <!-- Sunlight -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="10" x2="350" y2="10" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
  </g>
</svg>